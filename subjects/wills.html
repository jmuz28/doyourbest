er was void from the outset. All other options are therefore incorrect."}, {"ch": 5, "n": 6, "sc": ["A woman owns her home with her brother as beneficial joint tenants. Her will leaves 'my share of my home' to her daughter. She dies, survived by her brother and daughter."], "st": "Who owns the home?", "o": ["The brother and daughter as tenants in common.", "The woman's estate, until the daughter obtains a grant.", "The brother and daughter as joint tenants.", "The daughter, under the will.", "The brother, by survivorship."], "a": "E", "x": ["Wrong. There was no severance before death.", "Wrong. The interest does not fall into the estate.", "Wrong. The daughter takes nothing.", "Wrong. The gift in the will has no effect.", "Correct. An interest under a beneficial joint tenancy passes by survivorship and cannot be left by will."]}, {"ch": 5, "n": 7, "sc": ["A man takes out a life insurance policy for £200,000 for his own benefit. He does not write it into trust and makes no nomination. He dies leaving a will giving his residue to his partner."], "st": "What happens to the policy proceeds?", "o": ["They pass directly to the partner outside the estate.", "They are retained by the insurer.", "They are paid to the PRs and fall into the estate, passing under the will.", "They pass on intestacy.", "They are paid to the man's next of kin."], "a": "C", "x": ["Wrong. Only policies written into trust pass outside the estate.", "Wrong. The insurer must pay the PRs.", "Correct. A policy not written into trust is paid to the PRs and forms part of the estate.", "Wrong. There is a valid will dealing with residue.", "Wrong. Next of kin have no special right to the proceeds."]}, {"ch": 5, "n": 8, "sc": ["Two sisters own a flat as beneficial joint tenants. One sister serves a written notice of severance on the other. Six months later she dies, leaving a will giving all her property to her son."], "st": "What happens to her interest in the flat?", "o": ["The notice of severance is ineffective without the other sister's consent.", "Her half share passes under her will to her son, because the joint tenancy was severed.", "It passes on intestacy.", "It is divided equally between the surviving sister and the son.", "It passes to the surviving sister by survivorship."], "a": "B", "x": ["Wrong. A written notice can sever unilaterally.", "Correct. After severance, each sister holds a share as tenant in common which can pass by will.", "Wrong. There is a valid will.", "Wrong. The son takes her whole share.", "Wrong. Severance converted the joint tenancy into a tenancy in common."]}, {"ch": 5, "n": 9, "sc": ["An elderly man, knowing that he is about to undergo very risky surgery, gives his niece his car keys and logbook, saying 'The car is yours if I don't come through this.' He dies during the operation."], "st": "Who owns the car?", "o": ["The man's residuary beneficiary.", "The niece, under a valid donatio mortis causa.", "The niece, but only if the PRs consent.", "The man's estate, because no will was made.", "Nobody, until probate is granted."], "a": "B", "x": ["Wrong. The car does not fall into residue.", "Correct. The gift was made in contemplation of imminent death, conditional on death, with delivery of the means of control.", "Wrong. PRs' consent is not required.", "Wrong. A donatio mortis causa passes outside the estate.", "Wrong. A completed donatio mortis causa does not depend on the grant."]}, {"ch": 5, "n": 10, "sc": ["Before her death, a woman held shares as nominee for her son, who provided the money to buy them. The shares are registered in her name."], "st": "Do the shares form part of her estate for succession purposes?", "o": ["No, because she held them as bare trustee for her son.", "Yes, but the son can claim under the Inheritance Act.", "Yes, because they are registered in her name.", "No, but they pass under the intestacy rules.", "Yes, unless she left a will."], "a": "A", "x": ["Correct. Property held as bare trustee belongs beneficially to the beneficiary and does not fall into the deceased's estate for succession purposes.", "Wrong. No Inheritance Act claim is needed.", "Wrong. Legal title alone does not make them part of her beneficial estate.", "Wrong. They do not pass under the intestacy rules.", "Wrong. A will cannot dispose of property held on trust for another."]}, {"ch": 6, "n": 1, "sc": ["A client seeks advice from a solicitor on the 2018 will of their uncle. The will leaves half of the estate to the uncle's live-in carer and the remainder to an animal charity. The client is not a beneficiary under the 2018 will but was a beneficiary under the uncle's previous will made in 2012. The 2018 will contained a revocation clause. The client strongly believes that the uncle did not have testamentary capacity at the time of the 2018 will. The live-in carer was also appointed executor of the will and has now applied for a grant of probate. The client entered a caveat and the caveat has now been warned."], "st": "Which of the following is the best advice that the solicitor should give to the client?", "o": ["The client cannot enter an appearance to the warning because the client is not a beneficiary under the 2018 will.", "The client can enter an appearance to the warning because the live-in carer is not entitled to act as an executor.", "The client cannot enter an appearance to the warning because the client has no evidence that the uncle lacked testamentary capacity.", "The client can enter an appearance to the warning because the client has an interest under the revoked 2012 will.", "The client should not have entered a caveat in the first place and should apply to vacate it."], "a": "D", "bx": "The correct answer was D. The client's interest under the 2012 will, which would be revived if it were to turn out that the 2018 will was made without testamentary capacity, is a contrary interest to the applicant executor. There is no requirement that a caveator should have an interest under the existing will, so A is incorrect. B is incorrect because there is no information within the question that would lead us to believe that the applicant cannot act as an executor: if the will is valid, the appointment of the live-in carer is also valid. C is incorrect because evidence of incapacity would not be required until the matter was fully considered by the court. E is incorrect because the situation - in which the caveator believes that there are good reasons why the will should not be admitted to probate - is suitable for the caveat procedure."}, {"ch": 6, "n": 2, "sc": ["When a woman's will was found after her death, it contained five handwritten alterations. The first and second alterations were initialled by the woman testator herself and by the two witnesses to her will. The third and fourth alterations were initialled only by the testator. The fifth alteration was not initialled at all.", "At the request of the probate registry, one of the attesting witnesses filed an affidavit in which he recalled that the fourth alteration had in fact been made prior to the execution of the will. He remembered discussion about that alteration between the testator and another person present before the will was signed. However, he had no recollection of any of the other alterations at all."], "st": "Which of the alterations will be admitted to probate?", "o": ["The first, second and fourth alterations only.", "The first, second, third and fourth alterations only.", "The first and second alterations only.", "The first and third alterations only.", "The first and fourth alterations only."], "a": "A", "bx": "The correct answer was A. As the first and second alterations were properly initialled and witnessed, the presumption that they were added after execution is displaced. Although the fourth alteration was not witnessed, the witness can give clear evidence that it was made prior to execution of the will and it will therefore be accepted by the probate registry. The witness cannot give any such evidence about the third alteration (therefore B, D and E are incorrect). C is incorrect because it does not include the fourth alteration, which the attesting witness can now verify by affidavit."}, {"ch": 6, "n": 3, "sc": ["The executors of an estate need to pay an inheritance tax bill of £45,000 in order to obtain a grant of probate. The deceased had an account with an overseas bank which has no branches in the UK and is not a member of the Direct Payment Scheme, and a UK bank account containing £22,500. The will names two beneficiaries: the deceased's 74-year-old stepmother and his infant cousin, aged six years. The deceased had written his life policy into a trust in favour of his stepmother, and the insurer has paid the sum of £50,000 directly into the stepmother's UK bank account."], "st": "Which of the following options cannot be used by the personal representatives to pay inheritance tax due on the estate?", "o": ["A personal loan from the mother of the infant beneficiary.", "A direct payment arrangement from the overseas bank.", "50% of the amount by a direct payment arrangement with a UK bank and 50% as a loan from the adult beneficiary.", "A loan arrangement with the overseas bank.", "A personal loan from the deceased's stepmother."], "a": "B", "bx": "The correct answer was B. The only one of these arrangements which is not permissible is a direct payment arrangement with the overseas bank which has no UK presence. The Direct Payment Scheme applies only to UK banks named within the scheme and not to foreign banks. They would, however, be able to make a loan arrangement with such a bank, so D is therefore incorrect. A is incorrect as it is possible for the parent of an infant beneficiary to make a personal loan to the estate in order to progress probate; there is in fact no restriction on the category of person who can lend, though clearly for practical purposes it is likely to be a person with an interest in getting on with probate. The stepmother is certainly one such person, and she could make a personal loan to the estate, therefore E is wrong. It is also possible to 'top up' the tax payment with a personal loan from a beneficiary if there are insufficient liquid assets in the bank accounts, therefore C is incorrect."}, {"ch": 6, "n": 4, "sc": ["A solicitor is acting as an executor for three separate estates. In the first estate, the deceased's main home was in Scotland ('the Scottish estate') and the estate has a net value of £350,000. In the second estate, the deceased's main home was in France ('the French estate') and the gross value of the estate is £450,000. In the third estate, the deceased's main home was in Northern Ireland ('the Northern Irish estate') and the estate has a gross value of £250,000. The relevant IHT threshold in all cases is £325,000."], "st": "Which of the following estates is/are excepted estates?", "o": ["The Northern Irish estate and the Scottish estate only.", "The Northern Irish estate only.", "The Scottish estate and the French estate only.", "The Scottish estate only.", "The Northern Irish estate and the French estate only."], "a": "B", "bx": "The correct answer was B. The main home of the deceased must be in the UK, which includes both Scotland and Northern Ireland, but of course excludes France, so neither C nor E can be correct. The gross value of the estate must not exceed £325,000. The net value of the Scottish estate is £350,000 so the gross value must exceed that amount: A, C and D cannot be correct."}, {"ch": 6, "n": 5, "sc": ["A testatrix appointed two executors of her will. The first executor predeceased the testatrix. The second executor has developed dementia and no longer has sufficient mental capacity to act as executor. There are no provisions in the will for any substitute executors. The will includes some bequests to minors."], "st": "Which of the following correctly describes the legal position in the case?", "o": ["As there are no executors able or willing to act, a total intestacy has resulted.", "As there are no executors able or willing to act, an application must be made for a grant of letters of administration with the will annexed.", "As there are no executors able or willing to act, the beneficiaries must meet and choose new executors.", "As there are no executors able or willing to act, the official solicitor must apply for a grant of probate.", "Although there are no executors able or willing to act, the principal beneficiary under the will is entitled to apply for a grant of probate."], "a": "B", "bx": "The correct answer was B. Where there is a valid will but no able or willing executors, an application must be made for a grant of letters of administration with the will annexed. A is incorrect because the lack of executors does not affect the validity of the will and does not cause intestacy. C is incorrect because the beneficiaries do not have the power to choose new executors. D is incorrect because the official solicitor will not be involved in applying for a grant of administration unless there is no person at all within the intestacy rules who can apply for administration; we are not told that this is the case here. E is incorrect for the same reasons as C. No matter how much any beneficiary receives from the estate - even if the beneficiary receives 100% of the estate - there is no automatic entitlement to act as executor (though the beneficiary could of course apply for a grant of administration)."}, {"ch": 6, "n": 6, "sc": ["A man dies intestate. His daughter wishes to deal with his estate."], "st": "Which grant should she apply for?", "o": ["A grant of probate.", "No grant is needed for intestate estates.", "A grant of letters of administration.", "A grant of letters of administration with the will annexed.", "A grant of probate with power reserved."], "a": "C", "x": ["Wrong. Probate is granted to executors under a will.", "Wrong. A grant is generally needed to deal with the estate.", "Correct. On intestacy, the appropriate grant is letters of administration.", "Wrong. This grant is used where there is a will but no proving executor.", "Wrong. Power reserved relates to executors."]}, {"ch": 6, "n": 7, "sc": ["A beneficiary under an earlier will enters a caveat to prevent a grant being issued."], "st": "For how long does a caveat remain in force unless extended?", "o": ["Until the grant is issued.", "One month.", "Indefinitely.", "Six months.", "One year."], "a": "D", "x": ["Wrong. Its purpose is to prevent the grant.", "Wrong. A caveat lasts longer than one month.", "Wrong. It expires unless extended.", "Correct. A caveat remains in force for six months and can be extended.", "Wrong. The period is six months."]}, {"ch": 6, "n": 8, "sc": ["The executors of an estate must pay IHT before obtaining a grant. The estate includes a house and an investment portfolio."], "st": "Which statement about paying the IHT is correct?", "o": ["IHT is paid by the beneficiaries after the grant.", "All IHT must always be paid in a single sum before the grant.", "IHT on the house may be paid in ten annual instalments, so only the first instalment need be paid before the grant.", "IHT on the investment portfolio may be paid by instalments.", "No IHT is due until the estate is distributed."], "a": "C", "x": ["Wrong. The PRs are responsible for paying IHT on the estate.", "Wrong. There is an instalment option for certain property.", "Correct. IHT on land can be paid by instalments over ten years.", "Wrong. Listed investments do not qualify for the instalment option.", "Wrong. IHT must generally be paid before the grant."]}, {"ch": 6, "n": 9, "sc": ["A will names no executor. The testator's residuary beneficiary wishes to apply for a grant."], "st": "Which grant and which NCPR rule apply?", "o": ["Letters of administration with the will annexed under Rule 22.", "Letters of administration with the will annexed under Rule 20.", "Probate under Rule 20.", "Probate under Rule 22.", "Letters of administration under Rule 22."], "a": "B", "x": ["Wrong. Rule 20, not Rule 22, governs where there is a will.", "Correct. Where there is a will but no executor, the grant is letters of administration with the will annexed, and Rule 20 sets the order of priority.", "Wrong. Probate is only for executors.", "Wrong. Probate is only for executors.", "Wrong. Rule 22 governs intestacy."]}, {"ch": 6, "n": 10, "sc": ["A will is properly signed and witnessed but contains no attestation clause."], "st": "What will the probate registry require?", "o": ["The will cannot be admitted to probate.", "A court order declaring the will valid.", "A fresh will signed by the executors.", "Nothing; the will is admitted without further evidence.", "Affidavit evidence of due execution, usually from one of the witnesses."], "a": "E", "x": ["Wrong. The will can be admitted once due execution is proved.", "Wrong. A court order is not normally needed.", "Wrong. Executors cannot remake a will.", "Wrong. Without an attestation clause, there is no presumption of due execution.", "Correct. Under NCPR r 12, the registrar will require evidence of due execution, such as an affidavit from a witness."]}, {"ch": 7, "n": 1, "sc": ["A man was appointed as an administrator of an intestate estate. The estate included a valuable antique wristwatch worth £50,000. The man failed to make arrangements for storing the watch correctly and it sustained damage which reduced its value to £25,000. The man then delayed selling the watch for a further two years, by which time its market value had dropped to £20,000.", "In the meantime, the man fulfilled a contract for the supply of goods at the price of £40,000 which the deceased (a sole trader) had signed shortly before he died, but made an unauthorised personal commission of £12,500 for himself in the process. However, the man also negotiated to reduce the sale price from £40,000 to £35,000. Finally, the man neglected to pursue a debtor of the deceased until the debt was no longer legally enforceable."], "st": "Which of the man's actions was not an act of waste?", "o": ["Causing damage to the wristwatch by failing to store it adequately.", "Making an unauthorised personal commission out of estate assets.", "Delaying the sale of an estate asset until the value of the asset had been reduced by £5,000.", "Negotiating to reduce the sale price of the goods supplied under the contract.", "Failing to collect the money under the debt."], "a": "B", "bx": "The correct answer was B. It is possible for a PR to make a personal profit out of estate assets without causing any loss or damage to the assets themselves. If no loss or damage is caused, then the default is not a devastavit. As the other options all involve mismanagement of the estate causing loss to all beneficiaries, they are all examples of devastavit. B, however, is an example of a breach of fiduciary duty, not an act of waste, and the PR would be liable to account to the estate and the beneficiaries for any unauthorised profit."}, {"ch": 7, "n": 2, "sc": ["A woman ran a computer consultancy business as a sole trader. The woman had two revenue streams: one was providing her services as a programmer and consultant to businesses seeking advice on banking software; the other was the supply of mainframe computers and their associated hardware. The woman died intestate. Letters of administration were granted to the woman's husband as PR.", "At the time of the woman's death, she had two contracts which she was due to fulfil the following month. The first was to work in-house at a city of London bank as a consultant and advisor on the bank's current banking software ('the consultancy work'). The second was to deliver a mainframe computer to a bank in Paris. The woman had ordered the computer hardware and had paid a deposit for it at the time of her death, but still had to pay the balance and arrange for the transportation of the computer to the Paris client.", "The PR has no knowledge of, or expertise in, computing or finance. There is not enough money in the estate to pay the balance due on the computer."], "st": "Which of the following best describes the PR's position?", "o": ["The PR must not involve himself in the business at all as the business does not fall into the estate and therefore this would be intermeddling.", "The PR does not have to perform either contract because both contracts ended automatically with the woman's death.", "The PR does not have to pay the balance due on the computer, or deliver it to the client, because there is not enough money in the estate to do so.", "The PR must arrange for the consultancy work to be done by a third party because this contract did not end with the woman's death.", "The PR must pay the balance due on the computer and deliver it to the Paris client, but does not have to arrange for the consultancy work to be done."], "a": "E", "bx": "The correct answer was E. The contract to carry out the consultancy work was a contract for personal services, so it automatically came to an end on the woman's death; the contract to deliver the mainframe computer was not, and did not. A is incorrect because the woman was a sole trader and therefore her business did fall into the estate. B is incorrect because although the consultancy contract came to an end, the supply contract did not. C is incorrect because the PR should pay the balance out of his own pocket and then claim an indemnity from the estate; this would be available from the profits made as a result of the supply contract. D is incorrect because the personal services contract came to an end on the woman's death."}, {"ch": 7, "n": 3, "sc": ["Three beneficiaries under a will have asked for advice about whether they have a claim against the executors. The residuary estate under the will contained a portfolio of shares in a private company which is held by the executors as trustees and which gives the trust a controlling interest in the company. The trust is for the benefit of one of the beneficiaries for life, then the remainder to be divided equally between the two remaining beneficiaries.", "The executors used the voting rights attached to the shares to be appointed as managing director and financial director respectively of the company, telling the beneficiaries that they had done this in order to manage the company for the benefit of the estate. The shares have doubled in value since the executors were appointed as directors. The executors themselves have each received a salary for acting as directors of the company."], "st": "Which of the following is the best advice that can be given to the beneficiaries?", "o": ["The executors have committed a devastavit in that they have caused loss and damage to the estate for which they are personally liable.", "The executors are in breach of their duty of care in that they have not diversified the estate's investment in the shares.", "The executors are in breach of the fiduciary duty to the beneficiaries in that they have made an unauthorised profit.", "The executors are in breach of their duty of care in that they have failed to get in the assets of the estate in a reasonable time.", "The executors are not in breach of any duty."], "a": "C", "bx": "The correct answer was C. The executors have obtained a profit by virtue of their position as executors. As fiduciaries, they must avoid conflicts of interest and in particular must avoid making unauthorised profits. The executors have not caused any loss or damage to the estate, whether as administrators or trustees - on the contrary, they have doubled the value of the estate's interest. For that reason, A is incorrect. We are not told what the total investment portfolio is, but we are told that it includes the shares in the private company and not that it is composed entirely of those shares; there does not therefore seem to be a diversification problem and B would appear to be incorrect. The duty to get the estate in within a reasonable time does not apply to the assets in a will trust (see Chapter 11), which continues (in this case) for the life of the life tenant, so D is incorrect. E cannot be correct because there clearly is a breach of a fiduciary duty."}, {"ch": 7, "n": 4, "sc": ["Two executors of a will have sought advice from a solicitor. The executors need to apply the assets of the estate to pay off the total liabilities of the estate, which amount to £43,000. There is no residuary gift in the will."], "st": "Which of the following assets must the executors use first to pay the debts?", "o": ["A bequest of an investment portfolio valued at £60,000 'subject to the payment of all of my debts and funeral and testamentary expenses'.", "The sum of £75,000 which the executors have set aside to pay all of the specific pecuniary legacies.", "A specific devise of a 100-year lease in a commercial property.", "A failed pecuniary legacy of £40,000 to the deceased's brother, who died two years before the deceased.", "The sum of £35,000 which the deceased specifically set aside in the will for payment of all debts and other liabilities of the estate."], "a": "D", "bx": "The correct answer was D. This is because when paying debts, failed gifts come out of the estate first (see Table 8.1). You will note that this would not be quite enough to pay off all the debts, and a balance of £3,000 would have to come from the second item in line, which (as there is no residue in this case) would be money specifically set aside for payment of debts (E). Although this would in fact fully pay off the debt, the next item would be property charged with payment of debts (A), then sums set aside to pay pecuniary legacies (B), followed by the specific devise of land (C), which is the lowest on the list."}, {"ch": 7, "n": 5, "sc": ["Under her will, an aunt left a sum of £10,000 to each of her nieces. She also left a collection of antique jewellery which forms part of the residue. This jewellery collection includes a diamond ring which has been valued at £2,500. Both of the nieces have asked the executors if they can have the diamond ring as part of their legacy under the will. There is only one diamond ring. The first niece requested the ring from the executors three weeks before the second niece. The second niece says that her aunt repeatedly told her that she could have the ring when the aunt died. The will contains a clause which varies the statutory power of appropriation to dispense with any obligation on the part of the executors to obtain the consent of the beneficiaries."], "st": "Which of the following options best sets out the executors' position?", "o": ["The executors have no power to give the ring to either the first niece or the second niece because their legacies are pecuniary only.", "The executors have no power to give the ring to either the first niece or the second niece because the agreement of both nieces is required for a gift of the ring.", "The executors must give the ring to the first niece as she requested the ring earlier than the second niece.", "The executors must give the ring to the second niece because it was promised to her by her aunt.", "The executors have the power to give the ring to either niece or to neither of them."], "a": "E", "bx": "The correct answer was E. This is because the executors always have a power to appropriate a part of the estate in satisfaction or part satisfaction of a legacy (A is therefore incorrect in principle). The statutory power requires the executors to obtain the consent of all beneficiaries, but that requirement has been dispensed with under the will, so agreement of both the nieces is not required (therefore B is incorrect). The timing of the requests, or the fact that there was some informal discussion about the ring by the deceased before death, does not oblige the executors to exercise their power of appropriation one way or the other (therefore C and D are incorrect)."}, {"ch": 7, "n": 6, "sc": ["An executor wants protection against claims from unknown beneficiaries or creditors before distributing the estate."], "st": "What should the executor do?", "o": ["Pay all estate money into court.", "Distribute immediately; executors are never liable to unknown claimants.", "Wait for six years before distributing.", "Advertise under s 27 of the Trustee Act 1925 and wait for the notice period to expire before distributing.", "Obtain the beneficiaries' signatures on a release."], "a": "D", "x": ["Wrong. This is not usually necessary.", "Wrong. Executors may be personally liable if they distribute without protection.", "Wrong. There is no such rule.", "Correct. Statutory advertisements under s 27 protect PRs who distribute after the notice period expires.", "Wrong. A release from known beneficiaries does not protect against unknown claimants."]}, {"ch": 7, "n": 7, "sc": ["A will leaves a share of residue to the testator's son, who has not been heard of for 15 years. The PRs cannot trace him."], "st": "Which order may the PRs seek from the court to allow distribution?", "o": ["A grant ad colligenda bona.", "A Benjamin order, permitting distribution on the basis that the son has died.", "A Beddoe order.", "A citation to accept or refuse a grant.", "A caveat."], "a": "B", "x": ["Wrong. This is a limited grant to collect and preserve assets.", "Correct. A Benjamin order permits PRs to distribute on the footing that a missing beneficiary has predeceased.", "Wrong. A Beddoe order concerns trustees' litigation costs.", "Wrong. A citation concerns persons entitled to a grant.", "Wrong. A caveat prevents the issue of a grant."]}, {"ch": 7, "n": 8, "sc": ["A residuary beneficiary demands her share six months after the testator's death. The PRs are still collecting assets."], "st": "What is the position?", "o": ["The beneficiary can sue the PRs for delay.", "The PRs cannot distribute until five years after the death.", "The PRs must distribute immediately on demand.", "The PRs are not bound to distribute before the end of a year from the death.", "The PRs must distribute within six months of the grant."], "a": "D", "x": ["Wrong. Taking a reasonable time within the executor's year is not actionable delay.", "Wrong. There is no such rule.", "Wrong. There is no immediate obligation.", "Correct. Section 44 of the AEA 1925 provides that PRs are not bound to distribute before the end of the 'executor's year'.", "Wrong. There is no six-month rule."]}, {"ch": 7, "n": 9, "sc": ["After debts are paid, an estate has £30,000 available for general pecuniary legacies. The will leaves £20,000 to A and £20,000 to B."], "st": "How will the legacies be paid?", "o": ["A and B each receive £20,000 out of specific gifts.", "Neither receives anything.", "The PRs choose how to divide the money.", "A and B each receive £15,000.", "A receives £20,000 and B £10,000."], "a": "D", "x": ["Wrong. Specific gifts are only used after general legacies have abated.", "Wrong. There are funds available.", "Wrong. Abatement follows fixed rules.", "Correct. General legacies abate proportionately when there are insufficient funds.", "Wrong. There is no priority by order in the will."]}, {"ch": 7, "n": 10, "sc": ["PRs are transferring a house from the estate to the beneficiary entitled to it under the will."], "st": "What is required to vest the legal estate in the beneficiary?", "o": ["An oral assent.", "A deed of gift signed by the beneficiary.", "A written assent signed by the PRs.", "A court order.", "No step is needed; title passes automatically on death."], "a": "C", "x": ["Wrong. An assent of a legal estate in land must be in writing.", "Wrong. The beneficiary does not make the gift.", "Correct. Under s 36 of the AEA 1925, an assent of a legal estate in land must be in writing and signed by the PRs.", "Wrong. A court order is not required.", "Wrong. Title vests in the PRs on death and must be transferred."]}, {"ch": 8, "n": 1, "sc": ["A client seeks advice about the estate of his deceased civil partner. They lived a modest lifestyle together, taking only one holiday per year and driving a second-hand saloon car. The client believed that his civil partner's estate was worth no more than £250,000. The client has now discovered that the estate is worth more than £3 million. The civil partner left a will which made no provision at all for the client and left all of his estate to a distant relative. In the last year of his life, the client's civil partner left the matrimonial home and commenced proceedings to dissolve the civil partnership. There was no decree of dissolution by the time the client's civil partner died."], "st": "Which of the following best describes the claim which can be made by the client under the Inheritance (Provision for Family and Dependants) Act 1975?", "o": ["The client can make a claim with a starting point of £1.5 million.", "The client cannot make a claim because dissolution proceedings had been commenced.", "The client can make a claim with a starting point of £125,000.", "The client can only claim an amount which will allow him to continue to live his current modest lifestyle.", "The client cannot make a claim because he was not living with his civil partner at the time of the civil partner's death."], "a": "A", "bx": "The correct answer was A. These two parties were in a civil partnership and the client therefore has standing to make the claim under the 1975 Act. The correct standard of financial provision is the spousal standard, which expressly refers to what the client would have expected to receive on dissolution of the civil partnership. The starting point would be 50% or £1.5 million. The fact that dissolution proceedings have been commenced does not remove the client's standing: only a decree of dissolution would do so (therefore B is wrong). The fact that the client mistakenly believed that the estate was worth only £250,000 is not relevant, so C is wrong. D is incorrect because it refers to the wrong standard of provision: spouses are not limited to the maintenance standard. E applies only to cohabitees: where the parties are married or living in a civil partnership, it is not relevant whether they were cohabiting at the time of death."}, {"ch": 8, "n": 2, "sc": ["A father fell ill and persuaded his adult daughter to give up her university studies to look after him. The daughter gave up her studies without graduating and became her father's full-time carer for over five years. The daughter later became romantically involved with a man to whom she became engaged, though she continued to live with her father and care for him. The father demanded that the daughter should terminate the relationship and break off her engagement, but the daughter refused to do this.", "The father then revoked his existing will, which left all of his estate to his daughter, and wrote a valid new will leaving all of his estate to a local charity. When the father died, his daughter received nothing from his estate but did receive the sum of £10,000 from a life insurance policy that he had forgotten to cancel.", "After the father's death, his daughter was homeless and, because she had not studied or been employed, could only obtain minimum-wage employment. The daughter now seeks advice."], "st": "Which of the following best describes the daughter's current legal position under the Inheritance (Provision for Family and Dependants) Act 1975 ('the Act')?", "o": ["The daughter cannot make a claim under the Act because her father intentionally disinherited her.", "The daughter can make a claim under the Act because her father intentionally disinherited her.", "The daughter cannot make a claim under the Act because she received £10,000 from the estate.", "The daughter can make a claim under the Act because the distribution of her father's estate is not fair to her.", "The daughter can make a claim under the Act because the father's estate has not made reasonable provision for her."], "a": "E", "bx": "The correct answer was E. A and B are wrong because the question is not whether the father intentionally disinherited his daughter; it is whether the result of that disinheritance caused unreasonable financial provision. C is wrong because the £10,000 did not come from the father's estate - it came from an asset which was never part of the estate. Although all of these answers are incorrect, it is D that you should be most aware of and avoid. The question in an Inheritance Act case is never whether the distribution of the estate is 'fair'. It is whether or not the distribution of the estate has made 'reasonable financial provision' for this applicant, which is why E is, in this case, the correct answer."}, {"ch": 8, "n": 3, "sc": ["A sister gave up her job in November 2019 to care full-time for her elderly brother, moving in with him in order to do so. For the next three years, the brother paid his sister a monthly sum which was slightly lower than the market rate for care services and did not charge her any rent for living at his property. Although the sister retained her own property, she had lived with the brother for a period of three years by the time that he died. The brother died intestate in November 2022. He was survived by his sister and his daughter."], "st": "Which of the following best describes the woman's legal position after the brother's death?", "o": ["The sister has standing to make an application under s 1(1)(e) of the Inheritance (Provision for Family and Dependants) Act 1975 as she was being maintained by her brother immediately before his death.", "The sister has standing to make an application under s 1(1)(ba) of the Inheritance (Provision for Family and Dependants) Act 1975 as she lived in the same household as her brother for a period of two years preceding his death.", "The sister has standing to make an application under both s 1(1)(e) and s 1(1)(ba) of the Inheritance (Provision for Family and Dependants) Act 1975 as she lived in the same household as her brother for a period of two years preceding his death and was also being maintained by her brother immediately before his death.", "The sister has no standing to make an application under the Inheritance (Provision for Family and Dependants) Act 1975 and no rights of inheritance in intestacy.", "The sister will inherit the brother's estate by reason of s 46(1) Administration of Estates Act 1925."], "a": "D", "bx": "The correct answer was D. A is incorrect because although the brother paid the sister a monthly sum, she was giving full valuable consideration for it in the form of her caring services. B is incorrect because even though the siblings were arguably living in the same household, they were not doing so as a married couple or civil partners. As these two options are incorrect, then C must also be incorrect. E is incorrect because the brother left a child, namely his daughter, who will inherit all of the estate on his intestacy."}, {"ch": 8, "n": 4, "sc": ["A woman died intestate, leaving an estate worth £54,000, all of it cash deposited in a building society account. The one person entitled on her intestacy was her daughter. The woman had, however, financially maintained her seriously ill sister, who therefore had standing to make a claim under the Inheritance (Provision for Family and Dependants) Act 1975. Upon the woman's death, the proceeds of a life insurance policy, which she had written into trust and forgotten about, amounting to £150,000, were paid out to the woman's ex-husband, who had been the named beneficiary on the policy."], "st": "Which of the following statements best describes the sister's position?", "o": ["The sister cannot make a claim on any of the money because the woman died intestate.", "The sister can make a claim on both the £54,000 and the £150,000 on the basis that the £150,000 was paid to the ex-husband by mistake.", "The sister can make a claim only on the £150,000 on the basis that the estate did not make reasonable provision for her.", "The sister can make a claim only on the £54,000 on the basis that the estate did not make reasonable provision for her.", "The sister can make a claim on both the £54,000 and the £150,000 on the basis that the estate did not make reasonable provision for her."], "a": "D", "bx": "The correct answer was D. Remember that Inheritance Act claims can only be made on the deceased's estate. The insurance policy proceeds were paid directly to the ex-husband as the named beneficiary. Any option which says that the sister can make a claim against the £150,000 (B, C or E) is clearly incorrect. It makes no difference to an Inheritance Act claim whether the woman dies testate or intestate (therefore, A is incorrect). B is further incorrect because it does not matter whether the money was paid 'by mistake' or not: the £150,000 never falls into the estate."}, {"ch": 8, "n": 5, "sc": ["A man died, leaving an estate of £75,000 in cash. He also owned a house as a beneficial joint tenant with his current partner, which passed to that partner on his death. At the man's death, the house was worth £360,000 in total. The partner also received death in service benefits worth £550,000 as the man's named beneficiary under his occupational pension. The man had an infant daughter (from a previous relationship) who had standing to make a claim under the Inheritance (Provision for Family and Dependants) Act 1975."], "st": "Which is the best description of the total amount of the estate against which the infant daughter may make a claim?", "o": ["£75,000.", "£435,000.", "£255,000.", "£805,000.", "£360,000."], "a": "C", "bx": "The correct answer was C. The sum of £255,000 comprises the £75,000 in the estate plus one-half of the value of the property (£180,000). This is a case in which the infant daughter may apply to sever the beneficial joint tenancy under the Inheritance Act and the value of the man's half-share would therefore be included in the estate. A is incorrect because it does not take this into account. B is incorrect because it includes the full value of the property rather than simply the man's share. D is incorrect because it includes the death in service benefit, which was never part of the estate. E is incorrect because it only takes account of the value of the property, half of which cannot come into the estate in any event, and does not include the £75,000 which is definitely within the estate."}, {"ch": 8, "n": 6, "sc": ["A grant of probate is issued on 1 March. An adult child of the deceased wishes to make a claim under the Inheritance (Provision for Family and Dependants) Act 1975."], "st": "By when should the claim normally be made?", "o": ["Within twelve months of the date of death.", "Within six months of the date of death.", "Within six months of the date of the grant, unless the court gives permission to apply later.", "Within three months of the grant.", "At any time before the estate is distributed."], "a": "C", "x": ["Wrong. The period is six months from the grant.", "Wrong. Time runs from the grant, not the death.", "Correct. Under s 4, claims must be made within six months of the grant, unless the court gives permission.", "Wrong. The period is six months.", "Wrong. There is a fixed time limit."]}, {"ch": 8, "n": 7, "sc": ["A man had lived with his partner as if they were married for three years before his death. They were not married. His will leaves her nothing."], "st": "Which standard of provision applies to her claim?", "o": ["The standard of what she would have received on intestacy.", "Half of the estate.", "The maintenance standard.", "No standard, because cohabitees cannot claim.", "The spousal standard."], "a": "C", "x": ["Wrong. Cohabitees have no intestacy entitlement.", "Wrong. There is no fixed share.", "Correct. A cohabitee of at least two years (s 1(1)(ba)) can claim on the maintenance standard.", "Wrong. Cohabitees of two years or more can claim.", "Wrong. The spousal standard is reserved for spouses and civil partners."]}, {"ch": 8, "n": 8, "sc": ["An adult son, who is able-bodied and earns a good salary, receives nothing under his mother's will. He wishes to claim under the Inheritance Act."], "st": "Which statement best describes his position?", "o": ["He cannot claim because he is an adult.", "He can claim as a child of the deceased, but only for reasonable provision for his maintenance, and his claim is likely to be weak.", "He is automatically entitled to a share equal to his siblings.", "He can claim on the spousal standard.", "He can claim only if he lived with his mother."], "a": "B", "x": ["Wrong. Adult children have standing under s 1(1)(c).", "Correct. An adult child can claim but only on the maintenance standard; an able-bodied, well-paid adult is unlikely to succeed.", "Wrong. There is no automatic entitlement.", "Wrong. The spousal standard is for spouses and civil partners.", "Wrong. Living with the deceased is not a requirement for a child."]}, {"ch": 8, "n": 9, "sc": ["In an Inheritance Act claim, the court is deciding whether reasonable provision has been made for the applicant."], "st": "Which of the following is a factor the court must consider under s 3?", "o": ["The applicant's opinion of the other beneficiaries.", "The conduct of the applicant or any other person.", "Whether the will is fair to all the family.", "Whether the testator took legal advice.", "Whether the will was homemade."], "a": "B", "x": ["Wrong. This is not a s 3 factor.", "Correct. Section 3 includes conduct of the applicant or any other person among the factors.", "Wrong. The test is reasonable provision, not fairness.", "Wrong. This is not a s 3 factor.", "Wrong. This is not a s 3 factor."]}, {"ch": 8, "n": 10, "sc": ["The court decides that a deceased's will has not made reasonable provision for his dependant."], "st": "Which of the following can the court order under s 2?", "o": ["That the will is invalid.", "That the will be rewritten by the applicant.", "That the applicant receives the whole estate automatically.", "Periodical payments, a lump sum or a transfer of property to the applicant from the estate.", "That the PRs be removed."], "a": "D", "x": ["Wrong. Inheritance Act claims do not affect validity.", "Wrong. The court makes orders; the applicant does not rewrite the will.", "Wrong. Awards are tailored to reasonable provision.", "Correct. Section 2(1)(a)-(c) allows periodical payments, a lump sum or a transfer of property.", "Wrong. Removal of PRs is not an Inheritance Act remedy."]}, {"ch": 9, "n": 1, "sc": ["A businesswoman made a payment of £5,000 to her son to pay part of his living expenses while at university. She also gifted her old car, worth £10,000, to her sister. On the same day, the businesswoman sold a painting to a business associate for the sum of £4,000, wrongly believing that this was its true value. In fact, the painting was only worth £500. The businesswoman also sold a designer watch to her aunt for £350. The businesswoman knew that the true value of the watch was £3,000."], "st": "Which of the following transactions are transfers for value for IHT purposes?", "o": ["The payment of £5,000 to the businesswoman's son only.", "The payment of £5,000 to the businesswoman's son, the gift of the car to her sister and the sale of the painting.", "The gift of the car to the businesswoman's sister and the sale of the watch to her aunt.", "The payment of £5,000 to the businesswoman's son, the gift of the car to her sister and the sale of the watch to her aunt.", "The gift of the car to the businesswoman's sister and the sale of the painting."], "a": "C", "bx": "The correct answer was C. The gift of the car was a straightforward transfer of a £10,000 value. The sale to the aunt was a sale at an undervalue and represented a transfer for value of £2,650. However, the payment to her son was maintenance, and was therefore not a transfer for value, so A, B and D must be incorrect. The businesswoman did not know that she was selling the painting at below market value, which falls within the 'bad bargain' exception, and means that B and E are also incorrect on this ground."}, {"ch": 9, "n": 2, "sc": ["A man makes three transfers of value to his brother in three tax years. In the first tax year, the man transfers £1,500. In the second tax year, the man transfers £2,000. In the third tax year, the man transfers £500. The man makes no other transfers during this period."], "st": "What is the total amount of annual exemptions available to the man in the third tax year?", "o": ["£3,500.", "£2,500.", "£6,000.", "£5,000.", "The man has no annual exemptions available."], "a": "A", "bx": "The correct answer was A. A taxpayer is permitted an annual exemption of £3,000 in each tax year and can carry forward what remains of the allowance from the previous tax year, but from no earlier tax years. The man had £1,000 remaining from his allowance for the second tax year and a further £2,500 remaining from the third tax year: a total of £3,500. All other options are therefore incorrect."}, {"ch": 9, "n": 3, "sc": ["A young man is going to be married shortly and he and his fiancée are planning to buy a house together. The deposit for the house is £25,000. The young man's father decides to give the young man the £25,000 as a cash gift. The father has already made gifts of over £3,000 to other family members over the past two years so has no annual exemptions available."], "st": "Which of the following statements best describes the IHT liability of this gift?", "o": ["The full gift of £25,000 is exempt from IHT because it is a wedding present.", "The full gift of £25,000 is a PET.", "The first £5,000 of the gift will not be liable for IHT because it is a wedding present, but the balance of £20,000 is an LCT.", "The first £5,000 of the gift will not be liable for IHT because it is a wedding present, but the balance of £20,000 is a PET.", "The full gift of £25,000 is exempt from IHT because it is not a transfer for value."], "a": "D", "bx": "The correct answer was D. Wedding presents are exempt transfers only up to an upper limit of £5,000, so A is incorrect. The first £5,000 of this gift will be exempt, but the balance of £20,000 will be chargeable, so B is incorrect. The transfer is to an individual, so it is not an LCT, and so C is incorrect. This is certainly a transfer for value as it has decreased the value of the father's estate by £25,000, so E is incorrect."}, {"ch": 9, "n": 4, "sc": ["A businessman decided to divest himself of some assets. The businessman was a partner in a public relations consultancy firm and sold his partnership interest to another one of the partners. The businessman also sold a car which was a partnership asset. The businessman then loaned £35,000 to the partnership to assist with cash flow problems arising from his departure. The businessman also decided to sell two shareholdings: 5,000 shares in a business he had bought 18 months ago, and of which he was the sole proprietor, and 10,000 preference shares of a public limited company of which he was the majority shareholder."], "st": "Which of the following transfers attracts business property relief at 100%?", "o": ["The sale of the businessman's partnership interest.", "The sale of the businessman's car.", "The loan of £35,000 made by the businessman to the partnership.", "The sale of 5,000 shares in the private company.", "The sale of 10,000 shares in the public limited company."], "a": "A", "bx": "The correct answer was A. All of the other options either do not attract business property relief (BPR) at all or attract it at only 50%. The car belonged to the partnership; BPR is limited to 50% (therefore B is incorrect). C is not a transfer for value: it is a loan, which will be repaid by the partnership on the terms agreed. It therefore does not fall within the BPR rules. BPR is not available at all to the businessman in D, as it can only apply to sales where the individual concerned has owned the business for at least two years. The businessman in E has control of the plc and can claim only 50% BPR on the sale as the company is quoted."}, {"ch": 9, "n": 5, "sc": ["A man owned a house worth £450,000 as a joint tenant with his cohabitee (he was not married or in a civil partnership). During his lifetime, the man set up a trust by which the proceeds of his life insurance policy would be paid to his cohabitee when he died. The man fell ill, and while he was in hospital, he told his brother that if he did not recover from his illness, he wanted his brother to have his motorcycle. The man also made a gift of £20,000 to his cousin while he was in hospital. Five days after he made the gift to his cousin, the man died."], "st": "Which of the man's assets are included in the death estate for IHT purposes?", "o": ["Only the joint tenancy and the £20,000 gift are included in the death estate for IHT purposes.", "Only the joint tenancy and the life insurance policy are included in the death estate for IHT purposes.", "Only the £20,000 gift, the life insurance policy and the motorcycle are included in the death estate for IHT purposes.", "Only the joint tenancy and the motorcycle are included in the death estate for IHT purposes.", "Only the £20,000 gift and the life insurance policy are included in the death estate for IHT purposes."], "a": "D", "bx": "The correct answer was D. The two items beneficially owned by the man at his death were his interest under the joint tenancy and the motorcycle, which passed to his brother immediately after his death as a donatio mortis causa but which was still owned by him at the time of death. Although usually an interest under a joint tenancy would not fall into the death inheritable estate, it does fall into the death estate for IHT purposes. The man did not own the proceeds of the life insurance policy at the time of his death: his cohabitee was the beneficiary of the trust set up for these. The man also did not own the £20,000, which was fully gifted to the cousin during the man's lifetime before he died (note the difference between this gift and the gift to his brother). Therefore, all other options are incorrect."}, {"ch": 9, "n": 6, "sc": ["A woman gives £100,000 to her nephew. She survives the gift by eight years. She made no other lifetime gifts."], "st": "What is the IHT position on the gift on her death?", "o": ["It is added to her death estate.", "It is chargeable at 20%.", "It is chargeable at 40%.", "It is a PET which has become exempt because she survived seven years.", "Taper relief reduces the tax by 80%."], "a": "D", "x": ["Wrong. An exempt PET is not added to the death estate.", "Wrong. 20% is the lifetime rate for LCTs.", "Wrong. A PET becomes exempt if the donor survives seven years.", "Correct. A gift to an individual is a PET and becomes exempt after seven years.", "Wrong. Taper relief applies to deaths within three to seven years."]}, {"ch": 9, "n": 7, "sc": ["A man makes a PET of £400,000 and dies five years later. The gift exceeds the available nil rate band."], "st": "How does taper relief operate?", "o": ["It does not apply to PETs.", "It reduces the tax payable on the gift.", "It doubles the annual exemption.", "It reduces the nil rate band.", "It reduces the value of the gift."], "a": "B", "x": ["Wrong. Taper relief applies to failed PETs and LCTs where tax is payable.", "Correct. Taper relief reduces the tax on a failed PET where death occurs between three and seven years after the gift.", "Wrong. There is no such rule.", "Wrong. The nil rate band is unaffected.", "Wrong. Taper relief reduces the tax, not the value transferred."]}, {"ch": 9, "n": 8, "sc": ["A man leaves his entire estate of £2 million to his wife. Both have always lived in the UK."], "st": "How much IHT is payable on his death?", "o": ["36% because of the size of the estate.", "40% on the amount above £325,000.", "None, because the transfer is covered by the spouse exemption.", "40% on the amount above £500,000.", "20% on the whole estate."], "a": "C", "x": ["Wrong. The 36% rate applies where at least 10% of the net estate goes to charity.", "Wrong. The spouse exemption removes the charge.", "Correct. Transfers between spouses or civil partners are exempt, without limit where both are UK resident.", "Wrong. The spouse exemption removes the charge.", "Wrong. There is no such charge."]}, {"ch": 9, "n": 9, "sc": ["A widow leaves her home, worth £400,000, to her two children. Her estate is well below the taper threshold for the residence nil rate band."], "st": "Which allowance, in addition to the nil rate band, may be available?", "o": ["The residence nil rate band, because the home is left to direct descendants.", "Business property relief.", "No further allowance.", "The small gifts exemption.", "The annual exemption."], "a": "A", "x": ["Correct. The residence nil rate band (£175,000) applies where a qualifying residence passes to direct descendants.", "Wrong. A home is not business property.", "Wrong. The residence nil rate band may apply.", "Wrong. The small gifts exemption applies to lifetime gifts of up to £250.", "Wrong. The annual exemption applies to lifetime gifts."]}, {"ch": 9, "n": 10, "sc": ["A grandmother gives £250 to each of her ten grandchildren at Christmas. She makes no other gifts to them in the tax year."], "st": "What is the IHT position?", "o": ["The gifts use up her annual exemption.", "Each gift is exempt under the small gifts exemption.", "Each gift is a PET.", "The gifts are LCTs.", "The gifts are taxed at 20%."], "a": "B", "x": ["Wrong. The small gifts exemption applies instead.", "Correct. Gifts of up to £250 per recipient per tax year are exempt, provided no other gift is made to that recipient that year.", "Wrong. Exempt gifts are not PETs.", "Wrong. Gifts to individuals are not LCTs.", "Wrong. No tax arises."]}, {"ch": 10, "n": 1, "sc": ["A testator dies, leaving a will which contains three pecuniary legacies of £10,000 each ('the legacies') to his sisters and a specific gift of a car ('the gift') to his nephew. After these dispositions are made, the residuary estate is worth approximately £450,000. The will contains a trust directing that the residue should be held for the benefit of the testator's two infant grandchildren. The testator appoints his wife and his brother to be the executors of his will and his father-in-law as the trustee of the will trust."], "st": "Which of the following best describes the executors' powers under the will?", "o": ["The executors can distribute the legacies and the gift but cannot distribute the £450,000 because it is trust property and does not fall into the estate.", "The executors can distribute the legacies and the gift and can pay the £450,000 residue directly to the infant grandchildren.", "The executors can distribute the legacies and the gift and can pay the £450,000 residue into the trust.", "The executors can distribute the legacies and the gift and can distribute the £450,000 under the intestacy rules because the will creates a partial intestacy over the residue.", "The executors can distribute the legacies and the gift, pay the £450,000 into the trust and then manage the trust fund for the grandchildren together with the father-in-law."], "a": "C", "bx": "The correct answer was C. This question demands careful reading, and in particular that you identify that the executors were not appointed as trustees. As executors, they have power to distribute the estate, including paying the £450,000 into the trust: in fact, it is their duty to do so, so B and D are incorrect. As to D in particular, there is no partial intestacy in this case as the three certainties are met in full. However, they have no power whatever as trustees, so E is incorrect. Once the money has been paid over, only the named trustee has power over it. A is also incorrect as the trust is not in existence until it is set up, so the residue is not 'trust property' at the time that it comes into the estate."}, {"ch": 10, "n": 2, "sc": ["A testator appoints his only niece and nephew to be executors under their will. The will contains a trust of the residue of the testator's estate. The testator also appoints his nephew, who is an executor, and an old family friend, who is not an executor, as trustees. A solicitor is asked to advise the executors about the validity of the appointment of the trustees."], "st": "What advice should the solicitor give?", "o": ["The appointment of the nephew and the old family friend as trustees is valid.", "The appointment of the nephew and the old family friend as trustees is not valid unless the niece is also appointed as a trustee.", "The appointment of the nephew and the old family friend as trustees is not valid unless the old family friend is removed as a trustee and replaced by the niece.", "The appointment of the nephew and the old family friend as trustees is not valid unless the old family friend is removed as a trustee.", "The appointment of the nephew and the old family friend as trustees is not valid unless the nephew is removed as a trustee."], "a": "A", "bx": "The correct answer was A. Although it is commonplace for executors also to be appointed as will trustees, there is no requirement that they should be so appointed. In this case, the testator has chosen to appoint one of the executors (the nephew) as a trustee together with a non-executor (the old family friend). There is no bar on the testator doing so. B, C and D assume, wrongly, that an executor must be appointed as a will trustee. E assumes, conversely, that an executor cannot be appointed as a will trustee, which is again incorrect."}, {"ch": 10, "n": 3, "sc": ["A testator died last year. The will contains a trust of the residuary estate. The residuary estate includes a three-bedroom house ('the house') in a good neighbourhood. The will trust does not expressly exclude any rights of the beneficiaries to occupy the house. The house has been rented out to a tenant for the past 10 years. There are two beneficiaries of the will trust, a man and a woman. Both the man and the woman are claiming that they should be allowed to exercise their right to occupy the house to the exclusion of the other. The tenant is still in occupation of the property and is about to sign a new 10-year lease, which was negotiated with the testator before the testator died. The will trustees seek advice from their solicitor."], "st": "Which of the following most accurately describes the advice that should be given to the will trustees?", "o": ["As the beneficiaries' right to occupy the house has not been excluded, the trustees must allow both the man and the woman to occupy the house.", "As the beneficiaries' right to occupy the house has not been excluded, and both beneficiaries are in conflict, the property must be sold.", "Although the beneficiaries' right to occupy the house has not been excluded, the trustees have absolute discretion to refuse to allow either beneficiary to occupy the house.", "As the beneficiaries' right to occupy the house has not been excluded, the trustees must allow either the man or the woman to occupy the house.", "Although the beneficiaries' right to occupy the house has not been excluded, the trustees can refuse to allow either beneficiary to occupy on the grounds that the house is not available."], "a": "E", "bx": "The correct answer was E. This property has been occupied (by the same tenant, though this is not conclusive) for a considerable period and a new lease has been negotiated by the tenant. Such a property is not available for occupation by the beneficiaries and the trustees are not under any obligation to remove a lawful occupant of the property in order to make way for any beneficiary. All other options are therefore incorrect."}, {"ch": 10, "n": 4, "sc": ["A will trust contains an investment portfolio of stocks and shares, the sum of £10,000 in a bank account and shop premises with a flat above the shop. The will appoints the executors as the trustees of the will trust. There are three beneficiaries of the will trust. The first and second beneficiary do not live in the UK. The third beneficiary has, for the past 20 years, operated a business from the shop and has lived in the flat above the shop. Her lease of the property is about to expire. The third beneficiary has not yet decided whether she wishes to continue to occupy the flat.", "The will trust contains no clause which limits or excludes any express rights of the beneficiaries under any statute. The trustees have received an offer to buy the freehold of the shop and flat from a third-party purchaser. The price offered is slightly higher than the market value. The trustees have asked for advice from a solicitor."], "st": "What advice should the solicitor give to the trustees?", "o": ["The trustees do not have to ask for the views of any of the beneficiaries in order to sell the freehold of the shop and flat, but they must first consider amongst themselves whether they should ask for the views of any of the beneficiaries.", "The trustees must ask for the views of the third beneficiary in order to sell the freehold of the shop and flat.", "The trustees must ask for the views of first and second beneficiaries in order to sell the freehold of the shop and flat.", "The trustees must ask for the views of all of the beneficiaries in order to sell the freehold of the shop and flat.", "The trustees do not have to ask for the views of any of the beneficiaries in order to sell the freehold of the shop and flat, nor are they required to consider amongst themselves whether they should ask for the views of any of the beneficiaries."], "a": "D", "bx": "The correct answer was D. This is a trust of land, and in compliance with statute, the trustees have a duty to ask for the beneficiaries' views about any decision that they take in connection with the trust. Deciding whether or not the freehold of the property should be sold is clearly one such decision (therefore A and E are incorrect). There is no express exclusion of this duty in the will, therefore D remains the best answer. While the trustees are under an obligation to take soundings from the beneficiaries, it must be all of them and not just some of them. Therefore, B and C are both incorrect."}, {"ch": 10, "n": 5, "sc": ["A girl aged 12, a talented dancer, has a contingent interest in a trust fund set up under her grandfather's will. The girl's interest in the trust, currently valued at £65,000, will vest when she is 21 years old. The gift carries the intermediate income and the current accumulated income is £6,000. The girl's mother has asked the trustees for the sum of £5,500 to pay for the girl and her mother to travel to, and stay in, Paris for the duration of a three-month ballet course. The trustees seek advice as to whether they can pay money from the trust to the girl's mother."], "st": "What is the most likely advice to be given to the trustees?", "o": ["The trustees can use either their power of maintenance or advancement, but should prefer the use of their power of maintenance.", "The trustees can use either their power of maintenance or advancement, but should prefer the use of their power of advancement.", "The trustees cannot use either their power of maintenance or advancement because the requested payment would also benefit the girl's mother and this is not permitted.", "The trustees can use their power of advancement, but cannot use the power of maintenance because the requested payment is not for the education or benefit of the girl.", "The trustees can use their power of maintenance, but cannot use the power of advancement because the requested payment will not help to set the girl up in life."], "a": "A", "bx": "The correct answer was A. Although the trustees could pay over capital using the power of advancement, this request can be met from the accumulated income and is for the education and benefit of the girl, so A is the best solution as opposed to B. Because the money will clearly assist the girl's education, D is incorrect, and it is likely that it will also advance her in life as she is already a talented dancer, so E is incorrect. As to C, a payment which will incidentally benefit a third party (here, the mother) is permissible as long as the primary purpose is to maintain the beneficiary, so this answer is also incorrect."}, {"ch": 10, "n": 6, "sc": ["A will trust holds a fund for a 10-year-old boy contingently on his reaching 25. The gift carries the intermediate income. His parents ask for money from the income to pay his school fees."], "st": "Which power may the trustees use?", "o": ["The power of maintenance, applying income for his education or benefit.", "The power of appropriation.", "The power of advancement, applying income for his education.", "Neither power, because the boy's interest is contingent.", "The power of investment."], "a": "A", "x": ["Correct. Section 31 of the Trustee Act 1925 allows trustees to apply income for a minor's maintenance, education or benefit.", "Wrong. Appropriation is a PR's power to satisfy legacies.", "Wrong. The power of advancement applies to capital.", "Wrong. Both powers can apply to contingent interests.", "Wrong. Investment is an administrative power."]}, {"ch": 10, "n": 7, "sc": ["A beneficiary has a contingent interest in a will trust that will vest at 25. The gift carries the intermediate income. He has just turned 18."], "st": "What is his entitlement to income?", "o": ["He receives the capital immediately.", "He becomes entitled to the income from 18, even though the capital is still contingent.", "The trustees must accumulate all income until he is 25.", "He receives half the income.", "None until he is 25."], "a": "B", "x": ["Wrong. The capital vests only at 25.", "Correct. Under s 31(1)(ii), a beneficiary with a contingent interest who reaches 18 becomes entitled to the income until the interest vests or fails.", "Wrong. Accumulation stops at 18 unless excluded.", "Wrong. There is no such rule.", "Wrong. Section 31(1)(ii) gives entitlement to income at 18."]}, {"ch": 10, "n": 8, "sc": ["A will trust created in 2020 holds £100,000 for a 20-year-old beneficiary contingently on her reaching 30. She asks the trustees for £80,000 to buy a flat."], "st": "Can the trustees advance the money?", "o": ["No, because they can advance only half of her presumptive share.", "No, because she is not yet 30.", "Yes, but only with the court's consent.", "No, because advancement is limited to income.", "Yes, because for trusts created after 1 October 2014 they can advance the whole of her presumptive share, provided it is for her advancement or benefit."], "a": "E", "x": ["Wrong. The half limit was removed for trusts created after 1 October 2014.", "Wrong. Advancement is available before an interest vests.", "Wrong. The court's consent is not required.", "Wrong. Advancement concerns capital.", "Correct. The Inheritance and Trustees' Powers Act 2014 amended s 32 to allow advancement of the whole presumptive share."]}, {"ch": 10, "n": 9, "sc": ["Will trustees wish to invest a large cash sum held in the trust."], "st": "Which statement best reflects their obligations under the Trustee Act 2000?", "o": ["They may invest as they wish without considering suitability or diversification.", "They can invest only in government securities.", "They must invest all funds in land.", "They must have regard to the standard investment criteria and normally obtain and consider proper advice.", "They must obtain the beneficiaries' consent to each investment."], "a": "D", "x": ["Wrong. Section 4 requires them to consider the standard investment criteria.", "Wrong. Section 3 gives a general power of investment.", "Wrong. There is no such requirement.", "Correct. Sections 4 and 5 require trustees to consider suitability and diversification and normally take proper advice, subject to the s 1 duty of care.", "Wrong. Beneficiaries' consent is not required."]}, {"ch": 10, "n": 10, "sc": ["A will leaves residue to trustees 'to distribute among my good friends as they see fit'."], "st": "Which certainty is most likely to be missing?", "o": ["Certainty of objects.", "Certainty of intention.", "Certainty of subject matter.", "None; the trust is valid.", "Certainty of trustees."], "a": "A", "x": ["Correct. 'Good friends' is conceptually uncertain, so the objects are uncertain.", "Wrong. The words show an intention to create a trust.", "Wrong. 'Residue' is ascertainable.", "Wrong. The uncertainty of objects is likely to be fatal.", "Wrong. There is no such certainty requirement."]}]},Q=D.q,L="ABCDE";let i=0,A={};
