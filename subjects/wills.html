<script>
const D={"t": ["Essential requirements for a valid will", "The personal representatives", "Interpretation of wills, alterations and amendments", "Revocation of wills", "The intestacy rules", "Property passing outside of the estate", "Getting the grant of representation", "Administration of the estate", "Claims under the Inheritance (Provision for Family and Dependants) Act 1975", "Inheritance tax", "Will trusts: trustees and beneficiaries"], "q": [{"ch": 0, "n": 1, "sc": ["An eccentric billionaire writes out his will in pencil on two sides of a blank page that he has torn out of a paperback book. The billionaire asks his personal assistant, his chauffeur and his bodyguard to witness the will. When the three witnesses are present, the billionaire signs only the front page of the will at the top with a runic symbol and not with his name, explaining to the witnesses that he is doing so because there are so many forgeries of his normal signature. The witnesses sign the will at the bottom of the back page."], "st": "Which of the following statements is the most accurate description of the validity of the will?", "o": ["Provided that no legal presumption can be displaced, this will is valid.", "This will is invalid because a will can have a maximum of two witnesses only.", "This will is invalid because it is written on a page torn out of a book.", "This will is invalid because it is not signed by the testator at the bottom.", "This will is invalid because a runic symbol cannot be a signature and therefore it is not signed by the testator."], "a": "A", "bx": "The correct answer was A. The legal presumptions of due execution and testamentary capacity would apply, and, as long as there is no evidence to displace them, there are no other factors which would invalidate this will. There is no rule that a will can have no more than two witnesses, so B is incorrect. The will can be written on any material at all, so C is incorrect. The billionaire indicated clearly to his witnesses that he intended the runic symbol to be his signature, and in these circumstances where he placed the signature is not relevant, so D is incorrect. There is no requirement that a signature must contain the testator's name, so E is incorrect."}, {"ch": 0, "n": 2, "sc": ["A UK-based man spends most of his time travelling internationally for business purposes. For personal reasons, the man now needs to execute a new will urgently on a stopover between flights at the airport. The man drives his car to a car park next to the airport where one of the two witnesses has already parked. The first witness is disabled and cannot easily get out of his car. The man, who is in a hurry, puts the will on the bonnet of the first witness' car and signs it with the first witness watching him through the windscreen. The second witness then arrives. The man says to the second witness, 'Where have you been? I've already signed this. See?' He points to the signature on the will. The first and second witness then sign the will as witnesses."], "st": "Which one of the following options best describes whether the will is valid?", "o": ["The will is not valid because only one witness was present when the man signed it.", "The will is valid because the man acknowledged his signature in the presence of both witnesses.", "The will is not valid because the man signed in the presence of the first witness but only acknowledged his signature to the second witness.", "The will is not valid because the man did not acknowledge his signature.", "The will is not valid because it cannot be executed in an exterior space such as a car park."], "a": "B", "bx": "The correct answer was B. This is because although only one witness was present when the man actually signed, both witnesses were present when he pointed to the signature and confirmed that it was his. It is not necessary for both witnesses to be present when the testator signs, provided that they are both present together, and in his presence, when he acknowledges his signature, so A is incorrect. C is a little more difficult. It is incorrect because it is not an accurate statement of what happened. If the first witness had left before the second witness arrived, then it would be correct, and the will would not be valid; but we know that all three were present when the man acknowledged his signature. The key thing is that all three people must be in each other's presence either at the time of signing or the time of acknowledgement of the signature. D is incorrect because the man did enough to tell both witnesses that the signature was his: he pointed to it and identified it as his signature. He does not have to use formal words such as 'I acknowledge this as my signature' as long as the witnesses are clear about the substance of what he is saying. Finally, E is incorrect because there are no rules about where a will should be executed. The only provision is that the three people, the testator and the witnesses, should be present together."}, {"ch": 0, "n": 3, "sc": ["A woman, aged 55, has been diagnosed with early onset dementia and is living in a care home. The woman's solicitor visited her and took instructions from her for her will. The woman instructed that all her property, which consists now of a small balance in her savings account, should pass to her brother, who is her only living relative. The solicitor then drew up the will and has returned to the care home today to have it executed. The woman does not remember giving instructions for the will, can no longer remember that she has a brother, and does not remember the solicitor's previous visit. The solicitor has explained the purpose of today's visit to the woman. The woman seems to understand no more than that she is being asked to sign an important legal document."], "st": "Which of the following most accurately reflects the legal position today?", "o": ["This will can never be executed because the woman had dementia when she gave her instructions.", "This will cannot be executed today because the woman cannot remember the instructions that she previously gave.", "This will can be executed today because although the woman no longer has testamentary capacity, she did have such capacity when she gave her instructions.", "This will cannot be executed today because the woman does not understand that she is being asked to execute a will.", "This will can be executed today because the woman understands that she is being asked to execute an important legal document."], "a": "D", "bx": "The correct answer was D. A person who has lost testamentary capacity between giving instructions and executing the will may still be able to execute it (so B is wrong), but one of the minimum requirements is that they must understand that it is a will that they are executing, and not some other document. The solicitor has tried and failed to explain this to the woman and therefore the woman does not have testamentary capacity. A is wrong because the fact that someone has been diagnosed with a mental impairment such as dementia does not automatically mean that they do not have testamentary capacity. Testamentary capacity is a question of fact on the relevant day. C is incorrect because the testator must understand at the very least that they are being asked to execute a will and that it has been drafted according to their previous instructions. E is incorrect because the testator must understand that they are being invited to execute a will and not some other legal document, no matter how important."}, {"ch": 0, "n": 4, "sc": ["A man is a professor of mathematics at a university. He has the full mental capability to organise and control his day-to-day life, and also to perform complex mathematical calculations beyond the scope of most people. However, the man also believes that famous scientists appear to him in 'visions' and give him help and advice, which he always follows. The man has told you that a vision has told him to exclude his daughter from his will. The daughter is 14 years old, without any disabilities and currently at a school for gifted children."], "st": "Which of the following most accurately describes whether the man has mental capacity to make a will?", "o": ["The man does not have the capacity to make a will because he is suffering from delusions.", "The man does not have the capacity to make a will because his delusions mean that he does not understand the nature and effects of the will he is proposing to make.", "The man does not have the capacity to make a will because his delusions mean that he does not understand the claims of his relatives.", "The man does have the capacity to make a will because his delusions do not affect his understanding of the claims of his relatives.", "The man does not have the capacity to make a will because he does not understand the nature of the property in his estate."], "a": "C", "bx": "The correct answer was C. This is because the delusions directly affect the man's understanding of the claims that his young daughter has on his estate. Therefore all other options are incorrect."}, {"ch": 0, "n": 5, "sc": ["A woman, a Japanese national living in the UK, died recently. The woman had a will which was written entirely in English. The will is signed by the woman in Japanese, and witnessed by two of her British work colleagues, but contains no attestation clause. The woman's family have told a solicitor that although the woman was able to speak English well, she was unable to read or write it."], "st": "Which one of the following statements most accurately describes the validity of the will?", "o": ["The woman's will may be valid if sworn evidence is produced that the two witnesses saw her sign the will.", "The woman's will may be valid if it can be proved that it was translated into Japanese before she died.", "The woman's will cannot be valid under any circumstances because she did not have knowledge and approval of its contents.", "The woman's will may be valid if evidence is produced that it was read over to her and that she understood it before she signed.", "The woman's will cannot be valid under any circumstances because she did not have any testamentary intention at the time that she signed."], "a": "D", "bx": "The correct answer was D. This is because the woman is functionally illiterate; therefore, a straightforward confirmation of attestation will not suffice (so A is wrong). This question is not just specifically testing your knowledge of the rules relating to illiterate testators (the woman cannot read or write English so she is functionally illiterate), but your wider knowledge of other key concepts. Note that although C is also wrong, evidence would have to be brought forward that the woman had understood the contents of the will, or there would be no knowledge and approval. There is no evidence at all in the question that the woman did not know that she was making a will and so there is no basis for E. B is wrong as it does not matter that there may have been a translation of the will at some point before the testator died; what matters is whether the woman knew what she was signing at the time she signed it."}, {"ch": 0, "n": 6, "sc": ["An elderly man has severe arthritis and cannot hold a pen. In the presence of two witnesses, he asks his nephew to sign the will on his behalf. The nephew signs the man's name at the end of the will in the man's presence. The two witnesses, who are present throughout, then sign."], "st": "Is the will validly executed?", "o": ["No, because the testator must sign the will himself.", "No, because the nephew must sign his own name, not the testator's.", "Yes, because a will may be signed by another person in the testator's presence and by his direction.", "No, because a third witness is required when someone else signs.", "Yes, but only if the nephew is also a beneficiary."], "a": "C", "x": ["Wrong. Section 9 of the Wills Act 1837 allows another person to sign on the testator's behalf.", "Wrong. Signing the testator's name is acceptable.", "Correct. Section 9(a) permits signature 'by some other person in his presence and by his direction'.", "Wrong. Two witnesses are enough.", "Wrong. Whether the signer benefits is irrelevant to this formality."]}, {"ch": 0, "n": 7, "sc": ["A woman's two witnesses sign her will first, as she has gone to fetch her glasses. When she returns, she signs the will in their presence. Neither witness signs again."], "st": "Is the will validly executed?", "o": ["Yes, because the witnesses were present when she signed.", "No, because the witnesses must sign in each other's presence.", "Yes, provided there is an attestation clause.", "Yes, because all three signatures are on the will.", "No, because the witnesses must attest after the testator has signed or acknowledged her signature in their joint presence."], "a": "E", "x": ["Wrong. Presence when she signed does not cure the fact that they signed first.", "Wrong. Witnesses need not sign in each other's presence.", "Wrong. An attestation clause gives rise to a presumption of due execution but cannot cure a known defect.", "Wrong. The order of signing matters.", "Correct. Under s 9, the testator must sign or acknowledge in the joint presence of the witnesses before each witness attests and signs."]}, {"ch": 0, "n": 8, "sc": ["A solicitor is assessing whether a client has testamentary capacity."], "st": "Which of the following is not part of the Banks v Goodfellow test?", "o": ["Comprehending and appreciating the claims to which they ought to give effect.", "Having made the will with the advice of a solicitor.", "Having no disorder of the mind that poisons their affections or perverts their sense of right.", "Understanding the extent of the property being disposed of.", "Understanding the nature of the act and its effects."], "a": "B", "x": ["Wrong. This is part of the test.", "Correct. There is no requirement for legal advice; the four elements of Banks v Goodfellow concern the testator's understanding.", "Wrong. This is part of the test.", "Wrong. This is part of the test.", "Wrong. This is part of the test."]}, {"ch": 0, "n": 9, "sc": ["A man with full capacity gives clear instructions for his will. Before the will is executed he becomes seriously ill and his understanding declines. When the will is brought to him, he can no longer follow its terms but understands that he is signing the will drafted on his earlier instructions."], "st": "Is the will likely to be valid?", "o": ["Yes, under the rule in Parker v Felgate, because he had capacity when giving instructions and understands that he is executing a will prepared on those instructions.", "No, because he cannot understand the claims of his relatives.", "No, because capacity is always assessed at the time of execution.", "No, because a will made during serious illness is invalid.", "Yes, but only if a doctor witnesses it."], "a": "A", "x": ["Correct. The exception applies where instructions were given with capacity and the testator understands that he is executing a will in accordance with them.", "Wrong. Under the exception, he need not satisfy the full test at execution.", "Wrong. Parker v Felgate is an exception to the usual rule.", "Wrong. Illness does not of itself invalidate a will.", "Wrong. There is no such requirement."]}, {"ch": 0, "n": 10, "sc": ["A soldier on active service in a combat zone tells a fellow soldier in front of others: 'If I don't make it, I want my sister to have everything.' He is killed the next day. Nothing was written down."], "st": "Which statement best describes the position?", "o": ["No valid will exists, because a will must be in writing and witnessed.", "The soldier may have made a valid privileged will, as the s 9 formalities do not apply to soldiers on actual military service.", "The statement is a valid will only if the soldier was over 18.", "The words take effect as a donatio mortis causa.", "The sister inherits only if the fellow soldier swears an affidavit within 14 days."], "a": "B", "x": ["Wrong. Privileged wills are an exception to the s 9 formalities.", "Correct. Soldiers on actual military service can make informal (even oral) privileged wills.", "Wrong. Privileged testators may make a will even if under 18.", "Wrong. There was no delivery of property, so this is not a donatio mortis causa.", "Wrong. There is no such rule."]}, {"ch": 1, "n": 1, "sc": ["A woman wrote out a homemade will on a will form. The woman expressed a wish that one of her aunts should be her executor. At the time that the will was made, the woman had five aunts living; at the time of the woman's death, three of the aunts are still alive. The will also expressed a wish that the woman's civil partner should arrange and pay for a humanistic funeral for her."], "st": "Which of the following statements most accurately reflects the legal position?", "o": ["The executor of this will is the woman's civil partner.", "This will is formally invalid because it does not name an executor.", "The executors of this will are all three of the woman's surviving aunts.", "The three aunts can agree between themselves which one of them should act as executor.", "There is no valid executor of the will, and an administrator must be appointed by the court."], "a": "A", "bx": "The correct answer was A. In order for one of the aunts to act, that aunt must be specifically named. As that did not happen in this case, an attempted appointment of the aunts is void for uncertainty (so C is incorrect) and the aunts cannot remedy the situation amongst themselves (so D is incorrect). Although the civil partner was not appointed as an executor, the will directed that he was to pay for the funeral. This is an essential task of an executor and the court may therefore conclude that the intention was that the civil partner was intended to carry out some of the functions of an executor, which means that A is the best answer. The omission of a named executor can never affect the formal validity of a will, so B is incorrect. As it is likely that the court will find sufficient evidence that the civil partner was intended to be the executor, an administrator will not be needed and E is incorrect."}, {"ch": 1, "n": 2, "sc": ["A will appoints three people as executors. Person 1 has been convicted of a fraud-related offence and is currently imprisoned. Person 2 is 17 years of age and a mathematical prodigy currently in the second year of a degree at a prestigious university. Person 3 was declared bankrupt two months ago."], "st": "Which of the people appointed under the will can be an executor?", "o": ["All persons are unable to be executors.", "Persons 1 and 2 can be executors. Person 3 cannot be an executor because they are insolvent.", "Persons 1 and 3 can be executors. Person 2 cannot be an executor because they are too young.", "Persons 2 and 3 can be executors. Person 1 cannot be an executor because they have been convicted of a criminal offence.", "All persons are able to be executors."], "a": "E", "bx": "The correct answer was E. A criminal conviction is not a bar to being an executor, so D is incorrect. Neither is an insolvency, so B is incorrect. A legal minor can be an executor, so C is incorrect, although person 2 would not be able to apply for probate because of their age. This means that all of the people mentioned can act as executors, and A therefore must be incorrect."}, {"ch": 1, "n": 3, "sc": ["A businessman told his brother that he had made a will which appointed his brother as his sole executor. When the businessman died, the brother immediately contacted the customers of his business and asked them to pay to him the amounts due on any current invoices. As a result of this, the brother received the cash sum of £50,000. The brother kept the money in a safe in his house where it was subsequently destroyed in a fire. The house was not insured at the time of the fire. The businessman's will has now been found and it does not name his brother as his executor."], "st": "Which of the following most accurately reflects the legal position of the brother?", "o": ["The brother can claim the loss of the £50,000 from the businessman's estate.", "The brother is liable to pay the sum of £50,000 to the businessman's estate out of his own pocket.", "The brother is not liable to pay the sum of £50,000 to the businessman's estate because he was not insured.", "Because the brother genuinely believed that he was the executor of the estate, the businessman's estate cannot claim the sum of £50,000 from the brother.", "The businessman's estate cannot claim the sum of £50,000 from the brother because the brother was entitled to act as executor until the will was found."], "a": "B", "bx": "The correct answer was B. The brother has been acting throughout as an executor de son tort and has intermeddled in the estate. If by doing that he has caused loss to the estate (which the brother has done in this case), then he is liable to repay that loss personally. A is incorrect because the brother has not suffered a loss: the £50,000 loss has been to the estate. It makes no difference to the brother's liability as an executor de son tort whether he was insured or not, and C is therefore incorrect, and a genuine belief that the brother was the executor would also not affect his liability, so D is incorrect too. Finally, it is not possible to self-appoint as an executor, even temporarily: the brother cannot be an executor if he was not mentioned in the will, and E is incorrect for this reason."}, {"ch": 1, "n": 4, "sc": ["A divorced woman died childless, leaving no will and an estate worth £2 million. The woman's surviving relatives were her ex-husband, the daughter of her half-sister (her niece), the son of her half-brother (her nephew) and her grandmother. The woman and her ex-husband had been on distant terms for over 10 years prior to her death. The woman lived with her grandmother, to whom she was very close, and saw her every day. The woman was not aware that her half-brother had had any children and she had never met her nephew. The niece and the nephew are on very bad terms after a family argument five years ago and have refused to speak to each other since."], "st": "Who is/are the person(s) most likely to be appointed to be an administrator of the woman's estate?", "o": ["The grandmother.", "The ex-husband.", "Either the niece or the nephew.", "Both the niece and the nephew.", "None of them are eligible to be an administrator of the estate."], "a": "C", "bx": "The correct answer was C. Former spouses are not eligible to be appointed administrators (making B wrong). Nieces and nephews, even of half-siblings, take precedence over grandparents (making A wrong). Here, we have a nephew and niece who are equally entitled. Although the court will prefer to appoint one administrator, it would be possible to appoint both the niece and the nephew as joint administrators because they are equally entitled to the administration. However, in this case the cousins are not speaking to one another, and it is unlikely that they will be able to work together; this makes D incorrect as it is not the most likely solution. As a result, the court is likely to appoint the one who seems most likely to administer the estate well and efficiently. E is incorrect because there are clearly two persons entitled to be appointed as administrator under Rule 22(1) of the NCPR."}, {"ch": 1, "n": 5, "sc": ["An artist died while 10 of her paintings were being exhibited in a gallery. At the time of her death, four of the paintings had been sold for the sum of £25,000 and six remained unsold. The artist's will left her paintings to her brother and any cash in her estate to her son. The artist appointed her sister as the executor of her will. The sister is still collecting the assets of the estate and is not yet in a position to distribute them."], "st": "Which of the following best describes to whom the gallery should send the £25,000 and the six paintings?", "o": ["The gallery should send the £25,000 and the six paintings to the artist's brother.", "The gallery should send the £25,000 and the six paintings to the artist's sister.", "The gallery should send the £25,000 and the six paintings to the artist's son.", "The gallery should send the £25,000 to the artist's son and the six paintings to the artist's brother.", "The gallery should send the £25,000 to the artist's sister and the six paintings to the artist's brother."], "a": "B", "bx": "The correct answer was B. It is the executor's duty to get in all of the assets prior to distribution, regardless of the person who will receive them on distribution. Only the artist's sister has a right to hold the items prior to distribution, and the person holding the items on the artist's death must not pass them to anyone else. The artist's brother currently has no right to possess any of the items, so A, D and E are incorrect. Neither does the artist's son, so C is incorrect."}, {"ch": 1, "n": 6, "sc": ["An executor named in a will has collected rent from the deceased's tenant and paid some of the deceased's bills. She now wishes to renounce probate."], "st": "Can she renounce?", "o": ["No, because executors can never renounce.", "No, because by intermeddling in the estate she has accepted the office and can no longer renounce.", "Yes, an executor can renounce at any time before the estate is distributed.", "Yes, but only with the consent of all the beneficiaries.", "Yes, provided she repays the rent to the estate."], "a": "B", "x": ["Wrong. Executors can renounce if they have not intermeddled.", "Correct. An executor who has intermeddled has accepted the office and cannot renounce.", "Wrong. Renunciation is not possible after intermeddling.", "Wrong. Beneficiaries' consent is irrelevant.", "Wrong. Repayment does not undo acceptance of office."]}, {"ch": 1, "n": 7, "sc": ["A will appoints four executors. One of them is very busy and does not wish to take part in the administration at present, but wants to keep open the possibility of acting later."], "st": "What should that executor do?", "o": ["Do nothing; the grant will be issued to all four regardless.", "Have power reserved to them, allowing the other executors to take out the grant.", "Renounce probate.", "Ask the court to remove them as executor.", "Appoint an attorney to act instead."], "a": "B", "x": ["Wrong. The executor must either prove, renounce or have power reserved.", "Correct. Power can be reserved to a non-proving executor, who may later apply for a grant (a double probate).", "Wrong. Renunciation is final and would prevent them acting later.", "Wrong. Removal is unnecessary.", "Wrong. This is not what the executor wants."]}, {"ch": 1, "n": 8, "sc": ["A man dies intestate, survived by his wife and two adult children."], "st": "Who is first entitled to take out a grant of letters of administration under Rule 22 of the NCPR?", "o": ["The two adult children jointly.", "The surviving spouse.", "The deceased's parents.", "Any beneficiary who applies first.", "The eldest child."], "a": "B", "x": ["Wrong. The children rank after the surviving spouse.", "Correct. Under NCPR r 22, the surviving spouse or civil partner is first in the order of priority.", "Wrong. Parents rank after the spouse and issue.", "Wrong. Priority follows the order in Rule 22.", "Wrong. Age does not determine priority."]}, {"ch": 1, "n": 9, "sc": ["A will appoints six people as executors. All six wish to act."], "st": "How many of them can take out the grant of probate?", "o": ["Only one, chosen by the court.", "As many as the will specifies.", "A maximum of four.", "Only two.", "All six."], "a": "C", "x": ["Wrong. The court does not limit the grant to one in these circumstances.", "Wrong. The statutory maximum overrides the will.", "Correct. No more than four PRs can be appointed in respect of the same property; others may have power reserved.", "Wrong. Two is the minimum in some cases, not the maximum.", "Wrong. There is a statutory maximum."]}, {"ch": 1, "n": 10, "sc": ["A woman dies intestate with no spouse, no issue and no living relatives within the classes entitled under the intestacy rules."], "st": "Who will take her estate?", "o": ["Her cohabitee's family.", "The local authority.", "Her closest friend.", "The Crown, as bona vacantia.", "Her godchildren."], "a": "D", "x": ["Wrong. There is no such entitlement.", "Wrong. The local authority has no entitlement.", "Wrong. Friends have no entitlement on intestacy.", "Correct. Where there is no one entitled, the estate passes to the Crown as bona vacantia.", "Wrong. Godchildren are not within the intestacy classes."]}, {"ch": 2, "n": 1, "sc": ["A testator's will contains a clause giving 'a copy' of a rare first edition of a children's book to his niece. When the testator dies, his executors discover that he owns two copies of the book named in the will: one is signed by the author and the other is unsigned. The signed copy is much more valuable than the unsigned copy."], "st": "Which of the following most accurately reflects the legal position in respect of the legacy?", "o": ["The executors must give the niece one of the two books owned by the testator.", "The executors must give the niece the signed copy of the book owned by the testator.", "The executors can buy another first edition of the book and give it to the niece.", "The executors must give the niece the unsigned copy of the book owned by the testator.", "The clause in the will is invalid because the executors do not know which book they should give to the niece."], "a": "C", "bx": "The correct answer was C. This is a general legacy and although the executors could, if they chose to do so, give the niece either one of the books owned by the testator, they are not obliged to do so. Therefore A, B and D are wrong. E is wrong because the clause is clearly able to be implemented as it stands."}, {"ch": 2, "n": 2, "sc": ["A testator's will contains a legacy of £30,000 to his daughter, to be paid from the testator's bank account ('the first bank account'). At the time that the testator dies, after the payment of all debts and liabilities, the bank account contains £5,000. The testator's estate also includes an account at a different bank containing £10,000 ('the second bank account') and a residuary estate worth £10,000. The only other provision of the will was that the testator's son should receive the residue."], "st": "Which of the following accurately reflects the legal position?", "o": ["The executors can pay the daughter £5,000 from the first bank account and the £10,000 from the second bank account, but not the £10,000 from the residue.", "The executors can only pay the daughter £5,000 from the first bank account.", "The gift fails entirely because the estate does not contain a total of £30,000.", "The executors can pay the daughter the £5,000 from the first bank account and the £10,000 from the second bank account, but not the residue.", "The executors can pay the daughter all of the money from the first and second bank accounts and the residue."], "a": "E", "bx": "The correct answer was E. The gift of £30,000 is a demonstrative pecuniary legacy which is treated as a specific legacy for the purposes of abatement. Demonstrative legacies can be met from other assets in the estate if the named asset is not sufficient to meet them. As a result, the executors should pay the demonstrative legacy first, even though this exhausts the estate and the son gets nothing. It is for this reason that the other options are incorrect. Note C in particular: the gift is still valid, even though there is not enough money in the estate to pay it in full."}, {"ch": 2, "n": 3, "sc": ["A man and a woman became engaged to marry in March. In April, the pair went to stay for the weekend with the man's stepmother, his only remaining living relative. The stepmother was so pleased to hear of the engagement that she said: 'I am making my will this weekend and I want to make you a present in my will so that you will have something to remember me by when I die'. Later that weekend, the stepmother executed the will, which left £100,000 to her stepson. The stepmother asked the stepson's fiancée and another person to witness her signature. In September, the stepson and his fiancée married. In November, the stepmother died, without having made another will."], "st": "Which one of the following most accurately reflects the position of the stepson's inheritance?", "o": ["The stepson does not inherit the £100,000; the entire will is invalid because the stepson's fiancée witnessed the will.", "The stepson inherits the £100,000; the stepson's fiancée was able to act as a witness at the time that it was executed.", "The stepson does not inherit the £100,000; the gift to him is invalid because the stepson's fiancée witnessed the will.", "The stepson inherits the £100,000; the will fails, but he is the stepmother's next of kin.", "The stepson does not inherit the £100,000; his marriage in September revokes the gift."], "a": "B", "bx": "The correct answer was B. Although gifts (not wills) will fail if the spouse of a beneficiary witnesses the will, that rule does not apply to fiancées even if they subsequently marry before the death of the testator. A is wrong because the whole will is never invalidated even if a spouse witnesses, only the gift. C is wrong because she is his fiancée and not his wife. The will remains valid, so D is incorrect. E is incorrect because there is no rule that any subsequent marriage by a beneficiary, as opposed to marriage by a testator, revokes any testamentary gift."}, {"ch": 2, "n": 4, "sc": ["A man wanted to make some changes to a will that he had executed three years previously. The man arranged for two witnesses to be present while he made the changes and to attest to any signatures he might make. The change that he made was to cross out the words 'five thousand pounds' in a pecuniary legacy clause on the top line of page 2 and to write the word '£10,000' immediately above the crossed-out words. The man and the witnesses initialled the bottom of the page."], "st": "Which of the following most accurately describes the legal position?", "o": ["The alteration is not valid because there is no memorandum attached to the will to explain it.", "The alteration is valid because it has been initialled by the testator and the two witnesses.", "The alteration is not valid because the amendment should have been written 'ten thousand pounds' and not '£10,000'.", "The alteration is not valid because it is not signed opposite or near to the alteration.", "The alteration is valid because it has been signed on the same page as the alteration."], "a": "D", "bx": "The correct answer was D. The initials must be close enough to the alteration to make it clear what is in fact being altered and attested to. A memorandum is not required for any alteration, so A is incorrect. B is incorrect because the initials are not enough in themselves. C is incorrect because the alterations do not have to duplicate the original form of wording. E incorrectly assumes that any location on the page will do."}, {"ch": 2, "n": 5, "sc": ["A woman executes a will in 2016. The woman decides to add further gifts to her will and to do so by way of a codicil. The woman executes a codicil in 2018, making gifts to three more named persons. The 2018 codicil confirms the 2016 will except for the changes made in the codicil. In 2020, the woman looks at the original will and decides that she would like to make a gift to one further person. In this case, she decides to amend the original will by adding the new gift in handwriting on the original will, writing between the lines. In the presence of two witnesses, the woman initials the amendment and asks them to initial it also, which they do."], "st": "Which of the following best describes the legal position of the will?", "o": ["The operative date of the will is 2020.", "The will is not valid because amendments cannot be made after a codicil.", "The operative date of the will is 2018.", "The will is not valid because the codicil confirmed the original will.", "The operative date of the will is 2016."], "a": "C", "bx": "The correct answer was C. A codicil republishes the will and the clock therefore re-started in 2018 when the codicil was executed (therefore A and E are incorrect). There is no rule that amendments cannot be made after a codicil, so B is incorrect (although clearly there can be problems if the amendments conflict with the codicil). D is incorrect because the codicil must, in fact, confirm the original will."}, {"ch": 2, "n": 6, "sc": ["A testator's will leaves 'my Rolex watch' to his son. Two years before his death, he sells the watch and buys a Cartier watch with the proceeds."], "st": "What does the son receive?", "o": ["The value of the Rolex from residue.", "Nothing, because the specific gift has adeemed.", "The Cartier watch, as a substitute.", "The sale proceeds of the Rolex.", "The Cartier watch, if he can show the testator would have wanted this."], "a": "B", "x": ["Wrong. Ademption means no substitute is payable from residue.", "Correct. A specific gift adeems if the item is not in the estate at death.", "Wrong. A specific gift does not attach to replacement property.", "Wrong. The proceeds are not the subject of the gift.", "Wrong. The testator's presumed wishes do not prevent ademption."]}, {"ch": 2, "n": 7, "sc": ["A will leaves £20,000 to the testator's daughter. The daughter dies before the testator, leaving a son. The will contains no substitution clause."], "st": "What happens to the £20,000?", "o": ["It passes to the Crown.", "It lapses and falls into residue.", "It passes to the daughter's estate.", "It is shared among the other beneficiaries.", "It passes to the daughter's son under s 33 of the Wills Act 1837."], "a": "E", "x": ["Wrong. The Crown has no claim.", "Wrong. Section 33 prevents lapse where the beneficiary is the testator's child or other issue who leaves issue.", "Wrong. The gift does not pass to the daughter's estate.", "Wrong. There is no such rule.", "Correct. Section 33 provides that the gift passes to the predeceased child's issue unless a contrary intention appears."]}, {"ch": 2, "n": 8, "sc": ["A testator's will leaves £50,000 to her friend. The friend's husband is one of the two witnesses to the will."], "st": "What is the effect?", "o": ["The gift is valid because the friend herself did not witness the will.", "The gift to the friend fails, but the rest of the will is valid.", "The gift is reduced by half.", "The whole will is invalid.", "The husband's signature is void, so the will is invalid."], "a": "B", "x": ["Wrong. The rule extends to a witness's spouse.", "Correct. Under s 15 of the Wills Act 1837, a gift to a witness or their spouse fails, though the will is valid.", "Wrong. There is no partial reduction.", "Wrong. Only the gift fails; the will remains valid.", "Wrong. His attestation is valid; only the gift fails."]}, {"ch": 2, "n": 9, "sc": ["A testator's will leaves his house to his wife. They later divorce. He dies without changing his will."], "st": "What is the effect of the divorce on the gift?", "o": ["The gift is reduced by half.", "The former wife may still take, but only as executor.", "The gift is unaffected.", "The whole will is revoked.", "The former wife is treated as having died on the date of the divorce, so the gift to her fails."], "a": "E", "x": ["Wrong. There is no such rule.", "Wrong. Any appointment of the former spouse as executor is also affected.", "Wrong. Section 18A changes the position.", "Wrong. Divorce does not revoke the whole will.", "Correct. Under s 18A of the Wills Act 1837, the former spouse is treated as having died on the date of the final order, unless a contrary intention appears."]}, {"ch": 2, "n": 10, "sc": ["After a testator's death, a pecuniary legacy is found to read '£5,000', crossed out and replaced in handwriting with '£8,000'. The alteration was not signed or witnessed. The original '£5,000' is still clearly legible."], "st": "How will the gift be treated?", "o": ["As a gift of £6,500.", "As a gift of £8,000.", "As a gift of nothing, because it has been obliterated.", "As a gift of £5,000, because the unattested alteration is presumed to have been made after execution and the original wording is apparent.", "The whole will is invalid."], "a": "D", "x": ["Wrong. There is no averaging.", "Wrong. Unattested alterations are ineffective unless shown to have been made before execution.", "Wrong. The original wording remains legible, so it is not obliterated.", "Correct. Under s 21 of the Wills Act 1837, an unexecuted alteration is ineffective and the original wording, if apparent, stands.", "Wrong. An ineffective alteration does not invalidate the will."]}, {"ch": 3, "n": 1, "sc": ["A woman executed a will in 2010 which left all of her property to her husband. At that time, she had testamentary capacity and all relevant formalities were complied with. By 2015, the woman was an alcoholic who regularly had drinking binges during which she did not have testamentary capacity (though she recovered mental capacity when she sobered up).", "In 2019, the couple had a serious argument because the husband refused to give the woman money to pay for alcohol. In a fit of temper, and while drunk, the woman took the will from the desk drawer in her home office and tore it into four pieces in front of her husband, telling him, 'You'll get nothing from me when I die'.", "When the woman sobered up, she took the torn pieces of the will and kept them together in the desk drawer, intending to tape them back together. However, she had not done so by the time she died in 2022. She had not made any further wills."], "st": "Which of the following best describes the validity of the 2010 will?", "o": ["The will is invalid because it is no longer in one piece.", "The will is valid because the woman lacked testamentary capacity to revoke it.", "The will is invalid because the woman revoked it by tearing it up.", "The will is valid because it can be taped back together.", "The will is invalid because the woman failed to repair it."], "a": "B", "bx": "The correct answer was B. Remember that successful revocation by destruction requires not only an act of destruction but also an intention to destroy and the capacity to do so. The damage caused to this will was the result of temper and not a real intention to destroy. Furthermore, the woman was drunk at the time and therefore lacked testamentary capacity. Of the other answers, A is incorrect because a will can be valid even if it has been torn into several pieces; for the same reason, E is also incorrect. D is incorrect because the issue of whether or not the will can be repaired is irrelevant to the issue of whether or not it has been revoked. C is incorrect because the mere act of tearing will not revoke: there must be intention and capacity as well."}, {"ch": 3, "n": 2, "sc": ["A woman made a will in 2019 which did not contain a revocation clause. At the time that the woman made the will, she was recovering from a stroke which had affected her ability to speak. The woman had previously made a will in 2017 before she had the stroke. The 2017 will gave gifts of £5,000 each to her four nephews and nieces and divided the rest of her estate equally between her two children. The 2019 will gave £10,000 each to her two nieces, £5,000 each to her two nephews and divided the rest of her estate equally between her two children. The woman has now died and the original of the 2019 will cannot be found."], "st": "Which of the following best describes the legal position in respect of the woman's wills?", "o": ["The 2017 will was expressly revoked by the 2019 will.", "The woman did not have the capacity in 2019 to revoke the 2017 will.", "The 2019 will cannot revoke the 2017 will because the original has been lost.", "The 2017 will was not impliedly revoked by the 2019 will.", "The 2017 will was impliedly revoked by the 2019 will."], "a": "E", "bx": "The correct answer was E. There is no revocation clause in the 2019 will and therefore there can be no express revocation, making A incorrect. B is incorrect because the woman's mental capacity would not be affected merely by an inability to speak. Loss of the original later will is not a bar to proving revocation, so C is incorrect. The provisions of the 2019 will are similar to the 2017 will to such an extent that the woman's intention can be inferred as revoking the earlier will. This is an implied revocation. D is therefore incorrect."}, {"ch": 3, "n": 3, "sc": ["A man had made a will leaving all of his property to his teenage son. The man was divorced from his ex-wife, his son's mother, and they were not on speaking terms. The man forbade the son from contacting his mother in any way. When the man discovered that his son had been visiting his mother in secret, the man lost his temper. The man confronted his son in a room of their shared home, took his will out of the sideboard drawer and tore it into six pieces in front of the son, saying, 'This will show you what I think of your behaviour'. When the man had calmed down, he put the six pieces of paper back into the sideboard drawer. The man and the son continued to live together and the incident was not mentioned again."], "st": "Which of the following best describes the legal position in respect of the man's will?", "o": ["The will was not revoked because the man did not intend to revoke it.", "The will was revoked because the man destroyed it.", "The will was revoked because the man was sober when he tore it up.", "The will was not revoked because tearing it into four pieces was not enough to destroy it.", "The will was revoked because the words used by the man, together with the act of tearing the will up, were enough to revoke it."], "a": "A", "bx": "The correct answer was A. This is the classic example of a testator destroying a will to make a point rather than to revoke, ie with no intention to revoke. The testator was in a temper and his words and actions were a 'performance' directed at his son's behaviour and not said with any intention to revoke the will. B and E are incorrect because destruction of a will does not suffice without an intention to do so and capacity. C is incorrect because the mere fact that the man was not drunk is not conclusive of intention; the testator was in a temper and that affects intention. D is incorrect because although the will remains readable, tearing it into six pieces is technically 'destruction' for the purpose of the question. Remember: revocation requires destruction + intention + capacity!"}, {"ch": 3, "n": 4, "sc": ["An elderly man was angry at the behaviour of his middle-aged daughter, who had left her husband for a man much younger than herself. The elderly man took out his will, which left all of his property to his daughter, and, using a black marker pen, he drew a line through the signature of the first witness of his will so that the signature could not be read. The elderly man then went off to make a cup of tea, leaving the marker pen uncapped on his desk. When he returned, the marker pen had begun to dry up and although he drew a line through the signature of the second witness, that signature remained clearly legible. The elderly man then took a ballpoint and drew a red line through his own signature, but that also remained clearly legible."], "st": "Has the man revoked his will?", "o": ["Yes, because he has deleted all three signatures.", "No, because there is no evidence of any intention to revoke.", "No, because his own signature remains legible.", "Yes, because he has attempted to delete all three signatures.", "No, because deleting signatures cannot revoke a will."], "a": "C", "bx": "The correct answer was C. The effect of the elderly man's actions was to delete only one signature, that of a witness: the will may therefore still be valid. A is incorrect because he has only deleted one signature: if a signature remains legible, it has not been 'deleted'. Unsuccessful attempts to delete signatures also do not count as 'deletion', so D is incorrect. E is simply incorrect on the law: there is no rule that deletion of signatures cannot revoke a will. B relates to intention: there is in fact evidence that the testator did have a clear intention to revoke, so this option is incorrect."}, {"ch": 3, "n": 5, "sc": ["A musician had serious substance and alcohol abuse problems. His 2019 will left all of his property to his wife. After crashing his car in an accident, the musician was admitted to a secure rehabilitation treatment centre which he was not allowed to leave without a doctor's permission. While the musician was there, his wife wrote to him to tell him that she was leaving him and taking their children with her. Angered by the letter but unable to get to his will, which was in the safe in his home office, the musician instructed his sister to go to his home and burn the will. The sister did so. Unknown to anyone, the musician's solicitors had retained a photocopy of the will.", "The musician died two days later falling from a window at the centre while trying to escape."], "st": "Which of the following options best describes the current position regarding the musician's will?", "o": ["The will has been revoked because it has been destroyed.", "The will has not been revoked because the musician did not have capacity to revoke it while he was receiving treatment at the rehabilitation centre.", "The will has not been revoked because the musician was not present when the sister destroyed it.", "The will has been revoked because the musician had capacity to revoke when he instructed the sister to destroy it.", "The will has not been revoked because the musician cannot legally disinherit his wife and children."], "a": "C", "bx": "The correct answer was C. The musician does not have to destroy the will himself, but he does have to be present when it is destroyed. B is wrong because the mere fact that the musician is an addict receiving treatment does not mean that he has lost capacity. A is incorrect because destruction on its own is not enough; there must also be capacity and intention. D is incorrect because as well as having capacity, the musician must also be present during destruction. E is incorrect because there is nothing at all to prevent any person disinheriting their spouse and children (we will look at this again in Chapter 9 when we consider family provision and the Inheritance Act 1975)."}, {"ch": 3, "n": 6, "sc": ["A woman makes a will in 2020 leaving everything to her sister. In 2023 she marries. The will contains no reference to the marriage. She dies in 2025."], "st": "What is the status of the 2020 will?", "o": ["Only the gift to the sister is revoked.", "It is valid, as nothing in it was changed.", "It is valid if her husband consents.", "It is revoked only if she had children.", "It was revoked by her marriage, so she died intestate."], "a": "E", "x": ["Wrong. The whole will is revoked, not just the gift.", "Wrong. Marriage automatically revokes a will unless made in contemplation of it.", "Wrong. Consent is irrelevant.", "Wrong. Children are irrelevant to revocation by marriage.", "Correct. Under s 18 of the Wills Act 1837, marriage revokes an existing will unless it was made in contemplation of that marriage."]}, {"ch": 3, "n": 7, "sc": ["A man executes a will in 2018. In 2024 he executes a new will containing the words 'I revoke all former wills and codicils'. The 2024 will deals with only part of his property."], "st": "What is the position of the 2018 will?", "o": ["It is expressly revoked, so property not dealt with by the 2024 will passes on intestacy.", "It remains valid because the 2024 will is incomplete.", "It continues to govern the property not dealt with in the 2024 will.", "It is revived for the property not dealt with in 2024.", "It is impliedly revoked only to the extent of inconsistency."], "a": "A", "x": ["Correct. The revocation clause expressly revokes the 2018 will, and any undisposed property passes under a partial intestacy.", "Wrong. An incomplete will can still revoke earlier wills.", "Wrong. An express revocation clause revokes the earlier will entirely.", "Wrong. Revoked wills are not revived in this way.", "Wrong. Implied revocation applies only where there is no express clause."]}, {"ch": 3, "n": 8, "sc": ["A woman tears up her will because her solicitor has told her that a new will, which she has just signed, is valid. It later emerges that the new will was not properly witnessed."], "st": "How might the court treat the destroyed will?", "o": ["The doctrine of conditional revocation may apply, so the old will is not revoked because the revocation was conditional on the new will being valid.", "The old will is revoked but the new will takes effect as a codicil.", "The new will takes effect despite the defect.", "Both wills are valid.", "It is revoked, so she died intestate."], "a": "A", "x": ["Correct. If the destruction was conditional on the new will being effective, and the condition fails, the revocation does not take effect.", "Wrong. An invalid will cannot take effect as a codicil.", "Wrong. An improperly executed will cannot take effect.", "Wrong. The new will is invalid.", "Wrong. Conditional revocation may prevent this result."]}, {"ch": 3, "n": 9, "sc": ["A testator's will appoints his wife as executor and leaves her his whole estate. They divorce, but he does not make a new will."], "st": "Is the will revoked by the divorce?", "o": ["No, and the former wife takes everything.", "No, the will is not revoked, but the gifts to and appointment of the former spouse take effect as if she had died on the date of the divorce.", "Yes, but only if the divorce was more than a year before death.", "Yes, unless the will states otherwise.", "Yes, divorce revokes a will in the same way as marriage."], "a": "B", "x": ["Wrong. Section 18A prevents this.", "Correct. Section 18A treats the former spouse as having predeceased; the rest of the will stands.", "Wrong. There is no time-based rule.", "Wrong. The will is not revoked.", "Wrong. Divorce does not revoke a will; it affects provisions for the former spouse."]}, {"ch": 3, "n": 10, "sc": ["A man in hospital phones his housekeeper and asks her to burn his will, which is in his study. She does so while he is still in hospital."], "st": "Has the will been revoked?", "o": ["Yes, because he had the intention to revoke.", "No, because destruction by another person must take place in the testator's presence and by his direction.", "Yes, provided the housekeeper confirms his instructions in writing.", "Yes, because it was destroyed on his instructions.", "No, because only the testator can destroy his will."], "a": "B", "x": ["Wrong. Intention alone is not enough.", "Correct. Under s 20 of the Wills Act 1837, destruction may be by another person in the testator's presence and by his direction.", "Wrong. Written confirmation does not cure the absence of the testator.", "Wrong. Destruction by another person must be in the testator's presence.", "Wrong. Another person may destroy it if the statutory conditions are met."]}, {"ch": 4, "n": 1, "sc": ["A man made a will leaving half of his estate to his sister and half to his partner. The will includes a clause that the man does not intend the will to be revoked by his marriage to his partner. The man makes no further wills. Six months later, he marries his partner ('Husband 1'). Three months later, Husband 1 dies. A year later, the man marries Husband 2."], "st": "Which of the following best describes who will inherit the man's estate on his death?", "o": ["Husband 1's estate inherits the man's whole estate under the intestacy rules.", "Half of the man's estate passes to the sister and the other half passes to Husband 1.", "Husband 2 inherits the man's whole estate under the intestacy rules.", "The sister inherits the man's whole estate under the intestacy rules.", "Half of the man's estate passes to the sister and the other half passes to Husband 2."], "a": "C", "bx": "The correct answer was C. The testator made a will in anticipation of marriage to Husband 1, and therefore marriage to Husband 1 did not automatically revoke the will. However, the will did not anticipate the marriage to Husband 2, and at the point that the testator married Husband 2, the will was automatically revoked. As there is now no will, Husband 2 can only inherit under the intestacy rules. A is wrong because Husband 1 predeceased the testator and therefore does not fall within the intestacy rules. B is incorrect because those are the provisions of the now-revoked will. D is incorrect because only Husband 2 is entitled to inherit under the intestacy rules. E is incorrect because there is no legal basis upon which the estate could be distributed in this way."}, {"ch": 4, "n": 2, "sc": ["A man was separated from his wife. After the separation, the man bought a rental property with his brother which he and his brother owned as beneficial joint tenants. They rented out the rental property and received an income from it. The value of the house was £350,000. Last year, the wife commenced divorce proceedings against the man. Last month, the man died intestate. The man had savings of £25,000 but no other assets apart from the rental property."], "st": "Which of the following most accurately describes the wife's current position under the intestacy rules?", "o": ["The wife is entitled to £25,000 and to the man's share of the rental property.", "The wife is entitled to £322,000 as the statutory legacy and can ask the administrators to appropriate the rental property to her as part or full payment of that legacy.", "The wife is not entitled to any cash but is entitled to the man's share of the rental property.", "The wife is not entitled to any of the man's assets because she has commenced divorce proceedings.", "The wife is entitled to £25,000 but not entitled to any interest in the rental property because it was held by the man as a beneficial joint tenant."], "a": "E", "bx": "The correct answer was E. Remember that this is a beneficial joint tenancy and the key characteristic of a beneficial joint tenancy is survivorship: that is, when the man dies, his interest automatically passes to his brother. A was therefore incorrect because although the wife is entitled to the cash as part of the statutory legacy, she can make no claim on the man's share of the property. B is doubly incorrect, first because although the wife would be entitled to £322,000 if that sum were available, the only available sum is £25,000; and second because even if the property was not jointly owned, the wife still could not demand it as appropriation because she has never lived in it. C is incorrect both because the wife is entitled to the cash and because she is not entitled to the share of the property. D is incorrect because the parties are still married until a final decree of divorce is made: the fact that she has commenced divorce proceedings is not relevant."}, {"ch": 4, "n": 3, "sc": ["A woman dies intestate, leaving an estate worth £735,000. The woman is survived by her husband. The woman and her husband separated 20 years ago and the husband left to live in another country. They had not met or spoken since the husband's departure. The woman is also survived by her sister, to whom she was very close throughout her life. The sister is currently suffering from a serious illness and is unable to work. In the years before her death, the woman took her sister in as a lodger to her own home, which the woman owned in her sole name."], "st": "Which of the following most accurately describes the administrators' powers on intestacy?", "o": ["The administrators have the power to divide the estate equally between the husband and the sister.", "The administrators have the power to give the husband the first £322,000 of the estate and half of the residue, and the sister the other half.", "The administrators have the power to give all of the estate to the husband.", "The administrators have the power to give all of the estate to the sister because her relationship to the woman was closer.", "The administrators have the power to give the house to the sister because there is an equitable joint tenancy."], "a": "C", "bx": "The correct answer was C. There is no discretion available to the administrators to distribute the estate in any way other than that provided by the intestacy rules. Where a person dies leaving a spouse and no issue, the rules provide that the estate must be given in its entirety to the surviving spouse (therefore A, B and D are incorrect). E is wrong because the sister lived in the house as a lodger, which means that the sister had not acquired any legal or equitable interest in the property: there could therefore not be an equitable joint tenancy."}, {"ch": 4, "n": 4, "sc": ["A man died intestate. In the man's estate were (1) the sum of £135,000 in a savings account; (2) a collection of vintage wines worth £75,000 which he had bought as an investment, but kept locked up in a refrigerated cellar and did not drink; (3) a vintage sailing boat which he bought as an investment, restored himself by hand and sailed every weekend and most holidays, which is worth £785,000 in its current restored condition; (4) a £23,000 mortgage over a house owned by the man's brother. The man was survived by his spouse and by three children from a previous marriage."], "st": "Which of the assets are personal chattels which would pass automatically to the man's spouse?", "o": ["The money in the savings account and the collection of vintage wines.", "The collection of vintage wines and the sailing boat.", "The mortgage only.", "The mortgage and the sailing boat.", "The sailing boat only."], "a": "E", "bx": "The correct answer was E. Although the sailing boat was bought partly as an investment, this was a chattel not held solely as an investment at the time of death. The man clearly used it personally, including spending time and money on restoration himself and then sailing the craft during many of his leisure hours. None of the other items are personal chattels, so any option including any of them is incorrect. The wine was bought primarily as an investment and never used or enjoyed (therefore both A and B are wrong). Money in the bank and securities for money (including mortgages) are not classed as personal chattels (therefore A, C and D are wrong)."}, {"ch": 4, "n": 5, "sc": ["A woman died intestate. The woman is survived by her mother's half-sister, her stepson, her stepsister and the biological child of the deceased's aunt (who predeceased the woman) of the full blood."], "st": "Who is the first in line to entitlement under the intestacy rules?", "o": ["The woman's mother's half-sister.", "The woman's stepson.", "The Crown.", "The woman's stepsister.", "The biological child of the woman's aunt (who predeceased the woman) of the full blood."], "a": "E", "bx": "The correct answer was E. The key here, as is very often the case when answering an MCQ, is to be organised in your approach. The first thing to do is to match the options to the classes set out in Table 5.1. Go through each one in turn. If you do this, you will find that B, the deceased's stepson, and D, the deceased's stepsister, do not appear in the table at all. Any option containing these must therefore be incorrect. This then leaves you with three options: an aunt who is the deceased's mother's half-sister (A), the Crown (C) and the biological child of the deceased's aunt (E). Where do these appear in the table? The first to appear is the aunt's child (in fact, the deceased's cousin), so E must be correct. Although A and C also appear in the table, remember that the first person to appear will take all of the estate."}, {"ch": 4, "n": 6, "sc": ["A woman dies intestate leaving a husband and two adult children. Her estate (excluding personal chattels) is worth £622,000."], "st": "What does her husband receive?", "o": ["The personal chattels, a statutory legacy of £322,000 and half of the remaining £300,000 absolutely.", "A life interest in half of the estate.", "The whole estate.", "The personal chattels and half of the estate.", "A statutory legacy of £322,000 only."], "a": "A", "x": ["Correct. The spouse takes the chattels, the statutory legacy of £322,000 and half of the balance (£150,000) absolutely; the children share £150,000 on the statutory trusts.", "Wrong. Since 2014, the spouse's half of the residue is absolute, not a life interest.", "Wrong. The children are also entitled where there is a spouse and issue.", "Wrong. This misstates the rules.", "Wrong. The spouse also takes the chattels and half of the balance."]}, {"ch": 4, "n": 7, "sc": ["A widower dies intestate, survived by his daughter and by two grandchildren who are the children of his son, who predeceased him."], "st": "How is the estate shared?", "o": ["All to the daughter.", "All to the grandchildren.", "Half to the daughter and the rest to the Crown.", "One half to the daughter and one half shared between the two grandchildren.", "Equally between the daughter and the two grandchildren (one third each)."], "a": "D", "x": ["Wrong. The predeceased son's issue take his share.", "Wrong. The daughter is entitled to her share.", "Wrong. The Crown has no claim.", "Correct. Under the statutory trusts, the predeceased son's share passes to his children equally (per stirpes).", "Wrong. Grandchildren take their deceased parent's share, not an equal share with the daughter."]}, {"ch": 4, "n": 8, "sc": ["A man had lived with his partner for 20 years. They never married or registered a civil partnership. He dies intestate, survived by his partner and his brother. The house was in his sole name."], "st": "Who inherits his estate?", "o": ["The Crown.", "His brother.", "His partner.", "His partner and brother equally.", "His partner takes the house and his brother the rest."], "a": "B", "x": ["Wrong. The brother is entitled, so the Crown takes nothing.", "Correct. In the absence of a spouse, issue or parents, siblings of the whole blood take.", "Wrong. Cohabitees have no entitlement under the intestacy rules.", "Wrong. The partner is not entitled on intestacy.", "Wrong. There is no such rule; the partner may need to consider an Inheritance Act claim."]}, {"ch": 4, "n": 9, "sc": ["A woman dies intestate leaving no spouse and one child aged 16."], "st": "When will the child's interest under the statutory trusts vest absolutely?", "o": ["When the child reaches 25.", "When the child reaches 21.", "When the administrators decide.", "When the child reaches 18 or marries or forms a civil partnership earlier.", "Immediately on the woman's death."], "a": "D", "x": ["Wrong. The age is 18.", "Wrong. The age is 18.", "Wrong. Administrators have no discretion.", "Correct. Under the statutory trusts, issue take on reaching 18 or on earlier marriage or civil partnership.", "Wrong. The child's interest is contingent until the statutory age."]}, {"ch": 4, "n": 10, "sc": ["A man dies intestate, unmarried and without issue. He is survived by his mother, his full brother and his half-sister."], "st": "Who is entitled to his estate?", "o": ["His mother and full brother equally.", "His full brother only.", "His mother.", "His full brother and half-sister equally.", "His half-sister only."], "a": "C", "x": ["Wrong. Parents take to the exclusion of siblings.", "Wrong. Siblings rank after parents.", "Correct. Where there is no spouse or issue, parents take before siblings.", "Wrong. Siblings take only if there is no surviving parent; whole-blood siblings take before half-blood.", "Wrong. Half-blood siblings rank after whole-blood siblings, who rank after parents."]}, {"ch": 5, "n": 1, "sc": ["A woman owned two properties - a cottage and a beach house - together with her spouse. The equity in the cottage was owned by the woman and her spouse as beneficial tenants in common in the shares 65% to the woman and 35% to her spouse. The equity in the beach house was owned by the woman and her spouse as beneficial joint tenants. Two years prior to her death, the woman and her spouse separated and the woman served a valid notice of severance on the spouse with reference to the beach house. The woman died intestate."], "st": "Which of the following answers correctly sets out what part of these interests fell into the woman's estate on death?", "o": ["50% of the interest in the cottage and 50% of the interest in the beach house.", "65% of the interest in the cottage and none of the interest in the beach house.", "65% of the interest in the cottage and 65% of the interest in the beach house.", "None of the interest in the cottage and 65% of the interest in the beach house.", "65% of the interest in the cottage and 50% of the interest in the beach house."], "a": "E", "bx": "The correct answer was E. As there has been valid severance of the joint tenancy, the beach house has now fallen into equal shares of 50% each. The cottage has always been held as a tenancy in common with the woman owning 65% of the equity. A is incorrect because it gives the wrong figure for the cottage. B is wrong because there was valid severance of the beach house. C is incorrect because on severance, the woman could not obtain more than 50% of the equity in the beach house. D is incorrect because the cottage is capable of being passed on."}, {"ch": 5, "n": 2, "sc": ["In the five years prior to death, a deceased person acquired a life interest in an overseas investment fund and a beneficial share (as one of three tenants in common in equal shares) of the funds in a UK bank account. Within the same period, the same deceased person made a lifetime gift of a motor car to his nephew.", "In the year before his death, the deceased person told his nephew that this nephew was to receive his valuable signet ring on his 21st birthday and that until then, the deceased person was holding the ring for him. He also created a trust of the proceeds of his life insurance policy in favour of his cousin.", "The deceased person died leaving a will which did not mention any of these assets specifically."], "st": "Which of the following items fall into the deceased person's estate after death?", "o": ["The deceased's share in the UK bank account.", "The motor car.", "The deceased's life interest in the overseas fund.", "The proceeds of his life insurance policy.", "The signet ring."], "a": "A", "bx": "The correct answer was A. The deceased's share in the UK bank account is a separate share under a tenancy in common and this will fall into residue. B is a valid lifetime gift and cannot fall into the estate. C is a life interest which will end on death and therefore cannot fall into the estate. As a valid trust in favour of the cousin has been created, the proceeds of the life insurance policy will be paid directly to the cousin rather than into the estate, and D is therefore incorrect. In E, the ring is the subject of a valid inter vivos trust and once the formalities have been complied with, as they have here, the property no longer beneficially belongs to the deceased; he was holding it as a bare trustee and now the estate is holding it on the same terms."}, {"ch": 5, "n": 3, "sc": ["A woman is employed as a civilian contractor with a police force and has an occupational pension with that force. Her only living relative is her brother. The woman is, however, very close to her former husband, even though they divorced some time ago. The woman completes a nomination form which she sends to the pension trustees, instructing them to pay any death in service benefit directly to her former husband in the event of the woman's death. The woman dies aged 42 and the lump sum payment due on her death is £150,000. The woman has left a will which was made before her divorce and which leaves all of her estate to her brother and her husband in equal shares."], "st": "Which option best describes what will happen to the lump sum payment?", "o": ["The lump sum payment will not fall into the estate but it will pass to the woman's brother on a partial intestacy.", "The lump sum payment will fall into the estate, but cannot be passed to the woman's former husband because the woman has divorced him since the will was made.", "The lump sum payment will fall into the estate and be paid to the woman's former husband and the brother in equal shares.", "No lump sum payment can be made because it is not possible to nominate a former spouse.", "The lump sum payment will not fall into the estate and will pass directly to the woman's former husband."], "a": "E", "bx": "The correct answer was E. The woman is entitled to nominate any person to receive the payment: she does not have to nominate relatives or a current spouse. If there is a nomination, the lump sum cannot fall into the estate, so B and C must be wrong. There is a valid will here and a valid nomination, so there is no possibility of even a partial intestacy; A is therefore wrong. Finally, as this is a nomination and not a will, divorce does not invalidate the gift, so D is wrong."}, {"ch": 5, "n": 4, "sc": ["A farmer is fatally injured by a fall from the roof of a barn. Knowing that he is dying, the farmer takes from his pocket the key to a safe in the farm office and says to his niece, who has worked with him for over ten years, 'Take this key and keep it. Everything inside is yours now'. The farmer loses consciousness and dies shortly afterwards. The farmer dies intestate, leaving a spouse but no children. At his death, he owned the farmhouse, which was registered land, and two large parcels of agricultural land, one of which was unregistered and one of which was registered. When the niece opens the safe, she finds inside the keys to the farmhouse, the title deeds to the unregistered fields, and an office copy of the Land Register entry for the registered fields."], "st": "Which of the following correctly identifies the legal position in this case?", "o": ["The farmer's niece owns all of the registered and unregistered land through the gift made in contemplation of death and none of it passes into the estate.", "The farmer's niece owns the unregistered fields and the registered fields but does not own the farmhouse.", "The farmer's niece owns the unregistered land through the gift made in contemplation of death but the registered land falls into the estate.", "The farmer's niece owns the registered land through the gift made in contemplation of death but the unregistered land falls into the estate.", "Although the gift is valid as it was made in contemplation of death, the farmer's niece cannot inherit anything because under the intestacy rules, all of the farmer's property must pass to his spouse."], "a": "B", "bx": "The correct answer was B. The farmer reasonably believed that death was imminent, made his intention clear and made a constructive delivery of everything in the safe by passing on the key to his niece. As it is possible to make a gift of unregistered land by passing on the title deeds to the land, the niece acquired ownership of the unregistered land (so D must be incorrect). For registered land, it is possible to make a deathbed gift by passing control of the property in the form of Land Certificates or Office Copies of the property's entry in the Land Register. However, it is not possible to make a deathbed gift of land by passing on only the keys of the property. The safe contains the Office Copies of the registered land, so these can pass by way of deathbed gift. But the safe only contains the keys of the farmhouse. As keys will not suffice to pass ownership of the farmhouse, A and C must be incorrect. Note that E is also incorrect: the rules of intestacy can only apply to property in the estate, and the whole point of gifts donatio mortis causa is that they never become part of the estate."}, {"ch": 5, "n": 5, "sc": ["A solicitor takes will instructions from a client. The client tells the solicitor that she owns two properties jointly with her mother, a house and a villa. The client tells the solicitor that she wants to leave her share in the house to her sister and her share in the villa to her mother. The solicitor does not ask the client whether the client's beneficial interest in either property is a joint tenancy or a tenancy in common, but drafts the will according to the client's instructions. The client then executes the will, which is formally valid. After the client's death, it is discovered that the client owned the house as a beneficial joint tenant with her mother and the villa as a beneficial tenant in common with her mother in equal shares. The client is survived by both her mother and her sister."], "st": "How will the property be owned after the client has died and the executed will is put into effect?", "o": ["The clauses in the will respecting the properties are of no effect and there is a partial intestacy of the client's shares.", "The client's mother acquires all of the equity in the house by survivorship and inherits the client's share of the villa.", "The client's mother inherits the client's share of the equity in both properties.", "The client's sister inherits a half-share in the house and in the villa.", "The client's mother inherits a half-share in the house and acquires all of the equity in the villa by survivorship."], "a": "B", "bx": "The correct answer was B. This is because any attempt to will away an interest under a joint tenancy has no effect. As a result, the clause leaving the client's 'share' to her sist
