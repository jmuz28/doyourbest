 not correctly identify the usual notice period for processions.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 6"}, {"ch": 0, "n": 76, "sc": ["A sole trader has sought advice from a solicitor to assist them in assessing their liability to income tax."], "st": "Which of the following can the sole trader exclude from their calculation of their total income for this purpose?", "o": ["Profits from share of partnership business.", "Dividends received from a public limited company.", "Profit from sale of business premises.", "Interest on savings with a building society.", "Money received as a result of renting out a property."], "a": "C", "bx": "The correct answer was C. This is because options A, B, D and E all represent sources of income that can be excluded from the calculation. As option C would attract Capital Gains Tax, the profit cannot be so excluded.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 8"}, {"ch": 0, "n": 77, "sc": ["A solicitor is preparing a legal contract for their client who is engaging in the sale of goods with a company. The contract includes a dispute resolution clause that requires any disputes between the client and the company to be resolved through arbitration rather than through court proceedings. The solicitor considers this clause to be disadvantageous to their client's interests."], "st": "Which of the following most accurately describes the action that the solicitor should take?", "o": ["The solicitor should amend the dispute resolution clause without informing their client.", "The solicitor should proceed with the contract without amending the dispute resolution clause or informing their client.", "The solicitor should inform their client of the potential drawbacks of the dispute resolution clause and take instructions on how to proceed.", "The solicitor should proceed with the contract without amending the dispute resolution clause and inform their client after the fact.", "The solicitor should amend the dispute resolution clause and inform their client after the fact."], "a": "C", "bx": "The correct answer was C. This is because the SRA Code of Conduct requires solicitors to act in the best interests of the client. The SRA Code of Conduct requires a solicitor to make the client aware of all information material to the matter of which they have knowledge. None of the exceptions to this rule apply, meaning that the client should be informed of the disadvantages of the dispute resolution clause (option A is therefore incorrect). The most appropriate action, therefore, is to inform the client of the potential drawbacks and seek instructions on how to proceed. Option B is incorrect as the solicitor must act in the best interests of the client, and the client must be informed of the drawbacks of the dispute resolution clause. Options D and E are incorrect as the information to the client must come before action is taken, and not after.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 1"}, {"ch": 0, "n": 78, "sc": ["A defendant is served with a claim form and particulars of claim. There are some inconsistencies between the nature of the allegations made and facts put forward in the brief details of claim on the claim form and the particulars of claim."], "st": "Which of the following best represents how the defendant should proceed?", "o": ["The defendant should deny all allegations in the particulars of claim that they do not admit. The burden of proof is on the claimant to prove the allegations stated.", "The defendant should deny all allegations in the claim form that they do not admit. The burden of proof is on the claimant to prove the allegations stated.", "The defendant should ignore any allegations that are inconsistent between the two documents. The burden of proof is on the claimant to prove the allegations stated.", "The defendant should admit or deny the allegations in the particulars of claim that are within their sphere of knowledge and submit non-admissions against the remainder, dealing with allegations that are inconsistent between the two documents. The defendant should state that the claimant is required to prove the allegations that are the subject of the non-admissions.", "The defendant should admit or deny the allegations in the claim form that are within their sphere of knowledge and submit non-admissions against the remainder. The defendant should state that the claimant is required to prove the allegations that are the subject of the non-admissions."], "a": "D", "bx": "The correct answer was D. This is because the defendant should deal principally with the allegations that are made in the particulars of claim in his defence, but draw attention to inconsistencies between the two documents where appropriate (thus options C and E are incorrect). Although the burden of proof is on the claimant, the defendant should not just deny everything as this implies that he has knowledge of the facts (making options A and B incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 5"}, {"ch": 0, "n": 79, "sc": ["A client is a company which is facing increasing pressure from their creditors. The board of directors is concerned about making payments to creditors that an insolvency practitioner would later look to overturn."], "st": "Which of the following represents the best advice as to what an insolvency practitioner must look for in assessing whether a payment can be set aside?", "o": ["An insolvency practitioner must look for whether the recipient of the payment is a connected person.", "An insolvency practitioner must look for whether the payment was made within six months of the date of the insolvency.", "An insolvency practitioner must look for whether it is possible to establish or presume a desire to prefer the recipient.", "An insolvency practitioner must look for whether the payment was actuated by proper commercial considerations.", "An insolvency practitioner must look for whether the recipient is put in a better position as a result of the payment."], "a": "C", "bx": "The correct answer was C. This is because in order to successfully apply to have a payment set aside on the grounds that it was a preference payment, it must be possible to establish or presume a desire to prefer. Option A is not a requirement. If option D is present, the payment is less likely to be set aside, particularly if it was made as a result of a threat of insolvency proceedings. Whilst options B and E may be present they are not essential, particularly if the payment was made to a connected person.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 6"}, {"ch": 0, "n": 80, "sc": ["A married couple formed a partnership with a friend to start a new business. However, soon afterwards, the friend entered into a contract on behalf of the partnership for business equipment that was superfluous to requirements."], "st": "Which of the following statements best represents the likely position of the partnership?", "o": ["The partnership cannot be liable for the actions of the friend.", "The partnership will be liable for the actions of the friend who acted with ostensible authority.", "The partnership will be liable for the actions of the friend if the friend acted with actual authority.", "The partnership cannot be liable for the actions of the friend unless all three partners agreed to the contract.", "The partnership will be liable for the actions of the friend who acted with implied authority."], "a": "B", "bx": "The correct answer was B. This is because option A is too vague in that it does not fully explore the circumstances in which the partnership may be liable for the actions of the friend. Options C and D are incorrect statements as liability can arise in ways other than actual authority or all three partners agreeing. This is not an example of implied authority, therefore option E is incorrect.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 2"}, {"ch": 0, "n": 81, "sc": ["A claimant issues proceedings against a defendant for breach of contract. The losses claimed are £225,000. The defendant files a defence. Shortly after the defence is filed, the claimant discovers from a friend who frequents the defendant's local pub that the defendant is seeking to transfer their house, their only asset, to their son for a fraction of its market value."], "st": "Which of the following best represents the steps the claimant should take?", "o": ["The claimant should apply for a freezing injunction with notice. The defendant is entitled to the opportunity to explain their position to the court.", "The claimant should apply for a freezing injunction with notice. A court hearing will be scheduled quickly, and the defendant will not have sufficient time to dispose of the asset before the hearing.", "The claimant cannot do anything. The defendant is free to deal with their property howsoever they wish.", "The claimant should apply for a freezing injunction without notice. The claimant has sufficient evidence to show that there is a real risk of the defendant attempting to dispose of assets in order to avoid payment of any judgment sum.", "The claimant should apply for a freezing injunction without notice. A with-notice application runs the risk that a court hearing will not be scheduled sufficiently quickly, allowing the defendant to dispose of the asset before the hearing."], "a": "D", "bx": "The correct answer was D. This is because the test for a freezing injunction is whether there is a real risk of the defendant dissipating assets (therefore option E is incorrect), and it is appropriate to apply for a without notice hearing, given the risk of swift disposal if the defendant were to find out that a freezing injunction had been applied for (making options A and B incorrect). The evidence also suggests that the defendant is trying to transfer the asset to avoid payment of any judgment sum (therefore option C is incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 6"}, {"ch": 0, "n": 82, "sc": ["The claimant suffers personal injury when a necessary medical procedure is performed negligently. The defendant has conceded liability and admitted negligence. The claimant seeks to claim for loss of earnings, care expenses and DIY costs. Due to the defendant's negligence, the claimant loses the use of their left hand. The claimant was a delivery driver and has been retained by their employer as a customer services operative due to their long-term injuries. The claimant also wants to claim the cost of haircuts (two per year for the next 40 years) due to the accident, as they are now in a customer facing role and feel their appearance is more important. The client has established hair loss."], "st": "Which of the following best describes the court's likely view of the claimant's claim in relation to the haircuts?", "o": ["The court is likely to award an amount but will reduce it by a percentage depending on the claimant's life expectancy.", "The court will only award damages for future haircutting costs if it is evidenced by a hairdressing specialist.", "The court will not award any damages for haircutting costs as the claimant would need haircuts in any event and the cost is not as a consequence of the accident.", "The court will not award any damages for haircutting costs as the claimant did not need to change their job due to the accident.", "The court is likely to award an amount for haircuts but reduce it by a significant amount due to the claimant's established hair loss."], "a": "C", "bx": "The correct answer was C. This is because the requirement for more haircuts is a choice and not a consequence of the accident or the defendant's negligence. Options A and B are incorrect because the court will not award an amount of damages for this head of loss. Option D is incorrect because the client did need to change their job due to the accident. Option E is incorrect because the increased frequency of haircuts is not as a direct effect of the defendant's negligence.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 3"}, {"ch": 0, "n": 83, "sc": ["A Bill has been passed by Senedd Cymru. The Bill is controversial, and some members of the UK Parliament have raised concerns about whether it is within Senedd Cymru's legislative competence."], "st": "Which of the following statements most accurately describes the steps that may be taken to determine whether the Bill is within Senedd Cymru's legislative competence?", "o": ["The Counsel General alone has the power to refer a Senedd Bill to the Supreme Court for a decision on whether it is within Senedd Cymru's legislative competence.", "The Counsel General alone has the power to determine whether a Senedd Bill is within Senedd Cymru's legislative competence.", "Both the Counsel General and the Attorney General have the power to refer a Senedd Bill to the Supreme Court for a decision on whether it is within Senedd Cymru's legislative competence.", "The Attorney General alone has the power to refer a Senedd Bill to the Supreme Court for a decision on whether it is within Senedd Cymru's legislative competence.", "The Attorney General alone has the power to determine whether a Senedd Bill is within Senedd Cymru's legislative competence. s"], "a": "C", "bx": "The correct answer was C. This is because both the Counsel General and the Attorney General have the power to refer a Bill of the Senedd, or a provision within such a Bill, to the Supreme Court for a decision on whether it is within Senedd Cymru's legislative competence. Option A is incorrect because it does not acknowledge that the Attorney General has this power, and Option D is incorrect because it does not acknowledge that the Counsel General has this power. Options B and E are incorrect because they state that the Counsel General/Attorney General have the power to decide whether a Bill is within Senedd Cymru's legislative competence, which is not true.", "ar": "Legal system of England and Wales", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 9"}, {"ch": 0, "n": 84, "sc": ["A large group of animal rights protestors are taking part in a demonstration outside a fashion store that sells real animal furs. The store is located on a very narrow street in a city centre. The demonstration quickly becomes chaotic. The police are concerned that the demonstration may be out of control and may lead to serious disorder. As such, the police wish to instruct the protestors to move their demonstration to a wider nearby street."], "st": "Which of the following statements most accurately describes the power of the police?", "o": ["The police may instruct the protestors to move their demonstration where there is a reasonable belief that the demonstration may result in serious disorder.", "The police do not have the power to instruct the protestors to move their demonstration unless a public order offence has been committed.", "The police may instruct the protestors to move their demonstration where they believe it is reasonable and necessary.", "The protestors enjoy an absolute right to freedom of assembly so the police cannot instruct the protestors to move their demonstration.", "The police may only instruct the protestors to move their demonstration where appropriate notice is given to the protestors."], "a": "A", "bx": "The correct answer was A. This is because the police have the power to impose conditions on protestors (ie, instruct the protestors to move their demonstration) where there is a reasonable belief that the demonstration may result in serious disorder (option D is therefore incorrect). Option B is incorrect because the police may impose conditions before a public order offence has been committed, providing there is a reasonable belief that the demonstration may result in serious disorder. Option C is incorrect because it misstates the threshold for imposing a condition. Option E is incorrect because notice of such conditions does not need to be given in advance of the protest.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 6"}, {"ch": 0, "n": 85, "sc": ["The claimant is a passenger in the defendant's vehicle. One evening the claimant meets the defendant in a local public house and drinks alcohol with the defendant over a number of hours. Later that evening, the defendant offers to drive the claimant home. The claimant accepts and, during the drive, the defendant loses control of the car, causing a collision. The defendant is killed and the claimant is seriously injured."], "st": "Which of the following best describes the legal position?", "o": ["Any claim for damages will be defeated by the defence of consent due to the fact that the claimant consented to the defendant driving them home when they knew the defendant had been drinking alcohol.", "Damages for personal injury will be awarded to the claimant but there will be a reduction of 20% for contributory negligence due to the fact that the claimant knew the defendant was intoxicated.", "The court will only award damages for personal injury if the court is satisfied that but for the defendant's negligence the claimant would not have been injured.", "The defence of consent cannot be relied upon as any acceptance by a passenger of the risk associated with an intoxicated driver is invalid.", "The claimant is unable to bring a claim for personal injury against the defendant or their estate as the defendant is deceased."], "a": "D", "bx": "The correct answer was D. This is because an acceptance of risk by a passenger is invalid; this means that the defence of consent would fail. Option A is incorrect because a passenger is unable to consent as their consent to the risk is invalid. Option B is incorrect because the court would only consider contributory negligence once primary liability had been established and this will not be the case here. Option C is incorrect because the claimant is unable to consent to the risk even though the accident is caused by the defendant's negligence. Option E is incorrect because even though the defendant is deceased, a claim in negligence could be brought against the defendant's estate.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 4"}, {"ch": 0, "n": 86, "sc": ["A claimant commences proceedings against a defendant for breach of contract. The defendant defends the proceedings but fails to deny any of the claim's legal bases or facts advanced in the particulars of claim."], "st": "Which of the following best represents how the claimant should proceed?", "o": ["The claimant should file a reply to the defence, indicating to the court that the defendant has failed to deny either the legal basis of the claim or the material facts upon which the claim is based.", "The claimant should make an application for summary judgment on the basis that the defendant has failed to deny either the legal basis of the claim or the material facts upon which the claim is based and therefore has no real prospect of successfully defending the claim or that there is no compelling reason why the claim should proceed to trial.", "The claimant should make an application for summary judgment on the basis that the defendant has failed to deny either the legal basis of the claim or the material facts upon which the claim is based and therefore has no real prospect of successfully defending the claim and there is no other compelling reason why the claim should proceed to trial.", "The claimant should make an application for default judgment on the basis that the defendant has failed to deny either the legal basis of the claim or the material facts upon which the claim is based and therefore has no real prospect of successfully defending the claim or that there is no compelling reason why the claim should proceed to trial.", "The claimant should make an application for default judgment on the basis that the defendant has failed to deny either the legal basis of the claim or the material facts upon which the claim is based and therefore has no real prospect of successfully defending the claim and there is no other compelling reason why the claim should proceed to trial."], "a": "C", "bx": "The correct answer was C. This is because a reply to the defence would not be appropriate here as this would simply allow the defence, which on the face of it is wholly lacking in substance, to continue (making option A incorrect). An application for default judgment would only be applicable if the defendant had failed to either acknowledge service or defend the claim, which is not the case here (therefore options D and E are incorrect). To be successful in an application for default judgment, the claimant must prove that the defendant has no real prospect of successfully defending the claim and that there is no compelling reason why the claim should proceed to trial (therefore, option B is incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 6"}, {"ch": 0, "n": 87, "sc": ["A solicitor is acting on behalf of the executors of an estate. The estate comprises a range of assets, which include shares. The executors explain that they need to sell some of the shares so that they are able to make a distribution. The solicitor duly begins to arrange the sale of the shares."], "st": "Which of the following best describes the solicitor's position in respect of compliance with financial services legislation?", "o": ["The solicitor may not act in the sale of the shares unless they seek authorisation from the Financial Conduct Authority.", "The solicitor may act in the sale of the shares because an exclusion would be applicable.", "The solicitor may act in the sale of the shares providing the firm they work for is regulated by the Financial Conduct Authority.", "The solicitor may act in the sale of the shares because legal service providers are classified as authorised persons under financial services legislation.", "The solicitor may not act in the sale of the shares because none of the exclusions would be applicable in these circumstances."], "a": "B", "bx": "The correct answer was B. This is because the solicitor is acting in the sale of the shares in order to wind up the estate and allow the executors to make a distribution. This type of work is permissible because an exclusion from the general prohibition would apply. Options A and C are incorrect because the solicitor may only engage in such activities where an exclusion applies. Option D is incorrect because legal service providers are not classified as authorised persons under financial services legislation. Option E is incorrect because it fails to acknowledge that the nature of the solicitor's work would be covered by an exclusion.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 7"}, {"ch": 0, "n": 88, "sc": ["A claimant makes an application for summary judgment against the defendant on the basis that the defence has no real prospect of success. At the hearing, the defendant is able to persuade the court that there is an extremely slim possibility that their defence is more than imaginary."], "st": "Which of the following best describes the order that the court is most likely to make?", "o": ["The court will likely make a conditional order, requiring the defendant to file a proper defence setting out their legal and factual position within 14 days of the date of the hearing.", "The court will likely order judgment on the claim on the basis that both grounds have been made out by the claimant and the overriding objective states that cases should be dealt with at proportionate cost.", "The court will likely order judgment on the claim on the basis that the defendant's prospect of successfully defending the claim is still close to imaginary.", "The court will likely dismiss the claimant's application as they have failed to prove both of the required grounds under the Civil Procedure Rules 1998.", "The court will likely make a conditional order, requiring the defendant to file a proper defence setting out their legal and factual position within 28 days of the date of the hearing."], "a": "A", "bx": "The correct answer was A. This is because if the court is persuaded at the hearing that the defendant has even slightly more than a fanciful chance of successfully defending the claim, rather than dismiss the application outright (making option D incorrect) or giving judgment on the claim (making options B and C incorrect), they will make a conditional order requiring the defendant to file a proper defence setting out their legal and factual position within 14 days of the date of the hearing (therefore option E is incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 6"}, {"ch": 0, "n": 89, "sc": ["A business entered into a contract with a manufacturer. Under the contract, the manufacturer was to supply an electricity generator to the business. The contract stated the delivery date as 1 May. to a shortage of delivery drivers, the generator was delivered ten days late. The late delivery caused the business £10,000 loss of ordinary business profit. The business could have hired a replacement generator in the meantime, which would have reduced its loss by 50%, but the business did not want to spend any further money."], "st": "In a claim for breach of contract, which of the following statements best describes the damages the business is likely to recover from the manufacturer?", "o": ["The business could recover the actual loss caused by the breach of contract, as the loss was a natural consequence of the breach.", "The business could only recover those damages that were in the reasonable contemplation of the defendant at the time the contract was formed.", "The business could recover the actual loss, subject to an appropriate deduction if the business failed to reasonably mitigate its loss.", "The business could recover damages representing their loss of expectation.", "The business could recover damages that were reasonably foreseeable by the manufacturer."], "a": "C", "bx": "The correct answer was C. This is because the loss appears to be normal loss resulting from the breach of contract. As such, this loss will be recoverable as it would be reasonably contemplated by the manufacturer. However, this is subject to the general duty of the business to take reasonable steps to mitigate its loss. As a replacement generator was available, the court may decide to reduce the award appropriately in light of any failure of the business to mitigate its loss. Option A is incorrect as it recognises the general test of remoteness, but it does not mention the general duty of mitigation. Option B is incorrect as whilst it shows an awareness of the test of remoteness of damage, it fails to recognise that the business could have taken reasonable steps to mitigate their loss. Option D is incorrect as this is a general statement about the measure of damage for breach of contract. It does not reference the test of remoteness or the duty to mitigate. Option E is incorrect as the test of reasonable foreseeability is the test of remoteness in the law of tort (see Revise SQE: Tort Law), which is not the appropriate test in a claim for breach of contract.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 10"}, {"ch": 0, "n": 90, "sc": ["A solicitor is acting for a claimant in a personal injury dispute. At trial, the claimant's medical expert witness gives evidence that exaggerates the extent of the claimant's injuries."], "st": "Which of the following best describes the course of conduct that the solicitor should take?", "o": ["The solicitor should take no action; it is not the solicitor's responsibility to control what the witness says.", "The solicitor should speak to the medical expert witness after the proceedings and advise them that their evidence was exaggerated.", "The solicitor should inform the court of the exaggeration in the medical evidence.", "The solicitor should advise the claimant to find a new medical expert witness for future court appearances.", "The solicitor should ask the medical expert witness to provide a more accurate assessment of the claimant's injuries."], "a": "C", "bx": "The correct answer was C. This is because the SRA Code of Conduct requires solicitors to ensure that they do not mislead or attempt to mislead their clients, the court or others, either by their own acts or omissions or allowing or being complicit in the acts or omissions of others (including their client). If the solicitor were to allow the evidence of the medical expert witness to go unchanged, the solicitor would be misleading the court (therefore option A is incorrect). Option B is incorrect as whilst it is appropriate to speak to the expert and advise them that their evidence was exaggerated, that does not resolve the situation faced by the solicitor: they would still be misleading the court if they did not correct the position. Option D is incorrect as it does not resolve the issue that the court in the current proceedings has been misled. Whilst option E is correct, in that the medical expert witness should be asked to provide a more accurate assessment of the injuries, the court must first be informed that the original evidence was exaggerated. Otherwise, the court would have still been misled.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 1, "n": 1, "sc": ["A claimant commences proceedings against a defendant for the sum of £21,000, inclusive of £3,500 in interest. In the defendant's defence, they admit to owing the claimant the sum of £8,500 but deny owing the remainder."], "st": "Which of the following best represents the position the court will likely adopt when allocating the claim to an appropriate track?", "o": ["The court is likely to allocate the claim to the fast track on the basis that its financial value is below £25,000.", "The court is likely to allocate the claim to the fast track on the basis of its complexity.", "The court is likely to allocate the claim to the small claims track on the basis that its financial value is below £10,000.", "The court is likely to allocate the claim to the small claims track on the basis of its complexity.", "The court is likely to allocate the claim to the small claims track on the basis that the trial will last less than half a day."], "a": "C", "bx": "The correct answer was C. This is because the value in dispute is actually £9,000 once the interest and the amount admitted are taken into consideration, which makes the claim suitable for the small claims track (therefore, options A and B are incorrect). The court considers value primarily when allocating a claim, making C the best answer and ruling out options D and E.", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 7"}, {"ch": 1, "n": 2, "sc": ["A solicitor is dealing with an estate that includes company shares, gilts and investment property."], "st": "Which of the following statements most accurately describes the assets in the estate?", "o": ["The company shares, gilts and investment property are classified as specified investments under financial services legislation.", "None of the assets listed are classified as specified investments under financial services legislation.", "Only the company shares and investment property are classified as specified investments under financial services legislation.", "Only the gilts and investment property are classified as specified investments under financial services legislation.", "Only the company shares and gilts are classified as specified investments under financial services legislation."], "a": "E", "bx": "The correct answer was E. Specified investments are defined in financial services legislation. The legislation lists shares and gilts as specified investments. Investment property is not classified as a specified investment under the legislation. Options A, B, C and D are incorrect because they do not accurately identify which of the assets are classified as specified investments under financial services legislation.", "ar": "Legal services", "see": ""}, {"ch": 1, "n": 3, "sc": ["A shareholder is planning to transfer their shares in a company to a third party. This third party wishes to ensure that the necessary formalities to transfer the legal ownership of the shares are complied with."], "st": "Which of the following is the final step to be taken if the third party is to become the legal owner of the shares?", "o": ["The name of the recipient is entered into the Register of Members.", "There is a board resolution to approve the transfer.", "A Confirmation Statement is filed with Companies House.", "The articles of association must be checked for any restrictions on transfer.", "The Stock Transfer Form is sent to the Stamp Office."], "a": "A", "bx": "The correct answer was A. This is because option E will happen first, then (option D) the articles should be checked, after which the directors may approve the transfer (option B) by board resolution. Then, as in option A, the recipient can be entered on the Register. Filing of Form CS01 does happen after the transfer but it does not affect the legal ownership.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 5"}, {"ch": 1, "n": 4, "sc": ["During the negotiations for the purchase of a coffee shop, the seller stated that there were no other coffee shops within a five-mile radius of the business. Shortly after the sale was concluded, the buyer discovered that there were in fact two coffee shops within a five-mile radius. Keen to make a success of the business, the buyer conducted a promotional campaign and lowered the prices of all products sold by the coffee shop. months after the promotional campaign, the coffee shop was still losing money and the buyer brought a claim for misrepresentation against the seller and rescission of the contract."], "st": "If successful in the claim for misrepresentation, can the buyer rescind the contract?", "o": ["No, as rescission is only available for a fraudulent misrepresentation, and there is no overt evidence of fraud on the facts.", "No, as the statement by the seller did not induce the buyer to purchase the coffee shop.", "Yes, as rescission is generally available for all types of misrepresentation.", "No, as upon discovering the truth of the misrepresentation, the buyer has affirmed the contract.", "Yes, as the seller sought to rescind the contract within a reasonable time."], "a": "D", "bx": "The correct answer was D. This is because the remedy of rescission is an equitable remedy and is subject to several bars. If upon discovering the truth of the misrepresentation, the claimant acts so as to accept the misrepresentation, the court is likely to determine that the contract is affirmed and the claimant will be barred from claiming rescission. By running the promotional campaign and lowering prices, the buyer is likely to have affirmed the contract. Option A is incorrect as rescission is generally available for all types of mispresenting, providing that the elements of an actionable misrepresentation are established. The question requires you to respond on the basis that the claim for misrepresentation is successful. The statement must have induced the contract in order for the statement to be actionable and for the claim to be successful (therefore, option B is incorrect). Option C is a broadly correct statement, but it does not recognise that rescission is at the court's discretion, subject to a number of bars (it is therefore incorrect). It is true that a lapse of time may bar a claim for rescission. However, a lapse of time of over six months from the seller discovering the truth of the misrepresentation is unlikely to be reasonable. It also does not take account of any affirmation by the buyer (option E is therefore incorrect).", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 10"}, {"ch": 1, "n": 5, "sc": ["A solicitor is dealing with a case in the Court of Appeal. The Court of Appeal reached its decisions by distinguishing it from the Supreme Court."], "st": "Which of the following statements most accurately describes the status of the Supreme Court authority?", "o": ["The effect of the Court of Appeal decision is that the Supreme Court authority remains good law and may be followed by inferior courts.", "The effect of the Court of Appeal decision is that the Supreme Court authority is now persuasive precedent rather than a binding precedent.", "The effect of the Court of Appeal decision is that the Supreme Court authority was overturned and may not be relied on in future cases. suonsonb", "The effect of the Court of Appeal decision is that the Supreme Court authority remains a binding precedent on all inferior courts.", "The effect of the Court of Appeal decision is that the Supreme Court authority is no longer good law."], "a": "D", "bx": "The correct answer was D. This is because the Court of Appeal distinguished itself from the Supreme Court. This means the Court of Appeal did not apply the Supreme Court authority because it believed the case facts were materially different from those of the instant case. The Supreme Court's decision remains a precedent which is binding of all inferior courts (options B, C and E are therefore incorrect). Option A is incorrect because it implies that inferior courts may choose not to apply the Supreme Court authority, which is not accurate.", "ar": "Legal system of England and Wales", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 4"}, {"ch": 1, "n": 6, "sc": ["A man purchased a second-hand motorcycle from a woman. The woman stated that the motorcycle was a 2015 model. Shortly after the purchase, the man discovered that the motorcycle was a 2005 model, and as such was worth considerably less than he paid. The man brings a claim for misrepresentation against the woman."], "st": "What are the key elements of an actionable misrepresentation in the law of contract?", "o": ["A fraudulent statement that results in loss or damage.", "A false statement of fact that induces another party to enter into a contract.", "A false statement of fact or opinion that induces another party to enter into a contract.", "A misleading statement of opinion that was made negligently or recklessly and was reasonably relied upon by the other party.", "A false statement, the truth of which could not reasonably have been discovered by the other party."], "a": "B", "bx": "The correct answer was B. This is because only a false statement of fact that induces the contract will give rise to an actionable misrepresentation. Option A is incorrect as it is not a requirement of an actionable misrepresentation, in the law of contract, that a statement was made fraudulently. This statement also fails to identify that only a false statement of fact can give rise to an actionable misrepresentation. Option C is incorrect as a statement of opinion is generally not actionable for misrepresentation in the law of contract. Option D is incorrect as this statement fails to identify that only a false statement of fact, not opinion, will give rise to an actionable misrepresentation in the law of contract. Option E is incorrect as an opportunity to discover the truth or verify the statement will not generally release the maker of the statement from liability. The statement also fails to identify that the false statement must be one of fact to be actionable.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 9"}, {"ch": 1, "n": 7, "sc": ["A solicitor represents a client in a small claims court. During the trial, the District Judge asks the solicitor a question to which the solicitor does not know the answer. In response, the solicitor provides a lengthy and irrelevant explanation, causing the trial to go on longer than necessary."], "st": "What should the solicitor do in this situation?", "o": ["The solicitor should continue to provide a lengthy and irrelevant answer to the District Judge's question unless they think of the correct answer to give.", "The solicitor should apologise to the District Judge, explain that they do not know the answer to the question, and request a brief adjournment to research the answer.", "The solicitor should give an answer to the District Judge that they know to be incorrect in order to avoid wasting court time.", "The solicitor should apologise to the District Judge, explain that they do not know the answer to the question.", "The solicitor should cease to act for the client."], "a": "B", "bx": "The correct answer was B. This is because the SRA Code of Conduct requires solicitors not to waste the court's time. By providing a lengthy and irrelevant answer, the solicitor has already wasted the court's time. Option A is incorrect as the solicitor would continue to waste the court's time should they adopt that approach. Option C is incorrect as the solicitor would also be misleading the court by providing an answer that they know to be incorrect. Whilst option D is correct, in that the solicitor should be honest with the District Judge, the solicitor is best advised to seek a short adjournment to ensure that the court is aware of the correct position and to ensure that the solicitor acts in the best interests of the client. Option E is incorrect as the solicitor would not be acting in the best interests of the client by ceasing to act.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 1, "n": 8, "sc": ["An Act of Parliament ('the Acf) has recently been enacted, receiving Royal Assent on 21 January 2023."], "st": "Following the short title of the Act, the following words are present: 'The Act includes a specific commencement date of 11 March 2023 but the commencement date for section 1 of the Act is yet to be appointed.' Which of the following statements most accurately describes the day on which the Act comes into force?", "o": ["All sections of the Act came into force on the date it received Royal Assent.", "Most sections of the Act came into force on the commencement date but section 1 of the Act will only come into effect when it has been enacted by a statutory instrument.", "All sections of the Act came into force on the enactment date.", "Most sections of the Act came into force on the commencement date but section 1 of the Act will only come into effect when it has been enacted by the enacting formula.", "All sections of the Act came into force on the commencement date."], "a": "B", "bx": "The correct answer was B. This is because statutes that include a specific commencement date come into effect on the date specified in the commencement provision. In some cases, the commencement provision only brings specific parts of the Act into effect because some sections have a commencement date that is 'yet to be appointed' and those provisions must be brought into effect through a statutory instrument. The information provided states that the commencement date for section 1 of the Act is 'yet to be appointed'. This means that section 1 will come into effect when a statutory instrument has been enacted to bring it into effect. Statutes that do not include a commencement provision usually come into effect on the date the Act received Royal Assent. The Act includes a commencement provision that determines how and when the Act comes into effect (therefore, options A and C are incorrect). The enacting formula does not impact when or how an Act of Parliament comes into effect (therefore, option D is incorrect). Option E is incorrect because it states that the whole Act comes into effect on the commencement date. The enacting formula is a short paragraph of text, which precedes the main provisions in the statute.", "ar": "Legal system of England and Wales", "see": ""}, {"ch": 1, "n": 9, "sc": ["The claimant and defendant are breaking into a bank vault. In order to remove the door of the bank vault to access the gold bullion stored in the bank, the defendant uses dynamite to blow the locks off the door of the vault. The defendant fails to tell the claimant that they intend to use explosives and as a result the claimant is seriously injured in the explosion that ensues."], "st": "What is the likely view of the court in respect of the claimants claim for personal injury against the defendant?", "o": ["The court is unlikely find the defendant at fault as the claimant consented to trying to steal from the bank.", "The court is likely to find the defendant at fault due to their negligent actions.", "The court is unlikely to find the defendant at fault as the claimant's injuries are not directly connected to the defendant's actions.", "The court is likely to find the defendant at fault but reduce the claimant's damages in respect of contributory negligence.", "The court is unlikely to find the defendant at fault as there is a very close connection between the illegal activity of breaking into the bank and the claimant's injury suffered as a result."], "a": "E", "bx": "The correct answer was E. This is because there is a connection between the defendant's actions and the claimant's injuries, and it would be adverse to public policy to allow the claimant to be awarded damages for their injuries. Option A is incorrect because the claimant did not consent to their injuries. Option B is incorrect because although the injuries are caused by the defendant's negligence, it is contrary to public policy to allow the claimant to succeed in an action for personal injury. Option C is incorrect because the claimant's injuries are directly connected to the defendant's actions. Option D is incorrect because in order for contributory negligence to attach, the defendant would have to be found primarily liable and this is not the case here.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 4"}, {"ch": 1, "n": 10, "sc": ["A supplier of food packaging had a contract to supply packaging to a retail business. The retail business was the supplier's most valuable customer, accounting for approximately 80% of the supplier's business. The supplier entered into a contract with a haulage company. The haulage company agreed to deliver goods from the supplier to the retail business. One day before the delivery was due to take place, the haulage company informed the supplier that they would not make the delivery as the terms of the contract did not provide the haulage company with sufficient profit. The haulage company demanded an additional 40% of the contract price from the supplier. If the supplier did not agree, then the haulage company would not make the delivery as scheduled. Fearing that late delivery would irrevocably damage the ongoing relationship with the retail business, a loss that the supplier could not withstand, and unable to find another company to make the delivery, the supplier agreed to pay the additional amount. The haulage company made the delivery as agreed and claimed the additional 40% from the supplier. The supplier refused to pay the additional amount."], "st": "In a claim by the haulage company against the supplier for the additional amount, which of the following best describes the most likely outcome?", "o": ["The supplier is not bound by their promise of the additional 40% as this was not supported by consideration.", "The supplier is bound by their promise of the additional 40% as the haulage company, by making the delivery on time, conferred a practical benefit to the supplier.", "The supplier is bound by their promise of the additional 40% as the supplier avoided the disbenefit of breaching their contract with the retail customer.", "The supplier is bound by their promise of the additional 40% as damages would provide them with an adequate legal remedy.", "The supplier is not bound by their promise of the additional 40% as, in the circumstances, the supplier had no realistic alternative but to promise the additional amount."], "a": "E", "bx": "The correct answer was E. This is because the facts are likely to amount to economic duress being applied by the haulage company to the supplier. In such cases, the courts will not enforce an otherwise apparently enforceable agreement that has been induced by duress. The timing of the haulage company's threat to the breach of contract left the supplier with no time to find an alternative haulage company. Damages are unlikely to be an adequate remedy, as the loss of the ongoing relationship with the retail customer (the supplier's biggest customer) could far outweigh the amount the supplier may recover in damages. We are also told that the supplier could not recover such a loss, again meaning that enforcing their rights under the contract and claiming damages may not be realistic for the supplier. The performance of an existing contractual duty may constitute good consideration if it confers a practical benefit to the promisor. However, such a principle will not apply when the promise of an additional amount has been induced by duress or fraud (therefore option A is incorrect). Option B is incorrect because the recognition of consideration constituting some practical benefit will not apply when the promise of an additional amount has been induced by duress. Option C is incorrect because any disbenefit avoided will not constitute good consideration due to economic duress. As noted above, given the importance of the ongoing relationship between the supplier and the retail customer, it is unlikely that damages will provide an adequate remedy (option D is therefore incorrect).", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 2"}, {"ch": 1, "n": 11, "sc": ["The claimant works for a cleaning company that contracts their services to different organisations. One of the organisations is a ferry company that owns a number of ferries and vessels. The claimant is instructed by their employers to attend at the local ferry port to clean a ferry for their employer's clients. On arriving at the port, the claimant approaches to embark on the ferry and due to a gap in the gangway, trips and breaks their ankle."], "st": "What is the likely outcome of a claim brought against the claimant's employers by the claimant for personal injury?", "o": ["The claim will likely fail on the basis that the employer was not at fault for the gangway leading to the ferry.", "The claim will likely succeed but the court will reduce the claimant's damages by a percentage to reflect contributory negligence.", "The claim will likely fail on the basis that the employer could not have foreseen the risk to the claimant as they embarked onto the ferry.", "The claim will likely succeed on the basis that the claimant's employer owes a duty to the claimant to provide a safe place of work.", "The claim will likely fail on the basis that the employer has delegated their duties to the ferry company and as a consequence is not liable for the claimant's injuries."], "a": "D", "bx": "The correct answer was D. This is because the duty to provide a safe system of work cannot be delegated regardless of where an employee works. This means that the claimant's employer should have assessed the premises where their employees were sent, to ensure that a safe system of work was implemented. Option A is incorrect because an employer has to assess premises where employees are sent, to minimise any dangers and implement a safe system of work. Option B is incorrect as the employer owes a duty to the employee which cannot be delegated to the ferry company. Option C is incorrect as, if the premises are unsafe, there is a foreseeable risk of injury to employees. Option E is incorrect as an employer cannot delegate their duties in the circumstances.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 5"}, {"ch": 1, "n": 12, "sc": ["A solicitor is instructed by a client in the sale of their business. During the course of the transaction, the solicitor recommends a financial advisor to the client. The financial advisor agrees to pay the solicitor a referral fee of £1,000 for the introduction. The solicitor has not informed the client of this fact."], "st": "What is the solicitor's duty under the SRA Code of Conduct in respect of the referral fee?", "o": ["The solicitor must notify the client of the referral fee and obtain their consent to receive it.", "The solicitor does not need to disclose the referral fee to the client as it is a separate business arrangement.", "The solicitor does not need to disclose the referral fee to the client as it is for a small amount of money.", "The solicitor must notify the client of the referral fee, but may receive it without the client's consent.", "The solicitor does not need to disclose the referral fee to the client as the fee is not related to the legal services provided by the solicitor."], "a": "A", "bx": "The correct answer was A. This is because the SRA Code of Conduct requires a solicitor to properly account to clients for any financial benefit they receive as a result of their instructions, except where they have agreed otherwise. This includes referral fees for introducing clients to third-party services. The solicitor must notify the client of the referral fees and is only permitted to receive those fees with the consent of the client. If the client does not consent, the solicitor is not permitted to receive those fees (therefore option D is incorrect). Options B, C and E are incorrect as the solicitor must inform the client of the referral fees; the reasons given are not valid under the Code of Conduct.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 1, "n": 13, "sc": ["A large commercial law firm has been approached by a potential client. The client is a man who wishes to instruct the solicitor in respect of a one-off transaction worth £10,000. The firm has no pre-existing business relationship with the client."], "st": "Which of the following statements most accurately describes the steps the firm must take to comply with anti-money laundering regulations?", "o": ["The firm must verify the client's identity using their passport.", "The firm must follow standard customer due diligence requirements because the client is instructing the solicitors in respect of an occasional transaction.", "The firm must follow enhanced due diligence requirements. su", "The firm does not need to follow customer due diligence requirements because the value of the transaction does not exceed the relevant threshold.", "The firm must follow standard customer due diligence requirements because a new business relationship is being formed between the firm and the client."], "a": "E", "bx": "The correct answer was E. This is because anti-money laundering legislation requires firms to follow standard customer due diligence when it forms a new business relationship with a client. Option A is incorrect because other forms of identification are acceptable under the legislation. The duty to carry out standard customer due diligence may also arise where a firm is carrying out an occasional transaction. However, options B and D are incorrect because the relevant threshold for an occasional transaction would be €15,000 (approximately £12,600). Option C is incorrect because there is no need for the firm to follow enhanced due diligence in this scenario.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 6"}, {"ch": 1, "n": 14, "sc": ["A company wishes to remove one of its directors on the grounds of poor performance of their duties."], "st": "Which of the following best describes the procedure for removal of a director?", "o": ["The director was appointed by the board of directors, so they can be removed in the same way. Companies House must be notified and the Register of Directors updated.", "The director's removal will need any weighted voting clause to be disapplied before the shareholders pass an ordinary resolution to remove them.", "The director can be removed by the shareholders passing a special resolution on 28 days' notice. Companies House must be notified and the Register of Directors updated.", "The board must call a shareholders' meeting to pass an ordinary resolution. Companies House must be notified and the Register of Directors updated.", "The director will automatically be removed as a director when their service contract is terminated by the board of directors. Companies House must be notified and the Register of Directors updated."], "a": "D", "bx": "The correct answer was D. This is because option D represents the correct procedure for the removal of a director. Options A, C and E are legally incorrect: option A is incorrect as the process of appointing a director is not the same as that to remove a director. Option C is incorrect as only an ordinary resolution is required to remove a director. Option E is incorrect, as a director cannot be automatically removed following termination of his service contract. Option B is incorrect as, whilst it may need to be considered in a particular case, there is no evidence on these facts that there is any weighted voting clause.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 4"}, {"ch": 1, "n": 15, "sc": ["The Secretary of State for Health wishes to implement new regulations to help to combat the spread of a contagious virus. Neither House of Parliament objects to the regulations."], "st": "Which of the following statements most accurately describes the Secretary of State's legal position?", "o": ["The Secretary of State may implement such regulations with the consent of the House of Commons and the House of Lords.", "The Secretary of State may implement such regulations providing they have been given the power to introduce such regulations under an enabling or parent Act.", "The Secretary of State may implement such regulations if the health and safety of the public is at risk. m", "The Secretary of State does not have the power to implement such regulations. -", "The Secretary of State may implement such regulations with the consent of the Prime Minister."], "a": "B", "bx": "The correct answer was B. This is because Parliament may give the Secretary of State a specific power to introduce such regulations (option D is therefore incorrect). Parliament must give the Secretary of State its power to make such regulations through an enabling or parent Act (options A and E are therefore incorrect). Option C is incorrect because it implies the Secretary of State could introduce such regulations irrespective of whether an enabling or parent Act gives such power to the Secretary of State.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 5"}, {"ch": 1, "n": 16, "sc": ["The claimant and their family are visiting a stately home on an old country estate. The stately home was built over 200 years ago, and certain areas are undergoing renovation. The claimant wishes to visit the toilets and sees a shortcut down a corridor. There is warning sign hanging from the ceiling in the corridor which reads 'DANGER'. As the claimant is walking along the corridor, a defective floorboard gives way, causing the claimant to be injured. In their defence, the stately home plead that the 'DANGER' sign referred to the inadequate flooring in the corridor."], "st": "Which of the following best describes the court's likely view as to the stately home's defence?", "o": ["The defence will likely fail on the basis that the warning is not specific enough, nor does it refer to the floorboards which would alert visitors to the issue with the uneven floor.", "The defence will likely succeed on the basis that the stately home gave a warning to visitors.", "The defence will likely fail on the basis that the claimant was a trespasser as they were using a shortcut which was not accessible due to the dangerous state of the corridor.", "The defence will likely succeed if the court finds that there was a significant risk incidental to the claimant using the shortcut to the toilet.", "The defence will likely fail but the claimant will be found contributorily negligent on the basis they failed to heed the warning sign."], "a": "A", "bx": "The correct answer was A. This is because in order for a warning to defeat a claim for negligence, the warning should be sufficient enough to ensure the visitor would be reasonably safe. In this case, the warning signs should have referred to the uneven floorboards in the corridor. Option B is incorrect because the warning is not sufficiently specific to provide a defence to the claim. Option C is incorrect as the claimant was not a trespasser but a visitor to the premises. Option D is incorrect as an incidental breach refers to a situation where the visitor can be expected to safeguard themselves against a risk. Option E is incorrect as the warning sign is not specific enough and the court is unlikely to find that the claimant contributed to their injuries in the circumstances.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 6"}, {"ch": 1, "n": 17, "sc": ["A man died leaving a valid will in which he stated that his wife can live in the matrimonial home for the rest of her life. The executors of the will formed an agreement with the wife under which she could live in the property for the rest of her life, providing that she paid £1 per year rent. Several months later, the other members of the man's family challenged this agreement on the basis that £1 per year was not a sufficient market rate to allow her to live in the property."], "st": "Can the woman enforce the agreement with the executors?", "o": ["Yes, as the woman has relied upon the promise of the executors.", "No, as payment of £1 per year is not adequate as consideration.", "Yes, as payment of £1 per year is sufficient consideration.", "No, as payment of £1 per year has minimal economic value.", "No, as the woman's consideration was in the past."], "a": "C", "bx": "The correct answer was C. This is because whilst £1 per year may not be adequate in terms of how it relates to the market value of the property, it will be legally sufficient. Consideration provides the general test of enforceability of promises at common law. Reliance in and of itself does not make a promise binding at common law (therefore, option A is incorrect). Option B is incorrect because the courts are not generally concerned with the adequacy of consideration (how it relates in value to what is bargained for), providing consideration is legally sufficient. Providing consideration has some economic value, however small, it will generally constitute sufficient consideration (therefore, option D is incorrect). The woman is giving her promise of £1 per year in exchange for the executor's promise. This is therefore not an example of past consideration (option E is therefore incorrect).", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 2"}, {"ch": 1, "n": 18, "sc": ["Two brothers own a business in partnership. They have just sold their premises which has doubled in value. The two brothers are looking to buy an industrial unit so that they can expand their business."], "st": "Which of the following provides the best advice in relation to the brothers' Capital Gains Tax (CGT) position?", "o": ["The two brothers will be liable to pay CGT on the disposal of the shop premises.", "The two brothers' liability to pay CGT will be postponed by electing to roll over their gain into new premises using Business Asset Rollover Relief.", "The two brothers' CGT bills will each be reduced by their £12,000 Annual Exempt Amount.", "The two brothers' liability to pay CGT will be postponed by electing to hold over their gain using Holdover Relief.", "The two brothers' liability to pay CGT will be extinguished by electing to roll over their gain into new premises using Business Asset Rollover Relief."], "a": "B", "bx": "The correct answer was B. This is because Business Asset Rollover Relief, if the brothers elect to use it, has the effect of postponing any liability to Capital Gains Tax because any gain will be added to any future gain and tax will be payable when the premises are eventually sold. Option A, whilst it is technically correct, is unlikely to be true here because the brothers are unlikely to want to pay tax before they have to. Option C is incorrect as it presents an out-of-date annual exempt amount figure. Option D is only applicable to transactions at an undervalue/gifts. Option E is incorrect as the use of Business Asset Rollover Relief does not extinguish liability to pay Capital Gains Tax it postpones it.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 9"}, {"ch": 1, "n": 19, "sc": ["The Supreme Court hears an appeal concerning a clinical negligence claim. At first instance, the High Court found in favour of the defendant. The Court of Appeal (Civil Division) also found in favour of the defendant. The Supreme Court determines that the High Court and Court of Appeal (Civil Division) have misapplied the relevant legal principle and rules in favour of the claimant."], "st": "Which of the following statements most accurately describes the effect of the decision of the Court of Appeal (Civil Division)?", "o": ["The Court of Appeal (Civil Division) decision would still be binding on all inferior courts because the Court of Appeal is above inferior courts in the court hierarchy.", "The Court of Appeal (Civil Division) decision has been overturned by the Supreme Court and is no longer binding on inferior courts.", "The Court of Appeal (Civil Division) decision has been distinguished by the Supreme Court; both decisions are legally binding on inferior courts.", "The Court of Appeal (Civil Division) decision has been overruled by the Supreme Court and is no longer binding on inferior courts.", "The Court of Appeal (Civil Division) decision has been reversed by the Supreme Court and is no longer binding on inferior courts."], "a": "E", "bx": "The correct answer was E. This is because the Supreme Court has reversed the decision of the Court of Appeal (Civil Division). This means that the Court of Appeal decision is no longer considered to be good law and it is not binding on any inferior court (option A is therefore incorrect). It is important to remember the difference between a court overturning a decision and a court reversing a decision. Here, the Supreme Court considered the Court of Appears decision on appeal. This means that it has reversed, rather than overruled or overturned, the Court of Appeal decision (options B and D are therefore incorrect). Option C is incorrect because it states that the Supreme Court has distinguished the Court of Appeal decision.", "ar": "Legal system of England and Wales", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 4"}, {"ch": 1, "n": 20, "sc": ["The claimant is a business owner attending a conference organised by his employer. The conference is taking place in a large hotel. One morning the claimant uses the lift in the hotel to attend the 9:00am presentation on day two of the conference. Due to a technical fault in the lift mechanism, the lift doors close on the claimant's outstretched arm, breaking his elbow. There is a sign at reception in the hotel that reads: 'The hotel accepts no responsibility for personal injury or death.'"], "st": "What is the likely outcome of a claim brought against the hotel for the claimant's personal injuries?", "o": ["The claim will likely fail on the basis that the hotel displayed a sign excluding liability for personal injury.", "The claim will likely succeed on the basis that the hotel is unable to exclude liability for personal injury and the accident has been caused by the state of the premises.", "The claim will likely fail on the basis that the accident is an unforeseen consequence of the claimant using the lift.", "The claim will likely succeed on the basis that the claimant was a non-consumer and the hotel owed them a duty of care.", "The claim will likely fail on the basis that the claimant is a visitor to the premises and their injury has not been caused by the state of the premises, only the premature closing of the lift doors."], "a": "B", "bx": "The correct answer was B. This is because business occupiers are unable to exclude or restrict their liability for personal injury or death. Option A is incorrect as the exclusion of liability notice is invalid. Option C is incorrect as the injury caused to the claimant is foreseeable if the lift doors are defective. Option D is incorrect as business occupiers are unable to exclude or restrict liability for negligence to non-consumers, and the hotel did owe the claimant as a visitor a duty of care. Option E is incorrect as the claimant's injuries have been caused by the state of the premises.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 6"}, {"ch": 1, "n": 21, "sc": ["A man sells his only property to a woman for £100,000. The market value of the property is £500,000. The woman is a physician, and the man is one of her patients. The man's family members were concerned when they heard about the sale and encouraged the man to seek legal advice. A solicitor advised the man that the sale should be set aside as a result of undue influence."], "st": "Which of the following statements best explains the legal position?", "o": ["The sale, whilst under market value, is legally binding as the woman's payment of £100,000 constitutes valuable consideration.", "The sale may be set aside because of actual undue influence exerted by the woman over the man.", "The sale may be set aside but only if the man can produce sufficient evidence that the sale was a result of undue influence applied by the woman.", "The sale may be set aside as the relationship between the man and the woman is one of trust and confidence.", "The sale of the house is a transaction that calls for explanation and the relationship creates a rebuttable presumption of influence. The woman will need to rebut the presumption to avoid a finding of undue influence and the contract being set aside."], "a": "E", "bx": "The correct answer was E. This is because a doctor-patient relationship is a recognised relationship from which influence is to be presumed. A presumption of influence will arise when the parties in such a relationship enter into a transaction that ,calls for explanation'. The sale of the house so far under market value, from a patient to their doctor, is one that calls for explanation. The woman must then establish that she did not apply such influence to the man in order to avoid a finding of undue influence. Option A was incorrect because the statement does not address the issue of undue influence as stated in the question. There would be no need for the man to prove actual undue influence, as the relationship is one from which influence would be presumed. Further, there is no overt evidence of this on the facts (therefore, option B is incorrect). Option C is incorrect because the burden of establishing undue influence would not fall on the man due to the nature of his relationship with the woman. Option D is incorrect because the relationship is a recognised relationship of trust and confidence. Even this on its own is not enough to raise a presumption of influence. There must also be a transaction that calls for explanation.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 8"}, {"ch": 1, "n": 22, "sc": ["Two companies are involved in a dispute over the quality of materials used in a marketing campaign. The value of the claim is £750. The claimant indicates to their solicitor that they would like to rely on two expert reports at a cost of £800 each as well as disclosing copies of over 1,000 emails exchanged between the parties."], "st": "Which of the following best represents the advice the solicitor should give to the claimant in light of the Civil Procedure Rules (CPR) 1998?", "o": ["The claimant should be able to rely on the two expert reports and disclose all of the evidence as the overriding objective of the CPR 1998 states that cases must be dealt with justly and fairly.", "The claimant should be able to rely on the two expert reports and disclose all of the evidence as the overriding objective of the CPR 1998 states that courts should ensure that parties are placed on an even footing.", "The overriding objective of the CPR 1998 states that cases should be dealt with in ways that are proportionate to the amount of money involved, so it is unlikely the courts will allow the claimant to rely on the two expert reports and disclose all of the evidence.", "The overriding objective of the CPR 1998 states that cases should be dealt with in ways that are proportionate to the available court resources, so it is unlikely the courts will allow the claimant to rely on the two expert reports and disclose all of the evidence.", "The overriding objective of the CPR 1998 states that cases should be dealt with in ways that are proportionate to the complexity of the issues, so it is unlikely the courts will allow the claimant to rely on the two expert reports and disclose all of the evidence."], "a": "C", "bx": "The correct answer was C. This is because, whilst the overriding objective states that cases must be dealt with fairly and seek, where possible, to put parties on an equal footing, this is always with proportionality in mind (therefore options A and B are incorrect). Similarly, whilst reference is made to the need to ensure that cases are allotted an appropriate share of the court's resources, this is not the primary reason the two expert reports and the volume of emails will not be allowed (making option D incorrect). The primary reason will be that the volume of evidence is disproportionate to the value of the claim (therefore option E is incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 7"}, {"ch": 1, "n": 23, "sc": ["A Bill has been introduced in the Senedd by the First Minister. The primary purpose of the Bill is to change the name of the Senedd."], "st": "Which of the following statements most accurately describes the legislative process that must be followed in order for the Bill to become law?", "o": ["The Senedd Bill relates to a protected subjected matter. It will only become law if at least two-thirds of the total number of Senedd members vote in favour of the Bill at the final stage of the legislative process.", "The Senedd Bill cannot become law because it relates to a protected subject matter and the Senedd does not have the power to pass this type of legislation.", "The Senedd Bill is outside the Senedd's legislative competence so it cannot become law under any circumstances.", "The Senedd Bill relates to a protected subject matter and will only become law if it is approved by the UK Parliament.", "The Senedd Bill relates to a protected subjected matter. It will only become law if at least three-quarters of the total number of Senedd members vote in favour of the Bill at the final stage of the legislative process."], "a": "A", "bx": "The correct answer was A. This is because a Senedd Bill must sometimes be supported by a greater proportion (two-thirds) of Senedd members than is usually required before it can become law. This is known informally as the 'supermajority requiremenf, and applies whenever a Senedd Bill relates to a 'protected subject matter', such as changing the name of the Senedd. Option B is incorrect because it states that the Senedd cannot pass legislation relating to a protected subject matter, which is not true providing the supermajority requirement is satisfied. Option E is incorrect because it states that the relevant threshold is three-quarters of Senedd members. Option D is incorrect because there is no requirement for the UK Parliament to approve legislation which relates to a protected subject matter, and Option C is incorrect because it wrongly states that the Bill is outside the Senedd's legislative competence.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 9"}, {"ch": 1, "n": 24, "sc": ["A well-respected children's rights organisation ('the organisation') wishes to make an application for judicial review of a local education authority's decision to change the school uniform policy for schools within its remit."], "st": "Which of the following most accurately describes the procedure that the organisation must follow?", "o": ["The organisation must apply to the Administrative Court. It must file the application no later than three months after the grounds to make the claim arose, and must be granted leave by demonstrating that the claim is arguable and has a reasonable prospect of success.", "The organisation must apply to the Court of Appeal. It must file the application no later than three months after the grounds to make the claim arose, and must be granted leave by demonstrating that the claim is arguable and has a reasonable prospect of success.", "The organisation must apply to the Administrative Court. It must file the application no later than six weeks after the grounds to make the claim arose, and must demonstrate that the claim is arguable and has a reasonable prospect of success.", "The organisation must apply to the Court of Appeal. It must file the application no later than three months after the grounds to make the claim arose, and must be granted leave by demonstrating that the claim is arguable and has a good prospect of success.", "The organisation must apply to the Administrative Court. It must file the application no later than three months after the grounds to make the claim arose, and must be granted leave by demonstrating that the claim is arguable and has a good prospect of success."], "a": "A", "bx": "The correct answer was A. This is because applications for judicial review must be submitted to the Administrative Court and must be filed no later than three months from the date on which the grounds to make a claim first arose. Additionally, the claimant must be able to demonstrate that the claim is arguable and has a reasonable prospect of success. Options D and E are incorrect because they state that the claimant must demonstrate a good prospect of success when the correct threshold is a reasonable prospect of success. Option C is incorrect because it states that applications for judicial review must be made within six weeks. This deadline would only apply to judicial review of planning claims, so would not apply here. Options B and D are incorrect because they state that judicial review applications must be submitted to the Court of Appeal. All applications for judicial review must be submitted to the Administrative Court.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 7"}, {"ch": 1, "n": 25, "sc": ["A man is employed as a travelling salesperson, His employer is a specialist supplier of machinery to the agriculture industry. The
