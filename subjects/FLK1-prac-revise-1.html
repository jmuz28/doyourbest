t teachers may attend the school premises during the summer holidays to collect marking.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 5"}, {"ch": 1, "n": 63, "sc": ["A solicitor represents a client in civil proceedings. The client has identified a witness that will support their version of events."], "st": "How should the solicitor act in response to the request for payment?", "o": ["The solicitor can offer to pay the witness to give evidence on behalf of the client.", "The solicitor can only offer to pay the witness to give evidence on behalf of the client if the court consents to it.", "The solicitor cannot offer to pay the witness to give evidence on behalf of the client, including expenses for attending court.", "The solicitor can only offer to pay the witness for their expenses of attending court to give evidence on behalf of the client.", "The solicitor cannot offer to pay the witness to give evidence on behalf of the client unless the witness gives a statement that they would not otherwise give evidence."], "a": "D", "bx": "The correct answer was D. The is because the SRA Code of Conduct requires a solicitor not to provide or offer to provide any benefit to witnesses dependent upon the nature of their evidence or the outcome of the case. In essence, the SRA Code of Conduct prohibits the payment of witnesses in civil proceedings except for their reasonable expenses for attending court (option A is therefore incorrect). Compensation that goes beyond expenses is not permitted. Option B is incorrect because the solicitor must never offer to pay a witness to give evidence. Whilst option C is correct in part, it is incorrect that witnesses cannot claim expenses. Option E is incorrect because the ultimatum given by the witness does not permit the solicitor to offer payment.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 1, "n": 64, "sc": ["The claimant's brother is involved in a serious train crash in which over 50 people are killed. The claimant's brother is taken by the emergency services to the hospital but dies on the way to the hospital. The claimant has not seen their brother for over 30 years but, as the only surviving member of the family, is requested to identify the brother's body at the hospital morgue. The brother's face and body are significantly burnt and disfigured. The claimant arrives minutes after the brother is pronounced dead. Upon seeing their brother's body, the claimant suffers a severe stress reaction which is later diagnosed as post-traumatic stress disorder (PTSD)."], "st": "Which of the following best describes the difficulties that the claimant may face in bringing a claim for psychiatric harm?", "o": ["The claimant did not suffer a medically diagnosed psychiatric illness.", "The claimant did not witness the immediate aftermath of the incident.", "The claimant did not have a close tie of love and affection with their brother.", "The claimant was not in the zone of danger.", "The claimant is not the brother's next of kin."], "a": "C", "bx": "The correct answer was C. This is because the claimant and his brother have been estranged for 30 years, and the requirement for a close tie of love and affection can be rebutted with evidence to the contrary. Option A is incorrect as post-traumatic stress disorder (PTSD) is a medically diagnosed psychiatric illness. Option B is incorrect because the claimant arrives minutes after the brother is pronounced dead and he is significantly burnt and disfigured; the claimant therefore did witness the immediate aftermath. Option D is incorrect as the zone of danger refers to a primary victim and the claimant is seeking a claim on the basis that they were a secondary victim; the zone of danger is therefore irrelevant. Option E is incorrect as it is irrelevant whether or not the brother is next of kin.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 3"}, {"ch": 1, "n": 65, "sc": ["A solicitor represents the claimant in a personal injury dispute. The solicitor's firm receives documentation intended for the defence by mistake. The solicitor has not yet read the papers, having discovered the error immediately upon opening the communication."], "st": "Which of the following best describes what the solicitor should do in the circumstances?", "o": ["The solicitor is obliged to read the papers and make the claimant aware of all information contained in those papers material to the manner in question.", "The solicitor is obliged to return the papers unread to the defendant's solicitors but must inform the claimant that they received the papers in error.", "The solicitor is obliged to make the claimant aware that they have received the papers in error and seek the claimant's instructions on how to proceed.", "The solicitor is obliged to read the papers but is not required to make the claimant aware of all information contained in those papers material to the manner in question.", "The solicitor is obliged to return the papers unread to the defendant's solicitors and is not required to inform the claimant that they received the papers in error."], "a": "E", "bx": "The correct answer was E. This is because the SRA Code of Conduct states that a solicitor need not disclose information material to the matter in which the claimant is involved where the information is contained in a privileged document that the solicitor has knowledge of only because it has been mistakenly disclosed. In such circumstances, the solicitor is best advised to return the papers to the correct party and not inform the claimant of the error. None of the other options accurately represent the status of the law and are therefore incorrect.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 1, "n": 66, "sc": ["A solicitor is instructed by a client who is the defendant in a criminal matter. The defendant is charged with a serious indictable-only offence. The defendant insists that she is not guilty of the offence. The defendant is a teacher and would most likely lose their job if convicted of the offence."], "st": "Which of the following best describes the client's eligibility for legal aid in respect of this matter?", "o": ["The client may be eligible for legal aid if they can show that they are likely to lose their liberty as a result of the proceedings.", "The client is eligible for legal aid because they are charged with an indictable-only offence and may receive a custodial sentence.", "The client may be eligible for legal aid if they are able to demonstrate they have a reasonable chance of proving their innocence.", "The client would automatically meet the interest of justice test but would only be eligible for legal aid if they met the relevant eligibility requirements in respect of the means test.", "The client may be eligible for legal aid if they can pass the interest of justice test and the means test."], "a": "D", "bx": "The correct answer was D. This is because the interests of justice test is automatically satisfied for trials before the Crown Court (options A, C and E are therefore incorrect). Option B is incorrect because the client automatically satisfies the test; the likelihood of them receiving a custodial sentence is therefore irrelevant. Option C is incorrect because legal aid is not dependent on the likely outcome of the trial.", "ar": "Legal services", "see": ""}, {"ch": 1, "n": 67, "sc": ["The owners of a local theme park are aware that children try to access the park at night. The owners have installed cameras to catch them and increased the level of security around the park. Two 11-year-old children force open and climb through a gap in the fence surrounding the theme park. This is captured on security cameras and a guard is despatched to find the children. The two children climb up a rollercoaster but slip and fall. One child dies and the other is left with life changing injuries. Both children's parents bring claims for personal injury under the Occupiers' Liability Act 1984 against the theme park owners."], "st": "Which of the following best describes the likely outcome of the claims against the owners of the theme park?", "o": ["The claims will likely succeed on the basis that the theme park owners knew children were entering the park at night.", "The claims will likely fail on the basis that a reasonable person would not have entered the premises at night.", "The claims will likely succeed on the basis that the theme park owners owe a special duty of care to children.", "The claims will likely fail on the basis that the injuries were not caused by the state of the premises.", "The claims will likely succeed but damages will be reduced significantly due to the childrens, contributory negligence."], "a": "D", "bx": "The correct answer was D. This is because the injuries were not caused by the danger presented by the state of the premises but by the incorrect use of well-maintained premises; the Occupiers' Liability Act 1984 is concerned with trespassers injured 'due to the state of the premises1 (this is not the case here). Option A is incorrect because even though the theme park owners know that children may potentially enter the park, and have attempted to do something about that by installing cameras, the injuries are not caused by the state of the premises. Instead, they are caused by the children's incorrect use of well-maintained premises. Option B is incorrect because the court will judge the claimants by the standard of a reasonable 11-year-old child. Option C is incorrect because the injuries have not been caused by the state of the premises. Option E is incorrect as the court is unlikely to find a duty of care existed under the Occupiers1 Liability Act 1984 and therefore contributory negligence will not be a factor.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 6"}, {"ch": 1, "n": 68, "sc": ["Company A and Company B are haulage companies, and both own a number of commercial vehicles."], "st": "Which of the following statements represents a transaction that would require shareholder approval as a substantial property transaction?", "o": ["The purchase of a commercial vehicle owned by Company A by a director of Company A when the director is paying the market value of £4,500 for the vehicle.", "The purchase of a commercial vehicle owned by Company B by an employee of Company B when the employee is paying the market value of £4,500 for the vehicle.", "The purchase of a fleet of commercial vehicles owned by Company A by an employee of Company A when the employee is paying the market value of £104,500 for the vehicles.", "The purchase of a fleet of commercial vehicles owned by Company B by the father of a director of Company B when the buyer is paying the market value of £104,500 for the vehicles.", "The purchase of a fleet of commercial vehicles by Company A from the father of a director of Company A when the seller is receiving shares in Company A worth approximately £120,000 in exchange for the vehicles."], "a": "D", "bx": "The correct answer was D. This is because the father is a connected person and the transaction fulfils all other requirements of the definition. The definition of a substantial property transaction from the Companies Act 2006 is: an arrangement under which a director (or connected person) acquires or is to acquire from the company a non-cash asset, or the company acquires or is to acquire from a director (or connected person) a non-cash asset where the value is substantial (ie, exceeds 10% of company's asset value and is more than £5,000 or it exceeds £100,000) and the consideration is cash. If the transaction fulfils this definition, the company needs to approve it by passing an ordinary resolution of the shareholders. If this approval is not obtained, the transaction is voidable. Options A and B are not of substantial value so do not fulfil the definition. Option C is a sale to an employee (not a director or connected person) so does not fall within the definition. Option E describes non-cash consideration so does not fall within the definition.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 4"}, {"ch": 1, "n": 69, "sc": ["A man purchased a brand-new television from a retailer. The television was found to be defective and the man sought a refund from the retailer. The retailer refused to issue a refund. The retailer stated that the television was defective due to the fault of the manufacturer. The man now seeks to bring a claim for breach of contract against the manufacturer."], "st": "Which of the following best explains whether the man can bring a claim against the manufacturer for breach of contract?", "o": ["The man can bring a claim against the manufacturer, as the manufacturer is strictly liable for the defective product.", "The man cannot bring a claim against the manufacturer as the man must first give the retailer the opportunity to repair the television.", "The doctrine of privity of contract prevents the man from bringing a claim against the manufacturer.", "The man can bring a claim against the manufacturer, as the manufacturer has been negligent in the production of the television.", "The man cannot bring a claim against the manufacturer, as the manufacturer does not owe a duty of care to users of the products."], "a": "C", "bx": "The correct answer was C. This is because the contract is between the retailer and the customer. The retailer in turn has a contract with the manufacturer. The man is not a party to the contract between the retailer and the manufacturer. The man cannot bring a claim against the manufacturer for the breach of contract between the manufacturer and the retailer. Option A is incorrect because the manufacturer is only liable for their breach of contract with the retailer. The men's claim for breach of contract arises as the goods are not of satisfactory quality. This is a breach of condition, which would entitle the man to reject the goods and seek a refund from the retailer (therefore option B is incorrect). Option D is incorrect because there is no evidence of negligence. The goods are not of satisfactory quality and the man should pursue his claim for breach of contract against the retailer. Option E is incorrect because the question is framed based on a claim for breach of contract due to the goods not being defective.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 4"}, {"ch": 1, "n": 70, "sc": ["The claimant is a burglar who forced entry to the defendant's house and was attacked by the defendant's dog. There is a sign on the exterior of the defendant's house that alerts visitors to the presence of the dog. The claimant brings a claim against the defendant for personal injury and loss of earnings. As a result of the dog bites, the claimant required skin grafts and an extended stay in hospital during which they were unable to work as a delivery driver."], "st": "Which of the following best describes how the defendant should defend the claim made by the claimant?", "o": ["The defendant should defend the claim on the basis that the claimant consented to being bitten by the dog when they broke into the defendant's house.", "The defendant should allow their home insurers to pay the claim on the basis that they owed the claimant a duty of care.", "The defendant should pay the claim but seek a reduction for contributory negligence on the basis the claimant should have heeded the sign about the dog.", "The defendant should defend the claim on the basis that the claimant was involved in a criminal enterprise and should not be able to claim for injury.", "The defendant should admit liability but dispute the value of the claim for lost earnings."], "a": "D", "bx": "The correct answer was D. This is because illegality is a complete defence to a claim in negligence. Option A is incorrect as the defence of consent is not relevant because the claimant is performing an illegal act. Option B is incorrect as the defendant did not owe the claimant who was burgling his house a duty of care. Option C is incorrect as the court would have to find primary liability attached to the defendant in order to then consider whether or not the claimant contributed to their injuries. Option E is incorrect as the defendant has a complete defence to the claim.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 4"}, {"ch": 1, "n": 71, "sc": ["The claimant is an ice-skating coach and is injured in an accident at work which leaves them with loss of feeling and sensation in their right leg. The claimant's employer admits liability for the accident and is due to pay the claimant an amount by way of compensation. The claimant is unable to work as an ice-skating coach, but their employer offers them a role as a receptionist. Whilst working as a receptionist, a member of the public assaults the claimant, leaving them with a broken nose. The claimant wishes to bring a second claim against their employer, in addition to their original claim, on the basis that had they been working as an ice-skating coach, the assault would not have happened."], "st": "Is the second claim likely to succeed?", "o": ["Yes: but for the employer's initial negligence, the claimant would not be working on reception and be injured when the member of the public became aggressive.", "No: the assault is a new intervening act that breaks the chain of causation.", "Yes: the assault is a direct consequence of the employer's negligence. q", "No: the employer has the defence of consent as the claimant consented to changing jobs following their accident.", "Yes: the claimant's injuries are a foreseeable risk associated with their initial injury. s"], "a": "B", "bx": "The correct answer was B. This is because the assault is too remote from the initial negligence so as to allow the claimant to succeed. Option A is incorrect as the employer has not been negligent in the second incident, which sees the claimant assaulted by a member of the public. Option C is incorrect because the assault is not a direct consequence of the employer's negligence. Option D is incorrect as consent is not relevant as a defence in the scenario. Option E is incorrect as there is no negligence associated with the assault and it is not foreseeable that a change in occupation would lead to the claimant's facial injuries.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 2"}, {"ch": 1, "n": 72, "sc": ["A firm has recently employed a new trainee solicitor. The trainee solicitor is a Muslim woman who wears a hijab as part of her religious beliefs. The trainee solicitor has been informed by a senior partner that there is a strict dress code at the law firm, and head coverings are not permissible. The trainee solicitor has expressed her concerns regarding the dress code to her supervisor."], "st": "Which of the following best describes the course of conduct the supervisor should take?", "o": ["The supervisor should advise the trainee solicitor to comply with the dress code and remove her hijab.", "The supervisor should explain to the trainee solicitor that the dress code is religiously and culturally neutral and must be followed by all employees.", "The supervisor should suggest that the trainee solicitor speak to the senior partner and explain the significance of the hijab to her religious beliefs.", "The supervisor should offer to speak to the senior partner on behalf of the trainee solicitor and seek a reasonable adjustment to the dress code.", "The supervisor should advise the trainee solicitor that she has the right to wear the hijab in the workplace, and the firm is required to make a reasonable adjustment to the dress code."], "a": "D", "bx": "The correct answer was D. This is because the SRA Code of Conduct requires solicitors to act in a way that encourages equality, diversity and inclusion (Principle 6) and must not unfairly discriminate. The trainee solicitor is entitled to practise her religion and dress according to her beliefs (option A is therefore incorrect). A policy that prohibits the trainee solicitor from wearing a hijab could be discriminatory, and is not neutral (option B is therefore incorrect). The best course of action would be for the supervisor to speak to the senior partner on behalf of the trainee solicitor. This approach would avoid causing discomfort or difficulty for the trainee solicitor should they speak with the senior partner personally (therefore option C is incorrect). Option E is incorrect because it is not an absolute right to wear a hijab at work. Reasonable adjustments must be considered by the employer to accommodate the employee's religious beliefs, and whilst it would be unlikely that the law firm would not accommodate such beliefs, there is no absolute right.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 1, "n": 73, "sc": ["The local museum hosts a fashion show. The museum ropes off the top floor, which houses a collection of contemporary toys. The fashion show takes place on the first floor. Tickets are issued, which state the fashion show is for individuals over the age of 18 only. One of the attendees attends with their three-year-old child without the knowledge of the security team. During the fashion show, the three-year-old child visits the top floor unsupervised by their attendee parent where they play with some of the toys on display. The three-year-old child makes their way back to the first floor and in doing so falls down a flight of stairs and is seriously injured."], "st": "What is the likely view of the court relating to the museum's negligence?", "o": ["The court is likely to find the museum negligent on the basis that they have created an allurement with the contemporary toys on display.", "The court is unlikely to find the museum negligent on the basis that the three-year-old child should not have attended the event and should have been supervised by their attendee parent.", "The court is likely to find the museum negligent on the basis that they have failed to ensure that visitors are reasonably safe.", "The court is unlikely to find the museum negligent on the basis that the three-year-old child was a trespasser and the museum does not owe the child a duty of care.", "The court is likely to find the museum negligent on the basis that but for their negligence, the three-year-old child would not have been injured."], "a": "B", "bx": "The correct answer was B. This is because the museum was clear about the fact that it was an event for over 18s only and the child's parent knew this to be the case as they have smuggled their child into the show without the knowledge of the security team. Option A is incorrect on the basis that the museum did not expect there to be any children on the premises. Option C is incorrect as the museum has complied with their duty of care under the Occupiers' Liability Act 1984, and in any event the child was not injured by the state of the premises but due to the fact that they were not being supervised by their parent. Option D is incorrect as trespassers are owed a duty of care under the Occupiers, Liability Act 1984 as long as preconditions are met this is not relevant here. Option E is incorrect as the museum is unlikely to be at fault due to the fact that the child should have been supervised.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 2"}, {"ch": 1, "n": 74, "sc": ["The Supreme Court has recently issued a declaration of incompatibility under section 4 of the Human Rights Act 1998. As a result of the ruling, a draft remedial order has been presented to Parliament."], "st": "Which of the following statements best describes the nature of remedial orders?", "o": ["A remedial order is a type of remedy that is available where a court has issued a declaration of incompatibility under section 4 of the Human Rights Act 1998.", "A remedial order is a type of statutory instrument that allows the Government to quickly amend Acts of Parliament so as to remove incompatibility with the Human Rights Act 1998.", "A remedial order is a type of statutory instrument that allows Parliament to quickly overturn legislation deemed to be incompatible with the Human Rights 1998.", "A remedial order is a type of bill that must pass through the usual legislative process before it can become law. This type of bill is used to remedy incompatibility with the Human Rights Act 1998.", "A remedial order is a direction to Parliament to amend Acts of Parliament so as to remove incompatibility with the Human Rights Act 1998."], "a": "B", "bx": "The correct answer was B. This is because remedial orders are a type of statutory instrument that is designed to allow the government to quickly amend law in order to remove incompatibility with the Human Rights Act 1998. Remedial orders are not a type of remedy (therefore, option A is incorrect). Option C is incorrect because it states that remedial orders allow the Government to overturn legislation, which is not accurate. Option D is incorrect because remedial orders are not a type of bill. Option E is incorrect because the courts cannot direct Parliament to do anything; the remedial order simply gives Parliament the ability to amend Acts.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 8"}, {"ch": 1, "n": 75, "sc": ["The Court of Appeal (Civil Division) is considering a complex contract law appeal. During the course of the appeal, various questions have arisen as to the precise meaning of a phrase contained within a statute. Both parties have put forward submissions regarding the correct interpretation of the phrase. A leading and highly respected academic in the field of contract law has explored the relevant section of the statute extensively and has published articles on the matter. The judges hearing the appeal feel it would be useful to refer to the relevant articles to assist them in construing the relevant section of the statute."], "st": "Which of the following statements most accurately describes the extent to which the Court of Appeal (Civil Division) can use such external aids to assist in interpreting the statute?", "o": ["The Court of Appeal (Civil Division) may refer to external aids such as academic writings as the statute is unclear. In this case, the Court may refer to the academic articles to assist them in interpreting the relevant legislation.", "The Court of Appeal (Civil Division) may refer to external aids such as academic writings if it wishes to. In this case, the Court may refer to the academic writings to assist them in interpreting the relevant legislation. s", "The Court of Appeal (Civil Division) may refer to external aids such as academic writings if both parties agree and the Court feels it would assist in interpreting the relevant provision.", "The Court of Appeal (Civil Division) may not refer to academic writings since they are not parliamentary publications.", "The Court of Appeal (Civil Division) may refer to external aids as the statute is unclear. However, academic writings are not recognised as external aids to statutory interpretation."], "a": "A", "bx": "The correct answer was A. This is because judges may only refer to external aids to interpretation where a word or phrase used in the statute is ambiguous or unclear. Option B is incorrect because it implies that judges may refer to external aids to interpretation whenever they wish, which they cannot. Option C is incorrect because the parties' consent is not relevant to the rules concerning statutory interpretation. Academic literature is a recognised external aid to statutory interpretation; options D and E are incorrect because they imply that academic literature may not be used as an aid to statutory interpretation.", "ar": "Legal system of England and Wales", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 3"}, {"ch": 1, "n": 76, "sc": ["A company approaches a solicitor for advice on the appointment of a new director. The solicitor advises that there are a number of ways in which this can be achieved."], "st": "Which of the following statements would not be suitable advice for the company as it would not result in a valid and effective appointment of a director?", "o": ["The company should pass a board resolution to appoint and notify Companies House of the appointment.", "The company should pass a board resolution to call an extraordinary general meeting, an ordinary resolution to appoint, and notify Companies House of the appointment.", "The company should pass a board resolution to appoint and award a fixed-term service contract for one year, keeping a copy of the service contract at the Registered Office, and notify Companies House of the appointment.", "The company should pass a board resolution to call an extraordinary general meeting, an ordinary resolution to appoint, awarding of a rolling contract of employment (terminable upon three months, notice by either side) by the board, keeping a copy of the contract at the Registered Office, and notify Companies House of the appointment.", "The company should award a rolling contract of employment (terminable upon three months, notice by either side) by the board, keeping a copy of the contract at the Registered Office, and notify Companies House of the appointment."], "a": "E", "bx": "The correct answer was E. This is because option E fails to actually appoint to the office of director it simply gives the director a contract of employment. All other options describe the process of appointment (with or without a service contract, which is desirable but not essential).", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 4"}, {"ch": 1, "n": 77, "sc": ["A solicitor is instructed to act on behalf of a client in respect of a divorce. The client's case is straightforward as both parties to the marriage consent to a divorce and plan to make a joint application for a divorce order. The parties do not have children and have a marital property agreement in place to determine how the marital property will be distributed."], "st": "Which of the following is the most appropriate funding option in this case?", "o": ["A conditional fee agreement.", "A damages-based agreement.", "After-the-event insurance.", "A fixed-fee arrangement.", "A private retainer."], "a": "D", "bx": "The correct answer was D. This is because fixed-fee arrangements tend to be used when a case is relatively straightforward and the solicitor is able to accurately estimate how much time they are likely to spend on the case. In this case, the client's divorce is straightforward and it is highly unlikely that the solicitor would need to undertake any additional work in respect of this matter. For these reasons both the client and solicitor are likely to find a fixed fee to be an appropriate source of funding in this scenario. Options A, B and C are incorrect because these types of funding options are not appropriate in family matters such as divorce. Option E is incorrect as this is not the most appropriate option for a client faced with a straightforward divorce case.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 8"}, {"ch": 1, "n": 78, "sc": ["An entrepreneur with a number of sources of income has a taxable income of £100,000. They are thinking of setting up a new business with another person where the profit projections are £90,000 in the first year. The entrepreneur is concerned about the amount of tax that would be payable on any profits."], "st": "Which of the following business types is the best option in light of the entrepreneur's concerns over tax liabilities?", "o": ["A traditional partnership.", "A limited liability partnership.", "A private company limited by shares.", "A joint venture between two sole traders.", "A sole trader."], "a": "C", "bx": "The correct answer was C. This is because the entrepreneur is a higher rate taxpayer and clearly has other sources of income so all profits are likely to attract income tax at the higher rate of tax for an individual, and with this option the rates payable of corporation tax are lower. Option E is not correct because there are (at least) two people in this business. Options A, B and D would all make the entrepreneur responsible for their share of the profits which would be taxed at the higher rate of 40%. If the profits were made by a private limited company, the rate of corporation tax is 20%. This does not of course allow for the extraction of the profits from the company by the entrepreneur, but this is not required on the facts.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 1"}, {"ch": 1, "n": 79, "sc": ["A newly qualified solicitor is instructed on a complex commercial contract case with a senior partner. The senior partner has tasked the newly qualified solicitor with drafting a key document for the case. However, the newly qualified solicitor has doubts about their competence in handling such a complex case. The senior partner has requested the document to be completed in a short period of time."], "st": "Which of the following best describes the newly qualified solicitor's obligations under the Solicitors Regulation Authority (SRA) Code of Conduct?", "o": ["The newly qualified solicitor should decline to undertake the senior partner's task to draft the key document.", "The newly qualified solicitor should undertake the senior partner's task to draft the key document.", "The newly qualified solicitor should delegate the senior partner's task to draft the key document to a paralegal in the law firm who has expertise in complex commercial transactions.", "The newly qualified solicitor should request an extension on the senior partner's task to draft the key document to give her the opportunity to gain the competence to complete the task.", "The newly qualified solicitor should cease to act for the client."], "a": "A", "bx": "The correct answer was A. This is because the SRA Code of Conduct requires solicitors to ensure that the service they provide to clients is competent and delivered in a timely manner, and to maintain their competence to carry out their role and keep their professional knowledge and skills up to date. If the newly qualified solicitor has doubts about their competence, they should decline the task and inform the senior partner. The newly qualified solicitor may need additional training or support if they wish to expand their competence into complex commercial transactions (therefore option B is incorrect). Option C is incorrect because the solicitor has a duty to provide a competent level of service; delegation to non-qualified legal staff is not appropriate. Option D is incorrect as the solicitor has an obligation to act in a timely manner and asking for an extension of time is not appropriate. Option E is incorrect because the newly qualified solicitor may have competence in other aspects of the retainer, and it would not be in the client's best interests for them to cease to act.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 1, "n": 80, "sc": ["A senior solicitor in a law firm makes a joke about a trainee solicitor's sexual orientation in front of other employees. The trainee solicitor finds the joke offensive and humiliating, and reports the incident to a managing partner."], "st": "Which of the following statements most accurately describes the senior partner's behaviour?", "o": ["The behaviour would amount to direct discrimination on the basis of the trainee solicitor's sexual orientation and would contravene the Equality Act 2010.", "The behaviour would amount to indirect discrimination on the basis of the trainee solicitor's sexual orientation and would contravene the Equality Act 2010.", "The behaviour would amount to victimisation contrary to the Equality Act 2010.", "The behaviour would amount to direct discrimination on the basis of the trainee solicitor's sexual orientation but would be considered to be justified under the Equality 2010.", "The behaviour would amount to harassment contrary to the Equality Act 2010."], "a": "E", "bx": "The correct answer was E.This is because it is likely thatthis behaviour would amountto harassment under the Equality Act 2010. Harassment occurs when a person is subjected to unwanted conduct that relates to certain protected characteristics, in this case sexual orientation, and the unwanted conduct violates the victim's dignity, or creates an intimidating, hostile, degrading, humiliating or offensive environment for that person. Options A, B, C and D are incorrect because they fail to classify the conduct as harassment.", "ar": "Legal services", "see": ""}, {"ch": 1, "n": 81, "sc": ["A defendant is defending proceedings brought against them for recovery of money which the claimant alleges they paid towards the restoration of the claimant's classic car. The defendant denies that any money was paid by the claimant to anybody in connection with the restoration project. The court orders that the parties undertake disclosure on the standard basis. Whilst looking through records, the defendant finds a receipt from their garage, which shows a payment was received from the claimant in cash for rebuilding the engine to that classic car."], "st": "Which of the following best represents the position concerning disclosure?", "o": ["The defendant does not need to disclose this document as it is adverse to their defence.", "The defendant does need to disclose the document as they are under a duty to disclose any document that is relevant to the claim. Failing to do so would leave the defendant in breach of the order. senb", "The defendant does not need to disclose this document as it is for the claimant to disclose evidence that supports their claim.", "The defendant does need to disclose the document as they have previously denied that any money was paid. Failing to do so would leave the defendant in breach of the order.", "The defendant does not need to disclose this document as they have not been specifically directed to do so by the court."], "a": "B", "bx": "The correct answer was B. This is because disclosure on the standard basis requires that all documents relevant to a claim, whether or not they adversely affect a party's case, are disclosed (making options A and C incorrect). Option D is incorrect as past representations have no bearing on the duty to disclose, and option E is incorrect as this is not an order for specific disclosure.", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 9"}, {"ch": 1, "n": 82, "sc": ["A music promoter entered into a contract to hire a concert hall owned by the local council. Two days before the date of hire, the concert hall was destroyed by fire. The fire was the fault of neither party."], "st": "Which of the following statements best explains the legal position?", "o": ["The local council is in breach of the contract if the hire cannot take place, due to the doctrine of absolute obligations.", "The local council is in breach of the contract, as they should have taken reasonable steps to avoid the fire.", "The local council will be discharged of any future obligations under the contract as the contract is frustrated.", "The local council and the music promoter will be discharged of all obligations under the contract as the contract is frustrated.", "The music promoter will be able to claim damages to recover the loss of profit they would have made had the contract not been breached."], "a": "C", "bx": "The correct answer was C. This is because the fire occurred after the contract was formed and was beyond the control of either party. It is now impossible to perform the contract. This will frustrate the contract for the hire of the concert hall. The effect of frustration is to discharge the parties of any future obligations under the contract. Any obligations that arose before the frustrating event are not affected by the frustration. Option A is incorrect. If the requirements of frustration are met, then the parties will not be bound by their strict contractual obligations. Option B is incorrect because there is no evidence of any negligence on the facts; the fire was the fault of neither party. As noted above, the effect of frustration is to discharge only those future obligations under the contract. The parties are not discharged of all obligations under the contract (therefore option D is incorrect). Option E is incorrect as the effect of frustration is to discharge future obligations under the contract, meaning the music promoter will not have a valid claim for damages.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 9"}, {"ch": 1, "n": 83, "sc": ["The claimant is a front-seat passenger in the defendant's vehicle when the defendant drives into the rear of another vehicle at a roundabout. The claimant is not wearing a seatbelt. The medical evidence shows that the claimant's failure to wear a seatbelt had no impact on the claimant's injuries."], "st": "What is the likely outcome of the claim against the defendant?", "o": ["The claim will likely fail on the basis the claimant failed to wear a seatbelt.", "The claim will likely succeed but damages will be reduced by 25% to reflect contributory negligence.", "The claim will likely succeed but damages will be reduced by 15% to reflect contributory negligence.", "The claim will likely fail as there has been a break in the chain of causation.", "The claim will likely succeed and there will be no reduction for contributory negligence."], "a": "E", "bx": "The correct answer was E. This is because the court will only reduce damages for contributory negligence and there has been no effect to the claimant's injuries due to the lack of a seatbelt (therefore there has been no such contribution). Option A is incorrect as the claim will succeed due to the fact that the defendant was negligent and collided with the vehicle at the roundabout. Option B is incorrect as there would only be a 25% reduction for contributory negligence if the claimant had suffered injuries that could have been avoided by the use of a seat belt. Option C is incorrect as there would only be a 15% reduction for contributory negligence had the claimant been wearing a seat belt. Option D is incorrect as there has been no break in the chain of causation.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 4"}, {"ch": 1, "n": 84, "sc": ["A claimant is in the final stages of a claim against a defendant over an alleged breach of contract, with damages claimed valued at £84,000. The defendant writes to the claimant with a list of documents that they require to be included in the trial bundle. The claimant believes that the amount of documentation that the defendant is asking to be included is unreasonable and would take them a disproportionate amount of time to reproduce as part of the bundle."], "st": "Which of the following best represents what the claimant should do?", "o": ["The claimant must agree the contents of the trial bundle with the defendant and deal with the preparation of the bundle, including making sufficient copies for the court, all parties and all witnesses. The trial bundle must contain all documents upon which all parties are intending to rely in the trial.", "The claimant should write back to the defendant and advise that, if they wish to include the volume of documents as indicated, they must prepare the trial bundle themselves. The claimant should enclose copies of all documents upon which they intend to rely at trial to enable the defendant to prepare the trial bundle.", "The claimant should write back to the defendant and advise them to prepare their own trial bundle which should be filed on the same date as that of the claimant.", "The claimant should write back to the defendant and advise them that they will only include the number of documents that are proportionate to the value of the claim in the trial bundle.", "The claimant should make an emergency application to the court for an order specifying which of the defendant's documents should form part of the trial bundle."], "a": "A", "bx": "The correct answer was A. This is because it is the claimant's responsibility to prepare the trial bundle (making option B incorrect), which must incorporate all of the documentation that both the claimant and defendant will be relying upon in the trial (making option C incorrect). Options D and E are incorrect as the court will have already considered proportionality of evidence relating to value of the claim at case management stage, and have decided on whether they need to intervene to limit the volume of documents that the defendant is seeking to rely upon.", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 11"}, {"ch": 1, "n": 85, "sc": ["A major law firm recently dealt with a high-value property transaction. The solicitors managing the client's file had concerns about money laundering, which they duly reported to the firm's nominated officer."], "st": "Which of the following statements most accurately describes the steps that the nominated officer should have taken following the disclosure?", "o": ["The nominated officer should have made a disclosure to the Solicitors Regulation Authority as soon as is practicable.", "The nominated officer should have made a Suspicious Activity Report to the National Crime Agency as soon as practicable.", "The nominated officer should have made a Suspicious Activity Report to the Solicitors Regulation Authority as soon as practicable.", "The nominated officer should have made a disclosure to the Financial Action Task Force Authority as soon as practicable.", "The nominated officer should have made a Suspicious Activity Report to the Financial Action Task Force Authority as soon as practicable."], "a": "B", "bx": "The correct answer was B. This is because the nominated officer (NO) is under a legal duty to make a Suspicious Activity Report (SAR) to the National Crime Agency (NCA) as soon as is practicable. Options A and C are incorrect because they imply that the NO is under a duty to make a disclosure/SAR to the Solicitors Regulation Authority. Options D and E are incorrect because they imply that the NO is under a duty to make a SAR to the Financial Action Task Force Authority.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 6"}, {"ch": 1, "n": 86, "sc": ["A client is a private company limited by shares that is operating successfully. The board of directors is considering declaring a dividend."], "st": "Which of the following statements represents the best advice on the use of dividends for the client?", "o": ["Dividends may be declared by the board of directors if the client has made a profit once it has paid its corporation tax liability to HMRC.", "Dividends may be declared by the board of directors if the client has made a profit.", "Dividends must be declared by the board of directors if the client has made a profit once it has paid its corporation tax liability to HMRC.", "Dividends may be declared by the board of directors and are treated as a deductible expense of the business when calculating the client's profits.", "Dividends may be declared by the board of directors and it is the client's responsibility to pay the equivalent of the recipients' liability to income tax at the basic rate (but not the higher rate if applicable) to HMRC."], "a": "A", "bx": "The correct answer was A. This is because the client must first satisfy its obligations to HMRC before it can issue dividends to shareholders. Option B, whilst correct, does not provide the full picture of the transaction (ie, the client must first pay its tax liability). Option C is not correct because dividends do not have to be declared by the board (the use of the word 'must' in the distractor demonstrates this). Options D and E are incorrect in law as they do not represent an accurate statement of the process of declaring dividends.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 4"}, {"ch": 1, "n": 87, "sc": ["A solicitor is acting on behalf of a client who claims they are the victim of a human rights violation. The solicitor discovers that the relevant statutory provision came into effect several years before the Human Rights Act 1998 was enacted."], "st": "Which of the following statements best describes the court's duty to interpret the legislation in a way that is compatible with the Human Rights Act 1998 and the European Convention on Human Rights?", "o": ["Section 3 of the Human Rights Act 1998 requires courts to interpret primary and subordinate legislation in a way that is compatible with the Convention rights. However, this duty does not apply to legislation that was enacted before the Human Rights Act 1998 came into effect.", "Section 2 of the Human Rights Act 1998 requires courts so far as it is possible to do so to interpret primary and subordinate legislation in a way that is compatible with the Convention rights.", "Section 2 of the Human Rights Act 1998 requires courts to interpret primary and subordinate legislation in a way that is compatible with the Convention rights. However, this duty does not apply to legislation that was enacted before the Human Rights Act 1998 came into effect.", "Section 3 of the Human Rights Act 1998 requires courts so far as it is possible to do so to interpret primary and subordinate legislation in a way that is compatible with the Convention rights.", "Courts must follow the usual rules of statutory interpretation and ensure that, wherever possible, words are given their natural and literal meaning."], "a": "D", "bx": "The correct answer was D. This is because section 3 of the Human Rights Act 1998 deals with the court's duty to interpret legislation in a way that is compatible with the Convention rights. Options B and C are incorrect because they state that section 2 of the Act deals with this duty. Option A is incorrect because it states that the duty requires courts to interpret legislation in a way that is compatible with the Convention rights. This is not an accurate statement of the duty because the duty only requires the courts so far as it is possible to do so to interpret legislation in a way that is compatible with the Convention rights. Option E is incorrect as it fails to account for the duty imposed on courts by the Human Rights Act 1998 when interpreting legislation.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 8"}, {"ch": 1, "n": 88, "sc": ["Parliament has recently passed legislation that criminalises the sale and distribution of a new and dangerous drug."], "st": "Which of the following statements most accurately describes the presumptions that a court would presume are implied in the statute?", "o": ["The court would presume that the statute does not apply retrospectively and that any criminal offences stated in the statute require proof of intention.", "The court would presume that the statute does not apply retrospectively, and that any criminal offences require proof of intention unless the statute expressly states otherwise.", "The court would presume that the statute does not apply retrospectively and comes into force on the stated commencement date.", "The court would presume that any criminal offences stated in the statute require proof of intention unless the statute implies otherwise.", "The court would presume that the statute alters any relevant pre-existing common law."], "a": "B", "bx": "The correct answer was B. This is because there are certain presumptions that a court presumes are implied in a statute. The legislation in question deals with criminal offences. The court would presume that any criminal offence requires proof of mens rea unless the statute expressly states otherwise (options A and D are therefore incorrect). There are no presumptions relating to when the legislation will come into force (therefore, Option C is incorrect). There is, however, a presumption that statutes will not apply retrospectively. Option B is therefore the best answer available. Option E is incorrect because the court would have to determine on a case-by-case basis how the statute has altered the common law, if at all.", "ar": "Legal system of England and Wales", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 2"}, {"ch": 1, "n": 89, "sc": ["A client company wishes to expand its business and has the opportunity of acquiring a competitor company. The client company needs to raise finance in order to achieve this but the existing shareholders do not want their current levels of control to be diluted."], "st": "Which of the following describes the option that is least likely to dilute the control of existing shareholders?", "o": ["An issue of preference shares to an outside private investor.", "A debenture including a fixed charge in favour of a high-street lender.", "An issue of ordinary shares to an outside private investor.", "An issue of ordinary shares to an existing shareholder. suozsanb", "Sale of the entire share capital of the company to an interested buyer."], "a": "B", "bx": "The correct answer was B. This is because it is the best option for the client's situation. The MCQ asks what is the 'least likely' manner of dilute control. The use of 'least likely' is designed to test you; 'least likely' indicates that it is possible that all options may dilute control, or risk such, in some way. For example, whilst preference shares do not generally carry voting rights, it is possible that such shares could contain voting rights. For that reason, option A (and the other options) are evidently not the correct answers. Option B is the only option which does not, in some way, divest any element of ownership (and thus voting rights) to a third party.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 4"}, {"ch": 1, "n": 90, "sc": ["A client instructs a solicitor in respect of a personal injury matter. The solicitor and client meet to discuss the matter and explore the funding options that are available to the client. The solicitor advises the client that the case has good prospects of success (in excess of 60%). The client informs the solicitor that they intend to pay their legal costs by use of cover provided through a travel insurance policy and, if necessary, pay any additional costs from their own funds."], "st": "Which of the following statements most accurately describes the sources of funding in this matter?", "o": ["The client will fund the case through a before-the-event insurance policy only.", "The client will fund the case through an after-the-event insurance policy and a private retainer.", "The client will fund the case through an after-the-event insurance policy only.", "The client will fund the case through a before-the-event insurance and a private retainer.", "The client will pay her legal costs through a private retainer only."], "a": "D", "bx": "The correct answer was D. This is because the client intends to pay their legal fees through a travel insurance policy that includes some cover for legal costs. This type of funding is known as before-the-event (BTE) insurance (options B and C are incorrect as they refer to after-theevent insurance). The client also intends to pay any additional legal fees from their own funds. This is known as a private retainer. The client therefore intends to fund their cases through BTE insurance and a private retainer (options A and E are incorrect as they only include one funding option each, as opposed to both funding options). Only Option D correctly identifies the correct types of funding.", "ar": "Legal services", "see": ""}]},Q=D.q,L="ABCDE";let i=0,A={};
