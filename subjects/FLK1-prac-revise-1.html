man's contract with his employer contains a term that upon termination of his contract of employment, the man cannot act as a travelling salesperson in relation to any industry for a period of ten years."], "st": "Which of the following statements best explains whether the man is bound by the term of the contract?", "o": ["The man is bound by the term as the clause is reasonably necessary to protect a legitimate interest of the employer.", "The man is not bound by the term as it is an unreasonable restriction on the livelihood of the man, amounting to a restraint of trade.", "The man is bound by the term as the term has been freely agreed by both parties.", "The man is not bound by the term due to illegality. A clause restraining trade is unenforceable.", "The man is bound by the term in order to protect the trade secrets of the employer."], "a": "B", "bx": "The correct answer was B. This is because a clause that seeks to protect a legitimate interest of the employer must be reasonable. From the facts of the question, there is no evidence as to why a wholesale restriction, for such a long period, is reasonably necessary on the facts. Option A is incorrect because a restriction preventing the man from working as a salesperson in any industry is not reasonably established on the facts. Option C is incorrect as there are limits to the principle of freedom of contract, and a contract in restraint of trade may be unenforceable at common law if it does not reasonably protect a legitimate interest of the employer. A reasonable restriction in order to protect a legitimate interest of the employer may be binding, so it is not true to say that all clauses in restraint of trade are unenforceable (therefore, option D is incorrect). Option E is incorrect because there is no evidence on the facts that the clause seeks to protect the trade secrets of the employer.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 8"}, {"ch": 1, "n": 26, "sc": ["A newly qualified solicitor has been assigned to a new client for the first time. The solicitor has arranged a meeting with the client. A partner in the firm tells the newly qualified solicitor that they know the client well and should not be concerned about performing due diligence checks."], "st": "Which of the following accurately describes the duty of the newly qualified solicitor when meeting with the new client?", "o": ["The newly qualified solicitor should accept the oral representations from the client as to their identity and finances.", "The newly qualified solicitor should ask for the client's identification and verify their information before proceeding.", "The newly qualified solicitor should proceed with the matter without verifying the client's identification as this is only the first meeting.", "The newly qualified solicitor should rely on the information provided by the partner of the firm.", "The newly qualified solicitor should ask the partner to verify the client's identity since the partner knows the client well."], "a": "B", "bx": "The correct answer was B. The is because the SRA Code of Conduct requires a solicitor to identify who they are acting for in relation to any matter. Generally, the client will be asked to attend the firm with two forms of identification and relevant financial statements. The solicitor must check this identification as part of their due diligence and anti-money laundering checks. The solicitor must not accept the oral representations from the client or assume that the client is who they identify themselves as being (therefore option A is incorrect). Option C is incorrect because the first meeting is irrelevant if the client has retained the solicitor. Option D is incorrect as the solicitor has a personal responsibility to identify who they are acting for; relying on information from the partner is not appropriate (therefore option E is also incorrect).", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 1, "n": 27, "sc": ["A client owns 4% of the shares in a private limited company. The company has unamended model articles as its articles of association. On checking the recent accounts of the company, the client is concerned that the directors are effectively paying out all the profits of the company to themselves as directors. The client is not happy about this and seeks advice as to what can be done."], "st": "Which of the following is unlikely to be an available option for the client?", "o": ["Request that the directors call an extraordinary general meeting so that the matter can be discussed by all the shareholders in attendance at the meeting.", "Instigate a derivative action on the basis that the directors' actions amount to a breach of their duties as directors.", "Seek support from other shareholders owning at least 71% of the shares to pass a special resolution to prevent the directors from paying similar amounts to themselves in the future.", "Seek support from other shareholders owning more than 46% of the shares to pass an ordinary resolution to remove the directors from office.", "Apply to the court to require the directors to call an extraordinary general meeting so that the matter can be discussed by all the shareholders in attendance at the meeting."], "a": "A", "bx": "The correct answer was A. This is because option A is not an option available to the client. Only a shareholder owning more than 5% of the shares has the right to ask the directors to call an extraordinary general meeting. All of the other options are available (even if not desirable) and are thus incorrect answers.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 4"}, {"ch": 1, "n": 28, "sc": ["A solicitor is acting for a client in a claim. As part of the directions, the court has ordered that witness statements need to be exchanged no later than 4pm on 1 November. The solicitor drafts all of the witness statements, but is called away to court on 1 November and fails to deliver the copies by the deadline. The defendant's witness statements are delivered by hand to the solicitor's reception at 3.58pm on 1 November, and the receptionist informs the solicitor at 4.05pm. In response, the solicitor hand delivers the claimant's witness statement to the defendant at 4.45pm. The solicitor immediately telephones the defendant's representative to propose an extension to the deadline, but this is rejected. The claimant's solicitor therefore issues an application to the court for relief from sanctions on 3 November."], "st": "Which of the following statements best represents the position of the court in response to the application for relief from sanctions?", "o": ["The court is likely to reject the claimant's application and refuse relief. The court's role is to enforce compliance with procedural rules and directions.", "The court is likely to grant the claimant's application for relief from sanctions on the basis that the failure to comply with the directions is neither serious nor significant, but will order the claimant to pay both parties' costs.", "The court is likely to grant the claimant's application for relief from sanctions on the basis that the failure to comply with the directions is neither serious nor significant, but will make a wasted costs order against the claimant's solicitor for failure to comply with the court ordered direction.", "The court is likely to grant the claimant's application for relief from sanctions on the basis that there was good reason for the failure to comply with the directions and penalise the defendant's solicitor for unreasonably refusing to agree an extension of time.", "The court is likely to grant the claimant's application for relief from sanctions on the basis that there was good reason for the failure to comply with the directions, but will insist that both parties pay their own costs in relation to the application."], "a": "C", "bx": "The correct answer was C. This is because, whilst there is no good reason for the failure to comply (making options D and E incorrect), a 45-minute delay is likely to be found to be trivial and the breach did not impact on any future court hearings. Option A is incorrect because, whilst the court's role is to enforce compliance, the failure is so minor that the court would be unlikely to reject the application. However, given the breach was the fault of the legal representative, it is likely that a wasted costs order would be made against the solicitor for breaching the deadline, as opposed to requiring the claimant to pay the parties' costs (therefore option B is incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 7"}, {"ch": 1, "n": 29, "sc": ["A solicitor is approached by a colleague in the law firm where they work. The colleague explains that they have witnessed sexual harassment on behalf of the senior partner to a paralegal. They have asked the solicitor for their advice in light of the Solicitors Regulation Authority (SRA) Code of Conduct."], "st": "What should the solicitor advise the colleague?", "o": ["The solicitor should advise the colleague not to make any report to the SRA as it may lead to the colleague or the paralegal being subject to detrimental treatment.", "The solicitor should advise the colleague to speak directly to the senior partner concerned about the alleged sexual harassment.", "The solicitor should advise the colleague that they will speak directly to the senior partner concerned about the alleged sexual harassment.", "The solicitor should advise the colleague that the paralegal should speak to the senior partner concerned about the alleged sexual harassment.", "The solicitor should advise the colleague to make a report to the SRA."], "a": "E", "bx": "The correct answer was E. The is because the SRA Code of Conduct requires a solicitor to report promptly to the SRA or another approved regulator, as appropriate, any facts or matters that they reasonably believe are capable of amounting to a serious breach of their regulatory arrangements by any person regulated by them (including themselves). Furthermore, the Code of Conduct requires that the solicitor does not subject any person to detrimental treatment for making or proposing to make a report or providing or proposing to provide information based on such a reasonably held belief. Option A is incorrect as the solicitor should not be seeking to prevent someone from reporting a matter to the SRA. Options B, C and D are incorrect as it would not be appropriate in this circumstance to speak to the senior partner about their own conduct; a report is to be made to the SRA.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 1, "n": 30, "sc": ["A solicitor recently acted on behalf of a client in respect of a high-value civil claim. The client's claim was successful, and the client was awarded substantial damages. The client has now approached the solicitor seeking investment advice. The solicitor advises the client to 'invest in land for property development purposes'."], "st": "Which of the following statements most accurately describes the solicitor's position in respect of financial services legislation?", "o": ["The solicitor is unlikely to have breached financial services regulations because the advice they have provided is generic.", "The solicitor is likely to have breached financial services regulations because they have advised the client in respect of a specified investment.", "The solicitor is unlikely to have breached financial services regulations because the advice they have provided was given in the course of wider legal services.", "The solicitor is likely to have breached financial services regulations because they have provided specific investment advice.", "The solicitor is unlikely to have breached financial services regulations because the advice they have provided is generic and does not relate to a specified investment."], "a": "E", "bx": "The correct answer was E. This is because under financial services legislation, only specific advice concerning specified investments is prohibited. In this scenario, the advice provided by the solicitor is generic (options B and D are therefore incorrect). Furthermore, the advice provided does not relate to a specified investment because land is not a specified investment under financial services legislation (option A is therefore incorrect as it does not explain that land is not a specified investment). Option C is incorrect because the solicitor's advice was not given in the course of a wider legal service as the client's claim has concluded.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 7"}, {"ch": 1, "n": 31, "sc": ["A firm enters into a Damages Based Agreement (DBA) with a client. The DBA is set at 10%. The client wins the case and is awarded £55,000 in damages, a sum that is significantly lower than anticipated. The other party is ordered to pay £1,000 towards the client's costs."], "st": "What is the client's liability in respect of their legal fees?", "o": ["The client is liable to pay £5,500 from the damages they received.", "Under the terms of the DBA the client is not liable to pay any of the solicitor's costs.", "The client is liable to pay £4,500 from the damages they received.", "The client is not liable to pay the solicitor's fee because the damages awarded were less than anticipated.", "The client is liable to pay £1,000 towards the solicitor's costs."], "a": "C", "bx": "The correct answer was C. This is because the Damages Based Agreement (DBA) is set at 10% of the damages awarded. The client's case was successful, so the solicitor is entitled to 10% of the damages awarded (10% of £55,000). The solicitor is therefore owed £5,500. The other party is liable to pay £1,000 which leaves the client with a shortfall of £4,500. This will be deducted from the damages and the client will receive the remaining £50,500. All other options are therefore incorrect.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 8"}, {"ch": 1, "n": 32, "sc": ["A solicitor issues proceedings on behalf of their client against a company for breach of contract. The solicitor drafts the client's witness statement and writes to him enclosing it. The client asks for information about the process, specifically what formalities are required and what may be included in the content."], "st": "Which of the following should be omitted from the letter of advice to the client?", "o": ["The witness statement must comply with the formalities required by the Civil Procedure Rules 1998 and should include a statement of truth.", "The statement should, so far as is possible, be expressed in the client's own words.", "The client can only include evidence that they would be allowed to give orally; irrelevant and inadmissible evidence must be excluded.", "The client may use their witness statement to argue their case and to make observations about the evidence of other witnesses.", "The client must indicate which statements are made from their own knowledge and provide the source of any information that is not."], "a": "D", "bx": "The correct answer was D. This is because the Civil Procedure Rules 1998 lays out the formalities that a witness statement needs to comply with. This MCQ specifically asks which option should be omitted. The necessity for a statement of truth is paramount to a witness statement (therefore, option A is incorrect). Witness statements should also be expressed in the witness's own words where possible (therefore option B is incorrect), indicate which statements are from their own knowledge (making option E incorrect) and only include evidence that they would be allowed to make in an oral submission (making option C incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 8"}, {"ch": 1, "n": 33, "sc": ["The Court of Appeal is considering a civil appeal. The appellant's submissions rely on a previous decision of the Court of Appeal (Civil Division). The respondent's submissions rely on a previous decision of the House of Lords. The Court of Appeal decision is more recent than the House of Lords decision."], "st": "Which of the following statements most accurately describes how the doctrine of precedent would apply in these circumstances?", "o": ["The Court of Appeal is bound to follow its previous decision because none of the reasons to depart from a previous decision applies.", "The Court of Appeal is bound to follow the decision of the House of Lords because it is a senior court in the court hierarchy.", "The Court of Appeal may follow its previous decision because it is more recent than the House of Lords decision.", "The Court of Appeal may choose which of the decisions to follow because it is no longer bound by House of Lords decisions since the creation of the Supreme Court.", "The Court of Appeal may choose which of the decisions to follow because one of the reasons to depart from a previous decision applies."], "a": "B", "bx": "The correct answer was B. This is because the Court of Appeal is bound to follow the decisions of any court above it in the court hierarchy. The House of Lords (which has now been replaced by the Supreme Court) was above the Court of Appeal in the court hierarchy. House of Lords decisions continue to bind lower courts despite being replaced by the Supreme Court. This means that the previous decision of the House of Lords remains binding on the Court of Appeal (option D is therefore incorrect). Remember that the passing of time does not impact whether a binding precedent binds a lower court. Option C is therefore incorrect. There are limited circumstances in which the Court of Appeal may depart from its own decisions. However, these circumstances do not apply to this scenario because the Court of Appeal is bound by the House of Lords decision in any event (options A and E are therefore incorrect).", "ar": "Legal system of England and Wales", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 4"}, {"ch": 1, "n": 34, "sc": ["The owners of a ship charted the vessel to a shipping company. The period of the charter was three years and a term of the contract required that the owners provided a vessel that was 'in every way fit for ordinary cargo service'. Shortly after taking delivery, the shipping company had the vessel inspected by their insurance company. The insurance company refused to issue a certificate of insurance as the inadequate safety equipment provided by the owners of the vessel did not meet the minimal legal standards to sail. As a result, the vessel could not be used for cargo service for a period of three months until replacement equipment was eventually provided by the owners of the vessel. The owners receive communication from the solicitors of the shipping company. The shipping company is seeking to repudiate the agreement and is seeking damages for the loss incurred during the three months the vessel was uninsured and unable to sail."], "st": "Which of the following statements best describes the legal position?", "o": ["The breach is likely to be held as a breach of warranty, allowing the shipping company to recover damages, but the agreement is not repudiated.", "The breach is likely to be held as a breach of condition, allowing the shipping company to repudiate the agreement, and claim damages.", "The shipping company has the choice to repudiate the agreement, but only if it has taken steps to mitigate its loss.", "The owners of the vessel are not liable for the breach, as the breach was not within their reasonable control.", "The contract is frustrated, discharging the parties of future obligations under the contract."], "a": "A", "bx": "The correct answer was A. This is because various breaches could result in the vessel being unfit for ordinary cargo service. In this scenario, it is difficult to anticipate the various ways in which the breach could occur, and the seriousness of the breach. As such, it is likely that the courts would construe the term as an innominate term. The breach is relatively minor and does not deprive the shipping company of the entire value of the contract as the vessel can be used for the remainder of the charter. It is likely that this breach will be treated as a breach of warranty. Damages would provide an adequate remedy for the three-month delay and the breach would not repudiate the agreement. Given the relatively minor breach, and that the vessel can be used for the rest of the period of the charter, it is unlikely that the beach will be considered as a breach of condition (therefore option B is incorrect). If the breach is construed as a breach of warranty, then the shipping company has no right to repudiate the agreement (option C is therefore incorrect). Option D was incorrect as the owners of the vessel would be strictly liable for breach of the term. The key issue is whether this repudiates the agreement, or simply gives rise to a claim for damages, as noted above. The inadequate safety equipment and the three-month delay do not radically alter the obligations or make the contract impossible to perform. It is very unlikely that the contract is frustrated on the facts (therefore option E is incorrect).", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 9"}, {"ch": 1, "n": 35, "sc": ["The claimant is injured when they switch a light on in the changing room of a retail outlet that they are visiting. The owners of the retail outlet have employed a reputable firm of electricians to rewire the retail outlet and it has recently reopened to the public. The claimant suffers a burn injury and pursues a claim against the retail outlet for their injuries."], "st": "What is the likely outcome of the claimant's claim for personal injuries brought against the retail outlet?", "o": ["The claim will likely fail on the basis that the claimant consented to the risk of injury when they switched the light on in the changing room.", "The claim will likely succeed on the basis that the owners of the retail outlet are unable to delegate their duty to ensure visitors to their premises are safe.", "The claim will likely fail on the basis that the owners of the retail outlet instructed competent contractors to rewire the outlet.", "The claim will likely succeed on the basis that by inviting the claimant to the premises it was foreseeable that an injury would occur from the faulty wiring.", "The claim will likely fail on the basis that burn injuries were not a foreseeable risk to the claimant in using the changing rooms at the retail outlet."], "a": "C", "bx": "The correct answer was C. This is because the owners of the retail outlet have a defence on the basis that it was reasonable to employ an independent contractor and that the independent contractor was reputable and competent to undertake the rewiring of the retail outlet. Option A is incorrect as the claimant cannot consent to the risk of injury as they were unaware that there was a risk of injury. Option B is incorrect: as long as the retail outlet have satisfied themselves that they have employed competent contractors, they will have a defence to the claim. Option D is incorrect as the retail outlet has a duty to ensure their visitors are safe, but if they have contracted the rewiring of the retail outlet to a competent contractor, the claim against them will not succeed. Option E is incorrect as there was a foreseeable risk of injury on the basis that there was a problem with the wiring at the retail outlet.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 6"}, {"ch": 1, "n": 36, "sc": ["The claimant is driving two of his colleagues to work in his new motor car. Unbeknown to the claimant, the car has been manufactured with a fault that causes the engine to cut out when the car reaches a certain speed. As the claimant drives along a dual carriageway, the engine cuts out, causing the car to come to an abrupt standstill. The vehicle behind the car attempts to perform an emergency stop to prevent a collision but collides with the rear of the claimant's motor car. A lorry in the queue of traffic behind the car overturns and leaves the carriageway, colliding into a house at the edge of the road."], "st": "Who can bring a claim for personal injury against the manufacturer of the car?", "o": ["The claimant and their passengers.", "Only the passengers in the claimant's vehicle.", "The claimant, their passengers and the lorry driver.", "The claimant, their passengers, the lorry driver and any occupants of the house.", "The claimant, their passengers, the occupants of the car directly behind the claimant's car, the lorry driver and any occupants of the house."], "a": "E", "bx": "The correct answer was E. This is because all those injured are consumers for the purpose of negligence in respect of the defective product (the engine). Therefore, all other options are incorrect on the basis that anyone injured due to the defective engine will be deemed to be a consumer for the purposes of defective product liability.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 7"}, {"ch": 1, "n": 37, "sc": ["A client wishes to bring a claim against a company for breach of contract. The solicitor advises the client that the case is relatively straightforward and has good prospects of success. The solicitor estimates that the client may be able to recover damages of approximately £52,000."], "st": "Which of the following statements most accurately describes the appropriate court to consider the client's case?", "o": ["The case should be commenced in the High Court because the estimated value of the claim is less than £100,000.", "The case should be commenced in the County Court because the estimated value of the claim is less than £100,000.", "The client may choose to commence proceedings in the County Court or the High Court, regardless of the value of the claim.", "The case should be commenced in the High Court because the estimated value of the claim is more than £50,000.", "The case should be commenced in the County Court because the estimated value of the claim is more than £50,000."], "a": "B", "bx": "The correct answer was B. This is because civil claims that are valued at less than £100,000 should usually be commenced in the County Court. Cases valued at less than £100,000 may be commenced in the High Court if they are particularly complex. The facts here make clear that the case is relatively straightforward so there is no reason to commence this claim in the High Court (options A and C are therefore incorrect). In personal injury cases, claims valued above £50,000 may be commenced in the High Court. The claim in this scenario relates to a breach of contract so the £50,000 threshold is not relevant (therefore options D and E are incorrect).", "ar": "Legal system of England and Wales", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 1"}, {"ch": 1, "n": 38, "sc": ["The claimant is a lawyer and works from home, only occasionally going to the office to attend meetings. In the claimant's home office, they have their work laptop, work smartphone, personal computer and personal smartphone. Due to a defective charger purchased by the claimant from a well-known IT retailer, a small fire breaks out, which causes damage to both computers and both phones, and burns the claimant's hand when they attempt to put the fire out."], "st": "What is the likely outcome of a claim brought under the Consumer Protection Act 1987 for personal injury and property damage against the IT retailer by the claimant?", "o": ["The claimant will likely be able to claim for personal injury and damage to all property.", "The claimant will likely be able to claim for personal injury but not damage to property.", "The claimant will likely be able to claim for personal injury and damage to their personal smartphone and personal computer as long as it exceeds £275.", "The claimant will likely be able to claim only for the work laptop and work smartphone as long as the value is no more than £275 and personal injury.", "The claimant will likely be able to claim for the faulty chargers, personal injury and all damage to property irrespective of its value."], "a": "C", "bx": "The correct answer was C. This is because damage to business property (the work laptop and the work smartphone) is outside the scope of the Consumer Protection Act 1987 and damage to personal property (the personal computer and personal smartphone) must exceed £275 in value. Options A and D are incorrect due to the business property exclusion under the Act. Option B is incorrect as the claim for damage to personal property will succeed (if the value exceeds £275). Option E is incorrect as damage to the charger is economic loss and this is not covered under the Act.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 7"}, {"ch": 1, "n": 39, "sc": ["A client is a private company limited by shares with unamended model articles of association and has the following shareholders: Shareholder A - owns 50% of the ordinary share capital Shareholder B - owns 25% of the ordinary share capital Shareholder C - owns 20% of the ordinary share capital Shareholder D - owns 5% of the ordinary share capital."], "st": "In relation to shareholder rights and powers, which of the following statements represents an accurate summary of the law?", "o": ["Shareholder A is a person of significant control, and can pass and block an ordinary resolution.", "Shareholder A is a person of significant control and can block an ordinary resolution.", "Shareholder B is a person of significant control and can block a special resolution.", "Shareholder B is not a person of significant control but can block a special resolution.", "Shareholder C is a person of significant control but is unable to block a special resolution."], "a": "B", "bx": "The correct answer was B. This is because all elements of the option are correct. Option A is incorrect because Shareholder A with 50% cannot pass an ordinary resolution, but can block one. Option C is incorrect as Shareholder B has insufficient shares to block a special resolution. Option D is incorrect as Shareholder B is a person of significant control, whereas option E is incorrect as Shareholder C is not a person of significant control.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 4"}, {"ch": 1, "n": 40, "sc": ["A defendant has a contract with a hotel to landscape the hotel's gardens ready for the official opening on 14 May. The defendant orders 2,000 plants and shrubs to complete the landscaping for the hotel from a third-party supplier, the claimant, for £18,500 to be delivered by 7 May. However, the goods do not arrive until 20 May. The defendant refuses to pay the invoice to the claimant. The claimant issues proceedings in the County Court for the monies due and the defendant responds with a defence stating: 'We dispute the payment. The goods arrived too late so we could not fulfil our contract with the hotel. The terms of the contract were agreed orally at a meeting where our sales director made it clear to the claimant's facilities manager that the plants and shrubs had to be delivered by 7 May to allow time for planting and that time was of the essence.' The claimant applies to the court for an order for summary judgment."], "st": "Which of the following answers best describes the likely outcome of the claimant's application for summary judgment?", "o": ["The claimant is likely to succeed in its application because the defendant's defence does not provide sufficient detail for the court to determine the matter.", "The claimant is likely to fail in their application because the court needs to hear oral evidence from witnesses at trial to determine whether time was of the essence. This is necessary to establish whether there is a compelling reason as to why the matter should proceed to trial.", "The claimant is likely to fail in their application but only because the information provided in the defence is sufficient to demonstrate that the defendant has a real prospect of successfully defending the claim.", "The claimant is likely to fail in their application because the matter is too complex and technical to be dealt with at a summary judgment hearing, and this is a compelling reason why the matter should proceed to trial.", "The court is likely to make a conditional order as it is possible but not probable that the defence will succeed."], "a": "B", "bx": "The correct answer was B. This is because although there is not quite enough in the defence to demonstrate that the defendant has a real prospect of successfully defending the claim (making option C incorrect), the court will almost certainly need to hear oral evidence from other witnesses to establish whether time was of the essence and will need to take place at trial. This would therefore be a compelling reason why the claim should proceed to trial (therefore, option D is incorrect). The defendant's defence provides sufficient detail for the court to see there is an issue that needs to be tried (making option A incorrect) and it is very unlikely that the court would make a conditional order in these circumstances (therefore, option E is incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 7"}, {"ch": 1, "n": 41, "sc": ["A claimant is successful in a breach of contract multi-track claim valued at £475,000 against a defendant. The parties both filed their costs budgets on time before the directions hearing, and the court approved those costs budgets. The claimant's costs budget totalled £150,000. At trial, the court makes a costs order in the claimant's favour with such costs to be assessed on the standard basis. The claimant submits a costs claim in the sum of £345,000, arguing that the litigation has proved more costly than predicted."], "st": "Which of the following best represents the position on whether the claimant is likely to recover the full value of their costs?", "o": ["The claimant will be able to recover the full value of their costs as the overall amount claimed is proportionate to the judgment amount.", "The claimant will be able to recover the full value of the costs approved in the costs budget as the amount submitted as part of the costs budget was regarded as being proportionate to the value of the dispute.", "The claimant will be able to recover the full value of their costs as the court does not need to take proportionality into consideration when assessing costs in multi-track trials.", "The claimant will be able to recover the full value of the costs approved in the costs budget and make an application to be awarded the additional costs as the court does not need to take proportionality into consideration when assessing costs in multi-track trials.", "The claimant will be able to recover the full value of the costs approved in the costs budget and make an application to be awarded the additional costs as the court does not need to take proportionality into consideration when assessing costs if a party has been successful in the action overall."], "a": "B", "bx": "The correct answer was B. This is because the court will look at the basis on which costs have been awarded; the standard basis. This means that the court must take proportionality into consideration when making its award (therefore options C, D and E are incorrect). With the value of the claim being £475,000, the claimant's claim for £345,000 is therefore likely to be viewed as being disproportionate and the trial judge will consider each item in the cost breakdown to see whether it was reasonably incurred (and if not, it will be disallowed) and reasonable in amount (and if not, it will be reduced). With the claim being a multi-track high-value matter, the parties have already submitted and had approved a costs budget, which the trial judge must take into consideration. Proportionality of the costs budget is also considered by the judge in the directions hearing, and so it is highly likely that the claimant will recover the costs that were submitted as part of the costs budget but not the full value they have claimed (therefore option A is incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 10"}, {"ch": 1, "n": 42, "sc": ["A client seeks advice on a particular business type. The client describes the business as one where the owners of the business are often called members and can be individuals or corporations. Liability is limited to the extent that a member has already contributed to the assets of the business. Important details are notified to Companies House. This type of business medium is a legal entity in its own right. A formal agreement governs the relations between members. Members can be removed by a majority of other members following an agreement between the members that this power exists."], "st": "Which of the following is the most accurate statement of the type of business being described by the client?", "o": ["A traditional partnership.", "A public limited company.", "A private company limited by shares.", "A limited liability partnership.", "A private company limited by guarantee."], "a": "D", "bx": "The correct answer was D. This is because the client appears to be describing a limited liability partnership (LLP). An LLP has a separate legal personality, unlike a traditional partnership (therefore option A is incorrect). The main distinction between an LLP and a company is that shareholders in any of the companies described in options B, C and E cannot be removed by a majority of others.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 1"}, {"ch": 1, "n": 43, "sc": ["A man wishes to make a claim for judicial review of a decision by his local authority. The man owns and runs a taxi company, and is concerned by the fact that the local authority has taken the decision to substantially change the requirements to be granted a taxi driving licence. The man claims that the changes would adversely impact his business and other taxi businesses in the area."], "st": "Which of the following statements most accurately describes the likelihood of the man being able to bring a claim for judicial review?", "o": ["The man is unlikely to be regarded as having sufficient interest in the claim because he would not be able to demonstrate that the local authority's decision has impacted a significant proportion of the public.", "The man is likely to be regarded as having sufficient interest in the claim because the decision impacts his business directly. The local authority would be classified as a public body exercising a public function.", "The man is unlikely to be regarded as having sufficient interest in the claim because he would not be able to demonstrate that the local authority was exercising a public a function. o", "The man is likely to be regarded as having sufficient interest in the claim because his rights have been directly impacted by the local authority's decision. The local authority would be classified as a public body exercising a public function.", "The man is unlikely to be regarded as having sufficient interest in the claim because he would not be able to demonstrate that the local authority's decision has impacted a right protected by the Human Rights Act 1998."], "a": "D", "bx": "The correct answer was D. This is because the man is likely to be deemed to have sufficient interest in the claim. Option A is incorrect because there is no requirement for a claimant to demonstrate that a significant proportion of the public have been impacted by the local authority's decision. The man only needs to be able to demonstrate that his rights have been impacted by the decision of a public body exercising a public function. There is no requirement that he demonstrates that the decision directly impacts his business or interferes with his human rights (options B and E are therefore incorrect). Option C is incorrect because the local authority is exercising a public function when it regulates the licensing of taxi drivers in its area.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 7"}, {"ch": 1, "n": 44, "sc": ["The court is being asked to consider whether to award the remedy of specific performance or to grant an injunction."], "st": "Which of the following statements is relevant to whether the court will exercise its discretion to make such awards?", "o": ["Specific performance will only be awarded when it is reasonable to do so.", "An injunction will only be awarded when it would be inequitable not to do so.", "The court is unlikely to grant either specific performance or an injunction when damages would provide an adequate remedy.", "The court can only grant an injunction or order specific performance in relation to contracts for the sale of land.", "The court is likely to grant either specific performance or an injunction in relation to a contract of employment."], "a": "C", "bx": "The correct answer was C. This is because specific performance and injunctions are equitable remedies and are awarded at the discretion of the court. If damages provide an adequate legal remedy, then it is unlikely that the court will exercise its discretion and award either remedy when there is sufficient recourse at common law. Specific performance is an equitable remedy and as such it is at the court's discretion, and is not a question of reasonableness (option A is therefore incorrect). Option B is incorrect: it is a clearly inaccurate statement as the purpose of the award of an injunction is to avoid an inequity when there is no adequate remedy at common law. Option D is incorrect because specific performance or an injunction are not confined to contracts for the sale of land and could be awarded in relation to contracts for goods, for example. Option E is incorrect because it is very unlikely that the court would grant specific performance in relation to a contract of service. The effect would be to compel an employee to work and would only be awarded in exceptional circumstances.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 10"}, {"ch": 1, "n": 45, "sc": ["A claimant makes a Part 36 offer of £40,000 on 1 March to the defendant to settle their dispute. The offer expires on 22 March. The defendant rejects the offer and the matter proceeds to trial. After considering the evidence, the judge finds in the claimant's favour and damages are awarded against the defendant in the sum of £45,000."], "st": "Which of the following best represents the likely order the court will make concerning costs?", "o": ["Unless it is unjust to do so, interest will be payable on the claimant's costs from 23 March onwards at a rate of 1% above base rate.", "Unless it is unjust to do so, interest will be payable by the defendant on the damages awarded at a rate of up to 10% above base rate from the date of cause of action.", "Unless it is unjust to do so, a split costs order will be made so the defendant is ordered to pay the costs up to 22 March, and the claimant pays the costs from 23 March up to and including the trial.", "Unless it is unjust to do so, the defendant will pay the claimant's costs on the standard basis up to 22 March and thereafter, from 23 March, on the indemnity basis.", "Unless it is unjust to do so, the defendant will pay the claimant's costs on the indemnity basis up to 22 March and thereafter, from 23 March, on the standard basis."], "a": "D", "bx": "The correct answer was D. This is because the claimant has made the defendant an offer, which they have gone on to beat at trial. Part 36 of the Civil Procedure Rules 1998 states that, unless it was unjust to do so, the defendant will pay the claimant's costs on the standard basis until the expiry of the relevant period (21 days after 1 March, so 22 March) and on the indemnity basis thereafter (therefore option E is incorrect). Split costs orders would only be applicable here if the defendant had made a Part 36 offer which had been more advantageous than the amount the claimant was awarded at trial (therefore, option C is incorrect). Any amounts in respect of interest will be dealt with once the court has made an order concerning the mechanism by which costs will be calculated (making options A and B incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 10"}, {"ch": 1, "n": 46, "sc": ["A liquidator of a company is appointed. The company has total assets amounting to £420,850,000 once the liquidator has collected in all available assets. The liquidator has been notified of debts as follows: a secured loan of £250,000,000 which is secured by a fixed charge preferential debts owed to employees of £3,160,000 a secured loan which, after ring fencing, secures £130,000,000 by way of a floating charge an outstanding corporation tax bill of £23,690,000 owed to HMRC rent arrears of £37,000,000 a loan granted to the company by the wife of one of the directors in the amount of £5,000,000 trade creditors and other sums owed to ordinary creditors of £10,750,000. There are no winding-up expenses."], "st": "Which of the following percentages best represents the amount in each £1 owed that will be paid to the company's ordinary unsecured creditors?", "o": ["57.6%.", "55.3%.", "45.8%.", "66.6%.", "52.8%."], "a": "E", "bx": "The correct answer was E. This is because there is insufficient money in the company to pay all of the money owed to the company's ordinary unsecured creditors. This MCQ requires a candidate to ascertain which of the creditors will have already been paid (secured loans and employees = £383,160,000) and which fall lower down the statutory order of distribution than the ordinary unsecured creditors and are therefore not likely to receive any money on the distribution (loan to person connected to a director). Total unsecured creditors = £71,440,000, therefore there is a shortfall of £33,750,000. This means that option E is the option closest to the amount that best represents the percentage that will be paid to this category of creditors.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 6"}, {"ch": 1, "n": 47, "sc": ["A claimant is successful in their application for judicial review of their local planning authority's decision to refuse to consider a planning application. The court found that the authority had failed to comply with its statutory duty to consult interested parties."], "st": "Which of the following remedies is likely to be the most appropriate in this case?", "o": ["A quashing order.", "An injunction.", "A prohibiting order.", "Damages.", "A mandatory order."], "a": "A", "bx": "The correct answer was A. This is because a quashing order quashes the original decision and obliges the authority to retake a decision in a lawful way (e.g. by following the prescribed procedure). A quashing order is therefore likely to be the most appropriate order from the list of orders provided. The court also has the power to make a mandatory order if it wished to compel the local planning authority to do something specific, or do so within a set timeframe (in this case, to consider the planning application and comply with its statutory duty to consult interested parties), but the making of such orders is comparatively rare and is unlikely to be necessary in these circumstances described in the scenario. Options B, C, D and E are incorrect because they identify remedies that would not be appropriate in this case.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 7"}, {"ch": 1, "n": 48, "sc": ["The claimant has lived in their rural property for one year. The claimant is woken nightly by lorries delivering goods to a large warehouse on the outskirts of the claimant's village. The warehouse operator has recently expanded their business interests to include exports, as well as imports."], "st": "Which of the following best describes whether the claimant has a claim against the warehouse operator?", "o": ["A claim in private nuisance would likely fail on the basis that the claimant has lived in the area for only a short period of time.", "A claim in public nuisance would likely succeed on the basis that the warehouse operator has increased their trade and the frequency of the lorries is interfering with the public's enjoyment.", "A claim under the rule in Rylands v Fletcher would likely succeed on the basis that the warehouse operator's use of the land and roads are non-natural.", "A claim in private nuisance would likely succeed as the frequency and noise of the lorries at night represent an unreasonable interference with the claimant's reasonable enjoyment of their property.", "A claim in private nuisance would likely fail on the basis that the claimant has come to the nuisance."], "a": "D", "bx": "The correct answer was D. This is because the frequency, location and timing of the lorries would indicate a claim in private nuisance. Option A is incorrect as the period of time the claimant has lived in the area is irrelevant. Option B is incorrect as a claim in public nuisance can only be brought if it affects a class/group of the public; there is no evidence of the wider public being affected. Option C is incorrect as Rylands v Fletcher refers to the escape of items that are nonnaturally on the land; that is not relevant to this case. Option E is incorrect as the defence of 'coming to the nuisance' will not succeed because the nuisance has arisen following the claimant living at that property; the expansion of the warehouse operator's business has come after the claimant has lived at the property for some time.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 7"}, {"ch": 1, "n": 49, "sc": ["A judge is considering a criminal law case concerning possession of a weapon in a public place. The legislation prescribing the offence provides that 'It is an offence to possess a firearm in a public place without lawful authority to do so'. The legislation also states that 'The term firearm refers to a rifle, pistol, pellet gun, stun gun, handgun, shotgun, or other similar weapons'. The defendant is charged with possession of an air rifle in a public place."], "st": "Which of the following statements most accurately identifies how the rules of language are likely to apply in this case?", "o": ["The ejusdem generis rule would apply. The air rifle is likely to be deemed to be a weapon under the Act because it is similar to the other weapons listed in the section.", "The expressio unius est exclusio alterius rule would apply. The air rifle is unlikely to be deemed to be a weapon under the Act because it is not expressly listed as a weapon in the section.", "None of the rules of language are likely to apply in this case.", "The ejusdem generis rule would apply. The air rifle is unlikely be deemed to be a weapon under the Act because it is not sufficiently similar to the other weapons listed in the provision.", "The noscitur a sociis rule would apply. The air rifle is likely to be deemed to be a weapon under the Act because it is clear from the wording of the section that an air rifle is a weapon within the meaning of the Act."], "a": "A", "bx": "The correct answer was A. This is because the statutory provision lists a number of firearms followed by the words 'or other similar weapons'. This means a judge may determine that weapons that are not specifically listed in the section are firearms for the purpose of the legislation (option B is therefore incorrect). Option C is evidently incorrect as the rule of language in option A can be used here. There are strong similarities between air rifles and the other firearms listed in the statute, so an air rifle is likely to be considered to be similar to the other types of firearms listed in the statute (option D is therefore incorrect). The noscitur a sociis rule is only applied where the meaning of a word used in the statute is ambiguous or unclear. Option E is incorrect because the noscitur a sociis rule would not be applicable to this scenario.", "ar": "Legal system of England and Wales", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 3"}, {"ch": 1, "n": 50, "sc": ["The claimant's business property is destroyed when a neighbouring building explodes. The neighbouring building was used to store gas canisters. The owner of the building had failed to appreciate that the canisters needed to be used within a limited period of time. Storing the canisters beyond their expiry date has caused them to react with the air and explode."], "st": "Which of the following best describes the legal position?", "o": ["The claimant is likely to be able to bring a claim pursuant to Rylands v Fletcher as their neighbour has brought something onto the land that escaped and was foreseeable to cause harm in doing so.", "The claimant is unlikely to be able to bring a claim pursuant to Rylands v Fletcher as the explosion is an inevitable accident and not foreseeable.", "The claimant is likely to be able to bring a claim in private nuisance as the explosion is an unreasonable interference with the claimant's enjoyment of their property.", "The claimant is unlikely to be able to bring a claim pursuant to Rylands v Fletcher as the explosion is an isolated incident.", "The claimant is likely to be able to bring a claim in public nuisance as the storing of expired canisters has caused unreasonable interference with a class of people, namely the claimant's neighbours."], "a": "A", "bx": "The correct answer was A. This is because the storage of cannisters past their expiry date is a negligent act, and is likely to do harm if they escaped. Storing the cannisters is a non-natural use of the land. This is a classic Rylands v Fletcher example; whilst an explosion alone would not be sufficient, an explosion caused by a negligent act would be. Option B is incorrect because the explosion is not an inevitable accident; it is due to the owner of the building storing gas cannisters past their expiry date. Option C is incorrect as the interference on the land lacks sufficient frequency, which is a requirement for private nuisance. Option D is incorrect as there is no requirement under the rule in Rylands v Fletcher that the incident be more than an isolated incident. Option E is incorrect as the explosion has not affected a class/group of the public, and thus public nuisance is irrelevant.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 7"}, {"ch": 1, "n": 51, "sc": ["A solicitor is acting on behalf of a client who believes that the law governing the pension rights afforded to cohabitees violates their human rights. The client wants the offending statutory provision to be declared void."], "st": "Which of the following statements best describes the court's power to make such a ruling?", "o": ["The Supreme Court can make a ruling that declares a statutory provision to be void because it breaches human rights legislation.", "The High Court, Court of Appeal and Supreme Court may make a declaration that a statutory provision is incompatible with human rights legislation, but they do not have the power to declare that a statutory provision is void.", "The High Court, Court of Appeal and Supreme Court may make a declaration that a statutory provision is void because it breaches human rights legislation.", "Only the European Court of Human Rights has the power to declare that specific provisions of domestic legislation are void if they breach human rights legislation.", "The Court of Appeal and Supreme Court may make a declaration that a statutory provision is void because it breaches human rights legislation."], "a": "B", "bx": "The correct answer was B. This is because Parliament is the sovereign law-making body in the UK so no court can declare any statutory provision in domestic legislation void (options A, C, D and E are therefore incorrect). Section 4 of the Human Rights Act 1998 does, however, give the High Court, the Court of Appeal and the Supreme Court the power to issue a declaration of incompatibility. In essence, this power simply allows those courts to declare that they do not consider a statutory provision to be compatible with the rights guaranteed under the European Convention on Human Rights.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 8"}, {"ch": 1, "n": 52, "sc": ["A man entered into a 12-month lease of a property. The terms of the lease required the man to provide a guarantor in the event that the man failed to pay the rent. Eight months into the lease, the landlord is now bringing a claim against the guarantor as the man has failed to pay the rent for the last six months."], "st": "Which of the following statements best explains the legal position and whether the landlord can claim the arrears from the guarantor?", "o": ["The guarantor is under a primary obligation to pay the arrears. The landlord can choose whether to enforce the claim against the man or the guarantor.", "The guarantor is under secondary obligation to pay the arrears. To enforce the guarantee, the landlord must have first claimed and failed to recover the arrears from the man.", "The guarantor is only liable for the arrears if the terms of the original agreement are unenforceable.", "The guarantor is only liable for the arrears once the 12 months of the lease have expired.", "The guarantor is only liable for the rent due in the four months remaining under the lease. The landlord cannot claim the arrears from the guarantor."], "a": "B", "bx": "The correct answer was B. This is because a guarantee creates a secondary obligation, which only arises once the landlord has first pursued a claim against the man. It does not provide a direct cause of action against the guarantor. Option A was incorrect. Whilst this statement is accurate of an indemnity, which does create a primary obligation for the surety to pay the debt of another, it is not accurate in relation to a guarantee. If the terms of the original agreement are unenforceable, then the guarantee is also unenforceable (option C is therefore incorrect). The guarantor is under an obligation to pay the debt once the man has failed to pay the debt and the landlord cannot recover the arrears from the man. There is no requirement for the landlord to wait for the full length of the lease to run in order to make their claim (therefore option D is incorrect). Option E is incorrect because the secondary obligation of the guarantor is for any unpaid amount accrued for the duration of the lease.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 10"}, {"ch": 1, "n": 53, "sc": ["The claimant issues proceedings against the defendant for breach of contract arising from the installation of a heating system in their flower shop. The claimant claims that, due to inherent defects within the system, the heating failed to come on at the appropriate temperature on the night of 23 November. As a consequence, the claimant's entire stock of valuable roses died, causing losses of £43,000 and damage to their reputation in the industry. This is disputed by the defendant who submits that the fault lay with the claimant in their operation of the system. Both parties have instructed experts. The claimant is a multinational company whereas the defendant is an individual."], "st": "Which of the following best describes the approach the court would take when managing the claim?", "o": ["The aim of the court is to deal with the case justly and at reasonable cost. As a consequence, the court will direct that a single joint expert be appointed to deal with liability.", "The aim of the court is to deal with the case justly and at reasonable cost. As the amount in dispute is only £43,000, the court is unlikely to direct that a single joint expert be appointed.", "The court will concentrate entirely on the merits of the case and will have no regard for the difference in status and financial position of the claimant and the defendant.", "The court will take account of the fact this is a complex breach of contract claim requiring expert evidence and the level of damages sought is £43,000.", "The court will allocate all the resources the claimant requires to resolve the matter because of the importance of the matter to the claimant."], "a": "D", "bx": "The correct answer was D. This is because, when actively managing the claim, the court must take account of all of the factors involved, including complexity, value and any independent expert evidence needed to assist the court with reaching a determination (therefore options A, B and C are incorrect). This will be done with regard for proportionality (making option E incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 7"}, {"ch": 1, "n": 54, "sc": ["The defendant is involved in a personal injury claim against them. It is alleged that the defendant negligently drove their car into the claimant, another road user, causing injury to the claimant. During the course of proceedings, a witness produces a witness statement recounting their version of events in the lead-up to the defendant driving home from a local pub. The witness was present at the pub from when the defendant arrived to when they left; the witness was sitting at the table next to the defendant the whole time. When describing the defendant's state of intoxication, the witness states that the defendant had drunk 'nine pints of beer' and was 'too drunk to drive a car'."], "st": "Which of the following best represents the admissibility of those two sections of the witness's evidence?", "o": ["The evidence of how many pints the defendant drank is admissible as direct evidence, but the evidence that the defendant was too drunk to drive a car is inadmissible as opinion evidence.", "Both the evidence of how many pints the defendant drank and that the defendant was too drunk to drive a car are inadmissible as opinion evidence.", "The evidence of how many pints the defendant drank is inadmissible as direct evidence, but the evidence that the defendant was too drunk to drive a car is admissible as opinion evidence.", "Both the evidence of how many pints the defendant drank and that the defendant was too drunk to drive a car are admissible as opinion evidence.", "The evidence of how many pints the defendant drank is admissible as opinion evidence, but the evidence that the defendant was too drunk to drive a car is inadmissible as opinion evidence."], "a": "A", "bx": "The correct answer was A. This is because the witness is giving two separate pieces of information to the court with different evidential bases. The evidence of how many pints the defendant drank is direct evidence of what the witness saw. This evidence is admissible as direct evidence. On the other hand, the evidence that the defendant was 'too drunk to drive' is opinion evidence. The witness is not qualified to provide this opinion and the evidence is inadmissible. The witness is permitted to comment on what they saw (how many pints the defendant drank), but is not permitted to comment on the effect that the alcohol had on the defendant. All other options are therefore incorrect.", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 8"}, {"ch": 1, "n": 55, "sc": ["A company brings a claim for breach of contract in the High Court, but is unsuccessful at trial. The company wishes to appeal to the Court of Appeal."], "st": "Which of the following best represents the basis upon which permission to appeal would be given?", "o": ["The trial judge has incorrectly applied the law.", "The trial judge has incorrectly interpreted the facts of the case.", "The appeal would have a real prospect of success and there is some other compelling reason for the appeal to be heard.", "The appeal would have a real prospect of success or there is some other compelling reason for the appeal to be heard.", "The appeal would have more than a fanciful prospect of success and there is some other compelling reason for the appeal to be heard."], "a": "D", "bx": "The correct answer was D. This is because the test for whether permission is to be granted by the court is that the appeal would have a real prospect of success or there is some other compelling reason for the appeal to be heard (making option C incorrect). The prospect of success must be more than fanciful (therefore option E is incorrect) and, whilst the decision of a lower court being wrong is a ground of appeal, we are asked here about the test for whether permission to appeal will be granted (making options A and B incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 11"}, {"ch": 1, "n": 56, "sc": ["The claimant has successfully pursued a claim in private nuisance against a nightclub owner in a residential area close to their property. The nightclub owner obtained planning permission from the planning authority to develop the venue as a nightclub. The claimant wants the court to award an injunction to prevent the club from opening. The nightclub incorporates a restaurant and corporate venue, and employs 50 members of staff."], "st": "Which of the following will the court take into consideration when considering the granting of the injunction?", "o": ["Whether the nightclub owner has caused the nuisance by way of negligence.", "Whether the claimant has behaved reasonably in requesting the injunction.", "Whether the nightclub is an unreasonable interference to the claimant's right of enjoyment.", "Whether the presence of the nightclub signifies a disturbance to a class of people.", "Whether a sum of money will adequately compensate the claimant."], "a": "E", "bx": "The correct answer was E. This is because if the court considers that the claimant can be financially compensated, and that it would be oppressive to grant an injunction, they will award damages instead. Option A is incorrect as the claim has not been pursued in negligence (and an injunction is not a remedy for a negligent act). Option B is incorrect as the claimant has already established nuisance and succeeded in their claim. Option C is incorrect as the claimant has been successful in their claim. Option D is incorrect as disturbance to a class of people relates to public nuisance, not private nuisance.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 8"}, {"ch": 1, "n": 57, "sc": ["The court is asked to assess the validity of a contract with a man who claims to have suffered from mental incapacity at the time the contract was formed."], "st": "When assessing the validity of the contract, which of the following best explains the effect of any mental incapacity?", "o": ["The contract will be void once the court is satisfied that the man did not have mental capacity at the time of entering into the contract.", "The contract will only be enforceable if the other party had taken reasonable steps to disprove any claim of capacity at the time the contract was made.", "The contract will be set aside whenever there is evidence of mental incapacity.", "The contract will be voidable if the man is able to prove he lacked mental capacity at the time of the contract, and that the other party knew or ought to have known about the incapacity.", "The contract will be enforceable if the other party can prove that they did not know about any mental incapacity."], "a": "D", "bx": "The correct answer was D. This is because the burden of establishing mental incapacity rests with the party raising it. It is also for them to show that the other party knew or ought reasonably to have known about the incapacity. Once proven, the effect of mental incapacity will make the contract voidable. Mental incapacity renders a contract voidable, not void (therefore, option A is incorrect). Option B was incorrect because the party claiming incapacity must prove such; it is not for the other party to disprove. Option C was incorrect because the contract is voidable for incapacity and is not automatically set aside. Option E was incorrect because actual knowledge of any incapacity is not required if the man can prove that the other party ought to have known about such incapacity.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 3"}, {"ch": 1, "n": 58, "sc": ["A solicitor agrees to act for a client on a 'no win, no fee' conditional fee agreement. The success fee is set at 25%. The solicitor's usual charging rate is £190 per hour. The work undertaken amounts to 20 hours of work. The client's claim is successful, and the client is awarded £4,000 in damages."], "st": "What success fee will the client be liable to pay?", "o": ["A sum of £1,000.", "A sum of £1,900.", "A sum of £950.", "A sum of £4,750.", "The client is not liable to pay a success fee."], "a": "D", "bx": "The correct answer was D. This is because the solicitor is entitled to their usual fees plus the additional conditional agreement fee. The solicitor's usual charging rate is £190, and they have undertaken 20 hours of work. They are therefore owed £3,800 plus the Conditional Fee so the additional fee would be Agreement (CFA) fee. The CFA is set at 25% so the additional fee would be 25% of £3,800 (which is £950). The total amount that the client is liable to pay the solicitor is therefore £4,750 (£3,800 plus £950). Options A, B and C are incorrect because they fail to correctly calculate the solicitor's fee under the terms of the CFA. Option E is incorrect because the client's case was successful, so the client is liable to pay their solicitor's fees.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 8"}, {"ch": 1, "n": 59, "sc": ["The UK Parliament wishes to introduce legislation that will apply to both England and Wales. The proposed legislation relates to matters which are not reserved for the UK Parliament."], "st": "Which of the following statements most accurately describes the power of the UK Parliament to make such legislation?", "o": ["The UK Parliament does not have the power to make laws for Wales concerning devolved matters over which the Senedd has legislative competence.", "The UK Parliament reserves the right to make laws for Wales, even on devolved matters over which the Senedd has legislative competence. However, this power can only be exercised in emergency situations.", "The UK Parliament reserves the right to make laws for Wales, even on devolved matters over which the Senedd has legislative competence. However, this power can only be exercised if the monarch has given consent.", "The UK Parliament reserves the right to make laws for Wales, even on devolved matters over which the Senedd has legislative competence.", "The UK Parliament reserves the right to make laws for Wales, even on devolved matters over which the Senedd has legislative competence. However, this is subject to a constitutional convention that the UK Parliament will not normally do so without the consent of the Senedd."], "a": "E", "bx": "The correct answer was E. This is because the UK Parliament reserves the power to make laws for Wales, although it does not generally make laws on matters which are not reserved. Option A is therefore incorrect. It is, however, important to note that there is a constitutional convention which stipulates that the UK Parliament would not usually exercise this power without the consent of the Senedd. Option D is technically correct but is not the single best answer because it does not acknowledge that this power is subject to a constitutional convention. Options B and C are incorrect because there is no requirement that this power is only used in emergencies or for the monarch to give consent.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 9"}, {"ch": 1, "n": 60, "sc": ["A clause in a partnership agreement states as follows: 7. DRAWINGS AND SALARIES 7.1 The Net Profits or Net Losses of the Partnership shall be divided equally between the Partners. 7.2 Each Partner shall be entitled to draw out of the Partnership Bank account for his own use, such sum as may from time to time be agreed by all the Partners on account of his drawings being his or her accruing share of the Net Profits for each Accounting Period provided that no sum shall be so drawn unless there is money in the account available for such purpose in excess of the monies necessary for the current expenses of the Partnership. 7.3 If in any Accounting Period the aggregate amount drawn out by any Partner shall be found to exceed the amount of his share of the Net Profits for that Accounting Period he shall repay within 30 days of the end of such Accounting Period such excess. 7.4 It is agreed that an annual salary in the sum of £30,000 shall be paid to the Partners and that this shall be in addition to such Partners' share of Net Profits and will not be on account of the same and furthermore that such salaries shall be paid whether or not there is sufficient cleared money in the Partnership Bank account available for such purpose. Such salaries shall be subject to increases as may from time to time be agreed by all the Partners.'"], "st": "Which of the following statements best represents a combination of elements that exist in this partnership that deviate from the provisions of the Partnership Act 1890?", "o": ["Apportionment of Net Profits/Losses, ability to make drawings and payment of a salary to each Partner.", "Apportionment of Net Profits/Losses, ability to make drawings, requirement to repay in the event of drawings exceeding a Partner's share of Net Profits and payment of a salary to each Partner.", "Ability to make drawings, requirement to repay in the event of drawings exceeding a Partner's share of Net Profits and payment of a salary to each Partner.", "Ability to make drawings and requirement to repay in the event of drawings exceeding a Partner's share of Net Profits.", "Apportionment of Net Profits/Losses, ability to make drawings and requirement to repay in the event of drawings exceeding a Partner's share of Net Profits."], "a": "C", "bx": "The correct answer was C. This is because the Partnership Act 1890 provides for equal apportionment of profits and losses. Therefore, options A, B and E do not represent deviations from the Act. Option D ignores the salary provision.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 2"}, {"ch": 1, "n": 61, "sc": ["A man writes a letter to a woman offering to sell her his gold watch for £5,000. The man promises to keep his offer open for five days. The woman receives the letter two days later and immediately replies by Royal Mail accepting the man's offer. The woman's letter of acceptance is delayed in the postal system and finally arrives seven days after the man's initial offer was sent. In the meantime, six days after the man's offer was made, the man sells the watch to a third party. The woman has discovered that the watch has been sold and now brings a claim for breach of contract."], "st": "Which of the following statements best explains whether the man has breached his 1 contract with the woman?", "o": ["The man is not in breach of contract as his promise to keep the offer open for five days was not supported by consideration.", "The man is in breach of contract as his promise to keep the offer open for five days was legally binding.", "The man is not in breach of contract as the womans letter of acceptance was received after the offer had lapsed.", "The man is in breach of contract as the woman's letter of acceptance was effective when posted two days after receipt of the offer and before the watch was sold to a third party.", "The man is not in breach of contract as the woman's acceptance was not communicated to the man before the offer had lapsed."], "a": "D", "bx": "The correct answer was D. This is because the postal rule provides an exception to the general rule that an acceptance is only effective when communicated. As the woman's acceptance was posted using Royal Mail, her acceptance will be effective when posted. This is two days after the offer was made and before the watch was sold to the third party. The man therefore breaches his contract with the woman when he sells the watch to a third party on the sixth day. It is correct that the promise to keep the offer open will not be binding in the absence of consideration, but the woman's acceptance is effective before the five days have elapsed and before the watch is sold to the third party (option A is therefore incorrect). Option B is incorrect because the promise to keep the offer open is not binding in the absence of consideration. As noted above, this is irrelevant as the woman's acceptance was effective on the second day when the offer was still open. If properly posted using Royal Mail, the woman's acceptance will be effective when posted. Her acceptance is effective on the second day and when the offer is still open (therefore, option C is incorrect). Option E is incorrect because the postal rule provides an exception to the requirement for the woman to communicate her acceptance.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 1"}, {"ch": 1, "n": 62, "sc": ["The claimant is a teacher at a local school that is undergoing renovation works. The contractors are working on the school during the summer holidays when there are no children on the premises. The claimant visits the school to collect some marking to complete over the holidays. They visit at lunchtime when most of the contractors are off-site. As the claimant walks into the school office, they trip over a toolbox, breaking their wrist and causing bruising to their face and body. The teacher brings a claim against the school."], "st": "What is the likely outcome of the claim?", "o": ["The teacher's claim will likely fail against the school as the school was not responsible for the teacher's accident.", "The teacher's claim will likely succeed against the school as the school has a non-delegable duty of care towards the health and safety of the teacher.", "The teacher's claim will likely fail against the school as the teacher took the risk by attending the school during the period when they knew renovation works were taking place.", "The teacher's claim will likely succeed against the school, but damages will be reduced to reflect the contributory negligence of the teacher.", "The teacher's claim will likely fail against the school as the school cannot be expected to know the claimant would attend the school premises."], "a": "B", "bx": "The correct answer was B. This is because the employer has a non-delegable duty of care to their employees. Option A is incorrect as the school owes their employees a duty of care. Option C is incorrect as the claimant was not the author of their own misfortune; they tripped over a toolbox carelessly left by the builders. Option D is incorrect because it is unlikely the claimant's damages will be reduced if the contractor's toolbox was carelessly left on the floor. Option E is incorrect as it is reasonable to assume tha
