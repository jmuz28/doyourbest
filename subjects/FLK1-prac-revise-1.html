<script>
const D={"t": ["Session 1", "Session 2"], "q": [{"ch": 0, "n": 1, "sc": ["Two companies are locked in a contractual dispute over non-performance. Proceedings have been issued and a stay of proceedings has been ordered to enable the parties to attempt alternative dispute resolution (ADR). The opponent proposes mediation. However, the client, who is the claimant in the matter, responds to the proposal and refuses to engage in mediation, citing the opponent's alleged history of non-performance as a reason for not trusting the opponent to engage in the mediation process. The case proceeds to trial and the client is successful in the action."], "st": "Which of the following best describes how the court will likely deal with the legal costs of the action and why?", "o": ["The court will likely order that the opponent pay the client's legal costs in full as the client's allegations of the opponent's non-performance of the contract has been proved. The client was therefore fully justified in their distrust of the opponent's offer to mediate.", "The court will likely order that the opponent pay the client's legal costs in full as the client has been successful in the action overall, applying the principle that costs follow the event.", "The court will order that the client pay the opponent's legal costs in full, as the client has unreasonably refused to engage in mediation.", "The court will order that the client pay a percentage of the opponent's legal costs as well as their own by way of sanction for unreasonably refusing to mediate.", "The court will order that the opponent pay a percentage of the client's legal costs as well as their own as they made a genuine offer to mediate."], "a": "D", "bx": "The correct answer was D. This is because the court would almost certainly impose a costs sanction, due to the client refusing the opponent's attempts to mediate, by ordering them to pay their own legal costs and fees as well as a percentage of the client's. Options A and B are incorrect as it is unlikely that the allegations of non-performance would have any bearing on the court's decision relating to costs and, given the refusal to mediate, it is unlikely the court would adopt a 'costs follow the event approach' here. Option C is not correct as it is very unlikely that the court would order the client to pay full costs for a single refusal to mediate. Option E is not correct as it is unlikely that the opponent would be penalised, given they made the offer to mediate in the first place.", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 1"}, {"ch": 0, "n": 2, "sc": ["A woman advertises her car for sale. A man sees the advertisement and comes to inspect the car. The woman then agrees to sell the car to the man for the sum of £8,000. The market value of the car is £15,000. The man pays a deposit of £2,000 and agrees to pay the remainder when he collects the car the next day. Later that evening, the woman contacts the man and tells him that she received a higher offer by a third party and will not sell the car to the man for £8,000."], "st": "Which of the following best describes the legal position?", "o": ["The woman is bound to sell the car to the third party, as the third party has offered the higher amount overall.", "The woman is bound to sell the car to the man, as the man has provided sufficient consideration in exchange for the woman's promise to sell for £8,000.", "The woman is not bound to sell the car to the man, as the sum of £8,000 is insufficient as consideration as it is significantly less than the market value of the car.", "The woman is not bound to sell the car to the man, as she is not required to keep her offer open and can withdraw it at any time.", "The woman is not bound to sell the car to the man, as the payment of £2,000 made by the man will be regarded as past consideration."], "a": "B", "bx": "The correct answer was B. This is because consideration must be legally sufficient, but does not need to be adequate. The payment of £2,000 and the promise to pay the remaining amount the next day will be legally sufficient as consideration. The woman is therefore bound by her promise to sell the car to the man and will be in breach of contract if she refuses sale, or if she were to sell the car to the third party in the meantime. Option A is incorrect as it is irrelevant that the third party has offered more overall. The man has already formed an agreement with the woman and has provided sufficient consideration. The woman is obliged to sell the car to the man. Option C is incorrect because the payment of £2,000 and the promise to pay the remainder will be sufficient consideration. It is irrelevant that it is less than the market value. The court is not concerned with the adequacy of the consideration, or whether it is a good deal for the woman. Generally, there is no obligation to keep an offer open for a specified time. However, the woman has given her promise to sell in exchange for the man's promise to pay and the payment of the deposit. The woman has formed a binding agreement with the man, which is supported by consideration (therefore option D is incorrect). Option E is incorrect as the payment of the £2,000 deposit and the promise to pay the remainder are given in exchange for the woman's promise to sell. This is sufficient consideration.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 2"}, {"ch": 0, "n": 3, "sc": ["A solicitor is authorised to provide legal services by the Solicitors Regulation Authority (SRA). The solicitor works on a freelance basis."], "st": "Which of the following statements best describes the solicitor's authorisation to carry on reserved legal activities?", "o": ["The solicitor may carry on all reserved legal activities.", "The solicitor may carry on all reserved legal activities, except the exercise of a right of audience.", "The solicitor cannot provide reserved legal activities because they are working on a freelance basis.", "The solicitor may carry on all reserved legal activities, except notarial activities.", "The solicitor may carry on all reserved legal activities, except notarial activities, providing the solicitor's organisation is registered as a sole practice or they provide any reserved legal activities through an authorised body."], "a": "E", "bx": "The correct answer was E. This is because certain reserved legal activities may only be carried on by specified regulated legal service providers. Solicitors are a registered legal service provider and are subject to the regulation of the Solicitors Regulation Authority (SRA). The SRA may authorise solicitors to carry on reserved legal activities except notarial activities. Option A is incorrect because solicitors cannot carry on notarial activities. Option B is incorrect because a solicitor may exercise a right of audience. Option C is incorrect because it implies that freelance solicitors are unable to carry on reserved legal activities under any circumstances. Solicitors operating on a freelance basis may carry on all reserved legal activities except notarial activities, providing those activities are provided through an authorised body or the solicitor's organisation is registered as a recognised role practice (therefore option D is incorrect). Option E is therefore the most accurate description of the solicitor's authorisation to carry on reserved legal activities.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 5"}, {"ch": 0, "n": 4, "sc": ["The claimant is cycling through a busy city centre when the defendant, driving a delivery van, reverses from a shop forecourt into the claimant, knocking them to the ground and causing the & claimant personal injury. The claimant is not wearing a bicycle helmet and suffers fractures to the head, ribs and arms."], "st": "Which of the following is likely to be the court's view when considering whether the claimant has contributed to their injury?", "o": ["The court will likely find the defendant 100% at fault as the onus is on the defendant, as the reversing driver, to ensure the road is clear.", "The court will likely find the defendant 100% at fault as the claimant, as a cyclist, has the right of way.", "The court will likely find the defendant primarily liable but reduce the claimants damages by 50% for failing to heed the presence of the defendant's delivery van.", "The court will likely find the defendant primarily liable but reduce the claimant's damages by 100% to represent the injuries that would not have occurred had the claimant been wearing a helmet.", "The court will likely find the defendant primarily liable but reduce the claimant's damages to reflect the claimant's failure to take reasonable care of their own safety."], "a": "E", "bx": "The correct answer was E. This is because the accident was caused by the defendant's negligence, but the court will reduce the claimant's damages to reflect that the failure to wear a bicycle helmet has contributed to the claimant's injuries. Options A and B are incorrect as although the onus is on the reversing driver to ensure the road is clear and the cyclist does have the right of way, the court will find that the claimant's lack of a bicycle helmet has contributed to their injuries. Option C is incorrect as the claimant had the right of way and the defendant should have checked the road before reversing. Option D is incorrect as a party cannot be 100% contributorily negligent.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 4"}, {"ch": 0, "n": 5, "sc": ["A client, a building firm, is engaged in a dispute worth £290,000 with a sub-contractor. Whilst the dispute is ongoing, the client is unable to continue the work needed to complete the project, which is having a substantial adverse impact on the client's financial position. The parties are entrenched in their respective positions with early negotiations showing no sign of potential agreement."], "st": "Which of the following is the client's best option for resolving the dispute and why?", "o": ["Arbitration, as it is in the client's best interests to have a decision imposed upon them that brings the dispute to a conclusion as quickly as possible.", "Arbitration, as it is best that a confidential decision is imposed on the parties.", "Mediation, as it is quicker and will mean that working relations between the parties will be preserved once the dispute has concluded.", "Mediation, as it is confidential and no other customers can therefore discover any information about any settlement reached.", "Litigation, as issuing proceedings is the most likely method to bring the parties to the negotiating table."], "a": "A", "bx": "The correct answer was A. This is because arbitration is the best option as it can be arranged relatively quickly and will guarantee a conclusion to the dispute, which will enable the building work to recommence and minimise the ongoing financial damage being caused to the client (therefore option B is incorrect). In this case, mediation is unlikely to be the best option for the parties, given how entrenched they are in their positions (options C and D are therefore incorrect). Option E is incorrect as litigation is also unlikely to be the best option as it is more likely to protract matters even further and increase overall costs.", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 1"}, {"ch": 0, "n": 6, "sc": ["The defendant is being investigated for a health condition causing them to lose consciousness. One evening after a long day at work, the defendant is driving home when they suddenly feel very unwell. The defendant is only one mile from their home and decides to try and get home where they can rest or call a doctor if they feel worse. The defendant loses consciousness before they reach their destination. With the defendant unconscious, their vehicle mounts the pavement and collides with a couple walking their dog. The couple and dog are seriously injured."], "st": "What is the likely outcome regarding the standard of care applied to the defendant?", "o": ["The court will apply the standard of care of a driver suffering impairment and the defendant will not be liable for the accident.", "The court will apply the standard of care of a reasonable driver and find the defendant should have stopped the car immediately when they felt unwell.", "The court will apply the standard of care of a professional road user and find the defendant should have steered away from the couple on the pavement.", "The court will apply the standard of care of a reasonable person and find that it was reasonable for the defendant to continue their journey as they were only one mile away from their home.", "The court will apply the special standard of care on the basis that the defendant was suffering from an illness and find that the accident was an unavoidable incident that could not have been prevented."], "a": "B", "bx": "The correct answer was B. This is because all road users owe a duty of care to each other. The court will conclude that a reasonable road user would have stopped the vehicle the instant they felt unwell on the basis they were being investigated for a health condition that had previously rendered them unconscious (therefore option D is incorrect). Options A and C are incorrect as the standard of care is that of a reasonable road user; there are no adjustments made for professional or impaired road users. Option E is incorrect as the accident was caused by the defendant's negligence in failing to stop the vehicle the instance they felt unwell, and this is not an unavoidable incident that could not have been prevented.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 1"}, {"ch": 0, "n": 7, "sc": ["A company has four equal shareholders who are also directors. The company adopted the model articles of association as its company constitution, but made some amendments. Three of the director/shareholders would like to remove the fourth director/shareholder as a director as they are not satisfied with her performance in general. The three director/shareholders have given notice of a proposed resolution to remove the fourth director/shareholder from the board, and the board has placed the resolution on the agenda for the next general meeting."], "st": "Which of the following statements does not represent an accurate statement of law?", "o": ["The fourth director/shareholder to be removed should receive notice of the proposal to remove.", "The company's articles of association should be checked for any clause that may give the fourth director/shareholder to be removed weighted voting rights on any resolution to remove.", "The three director/shareholders cannot use the written resolution procedure to remove the fourth director/shareholder.", "Any ordinary resolution to remove the fourth director/shareholder will not be effective unless the board gave notice of intention to propose it at least 21 days before the general meeting at which it is proposed.", "The fourth director/shareholder to be removed is entitled to be heard at the meeting."], "a": "D", "bx": "The correct answer was D. This is because the MCQ asks you which of the following does not represent an accurate statement of law. Option D is the only option that is incorrect in law; the timeframe required is 28 days and not 21 days as stated. The fourth director should receive notice (meaning option A is correct in law, but the wrong option). As the MCQ tells you that the company has amended the model articles of association but does not give you further information about this, the solicitor must check the articles of association for any such clause (therefore option B is incorrect). Options C and E also reflect accurate statements of law.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 4"}, {"ch": 0, "n": 8, "sc": ["A high street law firm instructs a costs lawyer to advise on litigation costs in an ongoing case."], "st": "Which of the following statements best describes the regulatory regime applicable to the costs lawyer?", "o": ["The costs lawyer is subject to the regulation of the Solicitors Regulation Authority and the Costs Lawyer Standards Board.", "The costs lawyer is subject to the regulation of the Costs Lawyer Standards Board.", "The costs lawyer is subject to the regulation of the Costs Lawyer Standards Board and is also subject to the Solicitors Regulation Authority whilst providing advice to an authorised law firm.", "The costs lawyer is not a regulated legal service provider and is not subject to regulation by a regulatory body.", "The costs lawyer is a regulated legal service provider and is subject to regulation by the Legal Services Board."], "a": "B", "bx": "The correct answer was B. This is because there are a number of regulated legal service providers, and each provider is subject to the regulation of a different regulatory body. Costs lawyers are subject to the Costs Lawyer Standards Board. Costs lawyers are not subject to any other regulatory body, so Options A, C, D and E are all incorrect.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 5"}, {"ch": 0, "n": 9, "sc": ["A company has four shareholders who hold shares in the following proportions: Shareholder A owns 25% Shareholder B owns 33% Shareholder C owns 11% Shareholder D owns 31%. Shareholder B is one of the two directors of the company. The other director does not hold any shares in the company. Shareholder C acts as chairperson of the general meetings. The company has unamended model articles as its articles of association."], "st": "Which of the following provides the best advice in relation to the company's general meetings?", "o": ["At a shareholders' meeting where all the shareholders are eligible to attend and vote, any of the shareholders can prevent a general meeting being held at short notice.", "In the event of deadlock on a shareholders, resolution at a shareholders' meeting, Shareholder C, as chairperson, will have a casting vote.", "At a shareholders' meeting where all shareholders are eligible to attend and vote, Shareholder A will be able to block a special resolution on a poll vote.", "In order to approve a long-term service contract for Shareholder B, in their capacity as a director, Shareholders A and D would have to vote in favour of the shareholders' resolution as Shareholder B would be unable to vote due to a conflict of interest.", "At a shareholders' meeting where all the shareholders are eligible to attend and vote, all of the shareholders must agree to call a poll vote at that meeting."], "a": "A", "bx": "The correct answer was A. This is because in order to hold a meeting at short notice, 90% of the shareholders must agree, and on the figures, this must be unanimous here. Option B is incorrect because the chairperson of an extraordinary general meeting does not get a casting vote. Option C is incorrect because a special resolution can only be blocked by more than 25% of the vote (shareholders B and D could block). Option D is incorrect because Model Article 14 does not apply to alleged conflicts of interest for shareholders. Option E is incorrect because any shareholder with 10% or more of the shares can request a poll vote.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 4"}, {"ch": 0, "n": 10, "sc": ["The claimant's father worked for many years in factories where asbestos was processed. Each day, the father would return home still in his overalls and give the claimant a hug. Many years later, the claimant developed mesothelioma and brings a claim against one of the factories her father worked in during his 30-year career. The claimant's father worked in three factories and could potentially have been exposed to asbestos at any one of them."], "st": "What is the likely outcome of a claim brought by the claimant against one of the factories her father used to work for?", "o": ["The court is likely to find for the claimant on the basis that a claimant suffering from mesothelioma can recover damages from all responsible persons in breach of duty concerning exposure to asbestos.", "The court is likely to apportion damages to the claimant reflected on the basis of how long her father worked for each factory.", "The court is likely to reject the claim on the basis that the claimant's condition is too remote from her father's occupation.", "The court is likely to award damages to the claimant but reduce the amount to reflect contributory negligence on the basis the claimant contributed to her condition by hugging her father each day.", "The court is likely to only award damages if it considers that there has been a material increase in risk to the claimant to the extent it was foreseeable that she would develop mesothelioma."], "a": "A", "bx": "The correct answer was A. This is because a claimant (suffering from mesothelioma) can recover damages from all responsible persons in breach of duty concerning exposure to asbestos (whether by having materially increased the risk or for any other reason). The responsible person is both jointly and severally liable. Option B is incorrect as the responsible factory will be jointly and severally liable. Option C is incorrect as remoteness relates to legal causation. The question relates to factual causation. The factual cause of the claimant's condition is exposure to asbestos which occurred when she hugged her father as a child and her father was negligently exposed to asbestos. Option D is incorrect as contributory negligence relates to whether the claimant has contributed to her injuries, and she did not voluntarily accept the risk as she was a child. Option E is incorrect as a claimant (suffering from mesothelioma) can recover damages from all responsible persons in breach of duty concerning exposure to asbestos (whether by having materially increased the risk or for any other reason), the responsible person being both jointly and severally liable.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 2"}, {"ch": 0, "n": 11, "sc": ["The owner of a cafe places an order for a coffee machine through an online website. The owner receives an email from the seller acknowledging receipt of the order and stating that the contract will be concluded on dispatch of the coffee machine. The machine is dispatched two days later. The owner takes delivery of the machine. Included with the delivery is a document headed 'terms and conditions of sale\\ The document contains a term stating that the seller's liability for defective products is limited to £1,000. One week after taking delivery, the coffee machine explodes, causing significant damages to the owner's cafe. The estimated cost of repair to the cafe is £10,000."], "st": "Which of the following best describes the legal position?", "o": ["As the owner is acting for purposes relating to their business, the seller cannot limit their liability for the defective product.", "As the owner is of limited bargaining position, it is not reasonable for the seller to limit liability for the defective product.", "As the owner has been provided with sufficient notice of the term, the term is binding so far as it satisfies the test of reasonableness.", "As notice of the clause is only provided with the delivery of the machine, the clause is not incorporated into the contract between the owner and the seller.", "The wording of the clause is not sufficiently clear to cover the relevant basis of liability, as the liability arises in negligence."], "a": "D", "bx": "The correct answer was D. This is because as the contract is concluded upon dispatch of the coffee machine, the notice provided with the delivery, therefore, comes too late. Reasonable notice must be provided before or at the time the contract is formed. Even if the clause were incorporated into the contract (which it is not on the facts), this is not an accurate statement. The law on unfair contract terms provides that a seller can exclude such liability, but only so far as the clause is reasonable (therefore option A is incorrect). Option B is incorrect as, although limited bargaining position is relevant to the assessment of whether a clause is unfair, on this occasion the notice is too late to be incorporated into the contract. Option C is incorrect because reasonable notice has not been provided before or at the time the contract was formed. The contract was completed on dispatch of the coffee machine. The notice on the document included with the delivery comes too late. Even if the clause were incorporated (which it is not on the facts), there is no evidence of liability in negligence. The liability is strict. The claim arises in breach of contract, and such liability seems to be clearly covered by the wording of the clause (therefore option E is incorrect).", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 6"}, {"ch": 0, "n": 12, "sc": ["A solicitor is instructed by a client in a personal injury matter. The limitation period expires four days after the client instructs the solicitor."], "st": "Which of the following best explains the steps that should be taken by the solicitor?", "o": ["The solicitor should issue proceedings immediately, thus preserving the limitation period.", "The solicitor should issue proceedings immediately but request a stay from the court to allow correspondence to be exchanged between the parties that satisfies the terms of the pre-action protocol.", "The solicitor should write to the opposing party in compliance with the pre-action protocol.", "The solicitor should write to the opposing party in compliance with the pre-action protocol and apply to the court for an extension of the limitation period.", "The solicitor should advise the client that proceedings cannot be brought against the defendant as there is insufficient time to comply with the relevant pre-action protocol."], "a": "B", "bx": "The correct answer was B. This is because whilst the pre-action protocol is important, the court will not penalise a party for failure to comply with it if this impacts on issuing proceedings within the relevant limitation period (therefore options C and D are incorrect). However, if proceedings are issued without complying with the pre-action protocol, requesting a stay will give the parties the ability to comply with all of their pre-action requirements without placing the limitation period at risk (therefore option A is incorrect). Option E is incorrect as having insufficient time to comply with the pre-action protocol is not a barrier to issuing proceedings.", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 2"}, {"ch": 0, "n": 13, "sc": ["A solicitor is representing the defendant employer in a personal injury matter arising from an accident in the workplace. The claimant's case is that he was injured when a forklift truck he was driving crashed into a shelving unit at the defendant's factory. The claimant alleges that he was not properly trained to use the forklift truck. The defendant's case is that the claimant was given adequate training and the accident was caused by his own negligence. The case has been allocated to the multi-track. On the morning of the trial, the defendant produces the training log. It shows that the defendant only gave the claimant a five-minute briefing at the beginning of the day and not the day's training they have previously asserted. The existence of the training log has not been disclosed to the claimant. The solicitor advises that the training log should be disclosed, but the defendant refuses to do so under any circumstances."], "st": "Which of the following best describes the approach that the solicitor should take?", "o": ["The solicitor should disclose the training log to the claimant, but not the judge, regardless of the defendant's view.", "The solicitor should follow the defendant's instructions and make no mention of the training log to the claimant or the judge.", "The solicitor should disclose the training log to the claimant and the judge, regardless of the defendant's view.", "The solicitor should withdraw from the case if the defendant continues to refuse disclosure.", "The solicitor should disclose the training log to the judge, but not the claimant, regardless of the defendant's view."], "a": "D", "bx": "The correct answer was D. This is because the SRA Code of Conduct requires solicitors not to mislead or attempt to mislead their clients, the court or others, either by their own acts or omissions or allowing or being complicit in the acts or omissions of others (including their client). The solicitor would mislead the court and the claimant should the training log not be disclosed and the defendant continue to allege that the claimant was provided with a day-long training course (option B is therefore incorrect). If the defendant continues in his refusal to allow disclosure, the solicitor must withdraw from the case. Options A, C and E are incorrect as they would involve a breach of confidentiality; the solicitor is obliged to maintain the affairs of clients confidential.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 0, "n": 14, "sc": ["A large commercial law firm employs a paralegal to assist with a range of administrative tasks. The law firm is regulated by the Solicitors Regulation Authority (SRA). The paralegal has recently completed their law degree but has not completed any other legal qualifications."], "st": "Which of the following statements most accurately describes the paralegal's obligations under the SRA Code of Conduct?", "o": ["The paralegal is not subject to the SRA Code of Conduct because they are not a practising solicitor.", "The paralegal must ensure that they are aware of the contents of the SRA Code of Conduct because they are working for an SRA-regulated law firm. They are not, however, subject to the SRA Code of Conduct.", "The paralegal must ensure that they are aware of the contents of the SRA Code of Conduct and are subject to the SRA's regulatory regime because they are working for an SRA-regulated law firm.", "The paralegal is not subject to the SRA Code of Conduct because they are not a qualified solicitor.", "The paralegal should ensure that they are aware of the contents of the SRA Code of Conduct and will be subject to its regulatory regime if they engage in any reserved activities."], "a": "C", "bx": "The correct answer was C. This is because a paralegal who is working within an SRA-regulated firm is subject to the SRA Code of Conduct (option B is therefore incorrect). It is essential that all solicitors and employees within SRA-regulated firms are aware of the contents of SRA Code of Conduct and understand their obligations under the Code. The fact that the paralegal is not a qualified/practising solicitor is irrelevant, so Options A and D are incorrect. The SRA Code of Conduct applies irrespective of whether the work they undertake constitutes reserved legal activities (therefore, Option E is incorrect).", "ar": "Legal services", "see": ""}, {"ch": 0, "n": 15, "sc": ["A man places an advertisement in a local newspaper. The advertisement states: 'Digital camera. Bought for £500, but may sell for £100. Contact me at the following address if you wish to buy? A woman sees the advertisement and posts a letter saying she will buy the camera for £100, and asks whether it includes a camera case. The man receives the letter and replies, telling the woman that the camera has already been sold. The woman asserts that she has a contract to purchase the camera as she has met the requirements stated in the advertisement."], "st": "Which of the following statements best describes the liability of the man?", "o": ["The man has no liability to the woman as the woman was not the first person to accept the man's offer.", "The man is liable to the woman as the woman accepted the offer, her acceptance being effective as soon as it was posted.", "The man has no liability to the woman as the advertisement was an invitation to treat and not an offer for sale.", "The man is liable to the woman as the man did not revoke the offer before the woman's acceptance was effective.", "The man is not liable to the woman as the woman's letter constituted a counter-offer."], "a": "C", "bx": "The correct answer was C. This is because advertisements are usually presumed to be invitations to treat, and not offers for sale. If the advertisement were an offer, then this would create a problem of multi-acceptance. The man only has one camera, and potentially an unlimited number of people could contact the man intending to purchase. The court would therefore presume a lack of contractual intent. This is further supported by the wording used, such as 'may sell', and 'contact me if you wish to buy', which are not conducive with a contractual intent. Option A is incorrect as the advertisement is not an offer for sale, so it is not capable of being accepted. Option B is incorrect. Whilst it is correct that a postal acceptance is effective when posted, this is not applicable here, as there is no offer for the woman to accept. As the advertisement is an invitation to treat, there is no offer to revoke (therefore option D is incorrect). Option E is incorrect as the woman's response may constitute a request for information, rather than a counter-offer, so this is incorrect on that point. Further, as the advertisement is an invitation to treat, the woman's letter is likely to constitute an offer, which has been rejected by the man.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 1"}, {"ch": 0, "n": 16, "sc": ["A solicitor is driving their car when they are stopped by the police. The solicitor is breathalysed uesfions and is found to be over the drink-drive limit. The solicitor pleads guilty to a charge of driving with excess alcohol and is sentenced by the magistrates' court to a driving ban for 12 months and a fine of £1,000."], "st": "Which of the following best describes the solicitor's obligation to the Solicitors Regulation Authority (SRA)?", "o": ["The solicitor must notify the SRA of their conviction within three months, following the date of the conviction.", "The solicitor is not required to notify the SRA of their conviction as it has nothing to do with their practice as a solicitor.", "The solicitor is not required to notify the SRA of their conviction as it does not involve any allegation of dishonesty.", "The solicitor has the discretion to decide whether to notify the SRA of their conviction.", "The solicitor must notify the SRA of their conviction promptly."], "a": "E", "bx": "The correct answer was E. This is because the SRA Code of Conduct requires solicitors to notify the SRA promptly if they are subject to any criminal charge, conviction or caution to which the rules apply. Driving with excess alcohol is a criminal conviction that must be disclosed. Option A is incorrect as the time frame stated in the Code of Conduct is 'promptly'. Option B is incorrect as the conviction must be disclosed, because the solicitor must uphold public trust and confidence in the profession. Option C is incorrect as all relevant convictions must be reported; notification is not restricted to offences of dishonesty. Option D is incorrect as reporting is not discretionary; a solicitor must notify the SRA of any conviction.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 0, "n": 17, "sc": ["An actor enters into a contract to play the lead role in a film. The production company went to the expense of hiring camera equipment, a director and assistant directors. The actor then withdraws from the production, repudiating the agreement. The production company accepts that this is a breach of contract and brings a claim for damages against the actor."], "st": "Which of the following best describes the measure of damage that the court is likely to award?", "o": ["Reliance.", "Expectation.", "Wasted expenditure incurred after the breach of contract.", "Loss of opportunity.", "Loss of expected future profit."], "a": "A", "bx": "The correct answer was A. This is because damages for breach of contract are usually awarded on the expectation measure. This reflects the loss of bargain and seeks to put the innocent party into the position they would have been in had the contract not been breached. However, in this question, the loss of expectation is too speculative. Neither party will know or be able to prove how successful, and ultimately how profitable, the film would have been in had it been completed and released. As such, the court will likely award damages on the reliance measure and will seek to put the production company into the position they would have been in had they not entered into the contract. This will allow the recovery of their expenditure incurred both before and after the breach. Option B is incorrect as the expectation loss is too speculative on the facts. Option C is incorrect as, in such claims, the innocent party is able to recover wasted expenditure incurred both before and after the breach. The damages are not only limited to the expenditure incurred after the breach. Option D is incorrect as it would not be appropriate to award damages on this measure, given the speculative nature of the loss. Option E is incorrect as it is unlikely that the production company can quantify this loss. This is essentially claiming damages on the expectation measure, which is incorrect as explained in the answer to option A, above.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 10"}, {"ch": 0, "n": 18, "sc": ["The police are called to the claimant's home as a neighbour hears shouting. The police arrive, enter into the claimant's house, and find them unresponsive laying on the floor. The police call an ambulance explaining that the claimant is unresponsive and suffering seizures. The ambulance takes over eight minutes to arrive during which time the claimant suffers cardiac arrest and dies. The claimant's family bring a claim against the National Health Service (NHS). The court accepts the medical expert's opinion, which is that, had the paramedics arrived and commenced CPR within an earlier time after the onset of cardiac arrest, the claimant would have had a survival rate of 12%."], "st": "What is the likely outcome of a claim for clinical negligence against the NHS?", "o": ["The court is likely to find that liability rests with the police for failing to call an ambulance earlier.", "The court is likely to find that due to NHS underfunding the failure of the ambulance to attend on time is an inevitable accident.", "The court will likely accept the medical expert's evidence and find the failure of the paramedics to arrive earlier to have contributed to the claimant's death, and award damages.", "The court will likely accept the medical expert's evidence but find that the lost chance of survival is not sufficient to base a claim upon.", "The court will likely award damages but reduce any amount by 88% to reflect contributory negligence."], "a": "D", "bx": "The correct answer was D. This is because the court uses almost a mathematical formula in considering lost chance claims. The court decides using the balance of probabilities. The claimant has an 88% chance of death and only a 12% chance of survival, therefore on the balance of probabilities the court will find that the claimant was unlikely to survive had the ambulance arrived on time in any event. Option A is incorrect as the police have not acted negligently. Option B is incorrect as the court would not take underfunding into consideration only the principles of negligence. Option C is incorrect as, although the court will accept the medical evidence, the claimant only had a 12% chance of survival. Option E is incorrect as contributory negligence is relevant only once primary liability has been found (in this case against the NHS) and the claimant has contributed to their injuries, which is not relevant here.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 2"}, {"ch": 0, "n": 19, "sc": ["A company enters into a contract with a manufacturer. The manufacturer is to create and supply 100 tee-shirts to the company by 20 May. The contract price is £2,000. The contract states that the company shall pay the full amount once all the tee-shirts are delivered. The contract is frustrated on 10 May. Half of the tee-shirts have been delivered by 10 May. Even after the frustrating event, the company still has buyers for the tee-shirts."], "st": "Which of the following statements best describes the effect of frustration on the contract?", "o": ["The company can bring a claim in restitution due to a total failure of consideration.", "The company will be required to pay the full £2,000 agreed under the contract.", "The manufacturer will be required to create and supply the remaining tee-shirts under the contract.", "The court may allow the manufacturer to recover a just sum representing the valuable benefit conferred by their partial performance of the contract.", "The court may allow the manufacturer to off-set the expenses they incurred in the partial performance of the contract."], "a": "D", "bx": "The correct answer was D. This is because the court has a discretion to allow a party to recover the value of any benefit conferred by the partial performance of a contract. Whilst this is at the court's discretion, as the company still have buyers for the tee-shirts, the court may award a just sum of £1,000 (representing the value of the tee-shirts delivered). At the time of frustration, the company had received half of the tee-shirts. There is no total failure of consideration, so a claim in restitution to reverse an unjust enrichment is not appropriate (therefore option A is incorrect). The effect of frustration is to discharge future obligations under the contract. As the requirement of the company to pay does not arise until after the frustrating event, the obligation for them to pay will be discharged (therefore option B is incorrect). The effect of frustration is to discharge the parties of their future obligations under the contract. The manufacturer will not be required to perform the contract after the contract is frustrated (therefore option C is incorrect). Option E is incorrect as there was no money paid or payable before the frustrating event, so an off-set of expenses is not appropriate in this scenario.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 9"}, {"ch": 0, "n": 20, "sc": ["In a complex claim arising in nuisance, the parties are unable to agree on the principal issues and ueaions have reached an impasse. As a result, although disclosure has taken place and the parties have exchanged witness statements, the parties are unwilling to commit to mediation. The parties are willing to consider arbitration, but one party is nervous in case the arbitrator makes a mistake in his judgment."], "st": "Which of the following explanations best describes the position if one party felt that the arbitrator had made a mistake?", "o": ["The relevant party can refer the matter back to the arbitrator with an explanation of why they feel the arbitrator has wrongly applied the law. The arbitrator will then reconsider.", "The relevant party can appeal to the court if they believe that that the arbitrator has wrongly applied the law.", "The relevant party can seek the permission of the court to challenge the decision of the arbitrator if they believe the arbitrator has wrongly applied the law.", "The relevant party can request that the matter be heard by a different arbitrator with specific knowledge of the law in the relevant area.", "The relevant party is bound by the decision and award made by the arbitrator and therefore must comply with its terms."], "a": "C", "bx": "The correct answer was C. This is because parties can appeal against an arbitrator's decision in limited circumstances (option E is therefore incorrect). The only basis upon which parties could appeal against the arbitrator's decision is if they felt that the law had been wrongly applied, and they need to seek permission of the court to make the appeal (therefore option B is incorrect). The arbitrator is under no obligation to reconsider any decision (option A is therefore incorrect) and neither party can request another arbitrator to reconsider the decision (therefore option D is incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 1"}, {"ch": 0, "n": 21, "sc": ["A mid-sized law firm that specialises in personal injury claims has professional indemnity insurance cover of up to £5 million. The firm deals with a wide range of personal injury claims and specialises in high-value-injury claims."], "st": "Which of the following statements most accurately describes the extent to which the firm is likely to have fulfilled its obligation to ensure it has adequate and appropriate professional indemnity insurance cover?", "o": ["The firm is likely to have satisfied the requirement that it has adequate and appropriate professional indemnity insurance because the cover exceeds the minimum threshold of £3 million.", "The firm is likely to have satisfied the requirement that it has adequate and appropriate professional indemnity insurance because the firm is likely to be able to meet any claim liabilities.", "The firm is likely to have satisfied the requirement that it has adequate and appropriate professional indemnity insurance because the test for establishing whether the cover is sufficient is entirely subjective.", "The firm is unlikely to have satisfied the requirement that it has adequate and appropriate professional indemnity insurance because the nature of the claims the firm deals with could expose it to substantial claim liabilities that it may not be able to meet.", "The firm is unlikely to have satisfied the requirement that it has adequate and appropriate professional indemnity insurance because the cover does not meet the appropriate and adequate threshold set out in legislation."], "a": "D", "bx": "The correct answer was D. This is because the test for establishing whether professional indemnity insurance is adequate and appropriate is determined by a range of factors, including the size of the firm, the nature of the work undertaken by the firm and the possible value of any claims liabilities the firm may be exposed to. Because the firm is mid-sized and undertakes high-value serious injury claims, it may be exposed to substantial claims. A firm of this nature is unlikely to be able to meet the costs associated with such claims. As such, the level of professional indemnity insurance cover is unlikely to be deemed sufficient. All other options are therefore incorrect.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 5"}, {"ch": 0, "n": 22, "sc": ["A judge is considering a high-profile appeal case concerning a breach of privacy claim. The claim failed at first instance. The appellant claims that the judge at first instance misinterpreted the meaning of a statutory provision. The case has attracted significant media attention and has been the subject of numerous academic articles. There have also been widespread calls for the law to be reformed. The matter has been discussed in a recent House of Commons debate and the Government has pledged to introduce new legislation that will change the law on privacy."], "st": "Which of the following statements most accurately describes the sources the judge may use to interpret the relevant statutory provision?", "o": ["The judge may only refer to the academic literature to assist them in interpreting the relevant statutory provision.", "The judge may refer to the academic literature and Hansard to assist them in interpreting the relevant provision.", "The judge may only refer to Hansard to assist them in interpreting the relevant provision.", "The judge must refer to Hansard to assist them in interpreting the relevant provision because it will ensure the provision is interpreted in accordance with Parliament's wishes.", "The judge may refer to academic writings to assist them in interpreting the relevant provision if they determine that the relevant statutory provision is unclear or ambiguous."], "a": "E", "bx": "The correct answer was E. This is because judges may only refer to external aids to interpretation where the meaning of a statutory provision is ambiguous or lacks clarity. Options A and B are not the best available options because they do not make this clear. A judge may only refer to Hansard in cases where material from Hansard contains clear statements that were made by a minister regarding the meaning or scope of the relevant statute. The fact that the issue has been discussed recently in the House of Commons is therefore irrelevant, as is the fact that the Government has pledged to reform the law. Options B, C and D are therefore incorrect.", "ar": "Legal system of England and Wales", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 3"}, {"ch": 0, "n": 23, "sc": ["A man and a woman negotiated for the sale of a business. The negotiations started on 1 January. The woman stated that the business was profitable and that there were no other competitors within a five-mile radius. The man purchased the business in December of the same year. The written contract made no reference to either statement."], "st": "Which of the following statements best describes the legal position?", "o": ["The statements made by the woman are likely to be terms of the contract.", "The statements made by the woman are likely to be representations.", "The statements made by the woman are likely to be innominate terms.", "The statements made by the woman cannot be terms of a contract as they were not relied upon by the man.", "The statements made by the woman cannot be terms of a contract as they were not identified as conditions or warranties."], "a": "B", "bx": "The correct answer was B. This is because the courts apply an objective test to determine if a statement was intended to be binding and therefore whether it is a term of the contract. In this scenario there is a significant lapse of time and neither statement was reduced to writing. This would suggest lack of contractual intent, consistent with the statements being representations. The lapse of time and the fact neither statement is reduced to writing would create a strong presumption that the statements are representations (therefore option A is incorrect). Innominate terms are part of the agreement, and the seriousness of the breach will be used to determine whether the breach is treated as a breach of condition or warranty. On the facts of this scenario, the statements are likely to be representations and not legally binding (therefore option C is incorrect). Option D is incorrect as the lack of reliance by the man is not relevant to the determination. The parties may label statements as either conditions or warranties, but this is not conclusive (and therefore option E is incorrect). The court applies an objective test of intention to determine whether a statement is part of the contract and legally binding (therefore option A is incorrect).", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 5"}, {"ch": 0, "n": 24, "sc": ["A company needs to raise a substantial sum to finance an acquisition and is negotiating to borrow this amount from a major bank. The company has never given security for any borrowing in the past. The company's most valuable assets include the machinery in its factory and its stock."], "st": "Which of the following security packages for the borrowing is most appropriate?", "o": ["A fixed charge over the machinery and a floating charge over the stock.", "A fixed charge over both the machinery and the stock.", "A floating charge over both the machinery and the stock.", "A fixed charge over the stock and a floating charge over the machinery.", "A new issue of preference shares to the bank."], "a": "A", "bx": "The correct answer was A. This is because a fixed charge over stock is not appropriate as it is impractical for a business to seek permission from a lender to deal with the stock (which the terms of a fixed charge would require) therefore options B and D would not be appropriate. A floating charge over machinery and stock would not be the most appropriate (for the lender at least, as it ranks lower in the statutory order of distribution on insolvency) therefore option C is not appropriate. Option E is not part of a usual security offering in this situation, and is therefore incorrect.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 5"}, {"ch": 0, "n": 25, "sc": ["A man and a woman are equal partners in business. Their friend is going to join the partnership as a new and equal partner."], "st": "Which of the following statements does not represent an accurate statement of advice to the man and woman?", "o": ["As the man and woman currently own half of the partnership business each, they will have to surrender approximately 17.5% of the business each so that the friend can own a third of the business as an equal partner.", "The partnership agreement can be renegotiated so that it can be amended to reflect that there are now three partners.", "The friend would like to earn interest on their capital injection. There must be a clause included in the new partnership agreement to reflect this as it is not covered by the Partnership Act 1890.", "Losses can be shared in the same ratios as profits under the partnership agreement.", "The friend owns a property that the partnership business will use for a small fee. Ownership of the property can be transferred to the partnership business and be owned as a partnership asset."], "a": "A", "bx": "The correct answer was A. This is because option A is an incorrect statement purely on the figures 17.5% x 2 = 35% which is more than a third. Options B, D and E all state that these things 'can' be achieved (often by inclusion in partnership agreement). Option C is a correct statement of advice in order to allow the friend to earn interest on capital, but this must be included in an agreement as the Partnership Act 1890 does not provide for it.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 2"}, {"ch": 0, "n": 26, "sc": ["A solicitor is consulted by a client regarding a personal injury matter. A Belgian resident, driving their own car, negligently crashed into the client in the UK. The client suffered whiplash and a broken clavicle."], "st": "Which of the following best describes the advice that the solicitor should give the client concerning the applicable governing law and the appropriate jurisdiction in which proceedings should be issued?", "o": ["The governing law is Belgian law as the car is registered and insured there. The client should issue proceedings in Belgium.", "The governing law is Belgian law as the defendant is a resident there. The client should issue proceedings in Belgium.", "The governing law is English law as the client is a resident there. The client should issue proceedings in England and Wales.", "The governing law is English law as the collision occurred there. The client should issue proceedings in England and Wales.", "The governing law is English law as the collision occurred there. The client could issue proceedings in either England and Wales or Belgium."], "a": "E", "bx": "The correct answer was E. This is because the governing law is English law as the collision occurred in that jurisdiction. This makes options A, B and C incorrect. As the proposed defendant is habitually resident in Belgium and the damages flowing from the negligent act occurred in England and Wales, the client has the option to choose which jurisdiction in which to issue proceedings (therefore option D is incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 3"}, {"ch": 0, "n": 27, "sc": ["The UK Government has recently enacted legislation that reforms various aspects of youth justice policy."], "st": "Which of the following statements most accurately describes the effect of enactment?", "o": ["The legislation will automatically come into effect in Welsh law because the UK Parliament is the sovereign law-making body in respect of all UK law.", "The legislation will not come into effect in Welsh law unless it is approved by the Welsh Parliament.", "The legislation will come into effect in Welsh law providing the Welsh Parliament consent to it doing so.", "The legislation will automatically come into effect in Welsh law because the UK Parliament is the sovereign law-making body in respect of all non-devolved matters.", "The legislation will not come into effect in Welsh law unless the legislation has been considered and debated by the Welsh Parliament."], "a": "D", "bx": "The correct answer was D. This is because the UK Parliament is the sovereign law-making body in respect of all non-devolved matters. Youth justice is not a devolved matter. This means that laws concerning youth justice policy would automatically come into effect in Welsh law. Option A is incorrect because it does not make clear that the Welsh Parliament has the power to make law in respect of devolved matters. Options B and C are incorrect because the consent or approval of the Welsh Parliament is not required to bring UK law into effect in Welsh law. Similarly, Option E is incorrect because UK law will come into effect in Welsh law providing it has been enacted through the usual legislative process.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 1"}, {"ch": 0, "n": 28, "sc": ["A man attends hospital for a routine operation, which is performed by a consultant surgeon. During the operation the anaesthetist fails to monitor the man's oxygen correctly and the man suffers a seizure leading to death. The anaesthetist has been in the post for only two weeks. The man is survived by their civil partner and their civil partner's two children. The man provided financially for their family and the children were treated by the man as their own children."], "st": "Who is able to bring a claim for the death of the man?", "o": ["Only the civil partner of the man.", "The civil partner and the children.", "Only the children of the civil partner.", "The eldest child of the civil partner treated as such by the man prior to death.", "No person may bring a claim as the anaesthetist has a defence due to their inexperience."], "a": "B", "bx": "The correct answer was B. This is because under the Fatal Accidents Act 1976 (an authority that you do not need to know for the purposes of the SQE), a civil partner and any children treated by the deceased as a child of the family can bring a claim for dependency as long as the deceased provided for them financially. Options A, C and D are therefore incorrect. Option E is incorrect as, irrespective of the anaesthetist's experience, they will be judged to the standard of a professional anaesthetist and failure to monitor the claimant's oxygen is negligent.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 3"}, {"ch": 0, "n": 29, "sc": ["The board of directors of a company is trying to gauge the company's liability to corporation tax."], "st": "Which of the following will the board of directors include in its calculation?", "o": ["Distributable profits.", "Trading income.", "Profit from the sale of an industrial building.", "Directors' salaries.", "Donations to charity."], "a": "C", "bx": "The correct answer was C. This is because a company will pay corporation tax on its trading profits and capital gains. Only option C falls into this category; the other options fall outside this and are not subject to corporation tax.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 10"}, {"ch": 0, "n": 30, "sc": ["A woman visits an art gallery salesroom. She sees a painting on the wall and believes it to be the work of a famous artist. She asks the owner of the gallery for the price. The owner, also believing the painting to be the work of a famous artist, states that the price is £20,000. The woman purchases the painting for £20,000. Two months later, the woman discovers that the painting is not by a famous artist and is only worth approximately £1,000."], "st": "Can the woman return the painting for a full refund?", "o": ["Yes, because the painting does not match its description.", "No, because the owner provided no representation or warranty to the woman that the painting was the work of a famous artist.", "Yes, because the painting is worth significantly less than the woman believed it to be.", "No, because rescission of the contract is not possible due to a lapse of time.", "Yes, because the owner of the painting misrepresented the price to the woman."], "a": "B", "bx": "The correct answer was B. This is because the owner did not represent or warrant the painting to the work of a famous artist. The woman made a mistake as to the value of the painting, but this mistake will not render the contract void. In order to be void for mistake as to quality, the woman needs to establish that the lack of quality rendered the contract essentially different from what she believed it to be. She paid for and received the painting on the wall. In the absence of any representation or warranty, the woman will have no remedy in the law of mistake. This is a case of caveat emptor (buyer beware). Option A is incorrect as the painting was not described as being the work of a famous artist. Both the buyer and seller made a common mistake as to that fact, but this will not render the contract void. Option C is incorrect as a mistake on price alone will not render the contract void. Rescission of the contract is a possible remedy for misrepresentation. However, as noted above, the owner gave no representation or warranty that the painting was the work of a famous artist (option D is therefore incorrect). The price was agreed between the parties in the mistaken belief that it was by a famous artist. However, there was no representation or warranty to that fact. A mistake as to the price of the painting will not render the contract void or voidable. The contract for the sale of the painting was not essentially different than both parties believed it to be, and there was no misrepresentation as to the subject matter of the contract (therefore option E is incorrect).", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 8"}, {"ch": 0, "n": 31, "sc": ["Three friends are setting up a new company and have sought advice regarding the formalities necessary to set up the new company."], "st": "Which of the following must be filed at Companies House when forming a new company?", "o": ["Articles of association.", "Memorandum of association.", "Form AD01 (change the registered office).", "Form IN01 (incorporation).", "Form AP01 (appointment of director)."], "a": "D", "bx": "The correct answer was D. This is because options C and E are forms to be filed when information is updated with Companies House after incorporation. Option A is not a requirement as, if no articles of association are filed, the model articles will be adopted as default. Option B is included in option D now, but on its own is not sufficient (therefore cannot be the best answer).", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 3"}, {"ch": 0, "n": 32, "sc": ["A company is struggling to pay all of its debts as they fall due. One of the company's major creditors issues a statutory demand requiring the company to pay the money that it owes within 21 days. The company pays this major creditor but insolvency proceedings are brought and an administrator is appointed six weeks later."], "st": "Which of the following best describes the likely position of the administrator regarding this payment?", "o": ["The administrator can immediately seek to have the payment set aside on the grounds that the company was insolvent at the time of the payment.", "The administrator is unlikely to seek to have the payment set aside as the payment was made under a real threat of insolvency proceedings being brought against the company.", "The administrator can immediately seek to have the payment set aside on the grounds that this payment would be a preference.", "The administrator can immediately seek to have the payment set aside on the grounds that this payment would amount to a transaction defrauding creditors.", "The administrator is unlikely to seek to have the payment set aside as the payment was made in the normal course of business and the company acted in good faith. sess-onl quesf-ons"], "a": "B", "bx": "The correct answer was B. This is because, in order to be a preference, the recipient must be placed in a better position as a result of the payment, there must be a desire to prefer this creditor over others on the part of the payer (unless the recipient is a connected person) and the payment must have been made within six months of the date of insolvency (two years for a connected person). Here, there is no desire to prefer because, instead, the payment has been made under a real threat of insolvency proceedings (statutory demand). The requirement for these criteria to be satisfied therefore rules out option C as a possible answer. There is no suggestion of fraud here so option D does not describe the likely position of the administrator. Options A and E are not viable options open to an administrator: option A is not viable because there needs to be more information about the company's situation (other than it was insolvent); option E because the payment will not be protected simply because it was made in the normal course of business and in good faith, eg, it could still amount to a preferential payment.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 6"}, {"ch": 0, "n": 33, "sc": ["The clients wish to set up a new business together but do not know whether they would like to trade as a partnership, limited liability partnership (LLP) or company. The business will buy raw materials, produce goods and sell to other businesses. The clients would like to attract business from multinational customers. They are likely to need to take out substantial loans in the future to expand but wish to retain control themselves. They are likely to be taking on employees."], "st": "Which of the following best describes the type of business that the clients should set up and the correct justification for it?", "o": ["The clients should be advised that a company is the best type of business for their needs. This is because the shareholders' liability for debts would be limited, they would be able to attract finance because companies can grant floating charges and the company is a widely recognised business medium worldwide.", "The clients should be advised that an LLP is the best type of business for their needs. This is because the partners' liability for debts would be limited, they would be able to attract finance because LLPs can grant floating charges and the LLP is a widely recognised business medium worldwide.", "The clients should be advised that a partnership is the best type of business for their needs. This is because the process is informal and there is no obvious reason why the clients would need their liability for the business's debts to be limited, and they would be able to secure any future borrowing by way of a fixed charge.", "The clients should be advised that either an LLP or a partnership is the best type of business for their needs. This is because there will only be two partners, and there is no need to start a company and have the burden of the legal and administrative requirements it brings.", "The clients should be advised that either a company or an LLP is the best type of business for their needs. This is because either business type will enable them to run the business in a more organised way, whereas partnerships tend to be run more informally because no partnership agreement is necessary."], "a": "A", "bx": "The correct answer was A. This is because limited liability for debts is an advantage because the business will incur debt as it buys materials and will not be able to pay those bills if its own customers do not pay that debt remains the business's rather than the shareholders'. In a partnership, the liability of the partners is unlimited. Therefore, option C does not represent the best advice. As the client wants to attract finance, a company or limited liability partnership (LLP) would be better than a partnership because they can grant floating charges. A company has a perceived higher status than an LLP and is more widely recognised worldwide, which would benefit the client in attracting international business. As options B, D and E reference starting an LLP, these do not represent the best advice to the client.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 1"}, {"ch": 0, "n": 34, "sc": ["A solicitor acts for a client in relation to a property transaction. On the day the transaction is due to complete, the solicitor becomes aware of information that causes them to suspect their client will be using the transaction to launder money."], "st": "Which of the following statements most accurately describes the solicitor's obligations under anti-money laundering regulations?", "o": ["The solicitor must report their concerns to the nominated officer who should then make a suspicious activity report to the relevant authority.", "The solicitor should proceed with the transaction and should make a disclosure to the nominated officer as soon as practicable.", "The solicitor should proceed with the transaction as there is no firm evidence that the transaction will be used to launder proceeds of crime.", "The solicitor should inform the client of their concerns in order to establish whether the transaction is likely to be used for money laundering purposes.", "The solicitor should report their concerns to the nominated officer and then promptly inform the client that a report has been made."], "a": "A", "bx": "The correct answer was A. This is because solicitors are under a duty to report any concerns about money laundering to the firm's nominated officer. The nominated officer will report any suspicious activity to the National Crime Agency. Options B and C are incorrect because they state that the solicitor should continue with the transaction. If the solicitor continued with the transaction, they are likely to commit an offence under anti-money laundering legislation. Options D and E are incorrect because they state that the solicitor should inform the client of their concerns. The solicitor should not do this because it could constitute an offence under anti-money laundering legislation.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 6"}, {"ch": 0, "n": 35, "sc": ["A client would like to set up their own business, which they will run as a sole trader. The client would like to work alone but they need to raise funds to start and run the business."], "st": "Which of the following statements describes the best option available to the client in this situation?", "o": ["The client could issue shares in their business.", "The client could act as a guarantor on a loan by their bank to a third party.", "The client could issue bonds or securities in order to raise funds.", "The client could take a loan from a bank in return for a floating charge over all their assets.", "The client could borrow money from a third party."], "a": "E", "bx": "The correct answer was E. This is because a lender to any business will make its decision to lend based on the creditworthiness of the borrower that should be able to demonstrate solvency, ability to repay any loan and may be required to provide security. The only feasible option here is E. Options A, B and C are wholly unsuitable for this business (the client wishes to work alone and jt is a start-up). As a sole trader, the client cannot grant a floating charge (therefore, option D is incorrect).", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 5"}, {"ch": 0, "n": 36, "sc": ["A client instructed a solicitor in relation to damage that they have recently discovered to their property. Sixteen years ago, the client instructed a company to knock through two walls to create an open-plan kitchen, dining room and living room. Eight months ago, whilst carrying out redecoration work, the client discovered significant structural damage to their property which will cost in the region of £150,000 to rectify. An expert confirmed last week that the structural damage has been caused by the company failing to deal with the removal of a supporting wall properly."], "st": "Which of the following best represents how the solicitor should advise the client regarding limitation?", "o": ["The company is in breach of contract. The limitation period is six years following the date of the breach. The limitation period has expired, and the client will need to apply to the court to extend the limitation period to enable proceedings to be issued.", "The company has been negligent. The limitation period is three years from the date on which the damage occurred. The limitation period has expired, and the client will need to apply to the court to extend the limitation period to enable proceedings to be issued.", "The company has been negligent. The limitation period is six years from the date on which the damage occurred. The limitation period has expired, and the client will need to apply to the court to extend the limitation period to enable proceedings to be issued.", "The company has been negligent. The limitation period is three years from the date on which the client first knew about the cause of action. The client discovered the damage eight months ago and can therefore issue proceedings.", "The company has been negligent. The limitation period is three years from the date on which the client first knew about the cause of action. However, due to the time which has elapsed since the negligent act or omission occurred, the client will be statute barred from bringing a claim."], "a": "E", "bx": "The correct answer was E. This is because this MCQ features a latent damage claim in tort, the limitation period for which is either six years from when the damage occurred, or three years from when the claimant (the client in this MCQ) first knew about the cause of action. This means that options A, B and C are incorrect. With latent damages claims, an action needs to be brought within 15 years of the date on which the negligent act took place, therefore making option D incorrect.", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 2"}, {"ch": 0, "n": 37, "sc": ["The UK Prime Minister has recently been the subject of a number of scandals and is very unpopular with the public. Despite this, a recent vote of confidence confirms that the Prime Minister still enjoys the support of the majority of the House of Commons. The Prime Minister has publicly stated that they will not resign from their position. Members of the public have therefore set up an online campaign requesting that the King dismisses the Prime Minister from office."], "st": "Which of the following statements most accurately describes the King's power to dismiss the Prime Minister?", "o": ["As Head of State, the King has the power to dismiss the Prime Minister if he feels it is appropriate to do so.", "Under the Royal Prerogative, the King appoints the Prime Minister and may, therefore, dismiss him from office if he wishes to do so.", "As Head of State, the King appoints the Prime Minister and may, therefore, dismiss him from office if he wishes to do so.", "Under the Royal Prerogative, the King appoints the Prime Minister and may, therefore, dismiss him from office if he wishes to do so. However, by convention the Prime Minister will remain in office providing he maintains the support of the majority of the House of Commons.", "Although the King is Head of State, because of the separation of powers the King has no powers to appoint or dismiss the Prime Minister from office."], "a": "D", "bx": "The correct answer was D. This is because the King's powers to dismiss the Prime Minister are restricted by convention. The King, under the Royal Prerogative, has the power to appoint the Prime Minister. The King could therefore dismiss the Prime Minister from office if he wished to do so. However, by convention the Prime Minister will remain in office if they maintain the support of the majority of the House of Commons. In this scenario, the Prime Minister still enjoys the support of the majority of the House of Commons so the convention would apply (option B is therefore incorrect). Options A and C are incorrect because they do not make any reference to the applicable convention. Option E is incorrect because the King does have the power to appoint the Prime Minister under the Royal Prerogative.", "ar": "Constitutional and administrative law
