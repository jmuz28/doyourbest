 and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 4"}, {"ch": 0, "n": 38, "sc": ["A client is a partner in a partnership. Due to the economic downturn, the latest projections indicate that there is a risk that the business may become insolvent and the client is concerned about their potential liability in contract for debts to third parties should insolvency proceedings follow."], "st": "Which of the following statements best describes the potential liability of the client should the partnership become insolvent?", "o": ["The client could be liable to the extent of their original investment in the partnership.", "The client could be equally liable for all the debts of the partnership.", "The client could ultimately be jointly and severally liable for all the debts of the partnership.", "The client could only ever be jointly liable for all the debts of the partnership.", "The client could be liable for the debts of the partnership to the extent agreed in the partnership agreement as to loss-sharing."], "a": "C", "bx": "The correct answer was C. This is because each partner is jointly liable for all the debts of the partnership if a partnership becomes insolvent. However, after judgment has been obtained in the county court, the partners become severally liable, and a judgment creditor could proceed against one or all of the partners. This means that they stand to lose not only what they have invested in the business (therefore option A is incorrect) but also any other property they own, as creditors of the partnership can pursue any one of the individual partners until the debts are paid. The client's liability is potentially unlimited. The partnership agreement may make provision as to how losses are to be shared but this does not prevent a creditor claiming in full from one partner who would then have to claim against the others (therefore options B, D and E are incorrect).", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 6"}, {"ch": 0, "n": 39, "sc": ["A client consults a solicitor in connection with a claim for damages of £60,000 arising from a personal injury flowing from a road traffic accident. The client argues that the opponent caused the collision because they swerved into the client's vehicle, causing it to change course and strike a tree. The opponent denies liability on the basis that an inspection of the client's vehicle revealed a fault with the steering causing it to lock, breaking the chain of causation. The client's losses are also contested as they are self-employed. Forensic accountants have been instructed for both parties, who have disagreed on their assessment of the value of the loss of future earnings the client is claiming."], "st": "Which of the following best represents the court in which the claim should be commenced, and why?", "o": ["The claim should be commenced in the High Court as the value is over £50,000 and the facts are complex.", "The claim should be commenced in the High Court despite the value of the claim being under £100,000 as the facts are complex.", "The claim should be commenced in the County Court despite the value being over £50,000 as the facts are not sufficiently complex to warrant issuing in the High Court.", "The claim should be commenced in the County Court as the value of the claim is under £100,000 and the facts are not sufficiently complex to warrant issuing in the High Court.", "The claim should be commenced in the County Court as, despite the complex facts, the value of the claim is under £100,000."], "a": "A", "bx": "The correct answer was A. This is because for personal injury claims which have complex facts and are worth over £50,000, the High Court is the correct court to issue proceedings. £100,000 is the County Court limit for all claims except personal injury, meaning options B, D and E are incorrect. Option C is incorrect because we are told that the facts surrounding both liability and quantum are complex.", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 3"}, {"ch": 0, "n": 40, "sc": ["A solicitor has recently completed a high-value property transaction on behalf of a new client. It has now come to light that the transaction was used for money laundering purposes. The solicitor was reluctant to proceed with the transaction because they were concerned it may be used for money laundering purposes. The solicitor promptly informed the firm's nominated officer of their concerns. The nominated officer stated that they would investigate the matter in due course. A Suspicious Activity Report was not submitted to the National Crime Agency (NCA)."], "st": "Which of the following statements most accurately outlines the solicitor's position in respect of liability under the Proceeds of Crime Act (POCA) 2002?", "o": ["The solicitor will most likely be liable for the offence of failing to make a disclosure.", "The solicitor has not committed a failure to make a Suspicious Activity Report offence under the POCA 2002 because it is the duty of the nominated officer to make such reports to the NCA.", "The solicitor will most likely be liable for failing to make a Suspicious Activity Report.", "The solicitor will not be liable for an offence under the POCA 2002 because they had no actual knowledge or proof of money laundering.", "The solicitor is likely to have fulfilled their obligation to make a Suspicious Activity Report by disclosing their concerns to the firm's nominated officer."], "a": "B", "bx": "The correct answer was B. This is because the solicitor is under a duty to report any concerns to the firm's nominated officer. The solicitor disclosed her concerns to the nominated officer, and this is likely to be enough to discharge her legal obligations under anti-money laundering legislation (options A and D are therefore incorrect). The solicitor is not under a duty to make a Suspicious Activity Report (SAR) to the National Crime Agency (NCA) so she has not committed an offence under anti-money laundering legislation (option C is therefore incorrect). The duty to make a SAR to the NCA rests with the firm's nominated officer. Option E is incorrect because the report the solicitor made to the firm's nominated officer is not a SAR.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 6"}, {"ch": 0, "n": 41, "sc": ["The UK government is debating whether to amend a piece of domestic legislation, which was formerly EU legislation that was directly applicable in the UK."], "st": "Which of the following statements most accurately describes the status of the legislation?", "o": ["The legislation is classified as retained EU law.", "The legislation is classified as EU law.", "The legislation is classified as assimilated law.", "The legislation was automatically repealed on 31 December 2020.", "The legislation was automatically repealed on 1 January 2024."], "a": "C", "bx": "The correct answer was C. This is because from January 2024, all former EU law that was directly applicable in the UK (without the need for domestic legislation) and all domestic legislation which implemented or related to former EU obligations was reclassified as 'assimilated law'. Assimilated law replaces the concept of retained EU law. This means that option A is incorrect. Assimilated law is domestic legislation which remains in force, unless and until it is repealed. Options D and E are incorrect because they state that such legislation was automatically repealed. Option B is incorrect because the legislation in question is domestic law.", "ar": "Legal system of England and Wales", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 9"}, {"ch": 0, "n": 42, "sc": ["A man enters a car dealership and negotiates for the purchase of a new car. The man completes and signs a sales agreement in the name of 'Mr Smith'. The man is not Mr Smith and is purchasing the car fraudulently. The man drives the car away the same day. The man then sells the car to a woman. One week later, the dealership discovers that the man is not Mr Smith, and they bring a claim against the woman to recover the car."], "st": "Can the car dealership recover the car from the woman?", "o": ["No, as the contract between the dealership and the man was enforceable.", "Yes, as the contract for the sale of the car is voidable.", "No, as the woman, a third party, has acquired rights in the car.", "Yes, as the contract for the sale of the car is void for mistake as to identity.", "No, as the contract between the man and the woman was the result of fraud."], "a": "D", "bx": "The correct answer was D. This is because the court will presume that the dealership only intended to deal with the party named in the document as the man signs the sales agreement in the name of Mr Smith. As the man was not the party named in the document, Mr Smith, the contract will be void for mistake (option A is therefore incorrect). A contract that is voidable still binds the parties until steps are taken to set it aside. In a claim for misrepresentation, it is therefore unlikely that the dealership could recover the car from the woman. Property will have passed from the dealership to the man, and then from the man to the woman. Once a third party acquires rights under a contract this is likely to bar a claim for rescission of the contract (therefore, option B is incorrect). As the contract is void for mistake, no property would have passed along the chain from the dealership to the woman (option C is therefore incorrect). It is correct that the woman has also been the victim of fraud. Her remedy, therefore, will be against the man. As it is unlikely that the woman will be able to identify or locate the man, she will have no effective remedy (option E is therefore incorrect).", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 8"}, {"ch": 0, "n": 43, "sc": ["A trainee solicitor works in a small high-street law firm. Recently, the solicitor became aware that another trainee solicitor at the firm may have accidentally committed a minor breach of confidentiality whilst working on a client's file. The solicitor reports their concerns to one of the partners in the firm and questions what actions, if any, they must take with the Solicitors Regulation Authority (SRA)."], "st": "Which of the following statements most accurately describes the solicitor's actions?", "o": ["The solicitor has discharged their reporting obligations under the SRA Code of Conduct because the solicitor has reported the potential breach to a senior member of staff.", "The solicitor has failed to discharge their reporting obligations under the SRA Code of Conduct as the SRA must be informed of all potential breaches of confidentiality.", "The solicitor has failed to discharge their reporting obligations under the SRA Code of Conduct as the firm's Compliance Officer for Legal Practice must be informed of all potential breaches of confidentiality.", "The solicitor is not bound by any reporting obligations under the SRA Code of Conduct because the solicitor is not yet fully qualified.", "The solicitor has discharged their reporting obligations under the SRA Code of Conduct because they have reported the potential breach to a senior member of staff. The senior solicitor is responsible for reporting the issue to the firm's Compliance Officer for Legal Practice."], "a": "C", "bx": "The correct answer was C. This is because the SRA Code of Conduct requires the solicitor to report all potential breaches of confidentiality to the firm's Compliance Officer for Legal Practice (COLP). Although the solicitor has reported the potential breach to a senior member of staff, she is required to report the potential breach to the COLP (options A and E are therefore incorrect). Failure to make a report to the COLP will amount to a breach of the Code of Conduct. The fact that she is not yet a fully qualified solicitor does not impact her liability under the Code of Conduct (option D is therefore incorrect). Option B is not the best available answer because it does not clearly outline that the solicitor is under a duty to report the potential breach to the COLP.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 5"}, {"ch": 0, "n": 44, "sc": ["A solicitor becomes aware that a paralegal within the firm has been the subject of harassment by a senior partner. The senior partner continually telephones her on her mobile phone and at home, and sends her inappropriate messages, texts and e-mails. The paralegal has not reported the matter to anyone else. The solicitor is concerned about the effect this behaviour is having on the paralegal and their responsibilities under the Solicitors Regulation Authority (SRA) Code of Conduct."], "st": "Which of the following best reflects what the solicitor should do in the circumstances?", "o": ["The solicitor must report the alleged harassment to the firm's Compliance Officer for Legal Practice.", "The solicitor must notify the SRA of the alleged harassment.", "The solicitor must notify the SRA of the alleged harassment and may inform the firm's Compliance Officer for Legal Practice.", "The solicitor should take no action in respect of the alleged harassment.", "The solicitor should confront the senior partner directly and challenge himon the alleged harassment."], "a": "C", "bx": "The correct answer was C. This is because the SRA Code of Conduct requires solicitors to report promptly to the SRA any facts or matters that they reasonably believe are capable of amounting to a serious breach of their regulatory arrangements by any person regulated by them. Harassment would meet this definition. The best approach that can be taken is for the solicitor to inform the Compliance Officer for Legal Practice (COLP) and inform the Solicitors Regulation Authority (SRA) as to the alleged harassment. Options A and B are incorrect as the best advice is to notify both the COLP and the SRA. Option D is not appropriate in light of the above obligation under the Code and option E would not be the most sensible decision, given the likely risk of victimisation and further harassment.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 0, "n": 45, "sc": ["A company entered into a contract with a supplier for the delivery of a drinks bottling machine at a price of £100,000. The company is to use the machine as part of its everyday business manufacturing soft drinks. Unknown to the supplier, the company also intends to use the machine to satisfy a lucrative contract with a vineyard that is experimenting by using the machine for an unusual and state-of-the-art bottling technique. The contract contains a clause that the supplier shall pay the company £10,000 for every week that the machine is delivered late. The supplier delivers the machine two weeks late. As result, the company suffers a loss of £2,000 from its soft drink business. The company also suffers a loss of £10,000 as it is unable to perform the contract with the vineyard. Solicitors acting on behalf of the company bring a claim of £20,000 in damages against the supplier."], "st": "Which of the following best describes the amount the court is likely to award the company?", "o": ["£20,000.", "£12,000.", "£10,000.", "£8,000.", "£2,000."], "a": "E", "bx": "The correct answer was E. This is because an award of £2,000 represents the normal loss that would have been in the reasonable contemplation of the supplier when entering the contract. The lucrative contract with the vineyard is likely to be classified as abnormal loss. This loss was not communicated to the suppliers. It is unlikely to be within their reasonable contemplation and therefore too remote. An award of £20,000 represents the amount agreed in the contract. These are referred to as liquidated damages. In order for a liquidated damages clause to be binding, it needs to represent a genuine pre-estimate of loss. On the facts, £20,000 seems to be an extravagant amount compared to the maximum loss suffered. It is unlikely to be enforceable and the court will award the company unliquidated damages (therefore option A is incorrect). An award of £12,000 represents both the normal and abnormal loss suffered by the company. It is likely that the abnormal loss will be too remote, and unrecoverable, as noted above (option B is therefore incorrect). An award of £10,000 represents an award for the abnormal loss only. It is likely that only the normal loss would have been in the supplier's reasonable contemplation (option C is therefore incorrect). An award of £8,000 represents the difference between the normal and abnormal loss. This is not in accordance with the usual measure of damages in contract, which seeks to protect the expectation interest (option D is therefore incorrect).", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 10"}, {"ch": 0, "n": 46, "sc": ["Improvement works are taking place on a busy motorway. A contractor working on the improvement works drives their lorry into the barriers separating the traffic and, as a result, the motorway is closed for repair. Motorists are stranded on the motorway for five hours. One woman is travelling on the motorway to a job interview and fails to arrive. The woman is not offered another opportunity and the company appoint another candidate."], "st": "Is the woman able to bring a claim against the contractor who drove the lorry for her loss of salary caused by failing to be appointed at the job interview?", "o": ["Yes, the woman has suffered consequential loss caused by the contractor's negligence.", "No, the contractor has caused economic loss by damaging property of a third party.", "Yes, the woman has suffered economic loss caused by damage to property of a third party.", "No, as although the woman has suffered consequential loss her damage is too remote.", "Yes, the contractor owed the woman a duty of care not to cause her economic loss."], "a": "B", "bx": "The correct answer was B. This is because damage to the property of a third party (namely the motorway barriers) has caused economic loss to the woman and is not recoverable. Option A is incorrect as the loss of the woman's job prospects is not consequential loss. Option C is incorrect as no duty of care is owed and the woman cannot claim for economic loss. Option D is incorrect as the woman has not suffered consequential loss but economic loss. Option E is incorrect as the lorry driver did not owe a duty of care to the woman as there is no relationship between the parties.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 3"}, {"ch": 0, "n": 47, "sc": ["A claim form is issued by the court on Monday 14 September and sent to the claimant to effect service personally. The claimant posts the claim form through the letterbox of the correct address of the defendant at 3.35pm on Friday 18 September."], "st": "Which of the following best reflects the correct date of deemed service?", "o": ["The claim form is deemed served on Friday 18 September.", "The claim form is deemed served on Saturday 19 September.", "The claim form is deemed served on Sunday 20 September.", "The claim form is deemed served on Monday 21 September.", "The claim form is deemed served on Tuesday 22 September."], "a": "E", "bx": "The correct answer was E. This is because the document in question is a claim form, which is deemed served two business days after the relevant step is taken (therefore option A is incorrect). In this case, the relevant step is posting the claim form through the defendant's letterbox. As the relevant step is taken on a Friday, the first business day after the relevant step is Monday (therefore option D is incorrect) and the second business day after the relevant step is Tuesday, which is the date on which the claim form will be deemed served (making option E correct). Saturday and Sunday are not business days (therefore options B and C are incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 3"}, {"ch": 0, "n": 48, "sc": ["A woman bought a new car from a professional car dealer. The next day the car would not start. This was due to a serious defect within the engine. The woman returned the car to the dealer and demanded a full refund. The dealer refused to refund the woman and instead only offered to repair the car."], "st": "Does the woman have to accept the offer of repair?", "o": ["No, because the car is not of satisfactory quality.", "Yes, as the offer of repair is reasonable in the circumstances.", "No, because the car does not match its description.", "Yes, as the defect was discovered shortly after the purchase.", "No, because the car is not fit for purpose."], "a": "A", "bx": "The correct answer was A. This is because the woman is acting as a consumer and the car dealer is acting as a trader. The contract is a 'consumer' contract and will include an implied term that the goods are of satisfactory quality. This is a condition of the contract. A breach of condition entitles the woman to reject the goods and to claim a full refund. She does not have to accept the offer of repair. Option B is incorrect as the serious defect within the engine will be seen as a breach of a condition of the contract. The woman has the right to reject the goods. Option C is incorrect as the breach of contract is caused by the defect in the engine. The goods were not of satisfactory quality. Option D is incorrect as the goods are expected to last for a reasonable period of time without defect. The fact that the fault was discovered so quickly is evidence that the goods were not of satisfactory quality. Option E is incorrect as the reason that the car will not start is due to the defect in the engine. The goods were not of satisfactory quality.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 5"}, {"ch": 0, "n": 49, "sc": ["A newly qualified legal executive has recently taken up a position in a law firm. The firm is classified as a legal service provider and is subject to regulation by the Solicitors Regulation Authority (SRA). A solicitor within the firm asks her to carry on some reserved legal activities under his supervision. The solicitor is authorised to carry on reserved legal activities himself but is unable to manage his hectic workload without some additional assistance."], "st": "Which of the following statements most accurately describes the regulatory position with regards to reserved legal activities?", "o": ["The legal executive may carry on reserved legal activities because she is employed by, and will work under the supervision of, a person who is authorised to carry on those reserved legal activities.", "The legal executive may not carry on reserved legal activities because chartered legal executives are not classified as legal service providers and may not therefore carry on reserved legal activities.", "The legal executive may carry on reserved legal activities because chartered legal executives are classified as legal service providers and may carry on all reserved legal activities.", "The legal executive may carry on reserved legal activities provided they are registered with, and regulated by, the SRA.", "The legal executive may not carry on any reserved legal activities as she has not gained practice rights to carry on reserved legal activities herself."], "a": "A", "bx": "The correct answer was A. This is because a legal executive may carry on reserved legal activities under the instruction and supervision of a solicitor who is authorised to carry on such activities. Option C is incorrect because legal executives may only carry on some reserved legal activities. Option B is incorrect because legal executives are classified as legal service providers. Legal executives do not need to have practice rights to carry on reserved legal activities if they are carrying on such activities under the instruction and supervision of a solicitor who is authorised to carry on such activities (option E is therefore incorrect). Option D is incorrect because legal executives are regulated by Chartered Institute of Legal Executives (CILEx) and not the SRA.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 5"}, {"ch": 0, "n": 50, "sc": ["A solicitor wishes to appear in court on behalf of their client in a criminal matter. The case will be considered by the magistrates1 court."], "st": "Which of the following best describes the solicitor's rights of audience in this matter?", "o": ["The solicitor can appear in the magistrates' court on behalf of their client as solicitors are automatically granted rights of audience when they are admitted to the roll of solicitors.", "The solicitor can appear in the magistrates' court on behalf of their client if they have undertaken the relevant assessments in criminal advocacy and have successfully applied for higher rights of audience.", "The solicitor can appear in the magistrates, court on behalf of their client if they have permission from the court.", "The solicitor can appear in the magistrates1 court on behalf of their client if they have undertaken the relevant assessments in criminal advocacy and have successfully applied for rights of audience.", "The solicitor can appear in the magistrates' court on behalf of their client if they have undertaken the relevant assessments in criminal advocacy."], "a": "A", "bx": "The correct answer was A. This is because solicitors are granted rights of audience automatically when they are admitted to the roll of solicitors. Solicitors may not exercise rights of audience in senior courts unless the solicitor has completed the relevant education and training required by the Solicitors Regulation Authority and been awarded higher rights of audience. The magistrates' court is not a senior court. This means that the solicitor does not need to have been awarded higher rights of audience to appear on behalf of their client in the magistrates' court (options B, D and E are therefore incorrect). Option C is incorrect because a solicitor's right to exercise rights of audience is not determined by judicial consent.", "ar": "Legal system of England and Wales", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 1"}, {"ch": 0, "n": 51, "sc": ["In the course of a trial, there is a dispute between the parties as to whether an exclusion clause in a contract protects the defendant in a claim for breach of contract."], "st": "What rule of construction is the court likely to apply to resolve this dispute?", "o": ["The court will interpret any ambiguity in favour of the party wishing to rely on the clause.", "The court will interpret the clause based on what a reasonable person would have intended in the circumstances.", "The court will interpret any ambiguity in the clause strictly against the party wishing to rely on the clause.", "The court will interpret the clause so as to give effect to the intentions of the parties.", "The court will interpret the clause so as to avoid an absurd result."], "a": "C", "bx": "The correct answer was C. This is because the courts are generally hostile to a clause that seeks to exclude liability. As such, they will favour an interpretation that goes against the party wishing to rely on the clause. This is known as the contra proferentem rule. Option A is incorrect as the courts will prefer an interpretation that goes against the party wishing to rely on the clause, and not in their favour. In seeking to prevent any abuse of bargaining position, the courts adopt a strict interpretation against the party relying on the clause and will not rewrite the agreement based on what a reasonable person would have intended (option B is therefore incorrect). Option D is incorrect as, whilst this approach may be used generally to determine the issue of contractual intent, the court generally adopts the contra proferentem rule in relation to exclusion clauses. Option E is incorrect as this approach is more representative of a general approach to statutory interpretation and to the specific use of exclusion clauses.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 6"}, {"ch": 0, "n": 52, "sc": ["A solicitor becomes aware of a serious breach of the Solicitors Regulation Authority (SRA) Code of Conduct by their firm."], "st": "Which of the following best reflects the obligation of a solicitor when faced with a breach of the SRA Code of Conduct?", "o": ["A solicitor must report to the SRA any facts or matters that they reasonably believe are capable of amounting to a serious breach of their regulatory arrangements by any person regulated by the SRA promptly.", "A solicitor must report to their client any misconduct or other reprehensible behaviour by any person regulated by the SRA promptly.", "A solicitor must only report criminal offences by any person regulated by the SRA promptly.", "A solicitor must report to their client any facts or matters that they reasonably believe are capable of amounting to a serious breach of their regulatory arrangements by any person regulated by the SRA promptly.", "A solicitor must report to the SRA any misconduct or other reprehensible behaviour by any person regulated by the SRA promptly."], "a": "A", "bx": "The correct answer was A. This is because the SRA Code of Conduct imposes an obligation on solicitors to: report promptly, to the SRA, any facts or matters that they reasonably believe are capable of amounting to a serious breach of their regulatory arrangements by any person regulated by them (including themselves). Option B is incorrect because such a breach would not be reported directly to the client; furthermore, the requirement to report is based on 'serious breach' and not 'misconduct or other reprehensible behaviour' (for this reason, option E is incorrect). Option C is incorrect as the serious breach need not be a criminal offence. Option D is incorrect because the report must be made to the SRA, not the client.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 0, "n": 53, "sc": ["The claimant suffers an accident at work whilst lifting heavy boxes onto pallets in the warehouse. The claimant brings a claim against their employer on the basis that they had failed to offer any manual handling training. The employer admits liability but disputes the value of the claim. Medical evidence shows that the claimant suffered a ruptured disc in their spine as a result of the accident. The claimant had suffered a back injury in a skiing accident in their youth which had left them with a pre-existing issue with their back. The employer argues that the spinal injury suffered in the accident at work would not have been so serious had the claimant not had a pre-existing issue and they wish to reduce the claimant's damages to reflect this."], "st": "Which of the following best reflects the court's likely view of the employer's argument?", "o": ["The court will likely accept that the claimant has a pre-existing injury and reduce the claimant's damages to reflect this.", "The court will likely find that the employer has a complete defence to the claim.", "The court will likely find that the pre-existing injury breaks the chain of causation.", "The court will likely find that but for the pre-existing injury, the claimant would not have suffered further injury.", "The court will likely take the claimant as they find them and not reduce the claimant's damages."], "a": "E", "bx": "The correct answer was E. This is because the court uses the egg-shell skull theory (take your victim as you find them); this means that the defendant must accept injuries caused to the claimant despite the pre-existing medical issue. Option A is incorrect as the court will only reduce damages if they find the claimant contributed to their injuries and this is not the case here. Option B is incorrect as the employer was liable due to lack of training. Option C is incorrect because the previous back injury predates the accident at work and therefore is unable to break the chain of causation. Option D is incorrect as the court has to take the claimant as they find them, namely with a vulnerable back.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 3"}, {"ch": 0, "n": 54, "sc": ["A partner of a large commercial law firm becomes aware that the expiry date for the firm's professional indemnity insurance has just passed. The firm has not renewed the policy, put an alternative policy in place or notified the Solicitors Regulation Authority (SRA) that the policy has elapsed. The expiry date for the policy was four days ago."], "st": "Which of the following statements most accurately sets out the status of the firm's professional indemnity insurance cover for the 30 days following the expiration of the indemnity insurance policy?", "o": ["The firm does not have any professional indemnity insurance because the policy expired four days ago.", "The firm does not have any professional indemnity insurance in place and must cease acting for all clients until an adequate and appropriate indemnity insurance policy is in effect.", "The firm does not have valid professional indemnity insurance because the policy has elapsed and the firm has not informed the SRA.", "The firm has entered an Extended Policy Period and may continue to act on behalf of its clients for the next 30 days.", "The firm has entered an Extended Policy Period and may continue to act on behalf of its clients for up to 30 days from the expiry date. The firm must notify the SRA within five working days of the firm entering the Extended Policy Period."], "a": "E", "bx": "The correct answer was E. This is because in circumstances where a firm fails to renew its policy by the expiry date it will automatically enter an extended policy period (EPP). The EPP lasts for 30 days from the policy expiry date. During this period the firm may continue to act on behalf of its clients. Option D is incorrect because it states that the firm may act for its clients for the next 30 days. This is incorrect because the EPP starts from the date the policy expired. Options A, B and C are incorrect because they do not take into account the fact that the EPP came into effect when the policy elapsed. Option C ignores the fact that the firm has five working days to notify the SRA that it has entered an EPP.", "ar": "Legal services", "see": ""}, {"ch": 0, "n": 55, "sc": ["A claimant has brought a claim in the County Court against their neighbour for recovery of a sum of money loaned by them to the neighbour. The neighbour has neither acknowledged service nor filed a defence. The claim form and particulars of the claim were deemed served 17 days ago."], "st": "Which of the following best describes the advice the claimants solicitor should give their client about obtaining judgment in default?", "o": ["The claimant may obtain default judgment of an acknowledgment of service or a defence being filed by filing a request in the relevant practice form and an accompanying fee.", "The claimant may obtain default judgment by filing a request in the relevant practice form after 28 days from the deemed date of service.", "The claimant may obtain default judgment of an acknowledgement of service or a defence being filed by sending a letter to the court requesting such a judgment be made, with an accompanying fee.", "The claimant may not obtain default judgment in the County Court as the County Court has no jurisdiction to deal with the remedy sought.", "The claimant may not obtain default judgment in this claim as it falls within a category in which a default judgment cannot be obtained."], "a": "A", "bx": "The correct answer was A. This is because the claimant is able to make an application for default judgment here (therefore options D and E are incorrect). The defendant has 14 days to acknowledge service or file a defence, after which the claimant is free to submit an application for default judgment (therefore option B is incorrect). An application is made by completing the relevant form (N244) and sending this to the court with the appropriate fee (making option C incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 4"}, {"ch": 0, "n": 56, "sc": ["A solicitor defends a woman in a personal injury dispute. The woman's gross income is £2,000 per month, her disposable income is £800 per month, and her disposable capital is £6,000. The woman seeks legal aid in the form of legal representation. The solicitor is satisfied that the woman passes the merits test, but is unsure as to whether the woman passes the means test."], "st": "Which of the following best describes whether the woman is likely to succeed in her application for civil legal aid?", "o": ["The woman does not qualify for civil legal aid because her gross income is over the prescribed limit.", "The woman does not qualify for civil legal aid because both her gross income and her disposable capital are over the prescribed limit.", "The woman does not qualify for civil legal aid because her disposable income is over the prescribed limit.", "The woman does not qualify for civil legal aid because both her disposable income and her disposable capital are over the prescribed limit.", "The woman does not qualify for civil legal aid because her disposable capital is over the prescribed limit."], "a": "C", "bx": "The correct answer was C. This is because the limit on disposable income to qualify for civil legal aid is £733 or less. As the woman has a disposable income of £800, she does not satisfy the means test. The woman's gross income is £2,500 which is less than the limit (£2,657), and her disposable capital is £6,000 which is below the limit of £8,000. As a result, all other options are incorrect.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 8"}, {"ch": 0, "n": 57, "sc": ["A company is served with proceedings. The date of service coincides with a high volume of mail and, as a result, the envelope enclosing the proceedings is accidently shredded before it is opened. A further letter from the court is received by the company enclosing an order awarding judgment in default in favour of the claimant on the basis of the company's failure to acknowledge service of the original claim form by the relevant deadline."], "st": "Which of the following best represents the course of action the company should take?", "o": ["The company can apply to set aside judgment in default on the discretionary ground, provided it can show that it has a reasonable prospect of successfully defending the claim and there is a good reason why it did not respond, provided this is done promptly.", "The company can apply to set aside judgment in default on the mandatory ground, provided this is done promptly.", "The company can apply to set aside judgment in default on the discretionary ground. The only way of doing so is to show that it has a reasonable prospect of successfully defending the claim.", "The company can apply to set aside judgment in default on the discretionary ground. The only way of doing this is to show that there is a good reason why it did not respond.", "The company can apply to set aside judgment in default on the discretionary ground, provided it can show that it has a reasonable prospect of successfully defending the claim or there is a good reason why it did not respond, provided this is done promptly."], "a": "E", "bx": "The correct answer was E. This is because the mandatory ground is not applicable here (therefore, option B is incorrect) and the application should be made promptly (making options C and D incorrect). The applicant is only required to show either that they have a reasonable prospect of successfully defending the claim or there is a good reason why they did not respond (therefore, option A is incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 4"}, {"ch": 0, "n": 58, "sc": ["The claimant is walking home from work one day when they witness an explosion on a residential street. A defective gas pipe at a property had fractured, causing a leak that ignited when one of the residents turned on their oven. Several houses are destroyed and many of the residents are seriously injured or killed. The claimant was walking directly outside the property that exploded but was not physically injured. They call the emergency services and try to help rescuers who arrive on the scene. When the claimant arrives home, they have a physical reaction to what they have witnessed and start to vomit. The claimant is unable to sleep for weeks and eventually attends their doctor where they are diagnosed with post-traumatic stress disorder (PTSD)."], "st": "Is the claimant able to bring a claim in negligence in respect of the diagnosed PTSD?", "o": ["Yes, on the basis that the claimant has suffered injury as a secondary victim.", "No, on the basis that the claimant is not sufficiently proximate to the zone of physical danger.", "Yes, on the basis that the claimant has suffered physical injury as a primary victim.", "No, on the basis that the claimant has no tie of love and affection with the occupants of the properties.", "Yes, on the basis that the claimant has suffered psychiatric injury as a primary victim."], "a": "E", "bx": "The correct answer was E. This is because the claimant has suffered a medically diagnosed psychiatric condition and would be classed as a primary victim as they were directly outside the property that exploded and, although not physically injured, could have been. Option A is incorrect as the claimant is a primary victim. Option C is incorrect as the claimant did not suffer physical injury. Option B is incorrect as the claimant is in the zone of physical danger as they are directly outside the property that exploded and we are aware that several houses were destroyed. Option D is incorrect as a tie of love and affection relates to secondary victims and the claimant is a primary victim.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 3"}, {"ch": 0, "n": 59, "sc": ["The claimant in a civil case intends to appeal the High Court's decision. The case, which concerns a low-value contract law dispute, was initially considered by a High Court judge. The claimant wishes to appeal on the basis of a point of law of general public importance. The decision is unlikely to be of particular significance and does not raise issues of national importance. The claimant would like the issue to be resolved as quickly as possible because they are experiencing serious health issues."], "st": "Which of the following statements most accurately explains the correct route of appeal?", "o": ["The appeal would most likely be heard by the Court of Appeal (Civil Division). The leapfrog procedure is unlikely to be applicable because the case concerns a relatively low-value civil claim.", "The appeal would most likely be heard by the Supreme Court. The leapfrog procedure is likely to be applicable because the case involves a point of law of general public importance.", "The appeal would most likely be heard by the Court of Appeal (Civil Division) because the Supreme Court does not have the jurisdiction to consider appeals from the High Court.", "The appeal would most likely be heard by the Court of Appeal (Civil Division) because it is unlikely that the benefits of early consideration by the Supreme Court outweigh the benefits of consideration by the Court of Appeal.", "The appeal is most likely to be heard by the Supreme Court. The leapfrog procedure may be used to expediate appeal cases concerning points of law of general public importance where there is a good reason to refer the appeal directly to the Supreme Court. In this case, the fact that the claimant is suffering serious health issues would likely constitute a good reason for using the leapfrog procedure."], "a": "D", "bx": "The correct answer was D. This is because the Supreme Court may consider appeals from the High Court where the leapfrog procedure is applicable (option C is therefore incorrect). The leapfrog procedure can only be used where the decision concerns a point of law of general public importance and the decision is unlikely to be of particular significance, raises issues of national importance or the benefits of early consideration by the Supreme Court outweigh the benefits of consideration by the Court of Appeal (option B is therefore incorrect). Option A is incorrect because the value of the claim is irrelevant to the leapfrog criteria. Because the scenario clearly states that the outcome of the case is unlikely to be of particular significance and does not raise issues of national importance, the procedure would only be available if the benefits of early consideration by the Supreme Court outweigh the benefits of consideration by the Court of Appeal. Option E is incorrect because it misstates the leapfrog criteria. On the facts provided, there is no reason to believe that the benefits of early consideration outweigh the benefits of the case being considered by the Court of Appeal, so Option D is the best available answer.", "ar": "Legal system of England and Wales", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 1"}, {"ch": 0, "n": 60, "sc": ["A number of national newspapers have reported that a high-profile and wealthy businessman has been involved in a widespread sexual harassment scandal. The reports claim that the businessman kissed and touched female members of staff without their consent. The businessman used his substantial wealth and influence to encourage the female members of staff to sign non-disclosure agreements to prohibit them from discussing any details of the claims. The businessman also successfully applied for an injunction to prevent the newspaper identifying him as the alleged perpetrator. Concerned by the reports, a member of the House of Lords discloses the identity of the businessman during the course of parliamentary debates."], "st": "Which of the following statements best describes the effect of parliamentary privilege in this case?", "o": ["The disclosure of identity would be protected by parliamentary privilege.", "The disclosure of identity would be liable for breaching the injunction.", "The disclosure of identity would not be covered by parliamentary privilege.", "The disclosure of identity would not be covered by parliamentary privilege because an injunction was in place to prevent such a disclosure being made.", "The disclosure of identity would not be covered by parliamentary privilege because the reports have not been subject to any form of criminal investigation."], "a": "A", "bx": "The correct answer was A. This is because the disclosure would be protected under parliamentary privilege. Parliamentary privilege grants certain legal immunities to members of both Houses of Parliament and this includes protection from any civil action that would ordinarily arise as a result of such disclosures/statements. Statements and disclosures made during the course of ordinary parliamentary proceedings are covered by parliamentary privilege. Options C, D and E are incorrect because they all state that the disclosure would fall outside the scope of parliamentary privilege. Option B is incorrect because it does not address parliamentary privilege and implies that the member of the House of Lords would be liable for breaching the injunction.", "ar": "Constitutional and administrative law and EU law", "see": "Revise SQE: Constitutional and Administrative Law, Chapter 2"}, {"ch": 0, "n": 61, "sc": ["A group of former solicitors are setting up a will-writing business. The business will only offer will-drafting services and will not engage in any reserved legal activities. The business intends to charge clients for their services."], "st": "Which of the following statements most accurately describes the level of professional indemnity insurance (Pll) cover the business will need, as required by the Solicitors Regulation Authority (SRA)?", "o": ["The SRA will require the business to have Pll cover of up to £3 million for any one claim.", "The SRA will require the business to have Pll cover that is adequate.", "The SRA will require the business to have Pll cover that is appropriate.", "The SRA will not require the business to have any Pll insurance cover.", "The SRA will require the business to have Pll cover that is both adequate and appropriate."], "a": "D", "bx": "The correct answer was D. This is because the business will not need to have Professional Indemnity Insurance (PH) if it is not engaged in any reserved legal activities. Will writing is not a reserved legal activity. Option A is incorrect because the duty to have cover of up to £3 million for any one claim only applies to firms carrying on reserved legal activities. Options B, C and E are incorrect because the requirement that PH is both adequate and appropriate does not apply to the business. Options B and C would have been incorrect in any event because they do not accurately set out the minimum PH threshold.", "ar": "Legal services", "see": ""}, {"ch": 0, "n": 62, "sc": ["A solicitor has been approached by a new client who wishes to engage their services in a high- profile and complex contractual negotiation. The solicitor is being asked to draft the proposed terms of a contract should the new client be awarded the contract. During the initial consultation, the solicitor discovers that they have already been retained by another client in the same matter. The current client retained the solicitor on the specific instruction that the solicitor could not act for any other party interested in the award of the particular contract. The new client is offering to pay the solicitor a higher price than the current client."], "st": "Which of the following best describes what the solicitor can do in accordance with the Solicitors Regulation Authority (SRA) Code of Conduct?", "o": ["The solicitor can act for both the new client and the current client without disclosing the potential conflict of interest.", "The solicitor cannot act for the new client as there is a conflict of interest between the new client and the current client.", "The solicitor can cease to act for the current client, and act for the new client on the basis that the new client is offering a higher price for the solicitor's services.", "The solicitor cannot act for the new client as there is an own interest conflict.", "The solicitor can act for both the new client and the current client but must disclose the potential conflict of interest."], "a": "B", "bx": "The correct answer was B. This is because the SRA Code of Conduct prohibits a solicitor from acting in circumstances where there is a conflict of interest or a significant risk of such a conflict between current and new clients. The exception to this rule (where clients are competing for the same objective) does not apply because the current client has clearly stated that the solicitor cannot act for another party to these proceedings (which the solicitor has accepted through the retainer). Therefore, the current client would not consent to this course of conduct (option E is incorrect). Option A is incorrect because the solicitor must not act without disclosing the conflict of interest. Option C is incorrect because the solicitor owes a duty to act in the best interests of each client; to withdraw their services simply because another client is offering more money would not be acting in the current client's best interests. Option D is incorrect because this is not an own interest conflict case.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 2"}, {"ch": 0, "n": 63, "sc": ["An employer took out a group insurance policy. The policy named the employer as the Insured' and a number of employees as Insured persons'. The employees pay an annual fee to the employer for the policy. One of the employees was injured on the employer's premises. The insurer pays the employer a sum of money under the policy."], "st": "Is the employee entitled to recover the sum from the employer that was paid by the insurer?", "o": ["Yes, because the employee provided valid consideration to the employer.", "No, because the contract is between the employer and the insurer only.", "Yes, because there is a presumption that the employee is intended to have a right of enforceability.", "No, because no consideration moves from the employee to the insurer.", "No, because the employer has discretion as to whether to pass the payment to the employee."], "a": "C", "bx": "The correct answer was C. This is because the employee has strictly not provided consideration to the insurer as the contract is between the employer and the insurer. However, as a matter of convenience, the money is channelled through the employer. This provides an exception for the need to provide direct consideration and creates a presumption that the employee has the right to enforce the contract. As this is a contract of convenience (the payment is given to the employer rather than each employee having to make payment directly to the insurer) there is no need for the employee to provide consideration directly to the insurer (option A is therefore incorrect). Option B is incorrect as there are exceptions to the privity of contract rule in contracts of convenience. Option D is incorrect as in a contract of convenience there is no need for the employee to provide consideration directly to the insurer. As the employee is presumed to have rights of enforceability, the employer cannot withhold the payment (option E is therefore incorrect).", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 4"}, {"ch": 0, "n": 64, "sc": ["A claimant issues proceedings against a defendant for breach of implied terms. The claim form and the particulars of claim are served on the defendant by the court. The defendant intends to defend the proceedings and also to make a counterclaim, but it will take some time to gather the relevant information for both the defence and counterclaim."], "st": "Which of the following best describes how the defendant should proceed?", "o": ["The defendant should file an acknowledgement of service, defence and counterclaim within 28 days after service of the claim form and particulars of claim.", "The defendant should file an acknowledgement of service within seven days after service of the claim form and particulars of claim, and a defence and counterclaim within 21 days of the acknowledgement of service.", "The defendant should file an acknowledgement of service within 14 days after service of the claim form and particulars of claim, and a defence and counterclaim within 28 days after service of the claim form and particulars of claim.", "The defendant should file an acknowledgement of service within 14 days after service of the claim form and particulars of claim, and a defence and counterclaim within 14 days of the acknowledgement of service.", "The defendant should file an acknowledgement of service within 14 days after service of the claim form and particulars of claim, and a defence and counterclaim within 28 days of the acknowledgement of service."], "a": "C", "bx": "The correct answer was C. This is because an acknowledgement of service needs to be filed within 14 days of the date of service of the claim form and particulars of claim (therefore options A and B are incorrect). Provided this is done, this extends the period within which a defence (and in this case counterclaim) must be filed to 28 days from date of service of the claim form and particulars of claim (therefore, options D and E incorrect).", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 4"}, {"ch": 0, "n": 65, "sc": ["A newly qualified solicitor is retained by a client in a business dispute between the client and a competitor. The solicitor has a personal relationship with an employee of the competitor."], "st": "Which of the following is the most relevant Principle of the Solicitors Regulation Authority (SRA) Code of Conduct to the conduct of the solicitor?", "o": ["The solicitor must act in a way that upholds the constitutional principle of the rule of law, and the proper administration of justice.", "The solicitor must act in a way that encourages equality, diversity and inclusion.", "The solicitor must act in a way that upholds public trust and confidence in the solicitors' profession and in legal services provided by authorised persons.", "The solicitor must act with integrity.", "The solicitor must act with independence."], "a": "E", "bx": "The correct answer was E. This is because whilst all of the Principles may be relevant to this scenario, the Principle to act with independence is the most prominent. As a solicitor, it is essential to maintain independence and avoid conflicts of interest. In this scenario, the solicitor has a personal relationship with an employee of the competitor, which creates an own interest conflict. The solicitor must ensure that their independence is not compromised and that they provide unbiased legal advice and representation to the client. Therefore, whilst all five of these Principles may be relevant, and are of importance, the Principle to act with independence is likely to be the most relevant. All other options are therefore incorrect.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 1"}, {"ch": 0, "n": 66, "sc": ["A client has a taxable income of £70,000 which includes dividend income of £20,000."], "st": "Which of the following statements best describes the tax treatment of the clients dividend income?", "o": ["The entire amount of dividend income will be taxed at the basic rate of income tax as the amount of dividend income falls below the current basic rate threshold.", "The entire amount of the client's dividend income will be taxed at the higher rate of income tax as it will all come within the higher rate band.", "The first £500 of the client's dividend income will be taxed at 0% and the remainder at the basic rate of income tax applicable to dividends.", "The first £500 of the client's dividend income will be taxed at 0% and the remainder at the higher rate of income tax applicable to dividends.", "As the dividend income comes from shares in a trading company, the income is exempt from income tax and will be subject to corporation tax."], "a": "D", "bx": "The correct answer was D. This is because the client is a higher rate taxpayer (ie, the client's taxable income exceeds the basic rate threshold level set by HMRC). Note that the higher rate of income tax applicable to dividends is currently 33.75%. Therefore, options A and C are immediately excluded because these would only apply if the client had a taxable income that fell entirely within the basic rate band. Option E is incorrect in law individuals do pay income tax on dividends received from a trading company. Option B is incorrect as it fails to take account of the dividend allowance the statement implies that the client's entire dividend income would be taxed at the higher rate of income tax and ignores the ability of the client to pay on the amount of dividend income within the dividend allowance.", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 8"}, {"ch": 0, "n": 67, "sc": ["A solicitor is dealing with a matter that is being considered by a High Court judge."], "st": "Which of the following statements most accurately describes the jurisdiction of High Court judges?", "o": ["High Court judges may only consider cases before the High Court.", "High Court judges may only consider cases before the High Court, the Crown Court and the Family Court.", "High Court judges may only consider cases before the High Court and the Family Court.", "High Court judges may only consider cases before the High Court and the Crown Court.", "High Court judges may only consider cases before the High Court and the County Court."], "a": "B", "bx": "The correct answer was B. This is because High Court judges have jurisdiction to sit in the High Court, the Crown Court and the Family Court. Options A, C, D and E are therefore incorrect.", "ar": "Legal system of England and Wales", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 1"}, {"ch": 0, "n": 68, "sc": ["A defendant is served with a claim form and particulars of claim. The defendant wishes to defend the claim. Five years ago, the defendant loaned the claimant a sum of money to be repaid in 36 monthly instalments commencing on the date the loan money was advanced."], "st": "Which of the following reflects the best way the defendant can proceed?", "o": ["The defendant should file a counterclaim against the claimant at the same time as the defence is filed. It does not matter that the facts are unconnected to the original claim; the defendant is entitled to commence a counterclaim.", "The defendant should file a separate claim against the claimant immediately. As the facts are unconnected to the original claim it cannot be dealt with by way of counterclaim, but the defendant is entitled to issue proceedings against the claimant separately.", "The defendant should seek the court's permission to bring a separate claim against the claimant immediately. As the facts are unconnected to the original claim it cannot be dealt with by way of counterclaim, but the defendant is entitled to issue proceedings against the claimant separately with permission of the court.", "The defendant should wait until the current proceedings are concluded and then issue a claim against the claimant separately. As the facts are unconnected to the original claim it cannot be dealt with by way of counterclaim, but the defendant is entitled to issue proceedings against the claimant separately.", "The defendant should apply for the permission of the court to file a counterclaim against the claimant immediately. It does not matter that the facts are unconnected to the original claim, the defendant is entitled to commence a counterclaim, but the defendant will need permission from the court to do so."], "a": "A", "bx": "The correct answer was A. This is because it is immaterial that the facts of the case are different from those in the original claim; the defendant is still entitled to bring a counterclaim against the claimant without needing to issue proceedings separately (options B, C and D are therefore incorrect). Option E is incorrect as the time period within which the defendant could file the counterclaim has not expired. It can therefore be filed at the same time as the defence without the court's permission.", "ar": "Dispute resolution", "see": "Revise SQE: Dispute Resolution, Chapter 5"}, {"ch": 0, "n": 69, "sc": ["A lender entered into a loan agreement with a business. The loan was for £120,000 and was to be repaid in 12 equal instalments of £10,000. The business paid the first 11 instalments as they fell due. Shortly before the final instalment was due, the lender approached the business and promised that they would accept £5,000 for the final instalment. In exchange for the lender's promise, the business would provide free staff training to the lender's employees. The business paid £5,000 for the final instalment and provided the staff training as agreed. Two months later, the business received a letter from the lender's solicitors demanding that the business pays the outstanding £5,000, plus the interest accrued on the debt."], "st": "Which of the following statements best describes the liability of the business to pay the amount claimed?", "o": ["The business is not liable to pay the amount claimed as their payment of £115,000 under the agreement will constitute a practical benefit to the lender.", "The business is liable to pay the amount claimed as the staff training was free and had no economic value.", "The business is not liable to pay the amount claimed as the business can rely upon the doctrine of promissory estoppel.", "The business is liable to pay the amount claimed as part-payment of a debt is not good consideration.", "The business is not liable to pay the amount claimed as the provision of the staff development is sufficient consideration to bind the lender to the promise to accept a lesser amount."], "a": "E", "bx": "The correct answer was E. This is because the provision of the staff development will constitute sufficient consideration. The training was never part of the original agreement. The only obligation of the business was to repay the loan in accordance with the agreement. By providing the staff development, the business is going beyond their existing obligations. This is an exception to the common law rule that part-payment of a debt is generally insufficient as consideration. The principles developed by the Court of Appeal in Williams v Roffey, and the recognition that a practical benefit may constitute valuable consideration, are limited to contracts for goods and/ or services. They cannot apply to the part-payment of a debt (therefore option A is incorrect). Option B is incorrect as the staff training may have economic value even though no payment was given in exchange. The doctrine of promissory estoppel is an equitable remedy that may provide a defence when a party has relied upon a promise. However, in this scenario, recourse to equity would not be appropriate. The staff training will constitute valuable consideration and the lender's promise is binding at common law (option C is therefore incorrect). Option D is incorrect as it represents the general position at common law. However, there are exceptions to this general rule. Evidence that a party has gone beyond what was required under the contract, such as the provision of a service in exchange for the promise to accept a lesser amount, will constitute good consideration.", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 2"}, {"ch": 0, "n": 70, "sc": ["A small law firm has recently advertised a position for a full-time civil litigation solicitor. The deadline for applications has now passed. The three managing partners of the firm agree to 'sift' the applications by removing all applications from women who are aged 25 to 35. They all agree that women in this age group are likely to need substantial time off from work for maternity- related reasons so it would be preferable to remove such candidates from the pool of applicants before invitations for interviews are sent out."], "st": "Which of the following statements most accurately describes the actions of the partners?", "o": ["The actions of the partners amount to victimisation under the Equality Act 2010.", "The actions of the partners amount to indirect discrimination under the Equality Act 2010.", "The actions of the partners would not constitute prohibited conduct under the Equality 2010.", "The actions of the partners amount to direct discrimination under the Equality Act 2010.", "The actions of the partners amount to positive discrimination under the Equality Act 2010."], "a": "D", "bx": "The correct answer was D. This is because the conduct is a clear example of direct discrimination on the basis of sex and age. Options A, B and C are incorrect because they do not classify the conduct as direct discrimination. Option E is incorrect because positive discrimination refers to situations where an employer treats a person/people more favourably because of a protected characteristic. This is not applicable here because any female applicants aged 25 to 35 are not being treated favourably.", "ar": "Legal services", "see": "Revise SQE: The Legal System and Services of England and Wales, Chapter 6"}, {"ch": 0, "n": 71, "sc": ["The claimant is employed at a manufacturing plant as a fitter. The manufacturing plant sub contracts work to an electrical company. The defendant works for the electrical company. The claimant and defendant have experienced tensions between each other at work and are not on good terms. Last month, both the claimant and the defendant leave work at the same time. On this day, the defendant follows the claimant home and as a practical joke sets off a firework near the claimant as they alight from their car. The firework bounces off the claimant and causes them to fall into the road into the path of an oncoming vehicle, causing them serious personal injury."], "st": "Which of the following best describes the liability of the manufacturing plant and/or the electrical company for the claimant's injuries?", "o": ["Neither the manufacturing plant nor the electrical company are vicariously liable for the defendant's dangerous actions as the defendant had deviated from his course of employment.", "The electrical company is vicariously liable for the defendant's dangerous actions; the manufacturing plant is not vicariously liable as the defendant does not work for the manufacturing plant", "The manufacturing plant is vicariously liable for the defendant's dangerous actions as there was sufficient proximity from the defendant leaving work, following the claimant and throwing the firework; the electrical company is not vicariously liable for the defendant's actions as the defendant had deviated from his course of employment.", "Neither the manufacturing plant nor the electrical company are vicariously liable for the defendant's dangerous actions as the claimant's fall into the road breaks the chain of causation.", "The manufacturing plant and electrical company are equally vicariously liable for the defendant's dangerous actions."], "a": "A", "bx": "The correct answer was A. This is because the court will find on balance that the defendant is no longer acting in the course of their employment, by using a firework and also due to the fact that they have left work. Option B is incorrect for the same reason, namely that the defendant has left work and is no longer acting in the course of their employment; option B is also incorrect as it is irrelevant that the defendant does not work for the manufacturing plant the plant has subcontracted the defendant and thus has responsibility for them whilst on site. Option C is incorrect as there is not sufficient proximity and the defendant was not acting in the course of their employment. Option D is incorrect as throwing the firework causes the claimant to fall into the road; the chain of causation is not broken. Option E is incorrect as neither company are vicarious liable as the defendant was not acting in the course of their employment.", "ar": "Tort law", "see": "Revise SQE: Tort Law, Chapter 3"}, {"ch": 0, "n": 72, "sc": ["A housing association is the owner of a block of flats. The housing association entered into a contract with a company to refurbish the flats. The company sub-contracts the work to a set of builders. Before the work was completed, the company realised that the builders were not going to complete the work on time. To avoid the operation of a penalty clause in their contract with the housing association, the company promised the builders an additional £10,000 if the work was completed on time. The builders completed the work on time. The builders then claimed the additional £10,000 from the company. The company refused to pay the additional amount."], "st": "Is the company liable to pay the additional £10,000 to the builders?", "o": ["Yes, as the builders relied on the company's promise of an additional £10,000. This will bind the company to their promise of an additional £10,000.", "Yes, as the builders completed the work on time, the company avoided the disbenefit of the penalty clause. This will be sufficient consideration to bind the company to their promise of an additional £10,000.", "No, as the builders were only performing in accordance with their existing contractual duty. This is insufficient consideration to bind the company to their promise of an additional £10,000.", "Yes, as the builders have exceeded their contractual duty. This is sufficient consideration to bind the company to their promise of an additional £10,000.", "No, as the builders' consideration is in the past. This is insufficient consideration to bind the company to their promise of an additional £10,000."], "a": "B", "bx": "The correct answer was B. This is because the performance of an existing contractual duty will generally be insufficient as consideration. However, the Court of Appeal in Williams v Roffey recognised that performance of an existing contractual duty could constitute valuable consideration if that performance confers a practical benefit to the promisor. The company has gained no more in law than they were entitled to under the contract. Nevertheless, as a matter of fact, the company has avoided the operation of the penalty clause. This will be sufficient consideration under the principles developed in Williams v Roffey. Simple reliance upon a promise does not make it binding at common law (option A is therefore incorrect). As noted above, Williams v Roffey provides an exception to the general rule that performance of an existing contractual duty is insufficient consideration (therefore option C is incorrect). Option D is incorrect as there is no evidence on the facts that the builders have exceeded their contractual duty. The company are giving their promise of an additional payment in exchange for the builders completing the work on time. This is not an example of past consideration (option E is therefore incorrect).", "ar": "Contract law", "see": "Revise SQE: Contract Law, Chapter 2"}, {"ch": 0, "n": 73, "sc": ["A man is a director and shareholder in a client company. Since its incorporation, the company has operated from a property owned by the man. The company is to buy the property for its market value of £860,000. The company has unamended model articles as its articles of association."], "st": "Which of the following statements provides the best description of the process around the successful completion of the transaction?", "o": ["The man will not be permitted to vote at any meeting of the directors or shareholders of the company on any resolution concerning the purchase of the property unless the articles of association are amended.", "The purchase of the property will need to be approved by an ordinary resolution of the company because the transaction is a substantial property transaction.", "As the man is a director of the company, if the purchase of the property is not approved by an ordinary resolution of the company before it is entered into, the purchase of the property will be void.", "Under the Companies Act 2006, the man, as a director of the company, does not need to make a declaration of interest, since exemptions will certainly apply in relation to the proposed purchase of the property.", "The transaction, whilst of substantial value, will not amount to a substantial property transaction as it does not fall within the definition laid down in the Companies Act 2006."], "a": "B", "bx": "The correct answer was B. This is because the transaction clearly falls within the definition of a substantial property transaction (SPT) from the Companies Act 2006. An STP is an arrangement under which a director (or connected person) acquires or is to acquire from the company a noncash asset, or the company acquires or is to acquire from a director (or connected person) a non-cash asset where the value is substantial (ie, exceeds 10% of company's asset value and is more than £5,000 or it exceeds £100,000) and the consideration is cash. If the transaction fulfils this definition, the company needs to approve it by passing an ordinary resolution of the shareholders. If this approval is not obtained, the transaction is voidable. On this reasoning, option E is incorrect, and option C is incorrect as the transaction would be voidable (not void). Option D is incorrect in law as the declaration of interest would be required in addition to the other formalities described. Option A is incorrect as it includes reference to the inability to vote at a shareholders' meeting (he would be able to vote).", "ar": "Business law and practice", "see": "Revise SQE: Business Law and Practice, Chapter 4"}, {"ch": 0, "n": 74, "sc": ["A solicitor is approached by a client regarding a complex tax issue. The solicitor is unsure of how to handle the case and seeks the assistance of another colleague who is a tax expert. By including the other colleague in the case, the costs for the work done will increase."], "st": "Which of the following most accurately describes the obligation on the solicitor?", "o": ["The solicitor is not required to inform the client of any increase in costs.", "The solicitor must inform the client of any increase in costs.", "The solicitor is not required to inform the client of any increase in costs as the fees for the other colleague do not amount to costs.", "The solicitor must inform the client of any substantial increase in costs.", "The solicitor is not required to inform the client of any increase in costs as the client was provided with information on costs at the time of engagement."], "a": "B", "bx": "The correct answer was B. This is because the SRA Code of Conduct requires solicitors to ensure that clients receive the best possible information about how their matter will be priced and about the likely overall cost of the matter and any costs incurred. This duty is a continuing one, arising at the time of engagement and as the matter progresses (therefore option E is incorrect). Given that the work of the colleague will incur extra costs, the solicitor must keep the client informed (therefore option A is incorrect). Option C is incorrect because the work of the colleague will amount to costs. Option D is incorrect because the SRA Code of Conduct does not dictate that the costs must be 'substantial', but that they must be kept informed 'when appropriate'. Additional costs by instructing the expert colleague is an appropriate circumstance.", "ar": "Ethics and professional conduct", "see": "Revise SQE: Ethics and Professional Conduct, Chapter 1"}, {"ch": 0, "n": 75, "sc": ["Following the death of a cyclist in a city centre, a large group of cyclists decide to organise a procession in the city centre. Their aim is to attract attention to a campaign which calls for increased road safety measures to be implemented in major city centres to help protect cyclists."], "st": "Which of the following statements most accurately describes the notice requirements for such a procession?", "o": ["The notice period is not less than 14 clear days before the date when the procession is intended to be held.", "The notice period is not less than 24 hours before the date when the procession is intended to be held.", "The notice period is not less than 21 clear days before the date when the procession is intended to be held.", "The notice period is not less than six clear days before the date when the procession is intended to be held.", "The notice period is not less than seven clear days before the date when the procession is intended to be held."], "a": "D", "bx": "The correct answer was D. This is because notice must be given in advance of any procession. Typically, notice must be given at least six clear days before the procession is due to take place. Options A, B, C and E are incorrect because they do
