<script>
const D={"t": ["Advising clients, including vulnerable clients, about the procedure and processes at the police station", "Bail applications", "First hearings before the magistrates’ court", "Plea before venue and allocation of business between magistrates’ court and Crown Court", "Case management and pre-trial hearings", "Principles and procedures to admit and exclude evidence", "Trial procedure in the magistrates’ court and Crown Court", "Sentencing", "Appeals procedure", "Youth Court procedure"], "q": [{"ch": 0, "n": 1, "sc": ["A girl, aged 16, is arrested on suspicion of theft, contrary to s 1 Theft Act 1968, and is taken to a police station. On arrival, the custody officer books her in and opens a custody record. The custody officer asks the girl how old she is and who she lives with and informs her of her rights. The girl tells the custody officer that the only family she is aware of is her father, who she has not seen for five years, and that she is in the care of the local authority. The girl expressly informs the custody officer that she does not want her father involved. The girl asks to consult with a solicitor and insists that she wants to be interviewed immediately because she wants to go home."], "st": "Which of the following best describes the actions the custody officer should take?", "o": ["The custody officer may arrange for an appropriate adult to attend the police station before interviewing the girl. As the girl has identified that she is in local authority care, her social worker or a representative of the local authority must be contacted. The girl must not be interviewed until the appropriate adult arrives and she has consulted with her solicitor.", "The custody officer must arrange for an appropriate adult to attend the police station before interviewing the girl. As the girl has identified her father, he must act as the appropriate adult and attend the police station. The girl must not be interviewed until her father arrives and she has consulted with her solicitor.", "The custody officer must arrange for an appropriate adult to attend the police station before interviewing the girl. As the girl has identified that she is in local authority care, her social worker or a representative of the local authority must be contacted. The girl must not be interviewed until the appropriate adult arrives and she has consulted with her solicitor.", "The custody officer must arrange for an appropriate adult to attend the police station before interviewing the girl. The solicitor is able to act as an appropriate adult, and when the solicitor attends the police station, the girl must be able to consult with them in private.", "The custody officer may arrange for an appropriate adult to attend the police station before interviewing the girl. As the girl has identified that she is in local authority care, her social worker or a representative of the local authority must be contacted. The girl may be interviewed before her solicitor and appropriate adult arrives if an officer of the rank of inspector or above is satisfied that the relevant conditions are met."], "a": "C", "bx": "The correct answer was C. This is because the police must contact an appropriate adult for the girl, and, as she has identified that she is in local authority care, the most appropriate individual would be a local authority representative. Options A and E are wrong because this is an instance where the police must obtain an appropriate adult; it is not optional. Option B is wrong because an estranged parent is not necessarily considered an appropriate adult. Option D is also wrong because solicitors are prohibited from acting as an appropriate adult when they are representing the juvenile or vulnerable person in their professional capacity."}, {"ch": 0, "n": 2, "sc": ["A woman is arrested on suspicion of common assault and is taken to an authorised place of detention. The woman did not say a great deal to the arresting officer but indicates that she may have acted in self-defence. At the scene, a witness claims to have seen the alleged assault, and even though they were standing at a distance, would recognise the suspect given the opportunity; a statement has been given to this effect. The woman, who is yet to be interviewed, is consulting with her solicitor, and the police are considering the appropriate course of action regarding an identification procedure."], "st": "Which of the following best describes the actions the police should take regarding carrying out an identification procedure?", "o": ["The police must carry out an identification procedure, as a witness claims that they can identify the suspect who allegedly committed the assault and has not yet been given the opportunity to do so, and the identity of the suspect may be disputed.", "The police may carry out an identification procedure but should wait until they have interviewed the woman. Whilst there is a witness who claims that they can identify the suspect who allegedly committed the assault and has not yet been given the opportunity to do so, the issue of identity may not be in dispute.", "The police must carry out an identification procedure but must wait until they have interviewed the woman. Whilst there is a witness who claims that they can identify the suspect who allegedly committed the assault and has not yet been given the opportunity to do so, the issue of identity may not be in dispute.", "The police must not carry out an identification procedure before the suspect is interviewed. There is a witness who claims that they can identify the suspect who allegedly committed the assault and has not yet been given the opportunity to do so, and as there is the potential for identity to be disputed, a procedure must be carried out.", "The police may not carry out an identification procedure after the woman has been interviewed. As the witness has already provided a statement to the police purporting to recognise the woman, this is sufficient identification evidence and it is likely that the identification officer would conclude that it is unnecessary for a procedure to go ahead."], "a": "B", "bx": "The correct answer was B. This is because at present, the issue of identity may not be in dispute (as the woman appears to be claiming self-defence). Before this is confirmed in interview, there is nothing compelling the police at this stage to carry out an identity procedure; therefore, option A is wrong. Option C is wrong because reliance on legal advice may prevent inferences being drawn where a fact was not mentioned before or on charge but was at trial. Option D is also wrong because whilst it would be practical to wait until the interview has concluded, there is nothing compelling the police to carry out a procedure after an interview. Option E is wrong because whilst the police retain the right not to hold an identity procedure if there is little purpose, that is not the case here, and the conditions requiring the police to carry out a procedure are satisfied."}, {"ch": 0, "n": 3, "sc": ["A woman is arrested on suspicion of murder. On arrival at the police station, the woman had her detention authorised by the custody officer. The woman confirmed that she wanted to speak to a solicitor, and the police waited until the solicitor arrived. The woman was very nervous and had never been in trouble with the police before. The solicitor spoke to the woman in private and requested disclosure of the evidence which the police had obtained. Before interview, the solicitor advised the woman to remain silent, which she did after trusting the solicitor. The woman is later charged and pleads not guilty. The woman gives evidence at trial and puts forward evidence not previously relied upon in response to police questioning. The woman is now concerned about the impact of any adverse inferences."], "st": "Which of the following best describes the position regarding whether adverse inferences will be drawn from the woman's silence during police questioning?", "o": ["As the woman relied on the advice of the solicitor to remain silent, adverse inferences must not be drawn. There is no need to show that reliance on the advice was genuine, as remaining silent on legal advice is a permitted exception.", "As the woman relied on the advice of the solicitor to remain silent, adverse inferences may not be drawn. If the jury are satisfied that reliance on the solicitor's advice was genuine, inferences may not be drawn.", "As the woman remained silent at interview before charge, but put forward a positive defence at trial, inferences must be drawn irrespective of reliance on legal advice.", "As the woman relied on the advice of the solicitor to remain silent, adverse inferences may not be drawn. If the trial judge is satisfied that the reliance on the solicitor's advice was genuine, inferences may not be drawn.", "As the woman remained silent at interview before charge, but put forward a positive defence at trial, inferences must not be drawn irrespective of reliance on legal advice."], "a": "B", "bx": "The correct answer was B. This is because if the woman's reliance on the advice was genuine, then inferences may not be drawn. However, there is nothing which says that inferences must not be drawn (therefore option C is wrong); it is for the arbiter of fact (in this case, the jury) to decide if the reliance was genuine. Option A is wrong because the woman will need to demonstrate that her reliance was genuine. Option D is wrong because the issue of reliance is for the jury, not the judge. Option E is wrong as it completely misrepresents the law relating to adverse inferences."}, {"ch": 0, "n": 4, "sc": ["A man is arrested on suspicion of assault occasioning actual bodily harm, contrary to s 47 Offences Against the Person Act 1861. On arrest, the man was cautioned, and understood the caution. The man was interviewed, and then released on bail, still subject to investigation. The police obtained evidence from an eyewitness who claims that they could recognise the person who they believe committed the offence and gave a description which was similar to the man's appearance. The police asked whether the man would consent to an identification procedure. The man, who protests his innocence and denies any involvement, lives 20 minutes away from the police station and says that he will get to the police station as soon as he can."], "st": "Which of the following best describes the man's status for an identification procedure?", "o": ["The man would be considered as known and unavailable, as whilst he is known to the police, he is not immediately available to participate in the identification procedure.", "The man would be considered as known but unavailable, as whilst he is known to the police, he is not available within a reasonably short time to participate in the identification procedure.", "The man would be considered as not known and available, as whilst he is reasonably available within a short period of time, he has not been positively identified by name. Therefore, his identity is not known to the police.", "The man would be considered as known and available, as he is known to the police, willing to participate in the identification procedure and will be accessible within a reasonably short time.", "The man would be considered as known and available, but as the eyewitness has given a detailed description of the alleged offender to the police, there is no requirement to carry out an identification procedure."], "a": "D", "bx": "The correct answer was D. This is because the correct term for a suspect who is known to the police and is willing and able to take part in an identity procedure is 'known and available'. Options A and B are wrong because a suspect is considered 'available' if they are immediately available or will be within a reasonably short time. Option C is wrong because the man is considered 'known' for these purposes. Option E is also wrong because there is a requirement to carry out an identity procedure in these circumstances."}, {"ch": 0, "n": 5, "sc": ["A man is arrested at his home on suspicion of burglary, contrary to s 9 Theft Act 1968. The man is taken to an authorised place of detention and is booked into custody at 19:00 (7 pm). The man requested legal advice and consulted a solicitor before being interviewed. At the 24-hour period, an extension of 12 hours was granted for further detention. There are six hours left until the man will need to be charged or released, but the officers in the case are pursuing a new line of enquiry and seek to detain the man further."], "st": "Which of the following best describes the most appropriate course of action to detain the man further?", "o": ["Authorisation for further detention can only be given by the magistrates' court, either with a single district judge or two lay magistrates, who may grant the police's request. The police will need to ensure that the application is listed and granted before the current 36-hour period expires.", "Authorisation for further detention can only be given by an officer of the rank of superintendent or above, who is responsible for the station where the man is being held. The police will need to ensure that the extension is granted before the current 36-hour period expires.", "Authorisation for further detention can only be given by the magistrates' court, either with a single district judge or two lay magistrates, who must grant the police's request. The police will need to ensure that the application is listed and granted before the current 36-hour period expires.", "Authorisation for further detention can only be given by an officer of the rank of superintendent or above, who is responsible for the station where the man is being held. The police will need to ensure that the extension is granted after the current 36-hour period expires.", "Authorisation for further detention can only be given by the magistrates' court, either with a single district judge or two lay magistrates, who may grant the police's request. The police will need to ensure that the application is listed before the expiry of the 36-hour period, but the magistrates' court may grant the extension after the expiry of the 36-hour period."], "a": "A", "bx": "The correct answer was A. This is because the police have exhausted their powers of granting an extension to the period of detention, and the magistrates' court are the only body able to grant a further extension. The application must be listed and heard before the 36 hours expire; therefore, option E is wrong. The magistrates' court cannot extend custody time limits after the period expires. As previously mentioned, the police have exhausted their extension powers; therefore, options B and D are wrong. Option C is also wrong because the courts are not compelled to grant an extension; they may grant an extension if they consider the relevant criteria are satisfied."}, {"ch": 0, "n": 6, "sc": ["A man is arrested for an indictable offence and asks for a solicitor. The police want to delay his access to legal advice."], "st": "Who may authorise the delay, and for how long at most?", "o": ["Any officer, for as long as needed.", "Only a magistrate.", "The custody officer, for up to 24 hours.", "An officer of at least the rank of superintendent, for up to 36 hours from the relevant time.", "An inspector, for up to 12 hours."], "a": "D", "x": ["Wrong. Strict limits apply.", "Wrong. Not a court matter.", "Wrong. The custody officer cannot authorise this.", "Correct. Section 58 PACE 1984 allows a superintendent to authorise a delay of up to 36 hours for an indictable offence, on specified grounds.", "Wrong. An inspector cannot authorise this."]}, {"ch": 0, "n": 7, "sc": ["A suspect is arrested and detained without charge."], "st": "When must the first review of his detention take place?", "o": ["Only if requested.", "Within 12 hours.", "Within 24 hours.", "Within one hour.", "Not later than six hours after detention was first authorised."], "a": "E", "x": ["Wrong. Reviews are mandatory.", "Wrong. Not the rule.", "Wrong. Not the first review.", "Wrong. Not the rule.", "Correct. Under s 40 PACE 1984, the first review must be no later than six hours after detention was authorised, and then every nine hours."]}, {"ch": 0, "n": 8, "sc": ["A suspect is interviewed under caution and later gives evidence at trial of a fact he failed to mention when questioned, which he could reasonably have been expected to mention."], "st": "Under which provision may the court draw an adverse inference?", "o": ["Section 76 PACE 1984.", "Section 35 CJPOA 1994.", "Section 34 Criminal Justice and Public Order Act 1994.", "Section 101 CJA 2003.", "Section 78 PACE 1984."], "a": "C", "x": ["Wrong. Section 76 concerns confessions.", "Wrong. Section 35 concerns silence at trial.", "Correct. Section 34 permits inferences from failure to mention facts later relied on.", "Wrong. Section 101 concerns bad character.", "Wrong. Section 78 concerns exclusion of evidence."]}, {"ch": 0, "n": 9, "sc": ["A suspect has been in detention for 24 hours from the relevant time. He is suspected of an indictable offence and the investigation is ongoing."], "st": "Who may authorise continued detention up to 36 hours?", "o": ["A magistrates' court only.", "The investigating officer.", "An inspector.", "An officer of the rank of superintendent or above.", "The custody officer."], "a": "D", "x": ["Wrong. The court is needed beyond 36 hours.", "Wrong. Not the investigating officer.", "Wrong. Not an inspector.", "Correct. Section 42 PACE 1984 permits a superintendent to authorise up to 36 hours.", "Wrong. Not the custody officer."]}, {"ch": 0, "n": 10, "sc": ["A suspect asks the defence solicitor whether to answer questions in interview. The evidence disclosed by the police is minimal."], "st": "Which is a legitimate reason for advising 'no comment'?", "o": ["Silence prevents any inferences being drawn.", "The suspect is guilty.", "The solicitor is in a hurry.", "The suspect wants to protect a friend.", "Inadequate police disclosure means the solicitor cannot properly advise."], "a": "E", "x": ["Wrong. Inferences may still be drawn.", "Wrong. Not a legitimate reason.", "Wrong. Not legitimate.", "Wrong. Not a proper reason.", "Correct. Limited disclosure is a recognised reason to advise silence, although inferences may still be possible."]}, {"ch": 1, "n": 1, "sc": ["A man is charged with inflicting grievous bodily harm, contrary to s 20 Offences Against the Person Act 1861. The man is arrested and brought before the magistrates' court the following day. The prosecution object to bail on the grounds that the man would interfere with prosecution witnesses if released on bail. The prosecution concede that, on the facts of the case, no other objection could apply."], "st": "Which of the following best describes the legal position of the case?", "o": ["The man has no right to make a bail application, as it is the first time the case has appeared before the magistrates' court.", "The man has a right to be granted bail unless the magistrates are persuaded that there are substantial grounds for believing that he would interfere with prosecution witnesses.", "The man has a right to be granted bail unless the magistrates are persuaded that there is a reasonable likelihood that he would interfere with prosecution witnesses.", "The man has a right to bail; the objection that the man would interfere with prosecution witnesses does not apply to the type of offence that the man is charged with.", "The man may only be granted bail if he persuades the magistrates that there is no reasonable prospect of him interfering with prosecution witnesses."], "a": "B", "bx": "The correct answer was B. The man does possess the right to bail, but the magistrates may refuse bail where there are substantial grounds for believing that the man would interfere with witnesses. The test is 'substantial grounds'; reference to 'reasonable likelihood' and 'reasonable prospect' is wrong (thus options C and E, respectively, are incorrect). Option A is incorrect because the man does have a right to bail; it being his first appearance is irrelevant. Option D is wrong because the offence charged is an indictable imprisonable offence for which interference with witnesses is a ground for objection."}, {"ch": 1, "n": 2, "sc": ["A woman is charged with theft, contrary to s 1 Theft Act 1968. The woman is to be tried in the magistrates' court and has been granted conditional bail. As part of her conditions, the woman must not enter the supermarket where she is alleged to have committed the offence. One day, the police are called to the supermarket and arrest the woman, found in the store. The woman claims that she had to enter the store to purchase goods for her young child that were unavailable at any other store in the local area."], "st": "Which of the following best describes the woman's situation?", "o": ["The woman is in breach of her bail conditions and may be charged with an offence of breach of bail conditions.", "The woman is in breach of her bail conditions and will be remanded into custody until her trial.", "The woman is not in breach of her bail conditions as there was a reasonable cause for her to enter the supermarket.", "The woman is in breach of her bail conditions and will be brought before the magistrates' court for bail to be reconsidered.", "The woman is not in breach of her bail conditions as it was necessary for her to enter the supermarket."], "a": "D", "bx": "The correct answer was D. The woman is in breach of her bail conditions as she has entered a supermarket that was excluded under her bail. The woman will be brought before the magistrates' court, which will determine whether the woman will be held in remand or released on bail. The magistrates may vary any bail conditions. Option A is wrong because there is no criminal offence of breaching bail conditions. Option B is wrong because the court is not obliged to remand the woman into custody; that is a matter for them to decide. Options C and E are wrong because the woman is in breach of bail and no defence of 'reasonable cause' or 'necessity' exists in respect of breach of bail conditions."}, {"ch": 1, "n": 3, "sc": ["A woman is charged with manslaughter. She has previously been convicted of manslaughter for which she was sentenced to three years' imprisonment. The defence solicitor makes an application for bail in respect of the current manslaughter proceedings."], "st": "Which of the following is the most accurate statement of bail in respect of the woman's case?", "o": ["The woman may only be granted bail if the court is of the opinion that there are exceptional circumstances justifying the granting of bail.", "The woman may only be granted bail if the court is of the opinion that there are no reasonable grounds for refusing the granting of bail.", "The woman has the right to bail as the presumption is only removed where the woman was sentenced to five years or longer in imprisonment.", "The woman has the right to bail as the presumption is only removed where the previous conviction is for murder or rape.", "The woman has no right to bail; as the woman is charged with manslaughter, she must be remanded in custody."], "a": "A", "bx": "The correct answer was A. The presumption in favour of bail is removed as the woman is charged with a homicide offence (manslaughter) and has a previous conviction for the same offence. In this case, the court need only grant bail where there are exceptional circumstances justifying it. Reference to 'reasonable grounds' is not a correct statement of law (thus option B is wrong). Option C is wrong as, whilst the law states that the presumption is removed where a manslaughter conviction results in a sentence of imprisonment, there is no period of time specified in law. Option D is wrong as the presumption is also reversed where the previous conviction is of manslaughter, but only where that conviction resulted in a sentence to imprisonment. Option E is wrong; whilst the presumption is reversed, the availability of bail is not completely removed."}, {"ch": 1, "n": 4, "sc": ["A woman is charged with assault occasioning actual bodily harm, contrary to s 47 Offences Against the Person Act 1861. The woman appears before the magistrates' court, where she pleads not guilty and, following an allocation hearing, the matter is listed for summary trial. The woman has made two fully argued applications for bail in the magistrates' court, both of which have been refused. There has been no change in her circumstances, and no new information that she can put before the court since her last application."], "st": "Which of the following is the most accurate advice that can be given to the woman?", "o": ["The woman should appeal against the refusal to grant bail to the Court of Appeal.", "The woman should make another application for bail in the magistrates' court.", "The woman has no further applications to make and must be held in remand until her circumstances change.", "The woman should appeal against the refusal to grant bail to the Crown Court.", "The woman should appeal against the refusal to grant bail to the High Court."], "a": "D", "bx": "The correct answer was D. Given that the woman has made two full applications, and there is no change in her circumstances, there can be no further application for bail in the magistrates' court (therefore option B is wrong). The only route available to the woman now is to apply to the Crown Court for bail; this will take the form of a full rehearing of the bail application. Options A and E are wrong because neither the Court of Appeal nor the High Court has jurisdiction in respect of bail in this circumstance. Option C is wrong as, although the woman has no further applications she can make in the magistrates' court, she can apply to the Crown Court."}, {"ch": 1, "n": 5, "sc": ["A man is charged with burglary, contrary to s 9 Theft Act 1968. The man is granted conditional bail by the magistrates' court. The magistrates impose the following conditions: that the man does not contact directly or indirectly any prosecution witness, that the man does not go within 100 metres of the burgled property and that the man provides a surety in the sum of £10,000."], "st": "Which of the following is the most accurate statement regarding any breach of the man's conditions?", "o": ["The man can be arrested without a warrant by a police officer if he has broken any of his bail conditions.", "The man can be arrested without a warrant by a police officer if the police officer has reasonable grounds to believe that he has broken any of his bail conditions.", "The man can be arrested without a warrant by a police officer if the police officer has substantial grounds for believing that he has broken any of his bail conditions or is likely to break any of his conditions.", "The man can be arrested without a warrant by a police officer if the police officer has substantial grounds for believing that he has broken any of his bail conditions.", "The man can be arrested without a warrant by a police officer if the police officer has reasonable grounds to believe that he has broken any of his bail conditions or is likely to break any of his conditions."], "a": "E", "bx": "The correct answer was E. Where a police officer has reasonable grounds to believe that the man has either broken any of his conditions or is likely to break any of his conditions, he may arrest the man without a warrant. Option A is wrong because the man need not actually break any of his conditions before he can be arrested; the focus is on the police officer's reasonable belief. Option B is wrong as it does not include the fact that the police officer may also arrest the man where he has reasonable grounds to believe that the man is likely to break any of his conditions. Options C and D are wrong as they use the wrong test: 'substantial grounds as opposed to 'reasonable grounds ."}, {"ch": 1, "n": 6, "sc": ["A defendant is charged with an either-way offence and the prosecution objects to bail. The court refuses bail."], "st": "What must the court do?", "o": ["Order a surety.", "Automatically grant bail at the next hearing.", "Give reasons for refusing bail and provide a copy of the record of the decision.", "Refer the case to the Crown Court.", "Nothing further."], "a": "C", "x": ["Wrong. Not relevant.", "Wrong. No automatic grant.", "Correct. Section 5 of the Bail Act 1976 requires reasons and a record.", "Wrong. Not required.", "Wrong. Reasons are required."]}, {"ch": 1, "n": 7, "sc": ["A defendant fails, without reasonable cause, to surrender to custody at court as required."], "st": "What is the consequence?", "o": ["He commits an offence under s 6 of the Bail Act 1976.", "He is automatically convicted of the original offence.", "Nothing, as breach of bail is not an offence.", "Only his bail conditions are varied.", "His surety is automatically imprisoned."], "a": "A", "x": ["Correct. Failure to surrender is an offence, unlike breach of conditions.", "Wrong. Not the effect.", "Wrong. Absconding is an offence.", "Wrong. An offence is committed.", "Wrong. A surety may forfeit money."]}, {"ch": 1, "n": 8, "sc": ["A court is concerned that a defendant may abscond."], "st": "Which bail condition is most appropriate to address that risk?", "o": ["No conditions.", "A curfew only to prevent offending.", "Attending a drug rehabilitation programme.", "A condition not to contact witnesses.", "Surrender of passport and a residence condition."], "a": "E", "x": ["Wrong. Conditions are appropriate.", "Wrong. Curfews can help but are less targeted here.", "Wrong. Not relevant.", "Wrong. This addresses interference with witnesses.", "Correct. Passport surrender and residence directly address the risk of absconding."]}, {"ch": 1, "n": 9, "sc": ["A defendant charged with an imprisonable offence has been refused bail, and remanded in custody before conviction."], "st": "Before conviction, for how long may a magistrates' court usually remand a defendant in custody at a time?", "o": ["Indefinitely.", "Up to eight clear days, or up to 28 days in certain circumstances.", "Up to 14 days.", "Up to six months.", "Up to 24 hours."], "a": "B", "x": ["Wrong. Not the rule.", "Correct. Section 128 MCA 1980 sets eight clear days, extendable to 28 days in certain cases.", "Wrong. Not the rule.", "Wrong. Not the rule.", "Wrong. Not the rule."]}, {"ch": 1, "n": 10, "sc": ["The prosecution wishes to challenge a magistrates' court decision to grant bail to a defendant charged with an imprisonable offence."], "st": "What may the prosecution do?", "o": ["Nothing.", "Ask the magistrates to reconsider the next day without notice.", "Appeal to the Court of Appeal.", "Apply to the High Court by case stated.", "Appeal to the Crown Court, giving oral notice at the end of the hearing and written notice within two hours."], "a": "E", "x": ["Wrong. An appeal is available.", "Wrong. Not the procedure.", "Wrong. Not the route.", "Wrong. Not the route.", "Correct. The Bail (Amendment) Act 1993 provides this right of appeal."]}, {"ch": 2, "n": 1, "sc": ["In 2025, a man is charged with domestic burglary, having stolen property from a house whilst the householders were away. The man indicates a not-guilty plea, and the magistrates proceed to an allocation hearing. At the allocation hearing, the prosecution provides evidence of the man's previous convictions. The man has two previous convictions for domestic burglary from 2018. The man was convicted of both 2018 burglaries on the same indictment."], "st": "Which of the following best describes the legal position of the case?", "o": ["The 2025 burglary is to be treated as an indictable only offence and must be sent to the Crown Court for trial.", "The 2025 burglary is to be treated as an either way offence, and the magistrates' court may retain jurisdiction to hear the case.", "The 2025 burglary is to be treated as a summary only offence, and the magistrates' court must hear the case.", "The 2025 burglary is to be treated as an either way offence and must be sent to the Crown Court for trial.", "The 2025 burglary is to be treated as an indictable only offence, and the magistrates' court may retain jurisdiction to hear the case."], "a": "B", "bx": "The correct answer was B. This is because the man does not have three separate convictions for domestic burglary. The three strikes rule only applies where the man has two separate convictions for domestic burglary, and a third charge of domestic burglary against him. Given that the three strikes rule does not apply (the 'commission, conviction' sequence has not been followed), the 2025 burglary remains an either way offence (therefore options A and E are incorrect), for which the magistrates may retain jurisdiction or send the man to the Crown Court. Option C is incorrect because burglary is generally an either way offence. Option D is wrong on the basis that where an offence is triable either way, the magistrates are not obliged to send the case to the Crown Court; they may retain the case."}, {"ch": 2, "n": 2, "sc": ["A woman has been charged with inflicting grievous bodily harm, contrary to s 20 Offences Against the Person Act 1861, and theft, contrary to s 1 Theft Act 1968. The woman is alleged to have pickpocketed a wallet from a man's trousers and then pushed another man out of the way in order to escape, causing the man to suffer a broken leg. The woman is a shop assistant, earning £16,000 per year. The woman has one previous conviction for theft ten years ago and lives alone. The woman's disposable income is around £800 once all bills have been paid."], "st": "Will the woman be entitled to publicly funded legal representation in connection with the defence of her case?", "o": ["Yes; the woman is likely to meet interests of justice test and has satisfied the initial means test.", "No; whilst the woman is likely to meet interests of justice test, she will not satisfy the initial means test.", "No; the woman is unlikely to meet the interests of justice test given that she has a previous conviction and lives alone.", "No; whilst the woman is likely to meet the interests of justice test, she will not satisfy the full means test.", "Yes; the woman is likely to meet the interests of justice test and has satisfied the full means test."], "a": "E", "bx": "The correct answer was E. This is because the woman is likely to lose her liberty given the nature of the offence charged. Given the dishonesty offence, the woman is also likely to lose her livelihood if convicted. As the woman earns over £12,475, she does not satisfy the initial means test (therefore option A is wrong). However, using the full means test, the woman's disposal income is less than £3,398 and thus she satisfies the full means test (therefore option D is wrong). Whilst option B is correct in some way, it fails to deal with the full means test; option B is therefore wrong. Option C is wrong as although her previous convictions will be relevant to the interests of justice test, they are only factors to be considered."}, {"ch": 2, "n": 3, "sc": ["A man is charged with theft from a supermarket, contrary to s 1 Theft Act 1968. It is alleged that the man stole fresh packaged meat to the value of £150. The man intends to plead not guilty."], "st": "Which of the following is the best description for the procedure that follows?", "o": ["The theft of the meat is treated as an either way offence and the magistrates' court will proceed with an allocation hearing to determine trial venue.", "The theft of the meat is treated as an indictable only offence and the Crown Court will hear the case, unless the man elects trial in the magistrates' court.", "The theft of the meat is treated as a summary only offence and the magistrates' court will hear the case, unless the man elects trial by jury.", "The theft of the meat is treated as an either way offence and the magistrates' court will likely retain jurisdiction given the low value involved.", "The theft of the meat is treated as a summary only offence and the magistrates' court will hear the case."], "a": "C", "bx": "The correct answer was C. This is because the man is charged with low-value shoplifting (ie theft of goods, offered for sale in a store, with a value of less than £200). Whilst theft is generally an either way offence, low-value shoplifting is treated as a summary only offence (therefore options A, B and D are wrong) and will be dealt with by the magistrates' court. However, the man retains the right to elect trial by jury (therefore option E is wrong)."}, {"ch": 2, "n": 4, "sc": ["A woman is charged with robbery. The woman makes her first appearance in the magistrates' court and has met with her defence solicitor."], "st": "What advice would the defence solicitor give the woman as to court procedure?", "o": ["The magistrates will ask the woman to enter her plea. If the woman pleads guilty, the magistrates will sentence the woman immediately, or commit her to the Crown Court for sentence. If the woman pleads not guilty, the magistrates will proceed to an allocation hearing.", "The magistrates will not ask the woman any questions relating to her plea and will immediately send the case to the Crown Court.", "The magistrates will ask the woman to enter her plea. If the woman pleads guilty, the magistrates will send the woman to the Crown Court for sentence. If the woman pleads not guilty, the magistrates will send the woman to the Crown Court for a case management hearing.", "The magistrates will ask the woman whether she intends to plead guilty. If the woman indicates a guilty plea, the magistrates will send the woman to the Crown Court for a plea to be formally taken. If the woman indicates a not-guilty plea, the magistrates will send the woman to the Crown Court for a case management hearing.", "The magistrates will ask the woman whether she intends to plead guilty. If the woman indicates a guilty plea, the magistrates will consider whether their sentencing powers are adequate or whether the woman should be committed to the Crown Court for sentence. If the woman pleads not guilty, the magistrates will proceed to an allocation hearing."], "a": "D", "bx": "The correct answer was D. This is because robbery is an indictable only offence and must be sent to the Crown Court (options A and E are therefore incorrect). At the first hearing, the woman will be required to indicate whether she intends to plead guilty; this is different from asking the woman to enter a plea. A plea will only be entered at the first hearing in the Crown Court (therefore option C is incorrect). Option B is wrong because whilst the magistrates will not ask the woman to enter a plea, they will ask her to indicate a plea (to allow them to dispose of the case in the most efficient way)."}, {"ch": 2, "n": 5, "sc": ["A man is charged with aggravated criminal damage. The man is alleged to have damaged a wall, causing it to collapse, endangering the neighbours in doing so. The man is a single parent, with three young children, all under the age of ten. The man was previously a successful banker, before his drug addiction caused him to lose all of his money. The man receives Universal Credit and has five previous convictions for dishonesty-related offences."], "st": "Will the man be entitled to publicly funded legal representation in connection with the defence of his case?", "o": ["Yes, the interests of justice test is automatically satisfied, and the man automatically passes the means test as he receives Universal Credit.", "Yes, the interests of justice test is likely to be satisfied as the man is likely to lose his liberty if convicted, and the man automatically passes the means test as he receives Universal Credit.", "No, the interests of justice test is unlikely to be satisfied given that the man is not employed, and thus is not likely to lose his livelihood, and the man has several previous convictions, meaning that he will not suffer serious damage to his reputation.", "No, the interests of justice test is unlikely to be satisfied given that the man will be able to understand proceedings and is to blame for his own financial situation.", "Yes, the interests of justice test is likely to be satisfied as the man has three young children for whom the man is the sole carer, and the man automatically passes the means test as he receives Universal Credit."], "a": "A", "bx": "The correct answer was A. This is because aggravated criminal damage is an indictable only offence, which automatically passes the interests of justice test, and is 'passported' through the means test as the man is in receipt of Universal Credit. Options B, C, D and E are incorrect as they all ignore the fact that the interests of justice test is automatically satisfied."}, {"ch": 2, "n": 6, "sc": ["A defendant charged with an indictable-only offence appears in the magistrates' court."], "st": "What will the court do?", "o": ["Send the case forthwith to the Crown Court under s 51 CDA 1998.", "Take a plea and try the case.", "Adjourn for a plea before venue.", "Ask the defendant to elect a venue.", "Hold an allocation hearing."], "a": "A", "x": ["Correct. Indictable-only offences are sent forthwith.", "Wrong. Magistrates cannot try indictable-only offences.", "Wrong. No PBV.", "Wrong. No election.", "Wrong. Allocation is for either-way offences."]}, {"ch": 2, "n": 7, "sc": ["A defendant charged with a summary-only offence pleads guilty at the first hearing."], "st": "What is the court likely to do?", "o": ["Send the case to the Crown Court for sentence in all cases.", "Sentence the defendant, or adjourn for reports.", "Order a trial.", "Hold an allocation hearing.", "Discharge the defendant automatically."], "a": "B", "x": ["Wrong. Summary-only offences are not committed for sentence in general.", "Correct. The court can proceed to sentence or adjourn for pre-sentence reports.", "Wrong. No trial on a guilty plea.", "Wrong. Not needed.", "Wrong. Not automatic."]}, {"ch": 2, "n": 8, "sc": ["A defendant applies for criminal legal aid for a case in the magistrates' court."], "st": "Which tests must generally be satisfied?", "o": ["The reasonable client test only.", "The interests of justice test and the means test.", "The merits test and the means test.", "The means test only.", "No tests."], "a": "B", "x": ["Wrong. Not the criminal test.", "Correct. Criminal legal aid requires both tests (with passporting for some benefits).", "Wrong. The merits test is civil.", "Wrong. The interests of justice test also applies.", "Wrong. Tests apply."]}, {"ch": 2, "n": 9, "sc": ["A defendant's interests of justice assessment is being made."], "st": "Which of the following is one of the Widgery criteria?", "o": ["The victim is vulnerable.", "The defendant is wealthy.", "It is likely that the defendant will lose their liberty.", "The case is in the Crown Court.", "The defendant is over 65."], "a": "C", "x": ["Wrong. Not a criterion.", "Wrong. That relates to means.", "Correct. Likely loss of liberty is a key interests of justice factor.", "Wrong. Crown Court cases pass automatically, but this is not a Widgery factor.", "Wrong. Not a criterion."]}, {"ch": 2, "n": 10, "sc": ["At the first hearing of an either-way case, the prosecution must serve certain material."], "st": "What must be served?", "o": ["The jury list.", "The full unused material schedule.", "The sentencing remarks.", "The defence statement.", "Initial details of the prosecution case (IDPC)."], "a": "E", "x": ["Wrong. Not relevant.", "Wrong. Unused material comes later.", "Wrong. Not relevant.", "Wrong. Served by the defence.", "Correct. Criminal Procedure Rules Part 8 requires IDPC."]}, {"ch": 3, "n": 1, "sc": ["A man is charged with theft, contrary to s 1 Theft Act 1968. The man indicates a not-guilty plea at the plea before venue (PBV) and the magistrates identify that the offence is suitable for summary trial. The man requests an indication of sentence which is provided by the magistrates. The indication does not identify a custodial sentence. The magistrates are now ready to ask the man whether he wishes to reconsider his indication of a not-guilty plea."], "st": "Which of the following best describes the legal position of the indication of sentence?", "o": ["The magistrates' court is bound by the indication of sentence, but the Crown Court is not bound by the indication of sentence if the magistrates commit the man for sentencing.", "The magistrates' court and the Crown Court are bound by the indication of sentence and cannot impose a custodial sentence.", "Neither the magistrates' court nor the Crown Court is bound by the indication of sentence but cannot impose a custodial sentence if it did not form part of the indication of sentence if the man changes his plea to guilty.", "Neither the magistrates' court nor the Crown Court is bound by the indication of sentence and can impose a custodial sentence.", "Neither the magistrates' court nor the Crown Court is bound by the indication of sentence but cannot impose a custodial sentence if it did not form part of the indication of sentence."], "a": "C", "bx": "The correct answer was C. This is because whilst the indication of sentence is not binding, any court cannot impose a custodial sentence unless that was indicated in the indication of sentence, and the man has subsequently changed his plea. Options A and B are wrong because no court is bound by the indication of sentence. Option D is technically correct but fails to consider the circumstance where a custodial sentence is not indicated (therefore is not the best answer). Option E is also technically correct but does not deal with the fact that this rule only applies where the man reconsiders his plea. If the man continues to plead not guilty, a custodial sentence can be imposed."}, {"ch": 3, "n": 2, "sc": ["A woman is charged with malicious wounding, contrary to s 20 Offences Against the Person Act 1861. The woman had been sent, on a previous occasion, to the Crown Court for trial in respect of malicious wounding with intent, contrary to s 18 Offences Against the Person Act 1861, for which she pleaded not guilty. The allegation by the prosecution is that both offences were committed within a few days of each other against the same complainant. The woman indicates a not-guilty plea for the s 20 offence."], "st": "Which of the following best describes the likely trial venue for the s 20 offence?", "o": ["The s 20 offence may be tried in either the magistrates' court or the Crown Court.", "The s 20 offence must be tried in the Crown Court, alongside the s 18 offence, as it is a related offence.", "The s 20 offence will be tried in the magistrates' court, as it is a summary only offence.", "The s 20 offence will likely be tried in the magistrates' court.", "The s 20 offence shall be tried in the Crown Court, as it is an indictable only offence."], "a": "A", "bx": "The correct answer was A. This is because, whilst the s 20 charge is seemingly related to the s 18 charge, the woman appeared before the magistrates at a subsequent hearing charged with s 20. As such, the magistrates have the discretion to send to the Crown Court without allocation; they are not obliged to do so (option B is therefore incorrect). Options C and E are wrong because s 20 is an either way offence. Whilst option D is a possibility, it is not the most accurate answer or advice that can be given. In fact, it is more likely for the charge to be sent to the Crown Court with the s 18 offence given the close factual connection (eg avoiding the need for two trials)."}, {"ch": 3, "n": 3, "sc": ["A man is charged with two either way offences. The man has indicated a not-guilty plea at the plea before venue (PBV) to both charges."], "st": "Which of the following most accurately describes the process in s 19 Crime and Disorder Act 1998?", "o": ["The prosecution will inform the court of the facts but is not permitted to present the man's previous convictions. The magistrates will then consider any representations by the man, but not the prosecution. The magistrates will also consider whether their sentencing powers are adequate, with reference to the aggregate sentence for the two offences and the allocation and committal for sentence guideline.", "The prosecution will inform the court of the facts, including the man's previous convictions. The magistrates will then consider any representations by the prosecution and the man. The magistrates will also consider whether their sentencing powers are adequate, with reference to the aggregate sentence for the two offences and the allocation and committal for sentence guideline.", "The prosecution will inform the court of the facts, including the man's previous convictions. No representations may be made by either the prosecution or defence. The magistrates will also consider whether their sentencing powers are adequate, focusing on the sentence for each offence and the allocation and committal for sentence guideline.", "The prosecution will inform the court of the facts but is not permitted to present the man's previous convictions. The magistrates will then consider any representations by the man, but not the prosecution. The magistrates will also consider whether their sentencing powers are adequate, focusing on the sentence for each offence and the allocation and committal for sentence guideline.", "The prosecution will inform the court of the facts, including the man's previous convictions. No representations may be made by either the prosecution or defence. The magistrates will also consider whether their sentencing powers are adequate, with reference to the aggregate sentence for the two offences and the allocation and committal for sentence guideline."], "a": "B", "bx": "The correct answer was B. This option lays out the full procedure set out in s 19 MCA 1980. The prosecution can present the man's previous convictions (as this will be relevant to the question of whether the magistrates' sentencing powers are adequate). Both parties may make appropriate representations and the magistrates will consider relevant sentencing guidelines and allocation and committal for sentence guideline. As the man is charged with more than one offence, the magistrates would consider the maximum aggregate sentence. All other options are therefore incorrect."}, {"ch": 3, "n": 4, "sc": ["A man is charged with criminal damage. The value of the property damaged is assessed at £4,000. The man indicates a plea of not guilty."], "st": "Which of the following best describes the process that will be followed?", "o": ["The man will be tried in the magistrates' court and, if convicted, can be committed to the Crown Court for sentence.", "The man will be tried in the Crown Court and, if convicted, will be subject to the sentencing powers only available to the magistrates' court.", "The man will be subject to an allocation hearing, which will determine whether he will be tried in the magistrates' court or the Crown Court.", "The man will be tried in the Crown Court and, if convicted, will be subject to the ordinary sentencing powers of the Crown Court.", "The man will be tried in the magistrates' court and, if convicted, cannot be committed to the Crown Court for sentence."], "a": "E", "bx": "The correct answer was E. This is because criminal damage of property valued less than £5,000 is a summary only offence, tried in the magistrates' court. The man has no right to elect trial by jury, and the magistrates have no power to commit the man for sentence (therefore option A is wrong). Options B and D are incorrect because low-value criminal damage is a summary only offence. Option C is incorrect as, whilst criminal damage is normally an either way offence, low-value criminal damage must be tried summarily."}, {"ch": 3, "n": 5, "sc": ["A woman is charged with burglary, contrary to s 9 Theft Act 1968. The woman indicates a plea of not guilty."], "st": "Which of the following is the most accurate description of the woman's choice in allocation proceedings?", "o": ["The woman never has a choice as to which court her case will be heard in.", "Where the magistrates accept summary jurisdiction, the woman has no choice as to which court her case will be heard in.", "Where the magistrates reject summary jurisdiction, the woman has a choice as to which court her case will be heard in.", "Where the magistrates accept summary jurisdiction, the woman has a choice as to which court her case will be heard in.", "The woman always has a choice as to which court her case will be heard in."], "a": "D", "bx": "The correct answer was D. This is because a defendant will only have the choice as to which venue their case will be heard in when the magistrates deem summary trial as being suitable (ie they accept summary jurisdiction). Where the magistrates reject summary jurisdiction, and send a defendant to the Crown Court, the defendant has no choice in this allocation. Options A, B, C and E are therefore incorrect as they do not correctly identify the procedure."}, {"ch": 3, "n": 6, "sc": ["A defendant charged with an either-way offence indicates a guilty plea at the plea before venue."], "st": "What happens next?", "o": ["The case is adjourned for trial.", "The case is sent for trial.", "The defendant is treated as pleading guilty and the magistrates either sentence or commit to the Crown Court for sentence.", "An allocation hearing takes place.", "The defendant may elect jury trial."], "a": "C", "x": ["Wrong. No trial.", "Wrong. No trial.", "Correct. On a guilty plea indication, there is a conviction and sentencing follows.", "Wrong. Allocation is only on a not-guilty indication.", "Wrong. No election."]}, {"ch": 3, "n": 7, "sc": ["At an allocation hearing, the magistrates decide that their sentencing powers are adequate."], "st": "What is the defendant's position?", "o": ["The defendant must be tried summarily.", "The defendant may consent to summary trial or elect trial in the Crown Court.", "The prosecution decides.", "The case must go to the Crown Court.", "The defendant must plead guilty."], "a": "B", "x": ["Wrong. The defendant may elect.", "Correct. Where summary trial is suitable, the defendant chooses.", "Wrong. No.", "Wrong. Not required.", "Wrong. No."]}, {"ch": 3, "n": 8, "sc": ["A defendant consents to summary trial for an either-way offence and is convicted."], "st": "Can the magistrates commit him to the Crown Court for sentence?", "o": ["Only if he agrees.", "No, never once summary trial is accepted.", "Only for summary offences.", "Yes, under s 14 of the Sentencing Act 2020, if they consider their powers inadequate.", "Only if he is under 18."], "a": "D", "x": ["Wrong. Consent is not required.", "Wrong. It is possible.", "Wrong. Not the rule.", "Correct. Committal for sentence after summary trial is available.", "Wrong. Not the rule."]}, {"ch": 3, "n": 9, "sc": ["A defendant is charged with an either-way offence and an associated summary offence."], "st": "What may happen if the either-way offence is sent to the Crown Court?", "o": ["The summary offence becomes indictable.", "The summary offence is dropped.", "Both must be tried in the Youth Court.", "The summary offence may also be sent if it is related and imprisonable or involves driving disqualification.", "The summary offence must be tried separately in the magistrates' court in all cases."], "a": "D", "x": ["Wrong. Its classification does not change.", "Wrong. Not dropped.", "Wrong. Not relevant.", "Correct. Section 51 CDA 1998 permits related summary offences to be sent in these circumstances.", "Wrong. Not always."]}, {"ch": 3, "n": 10, "sc": ["A defendant asks for an indication of sentence at allocation."], "st": "Who may request it, and is the court obliged to give it?", "o": ["Only the Crown Court may give it.", "The defendant may request it, and the court is not obliged to give it.", "The prosecution must request it.", "The court must always give it.", "It is binding."], "a": "B", "x": ["Wrong. Magistrates may give it.", "Correct. Under s 20 MCA 1980, an indication is discretionary.", "Wrong. The defendant asks.", "Wrong. Not obligatory.", "Wrong. Only a non-custodial indication binds, as to custody."]}, {"ch": 4, "n": 1, "sc": ["A man is charged with theft, contrary to s 1 Theft Act 1968. The man, who indicates a not-guilty plea, is subject to a plea before venue and consents to summary trial. At the preparation for trial hearing, the magistrates give a number of standard directions, including the requirement to ensure proper and full disclosure has taken place as required by law."], "st": "Which of the following best describes the obligation for disclosure by the man in the case in his defence?", "o": ["The man is required to disclose the details of any defence witness to be called other than himself and must give a defence statement within 14 days following disclosure by the prosecution.", "The man is required to disclose the details of any defence witness to be called other than himself and may give a defence statement. If the man chooses to give a defence statement, he must do so as soon as is reasonably practicable following disclosure by the prosecution.", "The man is required to disclose the details of any defence witness to be called other than himself and must give a defence statement within 28 days following disclosure by the prosecution.", "The man is required to disclose the details of any defence witness to be called other than himself and may give a defence statement. If the man chooses to give a defence statement, he must do so within 28 days following disclosure by the prosecution.", "The man is required to disclose the details of any defence witness to be called other than himself and may give a defence statement. If the man chooses to give a defence statement, he must do so within 14 days following disclosure by the prosecution."], "a": "E", "bx": "The correct answer was E. This is because the man is under an obligation to disclose the details of any witnesses he intends to call other than himself (including the name, address and date of birth of the witness). However, the man is under no obligation to give a defence statement in the magistrates' court. If the man does decide to give a witness statement, he must do so not more than 14 days following the initial disclosure of the prosecution. All other options are wrong as they either suggest that a defence statement is mandatory (options A and C) or stipulate the wrong time period (options B and D)."}, {"ch": 4, "n": 2, "sc": ["A woman is charged with assault occasioning actual bodily harm, contrary to s 47 Offences Against the Person Act 1861. At the plea before venue, the woman elects trial on indictment and is sent to the Crown Court. The prosecution complies with its initial duty of disclosure and the defence gives their defence statement in accordance with the time limit prescribed by law. The woman's defence is one of alibi, claiming that she was not involved in the incident. The prosecution is in possession of evidence from a witness who claims to have seen the offence being committed by the woman. The prosecution chooses not to rely on this evidence at trial, however, as the witness possesses a number of previous convictions and the prosecution cannot be sure that the evidence is reliable."], "st": "Which of the following best describes the prosecution's duty in respect of the unused evidence?", "o": ["The prosecution is obliged to disclose the information as they are under a duty to disclose material which might reasonably be considered capable of undermining the case for the defence.", "The prosecution is obliged to disclose the information as they are under a duty to disclose any material within their possession which is relevant to the proceedings.", "The prosecution is not obliged to disclose the information as they are under no duty to disclose material which might reasonably be considered capable of undermining the case for the defence.", "The prosecution is obliged to disclose the information as they are under a duty to disclose any material within their possession which is relevant to proceedings tried in the Crown Court.", "The prosecution is not obliged to disclose the information as the witness is considered as being unreliable and the prosecution must not mislead the court."], "a": "C", "bx": "The correct answer was C. This is because the prosecution's duty is to disclose any evidence which might reasonably be considered capable of undermining the case for the prosecution or of assisting the case for the defendant. The evidence in this case would potentially strengthen the prosecution's case due to the eyewitness testimony being offered. As such, given that the evidence is not detrimental to the prosecution, nor does it bolster the case for the defence, the evidence does not pass the disclosure test and need not be disclosed (option A is therefore wrong). Option B is incorrect because the prosecution should only disclose information which satisfies the disclosure test; the prosecution should not unnecessarily disclose any other information. Option D is incorrect for the same reason as option B and it makes no difference that the case is being tried in the Crown Court. Option E is incorrect as whilst the prosecution is not under a duty to disclose, the reliability of the witness is not the reason for their lack of obligation to disclose."}, {"ch": 4, "n": 3, "sc": ["A man is charged with murder and at his first appearance in the magistrates' court is sent forthwith to the Crown Court for trial. At the plea and trial preparation hearing (PTPH), the man enters a not-guilty plea, and the parties proceed with case management in preparation for the trial. Following the PTPH, and in line with their continuing duty of disclosure, the prosecution discloses the witness statement of an elderly woman who claims to have witnessed the murder. The woman initially refused to come forward with this information due to a fear for her own safety as she believes the man was aware of her presence at the scene when the alleged murder took place. The woman is fearful that the man will recognise her."], "st": "Which of the following best represents the process that should follow this disclosure?", "o": ["Following the PTPH, no further pre-trial case management hearings may be held. The next hearing that takes place will be the trial itself.", "Following the PTPH, the court may conduct a further pre-trial case management hearing on the basis that such a hearing is required to set ground rules for the conduct of the questioning of a witness or defendant.", "Following the PTPH, the court may conduct a further pre-trial case management hearing without any restrictions.", "Following the PTPH, the court may conduct a further pre-trial case management hearing on the basis that it is necessary to conduct such a hearing in order to give directions for an effective trial.", "Following the PTPH, the court must conduct a further pre-trial case management hearing given the new evidence that has come to light."], "a": "B", "bx": "The correct answer was B. This is because the court may conduct a further pre-trial hearing if it is either necessary to conduct such a hearing in order to give directions for an effective trial or the hearing is required to set ground rules for the conduct of the questioning of a witness or defendant. In this case, the witness is an elderly woman who has demonstrated fear towards the man (and for allegedly good reasons). This would suggest that the woman is potentially a vulnerable witness and as such a ground rules hearing should be held to determine how to manage the evidence of this witness. Option D, whilst correct in law, is not the single best answer, for the reasons provided above. Option A is generally correct, in that no further pre-trial hearings should be held following the PTPH; however, there are exceptions to this rule (as detailed above). Option C is incorrect because the court is only permitted to hold further pre-trial hearings in the two circumstances listed above. Option E is wrong because it is not sufficiently precise to be the best answer."}, {"ch": 4, "n": 4, "sc": ["A man is charged with robbery, contrary to s 8 Theft Act 1968. During trial, the prosecution withholds information which might have weakened the prosecution case. This action was taken because the prosecution considered that public interest immunity should attach to the relevant material. Neither the trial judge nor the defence were informed about this."], "st": "Which of the following best describes the conduct of the prosecution in this case?", "o": ["The prosecution was incorrect in its conduct. The prosecution was required to apply to the trial judge for a ruling that the evidence was protected by public interest immunity. There would be no obligation for the prosecution to inform the defence of this application.", "The prosecution was correct in its conduct. It is for the prosecution to determine whether evidence is protected by public interest immunity and neither the trial judge nor the defence is entitled to know about it.", "The prosecution was incorrect in its conduct. The prosecution was required to apply to the trial judge for a ruling that the evidence was protected by public interest immunity. There would also be an obligation for the prosecution to inform the defence of this application.", "The prosecution was incorrect in its conduct. Whilst there was no requirement to inform the judge of the withheld material, there was an obligation for the prosecution to inform the defence of the withheld material.", "The prosecution was correct in its conduct. It is for the prosecution to determine whether evidence is protected by public interest immunity and neither the trial judge nor the defence is entitled to know about it. Ideally, the prosecution would have recorded the withheld information on a schedule of sensitive material."], "a": "A", "bx": "The correct answer was A. This is because the prosecution must apply to the trial judge for a ruling that the evidence is subject to public interest immunity. This is not a decision that can be made by the prosecution alone (therefore options B and E are wrong). Given the potentially sensitive material involved, the defence should not ordinarily be informed as to the withheld material (thus options C and D are wrong)."}, {"ch": 4, "n": 5, "sc": ["A man is charged with inflicting malicious wounding, contrary to s 20 Offences Against the Person Act 1861, in the Crown Court. The prosecution's case is that the man became intoxicated and attacked the victim without provocation by hitting him over the head with a glass bottle, causing cuts to the head. The man accepts that he struck the victim with the bottle but claims that he did so in self-defence, having been threatened earlier in the evening by the victim. The attack was witnessed by a woman, who is due to give evidence at trial. The prosecution has reviewed its unused material and discovers that the man has a previous conviction for battery, committed whilst intoxicated. The prosecution also discovers that the victim has three previous convictions for violence. Finally, the prosecution has evidence from the woman, in the form of a second witness statement, which suggests that the victim was heard to threaten the man with a knife."], "st": "Which of the following best describes the new disclosure obligations of the prosecution?", "o": ["The prosecution must disclose the previous convictions of the victim and the second witness statement of the woman. The prosecution does not have to disclose the previous convictions of the man.", "The prosecution must disclose the previous convictions of the man, the previous convictions of the victim and the second witness statement of the woman.", "The prosecution must disclose the previous convictions of the victim. The prosecution does not have to disclose the previous convictions of the man or the second witness statement of the woman.", "The prosecution must disclose the previous convictions of the man and the second witness statement of the woman. The prosecution does not have to disclose the previous convictions of the victim.", "The prosecution is not obliged to disclose any of the unused material."], "a": "A", "bx": "The correct answer was A. This is because the prosecution is obliged to disclose any evidence which might reasonably be considered capable of undermining the case for the prosecution or of assisting the case for the defendant. The previous convictions for the victim could be capable of both undermining the prosecution's case and assisting the case for the defendant on the basis that it goes towards proving the man's story that he acted in self-defence. If the victim has a history of violence, the defence can argue that this history resulted in threatened violence to the man also. The previous convictions of the man would not undermine the prosecution's case, nor would it assist the defendant. Rather, those previous convictions would potentially assist the prosecution's case and, as such, would not satisfy the disclosure test. The second statement of the woman could potentially undermine the prosecution's case and assist the case of the defendant in that it goes towards proving the man's story that he acted in self-defence. For these reasons, all other options are incorrect."}, {"ch": 4, "n": 6, "sc": ["The prosecution serves initial disclosure in a Crown Court case."], "st": "Within what period must the defendant serve a defence statement?", "o": ["28 days.", "There is no time limit.", "7 days.", "14 days.", "56 days."], "a": "A", "x": ["Correct. In the Crown Court, a defence statement is compulsory within 28 days.", "Wrong. There is a limit.", "Wrong. Not correct.", "Wrong. Fourteen days applies to voluntary statements in the magistrates' court.", "Wrong. Not correct."]}, {"ch": 4, "n": 7, "sc": ["A defendant fails to serve a defence statement in the Crown Court."], "st": "What is the possible consequence?", "o": ["The court or jury may draw such inferences as appear proper.", "The defendant is convicted automatically.", "Nothing.", "The trial is adjourned indefinitely.", "The defendant loses legal aid."], "a": "A", "x": ["Correct. Section 11 CPIA 1996 allows inferences.", "Wrong. No automatic conviction.", "Wrong. There may be consequences.", "Wrong. Not the consequence.", "Wrong. Not the consequence."]}, {"ch": 4, "n": 8, "sc": ["The prosecution identifies unused material that might reasonably be considered capable of assisting the defence."], "st": "What must they do?", "o": ["Give it to the judge only.", "Disclose it only if requested.", "Retain it without disclosure.", "Destroy it.", "Disclose it to the defence, subject to public interest immunity."], "a": "E", "x": ["Wrong. PII applications go to the judge, but the default is disclosure.", "Wrong. It must be disclosed.", "Wrong. It must be disclosed.", "Wrong. Never.", "Correct. Section 3 CPIA 1996 requires disclosure of material meeting the test."]}, {"ch": 4, "n": 9, "sc": ["In the Crown Court, the first hearing after sending is usually listed."], "st": "What is this hearing called?", "o": ["The committal hearing.", "The ground rules hearing.", "The plea and trial preparation hearing (PTPH).", "The sentencing hearing.", "The allocation hearing."], "a": "C", "x": ["Wrong. Abolished for this purpose.", "Wrong. A ground rules hearing is a specific further hearing.", "Correct. The PTPH is the main case management hearing.", "Wrong. No.", "Wrong. Allocation occurs in the magistrates' court."]}, {"ch": 4, "n": 10, "sc": ["A judge in the Crown Court makes a ruling at a pre-trial hearing on the admissibility of evidence."], "st": "Is the ruling binding?", "o": ["It binds only the jury.", "Only if the defence agrees.", "Only for the prosecution.", "Yes, it is binding unless discharged or varied in the interests of justice.", "No, it is advisory only."], "a": "D", "x": ["Wrong. Not the point.", "Wrong. Not required.", "Wrong. Binding on both sides.", "Correct. Pre-trial rulings under s 40 CPIA 1996 are binding, subject to variation.", "Wrong. They are binding."]}, {"ch": 5, "n": 1, "sc": ["A man is being tried for murder. His defence is one of mistaken identity and argues that he was not at the scene of the alleged offence at the material time. The prosecution's only witness who can place the man at the scene of the alleged offence at the material time made a sworn statement to that effect, and was willing to attend court despite being somewhat scared initially. At the start of the trial, the prosecution discovers that this witness, after getting the trial dates confused due to inaccurate information given by the prosecution, is on a ten-day transatlantic voyage with poor, intermittent communication. The prosecution makes an application to admit the witness's statement as hearsay due to its importance."], "st": "Which of the following best describes the course of action the prosecution should take?", "o": ["The prosecution should make an application to admit the statement as hearsay on the grounds that the witness is outside the UK and it is not reasonably practicable to secure their attendance.", "The prosecution should make an application to admit the statement as hearsay on the grounds that it is in the interests of justice to do so.", "The prosecution should make an application to admit the statement as hearsay on the grounds that there is evidence that the witness was in fear of giving evidence.", "The prosecution should make an application to admit the statement as hearsay on the grounds that the witness cannot be contacted despite all efforts being made.", "The prosecution should make an application to admit the statement as hearsay on the grounds that the statement is a document made in relation to criminal proceedings and is thus capable of being admitted as hearsay."], "a": "B", "bx": "The correct answer was B. This is because out of the options available, an application made on the grounds that it would be in the interests of justice to admit the statement as hearsay is the most likely to succeed in the circumstances. Option A is wrong because, although the witness is outside the UK and transiting the Atlantic Ocean (not reasonably practical to secure their attendance), this was caused by poor prosecution information and it was not the fault of the witness. Option C is wrong because the witness was not in fear to the extent that they are not willing to attend court, nor is their fear the primary reason for the application. Option D is wrong because it is not a strong argument to make for admitting the evidence as hearsay. Whilst there are communication issues, these are temporary and the witness's location is known. Option E is wrong because whilst the evidence is capable of being admitted as hearsay, the option does not reflect one of the provisions which permit the evidence to be admitted as hearsay."}, {"ch": 5, "n": 2, "sc": ["A woman is charged with murder and her trial is due to start. The prosecution has complied with their duty of continuing disclosure and the defence has reviewed the evidence. Before the prosecution opens the case, the defence explains that they have some new evidence in respect of a prosecution witness's medical records. It was discovered that they were obtained unlawfully, but the defence argues that they are pivotal to the case. The prosecution objects and argues that allowing this evidence to be admitted would have an adverse effect on the proceedings, and that as it bears little relevance to the matters in issue, there is no probative value to the evidence."], "st": "Which of the following best describes the option open to the court for excluding the evidence?", "o": ["The court must exclude the evidence under the common law principle of relevance, as the prosecution contends that the medical records are of little relevance to the matters in issue.", "The court may exclude the evidence under s 78 PACE 1984 because it was obtained unlawfully and introducing it would have such an adverse effect on the fairness of the proceedings that it ought to be excluded.", "The court may exclude the evidence under s 78 PACE 1984 because the prosecution argues that the medical records bear little relevance to the matters in issue, and if it were adduced, it would have such an adverse effect on the fairness of the proceedings that it ought to be excluded.", "The court may exclude the evidence under the common law principle of relevance, as the prosecution contends that medical records are of little relevance to the matters in issue.", "The court must exclude the evidence under s 76 PACE 1984 because it was unfairly obtained and introducing it would have such an adverse effect on the fairness of the proceedings that it ought to be excluded."], "a": "D", "bx": "The correct answer was D. This is because the only way the prosecution can object to defence evidence being admitted is based on the principle of relevance. Option A is wrong because the power to exclude irrelevant evidence is at the discretion of the trial judge; there is nothing compelling the court to exclude. Option E is wrong as s 76 PACE 1984 only applies to confession evidence; this question deals with nonconfession evidence. Option B is also wrong because s 78 PACE 1984 only applies to evidence which the prosecution proposes to rely on, and, even if the defence evidence was obtained unlawfully, it may still be relied upon. Option C is wrong because the prosecut
