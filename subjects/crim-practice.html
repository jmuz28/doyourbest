ion cannot rely on s 78 PACE 1984 at all."}, {"ch": 5, "n": 3, "sc": ["A man is charged with unlawful act manslaughter. The man pleaded not guilty and is about to stand trial. The prosecution has disclosed the evidence which it intends to rely on, and included in this is a confession which was entirely inculpatory in a police interview. Despite this, the man pursued a not-guilty plea. In conference, the man tells his solicitor that he only made this confession because a police officer in the case said aggressively, 'It would be much better for you if you admitted that it was you. The judge will go easy on you if you do'. The trial is just about to start, and the solicitor informs defence counsel."], "st": "Which of the following best describes what will likely happen in light of the man's conversation with his solicitor?", "o": ["Defence counsel will advise the prosecutor that they intend to challenge the admissibility of the confession as it was obtained in consequence of something said or done that makes the confession unreliable. A voir dire will take place and the prosecution must satisfy the court, on the balance of probabilities, that the confession is admissible. If it fails to do so, the court may exclude the confession.", "Defence counsel will advise the prosecutor that they intend to challenge the admissibility of the confession as it was obtained in consequence of something said or done that makes the confession unreliable. A voir dire will take place and the prosecution must satisfy the court, on the balance of probabilities, that the confession is admissible. If it fails to do so, the court shall exclude the confession.", "Defence counsel will advise the prosecutor that they intend to challenge the admissibility of the confession as it was obtained through oppression. A voir dire will take place and the prosecution must satisfy the court, so that it is sure, that the confession is admissible. If it fails to do so, the court shall exclude the confession.", "Defence counsel will advise the prosecutor that they intend to challenge the admissibility of the confession as it was obtained in consequence of something said or done that makes the confession unreliable. A voir dire will take place and the prosecution must satisfy the court, so that it is sure, that the confession is admissible. If it fails to do so, the court shall exclude the confession.", "Defence counsel will advise the prosecutor that they intend to challenge the admissibility of the confession as it was obtained in consequence of something said or done that makes the confession unreliable. A voir dire will take place and the prosecution must satisfy the court, so that it is sure, that the confession is admissible. If it fails to do so, the court may exclude the confession."], "a": "D", "bx": "The correct answer was D. This is because the defence must inform the prosecution that they challenge the admissibility of a confession, and 'represent' to the prosecution that it was obtained unlawfully. A voir dire will then take place and the prosecution needs to satisfy the court beyond reasonable doubt, not on the balance of probabilities, that the confession is admissible. If the prosecution cannot do this, the court must exclude the confession. Options A and B are wrong because the standard of proof for the prosecution in a voir dire is not on the balance of probabilities. Option C is wrong because this confession was not obtained through oppression. Option E is wrong because the exclusion power under s 76 PACE 1994 is mandatory, not discretionary; the court must exclude the evidence."}, {"ch": 5, "n": 4, "sc": ["A woman is being tried in the Crown Court for assault occasioning actual bodily harm, contrary to s 47 Offences Against the Person Act 1861. It is alleged that the woman saw her ex-husband in the street, shouted him over and then punched him in the head several times, resulting in severe bruising and a broken nose. The woman told the police at interview that she was acting in self-defence and will be running the same defence at trial."], "st": "Which of the following best describes the approach to the issues surrounding the burdens and standards of proof?", "o": ["The defence bears the legal burden to raise and prove the issue of self-defence, and the prosecution bears the legal burden to prove that the woman committed the assault. The prosecution will discharge its legal burden if it satisfies the jury of the woman's guilt to the criminal standard, beyond reasonable doubt (or so that the jury is sure).", "The defence bears the evidential burden to raise the issue of selfdefence, and the prosecution bears the legal burden to prove that the woman committed the assault and disprove the issue of self-defence. The prosecution will discharge its legal burden if it satisfies the jury of the woman's guilt to the criminal standard, on balance of probabilities (or so that the jury is more sure than not).", "The defence bears the legal burden to raise the issue of self-defence, and the prosecution bears the evidential burden to prove that the woman committed the assault and disprove the issue of self-defence. The prosecution will discharge its burden if it satisfies the jury of the woman's guilt to the criminal standard, beyond reasonable doubt (or so that the jury is sure).", "The defence bears the evidential burden to raise the issue of self-defence, and the prosecution bears the legal burden to prove that the woman committed the assault and disprove the issue of self-defence. The prosecution will discharge its burden if it satisfies the jury of the woman's guilt to the civil standard, beyond reasonable doubt (or so that the jury is sure).", "The defence bears the evidential burden to raise the issue of selfdefence, and the prosecution bears the legal burden to prove that the woman committed the assault and disprove the issue of self-defence. The prosecution will discharge its burden if it satisfies the jury of the woman's guilt to the criminal standard, beyond reasonable doubt (or so that the jury is sure)."], "a": "E", "bx": "The correct answer was E. This is because the defence bears the evidential burden to make the issue of self-defence live. The prosecution then has the legal burden to prove that the woman committed the offence to the criminal standard (beyond reasonable doubt or so that the jury is sure), and disprove the issue of self-defence. Option A is wrong because the defence does not have a legal burden to satisfy the defence of self-defence. Option B is wrong because criminal standard of proof is not on the balance of probabilities. Option C is wrong because the burden placed on the defence in this instance is an evidential, not legal, burden, and the prosecution bears the legal burden to prove the woman's guilt; this is not an evidential burden. Option D is wrong because the prosecution must prove their case to the criminal standard beyond reasonable doubt or so that the jury is sure."}, {"ch": 5, "n": 5, "sc": ["A man is charged with causing grievous bodily harm with intent, contrary to s 18 Offences Against the Person Act 1861. The man has pleaded not guilty. During the course of disclosure, and before the trial in the Crown Court, the prosecution serves notice of their intention to rely on the man's bad character as evidence. The prosecution contends that his previous convictions for battery four years earlier demonstrate evidence of propensity to commit violent offences. The defence intends to object to the admission of this evidence."], "st": "Which of the following best describes the steps which the defence needs to take to object to the prosecution's notice?", "o": ["The defence must make an application to the court to determine the objection and serve the application on the court officer and the prosecution not more than 20 business days after being served with the prosecution notice.", "The defence should initially make an application to have the bad character evidence excluded, in the first instance, under s 78 PACE 1984; the court must exclude the evidence if admitting it would have an adverse effect on the fairness of the proceedings.", "The defence must make an application to the court to determine the objection and serve the application on the court officer and the prosecution not more than 14 business days a er being served with the prosecution notice.", "The defence must make an application to the court to determine the objection and serve the application on the court officer and the prosecution not more than ten business days a er being served with the prosecution notice.", "The defence should initially make an application to have the bad character evidence excluded under s 78 PACE 1984; the court may exclude the evidence if admitting it would have an adverse effect on the fairness of the proceedings."], "a": "D", "bx": "The correct answer was D. This is because this answer sets out what the defence needs to do first to object to the prosecution's notice, and includes the correct time period prescribed by law. Options A and C are wrong because they include incorrect timescales for responding to the prosecution's notice. Option B is wrong because, initially, the defence should object using the procedure specifically in place to deal with excluding bad character; s 78 PACE 1984 is an alternative option if s 101(3) CJA 2003 fails. Option E is also wrong for the same reason as option B and s 78 PACE 1984 exclusions are discretionary."}, {"ch": 5, "n": 6, "sc": ["A defendant claims his confession was obtained by oppression."], "st": "What must the prosecution prove for the confession to be admitted?", "o": ["That the defendant had a solicitor.", "On the balance of probabilities that it is true.", "Nothing; the defence must prove oppression.", "That it was recorded.", "Beyond reasonable doubt that it was not obtained by oppression or in consequence of anything likely to render it unreliable."], "a": "E", "x": ["Wrong. Not the test.", "Wrong. Truth is irrelevant.", "Wrong. The burden is on the prosecution.", "Wrong. Not the test.", "Correct. Section 76(2) PACE 1984 places this burden on the prosecution."]}, {"ch": 5, "n": 7, "sc": ["The prosecution wants to adduce a statement from a witness who has died."], "st": "Under which provision may the hearsay be admitted?", "o": ["Section 78 PACE 1984.", "Section 9 CJA 1967.", "Section 34 CJPOA 1994.", "Section 101 CJA 2003.", "Section 116 Criminal Justice Act 2003."], "a": "E", "x": ["Wrong. Section 78 concerns exclusion.", "Wrong. Section 9 concerns agreed statements.", "Wrong. Not relevant.", "Wrong. Section 101 concerns bad character.", "Correct. Section 116 covers unavailable witnesses, including those who have died."]}, {"ch": 5, "n": 8, "sc": ["The prosecution applies to adduce a defendant's previous convictions for the same type of offence."], "st": "Which gateway is most relevant?", "o": ["Section 101(1)(a): all parties agree.", "Section 100: non-defendant's bad character.", "Section 101(1)(d): relevant to an important matter in issue between the defendant and the prosecution.", "Section 101(1)(g): attack on another's character.", "Section 101(1)(b): adduced by the defendant."], "a": "C", "x": ["Wrong. No agreement is suggested.", "Wrong. Section 100 concerns non-defendants.", "Correct. Gateway (d) covers propensity to commit offences of the kind charged.", "Wrong. No attack is described.", "Wrong. Not adduced by the defendant."]}, {"ch": 5, "n": 9, "sc": ["A defendant asks the court to exclude identification evidence obtained in breach of Code D."], "st": "On what basis may the court exclude it?", "o": ["Only if the breach was deliberate.", "It cannot be excluded.", "Under s 78 PACE 1984, if admitting it would have such an adverse effect on the fairness of proceedings that it ought not to be admitted.", "Only on a jury's direction.", "It must always be excluded."], "a": "C", "x": ["Wrong. Not required.", "Wrong. It may be excluded.", "Correct. Section 78 gives the court a discretion to exclude.", "Wrong. The judge decides.", "Wrong. Exclusion is discretionary."]}, {"ch": 5, "n": 10, "sc": ["A jury hears disputed identification evidence that is the main evidence against the defendant."], "st": "What direction should the judge give?", "o": ["No direction.", "A good character direction only.", "A Galbraith direction.", "A Lucas direction.", "A Turnbull direction warning of the special need for caution."], "a": "E", "x": ["Wrong. A direction is needed.", "Wrong. Not adequate alone.", "Wrong. Galbraith concerns submissions of no case.", "Wrong. Lucas concerns lies.", "Correct. Turnbull directions apply to disputed identification."]}, {"ch": 6, "n": 1, "sc": ["A man is charged with murder in the Crown Court. The prosecution calls a woman who claims to have witnessed the man running away from the scene of the crime. The defence claims that the man has an alibi and was not in the vicinity of the crime at the time in question. During examination-in-chief, the prosecutor asks the woman, 'You saw the defendant running from the al ley way, thafs right, isn't it?'"], "st": "Which of the following best describes the legal position of the prosecutor's question?", "o": ["The evidence elicited from the prosecutor's question is admissible as the prosecution is entitled to ask non-leading questions during examinationin-chief.", "The evidence elicited from the prosecutor's question is inadmissible as the prosecution is not entitled to ask leading questions during examination-in chief. The prosecutor will be required to rephrase the question.", "The evidence elicited from the prosecutor's question is admissible as the prosecution is entitled to ask leading questions during examination-in chief where the evidence is not disputed.", "The evidence elicited from the prosecutor's question is admissible as the prosecution is entitled to ask leading questions during examination-in-chief.", "The evidence elicited from the prosecutor's question is inadmissible as the prosecution is not entitled to ask leading questions during examination-in-chief. The prosecutor will now not be entitled to ask a similar question."], "a": "B", "bx": "The correct answer was B. The prosecutor has asked a leading question, the suggested answer to which is disputed by the defence. The evidence is therefore inadmissible (options A, C and D are wrong) and the prosecutor will be required to rephrase the question (option E is therefore also wrong)."}, {"ch": 6, "n": 2, "sc": ["A woman is charged with wounding with intent, contrary to s 18 Offences Against the Person Act 1861. The allegation is that the woman threw a wine glass at a 16-year-old girl, causing serious cuts to the face. The prosecution wishes to call the woman's husband to testify that he witnessed the crime being committed. The husband refuses to do so."], "st": "Which of the following best describes the legal position of the husband?", "o": ["The husband is both a competent and compellable witness for the prosecution.", "The husband is not a competent or compellable witness for the prosecution due to the fact that he is married to the accused.", "The husband is a competent witness for the prosecution but is not compellable.", "The husband is a competent and compellable witness for the prosecution because the offence charged against the woman is a specified offence.", "The husband is not a competent witness for the prosecution due to the fact that he is a co-defendant."], "a": "C", "bx": "The correct answer was C. Whilst the husband is a competent witness for the prosecution (therefore options B and E are wrong), the husband is not compellable (option A is therefore wrong). An individual is only compellable where their spouse is charged with a specified offence. Whilst this is an offence of violence, it has not taken place against someone under the age of 16 (therefore option D is wrong)."}, {"ch": 6, "n": 3, "sc": ["A man is charged with theft, contrary to s 1 Theft Act 1968. The man elected trial in the Crown Court. The man is legally unrepresented and appears on his own behalf. The man does not intend to call any witnesses other than himself."], "st": "Which of the following most accurately describes the law relating to opening and closing speeches?", "o": ["The prosecution may make both an opening and closing speech. The defence may only make a closing speech.", "The prosecution may only make an opening speech. The defence may make both an opening and a closing speech.", "The prosecution may make both an opening and closing speech. The defence may also make both an opening and a closing speech.", "The prosecution may only make a closing speech. The defence may only make an opening speech.", "The prosecution may only make an opening speech. The defence may only make a closing speech."], "a": "E", "bx": "The correct answer was E. The permissibility of speeches is dependent on whether a defendant is legally represented or intends to call witnesses other than himself. In this case, the man is neither represented nor calling any other witness. As such, the prosecution is only permitted to make an opening speech, and the defence is only permitted to make a closing speech. All other options are therefore wrong."}, {"ch": 6, "n": 4, "sc": ["A man is charged in the magistrates' court with assault by beating. The man enters a plea of not guilty and is acquitted after summary trial."], "st": "How should the magistrates announce their decision?", "o": ["The magistrates have a duty to give sufficient reasons to explain their decision.", "The magistrates may give an explanation for their decision, but they are not required to do so.", "The magistrates are required to state their reasons in the form of a judgement to explain their decision.", "The magistrates are obliged to give adequate reasons to explain their decision under the Human Rights Act 1998.", "The magistrates are only required to provide reasons to explain their decision if the man requests it."], "a": "B", "bx": "The correct answer was B. As the man has been acquitted, the magistrates are under no obligation to provide an explanation for their decision; it is at their own discretion as to whether such explanation is provided. Magistrates only possess an obligation to provide reasons to explain their decision where they convict the defendant. All other options are therefore incorrect."}, {"ch": 6, "n": 5, "sc": ["A woman is charged with robbery, contrary to s 8 Theft Act 1968 in the Crown Court. During the trial, one of the jurors is discharged due to ill health, leaving only 11 jurors on the jury. The jury has now retired to consider its verdict. After three hours, the judge is considering giving the majority verdict direction to the jury."], "st": "Which of the following most accurately describes the law relating to majority verdicts?", "o": ["The judge can direct the jury that they can accept a verdict upon which at least ten of them are agreed.", "Because there are only 11 jurors, the judge cannot give a majority verdict direction at all.", "The judge can direct the jury that they can accept a verdict upon which at least eight of them are agreed.", "The judge must wait a minimum of four hours and ten minutes before giving a majority verdict decision.", "The judge can direct the jury that they can accept a verdict upon which at least nine of them are agreed."], "a": "A", "bx": "The correct answer was A. In a situation where only 11 jurors remain on a jury, a majority verdict can consist of no fewer than ten jurors (options C and E are therefore incorrect). Option B is incorrect because a majority verdict is available, so long as there are a minimum of ten jurors (if there are only nine jurors, the verdict must be unanimous). Option D is incorrect because a majority verdict may be offered after the jury have deliberated for at least two hours and ten minutes, not four hours and ten minutes."}, {"ch": 6, "n": 6, "sc": ["At the close of the prosecution case, the defence submits there is no case to answer."], "st": "Which test applies in the Crown Court?", "o": ["Whether the defendant will give evidence.", "R v Galbraith: whether there is evidence on which a properly directed jury could properly convict.", "Beyond reasonable doubt.", "Balance of probabilities.", "Whether the judge believes the defendant is guilty."], "a": "B", "x": ["Wrong. Irrelevant.", "Correct. Galbraith sets the test.", "Wrong. Not the test at this stage.", "Wrong. Not the test.", "Wrong. Not the test."]}, {"ch": 6, "n": 7, "sc": ["A defendant chooses not to give evidence at trial, without good cause."], "st": "What may the jury do?", "o": ["Ask the judge to order him to testify.", "Treat it as an admission of guilt.", "Convict automatically.", "Nothing.", "Draw such inferences as appear proper under s 35 CJPOA 1994."], "a": "E", "x": ["Wrong. Cannot be compelled.", "Wrong. Not an admission.", "Wrong. Not automatic.", "Wrong. Inferences may be drawn.", "Correct. Section 35 allows proper inferences."]}, {"ch": 6, "n": 8, "sc": ["A jury cannot reach a unanimous verdict after a reasonable time."], "st": "When may the judge accept a majority verdict?", "o": ["After 30 minutes.", "At any time.", "After at least two hours and ten minutes of deliberation, with a majority of at least 10–2 (or 10–1 or 9–1 with fewer jurors).", "Only with both parties' consent.", "Never."], "a": "C", "x": ["Wrong. Too short.", "Wrong. Not at any time.", "Correct. Section 17 of the Juries Act 1974 and the Criminal Practice Directions set this framework.", "Wrong. Consent is not required.", "Wrong. Majority verdicts are allowed."]}, {"ch": 6, "n": 9, "sc": ["A prosecution witness gives evidence-in-chief."], "st": "Which type of question is generally not permitted?", "o": ["Clarifying questions.", "Open questions.", "Questions about the events.", "Questions about the witness's identity.", "Leading questions on matters in dispute."], "a": "E", "x": ["Wrong. Proper.", "Wrong. Open questions are proper.", "Wrong. Proper.", "Wrong. Introductory questions are fine.", "Correct. Leading questions on disputed matters are generally not allowed in chief."]}, {"ch": 6, "n": 10, "sc": ["A vulnerable child witness is to give evidence in the Crown Court."], "st": "Which special measure may be available?", "o": ["Having the defendant removed from the trial.", "Giving evidence by live link.", "Giving evidence without oath in all cases.", "Being excused from cross-examination entirely.", "Giving evidence after the verdict."], "a": "B", "x": ["Wrong. No.", "Correct. Live link is a special measure under the Youth Justice and Criminal Evidence Act 1999.", "Wrong. Not a special measure in that form.", "Wrong. Not available.", "Wrong. No."]}, {"ch": 7, "n": 1, "sc": ["A woman was charged with murder but was convicted of unlawful act manslaughter having killed a man whom she suspected of killing her young daughter in a violent and frenzied attack. The woman sought counselling following her daughter's death and could not cope with the media attention and aftermath. She is a single mother who looks after a four-year-old son at home with no family support. This is her first conviction and she was previously of good character. The court now proceeds to sentence the woman following persuasive mitigation."], "st": "Which of the following best describes the likely sentence for the woman?", "o": ["As the woman was charged with murder and has been found guilty of a related homicide offence, the court must pass a mandatory life sentence.", "As the woman has been convicted of a serious offence, the court is likely to impose a custodial sentence. However, due to the woman's circumstances, the court may suspend the custodial sentence for a period not less than 14 days but not more than two years.", "As the woman has been convicted of a homicide offence, she will receive a mandatory life sentence, but the term of release may be reduced due to her personal circumstances.", "As the woman has been convicted of a serious offence, the court is likely to impose a custodial sentence. However, due to the woman's circumstances, the court must suspend the custodial sentence for a period not less than 14 days but not more than two years.", "As the woman was charged with murder and has been found guilty of a related homicide offence, the court may pass a mandatory life sentence."], "a": "B", "bx": "The correct answer was B. This is because the court may pass a suspended sentence, and it is not obliged to do so in any event; this is why option D is wrong. Options A and C are wrong because mandatory life sentences in this context only relate to a guilty plea or verdict to the charge of murder, not manslaughter, even though terms of release for those on life sentences can be altered. Whilst option E is accurate insofar as the maximum penalty for unlawful act manslaughter is a life sentence, it is not mandatory, and therefore it is incorrect."}, {"ch": 7, "n": 2, "sc": ["A man is charged with assault occasioning actual bodily harm, contrary to s 47 Offences Against the Person Act 1861. After co-operating with the police when the man was first arrested, he voluntarily confessed and took responsibility for his actions. At the first hearing at the magistrates' court, the man subsequently pleaded guilty. The magistrates adjourn for sentencing and the man asks his solicitor about whether he will get a reduced sentence for pleading guilty at the first hearing."], "st": "Which of the following best describes the advice which the solicitor should give to the man?", "o": ["As the man voluntarily pleaded guilty at the earliest opportunity, which was the first hearing in the magistrates' court, the court must take these factors into account. As such, it is likely that the man will receive the full one-quarter reduction in sentence.", "As the man voluntarily pleaded guilty and at the earliest opportunity, which was at the police station, the court must take these factors into account. As such, it is likely that the man will receive the full one-quarter reduction in sentence.", "As the man voluntarily pleaded guilty and at the earliest opportunity, which was the first hearing in the magistrates' court, the court must take these factors into account. As such, it is likely that the man will receive the full one-third reduction in sentence.", "As the man voluntarily pleaded guilty and at the earliest opportunity, which was at the police station, the court must take these factors into account. As such, it is likely that the man will receive the full one-third reduction in sentence.", "As the man voluntarily pleaded guilty and at the earliest opportunity, which was the first hearing in the magistrates' court, the court may take these factors into account. As such, it is likely that the man will receive the full one-third reduction in sentence."], "a": "C", "bx": "The correct answer was C. This is because the court must take the factors into account, and the full reduction available is that of one-third, not one-quarter; this is why options A and B are wrong. Option D is wrong because although the man admitted to committing the offence at the police station, and the fact that this may help him in mitigation, the earliest opportunity to plead guilty is at the first hearing; this is where the period for reductions in sentence for early guilty pleas starts. Option E is wrong because the courts must, not may, take the relevant factors into account."}, {"ch": 7, "n": 3, "sc": ["Having been convicted of burglary, contrary to s 9 Theft Act 1968, and an assault occasioning actual bodily harm, contrary to s 47 Offences Against the Person Act 1861, arising out of the same facts, a man is due to be sentenced. Before the hearing, the man asks his solicitor for advice on how the courts may approach his sentencing in light of the multiple offences."], "st": "Which of the following best describes the advice that should be given to the man?", "o": ["The courts are required to adhere to the totality principle and impose a sentence which is just and proportionate to the man's overall criminality, and then decide whether the sentences will run consecutively or concurrently.", "The courts are required to adhere to the totality principle and impose a sentence which is just and reasonable to the man's overall criminality, and then decide whether the sentences will run consecutively or concurrently.", "The courts are required to adhere to the totality principle and impose a sentence which is fair and just to the man's overall criminality, and then decide whether the sentences will run consecutively or concurrently.", "The courts are required to adhere to the totality principle and impose a sentence which is reasonable and proportionate to the man's overall criminality, and then decide whether the sentences will run consecutively or concurrently.", "The courts are required to adhere to the totality principle and impose a sentence which is in the interests of justice, commensurate with the man's overall criminality, and then decide whether the sentences will run consecutively or concurrently."], "a": "A", "bx": "The correct answer was A. This is because the courts are required to adhere to the totality principle, and the wording of this answer accurately reflects the test for a sentence (sentences must be just and proportionate and reflect overall criminality). For this reason, options, B, C and D are wrong. Option E is wrong because the principle of totality is unrelated to the interest of justice test."}, {"ch": 7, "n": 4, "sc": ["A woman was convicted of theft, contrary to s 1 Theft Act 1968, and has a 12-month prison sentence suspended, with an operational period of two years. During the operational period, the woman allegedly committed an assault occasioning actual bodily harm, contrary to s 47 Offences Against the Person Act 1861, which she denies. The trial for the s 47 charge is yet to take place. The woman seeks advice on her suspended sentence."], "st": "Which of the following best describes the advice the woman should be given?", "o": ["The s 47 charge constitutes an activation event, and the woman's suspended sentence will take effect immediately at the first hearing.", "The s 47 charge constitutes an activation event, and the woman's suspended sentence must take effect as soon as the trial concludes.", "The s 47 charge constitutes an activation event only if the woman is convicted or pleads guilty; if so, when being sentenced for that offence, the court may order that her suspended sentence takes effect immediately on its original terms, or altered terms, and pay a fine not exceeding £2,500.", "The s 47 charge constitutes an activation event only if the woman is convicted or pleads guilty; if so, when being sentenced for that offence, the court may order that her suspended sentence takes effect immediately, or pay a fine not exceeding £2,500.", "The s 47 charge constitutes an activation event only if the woman is convicted or pleads guilty; if so, when being sentenced for that offence, the court may order that her suspended sentence takes effect immediately on the original terms, or altered terms, or pay a fine not exceeding £2,500."], "a": "E", "bx": "The correct answer was E. This is because it best reflects the options available to the court regarding the suspended sentence if the woman is convicted of the s 47 charge, unlike option D. Options A and B are wrong because at this point, she has only been accused of committing the s 47 offence; it has not been proved. At this stage, therefore, it is not an activation event. Option C is wrong because the court need not activate the sentence and fine the woman. The option to fine is an alternative to activating the suspended sentence."}, {"ch": 7, "n": 5, "sc": ["A man is currently serving a community order with an unpaid work requirement of 250 hours. When sentencing initially, the magistrates took the view that the offence did not pass the custody threshold. One day, the man wilfully refused to turn up for his day of unpaid work, and his probation officer issued him with a warning. Several weeks later, there was a second failure to comply, and the man was taken before the magistrates' court, which imposed a fine. One month later, the man persistently and wilfully failed to comply, The man has now been brought before the magistrates and seeks advice from his solicitor on what the magistrates may do."], "st": "Which of the following best describes the advice which may be given to the man?", "o": ["As the custody threshold was not passed, the court cannot re-sentence the man to a period of custody for his failure to comply; they can only impose a fine not exceeding £2,500, or amend his current order.", "Even though the custody threshold was not passed initially, the court is empowered to re-sentence the man and impose a custodial sentence as a result of the man's wilful and persistent failure to comply. The court must impose a custodial sentence and revoke his community order.", "Even though the custody threshold was not passed initially, the court is empowered to re-sentence the man and impose a custodial sentence as a result of the man's wilful and persistent failure to comply. The court may impose a custodial sentence and, if so, they must revoke the community order.", "Even though the custody threshold was not passed initially, the court can send the man to the Crown Court to re-sentence the man and impose a custodial sentence. The magistrates' court does not have the power in this instance to impose a custodial sentence.", "Even though the custody threshold was not passed initially, the court is empowered to re-sentence the man and impose a custodial sentence as a result of the man's wilful and persistent failure to comply. The court may impose a custodial sentence and, if so, they must suspend the community order which would then resume on release from prison."], "a": "C", "bx": "The correct answer was C. This is because the courts are empowered to impose a custodial sentence for offenders who wilfully and persistently fail to comply with the terms of their community orders (hence why option A is wrong). If this occurs, the community order would be revoked. There is nothing to compel the court to impose a custodial sentence in these circumstances, however; this is why option B is wrong. Option D is wrong because the magistrates' courts do have the power to impose a custodial sentence in these circumstances if they imposed the initial community order. Option E is wrong because there is no power to reactivate the community order once the offender is released from custody having been re-sentenced."}, {"ch": 7, "n": 6, "sc": ["A defendant pleads guilty at the first stage of proceedings."], "st": "What is the maximum reduction usually given under the Sentencing Council guideline?", "o": ["One-quarter.", "None.", "One-tenth.", "One-half.", "One-third."], "a": "E", "x": ["Wrong. That applies after the first stage.", "Wrong. A reduction applies.", "Wrong. That applies on the day of trial.", "Wrong. Not available.", "Correct. A guilty plea at the first stage normally attracts a one-third reduction."]}, {"ch": 7, "n": 7, "sc": ["A court is considering imposing a community order."], "st": "What threshold must be passed?", "o": ["No threshold.", "The offence must be serious enough to warrant a community sentence.", "The offence must be summary only.", "The custody threshold.", "The defendant must consent."], "a": "B", "x": ["Wrong. There is a threshold.", "Correct. Section 204 of the Sentencing Act 2020 sets the community threshold.", "Wrong. Not required.", "Wrong. That is for custody.", "Wrong. Consent is not generally required."]}, {"ch": 7, "n": 8, "sc": ["A court finds that an offence was committed against a victim because of their race."], "st": "How must the court treat this?", "o": ["As a mitigating factor.", "As a statutory aggravating factor and state so in open court.", "Only if the victim requests.", "As irrelevant to sentence.", "As a ground to adjourn."], "a": "B", "x": ["Wrong. It aggravates.", "Correct. Section 66 of the Sentencing Act 2020 requires this.", "Wrong. Not required.", "Wrong. It is relevant.", "Wrong. Not required."]}, {"ch": 7, "n": 9, "sc": ["A defendant disputes the prosecution's version of facts after a guilty plea, and the difference would affect sentence."], "st": "What hearing may be required?", "o": ["An allocation hearing.", "A Goodyear hearing.", "A PTPH.", "A ground rules hearing.", "A Newton hearing."], "a": "E", "x": ["Wrong. Not relevant.", "Wrong. Goodyear concerns sentence indications in the Crown Court.", "Wrong. Not relevant.", "Wrong. Not relevant.", "Correct. A Newton hearing resolves factual disputes affecting sentence."]}, {"ch": 7, "n": 10, "sc": ["A defendant asks the Crown Court judge for an indication of the maximum sentence if he pleads guilty now."], "st": "What is this called?", "o": ["A Newton hearing.", "A s 20 MCA indication.", "A Goodyear indication.", "A Turnbull direction.", "A Galbraith submission."], "a": "C", "x": ["Wrong. Not this.", "Wrong. That is in the magistrates' court.", "Correct. R v Goodyear permits a defendant-initiated indication in the Crown Court.", "Wrong. Not relevant.", "Wrong. Not relevant."]}, {"ch": 8, "n": 1, "sc": ["A man is convicted of assault occasioning actual bodily harm, contrary to s 47 Offences Against the Person Act 1861, following trial in the magistrates' court. The man is sentenced to a three-month term of imprisonment. The man accepts his conviction but wishes to appeal against his sentence."], "st": "Which of the following best summarises the position regarding the appeal against sentence?", "o": ["The man may appeal against sentence to the High Court, which will take the form of a complete rehearing. The High Court may confirm, reverse or vary the sentence imposed on the man, including increasing the sentence up to the maximum term of imprisonment available to the Crown Court for that offence.", "The man may appeal against sentence to the Crown Court, which will take the form of a complete rehearing. The Crown Court may confirm, reverse or vary the sentence imposed on the man, including increasing the sentence up to the maximum term of imprisonment available to the magistrates' court for that offence.", "The man may appeal against sentence to the High Court, which will take the form of a complete rehearing. The High Court may confirm, reverse or vary the sentence imposed on the man, including increasing the sentence up to the maximum term of imprisonment available to the magistrates' court for that offence.", "The man may appeal against sentence to the Crown Court, which will take the form of a complete rehearing. The Crown Court may confirm, reverse or vary the sentence imposed on the man, including increasing the sentence up to the maximum term of imprisonment available to the Crown Court for that offence.", "The man may appeal against sentence to the Crown Court, which will take the form of a complete rehearing. The Crown Court may confirm, reverse or vary the sentence imposed on the man, but this does not include increasing the sentence up to the maximum term of imprisonment available to the magistrates' court for that offence."], "a": "B", "bx": "The correct answer was B. This is because the appeal would be held in the Crown Court, which does have the ability to impose any sentence that would have been available to the magistrates' court (even if that means the sentence is increased). Options A and C are incorrect because any appeal against sentence would be heard in the Crown Court; appeals to the High Court are reserved for points of law. Option D is incorrect because the Crown Court cannot impose a sentence that would not otherwise be available to the magistrates' court. Option E is incorrect because the Crown Court can increase the sentence imposed, so long as it is a sentence that would have been available to the magistrates' court."}, {"ch": 8, "n": 2, "sc": ["A man is convicted of battery, following summary trial. The man disputes the verdict but does not identify any error in law on the part of the magistrates."], "st": "Which of the following is the best advice that can be given to the man regarding any appeal?", "o": ["The man may appeal against his conviction to the Crown Court without leave being required.", "The man may appeal against his conviction to the High Court without leave being required.", "If the man chooses to appeal to the High Court, he cannot challenge his conviction, he can only challenge his sentence.", "If the man chooses to appeal to the Crown Court, he cannot challenge his conviction, he can only challenge his sentence.", "The man may appeal against his conviction to the Crown Court but must identify a point of law or evidence which was incorrectly decided during his summary trial."], "a": "A", "bx": "The correct answer was A. This is because the man has an automatic right to appeal against his conviction to the Crown Court without the need for leave (thus option E is wrong), which will take the form of a complete rehearing. Option B is wrong because leave is required in the High Court and would not be the correct choice of court if the man wishes to appeal against his conviction and not on a point of law. Option C is equally incorrect because whilst the man could challenge his conviction, the High Court is reserved for points of law and not fact. Option D is wrong because the man can appeal against his conviction in the Crown Court."}, {"ch": 8, "n": 3, "sc": ["A man has been convicted of robbery, contrary to s 8 Theft Act 1968 in the Crown Court. The trial judge adjourns for pre-sentencing reports, and the sentencing hearing takes place one week later. The man is remanded into custody until then. The man wishes to appeal against his conviction, and leave has not been granted."], "st": "Which of the following best describes the most appropriate advice to give the man?", "o": ["The man, through his advocate, should make a renewed application to the trial judge at the sentencing hearing. If this is refused, he should apply for leave to appeal from the Court of Appeal, and should serve notice not more than 28 days from the date of sentencing.", "The man should make an application for leave to appeal from the Court of Appeal not more than 28 days from the date of sentencing, as the proceedings have not been concluded.", "The man should make a written application for leave to appeal to the Court of Appeal not more than 28 days after the date of his conviction, outlining the grounds of appeal. The application will be considered by a single judge on the papers.", "The man should make a written application for leave to appeal to the Court of Appeal not more than 28 days after the date of his sentencing hearing, outlining the grounds of appeal. The application will be considered by a single judge on the papers.", "The man should make a written application for leave to appeal to the trial judge not more than 28 days after the date of his conviction, outlining the grounds of appeal. The application will be considered by the trial judge on the papers."], "a": "C", "bx": "The correct answer was C. This is because the trial judge has refused leave to appeal, and he wishes to appeal against his conviction. The 28-day time limit for an appeal against conviction starts from the date of conviction. Option A is incorrect because once leave has been refused by the trial judge, an application is not renewed to the trial judge. Options B and D are wrong because the man is appealing against his conviction and not his sentence; therefore, the time starts to count down from the date of conviction. Option E is wrong because a written application is not made to the trial judge: it is made to the Court of Appeal."}, {"ch": 8, "n": 4, "sc": ["A woman was charged with, and convicted of, murder in the Crown Court 15 years ago and is currently serving her custodial sentence. It has recently come to light that during the trial, the prosecution relied on evidence which is now known to be false. In addition, some crucially important fresh evidence has surfaced and there is a great deal of public attention on this case. The woman makes an application for leave to appeal out of time, and leave is granted. The Court of Appeal is now considering the outcome of the appeal."], "st": "Which of the following best describes the likely outcome of the appeal?", "o": ["The Court of Appeal shall allow the appeal and order a retrial as, in the circumstances, it would likely be considered in the interests of justice to do so. The Court would quash the murder conviction and draft a new preferred indictment.", "The Court of Appeal must allow part of the appeal on the ground of a misdirection but must dismiss the ground relating to fresh evidence as fresh evidence is generally inadmissible. The woman's sentence may be altered as a result.", "The Court of Appeal must allow the appeal and order a retrial as, in the circumstances, it would likely be considered in the interests of justice to do so. The Court would quash the murder conviction and draft a new preferred indictment.", "The Court of Appeal must allow the appeal and quash the conviction as it is unsafe. The woman's sentence would also be quashed, but a retrial would not be ordered as she has already served a large proportion of her sentence.", "The Court of Appeal may allow part of the appeal on the ground of a misdirection, but dismiss the ground relating to fresh evidence due to the restrictions surrounding the introduction of fresh evidence. The woman's sentence may be altered as a result."], "a": "A", "bx": "The correct answer was A. This is because this answer best reflects the wording of the relevant legislation ('the Court of Appeal shall allow ...') and, due to the fact that the new evidence is deemed 'crucial' and there is a great deal of public attention, a retrial is likely to be ordered in the interests of justice. Options B and C are wrong because there is no requirement that the court must allow an appeal and, whilst the rules on allowing fresh evidence are strict, it would likely be allowed in these circumstances. Option D is wrong, because although the woman has served a large proportion of her sentence, this is only one of the factors taken into consideration when ordering a retrial. Option E is wrong because whilst the Court of Appeal may allow part of an appeal, the evidential issues may be best explored by means of a retrial."}, {"ch": 8, "n": 5, "sc": ["A man wishes to appeal against his conviction for manslaughter. He has applied for leave to appeal from the Court of Appeal on two grounds. A single judge, on the papers, has granted leave to appeal on the first ground, but has dismissed the second."], "st": "Which of the following best describes what the man should do?", "o": ["The man may renew his application for leave to appeal on the second ground before the Court of Appeal at his appeal hearing. The Court of Appeal should grant leave following a renewed application.", "The man can argue the second ground regardless, as leave to appeal has been granted for the first ground. The man does not need to do anything.", "The man may renew his application for leave to appeal on the second ground before the Court of Appeal at his appeal hearing. The Court of Appeal may grant leave following a renewed application.", "The man cannot take any further action; the single judge has refused leave to appeal on the second ground and this is a final decision that cannot be challenged further due to the single right of appeal principle.", "The man may renew his application for leave to appeal on the second ground before the Court of Appeal at his appeal hearing. The Court of Appeal must grant leave following a renewed application."], "a": "C", "bx": "The correct answer was C. This is because the man may, if he wishes, reapply for leave to appeal on the grounds which were dismissed by the single judge. The man must have leave to appeal if he wanted to argue the second ground (thus why option B is wrong). Options E and A are wrong because the Court of Appeal is not obliged to grant leave to appeal on a renewed application. Option D is wrong because the single right to appeal principle applies once an appeal has been determined; it does not apply to renewing applications for leave to appeal on grounds which have been dismissed by a single judge on the papers."}, {"ch": 8, "n": 6, "sc": ["A defendant convicted in the Crown Court wishes to appeal against sentence."], "st": "Within what period must notice be given?", "o": ["No time limit.", "Within six months.", "Within 28 days of sentence.", "Within 14 days.", "Within 21 days of conviction."], "a": "C", "x": ["Wrong. There is a limit.", "Wrong. Not correct.", "Correct. Appeals against sentence must be lodged within 28 days of sentence.", "Wrong. Not correct.", "Wrong. Not correct."]}, {"ch": 8, "n": 7, "sc": ["The Attorney General considers a Crown Court sentence unduly lenient."], "st": "What can be done?", "o": ["Nothing.", "Appeal by case stated.", "Ask the trial judge to increase it after 6 months.", "Appeal to the Crown Court.", "Refer the sentence to the Court of Appeal, within 28 days of sentence."], "a": "E", "x": ["Wrong. A referral is available.", "Wrong. Not the route.", "Wrong. Not the procedure.", "Wrong. Not the route.", "Correct. The unduly lenient sentence scheme under s 36 CJA 1988 applies."]}, {"ch": 8, "n": 8, "sc": ["Either party wishes to challenge a magistrates' court decision on a point of law."], "st": "Which route is available?", "o": ["Appeal to the Court of Appeal.", "No route.", "Rehearing in the magistrates' court.", "Appeal by way of case stated to the High Court.", "Appeal to the Supreme Court directly."], "a": "D", "x": ["Wrong. Not direct.", "Wrong. A route exists.", "Wrong. Not the route.", "Correct. Section 111 MCA 1980 provides for case stated.", "Wrong. Not direct."]}, {"ch": 8, "n": 9, "sc": ["The Court of Appeal considers an appeal against conviction."], "st": "What is the sole ground on which it must allow the appeal?", "o": ["That the jury was wrong.", "That the judge was unfair.", "That new evidence exists.", "That the sentence was excessive.", "That the conviction is unsafe."], "a": "E", "x": ["Wrong. Not the test.", "Wrong. Only if it makes the conviction unsafe.", "Wrong. Only if it makes the conviction unsafe.", "Wrong. That is a sentence appeal.", "Correct. Section 2 of the Criminal Appeal Act 1968 requires the conviction to be unsafe."]}, {"ch": 8, "n": 10, "sc": ["A defendant who has exhausted his appeals believes there has been a miscarriage of justice."], "st": "Which body can refer the case back to the Court of Appeal?", "o": ["The Solicitors Regulation Authority.", "The Home Secretary.", "The Legal Aid Agency.", "The Criminal Cases Review Commission.", "The Crown Prosecution Service."], "a": "D", "x": ["Wrong. Not this body.", "Wrong. No longer this role.", "Wrong. Not this body.", "Correct. The CCRC can refer cases where there is a real possibility the conviction would not be upheld.", "Wrong. Not this body."]}, {"ch": 9, "n": 1, "sc": ["A female (aged 17) is charged with theft, contrary to s 1 Theft Act 1968. The female is jointly charged with a male (aged 22). The pair plead not guilty to the offence at their first appearance in the magistrates' court. The male consents to summary trial."], "st": "Which of the following statements best describes the trial venue of the female?", "o": ["The female is an adult and must therefore be tried in the magistrates' court alongside the male.", "The female is a youth and must therefore be tried in the Youth Court.", "The female is a youth but is jointly charged with an adult, and therefore must be tried in the magistrates' court alongside the male.", "The female is an adult and as she is charged with an either way offence, may be tried in the magistrates' court or the Crown Court.", "The female is a youth but is jointly charged with an adult, and therefore the magistrates' court has discretion to retain the case or remit it to the Youth Court."], "a": "C", "bx": "The correct answer was C. This is because where an adult co-accused (the male) pleads not guilty and consents to summary trial, if the youth also pleads not guilty, they must be tried in the adult magistrates' court with their co-accused. Options A and D are wrong as the female is a youth since she has not yet attained 18 years of age. Option B is wrong as although the female would generally be tried in the Youth Court, she must be tried with an adult co-defendant in the magistrates' court. Option E is incorrect because the magistrates' court has no such discretion in this situation."}, {"ch": 9, "n": 2, "sc": ["A girl (aged 16) appears before the Youth Court charged with inflicting grievous bodily harm contrary to s 20 Offences Against the Person Act 1861. The defence has been served with initial details of the prosecution case and the girl intends to plead not guilty. The girl has never been in trouble with the police before and the magistrates do not consider her to be a dangerous offender."], "st": "Which of the following is the most likely procedure that the magistrates will adopt to decide the venue for the girl's trial?", "o": ["The magistrates must conduct a plea before venue procedure before deciding whether they should try the girl.", "The girl should be sent forthwith to the Crown Court for trial, without an indication of plea.", "The girl's plea should be taken, and the matter adjourned for trial in the Youth Court.", "The girl should be asked in which court, if the matter were to go to trial, she would wish to be tried.", "The girl's plea should be taken, and the matter adjourned for trial in the adult magistrates' court."], "a": "C", "bx": "The correct answer was C. This is because there is a general rule that all offences allegedly committed by a youth must be tried summarily in the Youth Court. There are no exceptions to that general rule present in this case (such as a homicide offence). Option A is wrong as a plea before venue would only be required if the girl was charged with a grave crime or jointly charged with an adult. Option B is wrong because none of the circumstances in which a youth can be sent forthwith to the Crown Court for trial apply. Option D is wrong because a youth never has the right to choose where their trial is to take place. Option E is wrong because the girl is not an adult, and she should be tried in the Youth Court unless she is sent to the Crown Court. A youth will only be tried in the magistrates' court if jointly charged with an adult who is to be summarily tried."}, {"ch": 9, "n": 3, "sc": ["A boy (aged 14) appears in the Youth Court charged with burglary, contrary to s 9 Theft Act 1968. The boy has eight previous findings of guilt in the past six months. Based on the sentencing guidelines, the prosecution and defence agree in their assessment that if the boy receives a sentence of detention after trial, it is likely to be no more than four months. The boy intends to plead guilty."], "st": "Which of the following most accurately describes the likely outcome?", "o": ["The Youth Court will impose a Detention and Training Order on the boy for a period of four months.", "The Youth Court could impose a Detention and Training Order on the boy, but only if they deem him to be a persistent offender.", "The Youth Court cannot impose a Detention and Training Order on the boy as he is too young for such an order to be made.", "The Youth Court could impose a Detention and Training Order on the boy, but this is unlikely due to the sentencing assessment made by the prosecution and defence.", "The Youth Court will impose a Detention and Training Order on the boy, which may be for any period of time up to 24 months."], "a": "D", "bx": "The correct answer was D. This is because a DTO is capable of being imposed. Based on the assessment of the prosecution and defence, the boy faces a four-month DTO if convicted after trial. If the boy pleads guilty, he will receive a discount which will take the sentence below the minimum four-month period for which a DTO can be imposed. Option A is incorrect because it supposes that the court will definitely impose a DTO and ignores the guilty plea. Option B is not the 'most likely' outcome: although this answer is factually correct (the boy will likely be classed as a persistent offender), it does not best address the issue of whether the boy will be awarded a DTO. Option C is incorrect as a DTO can be imposed on a 14-year-old child, so long as they are deemed to be a persistent offender. Option E, which is technically correct, is not the best answer as it fails to consider the guilty plea of the boy."}, {"ch": 9, "n": 4, "sc": ["A girl (aged 16) is charged with criminal damage in the Youth Court. The girl is alleged to have inflicted a large number of scratches on the car belonging to one of her schoolteachers, causing extensive exterior damage. The girl intends to plead guilty to the offence and the court has identified that it is not proposing to impose a custodial sentence or make a discharge. The girl has previous convictions but has never had a referral order made against her."], "st": "Which of the following best describes the legal position regarding a referral order?", "o": ["The Youth Court must impose a referral order on the girl as she has pleaded guilty to an imprisonable offence and the court is not proposing to impose a custodial sentence or make a discharge.", "The Youth Court must impose a referral order on the girl as she has previous convictions but has never had a referral order made against her. As the girl has not already had a referral order imposed, it is mandatory for the court to impose one now.", "The Youth Court may impose a referral order on the girl but only where the Youth Offending Team recommends the referral order, and the court finds exceptional circumstances to justify this course of action.", "The Youth Court cannot impose a referral order on the girl as such orders could only be made if the girl did not have any previous convictions.", "The Youth Court may impose a referral order on the girl as she has previous convictions but has never had a referral order made against her. As the girl has not already had a referral order imposed, it is at the discretion of the court whether to impose one now."], "a": "E", "bx": "The correct answer was E. This is because a referral order is available to the Youth Court at its discretion in circumstances where the youth has previous convictions but has never had a referral order made against them. Given that the girl has a previous conviction, a referral order is not mandatory (therefore options A and B are wrong). Option C is incorrect because the 'exceptional circumstances' test is only applicable where the youth has had a referral order made against them already. Option D is wrong as referral orders can be made in this circumstance, though such orders are not mandatory."}, {"ch": 9, "n": 5, "sc": ["A boy (aged 17 and with learning difficulties) is charged with robbery (a grave crime). The boy makes his first appearance before the Youth Court and indicates a not-guilty plea. At the allocation hearing, the prosecution submits that the boy is likely to be sentenced to a minimum of three years' imprisonment given the seriousness of the offence and the boy's previous conviction. The defence submits that a three-year sentence is excessive given that the boy only has one previous conviction and the Youth Court is best placed to deal with his learning difficulties."], "st": "Which of the following is the most likely outcome of the allocation hearing?", "o": ["The Youth Court is likely to send the boy to the Crown Court for trial on the basis that there is a real prospect that a sentence in excess of two years' detention will be imposed.", "The Youth Court is likely to retain jurisdiction and try the boy summarily. If the Youth Court chooses to try the boy summarily, they may then commit the boy for sentencing to the Crown Court if it becomes appropriate to do so.", "The Youth Court is likely to send the boy to the Crown Court for trial on the basis that there is a strong possibility that a sentence in excess of two years' detention will be imposed.", "The Youth Court is likely to retain jurisdiction and try the boy summarily. If the Youth Court chooses to try the boy summarily, they cannot thereafter commit the boy to the Crown Court for sentencing.", "The Youth Court must send the boy to the Crown Court for trial as he will likely turn 18 before the end of proceedings."], "a": "B", "bx": "The correct answer was B. This is because the 'real prospect' test is a high threshold to pass and the Sentencing Children and Young People Definitive Guideline suggests that in most cases, it is likely to be impossible to decide whether there is a 'real prospect that a sentence in excess of two years' detention will be imposed without knowing more about the facts of the case and the circumstances of the child or young person. As such, the Youth Court is most likely to retain jurisdiction and then has the power to commit the boy to the Crown Court if they are satisfied of the real prospect test at that point (ie it is appropriate to do so). Option A is wrong as it ignores the principle in the Definitive Guideline; given that we are told of the potential learning difficulties of the boy and the dispute of the defence as to the minimum sentence, the real prospect test is unlikely to be satisfied at this stage in the proceedings. Option C is wrong as it uses the incorrect test ('strong possibility as opposed to 'real prospecf). Option D is wrong given that, whilst the Youth Court is likely to retain jurisdiction, it does have the power to commit for sentence. Option E is wrong as the boy has made his first appearance at the age of 17 and the Youth Court retains a discretion to try his case, even if he turns 18 before the conclusion of proceedings."}, {"ch": 9, "n": 6, "sc": ["A youth is charged with murder."], "st": "Where must the case be tried?", "o": ["In the High Court.", "In the Crown Court.", "At the youth's election.", "In the Youth Court.", "In the adult magistrates' court."], "a": "B", "x": ["Wrong. No.", "Correct. Homicide offences committed by youths must be sent to the Crown Court.", "Wrong. Youths cannot elect.", "Wrong. Not for homicide.", "Wrong. No."]}, {"ch": 9, "n": 7, "sc": ["A youth court is sentencing a 15-year-old for the first time. He pleads guilty to an imprisonable offence and the court does not propose custody, a hospital order or a discharge."], "st": "What order must the court usually make?", "o": ["A fine.", "A detention and training order.", "A conditional discharge.", "A referral order.", "A youth rehabilitation order."], "a": "D", "x": ["Wrong. Not the mandatory order.", "Wrong. Custody is not proposed.", "Wrong. A discharge is not proposed.", "Correct. The mandatory referral order conditions are met.", "Wrong. Not mandatory here."]}, {"ch": 9, "n": 8, "sc": ["A detention and training order is being considered for a youth."], "st": "What is the minimum length of a DTO?", "o": ["Two months.", "Six months.", "One month.", "Four months.", "Twelve months."], "a": "D", "x": ["Wrong. Not the minimum.", "Wrong. Not the minimum.", "Wrong. Not the minimum.", "Correct. DTOs range from 4 to 24 months.", "Wrong. Not the minimum."]}, {"ch": 9, "n": 9, "sc": ["A 17-year-old turns 18 during proceedings in the Youth Court after the trial has started."], "st": "What is the position?", "o": ["The youth is automatically sentenced as an adult in all respects.", "The case is dismissed.", "The Youth Court may continue to deal with the case.", "The case must be sent to the Crown Court.", "The case must restart in the adult court."], "a": "C", "x": ["Wrong. Not automatically.", "Wrong. No.", "Correct. The Youth Court may retain the case once proceedings have begun.", "Wrong. Not required.", "Wrong. Not required."]}, {"ch": 9, "n": 10, "sc": ["A youth is being interviewed at the police station."], "st": "Who must be present?", "o": ["Nobody.", "Only the youth's solicitor.", "The youth's teacher.", "An appropriate adult, and the youth may also have a solicitor.", "A magistrate."], "a": "D", "x": ["Wrong. An appropriate adult is required.", "Wrong. A solicitor cannot act as appropriate adult.", "Wrong. Not required.", "Correct. Code C requires an appropriate adult for juveniles.", "Wrong. No."]}]},Q=D.q,L="ABCDE";let i=0,A={};
