statement to the woman about the boat?", "o": ["The statement is a term of the contract.", "The parol evidence rule means that the statement does not form part of the written agreement.", "The statement is a representation.", "The parol evidence rule establishes the presumption that the statement does not form part of the written agreement.", "The effect of the parol evidence rule, together with the entire agreement clause in the written contract, mean that the man's oral statement has no legal effect."], "a": "E", "bx": "The correct answer was E. In this case, the agreement is in writing. As a result, the parol evidence rule applies that leads to the presumption that all written terms are included in the written agreement. This presumption is further reinforced by the entire agreement clause. This means that Options A and C are incorrect. Option B is incorrect because the parol evidence rule is a presumption rather than an absolute rule, and the statement is incomplete because it does not take account of the entire agreement clause. Option D is incorrect as it is incomplete by not taking account of the entire agreement clause."}, {"ch": 4, "n": 6, "sc": ["A seller says to a buyer, 'I believe the boat is sound, but you should have it surveyed before you buy.' The buyer buys the boat without a survey and it proves to be unsound."], "st": "How is the seller's statement most likely to be classified?", "o": ["A representation, because the seller invited the buyer to verify it.", "A collateral contract.", "A term, because it concerns the quality of the goods.", "A term, because it was made before the contract.", "Mere puff with no legal effect."], "a": "A", "x": ["Correct. Where the maker of a statement suggests that the other party should check it, this indicates that the maker did not intend to accept responsibility for its truth, so it is likely to be a representation rather than a term.", "Wrong. Nothing suggests a separate collateral promise.", "Wrong. The subject matter alone does not make a statement a term.", "Wrong. Pre-contractual statements are not automatically terms.", "Wrong. Puff is something incredible or unrealistic."]}, {"ch": 4, "n": 7, "sc": ["A business sells a forklift truck to another business. Nothing is said about quality. The truck is defective and unusable."], "st": "Which of the following best describes the buyer's position?", "o": ["The buyer has no claim because there is no express term about quality.", "There is an included term under the Consumer Rights Act 2015.", "The buyer can claim only for misrepresentation.", "The buyer must rely on the officious bystander test.", "There is a statutory implied term that goods are of satisfactory quality, which has been breached."], "a": "E", "x": ["Wrong. Terms can be implied by statute.", "Wrong. The Consumer Rights Act 2015 applies to consumer contracts, not business-to-business sales.", "Wrong. No misrepresentation was made.", "Wrong. The statutory implied term makes this unnecessary.", "Correct. In a business-to-business sale, s 14(2) of the Sale of Goods Act 1979 implies a term that goods are of satisfactory quality."]}, {"ch": 4, "n": 8, "sc": ["A landowner grants a man an option to buy a field 'if the landowner decides to sell'. The contract says nothing about whether the landowner can sell to someone else first. It is so obvious that the parties would have agreed that she must not, that if asked at the time they would both have said 'of course'."], "st": "On what basis might a term be implied?", "o": ["Course of dealing.", "Implied in fact, under the officious bystander test.", "Implied in law for all option agreements.", "Custom.", "Statute."], "a": "B", "x": ["Wrong. There is no previous course of dealing.", "Correct. A term is implied in fact where it is so obvious that it goes without saying: if an officious bystander had suggested it, the parties would have replied 'of course'.", "Wrong. This is not a term implied by law into a class of contracts.", "Wrong. There is no evidence of custom.", "Wrong. No statute implies such a term."]}, {"ch": 4, "n": 9, "sc": ["A consumer buys a kettle from a shop. It stops working after one week."], "st": "Which of the following best describes the source of the consumer's rights?", "o": ["The officious bystander test.", "A term included by the Consumer Rights Act 2015 that the goods are of satisfactory quality.", "The business efficacy test.", "The shop's express warranty only.", "A term implied by s 14(2) of the Sale of Goods Act 1979."], "a": "B", "x": ["Wrong. A statutory term applies, so no implied term in fact is needed.", "Correct. In consumer contracts, the Consumer Rights Act 2015 includes a term that goods are of satisfactory quality (s 9).", "Wrong. A statutory term applies.", "Wrong. Statutory rights apply in addition to any express warranty.", "Wrong. In the consumer regime terms are included by the CRA 2015, not implied by the SGA 1979."]}, {"ch": 4, "n": 10, "sc": ["A written contract contains a clause whose meaning is clear on its natural and ordinary wording, but which produces a commercially unfavourable outcome for one party."], "st": "How will the court most likely interpret the clause?", "o": ["It will give effect to the clear natural and ordinary meaning of the words, even if the outcome is commercially unfavourable for one party.", "It will apply the contra proferentem rule.", "It will rewrite the clause to produce a fair outcome.", "It will look first at the parties' pre-contractual negotiations.", "It will ignore the clause."], "a": "A", "x": ["Correct. Where the language is clear, the courts give effect to its natural and ordinary meaning and are reluctant to look outside the four corners of the contract.", "Wrong. Contra proferentem applies to ambiguous wording.", "Wrong. The courts will not rewrite a clear bargain because it turns out badly for one party.", "Wrong. Pre-contractual negotiations are not normally used in this way.", "Wrong. The court will give the clause effect."]}, {"ch": 5, "n": 1, "sc": ["A man runs a cafe and is visited by a company selling coffee machines. The man agrees to buy a coffee machine from the company for £1,000 and signs the company's standard form sales agreement without reading it. The company delivers the coffee machine to the man. After a week, the coffee machine breaks and the engineer who examines the machine states that it is not of satisfactory quality. The man contacts the company to claim a new coffee machine on the grounds of breach of the implied term to supply goods of satisfactory quality. The company refers the man to a clause in the sales agreement that excludes any implied term into the contract that goods supplied are of satisfactory quality."], "st": "Which of the following statements best describes whether the man can claim against the company?", "o": ["The man has no grounds to claim against the company because of the general rule that a person is bound by a contract that he signs, regardless of whether or not he has read the contract.", "The man has no grounds to claim against the company because of the absolute rule that a person is bound by a contract he signs, regardless of whether or not he has read the contract.", "The man can claim against the company if he can show that it was not reasonable for the company to exclude an implied term that its goods are of satisfactory quality.", "The man can claim against the company on the basis that he is not bound by a contract that he signed due to fraud/misrepresentation.", "The man is not bound by the contract because he can rely on the defence that, through no fault of his own, he did not understand what he signed, and that there was a radical difference between what he signed and what he believed he was signing."], "a": "C", "bx": "The correct answer was C. This reflects the law in the business to business (B2B) context. Section 6 UCTA 1977 provides that a person can only restrict liability for breach of the implied term (s 14(2) SGA 1979) that goods supplied under a contract are of satisfactory quality if it satisfies the requirement of reasonableness. Option A is the correct description of the general rule about a person being bound by a contract they sign, regardless of whether they read it; but Option A ignores the operation of UCTA 1977 and the SGA 1979, described above. Option B is wrong for the same reason; in addition, the rule that a person is bound by a document they sign is not an absolute rule. Option D is incorrect as there is no evidence of fraud or misrepresentation in the scenario. Option E is incorrect because a person can only claim not to be bound by an action (non est factum/ it is not my deed) if, through no fault of their own, they did not understand the document they signed. Since it was the man's fault that he did not read the contract, he cannot rely on this defence."}, {"ch": 5, "n": 2, "sc": ["A man takes his car to the carwash to be cleaned. The woman who runs the carwash asks the man to sign a document that includes a term that the carwash company is not liable for any damage to the car. The man asks the woman about the term and she responds that it only applies to damage caused by birds while the car is waiting to be cleaned. The man signs the document and leaves the car at the carwash. When the", "man returns to collect his car, he discovers that the paintwork has been scratched because the woman used a wire brush to clean the car."], "st": "Which of the following statements best describes the basis on which the man can claim against the woman?", "o": ["The man cannot claim against the woman because a written statement in an agreement has greater legal weight than an oral statement, such as that made by the woman.", "The man can only claim against the woman if he can show that the exemption clause is unfair.", "The man can claim against the woman because the woman cannot rely on the exemption clause because the man signed the document on the basis of the woman's misrepresentation.", "The man cannot claim against the woman because the exemption clause was incorporated into the contract on a timely basis, which is when the contract between the man and the woman was made.", "The man cannot claim against the woman because the exemption clause is incorporated into the contract by the man's signature."], "a": "C", "bx": "The correct answer was C. The woman cannot rely on the exemption clause because the man signed it on the basis of her misrepresentation. Option B is incorrect because although it is true to say that a trader cannot enforce an unfair term against a consumer, there is not enough information available to determine whether the term is unfair. By contrast, the misrepresentation provides a clear basis for the man not to be bound by the exemption clause. Option A is incorrect. Although it is easier to prove the existence of a written term from an evidential point of view, it is not true to say that a written statement overrides an oral one. Option D is incorrect because although the term was incorporated on a timely basis, the misrepresentation means that the man is not bound by the exemption clause. Option E is incorrect due to the effect of the misinterpretation."}, {"ch": 5, "n": 3, "sc": ["In a telephone call, a trading company agrees to buy oil from an energy company. The parties agree basic terms, including the price. After the call, the trading company sends its standard terms and conditions to the energy company. The trading company has made five previous transactions with the energy company in the last year and each transaction had been concluded in the same way. Subsequently, a dispute arises between the parties and the trading company claims that the dispute is governed by its standard terms and conditions."], "st": "Which of the following best reflects the legal position of the parties?", "o": ["The dispute cannot be governed by the trading company's standard terms and conditions because contract was made through the telephone call, and the trading company's terms and conditions came too late to be part of the contract.", "In view of the previous consistent course of dealing between the parties, the trading company's standard terms and conditions have been incorporated into the transaction.", "The trading company's standard terms and conditions will only have been incorporated into the transaction if the energy company signed them and returned them to the trading company.", "The trading company's standard terms and conditions will not have been incorporated into the transaction because the agreement concluded over the telephone was an oral agreement on which written documents have no effect.", "The trading company's standard terms and conditions will not have been incorporated because such a document is not one that a reasonable person would expect to have contractual effect."], "a": "B", "bx": "The correct answer was B. Where parties transact on a regular basis on standard terms and conditions, they may be incorporated into the contract provided the course of dealing is consistent. Watch out for scenarios where the previous dealings between the parties is not 100% consistent. This lack of consistency is likely to undermine an argument for incorporation based on consistent course of dealing. Option A is incorrect because the rationale behind the consistent course of dealing basis of incorporation is that the parties are deemed to be aware of the terms because they were consistently included in their previous trades. Option C is incorrect for the same reason. Incorporation by consistent course of dealing is not dependent upon signature. Option D is not correct because there is nothing to prevent an agreement being concluded on the basis of both oral and written communications. Option E is incorrect because a company's standard terms and conditions is the type of document that would be expected to have legal effect."}, {"ch": 5, "n": 4, "sc": ["A library provides a service of sending books by post to customers to read. Customers return the books to the library by post after the allotted reading time of ten days. A man orders a book from the library and receives it with a delivery note from the library. The delivery note stated that the book had to be returned in ten days and that a daily fee of £20 would be charged for every day the book was retained beyond that. The entire delivery note was in small print without any words in bold or any boxes around wording. The man forgot about the book for 30 days, then he received a large invoice from the library."], "st": "Which of the following best reflects the man's position in this case?", "o": ["The man is bound to pay the invoice because he received timely notice of the term about the daily fee.", "The man is not bound to pay the invoice if he can show that the daily fee was particularly onerous and unusual and there is no evidence to show that it was explicitly brought to the man's attention.", "The man is bound to pay the invoice because even if he can show that the daily fee is particularly onerous and unusual, the daily fee was written in the delivery note and the man should have taken responsibility for reading it.", "The man is bound to pay the invoice because it was entirely his choice to keep the book for the loan period of ten days, or to take the risk of paying the daily fee if he chose to keep the book for longer.", "The man is not bound by the term in the delivery note because he did not sign it."], "a": "B", "bx": "The correct answer was B. Onerous or unusual terms must be explicitly brought to the attention of the other party by being included in bold print, or by being put in a box, for example. The explicit notice requirements for unusual or onerous terms mean that Options A, C and D are incorrect. Option E is incorrect because terms can be incorporated by reasonable notice, as well as by signature."}, {"ch": 5, "n": 5, "sc": ["A woman hires a horse from a farm. At the farm's request, the woman signs an agreement that states that the farm will not be liable for any damage caused to a rider, including injury or death as a result of negligence. During the ride, the horse's saddle slips off and the woman falls into a ravine and injures herself. The evidence shows that the farm was negligent because the horse's saddle was not attached safely."], "st": "Which of the following statements most accurately describes the legal position of the parties?", "o": ["Since the woman chose to sign the agreement, she is bound by it even if she did not read it.", "The exemption clause is effective to protect the farm from liability if it is reasonable.", "An exemption clause that excludes liability for death or personal injury is unenforceable so the woman can claim against the farm for negligence.", "If the woman can also claim on the grounds of breach of contract, this will exclude her ability to claim on the grounds of negligence.", "The exemption clause is ineffective to protect the farm from liability because it is unreasonable."], "a": "C", "bx": "The correct answer was C. This is governed by the B2C regime, and s 65 CRA 2015 provides that an exemption clause that excludes death or personal injury is unenforceable. This means that Options A and B are incorrect. Note that in scenarios where a person attempts to exclude liability for negligence (other than for death or personal injury) in the B2C context, this is only enforceable if it is fair. The requirement for exemptions to be reasonable applies in the business to business (B2B) context, which is not applicable in this scenario. Option E is therefore incorrect. Option D is incorrect because of Option C, but note that if an exemption clause mentions negligence, it will be effective to exclude liability for negligence (other than for death/personal injury) and subject to the requirement to be fair (B2C) or reasonable (B2B)."}, {"ch": 5, "n": 6, "sc": ["A couple pay for a hotel room at reception. When they reach their room they find a notice excluding the hotel's liability for lost property. Their belongings are later stolen through the hotel's negligence."], "st": "Can the hotel rely on the notice?", "o": ["No, because it was not incorporated into the contract, which was made at reception before they saw it.", "Yes, because the notice was clearly displayed.", "Yes, because they stayed in the room after seeing it.", "Yes, if it is reasonable.", "No, because exemption clauses can never exclude negligence."], "a": "A", "x": ["Correct. A term must be brought to a party's attention before or when the contract is made. As in Olley v Marlborough Court, the contract was concluded at reception before they saw the notice.", "Wrong. The notice came too late.", "Wrong. Staying in the room does not incorporate a late term.", "Wrong. Reasonableness only matters if the term is incorporated.", "Wrong. Liability for negligence (other than for death or personal injury) can sometimes be excluded."]}, {"ch": 5, "n": 7, "sc": ["A haulage firm's contract with a business customer excludes liability for 'any death or personal injury caused by negligence'. A customer's employee is injured through the firm's negligence while loading goods."], "st": "Can the firm rely on the clause?", "o": ["No, because UCTA 1977 s 2 makes such exclusions unenforceable.", "Yes, because it is a business-to-business contract.", "Yes, if the clause is reasonable.", "No, only because the clause was not signed.", "Yes, because the employee is not a party to the contract."], "a": "A", "x": ["Correct. Statute renders exemption clauses for death or personal injury caused by negligence unenforceable, both in B2B contracts (UCTA 1977, s 2) and in B2C contracts (CRA 2015, s 65).", "Wrong. The protection also applies between businesses.", "Wrong. No reasonableness test applies; the clause is simply unenforceable.", "Wrong. Signature is not the issue.", "Wrong. The employee's claim in negligence cannot be excluded in this way."]}, {"ch": 5, "n": 8, "sc": ["A clause in a business contract excludes liability 'for any loss howsoever caused'. The loss was caused by the defendant's negligence. The clause is ambiguous as to whether it covers negligence."], "st": "How will the court most likely interpret the clause?", "o": ["As automatically covering negligence because of 'howsoever'.", "As void for uncertainty.", "In favour of the party relying on it.", "Against the party relying on it, under the contra proferentem rule.", "By asking what the defendant intended."], "a": "D", "x": ["Wrong. General words do not necessarily cover negligence.", "Wrong. The clause is not void; it is narrowly construed.", "Wrong. Ambiguity is resolved against the party seeking to rely on the clause.", "Correct. Under the contra proferentem rule, ambiguous exemption clauses are interpreted against the party relying on them.", "Wrong. Interpretation is objective."]}, {"ch": 5, "n": 9, "sc": ["A trader sells a consumer a sofa. The contract excludes the trader's liability for breach of the statutory term that goods must be of satisfactory quality."], "st": "Which of the following best describes the effect of the clause?", "o": ["It is binding because the consumer could have shopped elsewhere.", "It is binding if it is reasonable.", "It is not binding on the consumer under the Consumer Rights Act 2015.", "It is binding unless it was hidden in small print.", "It is binding if the consumer signed the contract."], "a": "C", "x": ["Wrong. The consumer's choice is irrelevant.", "Wrong. Reasonableness is the B2B test.", "Correct. Under the Consumer Rights Act 2015, a trader cannot exclude or restrict liability for the statutory rights about the quality of goods, so the clause is not binding on the consumer.", "Wrong. It is not binding however it is presented.", "Wrong. Signature does not save it."]}, {"ch": 5, "n": 10, "sc": ["A business contract between two companies contains a clause restricting liability for negligently caused damage to property (not death or personal injury)."], "st": "Which of the following best describes the test the court will apply?", "o": ["The clause must satisfy the requirement of reasonableness under UCTA 1977.", "The clause is automatically unenforceable.", "The clause is enforceable if it was signed.", "The clause must be fair under the Consumer Rights Act 2015.", "The clause is enforceable only if the loss is minor."], "a": "A", "x": ["Correct. In the B2B regime, restricting liability for negligence (other than for death or personal injury) is enforceable only if it satisfies the requirement of reasonableness.", "Wrong. Automatic unenforceability applies only to death or personal injury.", "Wrong. Signature only incorporates the clause; it does not satisfy the statutory test.", "Wrong. The fairness test is for B2C contracts.", "Wrong. There is no such rule."]}, {"ch": 6, "n": 1, "sc": ["A company decides to sponsor a pop group's world tour in August. In March of the same year, the pop group, with all five group members, participate in promotional activities for a company's product in respect of a forthcoming tour. All five members of the pop group know that the fifth member of the group is not planning to participate in the tour but they say nothing. In June, the company discovers that the fifth member of the group will not be on the tour, and as a result the company decides not to pay the sponsorship fee and wishes to rescind the contract."], "st": "Can the company rescind the contract for misrepresentation?", "o": ["No, because conduct can never amount to misrepresentation.", "No, because damages is the primary remedy for misrepresentation and rescission is only at the discretion of the court if damages would be an inadequate remedy.", "No, because by participating in the promotional activities, the company has affirmed the contract.", "Yes, because the pop group's conduct amounted to a misrepresentation.", "Yes, because this is a clear case of fraudulent misrepresentation."], "a": "D", "bx": "The correct answer was D. This is because taking part in the promotional activities amounts to a misrepresentation that the pop group did not know (and did not have reasonable grounds to believe) that a member of the group would not participate in the tour. This means that Option A is incorrect. Option B is also incorrect because rescission is a remedy for all types of misrepresentation. But note that the discretion is wrongly described in Option B. It is only in respect of non-fraudulent misrepresentation that the court has the discretion to award damages instead of rescission. Option C is incorrect because affirmation can only take place after the representee has discovered the truth, which is not the case in this scenario. Option E is incorrect because the remedy of rescission is available for all types of misrepresentation, not only fraudulent misrepresentation."}, {"ch": 6, "n": 2, "sc": ["A woman runs an art gallery. A man who is an art dealer enters the art gallery and admires a painting. The woman tells the man that the painting is by a famous artist because the woman wants to sell the painting for a", "very high price. In fact, the painting was created by the woman's baby daughter. The man takes a photograph of the painting and asks an art expert to confirm whether it is by the famous artist. The expert confirms that, in his view, the painting is by the famous artist. The man buys the painting and later finds out the truth."], "st": "Can the man rescind the contract?", "o": ["No, because making his own investigations will undermine the man's argument that he relied on the representation.", "Yes, because the woman was dishonest and so the man's investigations do not undermine his ability to claim.", "No, because this was an innocent misrepresentation so the court only has the power to award damages.", "Yes, provided the man can show that he relied to some degree on the woman's statement about the famous artist.", "No, but the man is entitled to claim damages."], "a": "B", "bx": "The correct answer was B. A representee's investigations do not impact their ability to claim if the misrepresentation was fraudulent, as it was in this scenario. This means that Option A is incorrect. Option C is incorrect because the scenario highlights the woman's dishonesty so this is a case of fraudulent misrepresentation, not innocent misrepresentation. Option D is incorrect because a representee's investigations do not impact a representee's ability to claim a remedy in the case of fraudulent misrepresentation, as in this scenario. Option E is incorrect. The general position is that rescission is available as a remedy once a misrepresentation is established. It is only in the case of innocent misrepresentation that the court has the discretion to award damages instead of rescission. This is not relevant to the present scenario, which concerns fraudulent misrepresentation."}, {"ch": 6, "n": 3, "sc": ["A shopkeeper wants to sell an antique gun. As the barrel of the gun is damaged, the shopkeeper sprays it with paint to make it look as if it is not damaged. The man then shuts the gun in a wooden case. A woman, who represents a clay pigeon shooting company, arrives at the shop and informs the man that she is looking for a gun. The man gives the woman a list of available guns. The woman is in a hurry, so she points to a wooden case from across the room and says she will take that one. When the woman subsequently opens the case she discovers the defect."], "st": "Can the woman rescind the contract on the grounds of misrepresentation?", "o": ["Yes, because painting the barrel of the gun to look as if it is not damaged is a clear misrepresentation.", "No, because the shopkeeper did not say anything about the condition of the gun and silence cannot amount to a misrepresentation.", "No, because by taking the gun away from the shop, the woman has affirmed the contract.", "No, because the woman had not inspected the gun before she bought it.", "Yes, because the intention of the shopkeeper was fraudulent, which means that the woman can rescind the contract."], "a": "D", "bx": "The correct answer was D. Remember that a key test to satisfy in showing that that statement induced the contract is that the representee was aware of the misrepresentation. In this scenario, the representee was not aware of the misrepresentation as she had not inspected the gun before buying it. This lack of awareness means that Option A is incorrect. Option B is incorrect because although the general rule about silence not amounting to a misrepresentation is correctly stated, the action of the shopkeeper in this scenario would amount to a misrepresentation by conduct and would lead to an action for misrepresentation if the representee had been aware of it when she bought the gun. Option C is incorrect because affirmation can only take place when the representee knows the truth and the woman did not know the truth when she took the gun away from the shop. Option E is incorrect because although the intention of the shopkeeper was fraudulent, the action did not induce the contract so does not give the representee a remedy."}, {"ch": 6, "n": 4, "sc": ["A landowner sells a plot of land to a developer for £3 million. Prior to the sale, the landowner had told the developer that there was nothing on the land that would hinder development of the land. After the developer bought the land, it found that there was a colony of newts on the land that would cost £2,000 to rehome. The developer understands that the statement about nothing hindering development was an innocent misrepresentation."], "st": "Can the developer rescind the contract?", "o": ["Yes, because rescission is always available as a remedy for innocent misrepresentation.", "No, because rescission is not available as a remedy for innocent misrepresentation.", "No, because the court is likely to exercise its discretion to award damages instead of rescission.", "Yes, provided the statement satisfies the tests for an innocent misrepresentation.", "No, because restitution is impossible."], "a": "C", "bx": "The correct answer was C. In cases of innocent misrepresentation, the court has the discretion to award damages instead of rescission. This discretion can be exercised where rescission seems to be a disproportionately severe remedy and where damages would be an adequate remedy. Considering the purchase price of £3 million and the cost of remedying the problem by rehoming the newts, it is very likely that the court would exercise its discretion to award damages. This means that Option A and Option D are incorrect. Option B is incorrect because rescission is available but can be replaced with damages at the discretion of the court, as noted above. Option E is incorrect because although restitution would appear to be disproportionate in this case, it is not impossible."}, {"ch": 6, "n": 5, "sc": ["A transport company bought a lorry after being told that it was in good condition. When the transport company drove the lorry, it discovered that it had serious faults. The transport company highlighted these faults to the seller, who agreed to pay half the cost of repairs. When the transport company used the lorry for the second time, it broke down."], "st": "Can the transport company rescind the contract for misrepresentation about the condition of the lorry?", "o": ["No, because the subject matter of the representation has been destroyed.", "No, because the lapse of time between buying the lorry and bringing the claim means that the transport company has lost its ability to claim a remedy.", "Yes, because the transport company did not expressly state that it affirmed the contract.", "No, because using the lorry for a second time amounts to affirmation.", "Yes, because the statement that the lorry was in good condition was a clear misrepresentation."], "a": "D", "bx": "The correct answer was D. The transport company would be held to be entitled to test out the vehicle after buying it to check whether the statement about it being in good condition was true or false. But after the first repair, the law treats a second journey as affirmation that is made when the representee knows that the representation about the vehicle being in good condition is false. This means that Option E is incorrect. Option A is not correct as the vehicle still exists. Option B is incorrect because we are not aware of the lapse of time between the statement being made and the second test drive. Further, although the law previously held that lapse of time would undermine a claim for rescission, the position now appears to be that rescission is available, provided the claim is brought within a reasonable time. Option C is incorrect as actions can amount to affirmation, such as taking the car for a second drive. No words are necessary."}, {"ch": 6, "n": 6, "sc": ["A seller, who has never farmed the land, tells a buyer that she thinks the land could support 2,000 sheep. The buyer knows that the land has never been used for sheep. It supports far fewer."], "st": "Is the seller's statement a misrepresentation?", "o": ["Yes, because all pre-contractual statements are representations.", "No, because the buyer did not rely on it.", "No, because it was a statement of opinion and the seller was in no better position to know than the buyer.", "Yes, because opinions are always treated as facts.", "Yes, because it was false."], "a": "C", "x": ["Wrong. Statements of opinion are not misrepresentations in these circumstances.", "Wrong. The point is the nature of the statement, not reliance.", "Correct. False statements of opinion are not misrepresentations, provided the representor is not in a better position to know the facts than the representee.", "Wrong. Opinions are not treated as statements of fact.", "Wrong. A false opinion is not necessarily a misrepresentation."]}, {"ch": 6, "n": 7, "sc": ["A seller tells a buyer that a property is let to a tenant who pays rent reliably. The statement is negligent but not fraudulent. The seller cannot prove that he had reasonable grounds to believe it."], "st": "Which of the following best describes the buyer's claim under the Misrepresentation Act 1967?", "o": ["The buyer can only claim damages if the seller was fraudulent.", "The buyer can only claim rescission.", "The buyer must prove that the seller owed a duty of care.", "The buyer must prove a special relationship with the seller.", "Once the statement is shown to be false, the seller must prove reasonable grounds for believing it; the buyer may claim rescission and damages."], "a": "E", "x": ["Wrong. Fraud need not be proved.", "Wrong. Damages are also available.", "Wrong. Under statute, no special relationship or duty of care is required.", "Wrong. A special relationship is required at common law, not under the Act.", "Correct. Under the Misrepresentation Act 1967, once the statement is shown to be false, the representor must prove reasonable grounds for believing it was true up to the time of the contract. Rescission and damages are available."]}, {"ch": 6, "n": 8, "sc": ["A buyer discovers that the seller's statement was untrue. With full knowledge of the truth, he continues to use the goods for several months and says that he is happy to keep them."], "st": "Can the buyer rescind the contract?", "o": ["No, because he affirmed the contract after discovering the truth.", "Yes, rescission is always available for misrepresentation.", "No, because rescission is only available for fraud.", "Yes, because affirmation requires express words.", "Yes, provided he returns the goods."], "a": "A", "x": ["Correct. Affirmation after the representee discovers the truth bars rescission.", "Wrong. Rescission can be lost through bars such as affirmation.", "Wrong. Rescission is available for all types of misrepresentation.", "Wrong. Affirmation may be by conduct, and here he also said he was happy.", "Wrong. Returning the goods does not undo the affirmation."]}, {"ch": 6, "n": 9, "sc": ["A seller fraudulently tells a buyer that a painting is by a famous artist. The buyer buys it. Before the buyer discovers the truth, the painting has been sold on to an innocent third party for value."], "st": "Can the buyer rescind the contract and recover the painting from the third party?", "o": ["No, because rescission is only available for innocent misrepresentation.", "Yes, because a contract induced by fraud is void.", "Yes, because the misrepresentation was fraudulent.", "No, because rescission is barred where an innocent third party has acquired rights for value.", "Yes, provided she acts promptly."], "a": "D", "x": ["Wrong. Rescission is available for all types of misrepresentation.", "Wrong. Fraudulent misrepresentation makes a contract voidable, not void.", "Wrong. Fraud does not override the third-party bar.", "Correct. Rescission is barred where an innocent third party has acquired rights in the subject matter for value; the buyer should instead claim damages.", "Wrong. Acting promptly does not overcome the third-party bar."]}, {"ch": 6, "n": 10, "sc": ["A seller tells a buyer that a business has annual profits of £100,000. This is true at the time, but before the contract is signed profits fall sharply. The seller says nothing."], "st": "Which of the following best describes the legal position?", "o": ["There is no misrepresentation because the statement was true when made.", "There may be a misrepresentation because the seller failed to correct a statement that became untrue before the contract.", "The contract is void.", "The buyer can only claim for breach of term.", "There is no misrepresentation because silence can never be a misrepresentation."], "a": "B", "x": ["Wrong. A statement that becomes untrue before the contract must be corrected.", "Correct. Although silence is generally not a misrepresentation, a representor who makes a statement that becomes false before the contract is made must correct it (a change of circumstances, as in With v O'Flanagan).", "Wrong. Misrepresentation makes a contract voidable, not void.", "Wrong. The statement is likely a representation, not a term.", "Wrong. This is an exception to the general silence rule."]}, {"ch": 7, "n": 1, "sc": ["A man sees a notice advertising the sale of a restaurant that he knows. The man knows that the restaurant has beautiful gardens and he assumes that the gardens are included in the sale. The man does not read the particulars of sale or the sale agreement that clearly states that the gardens are excluded from the sale. When the man has completed the purchase of the restaurant, he is upset to see that the gardens were not included in the sale agreement."], "st": "Which of the following statements most accurately reflects the legal position?", "o": ["The sale agreement is void because of the man's mistake.", "The sale agreement is enforceable because it was the man's fault that he has made a mistake.", "The sale agreement is enforceable, but the court will order specific performance to require the gardens to be included in the sale to satisfy the man's reasonable expectations.", "The sale agreement is voidable due to fraudulent misrepresentation.", "The sale agreement is voidable because the notice advertising the sale should have made it very clear that the gardens were excluded from the sale."], "a": "B", "bx": "The correct answer was B. This reflects the requirement that a mistaken party must satisfy three conditions, including that they were not at fault. In this scenario, the mistake was the person's own fault because he assumed that the gardens were included, but did not bother to read the sale particulars or the sales agreement. Option A is therefore incorrect. Option C is incorrect because there are no grounds to support a claim for specific performance (see Chapter 10). Option D is incorrect as there is no evidence in the scenario to support a claim for fraudulent misrepresentation as we are told that the sales particulars and sales agreement clearly stated that the gardens were excluded from the sale. Option E is incorrect as there is no requirement for an advertisement that is not an offer to contain all the relevant details."}, {"ch": 7, "n": 2, "sc": ["A woman telephoned a car showroom and told the dealer that she was interested in buying a car. The woman did not give her real name to the dealer, but instead gave the name of a colleague, whose driving licence she had stolen. After the telephone call, the woman emailed the dealer a copy of her colleague's driving licence to confirm her fake identity. Subsequently, the dealer agreed to sell the woman a car in exchange for a cheque for £22,000. The woman then sold the car to a third party. The dealer's bank was unable to clear the cheque as it was a worthless forgery."], "st": "Which of the following statements best describes the legal position in this case?", "o": ["The agreement between the woman and the dealer is void for mistake.", "The dealer cannot reclaim the car from an innocent third party.", "The agreement between the woman and the dealer is void for fraudulent misrepresentation.", "The agreement between the woman and the dealer is voidable for fraudulent misrepresentation.", "The agreement between the woman and the dealer is voidable and the dealer should rescind the agreement immediately to prevent title from passing to the third party."], "a": "A", "bx": "The correct answer was A. This is because where parties transact in writing at a distance, the presumption is that the innocent party intends to deal with the person whose identity is presented. This means that the agreement will be void for mistake. This means that Option B is incorrect because the contract is void for mistake and title does not pass under a void contract. This also means that Option C is incorrect as it incorrectly states the law: fraudulent misrepresentation does not render a contract void, it renders it voidable. The present scenario is a clear case of mistake, which renders the contract void. Option D is incorrect because although it is correct to state that fraudulent misrepresentation renders a contract voidable, this scenario is a case of mistake, not fraudulent misrepresentation. Option E is incorrect because the contract is void for mistake. In addition, in the event that the contract were voidable, title would have already passed to a third party, so any attempt to rescind the contract after title has passed in this way is of no effect."}, {"ch": 7, "n": 3, "sc": ["A company is the only supplier of essential car parts to a carmaker. At a time when the carmaker has a very limited amount of car parts in stock, the company threatens to stop supplying the essential car parts unless the carmaker agrees to a significant price increase for the essential parts. The carmaker agrees to pay the company more because the failure to receive the essential car parts from the company would cause severe financial losses to the carmaker's business."], "st": "Which of the following statements most accurately reflects the legal position of the parties?", "o": ["The carmaker is bound to pay the company the increased price for the car parts because both parties were operating in the business to business (B2B) context.", "The carmaker is only bound to pay the company a reasonable amount for the car parts.", "The carmaker is bound to pay the company the increased price for the car parts.", "The carmaker's agreement to pay an increased price for the car parts is voidable.", "The carmaker's agreement to pay an increased price for the car parts is void."], "a": "D", "bx": "The correct answer was D. This is because when you consider the severe financial consequences for the carmaker of refusing to pay the increased price, this puts the carmaker under illegitimate pressure that gives it no option but to agree to the increased price. This illegitimate pressure amounts to duress, which makes the contract voidable. This means that Options C and E are incorrect. Option A is incorrect because duress can provide a remedy in the business to business (B2B) context. Option B is incorrect because the remedy for the innocent party is that the contract is voidable. There is no requirement to subject the costs in question to reasonableness."}, {"ch": 7, "n": 4, "sc": ["A man is in a religious sect and has taken a vow of poverty and promised unquestioning obedience to the leader of the religious sect. During the time the man is in the sect, he gives £7,000 to the leader. Subsequently, the man escapes from the sect and five years later the man decides to claim the money that he gave to the leader."], "st": "Which of the following is true?", "o": ["The man can reclaim the money on the grounds of actual undue influence.", "The man can reclaim the money on the grounds of presumed undue influence.", "The man cannot reclaim the money on the grounds of presumed undue influence because he has not exercised his remedy promptly.", "The man cannot reclaim the money because presumed undue influence does not apply to such relationships.", "The man cannot reclaim the money because undue influence does not apply to gifts."], "a": "C", "bx": "The correct answer was C. The religious leader/disciple relationship is a clear example of the established class 2A relationships to which presumed undue influence applies. However, delays in bringing a claim are likely to be held by the court as affirmation of a scenario. In this case, the man took five years to bring a claim and this is too long. This means that Option B is incorrect. Option A is incorrect as there is no evidence in the scenario of actual undue influence over the man by the leader. Option D is incorrect as presumed undue influence does apply to this class of relationship. Option E is incorrect as undue influence does apply to gifts."}, {"ch": 7, "n": 5, "sc": ["A man works for a small tailor's business in a suburb of London. In his contract with the tailor, the man agrees that if he leaves his current job,", "he will not enter into similar employment within 25 miles of London for three years."], "st": "Is the man bound by the term of his contract?", "o": ["Yes, a business owner such as a tailor is entitled to protect his business.", "Yes, provided the man agreed to the term without duress or undue influence.", "No, because the term is not reasonable.", "No, because such a contract is illegal as a restraint of trade.", "Yes, if the man freely agreed to the term."], "a": "C", "bx": "The correct answer was C. This is because the restriction is much greater than is reasonably required for a small tailor's business in a suburb of London. This means that Options A, B and E are incorrect. Option D is incorrect because not all restraint of trade agreements are unenforceable."}, {"ch": 7, "n": 6, "sc": ["A rogue enters a jewellery shop, claims to be a famous actor and pays for a ring with a cheque, which bounces. The jeweller did not check his identity. The rogue sells the ring to an innocent buyer."], "st": "Can the jeweller recover the ring from the innocent buyer?", "o": ["Yes, because fraud makes all contracts void.", "Yes, because the contract is void for mistake as to identity.", "Yes, because the cheque bounced.", "No, because in face-to-face dealings there is a presumption that the seller intends to deal with the person present, so the contract is voidable, and title has passed.", "No, because mistake never affects contracts."], "a": "D", "x": ["Wrong. Fraud makes a contract voidable.", "Wrong. Face-to-face dealings raise a presumption that the seller intends to deal with the person present.", "Wrong. Non-payment does not make the contract void.", "Correct. In face-to-face dealings, the mistaken party is presumed to intend to deal with the person physically present (Philips v Brooks). The contract is voidable for fraud, not void, so the innocent buyer gets good title if it was not rescinded first.", "Wrong. Mistake can make contracts void in some cases."]}, {"ch": 7, "n": 7, "sc": ["A rogue, posing by letter and email as a reputable company, orders goods from a supplier. The supplier sends the goods, believing it is dealing with the reputable company. The rogue sells them to a third party."], "st": "Which of the following best describes the contract between the supplier and the rogue?", "o": ["Void only if the supplier rescinds it immediately.", "Void for mistake, because in dealings at a distance in writing the supplier is presumed to intend to deal with the person whose identity was presented.", "Voidable for duress.", "Valid, because the supplier sent the goods.", "Voidable for misrepresentation, so the third party gets good title."], "a": "B", "x": ["Wrong. A void contract needs no rescission.", "Correct. Where the parties deal at a distance in writing, the innocent party is presumed to intend to deal with the person whose identity is presented, so the contract is void for mistake and no title passes.", "Wrong. There was no illegitimate pressure.", "Wrong. The supplier's mistake as to identity prevents a valid contract.", "Wrong. Where the dealings are at a distance in writing, the presumption is that the supplier intended to deal with the named company."]}, {"ch": 7, "n": 8, "sc": ["A supplier threatens to break its contract by withholding goods that a manufacturer urgently needs unless the manufacturer agrees to pay more. The manufacturer has no practical alternative and agrees. As soon as the pressure ends, the manufacturer protests and seeks to avoid the variation."], "st": "Which of the following best describes the legal position?", "o": ["The variation is binding because there was consideration.", "The variation is void.", "The variation is voidable for economic duress.", "The manufacturer must pay a reasonable price.", "The variation is binding because the parties are businesses."], "a": "C", "x": ["Wrong. Duress can avoid a contract even if there is consideration.", "Wrong. Duress makes an agreement voidable, not void.", "Correct. Illegitimate pressure that leaves the victim no practical alternative amounts to economic duress, which makes the agreement voidable. Prompt protest helps avoid affirmation.", "Wrong. The remedy is rescission of the variation.", "Wrong. Economic duress can apply between businesses."]}, {"ch": 7, "n": 9, "sc": ["An elderly woman relies completely on her financial adviser, who persuades her to transfer her house to him for a fraction of its value. There is no evidence of express pressure."], "st": "Which of the following best describes the woman's likely claim?", "o": ["No claim, because she freely agreed.", "Duress, because the adviser exploited her.", "Actual undue influence, because she relied on him.", "Mistake, because she did not understand the value.", "Presumed undue influence, because she placed trust and confidence in him and the transaction calls for explanation."], "a": "E", "x": ["Wrong. Agreement induced by undue influence can be set aside.", "Wrong. Duress requires illegitimate threats or pressure.", "Wrong. Actual undue influence needs evidence of improper pressure.", "Wrong. There is no operative mistake.", "Correct. Where a relationship of trust and confidence exists and the transaction calls for explanation, undue influence may be presumed, shifting the burden to the adviser."]}, {"ch": 7, "n": 10, "sc": ["A national accountancy firm's employment contract prevents a junior employee from working as an accountant anywhere in England for 20 years after leaving."], "st": "Is the restriction likely to be enforceable?", "o": ["Yes, because employers may always protect their business.", "No, because it is far wider than reasonably necessary to protect the employer's legitimate interests.", "Yes, because the employee agreed to it.", "No, because all restraints of trade are void.", "Yes, if the employee was paid well."], "a": "B", "x": ["Wrong. Protection must be reasonable.", "Correct. A restraint of trade is enforceable only if it is reasonable; a 20-year restriction covering all of England is much greater than reasonably required.", "Wrong. Agreement does not make an unreasonable restraint enforceable.", "Wrong. Not all restraints of trade are unenforceable.", "Wrong. Pay does not make an unreasonable restraint reasonable."]}, {"ch": 8, "n": 1, "sc": ["A developer and an investor enter into an agreement pursuant to which the developer will build four blocks of flats by a given date. The agreement provided that the developer would lease the flats to the", "investor on a 999-year lease. The developer runs behind schedule, and completes the building of two of the blocks over a year late at a time when it is still working on the other two blocks in order to complete them."], "st": "Which of the following most accurately reflects the legal position in this case?", "o": ["The investor can discharge the contract on the grounds of the developer's repudiatory breach.", "The investor cannot repudiate the contract with the developer, but is entitled to claim damages.", "If the investor repudiates the contract, the developer can elect to affirm the contract, which will oblige both parties to continue to perform their obligations under the contract.", "The contract is discharged by frustration.", "The investor can discharge the contract on the grounds of the developer's anticipatory repudiatory breach."], "a": "B", "bx": "The correct answer was B. In assessing whether a breach is repudiatory in scenarios such as these, you need to consider whether the breach deprives the non-breaching party of substantially the whole benefit of the contract. Pay attention to the time frames in the scenario. The leases for the investor were for 999 years, and the delays were very short in comparison. Since the developer was working on the two remaining blocks at the time of the investor's possible discharge for repudiatory breach, it is not possible to say that the breach at that point had deprived the investor of substantially the whole benefit of the contract. The factual delay at the time of the investor's possible repudiation could be sufficiently compensated in damages. This means that Options A and C are incorrect. In addition, in relation to Option C you should note that it is only the non-breaching party that can elect to affirm the contract (in this case, the investor). Option D is incorrect as the contract was still capable of being performed. Option E is incorrect because the breach in question was not anticipatory."}, {"ch": 8, "n": 2, "sc": ["A man agrees to build a garage for a woman for a lump sum of £10,000. The man runs out of money half-way through building the garage and abandons the half-built garage. The man estimates that the value of the building he has completed is £5,900. The man also leaves wood and other building materials on the woman's land. The woman uses the materials that the man has left on the land to finish building the garage."], "st": "Which of the following statements most accurately describes the legal position in this case?", "o": ["The man can claim £5,900 from the woman.", "The man can claim £5,900 from the woman plus the value of the materials left on the woman's land.", "The man cannot claim anything from the woman as this is an entire obligations agreement.", "The man cannot claim anything from the woman and is liable to compensate the woman for her work in finishing the garage.", "The man can claim the value of the materials that he left on the woman's land."], "a": "E", "bx": "The correct answer was E. This is due to an exception to the entire obligations agreement rule that applies where the non-breaching party has a choice of whether or not to accept the other party's performance. In this case, the woman is not liable to pay the man for the work on the garage as it is not movable. By contrast, the materials that the man has left on the land are movable and this gave the woman the choice whether to use these materials or not. On the basis that the woman has chosen to accept the materials, the court will allow the builder to recover the value of the materials. This means that Options A, B, C and D are incorrect."}, {"ch": 8, "n": 3, "sc": ["A plumber agreed with a man that she would install a central heating system for him. The contract provided that the plumber would be paid £3,000 in a lump sum once the work was completed. There were numerous defects in the work so that the system did not heat adequately, and it gave off fumes. The cost to fix the work was £930."], "st": "Which of the following statements best represents the legal position in the case?", "o": ["The contract has been frustrated.", "The plumber is not entitled to claim any payment for the work done.", "The plumber is entitled to the £3,000.", "Provided the plumber used reasonable endeavours, she will have satisfied her obligation under the contract.", "The plumber is entitled to claim the £3,000, minus the amount required to fix the work of £930."], "a": "B", "bx": "The correct answer was B. This is because the agreement is an entire obligations agreement since it provides for a lump sum payment on the completion of the work. The work has not been completed so the plumber is not entitled to anything. This means that Option C is incorrect. Option E is incorrect because the nature of the defects in the work and the cost of remedying them are too great for the doctrine of substantial performance to apply. Option A is incorrect because there is no indication of any of the grounds that invoke the doctrine of frustration. Option D is incorrect because the scenario does not provide for the plumber to use reasonable endeavours. Rather the plumber is under a strict contractual obligation and has failed to perform her obligation in accordance with the contract."}, {"ch": 8, "n": 4, "sc": ["A contractor agrees to deliver building materials to a developer over a period of five years. At some stage during the five-year period, the contractor's existing supplier decides to stop supplying the contractor. As a result, the contractor can no longer deliver the building materials to the developer."], "st": "Which of the following statements most accurately reflects the approach of the court in this case?", "o": ["The court will recognise the contract as frustrated for illegality.", "The court will not recognise the contract as frustrated.", "The court will recognise the contract as frustrated for impossibility.", "The court will recognise the contract as frustrated due to the loss of the main purpose.", "The court will recognise the contract as frustrated because it has become impracticable."], "a": "B", "bx": "The correct answer was B. In scenarios such as these, the court's position is that it is the responsibility of the party who agrees to supply to make arrangements to deal with the risk that their supply fails. The contractor could have done this by adding a provision in the contract to provide that his obligation to deliver was dependent upon being able to obtain the relevant building materials without undue difficulty. Since the contractor has made an unqualified promise, he takes the risk that his contemplated source of supply will fail. This means that Option C is incorrect. This also means that Option E is incorrect because the impracticality does not cause frustration. Option A is incorrect as there is nothing in the scenario to suggest that the performance of the contract has become illegal. Option D is incorrect because the main purpose of the contract has not changed."}, {"ch": 8, "n": 5, "sc": ["A shipping company agrees with a dealer to transport a cargo from one country to another. Both parties assumed that the cargo would be shipped through the most direct route between the two countries,", "but this was not mentioned in the contract. After the contract was concluded but before the cargo was delivered, the most direct route was unavailable, having been closed. There was an alternative route available but it would cost the shipping company twice as much, and take twice as long to ship the goods via the alternative route."], "st": "Which of the following statements best reflects the legal position of the shipping company in the case?", "o": ["The shipping company can affirm or discharge the contract.", "The shipping company is automatically discharged from its obligations under the contract.", "The shipping company is bound to perform its obligations under the contract.", "The shipping company is bound to perform its obligations under the contract but can obtain damages from the dealer.", "There is an implied term in the contract that the cargo will be shipped by the most direct route and because this is no longer an option, this is an anticipatory breach."], "a": "C", "bx": "The correct answer was C. Although the contract has become more difficult and expensive for the shipping company to perform, these factors do not trigger the doctrine of frustration. This means that Option B is incorrect as it sets out the effect of frustration on the contract. Option D is incorrect as there is no basis in the scenario on which the dealer is liable to the shipping company in damages. Option A is incorrect because the choice to affirm or discharge arises in the case of a repudiatory breach and there is no evidence in this scenario to support an argument for repudiatory breach. Option E is incorrect because although the parties assumed that the route would be via the most direct route, such assumption does not give rise to an implied term."}, {"ch": 8, "n": 6, "sc": ["A hall owner agrees to hire out a concert hall. Before the concert, the hall is destroyed by fire through no fault of either party."], "st": "Which of the following best describes the legal position?", "o": ["The contract is voidable for mistake.", "The contract continues and the owner must provide another hall.", "The owner is liable for breach of contract.", "The contract is frustrated because performance has become impossible.", "The hirer must still pay the hire fee."], "a": "D", "x": ["Wrong. The event happened after the contract was made, so this is frustration, not mistake.", "Wrong. The contract was for that particular hall.", "Wrong. Neither party is at fault.", "Correct. Where the subject matter of the contract is destroyed without the fault of either party, the contract is frustrated (Taylor v Caldwell).", "Wrong. Frustration discharges future obligations, and the LRFCA 1943 regulates money due."]}, {"ch": 8, "n": 7, "sc": ["A buyer paid a £2,000 deposit under a contract that was later frustrated. The seller incurred £500 of expenses in performing the contract before the frustrating event."], "st": "Which of the following best describes the buyer's position under the Law Reform (Frustrated Contracts) Act 1943?", "o": ["The buyer cannot recover the deposit.", "The buyer can recover the deposit plus damages.", "The buyer can recover the deposit, but the court may allow the seller to keep an amount for expenses incurred.", "The seller can keep the deposit because he incurred expenses.", "The buyer must pay the balance of the price."], "a": "C", "x": ["Wrong. Money paid is recoverable under the LRFCA 1943.", "Wrong. Frustration does not give rise to damages.", "Correct. Under the LRFCA 1943, money paid is recoverable, but where the payee has incurred expenses the court may allow them to retain an amount, having regard to all the circumstances.", "Wrong. The seller may keep only an amount the court thinks just, not necessarily the whole deposit.", "Wrong. Money due no longer needs to be paid."]}, {"ch": 8, "n": 8, "sc": ["A shipowner contracts to carry cargo but deliberately uses the ship for another, more profitable job, so it cannot perform the first contract."], "st": "Is the first contract frustrated?", "o": ["No, because frustration cannot be self-induced.", "Yes, if the shipowner gives notice.", "Yes, because performance has become impossible.", "No, because frustration only applies to destruction of goods.", "Yes, because the ship was unavailable."], "a": "A", "x": ["Correct. Frustration cannot be relied on where the event is self-induced or results from the fault of one of the parties.", "Wrong. Notice does not create frustration.", "Wrong. Impossibility caused by the party's own choice does not frustrate the contract.", "Wrong. Frustration is not confined to destruction.", "Wrong. The unavailability was the shipowner's own doing."]}, {"ch": 8, "n": 9, "sc": ["A supplier tells a buyer in March that it will not deliver goods due in June under their contract. This refusal goes to the root of the contract."], "st": "What are the buyer's options?", "o": ["The buyer must sue for specific performance.", "The buyer must wait until June before taking any action.", "The buyer may only claim damages after June.", "The contract is automatically terminated.", "The buyer may accept the anticipatory repudiatory breach, terminate and sue immediately, or affirm the contract."], "a": "E", "x": ["Wrong. Specific performance is a discretionary remedy and not the only option.", "Wrong. The buyer need not wait.", "Wrong. The buyer may sue at once if it accepts the repudiation.", "Wrong. The innocent party must choose; termination is not automatic.", "Correct. An anticipatory repudiatory breach gives the non-breaching party the same rights as a repudiatory breach: to accept it, terminate and claim damages, or affirm the contract."]}, {"ch": 8, "n": 10, "sc": ["A builder agrees to build a house for a lump sum payable on completion. He completes the house, but there are minor defects costing £200 to fix on a £100,000 contract."], "st": "Which of the following best describes the builder's position?", "o": ["The builder can recover nothing because the contract is entire.", "The builder can recover only a reasonable sum for the materials.", "The builder can recover the contract price less the cost of remedying the defects, under the doctrine of substantial performance.", "The builder can recover the full price with no deduction.", "The contract is frustrated."], "a": "C", "x": ["Wrong. Substantial performance is an exception to the entire obligations rule.", "Wrong. The builder can recover the price less the cost of remedying the defects.", "Correct. Where performance is substantial and the defects are minor, the builder can recover the price less the cost of putting the defects right.", "Wrong. The cost of the defects is deducted.", "Wrong. Nothing has made performance impossible."]}, {"ch": 9, "n": 1, "sc": ["A contractor agrees to build a house for a woman. In breach of contract, the contractor's work on the house's foundations is slightly defective. Specifically, the defect in the foundations causes some of the plasterwork in the house to crack slightly. However, the evidence shows that the cracks are only minor and cosmetic, and that there is no significant damage to the house, and the woman can use the house to live in, which was her intention when she commissioned the builder to build the house."], "st": "In a claim for breach of contract, which of the following measures of damages is the court most likely to award?", "o": ["Nominal damages.", "Difference in value.", "Mental distress.", "Cost of cure.", "Loss of profit."], "a": "B", "bx": "The correct answer was B. The aim of damages under English law is to compensate the injured party for their loss. Since the house can still be used for the intended purpose, the most likely measure of damages is the difference in value between what was contracted for and what was received. Option C is incorrect because as a general rule, damages for mental distress are not recoverable under English law. They can be recovered as an exception to the general rule where the whole object of the contract is to provide pleasure, relaxation and peace of mind, but there is no evidence in the scenario of this. Option D is incorrect because the house can still be used as intended, so the damages to cure the defect by changing the foundations appears to be wholly disproportionate to the disadvantage of having some cracks in the plasterwork. Option E is incorrect because there is no evidence in the scenario that the woman intended to make a profit on the house; we are told that she intended to live in the house. Option A is incorrect because nominal damages are awarded where the injured party has not suffered any loss despite a breach of contract. In this case, the woman has suffered the loss of receiving a house with cracks in the plaster."}, {"ch": 9, "n": 2, "sc": ["A production company enters into a contract with an actor to make a film. The production company spends money on designs, props and consultants in preparation for the film. In breach of contract, the actor pulls out of the film six days before filming is due to start. The production company cannot find a replacement and abandons the film project."], "st": "In a claim for breach of contract, which of the following measures of damages is the court most likely to award?", "o": ["Nominal damages.", "Liquidated damages.", "Mental distress.", "Loss of profit.", "Wasted expenditure."], "a": "E", "bx": "The correct answer was E. The measure of profit that will be generated by a film is likely to be too uncertain to serve as a measure for damages. In such scenarios, the only certain way of determining what the injured party has lost due to the breach is to look at the expenses it has incurred preparing for the contract and to award it damages in this amount to compensate it for its loss. This lack of certainty as to the measure of lost profit means that Option D is incorrect. Option A is incorrect because nominal damages are only awarded if the injured party has not suffered any loss. Option B is incorrect because liquidated damages are awarded on the basis of a liquidated damages clause and the scenario does not refer to one. Option C is incorrect because this exceptional ground for the award of damages does not apply to companies."}, {"ch": 9, "n": 3, "sc": ["A woman books a package holiday that is described as 'an idyllic tranquil beach resort in a green paradise with a wide range of water sports available and equipment to hire. There will be delicious French food on offer. Every evening, local people will perform traditional French folk songs to entertain the numerous guests at the resort'.", "The woman books a week-long stay at the resort. When the woman arrives at the resort, she finds that the resort is set on an artificial beach that is 20 miles from the sea, and there is just sand and rock, but no greenery. The only water activity offered is an inflatable paddling pool. The woman is the only guest and the menu every night is curry and chips. There is only one evening of entertainment, when the barman", "plays a CD with French techno music. The woman is distressed, but stays in the resort for the week anyway."], "st": "Which of the following statements best represents the woman's legal position?", "o": ["The woman cannot claim damages because English law does not award damages for disappointment.", "The woman cannot claim damages because she stayed at the resort and used its facilities.", "The woman can claim damages for the cost of the holiday.", "The woman can claim damages for the cost of the holiday and an additional amount to compensate her for her loss of enjoyment.", "The woman can claim damages to compensate her for her loss of enjoyment, but not for the cost of the holiday because she stayed at the resort for a week and used its facilities."], "a": "D", "bx": "The correct answer was D. This means that Options C and E are incorrect. Option A is incorrect because although the general rule under English law is that damages are not awarded for distress, there is an exception in the case of a holiday where the major object of the contract is to provide relaxation and enjoyment. Option B is incorrect. The fact that the woman stayed at the resort for the anticipated time does not undermine her ability to claim."}, {"ch": 9, "n": 4, "sc": ["A company commissions a baker to bake 100 pies for its office party for an agreed total price of £1,000. On the day of the office party, the company decides to cancel the office party and to cancel its order for the pies. But when the company tells the baker that it no longer wants to buy the pies, the baker has already baked the pies. The baker's shop was open, but the baker decided to donate the pies to a homeless charity, and to focus on selling his usual range of bread from his shop. When the baker claims damages of £1,000 from the company as compensation for loss, the company refuses to pay and argues that the damages should be lower."], "st": "Which of the following statements best represents the company's legal position?", "o": ["The company is not correct because although the baker is under a duty to take reasonable steps to minimise his loss, it is not reasonable to expect the baker to sell pies in addition to bread.", "The company is correct because the baker is under a duty to take reasonable steps to minimise his loss and could have done so by selling the pies in his shop.", "The company is not correct because it must pay the baker damages to put the baker in the position it would have been in if the contract had been performed.", "The company is not correct because, as it was the company that breached the contract, it is legally bound to compensate the injured party for any loss that results from its breach.", "The company is correct because the aim of damages is to put the injured party in the position it would have been in if the contract had never been made. As a result, the baker can only claim for the cost of his ingredients."], "a": "B", "bx": "The correct answer was B. The injured party is under a duty to mitigate their loss by taking reasonable steps. Based on the information in the scenario, it seems reasonable for a baker to sell pies in his shop. This means that Option A is not correct. Option C is not correct because although it correctly states the aim of damages for breach of contract, it leaves out the requirement for the injured party to take reasonable steps to mitigate their loss. Option D is not correct for the same reason as in Option C. In addition, be wary of such a broad description of a party's obligation to compensate the injured party because it leaves out the important limitations on the ability to claim damages, namely causation and remoteness. Option E is not correct because the aim of damages for breach of contract is to put the injured party in the position they would have been in if the contract had been performed, rather than, as stated, as if the contract had never been made."}, {"ch": 9, "n": 5, "sc": ["A bank grants a loan to a bakery. The bakery's parent company agrees orally to act as surety and indemnify the bakery's debt to the bank. Subsequently, the loan agreement between the bank and the bakery is held to be unenforceable."], "st": "Which of the following statements best describes the bank's legal position?", "o": ["The bank cannot claim repayment of the debt from the bakery's parent company because the indemnity was oral, and it must be in writing to be enforceable.", "The bank cannot claim repayment of the debt from the bakery's parent company because the loan agreement to which the indemnity relates is unenforceable.", "The bank can claim repayment of the debt from the bakery's parent company because the indemnity remains in force despite the loan agreement being unenforceable.", "The bank can claim repayment of the debt from the bakery's parent company because indemnities do not need to be in writing.", "The bank can claim repayment of the debt from the bakery's parent company only after trying to recover the debt from the bakery."], "a": "C", "bx": "The correct answer was C. This is because an indemnity is a separate primary obligation from the bakery's obligation to repay the bank. As such, the parent company's indemnity remains in force, despite the related loan agreement being unenforceable. Option D is incorrect because although it is correct that indemnities do not need to be in writing, the description of the legal position is incomplete because it does not refer to the indemnity as a primary obligation of the bakery's parent company. Option A is incorrect because an indemnity does not need to be in writing (the writing requirement applies to a guarantee). Option B is incorrect because the indemnity is a separate primary obligation that remains in force even if the underlying loan agreement is unenforceable. Option E is incorrect as there is no requirement for the bank to try to recover its money from the bakery before it seeks repayment from the bakery's parent company. This is because the indemnity is a separate and primary obligation."}, {"ch": 9, "n": 6, "sc": ["A contractor delivers a boiler to a laundry five months late. The laundry loses ordinary profits and also an exceptionally lucrative government contract, which the contractor did not know about."], "st": "Which losses can the laundry recover?", "o": ["Only the government contract loss, because it was larger.", "Only the ordinary profits, because the government contract loss was not within the parties' reasonable contemplation.", "Neither, because lateness is not a breach.", "Both, because they were caused by the breach.", "Both, if the laundry mitigated its loss."], "a": "B", "x": ["Wrong. The unusual loss is too remote.", "Correct. A loss is recoverable only if, when the contract was made, it was within the parties' reasonable contemplation as the probable result of breach (Victoria Laundry).", "Wrong. Late delivery is a breach.", "Wrong. Losses that are too remote are not recoverable.", "Wrong. Miti
