<script>
const D={"t": ["Offer and acceptance", "Consideration", "The intention to create legal relations, certainty and capacity", "Privity of contract and rights of third parties", "Contents of a contract 1: Sources and interpretation", "Contents of a contract 2: Exemption clauses and unfair terms", "Misrepresentation", "Mistake, duress, undue influence and illegality", "The discharge of contracts", "Remedies"], "q": [{"ch": 0, "n": 1, "sc": ["A goat escapes from the zoo. The zookeeper offers a reward of £100 in the local paper to the first person to return the goat to the zoo. A man does not see the notice, but finds the goat on his morning walk and takes the goat to the zoo. The zookeeper tells the man that he is the first person to return the goat to the zoo and the zookeeper thanks the man with a chocolate bar. Later that day, the man's colleague tells him about the notice for a reward in the newspaper."], "st": "Which one of the following statements most accurately describes the legal position of the parties?", "o": ["The zookeeper is not obliged to pay the man the £100 reward because the man did not claim the reward when he returned the goat to the zoo.", "The zookeeper is obliged to pay the man the £100 reward because the man accepted the zookeeper's offer by exactly performing the specified actions.", "The man can only claim the reward of £100 if he was aware of the advertisement when he brought the goat to the zoo.", "By accepting the chocolate bar, the man accepted alternative performance by the zookeeper of the reward and is estopped from claiming the £100.", "The man's act of returning the goat amounts to acceptance of a unilateral offer so it is irrelevant whether or not he knew of the advertisement when he performed the act."], "a": "C", "bx": "The correct answer was C. It is a key requirement of an acceptance that the person purporting to accept the offer is aware of the offer. This means that Option E is incorrect. Option A is incorrect because if the party who performs the unilateral act is aware of the offer, they will be entitled to claim the reward, even if they do not claim it immediately. Option B is also incorrect because the person who purports to accept an offer must be aware of it. Option D is incorrect because the man is not aware of the offer so is not entitled to the reward of £100. If the man had been aware of the offer, he would still be able to claim the reward of £100, despite having been given a chocolate bar."}, {"ch": 0, "n": 2, "sc": ["A supplier is negotiating the sale of apples with a customer. The supplier writes an email to the customer on Friday morning to offer the customer 10 tons of apples for £2,000. The supplier says that she will start delivering apples as soon as the customer accepts the offer. The customer telephones the supplier to confirm that she accepts her offer. The telephone line is bad and the supplier cannot hear what the customer says and asks the customer to repeat her message. The customer repeats her message and then the telephone cuts out. The supplier did not hear the message the first time or the second time."], "st": "Which of the following statements best describes the legal position in the case?", "o": ["The customer's acceptance has created a binding contract so the supplier must start delivering apples to the customer in accordance with the terms of their agreement.", "The supplier is responsible for calling the customer back and checking what she said.", "It is the customer's responsibility to ensure that the supplier hears her acceptance.", "Given that the customer has tried two times to tell the supplier that she accepts her offer, the supplier will be in breach of contract if she does not deliver the apples to the customer as soon as possible.", "It was the supplier's fault that she did not hear the customer's acceptance of her offer so she must take the consequences of this."], "a": "C", "bx": "The correct answer was C. This is because in this bilateral offer scenario, an offeree (the customer) must communicate acceptance for it to be effective. Since the offeree's (the customer's) communication is by telephone, it is the offeree's responsibility to ensure that the offeror (the supplier) hears the acceptance. This means that Option A is incorrect. A binding contract has not been formed because the customer has not communicated acceptance to the supplier. Option B is also incorrect because it is the offeree's responsibility to communicate acceptance. Option D is incorrect because no contract has been formed. Option E is incorrect as there is nothing in the fact pattern to indicate that it is the supplier's fault that the line is bad, and in any event, it is the offeree's (the customer's) responsibility to communicate acceptance, and she has not done this."}, {"ch": 0, "n": 3, "sc": ["A man sends a letter by Royal Mail to a colleague in which he offers to sell her his bicycle for £500 provided he hears back from her in two days. The colleague writes back saying that she will buy the bicycle for £400 and she posts her letter by Royal Mail within two days."], "st": "Which one of the following statements is the most accurate reflection of the legal position?", "o": ["Provided the colleague put the correct address on the letter, the contract is formed when she posts it with Royal Mail.", "The colleague's letter amounts to a counter-offer that destroys the man's offer.", "The colleague's letter is a unilateral offer that the man can accept by conduct.", "Pursuant to the postal acceptance rule a contract between the colleague and the man is formed at the moment that the colleague posts the letter back to the man.", "The colleague's communication was an enquiry as to flexibility in payment terms so the man's offer remains open for the colleague to accept."], "a": "B", "bx": "The correct answer was B. This is because the colleague's response to the man clearly shows that she wishes to buy the bicycle for £400, rather than for the £500 in the offer. This is a counter-offer, which destroys the original offer so that it can no longer be accepted. This lack of symmetry between the offer and the purported acceptance means that there is no agreement between the offeror (the man) and the offeree (the colleague) so there can be no binding contract. This also means that Options A and D are incorrect. Option C is incorrect because the colleague's counter-offer is a bilateral offer, not a unilateral offer. Option E is incorrect because the colleague's communication is an offer to buy the bicycle at a different price from the one originally offered (a counter-offer), rather than an enquiry as to whether payment of the £500 could be paid in instalments, which would be an example of an enquiry as to flexibility in payment terms."}, {"ch": 0, "n": 4, "sc": ["A lawyer is walking through the town centre when she meets her friend, a shopkeeper. The shopkeeper tells the lawyer that she rents her shop from an insurance company and that she is worried because the insurance company recently demanded 50% more rent each year In a panic, the shopkeeper sent a letter by post to the insurance company offering to pay 45% more per year, but after checking her finances, the shopkeeper has discovered that she cannot afford to pay 45% more per year."], "st": "Which of the following most accurately describes the legal position?", "o": ["The lawyer (on behalf of the shopkeeper) should immediately telephone the insurance company to tell them that the shopkeeper has revoked her offer to pay a 45% increase. This will prevent the insurance company from accepting the shopkeeper's offer to form a binding contract.", "The shopkeeper should revoke her offer to the insurance company immediately by sending a letter by courier to the insurance company to ensure that it does not accept the shopkeeper's offer of a 45% increase to form a binding contract.", "The shopkeeper was bound by her offer to the insurance company from the moment she posted her letter.", "The shopkeeper should revoke her offer to the insurance company by post because the postal acceptance rule provides that a message in a letter is effective from the moment it is posted in a Royal Mail postbox, regardless of whether or not the addressee receives it.", "The shopkeeper should send a letter to the insurance company to investigate whether the insurance company would be prepared to accept a smaller increase in annual rent."], "a": "A", "bx": "The correct answer was A. This is because the shopkeeper's communication to the insurance company was an offer, and an offer can be revoked before it is accepted. A communication of revocation to the offeree is effective regardless of whether it is made by the offeror or by a third party. The third party in this case is the lawyer. Watch out for the postal acceptance rule because it only applies to acceptances, and it is clear that the shopkeeper's offer to the insurance company to pay a 45% increase is an offer. Option B is incorrect because the shopkeeper's revocation will only be effective when it is received by the insurance company. Since delivery by courier is not immediate, it presents the risk that the insurance company can still accept the shopkeeper's offer before the courier delivers the revocation. Option C is incorrect because an offer can be revoked before it is accepted. Option D is incorrect because the postal acceptance rule only applies to acceptances, and not to revocations. Option E is incorrect because the shopkeeper wishes to withdraw her offer before the insurance company accepts it."}, {"ch": 0, "n": 5, "sc": ["On Monday, a man advertises his computer for sale in a trade magazine with the following words 'LENOVO IdeaPad Flex 5 13.3' for £200. I will sell to the first person who brings £200 to my office at 1 Oxford Street by 1 pm this Friday'. On Tuesday, the man changes his mind and decides to revoke his advertisement. The man cannot find the telephone number for the magazine so he places a notice in a national newspaper and the notice is published on Wednesday morning."], "st": "To which one of the following persons is the man obliged to sell his computer?", "o": ["On Friday, a woman, having seen the advert on Monday, brings £200 to the man's office at 11:00 am.", "On Friday, a student, having seen the advert on Monday, arrives at the man's office at 10:15 am and offers him £190 for the computer.", "On Friday, a programmer, having seen the advert on Monday, arrives at the man's office at 1:05 pm and asks whether he will accept £200 for the computer payable in four monthly instalments of £50.", "On Friday, an accountant, having seen the advert on Monday, arrives at the man's office at 11:30 am with £200.", "The man is not obliged to sell the computer to any person."], "a": "A", "bx": "The correct answer was A. This is because the man made a unilateral offer and the woman accepted through her conduct. Although the man tried to revoke his unilateral offer, he did not do so effectively because the revocation of a unilateral offer needs to be given the same 'notoriety' as its advertisement. On the basis that the man's initial advertisement was in a trade magazine, and his attempt at revocation was published in a national newspaper, it is clear that his revocation was not given the same notoriety as the initial advertisement. The readership of the magazine and the national newspaper will not be the same. This means that Option E is incorrect. Option B is not correct because the student makes a counter-offer to the man that destroys the man's offer so that a contract is not formed. Option C is not correct because the programmer arrives after the deadline to accept the offer and he has not brought £200, so the programmer has not performed the act required to accept the unilateral offer. Option D is incorrect because the accountant is not the first person to arrive at the man's office within the specified time frame. The first person arrived at 11 am and accepted the offer. So there was no offer open to accept when the accountant arrived at 11:30 am."}, {"ch": 0, "n": 6, "sc": ["A shop displays a designer handbag in its window with a price label of £50. The label is a mistake; the bag should have been priced at £500. A customer enters the shop, puts £50 on the counter and says she accepts the shop's offer. The shop refuses to sell the bag."], "st": "Which of the following best describes the legal position?", "o": ["The display was a unilateral offer accepted by the customer's conduct.", "The shop is bound unless it can prove the mistake was not its fault.", "The shop is bound because the price label is a term of the contract.", "The display was an invitation to treat; the customer made an offer, which the shop was free to reject.", "The display was an offer, which the customer accepted by tendering £50."], "a": "D", "x": ["Wrong. A shop display is not a unilateral offer.", "Wrong. No contract has been formed, so fault is irrelevant.", "Wrong. No contract, and therefore no terms, exist until the shop accepts the customer's offer.", "Correct. Goods displayed for sale are an invitation to treat. The customer makes the offer, which the shop may accept or reject, so no contract has been formed.", "Wrong. A display of goods with a price is generally an invitation to treat, not an offer."]}, {"ch": 0, "n": 7, "sc": ["A seller offers to sell a machine for £10,000. The buyer replies, 'Would you accept payment in two instalments?' Before the seller responds, the buyer writes again to accept the offer of £10,000 in full."], "st": "Which of the following best describes the legal position?", "o": ["The seller must agree to instalment payments.", "The buyer's first reply was an acceptance subject to a condition.", "The buyer's first reply was a counter-offer that destroyed the original offer.", "No contract exists because the buyer's acceptance was not on the same terms as the offer.", "The buyer's first reply was a request for information, so the original offer remained open and has been accepted."], "a": "E", "x": ["Wrong. The seller never agreed to instalments.", "Wrong. The first reply was a question, not an acceptance.", "Wrong. An enquiry about flexibility in payment terms does not propose new terms, so it is not a counter-offer.", "Wrong. The acceptance matches the original offer exactly.", "Correct. An enquiry about flexibility in payment terms is a request for information, which leaves the offer open, so the buyer can still accept it."]}, {"ch": 0, "n": 8, "sc": ["A farmer writes to a buyer offering to sell her tractor for £8,000 and adds: 'If I hear nothing from you by Friday, I will assume that you accept.' The buyer decides to buy the tractor but does not reply."], "st": "Which of the following best describes the legal position?", "o": ["A contract was formed under the postal acceptance rule.", "No contract was formed because silence cannot amount to acceptance.", "No contract was formed because the offer was a unilateral offer.", "A contract was formed on Friday because the buyer did not reply.", "A contract was formed because the buyer had decided to buy."], "a": "B", "x": ["Wrong. Nothing was posted by the buyer.", "Correct. Silence cannot amount to acceptance. An offeror who says she will assume acceptance unless she hears otherwise creates no binding contract if the offeree does not respond.", "Wrong. This was a bilateral offer requiring communicated acceptance.", "Wrong. An offeror cannot impose silence as a mode of acceptance.", "Wrong. An uncommunicated decision is not acceptance."]}, {"ch": 0, "n": 9, "sc": ["A supplier sends a buyer a quotation on its standard terms. The buyer replies with a purchase order on its own standard terms, which conflict with the supplier's. The supplier then delivers the goods without further comment."], "st": "Which terms are most likely to govern the contract?", "o": ["The buyer's terms, because the buyer's order was the last set of terms sent before performance began.", "Neither party's terms; the contract is void for uncertainty.", "The supplier's terms, because the supplier made the first offer.", "The terms implied by statute only.", "A combination of both sets of terms, chosen by the court."], "a": "A", "x": ["Correct. In a battle of the forms the general rule is that the 'last shot' prevails: the last set of terms sent before the other party starts to perform applies. The supplier accepted the buyer's counter-offer by delivering the goods.", "Wrong. A contract was formed by conduct.", "Wrong. The first set of terms does not prevail in a battle of the forms.", "Wrong. Express terms were agreed by conduct.", "Wrong. The courts do not mix and match conflicting standard terms."]}, {"ch": 0, "n": 10, "sc": ["A company emails a business an acceptance of its offer at 9 pm on a weekday, outside business hours. The offeror reads the email the next morning at 9 am."], "st": "When is the acceptance most likely to take effect?", "o": ["When the email reaches the offeror's server, whatever the time.", "At the start of the following working day.", "Never, because emails cannot be used to accept offers.", "When the offeror replies to confirm receipt.", "When the email was sent at 9 pm."], "a": "B", "x": ["Wrong. A message received outside business hours is treated as received the next working day.", "Correct. An acceptance by email is generally effective on receipt. If it arrives outside business hours, it is treated as received at the start of the following working day.", "Wrong. Email is a valid method of acceptance.", "Wrong. No confirmation of receipt is required.", "Wrong. The postal rule does not apply to emails; the general receipt rule applies."]}, {"ch": 1, "n": 1, "sc": ["An artist agrees on Monday to sell a painting to a woman for a basket of apples, with delivery of the painting and payment in apples to be made on Friday. On Tuesday, the artist receives an offer of £200 for the same painting from a man. Later on Tuesday, the artist tells the women that he no longer wishes to sell the painting to her because he was mistaken about the value of the painting."], "st": "Which of the following best describes the artist's situation?", "o": ["The artist is bound by his agreement to sell the painting to the woman because sufficient consideration has been promised.", "The artist is not bound by his agreement to sell the painting to the woman because the consideration is not adequate.", "The artist is not bound by his agreement to sell the painting to the woman because she has not provided any consideration to make the agreement legally binding.", "The artist is bound by his agreement to sell the painting to the woman on the basis of promissory estoppel.", "The artist is not bound by his promise to sell the painting to the woman because the consideration is not effective until the apples have been delivered."], "a": "A", "bx": "The correct answer was A. This is because sufficient consideration has been promised. Remember that even though the artist and the woman have only made promises to each other, an exchange of promises is consideration because each promisor makes themselves liable to be sued if they do not deliver what is promised. Option B is incorrect because consideration does not need to be adequate (the economic equivalent of what it is exchanged for). Option C is incorrect because the woman's promise to deliver a basket of apples is consideration because the woman can be sued for failing to deliver on her promise. Option D is incorrect because promissory estoppel only applies to amendment agreements to pay less, so it is not relevant here. Option E is incorrect because the artist and the woman have exchanged promises, which makes each party liable to deliver what is promised to the other."}, {"ch": 1, "n": 2, "sc": ["A woman offers to help a man with work in the garden centre. After the woman has worked all day in the garden centre, the man tells her that he will pay her £100 for her work. The man never pays the woman £100."], "st": "Which of the following best describes the legal position in this case?", "o": ["The man is bound by his promise to the woman as she provided consideration by working in the garden centre.", "The man is not bound by his promise to the woman because the woman's work in the garden centre is past consideration.", "The man is not bound by his promise to the woman because £100 for a day's work in the garden centre is not adequate.", "The man is bound by his promise to the woman, provided the woman can show that she relied on the man's promise.", "The man is bound by his promise to the woman because the practical benefit that he gained as a result of the woman's work is consideration to make the promise binding."], "a": "B", "bx": "The correct answer was B. This is because an act followed by a promise is past consideration. Past consideration is not consideration and does not make a promise legally binding. Option A is incorrect because the woman did not provide consideration for the promise. As her act was performed before the promise, exchange as a key element of consideration is missing. Option C is incorrect because consideration does not need to be adequate. Option D is incorrect because reliance is not relevant to the existence of consideration, reliance is a key aspect of promissory estoppel, which is not relevant to this scenario. Option E is incorrect because practical benefit as consideration applies to amendment promises to pay more, which is not relevant to this scenario."}, {"ch": 1, "n": 3, "sc": ["A woman commissions a man to refit the bathrooms in a hotel that she is refurbishing under a contract that pays the man £2,000 per bathroom refit. The woman is responsible for all other aspects of the refurbishment, but she will be liable to pay damages to the owner of the hotel if any aspect of the refurbishment (including the refit of the bathrooms) is not complete before the deadline. The man who is refitting the bathrooms is running behind schedule because he is concerned about his financial situation. As a result, the woman offers the man an additional £500 per bathroom refit. The man is able to focus on this work, refits the bathrooms on time, and the woman finishes her refurbishment of the hotel on time and avoids paying damages to the hotel owner."], "st": "Which of the following best describes the woman's position with regard to her promise to pay the man an additional £500 per bathroom refit?", "o": ["The woman is not bound by her promise to pay the additional amount because the man's performance of his existing contractual duty is not consideration to make the amendment to the original contract binding.", "The woman is not bound by her promise to pay the additional amount to the man because she only offered to pay the man an additional amount under duress, and duress renders the contract voidable.", "The woman is bound by her promise to pay the additional amount to the man because she received a practical benefit as a result of the additional payment because the man finished his work on time, meaning the woman avoided paying damages to the hotel owner for the late completion of the hotel refurbishment.", "The woman is bound by her promise to pay the additional amount on the basis of promissory estoppel.", "The woman is bound by her promise to pay the additional amount because the man's performance of his existing contractual duty amounts to the performance of an existing contractual duty owed to a third party and English law treats this as consideration."], "a": "C", "bx": "The correct answer was C. This is because practical benefit is consideration in respect of amendments to existing contracts to pay more. It is also for this reason that option A cannot be correct. Option B is incorrect because there is no evidence of duress to force the woman to offer the man more money. Option D is incorrect because promissory estoppel only applies to amendment promises not to enforce rights, so it is not relevant in this scenario. Option E does not apply because the contract is between the man and the woman. The man does not owe a duty to a third party."}, {"ch": 1, "n": 4, "sc": ["A man owes a woman £10,000 and it is due for payment. The man tells the woman that it will be difficult for him to repay £10,000 and he asks the woman to accept £8,000 in full and final settlement of the £10,000 that he owes her. The woman tells the man that she agrees to accept £8,000 in full and final settlement of the £10,000 that the man owes her. The man pays the woman £8,000. The woman later regrets her decision and is considering suing the man for the deficit of £2,000."], "st": "Is the woman able to sue the man for the £2,000 deficit?", "o": ["No, the woman has agreed to accept £8,000 in full and final settlement of the claim and the man's payment of £8,000 is consideration to make the woman's promise binding.", "No, the woman has received a practical benefit as a result of the man voluntarily paying her the £8,000. Practical benefit is consideration and makes a promise binding.", "Yes, the woman can sue the man for the £2,000 on the grounds that the man provided no consideration for the woman's agreement to accept less than the full amount.", "Yes, the woman can sue the man for the £2,000 on the grounds that the man put the woman under duress to accept the lesser amount.", "No, the woman cannot sue the man for the £2,000 on the grounds that she agreed to accept £8,000, and consideration does not need to be adequate, provided it is sufficient."], "a": "C", "bx": "The correct answer was C. This is because the payment of a lesser amount than is owed under an original contract is not consideration. Option A is incorrect for the same reason. Option B is incorrect because English law does not recognise practical benefit as consideration for promises to pay less. Option D is incorrect because there is no evidence of a threat or pressure, which is a key element of duress. Option E is incorrect because the acceptance of less than is owed under a contract does not constitute consideration."}, {"ch": 1, "n": 5, "sc": ["A woman takes out a lease on a small hotel for £100,000 per year. But within two years, the woman faces financial difficulties because she has no guests as a result of lockdowns related to a global outbreak of bubonic plague. The owner of the hotel and the woman agree that she can reduce her annual rent for the hotel to £50,000. The woman continues to rent the hotel. Six months after the hotel owner and the woman agree on the reduced rent, the hotel owner is short of cash and wonders if he is bound by his agreement with the woman."], "st": "Which of the following best describes the options available to the hotel owner?", "o": ["The hotel owner can sue the woman for the full amount of rent because the woman did not provide any consideration for the reduction in rent.", "The hotel owner cannot sue the woman for the full amount of rent because the agreement is binding on the basis of the practical benefit that the hotel owner received as a result of the woman continuing to rent the hotel.", "The hotel owner can sue the woman for the full amount of rent because a rental payment of £50,000 in place of £100,000 is not adequate.", "The hotel owner cannot sue the woman for the full amount of rent because of the doctrine of promissory estoppel.", "The hotel owner cannot sue the woman for the full amount of rent because the woman has provided consideration that is sufficient."], "a": "D", "bx": "The correct answer was D. Promissory estoppel is a defence in respect of amendment agreements against a promisor who agrees to accept less than they are owed and then tries to go back on their word. The applicable criteria are satisfied by the clear and unambiguous promise from the hotel owner that he will not enforce his rights under the contract, by the reliance of the woman in continuing to rent the hotel, and by the fact that it would be inequitable (unfair) for the promisor to go back on his word. Option A is incorrect: although it is correct to recognise that there is no consideration, a lack of consideration is precisely the scenario in which promissory estoppel applies as a defence. Option B is incorrect because practical benefit as consideration only applies in respect of promises to pay more, rather than promises to pay less. Option C is incorrect because consideration does not need to be adequate. Option E is incorrect: paying less than originally agreed is not consideration."}, {"ch": 1, "n": 6, "sc": ["A man promises to pay his neighbour £500 if the neighbour repaints the man's fence. The neighbour repaints it. The man then refuses to pay, arguing that £500 is far more than the job was worth."], "st": "Which of the following best describes the legal position?", "o": ["The man is not bound because the painting is past consideration.", "The man is bound only under promissory estoppel.", "The man is bound because consideration must be sufficient but need not be adequate.", "The man is bound only for a reasonable sum.", "The man is not bound because the consideration is not adequate."], "a": "C", "x": ["Wrong. The work was done in exchange for an earlier promise, not before it.", "Wrong. Promissory estoppel is not relevant; there is valid consideration.", "Correct. Consideration must be sufficient but need not be adequate. The neighbour did what the man requested in exchange for his promise.", "Wrong. The court will not rewrite the agreed price.", "Wrong. Consideration need not be the economic equivalent of the promise."]}, {"ch": 1, "n": 7, "sc": ["A police officer recovers a stolen car while on duty, as she is required to do by law. The owner had promised a reward of £200 to anyone recovering the car. The officer claims the reward."], "st": "Which of the following best describes the officer's position?", "o": ["She is entitled to the reward because she performed the act requested.", "She is not entitled to the reward because performing an existing legal duty is not consideration.", "She is not entitled to the reward because the owner's promise was a gift.", "She is entitled to the reward under promissory estoppel.", "She is entitled to the reward because consideration need not be adequate."], "a": "B", "x": ["Wrong. Doing what she was already legally obliged to do is not consideration.", "Correct. The performance of a legal duty is not consideration: if a person does what they are already obliged to do by law, that act cannot support a promise.", "Wrong. The issue is lack of consideration, not the nature of the promise.", "Wrong. Promissory estoppel concerns promises not to enforce existing rights.", "Wrong. The problem is not adequacy but that there is no consideration at all."]}, {"ch": 1, "n": 8, "sc": ["A contractor is already obliged under a contract with a developer to finish a building. A tenant who wants to move in early promises the contractor £5,000 if he finishes the building on time. The contractor finishes on time."], "st": "Is the tenant bound by her promise?", "o": ["No, because the contractor was already obliged to finish the building.", "Yes, but only under promissory estoppel.", "Yes, because performing an existing contractual duty owed to a third party is good consideration.", "No, because the tenant is not a party to the building contract.", "No, because the consideration is past."], "a": "C", "x": ["Wrong. A duty owed to someone else can be consideration for a new promise.", "Wrong. There is consideration, so estoppel is unnecessary.", "Correct. Performing an existing contractual duty owed to a third party is good consideration for a promise from a new promisor.", "Wrong. The tenant has made her own promise, which the contractor accepted by performing.", "Wrong. The work was done after, and in exchange for, the promise."]}, {"ch": 1, "n": 9, "sc": ["A landlord agrees, during a temporary crisis, to accept half rent from a tenant. The tenant relies on this. When the crisis ends, the landlord gives reasonable notice that full rent will be payable from now on."], "st": "Which of the following best describes the effect of promissory estoppel?", "o": ["The landlord can resume charging full rent for the future on giving reasonable notice.", "The landlord can recover the arrears for the whole crisis period.", "The landlord can never recover full rent.", "Promissory estoppel does not apply to rent.", "The tenant can sue the landlord for breach of his promise."], "a": "A", "x": ["Correct. Promissory estoppel is a defence that prevents the promisor going back on a promise to accept less where it would be inequitable. It does not stop him resuming his full rights for the future on reasonable notice.", "Wrong. It would be inequitable for the landlord to go back on his promise for the period already relied on.", "Wrong. Promissory estoppel generally suspends rights rather than extinguishing them for the future.", "Wrong. Promissory estoppel can apply to promises to accept less rent.", "Wrong. Promissory estoppel is a shield, not a sword."]}, {"ch": 1, "n": 10, "sc": ["A builder agrees to build an extension for £20,000. Halfway through, he says he will stop unless he is paid an extra £5,000. No practical benefit would arise for the owner, who will simply receive what she was already entitled to."], "st": "Is the owner bound by her promise to pay the extra £5,000?", "o": ["No, because promises to pay more can never be binding.", "Yes, because consideration need not be adequate.", "Yes, under promissory estoppel.", "No, because the builder provided no consideration and there is no practical benefit.", "Yes, because promises to pay more are always binding."], "a": "D", "x": ["Wrong. Promises to pay more can be binding where there is a practical benefit.", "Wrong. The problem is that there is no consideration at all.", "Wrong. Promissory estoppel applies to promises to accept less, not to pay more.", "Correct. Performing an existing contractual duty owed to the promisor is not consideration unless the promisor obtains a practical benefit. There is none here, and the builder's threat may also suggest duress.", "Wrong. A promise to pay more needs consideration, such as a practical benefit."]}, {"ch": 2, "n": 1, "sc": ["A man is about to marry a very wealthy woman. The man and the woman sign a prenuptial agreement that provides that the woman's assets shall remain the woman's assets after the man and the woman get married. The man and the woman get married, but a year later they have separated and file for divorce."], "st": "Which of the following best describes the man's legal position towards the woman's assets under the prenuptial agreement?", "o": ["The man will be able to claim the assets covered by the prenuptual agreement. The prenuptual agreement is not legally binding because it was made in the social and domestic context.", "The man will be able to claim the assets covered by the prenuptual agreement. The prenuptual agreement is not legally binding because it was made in the social and domestic context, and the fact that the woman and man were friendly at the time they made the agreement means that the presumption of no intention to create legal relations cannot be rebutted.", "The man will not be able claim the woman's assets covered by the prenuptual agreement because prenuptual agreements are sufficiently serious to rebut the presumption of no intention to create legal relations.", "The man will be able to claim the woman's assets because the subject matter of the prenuptual agreement is not sufficiently serious to rebut the presumption of no intention to create legal relations.", "The man will not be able to claim the woman's assets because the rebuttable presumption in the social and domestic context only applies to a man and a woman who are married, and not to a man and a woman who are planning to get married."], "a": "C", "bx": "The correct answer was C. This is because prenuptual agreements are enforceable under English law despite being made in the social and domestic context. The scenario tells us that the woman is wealthy and this adds the factor of seriousness to the context, which also helps to rebut the presumption in the social and domestic context. Options A and B are incorrect because they ignore the factors that rebut the presumption in the social and domestic context mentioned above. It is important to note that friendly relations between the agreement parties do not prevent the presumption in the social and domestic context from being rebutted provided the subject matter is sufficiently serious. Option D is incorrect because English law recognises a prenuptual agreement as sufficiently serious to rebut the presumption. Option E is incorrect because the presumption can apply to a man and a woman who are planning to get married."}, {"ch": 2, "n": 2, "sc": ["A mother is on friendly terms with her daughter and wants to motivate her to study law, so she promises that if her daughter gives up her job in New York and studies law in London she will pay her fees, give her an allowance and provide a house for her to live in. The daughter gives up her job in New York and moves to London and starts studying law. The mother pays her daughter's law school fees, buys a house for her daughter to live in, and pays her an allowance. After five years, the daughter is still studying and the mother seeks to reclaim possession of the house."], "st": "Which one of the following statements best describes the legal position of the parties?", "o": ["The mother is bound by her agreement to let the daughter live in the house for as long as it takes the daughter to complete her legal studies.", "The mother is not bound by her agreement to let the daughter live in the house.", "The mother is bound by her agreement to let her daughter live in the house for a reasonable period of time.", "The agreement between mother and daughter is voidable due to lack of certainty.", "The mother is not bound by her agreement to let the daughter live in the house because she was on friendly terms with her daughter when they made the agreement. An agreement made between a mother and daughter on friendly terms will never rebut the presumption in the social and domestic context."], "a": "B", "bx": "The correct answer was B. This is because the agreement was made while the mother and daughter were on friendly terms, which, combined with the lack of certainty as to how long the arrangement was to continue for, means that the presumption is not rebutted. Option A is incorrect because although the detrimental reliance of the daughter and the seriousness of the promise are factors that can rebut the presumption, the lack of certainty as to how long the agreement should last will undermine the effect of these rebutting factors. Option C is incorrect: the agreement is unenforceable as the presumption has not been rebutted. But even if it were enforceable, there is no mention of a reasonable period of time in the mother's agreement with her daughter; and in any event, given the number of years that the daughter has taken for her legal studies, it is at least arguable that a reasonable time frame has already expired. Option D is incorrect: lack of certainty makes an agreement void, not voidable. But in any event, there is insufficient evidence to rebut the presumption of no intention to create legal relations. Option E is incorrect. A mother and daughter can make a legally binding agreement whilst on friendly terms, but there is insufficient evidence to rebut the presumption in this scenario."}, {"ch": 2, "n": 3, "sc": ["An insurance company advertises a new insurance product in the offices of a large network of holiday companies. The advertisement states that any person booking a holiday with any member of the network of holiday companies will be covered for all claims by holiday insurance. A man sees this notice and books a holiday through a member of the network of holiday companies. The man's holiday is cancelled due to a national pandemic making all travel impossible."], "st": "Which of the following best describes the man's rights against the insurance company?", "o": ["The man cannot claim against the insurance company because advertisements are an exception to rebuttable presumption in the commercial context and there is never an intention to create legal relations.", "The man can claim against the insurance company because the advertisement of this kind is a promise of protection to anyone who books a holiday with a member of the network.", "The man cannot claim against the insurance company because he booked his holiday with the holiday company, rather than with the insurance company.", "The man can claim against the insurance company because the rebuttable presumption of the intention to create legal relations is practically impossible to rebut.", "The man cannot claim against the insurance company as this is clearly a gimmick to drum up business and is not intended to create legal relations."], "a": "B", "bx": "The correct answer was B. An advertisement such as this would be viewed by the courts as a binding offer to provide protection to a person who books a holiday with a member of the network. Option A is incorrect. Although it is true to say that some advertisements are gimmicks and do not evidence any intention to be legally bound, it is important to consider each advertisement individually. There is nothing in the scenario to suggest that the expectation of insurance cover is unrealistic or a gimmick. Option C is incorrect because the advertisement will be seen as an offer that the man accepted by booking the holiday, so the man has a claim under the agreement with the insurance company. Option D is incorrect. Although it is true to say that the man can claim against the insurance company, the rebuttable presumption in the commercial context can be rebutted with clear evidence. Option E is incorrect. Although the advertisement's clear aim is to drum up business, the question of whether an advertisement is a gimmick or not needs to be determined on a case by case basis."}, {"ch": 2, "n": 4, "sc": ["A businesswoman agrees to sell her private zoo to a businessman. The price is agreed and the sale agreement is drawn up. But just before the parties sign the agreement, the businesswoman decides that she would like to be able to visit the animals in the zoo from time to time, so she asks if she can change the sale agreement. The businessman refuses this as he does not want to start amending an agreement that is in agreed form. As a result, the businessman and the businesswoman sign a separate document that provides for the businesswoman to be able to visit the animals in the zoo 'at times and subject to conditions to be agreed' by the businessman and the businesswoman."], "st": "Which of the following best describes the rights acquired by the woman under the separate document?", "o": ["Given the lack of certainty in the letter, the woman has only the right to visit the animals in the zoo at reasonable times on weekdays.", "The businesswoman has acquired the right to force the businessman to set out a schedule of visiting times and conditions for her.", "The separate letter needs to be considered as a condition to the sale of the zoo so that if times and conditions for the businesswoman to visit are not agreed, then the businesswoman can elect to set the whole transaction aside and sell the zoo to another party.", "The businesswoman has acquired no rights under the separate document at all.", "The businesswoman has acquired the right to force the businessman to negotiate with her in good faith."], "a": "D", "bx": "The correct answer was D. The separate document is an agreement to agree. Agreements to agree are not enforceable. Options A and B are incorrect as the businesswoman does not acquire any rights under the agreement. Option C is incorrect as the sale of the zoo is provided for under the sale agreement and nothing in the scenario tells you that the sale of the zoo is connected to the subject matter of the separate document. Option E is incorrect. In cases such as these where the separate document does not contain any essential terms, the document cannot be enforced at all."}, {"ch": 2, "n": 5, "sc": ["A 16-year-old schoolgirl goes on a shopping trip to a jewellery shop and buys a diamond tiara and a pearl necklace. The schoolgirl explains to the shop owner that she has left her credit cards at home but she promises to transfer funds to pay for the tiara and the necklace later that day. The schoolgirl fails to transfer the promised funds because she does not have them."], "st": "Which of the following best describes the position of the shop owner?", "o": ["The shop owner can force the schoolgirl to pay a reasonable amount for the tiara and necklace on the grounds that they are necessaries.", "The shop owner has no recourse against the schoolgirl because she is a minor.", "The shop owner can petition the court to order the schoolgirl to return the tiara and necklace to him on the basis that it would be just and equitable to do so.", "The shop owner can reclaim the goods from the schoolgirl on the basis that contracts with minors are void.", "The shop owner is entitled to the return of the goods because the evidence indicates that the schoolgirl was acting in bad faith."], "a": "C", "bx": "The correct answer was C. The court can exercise its discretion to require a minor to return property if it is just and equitable to do so, which would appear to be the case here. Option A is incorrect because there is no evidence to suggest that a diamond tiara and a pearl necklace fit the definition of necessaries for a 16-year-old schoolgirl. Option B is incorrect because it does not describe the situation fully because it fails to take account of the shop owner's recourse under Option C. Option D is incorrect on the basis that contracts with minors are voidable, not void. Option E is incorrect because bad faith is not a factor that provides for remedies against minors."}, {"ch": 2, "n": 6, "sc": ["Two companies sign a detailed supply agreement. A dispute arises and one company argues that it never intended the agreement to be legally binding. Nothing in the agreement deals with intention."], "st": "Which of the following best describes the legal position?", "o": ["Intention is irrelevant in commercial agreements.", "There is a presumption that the parties did not intend to create legal relations.", "There is a rebuttable presumption that the parties intended to create legal relations, and clear evidence is needed to rebut it.", "The court will decide intention by asking each party what it intended.", "The agreement is binding only if it is signed by directors."], "a": "C", "x": ["Wrong. Intention is a requirement, but it is presumed in commercial agreements.", "Wrong. That presumption applies in the social and domestic context.", "Correct. In the commercial context there is a rebuttable presumption that the parties intend to create legal relations, which requires clear evidence to rebut.", "Wrong. Intention is judged objectively.", "Wrong. There is no such rule."]}, {"ch": 2, "n": 7, "sc": ["Two businesses sign a written agreement stating: 'This arrangement is binding in honour only and is not a legal agreement.' One business later sues for breach."], "st": "Which of the following best describes the likely outcome?", "o": ["The claim succeeds because honour clauses are void as against public policy.", "The claim succeeds if the breach caused substantial loss.", "The claim succeeds because commercial agreements are always binding.", "The claim fails because the agreement lacks consideration.", "The claim fails because the express wording rebuts the presumption of an intention to create legal relations."], "a": "E", "x": ["Wrong. The parties may agree that their arrangement is not legally binding.", "Wrong. Loss does not create intention.", "Wrong. The commercial presumption can be rebutted.", "Wrong. The issue is intention, not consideration.", "Correct. Where parties expressly state that they rely only on each other's honour, for example 'binding in honour only', this rebuts the commercial presumption."]}, {"ch": 2, "n": 8, "sc": ["A buyer and seller agree that the seller will supply goods 'at a price to be agreed later'. No price is ever agreed and there is no mechanism to fix one."], "st": "Which of the following best describes the legal position?", "o": ["The arrangement is an agreement to agree, which is not enforceable.", "There is a binding contract at a price set by the court.", "The contract is binding at a price fixed by the seller.", "The contract is binding at the market price.", "The contract is voidable at the buyer's option."], "a": "A", "x": ["Correct. An agreement to agree on an essential term, with no mechanism to fix it, lacks certainty and is not enforceable.", "Wrong. The court will not make the agreement for the parties.", "Wrong. The seller cannot fix the price unilaterally.", "Wrong. Where the parties expressly leave the price to be agreed, the court will not imply a market price.", "Wrong. Lack of certainty makes an agreement void, not voidable."]}, {"ch": 2, "n": 9, "sc": ["A man with a severe mental illness buys an expensive car while suffering an episode. The car dealer knew of his condition. The man later wishes to escape the contract."], "st": "Which of the following best describes the man's position?", "o": ["He can escape the contract only if the dealer acted fraudulently.", "He is bound because adults are always bound by their contracts.", "The contract is automatically void.", "He can escape the contract only if the car is a necessary.", "He can escape the contract if he proves that he lacked mental capacity when he entered into it and that the dealer knew, or ought to have known, of his incapacity."], "a": "E", "x": ["Wrong. Fraud is not required.", "Wrong. Mental incapacity can allow a person to escape a contract.", "Wrong. The contract is not automatically void.", "Wrong. Necessaries concern the price payable; they are not the test for escaping the contract.", "Correct. Two tests must be met: the person must prove they lacked capacity when contracting, and that the other party knew or ought to have known of it."]}, {"ch": 2, "n": 10, "sc": ["A 17-year-old orders a reasonably priced winter coat from a shop, which delivers it. The coat suits her station in life and she has no other winter coat. She refuses to pay."], "st": "Which of the following best describes the shop's position?", "o": ["The shop must ask the court to return the coat.", "The shop cannot recover anything because contracts with minors are void.", "The shop can recover a reasonable price for the coat as a necessary.", "The shop can recover only if the minor ratifies the contract at 18.", "The shop can recover the contract price plus damages."], "a": "C", "x": ["Wrong. The shop may claim a reasonable price for necessaries.", "Wrong. Contracts with minors are not simply void.", "Correct. A minor must pay a reasonable price for necessaries, that is goods suitable to her condition in life and actual requirements at the time.", "Wrong. Ratification is not needed for necessaries.", "Wrong. The obligation is to pay a reasonable price."]}, {"ch": 3, "n": 1, "sc": ["A manufacturer agrees to sell chairs to a dealer at a discounted price on the condition that the dealer will not sell the chairs at less than the fixed price, and that the dealer will require any person to whom it sells the chairs not to sell them at less than the fixed price. The dealer sells the chairs to a discounter in a contract that requires the discounter not to sell at below a fixed price. But the discounter sells the chairs at below the fixed price."], "st": "Which of the following best describes the manufacturer's rights against the discounter?", "o": ["The manufacturer can force the discounter not to sell at a lower price than the fixed price. This is because the manufacturer has a direct contract with the discounter that was made by the dealer, acting as the manufacturer's agent.", "The manufacturer can force the discounter not to sell at a lower price than the fixed price. This is because the manufacturer has a direct collateral contract with the discounter.", "The manufacturer can force the discounter not to sell at lower than the fixed price because English statute law gives third parties rights to enforce contract terms in their favour, unless such rights are excluded.", "The manufacturer cannot force the discounter not to sell at a lower price than the fixed price. This is because although English statute law can give rights to third parties, provided it is not excluded, the required criteria for third party rights to apply have not been satisfied.", "The manufacturer cannot force the discounter not to sell at lower than the fixed price. This is because English statute law requires a third party who seeks to rely on statutory third party rights to provide consideration, and the manufacturer has not provided any consideration."], "a": "D", "bx": "The correct answer was D. When you analyse whether or not a third party can rely on the Contracts (Rights of Third Parties) Act 1999, you must check whether the enforceability criteria have been satisfied. The criteria are set out at s 1 (1) of the Contracts (Rights of Third Parties) Act 1999 and they require that a third party may enforce a term if the contract expressly provides that they may, or if a term in the contract purports to confer a benefit on such person. There is nothing in the scenario to allow us to conclude that the enforceability criteria have been satisfied. Option C is incorrect for the same reasons. Option A is incorrect because there is no evidence in the scenario to suggest that the dealer is the manufacturer's agent, or that the discounter is aware of any agency relationship. Option B is incorrect because there is no evidence of a collateral contract. An example of a collateral contract would be the discounter promising not to sell the chairs at a price lower than a fixed amount, and the manufacturer accepting this promise by instructing the dealer to enter into a contract with the discounter. Option E is incorrect as it misstates the requirements for a third party to rely on the Contracts (Rights of Third Parties) Act 1999. In fact, a third party may acquire rights under the act without providing any consideration to the promisor."}, {"ch": 3, "n": 2, "sc": ["A man hired a woman to refurbish his bathroom. The woman's performance was defective and, as a result, the woman was liable to the man. However, the woman sold her business to a company on terms whereby the company agreed to 'complete outstanding orders taking into account any deposits paid by customers as at 31 March 2021 and to pay in the normal course of time any liabilities properly incurred by the woman as at 31 March 2021'."], "st": "Which of the following best describes the man's rights against the company?", "o": ["The man can claim against the company under statute because his claim falls within the definition of 'liabilities' in the contract between the woman and the company.", "The man can claim against the company under statute because there are no provisions in the agreement to show that the contract was not to be enforceable by a third party.", "The man cannot claim against the company under statute because he is not expressly identified in the contract between the woman and the company.", "The man cannot claim against the company under statute because he has not provided consideration to the company as consideration for being able to claim.", "The man cannot claim against the company under statute because the contract between the woman and the company must expressly incorporate any statute that gives third parties rights in respect of contracts to which they are not parties."], "a": "C", "bx": "The correct answer was C. This is because the enforceability criteria must be satisfied in order for the man to bring a claim as a third party to the contract between the woman and the company. A key requirement of the enforceability criteria is that the man must be expressly identified by name or as a class of persons, such as a customer. The relevant term in the agreement is 'liabilities' and this would not satisfy the enforceability criteria as it only encompasses unidentified classes of third parties. It is for the reasons above that Option A is incorrect. Option B is incorrect because a third party must satisfy the enforceability criteria in order to bring a claim under applicable statute. Option D is incorrect because there is no requirement that a third party provide consideration to rely on the act. Option E is incorrect because the act applies, unless it is excluded."}, {"ch": 3, "n": 3, "sc": ["A developer owns an office building and hires a decorating company to paint the building. The developer has seen an advertisement from a paint manufacturer that promises that its paint is so good that it will last for ten years. So the developer instructs the decorating company to buy the paint manufacturer's paint and to use it on the office building. The decorating company buys the paint from the paint manufacturer in a contract that excludes the third party rights under English statute law. One week after the decorating company has painted the office building there is a rainstorm and the paint completely washes off the office building."], "st": "Which of the following best describes the property company's rights against the paint company?", "o": ["There is no basis on which the developer can claim against the paint manufacturer because there is no contract between the developer and the paint manufacturer.", "Although there is an exception to the doctrine of privity of contract that would allow the decorating company to claim for the developer's loss on the grounds that this is a contract of convenience, this exception only applies where the decorating company has suffered a loss and there is nothing in the scenario to show that the decorating company has suffered a loss.", "The developer can claim against the paint manufacturer on the basis of a collateral contract between the developer and the paint manufacturer.", "The developer can claim against the paint manufacturer on the grounds that the decorating company acted as the developer's agent so that there is a direct contract between the developer and the paint manufacturer.", "The decorating company can claim against the paint manufacturer as trustee for the developer and the decorating company will be bound to hold any damages recovered from the paint manufacturer on trust for the developer."], "a": "C", "bx": "The correct answer was C. This is because the paint manufacturer's advertisement about the quality of the paint is a unilateral offer that the developer accepts and for which it provides consideration by instructing the decorating company to buy the paint. This means that Option A is incorrect. Option B is incorrect because the scenario does not describe a contract of convenience, which only applies in very limited circumstances, such as family holidays, taxis or meals in a restaurant. Option D is incorrect because for an agency argument to succeed the scenario would need to refer to an agency relationship and the paint manufacturer would need to be aware that the decorating company was the developer's agent, and there is nothing in the scenario to suggest this. Option E is incorrect because there is nothing in the scenario to suggest a trust relationship, or that the paint manufacturer, as promisor, was aware of any declaration of trust."}, {"ch": 3, "n": 4, "sc": ["A mother books a meal in a restaurant for herself, her husband, and her six children to celebrate the mother's birthday. All eight of them went for the meal at the restaurant. The food at the restaurant was of such poor quality that none of the group could eat it. In addition, the service was poor, and all who attended were sick with food poisoning after the meal. The bill was £200."], "st": "Which of the following best describes the mother's right to claim for damages against the restaurant?", "o": ["The mother can only claim for her loss because a claimant cannot recover more than the amount required to compensate his loss.", "The mother can claim as trustee for the children and her husband.", "The mother can only claim for her loss because the rule of privity of contract provides that a party to contract cannot sue and recover for the loss of a third party, and the husband and children are third parties in this scenario.", "The mother can claim damages for herself, her husband and her children under an exception to the rule of privity of contract because this is a contract of convenience.", "The mother can only claim for herself because she provided consideration, but her husband and the children did not."], "a": "D", "bx": "The correct answer was D. The scenario is a classic example of a contract of convenience. Contracts of convenience are an exception to the general rule that a party to a contract can only claim for their own loss. The exception means that the mother can claim for her own loss, and also for those on whose behalf she made the contract with the restaurant. This means that Options A and C are incorrect. Option B is incorrect because the scenario does not mention a declaration of trust or that the restaurant owner was aware of a trust relationship. Option E is incorrect because there is no requirement for those on whose behalf a contract is made to provide consideration when the contracts of convenience exception applies."}, {"ch": 3, "n": 5, "sc": ["A developer is in the process of developing some land. The land is contaminated so she makes a contract with a cleaning company to decontaminate the land. The contract excludes the statutory third party rights. The developer tells the cleaning company that she plans to sell the land to another party as soon as the decontamination process is complete. The cleaning company performs the decontamination work. Next, the developer sells the land to a builder who subsequently finds that the land is contaminated because the cleaning company breached its agreement with the developer to effectively decontaminate the land."], "st": "Which of the following best describes the builder's rights against the cleaning company?", "o": ["The builder can claim for its loss if the developer is prepared to bring a claim against the cleaning company for the builder's loss.", "The builder can only claim for its loss through the developer if the developer has also suffered a loss, and there is no evidence in the scenario that the developer has suffered a loss.", "Since the doctrine of privity of contract provides that a person who is not a party to a contract cannot acquire any rights under such a contract, the builder is unable to bring any claim directly or indirectly against the cleaning company.", "The builder can claim directly against the cleaning company as a third party on the basis of statute.", "The builder is entitled to ask the property developer to sue on its behalf in its capacity as trustee."], "a": "A", "bx": "The correct answer was A. The scenario is covered by common law exception to the rule of privity of contract (the St Martins Property exception). This exception applies where party A engages party B to do work on their property and both parties know that party A will transfer the property to another party (party C). If, after party C acquires the property, it turns out that party B's work for party A was defective, party A can sue party B for party C's loss, even if party A has not suffered any loss. Option B is incorrect because the developer is not required to suffer a loss in order to bring a claim for the builder's loss. Option C is incorrect because it does not take account of the exception to the doctrine of privity of contract provided by the St Martins Property exception. Option D is incorrect because the Contract (Rights of Third Parties) Act 1999 does not apply to a contract if it is excluded. Option E is incorrect because there is no evidence in the scenario of a declaration of trust being made in favour of the builder; and a declaration of trust is an essential requirement to establish a trust relationship."}, {"ch": 3, "n": 6, "sc": ["A woman contracts with a florist to deliver flowers to her mother every month. The contract states that the mother 'may enforce this term'. The florist stops delivering."], "st": "Can the mother enforce the term?", "o": ["No, because she provided no consideration.", "Yes, but only through her daughter.", "Yes, because the contract expressly provides that she may enforce the term.", "No, because statutory third-party rights must be expressly incorporated.", "No, because she is not a party to the contract."], "a": "C", "x": ["Wrong. A third party need not provide consideration.", "Wrong. The mother may enforce the term directly.", "Correct. Under s 1(1) of the Contracts (Rights of Third Parties) Act 1999, a third party may enforce a term if the contract expressly provides that they may.", "Wrong. The Act applies unless it is excluded.", "Wrong. Statute provides an exception to privity."]}, {"ch": 3, "n": 7, "sc": ["A contract between a company and a supplier states that the supplier will provide free maintenance to 'all of the company's customers'. The contract does not exclude the Contracts (Rights of Third Parties) Act 1999 and there is nothing to suggest that the parties did not intend customers to enforce it. A customer is refused maintenance."], "st": "Can the customer enforce the term?", "o": ["Yes, because the term purports to confer a benefit on an expressly identified class of persons.", "No, because the Act only applies to consumer contracts.", "Yes, but only with the company's consent.", "No, because the customer did not provide consideration.", "No, because the customer is not named individually."], "a": "A", "x": ["Correct. A third party may enforce a term that purports to confer a benefit on them, provided they are expressly identified by name, class or description and the parties did not intend otherwise.", "Wrong. The Act is not limited to consumer contracts.", "Wrong. No consent is required.", "Wrong. No consideration is required from the third party.", "Wrong. A third party may be identified by name, as a member of a class, or by description."]}, {"ch": 3, "n": 8, "sc": ["A father books a family holiday for himself, his wife and their two children. The holiday is a disaster and all four suffer distress."], "st": "Which of the following best describes the father's ability to claim?", "o": ["He may claim for the family's loss only if he declared a trust.", "He may claim only if the contract names the family members.", "Each family member must sue separately.", "He may claim for the whole family's loss because this is a contract of convenience.", "He may claim only for his own loss."], "a": "D", "x": ["Wrong. No trust is required.", "Wrong. The exception does not depend on naming them.", "Wrong. The other family members are not parties to the contract.", "Correct. A family holiday is a classic contract of convenience, an exception to privity allowing the contracting party to recover for the losses of those for whom he made the contract.", "Wrong. The contract of convenience exception allows recovery for others' losses."]}, {"ch": 3, "n": 9, "sc": ["A builder contracts with a client to build a garage. The contract expressly excludes the Contracts (Rights of Third Parties) Act 1999. The client's neighbour, who will benefit from a shared wall, wants to sue for defective work."], "st": "Can the neighbour rely on the Act?", "o": ["Yes, because exclusion clauses do not apply to the Act.", "Yes, if the neighbour is named in the contract.", "No, because the neighbour provided no consideration.", "Yes, because the neighbour benefits from the term.", "No, because the Act has been excluded."], "a": "E", "x": ["Wrong. The parties are free to exclude the Act.", "Wrong. Naming does not help where the Act is excluded.", "Wrong. Consideration is not required under the Act; the point is that it has been excluded.", "Wrong. The Act does not apply where it is excluded.", "Correct. The Act applies unless it is excluded, and here the parties have expressly excluded it."]}, {"ch": 3, "n": 10, "sc": ["A seller contracts with a buyer and, as part of the deal, the buyer promises to pay £1,000 to the seller's daughter. The contract does not mention the daughter's right to enforce, and the parties did not intend her to enforce it."], "st": "Which of the following best describes who can enforce the buyer's promise?", "o": ["Only the daughter.", "The daughter, under the Contracts (Rights of Third Parties) Act 1999.", "Nobody, because the daughter gave no consideration.", "Only the seller, as party to the contract, under the privity rule.", "The daughter, because a promise in her favour creates a trust."], "a": "D", "x": ["Wrong. The daughter is not a party to the contract.", "Wrong. The Act does not apply where the parties did not intend the third party to enforce the term.", "Wrong. The seller, as a contracting party, can enforce the promise.", "Correct. Under the doctrine of privity, only a party to the contract can enforce it, so the seller may sue the buyer.", "Wrong. There is no evidence of a declaration of trust."]}, {"ch": 4, "n": 1, "sc": ["A man visits a car-dealer because he wants to buy a car. While the man is looking at a car, the car-dealer tells him that the car has done 30,000 miles. The next day, the man returns to the car-dealer and buys the car in an oral agreement. The man uses the car for a few months during which time the car's performance is problematic. Subsequently, the man finds out that the car had actually done 80,000 miles when he bought it."], "st": "Which of the following statements best describes whether the man can claim against the car-dealer?", "o": ["The man cannot claim against the car-dealer because the statement about the car mileage was made at a different time from the sale agreement and it does not form part of the agreement of sale.", "The man can rescind the agreement on the basis that the cardealer's statement about the car's mileage was a representation.", "The man can claim damages on the basis that the car-dealer's statement about the car's mileage was a term of the sale agreement.", "The man cannot claim damages against the car-dealer because he continued to use the car without fixing the problems and this amounts to affirmation of the agreement.", "The man cannot claim against the car-dealer because he was in as good a position as the car-dealer to discover the truth of this statement."], "a": "C", "bx": "The correct answer was C. This is because the courts are most likely to interpret pre-contractual statements made by persons acting in a professional capacity, such as a car-dealer, to be terms. Option B is therefore incorrect; rescission is a remedy for breach of a representation, rather than a term. Option E is incorrect because the courts consider that a car-dealer's expertise puts it in a better position to know the true state of affairs than an ordinary man. Option A is incorrect because pre-contractual statements can be viewed as representations, or terms, of an agreement in certain cases. Option D is incorrect because although the innocent party may lose the right to rescind a contract if they affirm it after discovering the true state of affairs, there is no evidence to show that the man discovered the true state of affairs as to mileage while he continued to use the car."}, {"ch": 4, "n": 2, "sc": ["A woman goes to a horse stud farm as she is planning to buy a horse. The woman sees a horse that she would like to buy and starts to examine it. The owner of the horse farm sees the woman and tells her 'There is no need to look for anything. The horse is perfectly sound. If", "there were anything wrong with the horse, I would tell you'. As a result, the woman stops examining the horse and buys it. Subsequently, the woman discovers that the horse has a damaged hoof and cannot walk for more than half an hour."], "st": "Which of the following best describes whether the woman can claim against the owner of the horse?", "o": ["The woman cannot claim against the owner unless she can prove that she would have discovered that the horse had a damaged hoof if she had continued her inspection.", "The woman cannot claim against the owner because it was her responsibility to undertake due diligence on the horse.", "The woman cannot claim against the owner as his statement is puff.", "The woman can claim against the owner for breach of representation.", "The woman can claim against the owner for breach of term."], "a": "E", "bx": "The correct answer was E. This is because the courts are most likely to interpret the statement from the owner as a promise of the truth of the statement, for which the owner intends to be responsible. This means that Option D is incorrect. This also means that Options A and B are incorrect because whether or not the woman would have discovered the damage on inspection is irrelevant to the status of the pre-contractual statement. Option C is incorrect because the statement in the scenario does not fit the definition of puff, which is something incredible or unrealistic, like an advertising gimmick."}, {"ch": 4, "n": 3, "sc": ["A runner tells a sports shoe manufacturer that she needs heat-resistant running shoes for a well-known marathon race that she plans to run in a very hot desert. The sports shoe manufacturer produces the shoes for the runner to participate in the run. The runner wears the shoes for the marathon in the very hot desert, but they melt halfway through the race."], "st": "Which one of the following statements best describes the runner's grounds to claim against the sports shoe manufacturer?", "o": ["The runner can make a claim based on the breach of an implied term that the goods be produced with reasonable care and skill.", "The runner can make a claim based on the breach of an implied term that the goods be produced in accordance with industry practice.", "The runner can make a claim based on the breach of an included term that the goods are reasonably fit for any particular purpose made known to the sports shoe manufacturer.", "The runner can make a claim based on the breach of an implied term that the goods are reasonably fit for any particular purpose made known to the sports shoe manufacturer.", "The runner can make a claim on the grounds of an implied term that the goods are of satisfactory quality."], "a": "C", "bx": "The correct answer was C. The trainers must be 'reasonably fit for any particular purpose that the consumer makes known to the trader before buying the goods'(s 10 of the CRA 2015). In the business to business regime terms are implied by statute. In the consumer regime terms are included by virtue of the CRA 2015. Options D and E are incorrect because they refer to terms being implied rather than included. Options A and B are incorrect as there are no such terms."}, {"ch": 4, "n": 4, "sc": ["A man lives in a block of flats owned by the local council. The man is unhappy with the fact that the lift in the block does not work, the rubbish is not cleared regularly, and the communal areas of the block are dirty. The man reviews his lease agreement and notes that although, as lessee, he is subject to terms that he must comply with, the council, as lessor, is not subject to any terms."], "st": "Which of the following best describes the legal position in this case?", "o": ["A term would be implied in law that both the man and the council should make reasonable efforts to agree a block maintenance plan.", "No term would be implied because the language is clear and the courts are restricted to consider only what is written in the four corners of an agreement, in this case, the lease.", "No term would be implied because it is the responsibility of the lessees to keep the block in reasonable repair and usability.", "A term would be implied in law that the council should take reasonable care to keep the communal parts of the block in reasonable repair and usability.", "Since the terms imposed upon the council are vague, the court will consider the commercial context to try to bring meaning to them."], "a": "D", "bx": "The correct answer was D. There is no such basis that leads to Option A. Option B is not correct. The reference to the four corners approach refers to the role of the courts in interpreting language in a contract. When the language is clear, the courts are reluctant to look outside the four corners of the contract. By contrast, the current scenario is focused on the question of whether, in the absence of wording to cover the matter of concern, a term should be implied into the contract/lease. This means that Option E is incorrect because the terms imposed upon the council are not vague, or unclear; it is rather the point that there are no terms binding upon the council. Option C is incorrect as there are no grounds to lead to this conclusion."}, {"ch": 4, "n": 5, "sc": ["A man advertised a boat for sale. A woman visited the man's boatyard and asked to see the boat. The pair chatted for some time, and the man said, 'She is a sound boat, but are you not going to get her surveyed before buying her?'. The woman returned home, and came back the next day and bought the boat in a written agreement that contained an entire agreement clause."], "st": "Which of the following best describes the effect of the man's
