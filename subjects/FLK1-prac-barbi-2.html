, one of the team who had complained, injuring him badly.",q:"In an action by the injured employee against the employer to recover damages for his injury, which of the following is correct?",opts:["The employer is not likely to be liable because the injured employee had been aware of the risk of the crane driver's incompetence, having already complained about it.","The employer is likely to be both personally liable for breach of its own duty of care to the injured employee because the employer failed to check the crane driver's qualifications, and vicariously liable for the actions of the crane driver because the crane driver knew he was not competent but continued to work.","The employer is not likely to be liable for breach of its own duty of care to the injured employee because the accident was caused by the negligence of the crane driver, nor likely to be vicariously liable for the actions of the crane driver because he lied about his qualifications.","The employer is likely to be liable for breach of its own duty of care to the injured employee because it failed to check that he was competent, but not likely to be vicariously liable for the actions of the crane driver because he lied about his qualifications.","The employer is not likely to be liable for breach of its own duty of care to the injured employee because the crane driver lied about his qualifications, but is likely to be vicariously liable for the actions of the crane driver because the accident, caused by his negligence, occurred during the course of his employment."],ans:"B",expl:"(B) The employer is likely to be both personally and vicariously liable. The employer owed the injured employee a duty to take reasonable care to provide him with competent fellow staff. It appears to have breached this duty by its failure to check the crane driver's qualifications or competence, and clearly its breach caused the injury. The employer is also vicariously liable for the tort of negligence committed by its employee (the crane driver) during the course of his employment. He owed a duty to take reasonable care for the safety of his fellow staff. He appears to have breached this by lying about his qualifications and continuing to work when he knew he was not competent, and his breach caused the injury. It is clear that the tort was committed during the course of his employment. So, the employer is liable to the injured employee both in respect of its own duty of care and vicariously in respect of the crane driver's tort. (A) is not correct. An argument that the injured employee knew about the crane driver's negligence would seem to rely on the defence of voluntary assumption of risk. For this to apply, the injured employee must both be aware of the risk and have willingly accepted it. Since the injured employee had no choice but to continue working with the crane driver, he is not likely to have voluntarily accepted the risk, and the defence is not likely to apply. (C) is not correct. On the facts, it is likely that the employer is liable for breach of its own duty of care because, although the accident was caused by the negligence of the crane driver, the employer was itself negligent in failing to check his qualifications and competence. It is also likely to be vicariously liable because the crane driver committed the tort of negligence during the course of his employment by taking the position after lying about his qualifications and competence. (D) is not correct. It is true that the employer is likely to be liable for breach of its own duty of care, but it is not correct to say that it would not also be vicariously liable. The employer is likely to be vicariously liable because the crane driver committed the tort of negligence during the course of his employment by taking the position after lying about his qualifications and competence. (E) is not correct. It is true that the employer is likely to be vicariously liable, but it is not correct to say that it would not also be liable for breach of its own duty of care. The employer is likely to be liable for breach of its own duty of care to the injured employee because, although the crane driver lied about his qualifications, the employer was itself negligent in failing to check his qualifications and competence."},{n:79,id:"CNL127",scenario:"After the UK's exit from the EU, the Supreme Court must decide the correct interpretation of a provision of retained EU law. The appellant argues that the Supreme Court is free to adopt its own interpretation, whereas the respondent argues that the Supreme Court must follow a judgment of the CJEU from 2011.",q:"Which one of the following most accurately describes the legal position?",opts:["The CJEU judgment forms part of retained EU case law, and the Supreme Court must follow it.","The CJEU judgment forms part of retained domestic case law, and the Supreme Court must follow it.","The CJEU judgment forms part of retained domestic case law, and the Supreme Court is free to adopt its own interpretation if it appears right to do so.","The CJEU judgment forms part of retained EU case law, and the Supreme Court is free to adopt its own interpretation if it appears right to do so.","The CJEU judgment forms part of retained EU law, and the Supreme Court must follow it."],ans:"D",expl:"(D) Because the CJEU judgment predates the end of the transition period (in December 2020) and involves the interpretation of retained EU law, it forms part of retained EU case law, which is binding on all UK courts except the Supreme Court and the Court of Appeal. The Supreme Court and the Court of Appeal can depart from retained EU case law when it appears right to do so. (A) is incorrect because, as mentioned, the Supreme Court need not follow the CJEU judgment. (B) and (C) are incorrect because the CJEU judgment is not retained domestic case law. (B) is also incorrect because it suggests that the Supreme Court must follow retained domestic case law, which is not true. (E) is incorrect because retained EU law refers to legislation, not case law."},{n:80,id:"LGS039",scenario:"A solicitor's firm is being sued by an employee for direct discrimination on the grounds of race.",q:"Which of the following statements best describes whether the firm can attempt to justify the discrimination under the Equality Act 2010?",opts:["Direct discrimination on the grounds of race can be justified if the firm can show that it used proportionate means to achieve a legitimate aim.","Direct discrimination on the grounds of race can be justified if the firm can show that it used reasonable means to achieve a legitimate aim.","Direct discrimination on the grounds of race cannot be justified.","Direct discrimination on the grounds of race cannot be justified unless the employer has a reasonable excuse.","Direct discrimination on the grounds of race can be justified if the firm can show that it used legitimate means to achieve a proportionate aim."],ans:"C",expl:"(C) Direct discrimination on the grounds of race cannot be justified. Generally, there is no justification for direct discrimination. Age and disability are the only types of direct discrimination which can be justified. (A) is incorrect because direct discrimination based on race cannot be justified even if the firm can show it used proportionate means to achieve a legitimate aim. (B) is incorrect because direct discrimination based on race cannot be justified. If justification is permitted, the firm must show its action is a proportionate means of achieving a legitimate aim. (D) is incorrect because direct discrimination on the grounds of race cannot be justified and reasonableness of excuse is not a relevant factor. (E) is incorrect because, as explained above, direct discrimination on the grounds of race cannot be justified. If justification is permitted, the firm must show its action is a proportionate means of achieving a legitimate aim."},{n:81,id:"CNL086",scenario:"A group of people are at a motorway service station. The police believe that the people are on their way to a protest which is a further two hours away. The police have received information which lead them to believe that the protest is likely to be extremely violent.",q:"Which of the following best states the legal position with respect to whether the police may arrest the group?",opts:["Yes, they may arrest the group because a breach of the peace has occurred.","Yes, they may arrest the group because of the potential for violence.","Yes, they may arrest the group because a breach of the peace is likely to occur.","No, they may not arrest the group as no riot has taken place.","No, they may not arrest the group because a breach of the peace is not imminent."],ans:"E",expl:"(E) The police may not arrest the group at this point because a breach of the peace is not imminent. Although the police can arrest someone to prevent a breach of the peace before it occurs, this power of arrest arises only when a breach of the peace is imminent. Here, the police only suspect the group is heading to a protest that might turn violent. Moreover, the protest is two hours away, so any breach of the peace is not imminent. (A) is incorrect because it is factually untrue - there has been no breach of the peace yet. (B) is incorrect because the mere potential for violence does not satisfy the imminence requirement. (C) is incorrect because, while the police can arrest someone to prevent a breach of the peace that is likely to occur, that breach must be imminent. (D) is incorrect because arrest for breach of the peace is not limited to situations where there has been a riot."},{n:82,id:"ELS010",scenario:"A defendant is soon to go to trial on a charge of theft. He believes that he has less chance of being convicted if his case is heard by a jury.",q:"In what court is the decision reached by a jury?",opts:["The Magistrate's Court.","The Crown Court.","The High Court.","The Court of Appeal.","The Supreme Court."],ans:"B",expl:"(B) Cases are heard by a jury in the Crown Court. In all the other courts listed, decision is reached by the trial judge or judges."},{n:83,id:"BSL214",scenario:"A company has recently gone into insolvent liquidation. Three years ago, the company granted a floating charge over all the assets of the company. The grant was to a trade supplier as security for any money owing in respect of goods purchased on credit by the company. The floating charge was registered at Companies House. Six months ago, the company purchased warehouse premises using a loan from its bank. The company granted the bank a fixed charge over the property. The charge was not registered at Companies House.",q:"Which of the following statements best describes who will receive the proceeds of sale if the liquidator sells the warehouse premises?",opts:["The bank, as fixed charges rank ahead of floating charges.","The bank, as the trade supplier's floating charge was created within the last six months.","The trade supplier, as the bank's failure to register the charge makes it void against the trade supplier.","The trade supplier, as the bank's failure to register the charge makes it void against the company.","The bank, as it has a fixed charge over the warehouse premises."],ans:"C",expl:"(C) The trade supplier would receive the proceeds of the sale first. A charge which has not been validly registered at Companies House is void against other creditors. (A) and (E) are incorrect. Although fixed charges take priority over floating charges, that is true only if the fixed charge has been registered with Companies House. (B) is incorrect. A floating charge given within 12 months of the onset of insolvency in exchange for no consideration can be set aside. However, here the charge was given in exchange for fresh consideration - the goods purchased on credit. (D) states the correct result, but for the wrong reason: the charge is still valid between the company and the bank despite the charge not being registered."},{n:84,id:"CTR091",scenario:"Promissory estoppel is an equitable doctrine that gives legal effect to a contract unsupported by consideration and prevents a party going back on their promise to do something. For promissory estoppel to apply, several conditions must be met.",q:"Which of the following is not true in relation to promissory estoppel?",opts:["It must be inequitable for the promisor to go back on their promise.","Promissory estoppel is a cause of action rather than a defence.","There must be a clear and unequivocal promise by the promisor to alter existing legal rights.","Promissory estoppel has only a suspensory effect.","The promisee must have altered their position in reliance on the promise."],ans:"B",expl:"(B) Promissory estoppel can be used only as a defence, not as a cause of action. It is said that it should be used 'as a shield, not a sword'. (A), (C), and (E) are the three requirements for promissory estoppel to apply. Firstly, the promisor must make a clear and unequivocal promise to alter (usually give up) their existing legal rights, for example, to accept a lesser sum in part payment of a debt. Secondly, the promisee must have altered their position in reliance on this promise, for example, passing on a reduction in rent to subtenants. Thirdly, it must be inequitable for the promisor to go back on their promise. Equity is concerned with justice and fairness, so if the promisor going back on their promise would cause some sort of detriment to the promisee then this is likely to be classed as inequitable. The effect of promissory estoppel is generally suspensory, that is, the promisor's original rights may be revived after a certain period of time. Therefore (D) is incorrect."},{n:85,id:"ETH164",scenario:"Six months ago, a solicitor stole a substantial amount of money from her firm's clients while struggling with a gambling addiction. The solicitor has recently completed a rehabilitation programme and is very remorseful. The solicitor considers informing the firm's compliance officer for legal practice ('COLP') of what she has done.",q:"Which of the following statements best describes the solicitor's obligations under the SRA Standards and Regulations?",opts:["The solicitor must report the matter to the COLP on the understanding that the COLP will report the matter to the SRA.","The solicitor must report the matter directly to the SRA.","The solicitor is not required to do anything because she is only required to report the breaches of others.","The solicitor must report the matter to the COLP on the understanding that the COLP will report the matter to the SRA. The solicitor must later confirm that the COLP has made a report to the SRA.","The solicitor must report the matter to the COLP and then abide by the COLP's decision as to whether to report the matter to the SRA or handle the matter internally."],ans:"A",expl:"(A) If a solicitor is aware that any person or body (including themselves) has committed a serious breach of a regulatory arrangement, they must ensure that a prompt report is made to the SRA or other approved regulator, as appropriate. Any obligation to provide information to the SRA is satisfied if the solicitor provides the information to their firm's COLP (compliance officer for legal practice) or COFA (compliance officer for finance and administration), as and where appropriate, on the understanding that they will provide the information to the SRA. (B) is incorrect because a solicitor meets their obligation by reporting the matter to the COLP on the understanding the COLP will make a report. The solicitor is not required to make their own report to the SRA (unless there is some indication that the COLP will not make a report). (C) is incorrect because a solicitor must report their own serious breaches, as well as the serious breaches of other solicitors. (D) is incorrect because once the solicitor provides information to the COLP on the understanding that the COLP will report the matter to the SRA, the solicitor has no duty to check that a report was made. (E) is incorrect. If there has been a serious breach and the COLP has declined to make a report, the solicitor has a duty to report the breach to the SRA themselves."},{n:86,id:"CNL207",scenario:"A man brings a claim to the European Court of Human Rights ('ECtHR'). He alleges that a local government agency removed his children from his care in breach of his right to private and family life under the European Convention on Human Rights ('ECHR'). During his hearing, the man relies on a case that was previously decided by the ECtHR to support his arguments.",q:"Which of the following best describes the weight that the ECtHR will give to this previous case when making its judgment?",opts:["The ECtHR must follow the previous case.","The ECtHR must judge each case on its merits and should ignore the previous case.","The ECtHR may follow the previous case, but it is not obligated to do so if socio-economic conditions justify a different approach.","The ECtHR may not follow the previous case if the contracting states to the ECHR have adopted a different approach to the relevant issue.","The ECtHR must follow the previous case even if socio-economic conditions justify a different approach."],ans:"C",expl:"(C) The ECtHR may follow the previous case but it is not obligated to do so. Under the living instrument principle, the ECtHR may depart from a previous decision if circumstances have changed since that decision was made. A change in socio-economic conditions may justify a different approach to the human rights law in this area. (A) and (E) are incorrect because the duty to follow a previous decision is not mandatory. (B) is incorrect because the ECtHR can choose whether to follow the case. (D) is incorrect because the ECtHR can choose to adopt an approach followed by the contracting states, but it is not required to do so."},{n:87,id:"CTR044",scenario:"A stamp collector has been induced to enter into a contract for the sale of his prize stamp to a third party for less than it is worth, by the fraudulent misrepresentation of a stamp dealer. The third party is unaware of the misrepresentation.",q:"Which of the following is the stamp collector's correct remedy in law?",opts:["The collector can treat the contract with the third party as void.","The collector can sue the dealer for damages under the Misrepresentation Act 1967.","The collector can sue the dealer for damages for breach of contract.","The collector can sue the dealer for damages under tort only.","The collector can rescind the contract with the third party."],ans:"D",expl:"(D) It is possible for an actionable misrepresentation to be made by someone who does not end up being a party to the contract, such as the dealer in this scenario. This normally happens where the person making the misrepresentation is acting as the other party's agent (although they need be an agent only for the purpose of passing on the representation - they do not have to be an agent for the purpose of concluding the contract). (D) is correct as the stamp collector would be able to sue the stamp dealer in the tort of deceit, as we are told this is a case of fraudulent misrepresentation. The collector cannot sue the stamp dealer for misrepresentation because the dealer is not a party to the contract. (The collector may also be able to sue the third party for damages for misrepresentation, if the dealer was acting as the third party's agent.) (A) is incorrect because misrepresentation renders a contract voidable, not void. (B) is incorrect as the Misrepresentation Act 1967 is only available for negligent misrepresentation. (C) is incorrect as there is no contract between the stamp collector and the dealer, only between the stamp collector and the third party. (E) is incorrect because it was not the third-party buyer who made the misrepresentation. They acquired the stamp in good faith and for value, and that is normally a bar to rescission."},{n:88,id:"CNL078",scenario:"A statute requires that if a council intends to close a library, it must consult with the public by placing a notice outside the library building and in a local newspaper and inform library users of the proposed closure by letter. A council has decided to close two of its public libraries and has placed notices outside the library buildings. The council also informed the libraries' patrons by letter. However, the council did not place adverts in the local newspaper. A patron of one of the libraries wishes to challenge its closure and so files an application for judicial review. The court rules in the patron's favour.",q:"Which of the following best explains why the court ruled in the patron's favour?",opts:["The council failed to comply with the general common law duty to give reasons.","The council failed to comply with a common law procedural requirement.","The council failed to comply with the common law duty to consult.","The council failed to take into account a relevant consideration.","The council failed to comply with a statutory procedural requirement."],ans:"E",expl:"(E) The court most likely ruled in the patron's favour on the ground that the council failed to comply with a statutory procedural requirement. The statute here imposed a mandatory procedural requirement (that is, one that must be followed). If a public body fails to comply with a mandatory procedural requirement, its action will be invalid. Here, the council closed the libraries in a manner which did not wholly comply with the mandatory procedure, because it did not place a notice in a local newspaper. Consequently, those closures should be invalid. (A) is incorrect because there is no general common law duty to give reasons. (B) and (C) are incorrect because in this case, the procedural requirements are imposed by statute and not the common law. (D) is incorrect because there is no indication here that the council failed to take into account a relevant consideration."},{n:89,id:"CNL052",scenario:"The UK government wishes to abolish the Scottish Parliament and Scottish government, returning all powers that have been devolved to the Scottish Parliament back to the UK Parliament.",q:"Who would be required to consent to the abolition of the Scottish Parliament and the Scottish government?",opts:["The Scottish government.","The Scottish Parliament.","The UK Parliament and the Scottish people at a referendum.","The House of Commons and the Scottish people at a referendum.","The UK Parliament and the Scottish Parliament."],ans:"C",expl:"(C) The UK Parliament and the Scottish people (at a referendum) would need to consent to the abolition of the Scottish Parliament and Scottish government. The Scottish Parliament and the Scottish government were both created by an Act of the UK Parliament. Ordinarily, the doctrine of parliamentary sovereignty means that Parliament can make or unmake any law whatsoever, meaning that the UK Parliament could, in theory, abolish the Scottish Parliament and the Scottish government without seeking the consent of any other institution. However, it has been stated that the Scottish Parliament and the Scottish government are 'permanent' parts of the UK's constitutional arrangements and can be abolished only if the people of Scotland vote to abolish those institutions at a referendum. This means that the consent of the people of Scotland and the UK Parliament are required to abolish the Scottish Parliament and the Scottish government. Therefore, (A), (B), (D), and (E) are incorrect."},{n:90,id:"CNL073",scenario:`A statute has granted the Secretary of State the power to determine applications for grants for small businesses. A clause in the statute provides that "any determination made by the Secretary of State shall not be called into question in a court of law". The Secretary of State rejected a business owner's application. However, it later emerges that the application was rejected because the business owner did not support the Secretary of State's political party. The applicant wishes to challenge the rejection of their application via judicial review.`,q:"Which of the following best explains whether the court can hear the applicant's judicial review claim?",opts:["The court can hear the judicial review claim because the statutory clause does not apply to unlawful decisions.","The court can hear the judicial review claim because the Secretary of State has breached the general common law duty to give reasons.","The court cannot hear the judicial review claim because it does not involve public law issues.","The court cannot hear the judicial review claim because the applicant lacks standing.","The court cannot hear the judicial review claim because there is no live dispute."],ans:"A",expl:"(A) The court can hear the judicial review claim because the statutory clause does not apply to unlawful decisions. The clause may appear to exclude the courts from being able to question decisions made by the government over small business applications. However, the courts have interpreted such clauses (often referred to as 'ouster clauses') very restrictively to mean that no legally valid decision can be questioned by the courts; the courts can still review the underlying legality of a decision. This means that the applicant can still seek a judicial review of the decision despite the ouster clause. (B) is incorrect because there is no general duty to give reasons at common law. (C) is incorrect because this decision does involve a public law issue, in that the decision has been made by a public authority (the Secretary of State). (D) is incorrect because the applicant can satisfy the sufficient interest test, which means the applicant has standing. That is, the applicant was directly affected by the rejection. (E) is incorrect because this case involves a live dispute, as opposed to a hypothetical dispute. The applicant is challenging somethi
