practicable.",note:'The source screen for this question is labelled "38 of 90"; it is the 39th question in sequence.'},{n:40,id:"DIS039",scenario:"A County Court awards judgment to a creditor on a debt owed by a local building supplies company (debtor). The amount due is £4,000. The debtor fails to pay the debt in accordance with the judgment order.",q:"What is the best advice the solicitor can give to the creditor about enforcing the judgment?",opts:["The creditor should seek an attachment of earnings order against the owner of the building supplies company.","The creditor should apply for a charging order over the debtor's property, then apply for an order for sale.","The creditor should apply for a warrant of control in the County Court.","The creditor should transfer the judgment to the High Court and apply for a writ of control.","The creditor should apply for an oral examination of the defendant to establish any assets that could be used to satisfy the debt."],ans:"D",expl:"(D) It is sensible to transfer the debt to the High Court, as this will start interest accruing. (Interest normally does not accrue in County Court if the judgment is for less than £5,000.) For the sum in question and knowing that the defendant is in business, it would seem appropriate to go straight to a writ of control that would allow the claimant to take control of the building supplies company's goods. (However, note that the enforcement officer will not be permitted to seize goods which may be required to carry on the business, such as tools). (A) is incorrect because an attachment of earnings order is for use in a situation when the judgment debtor is an employee. As the claim here is against a business, an attachment of earnings would not be appropriate. (B) is possible, but not the best answer because a charging order relates to land owned by the debtor, and the facts do not indicate whether the debtor company owns any land. (C) is incorrect because keeping the case in the County Court restricts the creditor's right to interest as explained above. (E) is incorrect. An order for an oral examination is used to force the losing party in a case to come to court to provide information about its means and assets. In the case of a building supplies company, it seems clear that they will have assets which can be made subject to a writ of control."},{n:41,id:"CTR095",scenario:"A couple book a hotel room and on arrival sign a registration form at the front desk. That night they go out for dinner and leave some valuables in their room, which is subsequently broken into and the valuables are stolen. The couple request compensation for their loss. The hotel refuses to pay the compensation, and shows the couple a sign on the back of the door of their room which states 'the hotel accepts no liability for any loss or damage to customers' property'.",q:"Would the couple be able to sue the hotel for the loss of their valuables?",opts:["Yes. It is not possible to exclude liability for loss and damage in contract.","Yes. The exclusion clause was not validly incorporated into the contract.","No. By signing the registration form, they agreed to be bound by the hotel's terms and conditions.","No. The exclusion clause is clear and unambiguous and therefore is binding on the couple.","No, because of the contra proferentem rule."],ans:"B",expl:"(B) For an exclusion to be effective, it must be validly incorporated into the contract and properly drafted so as to cover what has happened. A clause can be validly incorporated by signature, by notice, or through a course of dealings between the parties. Here, the notice attempting to exclude liability was on the back of their hotel room door. The exclusion must have been brought to the attention of the parties before or at the time the contract was concluded, but the contract for the room was concluded at the latest when the couple checked in at the front desk. Thus (B) is the correct answer. (A) is incorrect because under the Consumer Rights Act 2015 (which would apply in this case as the couple are consumers), it is possible to exclude liability for loss and damage to property, provided that the term in question is not contrary to the requirements of good faith, and that enforcing it does not cause a significant imbalance to the parties' rights and obligations, to the detriment of the consumer. (C) is incorrect because the couple would only be bound by terms and conditions brought to their attention before or at the time they signed the contract. There is no suggestion that the exclusion of liability was brought to their attention when they signed the registration form. (D) is incorrect because, whilst it is a requirement that any exclusion is clear and unambiguous, this particular exclusion was not even validly incorporated into the contract. (E) is incorrect because the contra proferentem rule does not apply in this case, as the clause was not validly incorporated in the first place. That rule means that any ambiguity in an exclusion clause must be resolved against the party seeking to rely on the exclusion."},{n:42,id:"CTR031",scenario:"A husband agrees in writing to pay his wife £50 a week to support herself while he is away on business. A couple of weeks after he leaves, he stops making the payments.",q:"Which of the following is correct in respect of the legal position between them?",opts:["The agreement will have legal effect because it is in writing.","This is a domestic and social agreement so the parties do not have legal intent.","This is a domestic and social agreement so the parties do have legal intent.","As the parties are married, they are presumed not to have intended to be legally bound.","There is no consideration from the wife for the husband's promise to pay, so the agreement will not be legally binding."],ans:"D",expl:"(D) In a domestic and social arrangement (that is, between a husband and wife who are still married) the law presumes there to be no intention to be legally bound, but this presumption can be rebutted with evidence to the contrary. Therefore (D) is correct. It is just as possible that the presumption may be rebutted in this case, because it is unusual for an agreement between husband and wife to be in writing. (A) is incorrect because there is no requirement for an agreement to be in writing for it to be legally binding (with certain exceptions such as agreements for the disposition of interests in land). (B) is incorrect because there is no absolute rule that the parties do not have legal intent in a domestic and social arrangement. There is a presumption that they do not, but this presumption is rebuttable. (C) is incorrect because it is presumed that there is no intent in a domestic and social agreement. (E) is incorrect because the wife's agreement to support herself while her husband is away could constitute sufficient consideration."},{n:43,id:"DIS246",scenario:"A woman was injured when the driver of the car next to her on a motorway crossed over into the woman's lane whilst texting. The woman suffered two broken ribs as a result of the accident. The woman instructs a solicitor to issue proceedings against the driver. The solicitor estimates the woman's damages at £30,000.",q:"Which of the following statements best describes how the solicitor should start the proceedings?",opts:["The solicitor should send the claim form by special delivery to the local county court.","The solicitor should take the claim form for issue in person to the local county court.","The solicitor should send the claim form by first class post to their local county court for issue.","The solicitor should send the claim form to the County Court Money Claims Centre (CCMCC) in Salford to issue the claim form.","The solicitor should send the claim form to their local High Court district registry that will issue the claim form and determine which court to allocate the claim."],ans:"D",expl:"(D) There is now one County Court issuing centre based in Salford, the CCMCC, and all claims are issued from this court. (A), (B), and (C) are incorrect because the prescribed process for issue in the County Court is now through the bulk issuing centre in Salford. (E) is incorrect because it would be inappropriate for the claimant to issue in the High Court bearing in mind its value."},{n:44,id:"CNL186",scenario:"The UK Court of Appeal is hearing a case under the Human Rights Act 1998 ('HRA') relating to a claimant's right to privacy and family life. The European Court of Human Rights ('ECtHR') has given a relevant decision on the same issue.",q:"Which of the following statements best describes the Court of Appeal's statutory obligations with regard to the ECtHR decision?",opts:["The Court of Appeal must take into account the decision by the ECtHR but is not bound by it.","The Court of Appeal may take into account the decision by the ECtHR but is not bound by it.","The Court of Appeal must take into account the decision by the ECtHR and is bound by it.","The Court of Appeal may take into account the decision by the ECtHR and is bound by it.","The Court of Appeal must not take into account the decision by the ECtHR and is not bound by it."],ans:"A",expl:"(A) Although the Court of Appeal must take into account the decision, it is not bound by the decision. Under the HRA, the UK courts must take into account any decision by the ECtHR relating to the Convention right in question, but they are not required to follow the ECtHR's precedents. (B) is incorrect because it suggests that taking the ECtHR's decision into account is discretionary. (C) is incorrect because it suggests that the Court of Appeal must follow the ECtHR's decision, even though that is discretionary. (D) is incorrect because the court must take the decision into account, but it is not required to follow the decision. (E) is incorrect because the UK courts are required to take into account the ECtHR's decisions."},{n:45,id:"CTR030",scenario:"A customer is bringing an action against a warehouse owner for breach of a contract between them for storage of goods in the owner's warehouse. The customer's goods were damaged during the agreed storage period. The contract between them contains an exclusion clause which purports to limit liability for damage to property due to negligence.",q:"What common law rules must be complied with for an exclusion clause to be effective?",opts:["The clause must be validly incorporated into the contract and it must not be contrary to the Unfair Contract Terms Act 1977.","The clause must be in writing and the wording of the clause must cover the loss suffered.","The clause must not be contrary to the Unfair Contract Terms Act 1977 or the Consumer Rights Act 2015.","The clause must not be ambiguous and it must not be contrary to the Consumer Rights Act 2015.","The clause must be validly incorporated into the contract and the wording of the clause must cover the loss suffered."],ans:"E",expl:"(E) For an exclusion clause to be valid, it must fulfil both common law and statutory rules. The common law rules require that (1) the clause has been validly incorporated into the contract (via signature, notice, or a course of dealings between the parties), and (2) the wording of the clause covers the loss suffered. Therefore (E) is the correct answer. (A) is incorrect because the Unfair Contract Terms Act 1977 is a statutory rule, not a common law rule. (B) is incorrect because the clause does not have to be in writing to be validly incorporated into the contract. An example of this would be a clause incorporated into a contract through a course of dealings between the parties. If the parties had previously dealt with each other on specific terms, one of which was an exclusion clause, but in the case in question the terms had not been supplied, this would not preclude reliance on the exclusion clause. (C) and (D) are incorrect for the same reason as (A), as both the Unfair Contract Terms Act 1977 and the Consumer Rights Act 2015 are statutory, not common law, rules. (D) is also incorrect because the point in relation to ambiguity is that an ambiguous provision will be construed against the party relying on it."},{n:46,id:"CTR081",scenario:"An engineer spent two years developing a patent at the request of her employer, in addition to her required contractual duties. Her employer obtained a patent for the invention. Ownership of the patent remained with the employer. After the work was completed, the employer promised to grant the engineer a share in the patent for her help in the development of it.",q:"If the employer subsequently refused to grant a share to the engineer, could the engineer successfully sue?",opts:["Yes, because the work was done at the request of the employer and on an implied understanding that it would be remunerated.","Yes, because past consideration is sufficient if it constitutes more than an existing contractual duty.","No, because the work undertaken constituted performance of an existing contractual duty by the engineer.","No, because past consideration is not sufficient consideration in law.","No, because the promise to transfer the share was not legally enforceable."],ans:"A",expl:"(A) If work is done at the request of the promisor, and there was an implied understanding that payment would follow, a subsequent promise to pay is seen as merely fixing the amount, even though the work was done before the promise was made. Three conditions must be met for this exception to the past consideration rule to apply: (1) the act constituting the consideration must have been done at the promisor's request; (2) there must have been an understanding between the parties that the act would be remunerated; and (3) the payment (or other benefit) must have been legally enforceable had it been promised at the same time that the act was performed. The understanding that the engineer would be remunerated for the extra work is likely to be implied in this case. (B) is incorrect because performance of an existing contractual duty may still be invalid as past consideration unless the additional requirements set out above are met. (C) is incorrect because the development of the patent went beyond the engineer's existing contractual duties, and so the issue here is whether past consideration is sufficient. (D) is incorrect because, whilst this is the general rule, there is an exception where there is an implied understanding that payment will follow, as set out above. (E) is incorrect because there is nothing in the scenario to suggest that the promise to grant a share of the patent was not legally enforceable."},{n:47,id:"CTR056",scenario:"A personal trainer entered into a contract to provide training services to a woman twice a week for six months for a fixed sum, commencing on 1 June. On 1 May, the woman contacted the personal trainer to tell him that she no longer required his services. The personal trainer was angry that the woman refused to honour their contract, so he turned up twice a week as arranged for six months pursuant to the terms of their contract, and then brought a claim against the woman for the sums owed to him for his performance of the contract.",q:"Will the personal trainer succeed in this claim?",opts:["Yes. An express anticipatory breach of contract entitles the innocent party to continue performance of their contractual obligations and then claim for payment.","Yes. Because the anticipatory breach was express rather than implied.","No. There is an obligation on the innocent party to a breach to mitigate their loss. By performing the contract, the personal trainer has not done so.","No. An express anticipatory breach only entitles the innocent party to terminate the contract and claim damages before performance has started.","No. There was no legitimate interest in the personal trainer carrying out his performance of the contract."],ans:"E",expl:"(E) An anticipatory breach of contract gives the innocent party the right to terminate the contract immediately, or to carry on with their obligations under the contract and then sue. This is because repudiation by one of the parties to a contract does not discharge it unless the repudiation is accepted by the other party. However to carry on with the contract, the innocent party must have a legitimate interest in doing so. In the scenario, there is nothing to suggest that the personal trainer has any interest in carrying on with the contract, rather than terminating it immediately and claiming the sums owed to him as a result of the breach. (E) is therefore the correct answer, and (A) is incorrect. (B) is incorrect because whether the anticipatory breach was express or implied has no bearing on the options available to the innocent party. (C) is incorrect because there is no requirement in law to mitigate loss for a debt claim, that is, a liquidated sum of money, which is what the personal trainer will be claiming. (D) is incorrect because, whilst an express anticipatory breach does give the innocent party the right to terminate, it also allows the innocent party to continue their performance and then sue for damages."},{n:48,id:"BSL235",scenario:"A marketing company placed a bid with a small business offering to build their social media presence. The small business rejected the bid as too costly, but encouraged the marketing company to submit a lower bid. Meanwhile, a managing director of the marketing company was thinking of retiring and starting his own freelance marketing business. Rather than submitting another bid for the marketing company, he decided to take an early retirement and submit a personal bid to the small business. The marketing company sued the former managing director for breach of duty.",q:"In the case of the marketing company versus the former managing director, which party is likely to prevail?",opts:["The former managing director, because his retirement ended his contractual obligations to the marketing company.","The former managing director, because once he retired he no longer had any statutory duties to the marketing company.","The former managing director, because the marketing company's bid was rejected, leaving the former director free to place a more competitive bid.","The marketing company, because the former managing director breached his duty to avoid conflicts of interest.","The marketing company, because the former managing director breached his duty not to accept benefits from third parties."],ans:"D",expl:"(D) A director must avoid a situation in which he has, or can have, a direct or indirect interest that conflicts, or possibly may conflict, with the interests of the company. This applies in particular to the exploitation of any property, information, or opportunity. What this duty means in practice is that there should not be a conflict between a director's fiduciary duties and his own personal interests. This duty extends to a director not making an unauthorised profit as a result of a conflict of interest. Here, the former managing director took advantage of information he gained whilst still a director of the marketing company and used that information to compete with the marketing company. (E) is incorrect because, while the duty not to accept benefits from third parties is also a statutory duty, it is not relevant to this particular scenario. (A) is incorrect because the fact that the managing director has been released from his contract does not have an effect on his statutory duties, only his contractual ones. (B) is incorrect because directors may still be subject to statutory and fiduciary duties owed for the period when they were a director, even after they have ceased being a director. (C) is incorrect because it is immaterial whether the company could or would have taken advantage of the property, information, or opportunity that the director subsequently took personally."},{n:49,id:"TRT073",scenario:"A bus conductor, employed by a bus company, arrived one morning at the bus depot to find the bus driver was absent on sick leave. Despite knowing that, as a conductor, he was prohibited by his employer from driving the bus, he decided to drive the bus himself. He also decided to deviate a long way off the normal bus route to reach the first passenger stop. On this journey he drove too fast and negligently injured a pedestrian.",q:"Which statement best describes whether the pedestrian will be successful in an action for negligence against the bus company?",opts:["The pedestrian will not be successful as the bus conductor was not acting within the course of his employment.","The pedestrian will not be successful as the bus conductor was acting as an independent contractor when the accident took place.","The pedestrian will be successful provided that the bus conductor was also guilty of a criminal offence.","The pedestrian will not be successful unless he can prove that the bus company was at fault.","The pedestrian will be successful as the bus conductor was acting within the course of his employment."],ans:"A",expl:"(A) The pedestrian will not be successful. An employer is vicariously liable for the tort of an employee committed during the course of employment. However, here the bus conductor is clearly acting outside the course of his employment. He has contravened a prohibition (he is not allowed to drive the bus) which appears to limit the scope of his employment. He has also deviated from the authorised bus route to an extent that suggests that he has begun a new journey of his own. Therefore he is 'on a frolic of his own'. (B) is incorrect. The bus conductor is not an independent contractor here, as no agreement of this nature has been entered into by the bus company. (C) is incorrect. If the bus conductor was acting within the course of his employment, it is no bar to liability that the act was not a criminal offence. (D) is incorrect. Vicarious liability is liability without fault. If it is established, the fault of the employer is irrelevant. (E) is incorrect. An employer is vicariously liable for the tort of an employee committed during the course of employment. However here the bus conductor is clearly acting outside the course of his employment and therefore 'on a frolic of his own' (as explained above)."},{n:50,id:"DIS076",scenario:"Pre-action negotiations have been progressing between two firms of solicitors that were instructed by parties engaged in a commercial dispute between two companies. The negotiations have proved fruitless, and the claimant's solicitor has now issued a claim form, which the court has sealed and returned to the solicitors for service. The solicitors for the defendant have refused to accept service, and the four-month period for service expires in a day. The claimant's solicitor has a copy of the defendant's letterhead. The letterhead includes an email address for the defendant's managing director. The claimant's solicitor had previously been given permission by the defendant's solicitor on two occasions to correspond with the defendant's managing director via the email address regarding specific issues. So, the claimant's solicitor used this managing director's email address to serve the sealed claim form. The managing director replies to the email, angrily stating that the solicitor should not have sent them the claim form.",q:"Is service valid?",opts:["Yes, because the managing director, as a senior officer of the firm, has previously engaged by email.","No, because service by email is never appropriate.","Yes, because the fact that there is an email address on the letterhead constitutes implied consent to service by email.","No, because a party needs to give express consent to service of documents by email.","Yes, because the claim form has clearly come to the defendant's attention."],ans:"D",expl:"(D) Express consent is required to serve a party by email. If the defendant has not provided express consent, then service by email is not acceptable. (A) is incorrect because specific consent is required. The fact that the solicitors used the managing director's email to correspond in the past does not authorise service by email. (B) is incorrect because service may be by email if a party consents. (C) is incorrect because putting an email address on letterhead is not sufficient to constitute consent to service by email. (E) is incorrect because the fact that the proceedings have come to the defendant's attention is irrelevant. The defendant here has not provided express consent to service by email.",note:'The source screen for this question is labelled "49 of 90"; it is the 50th question in sequence.'},{n:51,id:"CTR065",scenario:"A contract between an employer and an employee states that 'for a period of three years after leaving the employment, the employee is prevented from soliciting any clients of the employer'.",q:"Would the employer be able to enforce this clause?",opts:["Yes, provided the clause was reasonably necessary to protect a legitimate interest of the employer.","Yes, it was a clause agreed between the parties and the employee intended to be legally bound by it.","No, the clause is drafted too widely and is therefore not reasonable.","No, restraint of trade clauses are automatically void.","No, restraint of trade clauses are not applicable to employment contracts."],ans:"A",expl:"(A) This is the best answer. There is a presumption that restraint of trade clauses are void, unless they can be shown to be reasonable. What is reasonable will be determined on a case-by-case basis, but the party seeking to rely on the clause must demonstrate that it is no more than is reasonably necessary to protect a legitimate interest. Examples of legitimate interests could be trade secrets, confidential information, or customer lists/contacts. A three-year restriction, as in this case, is broad, but might be justified. (B) is incorrect because the doctrine of restraint of trade presumes that such clauses are automatically void, unless reasonable, even though the parties have contractually agreed to them. The fact that a clause is widely drafted will not by itself be enough to make it unreasonable. Therefore (C) is incorrect. The courts will look at all the circumstances, including duration and any geographical restriction in the clause. The courts will then look at whether there is any legitimate interest of the party seeking to rely on the clause that it is trying to protect. (D) is incorrect because restraint of trade clauses are prima facie void, but not automatically so. The presumption can be rebutted by evidence to the contrary. (E) is incorrect as restraint of trade clauses (often known in this context as restrictive covenants) are permitted in employment contracts as long as they are reasonably necessary to protect the legitimate interests of the party seeking to rely on them."},{n:52,id:"TRT004",scenario:"A man and a woman were having an argument and got very angry with each other. The woman shouted at the man, 'if this were not a social occasion, I would slap you across the face'. The woman then turned away and, when she was not looking, the man threw the contents of a glass of red wine over her, soaking her clothes.",q:"Which one of the following statements correctly describes the situation?",opts:["The man has committed the torts of assault and battery against the woman.","The man is not liable to the woman because he acted in self-defence.","The woman has committed the tort of assault against the man and the man has committed the tort of battery against the woman.","The man has committed the tort of battery against the woman.","Neither party has committed any tort because no serious harm was caused to either of them."],ans:"D",expl:"(D) The man has committed the tort of battery against the woman. Battery is the intentional direct application of unlawful force. The man acted intentionally, and his actions were a direct application of unlawful force to the woman. Throwing wine over a person's clothes is sufficient to amount to unlawful force. (A) is not correct because the man has not committed the tort of assault. Assault is an act which causes reasonable apprehension of unlawful force (apprehension of a battery). On the facts, this is not satisfied because the wine was thrown when the woman was not looking. (B) is not correct. The defence of self-defence applies when a person reasonably believes that he is being, or is about to be, attacked. On the facts, this is not satisfied because the woman's words negated any threat of an attack. (C) is not correct. The man has committed the tort of battery against the woman, as discussed above, but she has not committed the tort of assault against him. An assault is an act which causes reasonable apprehension of a battery, but words may negate the threat - as is the case here. (E) is not correct because the man has committed the tort of battery. This answer suggests that serious harm would be required for a battery, which is not correct. Any application of unlawful force is sufficient and such force need not result in actual harm. Battery is actionable per se."},{n:53,id:"LGS043",scenario:"An internal job applicant at a firm of solicitors has informed the interview panel that, due to a disability, she is unable to sit under artificial lights. She has asked that her interview take place in a room with only natural light and that she be able to sit directly next to the window.",q:"Which of the following must the firm do to meet its obligations under the Equality Act 2010?",opts:["The firm must make adjustments to ensure that the disabled applicant is not placed at a disadvantage compared to those who are not disabled.","The firm must make minor adjustments to ensure that the disabled applicant is not placed at a significant disadvantage compared to those who are not disabled.","The firm must make significant adjustments to ensure that the disabled applicant is not placed at any disadvantage compared to those who are not disabled.","The firm must make reasonable adjustments to ensure that the disabled applicant is not placed at a substantial disadvantage compared to those who are not disabled.","The firm need not make any adjustments because the applicant's disability is not significant."],ans:"D",expl:"(D) The obligation under the Equality Act is that firms must provide reasonable adjustments to ensure that disabled clients and employees are not placed at a substantial disadvantage compared to those who are not disabled. (A), (B), and (C) are incorrect because they do not state the correct standard. The standard is that firms must provide reasonable adjustments to ensure disabled clients and employees are not placed at a substantial disadvantage. (E) is incorrect because the significance of the disability is not a factor in determining whether a firm is obligated to make adjustments."},{n:54,id:"ELS072",scenario:"A cyclist brought a negligence case against a driver in a County Court. The cyclist claims that the driver struck him while he was walking his bicycle in a crosswalk. In an earlier case, in a non-unanimous decision, the Court of Appeal ruled that a cyclist must be walking their bicycle in a crosswalk to be considered a pedestrian, and therefore the claimant in that case fully recovered on her injuries because she was walking her bicycle. The defendant in the first case did not appeal that decision.",q:"Which of the following best describes the effect of the earlier judgment on the present case?",opts:["The decision is not binding on the County Court as it was not appealed.","The decision is not binding on the County Court as it was not unanimous.","The decision is not binding on the County Court as the courts are different.","The decision is binding on the County Court as it involves similar facts and was decided by a higher court.","The decision is binding on the County Court because the ruling on who is a pedestrian is obiter dictum."],ans:"D",expl:"(D) A decision of the Court of Appeal is binding on lower courts such as the County Court when the decision involves the same or similar facts, and the ruling on a particular point of law must form the basis of the court's decision; that is, it must be part of the ratio decidendi. In the earlier case, the Court of Appeal ruled that a cyclist must be walking his bicycle to be considered a pedestrian in a crosswalk. Those are similar facts, and that ruling formed the basis for the previous decision from the Court of Appeal. (A) is incorrect. A decision of a higher court need not be appealed in order for that decision to be binding on lower courts. (B) is incorrect. A decision need not be unanimous to be binding. A majority opinion of the Court of Appeal normally binds itself in civil cases and lower courts. (C) is incorrect. Generally, decisions of higher courts bind lower courts. (E) is incorrect because the ruling on who is a pedestrian is not obiter dictum but rather is ratio decidendi - a discussion that was essential to the earlier court's ruling. It is the ratio that is binding; obiter dictum is merely persuasive at best."},{n:55,id:"CTR012",scenario:"An interior decorator asked a carpenter to build her a piece of furniture. They entered into a written contract, with a contract price of £500 to be paid when the decorator received the furniture. When the work was completed, the carpenter shipped the furniture to the decorator. After inspecting it, the decorator felt that the price was too high and told the carpenter she would pay only £400 for it. The carpenter reluctantly agreed because he needed the cash. The decorator sent the carpenter a cheque for £400 marked 'payment in full and final settlement'. The carpenter cashed the cheque, and then sued the decorator to recover the £100 balance.",q:"Which of the following statements best reflects the applicable law?",opts:["The carpenter's cashing of the cheque constituted an accord and satisfaction, discharging the decorator's duty to pay the balance.","The carpenter can recover the £100 balance from the decorator because there is a lack of consideration for the promise to forego the balance.","The carpenter is estopped from suing for the balance because he cashed the cheque knowing that it was being tendered in full settlement.","The carpenter accepting a cheque marked 'payment in full and final settlement' constituted a release, which discharged the contract.","The carpenter can recover the £100 from the decorator because of her duress in insisting on paying a lesser sum when she knew he needed the money."],ans:"B",expl:"(B) Generally, payment of a smaller sum than due will not be sufficient consideration for a promise by a creditor to discharge a debt, with some common law exceptions, for example payment at an earlier date or payment by a third party, none of which is present in this scenario. (A) is incorrect because accord and satisfaction requires some benefit to be conferred on the party accepting payment of a lesser amount, and there is nothing in the scenario to suggest the carpenter has received any such benefit. (C) is incorrect because there is no promissory estoppel because there was no change of position by the decorator based on any act or statement by the carpenter. (D) is incorrect because the carpenter accepting a cheque is not sufficient to discharge the designer's contractual duty to pay him the full amount in the absence of new consideration. (E) is incorrect because the requirements for duress are not present in the scenario as this doctrine relates to the conclusion of a contract, not a part payment situation. There is no new contract here (not even a contract to vary the existing contract)."},{n:56,id:"CNL166",scenario:"A local council has announced that before moving the local market to a new location, they would consult with the market traders who have stalls on the market. However, the council decided to forgo meeting with the traders and located the market to a site away from the main shopping area. The market traders seek judicial review of this decision.",q:"Which of the following grounds for the market traders' judicial review claim is most likely to succeed?",opts:["The local council has not complied with the general common law duty to consult.","The local council has not complied with the general common law duty to give reasons.","The local council has not given effect to a legitimate expectation.","The local council has acted irrationally.","The local council has breached a mandatory requirement."],ans:"C",expl:"(C) The ground most likely to succeed is that the local council has not given effect to a legitimate expectation. A court may require a public body to be bound by a legitimate expectation. A public body gives rise to a legitimate expectation when it facilitates the belief that it will exercise its powers in a certain way. A legitimate expectation may arise by either an explicit promise by the public body, or by previous conduct. In promising to consult with the market traders before moving the local market, the council gave rise to a legitimate expectation, which they did not go on to fulfil. (A) and (B) are incorrect because there is no general common law duty to consult or give reasons, respectively. (D) is incorrect because the concept of 'irrationality' applies only to decisions that are so outrageous that they are deemed to be outside of the decision maker's powers. Since this is a high threshold to meet, and there is no indication that the decision here was irrational, (D) is not the best choice. (E) is incorrect because there is no mandatory requirement at issue."},{n:57,id:"BSL236",scenario:"On 1 April, some shareholders of a company met informally to discuss their dissatisfaction with one of the company's directors. They consulted the company's articles of association for guidance, but the articles were silent on the issue of removal of a director. The shareholders decided that they want to remove the director from office as soon as possible.",q:"When is the soonest the shareholders can remove the director?",opts:["Immediately, by use of a written resolution signed by a simple majority of the shareholders.","Immediately, by use of a unanimous written resolution.","With 14 days' notice at a general meeting.","With 21 days' notice by special resolution passed at a special meeting of the members.","With 28 days' notice by an ordinary resolution passed at a meeting of the members."],ans:"E",expl:"(E) Under the Companies Act 2006, removing a director from office requires only an ordinary resolution of the shareholders (a simple majority of more than 50%). However, special notice is required - 28 days. (A) and (B) are incorrect, as a company is not permitted to use a written resolution to remove a director, even if the resolution is unanimous. The director is entitled to attend the meeting where their removal is proposed and represent themselves. (C) is incorrect because even though a general meeting may be called on 14 days' notice, special notice is required to remove a director. (D) is incorrect as it is an ordinary resolution, not a special resolution, that is required to remove a director from office and the notice period for removing a director from office is 28 days, known as special notice."},{n:58,id:"DIS012",scenario:"A defendant has received a Notice of Proposed Allocation to the Multi-track together with a Directions Questionnaire.",q:"How long does the defendant have to return it to the court?",opts:["7 days.","14 days.","21 days.","28 days.","56 days."],ans:"D",expl:"(D) The order normally allows 28 days for the parties to complete and return the Directions Questionnaire to the court. The case management powers of the court would permit the court to allow longer if it felt that was appropriate, but this would be unusual, as the court is keen to actively case manage and progress cases. Thus, (A), (B), (C), and (E) are incorrect."},{n:59,id:"CTR022",scenario:"A woman was induced to enter into a contract by her neighbour, as a result of a negligent misrepresentation made by the neighbour.",q:"Which of the following is not true in relation to the woman's rights in respect of the misrepresentation?",opts:["If an actionable misrepresentation can be proved, the woman can elect to affirm the contract and claim damages.","The woman has a right to rescind the contract, but this right may be lost if it is impossible for the parties to be restored to their pre-contract position.","The woman will be entitled to damages under the Misrepresentation Act 1967.","The contract between the woman and her neighbour will be automatically void as a result of the negligent misrepresentation.","As well as a contractual claim, the woman would also have a cause of action in the tort of negligence."],ans:"D",expl:"(D) Where misrepresentation is proved, the contract is voidable at the election of the innocent party. Therefore (D) is the correct answer because it is not a true statement. The contract would not be automatically void. (A) is the wrong answer for the same reason: when a contract is voidable, the innocent party can elect to treat it as having come to an end or to affirm it, and claim damages for any loss suffered. (B) is incorrect because it is also a true statement, whilst rescission is an option, one of the bars to rescission is when the parties cannot be restored to their pre-contractual position, for example, because a third party has acquired rights. (C) is not the correct answer because, under the Misrepresentation Act 1967, negligent misrepresentation is a cause of action for damages. (E) is incorrect because it is a true statement. As well as a statutory claim for damages under the Misrepresentation Act 1967, the woman would alternatively be able to claim under the tort of negligence for negligent misstatement."},{n:60,id:"TAX066",scenario:`An investor made the following chargeable gains and allowable losses for the tax year 2020/21:
• Gain of £4,300 on the sale of a painting which the investor sold for £12,000.
• Gain of £5,000 on the sale of an antique vase which the investor sold for £10,000.
• Capital loss of £6,000 on the sale of a diamond brooch.
The investor did not carry forward any losses from previous years.`,q:"How much loss will the investor have to carry forward to the tax year 2021/22?",opts:["£0","£9,000","£4,000","£13,000","£10,000"],ans:"A",expl:"(A) £0. If a taxpayer's capital losses exceed the taxpayer's capital gains in a year, the capital losses may be carried forward to future years to offset capital gains in those years. To calculate capital gains or losses, we add up the gains for the year (£4,300 + £5,000 = £9,300) and subtract out the losses for the year (£9,300 - £6,000 = £3,300). (Note that the painting and vase are nonwasting chattels; because each was sold in excess of the £6,000 exemption threshold, the gain is a chargeable gain.) We then subtract out the £12,300 annual deduction (£3,300 - £12,300 = - £9,000). Since the result is a negative number, there is no loss to carry forward. (B) is incorrect because the unused annual exemption does not get carried forward as a loss; rather, it simply disappears. (C) is incorrect because the order is important: current year losses must be set off against the gains for the year before subtracting the annual deduction. Thus, the £4,000 loss cannot be carried forward even though the gains for the year are less than the annual exemption. (D) is incorrect for the same reason: it relies on deducting the annual exemption first and carrying forward both the unused part of the exemption and the loss for the year. (E) does not appear to be related to any number calculable from the facts."}],J1=[{n:61,id:"TRT005",scenario:"An impatient driver who was fed up with pedestrians walking on the road drove straight at one of them, leaning on the horn and intending to make her jump. The pedestrian did not hear him or change her pace, however, because her music player was turned to full volume. A bystander on the curb rushed out to pull her to safety. The pedestrian tripped as she was being pulled to the curb, fracturing her kneecap.",q:"Which of the following best describes the outcome of a claim if the pedestrian sues the driver for assault?",opts:["The claim would not succeed because the pedestrian did not know at the time that she was in danger from the driver.","The claim would succeed because the driver intended to create in the pedestrian an apprehension of immediate harmful contact.","The claim would not succeed because the driver did not intend the pedestrian to be injured by his conduct.","The claim would succeed because the driver's conduct caused the pedestrian's injury.","The claim would not succeed because the bystander's intervention broke the chain of causation."],ans:"A",expl:"(A) The claim would not succeed. The driver is not liable for assault because he did not cause the pedestrian to reasonably apprehend an immediate harmful contact. For assault, the claimant must show an intentional act which causes the claimant reasonably to apprehend the immediate and direct infliction of unlawful force on her person. For there to be apprehension, the claimant must be aware of the defendant's act at the time that it is occurring. Here, because the pedestrian was oblivious to the driver's attempt to scare her, the driver is not liable for assault. (B) is incorrect. While the driver did have the intent to commit an assault, his act does not meet the requirements for the prima facie case because his act did not cause reasonable apprehension. (C) is incorrect because whether the driver had an intent to injure the pedestrian is irrelevant for purposes of assault. (D) is incorrect because, although the driver caused the injury, he did not cause the apprehension required for an assault. (E) is incorrect because the intervention by a bystander was reasonably foreseeable and so would not break the chain of causation. The other element of reasonable apprehension in the cause of action in assault has not been met so the claim will fail in any event. Note that the question focuses on an assault action, but the pedestrian could also bring an action against the driver in negligence."},{n:62,id:"LGS013",scenario:"A solicitor is preparing some training for newly qualified solicitors on the information with which clients should be provided at the outset of a litigation matter.",q:"Which of the following best describes a solicitor's obligation to a client with regard to the costs of bringing or defending a civil claim?",opts:["The solicitor should only provide the client with an estimate of the likely costs.","The solicitor should only provide the client with an estimate of the likely costs and an agreed plan for payment of the costs.","The solicitor should only explain relevant funding mechanisms to the client, provide the client with an estimate of the likely costs at the start of the case, and update that estimate throughout the case.","The solicitor should explain all funding mechanisms to the client, provide the client with an estimate of the likely costs at the start of the case, and update that estimate throughout the case.","The solicitor should only provide the client with an estimate of the likely costs at the start of the case and update that estimate throughout the case."],ans:"C",expl:"(C) The solicitor should explain relevant funding mechanisms to the client, provide the client with an estimate of the likely costs at the start of the case, and update that estimate throughout the case. The SRA standards and regulations require solicitors to be transparent on the issue of costs, and these matters must be discussed with the client at the beginning of the case and updated throughout the case. In addition, the solicitor must explain and advise the client on relevant funding mechanisms. (A) and (B) are incorrect as the solicitor must explain relevant methods of funding rather than just estimate costs. (D) is incorrect as the solicitor need not explain all funding mechanisms, but rather only methods which are relevant and applicable on the facts. For example, there is no need to address legal aid or third-party funding in the context of claims where they will not be available. (E) is incorrect because it leaves out the need to address funding."},{n:63,id:"TRT052",scenario:"A woman visited a public lavatory owned by the local authority. When she tried to get out, the lock would not open and she was trapped. The lock had not been properly maintained and had therefore stuck shut. She unsuccessfully tried for a long time to attract attention. She then decided she could get out by climbing over the toilet door. To do this she had to stand with one leg on the toilet seat and the other on the toilet roll holder. The holder moved, and she fell to the ground, injuring herself. The woman sued the local authority to recover damages for her injuries.",q:"Which of the following is the best description of the likely outcome of the action by the woman?",opts:["It will not succeed, because the local authority has no duty of care towards the woman in these circumstances.","It will succeed, because the local authority is in breach of the duty owed to the woman and the woman will recover all of her damages.","It will not succeed because the woman's actions broke the chain of causation between the failure to maintain the lock and her injuries.","It will succeed, but a defence of contributory negligence can be relied on by the local authority which could reduce the amount of damages.","It will not succeed, because the local authority was not in breach of its duty to the woman."],ans:"D",expl:"(D) The action will succeed but the woman's damages may be reduced. The woman was a lawful visitor to premises occupied by the local authority. Therefore, a duty was owed to her under the Occupiers' Liability Act 1957 to take reasonable care to see that she was reasonably safe in using the premises. That duty was breached by the failure to maintain the lock. But for the breach, the woman would not have been injured. The woman's actions are not likely to break the chain of causation. For the claimant's own actions to break the chain of causation, the claimant must have acted entirely unreasonably, which is not the case on these facts. The chain of causation is unlikely to be broken by an action which the defendant clearly ought to have foreseen as a very likely consequence of his negligence - which is the case here. However, the defence of contributory negligence is likely to apply. The woman's choice to stand on the toilet roll holder does show a failure to take reasonable care for her own safety, which contributed to the harm she suffered. Therefore, her damages would be reduced. (A) and (E) are incorrect because the local authority did owe a duty of care to the woman, as explained above, and was in breach. (B) is not the best answer because it does not acknowledge the likelihood of a defence of contributory negligence being raised by the local authority. (C) is incorrect. The woman's actions are not likely to break the chain of causation, as explained above."},{n:64,id:"DIS140",scenario:"A claimant is suing his mechanic for £3,500 damages. Whilst driving home from the mechanic's garage, the claimant's car lost all of its oil and the motor seized. It appears the mechanic failed to properly tighten the car's oil filter. The mechanic is a sole trader named Frederick Chase, but everyone knows him as Fred Chase and he does business under the name of Chase Auto Werks.",q:"What name should the claimant put on the N1 claim form to indicate the name of the defendant?",opts:["Fred Chase trading as Chase Auto Werks.","Fred Chase.","Frederick Chase.","Frederick Chase T/as Chase Auto Werks.","Chase Auto Werks."],ans:"D",expl:`(D) The claim form must include the full, unabbreviated name of the defendant, and if they are carrying on business in another name, that name too. Thus, Frederick Chase T/as Chase Auto Werks (the "T/as" is acceptable to indicate the words "trading as"). (A) is incorrect because it does not use the defendant's full unabbreviated name. It does not matter that everyone knows him as Fred. (B) is incorrect for the same reason and because it is missing an indication of the business name, as is (C). (E), of course, is wrong because it includes only the business name.`},{n:65,id:"TAX162",scenario:"In March 1990, a sole trader purchased an office for £641,300 to use within his business. The sole trader incorporated the business in March 2021, transferring all the assets to a company in return wholly for shares. At this time, the building had a market value of £1,250,400. The sole trader made no other disposals of chargeable assets during 2020/21. The sole trader has taxable income of £33,130 in 2020/21 after deduction of his personal allowance.",q:"What is the sole trader's capital gains tax liability for 2020/21?",opts:["£60,910","£121,383","£59,680","£118,923","£0"],ans:"E",expl:"(E) £0. On the incorporation of a sole trade business, incorporation relief is available to defer all of the gain where the incorporation is wholly for shares. The gain defers until the shares are sold in the future."},{n:66,id:"TRT085",scenario:"A man is injured in an accident caused by the negligence of the defendant. As a result of his injuries he needs care at home. His wife gives up work to care for him and he also pays for a commercial carer to assist some of the time.",q:"Which of the following statements best describes the damages recoverable as a result of the accident?",opts:["The man can recover for his injuries and the reasonable cost of the care provided by his wife and the commercial carer.","The man can recover for his injuries and the reasonable costs of the commercial care, and the man's wife can recover the reasonable costs of the care she provides.","The man can recover for his injuries and the reasonable costs of the commercial care, but there can be no claim for the cost of care provided gratuitously by his wife.","The man can recover for his injuries, but he cannot recover any of the care costs because this is pure economic loss.","The man can recover for his injuries and for whatever commercial care costs he actually incurs."],ans:"A",expl:"(A) The man can recover for his injuries and the reasonable cost of the care provided by his wife and the commercial carer. (B) is not correct. The provider of care (the wife) does not have a separate claim against the defendant. The cost of care forms part of the claimant's damages. (C) is not correct. An award of damages can still be made to cover the claimant's need for care, even where the care is provided gratuitously. (D) is not correct. The cost of care needed by the claimant is not pure economic loss. It is consequential economic loss caused by his personal injuries. (E) is not correct. First, it is not correct to say that the man can recover whatever commercial care costs he actually incurs because recoverable care costs must be reasonable and necessary. Second, the statement does not recognise that the man's damages should also cover the need for care provided by his wife."},{n:67,id:"TRT126",scenario:"A journalist wrote a report, which was printed in a national newspaper, stating that a politician had committed adultery. The politician acknowledges that the report is true but claims that publication amounted to an unjustified interference with his right to keep his family life private.",q:"If the politician seeks to pursue a claim against the journalist in respect of the report, which of the following best describes the likely outcome?",opts:["The politician will have a successful claim for defamation unless the journalist can establish the defence of publication on a matter of public interest.","The politician will have a successful claim for defamation provided he can establish that he had a reasonable expectation of privacy in respect of the information disclosed.","The politician will not have a successful claim for defamation because the information published is true.","The politician will have a successful claim for misuse of private information provided he can establish that he had a reasonable expectation of privacy in respect of the information disclosed.","The politician will not have a successful claim for misuse of private information because the information published is true."],ans:"C",expl:"(C) The politician will not have a successful claim for defamation. The statement referring to the politician was published and is likely to be defamatory. However, it is a complete defence to a claim in defamation that the statement is true. (A) is not correct. Any claim in defamation would be defeated by the defence of truth (as stated above) so the journalist would not need to establish any other defence. (B) is not correct. Even if the politician did have a reasonable expectation of privacy in the information disclosed, he cannot have a successful claim in defamation because the information disclosed was true, as stated above. (D) is not correct because it does not state both elements required for a successful claim for misuse of private information. Even if the information disclosed was private, the claim will fail if it was in the public interest for the information to be disclosed. (E) is not correct because a claim for misuse of private information can be made even if the information disclosed is true, provided that there was a reasonable expectation of privacy in respect of the information and it was not in the public interest for the information to be disclosed."},{n:68,id:"LGS003",scenario:"A human resources manager deals with recruitment of new staff including conducting interviews and preparing and signing employment contracts on her employer's behalf.",q:"Is the human resources manager carrying out a reserved legal activity?",opts:["No, because preparing contracts of employment is not a reserved legal activity.","Yes, because preparing contracts of employment is a reserved instrument activity.","Yes, because preparing contracts of employment is a notarial activity.","No, because signing the contracts of employment makes the manager a party to the contract.","Yes, because preparing the contracts is giving legal advice to the manager's employer."],ans:"A",expl:"(A) Preparation of employment contracts is not a reserved legal activity and is commonly carried out by non-legally qualified people such as HR directors. The reserved activity for preparation of instruments extends to preparing transfers or charges, lodging documents under the Land Registration Act, or preparing other instruments relating to property. (B) is incorrect because, as explained above, a contract of employment is not a reserved instrument. (C) is incorrect because there is no notarial activity involved in the preparation of a contract of employment. Notarial activities include witnessing and certifying documents and non-contentious legal work, such as preparing wills and administering estates. (D) is incorrect because, as discussed above, there is no reserved legal activity here. Additionally, as the manager is signing the contract on the employer's behalf, the employer would be a party to the contract rather than the human resources manager. (E) is incorrect because the provision of legal advice is not automatically a reserved legal activity."},{n:69,id:"TRT053",scenario:"A passenger in a car decided not to wear a seat belt. An accident occurred which was caused entirely by the negligence of a bus driver. The passenger suffered an injury which was made much more severe by the fact that he was not wearing a seat belt.",q:"In a claim by the passenger against the bus driver, which of the following statements is correct?",opts:["The passenger's failure to wear a seat belt will result in his damages being reduced because it constituted voluntary assumption of risk.","The passenger's failure to wear a seat belt will cause his claim to fail because it contributed to causing the harm he suffered.","The passenger's failure to wear a seat belt will have no effect on his claim, provided he shows that he personally believed that not wearing a seat belt was safer.","The passenger's failure to wear a seat belt will have no effect on his claim because it did not contribute to causing the accident to happen.","The passenger's failure to wear a seat belt will result in his damages being reduced because it amounted to a failure to take reasonable care for his own safety, which contributed to the harm he suffered."],ans:"E",expl:"(E) The passenger's damages will be reduced. The passenger's failure to wear a seat belt will give rise to the defence of contributory negligence. This applies where the claimant has failed to take reasonable care for his own safety and such failure contributes to the harm suffered by the claimant. Where this defence applies, damages are to be reduced to such extent as the court thinks just and equitable having regard to the claimant's share in the responsibility for the damage. (A) is not correct. For the defence of voluntary assumption of risk to apply, the claimant must have had full knowledge of the risk and the claimant must have freely and voluntarily assumed the risk, and this defence will defeat the claim entirely rather than reduce damages, unlike contributory negligence. (B) is not correct. Carelessness by the claimant which contributes to the harm suffered will not cause the claim to fail. It will result in a reduction in damages, as stated above. (C) is not correct. The passenger has failed to take reasonable care for his own safety. This is measured according to the standard of the ordinary reasonable person in his position, not according to the passenger's own personal beliefs. (D) is not correct. For the defence of contributory negligence to apply, the passenger's failure to take reasonable care need not contribute to causing the accident to happen. It only needs to contribute to the injury which he suffered."},{n:70,id:"CTR064",scenario:"A contract between a construction company and its subcontractor firms has a clause that states that 'the construction company will not be liable for any damage to the subcontractor's property resulting from the negligence of the construction company or its employees'. The clause is clearly displayed in the construction company's standard terms and conditions, which the subcontractors signed. Property belonging to a subcontractor has been damaged as a result of the negligence of an employee of the construction company.",q:"Would the subcontractor be able to bring a claim for the damage to their property?",opts:["No. Because the parties are both acting at arm's length and in the course of business, they are bound by the terms of the contract they have signed.","No. Under the Unfair Contract Terms Act 1977, any attempt to exclude liability for negligence for damage to property will be void unless reasonable, and this clause is likely reasonable.","Yes. Under the Unfair Contract Terms Act 1977, any attempt to exclude liability for negligence is automatically void.","Yes. Under the Unfair Contract Terms Act 1977, any attempt to exclude liability for negligence for damage to property will be void unless reasonable, and this clause is likely unreasonable.","Yes. Exclusion clauses are not valid under common law."],ans:"B",expl:"(B) If an exclusion clause is effective under the common law rules (that is, if it is incorporated into the contract and as a matter of construction the wording covers what has happened), it then needs to pass the statutory tests. As the parties in this scenario are both acting in the course of business, the relevant statute is the Unfair Contract Terms Act 1977 ('UCTA'). The UCTA provides that any attempt to exclude liability for damage to property due to negligence will be void unless reasonable. What is reasonable requires the term in question to have been a fair and reasonable one having regard to the circumstances which were, or ought reasonably to have been, known to or in the contemplation of the parties when the contract was signed. What is fair and reasonable may depend, for example, on the strength of the parties' bargaining positions relative to each other, and whether the party seeking to bring a claim knew or ought to have known about the existence of the term. In this scenario, there is nothing to suggest that the parties were not in an equal bargaining position, and it would seem that the subcontractor should have known about the term as they signed the contract. Therefore the clause would appear to be reasonable. (A) is incorrect because, irrespective of whether the parties are acting at arm's length and have signed a contract, for an exclusion clause to be valid, the relevant common law and statutory rules must be followed. (C) is incorrect because any attempt to exclude liability in negligence for death or personal injury is automatically void, but not an exclusion of liability for other types of damage/loss. (D) is incorrect because there is nothing to suggest that this exclusion clause is unreasonable, under the UCTA, for the reasons set out above. (E) is incorrect because exclusion clauses are not automatically invalid under the common law, but must meet certain criteria, namely that they must be incorporated into the contract (by signature, notice, or a previous course of dealings) and [the wording] must cover what has happened.",note:"Part of the final sentence of the answer discussion is obscured in the source; the bracketed words are reconstructed from the earlier part of the same explanation."},{n:71,id:"LGS001",scenario:"A sole trader wants to bring a claim for an outstanding debt against one of his customers. To keep costs down, the sole trader intends to carry out all of the work on the claim himself.",q:"Under the rules of the Legal Services Board, will the sole trader be able to bring the claim himself?",opts:["No, because the sole trader will be conducting litigation which is a reserved legal activity.","No, because all debt litigation must be carried out by a solicitor.","Yes, because the sole trader will be a party to the proceedings and may carry out a reserved legal activity.","Yes, because the Solicitor's Regulation Authority allows any person to conduct litigation.","Yes, because conduct of litigation is not a reserved legal activity."],ans:"C",expl:"(C) Conduct of litigation is a reserved legal activity and, typically, reserved legal activities may be carried out only by those authorized to do so by one of the Legal Services Board regulators. However, a person can carry out that activity without being authorised by one of the Legal Services Board regulators if they are a party to the proceedings. (A) is therefore incorrect. (B) is incorrect as there is no requirement to use a solicitor in debt litigation. (D) is incorrect as conduct of litigation is a reserved legal activity and so can be carried out only by either the parties to the proceedings or someone authorised by one of the Legal Services Board regulators. It is the Legal Services Board, not the SRA, who sets the rules for reserved legal activities. (E) is incorrect, as conduct of litigation is one of the reserved legal activities."},{n:72,id:"LGS066",scenario:"A solicitor meets with a woman interested in purchasing several casinos and they agree to the engagement. To comply with money laundering regulations, the solicitor asks the woman to show some sort of identification. The woman shows the solicitor her passport and the solicitor makes a copy of it.",q:"For how long must the solicitor keep the copy of the passport?",opts:["Until the representation is completed.","Three years.","Three years after the representation is completed.","Five years.","Five years after the representation is completed."],ans:"E",expl:"(E) The solicitor should keep a copy of the passport for five years after the representation is completed. Broadly, records of customer due diligence (such as verification of clients' identity) and business relationships should be kept for five years after the end of the relationship. (A) - (D) are incorrect because they do not describe the correct period for which the records must be kept."},{n:73,id:"BSL232",scenario:"Three friends are partners in an advertising agency. There is no partnership agreement. Partner 1 works full-time in the agency, and partners 2 and 3 each work half-time. Partner 2 invested £60,000 in the agency, and partner 1 and partner 3 invested £30,000 each. Partner 3 is responsible for bringing in 50% of the agency's business, and partner 1 and partner 2 are responsible for 25% each.",q:"How should profits of £60,000 for the year be divided?",opts:["Partner 1 £30,000, partner 2 £15,000, partner 3 £15,000.","Partner 1 £20,000, partner 2 £20,000, partner 3 £20,000.","Partner 1 £15,000, partner 2 £30,000, partner 3 £15,000.","Partner 1 £15,000, partner 2 £15,000, partner 3 £30,000.","Partner 1 £25,000, partner 2 £17,500, partner 3 £17,500."],ans:"B",expl:"(B) In the absence of any provision in the partnership agreement to the contrary, profits are shared equally among the partners. So if partners contribute unequal shares at the outset of the partnership and want to share in any profits pro rata to their capital contributions, this would need to be dealt with in the partnership agreement. In this scenario there is nothing to suggest that the partners have agreed to a pro rata profit sharing arrangement, so the profits would be split equally between the three partners, that is, £20,000 each."},{n:74,id:null,scenario:"A firm of accountants wishes to incorporate as a limited liability partnership ('LLP') to give its members the benefit of limited liability whilst still being able to constitute their business as a partnership with its associated flexibility. However, the accountants are concerned about meeting the various formality requirements.",q:"Which of the following statements regarding the formation of an LLP is true?",opts:["The LLP can start trading immediately after filing the required documents with Companies House.","The LLP must have only one designated member.","The LLP must have a name ending in 'Ltd' or 'Limited'.","The members must have an LLP agreement.","The LLP must have at least two members."],ans:"E",expl:"(E) An LLP must have at least two members. (A) is incorrect because the LLP cannot begin trading until it receives a certificate of incorporation from Companies House. (B) is incorrect because an LLP must have at least two designated members. (C) is incorrect because it states the naming requirement for a private company. The name of an LLP must end in 'LLP' or 'Limited Liability Partnership'. (D) is incorrect. An LLP agreement is a private contract between the members of the LLP and is not a requirement for formation. If the members decide to have an LLP agreement to regulate their affairs, this will override any statutory provisions that conflict with it.",note:'The answer page shows the question ID as "-----" (no ID given).'},{n:75,id:"CNL023",scenario:"A woman is explaining the UK's political system to a friend. She says that the last general election took place in 2017. The woman tells her friend when the next general election is due.",q:"Which year should the woman have told her friend?",opts:["2018","2019","2022","2020","2021"],ans:"C",expl:"(C) The next general election would be due in 2022. Under the Fixed-term Parliaments Act 2011, general elections are held five years following the previous general election. The only exception to this is if a general election is held earlier under the provisions of the 2011 Act. Therefore, (A), (B), (D), and (E) are incorrect."},{n:76,id:"LGS106",scenario:"A solicitor has joined a new firm and was assigned files from a number of clients. One of the clients whose file was assigned to the solicitor calls and says he is angry because of the lack of progress on their matter. The solicitor finds the appropriate file and notices that the previous solicitor working on the file filed a suspicious activity report about the client with the firm's Money Laundering Reporting Officer ('MLRO'). The solicitor explains to the client that a colleague had filed a suspicious activity report but that she would soon resume working on the file. She then returns to working on other matters.",q:"Which of the following best describes whether the solicitor has committed an offence under the Proceeds of Crime Act 2002 ('POCA')?",opts:["The solicitor has not committed an offence because she has a duty to inform the client of the progress of their matter.","The solicitor has committed the offence of failure to report because she should have made her own suspicious activity report about the client to the MLRO.","The solicitor has committed the offence of tipping off because she disclosed her colleague's suspicious activity report to the client.","The solicitor may have committed the offence of tipping off because the disclosure might prejudice any investigations into the client.","The solicitor has not committed an offence because the disclosure was oral rather than in writing."],ans:"D",expl:"(D) The solicitor may have committed the offence of tipping off because the disclosure she made might prejudice any investigations into the client. The indirect offence of tipping off can arise where there is a disclosure to a third person that a suspicious activity report has been made to the police, HM Revenue and Customs, the National Crime Agency, or the firm's MLRO if that disclosure might prejudice any investigation that might be carried out. Here, the solicitor disclosed to the client that the solicitor's colleague had made a suspicious activity report about the client to the firm's MLRO. As this disclosure might prejudice any investigation into the client, the solicitor may have committed the offence of tipping off. (A) is incorrect because while the solicitor should keep a client informed about the progress of their matter, she also must avoid committing the offence of tipping off. Thus, she should not have disclosed her colleague's suspicious activity report to the client. (B) is incorrect because the relevant offence here is tipping off, not failure to report. In any event, the solicitor has no independent suspicions about her colleague's client's involvement in money laundering and therefore does not need to make her own report to the MLRO. (C) is incorrect because the mere disclosure of a suspicious activity report to a third party is not sufficient to commit the offence of tipping off. The disclosure must also have the potential to prejudice the investigation. (E) is incorrect because the disclosure in a tipping off offence can be oral or in writing."},{n:77,id:"LGS076",scenario:'A woman instructs her solicitor to act for her in relation to the sale of an investment property which she owns. She intends to use the proceeds of sale to renovate her own house and to purchase some Premium Bonds. The solicitor advises on the sale of the property and the purchase of the Premium Bonds. Neither the solicitor nor his firm is authorised by the Financial Conduct Authority to carry on a "regulated activity" as defined in the Financial Services and Markets Act 2000 and related secondary legislation.',q:"Has the solicitor breached the general prohibition against carrying on a regulated activity?",opts:["Yes, because the solicitor advised the client on a specified investment and no exclusion or exemption applies.","Yes, because the solicitor cannot provide any investment advice unless authorised or exempt.","No, because the solicitor advised on a specified investment but could rely on the incidental exclusion.","No, because the solicitor advised on a specified investment but could rely on the Designated Professional Body exemption.","No, because the solicitor did not advise the client on a specified investment."],ans:"E",expl:"(E) The solicitor has not breached the general prohibition against carrying on a regulated activity because he did not advise the client on a specified investment. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. Here, the solicitor has been asked to advise (a specified activity) on using the proceeds of sale to purchase Premium Bonds. However, national savings products such as Premium Bonds are not specified investments. Therefore, in advising on the Premium Bonds, the solicitor was not carrying out a regulated activity in breach of the general prohibition. (A) is incorrect because, as explained above, Premium Bonds are not a specified investment, so the solicitor may provide advice on them without breaching the general prohibition. (B) is incorrect because solicitors can provide investment advice on non-specified investments without authorisation or exemption. (C) and (D) are incorrect because, as explained above, Premium Bonds are not a specified investment. As there is no regulated activity here, the solicitor would not need to rely on the necessary exclusion or the Designated Professional Body exemption."},{n:78,id:"TRT069",scenario:"An employer takes on a new member of staff to work as part of a team. He lies and tells the employer that he is a qualified crane operator. The employer does not ask to see any evidence of his qualifications and does not require him to undergo any test of competence. When he is put to work on a complex crane, he realises that he does not know how to operate it safely but is too afraid to admit it, so he goes ahead with the job. After he has dropped several items from the crane through failing to operate it competently, his fellow team members complain. However, the employer has no other member of staff available, so allows him to continue. Unfortunately, the next time he operates the crane he makes a serious error and drops a heavy load onto a fellow employee
