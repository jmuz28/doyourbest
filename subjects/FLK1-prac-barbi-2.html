x?-1:a.x>l.x?1:a.y<l.y?-1:a.y>l.y?1:0),G1(i)}function G1(r){if(r.length<=1)return r.slice();const i=[];for(let l=0;l<r.length;l++){const u=r[l];for(;i.length>=2;){const d=i[i.length-1],h=i[i.length-2];if((d.x-h.x)*(u.y-h.y)>=(d.y-h.y)*(u.x-h.x))i.pop();else break}i.push(u)}i.pop();const a=[];for(let l=r.length-1;l>=0;l--){const u=r[l];for(;a.length>=2;){const d=a[a.length-1],h=a[a.length-2];if((d.x-h.x)*(u.y-h.y)>=(d.y-h.y)*(u.x-h.x))a.pop();else break}a.push(u)}return a.pop(),i.length===1&&a.length===1&&i[0].x===a[0].x&&i[0].y===a[0].y?i:i.concat(a)}var K1=wg,Tg=bg;const Y1=C.forwardRef(({className:r,sideOffset:i=4,...a},l)=>T.jsx(K1,{children:T.jsx(Tg,{ref:l,sideOffset:i,className:ge("z-50 overflow-hidden rounded-md bg-popover px-3 py-1.5 text-xs text-popover-foreground animate-fade-in",r),...a})}));Y1.displayName=Tg.displayName;const Q1=[{n:1,id:"TRT050",scenario:"A dentist filling a patient's cavities used a newly developed local anaesthetic that was more effective than other anaesthetics. However, it carried a 1% risk of causing a serious seizure when administered, which the dentist did not mention to the patient or note in the consent forms, which stated only that a local anaesthetic would be used. The dental work was completed without any problem, but the patient looked up the anaesthetic and learned about the risk. She complained to the dentist that she would not have consented to use of the anaesthetic had she known of the risk, but the dentist argued that using the new anaesthetic was justified, and many of his colleagues were now also using it.",q:"Which of the following statements best describes the outcome of any negligence claim against the dentist?",opts:["The dentist is liable, because a reasonable person would have considered information about the risk important.","The dentist is not liable, because the dentist used his best judgment in deciding that the benefits of using the anaesthetic outweighed the risk.","The dentist is liable, because the patient would not have consented to the use of the anaesthetic if she had known of the risk of seizure.","The dentist is not liable, because the patient suffered no harm from use of the anaesthetic.","The dentist is liable, because what he did would not have been supported by a responsible body of opinion within his profession."],ans:"D",expl:"(D) There is no cause of action because the patient suffered no loss from the dentist's potential breach of duty. For the tort of negligence, a duty of care must be established (which there is here, between a dentist and their patient), that duty must have been breached (see further below on this point), and the breach of duty must have caused damage or loss, which did not happen here. One of the duties that doctors, dentists, and other health professionals owe their patients is the duty to provide a patient with enough information about the risks of a proposed course of treatment or surgical procedure to enable the patient to make an 'informed' consent to the treatment. If an undisclosed risk was serious enough that a reasonable person in the patient's position would have withheld consent to the treatment, the health care professional has breached this duty. However, breach of duty is only one element of a cause of action for negligence. The claimant must also establish causation of damage to claimant's person or property. Damage means actual harm or injury. Here, the dental work was completed without any problem and no other injury is apparent from the facts; the patient's possible distress at not being informed of the risk is not, standing alone, a compensable injury. Hence, the patient does not have a cause of action against the dentist. (A) is incorrect even though it is the key factor for establishing that the dentist breached his duty by not disclosing the risk of seizure. As discussed above, breach of duty is just one element of a negligence claim. (B) is incorrect because the fact that the dentist used his best judgment in deciding not to disclose the risk would not be a defence if the patient had been harmed by the anaesthetic. (C) is incorrect. If the patient had suffered harm from the anaesthetic, causation would be established because the patient could show that she would not have consented to the use of the anaesthetic had she known of the risk (in other words, but for the dentist's nondisclosure, the injury would not have occurred). However, in the absence of the injury element, the prima facie case is not complete. (E) is incorrect. Even if a responsible body of opinion within the dentist's profession would not have supported his failure to disclose the risks, the patient cannot recover because of the lack of damage."},{n:2,id:"TRT056",scenario:"A company runs a department store. A notice at the entrance to the store states that no liability is accepted for any personal injury or any other loss or damage, whether caused by negligence or otherwise. Recently, a customer went to the store to do some shopping. The lift in the store malfunctioned and the doors shut suddenly, trapping the customer's hand and causing serious cuts and bruising.",q:"In a claim by the customer against the company for damages for his personal injury, which of the following statements is correct?",opts:["The company can rely on the notice as a defence to the customer's claim, provided that it was clearly displayed and reasonable steps were taken to bring it to the customer's attention.","The company cannot rely on the notice as a defence to the customer's claim because the company was acting in the course of a business, so the notice cannot validly exclude liability for death or personal injury.","The company cannot rely on the notice as a defence to the customer's claim because the company was acting in the course of a business and cannot rely on an exclusion notice where the claimant does not also act in the course of a business.","The company cannot rely on the notice as a defence to the customer's claim because the scope of the exclusion is unreasonably wide.","The company can rely on the notice as a defence to the customer's claim, provided that it can show, on the balance of probabilities, that the exclusion of liability for personal injury was reasonable in all the circumstances."],ans:"B",expl:"(B) The company cannot rely on the notice. Exclusion of liability is subject to statutory controls. When the defendant acts in the course of a business, liability for death or personal injury resulting from negligence cannot be excluded. The statutory definition of negligence includes breach of the common duty of care imposed by the Occupiers' Liability Act 1957, which would be the relevant duty here, as the damage is caused by the state of the premises - the faulty lift. (A) is not correct. It is true that for an exclusion notice to be effective, reasonable steps must be taken to bring it to the claimant's attention. However, even if this is done, a notice excluding liability for death or personal injury resulting from negligence is not effective where the defendant acts in the course of a business, as discussed above. (C) is not correct because it does not state the correct reason why the company cannot rely on the notice. When the defendant acts in the course of a business, liability for death or personal injury resulting from negligence cannot be excluded even when the claimant also acts in the course of a business. (D) is not correct because it does not state the correct reason why the company cannot rely on the notice. No question as to reasonableness arises because, when the defendant acts in the course of a business, liability for death or personal injury resulting from negligence cannot be excluded. (E) is not correct. As stated above, where the defendant acts in the course of a business, liability for death or personal injury resulting from negligence cannot be excluded, so the question of reasonableness does not arise."},{n:3,id:"CNL202",scenario:"A woman is successful in her claim in the European Court of Human Rights ('ECtHR'). As a part of the decision, the ECtHR has declared that a UK law is not compliant with the European Convention on Human Rights. The woman goes to a solicitor for advice as to the effect of the decision on UK law, and the solicitor advises that the ECtHR's declaration has no effect on the law due to parliamentary supremacy.",q:"Which of the following statements is the most accurate definition of parliamentary supremacy?",opts:["Parliamentary supremacy is the constitutional rule of law that only the House of Lords can create and/or repeal legislation.","Parliamentary supremacy is the constitutional rule of law that only the Supreme Court can create and/or repeal legislation.","Parliamentary supremacy is the constitutional rule of law that only the House of Commons can create and/or repeal legislation.","Parliamentary supremacy is the constitutional rule of law that only Parliament (both Houses together) can create and/or repeal legislation.","Parliamentary supremacy is the constitutional rule of law that the UK courts can issue a declaration of incompatibility."],ans:"D",expl:"(D) Under the doctrine of parliamentary supremacy, only Parliament (both the House of Commons and the House of Lords) can create and/or repeal legislation. (A) and (C) are incorrect because both Houses of Parliament need to approve legislation before it can be passed. (B) is incorrect as the Supreme Court cannot create or repeal legislation. (E) is incorrect because it does not describe parliamentary supremacy."},{n:4,id:"DIS220",scenario:"A man loses his hand whilst operating a saw on a building site. The evidence in the case takes a couple of years to assemble, and the claimant's solicitors issue proceedings against the man's employers two weeks before limitation expires. The claim is for breach of statutory duty to provide a safe system of work and failure to train the claimant adequately in use of the saw. A week after the limitation period expires, the claimant's employers file a defence denying liability, contending that the saw was faulty. They blame the manufacturers and suppliers of the saw, contending that they did everything required to protect the claimant and train him in the correct usage of the equipment.",q:"May the man now add a claim against the manufacturer?",opts:["No, because the limitation period has expired.","Yes, the man can bring the manufacturer into the claim as second defendant without leave because he issued proceedings against the employer within the appropriate limitation period.","Yes, the man can apply to the court to disapply the limitation period for leave to bring the manufacturer in as second defendant.","Yes, the man can add the manufacturer as second defendant without leave of the court if the manufacturer consents.","Yes, the man has four months from issue of proceedings to add a new party into the action."],ans:"C",expl:"(C) The man can apply to the court to disapply the limitation period for leave to bring the manufacturer in as second defendant. The only way to add a new party after the limitation period expires (as it has here), is by application to the court to disapply the limitation period. The court does have discretion to do so. (A) is incorrect because of the ability to apply to the court to disapply the limitation period. (B) is incorrect because it is irrelevant that the claimant issued proceedings against the first defendant in time. (D) is incorrect because consent is not sufficient. The court needs to give permission. (E) is incorrect because the four-month period applies to service of proceedings after issue of proceedings. It is a red herring."},{n:5,id:"BSL173",scenario:"A company that manufactures model planes is in liquidation. Upon liquidating the company's assets, the liquidator realises £250,000. The preferential creditors are owed £50,000. The unsecured creditors are owed £500,000.",q:"Which of the following best reflects the legal position regarding payment to the various creditors?",opts:["The preferential creditors will be paid £250,000, and the unsecured creditors will receive nothing.","The preferential creditors will split £30,000, and the unsecured creditors will split £220,000.","The preferential creditors will be paid in full, and the ordinary creditors will split £200,000.","The preferential creditors will be paid one-sixth of the debt owed them before any unsecured creditor can be paid.","The preferential creditors will be paid £50,000, and the unsecured creditors will receive £500,000."],ans:"C",expl:"(C) The preferential creditors will be paid in full first, leaving £200,000 to be divided amongst the unsecured creditors. (A) is incorrect. The preference allows preferred creditors to be paid what is owed them ahead of the ordinary creditors; the preference is not an entitlement to assets beyond what is owed to the preferred creditors. (B) is incorrect as there are sufficient funds to pay the preferred creditors in full. Here, the assets were £250,000 and the preferential creditors were owed only £50,000, so the preferential creditors will be paid in full. The unsecured creditors will share what's left. (D) is incorrect because preferential creditors are paid in full to the extent there are sufficient assets - they don't share proportionally with unsecured creditors. (E) is incorrect because whilst it states the amounts owed to the various creditors, the estate's assets are only £250,000, so the ordinary creditors will not be paid in full."},{n:6,id:"DIS143",scenario:"A homeowner wishes to issue proceedings against his neighbour for trespass. The neighbour did not think the homeowner was properly trimming his hedges. The two had been arguing over the issue for months, when the neighbour finally took matters into his own hands one night. He snuck over and trimmed the hedges.",q:"If the homeowner does not include the Particulars of Claim on the N1 claim form, when must they be served?",opts:["Within 28 days of filing the claim form.","Within 28 days of serving the claim form.","Within 14 days of filing the claim form.","Within 14 days of service of the claim form.","Within 10 days of service of the claim form."],ans:"D",expl:"(D) If the Particulars of Claim (that is, a written statement setting out the details of the claimant's case) are not included on the back of the claim form, they may be in a separate written document served along with the claim form or within 14 days following service. It follows that the other time periods are incorrect."},{n:7,id:"TRT107",scenario:"A housewife baked a cake and donated it to an elderly persons' coffee morning. An elderly lady ate some of the cake and suffered from severe food poisoning. Evidence showed that the cake contained raw eggs which had not been cooked properly. The housewife lacked experience in baking and was not aware of the need to ensure that the eggs were fully cooked.",q:"If the elderly woman brings a claim against the housewife under the Consumer Protection Act 1987 ('CPA'), which of the following best describes the likely result?",opts:["The elderly woman is not likely to have a successful claim under the CPA because the housewife did not owe her a duty of care.","The elderly woman is not likely to have a successful claim under the CPA because the housewife is not a potential defendant under the Act.","The elderly woman is not likely to have a successful claim under the CPA because the housewife had baked the cake to the best of her ability.","The elderly woman is not likely to have a successful claim under the CPA because the housewife did not supply the cake in the course of a business and did not charge any money for the cake.","The elderly woman is likely to have a successful claim under the CPA because the safety of the cake was not such as persons generally are entitled to expect."],ans:"D",expl:"(D) The elderly woman is not likely to have a successful claim. Under the Consumer Protection Act 1987 ('CPA'), the housewife is a potential defendant because she is the producer of the cake. The cake is defective because its safety is not such as persons generally are entitled to expect. However, the CPA provides her with a defence because she did not supply the cake in the course of a business, and she did not produce it with a view to profit. (A) is not correct. In a claim under the CPA it is not relevant to ask whether a duty of care was owed. (Note also, that had the claim been pursued in the tort of negligence, it is likely that an established duty of care was owed). (B) is not correct. The woman is a potential defendant under the CPA as producer of the cake, but she has a defence, as explained above. (C) is not correct. Under the CPA it is not relevant to consider the degree of care or skill exercised by the defendant. The relevant consideration is whether the product is defective as defined in the Act. (E) is not correct. It is true that, under the CPA, a product is defective if its safety is not such as persons generally are entitled to expect. However, the housewife would have a defence to a claim under the Act, as explained above."},{n:8,id:"DIS263",scenario:"A mechanic wishes to bring a claim for breach of contract against the company from which it buys replacement parts. The mechanic sends a letter of claim, and the parties comply fully with the practice direction on Pre-Action Conduct and Protocols. The company instructs its solicitors, who advise the company that there is no legal basis for the customer's claim. Consequently they make no offer of settlement. The mechanic, who is acting in person, decides at the end of the three-month period not to pursue the claim, and they write to the store informing it of this fact.",q:"Can the company recover its wasted costs from the mechanic?",opts:["No, as no proceedings were issued.","No, unless the store issues a Part 7 claim to recover costs.","Yes, the store may recover fixed costs.","Yes, the store may recover its costs on the standard basis.","Yes, the store may recover its costs on the indemnity basis."],ans:"A",expl:"(A) The general position is that following compliance with the appropriate protocols, when resolution is not achieved but the claimant decides not to continue with the claim, it is unlikely that the defendant will be able to recover any costs. (B), (C), (D), and (E) are incorrect because they all suggest that costs will be ordered against a claimant who chooses not to pursue a claim beyond the protocol period."},{n:9,id:"ELS071",scenario:"A farmer alleges that a food processing company breached its contract with the farmer. The farmer properly issued a claim in the High Court after alternative dispute resolution failed. The farmer loses their case, but the farmer believes that the High Court Judge incorrectly applied the law and wishes to appeal.",q:"To which court would the farmer appeal?",opts:["The Supreme Court.","The Court of Appeal.","To another judge in the High Court.","To the Crown Court.","To a Senior Circuit Judge at the Country Court."],ans:"B",expl:"(B) The farmer should request permission to appeal to the Court of Appeal, as that is the court that hears appeals from the High Court. (A) is incorrect. The Supreme Court hears the appeals from the Court of Appeal. (C) is incorrect. Any appeal would not be heard by another judge of the same level. (D) is incorrect. The Crown Court hears appeals from the Magistrates' Court. (E) is incorrect. A Senior Circuit Judge of the County Court is at a lower level than the High Court and thus would not hear an appeal from that court."},{n:10,id:"DIS261",scenario:"A solicitor in a professional negligence claim has failed to serve her expert's report by the deadline specified in the directions order. The solicitor has missed several deadlines in the course of the proceedings. The claimant, her client, would like to prevent the solicitor from using the expert's report at trial.",q:"What application should the client make in respect to the failure of the solicitor to timely serve the expert's report?",opts:["An application to impose costs, because a late filing of an expert's report does not justify striking a defence under the overriding objective.","An application to debar the solicitor from relying on the expert's report.","An application to strike any defence the solicitor has raised, because the defendant has missed several deadlines.","An application for an unless order with respect to service of the expert's report.","An application to strike out the solicitor's defence relating to the expert's report."],ans:"D",expl:"(D) The client should make an application for an unless order with respect to the expert's report. If a party fails to comply with the directions order, the court usually will not impose a sanction unless the non-defaulting party makes an application for an unless order specifying the sanctions that may be imposed and the defaulting party fails to comply with the unless order. In that case, the court may strike out a defence or claim, impose costs, debar the defaulting party from relying on the evidence involved, and so on. But as there has been no unless order issued here, that is the first step the claimant must take in seeking to prevent the defendant from relying on the expert's report. The other choices (A), (B), (C), and (E) all state possible sanctions, but they would generally be imposed only if the defendant fails to comply with an unless order. Additionally, note that (A) is not necessarily true. The court will consider all circumstances, and if striking the defence is warranted, it is a possible sanction."},{n:11,id:"CNL179",scenario:"A UK lawyer is attempting to explain to his US colleague the structure of the UK constitution.",q:"Which of the following statements is correct?",opts:["The UK constitution is derived from a single source, akin to the US constitution.","The UK has a written constitution.","The UK constitution is codified and derived from sources including Acts of Parliament and decisions of the courts.","The UK constitution is uncodified and derived from sources including Acts of Parliament and decisions of the courts.","The UK does not have a constitution."],ans:"D",expl:"(D) The UK constitution is uncodified (also called 'unwritten'), meaning it is not derived from a single definitive source containing its most important rules. Acts of Parliament and court decisions, among other sources, make up the UK constitution. (A) is incorrect because the UK constitution is derived from a variety of sources. (B) and (C) are incorrect because the UK constitution is uncodified or unwritten. (E) is incorrect because the UK has a constitution."},{n:12,id:"CNL123",scenario:"Following the UK's exit from the European Union, a businessman determines that he no longer needs to comply with an EU regulation. The regulation was passed in 2007, and it requires employers to pay men and women the same. However, the businessman's solicitor has informed him that he is mistaken.",q:"Which of the following best explains the legal position?",opts:["The regulation remains part of UK law as EU-derived domestic legislation.","The regulation remains part of UK law as direct EU legislation.","The regulation remains part of UK law as directly effective EU law.","Even though the UK has left the EU, it will still be bound by the supremacy of EU law.","Even though the UK has left the EU, it will still be bound by decisions of the CJEU."],ans:"B",expl:"(B) The regulation remains part of UK law as direct EU legislation. The European Union (Withdrawal) Act 2018 created a new category of UK law, known as retained EU law, which came into effect after the transition period (that is, after December 2020). The 2018 Act preserves most EU law that entered UK law via the European Communities Act 1972 before the end of the transition period. EU regulations are preserved as direct EU legislation. This means that the regulation continues to apply after the transition period but now as part of UK, rather than EU, law. (A) and (C) are incorrect because they state the other two categories of retained EU law that relate to directives and provisions of EU law that have direct effect. (D) and (E) are incorrect because the question does not raise issues of supremacy or relate to decisions of the CJEU."},{n:13,id:"DIS123",scenario:"A claimant has issued a claim against a sole trader for injuries the claimant sustained when she slipped on an oil patch in the sole trader's shop. The parties could not settle their dispute through alternative dispute resolution. The claimant believes the sole trader does not have a viable defence and so applies for summary judgment after the defendant files an acknowledgment and defence to the claim. The application includes written evidence in support.",q:"Which of the following most accurately reflects the timescale regarding a hearing on the application?",opts:["The hearing can be no sooner than 21 days from the date of the application, the defendant may serve evidence in response up to 14 days before the hearing, and the claimant may serve a reply no sooner than seven days before the hearing.","The hearing can be no sooner than 14 days from the date of the application, the defendant may serve evidence in response up to seven days before the hearing, and the claimant may serve a reply no sooner than three days before the hearing.","The hearing can be no sooner than 14 days from the date of the application, the defendant may serve evidence in response up to 10 days before the hearing, and the claimant may serve a reply no sooner than five days before the hearing.","The hearing can be no sooner than 10 days from the date of the application, the defendant may serve evidence in response up to five days before the hearing.","The hearing can be no sooner than 30 days from the date of the application, the defendant may serve evidence in response up to 14 days before the hearing."],ans:"B",expl:"(B) If an applicant includes written evidence in support of an application for summary judgment, the hearing can be no sooner than 14 days from the date of the application, the defendant may serve evidence in response up to seven days before the hearing, and the claimant may serve a reply no sooner than three days before the hearing. It follows that the other choices with different timescales are incorrect."},{n:14,id:"LGS031",scenario:"To diversify its client base, a firm of solicitors offers a special discount on conveyancing transactions for Black, Asian, and minority ethnic ('BAME') clients. A non-BAME potential client is unhappy that they will have to pay more for their conveyancing transaction. The firm seeks advice as to whether the discount is discriminatory under the Equality Act 2010.",q:"Which of the following best describes the firm's special discount?",opts:["The special discount is directly discriminatory on the grounds of race and cannot be justified.","The special discount is indirectly discriminatory on the grounds of race but can be justified because it is for a legitimate reason.","The special discount is not discriminatory because it operates in favour of BAME clients.","The special discount is indirectly discriminatory on the grounds of race and cannot be justified.","The special discount is directly discriminatory on the grounds of race but can be justified because it is a proportionate means of achieving a legitimate aim."],ans:"A",expl:"(A) The special discount is directly discriminatory on the grounds of the protected characteristic of race because the firm is expressly treating non-BAME clients less favourably than BAME clients. Direct discrimination is treating one person less favourably than another because of that person having a protected characteristic. The firm cannot justify actions that are directly discriminatory on the grounds of race. Only direct discrimination on the grounds of age or disability may be justified. (B) is incorrect because this is direct discrimination, not indirect discrimination. Direct discrimination on the grounds of race cannot be justified, even by a potentially legitimate reason such as to diversify the firm's client base. (C) is incorrect because, as explained above, the special discount is directly discriminatory. The non-BAME client is being treated less favourably than the BAME clients. (D) is incorrect because the special offer is direct, not indirect, discrimination. Indirect discrimination may be justified if an employer can show the action is a proportionate means of achieving a legitimate aim. (E) is incorrect because although encouraging diversity in the firm's client base may be a legitimate reason, this is direct discrimination on the grounds of race which cannot be justified."},{n:15,id:"ETH163",scenario:"A firm of solicitors is trying to expand its business. The firm distributes leaflets to every home in the city and places an advert on a billboard. The firm also sends letters to victims of a road traffic accident to inform them of the firm's expertise in handling personal injury claims. Finally, the firm telephones certain former clients to ask them whether they would like to update their estate plans. All information provided by the firm is true and not misleading.",q:"Which action by the firm (if any) violated the SRA Standards and Regulations?",opts:["None, because all information provided by the firm was true and not misleading.","Telephoning former clients.","Placing an advert on a billboard.","Distributing leaflets to every home in the city.","Sending letters to the victims of the road traffic accident."],ans:"E",expl:"(E) A solicitor or firm must not make unsolicited approaches to members of the public to advertise its legal services. This means that a firm cannot advertise its services in a targeted or intrusive way. Sending letters to particular people (the victims of the accident) based on information known about them is a targeted approach and is therefore prohibited. (A) is incorrect for this reason. (B) is incorrect because, as an exception to the general rule, a solicitor or firm can make unsolicited approaches to current and former clients. (C) is incorrect because public advertising (such as on billboards, on the radio, in a newspaper, online, or on a social media platform) is generally allowed. (D) is incorrect because the SRA has stated that distributing leaflets to every home in a large geographic area is permitted because this is not targeted or intrusive."},{n:16,id:"BSL237",scenario:"A company issued 1,000 £1 ordinary shares and 1,000 £10 shares with a 2% noncumulative preference. The company approves distribution of a £1,000 dividend.",q:"How much will be distributed to the shareholders?",opts:["£200 to the preferred shareholders, £800 to the ordinary shareholders.","£500 to the preferred shareholders, £500 to the ordinary shareholders.","£600 to the preferred shareholders, £400 to the ordinary shareholders.","£1,000 to the preferred shareholders, £0 to the ordinary shareholders.","£0 to the preferred shareholders, £1,000 to the ordinary shareholders."],ans:"A",expl:"(A) If a company has preference shares, the preference must be paid before any dividend may be distributed to the ordinary shareholders. Here, the company has 1,000 £10 shares with a 2% preference. That means that each of the 1,000 preference shares is entitled to receive 2% of £10 before the company may make a distribution to the ordinary shareholders. So, the first £200 (20p x 1,000 shares) must be distributed to the preference share owners, which leaves £800 that may be distributed to the ordinary shareholders. (B) has no basis; it is simply giving half the funds available to each. Even though there are 1,000 ordinary shares and 1,000 preference shares, this is not the correct way to calculate distributions. (C) is incorrect because it depends on a misunderstanding of how a noncumulative preference works. The preference shareholders get their stated preference and only their stated preference (unless the shares provide otherwise). This choice is based on the preference shares receiving their preference and then dividing the remaining sum among all shares equally, treating the preference as a minimum and allowing the distributable amount to be divided among all 2,000 shares equally. (D) is incorrect because it gives the whole of the amount available for distribution to the ordinary shareholders and, as explained, the preference shares must be paid out of this sum first. (E) is incorrect as it gives the entire amount available for distribution to the preferred shareholders. Again this is not what a preference means. It just means the preference shares must be paid out of the sum first.",note:"The explanations for (D) and (E) appear to describe each other's option (D gives £1,000 to the preferred shareholders; E gives £1,000 to the ordinary shareholders). They are reproduced as they appear in the source."},{n:17,id:"TAX131",scenario:`A business owner started to trade on 1 January 2020 and immediately registered for VAT. In the quarter to 31 March 2020 the business owner had the following transactions. All figures exclude VAT.
• Standard-rated sales of £38,000, zero-rated sales of £3,000.
• Standard-rated purchases of goods of £20,000.
• Purchase of a car for £15,000, which the business owner uses 30% of the time for private purposes.
• Standard-rated expenses of £200 spent on a staff party and £200 servicing costs for the business owner's car.`,q:"What is the amount of VAT payable by the business owner to Her Majesty's Revenue and Customs for the quarter to 31 March 2020?",opts:["£3,532","£4,132","£2,632","£3,232","£3,560"],ans:"A",expl:"(A) £3,532. To determine the business owner's VAT liability for the quarter ended 31 March 2020, we take 20% of his standard rated sales of £38,000, for a total of £7,600. We then subtract 20% of his purchases of goods and the costs of the staff party (since all figures exclude VAT), for a total of £4,040. Lastly, we subtract 20% of the business use portion of the car (£200 x 20% x 70%), for a total of £28. Therefore, his total VAT liability is £3,532."},{n:18,id:"TRT054",scenario:"The claimant was carefully riding her motor bike along the road when a car driven by the defendant pulled out into her path. The defendant had failed to stop or look at the junction before pulling out. The claimant was thrown from the motor bike and suffered a broken leg. The claimant was not wearing a helmet, having forgotten to put it on before she left home.",q:"In an action by the claimant against the defendant driver of the car, which of the following statements is correct?",opts:["The defendant driver will be able to rely on the defence of contributory negligence as a complete defence to the claimant's claim.","The defendant driver will be able to rely on the defence of contributory negligence with the result that the claimant's damages will be reduced.","The claimant's failure to wear a helmet means that the defendant driver can rely on voluntary assumption of risk as a defence.","The defendant driver is unlikely to have any successful defence to the claim.","The claimant will succeed provided she can persuade the court that there was a relationship of sufficient proximity to justify imposing a duty of care on the defendant."],ans:"D",expl:"(D) The facts do not give rise to any likely defences for the defendant driver. (A) is not correct. The defence of contributory negligence does not apply on the facts. Contributory negligence requires that the claimant failed to take reasonable care for her own safety and that such failure contributed to the harm suffered. The claimant did fail to take reasonable care by failing to wear a helmet, but such failure did not contribute to the broken leg which she suffered. Also, if the defence of contributory negligence did apply, it would not be a complete defence. It would lead to a reduction in damages. (B) is not correct because, as stated above, the defence of contributory negligence does not apply on the facts. (C) is not correct. For the defence of voluntary assumption of risk to apply, the claimant must have had full knowledge of the risk of the defendant's negligence and freely and voluntarily assumed such risk. Failure to wear a helmet does not indicate that the claimant accepted the risk of the defendant's negligent driving. (E) is not correct. The relationship of a driver to other drivers is an established duty situation rather than a novel duty situation. So, it is not necessary for the court to decide whether to impose a duty of care on the defendant driver based on sufficient proximity."},{n:19,id:"BSL049",scenario:"A company went into creditors' voluntary liquidation last year. The liquidator is now finalising the amount available for unsecured creditors. The liquidator has realised £200,000 and has incurred costs of £30,000. The preferential creditors are owed £44,000 and the unsecured creditors are owed £600,000.",q:"How much will unsecured creditors receive?",opts:["£126,000","£156,000","£170,000","£200,000","£600,000"],ans:"A",expl:"(A) The unsecured creditors will split £126,000. The liquidator must pay back the creditors of the company in a set order. First, the liquidator must subtract the expenses of winding up (including the liquidator's costs). Then, the preferential debts are paid. The unsecured creditors are next in the order of priority for distribution. Thus, here we subtract the £30,000 in expenses and the £44,000 needed to pay the preferred creditors from the £200,000 the liquidator realised. (B) is incorrect because it appears to be subtracting out only the amount needed to pay the preferred creditors. (C) is incorrect because it appears to be subtracting out only the £30,000 needed to pay the liquidator's expenses. (D) is incorrect because it does not subtract out either the expenses or the amount needed to pay the preferred creditors. (E) is incorrect because it reflects the whole amount owed to the unsecured creditors and they will receive only what is left after paying expenses and preferred creditors, as explained above."},{n:20,id:"DIS153",scenario:"An electrician was injured when the equipment that was supplied by his employer malfunctioned whilst the electrician was re-wiring an office. The equipment was manufactured by a company in Taiwan. The electrician commences proceedings against his employer in the County Court. The manufacturer has an office within the UK, but nevertheless believes the County Court does not have jurisdiction over the matter.",q:"How should the manufacturer respond?",opts:["Acknowledge service within 14 days and file a defence raising the jurisdictional issue.","Acknowledge service within 21 days and file a defence raising the jurisdictional issue.","Acknowledge service within 28 days and file a defence raising the jurisdictional issue.","Tick the box on the acknowledgment of service form indicating they wish to dispute jurisdiction and make an application to do so within 14 days after the deemed date of service.","Tick the box on the acknowledgment of service form indicating they wish to dispute jurisdiction and make an application to do so within 28 days after the deemed date of service."],ans:"D",expl:"(D) A defendant who wishes to dispute a court's jurisdiction must tick the relevant box on the acknowledgment of service form indicating they wish to dispute jurisdiction, supported with written evidence, within 14 days of the deemed date of service. The defendant must not file a defence until after the court has heard the application. Filing a defence is likely to be taken as submission to jurisdiction that would negate the challenge. If the defendant's application fails, they will be required to file a defence at that point, probably within 14 days. It follows that (A), (B), (C), and (E) are incorrect."},{n:21,id:"BSL238",scenario:"A grandson recently inherited a simple majority of shares of a company from his grandmother. The grandson would like to receive as large a dividend as possible, as soon as possible, but the remaining shareholders have indicated they would prefer the company to reinvest earnings for further growth. Based on the grandson's calculations, the company has £50,000 lawfully available to distribute as a dividend. The board of directors have indicated a willingness to consider the declaration of a small dividend. The company has adopted the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association.",q:"What influence, if any, can the grandson assert on the declaration and payment of a dividend?",opts:["None, as declaration of a dividend is solely within the discretion of the board of directors and shareholders are not involved in the process.","Very little, even if the directors were to declare a dividend, the grandson's simple majority will not be enough to approve the dividend through the required special resolution.","The grandson can use his shares to vote to approve a dividend recommend by the board through an ordinary resolution.","The grandson can use his majority shares to vote to increase the dividend to the maximum amount lawfully available once the directors have recommended declaring a dividend.","As the majority shareholder, the grandson can demand the maximum dividend be declared by right."],ans:"C",expl:"(C) Under the Companies Act 2006, shareholders can approve a dividend recommended by the directors through an ordinary resolution. (A) is incorrect because the grandson does have some influence on the matter; this answer choice does not address the need to obtain approval from the shareholders through an ordinary resolution. (B) is incorrect because shareholders approve through ordinary resolution and not special resolution (which requires a greater vote). (D) is incorrect because shareholders have no power to increase the amount of dividend that was declared. (E) is incorrect because the model articles of association provide that the payment of a dividend must be recommended by the board of directors before it can be declared by the shareholders. Shareholders, even majority shareholders, are unable to demand the payment of a dividend."},{n:22,id:"ELS074",scenario:'A statute makes it an offence "to operate a motor vehicle on a public road while intoxicated". A defendant was charged with violation of the statute when he was arrested after driving his golf cart on a road whilst intoxicated. The Road Traffic Act 1988 defines a motor vehicle as "any mechanically propelled vehicle intended or adapted for use on the roads."',q:"Which of the following approaches to statutory interpretation would most likely result in convicting the defendant of the offence?",opts:["The literal rule.","The golden rule.","The mischief rule.","In pari materia.","Expressio unius est exclusio alterius."],ans:"C",expl:`(C) The mischief rule would instruct the judge to look at the problem that the criminal statute was seeking to remedy. Here, the mischief would be to prevent the harm that results from operating a vehicle on the road while intoxicated. Clearly, operating a golf cart on a road would pose a potential danger, and so the defendant could be convicted using the mischief rule. (A) is incorrect. Under the literal rule, if the words of a statute are unclear, courts use the ordinary meaning of the words to interpret the statute. The ordinary meaning of the term motor vehicle would probably be limited to cars, trucks, and motorcycles. A golf cart would not likely be included. (B) is incorrect. Under the golden rule, courts may use something other than a word's ordinary meaning to avoid absurd results. Here, it cannot be said that using the ordinary meaning of 'motor vehicle' would lead to an absurd result (that is, it would not be absurd to limit the criminal statute to the operation of fast vehicles such as cars and trucks as opposed to slow vehicles such as golf carts and electric bicycles). Therefore, the golden rule would not be used. (D) is incorrect. In pari materia roughly means 'upon the same matter'. Under this rule of interpretation, a court will look to other statutes to assist in interpreting ambiguous language. The only other statute we were given - the Road Traffic Act 1988 - defines 'motor vehicle' as a "mechanically propelled vehicle intended or adapted for use on the roads". As a golf cart is not intended or adapted for use on a road, in pari materia would not lead to a conviction here. (E) is incorrect. Expressio unius is a rule of interpretation that means expression of the one excludes inclusion of others. Here, there is no other relevant definitions other than 'motor vehicle'. And so expressio unius will not be helpful.`},{n:23,id:"BSL138",scenario:"A company is planning to change its registered office from its trading address to the office of its accountant. It needs to change its website and notepaper to reflect the change.",q:"When will the change of registered office be effective?",opts:["Immediately when the board resolve to change the registered office.","At the end of the board meeting at which the board resolve to change the registered office.","When the Change of Registered Office Address form is registered by the Registrar of Companies.","14 days after the board resolution to change the registered office.","14 days after the Change of Registered Office Address form is filed at Companies House."],ans:"C",expl:"(C) A company may change its registered office by giving notice to the Registrar of Companies. The change takes effect on registration of the notice by the Registrar. (A), (B), and (D) are incorrect as the change is not effective until it is registered at Companies House. (E) is incorrect as the change takes effect on registration of the notice by the Registrar, although there is a 14-day period after registration when a document will be validly served if sent to the previous registered office."},{n:24,id:"CTR152",scenario:"An accountancy firm has a contract with a computer support company. The contract provides that the computer support company will provide support to the firm 24 hours a day, seven days a week, at a cost of £2,000 per month. The computer support company has been unhappy with the contract for the past few months because the accountancy firm was requiring far more support than the support company anticipated. To boost revenues, the month before the accountancy firm's busy tax season, the computer support company contacted the accountancy firm and threatened to terminate the contract if the firm did not agree to pay the company an additional £750 per month for the remainder of the contract term. The computer support company contacted their solicitor, who advised them to agree. The firm agreed the next day.",q:"Is a court likely to find the price modification enforceable?",opts:["No, because the modification is voidable due to economic duress.","No, because the accountancy firm received independent legal advice.","No, because the modification is voidable because of duress to the person.","Yes, because there was consideration for the variation.","Yes, because the accountancy firm required more support than the support company anticipated."],ans:"A",expl:"(A) A contract is only voidable for economic duress if one party uses its stronger financial position in an illegitimate way. Here, the computer support company waited until shortly before the accountancy firm's busy tax season to ask for an increase in its compensation and threatened to terminate the contract if the firm did not agree. (B) is incorrect. Receiving independent legal advice under these facts would be a reason to find that the price variation is enforceable, as it could be seen as something that would alleviate the illegitimate pressure the support company put on the accountancy firm to accept the new price. (C) is incorrect because duress against the person involves physical threats, and there were no such threats here. (D) is incorrect because the support company did not give anything new in exchange for the accountancy firm's promise to pay more under the contract. Neither did the support company give up any rights, such as the right to terminate the contract, as nothing in the facts indicates the company had such a right. The mere fact that they were unhappy with the amount of support the firm required does not give them a right to terminate. (E) is incorrect for the same reason."},{n:25,id:"ETH026",scenario:"A solicitor is acting for a client in an appeal against a taxation determination by Her Majesty's Revenue and Customs ('HMRC'). The client wants the solicitor to appear for the client at the appeal hearing at the First Tier Tribunal ('Taxation'), where the appeal is to be heard. The client gives the solicitor relevant details of his assets and income, including overseas assets, but instructs the solicitor not to mention the overseas assets. These are relevant to his taxation position.",q:"Which of the following statements best describes what the solicitor should do?",opts:["The solicitor should tell HMRC about the overseas assets.","The solicitor should immediately cease to act.","The solicitor should appear for the client at the tribunal on the basis that the client has no overseas assets because those are the client's instructions.","The solicitor should attempt to convince the client to change his instructions and allow the solicitor to include the overseas assets in his case. If the client refuses, the solicitor should cease to act.","The solicitor should refuse to act because there is a conflict of interest."],ans:"D",expl:"(D) A solicitor has a duty not to mislead the court. This standard can be violated by omission. Thus, if a solicitor becomes aware that a client is attempting to mislead the court in any material matter, the solicitor should refuse to continue acting for the client unless the client agrees to disclose the truth. (C) is therefore incorrect. (A) is incorrect because there is no duty on the solicitor to tell the HMRC. (B) is incorrect because the solicitor should first try to persuade the client to disclose the truth. (E) is incorrect because there is no conflict of interest here."},{n:26,id:"TRT034",scenario:"The claimant was crossing the road at a pedestrian crossing when she was struck by a car driven by the defendant. The defendant was a learner driver, taking his first lesson under the supervision of an instructor.",q:"In a claim by the pedestrian against the driver, which of the following statements is correct?",opts:["The claimant will need to satisfy the court that it would be fair, just, and reasonable to impose a duty of care on the driver.","The driver will succeed in defending the claim if he met the standard of care to be expected of a reasonable learner driver.","The driver will succeed in defending the claim if he did his personal best to drive carefully.","The driver will succeed in defending the claim if he met the standard of care to be expected of a reasonable qualified driver.","The claimant will need to satisfy the court that the driver foresaw the risk caused to her by his driving."],ans:"D",expl:"(D) The driver will succeed under the conditions stated in choice (D). The pedestrian will make her claim in the tort of negligence. She needs to show that the defendant owed her a duty of care, that the duty was breached, and that the breach caused her damage. To establish breach, the pedestrian needs to show that the driver fell below a reasonable standard of care. So, if the driver did meet the standard of care to be expected of a reasonable qualified driver, breach will not be established, and the driver will succeed in defending the claim. (A) is not correct. Driver to pedestrian is an established duty situation. The court does not need to decide whether a duty of care should be imposed on the driver. (B) is not correct. The driver must meet the standard of care for the task he is undertaking. That is the standard of a reasonable qualified driver, not that of a reasonable learner. The learner driver cannot rely on his lack of skill to argue that he was not in breach of duty. (C) is not correct. The standard of care is objective and impersonal. The driver must meet the standard of a reasonable driver, not his own personal best. (E) is not correct. Whether the driver was in breach of duty depends on what a reasonable person would have foreseen as the risks, not on what the driver himself foresaw."},{n:27,id:"LGS077",scenario:`A solicitor is instructed by the personal representatives of a deceased person to assist with the administration of the estate. The estate's assets include Premium Bonds, shares in some public companies, and some cash in the deceased's bank accounts. The personal representatives have asked for advice on selling all of these assets in order to pay the beneficiaries. Neither the solicitor nor her firm is authorised by the Financial Conduct Authority to carry on a "regulated activity" as defined in the Financial Services and Markets Act 2000 and related secondary legislation.`,q:"Which of the following best describes whether the solicitor can give the advice requested?",opts:["The solicitor can provide the advice because none of the assets are specified investments.","The solicitor cannot provide the advice because cash is a specified investment and no exclusion or exemption applies.","The solicitor cannot provide the advice because Premium Bonds are a specified investment and no exclusion or exemption applies.","The solicitor can provide the advice because although the shares are a specified investment, the advice is a necessary part of other services, namely assisting with the administration of the estate.","The solicitor cannot provide the advice because the shares are a specified investment and no exclusion or exemption applies."],ans:"D",expl:"(D) The solicitor can provide the advice because although the shares are a specified investment, the advice is a necessary part of other services, namely assisting with the administration of the estate. The general prohibition states that no person may carry on a regulated activity unless they are authorised or exempt from authorisation. A regulated activity is an activity specified in the Regulated Activities Order that relates to an investment specified in the Order, is carried out in the course of business, and to which no exclusions apply. Here, the solicitor has been asked to advise (a specified activity) on estate assets including company shares (a specified investment). However, the solicitor is not carrying out a regulated activity because she may rely on the necessary exclusion. A solicitor may conduct activities in relation to specified investments if the activity may reasonably be regarded as a necessary part of performing legal services which do not otherwise consist of carrying on a regulated activity. The advice on the sale of all of the estate assets is a necessary part of the service of assisting with the administration of the estate. (A) is incorrect because the company shares are a specified investment although the cash in the bank accounts and the Premium Bonds are not. (B) is incorrect because the cash in the bank accounts is not a specified investment. (C) is incorrect because Premium Bonds are not a specified investment. (E) is incorrect because although the company shares are a specified investment, the solicitor may rely on the necessary exclusion, which means she is not carrying on a regulated activity."},{n:28,id:"DIS146",scenario:"A man's rose garden was badly damaged when his neighbour drove his car over the rose garden in a fit of rage. Replacing all of the damaged rose plants will cost £7,000 and as the tort was intentional, the man is seeking an additional £3,000 for the trespass. The man's solicitor expects costs of the claim to be about £1,000 as the neighbour is not keen to settle.",q:"How much is the man's claim for purposes of the claim form in the statement of value?",opts:["£7,000.","£10,000.","£11,000.","£10,000 plus two-years' interest.","£11,000 plus two-years' interest."],ans:"B",expl:"(B) When valuing a damages claim (that is, a claim for an unspecified amount) for purposes of completing the claim form, the claimant should disregard interest, costs, contributory negligence and counterclaims. Therefore, the claim here should include the £7,000 it will cost to replace the damaged plants and £3,000 for the trespass. (A) is incorrect because there is no reason to exclude the damages for trespass. (C), (D), and (E) are incorrect because it would be improper to include the solicitor's costs and/or interest."},{n:29,id:"BSL233",scenario:"Three architects formed a limited liability partnership ('LLP'). Each partner contributed £400,000 upon formation of the LLP. Partner 1 is the designated member. Partner 1 also oversees day-to-day management of the LLP. After two years, the LLP is insolvent: its assets are £300,000 and its liabilities are £550,000. The partners made no withdrawals from the business. Partner 1 and partner 2 each have a net worth in excess of £600,000. Partner 3 is insolvent.",q:"As designated member, what is Partner 1's maximum potential liability in the event the LLP is dissolved?",opts:["£250,000","£125,000","£0","£350,000","£550,000"],ans:"C",expl:"(C) A limited liability partnership is a partnership that has a separate legal existence. The members are not liable for the debts of the LLP, and that includes the designated member. A designated member is simply the member appointed to perform certain administrative duties (such as to comply with filing requirements of Companies House). It does not matter that the LLP is insolvent or that one of the members is insolvent."},{n:30,id:"CTR062",scenario:"A man and a dealer in fine wine enter into a contract for the sale of a bottle of rare vintage wine. After the contract has been agreed the dealer tells the man that he will not be able to supply the wine after all. The man tries to find an identical bottle of wine elsewhere, but no such bottle exists. He intends to take the dealer to court for breach of contract and request an order for specific performance to compel the dealer to sell him the wine.",q:"Which of the arguments below will not prevent the man from obtaining such an order?",opts:["Damages are an adequate remedy.","The man refuses to pay the full price for the wine and so has not acted properly in his dealing with the wine dealer.","The man has waited a year to bring his claim.","An equitable remedy is given at the discretion of the courts; it is not available as of right.","The granting of an order of specific performance would cause undue hardship to the dealer."],ans:"A",expl:"(A) This is not an argument which will prevent the man from obtaining specific performance. The contract was for a rare bottle of wine, and no other such bottle exists as the man attempted to find one. This is an example of a situation whereby the courts may well consider specific performance to be appropriate, as the goods in question appear to be unique and irreplaceable, so damages would not enable the man to source the wine elsewhere. (B) is incorrect. It might prevent the man from obtaining an order for specific performance because of the equitable maxim 'one who seeks equity must do equity'. To receive the benefit from an equitable remedy, the party seeking it must be willing to undertake all of their contractual obligations. (C) is incorrect. It might prevent an order for specific performance because another equitable maxim is that 'delay defeats equity'. If you require an equitable remedy, you should not delay in bringing your claim and it seems unreasonable for the man to wait a year to bring it. (D) is incorrect. It might prevent an order for specific performance because whether to grant an equitable remedy is at the court's discretion. Damages for breach of contract, on the other hand, are available to the innocent party as of right. (E) is incorrect. It might prevent an order for specific performance because it is right that the courts are unlikely to grant an equitable remedy if it would cause undue hardship to the party in breach. This is because equity is primarily concerned with fairness."}],X1=[{n:31,id:"TRT084",scenario:"A claimant suffers a broken leg in an accident caused by the negligence of the defendant. As a result, he is off work for six months and suffers a loss of wages. He needs physiotherapy and chooses to pay for this privately rather than wait for free treatment provided by the National Health Service.",q:"Which of the following statements best describes the damages the man is likely to recover?",opts:["The man will recover damages for his pain, suffering, and loss of amenity caused by the broken leg and for his loss of wages, but he cannot recover the cost of the physiotherapy because he failed to mitigate his loss by choosing to pay for private treatment.","The man will recover damages for his pain, suffering, and loss of amenity caused by the broken leg and for his loss of wages, and he can recover the reasonable cost of necessary physiotherapy.","The man will recover damages for his pain, suffering, and loss of amenity caused by the broken leg, but he cannot recover the lost wages or the physiotherapy costs because these are both pure economic loss.","The man will recover damages for his pain, suffering, and loss of amenity caused by the broken leg and for his loss of wages, but he cannot recover the physiotherapy costs because this is pure economic loss.","The man will recover damages for his pain, suffering, and loss of amenity caused by the broken leg and for his loss of wages, but he cannot recover the physiotherapy costs because such loss is too remote."],ans:"B",expl:"(B) The correct measure of recovery is damages for his pain, suffering, and loss of amenity caused by the broken leg and for his loss of wages, as well as the reasonable cost of necessary physiotherapy. (A) is not correct. By statute, where a claimant incurs the cost of private medical treatment, the defendant cannot argue that they ought to have mitigated their loss by accepting treatment provided by the National Health Service. (The costs must, of course, be both necessary and reasonable). (C) is not correct because neither the loss of wages nor the cost of medical treatment are pure economic loss. Both are consequential economic loss suffered as a result of the claimant's personal injuries. (D) is not correct. The cost of physiotherapy is not pure economic loss, but rather consequential economic loss. (E) is not correct. The need for physiotherapy as a result of personal injury is reasonably foreseeable and so is not too remote.",note:'This question appears twice in the source document (on two consecutive pages, both numbered "31 of 90"); it is reproduced once here.'},{n:32,id:"ETH166",scenario:"[The facts of this question are not in the source document. The question screen for question 32 is missing (the PDF shows question 31 twice instead), and the answer screen shows only the call of the question and the options. From the options and the explanation, the scenario concerns a solicitor asked to act for a company that is considering acquiring a rival business at which the solicitor's spouse is an executive.]",q:"Under what circumstances should the solicitor act for the company?",opts:["None, because this is an own interest conflict and there is an absolute prohibition on acting.","The solicitor can act for the company provided the solicitor informs the company of his spouse's position in the rival business.","The solicitor can act for the company provided the solicitor informs the company of his spouse's position in the rival business and the company takes independent advice on this point.","The solicitor can act for the company provided the solicitor informs the company of his spouse's position in the rival business and the company provides informed consent in writing.","The solicitor can act for the company without restriction."],ans:"A",expl:"(A) A solicitor must not act if there is an own interest conflict or a significant risk of an own interest conflict, such as where the solicitor's spouse is an executive at the same business the company potentially wants to acquire. The acquisition could affect the spouse's employment or finances and the solicitor's judgment could be affected. (B), (C), (D), and (E) are incorrect because an own interest conflict is an absolute bar to acting.",note:"The full facts of this question are not available in the source document. Only the question, options and answer discussion (taken from the answer screen) are reproduced."},{n:33,id:"BSL161",scenario:"Three friends entered into a partnership to create and sell children's clothes online. They agreed that the partnership would run for three years. After two years, one friend wishes to leave the partnership.",q:"Which of the following statements correctly states the legal position?",opts:["The friend wishing to leave can withdraw from the partnership at any time.","The friend wishing to leave must dissolve the partnership by notifying the other two partners.","The friend wishing to leave may withdraw only after notice of the proposed withdrawal is given to all partnership creditors.","The friend can leave before expiration of the three-year period only with the other partners' consent.","The friend cannot leave before expiration of the three-year period even with the other partners' consent."],ans:"D",expl:"(D) The friend can leave before expiration of the three-year period only with the other partners' consent. If the partnership agreement provides that the partnership is to last for a fixed duration, a partner cannot leave before the end of the fixed term. However, the partnership agreement can be changed if all of the partners agree to the change. So, if all three consent to the change, the partner can leave. (A) is incorrect. It states the rule for a partnership that does not have a fixed term. In such a partnership, partners can leave at any time by giving notice, and the partnership will dissolve. But as this is a fixed term partnership, that rule does not apply here. (B) is wrong as a partner can only dissolve a partnership at will by notice to the other partners. (C) is incorrect as there is no requirement to notify creditors - this is a requirement to avoid future liability for partnership debts. (E) is incorrect as although this is a fixed term partnership agreement, the agreement can be changed if all of the partners consent."},{n:34,id:"BSL185",scenario:"A company which manufactures oak furniture holds a board meeting after discovering its main customer is about to enter liquidation. The board made several decisions at the board meeting. One member of the board is concerned that each of the decisions could potentially result in a preference.",q:"Which of the following is least likely to be a preference?",opts:["Paying creditors who are sole traders ahead of company creditors.","Granting a charge to a director's spouse to secure a loan made to the company.","Allowing a creditor to enter judgment against the company when the company has a good defence to the claim.","Allowing a timber supplier to modify their contract to include a retention of title clause which did not exist when the contract was entered.","Entering into a new contract with a supplier who is offering cheaper nails and glue than the company's current supplier."],ans:"E",expl:"(E) The decision to enter a new contract is least likely to be set aside as a preference. A preference arises when a debtor does something to put one creditor ahead of others in insolvent liquidation or administration with intent to do so. Making a new contract with a new supplier to save money on supplies would not be a preference. (A) is wrong as this could be a preference, because one group of creditors are being paid ahead of other creditors. (B) is incorrect as this could be a preference, because the charge would make the director's spouse a secured creditor, and a secured creditor is in a better position on insolvency than an unsecured creditor. (C) is wrong as a judgement creditor is in a better position than an ordinary unsecured creditor as it has more remedies available. (D) is incorrect as a creditor with a retention of title clause is in a better position on insolvency because it can take back its goods."},{n:35,id:"LGS092",scenario:'A solicitor is acting for a client in a personal injury claim for which the client is due to receive a substantial settlement. The client has asked the solicitor for advice on what to do with the settlement and says he is considering investing some money in shares and debentures. The solicitor suggests that the client speak to his bank manager for advice on the best savings and investment products. The bank is authorised by the Financial Conduct Authority. After taking advice from the bank, the client asks the solicitor to draw up the necessary paperwork to complete the investment transactions and the solicitor does so. Neither the firm nor the solicitor is authorised by the Financial Conduct Authority to carry on a "regulated activity" as defined in the Financial Services and Markets Act 2000 and related secondary legislation.',q:"Has the solicitor breached the general prohibition against carrying on a regulated activity?",opts:["Yes, because the solicitor has advised the client to invest in a specified investment and no exclusion or exemption applies.","No, because the solicitor can rely on the exemption for Designated Professional Bodies.","Yes, because the solicitor has arranged for the client to invest in a specified investment and no exclusion or exemption applies.","No, because the solicitor is not acting by way of business.","No, because the solicitor can rely on the acting through authorised persons exclusion."],ans:"E",expl:"(E) The solicitor has not breached the general prohibition against carrying on a regulated activity because he can rely on the acting through authorised persons exclusion. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. Under the acting through authorised persons exclusion, a solicitor can arrange or act as agent with respect to specified investments if the client receives advice from a person authorised by the Financial Conduct Authority and the solicitor merely assists the client in acting on this advice. Here, the solicitor has been asked to make arrangements (a specified activity) for the client to purchase shares and debentures (specified investments). However, the solicitor can rely on the acting through authorised persons exclusion because he has passed on his client to the bank manager (an authorised party) to provide advice on the specified investments, and the solicitor is merely assisting the client in acting on this advice. Thus, the solicitor is not carrying on a regulated activity in breach of the general prohibition. (A) is incorrect because, as explained above, the acting through an authorised person exclusion is available. Also note that the specified activity here is arranging, not advising. (B) is incorrect because there is no regulated activity so the solicitor does not need to rely on the exemption for Designated Professional Bodies. (C) is incorrect because although the solicitor is carrying out the specified activity of arranging, the acting through an authorised person exclusion is available. (D) is incorrect because the solicitor is acting in business. The solicitor is acting for the client as part of an ongoing matter for which the client has engaged the solicitor."},{n:36,id:"DIS250",scenario:"A journalist prints an article about a film actor, containing a story about an incident in the film actor's life. The actor claims that the story is untrue and that its publication has damaged his reputation.",q:"Which court would you expect to deal with this case?",opts:["The High Court (Chancery Division).","The High Court (Queen's Bench Division).","The County Court.","The High Court (Family Division).","One of the specialist courts."],ans:"B",expl:"(B) Defamation is a type of case dealt with by the High Court (Queen's Bench Division). (A) is incorrect because the Chancery Court deals with disputes such as probate, equity, trusts, and land and property claims. (C) is incorrect. Whilst the County Court deals with most civil claims arising from tort and contract, a claim for defamation sits in the Queen's Bench Division. (D) is incorrect because the Family Division deals with cases involving serious family- and child-related cases. (E) is incorrect because the Queen's Bench Division would deal with a claim of this nature. A specialist court is not required in this instance."},{n:37,id:"DIS264",scenario:"A customer suffered severe injuries at a laser tag arena when he tumbled over a barricade that was painted in a dark colour and thus was very difficult to see. The customer will be unable to work for the foreseeable future and thus currently has serious financial difficulty. The customer brings a claim for negligence against the laser tag arena, which has admitted responsibility for the customer's injuries but disputes the amount of damages.",q:"How should the solicitor for the customer proceed to alleviate the customer's financial difficulties?",opts:["The solicitor should write to the court asking for the court to list the case for a case management conference so that the district judge can consider further directions.","The solicitor should make an application for an interim payment.","The solicitor should advance some funds to their client, knowing that they will be recouped once the claim is settled.","The solicitor should make an application for a freezing injunction to prevent the defendants from disposing of their assets to ensure they will be able to pay the teacher.","The solicitor should make an application to shorten the directions timetable to ensure that the court fix the trial on damages for the earliest possible date."],ans:"B",expl:"(B) The solicitor should make an interim payment application. An application for an interim payment is an application for the court to order some payment before the court has given a final determination on the claim. Interim payments are discretionary. They often are granted when the defendant has admitted liability. Whilst the claimant need not show need, it is a factor a court will consider. The amount must be a reasonable proportion of the likely amount of the final judgment. (A) is inappropriate because further directions are not required here. (C) is incorrect because advancing funds to a client would be questionable behaviour for a solicitor. (D) is incorrect. A freezing injunction is used to preserve assets when there is reason to believe there is a real risk the defendant may dispose of or dissipate assets before a judgment may be enforced, and we have no facts indicating that is the case here. (E) is incorrect because it would be inappropriate to ask the court to shorten the directions timetable. Other remedies are available."},{n:38,id:"CTR071",scenario:"A man and his friend enter into a contract under which the friend's business partner would receive the benefit of an interest in land owned by the man. The business partner wishes to enforce the contract and receive the benefit.",q:"Which of the following is not a route by which the business partner could enforce the contract?",opts:["The Law of Property Act 1925.","The Contracts (Rights of Third Parties) Act 1999.","Trust law.","The law of assignment.","The doctrine of privity of contract."],ans:"E",expl:"(E) It is the doctrine of privity of contract that would prevent the business partner from receiving the benefit of the contract. It is the principle that only the parties to a contract can obtain rights, and be subject to liabilities, under it. There are numerous exceptions to the rule, most notably the Contracts (Rights of Third Parties) Act 1999, which enables third parties to obtain the benefit of a contract (but not to become subject to the burden of the contract), provided they are specifically identified in it. The Law of Property Act 1925 allows a third party to take an interest in land or other property even if they are not a named party on the relevant legal document. Trust law is another important exception to the law of privity of contract, as it recognises that a third party (the beneficiary) is entitled to the benefit of a trust. A trust in favour of a third party may be express, or sometimes it may be implied. The law of assignment allows a contractual right (but not an obligation) to be transferred to a third party outside the terms of the original contract. Therefore (A), (B), (C), and (D) are all methods by which the law of privity can be circumvented, so are all incorrect answers."},{n:39,id:"LGS107",scenario:"A junior solicitor at a large firm was working on a transaction for one of the firm's clients. Whilst reviewing the client's file, the solicitor became suspicious that the client might be involved in money laundering, as the client seemed to have deposited a large amount of cash with the firm and did not explain its source. The client's transaction is scheduled to close in seven days. The solicitor sends an email to the firm's Money Laundering Reporting Officer ('MLRO') but gets an 'Out of Office' reply that indicates the MLRO is not coming back for another three weeks.",q:"What action should the solicitor now take?",opts:["Report his suspicions to the National Crime Agency.","Report his suspicions to his supervisor.","Determine whether the firm has appointed a deputy MLRO and report his suspicions to this person.","Wait until the MLRO comes back and resubmit his suspicions to her.","Do nothing as he has already reported the matter to the MLRO."],ans:"C",expl:"(C) The solicitor's best course of action to take next is to determine whether the firm has appointed a deputy MLRO and report his suspicions to this person. When the MLRO is away, best practice is for firms to make alternative arrangements, such as appointing an alternative or a deputy MLRO and informing staff about these arrangements. The MLRO and deputy MLRO should be trained to investigate and properly handle suspicious activity reports. (A) is incorrect as it is the MLRO's (or deputy's) duty to report to the National Crime Agency. The solicitor's duty is to report to the MLRO and/or deputy MLRO as necessary. As explained above, the solicitor should first determine whether the firm has appointed an alternative or deputy MLRO. If the firm has not, only then must the solicitor report directly to the National Crime Agency. (B) is not correct because the solicitor's supervisor apparently is not the MLRO or deputy and so does not necessarily have the training needed to properly handle the matter. (D) and (E) are incorrect because the client's transaction is due to close before the MLRO returns, so it would not be reasonable to wait or do nothing. Reports should be made as soon as reasonably
