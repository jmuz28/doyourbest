 even if that person is not actually fearful of such force (therefore option A is wrong). The use of force is not required; the fear of force is sufficient (so option B is wrong) and there is no requirement for a weapon to be used in a robbery (so option C is incorrect also). Option E is incorrect because robbery requires force to be used on 'any person' and does not require it to be used on the person from whom the property is stolen."}, {"ch": 6, "n": 3, "sc": ["Late at night, a man enters, as a trespasser, a home belonging to an elderly couple. At the point of entry, the man is carrying a gun with him. Once inside the house, the man places the gun in his pocket. The man enters the bedroom of the couple and demands their jewellery. When the couple refuse to hand over any jewellery, the man points to his pocket and says, Tve got a gun, now give me the jewellery.' The couple are terrified at the threat as they can see the outline of the gun through the man's trousers. The couple hand over all of their jewellery. The man is caught as he is escaping the house and it is discovered that the gun was unloaded and thus incapable of firing. The man is charged with aggravated burglary on the basis that he stole jewellery."], "st": "Which of the following best describes the liability of the man?", "o": ["The man cannot be liable for aggravated burglary on account that he was not carrying the gun in his hand at the time that he stole the jewellery from the couple.", "The man can be liable for aggravated burglary because he had the gun with him at the point of stealing the jewellery, and it was immaterial whether the gun was loaded or not.", "The man cannot be liable for aggravated burglary because the gun was unloaded and incapable of firing.", "The man can be liable for aggravated burglary because he had the gun in his hand at the point of entry into the house.", "The man cannot be liable for aggravated burglary because the couple never saw the gun and thus could not have been threatened by the presence of a mere outline in the man's trousers."], "a": "B", "bx": "The correct answer was B. This is because the phrase 'has with him' means that the article is under his control, which it would be if it is in his pocket, and does not require that the man is carrying an aggravating article by hand (therefore option A is incorrect). The gun need not be loaded or capable of firing in order to be a firearm (therefore option C is wrong). Option D is incorrect on account that the man is seemingly charged with aggravated burglary using s 9(1) (b). If that is the case, the focus is whether the man had the gun at the time of stealing the jewellery, not at the time of entry. Option E is wrong on account that there is no requirement that the victims see the aggravating article; the focus is on the man's possession or control of it."}, {"ch": 6, "n": 4, "sc": ["A man is walking through the park when he notices a cyclist sitting on a bench, with a bicycle propped against the side of the bench. The man sneaks up to the bench and takes the bicycle without the cyclist realising. The man is later apprehended and claims that he believed the bicycle had recently been stolen from his friend and he was merely returning it to his friend. This belief is mistaken and the bicycle did not belong to the man's friend."], "st": "Is the man guilty of theft?", "o": ["Yes, the man may be dishonest because the property did not belong to him, and therefore he cannot claim that he has a right in law to appropriate the property.", "Yes, the man may be dishonest because there is sufficient evidence for the jury to be sure that his belief that the property belongs to his friend is unreasonable.", "Yes, the man may be dishonest because there is sufficient evidence for the jury to be sure that he appreciated that his conduct was dishonest to the standards of ordinary decent people.", "Yes, the man may be dishonest because he had no moral right to appropriate the property.", "Yes, the man may be dishonest because there is sufficient evidence for the jury to be sure that his belief that the property belongs to his friend is not genuinely held."], "a": "E", "bx": "The correct answer was E. This is because a claim by the man that he held a mistaken belief that he held a right in law to appropriate the property must be genuinely held. There is sufficient evidence for the jury to conclude that the belief was not genuinely held (eg he could have spoken to the cyclist about his concerns). The belief need not be reasonable, so option B is wrong as it places incorrect emphasis on unreasonableness. Option A is incorrect as the right in law may be on behalf of the man himself, or on behalf of a third party (eg his friend). Option C is wrong as it incorrectly states the common law test for dishonesty, which does not require the man to subjectively appreciate that his conduct is dishonest. Option D is wrong because the focus is on whether the man genuinely held a belief in law, not in morality."}, {"ch": 6, "n": 5, "sc": ["A student enters a school late at night with the intention of copying the answers to the test that he is to sit the next day. The student enters his classroom and finds the test paper in his teacher's desk. The student takes a photograph on his smartphone of the answers. Before leaving the classroom, the student charges his phone, using the plug socket behind his teacher's desk. As the student is about to leave the classroom, he takes a silver pen from his teacher's desk. As the student leaves the building, he picks a number of berries from a bush growing wild next to the school's garden and eats them."], "st": "Which of the following best describes the liability of the student for theft?", "o": ["The student is liable for theft in respect of the pen and the berries, but not liable for theft in respect of the exam answers or charging his phone.", "The student is liable for theft in respect of the pen, but is not liable for theft in respect of any of the other items listed.", "The student is not liable for theft in respect of any of the items listed.", "The student is liable for theft in respect of the pen and the test answers, but is not liable for theft in respect of any of the other items listed.", "The student is liable for theft in respect of all of the items listed."], "a": "B", "bx": "The correct answer was B. This is because the pen is the only piece of property that is capable of being stolen. Berries that are picked from a wild plant cannot be stolen unless they are picked for reward, sale or any other commercial purpose (therefore options A and E are wrong). Option C is wrong because the pen is personal property that can be stolen. Option D is wrong as the answers to the test amount to 'information' that cannot be stolen. Electricity (from charging the phone) also cannot be stolen."}, {"ch": 6, "n": 6, "sc": ["A man takes a car intending to return it after a week."], "st": "Is there an intention to permanently deprive?", "o": ["Yes, after 24 hours.", "Yes, if he used petrol.", "Generally not, unless the borrowing is equivalent to an outright taking under s 6 TA 1968.", "No, cars cannot be stolen.", "Yes, any borrowing is theft."], "a": "C", "x": ["Wrong. No time rule.", "Wrong. Not the test.", "Correct. Section 6 TA 1968 and R v Lloyd.", "Wrong. They can.", "Wrong. Not any borrowing."]}, {"ch": 6, "n": 7, "sc": ["A woman finds a wallet in the street and keeps it, believing the owner cannot be found by taking reasonable steps."], "st": "Is she dishonest?", "o": ["Yes, wallets are always traceable.", "No, found property is ownerless.", "Yes, keeping found property is always theft.", "Yes, unless she hands it to the police.", "Not under s 2(1)(c) TA 1968, if that belief is genuine."], "a": "E", "x": ["Wrong. Not the test.", "Wrong. Not ownerless.", "Wrong. Not always.", "Wrong. Not required.", "Correct. Section 2(1)(c) TA 1968."]}, {"ch": 6, "n": 8, "sc": ["A court is considering whether a defendant was dishonest under s 1 TA 1968, where s 2 does not apply."], "st": "Which test applies?", "o": ["Whether the defendant thought it was dishonest.", "Negligence.", "Ivey v Genting: the defendant's actual belief as to the facts, then the standards of ordinary decent people.", "R v Ghosh's two-stage test.", "A purely subjective test."], "a": "C", "x": ["Wrong. Not the test.", "Wrong. Not the test.", "Correct. Ivey, confirmed by R v Barton and Booth.", "Wrong. Ghosh was overruled.", "Wrong. Not purely subjective."]}, {"ch": 6, "n": 9, "sc": ["A man uses force on a shopkeeper after taking goods and is running away down the street."], "st": "Is this robbery?", "o": ["No, force must precede the taking.", "No, it is burglary.", "It may be, if the appropriation is continuing at the time of the force.", "No, robbery requires a weapon.", "Yes, any later force counts."], "a": "C", "x": ["Wrong. Appropriation may continue.", "Wrong. Not burglary.", "Correct. R v Hale; R v Lockley.", "Wrong. No weapon is required.", "Wrong. Not any later force."]}, {"ch": 6, "n": 10, "sc": ["A man enters a house as a trespasser and then decides to steal."], "st": "Which burglary offence?", "o": ["Section 9(1)(b) TA 1968, once he steals or attempts to steal.", "Aggravated burglary.", "Robbery.", "Section 9(1)(a), as he intended to steal on entry.", "No burglary, as intent formed later."], "a": "A", "x": ["Correct. Section 9(1)(b): ulterior offence after entry.", "Wrong. No weapon.", "Wrong. No force.", "Wrong. No intent on entry.", "Wrong. Section 9(1)(b) applies."]}, {"ch": 7, "n": 1, "sc": ["A woman orders a shirt from an online store, costing £30, and the shirt is delivered to her home. Several days later, the woman enters a physical store requesting a refund on the purchased shirt on account that it is unsuitable. In fact, the woman had taken a different shirt, from a different retailer, to the shop seeking a 'refund' for that shirt. The shop assistant is suspicious, does not grant the refund and contacts the police. The woman claims that she was unaware that she had brought a shirt from a different retailer but has no evidence to support this contention. The prosecution claim that the woman did know that the shirt was from a different retailer. The trial judge directs the jury that it is for them to decide whether they believe the woman's version of events or not. The jury accept the prosecution's case and convict the woman. The woman appeals to the Court of Appeal against her conviction."], "st": "Is the woman guilty of fraud?", "o": ["Yes, the woman has dishonestly made a false representation in returning a shirt from a different retailer with the intention to make a gain of £30. Furthermore, the woman should have known that her representation was, or might be, untrue.", "No, the trial judge was wrong to direct the jury that whether the woman knew that the representation was untrue was a question of fact for the jury to determine. Given that knowledge focuses on the state of mind of the woman, this is a question of law for the judge.", "No, the woman did not have the necessary intention to make a gain or cause a loss on account that she was entitled to a refund if the shirt was unsuitable.", "Yes, the woman has dishonestly made a false representation in returning a shirt from a different retailer with the intention to make a gain of £30. Whether the woman had sufficient knowledge that the representation was, or might be, untrue was a question of fact determined by the jury.", "No, the refund was never given by the shop, therefore the woman cannot be guilty of fraud as she never actually made a gain or caused a loss."], "a": "D", "bx": "The correct answer was D. This is because the woman must know (subjectively, not objectively, so option A is incorrect) that the representation was untrue, and this is a question of fact for the jury (so option B is incorrect). The jury has accepted the evidence from the prosecution. It is irrelevant that the refund was never given (so option E is incorrect). Option C cannot be correct on account that the woman was not entitled to a refund if she had not provided the correct piece of clothing for return."}, {"ch": 7, "n": 2, "sc": ["A man seeks to sell his motorcycle in order to make some money. The man informs a potential buyer that the motorcycle is free from encumbrances and can be sold without restrictions. The man believes this representation to be false as he executed a document to mortgage the motorcycle to a finance company. If this were true, the motorcycle would not be free from encumbrances. The document, however, has not been validly executed and the motorcycle is, in fact, free from encumbrances. The man's representation is therefore true, despite his belief that it was false. The buyer is suspicious and has his doubts that the representation is true. The buyer does not purchase the motorcycle."], "st": "Is the man guilty of fraud?", "o": ["No, while the man believed his representation to be false, it was in fact true. The offence of fraud requires the representation to be false in fact and the man cannot be guilty if the representation is true.", "Yes, the invalidly executed document should not prevent the man from being guilty of fraud. The man intended to make a gain from selling the motorcycle and did so dishonestly; that is sufficient.", "No, the buyer does not believe that the representation is true and therefore the man cannot be liable for fraud.", "Yes, it is irrelevant whether the representation itself was false or not. The offence of fraud merely requires that the man believes that the representation is, or might be, false.", "No, while the buyer need not be induced to purchase the motorcycle, he must believe that the representation is true. Given that the buyer did not believe that the representation made by the man was true, the man cannot be guilty of fraud."], "a": "A", "bx": "The correct answer was A. This is because there is a requirement that the representation be in fact false. If the representation turns out to be true, there cannot be liability for fraud. An offence of attempted fraud may be charged in its place. All other options misstate the law."}, {"ch": 7, "n": 3, "sc": ["A woman is a car dealer by trade. She is approached by a potential customer who is interested in purchasing a car. The customer identifies that he does not know anything about cars and is relying on the advice provided by the woman. The women sells a second-hand car for £10,000 when she knows that the car is only valued between £3,000 and £3,500."], "st": "Is the woman guilty of fraud by false representation?", "o": ["No, the customer must take responsibility in these circumstances and should be aware of the trade practices adopted by salespersons.", "Yes, the woman took advantage of the customer's lack of knowledge and abused her position as a salesperson when selling the car at a price above its value.", "No, the representation made by the woman is not false. While the value of the car is significantly less than the price charged, the woman has the right to charge whatever amount she deems acceptable for the car. In such a case, there cannot be a false representation.", "Yes, the customer has relied upon the skill and experience of the woman and trusts that the price to be paid will be a fair one. The woman has made a false representation that the price charged is fair and is reflective of the value of the car.", "No, the woman is not dishonest in making the representation on account that she would not appreciate that such excess pricing was dishonest according to the standards of ordinary decent people."], "a": "D", "bx": "The correct answer was D. This is because the excess price will be considered a false representation (specifically that the price charged is fair and reflective of the value of the car - so option C is incorrect). The woman will be objectively dishonest in doing so (it being irrelevant whether the woman appreciated that such was the case - so option E is incorrect). While the customer does have a responsibility to be aware of sale practices and techniques, this does not rid the woman of liability (so option A is incorrect). Option B is incorrect as it misstates the elements of the offence of fraud by false representation."}, {"ch": 7, "n": 4, "sc": ["A man works in a supermarket as a checkout operator. The man serves one of his friends and uses his staff discount card to reduce the bill owed by the customer. The supermarkefs policy is clear that staff discount is only available to staff members, and is not available for use by family members or friends. The man is aware of this policy and chooses to ignore it because he does not think the policy is fair."], "st": "Is the man guilty of fraud by abuse of position?", "o": ["Yes, the man has abused his position as an employee of the supermarket, for which the reasonable person would expect him to safeguard and not act against the financial interests of his employer. The man intends to make a gain for his friend, by paying for a reduced bill, and is dishonest in his conduct.", "No, the man does not occupy a 'privileged' position as a checkout operator. The man is not of a sufficient seniority to owe a fiduciary duty to his employer and cannot be liable for fraud.", "No, the man is not dishonest as he does not consider there is anything wrong with his conduct (thinking the policy is unfair) and is, therefore, unlikely to appreciate that he is dishonest according to the standards of ordinary and decent people.", "No, it is doubtful that the man would consider that he is expected to safeguard the financial interests of his employer. If the man does not consider that he is expected to safeguard those interests, he cannot be liable for fraud.", "Yes, the man has abused his position as an employee of the supermarket, for which the employer would expect him to safeguard and not act against the financial interests of his employer. The man intends to make a gain for his friend, by paying for a reduced bill, and is dishonest in his conduct."], "a": "A", "bx": "The correct answer was A. This is because the expectation to safeguard the interests of the employer is to be determined by what the reasonable person would expect of the defendant (thus options D and E are incorrect). The man certainly occupies a position as a fiduciary in his capacity as an employee (so option B is incorrect) and it is irrelevant whether the man appreciates that his conduct is dishonest (so option C is incorrect)."}, {"ch": 7, "n": 5, "sc": ["A man creates a profile on a dating app and describes himself as a 'millionaire, with a wide portfolio of properties'. In reality, he is bankrupt, owns no property and lives with his parents. A woman responds to his profile and invites him round for dinner. They have sex and he later informs her that the information in his profile was false. She says she only had sex with him as she had believed the details were true and she would not have had sex with him had she known they were false."], "st": "Is the man guilty of fraud by false representation?", "o": ["Yes, he has made a false statement of fact that led to a gain, specifically sex.", "Yes, even if the woman had not had sex with him, he had intended to make a gain from his false statement of fact.", "No, the false statement must result in a gain for the man and a loss to the other party. While the man has gained, in the sense of sexual intercourse, there is no loss to the woman.", "No, the woman was under an obligation to check whether the statement of fact was true before engaging in sexual intercourse with the man.", "No, sexual intercourse does not amount to a gain for the purposes of fraud by false representation."], "a": "E", "bx": "The correct answer was E. This is because sexual intercourse does not amount to 'money or other property' for the purposes of the FA 2006. All other options are therefore incorrect."}, {"ch": 7, "n": 6, "sc": ["A woman uses a stolen credit card to buy goods."], "st": "Which offence is she most likely to have committed?", "o": ["Fraud by false representation under s 2 Fraud Act 2006.", "No offence, as the shop is paid.", "Fraud by abuse of position.", "Criminal damage.", "Fraud by failing to disclose information."], "a": "A", "x": ["Correct. Implied false representation of authority to use the card.", "Wrong. The offence is complete.", "Wrong. No position.", "Wrong. Not relevant.", "Wrong. Not the best fit."]}, {"ch": 7, "n": 7, "sc": ["Fraud by false representation is charged."], "st": "Must anyone actually be deceived?", "o": ["No, the offence is complete when the false representation is made with the required intent.", "Yes, and must suffer loss.", "Yes, a victim must be deceived.", "Only if a machine is involved.", "Yes, the victim must rely on it."], "a": "A", "x": ["Correct. Section 2 FA 2006 is conduct-based.", "Wrong. Not required.", "Wrong. Not required.", "Wrong. Not relevant.", "Wrong. Not required."]}, {"ch": 7, "n": 8, "sc": ["A man fails to disclose a serious medical condition on an insurance application form."], "st": "Which offence may apply?", "o": ["Making off without payment.", "Fraud by failing to disclose information, where he is under a legal duty to disclose.", "No offence, as silence is lawful.", "Fraud by abuse of position.", "Theft."], "a": "B", "x": ["Wrong. Not relevant.", "Correct. Section 3 FA 2006.", "Wrong. Not where there is a legal duty.", "Wrong. No position.", "Wrong. No appropriation."]}, {"ch": 7, "n": 9, "sc": ["A carer who manages an elderly person's finances transfers funds to herself."], "st": "Which offence is most apt?", "o": ["Fraud by abuse of position under s 4 FA 2006.", "Robbery.", "Criminal damage.", "Fraud by false representation.", "Making off without payment."], "a": "A", "x": ["Correct. She occupies a position of trust.", "Wrong. No force.", "Wrong. Not relevant.", "Wrong. No representation.", "Wrong. Not relevant."]}, {"ch": 7, "n": 10, "sc": ["A man intends to cause loss to another by a false representation, but makes no gain."], "st": "Is the mens rea satisfied?", "o": ["Only if loss occurs.", "Only if the gain is money.", "No, both gain and loss are required.", "Yes, intention to make a gain or cause loss (or expose to a risk of loss) suffices.", "No, gain is required."], "a": "D", "x": ["Wrong. Intention suffices.", "Wrong. Gain or loss in money or property.", "Wrong. Not both.", "Correct. Section 2(1)(b) FA 2006.", "Wrong. Either suffices."]}, {"ch": 8, "n": 1, "sc": ["A woman was heavily intoxicated having drunk significant quantities of alcohol while at a friend's house. The woman began taking glassware and throwing it against the wall, smashing it in the process. The woman's friend had expressed her dislike for the glassware earlier in the evening but did not consent to the woman damaging the property. The woman believed that her friend wanted her to damage the property."], "st": "Is the woman guilty of criminal damage?", "o": ["Yes, while the woman held an honest but mistaken belief in consent of the owner of the property, the belief was not reasonable.", "No, the woman held an honest but mistaken belief in consent of the owner, and it is irrelevant that she was intoxicated.", "Yes, while the woman held an honest but mistaken belief in consent of the owner of the property, she cannot rely on lawful excuse if she is intoxicated.", "Yes, consent was not provided for the damage to property and the woman cannot rely on a mistaken belief in consent.", "No, the woman held a reasonable belief in consent of the owner."], "a": "B", "bx": "The correct answer was B. This is because the woman may rely on an honest, albeit mistaken, belief in consent, even if induced by intoxication. Options A and E are incorrect as the belief need not be reasonable. Option C is incorrect as a mistake induced by intoxication appears to be acceptable for criminal damage. Option D is incorrect as it ignores the fact that the defence of lawful excuse is concerned with the woman's belief in consent."}, {"ch": 8, "n": 2, "sc": ["A man believes that his daughter has been kidnapped and she is being held in a house. The man enters the house by breaking in the door. The man mistakenly believes that his daughter is in need of immediate protection and that damage to the property is justified. The daughter has not been kidnapped and was not in any immediate danger."], "st": "Is the man guilty of criminal damage?", "o": ["No, while the man was acting in the belief that his daughter was in immediate need of protection, the means he adopted were not reasonable in the circumstances.", "Yes, the man cannot rely on the fact that he damaged property in order to protect another person who was in immediate danger.", "No, the man can rely on the fact that he damaged property in order to protect another person who was in immediate danger.", "Yes, the daughter was never in any immediate danger; a mistaken belief as to immediate danger is not sufficient.", "No, the man believed that his daughter was in danger; a mere belief, albeit mistaken, is sufficient."], "a": "B", "bx": "The correct answer was B. This is because the protection of another person is not a lawful excuse. All other answers appear to identify that protection of another person is sufficient to found a lawful excuse."}, {"ch": 8, "n": 3, "sc": ["A man breaks into an office block one night, intending to steal. On leaving the premises, the man sets fire to the offices. There were two flats above the offices. No occupants were home at the time the fire broke out. The man did not know that there were flats above the offices. The man did not consider any person was in the building at the time. The man is charged with aggravated arson."], "st": "Is the man guilty of aggravated arson?", "o": ["Yes, the man should have foreseen that the endangerment to life was a virtually certain consequence of his actions.", "No, the man cannot be guilty of aggravated arson because no lives were actually endangered.", "Yes, while the man did not intend that life be endangered, he should have foreseen a risk that life could be endangered as a result of the damage.", "No, the man did not intend, nor did he foresee a risk, that life would be endangered as a result of the damage.", "Yes, the man intended to cause damage by fire and that is sufficient for the offence of arson."], "a": "D", "bx": "The correct answer was D. Given that the man did not know that there were flats above the office block, nor did he think anyone was in the building, he cannot have intended such endangerment, nor could he have been subjectively reckless. Option A is incorrect because virtual certainty is a subjective test, not an objective one. Option B is wrong because it is irrelevant whether lives were actually endangered; the focus is whether the man intended or was reckless as to endangerment. Option C is incorrect because recklessness is a subjective test, not an objective one. Option E is incorrect because it omits the second mens rea requirement that the man must intend or be reckless as to the thought of life being endangered."}, {"ch": 8, "n": 4, "sc": ["A teenage boy, aged 14, threw stones at an elderly neighbour who had shouted at him for playing games near his garden. One of the stones missed the neighbour and broke the window. The boy intentionally threw the stones at the neighbour but did not intend to cause any damage to the window. The boy did not foresee a risk that the window would be damaged."], "st": "Is the boy guilty of criminal damage?", "o": ["No, the boy must intend to cause damage, or be reckless as to causing damage. A mere intention to do the act that causes the damage is not enough.", "Yes, the boy has thrown the stone intentionally. By throwing the stone intentionally, the boy must accept any damage that arises as a result.", "Yes, the boy's intention to throw the stone at the neighbour can be transferred to the damaged window.", "No, the boy has a lawful excuse for throwing the stones given that the neighbour had shouted at him.", "Yes, while the boy did not foresee the risk of damage to the window, another boy of his age would have foreseen the risk of such damage occurring."], "a": "A", "bx": "The correct answer was A. This is because a mere intention to do the act causing damage is insufficient (so option B is wrong); the boy must intend to cause damage or destruction as a result of that act, or be reckless. The boy's intention cannot be transferred from a person to property, so option C is incorrect. Option D is wrong as no such lawful excuse exists. Option E is wrong as it misstates the mens rea element of the offence."}, {"ch": 8, "n": 5, "sc": ["After a dispute at work, a scientist who had been researching genetic sequencing destroyed the squirrels he had been using in his research. He had destroyed them intending to set back his employers' research by months. The man had been in sole charge of the welfare of the squirrels and claimed they were his to do with as he pleased."], "st": "Is the man guilty of criminal damage?", "o": ["No, the squirrels cannot be construed as property as they are wild creatures.", "No, the squirrels had been reduced into possession and amounted to property, but they belonged to the man who had custody and control of the squirrels.", "Yes, the squirrels had been reduced into possession and therefore amounted to property. The squirrels were also property that belonged to the employer.", "No, animals do not amount to property for the offence of criminal damage and cannot then belong to another.", "Yes, all animals are property for the offence of criminal damage."], "a": "C", "bx": "The correct answer was C. This is because wild animals can amount to property but only if tamed, ordinarily kept in captivity or where they have been reduced into possession (therefore options A and D are incorrect). The property belongs to another if another party has custody and control over it, and even though the man may assert the squirrels were in his custody, another party (the employer) certainly has a right over that property (so option B is wrong). Option E is wrong as only animals that are tamed are classed as property."}, {"ch": 8, "n": 6, "sc": ["A man damages a neighbour's fence, believing the neighbour would consent."], "st": "What defence may he raise?", "o": ["Insanity.", "Lawful excuse under s 5(2)(a) Criminal Damage Act 1971.", "Necessity.", "Self-defence.", "Duress."], "a": "B", "x": ["Wrong. Not relevant.", "Correct. Belief in consent.", "Wrong. Not the best answer.", "Wrong. Not relevant.", "Wrong. Not relevant."]}, {"ch": 8, "n": 7, "sc": ["A man sets fire to his own house, not realising anyone is inside, but someone is."], "st": "Can he be guilty of aggravated criminal damage?", "o": ["No, he owns the property.", "Only if he intended or was reckless as to endangering life by the damage.", "Yes, regardless of mens rea.", "No, arson cannot be aggravated.", "Yes, as the property is his own and that is irrelevant."], "a": "B", "x": ["Wrong. Ownership is irrelevant for s 1(2).", "Correct. Section 1(2) CDA 1971 applies even to own property; mens rea is required.", "Wrong. Mens rea needed.", "Wrong. It can be.", "Wrong. Mens rea must be proved."]}, {"ch": 8, "n": 8, "sc": ["A woman writes on a pavement in water-soluble chalk."], "st": "Is this criminal damage?", "o": ["Yes, as it is public property.", "Probably not, if it is easily removed without cost.", "No, pavements are not property.", "Yes, any marking is damage.", "Yes, if seen by others."], "a": "B", "x": ["Wrong. Not the test.", "Correct. Hardman v CC of Avon: depends on cost and effort to remove.", "Wrong. They are property.", "Wrong. Not any marking.", "Wrong. Not the test."]}, {"ch": 8, "n": 9, "sc": ["A man damages property, believing it is his own."], "st": "Is he guilty?", "o": ["Yes, mistakes are irrelevant.", "No, only if he has a receipt.", "Yes, unless reasonable.", "No, he lacks the mens rea as to property belonging to another (R v Smith).", "Yes, if the damage is extensive."], "a": "D", "x": ["Wrong. Not irrelevant.", "Wrong. Not required.", "Wrong. Need not be reasonable.", "Correct. An honest belief negates mens rea.", "Wrong. Not relevant."]}, {"ch": 8, "n": 10, "sc": ["Criminal damage is caused by fire."], "st": "What is the charge?", "o": ["Aggravated burglary.", "Simple criminal damage only.", "Arson under s 1(3) CDA 1971.", "No offence.", "Robbery."], "a": "C", "x": ["Wrong. Not relevant.", "Wrong. Charged as arson.", "Correct. Damage by fire is charged as arson.", "Wrong. No.", "Wrong. Not relevant."]}]},Q=D.q,L="ABCDE";let i=0,A={};
