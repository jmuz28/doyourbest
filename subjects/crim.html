<script>
const D={"t": ["General principles of criminal law", "Parties to a crime", "Inchoate offences", "General defences", "Homicide offences", "Non-fatal offences against the person", "Theft offences", "Fraud offences", "Criminal damage"], "q": [{"ch": 0, "n": 1, "sc": ["A man stabs a love rival in the stomach and the victim is taken to the hospital. At the hospital, the victim is given antibiotics to prevent infection. Unbeknown to the medical staff, he is allergic to the antibiotics and he swiftly dies. The man is charged with murder."], "st": "Has the medical treatment broken the chain of causation?", "o": ["Yes, the medical team have acted negligently, and this breaks the chain of causation.", "Yes, the treatment was palpably wrong, and this broke the chain of causation.", "No, the chain of causation has actually been broken by the unanticipated vulnerability of the victim.", "No, you must take your victim as you find them, and this includes undiagnosed conditions.", "Yes, this was a voluntary act by the medical staff that breaks the chain of causation."], "a": "D", "bx": "The correct answer was D. Though medical treatment can break the chain of causation it must be palpably wrong (not merely negligent, so option A is wrong) and be an independent cause of death. Here the victim had an undiagnosed vulnerability and the principle is that you must take your victim as you find them (therefore option C is incorrect). Option B is incorrect as, though the medical treatment may be classified as palpably wrong, the option ignores the application of the thin skull rule. Option E is wrong as a voluntary act is not sufficient for medical negligence to break the chain of causation."}, {"ch": 0, "n": 2, "sc": ["A man is playing with a shotgun that he has discovered at his friend's farmhouse. That evening, the man and his friend get into an argument and he points the gun at his friend's legs, telling him, 'If you don't shut up, I'll blow off your kneecaps'. The argument continues and the man points the gun near his friend and pulls the trigger. The bullet enters his chest and the friend dies immediately. The man says he was simply trying to scare his friend into shutting up. The man is charged with murder and the judge directs the jury that if death or serious injury was a highly probable result of the man's actions, and he appreciated such, then the jury can find he had the necessary intent."], "st": "Is the judge's direction correct?", "o": ["Yes, as the direction has been given as an evidential one.", "Yes, as the jury have been asked to consider whether they thought the result highly probable and then whether the man thought it highly probable.", "No, the judge should have given the direction as a legal test, that if the jury found the result was highly probable and the man appreciated this that they must find intent.", "No, the judge has used incorrect terminology. The direction should have been given in terms of virtual certainty.", "No, the judge has used incorrect terminology. The direction should have been given in terms of virtual certainty and as a legal test."], "a": "D", "bx": "The correct answer was D. The direction should have been given in terms of virtual certainty and as an evidential test. Option A is wrong because, while the test is an evidential one, the reference to 'highly probable' is wrong. Terms such as 'highly probable' or 'possible' indicate recklessness, not intention, and should not be used in directing a jury (hence options B and C are incorrect). Although there has been some debate about whether the direction is legal or evidential, it is generally accepted as an evidential test allowing juries to 'find' intention, therefore option E is incorrect."}, {"ch": 0, "n": 3, "sc": ["A woman works as a community nurse and one of her clients is an elderly lady. One afternoon, the woman goes on a scheduled visit to her elderly client's house but gets to the house an hour later than arranged. When no one answers the door, she peers through the window and sees her client laying on the kitchen floor. She decides not to do anything as calling the authorities would alert her employers to the fact that she was late. It is later established that her client had fallen and had died later that day of an embolism."], "st": "Was the woman under a duty to act?", "o": ["Yes, all persons are under a duty to act to prevent harm from occurring to others.", "No, as the woman had not created a dangerous situation, she was not under a duty to act.", "Yes, as the visiting community nurse, the woman had an obligation to discharge her contractual duty.", "Yes, by virtue of their close relationship, the woman was under a duty to act.", "No, only immediate relatives are under a duty to act."], "a": "C", "bx": "The correct answer was C. We are not all placed under a duty to act (option A is therefore incorrect), but by virtue of her position as a community nurse and, specifically, as the nurse to this particular client, she was under a duty to act. Option B is wrong as it supposes that the creation of a dangerous situation is the only circumstances in which the woman could be liable. Option D is incorrect as a mere close relationship is not normally sufficient to impose a duty to act. Option E also is wrong because it, much like option B, ignores the other ways in which a duty to act may arise."}, {"ch": 0, "n": 4, "sc": ["A woman has a grudge against a co-worker who she is sure has been stealing her lunch from the office fridge. One afternoon she sees her coworker sitting at his desk eating a yogurt that she had just discovered was missing. Losing her temper, she threw down the stapler she was holding. It bounced off her desk and hit her supervisor in the leg. The woman has been charged with battery. It was accepted she did not intend to apply force to her supervisor, but she is convicted of battery as the magistrates concluded a reasonable person would have seen a risk of force being applied and it does not matter that the woman may not have done."], "st": "Did the magistrates approach recklessness correctly?", "o": ["Yes, it would have been obvious to the reasonable person that there was a risk of the stapler hitting someone.", "No, this was a justifiable risk.", "Yes, the woman chose to take that risk and the magistrates need only consider whether a reasonable person would also see the risk.", "No, the focus should be on whether the woman saw a risk of the prohibited result and went on to unreasonably take that risk.", "Yes, recklessness can be approached via an objective or a subjective test."], "a": "D", "bx": "The correct answer was D. Recklessness is the taking of an unjustifiable risk and that is an objective question, but that is not the crux of subjective recklessness (so options A, B and C are incorrect). The magistrates should have considered whether the woman actually saw the risk. There is no discretion here (so option E is incorrect), it must be approached in terms of subjectivity."}, {"ch": 0, "n": 5, "sc": ["A man is involved in a fight with a woman outside a public house. The man throws a large stone in the direction of the woman, intending that the stone will strike the woman. The stone misses the woman and smashes a large window. The man did not intend or foresee the risk that the stone would damage the window. The man is charged with criminal damage of the window."], "st": "Is the man guilty of criminal damage?", "o": ["No, the man cannot be liable on the basis that he lacked intention or recklessness as to criminal damage and his intention to strike the woman cannot be transferred to the window.", "No, the man cannot be liable as the concept of transferred malice only applies to offences against the person.", "Yes, the man can be liable on the basis that his intention to strike the woman can be transferred to the window, despite the fact that he did not intend nor was he reckless as to damaging the window.", "Yes, the man can be liable on the basis that the reasonable person would have foreseen the risk that the window would be damaged as a result of the throwing of the stone.", "Yes, the man can be liable on the basis that breaking the window was a virtually certain result of his conduct and the reasonable person would have appreciated the result as being a virtual certainty."], "a": "A", "bx": "The correct answer was A. This was because the man's malice against the woman cannot be transferred to the window (therefore option C is incorrect). Options D and E are incorrect as they suggest the test for both recklessness and virtual certainty is an objective one, asking what the reasonable person would have foreseen. Option B is incorrect as transferred malice is a general principle and is not restricted to offences against the person."}, {"ch": 0, "n": 6, "sc": ["A man stabs a victim, who refuses a blood transfusion on religious grounds and dies."], "st": "Is the man liable for causing death?", "o": ["No, the refusal is a voluntary act breaking the chain.", "Yes, but only if the refusal was reasonable.", "No, because medical treatment was available.", "No, the refusal was unreasonable.", "Yes, the defendant must take his victim as he finds him, including his beliefs."], "a": "E", "x": ["Wrong. The refusal does not break the chain.", "Wrong. No such requirement.", "Wrong. Availability of treatment does not break the chain.", "Wrong. Reasonableness of the refusal is irrelevant.", "Correct. R v Blaue: the 'thin skull' rule extends to the victim's religious beliefs."]}, {"ch": 0, "n": 7, "sc": ["A woman is charged with murder. The prosecution relies on oblique intent."], "st": "What must the jury be sure of?", "o": ["She foresaw some harm.", "A reasonable person would have foreseen death.", "Death was a natural consequence of her act.", "Death or serious injury was a virtual certainty from her act and she appreciated that.", "She foresaw death as highly probable."], "a": "D", "x": ["Wrong. That is far too low.", "Wrong. The test is not purely objective.", "Wrong. Natural consequence alone is not enough.", "Correct. R v Woollin: virtual certainty, and the defendant's appreciation of it.", "Wrong. 'Highly probable' is not the test."]}, {"ch": 0, "n": 8, "sc": ["A man agrees to care for his elderly aunt, who lives with him, but stops feeding her and she dies."], "st": "On what basis may he owe a duty to act?", "o": ["A duty arises only between spouses.", "There is no duty, as she was an adult.", "Only a contractual duty can arise.", "He voluntarily assumed a duty of care for her.", "Only if he created the danger."], "a": "D", "x": ["Wrong. Not limited to spouses.", "Wrong. Adults can be owed a duty.", "Wrong. Duties are not limited to contract.", "Correct. R v Stone and Dobinson: voluntary assumption of care.", "Wrong. Creation of danger is a separate basis."]}, {"ch": 0, "n": 9, "sc": ["A man throws a stone at a person but misses and hits another person standing nearby, injuring them."], "st": "Can the man be liable for the injury to the other person?", "o": ["Yes, by transferred malice, as the harm is of the same type.", "Yes, but only if he was negligent.", "No, he did not intend to hit that person.", "No, transferred malice applies only to property.", "No, he must be charged with attempt only."], "a": "A", "x": ["Correct. R v Latimer: malice transfers between victims for the same type of offence.", "Wrong. Negligence is irrelevant.", "Wrong. Transferred malice covers this.", "Wrong. It applies to persons.", "Wrong. Not limited to attempt."]}, {"ch": 0, "n": 10, "sc": ["A defendant forms the mens rea for murder after the act causing death has begun, as part of a continuing sequence of events."], "st": "Can coincidence of actus reus and mens rea be established?", "o": ["Only if the defendant confesses.", "Yes, but only for property offences.", "No, mens rea must precede the act.", "No, coincidence cannot be extended.", "Yes, under the continuing act or single transaction principle."], "a": "E", "x": ["Wrong. No such requirement.", "Wrong. Not so limited.", "Wrong. Not strictly required.", "Wrong. Courts extend it.", "Correct. Fagan and Thabo Meli allow continuing acts and a single transaction."]}, {"ch": 1, "n": 1, "sc": ["A man and a woman agree to burgle a house with intention to steal property. The man will enter the property and steal items while the woman will act as a lookout. While in the house, the man is confronted by the householder. The man attacks the householder causing actual bodily harm (ABH). The man pleads guilty to burglary and assault occasioning ABH, contrary to s 47 of the Offences Against the Person Act 1861, and claims that the woman had accepted that force would be used on the householder if necessary."], "st": "Which of the following best describes the liability of the woman?", "o": ["The woman can only be liable for burglary on the basis that she assisted the commission of the burglary; the woman cannot be liable for assault occasioning ABH as she did not agree prior to the burglary to any assault.", "The woman is liable for burglary as she assisted in the commission of the burglary; the woman can be liable for assisting or encouraging assault occasioning ABH if the jury are sure that the woman intended that the man would, if he thought it necessary, use force on the householder to carry out the burglary.", "The woman can only be liable for burglary on the basis that she assisted the commission of the burglary; the woman cannot be liable for assault occasioning ABH as the man has gone beyond the plan agreed between himself and the woman and the woman cannot be liable in these circumstances.", "The woman is liable for burglary as she assisted in the commission of the burglary; the woman can be liable for assisting or encouraging assault occasioning ABH if the jury are sure that the woman foresaw that the man would, if he thought it necessary, use force on the householder to carry out the burglary.", "The woman is liable for both burglary and assault occasioning ABH as she assisted in the commission of the burglary and the assault was committed while the burglary was taking place."], "a": "B", "bx": "The correct answer was B. This is because the woman has actively assisted in the commission of the burglary by acting as a lookout and can be liable for ABH if the jury are sure that she intended for sufficient force for ABH to be used on the householder if necessary. Option A is incorrect as there is no requirement for prior agreements in accessorial liability. Option C would be correct if the woman had not intended for force to be used; however, since there is evidence that force should be used if necessary, option C is wrong. Option D is wrong because mere foresight that force may be used is only evidence of intention and is not synonymous with intention. Option E is wrong as it does not accurately describe the fact that the woman had to additionally intend for force to be used if necessary."}, {"ch": 1, "n": 2, "sc": ["A man and a woman are charged with causing grievous bodily harm (GBH) with intent, contrary to s 18 of the Offences Against the Person Act 1861. The victim suffered a fractured skull caused by a kick to the head. The prosecution allege that both the man and the woman kicked the victim in the head, with intent to cause really serious harm, while the victim was on the ground. The prosecution allege that it was the woman's plan to attack the victim, although they cannot say whether the man or the woman caused the fractured skull but say that each person is guilty either as a principal or an accessory. Each blames the other for the fractured skull."], "st": "Which of the following correctly explains the liability of the man and woman?", "o": ["Neither the man nor the woman can be liable for s 18 GBH with intent on account that the prosecution has not alleged which person was the principal and which was the accessory.", "Both the man and the woman would be liable for s 18 GBH with intent as joint principals. As the prosecution allege that the man and woman are either a principal or an accomplice, the jury should work on the basis that both the man and the woman are joint principals.", "Neither the man nor the woman can be liable for s 18 GBH with intent on account that the prosecution has not alleged which person was the principal and which was the accessory. However, both the man and the woman could be liable for s 20 GBH on the basis of the lesser mens rea requirement.", "The woman can be liable for s 18 GBH with intent as the principal offender as it was her plan to attack the victim; the man can be liable as an accessory to s 18 GBH.", "Either the man or the woman can be liable for s 18 GBH with intent where the prosecution can prove that they were involved, in some way, with the commission of the offence. It is irrelevant if the prosecution cannot prove that one was the principal and the other the accessory; it is for the jury to make that determination."], "a": "E", "bx": "The correct answer was E. This is because the prosecution are not required to allege that a defendant was either a principal or an accessory - it is sufficient to prove that a defendant was involved in the commission of the offence in some way (option A is therefore incorrect). If the prosecution was unable to prove any involvement, then neither the man nor the woman could be liable. Option B is incorrect as no such basis for the jury exists in law. Option C is incorrect as it is irrelevant which offence is charged against the man and the woman. Option D is incorrect as simply because the attack was the woman's idea does not mean that she is the principal; whether the woman was a principal offender is determined by whether she caused the fractured skull."}, {"ch": 1, "n": 3, "sc": ["A farmer instructs his employee to drive a tractor and trailer on a public road as part of his employment. The tractor is poorly maintained, and the employer is aware of this. The employee does as instructed and is involved in a car accident, killing the victim, a passenger in another car, when the trailer becomes detached from the tractor. The employee is charged with causing death by careless driving but pleads not guilty on account that he was not reckless in his driving due to his lack of knowledge about the dangerous condition of the vehicle."], "st": "Which of the following best describes the employer's liability?", "o": ["The employer is liable for procuring the employee to commit death by careless driving.", "The employer is only liable for procuring the employee to commit death by careless driving where the employee has been convicted of the principal offence.", "The employer is only liable for procuring the employee to commit death by careless driving where the employee has committed the actus reus of the principal offence.", "The employer is not liable for procuring the employee to commit death by careless driving as the employee was obliged by his contract of employment to follow the instructions of his employer.", "The employer is not liable for procuring the employee to commit death by careless driving."], "a": "C", "bx": "The correct answer was C. This is because the employer will be liable where he has assisted or encouraged the principal to commit the actus reus of the offence. It is irrelevant whether the principal is guilty or not; the liability for the accessory derives from conduct and not from guilt (therefore option B is wrong). While option A is technically correct, it fails to adequately explain why the employer is liable, and thus is not the best description available (it is therefore wrong). Option D is incorrect as it is irrelevant whether the principal was an employee of the accessory and following instructions. Option E is wrong as the employer can be liable for procuring the offence for the reasons stated above."}, {"ch": 1, "n": 4, "sc": ["A woman supplies cutting equipment to a man. The man uses the equipment to break into a bank. The woman admits that she suspected that the equipment would be used for something illegal, such as breaking up stolen goods, but denies that she knew it would be used for committing the offence at that particular bank, on that day and at that time. The prosecution allege that the woman knew that the equipment would be used for a crime of the type committed by the man, or at the very least, it was a crime from a range of offences that she contemplated would be committed."], "st": "Which of the following best describes the direction that should be given by the judge to the jury?", "o": ["The woman can be liable if the jury accept that she did know of the existence of some illegal venture.", "The woman can only be liable if the jury accept that she did know that a particular crime would be taking place, at a particular place and time.", "The woman can only be liable if the jury accept that she did know that the equipment would be used for the type of crime committed.", "The woman can be liable if the jury accept that she did know of the type of crime that may be committed, or the range of offences that may be committed.", "The woman can only be liable where she contemplates a range of offences that may be committed by the man."], "a": "D", "bx": "The correct answer was D. This is because a defendant can be liable in circumstances where they know the type of crime that will be committed following their assistance or encouragement or can contemplate a range of crimes that may be committed. Option A is incorrect on the basis that simple knowledge of some illegal venture is not sufficient knowledge. Option B is wrong on the basis that the woman is not required to know the specifics of the offence being committed. Option C is wrong as it discounts the range of offences contemplated and option E is wrong as it ignores that the woman can be liable if she knows of the type of offence that will be committed."}, {"ch": 1, "n": 5, "sc": ["A man and a woman are involved in a spontaneous fight at a restaurant with the owner of the restaurant. It is unknown as to who initiated the fight. The man attacks the victim with a weapon but soon thereafter drops his weapon and walks away. The woman grabs a knife and stabs the victim to death. The woman is charged with murder and the man is charged with assisting or encouraging the woman to commit murder."], "st": "Which of the following best describes whether the man has effectively withdrawn from the offence?", "o": ["The man is unlikely to have effectively withdrawn from the offence. The man would have needed to communicate to the woman that he was disengaging from the offence.", "The man is unlikely to have effectively withdrawn from the offence. The man would have needed to attempt to prevent the woman from killing the victim in order to effectively withdraw.", "The man may have effectively withdrawn from the offence. Given that the violence was spontaneous, it would be neither practical nor reasonable to expect the man to communicate his withdrawal to the woman.", "The man is unlikely to have effectively withdrawn from the offence. A mere change of mind on the man's part was not sufficient; a more physical act of withdrawal was required.", "The man may have effectively withdrawn from the offence. It was sufficient for the man to stand to one side to show that he has withdrawn from the offence."], "a": "C", "bx": "The correct answer was C. This is because a withdrawal may be made during spontaneous violence without the need for communication where such communication would not be reasonable or practical. This is different in law, and is distinguished in case law, from the situation where the offence has been pre-planned. Furthermore, the fact that there is no evidence that either the man or the woman instigated the fight originally, it is more likely that a court would be sympathetic to the withdrawal of the man (option A is therefore wrong). Option B is incorrect as although a prevention of the offence from being committed would be good evidence of withdrawal, it is not required in all circumstances (all cases must be determined on their own facts). Option D is incorrect as, although a mere change of mind is not sufficient, the man in this case has dropped the weapon and walked away from the violence (he has therefore done some physical act of withdrawal). Option E is incorrect as it is not the best description of when a withdrawal can be made; merely standing to one side is unlikely to be sufficient."}, {"ch": 1, "n": 6, "sc": ["A woman supplies a gun to a man, knowing he intends to commit some violent crime, but not which."], "st": "What must be proved for her to be an accessory?", "o": ["She desired that the crime be committed.", "She was present at the scene.", "She shared the principal's purpose to kill.", "She intended to assist and knew the essential matters, which may include a range of possible offences.", "She was paid for the gun."], "a": "D", "x": ["Wrong. Desire is not required.", "Wrong. Presence is not required.", "Wrong. Shared purpose is not required.", "Correct. R v Jogee and Maxwell: intention to assist with knowledge of the essential matters.", "Wrong. Payment is irrelevant."]}, {"ch": 1, "n": 7, "sc": ["Two men agree to commit a burglary. During it, one unexpectedly stabs the householder to death."], "st": "Following R v Jogee, what is the position of the other man?", "o": ["He is automatically liable for murder, having foreseen the possibility.", "He is liable for murder only if he intended to assist or encourage the intentional causing of serious harm; otherwise manslaughter may be possible.", "He is liable for murder because he was present.", "He cannot be liable for any homicide.", "He is liable only for burglary in all cases."], "a": "B", "x": ["Wrong. Foresight alone is no longer sufficient.", "Correct. Jogee: foresight is evidence of intention only; manslaughter can be an alternative.", "Wrong. Presence is insufficient.", "Wrong. Manslaughter is possible.", "Wrong. Not in all cases."]}, {"ch": 1, "n": 8, "sc": ["A man encourages a principal to assault a victim, and the principal does so."], "st": "What is the man's liability?", "o": ["He is liable for a lesser offence only.", "He is not liable as encouragement is not participation.", "He is liable only for encouraging, with no other liability.", "He may be liable as an accessory to the same offence and be tried and punished as a principal.", "He cannot be liable unless present."], "a": "D", "x": ["Wrong. Not a lesser offence.", "Wrong. Encouragement is participation.", "Wrong. Accessory liability applies.", "Correct. Section 8 Accessories and Abettors Act 1861.", "Wrong. Presence is not required."]}, {"ch": 1, "n": 9, "sc": ["A man counsels another to commit an offence but then, before it is committed, telephones him to say he no longer supports it."], "st": "Is this likely to amount to an effective withdrawal?", "o": ["It is effective only if the police are told.", "It is effective only if the offence is not committed.", "Withdrawal is never possible.", "It may be effective if it is timely and unequivocal, but the court may require more than words where the plan is well advanced.", "It is always effective."], "a": "D", "x": ["Wrong. Police notification is not required.", "Wrong. Not the test.", "Wrong. It is possible.", "Correct. Withdrawal must be timely and unequivocal (R v Becerra; R v Rook).", "Wrong. Not always."]}, {"ch": 1, "n": 10, "sc": ["A man helps his friend dispose of a weapon after his friend has committed murder."], "st": "Is he an accessory to murder?", "o": ["Yes, if he knew of the murder.", "No, he can never be liable for anything.", "No, assistance given after the offence does not make him an accessory, though he may commit a separate offence.", "Yes, as a joint principal.", "Yes, all assistance counts."], "a": "C", "x": ["Wrong. Knowledge alone does not suffice.", "Wrong. Other offences may apply.", "Correct. Accessory liability requires assistance before or during the offence.", "Wrong. He is not a principal.", "Wrong. Not after the offence."]}, {"ch": 2, "n": 1, "sc": ["A woman enters a supermarket with the intention to steal. The woman picks up a £50 bottle of whisky and places it into her handbag. The woman is immediately stopped by store security. The supermarket is concerned that, because the woman never attempted to leave the store, the woman will not be convicted of theft and wonders whether the woman could be guilty of attempted theft."], "st": "Is the woman likely to be guilty of attempted theft?", "o": ["No, the woman has attempted to commit low-value shoplifting, which is a summary only offence and cannot be attempted.", "Yes, the woman has attempted to commit theft, which is an either way offence and can be attempted.", "No, the woman's action of placing the whisky in her handbag is not an act that is more than merely preparatory in the commission of the offence and cannot amount to an attempt.", "Yes, the woman has attempted to commit low-value shoplifting and, while it is a summary only offence, it can be attempted.", "No, the woman has attempted to commit theft, which is a summary only offence and cannot be attempted."], "a": "D", "bx": "The correct answer was D. This is because low-value shoplifting can be attempted, despite being a summary only offence (thus option A is incorrect). While option B is technically correct (thus option E is incorrect), the facts of this case would be considered as low-value shoplifting and thus option D is a more accurate statement of law. Given that theft is technically complete when the property is 'appropriated', the woman has done an act that is more than merely preparatory to the commission of theft(so option C is incorrect)."}, {"ch": 2, "n": 2, "sc": ["A man has separated from his wife. He has recently become distressed by the fact that his wife has started dating another person ('the boyfriend'). The man goes to the boyfriend's house with the intention to cause him grievous bodily harm (GBH). The man breaks into the house and sees the boyfriend sitting in the corner of the room reading a book. The man begins to walk towards him with a hammer in his hand. When the boyfriend sees the man with the hammer raised above his head, he suffers from a heart attack and dies immediately. The man runs from the home but is apprehended by the police shortly thereafter."], "st": "Is the man likely to be guilty of an attempt?", "o": ["Yes, the man can be guilty of attempted murder as he intended to cause GBH to the boyfriend. His actions of breaking into the home and walking towards the boyfriend with a hammer in his hand are acts that are more than merely preparatory to the commission of an offence.", "No, the man cannot be guilty of attempted murder or attempted GBH to the boyfriend as he has not committed any positive act that is more than merely preparatory to the commission of an offence.", "Yes, the man can be guilty of attempted GBH to the boyfriend. His actions of breaking into the home and walking towards the boyfriend with a hammer in his hand are more than merely preparatory to the commission of an offence. The man cannot be guilty of murder as he lacked the intention to kill the boyfriend.", "No, the man cannot be guilty of attempted murder or attempted GBH to the boyfriend as he has not made any physical contact with the boyfriend. In order for an act of attempted murder or attempted GBH to be met, there must at least be some physical contact.", "Yes, the man can be guilty of attempted murder as he intended to cause GBH to the boyfriend. His actions of breaking into the home and walking towards the boyfriend with a hammer in his hand are acts that are more than merely preparatory to the commission of an offence. The man cannot be guilty of attempted GBH as the boyfriend has died."], "a": "C", "bx": "The correct answer was C. This is because the man has done an act of walking towards the boyfriend with a hammer in his hand and has raised the hammer above his head (thus, option B is incorrect). This action is more than merely preparatory to the commission of GBH, for which he had the intention. The man cannot be guilty of attempted murder as he did not intend to kill the man (so option A is incorrect). Option D is incorrect as there is no formal requirement that physical contact is made (though it may be relevant to determining whether the conduct was more than merely preparatory). Option E confuses the law of attempts and intention and is incorrect."}, {"ch": 2, "n": 3, "sc": ["A man is arrested by customs officials at an airport. The customs officials are suspicious that he is attempting to import illegal substances into the UK. The man believes that his suitcase contains prohibited drugs. Unbeknown to the man, the suitcase contains no illegal substances."], "st": "Is the man likely to be guilty of an attempted offence?", "o": ["No, given that he was never in possession of prohibited drugs, the offence could not factually be committed and so the man cannot be guilty.", "Yes, on account that factual impossibility is no defence to an offence of attempt. It is irrelevant whether the substance was unlawful, the focus is on whether the man believed the substance to be unlawful.", "No, because the offence was legally impossible to commit given that the man was never in possession of prohibited drugs.", "Yes, on account that while the offence is not legally possible to commit, it is factually possible and that is sufficient for an attempt.", "No, because the substance was not a prohibited drug, the man has not done an act that was more than merely preparatory."], "a": "B", "bx": "The correct answer was B. This is because factual impossibility is no defence to a charge of attempt (thus, option A is incorrect). Options C and D are incorrect because the offence is legally possible to commit and option E is irrelevant as it ignores the operation of factual impossibility."}, {"ch": 2, "n": 4, "sc": ["Late at night, a man was caught by a police officer at a house, standing in front of a damaged front door. The door's locks and hinges had been broken and the door was held by a single bolt at the top. The prosecution alleged that the man had approached the door, inspected it and then damaged the door, with an intention to enter the house as a trespasser and steal property therein, and thus charged him with attempted burglary."], "st": "Was the prosecution correct to charge the man with attempted burglary?", "o": ["No, there was no evidence open to the jury that the man intended to steal property in the house.", "No, there was no evidence open to the jury that the man had done an act that was more than merely preparatory towards the offence of burglary. The man would have had to enter the house in order for his conduct to be classified as more than merely preparatory.", "Yes, there was evidence open to the jury that the man had done an act that was more than merely preparatory towards the offence of burglary. The man did not have to enter the house in order for his conduct to be classified as more than merely preparatory.", "No, the man cannot be charged with attempted burglary as the offence was factually impossible given that the man was caught by a police officer.", "Yes, the man was liable for the offence of attempted burglary at the point that he allegedly inspected the door. All actions that followed that inspection of the door were merely supplementary."], "a": "C", "bx": "The correct answer was C. This is because the offence of burglary requires that the man enter a building or part of a building as a trespasser. By damaging the door, a jury could be sure that the man intended to enter the building as a trespasser with the intention to steal, cause GBH or do unlawful damage therein. Given that the full offence of burglary is made out at point of entry into the building, the man need not enter the building to be liable for an attempt (so option B is incorrect). On the other hand, the mere inspection of the door would not be sufficient and would be considered 'merely' preparatory (so option E is wrong). Option A is incorrect on account that the jury would be entitled to reach that conclusion based upon all of the evidence in the case. Option D is incorrect on account that it is a misunderstanding of factual impossibility."}, {"ch": 2, "n": 5, "sc": ["A man enters a greengrocer with the intention to steal money from the store. The man is intercepted by the grocer, who lives above the store, before he is able to steal anything. The man is arrested and charged with attempted burglary. The prosecution allege that the man had entered the premises as a trespasser (with intent to steal therein'. The trial judge withdraws the case from the jury on account that a 'conditional' intent to steal is not sufficient for attempted burglary."], "st": "Was the trial judge right to withdraw the case from the jury?", "o": ["No, the prosecution's case was properly stated on the basis that the man's intention was to steal anything of value. A conditional intent is sufficient for attempted burglary.", "Yes, the prosecution are required to allege that the man intended to steal particular items of property. A conditional intent is not sufficient for attempted burglary.", "Yes, the phrase 'with intent to steal' therein is too general. While particular pieces of property need not be identified, the prosecution is not permitted to allege particulars that are so general in nature.", "Yes, the man clearly identified that he intended to steal 'money'. As such, the indictment should have specifically alleged that the man intended to steal any money that he found in the house.", "No, whether the man possessed the intention to steal any property in the house is a matter of fact for the jury and the judge is not permitted to withdraw a case from them in those instances."], "a": "A", "bx": "The correct answer was A. This is because the prosecution are entitled to draft the indictment broadly to encompass the circumstances where the man has a conditional intention to steal anything of value from the property. There is no requirement to specify what the man attempted to steal (and therefore option B is incorrect). Options C and D are incorrect on the basis that the prosecution do not require specific property to be identified; a conditional intention to steal anything of value is sufficient. Option E is wrong on account that the trial judge is permitted to withdraw cases from the jury where he is satisfied that there is no evidence that the jury could conclude that the man attempted the offence in question. Here, there was ample evidence in any event."}, {"ch": 2, "n": 6, "sc": ["A man is charged with attempted murder."], "st": "What mens rea must be proved?", "o": ["An intention to cause some harm.", "Recklessness as to death.", "An intention to cause GBH.", "Foresight of serious harm.", "An intention to kill."], "a": "E", "x": ["Wrong. Too low.", "Wrong. Recklessness is insufficient.", "Wrong. GBH intent suffices for murder, not attempt.", "Wrong. Not sufficient.", "Correct. R v Whybrow: attempted murder requires intent to kill."]}, {"ch": 2, "n": 7, "sc": ["A man goes to a public toilet with a knife intending to rob, but has not yet entered or approached anyone."], "st": "Is this likely to be more than merely preparatory?", "o": ["Yes, intention alone suffices.", "No, attempt requires completion.", "Probably not, as he has not embarked on the crime proper.", "Yes, any act counts.", "Yes, possession of the knife is enough."], "a": "C", "x": ["Wrong. An act is required.", "Wrong. No, completion is not required.", "Correct. R v Campbell and R v Geddes: acts remain merely preparatory.", "Wrong. Not any act.", "Wrong. Possession alone is not enough."]}, {"ch": 2, "n": 8, "sc": ["Two people agree to commit a burglary."], "st": "Which offence is committed at the point of agreement?", "o": ["Attempted burglary.", "No offence until an act is done.", "Encouraging an offence under the Serious Crime Act 2007 only.", "Common law conspiracy to defraud.", "Statutory conspiracy under s 1 Criminal Law Act 1977."], "a": "E", "x": ["Wrong. No act beyond agreement.", "Wrong. The agreement suffices.", "Wrong. Not the best answer.", "Wrong. Not a fraud conspiracy.", "Correct. The agreement itself is the offence."]}, {"ch": 2, "n": 9, "sc": ["A woman tries to handle goods she believes are stolen, but they are not."], "st": "Can she be guilty of attempt?", "o": ["Yes, under s 1(2) and (3) Criminal Attempts Act 1981 and R v Shivpuri.", "No, it is impossible.", "Yes, but only if negligent.", "No, the goods are not stolen.", "No, handling cannot be attempted."], "a": "A", "x": ["Correct. Impossibility is no defence.", "Wrong. Impossibility is irrelevant.", "Wrong. Negligence is irrelevant.", "Wrong. Her belief governs.", "Wrong. It can be attempted."]}, {"ch": 2, "n": 10, "sc": ["A man is charged with attempting a summary-only offence of common assault."], "st": "Can he be guilty?", "o": ["No, attempts apply only to indictable offences (subject to statutory exceptions).", "Yes, if the victim was frightened.", "Yes, any offence can be attempted.", "Yes, if he intended it.", "No, assault requires injury."], "a": "A", "x": ["Correct. Section 1(4) CAA 1981 limits attempts to indictable offences.", "Wrong. Not the reason.", "Wrong. Not any offence.", "Wrong. Intention is not the issue.", "Wrong. Not the reason."]}, {"ch": 3, "n": 1, "sc": ["A woman consumed a quantity of LSD and while hallucinating thought her boyfriend was a demon and killed him. She cannot remember the events and admits she voluntarily consumed the drug. She has been charged with manslaughter."], "st": "Will the woman be able to rely on the defence of intoxication?", "o": ["Yes, as the woman has not formed the mens rea of a specific-intent offence due to her intoxication.", "No, intoxication is only available where a person has consumed alcohol.", "No, intoxication is only available as a defence where a person has become involuntarily intoxicated.", "No, the woman has ingested a dangerous drug and has been charged with a basic-intent offence.", "Yes, the woman consumed a non-dangerous drug and is then involuntarily intoxicated."], "a": "D", "bx": "The correct answer was D. This is because the woman would be subject to the rules governing voluntary intoxication as she has taken a dangerous drug and had been charged with a basic-intent offence. Manslaughter is a basic-intent offence, so option A is wrong. Option B is incorrect on account that the rules of intoxication apply equally to drugs or alcohol. Option C is wrong because it ignores the rules relating to voluntary intoxication and option E is wrong on account that LSD is a dangerous drug."}, {"ch": 3, "n": 2, "sc": ["A man visits his friend's house and has a couple of drinks. He is told by his friend that they are low-alcohol drinks, but they are actually quite alcoholic (5.7 ABV). When the man leaves, he sees his ex-wife in the street, runs over to her and pushes her over intentionally. He now claims he would not ordinarily have done such a thing, but he was involuntarily intoxicated. The man is charged with a battery (intending or being reckless as to applying unlawful force)."], "st": "Can the man rely on the defence of involuntary intoxication?", "o": ["Yes, the man would not normally have acted this way and his inhibitions had been lowered by his involuntary intoxication.", "Yes, involuntary intoxication supplies a defence where a person is not to blame for getting themselves into a state of intoxication.", "No, the man's consumption of the drink does not amount to involuntary intoxication and the man formed the mens rea for the offence.", "No, involuntary intoxication is not available where a person commits a basic-intent offence.", "Yes, as the man was not reckless in his consumption of the drink."], "a": "C", "bx": "The correct answer was C. This is because the man knew he was drinking alcohol, and it is irrelevant whether he was aware of the strength of the alcohol or not, so this cannot amount to involuntary intoxication and he also formed the mens rea for the offence. Option A is incorrect on account that a drunken intent is still an intent and lowered inhibitions is no defence. Option B ignores the fact that the man still formed the mens rea and thus is wrong. Option D is wrong because involuntary intoxication is capable of being used for all offences, and in any event the man is not involuntarily intoxicated. Recklessness as to consumption is only relevant where the drug is a non-dangerous one, for which alcohol is not (so option E is wrong)."}, {"ch": 3, "n": 3, "sc": ["A man had been drinking heavily at his local pub for several hours and was unsteady on his feet. Upon leaving the pub, he noticed a teenager walking towards him carrying a cricket bat. The teenager shouted, 'You alright mate?' The man misheard and thought the teenager had shouted 'You better run mate!' The man mistakenly thought he was about to be attacked and punched the teenager to the ground."], "st": "Can the man use the defence of self-defence?", "o": ["Yes, the defence can be founded on a mistake as to the need to use self-defence.", "No, a person cannot make a pre-emptive strike.", "No, there was no immediacy to the threat.", "Yes, the force used was reasonable in the circumstances as the man honestly (but mistakenly) believed them to be.", "No, a person cannot rely on an intoxicated mistake as to the need to use self-defence."], "a": "E", "bx": "The correct answer was E. Where a mistake is made about the need to use force because of voluntary intoxication, no defence of self- defence is available to either a basic- or specific-intent offence. Option A is incorrect on account that while a mistake can found a defence of self-defence, a mistake induced by intoxication cannot. Option B is wrong as pre-emptive strikes can be relied on to use force. Option C is incorrect on account that the man is to be judged on the facts as he believed them to be (and the man believed he was about to be attacked with a cricket bat). Option D ignores the fact that the man was intoxicated and the fact that a mistake cannot be made as to how much force is reasonable."}, {"ch": 3, "n": 4, "sc": ["A woman decided to play a trick on her friend and lay behind the bushes at the end of her friend's garden, waiting for him to come home from work. When her friend appeared, she burst out of the bushes intending to scare the man. The friend picked up a nearby shovel and hit the woman with it, killing her on impact. The man has been charged with murder and the trial judge has ruled the defence of self-defence is not available."], "st": "Is the trial judge correct to remove self-defence from the jury?", "o": ["Yes, as it was merely a prank and it was unnecessary to use any force.", "Yes, there is no defence of self-defence to murder.", "No, the jury merely need to conclude that reasonable force was used.", "No, the question of whether it was necessary to use force and whether that force was reasonable in those circumstances is one for the jury.", "Yes, self-defence is unavailable to specific-intent offences."], "a": "D", "bx": "The correct answer was D. This is because the question of whether it was necessary to use force is one for the jury, which must take into account the man's honest belief. They may take into account how reasonable it is that he held that belief, but he is not automatically deprived of the defence as the use of force was, as here, unnecessary. Option A ignores the fact that the necessity to use force must be judged on the facts as the man believed them to be (the man would not know that this was a prank). Option B is wrong as self-defence can be a defence to murder. Option C is wrong as it ignores the first stage of the test for self-defence: whether force was necessary in the circumstances. Option E is not sufficiently precise as to why self-defence is a valid defence and thus cannot be the best answer."}, {"ch": 3, "n": 5, "sc": ["A woman was at home one evening when she heard someone come into her home. She ran into the kitchen and picked up a knife. She then confronted the shadowy figure and stabbed him several times. When she switched on the kitchen light, she realised the 'intruder' was her friend who she had asked to come around to drop off her spare keys. The judge directed the jury that they should find she acted in self-defence unless the force she used was grossly disproportionate."], "st": "Is the judge correct in his direction to the jury?", "o": ["Yes, the householder defence means any force short of that which is grossly disproportionate force amounts to reasonable force.", "No, force that is disproportionate is reasonable, but grossly disproportionate force is not.", "Yes, the judge can phrase this to the jury in any way he deems appropriate.", "No, the jury should be directed that if the force used is grossly disproportionate the defence will fail, if it was not, the jury should ask itself whether the force used was reasonable.", "No, the jury should be directed to consider whether the force used was disproportionate, if it was the defence will fail."], "a": "D", "bx": "The correct answer was D. This is because the correct direction asks first whether the force used was grossly disproportionate. If so, the defence fails. If it was not, the jury should then ask itself whether the force used was reasonable. Disproportionate force may be reasonable, but this is a question for the jury. Option A is incorrect because it ignores the second question to be asked by the jury: whether the force was nevertheless reasonable in the circumstances. Option B misstates the law: disproportionate force is not automatically reasonable, it depends on the assessment of the jury. Option C is wrong because it ignores the directions laid down by the courts as to the two questions the jury must ask. Option E ignores the fact that disproportionate force may be considered reasonable in the circumstances."}, {"ch": 3, "n": 6, "sc": ["A man is charged with murder and pleads duress by threats."], "st": "What is the position?", "o": ["Duress is available only if the threat was immediate.", "Duress is available if the threat was to a family member.", "Duress is not available to murder or attempted murder.", "Duress reduces murder to manslaughter.", "Duress is a full defence to murder."], "a": "C", "x": ["Wrong. Still unavailable.", "Wrong. Still unavailable.", "Correct. R v Howe and R v Gotts.", "Wrong. No partial defence.", "Wrong. Not available."]}, {"ch": 3, "n": 7, "sc": ["A man joins a violent criminal gang voluntarily and is later threatened to commit a robbery."], "st": "Can he rely on duress?", "o": ["Yes, if he left the gang.", "Yes, duress is always available for robbery.", "Yes, provided the threat was serious.", "Not if he foresaw, or ought to have foreseen, a risk of being subjected to compulsion by threats of violence.", "No, only for threats from strangers."], "a": "D", "x": ["Wrong. Not necessarily.", "Wrong. Not always.", "Wrong. Seriousness alone is not enough.", "Correct. R v Hasan: voluntary association excludes duress.", "Wrong. Not the rule."]}, {"ch": 3, "n": 8, "sc": ["A woman suffering from a disease of the mind does not know her act is wrong."], "st": "Which defence may apply?", "o": ["Diminished responsibility only.", "Duress of circumstances.", "Non-insane automatism.", "Insanity under the M'Naghten Rules.", "Intoxication."], "a": "D", "x": ["Wrong. Applies only to murder.", "Wrong. Not relevant.", "Wrong. Internal cause means insanity.", "Correct. M'Naghten: defect of reason from a disease of the mind.", "Wrong. Not relevant."]}, {"ch": 3, "n": 9, "sc": ["A diabetic fails to take insulin and becomes hyperglycaemic, then commits an assault."], "st": "Which defence is relevant?", "o": ["Necessity.", "Insanity, as hyperglycaemia arises from an internal cause.", "Self-defence.", "Voluntary intoxication.", "Non-insane automatism."], "a": "B", "x": ["Wrong. Not relevant.", "Correct. R v Hennessy: internal cause.", "Wrong. Not relevant.", "Wrong. Not intoxication.", "Wrong. Hypoglycaemia from insulin is external (Quick)."]}, {"ch": 3, "n": 10, "sc": ["A man voluntarily drinks heavily and then assaults someone, causing ABH. He claims he was too drunk to form mens rea."], "st": "Can he rely on voluntary intoxication?", "o": ["No, ABH is a basic-intent offence.", "Yes, for any offence.", "Yes, if very drunk.", "No, intoxication is never relevant.", "Yes, if it was his first time drinking."], "a": "A", "x": ["Correct. DPP v Majewski.", "Wrong. Only specific intent.", "Wrong. Degree is irrelevant here.", "Wrong. It is relevant to specific intent.", "Wrong. Irrelevant."]}, {"ch": 4, "n": 1, "sc": ["A woman has returned home to find her boyfriend having sex with her mother. The mother jumped up and told the woman that the boyfriend had forced himself on her and threatened to hurt the woman if she did not lie still and take it'. The woman rushed from the room and returned with a knife from the kitchen. Seeing the knife, the boyfriend ran from the room and the woman chased him down the stairs, eventually catching him at the front door and stabbing him in the back. That single wound caused his death. The woman has been charged with murder and is claiming loss of control. She has been advised that she will not succeed with the defence as her loss of control arose as a result of the boyfriend's sexual infidelity."], "st": "Has the woman been advised correctly?", "o": ["Yes, sexual infidelity cannot be the thing 'done or said' for the purpose of a qualifying trigger and this is the case here.", "Yes, although there are other factors here (the alleged rape), the fact that the circumstances amount to infidelity mean that the woman is barred from raising the defence.", "No, where sexual infidelity is an essential part of the context, it is not to be excluded in a determination of whether other things 'said and done' were grave enough to amount to the trigger.", "No, the defence can be satisfied by evidence of any provocative conduct.", "No, sexual infidelity can be the sole thing 'done or said' for the purpose of the qualifying trigger."], "a": "C", "bx": "The correct answer was C. The exclusion of sexual infidelity does not mean that other things 'said and done' cannot be taken into consideration for the purpose of establishing a qualifying trigger. Options A and B are incorrect as they fail to understand the circumstances where sexual infidelity can be relevant. Option D is incorrect as there is no qualifying trigger related to mere 'provocative conduct'. Option E is incorrect as it ignores the exclusion of sexual infidelity as a sole qualifying trigger in the legislation."}, {"ch": 4, "n": 2, "sc": ["A man returned home to find a woman in his property. He confronted the woman and asked, 'What do you think you are doing?' The woman responded by hitting the man with the torch she was holding, intending to cause him serious injury. The man died as a result of that injury and the woman was charged with murder. At trial, the woman asserted that she had lost self-control as she had felt a justifiable sense of being seriously wronged when the man had questioned what she was doing. The trial judge concluded that there was insufficient evidence of a qualifying trigger to leave the defence of loss of control to the jury."], "st": "Is the judge entitled to make this decision?", "o": ["Yes, there must be evidence satisfying both the fear trigger and the anger trigger before the defence can be left to the jury.", "No, the defence must always be left to the jury where there is some evidence that a trigger or triggers will be satisfied.", "No, the focus is upon whether the woman felt a justifiable sense of being seriously wronged and the jury should have been directed to assess this.", "Yes, the judge is entitled to withdraw the defence from the jury if he has concluded that there is insufficient evidence of a qualifying trigger.", "No, even if there is insufficient evidence of a qualifying trigger the woman is entitled to argue she has been otherwise provoked into the killing."], "a": "D", "bx": "The correct answer was D. The judge is required to carefully review the evidence to establish whether there is sufficient evidence amounting to a qualifying trigger (therefore option B is incorrect). Option A is incorrect as the defence need only establish the 'anger' or the 'fear' trigger, not both. Option C misstates the test as a subjective one, as opposed to an objective test. Option E is a simple misstatement of the law - there must be an evidential basis for pleading the defence."}, {"ch": 4, "n": 3, "sc": ["A woman has been caring for her husband for 20 years. The husband suffers from dementia and his condition has worsened in the past year. The woman is older than her husband and is concerned that, when she dies, he will not be cared for properly. One afternoon, the woman takes her husband into the garden and gives him a cup of tea that she has adulterated with her pain medication. She intends to bring about his swift and painless death and the tea has the desired result. The woman has been charged with his murder and seeks advice as to whether her concern about her husband's welfare can form the basis of a plea of diminished responsibility."], "st": "Can the woman argue diminished responsibility?", "o": ["Yes, diminished responsibility provides a partial defence for those who are morally deserving of it.", "Yes, the woman need only prove, to the civil standard, that her concern about his welfare had prevented her from making a rational decision.", "No, the woman's concern about her husband's welfare falls short of a recognised mental condition.", "No, the woman would have to provide evidence that proved beyond reasonable doubt that she satisfied the elements of the defence, and this is unlikely on the facts.", "Yes, a jury do not need to hear any medical evidence pertaining to any specific medical condition."], "a": "C", "bx": "The correct answer was C. The defence requires the woman to be suffering from a recognised medical condition and there is no indication here that this is the case (option E is therefore wrong as medical evidence would need to be submitted to support the defence). Option A is wrong because the defence does not operate to benefit those who are morally deserving. Option B is wrong because there has to be a recognised medical condition that caused the disease of the mind; her concern for his wellbeing is not such a recognised condition. Option D is incorrect as, while the burden of proof is on the defence to prove the existence of the defence, this is on the civil standard of proof and not the criminal standard."}, {"ch": 4, "n": 4, "sc": ["A boy, aged 12, has been teased at school after his mum decided to give him a haircut at home. One girl in his class had spent all day laughing and pointing at the boy. The boy corners the girl outside the school and shows her a flick knife (where the blade is hidden inside the handle and springs out when a button is pressed), telling her, 'Let's see how you look if I cut off all your hair.' The girl struggled to escape, and the boy's finger pressed against the button, the blade flew out and entered the girl's throat. The girl died of blood loss and the boy was charged with unlawful act manslaughter. On the question of dangerousness, the trial judge directed the jury that 'you must ask yourselves whether a reasonable 12-year-old boy would have seen an inevitable risk of some harm'."], "st": "Have the jury been correctly directed?", "o": ["Yes, the jury can take into account the age of the boy.", "Yes, the reasonable person is afforded all relevant characteristics of the boy.", "No, the test requires foresight of an inevitable risk of serious harm.", "No, the age of the boy is irrelevant to the test of dangerousness.", "No, the test is subjective, and the jury should be asked whether the boy appreciated that there was an inevitable risk of some harm."], "a": "D", "bx": "The correct answer was D. The test for dangerousness is an objective one (therefore option E is wrong). The age of the accused will be relevant to the question of whether they had the mens rea for the unlawful act but not for the estimation of dangerousness (therefore while option A is technically correct, it is not the most accurate answer). Option B is also wrong for the same reason - the reasonable person would be aware of the same circumstances as the boy, but will not share their characteristics when determining dangerousness. Option C is wrong because it misstates the test as being foresight of 'serious harm, - the test is whether there is foresight of 'some harm'."}, {"ch": 4, "n": 5, "sc": ["A woman, a general practitioner (GP), has started work at a new practice and is reading the introductory literature they have provided her with. In that literature, it states that all GPs need to ensure that they keep up to date with developments in medicine as If they fail to diagnose a patient and that patient dies, this will be in breach of their duty of care, even where that condition and/or symptoms are not widely recognised as serious. A jury may then find them liable for gross negligence manslaughter.' The woman does not believe that this is true."], "st": "Is this an accurate statement of the law?", "o": ["Yes, the offence of gross negligence manslaughter merely requires that a defendant breaches their duty of care.", "No, there must be an obvious and serious risk of harm at the time of the breach.", "No, there must be an obvious and serious risk of death at the time of the breach.", "No, gross negligence cannot be based upon an omission.", "Yes, as a jury can take account of developments in medicine that a reasonably competent doctor would not have been aware of."], "a": "C", "bx": "The correct answer was C. There must be a breach of duty and this can be by way of an omission (therefore option D is wrong), but at the time of the breach there must be an obvious and serious risk of death (therefore options A and B are incorrect). Option E is wrong as the assessment must be made based on the information available to the reasonable person standing in the shoes of the woman."}, {"ch": 4, "n": 6, "sc": ["A man kills his partner after losing self-control due to a long period of abuse."], "st": "Which partial defence may be available?", "o": ["Provocation at common law.", "Diminished responsibility only.", "Loss of control under s 54 Coroners and Justice Act 2009.", "Self-defence.", "Duress."], "a": "C", "x": ["Wrong. Abolished.", "Wrong. Not the best answer.", "Correct. Loss of control replaced provocation.", "Wrong. Not on these facts.", "Wrong. Not available."]}, {"ch": 4, "n": 7, "sc": ["A defendant seeks to rely on loss of control."], "st": "Which is NOT a requirement of the defence?", "o": ["The defendant must not have acted in a considered desire for revenge.", "There must be a loss of self-control.", "The loss of control must be sudden.", "There must be a qualifying trigger.", "A person of the defendant's sex and age with normal tolerance might have reacted similarly."], "a": "C", "x": ["Wrong. Required.", "Wrong. Required.", "Correct. Section 54(2): it need not be sudden.", "Wrong. Required.", "Wrong. Required."]}, {"ch": 4, "n": 8, "sc": ["A man supplies heroin to a friend, who self-injects and dies."], "st": "Is the man guilty of unlawful act manslaughter?", "o": ["Yes, supply is a dangerous act.", "Yes, in all cases.", "No, supply is not unlawful.", "No, the victim's free and voluntary self-administration breaks the chain of causation.", "Yes, if the man was present."], "a": "D", "x": ["Wrong. Causation fails.", "Wrong. Not in all cases.", "Wrong. Supply is unlawful.", "Correct. R v Kennedy (No 2).", "Wrong. Presence does not change the analysis."]}, {"ch": 4, "n": 9, "sc": ["A woman is charged with murder and wishes to rely on diminished responsibility."], "st": "Who bears the burden of proof?", "o": ["The defence, beyond reasonable doubt.", "The judge decides without a burden.", "The prosecution, beyond reasonable doubt.", "The defence, on the balance of probabilities.", "No burden applies."], "a": "D", "x": ["Wrong. Wrong standard.", "Wrong. Not correct.", "Wrong. Reverse burden.", "Correct. Section 2(2) Homicide Act 1957.", "Wrong. Not correct."]}, {"ch": 4, "n": 10, "sc": ["A man intends to cause GBH to a victim and the victim dies."], "st": "Is this murder?", "o": ["No, it is manslaughter only.", "No, unless a weapon was used.", "No, intent to kill is required.", "Yes, intention to cause GBH is sufficient malice aforethought.", "Yes, but only if he foresaw death."], "a": "D", "x": ["Wrong. Murder.", "Wrong. Not required.", "Wrong. Not required.", "Correct. R v Vickers; R v Cunningham.", "Wrong. Not required."]}, {"ch": 5, "n": 1, "sc": ["A man has been calling his ex-girlfriend on her mobile phone and hanging up before she answers. He has disguised his number, but the woman is aware that it is the man as he had told a mutual friend that he intended to 'scare her' by making the calls. The woman knows that the man is currently working 100 miles away but becomes concerned she may be at risk of violence."], "st": "Has the man committed an assault?", "o": ["No, an assault cannot be committed by silence.", "Yes, an assault can be committed by silence alone and if the woman is scared then an assault has been committed.", "No, an assault requires an application of force.", "Yes, an assault can be committed by silence and if the woman feels at risk of violence in the future an assault has been committed.", "No, an assault can be committed by silence, but the woman does not, on the facts, expect violence to be applied to her immediately."], "a": "E", "bx": "The correct answer was E. An assault can be committed by silence (so option A is wrong) and by someone who is not proximate to the victim. However, there must be an expectation of, at least, an imminent application of unlawful force (so option D is wrong) and on the facts this is not satisfied. Option B is incorrect because it fails to sufficiently describe the requirement of immediacy. Option C is incorrect as an assault does not require any use of force; the appropriate offence there would be battery."}, {"ch": 5, "n": 2, "sc": ["A man has hit a woman on the back of her head during an argument. The woman has not sustained any injuries as a result of being hit. The man has now been charged with battery."], "st": "Has the man committed a battery?", "o": ["No, an assault must precede a battery.", "No, injury must result for a battery to be made out.", "Yes, the man has applied unlawful force to the woman.", "Yes, the man has caused the woman to expect the application of unlawful force.", "No, as the man has hit the woman on the head the appropriate offence would be s 47 OAPA 1861."], "a": "C", "bx": "The correct answer was C. A battery is merely the application of unlawful force and there is no requirement that the victim anticipates that force (ie that an assault precedes a battery - so option A is wrong), nor that it results in any harm (so option B is wrong). Option D is wrong because it incorrectly describes the offence of battery and option E is incorrect as the woman has not sustained any injury, therefore an offence contrary to s 47 could not be made out."}, {"ch": 5, "n": 3, "sc": ["A man and a woman are in the woman's car and are travelling to pick up their children from swimming club. The man tells the woman that her children are poor swimmers and will never be chosen to represent the club in an upcoming competition. The woman is upset and intentionally shoves the man. As the car door has not been properly closed it springs open and the man falls out of the car, suffering some bruising and grazing. The woman is charged with s 47 OAPA 1861 but maintains she did not foresee that the man would suffer any injury."], "st": "Has the woman committed a s 47 offence?", "o": ["Yes, if it can be proven that an injury was reasonably foreseeable.", "Yes, there is no requirement that injury is foreseen.", "No, s 47 requires serious injury to be suffered.", "No, there must be foresight of some harm.", "No, s 47 requires an intention to do harm."], "a": "B", "bx": "The correct answer was B. There is no mens rea in relation to the causing of ABH. The only mens rea required is that for the assault or, as in this case, the battery. As all other options refer to some requirement of mens rea in respect of injury, they are all incorrect."}, {"ch": 5, "n": 4, "sc": ["A man and woman work together. The woman has recently made the man angry by suggesting he was not doing his job properly. One afternoon, the man saw the woman going into a small room where the office stationery was kept. To get revenge, the man decided to lock the door and trap the woman in the room. The woman spent the rest of the afternoon trapped in the small room. As a result, the woman has now been diagnosed with post-traumatic stress disorder (PTSD). The man has been charged with an offence contrary to s 20 OAPA 1861. His defence asserts that he has not inflicted harm upon the woman."], "st": "Has there been an infliction of harm?", "o": ["Yes, an infliction is made out where there has been an assault.", "No, an infliction requires an application of force.", "Yes, if injury has been suffered then it is merely assumed that this has been inflicted.", "Yes, infliction is essentially synonymous with cause.", "No, only a wound can be inflicted."], "a": "D", "bx": "The correct answer was D. Infliction is now understood to be essentially synonymous with cause. All other options suggest different interpretations of the word 'infliction', all of which are not an accurate reflection of the law."}, {"ch": 5, "n": 5, "sc": ["A man is being arrested by a police officer and she is restraining him. The man wriggles to escape from the police officer's grasp and they both topple over. The police officer falls to the floor with the man on top of her, splitting her head open and suffering a serious concussion. The man did not intend, nor did he foresee any risk, that the police officer would suffer any harm as a result of his attempt to break free from her restraint. The man was immediately picked up by a fellow police officer and charged with s 18 OAPA 1861, in that he had maliciously caused GBH while intending to resist arrest. The man asserts the mens rea of the offence has not been made out."], "st": "Is the man correct?", "o": ["Yes, the man must successfully resist arrest for the offence to be satisfied.", "Yes, although the man intended to resist arrest, he must also be malicious as to the causing of harm.", "No, the man need only intend to resist arrest for the offence to be satisfied.", "No, the man need only intend to resist arrest and cause GBH for the offence to be made out.", "Yes, the man must intend to resist arrest and intend to cause GBH."], "a": "B", "bx": "The correct answer was B. A s 18 offence not only requires that the ulterior intent is satisfied, here the intention to resist arrest, but also that the man intends or is subjectively reckless as to some harm (so option C is wrong). Option A is wrong because there is no requirement in law for the man to successfully resist arrest. Option D is wrong because there is an additional requirement of maliciousness when a man is alleged to have resisted lawful apprehension. Option E is wrong because the requirement is that the man either intends or is reckless as to causing harm; there is no requirement of intention alone."}, {"ch": 5, "n": 6, "sc": ["A man punches a victim, causing bruising."], "st": "What is the most appropriate charge?", "o": ["GBH under s 18.", "Wounding under s 20.", "Common assault only, as bruising is never ABH.", "Attempted murder.", "Assault occasioning ABH under s 47 OAPA 1861."], "a": "E", "x": ["Wrong. Too serious.", "Wrong. No wound.", "Wrong. Bruising can be ABH.", "Wrong. No.", "Correct. Bruising can be ABH."]}, {"ch": 5, "n": 7, "sc": ["A victim suffers a cut in which both layers of the skin are broken."], "st": "Is this a wound?", "o": ["No, a fracture is required.", "No, wounds must be serious.", "No, internal bleeding is required.", "Yes, any bruise is a wound.", "Yes, a break in the continuity of the whole skin is a wound."], "a": "E", "x": ["Wrong. Not required.", "Wrong. Seriousness is not required.", "Wrong. Not required.", "Wrong. Bruises are not wounds.", "Correct. JCC v Eisenhower."]}, {"ch": 5, "n": 8, "sc": ["A man is charged under s 20 OAPA 1861."], "st": "What mens rea is required?", "o": ["No mens rea.", "Intention or recklessness as to some harm.", "Intention to cause GBH.", "Recklessness as to serious harm.", "Negligence."], "a": "B", "x": ["Wrong. Mens rea is required.", "Correct. R v Mowatt; R v Savage.", "Wrong. That is s 18.", "Wrong. Some harm suffices.", "Wrong. Not negligence."]}, {"ch": 5, "n": 9, "sc": ["Two men engage in horseplay and one is injured."], "st": "Can consent be a defence?", "o": ["No, consent is never a defence to ABH.", "Only if written consent was given.", "No, horseplay is always unlawful.", "Only for sports governed by rules.", "Yes, consent may be available for rough horseplay, including a genuine belief in consent."], "a": "E", "x": ["Wrong. Exceptions exist.", "Wrong. No formal requirement.", "Wrong. Not so.", "Wrong. Horseplay is recognised.", "Correct. R v Jones; R v Aitken."]}, {"ch": 5, "n": 10, "sc": ["A man recklessly transmits a serious disease to a sexual partner without telling them."], "st": "Can he be liable under s 20 OAPA 1861?", "o": ["No, there is no infliction.", "Yes, informed consent is absent.", "Yes, but only if he intended transmission.", "No, transmission is not GBH.", "No, consent to intercourse is consent to the risk."], "a": "B", "x": ["Wrong. Infliction is satisfied.", "Correct. R v Dica.", "Wrong. Recklessness suffices.", "Wrong. It can be GBH.", "Wrong. Not informed consent."]}, {"ch": 6, "n": 1, "sc": ["A man is invited to his friend's bungalow for a party. While at the party, the man gets into a fight with the friend's brother. The man is asked to leave the house immediately. Upon being asked to leave, the man intends to cause damage to some property in order to teach his friend a lesson. Instead of leaving the house, the man walks into a bedroom and begins to urinate on the furniture, causing irreparable damage."], "st": "Is the man guilty of burglary contrary to s 9 Theft Act (TA) 1968?", "o": ["No, the man cannot be guilty of burglary as he was not a trespasser in the bungalow at the point of entry.", "No, the man cannot be guilty of burglary as the commission of criminal damage is not an offence that can satisfy the offence of burglary under s 9(1)(b) TA 1968.", "Yes, the man entered the bedroom as a trespasser with the intention to commit criminal damage, which can satisfy the offence of burglary under s 9(1)(a) TA 1968.", "Yes, the man became a trespasser immediately upon being asked to leave the house and any damage caused thereafter can satisfy the offence of burglary under s 9(1)(b) TA 1968.", "No, the man cannot be guilty of burglary as he did not intend to cause criminal damage at the point of entry into the bungalow."], "a": "C", "bx": "The correct answer was C. This is because the man became a trespasser when he moved from one part of the building to another after having his permission revoked by the householder. The man held an intention to commit damage at the point of entry into the bedroom and can be liable for burglary. Option A is incorrect because an individual is capable of entering property lawfully and subsequently becoming a trespasser. While the statement in option B is accurate, in that criminal damage is not an ulterior offence capable of satisfying the offence in s 9(1)(b), the statement is incorrect because the man can be liable for an offence contrary to s 9(1)(a). Option D is wrong on account that the man did not 'enter' as a trespasser until he moved into the bedroom; he must be permitted a reasonable amount of time to leave the bungalow. Furthermore, criminal damage does not satisfy an offence under s 9(1)(b). Option E is incorrect because it is sufficient that the man intends to cause criminal damage at the point of entry into the bedroom."}, {"ch": 6, "n": 2, "sc": ["A husband and wife are walking down the high street when they are approached by a woman. The woman threatens the couple with a knife. The woman points the knife at the husband and demands money from the wife, threatening to stab the husband if she does not hand over the money. Neither of the couple are afraid that force will be used against them but hand over money in order for the woman to leave them alone."], "st": "Which of the following best describes the liability of the woman?", "o": ["The woman cannot be liable for robbery because the couple did not fear that they would be subjected to force there and then.", "The woman cannot be liable for robbery because she did not use actual force on the couple in order to steal.", "The woman can be liable for robbery because the offence requires the use of a weapon in order to steal.", "The woman can be liable for robbery because she sought to put the couple in fear of being there and then subjected to force; it was irrelevant that they did not actually fear force.", "The woman cannot be liable for robbery because force was directed at the husband, but the property was stolen from the wife."], "a": "D", "bx": "The correct answer was D. This is because a person may be liable where they seek to put another person in fear of force,
