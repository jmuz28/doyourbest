o relevant cases and statutory provisions, and any procedural irregularities of which they are aware, and which are likely to have a material effect on the outcome of the proceedings. This is the position even if it would harm the position of the solicitor's client, and this is because of the overarching ethical requirement in the SRA Principles to act in a way that upholds the constitutional principle of the rules of law and the proper administration of justice. For this reason, answers (C), (D), and (E) are incorrect. (B) is incorrect because a solicitor is obligated to comply with their regulatory duties even if their supervisor disagrees."},{n:75,id:"DIS116",scenario:"A party serves notice that they propose to rely upon hearsay evidence at trial. At the hearing in accordance with the notice, they adduce evidence from a witness whose signed statement they have served, but who is not present in court and cannot therefore be cross-examined or confirm that the contents of their statement are true to the best of their knowledge and belief.",q:"Which of the following statements most accurately describe the approach that the court will take in determining the weight that they should apply to the hearsay evidence?",opts:["The court will consider the extent to which the witness's evidence is relevant to a key issue in the case.","If the court feels that it needs to hear from this witness, it will consider whether it is proportionate to adjourn the hearing to enable the witness to attend.","The court will consider whether the party adducing the evidence has acted in good faith.","The court will consider whether it would have been reasonable or practicable to force the witness to attend; whether the witness made the statement contemporaneously; and whether there was any motive to misrepresent or conceal facts.","The court will consider the conduct of the party adducing the evidence. Did they put the witness on notice of the hearing as soon as they knew or was there an unacceptable delay?"],ans:"D",expl:"(D) These are three of the points that the court will consider when determining the weight to apply. They will also consider whether the case involves 'multiple hearsay', whether the original statement was edited and whether there can be any suggestion that the events leading to the evidence being presented as hearsay evidence constitute an attempt to prevent proper evaluation as to its weight. (A) is incorrect because this is not a consideration for the court in determining the weight to attach. (B) is incorrect because the court will take no steps to adjourn the hearing of its own accord. (C) is incorrect because this is not a consideration for the court in determining the weight to attach. (E) is incorrect because this is not a consideration for the court in determining the weight to attach."},{n:76,id:"BSL191",scenario:"A company was incorporated 10 years ago. It has adopted the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association. It has an issued share capital of 100 ordinary £1 shares. One shareholder wants to sell his shares to another shareholder at full market price. The shareholder executes a stock transfer form and hands over his share certificate to the buyer. The buyer pays stamp duty and sends the stock transfer form and share certificate to the company.",q:"Which of the following best states the procedure for registering the transfer of shares?",opts:["The board does not have to register the transfer unless the transferee pays a registration fee to the company.","It is open to the board to refuse to register the transfer, as the model articles grant the board absolute discretion to refuse to register the transfer.","The board is required to register the transfer, as the transferee is an existing shareholder.","The board may refuse to register the transfer only if they do so for bona fide business reasons.","The board is required to register the transfer, as shareholders have a right to sell their shares."],ans:"B",expl:"(B) The Model Articles give the board absolute discretion to refuse to register a transfer of shares. The board would be limited only by their duty to act in the best interest of the company. Therefore, (E) is incorrect. (A) is incorrect as no fee can be charged for registering a transfer of shares under the Model Articles. (C) is wrong as there is no special rule for transfers to existing shareholders. (D) is incorrect because a bona fide business reason for a refusal to register is not needed. As indicated above, the only limitation on the board's discretion is their duty to act in the best interest of the company. So, a personal reason for not registering the transfer (such as they don't want to give the transferee shareholder more voting power because they think he votes recklessly) could be valid."},{n:77,id:"BSL224",scenario:"A company has just appointed a new executive director by ordinary resolution of the members.",q:"What must be filed at Companies House in respect of the director's appointment?",opts:["The service contract of the director within 14 days.","The ordinary resolution to appoint the director within 15 days.","The Appointment of Director form within 14 days.","The ordinary resolution to appoint the director within 14 days.","The Appointment of Director form within 15 days."],ans:"C",expl:"(C) Following the appointment of a director, the Appointment of Director form must be filed at Companies House within 14 days. (A) is incorrect as a director's service contract is not filed at Companies House, although a copy must be kept at the registered office. (B) and (D) are incorrect as an ordinary resolution to appoint a director is not filed at Companies House. (E) is incorrect as the deadline is 14 days, not 15 days."},{n:78,id:"LGS099",scenario:"A newly qualified solicitor decided to work freelance. The solicitor is not authorised by the Financial Conduct Authority to carry on a 'regulated activity' as defined in the Financial Services and Markets Act 2000 ('FSMA') and related secondary legislation.",q:"Which of the following activities would the solicitor be able to conduct in her business if no FSMA exclusion or exemption applies?",opts:["Advising a client on the merits of a mortgage contract.","Managing a client's portfolio of debentures.","Contracting for an insurance policy on behalf of a client.","Arranging for a client's sale of an investment property.","Safeguarding a client's pension scheme."],ans:"D",expl:"(D) Under the general prohibition of FSMA, a solicitor may not carry on regulated activity in the UK unless they are authorised or exempt from authorisation. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. The specified activities and investments might be remembered with the mnemonic device 'ADAMS F.M.DIPS'. Activities = Advising, Dealing as an agent, Arranging, Managing, and Safeguarding. The specified investments most relevant to a solicitor = Funeral plans, Mortgage contracts, Debentures, Insurance contracts, Pension schemes, and Shares in a company. The solicitor would be able to arrange for the sale of land for a client because while arranging is a specified activity, land is not a specified investment. (A) is incorrect because advising is a specified activity and a mortgage is a specified investment. (B) and (E) are incorrect because both clearly involve regulated activities (managing and safeguarding, respectively) and specified investments (debentures and pension schemes, respectively). (C) is incorrect because contracting on behalf of a client means the solicitor would be dealing as an agent, which is a regulated activity, and an insurance policy is a specified investment."},{n:79,id:"BSL160",scenario:"A partner in a nail salon business orders nail varnishes from a new supplier at a trade fair. The partner tells the supplier that they do not usually order stock but as the discount offered is so good, they are confident the other partners will be happy with the contract. When the nail polish is delivered, the other partners are horrified at the poor quality and colours of the varnish and refuse to accept the delivery.",q:"Will the nail polish supplier be successful in enforcing the contract against the nail salon?",opts:["Yes, because the partner had implied authority to bind the partnership.","Yes, because the partner had apparent authority to bind the partnership.","Yes, because the partner had actual authority to bind the partnership.","No, because the partner did not provide written authority to order stock.","No, because the nail polish supplier knew that the partner had no authority to order stock."],ans:"E",expl:"(E) Every partner is an agent of the partnership and has apparent authority to bind the partnership on contracts as apparently carrying out business of the kind usually carried on by the partnership unless the creditor knows the party has no authority. Here, the partner told the supplier they did not usually order stock and so the supplier is on notice that this partner has no authority. Therefore, (B) is incorrect. (A) is incorrect as implied authority is a type of actual authority that arises from a previous course of dealings among the partners - a partner who lacks actual authority, but who nevertheless has been allowed by the firm to exercise the authority that is lacking, will be held to have such [implied] actual authority. Here, nothing in the facts indicates that the partners have condoned this partner's purchase of varnishes before and so there is nothing on which to base a claim of implied authority. (C) is incorrect as the scenario tells us that this partner does not order stock and so has no actual authority. (D) is incorrect because it is irrelevant - written proof is not required for apparent authority."},{n:80,id:"BSL206",scenario:"A company runs three pizza restaurants and has four directors. A board meeting has been called to consider the acquisition of a fourth restaurant. The company has adopted the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association.",q:"In which of the following situations will the proposed acquisition be defeated?",opts:["All four directors attend the meeting. The chairman votes against the acquisition and the other three vote in favour.","Two directors attend the meeting but not the chairman. They both vote in favour of the acquisition.","All four directors attend the meeting. The chairman and one director vote against the acquisition and the two other directors vote in favour.","The chairman and one other director attend the meeting. The chairman votes in favour of the acquisition and the other director votes against it.","All four directors attend the meeting. The chairman and one other director vote in favour of the acquisition and the other two directors vote against it."],ans:"C",expl:"(C) The proposed acquisition will be defeated if all four directors attend and the chairman and one director vote against the acquisition. A board resolution is passed by simple majority vote, provided a quorum is present at the meeting. Under the Model Articles, a quorum is two directors. When there is a tie vote, the chairman has the casting vote - that is, the vote goes the way the chairman voted. If all four directors attended the meeting and two directors voted in favour of the acquisition and two voted against, there would be a tie. But in this scenario, the chairman voted against the acquisition, so it would be defeated. (A) is incorrect (that is, the proposed acquisition would not be defeated) because a majority (3:1) of the directors voted in favour of the acquisition - the chairman's casting vote only matters in the case of a tie. (B) is incorrect because the meeting had a quorum, and all the directors present approved the acquisition. (D) is incorrect because again, two directors constitute a quorum and the chairman's casting vote will come into play: there was a 1:1 tie and the chairman voted to approve the acquisition. Therefore, the acquisition was approved. (E) is basically the same situation - there was a tie and so the chairman's casting vote approving the transaction breaks the tie."},{n:81,id:"DIS017",scenario:"The defendant in a commercial breach of contract claim is ordered to pay the claimant's costs on the indemnity basis. One item of costs is related to the claimant attending two conferences with counsel to advise on liability and quantum in the claim. The defendant wishes to object on the basis that the solicitor should have been capable of giving this advice himself and, if not, only one conference with counsel was required.",q:"Which of the following best describes the test the judge will apply to determine whether the defendant should pay the costs of the conferences?",opts:["The cost is recoverable so long as the judge is satisfied it was reasonably incurred, with any doubt resolved in favour of the defendant.","The cost is recoverable so long as the judge is satisfied it was reasonably incurred and is reasonable in amount, with any doubt resolved in favour of the defendant.","The cost is recoverable so long as the judge is satisfied it was reasonably incurred and is reasonable in amount, with any doubt resolved in favour of the claimant.","The cost is recoverable so long as the judge is satisfied it is proportionate to the matters in issue in the case, with any doubt resolved in favour of the claimant.","The cost is recoverable so long as the judge is satisfied it is in the interests of justice to allow the cost."],ans:"C",expl:"(C) Choice (C) contains all of the criteria the court will consider when assessing costs on the indemnity basis: reasonably incurred, reasonable in amount, and doubts resolved in favour of the party receiving the costs (which under our facts is the claimant). (A) is incorrect because it is not enough that the cost was reasonably incurred; it must also be reasonable in amount. Additionally, doubts are resolved in favour of the receiving party under the indemnity basis; doubts are resolved in favour of the paying party (here the defendant) under the standard basis. (B) is incorrect for similar reasons (only one of the two criteria and doubt resolution incorrect). (D) is incorrect as proportionality is relevant on the standard, not the indemnity, basis. (E) is incorrect as it is too vague to be the basis for allowing or disallowing individual items, although the principle of the interests of justice generally underpins the assessment of costs."},{n:82,id:"TRT038",scenario:"A pedestrian saw a bus suddenly swerve and begin to hurtle toward him. The bus driver had momentarily lost control whilst attempting to light a cigarette. To avoid being hit, the pedestrian jumped off the road into a landowner's garden. He landed in a bed of prize-winning roses and damaged them extensively.",q:"Which of the following states the likely result in a claim by the landowner against the bus driver?",opts:["The bus driver is liable for trespass to land because his driving caused the pedestrian to enter the landowner's property and damage her roses.","The bus driver is not liable because he did not owe any duty of care to the landowner.","The bus driver is liable for negligence because he lost control of the bus, and this resulted in the damage to the landowner's property.","The bus driver is not liable because he did not foresee that his driving would cause the pedestrian to enter the landowner's property and damage her roses.","The bus driver is not liable because the pedestrian caused the damage to the landowner's roses by intentionally entering her property."],ans:"C",expl:"(C) The bus driver is liable to the landowner in a negligence action. The bus driver would owe a duty of care to the landowner. Driver to other road users is an established duty situation, and it is likely that this duty would also extend by analogy to the owners of property situated next to the road. (Alternatively, if this were viewed as a novel duty situation, the criteria applied in these cases would likely result in the imposition of a duty of care.) The bus driver is in breach of duty if he fell below the standard of care to be expected of a reasonable bus driver, which he did by lighting a cigarette whilst driving. The damage to the claimant's roses was caused by the bus driver's breach of duty. Although the pedestrian intentionally jumped into the garden, his instinctive action would not break the chain of causation between the driver's breach and the owner's damage. This is because it is an action which the defendant clearly ought to have foreseen as a very likely consequence of his negligence. (A) is incorrect because trespass to land requires an intentional interference with the claimant's possession of land, and the driver clearly did not have the necessary intention. (B) is incorrect because the bus driver did owe a duty of care to the landowner, as explained above. (D) is incorrect because, when assessing breach of duty, the standard of care is objective and impersonal. So, what matters is the risk a reasonable person would have foreseen, not the defendant's own perception of the risk he created. (E) is incorrect because, although the pedestrian's action was intentional, it would not break the chain of causation between the driver's negligence and the owner's damage, as explained above."},{n:83,id:"ELS014",scenario:"Counsel wishes to convince the panel of judges in the Court of Appeal to depart from precedent by referring to persuasive material from previous case law.",q:"Which of the following is not an example of persuasive precedent?",opts:["A dissenting judgment from a previous case on materially similar facts.","Hypothetical examples given in previous case law where, had the facts been different, a different ratio decidendi might have been found.","A majority judgment from a previous case on similar material facts.","An academic article written by a field-leading expert referred to in a previous judgment.","A precedent followed by a court in a foreign, commonwealth country such as New Zealand, that is referred to in a previous judgment."],ans:"C",expl:"(C) is correct because this is the ratio decidendi and is binding. The remaining answers are persuasive because they have been mentioned in previous case law as an aside to the ratio and are not binding. Sometimes judges will provide hypothetical examples where the facts differ slightly from those before them in order to explain how they have reached their decision. They may also consider academic articles and the decisions of foreign courts that have explored similar areas of law for inspiration in helping them to reach a decision."},{n:84,id:"CNL152",scenario:`During a debate in the House of Commons, a Member of Parliament ('MP') has accused a family of being "neighbours from hell" for those that live in their community, and responsible for an increase in crime in their local area. The family are upset with these claims because they are untrue and wish to sue the MP.`,q:"Which one of the following best explains the legal position?",opts:["The suit against the MP will be successful because the MP has made a defamatory statement.","The suit against the MP will be successful because the MP's statement violates the sub judicie rule.","The suit against the MP will not be successful because the MP's statement violates the sub judicie rule.","The suit against the MP will not be successful, because statements made during the course of debates cannot be challenged before the courts.","The suit against the MP will be successful and the court can order the MP to apologise to the family in the House of Commons."],ans:"D",expl:"(D) The suit will not be successful because statements made during proceedings of Parliament cannot be challenged in the courts. Statements made in Parliament are protected by parliamentary privilege, which guarantees the freedom of speech during parliamentary proceedings. (A) and (E) are incorrect because the MP is protected from suit under parliamentary privilege. (B) and (C) are incorrect because the sub judicie rule, which requires that MPs and Members of the House of Lords not refer to pending cases during debates, is irrelevant on these facts."},{n:85,id:"CTR015",scenario:"A photography buff wrote a letter to his friend offering to sell him his camera, which the friend had admired, for £1,500. The day after the friend received the letter, he posted a letter back in response to the photography buff agreeing to purchase the camera for £1,500. After posting the letter, the friend was describing the camera to a colleague who was very knowledgeable about photographic equipment, and learned that the camera was worth no more than £1,200. The friend immediately telephoned the photography buff and told him that he had no interest in buying the camera. The photography buff received the friend's letter agreeing to purchase the camera a day after receiving the phone call. The photography buff insists his friend is bound by the contract.",q:"If the photography buff brings a court action against his friend for breach of contract, and the friend defends on the grounds that no contract was formed, how should the court rule?",opts:["For the friend, because the description of the subject matter of the contract was too indefinite to be enforced.","For the friend, because the photography buff received the telephone call before he received the letter.","For the photography buff, because his friend's letter accepting the offer was effective when posted.","For the photography buff, because his friend's attempted rejection of the offer was oral.","For the friend, because the letter from the photography buff was merely an invitation to treat, giving the friend the opportunity to make an offer for the camera."],ans:"C",expl:"(C) A contract was formed because the friend's acceptance was effective on dispatch. Under the postal rule, acceptance by post creates a contract at the moment of posting, properly addressed and stamped, unless the offer stipulates that acceptance is not effective until received. Here, the friend dispatched first an acceptance and then a rejection of the photography buff's offer. The postal rule applies because the photography buff's offer did not specify that acceptance was not effective until receipt. Because the friend dispatched his acceptance before he called with his rejection, the postal rule applies. Thus, the friend's acceptance was effective, thereby creating a contract at the moment it was mailed, and his attempted rejection was ineffective. (A) is incorrect because the letter from the photography buff indicates that the subject matter of the contract was his camera that the friend had admired for some time. This description appears on its face to be sufficiently definite that a court would be able to determine with reasonable accuracy which camera is subject to the photography buff's offer to sell. (B) is incorrect because once the acceptance was effective, the fact that the photography buff received the rejection by telephone before he received the acceptance letter has no effect on the formation of the contract. (D) is incorrect because there is no requirement that a rejection of an offer to enter into such a contract must be in writing. (E) is incorrect as there is no suggestion that the initial letter was merely an invitation to treat. An invitation to treat is an expression of willingness to negotiate, whereas the letter from the photography buff was definite and clear enough to be an offer, and also does not fall into one of the categories of usual invitations to treat, for example, adverts, displays in shop windows or on shop shelves, and tenders."},{n:86,id:"DIS109",scenario:"A claimant brings a negligence action against a sole trader for injuries the claimant sustained within the sole trader's store. Negotiations and alternative dispute resolution did not yield a settlement or resolution to the case. The defendant then made an application to strike out, arguing there was no case to answer. The court rejected the application, finding that the claimant had made a prima facie case for recovery. The case is now about to go to trial.",q:"Which of the following best describes the burden of proof in this case?",opts:["The claimant must prove their claim is at least as likely as not.","The claimant must prove their claim beyond reasonable doubt.","The claimant must prove their claim on the balance of probabilities.","The defendant must prove that they are not liable on the balance of probabilities.","The defendant must prove that they are not liable beyond a reasonable doubt."],ans:"C",expl:"(C) The claimant must prove their claim on the balance of probabilities; that is, that their version of the facts is at least slightly more likely than not. (A) is incorrect because at least as likely as not would be 50-50. That's not quite enough in a civil case. As just indicated, the claimant must prove that their version of the facts is at least slightly more believable than the defendant's. (B) is incorrect because 'beyond a reasonable doubt' is the standard of proof required in the criminal court. (D) and (E) are incorrect because the defendant does not bear the burden of disproving the claimant's case. The fact that the court refused to grant an application for a motion to strike does nothing to change this. (E) is further incorrect because it states the wrong burden - 'beyond a reasonable doubt' is the criminal standard."},{n:87,id:"CTR106",scenario:"A clothes shop owner contracted with a builder for the construction of a suite of new dressing rooms in the back of the shop. In past contracts, the builder had required that shops be closed during such construction but, because the shop didn't want to lose revenue during the construction, the builder agreed to construct the dressing rooms whilst the shop was open if the shop owner agreed to a contract clause excluding the builder's liability in negligence for any personal injuries that might occur during construction. The parties signed an agreement containing the exclusion. During construction, a wall of the new dressing room collapsed due to the negligence of the builder severely injuring the shop owner.",q:"Can the shop owner recover for the builder's negligence?",opts:["Yes. Under the Consumer Rights Act 2015, any clause that seeks to exclude liability for death or personal injury due to negligence will be void.","Yes. Under the Unfair Contract Terms Act 1977, any clause that seeks to exclude liability for death or personal injury due to negligence will be void.","No. Parties are always free to exclude liability for injury caused by negligence under the terms of a contract.","No. The exclusion clause will be deemed fair and reasonable because it was added because of special circumstances.","No. Exclusion clauses are not regulated in business-to-business contracts."],ans:"B",expl:"(B) Under the Unfair Contract Terms Act 1977 ('UCTA') (which deals with business-to-business transactions), any clause which purports to exclude liability for death or personal injury as a result of negligence will be void. (A) is incorrect because the Consumer Rights Act 2015 deals solely with contracts between businesses and consumers. Both the clothes shop owner and the builder are acting in the course of business, so the UCTA is the relevant legislation in this case. (C) is incorrect, as under the UCTA it is not possible to exclude liability for death or personal injury due to negligence. (D) is incorrect because there is no exception to the rule in the UCTA just because one of the parties doesn't want to lose revenue. The fair and reasonable standard applies to exclusions of liability for negligence causing damage to property, not personal injury or death. (E) is incorrect because, as stated above, the UCTA regulates exclusion clauses in business-to-business contracts."},{n:88,id:"DIS131",scenario:"A solicitor is representing a client in a personal injury claim. One of the issues relates to the extent to which the claimant's broken bones will heal. The court has allowed each party to hire their own expert on the matter. The solicitor for the claimant hires an orthopaedic expert to examine the claimant's medical record and give an opinion.",q:"Which of the following is true regarding the report the solicitor receives from the orthopaedic expert?",opts:["The expert's report must be disclosed to the defendant if the claimant intends to rely on it, but its contents remain privileged.","The expert's report must be disclosed to the defendant if the claimant intends to rely on it, but it is not privileged in any event as hiring the expert was authorized by the court.","The expert's report must be disclosed to the defendant if the claimant intends to rely on it and it will lose its privilege.","The expert's report must be disclosed to the defendant even if the claimant does not intend to rely on it, but its contents are privileged.","The expert's report need not be disclosed to the defendant as the contents of an own expert's reports are privileged regardless of whether the party relies on it."],ans:"C",expl:"(C) The expert's report must be disclosed to the defendant if the claimant intends to rely on it and it will lose its privilege. When a court authorizes the parties to hire their own experts, the expert's report does not have to be disclosed unless the party intends to rely on it. Such reports are privileged and are not subject to inspection by the party's opponent. However, if the party does intend to rely on the report, it must be disclosed and it loses its privilege and is subject to inspection. It follows that the other answer choices are incorrect."},{n:89,id:"DIS253",scenario:"A defendant has failed to file an acknowledgment of service to a claim within 14 days of service of the Particulars of Claim, and the claimant has now entered judgment. The defendant intended to dispute the claim and it was only through administrative oversight that they failed to file a defence in time. They make an application to set aside the default judgment.",q:"Which of the following best describes the factors that the court will take into account in determining whether to grant the defendant's application?",opts:["Only whether the defendant had a good reason for the failure to file in time.","Whether the defendant had a good reason for the failure to file in time and whether the claimant will be prejudiced by setting aside the default.","Only whether setting aside the default judgment is in the interests of justice.","Only whether setting aside the default judgment will fetter the court's ability to ensure that they can manage the case justly, fairly, and expeditiously.","Whether the defendant has a real prospect of successfully defending the claim and there is some other good reason why the judgment should be set aside."],ans:"E",expl:"(E) The defendant must establish that there is a reasonable prospect that they are going to be successful and good reason why the court should set aside the judgment to allow them to defend. (A) is incorrect because, whilst the defendant will need to show a good reason for the failure, they will also need to show that they have a real prospect of successfully defending. (B), (C), and (D) present things a court might consider, but they are not among the two basic things a defendant must show."},{n:90,id:"DIS037",scenario:"A luxury hotel secures a judgment for £300,000 against one of their former directors. The hotel has heard from a reliable source that the director is in the process of converting all of his assets into cash to move to another country, where he owns a second home.",q:"What should the hotel do to ensure it can enforce its judgment?",opts:["They should apply for an order for oral examination.","They should issue a statutory demand in respect of the debt.","They should apply for a freezing injunction.","They should apply for a charging order against any land owned by the director.","They should apply for a third-party debt order against the director's bank in respect of the cash."],ans:"C",expl:"(C) The hotel should apply for a freezing injunction. A freezing injunction is a prohibitory injunction that prevents a person from disposing of the frozen assets. They are granted when the party applying for the injunction can show that the person to be enjoined may dispose of assets the applicant has a right to. Here, the hotel has a £300,000 judgment against the director and it has credible evidence that the director is about to dispose of all of his assets and move outside of the country. If that happens, the hotel would not be able to seize any of the director's assets, thus defeating the judgment. (A) and (B) are incorrect because they will both put the director on notice that the hotel is seeking to enforce judgment and give him more time to dispose of his assets. (D) is incorrect because it, too, would put the director on notice, giving him time to carry out his scheme. Also, nothing in the facts indicates the director has any land. (E) would also put the director on notice. Additionally, even if the hotel knows the director's past banking details (as an ex-director), given the director's plan, it seems likely he would be hiding money in other bank accounts of which the hotel is unaware. It is also pointless without knowing what cash balance, if any, the director has in his accounts and this bank."}],dr=[...Q1,...X1,...Z1,...J1],eT=["A","B","C","D","E"],tT={CNL:"Constitutional & Administrative Law",DIS:"Dispute Resolution",ELS:"Legal System of England & Wales",TRT:"Tort",LGS:"Legal Services",ETH:"Ethics & Professional Conduct",BSL:"Business Law",CTR:
