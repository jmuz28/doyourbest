x?-1:a.x>l.x?1:a.y<l.y?-1:a.y>l.y?1:0),G1(i)}function G1(r){if(r.length<=1)return r.slice();const i=[];for(let l=0;l<r.length;l++){const u=r[l];for(;i.length>=2;){const d=i[i.length-1],h=i[i.length-2];if((d.x-h.x)*(u.y-h.y)>=(d.y-h.y)*(u.x-h.x))i.pop();else break}i.push(u)}i.pop();const a=[];for(let l=r.length-1;l>=0;l--){const u=r[l];for(;a.length>=2;){const d=a[a.length-1],h=a[a.length-2];if((d.x-h.x)*(u.y-h.y)>=(d.y-h.y)*(u.x-h.x))a.pop();else break}a.push(u)}return a.pop(),i.length===1&&a.length===1&&i[0].x===a[0].x&&i[0].y===a[0].y?i:i.concat(a)}var K1=bg,kg=wg;const Y1=T.forwardRef(({className:r,sideOffset:i=4,...a},l)=>k.jsx(K1,{children:k.jsx(kg,{ref:l,sideOffset:i,className:ge("z-50 overflow-hidden rounded-md bg-popover px-3 py-1.5 text-xs text-popover-foreground animate-fade-in",r),...a})}));Y1.displayName=kg.displayName;const Q1=[{n:1,id:"CNL141",scenario:"The Supreme Court hears a case concerning an Act of Parliament. The appellant argues that the Act violates the right to property under Protocol 1, Article 1 of the European Convention on Human Rights ('ECHR'). The Supreme Court makes a declaration of incompatibility. The appellant then asks the court to rule in his favour pursuant to the declaration, contending that the Act is now invalid.",q:"Which of the following best explains the effect of the declaration?",opts:["The legislation is now invalid and no longer law.","The Supreme Court can amend the legislation to remove the incompatibility.","The European Court of Human Rights must decide whether to strike down the legislation.","The legislation is still valid law, and applies to the parties to the case in which the declaration of incompatibility was made.","The legislation is still valid law, but does not apply to the case in which the declaration of incompatibility was made."],ans:"D",expl:"(D) The legislation is still valid law and applies to the parties in this case. Under the Human Rights Act 1998, a declaration of incompatibility does not change the status of the legislation in question and still applies to parties in the case in which the declaration was made. Therefore, (A) and (E) are incorrect. (B) is incorrect because the Supreme Court cannot do any more than make a declaration; it has no power to amend an Act of Parliament. (C) is incorrect because the European Court of Human Rights has no power to strike down legislation."},{n:2,id:"CNL162",scenario:"In 2011, the Northern Ireland Assembly enacted an Act that did not comply with an EU regulation, which was passed in 1990. The Act and the EU regulation concerned agriculture, which is within the Northern Ireland Assembly's legislative competence. The Supreme Court held the Act invalid but it was not removed from statute.",q:"Which of the following best explains the current legal position?",opts:["The Act is now valid.","The Supreme Court can decide whether the Act is now valid.","The Northern Ireland Assembly is barred from passing similar legislation to the Act.","The Northern Ireland Assembly can pass similar legislation to the Act and it would be valid.","The Northern Ireland Assembly can pass similar legislation to the Act only if permission is granted by the UK Parliament."],ans:"D",expl:"(D) The Northern Ireland Assembly can now pass similar legislation to the Act. Before the end of the transition period (in December 2020), if the devolved legislatures legislated contrary to EU law, the legislation would be invalid. The UK's exit from the EU does not revive such legislation. However, the devolved legislatures can now amend or repeal retained EU law falling within their legislative competence (which would include the EU regulation). Thus, the Northern Ireland Assembly can now legislate contrary to the EU regulation by passing similar legislation to the Act. (A) is incorrect because, for the reasons discussed, the Act is invalid. (B) is incorrect because the Supreme Court has no such authority and, in any case, the Act remains invalid. (C) is incorrect because the devolved legislatures can now legislate contrary to retained EU law. (E) is incorrect because the devolved legislatures do not need the UK Parliament's permission to legislate contrary to retained EU law."},{n:3,id:"DIS138",scenario:"A man issues a negligence claim against his former solicitor when attempts at alternative dispute resolution fail. The claim alleges that the solicitor failed to adequately research the law involved in a claim the man had made against his former employer and that the man should have been able to recover £15,000 more than he did. The solicitor believes the claimant is seeking too much money and is keen to make a Part 36 offer to limit the costs he might have to pay.",q:"What is the shortest period the defendant may give the claimant to accept the offer for it to take effect as a Part 36 offer?",opts:["30 days.","28 days.","21 days.","14 days.","7 days."],ans:"C",expl:"(C) A Part 36 offer must stay open for a minimum of 21 days. The time in which the offer may be accepted is called the relevant period."},{n:4,id:"DIS022",scenario:"A solicitor recommends to their client that alternative dispute resolution may assist in settling the case without litigation. The client is particularly interested in mediation and arbitration. The client asks the solicitor to explain the difference between the two.",q:"Which of the following is correct?",opts:["Mediation is voluntary, but arbitration is mandatory as it is a contractual process.","A mediator will be an expert in the law surrounding the dispute, but an arbitrator is not required to have such expertise.","Mediation takes place in private but arbitration sessions are open to the public like court cases.","In mediation the parties are free to agree the rules of evidence but arbitration must follow the same evidentiary rules as a court.","The mediator cannot impose a solution on the parties, but an arbitrator can and does."],ans:"E",expl:"(E) Although mediation and arbitration both involve resolving disputes with the help of a neutral third party, in mediation, the mediator does not impose a solution, but rather helps the parties find their own solution; whilst in arbitration, the arbitrator does resolve the dispute. (A) is incorrect because all alternative dispute resolution ('ADR') is considered voluntary. While it is true that arbitration is mandatory if the parties include it in a contract, parties who are not in a contractual relationship or whose contract does not include an arbitration clause can choose to seek arbitration too. (B) is incorrect as neither a mediator nor an arbitrator is required to have legal expertise. (C) is incorrect as both mediation and arbitration take place in private. (D) is correct insofar as it is true the parties agree evidence rules in mediation, but it is incorrect that court evidentiary rules apply in arbitration."},{n:5,id:"ELS003",scenario:"A statute made it an offence to obstruct a member of the armed forces 'in the vicinity' of Buckingham Palace. A man inside (rather than 'in the vicinity' of) Buckingham Palace obstructed a member of the armed forces as part of a protest. At trial, the court found the man's actions to be guilty of the offence.",q:"On which of the following rules of interpretation was the court most likely relying?",opts:["The golden rule.","The literal rule.","The mischief rule.","The purposive approach.","The ejusdem generis doctrine."],ans:"A",expl:"(A) Occasionally, applying ordinary meanings to words under the literal rule can lead to absurd results. When that happens, under the golden rule, courts may use something other than a word's ordinary meaning to avoid the absurd result. (B) is incorrect as under the literal rule, when interpreting statutes, courts will give words their ordinary meaning. In other words, the court will apply the dictionary meaning to the words to resolve any ambiguity. Here, using a dictionary definition would lead to an absurd result; a person in the vicinity of a place could be punished but a person actually in the place could not be. (C) and (D) both work in a similar fashion, but would not be applied in this situation as the golden rule would be the first route taken when the literal rule fails. (E) is incorrect because this doctrine is a rule of language interpretation providing that when a general word follows more specific words, the court should give the general word a similar meaning as the specific words."},{n:6,id:"TRT118",scenario:"A company owns land next to the claimant's garden. It has left the land derelict and a pernicious weed not native to the area has become established there. The company was aware of the presence of the weed and knew that the weed spreads rapidly and its roots cause damage. However, it did not take any action to remove or control the weed even though it could have done so early on without significant expense. The weed has now spread into the claimant's garden and is preventing her from developing her garden as she wishes.",q:"In an action by the claimant against the company for damages, which of the following statements is correct?",opts:["The claimant is not likely to have a successful claim based on private nuisance because the weed infestation was an act of nature for which the company cannot be held responsible.","The claimant is likely to have a successful claim based on private nuisance because the company failed to take reasonable steps to prevent the spread of the weed.","The claimant is likely to have a successful claim based on trespass to land because the weed has spread physically into the claimant's garden.","The claimant is likely to have a successful claim based on the rule in Rylands v Fletcher because the weed was not native to the land in that area and escaped into the claimant's garden.","The claimant is likely to have a successful claim in private nuisance because the company was obliged to take whatever steps were necessary to stop the weed spreading once it became aware of the threat, regardless of cost."],ans:"B",expl:"(B) The claimant is likely to have a successful claim. The encroachment of the weed is causing a substantial interference with the claimant's use of his land. The company did not create the nuisance; it has arisen by an act of nature. However, the company is still liable for the nuisance arising on its land if it knows or ought to know about it and fails to take reasonable steps to deal with it. (In these circumstances the company is said to 'continue' the nuisance.) On the facts, the company did know about the weed and the nature of the risk it posed, and the company failed to take reasonable steps to prevent the spread of the weed even though it could have. So, the claimant is likely to have a successful claim in private nuisance provided he can show that the company continued the nuisance by failing to take reasonable steps to prevent the spread of the weed. (A) is not correct. The company can be held responsible for a nuisance created by an act of nature, as explained above. (C) is not correct. Trespass to land deals with intentional and direct interference with the claimant's possession of land. In contrast, the tort of nuisance covers damage which is indirect, such as the harm that occurred here. (D) is not correct. Liability under the rule in Rylands v Fletcher requires showing that: (1) the defendant brought onto his land something likely to cause harm if it escapes; (2) the defendant was engaged in a non-natural use of the land; and (3) the thing gathered on the land did escape and caused damage. To establish the second element, the defendant must be engaged in a special use of the land which carries an increased risk of danger to others. Here, the company was not engaged in a non-natural use of the land; in fact, it was not using the land at all. Thus, the company is not liable under the rule in Rylands v Fletcher. (E) is not correct. The company did not create the nuisance so its liability rests on having failed to take reasonable steps to deal with it, as explained above. The company is only obliged to do what is reasonable, not to remove the nuisance whatever the cost."},{n:7,id:"LGS095",scenario:`A solicitor is instructed by a client to act in relation to the sale of some of the shares in the client's company to a competitor. The competitor intends to buy 75% of the issued share capital in the company from the client for £800,000. The solicitor advises the client on the sale, including preparing the relevant contract and stock transfer forms. Neither the solicitor nor her firm is authorised by the Financial Conduct Authority to carry on a "regulated activity" as defined in the Financial Services and Markets Act 2000 and related secondary legislation.`,q:"Has the solicitor breached the general prohibition against carrying on a regulated activity?",opts:["No, because the solicitor may rely on the takeover exclusion.","No, because the exemption for Designated Professional Bodies applies.","No, because the transaction involves the sale of shares in a private company.","Yes, because no exclusion applies.","Yes, because the solicitor is not authorised by the Financial Conduct Authority."],ans:"A",expl:"(A) The solicitor has not breached the general prohibition against carrying on a regulated activity because she may rely on the takeover exclusion. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. Under the takeover exclusion, a solicitor can deal as an agent, arrange, or advise with respect to a client who is buying or selling 50% or more of the voting shares of a company. Here, the solicitor is advising (a specified activity) in relation to shares (a specified investment). However, the advice is in relation to a competitor buying 75% of the shares in the client's company. Thus, the takeover exclusion applies and the solicitor is not carrying out a regulated activity. (B) is incorrect because, as explained above, there is no regulated activity so the solicitor has no need to rely on the Designated Professional Bodies exemption. (C) is incorrect because shares in private companies are still specified investments which may result in a regulated activity. (D) is incorrect because, as explained above, the takeover exclusion is available. (E) is incorrect because the solicitor is not carrying out a regulated activity and therefore does not need to be authorised."},{n:8,id:"TRT143",scenario:"A man was a spectator at a motor race. He was standing next to the track behind a safety barrier. Suddenly, two cars collided just in front of him. The vehicles crashed through the safety barrier and both drivers were killed. The man was able to jump out of the way of the cars at the last second and was not physically injured. However, he has now begun to suffer from post-traumatic stress disorder ('PTSD'). Evidence shows that the crash was caused by the negligence of the race organisers.",q:"In an action by the man against the race organisers to recover damages for his PTSD, which of the following best states the likely outcome?",opts:["The man is not likely to be successful because he was not physically injured himself.","The man is likely to be successful because he witnessed the events with his own unaided senses.","The man is not likely to be successful because psychiatric harm of the kind he suffered is never recoverable in the tort of negligence.","The man is likely to be successful because he was in the immediate area of danger.","The man is not likely to be successful because he did not know personally either of the drivers who were killed."],ans:"D",expl:"(D) The man will likely have a successful claim based on negligence. The first element of his claim is to show that a duty of care was owed to him. He has suffered psychiatric harm without physical impact, so the rules for duty of care depend on whether he is a primary or secondary victim. Given that he was in the actual area of danger, he is a primary victim. A duty of care is owed to a primary victim provided there was a foreseeable risk of physical injury to them. The psychiatric harm must also be a medically recognised psychiatric condition, which is satisfied on the facts. Therefore, the man was owed a duty of care. The facts show that the duty was breached and that this breach caused the injury. So, the claim is likely to be successful. (A) is not correct. A duty of care can be owed in respect of psychiatric harm caused without physical impact, as explained above. (B) is not correct because it does not state the correct reason why the man is likely to be successful. If the man had not been in the area of danger, he would have been a secondary victim, and it would have been relevant that he witnessed the events with his own unaided senses - but this requirement does not apply here. (C) is not correct because the statement is too broad. It is true that in some circumstances no duty of care is owed in respect of psychiatric harm caused without physical impact. However, it is not correct to say that it is never recoverable. (E) is not correct. The man is likely to be successful for the reasons discussed above. If the man had not been in the area of danger, he would have been a secondary victim, and it would have been relevant that he did not have any ties of love and affection with the immediate victims, but this requirement does not apply to primary victims."},{n:9,id:"ETH090",scenario:"An accountant has referred their client to a solicitor for legal advice on a company tax matter. The solicitor and the accountant agreed in writing that the solicitor would bill the client for the solicitor's part of the work. When the solicitor receives the money from the client, the solicitor will pay 25% of the fees to the accountant for making the introduction. The solicitor has sent the client an email informing them of the arrangement.",q:"Do the rules of professional conduct allow this arrangement between the solicitor and the accountant?",opts:["No, because the client has not given consent in writing to the fee sharing arrangement.","No, because fee sharing arrangements are prohibited.","Yes, because all requirements for the fee sharing arrangement have been met.","No, because fee sharing arrangements are only allowed in matters relating to personal injury or death, or where the client is the subject of criminal proceedings.","No, because a solicitor is only permitted to enter into fee sharing arrangements with other lawyers, and the accountant is not a lawyer."],ans:"C",expl:"(C) The SRA Codes of Conduct provide that all fee sharing agreements with a third party must be in writing. Additionally, the client must be informed of any fee sharing arrangement that is relevant to their matter. The arrangement between the solicitor and the accountant meets these requirements. (A) is incorrect because written consent from the client is not required; it is sufficient to inform the client of the fee sharing arrangement. (B) is incorrect because fee sharing arrangements are generally permitted. (D) is a completely incorrect statement. There are restrictions on payments for referrals in matters involving personal injury and wrongful death, and where the client is subject to criminal proceedings. Fee sharing arrangements and payments for referrals are generally permitted in other types of matters, such as the tax matter here. (E) is incorrect because a solicitor can enter into a fee sharing arrangement with any third party, not just with other lawyers."},{n:10,id:"TRT067",scenario:"A company employs staff to work with dangerously corrosive chemicals. It provides safety gloves to protect against burns from the chemicals. The gloves wear out after about six months in use. Staff are responsible for checking their own gloves, with no independent supervision, but replacements are freely available on request. Recently a junior staff member suffered chemical burns because his gloves had worn out and allowed the corrosive chemicals to come into contact with his skin.",q:"In a claim by the staff member against the company to recover damages for his injuries, which of the following best describes the position of the company?",opts:["The company is not in breach of its duty to the staff member because he could have obtained replacement gloves had he chosen to do so.","The company appears to be in breach of its duty to the staff member but should be able to rely on the staff member's contributory negligence as a complete defence to his claim.","The company is not in breach of its duty to the staff member because it has provided safe equipment by making the safety gloves available.","The company appears to be in breach of its duty to the staff member because the company should have implemented a system for checking staff safety gloves for wear and issuing replacements.","The company may have omitted to check the condition of staff safety gloves, but no duty of care is owed in respect of an omission to act."],ans:"D",expl:"(D) The company appears to be in breach of its duty. The company, as the staff member's employer, owes him a duty of care in the tort of negligence. Here, relevant aspects of such duty relate to the provision of safe equipment and a safe system of work. The company may have taken reasonable care to provide safe equipment, but it has not ensured that the gloves are checked and replaced, so it appears not to have taken reasonable care to establish a safe system of work. Therefore, it appears to be in breach of duty. (A) is not correct. An employer has a duty to take reasonable care to establish a safe system of work. Just making replacement gloves available to staff is not likely to satisfy this, as stated above. (B) is not correct. On the facts, it appears that the staff member may have failed to take reasonable care for his own safety, which contributed to his injury. So, the company can rely on the defence of contributory negligence. However, this is not a complete defence. It is a partial defence, which allows the staff member's damages to be reduced to reflect his share in responsibility for the damage. (C) is not correct. Whilst it is correct to say that the company has provided safe equipment by making the safety gloves available, the duty owed to the staff member also covers a safe system of work. It is likely that the company has not taken reasonable care to establish a safe system of work, and so is in breach of its duty to the staff member, as explained above. (E) is not correct. Although the general rule in the tort of negligence is that no duty of care arises in relation to an omission to act (subject to exceptions), the duty owed by an employer to employees is a positive duty: to take reasonable care for the safety of employees. One aspect of such duty is taking positive action to establish a safe system of work."},{n:11,id:"DIS070",scenario:"A solicitor represents a company in a breach of contract action against one of its suppliers. After attempting to settle the case, the solicitor initiates a claim in the High Court against the supplier. A trial is held, and the company loses the case. The company believes the judge made some serious procedural errors and would like to appeal.",q:"Which of the following courts would have jurisdiction to consider the appeal?",opts:["The Supreme Court.","The Court of Appeal.","Another judge in the High Court.","Either the Supreme Court or the Court of Appeal, depending on the amount of the appeal.","Either the Court of Appeal or another High Court Judge, depending on the amount of the appeal."],ans:"B",expl:"(B) An appeal of a High Court Judge's decision would be to the Court of Appeal. All of the other answers are incorrect. (A) is incorrect as the Supreme Court generally hears civil appeals from the Court of Appeal. (C) is incorrect as there is no appeal from one High Court Judge to another High Court Judge. There is no amount requirement for appeals from this level, so (D) and (E) are incorrect."},{n:12,id:"DIS090",scenario:"A woman hired a solicitor to issue a nuisance claim against her neighbour, alleging the neighbour repeatedly played music so loud that the woman could no longer enjoy her garden. The solicitor attempted to settle the dispute amicably, but the parties refused. As the claim was for only £2,000, had taken up a lot of the solicitor's time, and was of very questionable merit, the solicitor pushed the matter aside until the woman called to ask how the claim was progressing. The solicitor then discovered the limitation period had expired. The solicitor informed the woman that the limitation period had expired. In response, the woman instructed a different solicitor to issue proceedings against her former solicitor for negligence. The claim specifically alleges that (i) the defendant was negligent in missing the limitation period, (ii) but for the negligence, the woman would have won her case, and (iii) her losses are £25,000 damages exclusive of interest and costs. The woman's former solicitor hires you to defend the claim. The former solicitor admits to you that they forgot about the limitation period but is adamant that the nuisance claim was speculative and highly unlikely to succeed.",q:"Which of the following best describes how you should draft the defence?",opts:["You should issue a blanket denial of the woman's case.","You should specifically deny each of the three allegations listed in the facts.","You should admit liability for negligence, but deny the allegations of causation and damages.","You should admit liability for negligence, neither admit nor deny causation, and deny the allegation of damages.","You should indicate that you neither admit nor deny each of the three allegations and leave it for the claimant to prove her case."],ans:"D",expl:"(D) You should admit liability for negligence, neither admit nor deny causation, and deny the allegation of damages. A defendant may defend a claim by asserting a procedural defence (such as lack of jurisdiction or expiration of the limitation period), negating one of the elements of the cause of action, or disputing the damages. In any case, the defence must be truthful - they must admit allegations that are true, but may deny allegations they believe are false, and say that they neither admit nor deny (that is, issue a non-admission regarding) allegations that are not within their personal knowledge. Here, the defendant has admitted that they were negligent in missing the deadline. Therefore, there is no choice but to admit that in the defence. However, as the defendant believes causation is speculative (that is, they think the former client's claim was unlikely to succeed in any case), it is not advisable to deny this allegation as it is a hypothetical fact and the defendant cannot therefore categorically say that it is incorrect. On the other hand, the defendant can deny the allegation that the claimant suffered £25,000 damages exclusive of interest and costs, as the original claim was for only £2,000. (A) is incorrect because it is never appropriate to issue a blanket denial - allegations must be admitted or denied individually. (B) is incorrect because, as just explained, the allegation regarding negligence and causation cannot properly be denied. Similarly, (C) is incorrect because it states that the allegation of causation should be denied. (E) is incorrect because, as explained above, a defendant can use a non-admission (that is, neither admit nor deny) only when the allegation goes to a matter not within the defendant's knowledge. The defendant knows that they were negligent, so at the very least, that must be admitted."},{n:13,id:"TRT080",scenario:"A young man aged 20 was killed instantly in an accident caused by the negligence of the defendant. Because he died instantly, he suffered no pain. There was no damage to any of his property and he suffered no loss of earnings. He was unmarried and left no dependants but was survived by his parents.",q:"If an action in tort is brought against the defendant in respect of the accident which killed the young man, which of the following best states the likely outcome?",opts:["There can be no successful claim because the man has not suffered any actionable damage.","There can be a successful claim by the man's estate for his lost future earnings because, by statute, a claimant's existing cause of action survives.","There can be a successful claim by the man's parents for bereavement damages.","There can be no successful claim for bereavement damages, but there can be a successful claim by the man's parents to recover damages for his earnings in the lost years after his death.","There can be no successful claim because claims in tort do not survive the death of one of the parties."],ans:"A",expl:"(A) Given that the man was killed instantly with no pain, no damage to property, and no loss of earnings, he has not suffered any actionable damage. There is no claim in respect of the death itself. So, although an existing cause of action does survive death for the benefit of the claimant's estate, on these facts there is no existing claim to survive. (B) is not correct. As stated above, there is no existing cause of action to survive the man's death. In addition, where a claim does survive, no damages are recoverable for loss of earnings in the period after death. (C) is not correct. Bereavement damages are only open to a parent where the deceased was a minor (and unmarried). The deceased here was 20, so not a minor. (D) is not correct. It is true that there can be no successful claim for bereavement damages. However, it is not correct that the parents could recover damages for the man's earnings in the years after his death. There can be no claim for these lost earnings because the man's parents were not financially dependent on him. (E) is not correct. It is not correct that claims in tort do not survive the death of the parties. Had the man had a valid claim for damages, it would have survived his death, as discussed above."},{n:14,id:"BSL059",scenario:"Three friends set up a company to operate a wool processing business. One of the three previously worked at a different wool processing business that failed. Because the wool industry is small and tightly knit, the friends decide that it would be best if the friend from the failed business did not personally serve on the company's board of directors. Instead, the two not associated with the failed business would serve as directors along with a third person nominated by the shareholder who worked at the failed business. The nominated director would be required to act as the shareholder from the failed business.",q:"What is the name given to the shareholder from the failed business in the above scenario?",opts:["A de jure director.","A shadow director.","An executive director.","An alternate director.","A de facto director."],ans:"B",expl:"(B) According to the Companies Act 2006, a shadow director is the name given to a person with whose directions or instructions the directors of a company are accustomed to act. (A) is incorrect as a de jure director is the name given to a director who is properly appointed. (C) is incorrect as an executive director is a type of director with management responsibility (usually an employee), and can be compared with a non-executive director who acts to make sure the executive directors are fulfilling their role and brings some independence to the board. (D) is incorrect as an alternate director is someone (usually another member of the board) who a director appoints to stand in for them and attend and vote at board meetings. (E) is incorrect as a de facto director is a person who performs the duties of a director, holds themselves out as such, but is not properly appointed."},{n:15,id:"CTR003",scenario:"A man tells his friend that he wants to buy a cheap second-hand car for his daughter. The friend tells the man that he is in luck because his colleague is currently selling his car. The man gets in touch with the colleague who offers to sell him the car for £5,000. The man is tempted, but the car is more expensive and fancier than he was ideally looking for, so he asks the colleague if he can think about it and get back to the colleague in a few days. The colleague agrees. The next evening the man goes for a drink with his friend and tells him that he has fallen in love with the colleague's car and is going to buy it. The friend tells the man that the colleague has changed his mind about selling his car. In a panic the man calls the colleague immediately and says that he will buy the car.",q:"Is there a binding contract for the sale of the car between the man and the colleague?",opts:["Yes, because the colleague was required to communicate to the man the fact that he had changed his mind.","No, because the colleague's offer had been revoked.","Yes, because the colleague had promised to keep the offer open for a few days so could not go back on his word.","Yes, because there was no counteroffer.","No, because the man's request to the colleague to keep the offer open was not supported by consideration."],ans:"B",expl:"(B) The colleague's offer had been revoked so there is no contract. Revocation must be communicated to the offeree, but this can be done by a reliable third party, which in this case was the man's friend, so (A) is not correct. (C) is incorrect, as an offer can be revoked at any time, even if there has been a request to keep it open, provided the rules as to communication of revocation have been complied with, which was the case in this scenario. Whilst a counteroffer will terminate an offer, and it is correct that there was no counteroffer in this scenario, (D) is incorrect as the offer had been validly revoked. If a request to keep an offer open is supported by consideration, this creates a separate collateral contract. If the offer is revoked, it is then this separate collateral contract that is breached and the man might be able to claim damages for breach of that collateral contract if he can show loss. However, it would not entitle the man to accept the original offer to sell the car, so (E) is not correct."},{n:16,id:"ETH160",scenario:"A clothing company wants a solicitor to act for them in an employment discrimination matter. However, a conflict check reveals that a partner at a different branch office of the firm has acted for the clothing company's main competitor in property matters for many years.",q:"Which of the following statements best describes whether the solicitor should act for the clothing company in the employment discrimination matter?",opts:["The solicitor should not act because there is a conflict of interest between the clothing company and its competitor.","The solicitor should not act because whilst there is no actual conflict of interest between the clothing company and its competitor, there is a significant risk of conflict.","The solicitor is not prohibited from acting because the firm acts for the competitor in unrelated matters. However, the firm may choose to decline to act for the clothing company due to professional embarrassment.","The solicitor is not prohibited from acting because the partner who acts for the competitor is at a different branch office of the firm.","The solicitor is not prohibited from acting because the clothing company and the competitor are competing for the same objective."],ans:"C",expl:"(C) A conflict (or significant risk of conflict) relates to the same matter or a related matter. A general business interest is not sufficiently 'related' to create a conflict situation. A firm of solicitors could therefore act for two companies whose main business was the same, provided that it was on unrelated issues. So, the firm here could act in an employment discrimination matter for the clothing company and in conveyancing matters for the competitor without a conflict arising. However, even if there is no significant risk of conflict, the solicitor or firm may decline to act in any event due to professional embarrassment. (A) and (B) are incorrect because there is no conflict or significant risk of conflict in this situation. (D) is incorrect because it is irrelevant that the partner who acts for the competitor is in a different branch office. Even if the partner were in the same branch office, there would be no conflict. (E) is incorrect because the concept of 'competing for the same objective' is relevant only when there is a conflict of interest (for example, when two companies who are competing for the same asset want the same firm to act for them in their separate bids for that asset). As discussed, there is no conflict of interest between the clothing company and its competitor because the firm would be acting for the clients in unrelated matters."},{n:17,id:"DIS072",scenario:"A claim is approaching the end of the limitation period, which is due to expire on 30 April. On 15 April, the claimant's solicitors issue court proceedings to stop the limitation clock running.",q:"Which of the following best describes the deadline for service of the claim form upon the defendant?",opts:["The claimant must serve the claim form before 30 April.","The claimant must serve the claim form within 14 days of issue, that is, by 29 April.","The claimant must serve the claim form within 14 days of 30 April, that is, by 14 May.","The claimant must serve the claim form within four months of issue, that is, by 15 August.","The claimant must serve the claim form within one month of issue, that is, by 15 May."],ans:"D",expl:"(D) A claimant must serve an issued claim form within four months of the date of issue, failing which the court will not permit the claimant to continue with the claim. It will be extremely difficult to persuade the court to allow the claim to continue if the claimant fails to serve in time. (A) is incorrect because the claimant need only issue the claim form, not serve it, by the end of the limitation period. (B) is incorrect because the period is four months, not 14 days. Fourteen days refers to the period that the claimant has available to serve Particulars of Claim following service of the claim form. (C) is incorrect for the same reason - it refers to the period for serving the Particulars of Claim. Additionally, the trigger date is not 30 April, which represents the end of the limitation period. (E) is incorrect because the period is four months, not one month."},{n:18,id:"CNL122",scenario:"Following the UK's exit from the EU, it emerges that the Environmental Protection Act 2021 (the 'Act') does not comply with the Environmental Improvement Regulation (the 'Regulation') that was passed by the EU in 2014.",q:"Which one of the following statements best explains the status of the Act and the Regulation?",opts:["The courts can make a declaration of incompatibility because of the conflict between the Regulation and the Act.","The Regulation is retained EU law and so the courts must disapply the Act.","The House of Lords should convene a committee to determine whether the Regulation or the Act should apply.","The Act should be given effect because the Regulation is no longer part of UK law.","The Regulation remains part of UK law as retained EU law, but because the Act was enacted after the transition period, the courts should give effect to the Act and not the Regulation."],ans:"E",expl:"(E) The Regulation remains part of UK law, but the courts should still give effect to the Act and not the Regulation. Under the European Union (Withdrawal) Act 2018, after the end of the transition period (that is, after December 2020), most EU law became part of UK law as a new category of law - retained EU law. This would include the Regulation. However, legislation enacted after the transition period is not subject to the principle of supremacy, meaning that, with the end of the transition period, the UK can legislate contrary to EU law. Here, because the Act was passed after the end of the transition period, Parliament was free to legislate contrary to EU law, and as with any other valid Act of Parliament, the courts must give effect to it. (A) is incorrect because the courts can make a declaration of incompatibility only in relation to matters involving human rights. (B) is incorrect because, as mentioned, Parliament should give effect to the Act. (C) is incorrect because the House of Lords has no specific role in relation to this issue. (D) is incorrect because, while the choice correctly states that the Act should be given effect, it incorrectly states that the Regulation is no longer part of UK law. As mentioned, the Regulation remains part of UK law, specifically as retained EU law."},{n:19,id:"LGS063",scenario:"A solicitor at a large firm represented a UK-based client accused of manslaughter. The client was cleared after a brief hearing. The solicitor noticed that the client paid the firm's invoice (which was a substantial sum) by transferring money from a bank account in Bosnia and Herzegovina. The solicitor is aware that Bosnia and Herzegovina has been listed as a high-risk jurisdiction for money laundering.",q:"What is the solicitor's best course of action regarding the client's suspicious financial activities?",opts:["Report his suspicions to the National Crime Agency.","Report his suspicions to the firm's Money Laundering Reporting Officer.","Take no action, as this person is no longer a client.","Refuse to represent the client in any further cases.","Maintain client confidentiality and not report the matter."],ans:"B",expl:"(B) The solicitor's best course of action regarding the client's suspicious financial activities is to report his suspicions to the firm's Money Laundering Reporting Officer ('MLRO'). Solicitors have obligations under the Proceeds of Crime Act 2002 to make disclosures of suspicions of money laundering. In cases where a solicitor is acting for a client on a bona fide litigation, it can be a defence to the offence of failure to report that the information falls within a privilege or came to the solicitor in privileged circumstances. In other words, maintaining client confidentiality can supersede the obligation to report suspicions of money laundering. But here, the solicitor's suspicions are not related to the subject matter of the litigation; they are related to the client's payment of the invoice for legal fees. Therefore, the solicitor's suspicions should be reported to the firm's MLRO. (C) and (E) are incorrect because, as explained above, the solicitor should report their suspicions to the firm's MLRO to avoid committing the offence of failure to report. (A) is incorrect because within a firm, the solicitor's obligation is to report suspicious activities to the firm's MLRO and not to the National Crime Agency. (D) is incorrect because there is no duty to refuse to undertake future representation of the client."},{n:20,id:null,scenario:"A woman has a will in which, because of a family quarrel, she left all her wealth to charity and nothing to her two daughters. She then becomes reconciled with her daughters. She instructs her solicitor to draw up a new will which revokes the old one and instead leaves all her wealth to the daughters. The solicitor negligently fails to act on the instructions with sufficient speed, and the woman dies before a new will has been drawn up. The old will remains valid and her daughters do not inherit any of her wealth.",q:"In an action by the daughters against the solicitor to recover damages for their lost inheritance, which of the following best states the likely outcome?",opts:["The daughters are not likely to recover because it would not be fair, just, and reasonable to impose a duty of care on the solicitor towards the daughters in the circumstances.","The daughters are likely to recover because solicitor to client is an established duty situation.","The daughters are not likely to recover because they did not instruct the solicitor.","The daughters are not likely to recover because they have suffered pure economic loss.","The daughters are likely to recover because, in drafting the will, the solicitor undertook a responsibility towards them."],ans:null,expl:null,note:"The source document does not contain an answer or explanation page for this question (the answer pages move directly from question 19 to question 21)."}],X1=[{n:21,id:"ETH105",scenario:"A solicitor acting in a client's matter needs to pass the client's file to financial advisers to deal with investment elements of the matter. The solicitor happens to own a firm of financial advisers, and the solicitor intends to pass the client's file to this firm. The solicitor believes it is in the client's best interests to use this firm of financial advisers.",q:"Do the rules of professional conduct allow the solicitor to pass the client's file to the firm of financial advisers?",opts:["Yes, because the firm of financial advisers is owned by the firm of solicitors.","Yes, provided the solicitor obtains the client's informed consent to do this.","Yes, because the solicitor believes that doing so is in the client's best interests.","No, because this would demonstrate a lack of integrity.","No, because this would create a conflict of interest."],ans:"B",expl:"(B) A solicitor is permitted to refer the clients to their separate business as long as they have the client's informed consent to do this. Informed consent means the solicitor should tell the client about their interest in the separate business. (A) and (C) are incorrect because informed consent from the client is required. (D) and (E) are incorrect because referring a client to a separate business is permitted with informed consent, and there are no other facts indicating that the solicitor is acting without integrity, or that this would create a conflict of interest."},{n:22,id:"TRT024",scenario:"Five years ago, doctors employed at a hospital administered an X-ray treatment to patients. Very recently, medical science has discovered that the treatment has some side effects which are slow to develop. Several patients have now developed these side effects and have begun to suffer pain and discomfort.",q:"In an action in negligence by the patients against the hospital, which of the following best explains the likely outcome?",opts:["The hospital is liable because it is responsible for the actions of the doctors employed there.","The hospital is liable because the doctors employed there failed to take reasonable care in treating the patients.","The hospital is not liable because it is unlikely that the patients can establish that the doctors were in breach of duty.","The hospital is liable because the safety of the treatment was not such as the patients were entitled to expect.","The hospital is not liable because, by accepting the medical treatment, the patients consented to the associated risks."],ans:"C",expl:"(C) The hospital is not liable. The doctors owed their patients a duty of care but may not have been in breach of that duty. The doctors are in breach if they fell below a reasonable standard of care. This is assessed having regard for the knowledge available at the time and not with the benefit of hindsight. As the side effects have only recently been discovered, it would not be reasonable to expect the doctors to have taken precautions to avoid them. So, if the doctors were not negligent, the hospital would not be liable. (A) is not correct. The hospital is responsible for the actions of the doctors employed there (under the principle of vicarious liability and also because it owes its own duty to the patients). However, the hospital will not be liable if the doctors have not fallen below a reasonable standard of care, as explained above. (B) is not correct because, on the facts, the doctors did not fail to take reasonable care, as explained above. (D) is not correct because it refers to the standard of strict liability imposed by statute in respect of defective products. That standard is not applicable here because the facts do not relate to the supply of a product. (E) is not correct because the patients did not consent to the risks of treatment because they were not aware of them."},{n:23,id:"LGS032",scenario:"A firm of solicitors is looking for a new associate to join them. Because they have a number of Muslim clients, they would like the new associate to be an expert in Sharia or Islamic law. In the job advert they state that only Muslim lawyers should apply. The firm seeks advice as to whether this advert is discriminatory under the Equality Act 2010.",q:"Which of the following best describes the firm's advert?",opts:["The advert is indirectly discriminatory on the grounds of religion which the firm can justify if it can show this is a proportionate means of achieving a legitimate aim.","The advert is directly discriminatory on the grounds of religion which the firm can justify if it can show this is a legitimate means of achieving a proportionate aim.","The advert is directly discriminatory on the grounds of religion which cannot be justified by the firm.","The advert is directly discriminatory on the grounds of religion which the firm can justify if it can show this is a proportionate means of achieving a legitimate aim.","The advert is not discriminatory because the firm is not discriminating against Muslim applicants."],ans:"C",expl:"(C) The advert is directly discriminatory on the grounds of the protected characteristic of religion because the firm is expressly treating non-Muslim candidates less favourably than Muslim candidates. Direct discrimination is treating one person less favourably than another because of that person having a protected characteristic. The firm cannot justify direct discrimination on the grounds of religion. Only direct discrimination on the grounds of age or disability may be justified. (A) is incorrect because, as explained above, the advert is directly, not indirectly, discriminatory. Non-Muslim candidates are unable to apply for the job so are being treated less favourably than Muslim candidates. (B) is incorrect because direct discrimination on the grounds of religion cannot be justified. Note that the justification wording in this answer choice is also incorrect. An employer must show an action is a proportionate means of achieving a legitimate aim. (D) is incorrect because the advert is directly discriminatory on the grounds of religion which cannot be justified, even by showing that the action is a proportionate means of achieving a legitimate aim. (E) is incorrect because the advert is directly discriminatory against non-Muslim applicants on the grounds of religion."},{n:24,id:null,scenario:"At the last election, a Labour government was elected. At that election, the Labour Party's manifesto contained a commitment to radically reform trade union law, giving trade unions considerably more power than before. To implement this commitment, the House of Commons passes the Trade Union Reform Bill. However, the House of Lords has concerns about the Bill.",q:"Which of the following best describes how the House of Lords can respond to the Bill?",opts:["Refuse to consider the Bill.","Grant the Bill a Second Reading, but seek to pass amendments to the Bill at later stages of the process.","Block the legislation once, and if passed a second time by the House of Commons, attempt to block the Bill again.","Instruct the Monarch not to grant Royal Assent to the Bill.","Request that the Privy Council consider whether the Bill should become law."],ans:"B",expl:"(B) The House of Lords must grant the Bill a second reading, although it can seek to amend the Bill later in the legislative process. In this situation, the government is seeking to enact legislation that implements a manifesto commitment that they made at the last election. This means that the House of Lords is expected to comply with the Salisbury Convention. Under the Salisbury Convention, the House of Lords cannot block a bill that implements a manifesto commitment. Instead, the Lords will grant the legislation a Second Reading as a matter of course. However, the Lords retain the right to make amendments at later stages of the legislative process. (A) and (C) are incorrect because, for the reasons discussed, the Lords must grant a Second Reading to the Bill, rather than prevent it from becoming law. (D) and (E) are incorrect because those procedures do not exist.",note:"No question ID is shown on the answer page for this question."},{n:25,id:"CTR009",scenario:"A woman agreed to sell her friend a puppy. The purchase price was paid, and the puppy delivered on the same day. The day after the puppy was delivered, the woman promised her friend that the puppy had a good temperament and was excellent around children. A week later the puppy badly bit the friend's daughter, who required hospital treatment.",q:"Is the woman's promise enforceable?",opts:["No. Equity would intervene in a case like this and prevent the friend from suing the woman after the contract had been concluded.","Yes. The promise constituted a representation that the puppy was suitable to be around children.","No. As it was made after the contract for sale was concluded, there was no consideration to support it.","Yes. The requirement that the puppy was safe around children was a term of fundamental importance that goes to the root of the contract.","Yes. It must have been in the contemplation of both the woman and the friend that the puppy needed to be safe around children."],ans:"C",expl:"(C) The woman's promise is not enforceable, as it was made after the contract had been concluded and performed. There is therefore no consideration to support the promise. To be valid, consideration must be provided by both parties to be valid, and therefore additional consideration would have had to be provided by the friend to support the promise. (A) is incorrect because equity would not interfere in an executed contract where there has been no breach. Equity is 'the gloss on the common law' and primarily provides additional remedies where damages would be insufficient, such as, injunctions and specific performance. This is not relevant in the present case, as there has been no breach of the original contract. (B) is incorrect because representations are statements made prior to a contract being concluded to induce a party to enter into it. The promise here was made after the contract was formed. Similarly (D) and (E) are also both incorrect as the contract was concluded and performed before the promise was made. Therefore the promise did not constitute a term of the contract, nor is there any evidence that it was in the contemplation of both the woman and the friend that the puppy needed to be safe around children."},{n:26,id:"CNL082",scenario:"A live music venue has applied to the local council for its licence to be renewed. The council have agreed to renew the licence subject to the condition that live music can be played only between 10am and 12noon on Mondays through Fridays. This is because the council are concerned about the noise that the venue could generate at other times of the day. On either side of the venue is a pub and a daytime nursery. The pub is open on weeknights and weekends. The nursery is open 9am to 4pm on Mondays through Fridays. Ninety percent of the venue's performances have been on weeknights and weekends. The venue applies for a judicial review of the condition imposed on its licence renewal.",q:"Which of the following arguments for the venue's judicial review claim would most likely be successful?",opts:["The condition is disproportionate.","The condition is unreasonable.","The council has taken into account irrelevant considerations in imposing the condition.","The council has used their powers for an improper purpose.","The council has not complied with the general duty to consult with the venue."],ans:"B",expl:"(B) The venue is most likely to succeed on the argument that the condition is unreasonable. The test for unreasonableness is that the decision of a public body must be so outrageous in its defiance of logic or of accepted moral standards that no sensible person who applied their mind to the decision could have arrived at it. The condition imposed by the council would likely meet this test. Not only are the operating hours totally unsuitable for the venue, but they may cause problems for the nursery next door (as it is open during the hours when music would be allowed). Furthermore, allowing music to be played at more suitable hours (for example, on weeknights and on weekends) would probably cause far less of a problem because the nursery would be closed at that time and the music would likely not be a disturbance to the pub. (A) is incorrect because proportionality is only used for cases involving human rights or EU law. (C) and (D) are incorrect because there is no indication that the council took into account irrelevant considerations or acted with an improper purpose. (E) is incorrect because public authorities do not have a general duty to consult."},{n:27,id:"BSL177",scenario:"A company has been advised by an Insolvency Practitioner to enter a Company Voluntary Arrangement ('CVA'). The company owes the following amounts as unsecured debts: £50,000 to creditor 1; £22,000 to creditor 2; £4,000 to creditor 3; £2,000 to creditor 4.",q:"Which of the following correctly represents the creditors who must vote in favour of the proposals for the CVA to be approved?",opts:["All the creditors must vote in favour.","Creditors 1, 3, and 4.","Creditors 2, 3, and 4.","Creditor 1 only.","Creditors 1 and 2."],ans:"E",expl:"(E) Approval of a CVA requires the agreement of the company's unsecured creditors holding at least 75% in value of unsecured debt. If such approval is obtained, the Practitioner's proposals become binding on every ordinary unsecured creditor. Creditors 1 and 2 are needed to hit the 75% threshold. (A) is incorrect as not all the creditors must vote in favour - it is sufficient to have only 75% in value. Thus, creditors 3 and 4 need not vote in favour. (B) and (C) are incorrect because although these choices include 75% of the number of creditors, together they do not hold 75% of the outstanding debt, which is what is required. (D) is incorrect because although creditor 1 is the largest creditor, alone it does not hold 75% in value of the debt."},{n:28,id:"TRT132",scenario:"A woman runs a catering business. She cooks on an electric grill. She was catering for an event and had purchased 20 steaks at £5 each. She expected to sell them for £10 each. Unfortunately, the grill malfunctioned and all the steaks were burnt. She lost the cost of the steaks and the expected profit. She was also unable to use the grill at the next event she had booked, and so lost the £500 profit she expected to make there. The shop at which she purchased the grill has gone out of business, but she has been able to trace the manufacturer. Tests have shown that the grill malfunctioned because of a lack of proper care in the manufacturing process.",q:"In an action by the woman against the manufacturer, which of the following best states the likely outcome?",opts:["The woman will not be able to recover any of the losses which she suffered because they are all pure economic loss.","The woman will be able to recover the original cost of the burnt steaks only.","The woman will be able to recover the original cost of the burnt steaks and the profit she expected to make on them, but not the lost profit from the next booking.","The woman will be able to recover all of her losses: the original cost of the burnt steaks, the profit she expected to make on them, and her lost profit from the next booking.","The woman will not be able to recover any of the losses which she suffered because she did not buy the grill direct from the manufacturer."],ans:"C",expl:"(C) The woman will be able to recover everything except the lost profit from the next booking. The woman is owed a duty of care by the manufacturer in respect of the damage to the steaks and the consequential loss of profit on them. The facts show that the duty has been breached, causing her damage. However, a manufacturer does not owe a duty of care in respect of the cost of damage suffered by a defective product acquired by the claimant. This is classed as pure economic loss. So, the claimant cannot recover her loss of profit on the next booking resulting from the malfunctioning grill. (A) is incorrect because not all of the losses are unrecoverable as pure economic loss, as discussed above. (B) is incorrect because the lost profit on the steaks is also recoverable as consequential economic loss from the damage caused by the defective product. (D) is incorrect because the lost profit on the next booking is pure economic loss and so is not recoverable in tort. (E) is incorrect because the manufacturer does owe the woman a duty of care in tort in respect of the damage to her property, as explained above. (If the woman had bought the grill from the manufacturer, she would have had a claim in contract, where pure economic loss is recoverable.)"},{n:29,id:"ETH057",scenario:"Two international companies are long-time clients of a firm. Each client intends to bid for the same third company and has approached the firm to act on its behalf in the process. Separate teams of individuals within the firm would act for each client, and each client's team would not have access to the other client's files. After the firm fully explains the situation to the clients and reasonably believes that the clients understand the issues and risks involved, each client confirms in writing that it wants the firm to act.",q:"Which of the following statements best describes whether the firm may act for both companies?",opts:["The firm may not act because there is a conflict between the clients.","The firm may act provided it is satisfied that it is reasonable to act for both clients.","The firm may not act because the clients do not share a substantially common interest.","The firm may act provided each client takes independent legal advice concerning the conflict.","The firm may act because there was no conflict at the outset, as separate teams of solicitors will be working on the matters."],ans:"B",expl:"(B) This is a situation where the conflict can be resolved under the 'competing for the same objective' exception, which applies where two or more clients are competing for an objective which, if attained by one client, will make that objective unattainable to the other(s). Here the firm can resolve the conflict under this exception because the clients are two companies competing to take over the same third company. A firm may act for both clients in this situation where: (1) the clients have given informed consent, given or evidenced in writing, to the firm acting; (2) where appropriate, the firm puts in place effective safeguards to protect the clients' confidential information; and (3) the firm is satisfied that it is reasonable to act for all the clients. These conditions are met here. (A) is incorrect because the 'competing for the same objective' exception may be applicable to this conflict. (C) is incorrect because even though the 'substantially common interest' exception is inapplicable to this situation, the separate 'competing for the same objective' exception may be used. (D) is incorrect because it is not required that the clients take independent advice. (E) is incorrect because the conflict rules generally apply to the entire firm, not individuals within it. Whether separate teams of solicitors will be working on the matters is irrelevant to whether a conflict exists."},{n:30,id:"CTR113",scenario:"A builder places an online order for a consignment of bricks from a merchant, for delivery on 20 May. The merchant accepts the order. The bricks are required for immediate use in building a house for the builder's customer. On 22 May, the merchant tells the builder that the bricks will not be delivered until 25 May. The builder's contract with their customer requires them to pay the customer compensation for the resulting delay.",q:"What are the builder's rights as against the merchant?",opts:["The builder can terminate the contract and claim damages for the additional cost of sourcing replacement bricks and for the compensation payable to their customer.","The builder can terminate the contract and claim damages for the additional cost of sourcing replacement bricks, but they cannot claim for the compensation payable to their customer.","The builder can terminate the contract and claim damages for the compensation payable to their customer, but not for the additional cost of sourcing replacement bricks.","The builder cannot terminate the contract, but they can claim damages for the compensation payable to their customer.","The builder can obtain an order requiring the merchant to supply the bricks on time."],ans:"B",expl:"(B) Where a time for delivery is agreed in a commercial contract, there is a presumption that time for delivery is of the essence of the contract. This means that the agreed delivery time is a condition of the contract. If it is not complied with, the innocent party (here, the builder) can terminate the contract and claim damages. The damages will include the additional cost of sourcing replacement bricks. However, the compensation payable by the builder to their customer depends on the contract between the builder and the customer, so it is unlikely to be 'loss flowing naturally from the breach'. The builder could claim it only if it was in the reasonable contemplation of the builder and the merchant when they concluded their contract. Here, there is no indication in the facts that the merchant was aware that compensation was payable to the builder's customer in the event of delay, and so the builder cannot recover for what they must pay to their customer. (A) is incorrect because as stated above the builder can terminate the contract but is unlikely to be able to claim damages for the compensation payable to their customer. (C) is incorrect because the builder is unlikely to be able to claim damages for the compensation payable to their customer but can claim for the additional cost of sourcing replacement bricks. (D) is incorrect because the builder is unlikely to be able to claim damages for the compensation payable to their customer. (E) is not correct because this would be an order for specific performance. Specific performance is not available where, as here, damages would be an adequate remedy. The builder can obtain the bricks elsewhere and can recover damages for all their losses under the contract. Their problem is that the contract does not extend to the more remote losses."},{n:31,id:"LGS047",scenario:"A firm of solicitors implements a compulsory retirement age of 65 for all employees. The firm is concerned that it has an aging senior staff and there is a large pool of unemployed, talented younger lawyers who are unable to access the profession due to older lawyers remaining in their posts.",q:"Which of the following best describes whether the firm can seek to justify the policy under the Equality Act 2010?",opts:["The firm can justify the policy because the policy is meeting a legitimate aim.","The firm can justify the policy because the policy is meeting a legitimate aim and the means of achieving that aim are proportionate.","The firm can justify the policy because the policy is proportionate.","The firm cannot justify the policy because direct discrimination on the grounds of age cannot be justified.","The firm cannot justify the policy because the policy is indirect discrimination on the grounds of age and the firm has no legitimate aim."],ans:"B",expl:"(B) The firm can justify the policy because the policy is meeting a legitimate aim and the means of achieving that aim are proportionate. Direct discrimination is treating one person less favourably than another because of that person having a protected characteristic. Usually direct discrimination cannot be justified but it can if, as here, the protected characteristic is age. Direct age discrimination can be justified if the firm uses a proportionate means to achieve a legitimate aim. For example, there usually needs to be some wider public policy reason, such as reducing unemployment in a particular age group, rather than a reason based only on business need. Here, it is a legitimate aim to address unemployment among younger lawyers and having a compulsory retirement age is a proportionate means of achieving that aim. (A) and (C) are incorrect because they do not give the complete standard for justification. The firm must show it has both a legitimate aim and a proportionate means of achieving that aim. (D) is incorrect because, as explained above, direct age discrimination can be justified if the firm uses a proportionate means to achieve a legitimate aim. (E) is incorrect because the firm's policy is direct discrimination, not indirect discrimination, and, as explained above, the firm has a legitimate aim."},{n:32,id:"CTR032",scenario:"A car dealer and a customer are in disagreement over the sale of a used car. The contract between them provided that the car would be valeted before delivery. On receipt of the car, the customer found that the car was in a filthy condition and the car dealer was therefore in breach of the contract, as clearly the car had not been cleaned.",q:"What is the likely effect of the car dealer's breach of contract?",opts:["The customer is entitled to damages only.","The customer is entitled to terminate the contract only.","The customer is entitled to terminate the contract and claim damages.","The customer is entitled to specific performance.","The customer is entitled to terminate the contract, but can also choose to affirm the contract and claim damages instead."],ans:"A",expl:"(A) Breach of the requirement to have a car valeted before delivery does not go to the root of the contract, and is therefore not a fundamental breach which would give the innocent party the right to bring the contract to an end. It is therefore a breach of a warranty (a lesser term) rather than a condition. Breach of a warranty entitles the customer to damages only, so (A) is the correct answer. (B) and (C) are both incorrect as breach of a warranty does not give the customer the right to terminate the agreement, only to claim for damages. (D) is incorrect as equitable remedies will be available only where damages would not be an adequate remedy, and that is not the case here. (E) is incorrect as the customer does not have the right to terminate the contract for a breach of a warranty, only for breach of a condition."},{n:33,id:"ELS001",scenario:"A claimant files a complex contract case in the High Court. One aspect of the case involves a provision of the Supply of Goods and Services Act 1982 ('SGSA'). The defendant argues the SGSA provision unfairly harms honest business people in certain situations, including the situation involved in the claimant's case. In support of their argument, the defendant cites a case ruled on by the Court of Appeal before the SGSA was adopted. The case involves facts very similar to those of the present case. In that case, the Court of Appeal ruled in favour of the defendant. As a result, the defendant argues the High Court should not apply the SGSA provision in the claimant's case now.",q:"Which of the following best describes the relationship between legislation and judges' decisions in the common law system of England and Wales?",opts:["Decisions of judges take precedence over any legislation.","Legislation takes priority over decisions of judges, and judges are not allowed to go beyond the wording of the statute if the statute is unclear.","Legislation takes precedence over decisions of judges, but decisions of judges may interpret legislation to fill in gaps in the legislation.","Legislation may not deviate from previous judicial decisions; only judges may alter previous court decisions.","The common law system of England and Wales operates the same as civil law systems found in Europe."],ans:"C",expl:"(C) Generally, under the common law system of England and Wales, statutes take precedence over court decisions. However, not every conceivable case can be covered by a statute, so decisions made by judges fill in the gaps and details that legislation has left. (A) is incorrect. Although the legal system of England and Wales is a common law system, legislation takes priority over judges' decisions. (B) is incorrect because judges are allowed to interpret and apply legislation when the legislation may not be entirely clear when applying it to the facts of a particular case. (D) is an incorrect statement of law. New legislation does not have to follow the prior decisions of judges. (E) is also incorrect and a false statement. The primary focus in civil law systems is on statutes and legislation; in the common law system, the focus is on legislation, but judicial decisions interpreting and applying the legislation play a large role."},{n:34,id:"ELS030",scenario:"A defendant who has been accused of being drunk and disorderly pleaded not guilty and has had their case tried in the Magistrates' Court. The defendant lost the case and now wishes to appeal against their conviction.",q:"Which of the following is the correct appeal route the case would take?",opts:["Court of Appeal, High Court, Crown Court.","High Court, Court of Appeal, Supreme Court.","Crown Court, Court of Appeal, Supreme Court.","Court of Appeal, Supreme Court, High Court.","Crown Court, Supreme Court, Court of Appeal."],ans:"C",expl:"(C) Cases heard in the Magistrates' Court are appealed to the Crown Court, then to the Court of Appeal (Criminal Division), and finally to the Supreme Court, provided the case involves a point of law of public importance and that leave to appeal has been granted. (A) is incorrect because the first route of appeal in a criminal case is the Crown Court. Also, the High Court will hear appeals in criminal cases only in relation to procedural matters, that is, if it appears the magistrate incorrectly applied procedure, such as denying admissible evidence. There is nothing in the facts to suggest that this was the case. (B) is incorrect for similar reasons. (D) is incorrect because the appeal should go to the Crown Court or High Court (if appropriate) before the Court of Appeal and Supreme Court. (E) is incorrect because a case must be appealed to the Court of Appeal before the Supreme Court."},{n:35,id:"BSL172",scenario:"A small company manufactures and sells scented candles. The company has recently experienced a severe decrease in business. The sole director and shareholder of the company realises that soon the company will be unable to pay its debts. The director sells the company's inventory of wax to their spouse for £100; it is valued at £2,000 in the accounts. The director also gives their son security over the company's wax melting and mixing machine for a debt already owed to the son. Ten weeks later, the company goes into liquidation.",q:"Which of the following statements reflects the legal position regarding the transfer to the spouse and the security granted to the director's son?",opts:["The security given to the director's son is not a transaction at an undervalue so it may not be voided by the court.","Both the transfer to the director's spouse and the security given to the director's son are transactions at an undervalue. They both may be voided by the court.","The transfer to the director's spouse is not a transaction at an undervalue so it may not be voided by the court.","Only the transfer to the director's spouse is a transaction at an undervalue. It may be voided by the court.","The security given to the director's son is a transaction at an undervalue. It may be voided by the court."],ans:"D",expl:"(D) The transfer to the spouse is a transaction at an undervalue and may be voided. A transaction at an undervalue arises when a transfer of property as a gift or for significantly less than market value is made within two years of a company's insolvency. Thus, (C) is incorrect. (B) and (E) are incorrect because the granting of security is not a transaction at an undervalue. (A) correctly states that the granting of security was not a transaction at an undervalue, but it is not true that the transfer may not be voided by the court - the court may void a preference as well as a transfer at an undervalue."},{n:36,id:"DIS081",scenario:"A client wishes to make a claim against his former solicitor for professional negligence. The client's current solicitor sends a letter of claim pursuant to the Professional Negligence Pre-Action Protocol. The former solicitor responds with an offer to engage in alternative dispute resolution. However, the client refuses the former solicitor's offer. Instead, the client instructs the current solicitor to issue proceedings before the end of the protocol period.",q:"Which of the following best describes the probable consequence of the client's failure to follow the pre-action protocol?",opts:["They may issue proceedings only if they obtain the court's permission.","They may have any damages the former solicitor is ordered to pay reduced.","They may be required to pay over a percentage of damages received to the former solicitor.","They may be required to attend alternative dispute resolution as soon as the former solicitor has served their defence.","They may, even if successful in the claim, be ordered to pay some or all of the former solicitor's costs."],ans:"E",expl:"(E) Costs are the appropriate sanction for a party who does not comply with a pre-action protocol. (A) is not correct, as the client is free to issue proceedings (although it would be prudent not to do so). (B) is not correct as the court has no power to reduce damages as a sanction for conduct in litigation. (C) is not correct as the court has no power to order a percentage of damages to be paid over. (D) is not correct as the court has no power to order a party to attend ADR."},{n:37,id:"TRT033",scenario:"A child, aged 7, was playing with other children in a public park. She threw a ball to her friend, but it missed and bounced in a puddle. It then hit a passerby and made a muddy stain on her new jacket, which had cost £100 only the week before.",q:"If the passerby were to pursue a claim against the child, which of the following statements best explains the likely outcome?",opts:["The claim will not succeed because there is a statutory exclusion for damage to property not exceeding £275.","The claim will not succeed because a child aged 7 does not owe any duty of care to a passerby.","The claim will not succeed, provided the child met the standard of care to be expected of a reasonable child of the same age.","The claim will not succeed, provided the child met the standard of care that she personally was capable of.","The claim will succeed because the risk posed by throwing the ball would have been obvious to a reasonable person."],ans:"C",expl:"(C) The claim is not likely to succeed provided the child met the standard of care to be expected of a reasonable child of the same age. There is no minimum age for liability in tort, so the child does owe a duty of care to the passerby. However, when considering breach of duty, a child must meet the standard of care of a reasonable child of the same age. So, because the child did not fall below that standard, the claim is not likely to succeed. (A) is not corre
