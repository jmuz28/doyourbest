ct. For claims under the Consumer Protection Act 1987 there is a statutory exclusion for damage to property not exceeding £275. However, this is not relevant on the facts of the question. (B) is not correct. As discussed above, the child does owe a duty of care but was not in breach. (D) is not correct. When considering breach of duty, the standard of care remains objective. So, the court does not look at the level of care that this particular child was capable of, but at the standard to be expected of a reasonable child of the same age. (E) is not correct. When considering breach of duty, a child is not measured against the standard of care expected of a reasonable adult, but against that of a reasonable child of the same age, as discussed above."},{n:38,id:"CTR146",scenario:"A band enters into a contract with a manager. A term of the contract prohibits the band from engaging anyone else to act as their manager. The band is successful, and as a result, the band is offered the opportunity to sign a new management contract with one of the music industry's top management companies.",q:"What remedy or remedies is the original manager entitled to receive if the band engages the management company?",opts:["Damages only.","Specific performance of the original contract.","An injunction prohibiting the band from engaging a different manager for the term of the original contract.","An injunction prohibiting the band from engaging another manager for the term of the original contract and damages for lost profits.","No remedy, because the prohibition in the original contract is void for illegality as a restraint of trade."],ans:"A",expl:"(A) The original manager is entitled to damages only. Damages would be an adequate remedy in this case. The manager can be awarded the profits that they would have expected to make under the management contract until it could be properly terminated, less an allowance for mitigation. (B) is incorrect because specific performance would not be granted in this scenario. Specific performance is an equitable remedy requiring the party in breach to carry out their contractual obligations in full. It will be granted in some cases in which damages are not an adequate remedy, but it will not be granted if the contract is for employment or similar personal services. (C) and (D) are incorrect. There is never an entitlement to an injunction. It is a discretionary remedy. Bands need managers, so granting an injunction prohibiting the band from engaging a different manager will have the effect of forcing the band to work with the first manager. This would be tantamount to enforcing a contract for personal services. Also, damages would be an adequate remedy in this case. The manager could be awarded the profits that they would have expected to make under the management contract until it could be properly terminated, less an allowance for mitigation. (E) is incorrect because the prohibition is not a restraint of trade clause. A restraint of trade clause is a clause which restricts activities after a contract has come to an end. This prohibition is part of an ongoing relationship; prohibitions of this sort are commonplace, and in fact the management contract could not really work without it."},{n:39,id:"BSL219",scenario:"A company was incorporated several years ago with the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association. The company is currently valued at £5 million and wishes to borrow £1 million to acquire new premises. The loan will be secured by fixed charge over the premises.",q:"Which of the following best describes the shareholders' resolutions which must be passed before the company can enter the loan?",opts:["The shareholders must resolve to enter the loan and grant the charge by special resolution.","The shareholders must resolve to enter the loan and grant the charge by ordinary resolution.","The shareholders must approve the terms of the loan by special resolution.","The shareholders must approve the terms of the loan by ordinary resolution.","No shareholders' resolutions are necessary."],ans:"E",expl:"(E) Unless there are restrictions in the articles (unamended Model Articles do not include any), the board has the power to borrow money. Therefore, a board resolution is all that will be needed to enter the loan and grant the charge. No shareholder approval is needed. Therefore, (A), (B), (C), and (D) are incorrect."},{n:40,id:"TRT047",scenario:"A collector owns anvils which he agreed to lend to a museum. The museum hired a removal company to transport the anvils to the second floor of the museum. The movers used a rope and pulley apparatus to lift the anvils on the outside of the building to the second-floor window. However, they failed to attach the rope tightly enough and while one anvil was being lifted, it slipped and fell to the ground. The anvil was not damaged.",q:"In a claim by the collector against the movers, which of the following is correct?",opts:["The collector has no claim against the movers because they were hired by the museum.","The collector can recover damages against the movers for trespass to his goods.","The collector can rely on the principle of res ipsa loquitur to establish a claim in negligence against the movers.","The collector has no claim against the movers because he cannot establish causation of damage.","The collector has no claim against the movers because they did not intend to damage the goods."],ans:"D",expl:"(D) The collector has no claim because no damage was caused to his goods. Since the damage was caused accidentally, any claim would need to be in the tort of negligence. For an action in negligence the collector would need to show that the movers owed him a duty of care, that they were in breach of duty, and that the breach caused damage. Negligence is not actionable without proof of damage and, since his goods were not damaged, he has no claim. (A) is not correct. While the collector had no contract with the movers, they could still owe him a duty of care in the tort of negligence. (B) is not correct. The tort of trespass requires an unlawful interference with the collector's possession of the goods. The movers had permission from the collector to move the goods so there was no unlawful interference. (C) is not correct for two reasons. First, the principle of res ipsa loquitur is unlikely to apply here, because there is an explanation for how the accident happened. Second, the principle of res ipsa loquitur is used to assist in proving breach of duty, whereas here the claim will fail because the collector cannot establish causation of damage. (E) is not correct. It is true that the collector has no claim in either trespass or negligence, but this is not because the movers did not intend to damage the goods. An intention to cause damage would not be a required element in either trespass or negligence."},{n:41,id:"CNL156",scenario:"Parliament has passed an Act of Parliament concerning Aerospace Industries. The Act has been granted Royal Assent. The Act gives the government the power to make a commencement order.",q:"Which of the following best explains when the Act will come into force?",opts:["Immediately on being granted the Royal Assent.","When the Speaker of the House of Commons decides that it should be brought into force.","On the date provided by the government in its commencement order.","When the Speaker of the House of Lords decides that it should be brought into force.","In three months, unless the government makes the commencement order bringing the legislation into force sooner."],ans:"C",expl:"(C) The Act will come into force on the date provided by the government in its commencement order. Because the Act includes a provision giving the government the power to make a commencement order, the Act will come into force on the date the government states in the order. (A) is incorrect because the Act will not come into effect immediately on being granted the Royal Assent, but rather on the date stated in the government's commencement order. (B) and (D) are incorrect because the Speakers of the Houses don't determine when Acts of Parliament should come into force. (E) is incorrect because there is no deadline by which the government must commence the Act."},{n:42,id:"CTR104",scenario:"A woman hired her friend, who was an excellent cook, to prepare food for a large family reunion picnic that she was planning for the following summer. Her friend offered to cater for the picnic at a much lower rate than it would have cost to hire a professional caterer. To avoid misunderstandings, the woman and her friend signed a written contract. A few months later, however, the friend decided to retire, so she telephoned the woman to apologise and cancel the contract. The woman was very disappointed but said nothing and began looking for another caterer. She found several other caterers willing to cater for the picnic, but none of them would do so for the low price agreed in the contract. The woman therefore decided to sue her friend for specific performance.",q:"Which of the following is a reason why the woman's action for specific performance will not succeed?",opts:["Because a contract for personal services is involved.","Because the equitable defence of laches will apply.","Because this is a domestic situation.","Because the contract was unconscionable.","Because it would prevent unjust enrichment."],ans:"A",expl:"(A) The woman's claim against her friend will not succeed because a contract to provide personal services is not specifically enforceable: you cannot compel someone to work for you. A court will not order one party to work for another because of the difficulty of enforcement. Another requirement for specific performance is that enforcement must be feasible. Enforcing a services contract generally would create complicated and time-consuming supervision problems, which the courts are reluctant to undertake. Another reason (perhaps less relevant in this case) is that the courts are reluctant to enforce a contract where personal relationships are involved. A further reason why specific performance is not available in this case is that damages would be an adequate remedy. The services to be performed by the friend were not unique or capable of being performed solely by her. The woman can be adequately compensated by recovering the additional cost of having someone else perform the required work. (B) is incorrect because circumstances that would permit the defence of laches do not appear to be present. Laches is available as a defence to an equitable remedy if the innocent party has delayed unreasonably in bringing the action and the delay is prejudicial to the other party. Here, there is no evidence that the woman delayed unreasonably in bringing her claim: she merely spent some time trying to find another caterer. Nor has the friend been prejudiced by the delay. (C) is incorrect because this agreement is in a commercial context and the written, signed contract demonstrates that they intended to be bound. (D) is incorrect because the mere fact that the friend was willing to do the work for a lower price than other caterers does not by itself mean that the contract was unconscionable. (E) is incorrect because unjust enrichment is not an obstacle to a claim for specific performance where the innocent party is seeking to have the party in breach perform their contractual obligations. There is no unjust enrichment where the parties perform their agreed contractual obligations."},{n:43,id:"DIS064",scenario:"A property development company built a city centre development, incorporating shops and residential properties. The development was completed on 1 August 2010. Under the terms of the lease, obligations to maintain the residential part of the structure then passed to the residential management company. On 26 February 2021, a large crack appeared in a wall in one of the apartments of the building. Investigations suggest that the crack has been caused by faulty workmanship dating back to construction of the property building. The residential management company is considering making a claim against the developers.",q:"Which of the following statements best describes the limitation period in relation to the management company's claim against the developer?",opts:["The management company is out of time in making a claim against the developer because the limitation period expired on 1 August 2016.","The management company may bring a claim against the developer any time before 26 February 2024.","The management company may bring a claim against the developer any time before 31 August 2025.","The management company may bring a claim against the developer any time before 26 February 2027.","The management company may bring a claim against the developer any time before 26 February 2036."],ans:"B",expl:"(B) The management company can avail itself of the provisions of the Latent Damage Act 1986, which provides that a claim can be brought within six years of the date of accrual or three years from the earliest date on which the claimant knew, or reasonably ought to have known, material facts necessary to bring an action alleging negligence (the starting date). Here, the negligence will be deemed to have accrued at the completion of the project (1 August 2010). Six years from the date is 1 August 2016 (choice (A)). But instead, the management company can rely on the three-year period. The management company learned of the negligence on 26 February 2021. Three years from that date is 26 February 2024. (C) is incorrect because it is using the Latent Damage Act longstop period of 15 years. That is the latest date a claim may be brought no matter when the negligence is discovered. But here, the limitation will end earlier because the management company knew about the developer's negligence more than three years before the longstop date. (D) is incorrect because it is using the six-year period from the date of discovery; the six-year period is used from the accrual date and, as indicated above, that period has expired. (E) is incorrect because it is applying the longstop date from the date of discovery; the longstop is measured from the date of accrual."},{n:44,id:"BSL030",scenario:"Three friends wish to start a business as partners. They are trying to decide between setting up as a general partnership under the Partnership Act 1890 and setting up as a limited liability partnership ('LLP') under the Limited Liability Partnerships Act 2000.",q:"Which of the following statements is true regarding a way in which LLPs and general partnerships are similar?",opts:["Neither a general partnership nor an LLP has perpetual succession.","Both entities are subject to the same rules as regards taxation.","Both entities must register with the Registrar of Companies.","Partners of both entities are not personally liable for any obligations of the partnership.","Both entities have the same naming requirements."],ans:"B",expl:"(B) An LLP is very similar to a limited company in many respects. However, as far as taxation is concerned, LLPs are more akin to partnerships, as their members are taxed for income tax (like the partners in a general partnership) rather than the LLP being liable for corporation tax like a company. (A) is incorrect because an LLP, by nature of its limited liability status and separate legal personality, has perpetual succession. A general partnership does not; that is, if a shareholder dies, technically the partnership will come to an end. (C) is incorrect because only LLPs are required to register to become incorporated. A general partnership can be started with no formalities. (D) is incorrect because it is only an LLP where the partners are not personally liable for the obligations of the partnership; general partners are personally liable for such obligations. (E) is incorrect because the LLP name must indicate the partnership's limited liability status (for example, by including the words 'limited liability partnership' or the abbreviation 'LLP'). A general partnership has no specific naming requirements."},{n:45,id:"CTR080",scenario:"A woman hires a contract killer to murder her husband. The woman pays the contract killer £500,000, but he has a change of heart and does not go through with the murder but leaves the country with the woman's money.",q:"Can the woman recover the £500,000?",opts:["No. There was no contract, because there was no consideration.","No. The contract is void for illegality in formation.","No. The contract is void for illegality in its performance.","Yes. The contract has all the necessary elements so is valid, and so she can recover the £500,000 as damages for breach.","Yes. The law of restitution does not allow a wrongdoer to profit from their wrongdoing so the woman would be entitled to a remedy."],ans:"B",expl:"(B) Any contract that contemplates a criminal act will be illegal and automatically void. As murder is a criminal offence, this would apply in this scenario. (A) is incorrect as, if this had been a legal contract, both parties would have provided consideration. (C) is incorrect because this contract is illegal at its outset, not in its performance. (D) is incorrect because even though all the necessary elements for a valid contract may be present, the fact that the contract is for an illegal act renders it void, so no damages can be recovered for its breach. (E) is incorrect because the law of restitution does not apply when a contract is void for illegality from the start because it involves serious criminal misconduct. It is, however, correct that the law of restitution does not allow a wrongdoer to profit from their wrongdoing and might allow a party to recover amounts paid under a void contract where the reason for invalidity is not illegality."}],Z1=[{n:46,id:"CNL004",scenario:"The UK government has entered into a new international treaty with Brazil. The treaty has been ratified according to all legal requirements.",q:"What else needs to take place for the treaty to become part of UK law?",opts:["The government needs to lay the treaty before both Houses of Parliament for 21 days.","The Supreme Court needs to approve the treaty.","The Monarch needs to approve the treaty.","Parliament needs to pass an Act of Parliament incorporating the treaty into UK law.","The Scottish Parliament needs to approve the treaty."],ans:"D",expl:"(D) To become part of UK law, Parliament needs to pass an Act of Parliament incorporating the treaty into UK law. Under the doctrine of parliamentary sovereignty, no form of law is higher than an Act of Parliament. This means that in order for an international treaty to become part of UK law, it needs to be incorporated through an Act of Parliament. (A) is incorrect because the requirement to lay the treaty before each House of Parliament for 21 days relates to ratifying the treaty. (B), (C), and (E) are incorrect because there is no need for the Supreme Court, the Monarch, or the Scottish Parliament to approve the treaty for it to become part of UK law."},{n:47,id:"CTR108",scenario:"On 1 September, an importer offers to sell a consignment of fresh fruit to a greengrocer. The greengrocer emails an acceptance of the offer on 22 September. The importer sends an email back explaining that when he had not heard from the greengrocer within three days, he sold the fruit to a different greengrocer in order to sell it before it rotted.",q:"Is the importer liable for breach of contract?",opts:["Yes, because the greengrocer accepted the importer's offer before the importer did anything to revoke the offer.","No, because the importer's offer had lapsed before the greengrocer had accepted the offer and therefore there was no contract between the parties.","Yes, because the sale to the second greengrocer constituted an anticipatory breach.","No, because no contract was formed due to mistake.","No, because the contract was discharged by frustration."],ans:"B",expl:"(B) The importer will not be liable for breach because the offer had lapsed and so no contract was formed. Unless a time for acceptance is specified, an offer will lapse after a reasonable time. What is 'reasonable' will depend on the nature of the subject matter, for example, an offer to purchase perishable goods, will lapse more quickly. Here, the offer was for a consignment of fresh fruit. It is not reasonable to expect an offer for the sale of consignment of fresh fruit to remain open for three weeks - because the fruit would rot by then, as indicated by the fact that the importer feared its rotting after just three days. Therefore, the offer had lapsed before the greengrocer accepted it, so the importer is not liable for breach of contract. Thus, (A) is incorrect. (C) is not correct, as there was no contract for the reasons stated above. Anticipatory breach occurs if before performance is due under a contract, one party indicates they will not perform. (D) is not correct. A contract can be rescinded or cancelled because of common mistake, which usually means that both parties to a contract were mistaken about the existence of the subject matter of the contract. Here, no contract was formed as discussed above. (E) is not correct. A contract will be discharged by frustration if it has become impossible to perform. Here, there was no contract to discharge. The importer's offer had lapsed before the greengrocer accepted it."},{n:48,id:"ETH009",scenario:'A wheelchair-bound client visits his solicitor for an important meeting. At the end of the matter the client sees the following disbursement on his bill: "Hire of wheelchair ramp: £250 plus VAT".',q:"Which of the following statements best describes the firm's position?",opts:["The firm was entitled to charge the disbursement provided it appeared in the client care letter.","The firm was entitled to charge the £250 but not the VAT.","The firm should not have charged the disbursement because it could have conducted the meeting by telephone instead of in person.","The firm should not have charged the disbursement because it is not entitled to pass on the cost of making reasonable adjustments.","The firm was entitled to charge the disbursement provided it was reasonable in all the circumstances."],ans:"D",expl:"(D) A firm must make reasonable adjustments to ensure that disabled clients, employees, or managers are not placed at a substantial disadvantage compared to those who are not disabled, and the firm must not pass on the costs of these adjustments to those persons. (A) is incorrect because even if it was in the client care letter, the firm is not entitled to make this charge. (B) is incorrect because the entire charge is prohibited. (C) is incorrect because the issue is whether a firm can pass on the costs of reasonable adjustments. Additionally, choosing not to meet with the client in person because of the client's disability could place the client at a substantial disadvantage compared to clients who are not disabled. (E) is incorrect because as previously stated, the firm cannot pass on the costs of the reasonable adjustment."},{n:49,id:"LGS020",scenario:"A client and a solicitor enter into a damages based agreement in an employment discrimination claim at 10% of the damages awarded to the client. At the employment tribunal, the client is successful and is awarded damages of £400,000. The solicitor's normal hourly rate is £200 per hour, and the solicitor has spent 100 hours on the claim.",q:"Which of the following correctly states the amount which the client will have to pay to their solicitor under the damages based agreement?",opts:["£20,000.","£2,000.","£42,000.","£0.","£40,000."],ans:"E",expl:"(E) The client will have to pay their solicitor £40,000. Damages based agreements are 'contingency' agreements in that they are contingent on the success of the claim and recovery of damages. If nothing is recovered, the solicitor is not entitled to legal costs. If the claim is successful, the solicitor's standard time costs can be recovered from the losing defendant. Here, the client has been awarded £400,000 in damages and the applicable percentage in the agreement is 10%, which means the solicitor is entitled to £40,000 from the client in total. Note that any amount the defendant has been ordered to pay in costs would be deducted from what the client owes when working out the total amount the client has to pay to the solicitor. (A) is incorrect because it has calculated the solicitor's fee using the hourly rate, but under the damages based agreement this rate will not be used. (B) is incorrect because it applies 10% to the solicitor's fee using the hourly rate instead of applying 10% to the damages recovered. (C) is incorrect because it applies 10% to the solicitor's fee using the hourly rate in addition to the damages recovered. (D) is incorrect because under the damages based agreement, the client must pay the solicitor 10% of the damages recovered."},{n:50,id:"TRT062",scenario:"A homeowner negligently cut down a large tree on his property so that it fell on his neighbour's garage, causing the roof to collapse. The neighbour happened to be in the garage at the time and suffered some minor cuts from broken glass. However, the neighbour had a pre-existing blood clotting disorder that required her to be hospitalised for several weeks because of the cuts. She also developed post-traumatic stress disorder from the sudden collapse of the roof whilst she was in the garage. In addition, a classic car worth 10 times the price of a standard luxury sedan was totally destroyed by the collapse. The neighbour brings an action against the homeowner to recover all of the damages she suffered. The homeowner acknowledges liability for damages for the destroyed roof, the neighbour's cuts from the broken glass, and the value of a standard luxury sedan that could have been garaged by the neighbour.",q:"Will the neighbour recover damages for her hospital stay and post-traumatic stress disorder, and for the full value of the classic car?",opts:["Yes as to her hospital stay and post-traumatic stress disorder only.","Yes as to her hospital stay only.","Yes as to her hospital stay and the full value of the classic car.","Yes as to her hospital stay, the post-traumatic stress disorder, and the full value of the classic car.","No as to all of those items."],ans:"D",expl:"(D) The homeowner will be liable for all damage elements claimed by the neighbour. For liability in negligence it must be shown that: (i) a duty of care existed, (ii) the defendant breached this duty of care, (iii) the breach caused loss or damage to the claimant, and (iv) the loss or damage was not too remote. Here, the homeowner had a clear duty not to cause damage to the neighbour's person or property whilst cutting down the tree, and his breach of that duty caused harm to the neighbour. (B) and (C) are incorrect because damages for psychiatric injury that accompanies physical injury can be recovered in a negligence action along with the physical injury, so the neighbour is likely to recover damages for the post-traumatic stress disorder. (E) is incorrect. As a general rule, the damage suffered by the claimant must have been a reasonably foreseeable consequence of the defendant's negligence. One of the exceptions to this is the requirement for the defendant to 'take their victim as they find them', also known as the 'egg shell skull' rule. If the claimant suffers from a pre-existing condition that causes the harm from the defendant's negligence to be more severe, the claimant can still recover for the damage. Therefore the neighbour would likely be able to recover for her hospital stay caused by her pre-existing blood clotting disorder. (A) is incorrect. Another exception to the rule that damage must be reasonably foreseeable is the 'similar in type' rule. Provided the type of harm was reasonably foreseeable, the precise extent of the harm need not be foreseeable. On the facts, it was foreseeable that property in the garage would be damaged or destroyed when the tree caused the roof to collapse. So, even though the car that was destroyed was much more expensive than might have been foreseen, the neighbour can recover the full value of the car."},{n:51,id:"CTR137",scenario:"A small family travel agency has a contract to sell tickets for flights on an airline in return for a commission for each flight sold. The business of the travel agency is tied almost exclusively to the airline. The airline soon realises that the agency's recordkeeping is very poor, which causes the airline to spend extra money to double check the agency's bills. The airline believes that the agency's poor recordkeeping justifies immediate termination of the contract. The airline informs the agency of the above but agrees they will not terminate the contract if the agency agrees to a lower commission rate because of the difficulties. The agency agrees to the variation. The agency subsequently brings a claim seeking to recover the full commissions owed under the original contract.",q:"Is the court likely to find that the variation to lower the commission is binding?",opts:["No, because the variation is void for economic duress.","Yes, because the airline gave consideration by spending extra money to double check the agency's bills.","No, because the variation is voidable for undue influence.","Yes, because the airline was entitled to terminate the contract.","No, because there was no consideration for the agency's agreement to accept less commission."],ans:"D",expl:"(D) A court is likely to find the variation binding because the airline had a right to terminate the contract and, therefore, there was consideration to support the variation (specifically, the airline gave up whatever right it had to terminate the contract based on the agency's poor record keeping). Therefore, (E) is incorrect. (A) is incorrect because a lawful act (such as terminating the contract) can amount to economic duress only in very exceptional cases such as blackmail. (B) is incorrect because the airline's expenditure was not incurred in return for the agreement to vary the commission; it was incurred to resolve the problem with the agency's recordkeeping, so it is past consideration. (C) is incorrect because undue influence involves improper threats (or the abuse of a relationship of trust and confidence, which is not relevant here). Here, the airline's threat to terminate the agreement was both lawful and justified, so it will not be regarded as improper."},{n:52,id:"CNL013",scenario:"A constitutional convention has been called to consider the role of the royal prerogative. During the convention, the attendees are asked to define the scope of the royal prerogative powers.",q:"Which of the following best describes the scope of the royal prerogative powers?",opts:["The royal prerogative consists of powers granted by the Monarch to Parliament.","The royal prerogative consists of powers recognised in common law as belonging personally to the Monarch.","The royal prerogative consists of powers granted by Parliament to the Crown by Acts of Parliament.","The royal prerogative consists of powers granted by Parliament personally to the Monarch.","The royal prerogative consists of powers recognised by the common law as belonging to the Crown."],ans:"E",expl:"(E) The royal prerogative is a collection of powers recognised by the common law as belonging to the Crown, which include the Monarch, government ministers, and government departments. This is in contrast to statutory powers, which are granted by Parliament to the government. Therefore, (A), (B), (C), and (D) are incorrect."},{n:53,id:"BSL196",scenario:"A company was incorporated seven years ago. It has adopted the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association. It has an issued share capital of 400 ordinary £1 shares held in equal amounts by eight shareholders. This year, the company has £60,000 lawfully available to distribute as a dividend. The directors of the company adopt a resolution approving payment of a £100 per share dividend.",q:"Which of the following best states the legal position regarding the shareholders' rights with respect to the dividend?",opts:["The shareholders may adopt a special resolution increasing the amount of the dividend to include the full £60,000 lawfully available.","The shareholders may adopt an ordinary resolution increasing the amount of the dividend to include the full £60,000 lawfully available.","The shareholders have no right to alter the amount of the dividend declared by the directors.","The shareholders may reduce the amount of the dividend, but only through a special resolution adopted for that purpose.","The shareholders may reduce the amount of the dividend, through an ordinary resolution adopted for that purpose."],ans:"E",expl:"(E) The shareholders may reduce the amount of the dividend, through an ordinary resolution adopted for that purpose. The directors have the power to declare dividends out of lawfully available funds, but before the dividend may be paid, the shareholders must approve it (or approve a lesser amount) through passing an ordinary resolution. (A) and (B) are incorrect as the shareholders have no power to increase a dividend, even if there are additional funds lawfully available for that purpose. (C) and (D) are incorrect because the shareholders have the right to reduce the amount of a dividend by an ordinary resolution."},{n:54,id:"TRT007",scenario:"A walker out for a walk in the country accidentally strayed onto land belonging to a landowner, where he had no right to be. The landowner asked him to leave. The walker reacted angrily so the landowner took a gun and fired a warning shot at the walker. He only meant to frighten the walker but in fact he caused a much more serious injury.",q:"In a claim by the walker against the landowner, which of the following statements is correct?",opts:["The landowner is only liable if the walker can establish that the landowner owed him a duty of care.","The landowner has committed the tort of battery and is liable for the full extent of the injury caused to the walker.","The landowner has committed the tort of battery but is only liable for the injury he intended to cause, not for its unintended consequences.","The landowner is not liable to the walker because he acted in self-defence.","The walker has no claim because he was committing the tort of trespass."],ans:"B",expl:"(B) The landowner has committed a battery by the intentional and direct application of unlawful force to the walker. The landowner must intend his actions but need not intend to cause the injury which results. Thus, he is liable for the full extent of the injury caused to the walker. Therefore, (C) is not correct. (A) is not correct. The walker would only need to establish that a duty of care was owed to him where harm was caused to him accidentally. In this case, the landowner's actions are intentional, and the walker can rely on the tort of battery, as stated above. (D) is not correct. Self-defence applies where a person reasonably believes that he is being, or is about to be, attacked. On the facts, this may be satisfied because the walker reacted angrily. However, the force used must be reasonable and proportionate to the threat. Shooting the walker with a gun was not a reasonable and proportionate response. So, self-defence is not available. (E) is not correct. The walker was committing the tort of trespass (because he entered the land intentionally even though he did not intend to trespass). However, the mere fact that he was a trespasser does not absolve the landowner from liability. (Note that the defence of illegality does not apply. The defence of illegality prevents a claimant from basing a claim on their own illegal actions, but that is not the case here - the walker has committed only a tort.)"},{n:55,id:"CTR058",scenario:"A garage contracted with a supplier for the sale and installation of a new car maintenance ramp, which both parties were aware was required for use immediately in the garage. The date agreed for delivery of the ramp was delayed by five months, so the garage sued the supplier for lost profits from (1) their ordinary trading profit from car maintenance work during the five-month period, and (2) a proposed expansion of the garage's business to include maintaining a large fleet of prestigious chauffeur-driven cars.",q:"Will the garage be successful in its claim for loss of profit?",opts:["Yes. The supplier was in breach of contract so the garage is entitled to sue for their lost profit.","Yes. The losses suffered by the garage arose naturally from the breach by the supplier.","Yes. The losses suffered by the garage would have been in the reasonable contemplation of both the parties.","No. The garage would only be able to recover damages for the loss of their normal trading profit, but not the one-off contract.","No. The losses suffered by the garage are too remote."],ans:"D",expl:"(D) Damages for breach of contract may be recovered only for losses arising naturally from the breach and special or unusual loss which were in the contemplation of both the parties at the time the contract was made as a probable result of a breach of the contract. Normal trading profit clearly arises naturally from the supplier's breach of contract. The profit from a new line of business would have to have been in the reasonable contemplation of both the parties when they entered into the contract. There is nothing in the scenario to suggest this was the case. (A) is incorrect because, even if there is a breach of contract and the innocent party has suffered loss, that loss must not be too remote a consequence of the breach. In this scenario, the profit from the new line of business is likely to be too remote for the reasons set out above. (B) is incorrect because only the loss of profit from normal trading activity could be said to arise naturally from the breach, whereas the loss of profit from the new business is likely to be too remote as it was not in the reasonable contemplation of the parties at the time the contract was made. (C) is incorrect because it is unlikely that the loss of profit from the new contract was in the reasonable contemplation of the parties at the time the contract was made. This test is also not relevant for the loss of normal trading profit, which only requires it to have been a loss arising naturally from the breach. (E) is incorrect as the loss of the ordinary trading profit is likely to be held to be a loss arising naturally from the breach of contract by the supplier, and is therefore not too remote."},{n:56,id:"DIS195",scenario:"A solicitor is representing one of his friends in a breach of contract claim against a builder. When the friend first instructed the solicitor a little over a year ago, the solicitor prepared a letter advising the friend on the likelihood of success of the claim and noting the applicable limitation period. The header of the letter clearly stated that it is 'subject to legal advice privilege'. However, given their friendship, the letter began with a discussion of various personal matters before moving on to the likelihood of the success. In this part, the letter indicates that client may have difficulty proving the claim. The friend nevertheless instructed the solicitor to issue proceedings. In due course, the solicitor discloses the letter but asserts that it is not subject to inspection under the legal professional privilege.",q:"Which of the following best states the legal position with regard to the letter?",opts:["The letter is privileged given that it clearly states that it is 'subject to legal advice privilege'.","The letter is not privileged because parts of it do not relate to the legal proceedings.","The letter is not privileged because it is more than one year old.","The parts of the letter that relate to the solicitor's performance of their professional duties is not privileged because they admit facts that are unhelpful to the client.","The parts of the letter that relate to the solicitor's performance of their professional duties is privileged as legal advice."],ans:"E",expl:"(E) To be privileged, the document must relate to the solicitor's performance of their professional duties, at least in part. If not, the party is unlikely to be able to claim privilege. Here, the parts in the letter that outline the likelihood of the client's success and the applicable limitations period would be privileged. (A) is incorrect because there is no requirement for the privileged document to be headed in this manner. Even without the label, the letter would be privileged. Conversely, it would not be privileged even with such a heading if it did not include privileged information. In other words, how a document is labelled is not the determining factor in whether it falls within a privilege. (B) is incorrect because only the part of the letter that does not relate to solicitor-client interaction would be subject to inspection. (C) is incorrect because legal advice privilege is not restricted in this way. It starts from the date of instruction and subsists through the entire case. (D) is incorrect because the legal advice privilege will apply regardless of whether the advice points out weaknesses or strengths in a client's case."},{n:57,id:"ETH036",scenario:"A new solicitor makes a serious but unintentional error on a client's file. The new solicitor's supervising partner was on holiday when the new solicitor made the error, and she had told the new solicitor to handle things himself and use his best judgment while she was away.",q:"Did the partner breach the SRA Code of Conduct?",opts:["Yes, because the new solicitor's error was serious.","Yes, because the partner failed to effectively supervise the new solicitor's work.","No, because the new solicitor is responsible for his own error.","No, because the partner was on holiday and could not have prevented the error.","No, because the new solicitor's error was not intentional."],ans:"B",expl:"(B) In acting as a supervisor or manager to others providing legal services, a solicitor must remain accountable for the work carried out through them and effectively supervise work being done for clients. Here the supervising partner went on holiday and failed to ensure that the work being done on the client's matter would be supervised during that time. (A) is incorrect. This is not the best answer because the seriousness of the error is not the basis of the partner's breach. The partner breached the Code by failing to ensure that the work being carried out for the client was properly supervised. (C) is incorrect. Although the new solicitor is responsible for his error, the supervising partner also breached the Code by failing to supervise the new solicitor's work. (D) is incorrect. The partner had a duty to ensure that the new solicitor's work was properly supervised, and complying with this duty may have prevented the error. (E) is incorrect because it is immaterial that the new solicitor did not intend to make an error."},{n:58,id:"TRT030",scenario:"A motorist was driving his van along a road, carefully and within the speed limit. Suddenly, and without warning, a child ran into the road immediately in front of the van. The motorist was forced to swerve to avoid hitting him. The van collided with a car parked at the side of the road. There was a passenger sitting in the car. She suffered cuts and bruising and an injury to her neck caused by the impact. The passenger was afraid that she would be crushed and as a result has begun to suffer from post-traumatic stress disorder ('PTSD').",q:"In an action by the passenger against the motorist, which of the following best describes the likely outcome?",opts:["The motorist did not owe the passenger a duty of care because it would not be fair, just, and reasonable to impose a duty on him in the circumstances, so therefore the motorist would not be liable.","The motorist did owe a duty of care to the passenger in respect of all her injuries but does not appear to be in breach of that duty, so therefore the motorist would not be liable.","The motorist did not owe the passenger a duty of care because she suffered pure psychiatric harm, so therefore the motorist would not be liable.","The motorist did owe the passenger a duty of care because she suffered pure psychiatric harm but was a primary victim, having been in the actual area of danger, so therefore the motorist would be liable.","The motorist did not owe the passenger a duty of care in respect of her PTSD, so therefore the motorist would not be liable in respect of that loss but would be liable in respect of her physical injuries."],ans:"B",expl:"(B) The motorist owed the passenger a duty of care. However, on the facts, he was driving carefully and within the speed limit, and appears to have responded reasonably to the actions of the child. Therefore, he does not appear to have fallen below a reasonable standard of care and would not be in breach of duty. Therefore, he is not likely to be liable. (A) is not correct. It is likely that the motorist would not be liable - but this choice does not give the correct reason. The motorist did owe the passenger a duty of care - driver to other road users is an established duty situation. However, the motorist does not appear to be in breach of that duty, as discussed above. (C) is not correct. It is likely that the motorist would not be liable, but this choice does not give the correct reason. The passenger did not suffer pure psychiatric harm. The PTSD which she suffered was psychiatric harm consequential on her physical injuries. The ordinary rules for duty of care apply, and a duty is owed. However, the motorist does not appear to be in breach of that duty, as discussed above. (D) is not correct. It is correct to say that a duty of care was owed, but it is not correct to identify this as a duty in respect of pure psychiatric harm, because the passenger's PTSD was consequent on her physical injuries. Also, the fact that a duty of care is owed does not, by itself, establish that the motorist would be liable. On the facts, the motorist does not appear to be in breach of duty. (E) is not correct. The motorist owed the passenger a duty of care in respect of all her injuries, including the PTSD. However, he does not appear to have breached that duty, as discussed above. Therefore, he is not likely to be liable for any of the passenger's injuries."},{n:59,id:"CTR063",scenario:"A manufacturer supplied some parts to a plumber for a plumbing project. The plumber specifically notified the manufacturer that the parts needed to be compatible with the plumbing system he was using for the project. The parts provided by the manufacturer were not compatible, and after installation they caused the plumbing system to malfunction.",q:"On what basis could the plumber make a claim against the manufacturer?",opts:["It was an express term of the contract that the parts must be compatible with the plumbing system.","It was an express term of the contract that the parts must be fit for purpose.","It was an implied term of the contract under the Sale of Goods Act 1979 that the parts must be fit for purpose.","It was an implied term of the contract under the Consumer Rights Act 2015 that the parts must be fit for purpose.","It was an implied term of the contract under the Supply of Goods and Services Act 1982 that the parts must be fit for purpose."],ans:"C",expl:"(C) Under the Sale of Goods Act 1979, when a seller sells goods in the course of a business and the buyer, expressly or by implication, makes known to the seller any particular purpose for which the goods are being bought, there is an implied term that the goods supplied under the contract must be reasonably fit for that purpose, whether or not that is a purpose for which such goods are commonly supplied. (There is also an implied term that the goods must be of satisfactory quality, that is, fit for the purpose for which such goods are generally used, but that is less likely to help the plumber in this case.) (A) is incorrect because, whilst the plumber's requirement might have been eventually incorporated into the contract as an express term, this is not clear in the scenario and is much less likely, particularly if they were dealing on standard terms and conditions. (C) is therefore the better answer as there is no doubt about terms implied by statute: they are incorporated automatically. (B) is incorrect for the same reason. (D) is incorrect as the scenario is clear that both parties are dealing in the course of business, so the correct statute is the Sale of Goods Act 1979. The Consumer Rights Act 2015 deals with contracts as between a business and a consumer. (E) is incorrect because the Supply of Goods and Services Act 1982 is relevant to the contracts for the hire of goods and goods supplied as part of a supply of services. Therefore, it is not relevant to the facts of this scenario."},{n:60,id:"DIS244",scenario:"A solicitor intends to issue court proceedings for damages for breach of contract. The claim is worth less than £50,000.",q:"Which of the following statements best describes how the claimant should start the proceedings?",opts:["The solicitor should send the claim form by first class post to their local county court for issue.","The solicitor should take the claim form for issue in person to the local county court.","The solicitor should send the claim form to the County Court Money Claims Centre (CCMCC) in Salford to issue the claim form.","The solicitor should send the claim form by special delivery to the local county court.","The solicitor should send the claim form to their local High Court district registry that will issue the claim form and determine which court to allocate the claim."],ans:"C",expl:"(C) There is now one County Court issuing centre based in Salford, the CCMCC, and all claims are issued from this court. (A), (B), and (D) are incorrect because the prescribed process for issue in the County Court is now through the bulk issuing centre in Salford. (E) is incorrect because it would be inappropriate for the claimant to issue in the High Court bearing in mind its value."},{n:61,id:"CNL107",scenario:"A newspaper reveals that the Secretary of State for Defence owns shares in a company that just won a £3 billion contract to provide equipment for the British Army.",q:"Which of the following best explains the position of the Secretary of State?",opts:["The Secretary of State must account to the Prime Minister for their actions.","The Secretary of State has failed to take responsibility for the actions of their department and must resign.","The Secretary of State has not violated any law or convention on these facts.","The Secretary of State has a serious conflict of interests and will likely need to resign from government.","The Secretary of State has a serious conflict of interests and so must resign as an MP."],ans:"D",expl:"(D) Because there is a serious conflict of interests between the Secretary of State's private interests and their ministerial duties, the Secretary of State will likely need to resign from government. Ministers are required to avoid such conflicts of interest. Consequently, the Secretary of State would likely be expected to resign and (C) is incorrect. (A) is incorrect because it is not the best answer. On these facts, the Secretary of State is likely to be required to do more than merely give an explanation to the Prime Minister. (B) is incorrect because there is no evidence that the Secretary of State's department acted incorrectly or that the Secretary of State failed to account for the department's actions. (E) is incorrect because ministerial resignations usually relate only to their position within the government; their seat in the House of Commons (or the House of Lords) is unaffected."},{n:62,id:"BSL053",scenario:"An entrepreneur has a brilliant idea for a business. She wants to get started straight away with all the contracts required to start the business. She also wants to start preparing the necessary documentation to incorporate the company with limited liability status. She is concerned, however, about the impact of executing contracts prior to the company coming into existence.",q:"Under which of the following circumstances would the promoter be relieved of personal liability on contracts entered into whilst engaged in forming the company?",opts:["When the promoter indicates on the contract that he is contracting on behalf of the company to be formed.","When the company unknowingly accepts the benefits of the contract.","When the contracting party verbally agrees to relieve the promoter of personal liability.","When the third party, the company, and the promoter enter into an agreement to substitute the company for the promoter.","When the company does not end up coming into existence."],ans:"D",expl:"(D) A promoter will be personally liable on a pre-incorporation contract, but there are a number of ways the promoter can protect themselves in these circumstances, one of which is when the third party, the company, and the promoter enter into an agreement to substitute the company for the promoter, that is, enter into a novation agreement. (A) is incorrect as prior to incorporation a company does not have legal existence, and therefore does not have contractual capacity to enter into a contract. A promoter will be personally liable on the contract even if he indicates he is contracting on behalf of the company to be formed. (B) is incorrect as a company is incapable of accepting the benefit of the contract unknowingly. The benefit of a contract could be assigned to the company, but it would be required to be done in writing. (C) is incorrect as the verbal agreement of the contracting party would not be sufficient to relieve the promoter of personal liability. This would need to be done by way of a novation of the contract, and this is required to be done in writing with the contracting party, the promoter, and the company all signing. (E) is incorrect because the promoter will be personally liable on a contract whether or not the company ends up coming into existence."},{n:63,id:"CNL177",scenario:"An author believes that a public authority violated her freedom of expression under the European Convention on Human Rights by prohibiting the publication of her book. However, the author fears bringing a claim against the public authority due to the attention she might receive. Therefore, the author asks her friend to bring the claim on her behalf.",q:"Which of the following reasons best explains why the friend cannot bring the case before the courts?",opts:["The author's case is weak on the merits.","The courts have discretion over whether to hear the case, and they are unlikely to be in favour in this instance.","The public authority is immune from claims alleging the violation of human rights.","The friend is not a 'victim'.","The friend does not have a sufficient interest."],ans:"D",expl:"(D) The friend cannot bring this case before the courts because the friend is not a 'victim', and thus lacks standing. Claims against public authorities for a breach of human rights can be brought only by the victim of the alleged action (that is, someone directly affected by the alleged conduct). Otherwise, there is no standing. Thus, an action cannot be brought on behalf of someone else. (A) is incorrect because the court cannot hear the case and get to the merits unless there is standing. Additionally, we do not have sufficient facts to make such a judgment on this issue. (B) is incorrect because the courts do not have discretion over whether to hear a case that lacks standing. (C) is incorrect because under the Human Rights Act 1998, people can bring claims against public authorities for the breach of a human right. (E) is incorrect because it states the more general standing test used for judicial review claims."},{n:64,id:"TRT102",scenario:"A football player became ill soon after consuming sunflower seeds manufactured by a snack company. The package of seeds was inspected, and foreign matter was discovered on the seeds.",q:"In an action by the football player against the snack company in respect of his illness, which of the following will be most helpful to the snack company in defending the claim?",opts:["The foreign matter on the seeds was a rare mould, and the snack company was aware of the risk of such mould but was unable to avoid it because the mould could not be detected by tests commonly used for establishing that sunflower seeds are safe for human consumption.","The seeds were sold in their natural state.","The football player has acknowledged that he has no evidence that his illness was caused by the foreign matter on the seeds.","There is no evidence that the snack company breached its duty of care to the football player.",'The packet of sunflower seeds had the following wording on the back: "This is a natural product. Accordingly, no liability can be accepted for any injury or illness caused by eating it".'],ans:"C",expl:"(C) The football player's acknowledgment of no evidence of causation would be the snack company's best defence. The football player would pursue his claim under the Consumer Protection Act 1987 ('CPA'). The snack company, as producer of the product, is an appropriate defendant. To succeed in a claim, the footballer must show that he has suffered damage caused by a defect in a product. Although he may be able to show that the sunflower seeds were defective, he does not have evidence to show that this defect was the cause of the damage which he suffered. Therefore, he has not established all the elements for a successful claim. (A) is not correct. Liability under the CPA is strict, so it would not help the snack company to show that it was not at fault in not discovering the mould. There is a defence under the CPA where the state of scientific and technical knowledge was not such that the producer might be expected to have discovered the defect (the 'state of the art' defence). However, this defence has been narrowly interpreted and is not available where the risk is known about but cannot be avoided. So, on the facts, this defence would not be available to the snack company. (B) is not correct. If damage was caused by a defect in the product, the fact that the product (sunflower seeds) were sold in their natural state would not assist the snack company. (D) is not correct. Liability under the CPA is strict. It does not depend on establishing that the snack company was in breach of a duty to take reasonable care. (E) is not correct. Liability under the CPA cannot be excluded."},{n:65,id:"DIS181",scenario:"A dental patient is the victim of malpractice. Because of negligent treatment provided by a dentist, the patient required four crowns. Because the patient is 23 years old, the crowns will need to be replaced several times throughout the patient's life. The patient instructed a solicitor to issue a claim against the dentist. The solicitor calculated present and future damages for the cost of the crowns and the time the patient will need to take off from work at about £47,500. The claimant also suffered some pain, but she is averse to claiming compensation for that and instructs the solicitor not to include it. Without the claim for pain and suffering, the solicitor estimates damages at about £60,000, including interest and costs. The solicitor issues proceedings in the County Court.",q:"To which track will the court likely allocate the case?",opts:["The small claims track.","The fast track.","The multi-track.","The court will not allocate the case to a track but will instead transfer it to the County Court Money Claims Centre, as there is no claim for personal injury.","The court will not allocate the case to a track but will instead transfer it to the High Court, as it is a malpractice claim for more than £50,000."],ans:"C",expl:"(C) The case will be allocated to the multi-track. Claims in the County Court for more than £25,000 are allocated to the multi-track. (A) is incorrect because the small claims track is for cases involving less than £10,000 (or personal injury claims for less than £1,000). (B) is incorrect because the fast track is used for cases of more than £10,000 (or more than £1,000 for personal injury claims) and up to £25,000. (D) is incorrect, as the County Court Money Claims Centre handles debt claims and does not handle cases for damages such as the claim here. (E) is incorrect for a few reasons. First, the High Court usually does not hear cases involving less than £100,000 or where the claimant does not expect to recover at least £50,000 for a personal injury. Neither of those thresholds are met here - the claimant has chosen not to pursue damages for pain and suffering (and even if the patient pursued the claim, it was for less than £50,000). It should be noted that even if a malpractice claim for £50,000 were the threshold, the amount would not be met here because when determining the value of a claim, interest and costs are excluded. The claim here without interest and costs was £47,500."},{n:66,id:"LGS055",scenario:"A solicitor is looking after the files of a colleague while the colleague is on holiday. One of the colleague's clients is involved in a transaction to purchase a company in Birmingham. The solicitor takes a call from the Birmingham-based solicitor who is acting for the company. The other solicitor is concerned about the lack of progress on the matter and wants an urgent update as to why there has been a delay. The solicitor flicks through the file and notices that her colleague has made a suspicious activity report about her client to their firm's Money Laundering Reporting Officer ('MLRO'). The solicitor passes this information on to the other solicitor because she thinks that the other solicitor may need to notify his own MLRO about the transaction. The solicitor then returns to working on her own clients' matters.",q:"Which of the following best describes whether the solicitor has committed an offence under the Proceeds of Crime Act 2002?",opts:["The solicitor has committed the offence of failure to report because she should have made her own suspicious activity report about the client to the MLRO.","The solicitor has committed the offence of tipping off because she disclosed her colleague's suspicious activity report to the other solicitor.","The solicitor has not committed the offence of tipping off because she can rely on the defence of disclosure within an undertaking.","The solicitor has not committed an offence because the disclosure was oral rather than in writing.","The solicitor has not committed the offence of tipping off because she can rely on the defence of disclosure between institutions."],ans:"E",expl:"(E) The solicitor has not committed the offence of tipping off because she can rely on the defence of disclosure between institutions. The indirect offence of tipping off can arise where there is a disclosure to a third person that a suspicious activity report has been made to the police, HM Revenue and Customs, the National Crime Agency, or the firm's MLRO if that disclosure might prejudice any investigation that might be carried out. However, a legal professional will not commit a tipping off offence if (1) the disclosure is made to another legal professional in a European Economic Area state; (2) the disclosure relates to a client or former client of both parties, or a transaction involving them both; (3) the disclosure is made for the purpose of preventing a money laundering offence; and (4) both parties have equivalent professional duties of confidentiality and protection around personal data. Here, the solicitor disclosed her colleague's suspicious activity report to the other solicitor, which could constitute tipping off. However, the solicitor may rely on the defence of disclosure between institutions. The disclosure was made to another lawyer in the UK (a European Economic Area state), the disclosure related to a transaction involving them both, the disclosure was made to prevent the other solicitor committing his own money laundering offence (that is, failure to report), and both parties are in the UK and have equivalent professional duties of confidentiality. (A) is incorrect because the relevant offence here is tipping off, not failure to report. In any event, the solicitor has no independent suspicions about her colleague's client's involvement in money laundering and therefore does not need to make her own report to the MLRO. (B) is incorrect because, as explained above, the solicitor has not committed the offence because a defence is available. (C) is incorrect because the applicable defence here is disclosure between institutions rather than disclosure within an undertaking. The latter defence would be available if the other solicitor worked within the same organisation as the solicitor. (D) is incorrect because the disclosure in a tipping off offence may be in writing or oral."},{n:67,id:"LGS087",scenario:`A solicitor is at a birthday party for her aunt. One of her cousins approaches the solicitor at the bar. The cousin explains that she is thinking about selling her company to a competitor. The competitor intends to buy 100% of the shares in the cousin's company for £750,000. The cousin asks the solicitor for advice on whether this sale is a good idea. The solicitor is not authorised by the Financial Conduct Authority to carry on a "regulated activity" as defined in the Financial Services and Markets Act 2000 and related secondary legislation.`,q:"Can the solicitor give the requested advice about the sale?",opts:["Yes, because selling shares in a private business is not a specified investment.","Yes, because the solicitor can rely on the takeover exclusion.","No, because the solicitor would be advising on a specific investment and no exclusion applies.","No, because the solicitor is not authorised by the Financial Conduct Authority.","Yes, because the solicitor is at a social event and so would not be advising by way of business."],ans:"E",expl:`(E) The solicitor can give the requested advice about the sale because she is at a social event and so would not be advising by way of business. Under the general prohibition of the FSMA, a solicitor cannot carry out a regulated activity unless authorised or exempt from authorisation. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. For a solicitor, "in the course of business" generally means the activity is carried out for a client as part of their legal work, rather than one carried out in their personal capacity. Here, the solicitor has been asked to provide advice (a specified activity) on the sale of her cousin's company's shares (a specified investment). However, since she is at a social event in her personal capacity and the cousin is not a client, the solicitor would not be carrying on a specified activity in relation to a specified investment in the course of business. Therefore, there is no regulated activity in breach of the general prohibition. (A) is incorrect because shares are a specified investment whether the relevant company is public or private. (B) is incorrect because the solicitor has no need to rely on an exclusion as the "in business" element of the regulated activity definition has not been met. (C) is not correct because, as explained above, while the solicitor would be advising on a specified investment, the "in business" element of the regulated activity definition has not been met. (D) is incorrect because the solicitor is not carrying on a regulated activity and therefore has no need to be authorised.`},{n:68,id:"BSL139",scenario:"A group of five friends set up a partnership a number of years ago. One partner wishes to leave the partnership, with the agreement of the other two. The partners notify existing creditors of the partner's retirement and publish notice of the partner's retirement in the London Gazette.",q:"Which of the following best describes whether the retiring partner will continue to be liable for debts incurred by the partnership?",opts:["The retiring partner will be liable for all pre- and post-retirement debts.","The retiring partner will not be liable for any pre- or post-retirement debts.","The retiring partner will be liable for all pre-retirement debts, but will be liable for post-retirement debts to existing creditors only.","The retiring partner will not be liable for any pre-retirement debts, but will be liable for post-retirement debts to existing creditors only.","The retiring partner will be liable for pre-retirement debts, but will not be liable for any post-retirement debts."],ans:"E",expl:"(E) A partner will always be liable for partnership debts incurred whilst they were a partner, but they can avoid liability for debts incurred post-retirement if they give notice of their retirement. The partner should give actual notice to people who have dealt with the partnership whilst they were a partner and should put a notice in the London Gazette to alert people who have never dealt with the partnership whilst they were a partner. Because the retiring partner has followed the necessary notice procedures they will not be liable for post-retirement debts. (A) is incorrect as the retiring partner will not be liable for post-retirement debts because they gave the correct notice to creditors. (B) and (D) are incorrect because a partner is always liable for pre-retirement debts (unless the third party agrees otherwise). (C) is incorrect because a retiring partner can avoid liability to any existing or future creditor of the partnership by giving notice."},{n:69,id:"CNL097",scenario:"A man and a woman meet in the following places.",q:"Which one would qualify as a public assembly?",opts:["In the garden of a friend's house.","In a pub.","In a shop.","In an office.","In a park."],ans:"E",expl:"(E) Only the meeting in the park would qualify as a public assembly. This is because a public assembly is defined as an assembly of two or more persons in a public place which is wholly or partly in the open air. (A), (B), (C), and (D) are incorrect because those locations are either private or not in the open air."},{n:70,id:"CTR128",scenario:"Before entering into a contract to sell their house, the sellers tell the buyers that there are no planning applications to build on the adjoining field. Unknown to the sellers, an application to build on the field was submitted the day before they made the statement. The buyers relied on the statement in deciding to enter into the contract.",q:"What remedies are available to the buyers for misrepresentation?",opts:["The buyers can rescind the contract, but they cannot claim damages unless they can prove that the sellers knew of the planning application when they made the statement.","The buyers cannot rescind the contract, but they can claim damages unless the sellers can prove that they had reasonable grounds for believing, and did believe, that the statement was true.","The buyers can rescind the contract, and they can claim damages unless the sellers can prove that they had reasonable grounds for believing, and did believe, that the statement was true.","The buyers can rescind the contract, and they can claim damages but only if they can prove that the sellers acted negligently in making the statement.","The buyers can rescind the contract or claim damages only if they can prove that the sellers knew of the planning application when they made the statement."],ans:"C",expl:"(C) This is a case of negligent or innocent misrepresentation. In this situation, the innocent party can always rescind the contract, unless one of the bars to rescission applies or the court orders damages in lieu of rescission (which is unlikely here because of its significance to the buyers). The innocent party can claim damages unless the other party can prove that they had reasonable grounds for believing, and did believe, that the statement was true. That might be the case here if the sellers had no way of knowing of the planning application when they made the statement to the buyers. In that case the misrepresentation would be innocent rather than negligent. (A) is not correct, because it is not necessary to prove that the sellers knew of the planning application in order to claim damages. That would be tantamount to fraudulent misrepresentation, but that is not the only situation in which damages are available. (B) is not correct because rescission is available for both innocent and negligent misrepresentation. (D) is not correct because the innocent party does not have to prove negligence: it is for the other party to disprove it. (E) is incorrect because both rescission and damages may be available even though the representation was not fraudulent."}],J1=[{n:71,id:"BSL148",scenario:"Two friends set up a partnership 15 years ago to provide a home delivery ready meals service. Each partner invested £5,000 capital which was used to buy a delivery van, catering equipment, and raw materials. One partner agreed to allow the business to use an industrial unit they owned, free of charge, to prepare the meals. The business was such a success that 10 years ago the partners took on another partner. It was agreed that the new partner would contribute a shop unit he owned, in lieu of a capital contribution, so that the business could sell its ready meals from the shop.",q:"Which of the assets are partnership property?",opts:["The delivery van only.","The shop and the delivery van only.","The delivery van and the industrial unit only.","The delivery van, the industrial unit, and the shop.","The shop and the industrial unit only."],ans:"B",expl:"(B) The shop and delivery van are partnership property. Property will be considered partnership property if it was brought into the partnership with the intention that it would be partnership property. Property purchased with partnership funds will usually be considered partnership property, and the van was bought with partnership money. Whilst the shop unit was not purchased with partnership funds, the parties made it clear that it was to be the incoming partner's contribution to the partnership. Capital contributions become partnership property because that is the purpose of a capital contribution. The industrial unit, on the other hand, is not partnership property because it belonged to one of the partners and he merely said he would allow the partnership to use the unit (as opposed to saying he would contribute the unit). It follows that the other choices are incorrect."},{n:72,id:"BSL063",scenario:"A woman inherited a majority of the shares of a small, private limited company. The board of directors were happy to register her as owner of the shares, and she has attended and voted at several general meetings of shareholders. However, recently, upon reviewing the company's articles of association, the woman noticed that a quorum is required for shareholder meetings. Concerned that the resolutions passed at meetings she has attended may not be valid, she is keen to find out what 'quorum' means.",q:"Under the Companies Act 2006, what does it mean for there to be a quorum at a shareholders' meeting?",opts:["That a majority of shareholders entitled to vote on a resolution have placed a vote either for or against the matter.","That a majority of shareholders entitled to vote on a resolution have voted in favour of the resolution.","That all of the shareholders entitled to vote on a resolution have unanimously voted in favour of the resolution.","That two or more shareholders entitled to vote were present at the meeting before a vote on the resolution took place.","The rules relating to quorums are not governed by the Companies Act 2006; this is a matter to be determined by the company's articles of association."],ans:"D",expl:"(D) A quorum must attend a shareholders' meeting before a vote may validly be taken. Pursuant to the Companies Act 2006, but subject to any contrary provision in the company's articles, two members present at a meeting will constitute a quorum. (A), (B), and (C) are incorrect as the amount of votes in favour of the resolution ultimately will determine if a matter is approved, but that is a separate issue from the quorum issue. (E) is incorrect as the Companies Act 2006 contains statutory requirements regarding a quorum. These provisions can be overridden by a provision in the articles, but if the articles are silent on quorums, the statutory rules will apply.",note:'This question appears twice in the source document (on two consecutive pages, both numbered "72 of 90"); it is reproduced once here.'},{n:73,id:"ETH045",scenario:"A solicitor's husband and the husband's business partner want to instruct the solicitor in setting up their new business venture. Although the husband and the business partner are amicable on most issues, there will be some negotiation involved.",q:"Which of the following statements best describes whether the solicitor should act?",opts:["The solicitor should act because clients are free to instruct a solicitor of their choice.","The solicitor should decline to act because there is a significant risk of an own interest conflict.","The solicitor should act because the husband and the business partner have a substantially common interest.","The solicitor can act provided she explains the risks to both the husband and the business partner and obtains their written consent.","The solicitor can act provided she explains the risks to the business partner and obtains their written consent."],ans:"B",expl:"(B) The solicitor's own personal interest and relationship with the husband create an own interest conflict in this matter (or a significant risk of one) and so this solicitor should decline to act. Of concern is that the solicitor could be tempted to act in her husband's favour in the negotiations. The solicitor also has a financial interest in the matter because she is married to the husband. (A) is incorrect because the solicitor must decline to act due to the own interest conflict. (C) is incorrect because the 'substantially common interest' exception is only relevant to conflicts between clients, and here the main concern is the solicitor's own interest conflict. (D) and (E) are incorrect because the solicitor cannot act even with consent."},{n:74,id:"ETH117",scenario:"A newly qualified solicitor is in court. The opponent's representative fails to mention a case which is relevant and supports their position. The solicitor explains to his supervisor that the other representative has made this mistake and inadvertently weakened their case. The supervisor tells him to forget about the omission.",q:"Does the solicitor have a duty to draw the court's attention to the case?",opts:["Yes, because the case is relevant and likely to have a material effect on the outcome of the proceedings.","No, because the supervisor advised him not to do so.","No, because a solicitor is entitled to assume that the court is aware of all relevant cases.","No, because a solicitor does not have a duty to remedy the omissions and mistakes made by other parties.","No, because disclosing the case would not be in the client's best interests."],ans:"A",expl:"(A) The SRA Codes provide that a solicitor must draw the court's attention t
