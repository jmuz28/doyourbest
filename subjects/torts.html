<script>
const D={"t": ["Negligence: duty of care and breach", "Negligence: causation, remoteness and loss", "Negligence: remedies, economic loss and psychiatric harm", "Defences", "Vicarious liability and employers' liability", "Occupiers' liability", "Product liability", "Nuisance and Rylands v Fletcher"], "q": [{"ch": 0, "n": 1, "sc": ["A man drives his vehicle along a dual carriageway intending to take the first exit at the roundabout leading off the dual carriageway. When he gets to the roundabout there is a queue of stationary traffic. The traffic moves off slowly and he follows the car in front. Checking the roundabout, he sees it is clear and accelerates onto it. The car in front has stopped as the traffic has slowed down and is now stationary and as a result the man drives his vehicle into a collision with the rear of this vehicle."], "st": "Is the man likely to be in breach of his duty of care?", "o": ["No, the car in front should have moved onto the roundabout.", "Yes, but only if it can be proved that it is fair and reasonable.", "No, whilst the man owes a duty of care, he has not breached his duty as there is no proximity between the parties.", "Yes, road users owe other road users an established duty of care and by failing to concentrate and colliding with the vehicle in front the man has breached that duty.", "No, the collision was not reasonably foreseeable and as such there is no breach of duty."], "a": "D", "bx": "The correct answer was D. This is because there is an established duty of care between road users. By failing to keep a safe distance and not concentrating on the vehicle in front the court will likely find that the driver has breached his duty of care. Watch out for situations where there is an established duty of care. There is no need to consider the Caparo three-stage test. A is wrong because the traffic was queueing and it was not possible for the car to proceed. B is wrong because there is an established duty of care between road users and whether it is fair and reasonable relates to a situation where there may not already be an established duty of care. C is wrong because as there is an established duty of care between the parties there is no need to consider proximity. E is wrong because there is an established duty of care and foreseeability in respect of that duty of care is not relevant."}, {"ch": 0, "n": 2, "sc": ["A group of children (aged 13 years) are playing on skateboards at a skate park. One group of children (skaters) are taking it in turns to skate down the ramps at the park whilst another group of children (runners) run in front of them. The aim of the game is for the 'runners' to get from one side of the park to the other without the 'skaters' having to stop or swerve out of the way. One of the runners collides with a skater, causing the skater to fall and fracture his left leg and right arm."], "st": "In assessing the negligence of the child that caused the injury, which of the following is the most accurate statement of what the court will consider?", "o": ["Whether a reasonable person would have foreseen the likelihood of harm.", "Whether a reasonable prudent adult would have realised that there was risk of injury.", "Whether a reasonable 13-year-old would have realised that there was risk of injury.", "Whether a reasonable prudent child would have realised that there was risk of injury.", "Whether the risk of injury was such that a child, irrespective of their age, would have foreseen the likelihood of harm."], "a": "C", "bx": "The correct answer was C. This is because the court would consider the standard of care expected by a child of similar age, ie 13 years old. This is one of the categories where there is a special standard of care. A is wrong because the court will take into consideration the child's age and not that of a 'reasonable person'. B is wrong because the child is not a reasonably prudent adult. D is wrong because the court will always take into consideration the child's age. E is wrong because the court will consider the standard of care expected by a 13-year-old child."}, {"ch": 0, "n": 3, "sc": ["The fire service is responding to an emergency call. The employee of the fire service driving the fire engine is travelling at 50mph in a 30mph zone. The fire engine is displaying sirens and lights to alert other road users of its presence. The fire engine is travelling on a long straight carriageway at the end of which is a traffic light-controlled junction. The lights are on red for the approaching fire engine. As the road appears clear the driver of the fire engine does not slow down but continues through the red light. Suddenly a vehicle enters the junction from the right and collides with the fire engine."], "st": "Which of the following is the most accurate statement as to what the court will take into consideration in determining the standard of care owed by the fire service's employee?", "o": ["The social value of responding to an emergency.", "The experience of the fire service's employee.", "The cost of taking precautions.", "The seriousness of the claimant's injuries.", "The liability of the other driver."], "a": "A", "bx": "The correct answer was A. This is because there is social value in attending to an emergency. Even though the court will take this into consideration, they are unlikely to conclude that the fire service's driver was reasonable in failing to slow down at the traffic light-controlled junction. The benefit of getting to the emergency quicker does not outweigh the risk of causing the collision. So, whilst the court will consider the social value, they may still find the defendant liable. B is wrong because the standard of care (road user driving an emergency vehicle) is not affected by the experience of the claimant. C is wrong because cost of taking precautions is not relevant to the issues. D is wrong because seriousness of injuries is not taken into consideration when deciding whether the claimant owed a duty of care. E is wrong because the question asks about the duty of care owed by the fire service's employee not the fault of the other driver."}, {"ch": 0, "n": 4, "sc": ["A patient attends the accident and emergency department of the local hospital complaining of symptoms of a blood clot in his lungs. The treating doctor (newly qualified and in his first week at the hospital) examines the patient but does not identify that he has suffered a blood clot in his lungs. The doctor fails to administer medication which would treat the condition and, as a consequence, the patient dies."], "st": "In considering whether the treating consultant was negligent, which of the following is the most accurate statement of what the court will consider?", "o": ["Whether the patient gave the requisite consent for the treatment.", "Whether a majority of medical professionals would have identified the patient's condition.", "Whether a responsible body of medical experts would have identified the patient's condition.", "Whether a responsible body of newly qualified doctors would have identified the patient's condition.", "Whether a majority of newly qualified doctors would have identified the patient's condition."], "a": "C", "bx": "The correct answer was C. This is because the court considers whether a responsible body of medical experts would have identified the patient's condition. If so, the doctor will have fallen below the standard of care and be in breach of his duty of care. Watch out for the level of experience. Remember that the court will judge a junior doctor to the same standard of care as a fully qualified senior doctor if that is what the role at the hospital purports to be. A is wrong as, irrespective of whether the patient consented to any treatment, the doctor fell below the standard of care expected. B is wrong because the test does not refer to a 'majority' of medical professionals. D is wrong because the court will not take into account the doctor's lack of experience. E is wrong because the court will consider whether a responsible body of medical experts would have ascertained the claimant was suffering with a blood clot."}, {"ch": 0, "n": 5, "sc": ["A woman consults her doctor before becoming pregnant. She is negligently advised that she does not carry a specific genetic condition (haemophilia). Relying on this advice, she becomes pregnant and gives birth to a child who suffers from both haemophilia and an unrelated neurodevelopmental disorder (autism). The doctor accepts liability for the harm caused by the haemophilia but denies liability for the autism."], "st": "What principle will the court apply in deciding the scope of the doctor's liability?", "o": ["A defendant is liable for all foreseeable consequences of their negligence, regardless of the purpose of their advice.", "A defendant is only liable for harm that falls within the scope of the duty of care they undertook to perform.", "Once negligence is established, the defendant is liable for all physical harm suffered by the claimant.", "A medical professional owes a duty of care for all risks associated with pregnancy, whether advised upon or not.", "A defendant who gives negligent advice is liable for any harm that results from reliance on that advice."], "a": "B", "bx": "The correct answer is B. A defendant is only liable for harm that falls within the scope of the duty of care they undertook to perform. This correctly reflects the approach in Khan v Meadows [2021] UKSC 21 and Manchester Building Society v Grant Thornton [2021] UKSC 20 focusing on the scope and purpose of the duty, not just foreseeability or factual causation. A is incorrect because foreseeability alone is not sufficient to establish liability. The courts also consider the purpose of the professional advice. In negligence, harm must fall within the scope of the duty the defendant assumed. C is incorrect because not all physical harm is compensable unless it is within the scope of the duty breached. Negligence is not an all-or-nothing rule: causation and scope of duty must align. A doctor is not liable for every resulting harm simply because some advice was negligent. Only the relevant, targeted risk matters. D is incorrect as a duty of care in a professional context is specific to the purpose of the consultation or advice. It is not a blanket duty for all pregnancy-related risks. In this case, the duty was to advise on the risk of a specific genetic condition, not every conceivable risk of pregnancy. E is incorrect as the court will distinguish between harm that is within the scope of the advice and harm that is merely a consequence of reliance. Even if the claimant relied on the advice, liability is limited to harm the advice was meant to prevent. In this case, autism was outside that purpose."}, {"ch": 0, "n": 6, "sc": ["A company's auditors negligently prepare its annual statutory accounts, overstating profits. An investor, who already holds a few shares, reads the published accounts and buys a large further shareholding, which loses value when the true position emerges. The auditors did not know of the investor or of any plan to buy shares."], "st": "Is the investor likely to establish that the auditors owed him a duty of care?", "o": ["No, because the loss suffered is personal injury rather than financial loss.", "Yes, because it was reasonably foreseeable that investors would read and rely on published accounts.", "No, because statutory accounts are prepared for shareholders as a body to oversee the company, so there is insufficient proximity and it would not be fair, just and reasonable to impose a duty to individual investors.", "Yes, because auditors owe an established duty of care to anyone who relies on their work.", "Yes, because the investor was already a shareholder at the time he read the accounts."], "a": "C", "x": ["Wrong. The loss is financial, not personal injury; this does not answer the duty question.", "Wrong. Foreseeability is only the first stage of the Caparo three-stage test; proximity and fairness are also required.", "Correct. This is a novel situation where the Caparo test applies; as in Caparo v Dickman, there is insufficient proximity and it is not fair, just and reasonable to impose a duty to an investor making a new purchase.", "Wrong. Auditor/investor is not an established duty situation; the Caparo test must be applied.", "Wrong. Being an existing shareholder did not create proximity for the purpose of a fresh investment decision in Caparo."]}, {"ch": 0, "n": 7, "sc": ["A patient suffers brain damage after a doctor decides not to intubate her. At trial the doctor calls expert evidence that a responsible body of doctors would also not have intubated. The judge finds that this body of opinion did not weigh up the comparative risks and benefits and cannot withstand logical analysis."], "st": "Which statement best reflects the court's approach to breach of duty?", "o": ["The doctor cannot be in breach because a responsible body of medical opinion supports his decision.", "The court may find the doctor in breach because a body of opinion that cannot withstand logical analysis need not be accepted.", "The doctor will not be in breach because his inexperience must be taken into account.", "The doctor will be in breach only if a majority of doctors would have intubated.", "The court will apply the standard of a reasonable person rather than a reasonable doctor."], "a": "B", "x": ["Wrong. Under Bolitho, the court is not bound to accept expert opinion simply because it exists.", "Correct. Bolitho qualifies the Bolam test: the body of opinion must have a logical basis.", "Wrong. Inexperience does not lower the standard of care; and nothing suggests the doctor was inexperienced.", "Wrong. The test is a responsible body of opinion, not a majority.", "Wrong. Professionals are judged against the standard of a reasonably competent member of that profession."]}, {"ch": 0, "n": 8, "sc": ["A pregnant woman with diabetes asks her obstetrician about the risks of vaginal delivery. The obstetrician does not mention a small but significant risk of shoulder dystocia, because she believes the woman would then request a caesarean section. The risk materialises and the baby is injured."], "st": "Which statement best reflects the doctor's duty in relation to advice on risks?", "o": ["The doctor has no duty to advise where the patient has not expressly asked about the specific risk.", "The doctor need not disclose risks below 1%.", "The doctor must disclose any material risk that a reasonable person in the patient's position would attach significance to, or that the doctor knows this patient would.", "The doctor need disclose only risks a responsible body of medical opinion would disclose.", "The doctor may withhold information whenever she considers a caesarean to be against the patient's interests."], "a": "C", "x": ["Wrong. The duty to take reasonable care to disclose material risks applies whether or not the patient asks.", "Wrong. There is no fixed percentage threshold; materiality depends on the patient.", "Correct. This is the Montgomery test of material risk for advice on treatment.", "Wrong. Montgomery replaced the Bolam approach for the disclosure of risks.", "Wrong. The therapeutic exception is narrow and does not allow a doctor to withhold risks simply to steer a patient's choice."]}, {"ch": 0, "n": 9, "sc": ["A pedestrian is walking past a warehouse when a sack of flour falls from an upper-floor loading door and injures him. No one saw how the sack came to fall. The warehouse and its hoist are under the exclusive control of the defendant's employees."], "st": "How is the court likely to approach the question of breach?", "o": ["Breach is presumed only if the defendant's employees were inexperienced.", "The claim must fail because the claimant cannot identify the negligent act.", "The claimant may rely on res ipsa loquitur, so the court may infer negligence unless the defendant provides an explanation consistent with taking reasonable care.", "The defendant is strictly liable for anything that falls from its premises.", "The claimant must prove that the defendant has a criminal conviction for the incident."], "a": "C", "x": ["Wrong. Experience is irrelevant to the doctrine and does not lower the standard of care.", "Wrong. Where the cause is unknown, res ipsa loquitur can assist the claimant.", "Correct. The cause is unknown, sacks do not normally fall without negligence and the defendant had control, so the doctrine applies.", "Wrong. Negligence is fault-based; the doctrine only allows an inference of negligence.", "Wrong. A conviction can help a claimant but is not required."]}, {"ch": 0, "n": 10, "sc": ["A learner driver on her third lesson mounts the pavement and injures a pedestrian. She was doing her best but lacked the skill of a qualified driver."], "st": "What standard of care will the court apply to the learner driver?", "o": ["A lower standard because she was doing her best.", "The standard of the supervising instructor only.", "No standard, because learners are exempt while supervised.", "The standard of a reasonable learner driver of similar experience.", "The standard of a reasonably competent and experienced driver."], "a": "E", "x": ["Wrong. The test is objective; trying her best does not lower the standard.", "Wrong. The learner herself owes a duty to other road users.", "Wrong. There is no such exemption.", "Wrong. Unskilled defendants are judged by the standard of a reasonably competent person undertaking the activity (Nettleship v Weston).", "Correct. A learner driver is held to the objective standard of the reasonably competent driver."]}, {"ch": 1, "n": 1, "sc": ["The claimant attends at a busy hospital A&E complaining of a severe headache, dizziness and blurred vision for a number of days. It is very busy and the doctor (newly qualified in his first day on duty) briefly examines him and is in the process of prescribing him painkillers for a migraine when he collapses and dies. Medical evidence shows that the claimant suffered a stroke."], "st": "What statement best describes the court's approach when considering whether the treatment provided by the hospital was negligent?", "o": ["The court will take into consideration how busy the A&E department was when the claimant attended.", "The court will take into consideration whether the doctor's care has fallen below the standard of care expected.", "The court will take into consideration the training and experience of the treating doctor.", "The court will take into consideration whether the claimant has contributed to his injuries.", "The court will take into consideration whether a majority of medical professionals would have prescribed painkillers for a migraine."], "a": "B", "bx": "The correct answer was B. This is because the doctor will be judged by the standard of care of a medical professional. A is wrong because the standard of care is not affected by how busy the A&E department was when the claimant attended - a doctor owes a patient a duty of care. C is wrong because experience is not taken into consideration. Irrespective of how long the doctor has been in the role the court will judge the doctor by the standard of care of a medical professional. D is wrong because the court only considers the defence of contributory negligence when the defendant is found to be liable, but in any event the claimant has not contributed to his injuries. E is wrong because the correct test is whether the doctor acted in accordance with the actions of a responsible body of medical opinion."}, {"ch": 1, "n": 2, "sc": ["A baby is born by emergency caesarean due to complications with labour. The doctor on duty failed to appreciate that the baby was in distress and delayed calling the surgical team to perform the caesarean. Following birth, the baby suffers seizures and is left with long-standing health issues affecting speech, sight and hearing. Medical evidence is unable to say with certainty what the cause of the baby's health issues are, but medical experts agree that there are potentially three causes (genetic, oxygen starvation and bacterial infection). The court finds that each of the three causes have an equal percentage chance of being causative of the harm/damage."], "st": "Which of the following is most likely to be the position the court will adopt when considering the doctor's liability?", "o": ["The court is likely to find the doctor liable in negligence as he breached his duty when failing to order the caesarean earlier and that breach was causative of the baby's health issues.", "The court is likely to find that although the doctor breached his duty, his negligent act was one of three potential causes of the baby's harm and on balance of probabilities causation cannot be established.", "The court is likely to find that although there were competing causes of the baby's harm, on balance, the doctor's negligence was causative and as a consequence the claim against the doctor will succeed.", "The court is likely to find that the two non-negligent potential causes of the baby's harm are intervening events that break the chain of causation.", "The court is likely to find the doctor liable as the two non-negligent potential causes of the baby's harm did not break the chain of causation."], "a": "B", "bx": "The correct answer was B. This is because the court is likely to find that although the doctor breached his duty, his negligent act was one of three potential causes of the baby's harm and on balance of probabilities causation cannot be established. The doctor's negligence is potentially only 33.33% causative and therefore does not meet the balance of probabilities burden of proof. A is wrong because failing to order the caesarean earlier was only one of three possible causes of the baby's health issues. C is wrong because the doctor's negligence is only 33.3% to blame for the baby's health issues and therefore causation cannot be established on the balance of probabilities. D is wrong because the two other possible causes are not intervening events that break the chain of causation. E is wrong because the three events are all possible causes and the chain of causation is not broken."}, {"ch": 1, "n": 3, "sc": ["The claimant contracts mesothelioma caused by exposure to asbestos. During his working life he had four periods of employment when he was exposed to asbestos. He worked for the first company for ten years. He worked for the second company for ten years. The third period of employment was for ten years when he was self-employed. The fourth period of employment was for ten years with a local company which is now insolvent."], "st": "Which of the following statements best reflects the approach of the court in determining liability for the negligent exposure to asbestos?", "o": ["The court will hold each employer 25% liable, meaning the claimant will have 25% of his damages reduced to reflect his period of self-employment.", "The court will hold only those employers liable that are solvent at the time the claimant brings the claim, meaning the claimant will receive only 75% of any damages.", "The court will find that all defendants are jointly and severally liable, meaning the claimant can bring a claim against any of the solvent employers and receive 100% of any damages.", "The court will find that all defendants are jointly and severally liable, meaning the claimant can bring a claim against any of the employers but his damages will be reduced by 25% to reflect his period of self-employment.", "The court will find that all defendants are jointly and severally liable, meaning the claimant can bring a claim against any of the employers but his damages will be reduced by 25% to reflect his period of self-employment and a further 25% to reflect that one company is insolvent."], "a": "C", "bx": "The correct answer was C. This is because the court will find that all defendants are jointly and severally liable, meaning the claimant can bring a claim against any of the solvent employers and receive 100% of any damages. A is wrong because the employers are jointly and severally liable. B is wrong because the claimant is entitled to bring a claim against any or all of the employers and receive 100% of the damages. D is wrong because joint and several liability means that the claimant can claim against any of the responsible defendants and receive 100% of his damages. E is wrong because the claimant is entitled to full damages from any of the responsible defendants."}, {"ch": 1, "n": 4, "sc": ["The claimant is travelling on the motorway when she sees a stationary vehicle in the middle lane. She brings her vehicle to a stop at a safe distance behind the stationary vehicle and puts her hazard warning lights on. The car behind her (car A) fails to stop in time and collides with the rear of her car, causing damage and injury. The car behind car A (car B) fails to stop in time and collides with the rear of car A pushing car A into the claimant's vehicle, causing damage and injury. The experts agree that the claimant's injuries and vehicle damage have been caused in equal proportion by the drivers of car A and car B."], "st": "Which of the following statements best represents the position of the court in response to the liability of the responsible drivers?", "o": ["The court is likely to find that the driver of car A is 100% liable for the damage and injury caused to the claimant.", "The court is likely to find that the driver of car B is 100% liable for the damage and injury caused to the claimant.", "The court is likely to find the collision caused by the driver of car A to be an intervening act which breaks the chain of causation.", "The court is likely to find the drivers of car A and car B proportionally liable for the damage and injury caused to the claimant.", "The court is likely to find the collision caused by the driver of car B to be an intervening act which breaks the chain of causation."], "a": "D", "bx": "The correct answer was D. This is because the drivers of car A and car B have caused equal damage and injury to the claimant and they are proportionally liable (50% each). A is wrong because both cars A and B have equally (ie 50% each) caused the injury and damage to the claimant. B is wrong because both cars A and B are responsible for the damage. C is wrong because there is no intervening act but two collisions which were equally responsible for the claimant's injury and damage. E is wrong because there is no intervening act which breaks the chain of causation."}, {"ch": 1, "n": 5, "sc": ["The claimant suffers a longstanding injury to her left knee when she slips on uneven carpet on the steps of the defendant's department store. The defendant accepts that the carpet has been laid negligently and the injury to the claimant's knee caused due to their breach of duty. The medical evidence confirms that the claimant has been left with a weak knee. Some months later the claimant is walking down the high street and trips over an uneven paving stone the council have negligently failed to repair and severely reinjures her left knee, resulting in her mobility being impaired."], "st": "Which of the following statements best represents the position of the court in response to the liability of the defendant department store?", "o": ["The court is likely to find that the department store is proportionally liable for the claimant's continuing knee symptoms together with the council.", "The court is likely to find that the claimant's continuing knee injuries are a new intervening act which breaks the chain of causation.", "The court is likely to find that the department store is liable for the claimant's continuing left knee mobility impairment.", "The court is likely to find that the council's negligence does not break the chain of causation and the department store are liable for the claimant's left knee mobility impairment.", "The court is likely to find that the council's negligence breaks the chain of causation and the department store are not liable for the claimant's left knee mobility impairment."], "a": "E", "bx": "The correct answer was E. This is because the council's negligence breaks the chain of causation and the department store will be liable only for the claimant's left knee symptoms which relate to the injury the claimant sustained when slipping on their uneven carpet. The council's negligence in failing to repair the pavement is the factual cause of the claimant's left knee mobility impairment. A is wrong because the claimant's second accident breaks the chain of causation. B is wrong because an event must occur to break the chain of causation and the claimant's continuing knee injuries are not a new intervening act. C is wrong because the claimant suffers a further injury tripping in the street due to the council's negligence. D is wrong because the second accident was due to the council's negligence and this causes the left knee mobility impairment."}, {"ch": 1, "n": 6, "sc": ["Three night watchmen attend hospital vomiting after drinking tea. The casualty doctor refuses to examine them and sends them home. One dies of arsenic poisoning. Expert evidence shows that even with prompt examination and treatment he would have died, as the antidote could not have been given in time."], "st": "Is the hospital liable for the death?", "o": ["Yes, because the doctor breached his duty by refusing to examine the man.", "No, because the claimant cannot satisfy the 'but for' test: he would have died in any event.", "Yes, because the breach materially increased the risk of death.", "Yes, but damages will be reduced by 50%.", "No, because the hospital owed no duty to people who were not admitted."], "a": "B", "x": ["Wrong. Breach alone is not enough; causation must also be proved.", "Correct. As in Barnett v Chelsea and Kensington HMC, breach did not cause the death because he would have died anyway.", "Wrong. Nothing suggests the breach increased the risk; death was inevitable.", "Wrong. There is no basis for apportionment where causation fails.", "Wrong. A hospital casualty department owes a duty to those presenting for treatment."]}, {"ch": 1, "n": 7, "sc": ["A ship's crew negligently spill oil into a harbour. The oil drifts to the claimant's wharf, where welding is taking place. Sparks ignite the oil and the wharf is destroyed by fire. Expert evidence shows that it was not reasonably foreseeable that the oil would ignite on water, although some fouling damage to the wharf was foreseeable."], "st": "Can the claimant recover for the fire damage?", "o": ["Yes, because the eggshell skull principle applies to property.", "No, because the welding was an act of God.", "Yes, because the fire was a direct consequence of the spillage.", "Yes, because some damage to the wharf was foreseeable.", "No, because damage by fire was not of a reasonably foreseeable type."], "a": "E", "x": ["Wrong. The eggshell skull rule concerns the extent of harm to a claimant of the foreseeable type, not a different type of harm.", "Wrong. Welding is a human activity, not an act of God.", "Wrong. The direct consequences test was rejected in The Wagon Mound (No 1).", "Wrong. Foreseeability of fouling does not make a different type of damage (fire) recoverable.", "Correct. The test of remoteness is whether the type of damage was reasonably foreseeable; fire damage was not."]}, {"ch": 1, "n": 8, "sc": ["A worker is negligently splashed with molten metal, causing a small burn on his lip. Unknown to anyone, he had a pre-malignant condition. The burn triggers cancer and he dies."], "st": "Is the employer liable for the death?", "o": ["No, because the pre-malignant condition was a novus actus interveniens.", "Yes, but only for the burn itself.", "No, because cancer was not a foreseeable consequence of a burn.", "Yes, because a burn was foreseeable and the defendant must take the claimant as it finds him.", "No, because the claimant should have disclosed his condition."], "a": "D", "x": ["Wrong. A pre-existing condition is not an intervening act.", "Wrong. The eggshell skull rule makes the defendant liable for the full extent of the harm.", "Wrong. Once the type of harm (a burn) is foreseeable, its extent need not be.", "Correct. This is the eggshell skull principle in Smith v Leech Brain.", "Wrong. There is no such duty, and the claimant's own vulnerability is no defence."]}, {"ch": 1, "n": 9, "sc": ["A GP negligently fails to refer a patient with a lump. Nine months later, cancer is diagnosed. The delay reduced his chance of a cure from 42% to 25%. He survives but with a worse prognosis."], "st": "How is the court likely to approach the claim for loss of a chance of a cure?", "o": ["The claim fails because, on the balance of probabilities, he would not have been cured even with prompt referral, and loss of a chance is not recoverable in this type of clinical negligence claim.", "The claim succeeds but damages are limited to 42%.", "The claim succeeds because the doctor reduced his chance of recovery by 17%.", "The claim succeeds in full because the GP materially contributed to the cancer.", "The claim fails because the GP owed no duty of care."], "a": "A", "x": ["Correct. As in Gregg v Scott, the original chance was under 50%, so causation of the outcome is not proved and lost chance is not recoverable in clinical negligence.", "Wrong. Proportionate damages for lost chance are not awarded in this type of claim.", "Wrong. A reduction in a chance below 50% does not satisfy the balance of probabilities.", "Wrong. The material contribution exception does not apply where the defendant did not cause the disease.", "Wrong. A GP owes his patient a duty of care."]}, {"ch": 1, "n": 10, "sc": ["A worker contracts a lung disease from silica dust. Some of the dust came from a source for which the employer was not at fault, and some came from a source the employer negligently failed to control. The disease results from the cumulative dose of dust, and the negligent dust contributed more than a trivial amount."], "st": "Which approach is the court likely to adopt on causation?", "o": ["The non-negligent dust breaks the chain of causation.", "The claim fails because the claimant cannot show that 'but for' the negligent dust he would not have suffered the disease.", "The employer is liable because its negligent dust materially contributed to the harm.", "The claimant must sue every source of dust jointly.", "The employer is liable only if the negligent dust made up more than 50% of the total dust."], "a": "C", "x": ["Wrong. Non-negligent sources are not an intervening act.", "Wrong. Where there are multiple potential causes, a material contribution to the harm is an exception to the 'but for' test.", "Correct. Material contribution (Bonnington Castings) is enough to establish causation.", "Wrong. There is no such requirement.", "Wrong. It is enough that the contribution is more than trivial; it need not exceed 50%."]}, {"ch": 2, "n": 1, "sc": ["The claimant suffers severe head injuries following a serious road traffic accident. She works full time and is married with two young children and her wife works part time. The claimant is placed in a surgical coma but never resumes consciousness and dies three weeks after the accident. The driver of the other vehicle confirms pulling out of a junction without checking the road and admits liability for the accident."], "st": "Which of the following is likely to be the position in respect of a claim for compensation on behalf of the claimant and her family?", "o": ["The claimant's estate can continue the claim which the deceased was entitled to in the instant before dying and the deceased's dependants can bring a separate dependency claim as the claimant would have been able to sue the defendant successfully.", "As the claimant is deceased, all claims come to an end unless the claimant gave permission for the claim to be pursued prior to her death.", "The claimant's estate can bring a claim but the deceased's relatives would not be able to bring a claim as the deceased was not entitled to claim in the instant before dying.", "The claimant's estate can continue the claim but there can be no separate dependency claim as the claimant did not gain consciousness before her death.", "The claimant's estate and dependants are unable to bring a claim as the claimant would have been unable to sue successfully prior to death."], "a": "A", "bx": "The correct answer was A. The claimant's estate can continue the claim which will be based on the losses the claimant would have been entitled to prior to her death. A separate claim by the deceased's dependants can also be brought which will include a dependency claim, an award for bereavement damages and (if paid) a claim for funeral expenses. B is wrong because the claim does not come to an end just because the claimant dies before they are able to receive an award of compensation. C is wrong because the claimant's estate would be able to bring a claim. D is wrong because it is not a condition that the claimant must survive any length of time in order to bring a claim. E is wrong because the claimant would have been able to successfully sue the driver of the vehicle as the driver was negligent in pulling out of the junction and driving into the claimant's car."}, {"ch": 2, "n": 2, "sc": ["The claimant is injured in an accident at work when he falls from scaffolding which has been negligently erected by his employer. He suffers severe head injuries and is taken to hospital where he dies several hours later. His employers have admitted liability for the accident. The claimant was a single father and financially supported his 19-year-old son through university. The claimant left his estate to his son."], "st": "Which statement accurately reflects whether the son will be able to bring a dependency claim?", "o": ["The claimant's son is unable to bring a dependency claim as the claimant was unlikely to receive compensation for his injuries.", "The claimant's son will be able to bring a dependency claim only if he is able to show that the claimant suffered pain and suffering from the date of the accident until the date of death.", "The claimant's son is unable to bring a dependency claim as the claimant is deceased and all claims come to an end unless the claimant gave permission for the claim to be pursued prior to his death.", "The claimant's son will be able to bring a dependency claim as a child of the deceased with a reasonable expectation of financial benefit from the deceased.", "The claimant's son is unable to bring a dependency claim as the son is an adult over the age of 18 and dependency claims are only available to children of the deceased."], "a": "D", "bx": "The correct answer was D. This is because the deceased claimant's son will be able to bring a claim as he is a dependant and being financially supported by the claimant whilst at university. A is wrong because the claimant would receive compensation for his injuries as the claimant's employers were negligent. B is wrong because there is no requirement to show that the claimant suffered pain from the date of the accident until death. C is wrong because the claim does not discontinue just because the claimant has died, as the estate is able to continue with the claim. E is wrong because there is no cut-off point in respect of age."}, {"ch": 2, "n": 3, "sc": ["A food production company specialising in ice cream production suffers a power outage at their factory due to the local electricity supplier's employee negligently severing a cable in the junction box outside the factory during some regular maintenance work. The food production company pursues a claim in negligence against the electricity supply company and liability is admitted for the negligent breach of duty. Due to the break in supply of electricity, the food production company lose the current batch being pasteurised (batch product), losing £500, and the packed end product in the freezing operation (frozen product), losing a further £1,000. Had the electricity supply not been cut, the production company would have made a further 75% profits on the raw mix ingredients waiting to go through the food process. The raw mix ingredients had to be disposed of."], "st": "Which of the following is likely to be the position the court will adopt when considering what the food production company can claim in respect of their losses?", "o": ["The court is likely to allow a claim for damages for the batch product, the frozen product and the 75% lost profits as all were consequential on the electricity supplier's negligent act.", "The court is likely to allow a claim for damages for the batch product, the frozen product and the 75% lost profits as the batch and frozen products were consequential on the electricity supplier's negligent act and the 75% lost profits are economic loss but recoverable due to the defective nature of the production equipment caused by the electricity supplier's negligence.", "The court is likely to dismiss the claim for damages for the batch product, the frozen product and the 75% lost profits as none were consequential on the electricity supplier's negligent act.", "The court is likely to allow a claim for damages for the batch product and the frozen product as the damage to the batch and frozen products were physical damage but dismiss the claim for 75% lost profits on the mix ingredients as this further loss of profit is pure economic loss and not recoverable.", "The court is likely to dismiss a claim for damages for the batch product, the frozen product and the 75% lost profits as they are not a consequence of physical damage and are all pure economic loss and not recoverable."], "a": "D", "bx": "The correct answer was D. This is because economic loss which is a direct consequence of physical damage is an exception to the rule that economic loss is not recoverable. So, the £1,500 loss made on the batch and frozen product is pure economic loss and is recoverable. The loss of 75% profits on the raw mixture which had to be thrown away is not due to damage to property and is not recoverable. A is wrong because the damage to the batch product and the frozen product is a direct consequence of physical damage and this falls into the exception to the rule that economic loss is not recoverable. The claimant would be able to recover damages for the batch and frozen product. However, 75% loss of profits on the raw material that had to be thrown away was not a direct consequence of physical damage. B is wrong because the 75% profits on the batch wasted due to the power cut is not attributable to the damage to the claimant's property caused by the defendant's negligence. The profits on the wasted product are pure economic loss and do not fall into the exception (economic loss which is a direct consequence of physical damage). C is wrong because the batch product and the frozen product were damaged due to the defendant's negligence and fall under the exception to the rule that economic loss is not recoverable. E is wrong because losses associated with the batch and frozen product (£1,500) are economic loss which fall into the exception to the rule as they are as a direct consequence of the physical damage to the claimant's property and the court will award £1,500 in compensation. The 75% profit loss has not been incurred due to a direct consequence of the physical damage to the claimant's property."}, {"ch": 2, "n": 4, "sc": ["A 12-year-old daughter is shopping with her father when he suddenly collapses in the aisle and dies from a heart attack. Unbeknownst to her, the father had been under the care of a hospital that negligently failed to diagnose coronary artery disease. Medical experts later conclude that the hospital negligently failed to identify and treat his condition eighteen months earlier. The daughter develops post-traumatic stress disorder after witnessing her father's death. She brings a claim for psychiatric injury as a secondary victim."], "st": "Which of the following best describes the likely outcome of her claim?", "o": ["The daughter's claim will succeed because witnessing the sudden and horrifying death of a close relative establishes proximity sufficient for a duty of care.", "The daughter's claim will fail because psychiatric injury to a relative in clinical negligence cases is only actionable if the negligence and injury occur in the same moment as the traumatic event.", "The daughter's claim will succeed if she can prove that a reasonable person in her position would also suffer psychiatric harm.", "The daughter's claim will fail because there was no breach of duty by the hospital in relation to her as a third-party observer.", "The daughter's claim will succeed if the death was foreseeable and she witnessed it directly, regardless of the underlying cause."], "a": "B", "bx": "The correct answer was B. In Paul and Anor v Royal Wolverhampton NHS Trust [2024] UKSC 1, the court held that psychiatric harm suffered by secondary victims in clinical negligence cases is generally not actionable unless the negligent act and the traumatic event are part of the same 'accident'. Here, the negligent omission occurred 18 months earlier, and the collapse was a later consequence, not a single traumatic incident arising directly from the negligence. A is wrong as although the daughter witnessed a sudden and horrifying event, this alone is insufficient without a legally recognised 'accident' that directly links the breach and the traumatic event. C is wrong as reasonable foreseeability of psychiatric harm is not the only requirement - there must also be a proximate connection between the negligence and a specific traumatic event. D is wrong as the hospital did owe a duty to the father, but the key issue is whether the law imposes a duty to protect secondary victims like the daughter from psychiatric harm, and as the negligence relates to clinical negligence, the doctor owes a duty of care solely to the patient (father). E is wrong as even if the death was foreseeable and directly witnessed, the absence of a qualifying 'accident' from the negligent act breaks the necessary chain of legal causation."}, {"ch": 2, "n": 5, "sc": ["The claimant is a police officer on duty when she is called to the scene of a live music concert where many in the audience have suffered breathing difficulties due to carbon monoxide poisoning. The concert organisers had negligently allowed the concert to go ahead despite being advised by an engineer called out to service the concert hall's boiler that there was a fault on the boiler. Many concert goers were unable to leave the concert due to a fire door being bolted shut and have succumbed to the fumes and died. The claimant is severely affected by the sight of dead bodies and suffers clinical depression, causing her to remain off work for six months."], "st": "Which of the following statements best represents the position of the court in respect of a claim for psychiatric injury brought by the claimant police officer?", "o": ["The court is likely to conclude that the claimant has suffered a medically diagnosed psychiatric illness and award her damages for psychiatric harm.", "The court is likely to conclude that clinical depression is not a medically diagnosed psychiatric illness and the claim for damages for psychiatric harm will fail.", "The court is likely to conclude that the claimant is a rescuer and will award damages for psychiatric harm.", "The court is likely to conclude that the claimant is neither primary nor secondary victim and the claim for damages for psychiatric harm will fail.", "The court is likely to conclude that the claimant is a secondary victim and award damages for psychiatric harm."], "a": "D", "bx": "The correct answer was D. This is because the police officer is neither a primary nor secondary victim which is a requirement to claim damages for psychiatric harm. She will be unable to recover damages for psychiatric harm. A is wrong because, although the claimant has suffered a medically diagnosed psychiatric illness, she does not fall into the primary or secondary victim category. B is wrong because clinical depression is a medically diagnosed psychiatric illness, but the claim will fail as the claimant is neither a primary nor secondary victim. C is wrong because the claimant would have to be either a primary or secondary victim to claim successfully. E is wrong because the claimant is not a secondary victim."}, {"ch": 2, "n": 6, "sc": ["The claimant is injured in a road traffic accident caused by the defendant. She claims for loss of earnings, medical expenses, the cost of care, and her pain, suffering and loss of amenity."], "st": "Which of the claimant's heads of loss is a non-pecuniary loss?", "o": ["The cost of care.", "Loss of earnings.", "Medical expenses.", "Pain, suffering and loss of amenity.", "All of these are pecuniary losses."], "a": "D", "x": ["Wrong. Care costs are pecuniary.", "Wrong. Loss of earnings is money-related and therefore pecuniary.", "Wrong. Medical expenses are pecuniary.", "Correct. Pain, suffering and loss of amenity is non-money-related, so it is non-pecuniary loss.", "Wrong. Pain, suffering and loss of amenity is non-pecuniary."]}, {"ch": 2, "n": 7, "sc": ["The claimant is driving when the defendant negligently collides with his car at moderate speed. The claimant suffers no physical injury but develops chronic fatigue syndrome, a recognised psychiatric condition, which is triggered by the accident."], "st": "Is the claimant likely to recover damages for psychiatric harm?", "o": ["No, because he suffered no physical injury.", "No, because chronic fatigue syndrome is not a recognised condition.", "Yes, because he is a primary victim and physical injury to him was reasonably foreseeable.", "Yes, but only if he satisfies the Alcock control mechanisms.", "No, because psychiatric injury to a person of reasonable fortitude was not foreseeable."], "a": "C", "x": ["Wrong. A primary victim need not actually suffer physical injury.", "Wrong. The question says it is a recognised psychiatric condition.", "Correct. He was directly involved and in the zone of danger, so as in Page v Smith he can recover once physical injury was foreseeable.", "Wrong. The Alcock control mechanisms apply to secondary victims.", "Wrong. For a primary victim it is enough that physical injury was foreseeable."]}, {"ch": 2, "n": 8, "sc": ["A woman watches a live television broadcast of a stadium disaster caused by police negligence. Her son is in the crowd and is killed. She develops post-traumatic stress disorder. Broadcasting guidelines prevented the showing of identifiable individuals."], "st": "Is the woman likely to succeed in a claim as a secondary victim?", "o": ["Yes, because watching a live broadcast is equivalent to being present.", "Yes, because she had a close tie of love and affection with her son.", "No, because she did not perceive the event with her own unaided senses or its immediate aftermath.", "No, because only spouses can bring claims for psychiatric harm.", "Yes, because her psychiatric injury was foreseeable."], "a": "C", "x": ["Wrong. Alcock held that a live broadcast of this kind is not equivalent to being present.", "Wrong. A close tie is only one of the Alcock control mechanisms; proximity in time and space and direct perception are also required.", "Correct. In Alcock, viewing live television that did not show identifiable individuals did not satisfy direct perception.", "Wrong. Parents are presumed to have a close tie; claims are not limited to spouses.", "Wrong. Foreseeability alone is not enough for a secondary victim."]}, {"ch": 2, "n": 9, "sc": ["A bank provides a credit reference on one of its customers to an advertising agency, knowing that the agency will rely on it before extending credit. The reference is given negligently and without any disclaimer. The agency relies on it and suffers financial loss when the customer becomes insolvent."], "st": "Can the agency recover its financial loss in negligence?", "o": ["Yes, because the bank assumed responsibility for the advice and the agency reasonably relied on it.", "Yes, but only if the loss is consequential on physical damage.", "No, because there is no contract between the bank and the agency.", "No, because pure economic loss is never recoverable in negligence.", "No, because the loss was caused by the customer's insolvency."], "a": "A", "x": ["Correct. This is the negligent misstatement exception (Hedley Byrne), based on assumption of responsibility and reliance.", "Wrong. The loss here is pure economic loss; it can still be recovered under the misstatement exception.", "Wrong. A duty can arise in tort without a contract.", "Wrong. Pure economic loss is generally not recoverable but there are exceptions, including negligent misstatement.", "Wrong. The negligent reference caused the agency to extend credit, and it is the loss the reference was meant to guard against."]}, {"ch": 2, "n": 10, "sc": ["The claimant was negligently exposed to asbestos by his former employer. He develops pleural plaques, which cause no symptoms, and suffers anxiety about the risk of future asbestos-related disease."], "st": "Is the claimant likely to recover damages for his anxiety?", "o": ["No, because the employer is jointly and severally liable with other employers.", "Yes, because the employer was negligent and the anxiety is genuine.", "Yes, because he is a primary victim.", "No, because the law does not recognise a duty to take reasonable care not to cause anxiety about the risk of future disease.", "Yes, provided he satisfies the Alcock control mechanisms."], "a": "D", "x": ["Wrong. Joint and several liability is irrelevant to whether the damage is actionable.", "Wrong. Genuine anxiety alone is not actionable damage.", "Wrong. Being in a primary victim category does not make anxiety about future disease recoverable.", "Correct. Rothwell v Chemical & Insulating Co held that anxiety about future disease is not recoverable.", "Wrong. The Alcock control mechanisms concern secondary victims and do not apply here."]}, {"ch": 3, "n": 1, "sc": ["The claimant, a five-year-old child who is accompanied to an ice cream van with his father, is knocked over as he goes around the front of the ice cream van and walks into the defendant's vehicle. The defendant's vehicle was travelling at a speed of 25mph. The area is a built-up residential area and there is a queue of children on the pavement waiting to be served."], "st": "Which of the following is likely to be the position of the court when considering the defendant's argument that the claimant contributed to his injuries by failing to take reasonable care of his own safety when crossing the road?", "o": ["The court is likely to find that the claimant has contributed to his injuries by failing to take care of his own safety and reduce his damages by 10%.", "The court is likely to find that the claimant has contributed to his injuries by failing to take care of his own safety and reduce his damages by 25%.", "The court is likely to find that the claimant has contributed to his injuries by failing to take care of his own safety and reduce his damages by 50%.", "The court is likely to find that the defendant's speed was excessive to pass an ice cream van in a residential area and the defence of contributory negligence will fail.", "The court is likely to find that the child's father is contributory negligent and reduce the claimant's damages accordingly."], "a": "D", "bx": "The correct answer was D. This is because the area is residential and an ice cream van is parked on the road. The court will likely find that the claimant should have taken more care when driving and should have foreseen children crossing near the ice cream van. A, B and C are wrong because the court are unlikely to reduce the damages of a child; the defendant would need to defend the claim on the basis that the father contributed to the child's injuries by failing to stop the child crossing the road. E is wrong because children crossing near the ice cream van should be anticipated by motorists. Had the defendant been driving at an appropriate speed (eg 5mph) he may have been able to avoid the accident. A speed of 25mph is too fast in the circumstances and the court will likely find him wholly to blame for the claimant's injuries."}, {"ch": 3, "n": 2, "sc": ["The claimant, lying drunk in the road of a cul-de-sac, is injured when the defendant's vehicle reverses over him late at night. The defendant is looking over his right shoulder and reverses for 40 feet before reaching and reversing over the claimant. It is accepted that if the defendant had looked over his left shoulder at any point he would have seen the claimant lying in the road."], "st": "Which of the following is likely to be the position of the court when considering the defendant's argument that the claimant contributed 100% towards his injuries by getting drunk and lying in the road?", "o": ["The court is likely to find the claimant 100% contributory negligent for his injuries and reduce his damages to zero.", "The court is likely to find that liability will attach to the defendant for failing to look over his left shoulder but that the claimant has contributed to his injuries by being drunk and lying in the road and reduce his damages accordingly.", "The court is likely to find the defendant not at fault for the accident.", "The court is likely to allow the defence of illegality to succeed due to the claimant being drunk in a public place.", "The court is likely to allow the defence of consent to succeed on the basis that the claimant consented to being a victim of a road traffic accident by lying in the road when drunk."], "a": "B", "bx": "The correct answer was B. This is because the onus is always on a reversing driver to ensure that the road is clear and the fact that had the defendant looked over their left shoulder they would have seen the claimant in the road means the court will find the defendant at fault but reduce the claimant's damages to reflect the fact that their behaviour contributed to the injuries. This example is based on a real claim and the court found the claimant 60% to blame, reducing the claimant's damages by 60%. A is wrong because there cannot be a finding of 100% contributory negligence. C is wrong because had the claimant not got drunk and fallen asleep in the road they would not have been injured. The claimant has to bear some responsibility for his injuries. D is wrong because it is not illegal to get drunk and sleep in the road, just inadvisable. E is wrong because the claimant did not consent to being a victim of a road traffic accident - he just carelessly fell asleep in the road."}, {"ch": 3, "n": 3, "sc": ["The claimant is playing rugby which is refereed by a part-time amateur referee when the scrum he is participating in collapses, causing him serious neck injuries. The evidence accepted by the court is that had the referee adhered to the rules and sequence of engagement during the game the scrum would not have collapsed."], "st": "Which of the following is likely to be the court's approach to the defendant's attempts at defending the claim?", "o": ["The court will likely accept that the referee breached his duty by failing to prevent a scrum collapse and that the defendant's defence, based on the fact that the claimant consented to his injuries by accepting the risk involved in rugby, will fail.", "The court will likely accept that the referee breached his duty by failing to prevent a scrum collapse but that the defendant's defence, based on the fact that the claimant consented to his injuries by accepting the risk involved in rugby, will succeed.", "The court will likely accept that the referee owed a duty of care but that, by the very nature of the sport of rugby, it is to be expected that injury will occur and that the referee did not breach this duty of care, allowing a complete defence to the claimant's claim.", "The court will likely accept that the referee breached his duty by failing to prevent a scrum collapse but allow a reduction in damages to reflect the claimant's contributory negligence by actively taking part in the scrum.", "The court will likely allow a partial defence of consent on the basis that the claimant consented to all risks involved in the sport."], "a": "A", "bx": "The correct answer was A. This is because the claimant consented only to the normal risks involved in playing rugby, not the injury caused when the referee did not meet the required standard of care in refereeing the match. B is wrong because the claimant consented only to the normal risks involved in playing rugby, not being injured due to the referee falling under the required standard of care. C is wrong because, although rugby is a physical sport and injuries are commonplace, the referee's standard of care fell below that expected and this was the reason the claimant was injured. D is wrong because the claimant's actions did not contribute to his injuries. E is wrong because the claimant did not consent to injuries caused by the negligence of the referee."}, {"ch": 3, "n": 4, "sc": ["The claimant parks her car on double yellow lines in a no-parking zone when the defendant drives into a collision with the claimant's vehicle, causing extensive damage."], "st": "Which of the following is likely to be the court's approach to the defendant's argument in his defence that the claim should be defeated on the basis of the illegality of the claimant's parking?", "o": ["The court is likely to allow the defendant to defend the claim on the basis of illegality as there was a connection between the claimant's parking and the damage inflicted by the defendant's driving.", "The court is unlikely to allow the defendant to defend the claim on the basis of illegality but reduce the claimant's damages significantly to reflect that she had parked in a no-parking zone.", "The court is unlikely to allow a defence of illegality but may allow a defence of consent on the basis that the claimant voluntarily accepted the risk of someone driving into her vehicle whilst parked illegally.", "The court will not allow the defence of illegality as the claimant's positioning of her vehicle is not an important factor and does not contribute to the damage to the vehicle.", "The court will not allow the defence of illegality but is likely to find the claimant 100% contributory negligent and reduce the claimant's damages to zero."], "a": "D", "bx": "The correct answer was D. This is because in order for a defence of illegality to succeed there needs to be a connection between the illegal activity and the harm caused. The fact the claimant had parked on double yellow lines is trivial. The defendant should have observed the road and has breached his duty to drive to the standard of a reasonably careful driver and observed her parked vehicle. A is wrong because parking on double yellow lines is not a criminal offence. B is wrong because the claimant has caused the accident by driving into the claimant's stationary vehicle. C is wrong because the claimant's vehicle (although parked in contravention of the parking restrictions) was there to be seen and the defendant has failed to observe the presence of the vehicle on the road and caused the accident. E is wrong because the court will not make a finding of 100% contributory negligent."}, {"ch": 3, "n": 5, "sc": ["The claimant is a front seat passenger in her brother's car which is involved in a road traffic accident when the defendant changes lanes on the motorway. The defendant admits that he failed to see the vehicle the claimant was travelling in. The claimant, who was not wearing a seatbelt at the time of the accident, is seriously injured. The court accepts that had she been wearing a seatbelt her injuries would have been less severe."], "st": "Which statement best represents the court's approach in dealing with the claimant's contribution to her injuries?", "o": ["The court is unlikely to make a finding of contributory negligence as the claimant has not contributed to the accident.", "The court is unlikely to make a finding of contributory negligence as the claimant has not contributed to her injuries.", "The court is likely to make a finding of 15% contributory negligence as the claimant has contributed to her injuries by failing to wear a seat belt.", "The court is likely to make a finding of 25% contributory negligence as the claimant has contributed to her injuries by failing to wear a seat belt.", "The court is likely to reduce the claimant's damages by 50% to reflect she was not wearing a seat belt."], "a": "C", "bx": "The correct answer was C. This is because the court will make a finding of 15% contributory negligence as the claimant's injuries would have been less severe had she worn a seat belt. A is wrong because contributory negligence focuses on the claimant's contribution to her injuries, not her contribution to the accident. B is wrong because the claimant has contributed to her injuries by failing to wear a seatbelt. D is wrong because the court will make a finding of 25% contributory negligence only where the claimant's injuries would have been prevented entirely. E is wrong because the court would only reduce a claimant's damages by 50% if the claimant was equally to blame for their injuries and the claimant does not have the same culpability as the defendant driver."}, {"ch": 3, "n": 6, "sc": ["A labourer works in a quarry beneath a crane that regularly swings stones overhead. He knows of the risk and has complained to his foreman, but continues working because he needs the job. A stone falls and injures him. His employer argues that he consented to the risk."], "st": "Is the defence of consent likely to succeed?", "o": ["No, because consent is never available in claims brought by employees.", "Yes, because he complained to his foreman.", "Yes, but it will only reduce his damages.", "No, because knowledge of a risk is not the same as voluntary acceptance of it, and the court is reluctant to find that employees freely consent to risks at work.", "Yes, because he knew of the risk and continued to work."], "a": "D", "x": ["Wrong. It is not automatically excluded, but employees will rarely be found to have consented.", "Wrong. Complaining shows he did not freely accept the risk.", "Wrong. Consent is a complete defence, not a partial one.", "Correct. Smith v Baker established that mere knowledge does not amount to voluntary acceptance, especially in employment.", "Wrong. Consent requires full knowledge and voluntary acceptance of the risk; knowledge alone is insufficient."]}, {"ch": 3, "n": 7, "sc": ["The claimant is injured in an accident caused by the defendant's negligence. The defendant pleads contributory negligence because the claimant failed to wear protective goggles that were available."], "st": "If the defence succeeds, what will the court do?", "o": ["Treat the claimant as having consented to the injury.", "Reduce the claimant's damages to the extent the court thinks just and equitable, having regard to the claimant's share in responsibility for the damage.", "Reduce damages only if the claimant caused the accident.", "Award full damages and order the claimant to pay the defendant's costs.", "Dismiss the claim entirely."], "a": "B", "x": ["Wrong. Consent is a separate defence.", "Correct. The Law Reform (Contributory Negligence) Act 1945 allows a just and equitable reduction to reflect the claimant's share of responsibility.", "Wrong. The focus is on the claimant's contribution to the damage, not to the accident.", "Wrong. There is no such rule.", "Wrong. Contributory negligence is a partial defence."]}, {"ch": 3, "n": 8, "sc": ["Two men commit a burglary. One drives the getaway car recklessly to escape the police, at the urging of his passenger, and crashes. The passenger is injured and sues the driver in negligence."], "st": "Which defence is most likely to defeat the passenger's claim?", "o": ["Consent, because the passenger knew the driver was reckless.", "Contributory negligence.", "No defence is available; the driver is liable in full.", "Act of God.", "Illegality (ex turpi causa)."], "a": "E", "x": ["Wrong. Consent requires full knowledge and voluntary acceptance; the more natural defence on these facts is illegality.", "Wrong. Contributory negligence would only reduce damages.", "Wrong. The close link between the crime and the harm means illegality is likely to defeat the claim.", "Wrong. A crash during a police chase is not an act of God.", "Correct. The injury arose directly out of a joint criminal enterprise, so illegality is a complete defence."]}, {"ch": 3, "n": 9, "sc": ["A driver negligently collides with the claimant's car. The claimant was not wearing a seat belt. The court accepts that, had she worn one, her injuries would have been prevented altogether."], "st": "What reduction for contributory negligence is the court most likely to make?", "o": ["15%.", "50%.", "100%.", "No reduction.", "25%."], "a": "E", "x": ["Wrong. 15% applies where the injuries would have been less severe.", "Wrong. 50% suggests equal blame, which is not the case for a passenger failing to wear a seat belt.", "Wrong. There cannot be a 100% finding of contributory negligence.", "Wrong. Failing to wear a seat belt contributed to the injuries.", "Correct. Where a seat belt would have prevented the injuries entirely, the court will usually reduce damages by 25%."]}, {"ch": 3, "n": 10, "sc": ["The claimant accepts a lift home from a friend whom she knows has been drinking heavily all evening. The friend crashes and the claimant is injured. The driver argues that she consented to the risk."], "st": "How is the court likely to deal with the driver's argument?", "o": ["Consent will succeed as a complete defence because she knew he was drunk.", "The claim will fail for illegality because drink driving is a crime.", "The claimant's damages will be reduced to zero.", "Consent is not available to a driver against a passenger in these circumstances, but the claimant's damages may be reduced for contributory negligence.", "The driver will not be liable because a passenger accepts all risks of travelling."], "a": "D", "x": ["Wrong. Statute prevents a driver relying on consent against a passenger in a vehicle that must be insured.", "Wrong. Accepting a lift is not part of a joint criminal enterprise of the kind that triggers illegality.", "Wrong. A 100% reduction for contributory negligence is not possible.", "Correct. Under the Road Traffic Act 1988 s 149, consent is not available; a reduction for contributory negligence is the usual outcome.", "Wrong. Passengers do not accept the risk of negligent driving."]}, {"ch": 4, "n": 1, "sc": ["The claimant is a catering manager at a local prison and is injured by a prisoner she is supervising when the prisoner loses his balance and drops a large pack of rice he was attempting to unload into the kitchen. The bag of rice falls onto the claimant's back. The prisoner receives payment for assisting in the kitchen."], "st": "Which of the following is likely to be the position of the court when considering whether the prison is vicariously liable for the negligence of the prisoner?", "o": ["The court is unlikely to find that the prison is vicariously liable for the prisoner's negligence as he is not an employee but a prisoner.", "The court is unlikely to find that the prison is vicariously liable for the prisoner's negligence as there is no close connection between the prisoner's negligence and the lack of supervision.", "The court is unlikely to find that the prison is vicariously liable for the prisoner's negligence as there is no element of control between the supervisor and the prisoner.", "The court is likely to find that the prison is vicariously liable for the prisoner's negligence as the prisoner is working as an integral part of the operation of the prison.", "The court is likely to find that the prison is vicariously liable for the prisoner's negligence but reduce damages to reflect that the prisoner did not intentionally drop the pack of rice."], "a": "D", "bx": "The answer was D. This is because the court is likely to find that the prison is vicariously liable for the prisoner's negligence as the prisoner is working as an integral part of the operation of the prison. The prisoner and prison have a relationship similar to employer and employee even though the prisoner's presence is not voluntary. A is wrong because the prisoner and the prison have a relationship similar to employee/employer. B is wrong because what the prisoner is doing is integral to the operation of the prison. C is wrong because there is an element of control between the prison and the prisoner. E is wrong because a reduction in damages for contributory negligence reflects the fact that the claimant has contributed to their injuries and this is not the case here."}, {"ch": 4, "n": 2, "sc": ["The claimant suffers a broken leg when he trips over his untied shoelace on his way back to his delivery vehicle. The claimant owns his delivery vehicle but it is painted with the company logo he is contracted to work with, delivering packages nationally. The claimant is responsible for maintaining the delivery vehicle and is able to work as many or as few hours as he pleases."], "st": "Which of the following statements best represents the position in respect of whether the company is vicariously liable for the claimant's injuries?", "o": ["The claimant provides work for the delivery company in return for payment and is likely to be classed as an employee and the company will be vicariously liable for his injuries.", "As the claimant's vehicle is branded with the company logo, the claimant is likely to be an employee of the company and the company will be vicariously liable for his injuries.", "On the basis that the claimant has flexible working hours he is likely to be classified as an independent contractor and the company will not be vicariously liable for his injuries.", "As the company is more likely to have funds available to compensate the claimant, the company will be vicariously liable for the claimant's injuries.", "The company is unlikely to be vicariously liable for the claimant's injuries as there is no tort committed by the company."], "a": "E", "bx": "The answer was E. This is because one party can only be vicariously liable for another party's tort if a tort has been committed. The claimant tripped over his own shoelaces - there is no negligent act and no one is at fault other than the claimant himself. A, B and C are wrong because a tort has not been committed, but in any event the claimant is likely to be classed as an independent contractor due to the flexibility with which he works. D is wrong because a tort has not been committed, but having funds available to compensate victims of torts/negligent acts is not a prerequisite for a finding of liability against an employer."}, {"ch": 4, "n": 3, "sc": ["The claimant is an experienced steel worker who works at height erecting steel for buildings. His employer fails to provide the claimant with a safety harness and as a result when the claimant loses his footing he falls to his death. The claimant would not have worn the safety harness even if provided with one."], "st": "Which of the following statements best represents the position of the court when considering the employer's common law liability for the claimant's death?", "o": ["If the court accepts that the claimant would not have worn a safety harness even if provided with one, the employer will not be liable at common law for the claimant's death.", "If the court accepts that the claimant would not have worn a safety harness even if provided with one, the employer will be liable at common law for the claimant's death.", "If the court accepts that the claimant would not have worn a safety harness even if provided with one, the employer will still be liable at common law but the damages awarded will be reduced to reflect contributory negligence on the part of the claimant.", "If the court finds that the accident could have been prevented by the use of a safety harness, the employer will be liable at common law for the claimant's death.", "If the court finds that the accident was due to lack of safety equipment, the employer will be liable at common law for the claimant's death."], "a": "A", "bx": "The answer was A. This is based on a real case where the court accepted that the claimant would have refused to wear a safety harness even if the employer had provided one. The defective equipment (or lack of it) did not cause the claimant's accident. Here the claimant's attitude to safety caused the injury. B is wrong because if the court accept the claimant would not wear safety equipment even if provided they will conclude that the lack of safety equipment is not causative of the injury. C is wrong because contributory negligence is a defence which reduces damages if the defendant is found to be liable and the claimant is found to have contributed to their injuries. The defendant would not be liable where the claimant's failure to wear safety equipment is the cause of the accident and therefore the defence of contributory negligence would not be considered by the court. D is wrong because the claimant would not have worn the safety harness even if provided. E is wrong because the lack of safety equipment did not cause the claimant's injuries, the failure of the claimant to wear safety equip
