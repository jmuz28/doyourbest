ment even if provided caused the claimant's injuries."}, {"ch": 4, "n": 4, "sc": ["The claimant suffers a serious injury during the course of his employment with the defendant when machinery he is cleaning cuts through the glove he is wearing and causes longstanding nerve damage to his hand. The defendant provides personal protective equipment to all of its employees including gloves, overalls, boots and safety goggles."], "st": "Which of the following statements best represents the position of the court in respect of a claim brought against the employer under the common law?", "o": ["The court is likely to find the claimant contributory negligent for placing his hand under the machinery and allowing the machinery to cut through the gloves provided by the defendant.", "The court is likely to find that the defendant has complied with their common law duty of care in providing a safe system of work and the claimant's claim for damages for breach of duty will fail.", "The court is likely to find the defendant liable if the claimant can prove what alternative system of work should have been adopted to prevent the accident.", "The court is likely to find that the defendant has complied with their common law duty of care in providing safe premises and the claimant's claim for damages for breach of duty will fail.", "The court is likely to find that the defendant has permitted an unsafe practice if the claimant is able to injure his hand whilst wearing gloves which have not protected him, and his claim is likely to succeed."], "a": "E", "bx": "The answer was E. This is because the defendant has to provide a safe system of work and adequate equipment. A system which requires an employee to manually clean dangerous machinery is unlikely to be safe. Providing gloves which can be damaged, allowing an employee's hand to be injured, will not be classed as adequate equipment for the purposes of the common law duty. A is wrong because the claimant's job is to clean the machinery and he should be provided with adequate equipment allowing him to do so without being injured. B is wrong because allowing employees to manually clean machinery such that the claimant is injured by the machinery is unlikely to be a safe system of work. C is wrong because it is not for the claimant to prove which alternative system of work would be safer - it is for the employer to provide a safe system of work. D is wrong because the claim relates to system of work and adequate equipment, not premises."}, {"ch": 4, "n": 5, "sc": ["The claimant suffers a serious injury when a work colleague (who is on his first day in the job) fails to place a safety guard on the machinery being used by the claimant. The claimant has to use the emergency 'stop' lever, shutting down the machinery, but not before the equipment has smashed into his shoulder, causing a fractured bone. The new employee had not received any training on the machinery as the trainer responsible was unavailable and the foreman asked the new employee to help them with the work as they had a big order they needed to process."], "st": "Which of the following statements best represents the position of the court in respect of a claim brought against the employer under the common law?", "o": ["The court is likely to find that this was a non-fault accident as the employer has provided a training regime and cannot be held liable if the trainer is unavailable due to illness.", "The court is likely to find that the defendant has failed to comply with their common law duty of care in providing competent staff.", "The claim is likely to fail on the basis that the defendant has provided competent staff, the claimant should have notified the foreman that the new member of staff was not capable of operating the machinery.", "The court is likely to find that the defendant has complied with their common law duty of care in providing a safe system of work and the claimant's claim for damages for breach of duty will fail.", "The court is likely to find the claimant contributory negligent for allowing the new member of staff to assist when he had no formal training on the machinery being used."], "a": "B", "bx": "The answer was B. This is because the employer has a common law duty of care to provide competent staff. Sending staff onto the factory floor without any training is a breach of that common law duty of care. A is wrong because the employer has a common law duty of care to provide competent staff, which entails training staff to ensure they can do the job. C is wrong because it is not the responsibility of the claimant to notify his employer about the new member of staff. The employer has a duty of care to provide competent staff. D is wrong because although the system of work may be safe, allowing an untrained new member of staff is a breach of the employer's duty to provide competent staff and the court will find for the claimant."}, {"ch": 4, "n": 6, "sc": ["A petrol station attendant, employed to serve customers, becomes angry with a customer who asks a question, follows him onto the forecourt, orders him never to return and violently assaults him."], "st": "Is the employer likely to be vicariously liable for the assault?", "o": ["No, because assault is never within the course of employment.", "No, because the attendant was acting on a frolic of his own.", "Yes, because the employer has more money than the attendant.", "No, because the employer did not authorise the assault.", "Yes, because there is a sufficiently close connection between the attendant's job of dealing with customers and the assault."], "a": "E", "x": ["Wrong. Intentional wrongdoing can still be within the course of employment.", "Wrong. The attack was an unbroken sequence of events starting with his duties.", "Wrong. Ability to pay is a policy reason, not the legal test.", "Wrong. Unauthorised acts can still be in the course of employment.", "Correct. As in Mohamud v WM Morrison Supermarkets, the attack was closely connected with his role of interacting with customers."]}, {"ch": 4, "n": 7, "sc": ["A householder engages a self-employed plumber, who uses his own tools, sets his own hours and runs his own business, to fit a new boiler. The plumber negligently floods the neighbour's flat."], "st": "Is the householder vicariously liable for the plumber's negligence?", "o": ["Yes, if the householder supervised the work.", "No, because the plumber did not commit a tort.", "Yes, because the work was carried out on the householder's premises.", "No, because the plumber is an independent contractor, not an employee.", "Yes, because the householder engaged and paid the plumber."], "a": "D", "x": ["Wrong. There is no suggestion of supervision, and a householder hiring a tradesman does not usually control how the work is done.", "Wrong. Negligently flooding the flat is a tort.", "Wrong. The location of the work does not make the plumber an employee.", "Correct. There is generally no vicarious liability for the negligence of an independent contractor.", "Wrong. Engaging and paying someone does not create an employment relationship."]}, {"ch": 4, "n": 8, "sc": ["A delivery driver is told to drive directly between depots. Instead, he makes a 30-mile detour to visit his girlfriend, unrelated to his work, and negligently injures a pedestrian on the way."], "st": "Is the employer likely to be vicariously liable?", "o": ["No, because the pedestrian should sue the girlfriend.", "Yes, because employers are liable for everything employees do during working hours.", "Yes, because he was driving the employer's van.", "Yes, because he was an employee.", "No, because he was on a frolic of his own and not acting in the course of employment."], "a": "E", "x": ["Wrong. The girlfriend committed no tort.", "Wrong. There is no such rule.", "Wrong. Use of the employer's vehicle is not decisive.", "Wrong. Employee status is only one of the requirements; the tort must also be committed in the course of employment.", "Correct. A substantial detour for purely personal purposes takes the employee outside the course of employment."]}, {"ch": 4, "n": 9, "sc": ["A milkman's employer expressly forbids him to carry passengers on the milk float. He lets a boy ride with him to help deliver milk and collect payment. The milkman drives negligently and the boy is injured."], "st": "Is the employer likely to be vicariously liable?", "o": ["Yes, because the prohibited act was done for the purposes of the employer's business and so remained within the course of employment.", "No, because the milkman disobeyed an express prohibition.", "Yes, but only if the employer knew the boy was on board.", "No, because a prohibited act is always outside the course of employment.", "No, because the boy was a trespasser on the float."], "a": "A", "x": ["Correct. As in Rose v Plenty, the boy was helping with the employer's business, so the employer was vicariously liable.", "Wrong. A prohibition does not automatically take an act outside the course of employment.", "Wrong. Knowledge is not required.", "Wrong. Prohibited acts can still be a wrongful way of doing the authorised job.", "Wrong. The court did not treat the boy as defeating the claim on this basis."]}, {"ch": 4, "n": 10, "sc": ["An employer knows that one of its employees has a long history of dangerous practical jokes towards colleagues and has done nothing about it. The employee trips a colleague as a 'joke', and the colleague is injured."], "st": "Is the employer likely to be liable to the injured colleague under its common law duties?", "o": ["Yes, because the employer breached its duty to provide competent staff.", "No, because the colleague should have avoided the employee.", "No, because the practical joke was not in the course of employment.", "Yes, but only under the Occupiers' Liability Act 1957.", "No, because the employer provided a safe system of work."], "a": "A", "x": ["Correct. The employer knew of the danger and failed to act, breaching the duty to provide competent staff (Hudson v Ridge Manufacturing).", "Wrong. It is for the employer, not the colleague, to provide competent staff.", "Wrong. Even if vicarious liability fails, the employer may be primarily liable.", "Wrong. The relevant duty is the employer's common law duty.", "Wrong. A safe system of work does not cure the failure to deal with a known dangerous employee."]}, {"ch": 5, "n": 1, "sc": ["The claimant visits the defendant's pub. The pub is on two floors and has a grand open staircase with bannisters on either side leading down to the ground floor. As she is leaving the pub, the claimant attempts to slide down the bannister of the staircase and falls, seriously injuring herself. There are no warning signs alerting customers to the dangers of the bannister or the 4 metre drop either side of them."], "st": "Which of the following is likely to be the position of the court when considering the defendant's argument that the claimant accepted the risk of injury?", "o": ["The court is likely to find there is no liability for risks accepted by the claimant and that in sliding down the bannister the claimant accepted the risk of injuring herself.", "The court is likely to find liability attaches to the defendant as although the claimant may have accepted the risk, had the defendant erected warning signs, the claimant would not have attempted to slide down the bannister.", "The court is likely to find there is no liability under either the Occupiers' Liability Act 1957 or 1984 as the claimant was neither a visitor nor a trespasser when she slid down the bannister.", "The court is likely to find that liability attaches to the defendant as it was foreseeable that an old building with architectural attractive features would act as an allurement for those that have consumed alcohol.", "The court is likely to find the defendant liable under the Occupiers' Liability Act 1957 but reduce the claimant's damages to reflect contributory negligence on her part."], "a": "A", "bx": "The correct answer was A. This is because the court is likely to find there is no liability for risks accepted by the claimant and that in sliding down the bannister the claimant accepted the risk of injuring herself. The OLA 1957 provides that the common duty of care does not impose on an occupier any duty for risks which are willingly accepted by the visitor. A warning sign was not required as the risk was obvious (and indeed may have encouraged those that had not thought about sliding down the bannisters to slide down them). B is wrong because the OLA 1957 does not impose a duty for risks willingly accepted by the visitor. A warning sign was not necessary as the risk was so obvious. C is wrong because the claimant was a visitor for the purposes of the OLA 1957. D is wrong because a bannister is not an allurement and the claimant accepted the risk of falling when she decided to slide down the bannister. E is wrong because the defendant has a complete defence on the basis that the claimant willingly accepted the risk of injuring herself. Contributory negligence only applies as a defence where the defendant has been found liable for the claimant's injuries."}, {"ch": 5, "n": 2, "sc": ["The claimant is a seven-year-old boy who wanders through a council-owned public park with his friends and picks and eats berries from shrubbery around the park. The berries are poisonous and the boy dies."], "st": "Which of the following is likely to be the court's approach to the defendant's argument in their defence to the claim that being poisoned by eating berries is an obvious risk and one they do not need to warn visitors about?", "o": ["The court is likely to find that the parents of the claimant should have prevented him from eating the berries and the defendant will not be liable.", "The court is likely to find the claimant a trespasser and as the defendant took such care as is reasonable in all the circumstances no liability will attach to the defendant.", "The court is likely to find that a child of seven years would know that berries should not be eaten, and no liability will attach to the defendant.", "The court is likely to find the council at fault for failing to warn visitors but will reduce the claimant's damages to reflect that the claimant accepted the risk in willingly eating the berries.", "The court will take into account the age of the child, the risk posed by the poisonous berries and the fact that there were no warning signs to alert the public to the danger and find the defendant liable."], "a": "E", "bx": "The correct answer was E. This is because the court will take into account the age of the child - a seven-year-old would not be expected to understand the danger posed by the berries - they are bright and potentially an allurement. The risk posed by the poisonous berries in a public park where children play freely is high. The fact that there were no warning signs to alert the public to the danger is detrimental to the defendant. Signs are practical and cheap to install. A is wrong because it is common for children to wander around parks both with and without parents. B is wrong because the claimant is a visitor as the park was council owned and for the enjoyment of the public. C is wrong because a child of seven years is unlikely to appreciate that berries could be poisonous. D is wrong because a child of seven years would not appreciate nor could they accept the risk of eating the berries."}, {"ch": 5, "n": 3, "sc": ["The claimant is attending a council-owned gym when the pedals on the equipment he was exercising on suddenly fail, causing him injury when he is thrown from the equipment. The council have employed independent contractors to inspect and maintain all their gym equipment. The independent contractors undertook only a very limited inspection six weeks prior to the claimant's accident which shows no faults on the equipment."], "st": "Which of the following is likely to be the position of the court when considering whether the council is liable for the claimant's injury?", "o": ["The court is likely to find that the council is liable as the claimant was a visitor injured by the state of the council's premises.", "The court is likely to find that the council is not liable as the risk of injury on gym equipment is an obvious one against which the council cannot be expected to protect the gym users.", "The court is likely to find that the council and the independent contractors are equally liable for the claimant's injuries due to the faulty equipment.", "The court is likely to find that the council is not liable as they have entrusted the inspection and maintenance of the gym equipment to competent independent contractors.", "The court is likely to find that the council is liable for the claimant's injuries as the council should not have relied upon the work of the independent contractors."], "a": "D", "bx": "The correct answer was D. This is because the council are reasonable in entrusting the inspection and maintenance to an independent contractor. The court found that the inspection had been defective as it was limited but that the council were entitled to rely on the independent contractors as they were experts. A is wrong because, although the claimant is a visitor and is injured by the state of the claimant's premises, the council can defend the claim on the basis that they relied upon the instruction of independent contractors. B is wrong because the risk of injury is not obvious. Gym users do not expect to be injured by the gym equipment. C is wrong because the independent contractors will be liable and the council will escape liability. E is wrong because the council were entitled to entrust the inspection and maintenance to experts."}, {"ch": 5, "n": 4, "sc": ["The claimant is visiting a castle at a heritage site when he wanders along a corridor and sees a door with a large sign stating: 'no entry - steep staircase, strictly private - keep out'. Intrigued by what is behind the door, the claimant enters and starts to descend a staircase when he loses his footing and slips from the top to the bottom of the steps. In doing so he breaks his leg and wrist. He also smashes his mobile phone and the expensive camera he was carrying."], "st": "Which of the following is likely to be the court's approach to the claimant's claim against the occupier?", "o": ["The court will likely find the occupier liable under the Occupiers' Liability Act 1957 as the claimant was a visitor and they failed to take reasonable care of him.", "The court will likely find the occupier liable under the Occupiers' Liability Act 1984 as the claimant is a trespasser and the occupier has failed to keep him reasonably safe by locking the door at the end of the corridor.", "The court will likely accept that the claimant became a trespasser when he walked through the 'no entry' door but find that the occupier has done all that is reasonable to keep the claimant safe by placing a 'no entry' sign on it.", "The court will likely accept that the claimant was a visitor but that the risk of injury was obvious if not taking care when walking down stairs and the occupier will not be liable.", "The court will likely find the occupier liable under the Occupiers' Liability Act 1984 and compensate the claimant for his injuries and his damaged phone and camera."], "a": "C", "bx": "The correct answer was C. This is because the claimant exceeds his permission as a visitor the minute he enters through the 'no entry' door and becomes a trespasser. The duty under the Act is to take such care as is reasonable in all the circumstances. Also, the injury must be due to the state of the premises. The claimant has lost his footing and there is no suggestion that the stairs are defective. Further, by placing a sign on the door the defendant was ensuring that visitors do not enter places which are not accessible to the public. A is wrong because the claimant becomes a trespasser the instant he exceeds his permission and walks through the 'no entry' door. The OLA 1984 is the relevant Act not the OLA 1957. B is wrong because, although the claimant is a trespasser and the relevant act is the OLA 1984, the court is unlikely to find it reasonable to lock a door through which staff need to enter. There is no 'danger' to warn the claimant about, he has simply lost his footing on the stairs. D is wrong because the claimant becomes a trespasser the instant he walks through the 'no entry' door. E is wrong because the claimant is at fault for his injury by losing his footing but in any event property damage cannot be claimed under OLA 1984."}, {"ch": 5, "n": 5, "sc": ["The claimant is attending a concert in the city centre and parks her car in the concert's venue car park. The car park is in an area of the city centre that has a high crime rate and there have been many car thefts from the car park, which has been targeted by gangs over the last few months. As she enters the car park the claimant sees many large signs displayed stating: 'The management accept no liability for damage to or loss of property, personal injury or death. Vehicles (and their contents) are parked at the owner's risk. Please remove any items of value from your vehicle and ensure your vehicle is locked before leaving the car park.' The claimant returns to the car park after the concert to find that her car has been broken into and the claimant's laptop stolen from the back seat of her car."], "st": "Which of the following is likely to be the court's approach to the claimant's claim against the owner of the car park for the loss of her laptop?", "o": ["The court is likely to find the car park owners liable for the loss of property on the basis that an occupier is unable to exclude liability for property and personal injury.", "The court is likely to find the car park owners liable for the claimant's loss of property on the basis that an occupier is unable to exclude liability for property damage.", "The court is unlikely to find the car park owners liable for the claimant's loss of property as the exclusion notice is clearly displayed and has been brought to the claimant's attention and the wording of the notice covers the loss suffered.", "The court is likely to find the exclusion notice unclear as to whether the occupier would be liable for the loss of property from the back seat of the claimant's car and the claim would fail.", "The court is likely to find car park owners liable for the loss of the claimant's property as they have failed to take precautions to prevent their customers' property being damaged by criminal gangs in the city centre."], "a": "C", "bx": "The correct answer was C. This is because the exclusion notice is clearly displayed and has been brought to the claimant's attention, as the question states that the claimant has seen the sign as she enters. Also, the exclusion notice covers the loss as it mentions property within the vehicles. A is wrong because an occupier can exclude liability for property damage as long as the exclusion notice is clearly displayed and has been brought to the claimant's attention and the wording of the notice covers the loss suffered, but an occupier cannot exclude liability for personal injury or death. B is wrong because an occupier can exclude liability for property damage. D is wrong because the exclusion notice is clear and the wording relates to the loss suffered, namely property stolen from vehicles. E is wrong because occupiers are able to exclude liability under OLA 1957 as long as the exclusion notice is clearly displayed and has been brought to the claimant's attention and the wording of the notice covers the loss suffered. An increase in the crime rate in the area has no bearing on whether the court will find the exclusion notice reasonable."}, {"ch": 5, "n": 6, "sc": ["A brewery owns a pub and lets the manager live in a flat above it. The brewery keeps the right to do repairs, and the manager controls day-to-day access. A guest falls on a dangerous staircase leading to the flat."], "st": "Who is likely to be an occupier for the purposes of the Occupiers' Liability Act 1957?", "o": ["Only the brewery, as legal owner.", "Only the guest, while on the staircase.", "Both may be occupiers, because more than one person can have sufficient control over premises.", "Neither, because the staircase is a private area.", "Only the manager, as he lives there."], "a": "C", "x": ["Wrong. Occupation depends on control, not ownership.", "Wrong. A visitor is not the occupier.", "Correct. Following Wheat v Lacon, there can be more than one occupier, each with sufficient control.", "Wrong. Private areas are still premises within the Act.", "Wrong. The brewery also retained a degree of control."]}, {"ch": 5, "n": 7, "sc": ["Two chimney sweeps are called to clean a boiler flue. The occupier warns them not to work while the fire is lit because of the danger of fumes. They ignore the warning and die from carbon monoxide poisoning."], "st": "Is the occupier likely to be liable?", "o": ["No, because the sweeps were trespassers.", "Yes, because the occupier owes the common duty of care to all visitors.", "Yes, because the sweeps were invited onto the premises.", "No, because an occupier can expect a person exercising a calling to appreciate and guard against special risks incidental to it, and a warning was given.", "Yes, because warnings never discharge the duty to skilled visitors."], "a": "D", "x": ["Wrong. They were lawful visitors.", "Wrong. The common duty of care takes account of the visitor's skill.", "Wrong. An invitation makes them visitors but does not make the occupier liable.", "Correct. As in Roles v Nathan, skilled visitors are expected to guard against risks of their trade and the warning was adequate.", "Wrong. An adequate warning can discharge the duty."]}, {"ch": 5, "n": 8, "sc": ["A shop puts up a small sign saying 'Caution' at the entrance. Further inside, a section of floor has collapsed into a deep hole that is not visible from the entrance. A customer falls into the hole."], "st": "Has the warning discharged the occupier's duty?", "o": ["Yes, because a warning was displayed.", "Yes, because the customer accepted the risk.", "Yes, because customers must look where they are going.", "No, because an occupier can never rely on warning signs.", "No, because a warning discharges the duty only if, in all the circumstances, it was enough to enable the visitor to be reasonably safe."], "a": "E", "x": ["Wrong. Not every warning is sufficient.", "Wrong. The customer did not know of the specific danger, so could not have accepted it.", "Wrong. The hole was not visible, so care by the customer would not have avoided it.", "Wrong. Adequate warnings can discharge the duty.", "Correct. Under OLA 1957 s 2(4)(a), the warning must be enough to enable the visitor to be reasonably safe; a vague 'Caution' sign does not identify the danger."]}, {"ch": 5, "n": 9, "sc": ["A council park contains a lake with clear 'No swimming' signs. A young man dives into the shallow water, strikes his head on the bottom and is seriously injured. There was nothing unusual about the lake."], "st": "Is the council likely to be liable under the Occupiers' Liability Act 1984?", "o": ["Yes, because the council should have drained the lake.", "No, because trespassers are never owed a duty.", "Yes, because the council knew people swam in the lake.", "Yes, because the 1957 Act applies to all park users.", "No, because the risk arose from the claimant's own choice to engage in an obviously dangerous activity, not from the state of the premises, and there was no duty to protect him from it."], "a": "E", "x": ["Wrong. The court will not expect occupiers to take unreasonable steps against obvious risks.", "Wrong. Trespassers can be owed a duty under OLA 1984 s 1(3).", "Wrong. Knowledge alone does not mean the risk is one the occupier should protect against.", "Wrong. By diving against the signs he exceeded his permission and became a trespasser.", "Correct. As in Tomlinson v Congleton BC, the danger was obvious and arose from the activity, not a defect in the premises."]}, {"ch": 5, "n": 10, "sc": ["A company owns a derelict warehouse with rotten upper floors. It knows that teenagers regularly get in through a broken fence at night. It does nothing. A 15-year-old trespasser falls through the floor and is injured."], "st": "Is the company likely to be liable under the Occupiers' Liability Act 1984?", "o": ["No, because the teenager accepted the risk.", "Yes, because it knew of the danger, knew trespassers were in the vicinity, and the risk was one against which it could reasonably be expected to offer some protection.", "No, because trespassers are not owed any duty.", "Yes, and the teenager can also recover for his damaged mobile phone.", "No, because a warning sign would have been enough even though none was displayed."], "a": "B", "x": ["Wrong. A 15-year-old is unlikely to have fully appreciated a hidden danger like rotten floors.", "Correct. All three conditions in s 1(3) are satisfied, and repairing the fence would be a reasonable and inexpensive step.", "Wrong. A duty can arise under OLA 1984 s 1(3).", "Wrong. Property damage is not recoverable under OLA 1984.", "Wrong. No warning was given, so this cannot discharge the duty."]}, {"ch": 6, "n": 1, "sc": ["The claimant, a purchaser of woollen underpants from the defendant's company, suffers the skin condition dermatitis following wearing the defendant's garments. The claimant did not wash the garments prior to wearing them. It is established that the skin condition has been caused by sulphites left in the defendant's products following the manufacturing process."], "st": "Which of the following is likely to be the position of the court when considering whether the defendant is liable at common law for the defective underpants?", "o": ["The court is not likely to find the defendant liable for the claimant's injury as there is no negligence in the manufacturing process.", "The court will only find the defendant liable if the claimant can prove the manufacturing process was careless.", "The court is likely to find the defendant liable as presence of sulphites in the garments suggests that at some stage in the manufacturing process the defendant's employees have been careless.", "The court is not likely to find the defendant liable having done everything expected to ensure the garments are safe.", "The court is likely to find the defendant liable but reduce the claimant's compensation for failing to wash the garments before wearing them."], "a": "C", "bx": "The correct answer was C. This is because the court is likely to find the defendant liable as there is unlikely to be any other explanation as to the presence of sulphites in the garments other than the fact that one of the defendant's employees has been careless. This suggests the defendant has been negligent as you would not expect underpants to give you a skin condition. Nor is it reasonable to expect that garments should be washed before use. A is wrong because there is no other explanation other than negligence in the manufacturing process for the presence of sulphites in the garments. B is wrong because the manufacturer has not taken reasonable care in making the garments if sulphites are present in the underpants. D is wrong because the defendant has failed to do everything expected if sulphites are present in the underpants. E is wrong because it is not reasonable to wash garments before use and there is no reference to an instruction to the consumer to do so."}, {"ch": 6, "n": 2, "sc": ["The claimant injures himself using his employer's chisel. The chisel has been made by the second defendant following the design supplied to them by his employer (first defendant). The chisel is made of alloyed steel which is supplied to the second defendant by a third party. This is the second time the chisel has injured the employee due to a defect in the chisel. The defect in the chisel is due to the manufacturing process used by the third party."], "st": "Which of the following is likely to be the position of the court when considering the first defendant's argument that the third party should be liable as the defect is due to the third party's manufacturing process?", "o": ["The court is likely to find the third party liable as they manufactured the chisel and could not have expected either the first or second defendant to examine the tool for defects.", "The court is likely to find liability attaches to the first defendant as they were aware of the defect in the chisel as it had injured the claimant in a previous incident and they should have withdrawn it from circulation.", "The court is likely to find both the first and second defendants equally at fault as one designed the faulty product and the other manufactured it.", "The court is likely to find that liability attaches to the second defendant as they should have inspected the product for defects prior to use.", "The court is likely to find the claimant at fault on the basis that he knew the chisel was defective but carried on using it."], "a": "B", "bx": "The correct answer was B. This is because the court is likely to find liability attaches to the first defendant as they were aware of the defect in the chisel as it had injured the claimant in a previous incident and they should have withdrawn it from circulation. This is based on a real case where the court found that the defect occurred in the heat treatment of the alloyed steel by the third party but that there was no probability of the first or second defendant examining the product for defects. The fact the first defendant was aware of the defect due to the previous incident was enough for the court to find them at fault. A is wrong because the third party manufactured the chisel based on the design of the first defendant. C is wrong because although the defect occurred in the heat treatment of the steel there was no probability of the first or second defendant examining the steel for defects. D is wrong because there was no probability of the second defendant examining the product. E is wrong because the claimant has no choice but to use the product provided by his employer."}, {"ch": 6, "n": 3, "sc": ["The claimant purchases a hairdryer costing £60 and is in the process of drying his hair when the hairdryer explodes, causing him severe burns to his hand and face. As the hairdryer explodes it falls onto the claimant's bed and sets it alight. The fire spreads to the curtains and the claimant's bedroom suffers extensive damage."], "st": "Which of the following is likely to be the court's approach to the claimant's claim brought under the Consumer Protection Act (CPA) 1987?", "o": ["The court is likely to find that a defect in the hairdryer resulted in injury and property damage and will award the claimant damages in respect of personal injury, the cost of the hairdryer and cost of replacing all damaged property.", "The court is likely to find that a defect in the hairdryer resulted in injury and property damage and will award the claimant damages in respect of personal injury, the cost of the hairdryer and cost of replacing all damaged property as long as the total exceeds £275.", "The court will hold the defendant liable if the claimant can prove that the defendant manufacturer of the hairdryer has been negligent in the manufacturing process and the court will award damages for personal injury and the cost of replacing all damaged property (including the hairdryer), as long as the total exceeds £275.", "The court will hold the defendant liable if the claimant can prove that a defect in the product resulted in injury and the court will award damages only for personal injury and the cost of replacing all damaged property (except the hairdryer), as long as the total exceeds £275.", "The court will only hold the defendant liable if they consider that the hairdryer should have been subject to an intermediate examination by the claimant himself."], "a": "D", "bx": "The correct answer was D. This is because the court will hold the defendant liable if the claimant can prove that a defect in the product resulted in injury and the court will award damages only for personal injury and the cost of replacing all damaged property (except the hairdryer), as long as the total exceeds £275. Under CPA 1987 all the claimant needs to do is prove that the defect in the hairdryer caused the injury. The court will award damages for loss of or any damage to the claimant's personal property and it must exceed £275. Once property damage exceeds £275 the claimant will receive the full amount. The court will also award damages for personal injury. The claimant will not receive the cost of the hairdryer as this is pure economic loss. A and B are wrong because under the CPA 1987 the claimant cannot recover the cost of replacing or repairing the hairdryer. C is wrong because the court will hold the defendant liable if the claimant can prove that a defect in the product resulted in injury (not that the defendant has been negligent in the manufacturing process) as strict liability applies. E is wrong because the CPA 1987 does not require consumers to carry out examinations of products for defects."}, {"ch": 6, "n": 4, "sc": ["The claimant contracts Hepatitis C following a blood transfusion from infected donors. The risk of infection is known but there is no process by which the donors' blood can be tested for Hepatitis C and the risk of infection cannot be prevented."], "st": "Which of the following is likely to be the court's approach to the claimant's claim brought under the Consumer Protection Act (CPA) 1987?", "o": ["The court will find that blood is not a product as it is not manufactured but exists naturally and the claim will fail under the CPA 1987.", "The court will find that blood is not a product but that an industrial process is involved in its preparation and if a defect occurs in that process the defendant will be liable if they could have avoided it.", "The court will find that blood is a product and its preparation an industrial process but will not hold the defendant liable as the state of scientific knowledge at the time was such that the defect could not have been avoided.", "The court will find that blood is a product and its preparation an industrial process but will not hold the defendant liable as the public's expectation of having uncontaminated blood was unrealistic.", "The court will find that blood is a product and its preparation an industrial process and will hold the defendant liable as the public has an expectation of having uncontaminated blood products."], "a": "E", "bx": "The correct answer was E. This is because the court will find that blood is a product and its preparation an industrial process and will hold the defendant liable as the public has an expectation of having uncontaminated blood products. This is based on a real case where the court accepted that blood was a product and its preparation was an industrial process. The defendant tried to defend the claim on the basis of s 4(1)(e), namely, that the state of scientific knowledge was such that they were unable to test for Hepatitis C in the blood of donors and thus they were unable to detect it. The duty on a defendant under CPA 1987 is an onerous one. A is wrong because blood is a product due to the fact it undergoes an industrial process in order to be prepared for use. B is wrong because blood is a product for the purposes of CPA 1987. C is wrong because the duty under the CPA 1987 is onerous on defendants and, irrespective of the state of scientific knowledge, the public have an expectation of receiving uncontaminated blood. D is wrong because the public have an expectation of receiving blood free from viruses."}, {"ch": 6, "n": 5, "sc": ["The claimant is a thief who breaks into an industrial unit where electronic goods are manufactured. The thief steals a number of laptops and sells them to friends. He keeps one laptop for his own personal use. Unknown to the thief the laptops all contain a manufacturing fault. The claimant is injured when plugging in the laptop and suffers severe burns from electrocution. The laptop sets on fire and is destroyed."], "st": "Which of the following is likely to be the court's approach to the claimant's claim brought under the Consumer Protection Act (CPA) 1987?", "o": ["The court will find that the manufacturer is liable under the CPA 1987 for the claimant's injuries and damage to the laptop.", "The court will find that the manufacturer has a complete defence to the claim as the manufacturer did not supply the product to the claimant.", "The court will find that the manufacturer is liable as persons are generally entitled to expect that laptops are manufactured without defects.", "The court will find that the manufacturer is liable only in respect of the claimant's personal injury but not for the damage to the laptop.", "The court will find the manufacturer liable for the claimant's injuries and damage to the laptop but reduce the claimant's damages on the basis the claimant stole the laptop."], "a": "B", "bx": "The correct answer was B. This is because under s 4(1)(b) of the CPA 1987 the manufacturer would not be liable as they did not supply the product, the claimant stole it. A and D are wrong because there is no liability under the CPA 1987 for stolen products. C is wrong because although persons are generally entitled to expect laptops to be safe, the laptop was stolen and the manufacturer has a complete defence to the claim. E is wrong because contributory negligence only applies when the defendant has been found liable but the claimant has contributed to his injuries."}, {"ch": 6, "n": 6, "sc": ["A UK retailer imports electric heaters from a manufacturer outside the UK and sells them under the manufacturer's brand. A defective heater injures a customer. The overseas manufacturer has no assets in the UK."], "st": "Against whom can the customer bring a claim under the Consumer Protection Act 1987?", "o": ["No one, because the product was made abroad.", "Only the overseas manufacturer, as producer.", "Only the customer's insurer.", "The importer, as well as the producer, because importers are potential defendants under the Act.", "Only the retailer, under the Act, if it was negligent."], "a": "D", "x": ["Wrong. Importer liability exists to protect consumers in this very situation.", "Wrong. The Act extends liability beyond the producer.", "Wrong. Insurers are not defendants under the Act.", "Correct. Importers into the territory are potential defendants under CPA 1987 s 2(2)(c).", "Wrong. Liability under the Act is strict and does not depend on negligence."]}, {"ch": 6, "n": 7, "sc": ["A defective coffee machine catches fire in an office kitchen. It destroys the office carpet and furniture (worth £3,000) owned by the business. No one is injured."], "st": "Can the business recover its property damage under the Consumer Protection Act 1987?", "o": ["No, because damage to property is recoverable only where the property is ordinarily intended for private use and intended by the claimant mainly for private use.", "Yes, because the damage exceeds £275.", "Yes, but only the cost of the coffee machine.", "Yes, but only if negligence is proved.", "No, because the Act covers only personal injury."], "a": "A", "x": ["Correct. Under CPA 1987 s 5, business property is not covered.", "Wrong. The £275 threshold is necessary but not enough; the property must also be private property.", "Wrong. The defective product itself is never recoverable under the Act.", "Wrong. The Act imposes strict liability.", "Wrong. The Act covers personal injury and certain private property damage."]}, {"ch": 6, "n": 8, "sc": ["A consumer is injured when a new pressure cooker's lid explodes off. The manufacturer shows that its quality control was excellent and it could not have discovered the fault."], "st": "Will the manufacturer's evidence defeat a claim under the Consumer Protection Act 1987?", "o": ["Yes, because the consumer cannot identify how the defect arose.", "No, but damages will be halved.", "No, because liability under the Act is strict: the consumer need only prove a defect that caused the damage.", "Yes, because it took all reasonable care.", "Yes, because the consumer should have examined the cooker."], "a": "C", "x": ["Wrong. The claimant does not need to prove how the defect arose.", "Wrong. There is no rule halving damages.", "Correct. The Act imposes strict liability; proof of a defect and causation is enough.", "Wrong. Reasonable care is relevant in negligence, not under the Act.", "Wrong. The Act does not require consumers to examine products."]}, {"ch": 6, "n": 9, "sc": ["A drug is put on the market after full testing. Years later, new research reveals a side effect that no scientist anywhere could have detected when the drug was supplied."], "st": "Which defence under the Consumer Protection Act 1987 is the producer most likely to rely on?", "o": ["The defect did not exist when the product was supplied.", "The defect was caused by complying with the law.", "The state of scientific and technical knowledge at the time was not such that a producer might be expected to discover the defect.", "The product was not supplied in the course of business.", "The claimant contributed to the injury."], "a": "C", "x": ["Wrong. The defect existed at supply, though it could not be discovered.", "Wrong. There is no suggestion of legal compliance causing the defect.", "Correct. This is the development risks defence in s 4(1)(e), interpreted narrowly (see the blood products case).", "Wrong. A drug supplied commercially is supplied in the course of business.", "Wrong. Nothing suggests contributory negligence."]}, {"ch": 6, "n": 10, "sc": ["A manufacturer's sales terms state: 'We accept no liability under the Consumer Protection Act 1987 for any injury caused by our products.' A buyer is injured by a defect in one of its products."], "st": "What effect does the exclusion have?", "o": ["It excludes liability for property damage but not personal injury.", "It is valid only against business buyers.", "It excludes liability because the buyer agreed to the terms.", "It is valid if it is reasonable.", "None, because liability under the Act cannot be limited or excluded by any contract term, notice or other provision."], "a": "E", "x": ["Wrong. Section 7 applies to all liability under the Act.", "Wrong. Section 7 applies whoever the claimant is.", "Wrong. Agreement does not help the manufacturer here.", "Wrong. There is no reasonableness test under s 7; exclusion is simply prohibited.", "Correct. Section 7 of CPA 1987 prevents exclusion of liability under the Act."]}, {"ch": 7, "n": 1, "sc": ["The claimant owns a property backing onto the railway line. The railway company are aware of the plant Japanese knotweed (known to damage buildings if left untreated) which is growing close to the line and encroaching on the claimant's property."], "st": "Which of the following is likely to be the position of the court when considering whether the defendant is liable in private nuisance for the encroachment of Japanese knotweed on the claimant's property?", "o": ["The court is likely to find the defendant not liable in private nuisance as the character of the railway line and surrounding area is rural and the claimant should expect plants to grow around his property.", "The court will only find the defendant liable if the claimant can prove that the nuisance affects the comfort and convenience of life of a class of people.", "The court is likely to find the defendant not liable in expecting the railway company to remove the plant as the claimant is being too sensitive to the growing of plants in the vicinity of his property.", "The court is likely to find the defendant liable as Japanese knotweed is a natural hazard which affects the claimant's ability to use and enjoy the land.", "The court is likely to find the defendant not liable as the railway line is operated for the benefit of the citizens and the community."], "a": "D", "bx": "The correct answer was D. This is because the court is likely to find the defendant liable as Japanese knotweed is a natural hazard which affected the claimant's ability to use and enjoy the land. In order to be actionable in private nuisance there must be unreasonable interference with the land. This is based on a real case where the Japanese knotweed had not yet damaged the claimant's property but the court found that it was such a hazard due to its rapid spread that the claimant could claim loss of amenity (enjoyment) of the land and the cost of treating the soil to prevent the plant spreading. A is wrong because irrespective of the rural nature of the area the claimant is entitled to enjoy his land free from Japanese knotweed. B is wrong because comfort and convenience of a class of people relates to public nuisance not private nuisance. C is wrong because the claimant is not too sensitive. Japanese knotweed grows rapidly and would interfere with the claimant's enjoyment of his land. E is wrong because the public benefit is not an effective defence to private nuisance."}, {"ch": 7, "n": 2, "sc": ["The claimant owns a large country estate in an industrial area where many manufacturing companies operate. The claimant lives less than 2 miles from the defendant's smelting works. The vapours from the defendant's smelting processes damage the claimant's trees."], "st": "Which of the following is likely to be the position of the court when considering the claim brought in private nuisance by the claimant against the defendant?", "o": ["The court is likely to find the defendant not liable as the claimant lives in an industrial locality.", "The court is likely to find liability attaches to the defendant as there has been damage to property.", "The court is likely to find the defendant is not liable as it is likely the nature of the locality has changed over the years from rural to industrial as manufacturing companies came to the area.", "The court is likely to find that liability attaches to the defendant only if the claimant's enjoyment of the land is adversely affected.", "The court is likely to find the defendant not liable as the smelting works are for the benefit of the local economy."], "a": "B", "bx": "The correct answer was B. This is because the court is likely to find liability attaches to the defendant as there has been damage to property. This is based on a real case where the defendant tried to argue that the whole locality was industrial and he should be able to continue his smelting activities but the court found that interference will always be unreasonable if it causes damage to property. If the vapours had not caused damage but only personal discomfort the court would take into account the locality and character of the neighbourhood. A is wrong because interference causing damage to property will always be held to be unreasonable. C is wrong because locality is not relevant if the nuisance has caused property damage. If the vapours had not caused damage but only personal discomfort the court would take into account the locality and character of the neighbourhood. D and E are wrong because interference causing damage to property will always be held to be unreasonable."}, {"ch": 7, "n": 3, "sc": ["The claimant organised an 'acid house' party which took place in woods. Starting at 11 p.m. the party continued for 12 hours and thousands of people attended. DJs played loud music, and attendees parked the cars along the roads to the woods. There were no toilets or litter bins in the woods."], "st": "Which of the following is likely to be the court's approach as to whether the defendant created a public nuisance?", "o": ["The court is likely to find the claimant committed a public nuisance on the basis that the noise and inconvenience affected locals.", "The court is unlikely to find the defendant committed a public nuisance as the party only affected some local people.", "The court will find the duration of the party (12 hours) as insufficient as it was not continuous.", "The court is unlikely to hold the defendant liable as the party was for the benefit of the public good and enjoyment of the thousands of party goers.", "The court will accept the defendant's argument that the organisation of the party in isolation did not amount to a nuisance but it was the actions of the party goers which the defendant could not control."], "a": "A", "bx": "The correct answer was A. This is because the court is likely to find the claimant committed a public nuisance on the basis that the noise and inconvenience affected locals. This is based on a real criminal case where the defendant's party blocked roads and the party goers dropped litter and left urine and excrement throughout the woods. Locals as far away as 6 miles could hear the noise and vibrations from the sound systems. The public nuisance had affected a class of people and caused discomfort and inconvenience (lack of sleep, blocking roads and the mess left by the party goers). B is wrong because the local people fall into a class of people. C is wrong because it is not a requirement of public nuisance (but private nuisance) that the nuisance is continuous. D is wrong because a party causing noise and disturbance to locals is not for the benefit of the public good. E is wrong because the defendant committed a public nuisance in organising the party knowing many would attend and there are no isolated activities."}, {"ch": 7, "n": 4, "sc": ["A large group of spectators at a football match have their enjoyment of the football match disturbed when the defendant disables the floodlights."], "st": "Which of the following is likely to be the court's approach as to whether the defendant created a public nuisance?", "o": ["The court is likely to find the claimant committed a public nuisance on the basis that the convenience and comfort of a class of people have been affected.", "The court is unlikely to find the defendant committed a public nuisance as the spectators at a football match do not qualify as a class of people.", "The court will find the spectators have not suffered damage over and above other local residents and the claim will fail.", "The court is unlikely to hold the defendant liable as the spectators have come to the nuisance by attending the football ground.", "The court will accept the defendant's argument that the claimants have not suffered damage to property by the disabling of the floodlights."], "a": "A", "bx": "The correct answer was A. This is because the court will find the football spectators are a class of people. This is based on a real case where the defendant was planning to switch the lights off to benefit from gambling on the likelihood of this happening. B is wrong because spectators in the ground are classed as a group of people. C is wrong because the spectators do not need to suffer over and above the locals - they just have to qualify as a class of people. D is wrong because the spectators have attended the match with the intention of watching football, and there is no nuisance until the defendant disables the floodlights. E is wrong because the spectators have suffered inconvenience which is one of the kinds of damage which fall within the scope of the tort."}, {"ch": 7, "n": 5, "sc": ["The claimant suffers inconvenience (headaches), including the death of animals raised on his land, due to the escape of gas from the defendant's disused mines close to his property. The gas accumulates in mine shafts and mixes with oxygen to produce gas which when concentrated in air (and lack of wind/ventilation) can cause loss of consciousness and death."], "st": "Which of the following is likely to be the court's approach to the claimant's claim brought under the rule in Rylands v Fletcher?", "o": ["The court will likely find the defendant liable for the escape of a non-natural substance onto the claimant's land.", "The court will likely find the defendant not liable as the escape of gas has affected only individuals and not a class of people.", "The court will likely find the defendant liable due to collecting and keeping the gas in the mine shafts on their land and allowing it to escape.", "The court will likely find the defendant not liable as mining activity is a natural use of the land and the gas has not been brought onto the land by the defendant.", "The court will likely find the defendant liable as it was foreseeable that an unused mineshaft would emit toxic gas and do mischief by damaging property once it escaped."], "a": "D", "bx": "The correct answer was D. This is because the court will find the defendant not liable as mining activity is a natural use of the land and the gas has not been brought onto the land by the defendant. This is based on a real case where the claimant's claim failed under the rule in Rylands v Fletcher due to the fact that the court found mining and the natural gases emitted did not fall under 'non-natural' use. A is wrong because mining activity is a natural use of the land. B is wrong because the escape does not need to affect a class of people under the rule in Rylands v Fletcher. C is wrong because the collection of gas due to mining is a natural use of the land. E is wrong because mining on the land is a natural use of the land."}, {"ch": 7, "n": 6, "sc": ["A tall tower is built near a housing estate and interferes with television reception. A homeowner, her adult son who lives with her, and a lodger all want to sue in private nuisance."], "st": "Who can bring a claim in private nuisance?", "o": ["All three, because they all live at the property.", "Only the homeowner, because a claimant must have a proprietary interest in the land affected.", "None, because interference with TV reception is a public nuisance.", "Only the son, as a family member.", "Only the lodger, as he pays rent."], "a": "B", "x": ["Wrong. Residence alone is not enough (Hunter v Canary Wharf).", "Correct. Private nuisance protects interests in land, so a proprietary interest is required.", "Wrong. Public nuisance requires a class of people to be affected; this does not answer who can sue in private nuisance.", "Wrong. Family members without an interest in the land cannot sue.", "Wrong. A lodger does not usually have a proprietary interest."]}, {"ch": 7, "n": 7, "sc": ["A confectioner has used noisy machinery in his kitchen for many years without complaint. A doctor buys the neighbouring property and builds a consulting room against the shared wall. The noise now interferes with his consultations. The confectioner argues that the doctor came to the nuisance."], "st": "Is the confectioner's argument likely to succeed?", "o": ["Yes, because the doctor moved next to an established business.", "Yes, because the confectioner has acquired a right by prescription.", "No, because coming to the nuisance is not a defence to private nuisance.", "No, because noise can never amount to a nuisance.", "Yes, because the confectioner's business benefits the public."], "a": "C", "x": ["Wrong. Coming to the nuisance is not an effective defence.", "Wrong. Prescription requires 20 years of actionable nuisance; there was no nuisance until the consulting room was built.", "Correct. As in Sturges v Bridgman, coming to the nuisance is no defence.", "Wrong. Noise can amount to an unreasonable interference.", "Wrong. Public benefit is not an effective defence to private nuisance."]}, {"ch": 7, "n": 8, "sc": ["The claimant breeds silver foxes, which may eat their young if disturbed during breeding. The defendant neighbour, in a dispute about land use, deliberately fires guns on his own land close to the boundary during the breeding season to disrupt the breeding."], "st": "How will the defendant's motive affect liability in private nuisance?", "o": ["Malice is relevant to whether the interference is unreasonable, and the defendant is likely to be liable.", "The defendant has a defence because shooting is a natural use of land.", "The claimant cannot recover because foxes are abnormally sensitive.", "The defendant is liable only if the claimant suffers personal injury.", "It is irrelevant, because a person may do as he pleases on his own land."], "a": "A", "x": ["Correct. The courts take malice into account when deciding reasonableness (Hollywood Silver Fox Farm v Emmett).", "Wrong. Natural use is relevant to Rylands v Fletcher, not to this nuisance claim.", "Wrong. Abnormal sensitivity is outweighed by the deliberate intention to cause harm.", "Wrong. Private nuisance protects the use and enjoyment of land; personal injury is not required.", "Wrong. Malice can turn an otherwise lawful activity into an actionable nuisance."]}, {"ch": 7, "n": 9, "sc": ["A defendant's lorries regularly block a public highway for hours. Many road users are delayed. One claimant, a hotel owner on the road, loses significant trade because customers cannot reach his hotel."], "st": "Can the hotel owner bring a civil claim in public nuisance?", "o": ["Yes, because a class of people has been affected and he has suffered special damage over and above that of the public generally.", "Yes, but only if he can prove personal injury.", "No, because public nuisance can only be prosecuted by the Attorney General.", "No, because he does not own the highway.", "No, because delay is never a nuisance."], "a": "A", "x": ["Correct. A private claim in public nuisance requires a class of people to be affected and special damage to the claimant.", "Wrong. Special damage can include financial loss such as loss of trade.", "Wrong. An individual can sue if they suffer special damage.", "Wrong. A proprietary interest is a requirement for private nuisance, not public nuisance.", "Wrong. Obstructing a highway can amount to a public nuisance."]}, {"ch": 7, "n": 10, "sc": ["A mill owner builds a reservoir on his land to store large quantities of water. The water escapes through old mine shafts, flooding the claimant's house and injuring the claimant, who is struck by debris."], "st": "What can the claimant recover under the rule in Rylands v Fletcher?", "o": ["An injunction only, as damages are not available.", "Damages for both the flooding of his house and his personal injuries.", "Damages for the damage to his property, but not for his personal injuries.", "Nothing, because storing water is a natural use of land.", "Damages only if he proves the mill owner was negligent."], "a": "C", "x": ["Wrong. Damages are awarded to a successful claimant under the rule.", "Wrong. Personal injury cannot be claimed under the rule.", "Correct. A claimant can recover for damage to property but not personal injury.", "Wrong. Accumulating large quantities of water in a reservoir was held in Rylands v Fletcher itself to be a non-natural use.", "Wrong. Liability under the rule does not depend on proof of negligence."]}]},Q=D.q,L="ABCDE";let i=0,A={};
