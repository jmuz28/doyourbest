x?-1:a.x>l.x?1:a.y<l.y?-1:a.y>l.y?1:0),XT(i)}function XT(r){if(r.length<=1)return r.slice();const i=[];for(let l=0;l<r.length;l++){const u=r[l];for(;i.length>=2;){const h=i[i.length-1],d=i[i.length-2];if((h.x-d.x)*(u.y-d.y)>=(h.y-d.y)*(u.x-d.x))i.pop();else break}i.push(u)}i.pop();const a=[];for(let l=r.length-1;l>=0;l--){const u=r[l];for(;a.length>=2;){const h=a[a.length-1],d=a[a.length-2];if((h.x-d.x)*(u.y-d.y)>=(h.y-d.y)*(u.x-d.x))a.pop();else break}a.push(u)}return a.pop(),i.length===1&&a.length===1&&i[0].x===a[0].x&&i[0].y===a[0].y?i:i.concat(a)}var JT=Cg,Eg=kg;const ZT=T.forwardRef(({className:r,sideOffset:i=4,...a},l)=>C.jsx(JT,{children:C.jsx(Eg,{ref:l,sideOffset:i,className:ge("z-50 overflow-hidden rounded-md bg-popover px-3 py-1.5 text-xs text-popover-foreground animate-fade-in",r),...a})}));ZT.displayName=Eg.displayName;const Op="The scan captures this explanation out of order; it has been reassembled in reading order from the page image.",eC=[{n:1,id:"CNL035",scenario:"A woman is explaining to a friend the function of the Cabinet within the government.",q:"Which of the following best explains the Cabinet's function?",opts:["To decide the budget of each government department.","To make all decisions that the government needs to make each week.","To question the Prime Minister on government policy.","To make the most important decisions of the government.","To make decisions regarding military action."],ans:"D",expl:"(D) The best explanation is that the function of the Cabinet is to make the most important decisions of the government. Decisions which are expected to go to Cabinet include decisions to take military action, the most significant domestic and foreign policy issues, and setting out the government's legislative agenda as announced in the Queen's Speech. (A) and (E) are incorrect because they are too narrow. The Cabinet does make decisions regarding government budgets and military matters, but they are just two of the matters it is expected to address. (B) is incorrect because it is too broad. The Cabinet makes the important decisions; subcommittees and the Prime Minister (without committee input) can make less important decisions. (C) is incorrect. The goal of the Cabinet, of which the Prime Minister is a member, is to make collective decisions for government.",note:"The question screen for this question appears twice in the source; it is included once."},{n:2,id:"CNL055",scenario:"The Welsh Parliament has legislated contrary to the European Convention on Human Rights (the 'ECHR').",q:"Who can strike the legislation down as being invalid on this basis?",opts:["The Monarch.","The Crown.","The Supreme Court.","The Privy Council.","The Court of Appeal."],ans:"C",expl:"(C) The Supreme Court can strike down the legislation. If the devolved legislatures pass legislation that exceeds their law-making powers (including legislation that contradicts the ECHR), it will be struck down as invalid. The Supreme Court can make this declaration. Thus, (A), (B), (D), and (E) are incorrect."},{n:3,id:"ELS050",scenario:"A man stole a bicycle and was caught. He was charged with a single summary only theft offence.",q:"If the man is convicted, which of the following is the maximum sentence the judge could impose?",opts:["Five years' imprisonment.","Two years' imprisonment.","One years' imprisonment.","Six months' imprisonment.","Two-months' imprisonment."],ans:"D",expl:"(D) A summary only offence may be tried only in Magistrates' Court. The maximum sentence that may be imposed in Magistrates' Court for a single offence is six months' imprisonment."},{n:4,id:"ELS053",scenario:"A solicitor working at a firm was asked by their supervisor to research Criminal Finances Act 2017 c. 22.",q:"What is the name given to this type of reference to an Act of Parliament?",opts:["Its short title.","Its citation.","Its royal assent reference.","Its subsection.","Its legislative number."],ans:"B",expl:`(B) is correct. The language references the year and chapter of the Act of Parliament, and this is known as the Act's citation. (A) is incorrect as an Act's short title is a short name given to the Act. For example, the short title of 2017 c. 22 is the Criminal Finances Act 2017. Its long title is "An Act to amend the Proceeds of Crime Act 2002; make provision in connection with terrorist property; create corporate offences for cases where a person associated with a body corporate or partnership facilitates the commission by another person of a tax evasion offence; and for connected purposes". (C) is incorrect as the royal assent is a reference to the specific date an Act is approved by the Monarch. It would look like "27th April 2017". (D) is incorrect as a subsection is, as the name implies, a subset within a section of an Act of Parliament. A reference to a subsection would look something like: 2017 Ch 22 s69(1); 69 is the section and (1) is the subsection. (E) is incorrect as there is no such official term.`},{n:5,id:"CNL067",scenario:"Two weeks after not being paid for providing services to a local council under a contract, a consultant wishes to sue for the late payment of her fee.",q:"Which of the following best explains why the consultant cannot bring judicial review proceedings?",opts:["Because the consultant has not complied with the time limit for bringing judicial review proceedings.","Because the consultant does not have standing.","Because the matters raised do not involve public law.","Because the consultant would not be suing a 'public body'.","Because suits by private parties do not raise matters of public law."],ans:"C",expl:"(C) The consultant cannot bring judicial review proceedings most likely because the matters raised do not involve public law. To bring an application for judicial review, the matters raised need to involve public law. Here, the consultant is suing to enforce a contract, which the courts consider to be a matter of private law. Public law issues involve decisions of a public or governmental nature, where the public authority is making a decision that they have been explicitly authorised to do, usually by statute. (A) is incorrect because the consultant will comply with the three-month time limit to bring a judicial review claim. (B) is incorrect. The consultant would have standing under the sufficient interest test, considering that she is directly affected by the council's failure to pay her on time. (D) is incorrect because local councils are 'public bodies' for judicial review purposes. (E) is incorrect because it is untrue. The fact that a private party seeks judicial review of a public body's decision does not necessarily mean that only private law issues will be involved. Rather, when a private party sues a public body to enforce a contract, the courts will deem the matter to be regulated by private law."},{n:6,id:"CNL003",scenario:"The UK Parliament has enacted the Employment Pay (Nationality) Act 2012. The 2012 Act would allow employers to pay EU nationals 10% less than a UK national. The Act is controversial because it discriminates against EU nationals and is contrary to an EU regulation passed in 1983. In 2021, the EU Workers Union, a trade union that supports the rights of EU workers across the EU and beyond, challenges the validity of the 2012 Act before the High Court.",q:"Which of the following best explains how the High Court would likely respond to the action?",opts:["The High Court would be required to give effect to the EU regulation over the 2012 Act.","The High Court would be required to give effect to the 2012 Act over the EU regulation.","The High Court would be required to strike the legislation down because it breaches the Human Rights Act 1998.","The High Court would be required to declare the 2012 Act as contrary to the UK constitution.","The High Court would be required to declare the 2012 Act as contrary to common law rights."],ans:"A",expl:"(A) The High Court would be required to give effect to the EU regulation over the 2012 Act. Under the European Union (Withdrawal) Act 2018, as amended by the European Union (Withdrawal Agreement) Act 2020, retained EU law will prevail over conflicting UK law enacted before the end of the transition period (that is, before 31 December 2020). Under the 2018 and 2020 Acts, the EU regulation here was preserved as retained EU law, and because it conflicts with the 2012 Act, the EU regulation will prevail. (B) is incorrect because, for the reasons discussed, the EU regulation will prevail. (C) is incorrect because the courts do not have the power to strike down Acts of Parliament. Under the Human Rights Act 1998, the courts may make a 'declaration of incompatibility' concerning an Act that breaches human rights, but the declaration does not strike down the law. (D) and (E) are incorrect because, similarly to (C), the courts do not have the power to declare Acts of Parliament contrary to the constitution or to common law rights."},{n:7,id:"CNL0?4",scenario:"Created by statute, the Aeroplane Authorisation Authority is required to approve new models of aeroplanes in order for them to be allowed to fly in UK airspace. The Authority has rejected an application from a manufacturer for an aeroplane that has been allowed in most other major countries. It later emerges that the Chairperson of the Authority owns shares in a rival manufacturer, whose shares' value increased by 25% on the day the Authority made their decision. The manufacturer seeks judicial review of the Authority's rejection of their application.",q:"Which of the following will provide the best ground for the manufacturer's judicial review claim?",opts:["The Authority breached the rules of natural justice.","The Authority breached the automatic disqualification rule.","The Authority exhibited actual bias.","The Authority took into account an irrelevant consideration.","The Authority used their powers for an improper purpose."],ans:"B",expl:"(B) The best ground is that the Authority breached the automatic disqualification rule. When the member of a public body has a financial interest in the decision at issue, they are automatically disqualified from being involved in the decision. The Chairperson here had a financial interest in the decision, since the Chairperson owned stock in a rival to the manufacturer. Therefore, the Chairperson should not have been involved in the decision. (A) is incorrect because it is too broad and therefore not the best answer. The rules of natural justice include all types of bias, but also the right to be heard. (C) is incorrect because actual bias requires proof that the person subjectively was biased. That is usually impossible to prove and we certainly have no facts here regarding the Chairperson's subjective motivations. Therefore, actual bias does not provide the best ground for the manufacturer's claim. (D) and (E) are incorrect because they require facts that we do not have. The fact that the Chairperson had a financial interest in the decision may suggest that the decision was made for an improper purpose or involved an irrelevant consideration, but we do not know, as nothing in the facts indicates that the Chairperson actually made the decision for an improper purpose or based on an irrelevant consideration.",note:'The question ID is cut off at the bottom of the answer screen. Only the top of the characters is visible; it appears to read "CNL0_4", but the third digit cannot be read with confidence.'},{n:8,id:"ELS021",scenario:"Assume a UK law requires that all automobiles, motorcycles, trucks, and other motor-powered vehicles be equipped with headlights that automatically turn on when the vehicle is in operation. A police officer saw a small private aeroplane taxying without a headlight and gave the owner of the aeroplane a fine. In defence, the owner of the aeroplane claims that it does not fall under the law.",q:"If the court agrees with the owner of the aeroplane, which rule of language did it most likely use in interpreting the law?",opts:["Expressio unius est exclusio alterius.","A minore ad maius.","In pari materia.","Ejusdem generis.","Ad absurdo."],ans:"D",expl:"(D) Ejusdem generis is a language rule used to interpret general words. If a general word follows two (or more) specific words, the general word will apply only to items that are like the specific words used. Here, we are trying to determine whether the term 'other motor-powered vehicles' includes aeroplanes. Trucks, motorcycles, and automobiles use the roads, so the court limited the term 'other motor-powered vehicles' to include only vehicles normally driven on the road. (A) is incorrect because under this rule of interpretation, if one or more things of a class are expressly mentioned in a statute, the things not mentioned are excluded. Here, we are trying to interpret the meaning of the term 'other motor-powered vehicles'. A minore ad maius (B) is a Latin phrase meaning from the smaller to the greater (as in, if riding a bike with another person on it is prohibited, riding with two others would be prohibited as well). While interesting, this is not a typical rule of interpretation in the courts and is not applicable here in any event. In pari materia (C) is a rule of language that considers other statutes on the same subject to interpret the statute in question. Since we have no other statute here to help, this rule is not helpful here. Ad absurdo (E) means 'from the absurd' and is not applicable here because there is no absurd result here."},{n:9,id:"CNL120",scenario:"A group of 30 restaurant employees hold a spontaneous march in central Manchester to call for higher pay in their industry. The group hold the march alongside public roads running through the main shopping and office districts of the city.",q:"Which of the following best describes what has taken place?",opts:["A breach of the peace.","A trespassory march.","A trespassory procession.","A trespassory assembly.","A public procession."],ans:"E",expl:"(E) A public procession has taken place. A public procession is any march taking place in public, and this would include the group's march along public roads. (A) is incorrect. A breach of the peace occurs when a person becomes genuinely fearful of harm to themselves or property in their presence as a result of a disturbance, or when harm has or is likely to be done to a person or property in their presence. There is no indication that those events have taken place here. (B) and (C) are incorrect because there is no legal concept of a trespassory march or procession. (D) is incorrect because to qualify as a trespassory assembly, the assembly must take place on land to which the public have no right of access (or a limited right of access). That would include, for example, assemblies obstructing traffic on public roads. Here, however, the procession took place alongside the road, out of the way of traffic. In other words, it took place on land to which the public have a right of access.",note:Op},{n:10,id:"CNL106",scenario:"Under the Environmental Protection Act 2021, the Secretary of State for the Environment has the power to issue licences for recycling centres. Each licence needs to be renewed yearly.",q:"Which of the following best describes who can issue and renew licences under the 2021 Act?",opts:["Only the Secretary of State.","Only the Secretary of State and other ministers within the Department for the Environment.","A committee of the House of Commons.","Civil servants within the Department for the Environment.","A committee of the House of Lords."],ans:"D",expl:`(D) Civil servants within the Department for the Environment could issue and renew the licences. Under the Carltona Doctrine, if a power is granted by an Act of Parliament to a Secretary of State, then Parliament is taken to accept that, in practice, the power could be exercised by civil servants within the Secretary of State's department. While the Secretary of State and other ministers within the Department for the Environment may also issue and renew licenses, (A) and (B) are not the best choice because they each are limited by the word "only" and thus exclude the possibility/likelihood of civil servants within the department also issuing and renewing licenses. (C) and (E) are incorrect because those committees have not been granted the power to issue the licences under the 2021 Act.`},{n:11,id:"ELS033",scenario:"A solicitor is preparing a speech that he will give to lawyers visiting England from a country that follows a civil code. In the speech, the solicitor will explain the concept of precedent as it exists in England and Wales. The solicitor would like to include a specific example.",q:"Which of the following would create a binding precedent?",opts:["The ratio decidendi of a County Court case where the facts are materially the same.","The ratio decidendi of a Court of Appeal case where the facts are materially the same.","The ratio decidendi of a Supreme Court case where the facts are materially different.","The obiter dictum of a Supreme Court case where the facts are materially the same.","The obiter dictum of a Court of Appeal case where the facts are materially different."],ans:"B",expl:"(B) Binding precedent would arise from the ratio decidendi of a Court of Appeal case where the facts are materially the same. The law of England and Wales is based on the doctrine of judicial precedent. This means that, as a general rule, any decision reached previously by a higher court will be binding on judges in lower courts. The ratio decidendi is the reason for the decision and the binding part of a judgment. The ratio of a judgment from a higher court will bind lower courts provided that the case cannot be distinguished on the facts. (A) is incorrect because the county court is a lower court to which the system of judicial precedent does not apply. (C) is incorrect because a ratio will not be binding on lower courts, even if it is a Supreme Court judgment, if the case can be distinguished on the facts. (D) is incorrect, as while it might be extremely persuasive authority, particularly if it comes from the Supreme Court, an obiter dictum statement does not form the binding part of a judgment. (E) is incorrect because, while it might be extremely persuasive authority, an obiter dictum statement does not form the binding part of a judgment, particularly if the case can be distinguished on the facts.",note:Op},{n:12,id:"ELS009",scenario:"A defendant is charged with two offences that are triable either way. He wants advice from his solicitor about which court he should go to in order to minimise his penalty and what the maximum penalty would be.",q:"Which of the following is the correct advice to give to the defendant?",opts:["The Magistrates' Court is where he would receive the lesser penalty and where the maximum penalty is six months in prison and a £2,500 fine.","The Magistrates' Court is where he would receive the lesser penalty and where the maximum penalty is 12 months in prison and an unlimited fine.","The Crown Court is where he would receive the lesser penalty and where the maximum sentence is 9 months in prison and a £2,500 fine.","The Crown Court is where he would receive the lesser penalty and where the maximum penalty is 12 months in prison and an unlimited fine.","The Magistrates' Court is where he would receive the lesser penalty and where the maximum sentence is three months in prison and an unlimited fine."],ans:"B",expl:"(B) Because the defendant has been charged with two offences, he is best off in the Magistrates' Court - in which a sentence of up to 12 months could be imposed along with an unlimited fine. (A) is incorrect because the defendant is charged with two offences, so a longer prison sentence may be imposed. (C) and (D) are incorrect as the Crown Court will usually serve a higher punishment, and the maximum penalty may be life imprisonment. (E) is incorrect as the minimum sentence is not three months.",note:'The explanation for (E) says "the minimum sentence is not three months", although option (E) refers to a maximum. This is as shown in the source.'},{n:13,id:"CNL135",scenario:"At a meeting of senior police officers from around the country, concern is expressed about a new group that promotes terrorism. They ask the Home Secretary to ban the group under existing legislation. However, the Home Secretary is concerned that banning the group may conflict with Articles 10 and 11 of the ECHR, which are qualified rights.",q:"Which of the following best explains the concept of qualified rights?",opts:["The right can be limited only in the circumstances outlined in the article.","The right can never be limited.","The state can limit the right if necessary to promote legitimate interests stated in the article.","The state can place qualifications on when or how a right is exercised.","The state can require those who are exercising the right to meet certain qualifications."],ans:"C",expl:"(C) The state can limit a qualified right if necessary to promote legitimate interests stated in the ECHR article. Articles 10 and 11 are qualified rights. This means that these rights can be limited by the state in the circumstances outlined in the articles to the extent that is necessary and when pursuing the interests outlined - in this case, when it is in the interests of national security or the prevention of disorder or crime. (A), (B), (D), and (E) are incorrect because they do not accurately describe qualified rights. In particular, (A) provides the standard for limited rights, while (B) provides the standard for absolute rights."},{n:14,id:"ELS018",scenario:"A man found guilty of murder by the Crown Court appeals his conviction to the Court of Appeal.",q:"Which of the following statements best describes the power of decision reached by the Court of Appeal?",opts:["The Court of Appeal's decision will bind all UK courts.","The Court of Appeal's decision will not be binding on any court.","The Court of Appeal's decision will bind all courts unless the facts can be distinguished.","The Court of Appeal's decision will bind UK lower courts.","The Court of Appeal's decisions will bind the Court of Appeal in all future cases concerning the same matter."],ans:"D",expl:"(D) This is the foundation principle of English common law - namely that lower courts must follow the decisions of higher courts. (A) and (C) are incorrect because they are too broad. For example, the Supreme Court is not bound by the Court of Appeal. (B) is incorrect because it is false - a decision of the Court of Appeal will bind lower courts. (E) is incorrect as the Court of Appeal does not always bind itself."},{n:15,id:"CNL151",scenario:"Parliament has enacted the Digital Systems Protection Act 2021. The Act makes it an offence to hack into a digital system anywhere in the world. A woman suspected of hacking a digital system in Japan while in Canada has been arrested on her return to the UK. The woman wishes to challenge the validity of the Act on the basis that the events occurred outside of the UK.",q:"Which of the following best explains how the court will rule on her challenge?",opts:["The court will make a declaration of incompatibility because the Act conflicts with the Human Rights Act 1998.","The court will interpret the Act pursuant to the Human Rights Act 1998 so that it only applies to offences that take place within the UK.","The court will hold that the Act is invalid because the criminal events took place outside of the UK.","The court will enforce the Act.","The court will hold that the Act is valid but not enforceable because the criminal events took place outside of the UK."],ans:"D",expl:"(D) The court will enforce the Act against the woman. Under the doctrine of parliamentary sovereignty, Parliament can enact legislation that has effect beyond the boundaries of the UK. Thus, Parliament can legislate so that something is a criminal offence under UK law, regardless of where it takes place in the world. (A) and (B) are incorrect because these facts don't involve any human rights issues. (C) and (E) are incorrect. Due to parliamentary sovereignty, the courts cannot decide whether an Act of Parliament is valid or invalid, nor can they refuse to enforce it. In any case, Parliament can criminalise events taking place outside of the UK.",note:'The question ID appears in the source both as "CNL151" and as "CNL 151".'},{n:16,id:"CNL104",scenario:"A general election has been held, and efforts are underway to determine who will be Prime Minister.",q:"Which of the following statements best explains who will become the Prime Minister?",opts:["The person appointed by the Speaker of the House of Commons to be Prime Minister.","The person who can command the confidence of the House of Lords.","The person who is the leader of the largest party in the House of Lords.","The person who can command the confidence of the House of Commons.","The person who is appointed by the Privy Council to be Prime Minister."],ans:"D",expl:"(D) The Prime Minister will be the person who is able to command the confidence of the House of Commons. This means that they must be an MP and the leader of the party with a majority of seats in the Commons. Thus, (B) is incorrect. (A) and (E) are incorrect because the Prime Minister is appointed by the Monarch. (C) is incorrect because the Prime Minister must be an MP."},{n:17,id:"ELS044",scenario:"A thief is charged with theft of £100 from a supermarket till. To access the till, the thief used a penknife to wedge open the till to access the money. The statute that applies provides 'a defendant will commit such an offence if he uses a weapon in the course of carrying out a theft'.",q:"What presumptions can be made about the meaning of the statute if the literal meaning of the words are ambiguous?",opts:["None, the judge is not entitled to make presumptions.","The judge can make a presumption in favour of the defendant.","The judge can make a presumption in favour of the prosecution.","The judge can make any presumption that leads to a 'fair' outcome.","A presumption cannot be made in criminal cases."],ans:"B",expl:"(B) is correct because there may be a presumption in favour of the defendant in a criminal trial, but this is rebuttable when there is a relevant legal rule. This accords with the presumption of innocence of the defendant and the burden of proof being placed on the prosecution."},{n:18,id:"CNL148",scenario:"The government is pursuing a deeply unpopular policy, which sparks enormous political controversy. At the time it pursues this policy, the government lacks a majority of seats in the House of Commons.",q:"Will the government be required to step down?",opts:["Yes, because the government was pursuing a deeply unpopular policy.","No, because only the Speaker of the House of Commons determines whether the government should remain in office.","No, because only the Supreme Court can remove the government from office, and only if it acts illegally.","No, because the government remains in office for as long as it retains the confidence of the House of Commons.","Yes, because the government lacks a majority of seats in the House of Commons."],ans:"D",expl:"(D) The government stays in office as long as it retains the confidence of the House of Commons. This means that the government remains in office until the House of Commons passes a motion of 'no confidence', which can trigger an early election. After the election, if another party has a majority of seats in the Commons, that party would form the next government. (A) is incorrect because regardless of the popularity of the government's policies, a vote of no confidence would be required to remove the government. (B) and (C) are incorrect because the Speaker of the House of Commons and the Supreme Court cannot decide whether the government remains in power. (E) is incorrect. Despite the lack of a majority, the government remains in office until there is a vote of no confidence in the House of Commons."},{n:19,id:"CNL018",scenario:"A convicted criminal wishes to be pardoned for their crime.",q:"Who can grant the pardon?",opts:["The House of Lords.","The Prime Minister.","The Supreme Court.","The Monarch.","The Lord Chief Justice."],ans:"D",expl:"(D) The Monarch can grant the pardon. The granting of pardons is a royal prerogative power. Specifically, it is one of the ministerial prerogative powers. The Monarch formally grants the pardon on the advice of the government. (A), (B), (C), and (E) are incorrect because the power to pardon does not rest with anyone else."},{n:20,id:"CNL170",scenario:"A political group organises a march in a public park, near to a children's play area. The police allow the march, but they restrict its route from passing near to the children's play area or blocking paths to and from the play area. The political group then brings a claim before a UK court for a breach of their right to freedom of assembly and association under the European Convention on Human Rights ('ECHR').",q:"Will the political group likely be successful in their claim?",opts:["Yes, because the right to freedom of assembly and association is a qualified right that cannot be limited.","Yes, because the police did not act proportionately when they redirected the march's route.","Yes, because the right to freedom of assembly and association is an absolute right which cannot be derogated from.","No, because the right to freedom of assembly and association is a qualified right and the police acted proportionately when they restricted the route.","No, because the right to freedom of assembly and association is a limited right and the state has the right to limit the right as it sees fit."],ans:"D",expl:"(D) The group will likely not be successful because the police acted proportionately. The right to freedom of assembly and association is a qualified right requiring proportionality in balancing both sides' rights or concerns. Here, the political group has a right to protest, but the police may limit that right to advance any one of a number of interests, including preventing disorder or crime. The police arguably advanced that interest by protecting the children's play area and not blocking paths to and from it. Moreover, the police did not cancel the march but rather merely restricted its route. This seems to be a proportional response. (A) is incorrect because qualified rights may be limited to advance legitimate interests stated in the ECHR as long as the limitation meets the proportionality test. (B) is incorrect as the police appeared to have acted proportionately. (C) is incorrect as the right to freedom of assembly and association is not an absolute right. (E) is incorrect as the right to freedom of assembly and association is not a limited right."},{n:21,id:"ELS052",scenario:"A legal intern is reading a case that includes a majority opinion and a dissenting opinion rather than a unanimous decision. The intern asks her mentor to explain the difference in precedential effect among the three.",q:"Which of the following states the correct legal position?",opts:["Only a unanimous decision creates binding legal precedent, but a majority opinion and a dissenting opinion can create persuasive authority.","Both unanimous decisions and majority opinions create binding legal precedent, but a dissenting opinion can create persuasive authority.","A unanimous decision creates binding legal precedent, a majority opinion may create only persuasive authority, and a dissenting opinion creates neither binding nor persuasive authority.","Unanimous decisions, majority opinions, and dissenting opinions all create binding precedent.","Both unanimous decisions and majority opinions may create binding precedent, but persuasive authority can arise only from a dissenting opinion."],ans:"B",expl:"(B) When multiple judges hear a case, matter that is the ratio decidendi (that is, court statements that are essential to the court's decision) within their unanimous decision or the majority opinion forms binding precedent. Matter that is not ratio and matter in a dissenting or otherwise non-majority opinion may be persuasive authority, but it is never binding. (A) and (C) are incorrect because matter within a majority opinion can create binding precedent too. (C) is also incorrect in that a dissenting opinion may serve as persuasive authority. (D), on the other hand, is incorrect because a dissenting opinion cannot create binding precedent. (E) is incorrect because, as indicated above, matter within a unanimous decision or a majority opinion that is not part of the ratio can create persuasive authority."},{n:22,id:"CNL047",scenario:"In an ongoing court case, the parties disagree over how a provision in an Act of Parliament should be interpreted. One of the parties is relying on a statement made by a minister during a debate in the House of Commons. The court concludes that the provision of the Act is unclear but that the statement of the minister is clear.",q:"For purposes of its ruling, can the court properly refer to the minister's statement to interpret the provision?",opts:["No, because the courts cannot refer to debates in Parliament to interpret legislation.","Yes, because the courts can refer to debates in Parliament to interpret legislation whenever they choose.","Yes, because the courts can refer to debates in Parliament to interpret legislation if the legislation is unclear, there is a helpful statement from any MP, and the statement is itself sufficiently clear.","Yes, because the courts can refer to debates in Parliament to interpret legislation if the legislation is unclear and there is a helpful statement from a minister which is sufficiently clear.","No, because the courts can refer to debates in Parliament to interpret legislation only when the legislation is unclear, there is a helpful statement from the Lord Speaker, and the statement is itself sufficiently clear."],ans:"D",expl:"(D) The court can refer to the statement to interpret the provision. Generally, due to parliamentary privilege, the courts do not refer to statements made in Parliament as an aid to the interpretation of legislation. As an exception, if the legislation is unclear and there is a helpful statement from a minister which is sufficiently clear (as is the case here), the courts can use the statement when interpreting the legislation. (A) and (B) are incorrect because they are too broad. The courts can use debates in Parliament as an aid to interpreting legislation only under the circumstances previously described. (C) and (E) are incorrect because the statement must be by a minister."}],tC="The scan captures this explanation out of order; it has been reassembled in reading order from the page image.",nC=[{n:1,id:"CNL083",scenario:"A local council has given planning permission for a new shopping centre. Local residents are against the decision because they are concerned about the traffic that the development is likely to generate. On an application for judicial review, the court has agreed that the residents were not adequately consulted when the council made their decision.",q:"Which of the following remedies is the court likely to grant in favour of the local residents?",opts:["A declaration.","A quashing order and a declaration.","A quashing order and a mandatory order.","A quashing order and an injunction.","A quashing order and a prohibiting order."],ans:"C",expl:"(C) The remedies awarded are likely to be a quashing order and a mandatory order. A quashing order voids the original decision, meaning that it is of no legal effect, and the mandatory order would require the decision to be retaken, only this time with the residents being properly consulted. (A) and (B) are incorrect because they are not the best answers. A declaration simply states the rights or legal position between the parties, but does not require the decision to be retaken in a legally correct manner. (D) and (E) are incorrect because injunctions and prohibiting orders are aimed at preventing a public authority from doing something, whilst the aim here is for the public authority to do something - retake the decision with the residents being properly consulted."},{n:2,id:"CNL139",scenario:"An Act of Parliament passed in 1903 states that Hindus are not allowed to vote at general elections. An individual wishes to challenge the Act on the basis that it is discriminatory and breaches Article 14 (Prohibition of Discrimination) and Protocol 1, Article 3 (Right to Free Elections) of the European Convention on Human Rights.",q:"Which of the following best explains how the court should proceed?",opts:["The court should refer the matter to the European Court of Human Rights for a final decision.","The court should declare the Act invalid under the Human Rights Act 1998.","The court should defer to Parliament on the matter.","The court should refer the matter to the UK government.","The court should make a declaration of incompatibility."],ans:"E",expl:"(E) The best answer is that the court should make a declaration of incompatibility with respect to the Act. If it is not possible for a court to interpret an Act of Parliament in a way that complies with the Convention rights, then it must make a declaration of incompatibility. The declaration essentially signals to the government and Parliament that they may wish to consider the matter. If, as here, the legislation is clear and fundamentally contrary to the Convention rights, and cannot be interpreted to comply with the Convention rights, then the court should make a declaration of incompatibility. (A), (C), and (D) are incorrect because those procedures do not exist. (B) is incorrect because the Human Rights Act 1998 does not permit the courts to declare legislation invalid. Rather, it permits the courts to make a declaration of incompatibility, which signals to the government and Parliament that the issue with the legislation should be addressed.",note:'The question ID appears in the source both as "CNL 139" and as "CNL139".'},{n:3,id:"ETH008",scenario:'A law firm places an advertisement in a legal publication stating as follows: "Solicitor required to run a busy personal injury department. Experience required. No applicants over 50 years old should apply".',q:"Is this advertisement acceptable under the SRA Standards and Regulations?",opts:["No, as it tends to show that the firm is not acting with integrity.","Yes, as it makes clear to the applicants the skills and experience required for the role.","No, as it tends to show that the firm is not encouraging equality, diversity, and inclusion.","Yes, as it tends to show an active and targeted recruitment policy.","Yes, as it tends to show that the firm is being run in accordance with sound financial and risk management principles."],ans:"C",expl:"(C) Adding an age limit to a job advertisement tends to show that the firm is not encouraging equality, diversity, and inclusion in accordance with Principle 6. Whether a violation of this Principle has occurred is sometimes arguable, but such a blatant statement in a job advertisement would be in breach of the Principle and likely the Equality Act 2010. (A) is incorrect. It may be a true statement to an extent, but the central issue is related to equality and diversity, not the more general issue of integrity. (B) and (D) are incorrect because the age limit breaches the Principle regarding equality and diversity. (E) is incorrect. Such a blatant error in an advertisement may tend to show that the firm is not acting in accordance with sound risk management principles."},{n:4,id:"ETH136",scenario:"A law firm specialising in discrimination claims sends out a 30-page client care letter to all clients. The client care letter provides extensive information about the firm, its services, and regulatory protections. The firm is located in an area with a large immigrant population and often the clients have poor or no English language skills.",q:"How should client care information be given to these clients?",opts:["The firm should continue to send the 30-page client care letter in English.","The firm should offer to translate the letter into different languages.","The firm should write to the client telling them to raise any enquiries with their fee earner.","The firm should provide legal services without providing client care information.","The firm should insist that each client attends the office to discuss the client care terms."],ans:"B",expl:"(B) A law firm must inform clients about service standards and other matters. Traditionally this is achieved by providing clients with information in a letter and in terms of business. There is a regulatory duty to ensure that clients receive information in a way that they understand so that they are in a position to make informed decisions about the services they need, how their matter will be handled, and the options available to them. This means that if a client does not understand the information, it should be translated. (A) is incorrect because the law firm will not have shown that they have delivered information in a way that is appropriate to each particular client. (C) and (E) are incorrect because these solutions are placing unnecessary burdens on the clients. (D) is incorrect because failure to provide this information would be a breach of regulatory duties.",note:tC},{n:5,id:"CNL096",scenario:"A group wish to protest against a government policy regarding genetically altered foods by holding a procession.",q:"Ordinarily, when must the group provide notice to the police of the procession?",opts:["Six hours before the proposed date.","Six months before the proposed date.","Six weeks before the proposed date.","Six clear days before the proposed date.","One week before the proposed date."],ans:"D",expl:"(D) The notice must be given to the police at least six clear days before the proposed date of the procession (or, if that is not possible, as soon as reasonably practicable). Therefore, (A), (B), (C), and (E) are incorrect."},{n:6,id:"ETH113",scenario:"A solicitor is acting for a client appearing in the Crown Court on criminal charges. It is necessary to instruct a barrister and the client tells the solicitor that he must find a male barrister as he feels that a woman could not be trusted to do as good a job.",q:"Should the solicitor act on this request?",opts:["Yes, because a solicitor must always act on client instructions.","No, because although acting on the request would be legal, the client is placing the solicitor in breach of his regulatory duty to act in a way that encourages equality, diversity, and inclusion.","Yes, because the client must have confidence in their legal representation.","No, because the solicitor has both legal and regulatory duties to comply with equality legislation and to act in a way that encourages equality, diversity, and inclusion.","Yes, because the law and regulation are silent on this point."],ans:"D",expl:"(D) These instructions are an example of direct discrimination in breach of both the Equality Act and regulatory duties, such as the SRA principle to act in a way that encourages equality, diversity and inclusion. The solicitor should refuse these instructions. (A) is incorrect because a solicitor must not act on instructions that place him in breach of the law or regulatory duties. (B) is incorrect because the solicitor has a legal duty to comply with the Equality Act. (C) is incorrect because the client's instructions are unlawful and would cause the solicitor to breach his regulatory duties. The solicitor must explain this to the client and suggest suitable counsel based on non-discriminatory criteria. (E) is incorrect because this is not a true statement of the facts."},{n:7,id:"CNL138",scenario:'An Act of Parliament passed in 1923 and still in force provides that senior positions within the Army should be filled by "eligible officers". An "eligible officer" is defined as a man of at least eight years experience. A female officer applied for a senior position in the Army but was rejected. The female officer challenges the denial before the High Court on the grounds that the Act violates Article 14 of the European Convention on Human Rights (the prohibition of discrimination), but she does not claim that it violates any other Convention right.',q:"Which one of the following best explains how the court should deal with the case?",opts:["The court must make a declaration of incompatibility under the Human Rights Act 1998.","The court must declare the Act invalid under Article 14 because it discriminates on the basis of sex.","The court must refer the case to the European Court of Human Rights.","The court must dismiss the case.","The court must ask Parliament to amend the legislation."],ans:"D",expl:"(D) The court must dismiss the case. An Article 14 claim can be brought only if it is attached to the breach of another Convention right. Here, the female officer argues that the Act violates Article 14, but she does not connect this to the breach of another Convention right. Therefore, the court must dismiss the case. (A) and (B) are incorrect because those choices indicate that the court can reach the merits of the case. However, for the reasons discussed, the court must dismiss the case. (B) is also incorrect because the courts do not have the power to declare an Act of Parliament to be invalid. For Acts of Parliament that are incompatible with Convention rights, the most the courts can do is to issue a declaration of incompatibility. (C) and (E) are incorrect because these options would allow the courts to refer the matter elsewhere, rather than address the issue. Such options are not provided for in the Human Rights Act 1998."},{n:8,id:"ETH134",scenario:"A firm has dealt with a complaint of sexual harassment made by a junior member of staff against one of the partners. The complainant was offered a financial settlement and signed a non-disclosure agreement to confirm that she would not discuss the matter outside the firm and that she would not make a report to the SRA or the police. Neither the firm nor the complainant pursue the matter further.",q:"Were the firm's actions in accordance with the SRA Standards and Regulations?",opts:["Yes, because the SRA's regulatory reach does not extend to employment matters and this is an HR issue.","No, because the firm has a regulatory duty to report serious misconduct to the SRA.","Yes, because the complainant is happy with the terms of the non-disclosure agreement.","No, because there is a legal duty to notify the SRA of serious misconduct.","Yes, because there is no requirement to involve the SRA unless a matter has become public knowledge."],ans:"B",expl:"(B) Sexual harassment indicates that the SRA Principle to act in a way that encourages equality, diversity, and inclusion has not been satisfied, and a firm must notify the SRA of such conduct on the ground that it is a serious breach of regulatory and professional duties. Any action which means that the SRA is not notified (such as the signing of a non-disclosure agreement) aggravates the regulatory consequences. Additionally, a firm must not attempt to prevent anyone from providing information to the SRA or any other body exercising regulatory, supervisory, investigatory, or prosecutory functions in the public interest. The provision of the agreement that bars the complainant from making a report is a breach for this reason as well. (A) is incorrect because the SRA's interest in the individual and the firm extends to behaviour as well as service provision. (C) and (E) are incorrect because the complainant's position is not relevant; nor is the fact that the matter has not become public knowledge. (D) is incorrect because the duty is regulatory rather than legal."},{n:9,id:"ELS066",scenario:"A juror has been selected to sit on the jury for a criminal case that is being tried at the Crown Court. The juror wishes to learn more about what this means.",q:"Which of the following statements best describes the juror's role?",opts:["The jury is there to assess whether the judge has made the right decision when convicting or acquitting the defendant.","The jury conducts investigations to assess whether the defendant is guilty or not guilty.","The jury decides what sentence the defendant should receive.","After listening to the evidence, the jury decides whether the defendant is guilty or not guilty.","The jury listens to the evidence and deliberates with the judge to determine whether the defendant is guilty or not guilty."],ans:"D",expl:"(D) The jury's role is to listen to evidence and determine whether the defendant is guilty. (A) is incorrect as only the jury makes the decision to convict or acquit, not the judge. (B) is incorrect as the jury assesses only the evidence presented before them at the trial, and then makes a decision to convict or acquit. (C) is incorrect as the jury does not decide on sentence, only the judge has the power to impose a sentence. (E) is incorrect as the jury does not deliberate with the judge regarding verdict."},{n:10,id:"ELS023",scenario:"A UK court is interpreting an ambiguous tax provision dealing with potentially exempt transfers ('PETs'). The court found that as the tax provisions were created to prevent the evasion of inheritance taxes, the PET tax provision must be read together with the inheritance tax laws.",q:"Which rule of language is the court using to interpret the gift tax law?",opts:["Expressio unius est exclusio alterius.","Noscitur a sociis.","In pari materia.","Ejusdem generis.","None of the above."],ans:"C",expl:"(C) In pari materia roughly means 'upon the same matter or subject'. It is used when other laws may assist in interpreting ambiguity in the law concerned. (A) is incorrect. Expressio unius est exclusio alterius roughly means 'expression of one thing is the exclusion of another'. Under this legal maxim, if one or more things of a class are expressly mentioned in a statute, the things not mentioned are excluded. (B) is incorrect. Noscitur a sociis stands for the doctrine that the company interprets a word it keeps. That is, when interpreting a statute, courts consider the context in which a word is used, thereby using words in the same section of the statute to interpret the word in dispute. (D) is incorrect. Ejusdem generis means 'of the same type'. It is used to interpret general words, meaning if a general word follows two (or more) specific words, the general word will only apply to items that are like the specific words used. (E) is incorrect because the rule of language in pari materia applies."},{n:11,id:"ETH092",scenario:"A solicitor's firm is part of a local network of law firms, and the solicitor is involved in an initiative to encourage business and to build good relations between the firms. A colleague from another firm has suggested an arrangement where, if a firm does not offer services in a particular area of law, they can refer a matter in that area of law to another local law firm. Although no payments or other consideration will be given for the referrals, it will generally help each firm and will create a culture of goodwill and collaboration.",q:"Which of the following statements best describes whether the solicitor should set up this arrangement?",opts:["There is nothing in the SRA Standards and Regulations which describes this arrangement, and the solicitor's decision is therefore a commercial one.","The solicitor can set up the arrangement, but participants should not refer clients for matters involving personal injury or death, or where the client is the subject of criminal proceedings.","The solicitor can set up the arrangement, but participants should ensure that each referral or introduction is in the client's best interests.","The solicitor can set up the arrangement, but participants should not refer clients in matters involving personal injury or death.","The solicitor can set up the arrangement, but participants should not refer clients who are the subject of criminal proceedings."],ans:"C",expl:"(C) The arrangement described in the scenario does not result in any fees being paid, so there is no need to consider the issue of paying referral fees and the accompanying restrictions. Instead, the general principle of acting in clients' best interests will be relevant. (A) is incorrect because it is not the best answer. While the SRA Standards and Regulations do not specifically prohibit this type of arrangement, solicitors are still required to consider the client's best interests when making any referral or introduction. (B), (D), and (E) are incorrect because the restrictions relating to these types of matters apply only in the context of payments."},{n:12,id:"ETH006",scenario:"A litigation solicitor is dealing with a claim for a client. The solicitor realises that they should have issued court proceedings, but they failed to do so and the client's action is now time barred.",q:"Which of the following statements best describes the steps the solicitor should take under the Code of Conduct?",opts:["The solicitor should notify their indemnity insurer.","The solicitor should notify the client that they have discovered an omission which could give rise to a claim by the client.","The solicitor should bill the client for time costed to date and close the file.","The solicitor should inform the client of the client's right to complain through the firm's complaints procedure.","The solicitor should review the file to see if there are any other courses of action which the client might have."],ans:"B",expl:"(B) The solicitor must be 'honest and open' with clients if things go wrong. This is central to the duties owed by a solicitor to their client - the fact that a solicitor has to 'self-regulate' and own up to mistakes. (A) is incorrect. Reporting to the insurer is another almost inevitable consequence of this error, but the point of the question relates to owning up to the client and the solicitor's responsibilities under the Code of Conduct. (D) is incorrect because the solicitor should have informed the client of their right to complain at the outset of the matter. Now, they must inform the client of what has gone wrong. (E) is a true statement, but it is not the best answer because it does not address what is required under the Code of Conduct. (C) is incorrect because the solicitor must inform the client of the omission."},{n:13,id:"ELS065",scenario:"A claimant is not happy with the decision made by the District Judge on the small claims track and wishes to appeal.",q:"Which of the following is the correct route to appeal?",opts:["The House of Lords.","The Supreme Court.","The High Court.","The Court of Appeal.","Appeal to a Senior Circuit Judge at the County Court."],ans:"E",expl:"(E) If a claimant is unhappy with the decision of a District Judge in a small claims case, appeal is to a Senior Circuit Judge at the County Court. As a result, none of the other choices is correct."},{n:14,id:"ETH075",scenario:"At the beginning of each retainer, a firm sends information it believes clients need in accordance with the Code of Conduct as various separate documents attached to an email. This email includes costs information. A client received and acknowledged this email but is now refusing to pay his bill, complaining that he has not received a formal 'client care' letter in the post.",q:"Is the client's complaint likely to succeed?",opts:["Yes, because it is mandatory for every firm to send a client care letter at the beginning of each new matter.","No, because while the firm was required to send a client care letter, the client is not entitled to withhold the payment.","No, because a firm is not obligated to send a client care letter.","No, because the firm provided the relevant information at the outset of the retainer.","Yes, but only until the firm sends a client care letter by post, which it can do retrospectively."],ans:"D",expl:"(D) The Code does not state that a formal client care letter must be sent at the beginning of each retainer. A firm can decide how best to meet the needs of its clients in this regard. There is no suggestion in the fact pattern that the client did not want to receive the information by email, and the client acknowledged receipt of the email communication received from the firm. (A) is incorrect. It is not mandatory to send a client care letter; firms can choose how to send the initial information required by the Code. (B) is incorrect for the same reason. (C) is incorrect because while it is true that a client care letter is not required, a solicitor still has an obligation to provide the client with information about the matter. (D) is the more complete answer and takes into account that the firm did provide the client with the costs information via email. (E) is incorrect because a firm cannot send a client care letter retrospectively; the point is that the information is given to the client at the beginning of the retainer. Additionally, in this case the firm already provided the relevant information."},{n:15,id:"CNL005",scenario:"The UK government has agreed to and ratified a new international treaty aimed at reducing the stock of nuclear weapons across the world. However, the UK government has announced that despite the treaty, it has decided not to reduce its stock of nuclear weapons. The Association against Nuclear Weapons wishes to challenge this decision before the courts.",q:"How are the courts likely to respond to any challenge against the UK government's decision?",opts:["The decision of the UK government is illegal because it is contrary to the treaty.","Decisions of the UK government cannot be challenged before the courts.","The decision of the UK government is illegal because it may only be made by Parliament.","The decision of the UK government is illegal because they have not consulted the Scottish government.","The decision of the UK government is legal under UK law."],ans:"E",expl:"(E) The decision of the government is legal under UK law. Under the doctrine of parliamentary sovereignty, an international treaty does not have effect in UK law unless the treaty is incorporated into UK law by an Act of Parliament. Nothing in the facts indicates that an Act of Parliament was passed. Thus, the government's decision did not violate UK law. (A) is incorrect because, as discussed, the treaty was not part of UK law. (B) is incorrect because decisions of the government may be challenged in court. (C) is incorrect because, as indicated above, the government could make such a decision. (D) is incorrect because there is no requirement that the Scottish government be consulted."},{n:16,id:"CNL008",scenario:"During a debate in the House of Commons, an MP accused the chairman of a large multi-national company of defrauding the company for his own personal gain. The chairman is furious at this slur against his good name and denies any wrongdoing.",q:"Which one of the following best explains the legal position?",opts:["The chairman can sue the MP for defamation.","The chairman can sue other MPs in the same party as the MP who made the statement for allowing the statement to be made.","The chairman cannot sue the MP for making the statement.","The chairman can sue the Speaker of the House of Commons for allowing the MP to make the statement.","The chairman cannot sue the MP due to the sub judice rule."],ans:"C",expl:"(C) The chairman cannot sue the MP for making the statement. Under the doctrine of parliamentary privilege, MPs (and members of the House of Lords) have absolute freedom of speech in Parliament. This means that statements made in Parliament cannot be challenged in the courts. (A) is incorrect because parliamentary privilege would bar the chairman from suing the MP. (B) and (D) are incorrect because parliamentary privilege would extend to such suits. (E) is incorrect because the sub judice rule, which requires MPs and members of the House of Lords to not refer to pending cases during debates, is not relevant here.",note:'The source spells the rule "sub judicie"; it is shown here as "sub judice".'},{n:17,id:"ETH062",scenario:"A receptionist in a legal firm also does some typing work whilst she is on reception. She leaves the files that she is working on out on the desk. A client whose sexual harassment claim has recently completed comes in to make his final payment and is annoyed to see that his file is on the reception desk in full view of other people visiting the firm. The cover containing the client's name and the nature of the matter is visible, but the contents of the file are not visible. The client in question makes a complaint alleging a breach of the firm's duty of confidentiality to the client.",q:"Which of the following statements best describes whether the firm has breached its duty of confidentiality?",opts:["There has been no breach of the duty of confidentiality because the contents of the file were not visible to others; only the cover of the file was visible.","There has been no breach of the duty of confidentiality because the receptionist is not a solicitor.","There has been a breach of the duty of confidentiality because the duty continues until a client has died.","There has been a breach of the duty of confidentiality because the fact that the person is a client of the firm and the nature of the matter is visible to others.","There has been no breach of the duty of confidentiality because the matter has completed."],ans:"D",expl:"(D) The fact that the client's name and matter is visible to others is sufficient to breach the duty of confidentiality owed to the client. (A) is incorrect because the duty extends to all the client's affairs. (B) is incorrect because the duty of confidentiality to clients is owed by everyone in the firm. (C) and (E) are incorrect because the duty of confidentiality continues despite the retainer and even after the death of the client."},{n:18,id:"CNL037",scenario:"The Prime Minister wishes to appoint a member of the House of Lords to his Cabinet as Secretary of State for Business. The minister is not a member of the Privy Council.",q:"Does this pose a problem for the Prime Minister?",opts:["Yes, because all ministers must be members of the Privy Council.","Yes, because all ministers must have a seat in the House of Commons.","No, because all ministers must have a seat in the House of Lords.","No, because the Prime Minister can appoint anyone they like as a minister.","No, because ministers can come from the House of Commons or the House of Lords."],ans:"E",expl:"(E) The appointment does not pose a problem for the Prime Minister. Ministers must have a seat in either the House of Commons or the House of Lords, although most ministers come from the House of Commons. This ensures that the government is accountable to Parliament. (A) is incorrect because ministers need not be on the Privy Council. (B) and (C) are incorrect because ministers may come from either House. (D) is incorrect because ministers must have a seat in either House; the Prime Minister cannot appoint anyone."},{n:19,id:"CNL149",scenario:"The government has appointed an expert commission to consider the future of devolution in the UK. The commission issues a report, part of which summarises the current model of the UK's devolution scheme.",q:"Which of the following would best describe the report's summary of the UK's current devolution scheme?",opts:["That all the nations of England, Wales, Scotland, and Northern Ireland each have the same level of devolved powers.","That the UK is a union state formed of England, Wales, Scotland, and Northern Ireland.","That the UK is a federal state with certain powers reserved for the central institutions that govern for the whole UK, and with the remaining powers exercised at the local level.","That there are different levels of devolution across England, Wales, Scotland, and Northern Ireland.","That the UK is a unitary state with legislative power concentrated in the UK Parliament."],ans:"D",expl:"(D) The UK follows an asymmetric devolution scheme. This means that there are different levels of devolution across Wales, Scotland, and Northern Ireland, with no devolution of legislative power given to England. (A) is incorrect as each nation has different levels of devolved power. (B) and (E) are incorrect because, while true, those choices don't explain the concept of asymmetric devolution. (C) is incorrect because it also does not address asymmetric devolution, and it falsely characterises the UK as a federal, rather than a unitary, state."},{n:20,id:"ETH069",scenario:`A solicitor is acting for a client who has been accused of sexual harassment by an employee. The solicitor sees the client to go through the papers prior to an employment tribunal hearing, and the client becomes increasingly agitated. At the end of the interview the client says he is going to go and see the employee "to sort her out once and for all". The solicitor is unable to convince the client to calm down before he leaves and is very worried about the employee's safety.`,q:"Which of the following statements best describes what the solicitor should do?",opts:["End the retainer immediately.","Ignore the client's outburst and hope he will calm down before the hearing.","Tell the appropriate authorities about the client's threats to the employee's welfare.","Not reveal what the client said because disclosure will result in serious regulatory consequences.","Contact the employment tribunal and ask for an adjournment."],ans:"C",expl:"(C) There is a duty of confidentiality to the client which would normally prevent the solicitor from revealing the client's statement. If, however, the solicitor believes that the threat to the employee's welfare is real, then the solicitor may properly disclose the information to the appropriate body. This is because disclosure is justified in certain circumstances, such as where disclosure will prevent the commission of a criminal offence that will result in serious bodily harm. This justification is likely to mitigate against regulatory action. (D) is therefore incorrect. (A) is incorrect as this is not a reason to end the retainer. (B) is incorrect due to the solicitor's belief in the client's statement. (E) is incorrect as there is nothing at present to justify an adjournment."},{n:21,id:"ELS006",scenario:"A statute provides that a person found drunk in charge of a carriage may be arrested without a warrant. A man was arrested without a warrant when he was found drunk in charge of a bicycle. As a defence to the arrest, the man argues that a bicycle is not a carriage and that the arrest, accordingly, was invalid.",q:"If the court were to convict, which rule of interpretation would have been used?",opts:["The golden rule.","The literal rule.","The mischief rule.","The purposive approach.","The initial approach."],ans:"C",expl:"(C) A court applying the mischief rule of interpretation determines what mischief the statute in question was set out to remedy and interprets the statute in a way that would best achieve that result. If the court convicted the man, it would be because the court found the statute was intended to keep drunk people off of moving vehicles. (A) is incorrect because the golden rule is used when use of the ordinary meaning of words leads to absurd results. No absurd result would arise if the word 'carriage' were interpreted to exclude a bicycle. (B) is incorrect because under the literal rule, a court applies the dictionary meaning of a word. The dictionary meaning of the word carriage would not include a bicycle. (D) is incorrect because under the purposive approach a court uses extraneous material from the pre-enactment phase of legislation to try to discern the meaning of the words used in the statute. We have no mention of the use of such material in our facts and so this approach cannot be used. (E) is incorrect because there is no such approach."},{n:22,id:"CNL071",scenario:"A man has had his application for a welfare benefit rejected by a government department. The man has a right to appeal this decision to a tribunal. However, the man wishes to bring judicial review proceedings on the ground that the government department did not apply the law correctly to his application.",q:"Which of the following best explains why the man cannot bring judicial review proceedings?",opts:["Because judicial review would not be the last resort.","Because the man lacks standing.","Because the man has no grounds upon which to bring judicial review proceedings.","Because judicial review proceedings cannot be brought for a private law matter.","Because the man has no issue of public law to raise."],ans:"A",expl:"(A) The man cannot bring judicial review proceedings because judicial review would not be the last resort. An application for judicial review can be made only as a last resort after all other possibilities have been exhausted. The man here has not exhausted all other possibilities because he has the right to appeal the decision to a tribunal. (B) is incorrect because the man has standing. To have standing, the claimant must have a sufficient interest. The man here has been denied a benefit and thus has a sufficient interest in that decision. (C) is incorrect, as the man is alleging a proper ground for judicial review. Generally, in a judicial review proceeding, the courts cannot review the merits of a claim; they can review only the legality of the decision. Here, the man is claiming the law was not correctly applied, which is a question of law. (D) and (E) are incorrect because the decision here raises a matter of public law, in that the decision was made by a public body."},{n:23,id:"CNL033",scenario:"In a debate in the House of Commons on the crime rate, the Home Secretary claimed that crime had fallen whilst she has been Home Secretary. However, just before the debate, a civil servant informed the Home Secretary that crime had actually risen by 15% whilst the Home Secretary has been in office. A newspaper has since revealed this information to the public.",q:"How is the Home Secretary expected to respond?",opts:["She should resign as Home Secretary.","She should ignore the error and continue in office.","She should correct the error and blame her civil servants for it.","She should correct the error and continue in office.","She should correct the error and sack some civil servants so that they take the blame for her error."],ans:"A",expl:"(A) The Home Secretary would be expected to resign. All government ministers have a fundamental duty not to mislead Parliament. If a minister inadvertently misleads Parliament, the minister must correct the error as soon as possible, but if the minister knowingly misleads Parliament, the minister would be expected to resign. Here, the Home Secretary has knowingly misled Parliament, since she knew at the time of the debate that crime had not fallen during her time in office, and so would be expected to resign immediately. (B), (C), (D), and (E) are incorrect because the only appropriate way for the Home Secretary to respond in this situation is to resign."},{n:24,id:"CNL147",scenario:"During a session of Parliament, the House of Commons votes to hold an early election, which requires a minimum 66% vote under the Fixed-term Parliaments Act 2011. Only 55% of MPs vote in favour. In response, the government introduces legislation that allows an election to be held at a time of the Prime Minister's choosing. The legislation is passed by Parliament and receives the Royal Assent. Those opposed to an election seek to challenge this legislation in court.",q:"Which of the following best explains how the court would likely respond to this action?",opts:["The court will find that the legislation is valid.","The court will find that the legislation is invalid because it undermines the Fixed-term Parliaments Act 2011.","The court will find that the legislation is invalid because it breaches fundamental common law principles.","The court will strike down the legislation.","The court will find that the legislation is valid, but it will ask the House of Lords to review it."],ans:"A",expl:"(A) The court will find that the legislation is a valid Act of Parliament. Despite the provision that requires 66% of MPs to vote for an early general election, the Fixed-term Parliaments Act 2011 is an ordinary piece of legislation, which means that it can be expressly repealed or amended like other legislation. Thus, Parliament can always pass legislation overriding the requirements of the Fixed-term Parliaments Act 2011, as it did so here. (B), (C), and (D) are incorrect because the legislation is valid for the reasons discussed above, and even if it weren't, the courts have no power to invalidate or strike down Acts of Parliament. (C) is also incorrect because the legislation does not breach any common law principles. (E) is incorrect because whether the House of Lords choose to review the legislation is a matter for it and its committees to decide and not for the courts."},{n:25,id:"CNL041",scenario:"A bill approving the use of self-driving automobiles has been approved by the House of Commons and the House of Lords. The bill is sent to the Monarch for the Royal Assent. The Monarch is anxious about the risks of such automobiles.",q:"Which of the following best explains the Monarch's options with regard to the bill?",opts:["By constitutional convention, the Monarch may refuse to grant the Royal Assent to the bill given her concerns.","By statute, the Monarch is required to grant the Royal Assent to the bill.","By constitutional convention, the Monarch is required to grant the Royal Assent to the bill.","By statute, the Monarch may refuse to grant the Royal Assent to the bill given her concerns.","By royal prerogative, the Monarch may amend the legislation as desired before granting Royal Assent to the bill."],ans:"C",expl:"(C) By constitutional convention, the Monarch is required to grant the Royal Assent to the bill. The power of the Monarch to grant the Royal Assent to legislation is a personal prerogative power. However, by constitutional convention, the Monarch always grants the Royal Assent to any legislation. (A) and (D) are incorrect because the Monarch is required to grant the Royal Assent by constitutional convention. (B) is incorrect because the Monarch must grant the Royal Assent pursuant to constitutional convention, not pursuant to statute. (E) is incorrect because the Monarch has no power to amend the legislation before granting the Royal Assent."},{n:26,id:"ELS031",scenario:"A man has a breach of contract claim for £13,500, with complex issues that require the submission of expert evidence. The man wants to know in which of the UK courts his case is likely to be heard.",q:"Which is most likely to be the correct court of first instance for his claim?",opts:["The County Court.","The Crown Court.","The High Court.","The Court of Appeal.","The Magistrates' Court."],ans:"C",expl:"(C) Usually, the County Court deals with civil cases and will hear all small claims track cases (valued at under £10,000) and most fast track cases (£10,000 to £25,000). However, complex fast track cases, such as the case in the scenario here, are likely to be heard by the High Court, which will also hear multi-track cases (exceeding £25,000 and complex). (A) is incorrect for the reasons given above. (B) is incorrect as the Crown Court is a purely criminal court, so would not hear a case such as this. (D) is incorrect as the Court of Appeal, as the name suggests, is an appeal court, so would never be the court of first instance for either a civil or criminal case. (E) is incorrect because the Magistrates' Court is primarily a criminal court, with the exception of matters such as family proceedings, but it would not hear a breach of contract claim."},{n:27,id:"ETH002",scenario:"A client of a law firm is dissatisfied with the service provided by their solicitor. The client was not told about their right to complain at the outset of the matter.",q:"Which of the following statements best describes the client's position?",opts:["The client is not entitled to complain because they have not received the information to do so.","The client can take their complaint direct to the Legal Ombudsman.","The client can pursue their complaint and can also allege a breach of the Code of Conduct because they did not receive the complaints information.","The client can pursue their complaint, but the firm did not breach the Code of Conduct because it is not necessary to have a written client care letter.","The client can take their complaint direct to the Legal Services Board."],ans:"C",expl:"(C) The firm was required to inform the client in writing of their right to complain at the outset of the matter, and failure to do so is a breach of the Code. (A) is incorrect because even if the firm failed to provide the complaints information, the client is still entitled to complain. (B) is incorrect because the client must pursue the firm's internal complaints procedure and can only go to the Legal Ombudsman once eight weeks have elapsed. (D) is incorrect. It is true that the Code does not prescribe how a firm gives the client care information to its clients, but the information about complaints must be given in writing, even if it is not in a client care letter. Most firms will choose to send a client care letter. (E) is incorrect because the Legal Services Board does not regulate solicitors."},{n:28,id:"ETH081",scenario:"At the outset of a client's matter, the firm provided information about its complaints process with the client care letter. Following completion of the matter, the client complained to the firm. The firm provided a response to the client's complaint within two weeks of receipt of the complaint. The client is unhappy with the firm's response and has indicated to the firm his intention to take his complaint to the Legal Ombudsman. The firm has told the client that he cannot take the complaint further because the matter has been resolved.",q:"Which of the following statements best describes the position?",opts:["The firm is correct; the client cannot complain to the Legal Ombudsman because the complaint was resolved within eight weeks.","The firm is incorrect; the client can take his complaint to the Legal Services Board.","The firm is correct; the client cannot complain to the Legal Ombudsman because the complaint has been resolved.","The firm is correct; the client received notification of the firm's complaints process with the client care letter.","The firm is incorrect; the client can complain to the Legal Ombudsman because the complaint has not been resolved to the client's satisfaction."],ans:"E",expl:"(E) If a complaint is not resolved to the client's satisfaction within eight weeks, the client can complain to the Legal Ombudsman. (A) and (C) are incorrect because the central point of the question is to recognise that the complaint has not been resolved to the client's satisfaction. (B) is incorrect because the Legal Services Board does not deal with client complaints. (D) is incorrect because it is irrelevant to this fact scenario."},{n:29,id:"CNL022",scenario:"A campaign group wishes to abolish the monarchy because they believe the Monarch has too much political power. To support their argument, the group prepared a briefing paper outlining the personal prerogative powers and how those powers are exercised.",q:"Which of the following explains how the personal prerogative powers are exercised?",opts:["The personal prerogative powers are exercised by the Privy Council on behalf of the Mo
