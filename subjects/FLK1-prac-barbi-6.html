narch.","The personal prerogative powers are exercised by ministers, but require the personal consent of the Monarch before they can be exercised.","The personal prerogative powers used to be exercised personally by the Monarch but are now exercised wholly by ministers.","The personal prerogative powers are exercised personally by the Prime Minister on behalf of the Monarch.","The personal prerogative powers are exercised personally by the Monarch, but they are exercised according to various constitutional conventions."],ans:"E",expl:"(E) The personal prerogative powers are exercised personally by the Monarch in accordance with various constitutional conventions. For instance, the personal prerogative powers include the appointment of the Prime Minister. However, the Monarch has no real freedom of choice because the position is heavily constrained by a series of constitutional conventions. (A), (B), (C), and (D) are incorrect because the personal prerogative powers are personally exercised by the Monarch, not others."},{n:30,id:"ETH083",scenario:"The marketing manager of a law firm conducts a marketing campaign to people in the locality of the firm by making unsolicited telephone calls advertising the firm's services. At no time did the marketing manager say anything untruthful about the firm. A local businessman complains to the firm.",q:"Is the complaint likely to be upheld?",opts:["No, because the publicity was not misleading.","No, because a number of the calls would have been to clients or former clients of the firm.","Yes, because an unqualified person made the calls.","Yes, because the firm made unsolicited approaches to the public.","No, because the firm was providing information in a way that the clients or prospective clients could understand."],ans:"D",expl:"(D) A solicitor must not make unsolicited approaches to members of the public to advertise its legal services. (A) is incorrect because this prohibition applies even where the publicity is not misleading. (B) is incorrect because whilst publicising services to clients or former clients is permitted, there is no suggestion in the scenario that the firm made any attempt to only make the marketing calls to clients or former clients. (C) is incorrect because the status of the caller is irrelevant; the central issue is that unsolicited approaches must not be made. (E) is incorrect because the calls were unsolicited and therefore impermissible."}],qp="The scan captures this explanation out of order; it has been reassembled in reading order from the page image.",rC=[{n:1,id:"LGS073",scenario:"A junior solicitor has been assisting a partner in relation to a client's purchase of a villa in Spain. The partner told the junior solicitor that he suspected that the client may have been using proceeds from criminal activity to fund the purchase. The partner also mentioned that he made a suspicious activity report about the client to the firm's Money Laundering Reporting Officer ('MLRO') in both their names and the MLRO is currently investigating the report. The junior solicitor is worried about being implicated in the money laundering activity and shreds some documents which she thinks are relevant to the case.",q:"Which of the following best describes whether the junior solicitor may have committed an offence under the Proceeds of Crime Act 2002 ('POCA')?",opts:["The junior solicitor has not committed an offence as the partner has made a suspicious activity report to the MLRO.","The junior solicitor may have committed the offence of prejudicing an investigation and no defence is available.","The junior solicitor has not committed the offence of prejudicing an investigation because her intention was only to conceal her involvement.","The junior solicitor may have committed the offence of concealing.","The junior solicitor may have committed the offence of failure to report."],ans:"B",expl:`(B) The junior solicitor may have committed the offence of prejudicing an investigation and no defence is available. The offence of prejudicing an investigation is committed when a person knows or suspects that a money laundering, confiscation or civil recovery investigation is being carried out and makes a disclosure to any person that is likely to prejudice the investigation or falsifies, conceals, or destroys documents relevant to the investigation. There does not need to be any intent to prejudice the investigation. In this case, the solicitor knows that an investigation is taking place because the partner told her so and she is destroying documents relevant to the investigation. The defence of not knowing or suspecting that the documents were relevant or that the disclosure would be prejudicial is not available. The junior solicitor purposefully destroyed documents which she thought were relevant. (A) is incorrect because the relevant offence is prejudicing an investigation, not failure to report. The fact that a report has been made does not relieve the junior solicitor of the duty to avoid committing the offence of prejudicing an investigation. (C) is incorrect because, as mentioned, there does not need to be any intention to prejudice an investigation for the offence to be committed. The intention of the junior solicitor is not relevant to whether she has committed an offence. (D) is incorrect because the offence of concealment is when a person conceals, disguises, converts or transfers criminal property. It is one of the "direct" involvement offences. Here, the concealment is not of criminal property but of the junior solicitor's involvement in the transaction. As explained above, the relevant offence here is prejudicing an investigation. (E) is incorrect because the relevant offence is prejudicing the investigation. In any event, a suspicious activity report has been made in the name of the partner and the junior solicitor so there is no failure to report.`},{n:2,id:"CNL154",scenario:"The Prime Minister is seeking to initiate a new session of Parliament. Therefore, the Prime Minister advises the Queen to exercise her power of prorogation.",q:"Which of the following best states the outcome of the Queen's exercise of this power?",opts:["That Parliament will be dissolved before the next general election.","That the session of Parliament will end.","That the session of the House of Commons will end, and the next session of Parliament will begin with a Queen's Speech.","That the session of the House of Lords will end, and the next session of Parliament will begin with a Queen's Speech.","That an early general election will be held."],ans:"B",expl:"(B) If the Queen exercises her power of prorogation, the current session of Parliament will end. Under the royal prerogative, the Queen may prorogue Parliament. This effectively suspends the current session of Parliament and sets the date for a new session, which will begin with the Queen's Speech. (A) is incorrect because prorogation does not dissolve Parliament, but rather ends a session of Parliament and sets the date for a new session. (C) and (D) are incorrect because prorogation ends the session in both Houses of Parliament, not just one of the Houses. (E) is incorrect because prorogation does not trigger an early general election. Rather, an early general election will be triggered by one of the methods provided in the Fixed-term Parliaments Act 2011."},{n:3,id:"ETH133",scenario:`A solicitor and paralegal work in the same law firm and are friends on social media. One day, they are both in a client meeting with a very difficult and unpleasant client called John Jones, who has brought a discrimination claim against his employer. In the evening, the solicitor looks at her social media account and sees that the paralegal has written the following post: "Beginning to wonder whether I'm in the right job. Spent the day with a client called John Jones. What a nasty individual -- I'm not surprised he was dismissed by his employer. The solicitor and I were disgusted by his behaviour #timeforachange #thelawisnotforme".`,q:"Will the paralegal's social media post result in regulatory consequences?",opts:["Yes, because the paralegal must comply with the SRA Standards and Regulations and has breached confidentiality.","No, because the paralegal's breach of confidentiality was done in a personal capacity.","No, because the paralegal is not regulated by the SRA.","No, because the paralegal is not regulated by the SRA, but there will be consequences for the solicitor involved in the meeting.","No, because the paralegal is not regulated by the SRA, so confidentiality duties apply only if he has breached his employer's requirements."],ans:"A",expl:"(A) The duty of confidentiality is owed by everyone in the firm and not just solicitors. Breaches of the Code of Conduct for Firms may result in action against the firm itself, or its owners or managers, or against employees within the firm. This means that there are regulatory consequences for the paralegal who has revealed information about the client and their affairs on a social media platform. There may also be regulatory consequences for the firm. (B) is incorrect because the SRA is entitled to look at this disclosure notwithstanding the breach was made by the paralegal in their own time; breach of confidentiality is likely to undermine SRA Principles such as the duty to uphold trust and confidence and the duty to act in the client's best interests, and these Principles apply to personal as well as professional conduct. (C), (D), and (E) are incorrect; whilst it is true that the paralegal is not directly regulated in the same way as a solicitor, the fact that he is employed in an SRA-authorised law firm means that he must comply with relevant SRA Standards and Regulations."},{n:4,id:"ELS047",scenario:"A woman was charged with an either way public order act offence. She denied her guilt before a District Judge in Magistrates' Court. She does not have any previous convictions. The woman tells her solicitor she thinks she would like her case tried before a jury.",q:"Which of the following statements best describes the legal position on where the case can be tried?",opts:["The case may be tried in Magistrates' Court only, either with or without a jury as it is an either way offence.","The case can be tried in Crown Court only, either with or without a jury as it is an either way offence.","The case can be tried in either Magistrates' Court or Crown Court as it is an either way offence, but a jury is available only in Crown Court.","The case can be tried in either Magistrates' Court or Crown Court since it is an either way offence, but a jury is available only in Magistrates' Court.","The case may be tried in either Magistrates' Court or Crown Court only, either with or without a jury since it is an either way offence."],ans:"C",expl:"(C) An either way offence may be tried in either Magistrates' Court or Crown Court. However, a jury is available only in Crown Court. (A) is incorrect, both because the woman may choose to have her either way offense tried in Crown Court and because a jury is not available in Magistrates' Court. (B) is incorrect because the woman could choose to have her case tried in Magistrates' Court if she forgoes a jury. (D) and (E) are incorrect because a jury is not available in Magistrates' Court."},{n:5,id:"CNL019",scenario:"The Court of Appeal of the Bahamas (which is a British Commonwealth) has just heard an appeal. The losing party was advised that they can appeal to a court located in the UK.",q:"To which court can the losing party appeal?",opts:["They can appeal to the Judicial Committee of the Privy Council.","They can appeal to the UK Supreme Court.","They can appeal to the Court of Appeal.","They can appeal to the High Court.","They can appeal to the House of Lords."],ans:"A",expl:"(A) The party can appeal to the Judicial Committee of the Privy Council (the 'JCPC'). The JCPC is the final appellate court for some Commonwealth nations and British Overseas Territories. (B), (C), (D), and (E) are incorrect because the appeal here must be heard by the JCPC."},{n:6,id:"ELS054",scenario:`A law student is reading an Act of Parliament for the first time. The student reads the following language:
BE IT ENACTED by the Queen's most Excellent Majesty, by and with the advice and consent of the Lords Spiritual and Temporal, and Commons, in this present Parliament assembled, and by the authority of the same, as follows:`,q:"Which of the following best describes the passage the student read?",opts:["The preamble.","The prologue.","The forward.","The citation.","The enabling provision."],ans:"A",expl:`(A) The language reflects the preamble, which is a fixed block of text included in every Act of Parliament that confers the authority of the Crown to the Act. (B) and (C) are incorrect as although they might mean the same thing as the word "preamble", they are not the official name of the passage. (D) is incorrect. An Act's citation is a reference to the year and chapter of the Act, such as "2017 Ch 22". (E) is incorrect as an enabling provision is a section of an Act of Parliament that delays the enforcement of the Act until a relevant minister produces regulations giving effect to a provision. It would look something like: "The following provisions come into force on such day as . . .".`},{n:7,id:"CNL153",scenario:"In a constituency, an unpopular Labour Member of Parliament ('MP') has been suspended for 15 days from the House of Commons for poor conduct in the House chamber. The local Conservative Party wish to unseat the MP before the next election.",q:"Which of the following provides the best way for the local Conservative Party to trigger a by-election?",opts:["Obtaining consent from the Speaker of the House of Commons to trigger a by-election.","Obtaining consent from the Leader of the Labour Party to trigger a by-election.","Obtaining consent from the Leader of the House of Commons to trigger a by-election.","Obtaining consent from 10% of the local council to trigger a by-election.","Obtaining consent from 10% of the electorate in the constituency through a recall petition."],ans:"E",expl:"(E) To trigger a by-election, the local Conservative Party should obtain the consent of 10% of the electorate evidenced by their signing a recall petition. Under the Recall of MPs Act 2015, if an MP has been suspended for more than 10 days, this triggers a recall petition in the constituency of the MP. If more than 10% of the electorate in that constituency sign the petition, then a by-election is held. (A), (B), (C), and (D) are incorrect because those actions will not trigger a by-election.",note:qp},{n:8,id:"ELS067",scenario:"There has been a mix up with the diary at a busy solicitor's firm, where a client at the Crown Court does not have a representative. The supervisor who deals with diary allocation has gone home sick. The legal secretary deals with this issue and asks a qualified solicitor, who is a trial advocate at the Magistrates' Court but who is not a barrister, to go to the Crown Court to deal with the hearing.",q:"Can the solicitor properly represent the client in Crown Court?",opts:["Yes, if the solicitor has higher rights of audience.","No, because a solicitor may not represent clients in Crown Court.","Yes, if the solicitor has been qualified for more than five years.","Yes, because if a solicitor is a trial advocate at the Magistrates' Court, they are automatically entitled to represent someone at the Crown Court.","No, because a trial advocate can represent a client only at trial and not sentencing hearings."],ans:"A",expl:"(A) Solicitors are not automatically entitled to represent clients in Crown Court, but they can if they have obtained higher rights of audience. (B) is incorrect as a solicitor is able to represent someone at the Crown Court if they have obtained higher rights of audience. (C) is incorrect as the experience of a solicitor is not important; only a solicitor who has obtained higher rights of audience can represent someone at the Crown Court. (D) is incorrect as there is no automatic entitlement; the solicitor must obtain higher rights of audience before they can represent someone at the Crown Court. (E) is incorrect as a trial advocate can represent clients at all hearings at the Magistrates' Court. A trial advocate can represent clients at all hearings at the Crown Court but only if the solicitor has obtained higher rights of audience."},{n:9,id:"CNL103",scenario:"A Member of Parliament ('MP') has suggested that the Monarchy should be abolished, given the MP's concern that the Monarch might start to override governmental decisions. However, another MP has argued that this is unnecessary.",q:"Which of the following best explains why the MP's suggestion to abolish the Monarch would be unnecessary?",opts:["The Monarch must sometimes accept the advice of government ministers, depending on the circumstances.","The Monarch must consult the House of Lords before making a decision.","The Monarch must consult the House of Commons before making a decision.","The Monarch must consult the Speaker of the House of Commons before making a decision.","The Monarch must always ultimately accept the advice of government ministers."],ans:"E",expl:`(E) Abolishing the Monarch would be unnecessary, despite the MP's concerns, because the Monarch must always ultimately accept the advice of government ministers. Under the Cardinal Convention, the Monarch is required to accept the advice of their ministers, particularly the Prime Minister. In return, the Monarch has the right to be "consulted, the right to encourage, and right to warn" the government. (A) is incorrect because the Monarch must always accept the advice of government ministers. Under the Cardinal Convention, there are no circumstances in which the Monarch could refuse to accept their advice. (B), (C), and (D) are incorrect because the Monarch can make decisions without consulting Parliament. Again, however, the Monarch's ability to make decisions is constrained by the fact that the Monarch must accept the advice of ministers.`},{n:10,id:"CNL130",scenario:"A group of MPs opposed to the Human Rights Act 1998 have discovered a provision of retained EU law which contains references to the EU institutions that no longer apply now that the UK has left the EU. Knowing that the power to deal with deficiencies in retained EU law gives ministers the power to make any provision that an Act of Parliament could make, these MPs have suggested that the government should use these powers to repeal the Human Rights Act 1998. The government has explained that the power to deal with deficiencies cannot be used in this way.",q:"Which of the following best explains why the proposal is illegal?",opts:["There is no deficiency in retained EU law, so the powers cannot be used.","There is a deficiency in retained EU law, but the powers cannot be used to repeal the Human Rights Act 1998.","There is a deficiency in retained EU law, but the powers must be used in consultation with the Scottish Parliament, who do not agree to the repeal of the Human Rights Act 1998.","There is a deficiency in retained EU law, but because there is no evidence that it has caused any problem, the power to address the deficiency does not arise.","There is a deficiency in retained EU law, but the powers must be exercised in consultation with the Northern Ireland Assembly, who do not agree to the repeal of the Human Rights Act 1998."],ans:"B",expl:"(B) Although there is a deficiency in retained EU law, the government cannot address the deficiency by repealing the Human Rights Act 1998. Obsolete references to the EU institutions in retained EU law are an example of a deficiency in retained EU law which gives rise to the power of the government to address the deficiency under the European Union (Withdrawal) Act 2018. However, the 2018 Act is clear that this power cannot be used to amend or repeal the Human Rights Act 1998. (A) is incorrect because there is a deficiency here in retained EU law but, as discussed, the deficiency cannot be addressed by repealing the Human Rights Act 1998. (C) and (E) are incorrect as there is no requirement for the government to consult with the Scottish Parliament or Northern Ireland Assembly when using the powers to deal with deficiencies in retained EU law. In any event, the government cannot use its powers to correct deficiencies by amending or repealing the Human Rights Act 1998. (D) is incorrect because the power to deal with the deficiency does not depend on whether or not it has been a problem.",note:'The question ID is shown in the source as "CNL 130".'},{n:11,id:"ETH115",scenario:"A solicitor employed a housekeeper to help him look after his home. He sacked her when he found out she was pregnant, and she brought a claim in an Employment Tribunal. The solicitor was found guilty of discrimination and ordered to pay compensation to the housekeeper. The matter is widely reported in the media and the solicitor's employer issues a statement saying that they do not condone his behaviour but that this is not related to his work and that he is a very good lawyer.",q:"Which of the following statements best describes how the SRA would approach this issue?",opts:["This is not a regulatory issue because the discriminatory act did not occur within the workplace.","This is not a regulatory issue because the SRA Standards and Regulations do not apply to personal matters.","This is a regulatory issue because the SRA Principles apply to behaviour outside of practice.","This is a regulatory issue only because of the media attention about the solicitor's behaviour.","This is not a regulatory issue because no client was harmed as a result of the discriminatory act."],ans:"C",expl:"(C) The SRA Principles (which are part of the SRA Standards and Regulations) apply to solicitors at all times. Where relevant, unprincipled behaviour in an individual's private life will be a regulatory issue. The Principles contain the duty to act in a way that encourages equality, diversity, and inclusion and to act in a way that upholds the constitutional principle of the rule of law and the proper administration of justice. Both duties have been breached by the solicitor's sacking of his housekeeper and must be reported to the SRA. Because of this, and the SRA's regulatory reach to matters which are not exclusively related to an individual's work, answers (A), (B), and (E) are incorrect. (D) is also incorrect because the SRA will consider a serious breach of the SRA Principles as a notifiable matter regardless of media attention."},{n:12,id:"ETH114",scenario:"A law firm is investigating a complaint raised by a member of staff. The staff member has complained that she is being treated unfairly by another colleague. She says that they both grew up in the same town but had been educated at different schools. The staff member says that the colleague is openly critical about the school that she attended and tells other colleagues that they should not include her in their teams because she will clearly not be clever enough as her educational background is poor.",q:"Does the firm need to investigate a complaint based on this type of behaviour?",opts:["Yes, because this is a breach of equality legislation and an illegal act.","No, because this is simply office banter and therefore acceptable.","Yes, because this is victimisation and a legal offence.","Yes, because this is a breach of the regulatory duty not to unfairly discriminate because of personal views.","No, because this is a matter for the two colleagues to discuss and the firm does not need to be involved in its resolution."],ans:"D",expl:"(D) The SRA Codes of Conduct provide that solicitors and firms must not unfairly discriminate by allowing their personal views to affect their professional relationships. The firm has a duty to ensure compliance with SRA requirements and must investigate this complaint. (A) and (C) are incorrect; these answers refer to protected characteristics and offences in the Equality Act 2010. Discrimination on the basis of education is not a protected characteristic under the Equality Act, and therefore no illegal act has been committed. (B) is incorrect because this behaviour is in breach of an SRA duty. (E) is incorrect because the firm does need to manage and resolve this issue."},{n:13,id:"CNL163",scenario:"In 2021, the Scottish Parliament passed an Act that conflicts with an EU regulation. The EU regulation was also enacted in 2021, and it pertains to a matter within the Scottish Parliament's legislative competence.",q:"Which of the following best explains the legal situation?",opts:["The Act is invalid because it is has not been approved by the UK Parliament.","The Act is invalid because it breaches retained EU law.","The Act is invalid because it breaches EU law.","The Act is valid because it does not breach retained EU law.","The Act is valid because the Scottish Parliament is no longer bound by EU law."],ans:"E",expl:"(E) The Act is valid because the Scottish Parliament is no longer bound by EU law. After the end of the transition period (in December 2020), the devolved legislatures were no longer bound by EU law and thus could legislate contrary to EU law on matters within their legislative competence. Therefore, because the Act is within the Scottish Parliament's legislative competence, it is valid. (A) is incorrect because there is no such procedure. (B) and (D) are incorrect because the regulation was passed by the EU after the end of the transition period, meaning that it does not form part of retained EU law. (C) is incorrect because the devolved legislatures are now free to legislate contrary to EU law."},{n:14,id:"ETH034",scenario:"A solicitor meets a client who tells the solicitor that he is not computer literate and does not use his email account. Despite being aware of this, the solicitor sends the client care letter by email only. The client care letter contains costs information. At the end of the matter, the client complains to the firm that he had received no costs information.",q:"Which statement best describes whether the client's complaint is likely to succeed?",opts:["The client's complaint is not likely to succeed because the firm sent a client care letter at the outset of the matter.","The client's complaint is likely to succeed because client care letters must be sent by post and email.","The client's complaint is not likely to succeed because the client must complain directly to the Legal Ombudsman.","The client's complaint is not likely to succeed because the client should have made arrangements to access and read the client care letter.","The client's complaint is likely to succeed because the firm should have provided the client care letter in a form appropriate to this client's needs and circumstances."],ans:"E",expl:"(E) The firm was aware of the client's circumstances and should have acted accordingly and agreed with the client how the client care letter would be sent. (A) is incorrect because the firm must meet the needs of each particular client; it is a subjective test. (B) is incorrect because there are no formal requirements for delivery of client care letters. (C) is incorrect. The client must first pursue the firm's complaints procedure, but the client would be able to refer the matter to the Legal Ombudsman if the firm did not deal with the complaint within eight weeks. (D) is incorrect because the duty falls upon the solicitor and not the client."},{n:15,id:"LGS081",scenario:`A solicitor is asked to appear on a breakfast TV programme's personal finance slot. He will be one of a panel of speakers. The solicitor goes on the programme and answers questions relating to the current state of the housing market, the recent reduction in prizes on Premium Bonds, and whether stocks and shares are a sensible investment in the current economic climate. For advertising reasons, the producers asked the solicitor not to name particular products or companies in his answers and he complied with this request. The solicitor is not authorised by the Financial Conduct Authority to carry on a "regulated activity" as defined in the Financial Services and Markets Act 2000 and related secondary legislation.`,q:"Has the solicitor breached the general prohibition against carrying on a regulated activity?",opts:["No, because none of the questions related to a specified investment.","No, because the advice he gave was generic.","Yes, because shares are a specified investment and he advised on them.","Yes, because all of the products he answered questions on were specified investments.","No, because the audience was only potential investors."],ans:"B",expl:"(B) The solicitor has not breached the general prohibition against carrying on a regulated activity because the advice he gave on the programme was generic. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. Here, the solicitor answered questions about shares (a specified investment), but there is no specified activity. The specified activity of advising does not cover generic advice on whether, for example, the buying or selling of shares in general is a good investment. The solicitor gave only generic advice as to the soundness of shares as an investment, in general terms, rather than advice on particular shares. Thus, there was no regulated activity, and the solicitor did not breach the general prohibition. (A) is incorrect because shares are a specified investment. (C) is incorrect because, as explained above, the advice the solicitor gave on the shares was generic and therefore the solicitor was not carrying on a regulated activity in breach of the general prohibition. (D) is incorrect because only the shares are specified investments and in any event the advice was generic. (E) is incorrect because the specified activity of advising can occur when the investors are potential investors.",note:qp},{n:16,id:"CNL081",scenario:"Created by statute, the Industrial Chemicals Panel grants businesses the licence required to transport hazardous chemicals via road. The licences must be renewed each year. The panel rejected a renewal application from a company which has had a licence for the past 20 years. There has been no substantive change to the requirements for a licence, and the panel has not given any reasons for rejecting the company's application.",q:"Was the panel under a duty to give reasons for rejecting the company's application?",opts:["Yes, because there is a general common law duty to give reasons.","No, because there is no general common law duty to give reasons.","Yes, because the subject matter at issue is important.","No, because reasons are not required under these facts.","Yes, because reasons are required under these facts."],ans:"E",expl:"(E) The panel should have provided reasons for rejecting the company's application under these facts. Public bodies have a common law duty to give reasons for their decisions under certain circumstances, including when the decision appears to be aberrant. This decision would qualify as aberrant, as there is no obvious reason why the application of the company for a licence has been refused, given that it has complied with the requirements for 20 years. (A) is incorrect because there is no 'general' common law duty to give reasons. However, the common law recognises certain situations when reasons are required (including when the decision appears to be aberrant). (B) is incorrect because, although it is true that there is no 'general' common law duty to give reasons, as mentioned, the common law does recognise a duty to give reasons under these facts. (C) is incorrect because, while there is a duty to give reasons when the subject matter is important, that requirement is for matters such as personal liberty; the licence here would not be considered 'important'. (D) is incorrect. The panel must provide reasons under these facts since the decision appears to be aberrant."},{n:17,id:"ELS034",scenario:"A solicitor is researching the law of England and Wales regarding a contract case. He has found many relevant cases from a variety of courts.",q:"Which of the following would create a binding precedent?",opts:["A decision of the Supreme Court would be binding on itself.","A decision of the Court of Appeal would be binding on the Supreme Court.","A decision of the High Court would be binding on the County Court.","A decision of the High Court would be binding on the Supreme Court.","A first instance decision of the High Court would be binding on itself."],ans:"C",expl:"(C) A decision of the High Court would be binding on the County Court. The law of England and Wales is based on the doctrine of judicial precedent. This means that, as a general rule, any decision reached previously by a higher court will be binding on judges in lower courts. In the court hierarchy, the High Court is a more superior court than the County Court, and therefore its decisions are binding on it. (A) is incorrect because the Supreme Court is no longer bound by its own previous decisions. (B) is incorrect because the Court of Appeal is a lower court than the Supreme Court and therefore the Supreme Court is not bound by its decisions. (D) is incorrect because a decision of the Supreme Court binds the High Court, not the other way around. (E) is incorrect because a first instance decision of the High Court (that is, a decision in a case that started in the High Court) is not binding on the High Court itself. However if the High Court is acting as an appellate court (that is, hearing an appeal where the case commenced elsewhere), the High Court also binds itself."},{n:18,id:"LGS034",scenario:"A firm of solicitors gives its full-time employees an annual clothing allowance but no allowance is given to its part-time employees. The majority of the firm's full-time employees are under 40, whereas the majority of part-time employees are age 40 or over. The firm's rationale for this policy is that full-time employees have more client contact than part-time employees and it is therefore important to help them maintain a professional image. The firm seeks advice as to whether its policy is discriminatory under the Equality Act 2010.",q:"Which of the following best describes the firm's policy?",opts:["The policy is indirectly discriminatory on the grounds of age which the employer can justify if it can show this is a proportionate means of achieving a legitimate aim.","The policy is directly discriminatory on the grounds of age which the employer can justify if it can show this is a legitimate means of achieving a legitimate aim.","The policy is not discriminatory because age is not a protected characteristic.","The policy is directly discriminatory on the grounds of age which cannot be justified by the employer.","The policy is directly discriminatory on the grounds of age which the employer can justify if it can show this is a proportionate means of achieving a legitimate aim."],ans:"A",expl:"(A) The policy is indirectly discriminatory on the grounds of the protected characteristic of age, which the employer can justify if it can show it is a proportionate means of achieving a legitimate aim. Indirect discrimination is when a policy or provision is apparently neutral but on closer examination puts individuals with a protected characteristic at a disadvantage compared with individuals who do not have that characteristic. The firm's policy is apparently neutral in that it does not say it only gives the clothing allowance to employees that are under 40 years of age. However, the policy puts people with a protected characteristic, here age, at a disadvantage when compared with people who don't have that characteristic. Since the majority of the firm's full-time employees are under age 40 and the majority of part-time employees are age 40 or over, the employees age 40 and over are put at a disadvantage as they are less likely to receive the clothing allowance. Indirect discrimination can be justified if the policy is a proportionate means of achieving a legitimate aim. It is possible that the firm has a legitimate aim - maintaining a professional image - but the firm would also have to show that the policy was proportionate, such as that there was no other, less discriminatory way of achieving the same aim. (B) is incorrect because, as explained above, the policy is indirectly, not directly, discriminatory. Note also that although direct discrimination based on age can be justified, the wording of the potential justification in this answer choice is incorrect. The means must be proportionate, not legitimate. (C) is incorrect because age is a protected characteristic under the Equality Act, along with sex, disability, gender re-assignment, marriage and civil partnership, pregnancy and maternity, race, religion or belief, and sexual orientation. (D) and (E) are incorrect because, as explained above, this is indirect discrimination, not direct discrimination. Direct discrimination on the grounds of age can be justified if the employer can show it is a proportionate means of achieving a legitimate aim, but there must usually be some wider public policy reason for the discrimination.",note:'The question ID is partly cut off at the bottom of the answer screen; it appears to read "LGS034".'},{n:19,id:"CNL002",scenario:"Parliament has passed an Act which abolishes entirely the House of Lords. A group of campaigners believes that this gives the House of Commons too much power and wants the courts to strike the Act down as being 'unconstitutional'.",q:"Which one of the following best explains how the courts can respond to this action?",opts:["The courts have the power to 'strike down' the Act on the basis that it breaches human rights.","The courts do not have the power to 'strike down' the Act.","The courts do not have the power to 'strike down' the Act other than by issuing a declaration of incompatibility.","The courts have the power to 'strike down' the Act on the basis that it breaches the common law.","The courts have the power to 'strike down' the Act on the basis that it is unconstitutional."],ans:"B",expl:"(B) The courts do not have the power to 'strike down' the Act. Because of the doctrine of parliamentary sovereignty, the courts cannot 'strike down' an Act of Parliament for any reason. Instead, they must give effect to the legislation, even if the legislation is considered 'unconstitutional'. (A), (D), and (E) are incorrect because the courts do not have the power to 'strike down' legislation passed by Parliament. (C) is incorrect because a declaration of incompatibility does not 'strike down' an Act of Parliament. Moreover, the courts issue declarations of incompatibility where an Act of Parliament breaches a human right. The Act here does not conflict with any human rights."},{n:20,id:"ELS063",scenario:"A barrister has been asked to speak to secondary school students about how statutes are interpreted in the courts. The case of Muir v Keay (1875) is used as an example. The statute in that case stated that all houses that are kept open at night for 'public refreshment, resort and entertainment' had to be licensed. The defendant argued that his cafe did not need a licence because he did not provide entertainment. The court held that 'entertainment' did not mean musical entertainment but the reception and accommodation of people, so the defendant was guilty of operating the cafe without a license.",q:"What rule of language has been used here?",opts:["Noscitur a sociis.","Expressio unius est exlusio alterius.","The literal rule.","Ejusdem generis.","Rule of law."],ans:"A",expl:"(A) Under noscitur a sociis if a case is based on something with unclear or ambiguous words (as in a statute or contract) their meaning is determined by considering the words with which it is associated in the context. Here, the court must interpret the meaning of the word 'entertainment'. It was used in the context of public refreshment and resort and, thus, should be interpreted to mean something related to those two terms. (B) is incorrect. Expressio unius est exclusio alterius means where one or more things of a class are expressly mentioned, others of the same class are excluded. Here, no additional words relating to the word 'entertainment' are used and so expressio unius is not helpful. (C) is incorrect, as the literal meaning of 'entertainment' has not been applied by the judge (which is what the literal rule would mean). (D) is incorrect, this rule of interpretation is used to interpret general words that follow two or more specific words (the general word will be limited to items like the specific words). Refreshment and resort are not specific words related to entertainment. (E) is incorrect. The rule of law is not a rule of interpretation but rather the concept that government must operate by laws rather than by arbitrary and capricious fiat."},{n:21,id:"CNL146",scenario:"An individual wishes to organise a march to protest against the closure of a local hospital. However, the march has been banned by the local police. The individual brings an action against the local police under the Human Rights Act 1998, claiming that the ban breaches her Article 10 and Article 11 rights - the freedom of expression and freedom of assembly, respectively.",q:"Does the individual have standing for her claim?",opts:["Yes, because the individual has a sufficient interest to bring the action.","Yes, because the individual is the victim of the decision of the local authority.","No, because the individual has a weak case.","No, because the court has discretion over standing and is likely to rule against standing in this case.","Yes, because individuals are always allowed to bring cases against local authorities."],ans:"B",expl:"(B) The individual has standing because she is the victim of the local police's decision. To have standing for a claim against a public authority under the Human Rights Act 1998, the claimant must show she was the 'victim' (that is, she was 'directly affected') by the public authority's conduct. Here, the individual was directly affected in being prohibited from protesting in a march she sought to organise. (A) is incorrect because the sufficient interest test is the standing test for judicial review claims. (C) is incorrect because the merits of the case are irrelevant to the question of standing. Additionally, we do not have sufficient facts to make a judgment on this issue in any event. (D) is incorrect because the court has no discretion on the question of standing. (E) is incorrect because it is overbroad. Claims can be brought against local authorities for violations of the Human Rights Act 1998, but to do so, the claimant must have standing."},{n:22,id:"CNL025",scenario:"At a general election, the Conservative Party, who were in government, lost their majority of seats in the House of Commons, winning only 280 of the 650 seats. The Labour Party, who were in opposition, won 340 seats. The other 30 seats were won by the Liberal Democrats.",q:"What would be expected to happen following the election?",opts:["The Conservative Prime Minister would resign, and another Conservative MP would be appointed as the next Prime Minister.","The Conservative Prime Minister would stay in office, seeking the support of MPs from other parties to support his government.","The Conservative Prime Minister would resign, and the Leader of the Labour Party would be appointed as the next Prime Minister.","The Conservative Prime Minister would resign, and the Leader of the Liberal Democrats would be appointed as the next Prime Minister.","The Conservative Prime Minister would stay in office and continue to govern as a minority government."],ans:"C",expl:"(C) The Conservative Prime Minister would resign, and the Leader of the Labour Party would be appointed as the next Prime Minister. By constitutional convention, the Prime Minister must be an MP who is able to command the confidence of the House of Commons. This is usually the leader of the political party with a majority of the seats in the House of Commons. As there are 650 seats in the House of Commons, a political party needs 326 seats to have a majority. In this instance, the Conservative Prime Minister has lost the confidence of the House of Commons because the Conservative Party has lost their majority. Instead, the Labour Party has won a majority, winning 340 seats. The Conservative Prime Minister would therefore resign, and the Leader of the Labour Party would be appointed as the new Prime Minister. (A) and (D) are incorrect because the leader of the party with a majority in the Commons (here, the Labour Party) should succeed as Prime Minister. (B) and (E) are incorrect because the Conservative Prime Minister will need to resign under these circumstances."},{n:23,id:"LGS104",scenario:"A solicitor has been asked by a client to look at the client's portfolio of shares because the client would like to make a large donation to a local charity. The client asks the solicitor to decide which shares the client should sell in order to fund the donation. The client is happy to take the necessary steps to sell the shares once the decision is made. Neither the solicitor nor her firm is authorised by the Financial Conduct Authority to carry on a 'regulated activity' as defined in the Financial Services and Markets Act 2000 ('FSMA') and related secondary legislation.",q:"Which of the following best describes the activity specified in the Financial Services and Markets Act 2000 (Regulated Activities) Order 2001, which the solicitor will be carrying out?",opts:["Advising","Arranging","Dealing as Agent","Managing","Safeguarding"],ans:"D",expl:"(D) Under the general prohibition of FSMA, a solicitor may not carry on regulated activity in the UK unless they are authorised or exempt from authorisation. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. The specified activities might be remembered with the mnemonic device 'ADAMS': Activities = Advising, Dealing as an agent, Arranging, Managing, and Safeguarding. Managing involves managing assets belonging to another person in circumstances which involve the exercise of discretion. Here, the solicitor has been asked to look at the client's portfolio and exercise discretion in deciding which assets the client should sell, which is the specified activity of managing. (A) is incorrect because the solicitor is not advising, that is, giving advice to the client which the client will then act upon. The solicitor herself will be making a decision. (B) is incorrect because the solicitor will not be making arrangements. The client will be selling the selected shares themselves. (C) is incorrect because the solicitor will not be dealing as agent, that is, selling the shares as agent on the client's behalf. (E) is incorrect because the solicitor will not be safeguarding, that is, administering or safeguarding (looking after) the shares. This specified activity is more relevant to probate and trust work."},{n:24,id:"LGS017",scenario:"A claimant is attending a solicitor's office to enquire at the possibility of bringing a claim for breach of contract. The solicitor believes the claimant has an arguable case and turns her attention to funding. The firm is not part of the Legal Aid franchise scheme.",q:"Which of the following statements best describes the position on funding?",opts:["The solicitor will need to ascertain how the claimant wishes to pay for the claim. If the client is happy to pay the solicitor on an ongoing basis, there is no need to investigate the availability of other forms of funding.","The solicitor will need to know whether the client is a member of a union or has any before the event insurance policies available. If none of these apply, the solicitor is likely to recommend a funding arrangement such as a conditional fee agreement.","The solicitor is likely to conclude that Legal Aid is the best option for the client. Since her firm does not carry a Legal Aid franchise, she must direct the client to a franchised firm for advice.","The solicitor will ask for £1,000 'on account' of costs at the initial meeting. This will cover any initial expenses that the solicitor must incur whilst she investigates the possible funding options.","The solicitor should immediately advise the claimant to enter into a damages based agreement allowing the solicitor to take 25% of the claimant's damages."],ans:"B",expl:"(B) It is important that the solicitor fully investigate the possibility of other funding methods before advising the client on the most suitable option. A solicitor should check to see if a client has before the event insurance to cover legal costs, or whether they are entitled to legal expenses cover as part of a union membership. Failure to do so would constitute a dereliction of duty. This applies however unlikely it may be that existing insurance will cover the incident in question. If none of these forms of insurance or cover are available, the solicitor is likely to recommend a funding arrangement such as a conditional fee agreement. (A) is incorrect because it is irrelevant that the client is happy to pay the solicitor on an ongoing basis. The solicitor must still properly investigate other potential funding mechanisms before proceeding. (C) is incorrect because Legal Aid will not be available for a breach of contract case. Civil Legal Aid is limited to certain specific situations, such as housing disputes, family, or debt issues, and is not available for contract or tort claims. (D) is incorrect because it would be unusual for a solicitor to request this sum at an initial meeting before any funding investigation has taken place. (E) is incorrect because a damages based agreement may not be best for the client. The solicitor must investigate funding options first before advising the client on the best option."},{n:25,id:"LGS005",scenario:"The Solicitors Regulation Authority is one of the legal profession's regulatory bodies under the umbrella of the Legal Services Board.",q:"Which of the following is regulated by the Solicitors Regulation Authority?",opts:["Legal executives.","Patent attorneys.","Non-lawyer managers of regulated solicitors firms.","Barristers.","Accountants."],ans:"C",expl:"(C) The SRA regulates non-lawyers if they are managers or employees of regulated law firms. (A) is incorrect because legal executives are regulated by CILEx. (B) is incorrect because patent attorneys are regulated by the Intellectual Property Regulation Board. (D) is incorrect because barristers are regulated by the Bar Standards Board. (E) is incorrect because accountants are not regulated by the Legal Services Board regulators."},{n:26,id:"LGS085",scenario:`A solicitor is advising a client company on the preparation of standard terms and conditions of employment for the company's employees. As part of that process, the solicitor arranges for the client to speak to an insurance broker who advises the company on purchasing insurance policies to cover unfair dismissal and related employment claims. Neither the solicitor nor her firm is authorised by the Financial Conduct Authority to carry on a "regulated activity" as defined in the Financial Services and Markets Act 2000 and related secondary legislation. The insurance broker is authorised by the Financial Conduct Authority.`,q:"Has the solicitor breached the general prohibition against carrying on a regulated activity?",opts:["No, because there is no specified investment.","No, because the solicitor is not selling a specified investment to the client.","No, because the solicitor can rely on the introducing exclusion.","Yes, because the solicitor is advising the client on a specified investment.","Yes, because the introducing exclusion is not available for insurance policies."],ans:"E",expl:"(E) The solicitor has breached the general prohibition against carrying on a regulated activity because the introducing exclusion is not available for insurance policies. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. Here, the solicitor has carried on a specified activity (arranging, that is, making arrangements for the client to receive advice on purchasing insurance policies) in relation to a specified activity (insurance contracts). Under the introducing exclusion, a solicitor can introduce a client to a person authorised by the Financial Conduct Authority in order for the client to receive advice. While the solicitor has introduced the client to an insurance broker authorised by the Financial Conduct Authority, the introducing exclusion is not available for insurance policies. Thus, the solicitor cannot rely on this exclusion and is therefore carrying on a regulated activity in breach of the general prohibition. (A) is incorrect because there is a specified investment, namely the insurance policy. (B) is incorrect because the solicitor does not need to personally sell the insurance policy to the client for there to be a specified activity and therefore a regulated activity. Here, the solicitor is arranging (a specified activity) for the client to receive advice in relation to insurance policies (a specified investment). (C) is incorrect because, as explained above, the introducing exclusion is not available when the specified investment is an insurance policy. (D) is incorrect because the solicitor is not advising the client on the insurance policies. The insurance advice is being provided by the insurance broker.",note:'The explanation describes insurance contracts as "a specified activity"; from the rest of the explanation, "a specified investment" appears to be meant. This is as shown in the source.'},{n:27,id:"ETH024",scenario:"A solicitor representing a client in litigation becomes aware that the client has committed perjury on a material point while testifying the previous day.",q:"Which of the following statements best describes what the solicitor should do?",opts:["The solicitor should immediately cease to act.","The solicitor should immediately attempt to convince the client to tell the truth and then refuse to continue to act if the client does not agree.","The solicitor should immediately inform the court that the client has committed perjury.","The solicitor should immediately attempt to convince the client to tell the truth but if the client refuses, the solicitor should continue to act and should not reveal the client's confidential information.","The solicitor should immediately attempt to convince the client to tell the truth but if the client refuses, the solicitor should immediately inform the court that the client has committed perjury."],ans:"B",expl:"(B) A solicitor has a duty not to mislead the court or others. This standard can be violated by affirmative acts, by omissions, or by being complicit in the acts or omissions of others (including the client). Thus, if a solicitor becomes aware that a client has committed perjury or misled or attempted to mislead the court in any material matter, the solicitor should refuse to continue acting for the client unless the client agrees to disclose the truth to the court. (A) is incorrect because the solicitor should first attempt to convince the client to disclose the truth. (C) and (E) are incorrect because informing the court of the perjury is not the recommended course of action under the Code of Conduct, so it is not the best answer here. (D) is incorrect because the solicitor has a duty not to mislead the court, and should cease to act if the client refuses to tell the truth."},{n:28,id:"ETH066",scenario:"A small firm recently completed an employment discrimination matter for a client who is an international celebrity. The firm has not invested in any electronic security measures, and a hacker accesses information from the celebrity's file. The celebrity complains that the firm failed to protect his confidential information.",q:"Which of the following statements best describes the likelihood that the celebrity's complaint will be successful?",opts:["The complaint is unlikely to succeed because the firm's duty of confidentiality to the celebrity ended on completion of the matter.","The complaint is likely to succeed because the firm failed to have systems and controls in place that were appropriate to the nature of the work.","The complaint is unlikely to succeed because a small firm is generally not expected to invest in the same systems and controls as a large firm.","The complaint is likely to succeed because a firm owes a client a duty of confidentiality until the client's death.","The complaint is unlikely to succeed because the firm could not have foreseen the hacker's criminal activity."],ans:"B",expl:"(B) The complaint likely will be successful because the firm failed to have systems and controls in place that were appropriate to the nature of the work. A firm must have effective systems and controls in place to enable the firm to comply with its regulatory requirements, which includes identifying risks to client confidentiality and mitigating those risks. (A) is incorrect because the duty of confidentiality continues after the retainer has ended and even after the client has died. (C) is incorrect because the requirement is that the firm has appropriate systems and controls in place, and the Code for firms does not differentiate between the size of the firm or the nature of the work undertaken. Here the firm chose to represent an international celebrity and should have had effective safeguards in place to protect the client's information. The facts indicate that the firm had taken no electronic security measures at all and this is a clear breach. (D) is incorrect because the duty of confidentiality continues even after the client's death. (E) is incorrect because the firm must safeguard its clients' confidential information (and arguably it was quite foreseeable that unauthorised persons would try to access the celebrity's information)."},{n:29,id:"CNL098",scenario:"Thirty people have broken into the ruins of a historic castle owned by the UK government. The ruins are closed to the public.",q:"Which one of the following best explains what has taken place?",opts:["Trespassory assembly.","Public assembly.","Breach of the Queen's Peace.","Public procession.","Private procession."],ans:"A",expl:"(A) This would be a trespassory assembly. It involves more than 20 persons, the public have no right of access to this land, it is being held without the permission of the owner of the land (that is, the government), and it arguably could cause significant damage to land of historic significance. (B) and (D) are both incorrect because public assemblies and public processions take place on land to which the public have a right of access, whereas this assembly took place on land closed to the public. (C) is incorrect because a breach of the Queen's Peace occurs when there is some form of disturbance that puts a person in genuine fear of harm to themselves or to property in their presence, or when such harm has or is likely to occur. There is no indication here of those events taking place. (E) is incorrect because there is no legal concept of a private procession."},{n:30,id:"LGS064",scenario:"A freelance UK solicitor has undertaken conveyancing work for a client who is buying a block of flats. The solicitor believes the price the client has offered is unreasonably high. The client doesn't seem bothered about paying the price despite the solicitor's advice. The solicitor suspects the client is attempting to launder his money.",q:"Which of the following best describes what the solicitor should do?",opts:["Reveal his suspicions to the client and refuse the engagement if the client admits to this intention.","Ignore his suspicions because the transaction is privileged.","Report his suspicions to a Money Laundering Reporting Officer.","Report his suspicions to the local police department.","Report his suspicions to the National Crime Agency."],ans:"E",expl:"(E) The solicitor should report his suspicions to the National Crime Agency. Solicitors have obligations under the Proceeds of Crime Act 2002 ('POCA') to make disclosures of suspicions of money laundering. The National Crime Agency is the entity charged with enforcement of POCA. In a firm, the duty is to report to the firm's Money Laundering Reporting Officer ('MLRO'). However, as this is a freelance solicitor not working in a firm, the obligation is to report suspicions to the relevant authority - the National Crime Agency. (B) is incorrect because the solicitor has a duty to report his suspicions, as explained above. The transaction is not privileged, nor did the relevant information come to the solicitor in a privileged circumstance (that is, from the client in connection with the giving of legal advice). Rather, the information arose from the solicitor's observation of the transaction. (A) is incorrect because it is an offence under POCA to tip off the client (that is, disclose suspicions to the client). (C) is incorrect because, as explained above, the solicitor does not work in a firm and therefore does not have an MLRO to report to. (D) is incorrect because the relevant authority the solicitor must report to is the National Crime Agency, not the local police department."},{n:31,id:"ETH139",scenario:"A law firm hires a marketing company to help them with their publicity. The firm specialises in group claims in equality and employment-related matters, and are taking action against a large supermarket in an equal pay matter. The firm decides to pay for an advertising campaign on a local radio station to publicise their services.",q:"Is this publicity allowed?",opts:["No, because solicitors are not allowed to publicise their services.","No, because solicitors are not allowed to make unsolicited approaches, as would be the case with any radio advert.","Yes, because radio advertising is a permitted form of publicity.","No, because radio advertising is prohibited where it is targeted to a specific audience, such as would be the case with an advert on a local radio station.","No, unless the SRA approves the content of the advertising in advance."],ans:"C",expl:"(C) Public advertising (such as on the radio) is generally allowed. Unsolicited approaches to members of the public are prohibited, but radio advertising is generally acceptable. (A) is incorrect as solicitors can publicise their services subject to compliance with the law and regulation. (B) is incorrect because radio advertising is not regarded as an unsolicited approach. (D) is incorrect because targeted publicity is prohibited only with respect to unsolicited approaches. (E) is incorrect because it is not the role of the SRA to approve advertising."},{n:32,id:"ETH074",scenario:"A law firm sent the client all mandatory information required by the SRA Standards and Regulations at the outset of a retainer. The client complained about the way their transaction was handled by the fee earner. The firm responded to the client within a week of receiving the complaint, saying that they would be pleased to deal with the complaint upon receipt of a fee of £250 plus VAT from the client. The client objected to making the payment to the firm.",q:"Which of the following statements best describes whether the client's objection would be upheld?",opts:["The objection would not be upheld because £250 plus VAT is a reasonable amount.","The objection would not be upheld because the firm responded to the complaint promptly.","The objection would be upheld because the firm is not entitled to charge any fee for handling the complaint.","The objection would not be upheld because the firm responded politely and fairly.","The objection would be upheld because the firm is not entitled to charge VAT for handling the complaint."],ans:"C",expl:"(C) All complaints from clients must be dealt with promptly, fairly, and free of charge. Because the firm attempted to charge a fee, the client's objection will be upheld. (A) is incorrect because any fee is prohibited. (B) is incorrect because although the firm responded promptly, it is not entitled to charge a fee for handling the complaint. (D) is incorrect because this is a peripheral argument to the central point about the proposed fee. (E) is incorrect because the fee itself (not only the VAT) is prohibited."}],Bi='The end of the explanation, including the question ID, is cut off at the bottom of the answer screen in the source; "[…]" marks where the text stops.',wc="The question ID is cut off at the bottom of the answer screen in the source.",oC=[{n:1,id:"CTR099",scenario:"A ship owner and a businessman enter into a contract to transport a cargo of motorbikes from London to Mumbai. As the voyage commences, the ship owner becomes aware that the Suez Canal, which links the Mediterranean Sea and the Indian Ocean, is shut because of damage sustained as a result of an exceptional storm. To get the motorbikes to their destination, the ship owner would have to transport them round the continent of Africa. The ship owner tells the businessman that the closure means he is no longer under an obligation to perform his duties under the contract. The contract contains a force majeure clause, which specifically provides for such a closure.",q:"Is the ship owner correct?",opts:["Yes, because if a contract becomes too difficult or expensive to perform, then it is frustrated.","Yes, because the force majeure clause is likely to operate to terminate the contract.","No, because it is not enough for a contract to be difficult or expensive to perform for frustration to occur, performance of the contract must be impossible or illegal.","No, because the Law Reform (Frustrated Contracts) Act 1943 would apply in these circumstances and would compel performance of the ship owner's obligations.","No, because frustration in this case is self-induced as the ship owner has the choice to carry on with performance and sail round Africa but has chosen not to."],ans:"B",expl:"(B) This contract contains a force majeure clause. A force majeure clause allows for the termination of a contract on the occurrence of an event outside the control of the parties, which in the scenario includes a closure of the Suez Canal. (A) is incorrect because a contract will not be frustrated just because it is too difficult or is more expensive to perform. For frustration to occur, performance must be impossible, illegal, or radically different from what was agreed. (C) is incorrect because, whilst a contract cannot be frustrated just because it is more difficult or expensive to perform, the force majeure clause expressly agreed between the parties would operate to provide for this scenario. (D) is incorrect because the Law Reform (Frustrated Contracts) Act 1943 deals with the apportionment of loss once a contract has been frustrated. It does not operate to decide whether frustration has taken place or the obligation of the parties in this regard. Also, the Act does not apply to charterparties, and this contract is likely to be a charterparty. And in any case there has been no frustration for the reasons given in both (A) and (C) above. (E) is incorrect because the reason why this contract is not frustrated is that there is a force majeure clause. Otherwise, the reason why the contract is not frustrated would be that the ship owner can still perform it, but performance would be more difficult and expensive."},{n:2,id:"CTR115",scenario:"A man approaches a welder and asks the welder if he would be willing to build the man a still to produce alcoholic spirits. Although it is illegal to brew alcoholic spirits without a license, the welder agrees to do the work for £400 since it is not illegal to build a still. The man tells the welder that he will pay the welder out of the proceeds from selling the spirits (better known as 'moonshine'). The welder builds the still and it works perfectly. The man produces three batches of moonshine and sells them for a total of £500 but refuses to pay the welder. The welder then brings a claim against the man for breach of contract.",q:"Is the welder likely to succeed in his claim?",opts:["Yes, because while the sale of moonshine is illegal, building a still is not.","No, because the contract was voidable for illegality of performance.","No, because the contract was void for illegality of performance.","Yes, because the welder did nothing that was illegal.","No, under the doctrine of uberrimae fidie."],ans:"C",expl:"(C) The welder cannot recover from the man because the contract is void because it was concluded for an illegal purpose. The welder knew that the man wanted to build the still for an illegal purpose. A contract entered for an illegal purpose is void (and not merely voidable, which makes (B) incorrect). (A) is incorrect because if both parties enter a contract to achieve an illegal purpose, the contract is void. It does not matter that performance would be legal under different circumstances. (D) is incorrect as in substance, it is the same as (A). The welder did do something wrong, specifically, the welder entered a contract to achieve an illegal purpose. (E) is incorrect because the doctrine of uberrimae fidie is not relevant. That doctrine provides that certain contracts require utmost good faith and fair disclosure, usually because one party cannot check on information relevant to the contract (such as the health of a person seeking life insurance). A contract to build a still does not fall within this category, and even if it did, there is no indication that the man kept information from the welder.",note:'The source spells the doctrine "uberrimae fidie"; the usual spelling is "uberrimae fidei".'},{n:3,id:"ETH112",scenario:"A supervising solicitor is conducting a file review for a junior solicitor and is concerned that the junior solicitor's language is aggressive and the tone of his communications with the other side's solicitor is offensive. The other side's solicitor has criticised this behaviour on the basis that it is unprofessional. When challenged by his supervisor, the junior solicitor says that he would not normally behave in this way, but it was his client's instructions to adopt this language and tone. The matter is a contract dispute between two rival commercial companies and the client has instructed the junior solicitor to make life as unpleasant as possible for the opponent.",q:"Is the junior solicitor's behaviour acceptable?",opts:["Yes, because a solicitor must always follow their client's instructions.","Yes, because it is not illegal to behave aggressively.","No, because a solicitor must act in a way that upholds public trust and confidence at all times.","No, because it demonstrates a lack of honesty.","Yes, because it is in the client's best interests."],ans:"C",expl:"(C) The SRA Principles embody the fundamental tenets of ethical behaviour and must be applied at all times. A solicitor must act in a way that upholds public trust and confidence in the solicitors' profession and in legal services provided by authorised persons. This extends to treating solicitors, and all other parties, with courtesy and respect notwithstanding the circumstances. Acting on client instructions to adopt an overly aggressive stance brings trust and confidence into question. (A) is incorrect because a solicitor should not act on instructions which place them in breach of Principles. (B) is incorrect because the law is not of relevance here; the concern is whether the junior solicitor has violated his professional obligations. (D) is incorrect because there is no suggestion that the junior solicitor has acted dishonestly. (E) is incorrect. Where Principles come into conflict (here, acting in the client's best interests and acting in a way that upholds trust and confidence), the Principle which safeguards the wider public interest (trust and confidence) takes precedence over an individual client's interests."},{n:4,id:null,scenario:"A solicitor is acting for a client in the sale and purchase of some of the client's investments. During a client meeting, the client makes a few comments which cause the solicitor to become suspicious that the transactions may be a cover for money laundering.",q:"What action should the solicitor now take?",opts:["Tell the client about her suspicions and that she will have to put things on hold until an internal investigation clears the client.","Say nothing to the client about the suspicions and contact the firm's Money Laundering Reporting Officer to make a report after the meeting.","Tell the client about her suspicions but continue with the engagement unless an investigation confirms that the client is involved in money laundering.","Say nothing to the client about the suspicions, leave the meeting quietly, and call the police.","Tell the client about her suspicions and stop offering services to them."],ans:"B",expl:"(B) The solicitor's best course of action is to say nothing to the client about her suspicions and contact the firm's Money Laundering Reporting Officer ('MLRO') to make a report after the meeting. Solicitors have obligations under the Proceeds of Crime Act 2002 ('POCA') to make disclosures of suspicions of money laundering (known as 'suspicious activity reports'). The MLRO is the person within an organisation designated to receive disclosures under POCA and to make disclosures to the National Crime Agency. (A), (C), and (E) are incorrect because there is an affirmative duty to not tip off the client that you are reporting them. Under POCA, it is an offence to disclose to a third person that a suspicious activity report has been made to the authorities if that disclosure might prejudice any investigation that might be carried out. (D) is incorrect because the duty in a firm is to report to the firm's MLRO, who will investigate the matter. If the suspicions are warranted, the MLRO will then report the matter to the National Crime Agency ('NCA') rather than to local police, as the NCA acts as a central point of contact for such matters.",note:wc},{n:5,id:"CTR141",scenario:"A woman seeking life insurance sends a proposal form to an insurance company. The insurance company sends her a quote. The woman is seriously injured in a car accident. She then accepts the insurance company's quote.",q:"Is there a binding life insurance contract?",opts:["Yes, because the woman was not killed in the car accident.","No, the contract is frustrated.","No, because the woman has left it too late to accept the quote.","No, because the offer contained in the quote has lapsed by operation of law.","Yes, because only death of one of the parties will terminate an offer by operation of law."],ans:"D",expl:"(D) The offer contained in the insurance company's quote will be subject to an implied condition that the woman's state of health is unchanged. This condition has now failed, and so the offer has lapsed by operation of law. (A) is incorrect because of the implied condition; the mere fact that the woman survived the accident is not enough to prevent the offer from lapsing by operation of law due to changed circumstances. (B) is not correct because frustration can occur only when performance becomes impossible or substantially different after the contract has been entered into. (C) is incorrect because there is no suggestion that the quote included a time limit, or that the woman has delayed acceptance beyond a reasonable time. (E) is not correct because death is not the only event that will terminate an offer by operation of law. Others include destruction of the subject matter, supervening illegality or, as here, failure of an express or implied condition."},{n:6,id:"LGS041",scenario:"A solicitor's firm is being sued by an employee for indirect discrimination on the grounds of race.",q:"Which of the following statements best describes whether the firm can attempt to justify the discrimination under the Equality Act 2010?",opts:["Indirect discrimination on the grounds of race cannot be justified.","Indirect discrimination on the grounds of race can be justified if the firm has a good reason.","Indirect discrimination on the grounds of race can be justified if the firm has used reasonable means to achieve a legitimate aim.","Indirect discrimination on the grounds of race can be justified if the firm has a proportionate aim.","Indirect discrimination on the grounds of race can be justified if the firm has used proportionate means to achieve a legitimate aim."],ans:"E",expl:"(E) Indirect discrimination on the grounds of race can be justified if the firm has used proportionate means to achieve a legitimate aim. For indirect discrimination on the grounds of any of the protected characteristics, it is open to the employer to try to justify their action by showing they have used proportionate means to achieve a legitimate aim. (A) is incorrect because indirect discrimination on the grounds of any of the protected characteristics, including race, is justifiable if the firm has used proportionate means to achieve a legitimate aim. (B) is incorrect because the justification requires showing that the firm had a legitimate aim, not a good reason, and this was achieved by proportionate means. (C) is incorrect because the means should be proportionate and the aim legitimate. (D) is incorrect because the aim should be legitimate, and this answer choice does not mention the means being
