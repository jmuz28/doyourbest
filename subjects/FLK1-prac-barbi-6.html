 proportionate."},{n:7,id:"CTR129",scenario:"A director of a company in financial difficulties asks a junior employee to mortgage her flat to the company's bank as security for the company's debts to the bank. The company goes into liquidation.",q:"What is the status of the mortgage granted by the employee to the bank?",opts:["It is voidable unless the bank took steps to ensure that the employee made the decision of her own free will, because of presumed undue influence by the director (as employer).","It is voidable unless the bank took steps to ensure that the employee made the decision of her own free will, because of presumed undue influence by the bank.","It is void unless the bank took steps to ensure that the employee made the decision of her own free will, because of presumed undue influence by the director (as employer).","It is voidable for duress because of the relationship of trust and confidence between the director (as employer) and the employee.","It is voidable for undue influence unless the director took steps to ensure that the employee made the decision of her own free will, because of presumed undue influence by the director (as employer)."],ans:"A",expl:"(A) This is a case of presumed third party undue influence. A presumption of undue influence arises because of the relationship of trust and confidence between the director (as employer) and the employee. It should be clear to the bank that the mortgage is intended as security for the company's debts, so it is said to be 'put on enquiry' by the relationship between the director and the employee and to have constructive notice of the director's undue influence. The mortgage will therefore be voidable unless the bank took steps to ensure that the employee made the decision of her own free will. (B) is incorrect because the presumed undue influence was exercised by the director, not the bank (the bank is a third party). (C) is incorrect because a contract entered into as a result of undue influence is voidable, not void. (D) is not correct because this is not a case of duress. Duress requires actual coercion (physical or economic) of the innocent party and no coercion is revealed in the facts. (E) is not correct, because it was for the bank, as the other party to the contract, to take the necessary steps to ensure that the employee made the decision of her own free will."},{n:8,id:"LGS022",scenario:"A solicitor is approached by a potential client with a personal injury claim. The client does not have any insurance to cover her legal fees and enquires whether the solicitor will accept the case on a contingency fee basis. The solicitor thinks that this will be a costly case to bring but one which is of potentially high value. He therefore proposes a damages based agreement with a success fee of 30% of the damages awarded.",q:"Is the solicitor permitted to enter into a damages based agreement on the basis described?",opts:["No, because damages based agreements are not allowed in personal injury cases.","No, because damages based agreements cannot be for more than 25% of the damages awarded in personal injury cases.","Yes, because the solicitor is able to set the success fee at any percentage of the damages awarded.","Yes, because the solicitor has concluded that this is a costly case which merits a high percentage success fee.","Yes, because damages based agreements can be for up to 50% of the damages in personal injury cases."],ans:"B",expl:"(B) The solicitor is not permitted to enter into a damages based agreement for more than 25% of the damages awarded in a personal injury case. In a personal injury case, the legal costs payable under a damages based agreement cannot be more than 25% of the sum recoverable, excluding future losses. In non-personal injury cases, the sum payable can be no more than 50%. Here, the solicitor has proposed a success fee of 30% of the damages awarded in a personal injury case, which is not permitted. (A) is incorrect because damages based agreements are available in personal injury cases. (C) is incorrect because, as explained above, there is a limit of 25% of damages awarded in personal injury cases and 50% in non-personal injury cases. (D) is incorrect because although the solicitor will consider the risk and reward when setting the success fee, the solicitor is still subject to the limitations on the success fee explained above. (E) is incorrect because in a personal injury case, the legal costs payable under a damages based agreement cannot be more than 25% of the sum recoverable, excluding future losses. The 50% figure relates to non-personal injury cases.",note:'The question ID is partly cut off at the bottom of the answer screen; it appears to read "LGS022".'},{n:9,id:"LGS030",scenario:"An employee of a firm of solicitors discovers that he is being paid less than employees of a similar level of qualification and experience. When he asks his line manager about this difference, he is told that his peers are all married and so have additional financial pressures on them which he, as a single man, does not have.",q:"Under the Equality Act 2010, would the employee have a potential claim for discrimination against his firm?",opts:["Yes, because the firm is indirectly discriminating against him on the grounds of marriage.","No, because marriage is not a protected characteristic.","Yes, because the firm is directly discriminating against him on the grounds of marriage.","No, because the firm has a legitimate reason for paying him less than his peers.","No, because the firm is using proportionate means to differentiate between him and his peers."],ans:"C",expl:"(C) The employee has a potential claim against the firm for direct discrimination on the grounds of the protected characteristic of marriage because the firm is expressly treating single employees less favourably than married employees. Direct discrimination is treating one person less favourably than another because of that person having a protected characteristic. Note that there is no justification for direct discrimination on the grounds of marriage/civil partnership. (A) is incorrect because, as explained above, this is direct discrimination, not indirect discrimination. (B) is incorrect because marriage/civil partnership is a protected characteristic under the Equality Act. (D) and (E) are incorrect because there is no justification for direct discrimination on the grounds of marriage. If justification were possible, the firm would have to show the action was a proportionate means of achieving a legitimate aim."},{n:10,id:"LGS062",scenario:"A solicitor is working on a divorce case with a client. Whilst discussing assets, the client informs the solicitor that he has bought several properties using cash, so they will be hard for his wife to find. The solicitor suspects the purchases are part of a money laundering scheme.",q:"What is the solicitor's best course of action regarding the client's suspicious financial activities?",opts:["Report the suspicions to the National Crime Agency ('NCA').","Report the suspicions to the firm's Money Laundering Reporting Officer ('MLRO').","Wait until the divorce case is over and then report the suspicions to the MLRO.","Stop representing the client.","Maintain client confidentiality and not report the matter."],ans:"E",expl:"(E) The solicitor's best course of action regarding the client's suspicious financial activities is to maintain client confidentiality and not report the matter. While a solicitor is obligated to report suspicions of money laundering, it is a defence to failure to report that the information falls within a privilege that has not been excluded by the anti-money laundering laws or that has come to the solicitor in privileged circumstance. Privileged circumstance includes information that came to the solicitor from a client in connection with the giving of legal advice to the client. Here, the solicitor was acting for a client on a bona fide divorce litigation and learned about assets the client bought with cash in connection with giving legal advice to the client on this matter. Thus, due to the privileged circumstance defence, maintaining client confidentiality supersedes the obligation to report suspicions of money laundering in this case. (A) and (B) are incorrect because, as explained above, the solicitor need not report his suspicions because he can rely on the privilege circumstance defence. In any event, if the solicitor were required to report, it would be to the MLRO and not to the NCA. (C) is incorrect because the duty of confidentiality extends beyond the representation; the matter cannot be reported even after the representation ends. In any event, if the solicitor were required to report, the solicitor should do so as soon as reasonably practicable rather than waiting until the divorce case was over. (D) is incorrect because there is no rule requiring the solicitor to quit the representation under these circumstances."},{n:11,id:"ETH094",scenario:"A painter and an art dealer have asked a solicitor to act for them in the sale of a painting. The parties have differing views on the painting's value, and the solicitor has explained that she cannot act for both of them in this matter because there is a conflict of interest. The parties reply that they believe the solicitor will treat them both fairly in the negotiations and that they both consent to the solicitor acting.",q:"Which of the following statements best describes whether the solicitor should act for both parties?",opts:["Regardless of the fact that the parties gave consent to the solicitor acting, there is still a conflict of interest and the solicitor should not act for both parties.","The solicitor may act for both parties because they have a substantially common interest and each party has consented to the solicitor acting. Should any points of conflict arise during the retainer, the solicitor will need to advise one of the parties to take independent legal advice.","Because the parties have a substantially common interest, the solicitor may act for both parties provided each party gives written consent to the solicitor acting.","Because the parties have a substantially common interest and both parties want the same outcome, there is no conflict of interest, and the solicitor is therefore permitted to act for both parties.","The solicitor should not act for both parties, but may act for one party and refer the other party to another member of the solicitor's firm to act in the matter."],ans:"A",expl:"(A) A solicitor cannot act where there is a conflict of interest, or a significant risk of conflict. Here the risk of conflict is too great - there will be the need to negotiate and the parties' interests will be different, so the solicitor must decline to act even if the parties consent to the solicitor acting. (B), (C), and (D) are incorrect. There is a 'substantially common interest' exception which can be used when there is a conflict between clients, or a significant risk of conflict. Here there is a significant risk of conflict, but the parties do not have a substantially common interest - one party is buying the painting and the other party is selling it. Therefore, this exception is inapplicable and the solicitor cannot act for both parties. (E) is incorrect because the conflict cannot be resolved by referring one party to another member of the firm."},{n:12,id:"ETH071",scenario:"A solicitor is advising a client on a contract for the supply of goods and services to a company. The solicitor later gets chatting to a man he has never met before in a meeting of a book club of which he is a member. The man tells the solicitor that, coincidentally, he is employed by the company the solicitor's client is contemplating entering into a contract with. The man says he is worried about his job because the company is in financial difficulty, with a number of creditors threatening action.",q:"Which of the following statements best describes what steps the solicitor should take in these circumstances?",opts:["The solicitor need not tell the client what the man told him about the company because the information was not obtained in the course of the solicitor's business.","The solicitor should not tell the client what the man told him about the company because the duty of confidentiality overrides the duty of disclosure.","The solicitor should not tell the client what the man told him about the company because information obtained from clients must be kept confidential unless disclosure is required or permitted by law or the client consents.","The solicitor should tell the client what the man told him about the company because the information is material to the client's matter.","The solicitor should tell the client what the man told him about the company because the duty of disclosure overrides the duty of confidentiality."],ans:"D",expl:"(D) The solicitor is under a duty to disclose to the client any information of which the solicitor is aware and which is material to the client's retainer. The fact that the company is in difficulty with creditors is very material to the client's matter, because the client is considering becoming another creditor. (A) is incorrect because the duty extends to information that was received outside the course of business. (C) is incorrect because the information was not received from a client, so it is not confidential. (B) and (E) are incorrect because the information is not subject to confidentiality, so there is no conflict with the duty of disclosure."},{n:13,id:"LGS052",scenario:"A solicitor concluded a house purchase for a client which was financed by a mortgage and an inheritance from the client's grandmother. The solicitor billed the client for the conveyancing work and the client paid the bill within a few days. A week later, the client is arrested. The police inform the solicitor that the client's bill was paid from an account which they believe contained the proceeds of an insurance fraud perpetrated by the client.",q:"Which of the following best describes whether the solicitor has committed an offence under the Proceeds of Crime Act 2002 ('POCA')?",opts:["The solicitor has committed the offence of tipping off.","The solicitor may have committed the offence of acquisition, use, or possession and no defence applies.","The solicitor has not committed any offence.","The solicitor may have committed the offence of arrangement and no defence applies.","The solicitor may have committed the offence of acquisition, use, or possession but could rely on the adequate consideration defence."],ans:"E",expl:"(E) By accepting the client's payment, the solicitor may have committed the offence of acquisition, use, or possession but could rely on the adequate consideration defence. Under POCA, it is an offence if a person acquires, uses, or has possession of criminal property. However, a defence is available if the property was acquired, used, or possessed for adequate consideration. The defence applies when professional advisers, such as solicitors, receive money for or on account of costs. It is most likely to arise in situations in which a solicitor provides legal services as part of a legitimate arm's length transaction but unbeknownst to them is paid from a bank account which contains the proceeds of crime. Here, the solicitor acquired funds from the client from an account which contained the proceeds of criminal activity. However, the solicitor acted for the client on a house purchase, a legitimate arm's length transaction. There is no suggestion that the solicitor had any suspicion about the client or the client's payment prior to contact by the police. Therefore, the solicitor could rely on the adequate consideration defence. (A) is incorrect as no tipping off has taken place here. Tipping off occurs when a person discloses to a third person that a suspicious activity report has been made to authorities, or discloses an investigation to a third person. (B) is incorrect because, as stated, the adequate consideration defence is available here. (C) is incorrect because an offence may have been committed here and there is also a defence available, as explained above. (D) is incorrect because the potential offence here is acquisition, use, or possession, not arrangement. The solicitor has not facilitated the acquisition of criminal property by someone else, but rather acquired criminal property himself."},{n:14,id:"ETH111",scenario:"A solicitor accidentally emails a client care letter to the incorrect person (not the client). The client care letter contains information about the client and their matter. The solicitor immediately contacts the recipient and requests that they delete the email and do not use it. The recipient confirms they will do this.",q:"Which of the following statements best describes the solicitor's obligations?",opts:["The solicitor does not need to do anything because the mistake has been rectified.","The solicitor does not need to do anything because the client has not suffered any loss as a result of their mistake.","The solicitor should notify the client about what has happened and inform the firm's compliance officer for legal practice (COLP).","The solicitor should report the matter to the firm's compliance officer for legal practice (COLP), but does not need to notify the client about what has happened.","The solicitor should report the matter to the firm's compliance officer for finance and administration (COFA), but does not need to notify the client about what has happened."],ans:"C",expl:"(C) A solicitor must be honest and open with clients if things go wrong. The solicitor should tell the client about the misdirected email because they may wish to take steps to protect themselves from any potential cyber crime issues, bearing in mind that their confidential information has inadvertently been sent to a third party. The solicitor should also tell the firm's COLP about the issue so that they can determine whether or not the firm's insurers need to be notified. (A) and (B) are incorrect because a breach of confidentiality has occurred and this needs to be reported to the firm's COLP and the client. (D) is incorrect because the solicitor should also inform the client about what has happened. (E) is incorrect for the same reason, and because the matter should be reported to the firm's COLP, not the COFA."},{n:15,id:null,scenario:"A car collector offered in writing to sell his collection of vintage cars to a fellow enthusiast for £500,000. The enthusiast wrote back to the car collector to accept the offer, but because the cars were so expensive, he told the car collector in the letter that payment for the cars would be in four instalments of £125,000, the first in a month's time. The car collector has not yet received the letter.",q:"Is there a valid contract for the sale of the cars between the car collector and the enthusiast?",opts:["No, the parties have communicated by letter, and so the contract will only be concluded once the car collector has received the enthusiast's letter.","Yes, the facts suggest that all the requirements of a valid contract are in place.","Yes, because of the value of the contract, it is reasonable for the enthusiast to require payment in instalments.","No, the car collector's 'offer' is merely an invitation to treat. The enthusiast would need to make an offer for the cars on the terms indicated which the car collector could then accept.","No, the enthusiast's payment terms are a counteroffer which terminates the car collector's original offer."],ans:"E",expl:"(E) The enthusiast's payment demands created a counteroffer. The enthusiast's response varied the terms of the car collector's original offer and thus terminated it. A counteroffer is an offer made by the offeree to the offeror which contains the same subject matter as the original offer, but differs in its terms. (Had the enthusiast requested details of payment terms or even asked if these terms were permissible, then it is likely the car collector's offer would have survived.) (A) is incorrect because under the postal rule acceptance is communicated as soon as the letter is posted; there is no requirement for it to have been received by the offeror unless receipt was specified in the contract. (B) is not correct because there is no valid acceptance of the counteroffer. Therefore not all the elements of a valid contract are present, as 'agreement' requires both offer and acceptance. The value of the subject matter of the contract is irrelevant in terms of payment obligations, and it does not excuse a counteroffer, so (C) is not correct. There is no reason why the car collector's offer should be considered an invitation to treat as it does not fall within one of the categories that are usually identified as invitations to treat, for example, advertisements, goods in shop windows, tenders, et cetera, so (D) is also incorrect.",note:wc},{n:16,id:"LGS101",scenario:"A firm of solicitors is not authorised by the Financial Conduct Authority to carry on a 'regulated activity' as defined in the Financial Services and Markets Act 2000 ('FSMA') and related secondary legislation.",q:"Which of the following activities would the firm be able to conduct in its business if no FSMA exclusion or exemption applies?",opts:["Safeguarding a client's debentures.","Advising a client on purchasing Premium Bonds.","Arranging for a client to purchase an insurance policy.","Managing a client's pension scheme payments.","Contracting for a client to purchase company shares."],ans:"B",expl:"(B) Under the general prohibition of FSMA, a firm of solicitors may not carry on regulated activity in the UK unless they are authorised or exempt from authorisation. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. The specified activities and investments might be remembered with the mnemonic device 'ADAMS F.M.DIPS'. Activities = Advising, Dealing as an agent, Arranging, Managing, and Safeguarding. The specified investments most relevant to a solicitor = Funeral plans, Mortgage contracts, Debentures, Insurance contracts, Pension schemes, and Shares in a company. The firm would be able to advise a client on the purchase of Premium Bonds because while advising is a specified activity, Premium Bonds are not specified investments. (A), (C), and (D) each clearly involve specified activities (safeguarding, arranging, and managing, respectively) and specified investments (debentures, insurance policies, and pension schemes). (E) clearly involves a specified investment as well (company shares) and contracting on behalf of someone is dealing as an agent (a specified activity)."},{n:17,id:null,scenario:"A solicitor acting for a defendant in a contract dispute receives an email from the claimant's solicitor about an upcoming court hearing. The defendant's solicitor knows the court hearing is next Thursday, but the email clearly indicates that the claimant's solicitor believes the hearing is next Friday. The defendant's solicitor mentions this to the defendant, and the defendant instructs her not to respond to the email. The defendant's solicitor does not respond to the email or take any other action.",q:"Did the defendant's solicitor breach the SRA Code of Conduct?",opts:["No, because the defendant's solicitor acted in accordance with the defendant's instructions.","Yes, because the defendant's solicitor attempted to mislead the claimant's solicitor.","No, because the defendant's solicitor is not responsible for the mistake of the claimant's solicitor.","No, because the defendant's solicitor did not make any affirmative statement.","No, because the defendant's solicitor is only under a duty not to mislead the court, and she did not do this."],ans:"B",expl:"(B) A solicitor must not mislead or attempt to mislead the client, the court, or others. Here the defendant's solicitor attempted to mislead the claimant's solicitor by omission (that is, taking no action to correct the error) and was in breach of the Code of Conduct. (A) is incorrect because this standard can be breached by affirmative acts, by omissions, or by being complicit in the acts or omissions of others (including the client). Here the defendant's solicitor's failure to respond to the email constituted a breach regardless of whether she was acting in accordance with defendant's instructions. (C) is incorrect. Although the claimant's solicitor is responsible for his own mistakes, the defendant's solicitor still must not attempt to mislead him. (D) is incorrect because a solicitor can breach this standard without taking any affirmative act; an omission is enough. (E) is incorrect. It is true that a solicitor is under a duty not to mislead the court. However, a solicitor is also under a duty not to mislead others, and the defendant's […]",note:Bi},{n:18,id:"CTR092",scenario:"Two businessmen enter into a contract for the sale of a quantity of goods. After the contract has been concluded, it turns out that one of the businessmen is a rogue, and the goods he was selling were stolen.",q:"What rights (if any) does the buyer have under contract law?",opts:["None. If the seller does not own the goods they are selling, there is no consideration and therefore no valid contract.","Unless there was an express term in the contract dealing with ownership, the buyer will have no rights.","The buyer can sue the seller for breach of contract as the Sale of Goods Act 1979 will imply a term into the contract that the seller has title to the goods.","The buyer can sue the seller for breach of contract as the Consumer Rights Act 2015 will imply a term into the contract that the seller has title to the goods.","The buyer can sue the seller for breach of contract as the Supply of Goods and Services Act 1982 will imply a term into the contract that the seller has title to the goods."],ans:"C",expl:"(C) Legislation implies terms into a contract in relation to the seller's right to sell the goods, in other words, that the seller has good title. The Sale of Goods Act 1979 ('SGA') implies this term in relation to a contract between two businesses so (C) is the correct answer. (A) is incorrect. If the seller does not have title then they will be in breach of contract and the buyer will be entitled to sue because of the rights implied by the SGA. (B) is incorrect as it is not necessary for the parties to have expressly agreed to a contractual term dealing with title; the relevant legislation will imply such a term. (D) is incorrect as the parties are both businessmen, and the Consumer Rights Act 2015 applies to consumer contracts. (E) is incorrect as the Supply of Goods and Services Act 1982 relates primarily to the transfer of property in goods (other than sale), the hire of goods, and the supply of services, including the supply of goods as part of those services. The SGA is the relevant legislation in this scenario."},{n:19,id:null,scenario:"A UK importer agrees to buy a consignment of sugar from a dealer in Brazil. The importer's bank promises the Brazilian dealer that it will pay for the consignment if the importer fails to pay.",q:"What requirements must be met so that the promise by the bank will become a binding contract?",opts:["The bank's promise must be made by deed, because this is a guarantee.","The bank's promise must be made by deed, because there is no consideration for the promise.","The bank's promise must be made in writing, because this is a guarantee.","The bank's promise must be made in writing, because there is no consideration for the promise.","The bank's promise will be binding as long as the parties intend to create legal relations."],ans:"C",expl:"(C) The bank's promise must be made in writing because this is a guarantee. A guarantee is a promise to pay a debt owed by another party if that party fails to pay. It is one of the categories of contract which must be made in writing. (A) is incorrect because there is no requirement that a guarantee be made by deed, although in fact guarantees are often made by deed in case there are issues with consideration. (B) is incorrect because the Brazilian dealer's agreement to sell the consignment to the UK importer is consideration for the bank's promise. The consideration is moving from the promisee, the Brazilian dealer. (D) is incorrect because a promise which is not supported by consideration will be binding only if it is made by deed - it is not sufficient that it be in writing. In any event, there is sufficient consideration for this promise, as described above. (E) is incorrect because, in the case of guarantees, the usual requirements for a contract to be binding are supplemented by an additional requirement that the […]",note:Bi},{n:20,id:"LGS084",scenario:`An elderly client engages a solicitor on a conveyancing transaction for the sale of the client's house. The client instructs the solicitor to look at the client's portfolio of shares and decide which ones the client should sell to allow him to raise some money to furnish his new retirement flat. The solicitor makes the decision regarding the shares and the client makes the necessary arrangements with his stockbroker to sell the shares. Neither the solicitor nor his firm is authorised by the Financial Conduct Authority to carry on a "regulated activity" as defined in the Financial Services and Markets Act 2000 and related secondary legislation. The stockbroker is authorised by the Financial Conduct Authority.`,q:"Has the solicitor breached the general prohibition against carrying on a regulated activity?",opts:["No, because the land is not a specified investment.","No, because the client is receiving advice from an authorised person.","No, because the solicitor is providing a service which is a necessary part of the provision of legal advice.","Yes, because the necessary exclusion is not available for the specified activity of managing.","Yes, because the necessary exclusion is not available in conveyancing transactions."],ans:"D",expl:"(D) The solicitor has breached the general prohibition against carrying on a regulated activity because the necessary exclusion is not available for the specified activity of managing. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. Here, the solicitor has carried on a specified activity (managing, that is, exercising discretion in deciding which shares the client should sell) in relation to a specified investment (the shares). Under the necessary exclusion, a solicitor may conduct activities in relation to specified investments when the activity may reasonably be regarded as a necessary part of performing legal services which do not otherwise consist of carrying on a regulated activity. While selling the shares is arguably a necessary part of the client's conveyancing transaction, the necessary exclusion is not available for the specified activity of managing. Thus, the solicitor cannot rely on this exclusion and is carrying on a regulated activity in breach of the general prohibition. (A) is incorrect because while land is not a specified investment, the relevant investment here is the shares. (B) is incorrect because no advice is being provided by the authorised person. The solicitor is exercising discretion and deciding which shares to sell, and the stockbroker will place sell orders in accordance with the solicitor's decision. (C) is incorrect because, as mentioned, the necessary exclusion is not available when the specified activity is managing. (E) is incorrect because the necessary exclusion is available in conveyancing transactions. The exclusion cannot be used, however, if the activity is billed separately from the main legal advice or if the activity relates to insurance policies."},{n:21,id:"LGS008",scenario:"A freelance solicitor with four years' post-qualification experience is drafting a set of standard terms and conditions of trading for a client. The freelance solicitor only carries on this type of work for clients.",q:"Which statement best describes the professional indemnity insurance coverage which the Solicitors Regulation Authority requires the freelance solicitor to have?",opts:["The freelance solicitor must have adequate and appropriate insurance cover only.","The freelance solicitor must have insurance cover at the minimum level required by the SRA only.","The freelance solicitor must have insurance cover at the minimum level required by the SRA and that insurance must be adequate and appropriate only.","The freelance solicitor is not required by the SRA to have professional indemnity insurance because the SRA does not impose any insurance obligation on freelance solicitors.","The freelance solicitor is not required by the SRA to have professional indemnity insurance because the solicitor is not carrying out a reserved legal activity."],ans:"E",expl:"(E) Freelance solicitors do not have an obligation to maintain adequate and appropriate indemnity insurance in accordance with the SRA's requirements unless they are carrying out reserved legal activities. Reserved legal activities include carrying on notarial services, conducting litigation, and preparing reserved instruments involving property interests. Drafting a set of standard terms and conditions of trading for a client is not a reserved activity. Therefore, the freelance solicitor is not required by the SRA to have professional indemnity insurance. (A), (B), and (C) are incorrect as there is no reserved legal activity and therefore no requirement to have professional indemnity insurance. (D) is incorrect because the SRA requires freelance solicitors to have professional indemnity insurance if they are carrying on a reserved legal activity."},{n:22,id:"LGS018",scenario:"A solicitor enters into a conditional fee agreement with their client in a personal injury claim. The agreement states that if the solicitor wins the case, they will be paid a success fee of an additional 25% of the solicitor's usual rate of £200 per hour. The client's claim is successful, they are awarded damages of £50,000, and the court orders the other side to pay the client's costs. The solicitor has billed for 20 hours of work on the case.",q:"Which of the following best describes the costs position?",opts:["The solicitor will be paid £5,000 by the client's opponent.","The solicitor will be paid £5,000 by the client.","The solicitor will be paid £1,000 by the client and £4,000 by the client's opponent.","The solicitor will be paid £4,000 by the client and £1,000 by the client's opponent.","The solicitor will be paid £12,500 by the client from the damages awarded."],ans:"C",expl:"(C) The solicitor will be paid £1,000 by the client and £4,000 by the client's opponent. A conditional fee agreement provides that if a case is successful, the solicitor can charge their fee to the client with a percentage uplift (the success fee) beyond the normal fees charged. If the claim is successful, the other side is liable for the client's normal fees and the client is liable for the success fee. Here, there is a conditional fee agreement in place with a 25% success fee. The claim has been successful, and costs have been awarded in the client's favour. The solicitor has done 20 hours of work at £200 per hour, which totals £4,000. This is the solicitor's normal fee and can be recovered from the opponent since the opponent has been ordered to pay the client's costs. The success fee of £50 per hour (25% of £200) is payable by the client, totalling £1,000 (£50 x 20 hours). (A) is incorrect because the opponent is liable for only the client's costs at the normal hourly rate. The client is liable for the success fee. (B) is incorrect because the other side has been ordered to pay the client's costs, so the client will be liable for only the success fee. (D) is incorrect because the figures are transposed. As explained above, the opponent will pay £4,000 for the solicitor's normal fees and the client will pay £1,000 for the success fee. (E) is incorrect because the success fee is calculated as a percentage of the solicitor's hourly rate, not as a percentage of the damages awarded.",note:"The lines of the facts are scrambled on the scan; they have been put back in reading order."},{n:23,id:null,scenario:"A cattle dealer negotiated with a breeder for the purchase of a prize bull. Following the negotiations, the dealer wrote to the breeder offering to buy the bull. He said in the letter, 'If I hear nothing further from you, I consider the bull mine for £500'. The breeder did not reply to the letter. The bull was subsequently sold in an auction to a third party.",q:"Was there a binding contract between the cattle dealer and the breeder?",opts:["No. The breeder had no intention to be legally bound.","No. The breeder did not communicate his acceptance of the offer.","No. The offer was not certain and definite enough to be valid.","Yes. The breeder's silence was sufficient acceptance.","Yes, all the elements required for a valid contract were present."],ans:"B",expl:"(B) For an offer to be validly accepted, the offeree must communicate their acceptance to the offeror. Silence cannot constitute acceptance, as a positive act is required. Therefore, (B) is the correct answer. (This rule does not apply if the parties have agreed to dispense with the need for communication, but in this case the breeder has not agreed to this.) (A) is incorrect because there is no suggestion that the parties did not intend to be legally bound. The parties are acting in the course of business so there is a strong presumption of legal intent and there is no evidence in the scenario to rebut this. On the facts of the scenario, an offer has been communicated and the subject matter and price to be paid are clear, so (C) is incorrect as the terms of the offer seem to be definite and certain. (D) is incorrect because, as stated above, silence cannot constitute acceptance. (E) is incorrect because the elements for a valid contract are not present, as there has been no valid acceptance by the breeder.",note:wc},{n:24,id:"CTR054",scenario:"A consumer contracts with an oven retailer for a new oven for their kitchen. The oven retailer fails to deliver the oven within the contractually agreed time frame, and the consumer has to pay the fitter who they had hired to install the oven. The consumer tries to reclaim their losses from the retailer for breach of contract, but the retailer relies on a clause in the contract which states 'the retailer will not be liable for any loss suffered by the customer as a result of the retailer's failure to comply with the delivery time frame stated in this contract'. The consumer feels that this contract term is unfair.",q:"Under the Consumer Rights Act 2015, when will a contract term be deemed to be unfair?",opts:["When the party seeking to rely on the term has not acted in good faith to the detriment of the consumer.","When, contrary to the requirement of good faith, it causes a significant imbalance in the parties' rights and obligations to the detriment of the consumer.","When, contrary to the requirement of good faith, it causes any imbalance in the parties' rights and obligations to the detriment of the consumer.","When the parties do not have equal bargaining power and therefore the clause is of detriment to the consumer.","When the consumer is not receiving a good deal under the contract."],ans:"B",expl:"(B) The Consumer Rights Act 2015 ('CRA') provides that a term is unfair where, contrary to the requirements of good faith, it causes a significant imbalance in the parties' rights and obligations to the detriment of the consumer. Whether a term is fair is determined taking into account the nature of the subject matter of the contract, and by reference to all the circumstances existing when the term was agreed and to all of the other terms of the contract or of any other contract on which it depends. (A) is incorrect, as whilst the CRA definition does require the term to be considered in the light of good faith requirements, the requirement of a significant imbalance between the parties is key. (C) is incorrect as the CRA requires a significant imbalance. (D) is incorrect because, whilst equality of bargaining power is the driver behind the CRA and consumer protection, this is not the definition of 'unfair' required by the CRA. (E) is incorrect because the CRA is not concerned with whether the consumer is getting a good deal; it is focused on whether the terms of the contract they have entered into are unfair."},{n:25,id:"CTR028",scenario:"A woman owes her friend £250 under a contract they have entered into, but is unable to pay and asks her friend if he will take her designer watch, worth £200, as payment for the debt instead. The friend agrees. The friend later changes his mind and sues the woman for the £50 he claims is still owing to him.",q:"Will the friend be successful in his claim?",opts:["Yes, because the watch did not represent the full value of the outstanding debt.","Yes, because an object (the watch) is not adequate consideration for the part payment of a monetary debt.","No, because he had agreed to part payment and is estopped from going back on his promise.","No, because payment by another method is sufficient consideration for the promise to forego the balance of an outstanding debt.","Yes, because part payment of an existing debt is only sufficient consideration if made by a third party."],ans:"D",expl:"(D) There is a general rule that an agreement to accept part payment in full and final settlement of a debt is not supported by consideration and so does not preclude the debtor from subsequently claiming the balance. However, the common law has established a number of exceptions to this general rule, usually where some additional benefit is conferred on the debtor in consideration for their promise to forego the balance of their debt. An example of this is payment by another method, so (D) is correct. (A) is incorrect because it is irrelevant that the value of the outstanding debt and the value of the watch are not the same if the friend has agreed to the deal in full and final settlement of the debt. (B) is incorrect because of the common law rule discussed above. Part payment via another method is sufficient consideration for a promise to forego the balance of a debt. (C) is incorrect, because whilst promissory estoppel is an equitable doctrine that prevents a debtor going back on a promise to accept part payment, other conditions are also required, primarily that the creditor has relied on the promise to their detriment. This does not appear to be the case in this scenario. (E) is incorrect: part payment of a debt by a third party is sufficient consideration for a promise to forego the balance of a debt, but there are other ways to provide […] consideration, as discussed above.",note:'The scan captures the end of this explanation out of order and part of one line is cut off ("[…]"). The explanation also refers to the "debtor" and the "creditor" in places where the roles appear to be reversed; this is as shown in the source.'},{n:26,id:"CTR090",scenario:"The manager of a clothes factory promises his workforce an additional £100 in their pay packet at the end of the month to complete a large order on time for an important wholesaler client. If the order was not completed on time, the factory would incur a penalty under their contract with the wholesaler so that the price of that contract would be reduced. After the workers have completed the contract, the manager refuses to add the additional £100 to their pay at the end of the month.",q:"Could the workers sue the factory for the promised money?",opts:["Yes. The workers have gone above and beyond their existing contractual duty and have therefore provided consideration for the promise to pay them extra.","Yes. The order being completed on time has conferred a practical benefit on the factory as they will not incur a penalty under the contract with the wholesaler.","Yes. Performance of an existing contractual duty to a third party is good consideration for the promise to pay more money.","No. Performance of an existing contractual duty is not sufficient consideration and the workers have done nothing more than they are contracted to do.","No. The workers completed the additional work before the end of the month, so this is past consideration, which is not sufficient consideration."],ans:"B",expl:"(B) If performance of an existing contractual duty confers a practical benefit on a party which is offering an additional benefit in return, then this can be good consideration for the offer of the benefit. Thus (B) is the correct answer. The factory avoiding the penalty and a monetary sanction under their contract with the wholesaler is a practical benefit, which is sufficient consideration for the promise to pay the workforce more money to complete the order on time. (A) is incorrect because consideration provided by the workers consists of the practical benefit to the factory in avoiding the penalty under the contract with the wholesaler. The workers have done no more than they were obliged to do under their existing contract, but conferring a practical benefit is an exception to the normal rule that performance of an existing contractual duty is not good consideration. (C) is incorrect because the workers do not owe the wholesaler a contractual duty. (D) is not correct for the same reason as (A). Even though performance of an existing contractual duty generally is not good consideration, there is an exception where a practical benefit has been conferred on the other party. (E) is incorrect because it is the promise to pay that is relevant in terms of consideration, not the actual payment. The promise is executory consideration, meaning that it is to be performed in the future. The timing is therefore irrelevant; past consideration is not an issue in this scenario."},{n:27,id:null,scenario:"A solicitor plans to begin working for a charity. She will be advising tenants on lease-related issues and will occasionally conduct litigation.",q:"Do the SRA Standards and Regulations require the solicitor to ensure that the charity takes out professional indemnity insurance in respect of her [services]?",opts:["Yes, in respect of conducting litigation only.","Yes, in respect of advising tenants only.","Yes, in respect of all services she provides.","No, because the solicitor is not carrying out reserved legal activities.","No, because the charity is a not-for-profit body."],ans:"C",expl:"(C) Solicitors in non-commercial bodies who are carrying on reserved legal activities must ensure that the body takes out adequate and appropriate professional indemnity insurance. Although the carrying on of reserved legal activities is what triggers the insurance obligation, the indemnity insurance must provide adequate and appropriate cover in respect of all services that the solicitor provides. The solicitor here is carrying out a reserved legal activity (conducting litigation) and therefore must ensure the charity has taken out adequate and appropriate insurance cover in respect of all her services. This means that even though advising tenants on lease-related issues is not a reserved legal activity, the insurance must provide cover for those services as well. (A) is therefore incorrect. (B) is incorrect because the insurance also must provide cover for conducting litigation, as this is the reserved legal activity which triggered the insurance obligation. (D) is incorrect because the solicitor is carrying out a reserved legal activity (conducting litigation). (E) is incorrect because a solicitor in any non-commercial body (such as a not-for-profit body) who is carrying on reserved legal activities has an obligation to ensure that the body takes out indemnity […]",note:Bi+' The last word of the question is obscured on the question screen; "[services]" is inferred.'},{n:28,id:"ETH088",scenario:"A solicitor is acting on the sale of a client's assets, which include high-value art pieces. The solicitor is using a specialist art dealer to facilitate the sale and to maximise the amount the pieces will sell for. The contract the solicitor has with the art dealer provides that the art dealer will pay the solicitor 1% of the value of each art piece for referring the work to them.",q:"Is the solicitor entitled to retain the commission?",opts:["Yes, because the contract for the sale is between the solicitor's firm and the art dealer.","Yes, because it was the solicitor's decision to use this particular art dealer.","Yes, provided the solicitor notifies the client about the commission.","No, unless the client has agreed that the solicitor may retain the commission.","No, the solicitor cannot retain the commission under any circumstances."],ans:"D",expl:"(D) If a solicitor receives a financial benefit as a result of a client's instructions, the solicitor must properly account to the client for that financial benefit unless the client has already agreed otherwise. (A) and (B) are incorrect because the solicitor is not entitled to retain the commission without the client's agreement, regardless of the solicitor's role in the transaction. (C) is incorrect because notifying the client of the financial benefit is not sufficient; the client must agree that the solicitor can retain it. (E) is incorrect because the solicitor is permitted to retain the financial benefit if the client agrees."},{n:29,id:null,scenario:"A seller sells boxes to a commercial buyer. The contract incorporates the seller's standard terms and conditions of business, which contain the following exclusion clause: 'We exclude all the statutory warranties relating to conformity with description, satisfactory quality, and fitness for purpose'. The boxes are not of satisfactory quality.",q:"What remedies are available to the buyer?",opts:["The buyer can terminate the contract and reject the boxes, but the exclusion clause prevents it from claiming damages.","The buyer has no remedy, because the contract includes a clause excluding statutory warranties based on the quality.","The buyer can claim damages and/or terminate the contract and reject the boxes, unless the seller can prove that the exclusion clause is reasonable.","The buyer can claim damages and/or terminate the contract and reject the boxes, because the exclusion clause does not cover the breach.","The buyer can claim damages and/or terminate the contract and reject the boxes, because the exclusion clause is void."],ans:"D",expl:"(D) The exclusion clause refers to statutory 'warranties', but the terms implied by the Sale of Goods Act 1979 are conditions, not warranties. The clause therefore does not cover what has happened. (If the seller tried to argue that the clause was ambiguous and should be understood as covering the implied statutory conditions, the buyer could reply that ambiguous clauses should be construed contra proferentem, that is, against the party relying on them.) (A) is incorrect because the exclusion clause is entirely ineffective, including in relation to the buyer's right to claim damages. (B) is incorrect because the exclusion clause is ineffective, for the reasons given above. (C) is incorrect because the clause does not cover what has happened. There is no need to consider the reasonableness test (unless there is some doubt as to how the clause should be construed). (E) is not correct because the clause does not cover what has happened. If there was any doubt on this point, the Unfair Contract Terms Act 1977 would make the exclusion subject to the reasonableness test. It would not make it void […]",note:Bi},{n:30,id:"CTR033",scenario:"A yacht broker and a buyer enter into a contract for the sale of a 100-ft. yacht for £750,000. After the contract has been formed, the yacht broker discovers that the manufacturer of the yacht is unable to supply him with the model the buyer requires. Following the yacht broker's breach of contract, the buyer looks elsewhere and manages to obtain the yacht he requires for £725,000.",q:"What legal remedy would the buyer be entitled to as a result of the yacht broker's breach of contract?",opts:["Specific performance.","Punitive damages.","Nominal damages.","Restitution.","Expectation damages."],ans:"C",expl:"(C) Damages are awarded to the innocent party to compensate them for their loss, by putting them back into the position they would have been in had the contract been properly performed. In this scenario, the buyer has obtained the model of yacht that was the subject matter of the contract with the yacht broker, for £25,000 less than they were originally going to pay. Therefore, there is no financial loss suffered, so (C) is the correct answer, as the most the buyer could expect in this situation is nominal damages, that is, a small sum of money to reflect the fact that the buyer has suffered a legal wrong even though there is no actual financial loss. (A) is incorrect because specific performance, as an equitable remedy, would be awarded only where damages were not an adequate remedy, which is not the case in the scenario, particularly as the buyer was able to source an equivalent yacht. (B) is incorrect because generally punitive damages are not awarded in contract cases. (D) is incorrect because restitution is concerned with unjust enrichment, that is, it is about restoring gains, rather than compensating for loss, on the basis that a wrongdoer should not profit from their wrongdoing. This is not relevant to this scenario. (E) is incorrect because the expectation measure of damages is about putting the innocent party back into the position they would have been in had the contract been performed. Therefore in this scenario, as there is no financial loss, damages for loss of expectation would not be relevant."},{n:31,id:"LGS091",scenario:`A solicitor works for a conveyancing firm that is a member of the Solicitors Regulation Authority ('SRA'). The solicitor is acting for a client in the sale and purchase of a family home. The solicitor discovers a problem with the title of one of the properties and advises the client to take out defective title insurance to cover any risk. Neither the solicitor nor her firm is authorised by the Financial Conduct Authority to carry on a "regulated activity" as defined in the Financial Services and Markets Act 2000 ('FSMA') and related secondary legislation.`,q:"Which of the following statements is most accurate regarding the advice to take out defective title insurance under the FSMA?",opts:["The solicitor is not carrying out a regulated activity because there is no specified investment.","The solicitor's firm needs to appoint an insurance distribution officer before carrying on the regulated activity.","The solicitor is not carrying out a regulated activity because the necessary exclusion applies.","The solicitor's firm needs to notify the Financial Conduct Authority that it is carrying on activities in relation to insurance policies.","The solicitor cannot rely on the Designated Professional Bodies exemption because an insurance policy is involved."],ans:"B",expl:"(B) If a firm is carrying out activities in relation to insurance policies, there are additional requirements which it needs to meet. These include appointing an insurance distribution officer as well as notifying the SRA that the firm is carrying out activities in relation to insurance policies and being put on a register of providers. (A) is incorrect because there is a specified investment here, the insurance policy. (C) is incorrect because the necessary exclusion is not available when the specified investment is, as here, an insurance policy. (D) is incorrect because the requirement is for the firm to notify the SRA, not the Financial Conduct Authority, that it is carrying on activities in relation to insurance policies. (E) is incorrect because the Designated Professional Bodies exemption is available when insurance policies are involved. It is the necessary exclusion that is not available for insurance policies."},{n:32,id:"CTR041",scenario:"A restaurant owner decides to add an extension to his premises. He hires a local builder to add a conservatory to the back of the restaurant. They agree on a price of £25,000 and sign a contract on which is printed 'for terms see reverse'. On the reverse is a term stating: 'the builder accepts no responsibility for personal injury to the customer due to the negligence of the builder during the agreed building works'. During the course of the build, a piece of timber that has not been properly secured falls off the conservatory, injuring the restaurant owner.",q:"Does the restaurant owner have any recourse to the builder under the contract?",opts:["No. Personal injury claims are part of tort law and are not relevant to contracts.","No. The builder has excluded their liability for injury under the terms of the contract.","No. The exclusion clause needs to be properly incorporated into the contract and the restaurant owner must have reasonable notice of it. As it was on the reverse, this has not happened.","Yes. Under the Unfair Contract Terms Act 1977 any clause that seeks to exclude liability for death or personal injury due to negligence will be void.","Yes. Under the Consumer Rights Act 2015 any clause that seeks to exclude liability for death or personal injury due to negligence will be void."],ans:"D",expl:"(D) Under the Unfair Contract Terms Act 1977 ('UCTA') (which deals with business to business transactions), any clause which purports to exclude liability for death or personal injury as a result of negligence will be void. As the timber that fell and caused the injury was not properly secured, it seems likely that the builder has been negligent. (D) is therefore correct. (A) is incorrect because liability for personal injury can arise in both contract and tort. The difference in tort is that there is no requirement for the parties to have had a contractual relationship for a liability for negligence to arise. (B) is incorrect, as under the UCTA it is not possible to exclude liability for death or personal injury due to negligence. (C) is incorrect because the term has been properly incorporated. A term can be incorporated by signature, notice, or a course of previous dealings between the parties. There is case law that suggests that sometimes a term on the reverse of a contract will not have been brought sufficiently to the notice of the other party, but in this scenario the inclusion of the words 'for terms see reverse' should be sufficient. Also in this scenario the restaurant owner has signed the contract. (E) is incorrect because the Consumer Rights Act 2015 deals solely with contracts between businesses and consumers. Both the restaurant owner and the builder are acting in the course of business, so UCTA is the relevant legislation in this case."},{n:33,id:"ETH079",scenario:`A firm's client care letter stated: "Legal fees payable £700". The client received a bill for £700 plus VAT.`,q:"Which of the following statements best describes whether the firm was entitled to charge the VAT?",opts:["VAT is a tax and, as such, the firm is entitled to charge it.","HM Revenue & Customs requires the firm to account for the VAT received, so the firm is entitled to charge it.","The firm is not entitled to charge the VAT because clients generally are not responsible for VAT.","The firm is not entitled to charge the VAT because it was not referred to in the client care letter.","The firm is entitled to send an amended client care letter and charge the VAT."],ans:"D",expl:"(D) If the legal fees quoted do not include the VAT, the fees are assumed to include the VAT. (A) is incorrect because the firm should explain the legal fees and any payments for which the client will be responsible, including VAT. (B) is incorrect. The firm will have to account to HM Revenue & Customs for the VAT it should have charged on the legal fees, but this will represent a loss to the firm because they did not recover the sum correctly from the client. (C) is incorrect because clients are generally responsible for VAT if properly scoped at the outset. (E) is incorrect. The firm might do this if it discovers early in the retainer that it has omitted the reference to the VAT, but the client would have to agree to pay the fees plus the VAT and is entitled to rely on the first client care letter received."},{n:34,id:"ETH096",scenario:"A solicitor is dealing with a complaint from a client about one of the solicitor's colleagues. The client has requested that the solicitor reduce the bill of costs by 50% because he feels that the colleague was responsible for many delays in the matter and was rude to him. The solicitor has investigated the matter and can see that the colleague was somewhat brusque with the client and that there were some delays on the matter. In order to resolve the issue quickly, the solicitor decides to reduce the bill by 50% to comply with the client's request. The solicitor drafts a letter to the client to confirm this. The draft letter further explains to the client that the offer to reduce the bill is dependent on the client confirming that he will not make a complaint to the Legal Ombudsman or the Solicitors Regulation Authority.",q:"Which of the following statements best describes whether the draft letter is acceptable?",opts:["Whilst it is acceptable to make the offer on the basis that the client will not escalate their complaint to the Legal Ombudsman, the solicitor must not attempt to prevent the client from reporting a matter to the Solicitors Regulation Authority.","Whilst it is acceptable to make the offer on the basis that the client will not escalate their complaint to the Solicitors Regulation Authority, the solicitor must not attempt to prevent the client from reporting a matter to the Legal Ombudsman.","The solicitor must not include the clause that prevents the client from making a complaint to the Legal Ombudsman or reporting a matter to the Solicitors Regulation Authority.","It is acceptable to include the clause that prevents the client from making a complaint to the Legal Ombudsman or reporting a matter to the Solicitors Regulation Authority.","It is acceptable to include the clause that prevents the client from making a complaint to the Legal Ombudsman or reporting a matter to the Solicitors Regulation Authority, provided the solicitor advises the client to take independent legal advice."],ans:"C",expl:"(C) A solicitor must not attempt to prevent anyone from providing information to the SRA or any other body exercising regulatory, supervisory, investigatory, or prosecutory functions in the public interest. Therefore, the solicitor should not attempt to prevent the client from making a complaint to the Legal Ombudsman or the Solicitors Regulation Authority. (A), (B), and (D) are incorrect for this reason. (E) is incorrect because advising the client to take independent legal advice does not resolve the initial breach of the SRA Code of Conduct in stipulating that the offer is dependent on confirmation that the client will not make a complaint.",note:"The question screen for this question appears twice in the source (once scrolled to show option (E)); it is included once."},{n:35,id:"ETH035",scenario:"A firm informs the client at the outset of the matter of the name of the solicitor who would be supervising the matter. However, the bulk of the work is carried out by an unqualified paralegal. At the end of the matter the client complains because an error was made in the conduct of the work on the file. The solicitor indicates to the client that it is not his concern because the work was done by the paralegal.",q:"Which of the following statements best describes the position?",opts:["The solicitor's response is incorrect because he is responsible for the paralegal's work.","The solicitor's response is correct because he did not work on the client's file and is not responsible for the error.","The solicitor should inform the client of their right to complain, if this has not already been done in the client care letter.","The solicitor should refer the client to the Legal Services Board.","The solicitor does not have any liability to the client if he has maintained his own competence and professional knowledge."],ans:"A",expl:"(A) The solicitor is accountable for the work carried out by persons under the solicitor's supervision. Thus, (B) and (E) are incorrect. (C) is incorrect because it is a peripheral issue and the client should have already received the complaints information. (D) is incorrect as the client would need to pursue the firm's internal complaints procedure before going to the Legal Services Board."},{n:36,id:"CTR121",scenario:"A homeowner enters into a contract with a roofing company to have their house re-roofed. The roofing company warns the homeowner to wear a hard hat when walking around the house whilst work is being carried out. An employee of the roofing company working at roof level is carrying a stack of tiles in an unsafe manner. A tile slips and hits the homeowner on the head, injuring them seriously. The homeowner was not wearing a hard hat at the time, but their injuries would have been less severe if they had been doing so.",q:"Can the homeowner successfully bring a claim in contract against the roofing company?",opts:["No, because the homeowner's injuries were not caused by the roofing company's breach of contract.","Yes, because the roofing company cannot rely on the homeowner's contributory negligence as the roofing company was in breach of a strict contractual duty.","No, because the homeowner has failed to mitigate their loss.","No, because the roofing company was not in breach of any contractual duty.","Yes, despite the roofing company's possible partial defence based on the homeowner's contributory negligence."],ans:"E",expl:"(E) The roofing company was under an implied contractual obligation to exercise reasonable care. This is a consumer case, so the duty arises under the Consumer Rights Act 2015. This is a case where the company's liability in contract is the same as their liability in tort for failing to take reasonable care to prevent injury to the homeowner. In this situation, contributory negligence can be relied on as a partial defence to a claim in contract. The effect is that the homeowner's damages may be reduced. (A) is not correct, because the injuries were caused at least in part by the roofing company's breach of contract. (B) is not correct, because the roofing company's contractual duty is a duty to take reasonable care, not a strict duty. (If it had been a strict duty then the roofing company would not have been able to rely on contributory negligence.) (C) is not correct because the duty to mitigate arises when a contract has been breached. In this case, the failure to wear a hard hat happened at the time of the breach. (D) is incorrect because the roofing company was in breach of their implied duty under the Consumer Rights Act 2015."}],iC=[{n:1,id:"CTR085",scenario:"A customer and an online retailer enter into a contract for the sale of a washing machine. The customer telephones the retailer, who offers the customer interest-free credit over the phone. The customer decides to purchase the washing machine on these terms.",q:"Which of the statements below most accurately reflects the position in law?",opts:["The contract between the retailer and the customer can be concluded verbally as there is no requirement for a contract to be made in writing.","As this is a consumer contract, it is must be made in writing.","As this is a consumer credit agreement, it must be made in writing.","As the contract is a gratuitous promise, it must be made by deed.","As the contract is with an online retailer, it will automatically be concluded electronically."],ans:"C",expl:"(C) Simple contracts can be made in any form: verbal, written, or through the conduct of the parties. However, certain contracts are required to be made in writing, and a consumer credit agreement is one such contract. (A) is incorrect because the contract between the retailer and the customer is concluded on interest-free credit terms, and as such represents a consumer credit agreement and therefore must be made in writing. (B) is incorrect because consumer contracts are not as such required to be in writing, for example, a contract for the purchase of goods in a shop can be concluded verbally or by conduct. The exception to this is consumer credit agreements, as mentioned above. (D) is incorrect because this is not a gratuitous promise. A gratuitous promise is a promise unsupported by consideration. It is true that gratuitous promises are binding only if made by deed. (E) is incorrect because, whilst contracts with online retailers are normally made electronically, these retailers also operate on the phone and such a contract could also be concluded verbally (provided no consumer credit is involved)."},{n:2,id:"CTR140",scenario:"A company manufacturing tin cans orders replacement machinery from a supplier. The output of the new machinery is stated to be 20% higher than that of the old machinery. The contract provides that the machinery is to be ready for operation on 30 September, and that the supplier will pay £1,500 per day for every day that installation is late. Installation is completed 30 days late. The delay in installation means that the company is not able to speed up its production as it had hoped, and it loses £20,000 in profits as a result.",q:"What amount of damages will the company most likely be able to claim successfully from the supplier?",opts:["£20,000 lost profits, unless the company can show that £1,500 per day is a genuine pre-estimate of its loss.","Nothing, because lost profits are not recoverable in contract, and the agreement to pay £1,500 per day is void as a penalty.","£65,000, £1,500 per day for 30 days, plus £20,000 lost profits.","£45,000, £1,500 per day for 30 days because this amount was clearly stated in the contract.","Nothing, because loss of profits was not in the reasonable contemplation of the parties, and the agreement to pay £1,500 per day is void as a penalty."],ans:"A",expl:"(A) The company will most likely be able to claim £20,000 for lost profits. The lost profits appear to flow naturally from the supplier's breach and so they are not too remote. The company will not be able to claim the £1,500 per day unless it can show that is a genuine pre-estimate of its loss. The £1,500 looks like it could be a penalty, as it seems to be out of proportion to the company's likely losses. (B) is not correct because lost profits are recoverable in contract, either as losses flowing naturally from the breach or, in the case of special losses, if they were in the parties' contemplation. The £1,500 per day may be a penalty, but this depends whether the company can show that it is a genuine pre-estimate of its losses. (C) is not correct because the claim for £1,500 per day, if it is not void as a penalty, would be instead of the claim for £20,000, not in addition to it. (D) is not the best answer because it is far from clear that the £1,500 per day is a genuine pre-estimate of the company's loss. The company will not be able to claim the £1,500 per day even though the amount was clearly stated in the contract unless it can show that is a genuine pre-estimate of its loss. (E) is not correct because the loss of profits does not need to be in the parties' reasonable contemplation if it flows naturally from the breach (as here). The agreement to pay £1,500 may be void as a penalty, but this depends whether it is a genuine pre-estimate of the company's losses."},{n:3,id:"TRT091",scenario:"A householder owned a very large private garden. Although the garden was surrounded by a fence, the householder knew that trespassers entered it from time to time. The householder also was aware of a very deep well shaft at the bottom of the garden but did not take any steps to fence it off. Recently, a teenager climbed over the fence and entered the garden without permission. He fell down the well shaft, which he had failed to see, and suffered a broken leg and damage to his expensive mobile telephone.",q:"In a claim by the teenager against the householder, which of the following statements is correct?",opts:["The householder does not owe the teenager any duty of care because the teenager had no right to be on the land.","The householder does owe a duty of care to the teenager because an occupier owes one duty in common to all persons entering the premises.","The householder owes the teenager a duty to take reasonable care to see that the teenager will be reasonably safe in using the premises.","The householder owes the teenager a duty of care in respect of the broken leg but will not owe any duty in respect of the damage to the mobile telephone.","The householder owes the teenager a duty of care in respect of the broken leg as well as in respect of the damage to the mobile telephone."],ans:"D",expl:"(D) The householder owes the teenager a duty of care in respect of the broken leg. The householder had control over the garden and so is the occupier, the teenager entered without permission and so is a trespasser, and the damage is caused by the state of the premises, so liability is governed by the Occupiers' Liability Act 1984. A duty of care is owed only if the following conditions are satisfied: the occupier is aware of the danger (or ought reasonably to be aware), the occupier is aware that the trespasser may come into the vicinity of the danger (or ought reasonably to be aware), and the danger is one against which it would be reasonable to expect the occupier to offer protection. On the facts, these conditions are satisfied, so the occupier owes a duty. The duty is to take reasonable care to see that the trespasser does not suffer injury. So, it would cover the broken leg. However, the duty owed by an occupier to a trespasser does not cover damage to the trespasser's property. So, it would not cover the damage to the mobile telephone. (A) is not correct. Although the teenager is a trespasser, a duty is owed to him as discussed above. (B) is not correct. An occupier does not owe the same duty to all persons entering the premises. The duties are different for trespassers and lawful visitors. (C) is not correct. The occupier owes only a duty to protect the teenager from injury, not a duty to enable him to use the premises. (E) is not correct. As discussed above, the occupier's liability to a trespasser does not extend to damage to property."},{n:4,id:"TRT043",scenario:"A cyclist is riding carefully along a road when he is struck by a car driven carelessly by driver A. He is thrown from his bike and is then hit by a lorry driven carelessly by driver B. He suffers a broken leg. The cyclist issues proceedings against driver A only. The court finds that the cyclist suffered one indivisible injury, to which the negligence of both drivers, A and B, made a material contribution. The court finds that driver A was 40% to blame for the injury to the cyclist and driver B was 60% to blame.",q:"In relation to the amount of damages recoverable by the cyclist, which of the following statements is correct?",opts:["The cyclist is entitled to recover 100% of his damages from driver A.","The cyclist is entitled to recover 100% of his damages from driver A, unless driver A seeks a contribution from driver B to reflect his share of responsibility.","The cyclist is only entitled to recover 40% of his damages from driver A.","The cyclist will need to pursue a claim against both driver A and driver B if he is to be entitled to recover his damages in full.","The court's apportionment of responsibility between driver A and driver B will determine the damages the cyclist is entitled to recover."],ans:"A",expl:"(A) The cyclist is entitled to recover 100% of his damages from driver A. The cyclist has suffered one indivisible injury caused by both driver A and driver B. Where the injury is not divisible, the claimant is entitled to recover his damages in full from either of the defendants. So, he may recover 100% of his damages from driver A. Therefore, (C) is not correct. (B) is not correct. By statute, driver A may seek a contribution from driver B because they are both liable to the cyclist in respect of the same damage. However, this does not affect the liability of driver A to the cyclist. (D) is not correct. The cyclist is entitled to recover his damages in full from driver A, as discussed above. (E) is not correct. While the court may apportion responsibility between driver A and driver B, this only takes effect as between driver A and driver B. It does not determine the damages the cyclist is entitled to recover."},{n:5,id:"CNL053",scenario:"A Northern Irish politician believes that Northern Ireland should become its own independent country. Therefore, the politician wants a referendum to be held allowing the people of Northern Ireland to vote on whether Northern Ireland should become its own independent country.",q:"Under the Good Friday Agreement, can this referendum be held?",opts:["Yes, because the people of Northern Ireland can vote as to whether Northern Ireland should either remain part of the UK or become its own independent country.","No, because the people of Northern Ireland can vote only as to whether Northern Ireland should remain part of the UK or join the Republic of Ireland.","Yes, because the people of Northern Ireland can vote as to whether Northern Ireland should either become its own independent country or join the Republic of Ireland.","No, because the people of Northern Ireland can vote only as to whether Northern Ireland should form a new country with Scotland or remain part of the UK.","No, because the people of Northern Ireland can vote only as to whether Northern Ireland should form a new country with Scotland or join the Republic of Ireland."],ans:"B",expl:"(B) The proposed referendum cannot be held. Under the Good Friday Agreement, an international treaty between the UK and the Republic of Ireland, the choice that is legally required to be presented to the people of Northern Ireland is either to remain part of the UK or to join the Republic of Ireland. Therefore, (A), (C), (D), and (E) are incorrect."},{n:6,id:"TRT019",scenario:"A river breaks its banks and floods a farmer's field. A neighbour offers to help pump away the water. The neighbour's water pump is old and slow and takes a very long time to pump away the water. During that time, the crop in the field is ruined and the farmer is unable to sell it.",q:"In a negligence action by the farmer against the neighbour to recover the value of the crop, which of the following is true?",opts:["The neighbour will be liable if a reasonable person would have taken steps to pump out the water more quickly.","The neighbour is not liable to the farmer because he voluntarily undertook to help rescue the crop.","The neighbour is not liable because the farmer is seeking to recover pure economic loss.","The neighbour will be liable if the farmer can show that, but for the delay caused by the slow pump, the crop would not have been damaged.","The neighbour is not liable because the damage to the crop was not reasonably foreseeable and so
