 is too remote."],ans:"B",expl:"(B) The neighbour is not liable to the farmer. In general, there is no duty to undertake a rescue. Therefore, where a person does undertake a rescue, their duty is only to take reasonable care not to make the situation worse than it would have been had they not intervened. On the facts, there is nothing to suggest that the neighbour's intervention made the situation worse (it did not, for example, prevent anyone else from undertaking a more effective rescue of the crop). (A) is not correct. It refers to the standard of reasonable care, but the neighbour was not under a duty to take care to save the crop (only a duty not to make the situation worse). (C) is not correct. The crop has suffered physical damage, so its value is not pure economic loss. (D) is not correct. It refers to the test for establishing causation of damage, but this is not relevant here because the neighbour was not under a duty to take care to save the crop. (E) is not correct. It refers to the test for remoteness of damage, but this is not relevant here because the neighbour was not under a duty to take care to save the crop."},{n:7,id:"CNL044",scenario:"Under the Railway Fares Act 2011, the government has laid before the House of Commons and the House of Lords a draft of the Railway Fares Regulations 2020, which set the prices of train tickets. The regulations are subject to the affirmative resolution procedure.",q:"What powers do Parliament have in respect of the regulations?",opts:["Both the House of Commons and House of Lords have 40 days during which they can vote to reject the regulations.","Both the House of Commons and the House of Lords can amend the regulations.","Only the House of Commons can amend the regulations.","Only the House of Lords can amend the regulations.","Both the House of Commons and House of Lords must vote in favour of the regulations for them to become law."],ans:"E",expl:"(E) Both the House of Commons and House of Lords must vote in favour of the regulations for them to become law. The regulations are a form of secondary legislation, in that they are made under powers granted by an Act of Parliament. The affirmative resolution procedure requires that both Houses vote in favour of the regulations for them to become law. (A) is incorrect because it describes the negative resolution procedure, which is the other procedure for enacting secondary legislation. (B), (C), and (D) are incorrect because they provide for amendment and neither House has the power to amend the regulations."},{n:8,id:"TRT022",scenario:"A cricket ground is full to capacity, so some spectators are standing outside the premises on the street watching the match on a big screen. One of the players hits the ball very hard and it flies out of the cricket ground and strikes one of the spectators standing outside, causing her an injury. Enquiries show that the ball was hit exceptionally hard and had gone over the top of the safety netting erected all around the pitch. This has never happened before in the whole history of the cricket club.",q:"If the spectator sues the cricket club, which owns and runs the cricket ground, which of the following is correct?",opts:["The spectator is unlikely to have a successful claim in the tort of negligence because she is unlikely to be able to prove that the club was in breach of duty.","The spectator is likely to have a successful claim in the tort of negligence because the fact that the ball struck the spectator is itself proof that the club had failed to exercise reasonable care.","The spectator is likely to have a successful claim under the Occupiers' Liability Act 1957 as she was lawfully watching the game.","The spectator would need to pursue her claim under the Occupiers' Liability Act 1984 because she was not a lawful visitor, having not paid for a ticket to watch the game.","The spectator is likely to have a successful claim in the tort of negligence because the club is under a duty to take all possible steps to ensure her safety."],ans:"A",expl:"(A) The spectator is unlikely to prevail. The club owes the spectator a duty of care, but she is unlikely to be able to prove that the club was in breach of duty. When assessing whether the club breached its duty by falling below a reasonable standard of care, the court will consider the magnitude of the risk caused by the club's activities. On the facts, it appears that the risk of a ball being hit out of the ground over the existing safety netting was very small, so it was not reasonable to expect the club to take any further precautions against it. (B) is not correct. To determine whether the club failed to exercise reasonable care, the court must assess the magnitude of risk created by the club's activities and the practicability of taking precautions. The fact that harm occurred does not prove that reasonable care was not taken. (C) is not correct. The Occupiers' Liability Act 1957 does not apply because it deals with liability of the club to a lawful visitor on premises of which the club is occupier. The spectator was not on the club premises. (D) is not correct. The Occupiers' Liability Act 1984 does not apply because it deals with liability of the club to a person other than a lawful visitor who is on premises of which the club is occupier. The spectator was not on the club premises. Also, in relation to (C) and (D), the Occupiers' Liability Acts deal with harm caused by the state of the premises. Here, the harm was caused by an activity, not by the state of the premises. (E) is not correct. The club does owe the spectator a duty of care in the tort of negligence, but the duty is to take reasonable care. It is not a duty to take all possible steps - which would impose a higher standard than one of reasonable care."},{n:9,id:"ELS059",scenario:"A legal assistant has just began working at Southwark Borough Council. One of the tasks assigned to the assistant is to attend court and let the office know whether any claimants have been granted permission for judicial review of decisions made by the Council.",q:"To which court should the legal assistant go to check on judicial review cases?",opts:["Civil Division","Court of Appeal","Administrative Court","Chancery Division","Supreme Court"],ans:"C",expl:"(C) Applications for judicial review are heard in the Administrative Court, which is within the Queen's Bench Division of the High Court. It should be noted that the Civil Division (A) is a division of the Court of Appeal (B), making (A) and (B) basically the same answer. Since both cannot be correct, both must be wrong. The Chancery Division (D) is a division of the High Court that hears cases involving land, contracts, trusts, or wills. The Supreme Court (E), as the name implies, is the highest court in the UK and hears appeals from the Court of Appeal."},{n:10,id:"TRT002",scenario:"A golfer and her instructor were playing golf when the golfer became very annoyed with the instructor. To show the other golfers in their group how annoyed she was, the golfer stood a few yards behind the instructor whilst the instructor was teeing off and swung a club at him. The instructor, who was focusing on his shot, was not within range of the club but unfortunately the club slipped out of the golfer's hands and struck the instructor in the head, injuring him.",q:"Which of the following statements is most correct in a battery action brought by the instructor against the golfer?",opts:["The instructor will not succeed, unless the golfer acted unreasonably in swinging the club at her instructor.","The instructor will succeed, because the golfer knew that these consequences would result.","The instructor will not succeed, because the golfer did not directly strike the instructor herself.","The instructor will succeed, because the golfer intended to cause the instructor reasonable apprehension of imminent harmful contact.","The instructor will not succeed, because the golfer did not intend any contact with the instructor."],ans:"E",expl:"(E) The instructor will not succeed. To establish a prima facie case for battery, the claimant must show an intentional direct application of unlawful force to the claimant's person by the defendant. The golfer did not intend to apply any force to the instructor. Here, the golfer was standing behind the instructor and was intending only to show the other golfers how annoyed she was. Therefore, she will not be guilty of battery. (A) is incorrect because it describes the standard in an action for negligence, which is not relevant to battery. However, note that the instructor may be able to recover against the golfer in a negligence action if the golfer acted unreasonably in swinging the club, but this does not establish intent for a battery action. (B) is incorrect as she did not intend or know that these consequences would result. (C) is incorrect as the direct contact needed for battery can be satisfied either by the defendant directly coming into contact with the claimant or by the defendant coming into contact by throwing a projectile (such as a golf club) at the claimant. (D) is clearly wrong, as there is no intention by the golfer to cause the instructor reasonable apprehension of contact."},{n:11,id:"TRT058",scenario:"A motorbike rider and his passenger went out together and each drank more alcohol than the legal limit for driving. The passenger knew that the rider had drunk too much and also that the rider was not insured to drive the bike. Nevertheless, the passenger encouraged him to drive the bike with the passenger on board. Then, as they drove, the passenger encouraged the rider to drive in a dangerous manner. As a result, an accident occurred in which the rider was killed and the passenger was seriously injured.",q:"In an action in negligence by the passenger against the estate of the deceased rider, which of the following best describes the likely outcome?",opts:["The rider's estate will be liable to the passenger because, by statute, the passenger's cause of action survives the rider's death.","The rider's estate will not be liable to the passenger because it will be able to rely on the defences of both voluntary assumption of risk and illegality.","The rider's estate will not be liable to the passenger because it will be able to rely on the defence of voluntary assumption of risk only.","The rider's estate will not be liable to the passenger because it will be able to rely on the defence of illegality only.","The rider's estate will be liable to the passenger because the passenger's intoxication prevents application of any defence against the claim."],ans:"D",expl:"(D) The passenger's claim against the rider's estate is likely to be defeated by the defence of illegality. The law of Tort does not permit a claimant to base a claim on his own illegal act. The defence of illegality is a complete defence, so the claimant cannot recover damages for harm suffered whilst he is taking part in the criminal activity. Answers (B) and (C) are not correct because they both assume that the defence of voluntary assumption of risk would be available. While the passenger's actions also indicate that he voluntarily assumed the risk of the rider's negligence, the defence of voluntary assumption of risk, by statute, does not apply to passengers in road traffic accidents. (A) is not correct. It is true that the passenger's claim against the rider survives the rider's death by statute. However, that claim is likely to be defeated by the defence of illegality, as explained above. (E) is not correct because the passenger's intoxication does not prevent the rider's estate from raising the defence of illegality."},{n:12,id:"TRT072",scenario:"A car parking company arranges to meet a car owner at the airport, where an employee will collect the keys and drive the car to a secure carpark for the duration of the car owner's trip. On leaving the airport, the employee does not drive directly to the secure carpark but drops into a nearby local supermarket to pick up his lunch. At the supermarket, the employee parks the car illegally in a place where parking is prohibited, and as he does so, he negligently damages the vehicle.",q:"Which of the following statements most accurately describes the vicarious liability of the car parking company for the tort committed by its employee?",opts:["The car parking company is not vicariously liable because the damage was caused by the employee and cannot be attributed to his employer.","The car parking company is not vicariously liable because the employee acted illegally in parking the car and an employer cannot be liable for the criminal acts of its employees.","The car parking company is not vicariously liable because the negligence occurred when the employee left the authorised route and travelled to the supermarket.","The car parking company is vicariously liable for the actions of its negligent employee because the negligence occurred during the course of his employment.","The car parking company is vicariously liable for the actions of its negligent employee regardless of whether the negligence occurred during the course of his employment."],ans:"D",expl:"(D) The car parking company is vicariously liable. For an employer to be vicariously liable, the employee's tort must be committed during the course of employment. The question here is whether the employee's deviation from the authorised route, to go to the supermarket, took him outside the course of his employment. If the extent of the deviation in time or distance indicates that the employee has started on a separate independent journey for a purpose of his own, the employee is unlikely to remain within the course of employment. On the other hand, a minor deviation, not amounting to a new and separate journey, is unlikely to take the employee outside the course of his employment. On the facts, this appears to be a minor deviation, which is unlikely to take the employee outside the course of his employment. Therefore, (C) is not correct. (A) is not correct because an employer is vicariously liable for the tort of an employee committed during the course of employment, as discussed above. (B) is not correct. An employer can be vicariously liable for the torts of employees which amount to a criminal act, provided there is a sufficiently close connection with the employee's employment, so that the tort was committed in the course of employment. (E) is not correct because an employer can be vicariously liable for an employee's tort only if the tort was committed in the course of the employee's employment, as discussed above. While the employer may be directly liable for the damage to the car based on breach of a contractual duty to the car owner, that is not vicarious liability."},{n:13,id:"ELS005",scenario:"Parliament has recently passed a new statute relating to war crimes.",q:"Which of the following is NOT a presumption that can be used in helping to determine the reach of the statute?",opts:["A presumption against allowing statutes to alter the common law.","A presumption that statutes cannot be retrospectively applied.","A presumption against removing the court's jurisdiction.","A presumption that ambiguity in a criminal case will fall in favour of the defendant.","A presumption that statutes can be retrospectively applied."],ans:"E",expl:"(E) The other presumptions exist. Presumptions can assist in clearing up statutory ambiguities and are rebuttable when the relevant legal rule may be unapplied if there is sufficient evidence. (A) through (D) are all included as presumptions and so would be incorrect."},{n:14,id:"TRT123",scenario:"During an action for breach of contract, the defendant testified in court that she withheld shipment of the goods because the claimant defrauded her. The claimant now wishes to sue the defendant for defamation because he can establish that this testimony was false.",q:"Will the claimant be successful in this action?",opts:["Yes, if he can show that the defendant acted out of malice towards him.","No, because the statement was protected by absolute privilege.","Yes, if he can show that the defendant did not believe the allegation to be true.","No, because the statement was only made orally in court and so was not published.","Yes, because the statement would be likely to lower the claimant in the eyes of right-thinking members of society and would be likely to cause serious harm to the claimant's reputation."],ans:"B",expl:"(B) The claimant will not be successful because the defence of absolute privilege applies. All statements made in judicial proceedings are absolutely privileged. Because the defendant was testifying in court regarding the claimant's conduct, the statement is absolutely privileged regardless of its truth or falsity. (A) is not correct. The defence of absolute privilege is not defeated by showing that the defendant acted with malice. Therefore, on these facts, no action in defamation could successfully be brought even if the claimant could show that the defendant acted out of malice. (C) is not correct. If the defendant made the defamatory statement without an honest belief in its truth, she would be acting with malice. However, this would not defeat the defence of absolute privilege. (D) is not correct. A statement is published when it is communicated to a third party, so an oral statement made in court would satisfy this. (E) is not correct. This choice outlines the requirements to be satisfied if a statement is to be defamatory. However, on the facts, the defamatory statement is protected by the defence of absolute privilege, as discussed above."},{n:15,id:"CTR005",scenario:"A man goes into a shop and sees a mop and bucket with a price label of £1. Thinking to himself that this is a really good price, the man takes the mop and bucket to the till to pay and gets his £1 out ready. At the till the cashier scans in the label on the mop and bucket and the price comes up at £11. The man is adamant that since the label stated £1, that is all he should have to pay as it is the shop's mistake.",q:"What is the legal position as regards the incorrect price label under contract law?",opts:["The price label is an offer that the man has accepted by taking the mop and bucket to the till with his £1.","The price label is an offer which was revoked when the scan showed a price of £11.","The price label is not an offer; it is an invitation to treat, inviting the man to make an offer which is then open to the shop to accept (or not).","The price label is an offer, but because it is a mistake, there is no requirement for the shop to sell the mop and bucket to the man for £1.","The price label is an offer, but there is no contract as the £1 consideration is not adequate."],ans:"C",expl:"(C) The common law identifies goods on shop shelves as invitations to treat, in just the same way as goods displayed in shop windows. Because it is an invitation to treat, (C) is the correct answer. (A) is incorrect, as it is the customer who makes the offer by taking the goods to the till in a shop, which it is then open to the shop to accept. Similarly, (B) is not correct because, if the mop and bucket on the shelf is an invitation to treat rather than an offer, there never was an offer which can be revoked. This is not a question where mistake is relevant, as the facts suggest that the man was not aware that a mistake had been made - he just thought he was getting a bargain, so (D) is incorrect. (E) is incorrect as there is no requirement for consideration as a valid offer has not yet been made. Even if an offer had been made, the law only requires consideration to have some monetary value (sufficiency); this is enough even if the value is not equal to what the other contracting party is getting in return (so it need not be adequate)."},{n:16,id:"CNL080",scenario:"The Secretary of State has announced that they intend to create a compensation scheme for homeowners who lost their homes during recent flooding in the south east of England. The Secretary of State also announced that they would consult with those affected when developing the scheme. However, two weeks later, and before the consultation process had been completed, the Secretary of State launched the compensation scheme, detailing who would qualify and the levels of compensation payable. A homeowner who was affected by the flooding but who would not qualify under the scheme announced by the Secretary of State wishes to challenge the scheme. The homeowner files an application for judicial review.",q:"Which of the following bases for the homeowner's judicial review application is most likely to succeed?",opts:["The Secretary of State has not given effect to a legitimate expectation of consultation.","The Secretary of State has not complied with the general statutory duty to consult.","The Secretary of State has not complied with the general common law duty to consult.","The Secretary of State has not complied with the rules on natural justice.","The Secretary of State has not given effect to a substantive legitimate expectation."],ans:"A",expl:"(A) The homeowner is most likely to prevail on the basis that the Secretary of State failed to give effect to a legitimate expectation of consultation. A public body can give rise to a legitimate expectation that it will exercise its powers in a certain manner, either by an explicit promise or by prior conduct. Here, the Secretary of State explicitly promised to consult with those affected by the flooding, thereby giving rise to a legitimate expectation which the Secretary of State failed to fulfill. (B) and (C) are incorrect because there is no general duty to consult imposed either by statute or by the common law. (D) is incorrect because, on these facts, there is no evidence of a breach of the rules of natural justice (that is, the rule against bias and the right to be heard). (E) is incorrect because the Secretary of State's conduct gave rise to an expectation of consultation, which is a procedural rather than a substantive legitimate expectation."},{n:17,id:"TRT065",scenario:"An employer has two employees, A and B, who work together in a warehouse. On several occasions over the past few months, A has played dangerous practical jokes on B, such as tripping him up in the warehouse. B reported the problem to the employer, and A was reprimanded. However, A continued the behaviour, and despite B's further complaints, the employer took no further action. Last week, A caused B to suffer a serious injury by tripping him up as he was crossing the warehouse.",q:"In a claim by B against the employer to recover damages for his injury, which of the following statements best describes the likely outcome?",opts:["The employer is not liable to B because B is deemed to accept the risk of A's behaviour by continuing to work with him.","The employer is liable to B because an employer owes a duty to employees to take reasonable care to provide competent fellow staff, and this duty was breached.","The employer is liable to B because the fact that the injury happened inside the workplace means that the employer is vicariously liable for A's behaviour.","The employer is not liable to B because A acted solely for his own purposes, not for the purposes of the employer's business.","The employer is not liable to B, because the tort of battery was committed by A, not by the employer."],ans:"B",expl:"(B) The employer is liable to B. An employer owes a duty to employees to take reasonable care to provide competent fellow staff. On the facts, the employer became aware of A's dangerous behaviour (as shown by the reprimand) but thereafter took no further action to control it. So, on the facts, the employer fell below a reasonable standard of care and the duty owed to B was breached. Such breach caused B's damage. On the facts, there are no defences. So, the employer is liable to B. (A) is not correct. Voluntary assumption of risk can provide a defence where the claimant had full knowledge of a risk and voluntarily assumed such risk. However, on the facts, this defence does not apply. B did know of the risk from A. However, he did not voluntarily assume the risk, because he made complaints (and had no effective choice but to continue working with A). (C) is not correct. An employer can be vicariously liable for a tort committed by an employee, but the tort must have been committed during the course of the employee's employment. There must be a sufficiently close connection between the employment and the tort. The mere fact that the injury happened inside the workplace does not establish this. (D) is not correct. The fact that A acted solely for his own purposes, not for the purposes of the employer's business, could support an argument that A was not acting in the course of employment so that the employer should not be vicariously liable. However, the employer is likely to be personally liable to B for breach of the employer's own duty of care, as discussed above. (E) is not correct. It is true that A may be liable for having committed the tort of battery by tripping B up. However, the employer is also liable to B under these facts."},{n:18,id:"CTR075",scenario:"Two business owners enter into a contract, the terms of which are vague and uncertain.",q:"In which of the following circumstances would the courts not get involved with such a contract?",opts:["Where the uncertain term is severable from the rest of the contract.","Where the court is unable to conclude that the parties intended to be bound by the contract.","Where the parties have commenced performance of the contract and obligations have been created under it.","Where the dispute between the parties is covered by an arbitration clause in the contract.","Where the parties are familiar with the particular trade that is the subject of the contract, and terms which are normal in the trade could be implied to make the contract work."],ans:"B",expl:"(B) Where the courts are unable to conclude that the parties intended to be bound by the contract without their intervention, they are unlikely to get involved in trying to make it work. This is because the 'meeting of minds' between the parties necessary for a valid contract would be absent. Therefore (B) is the correct answer. (A) is incorrect because, where the courts are unable to show sufficient certainty to enforce a term, an alternative would be to sever the uncertain term from the contract and allow the parties to enforce the remainder. However, the more essential the term, the more difficult it will be to sever it from the contract. (C) is incorrect because if partial performance of the contract has taken place, and one or both of the parties have acquired rights under it, the court is more likely to get involved to try and give effect to the parties' intentions. (D) is incorrect because the presence of a dispute resolution mechanism, such as an arbitration clause, may be enough for the courts to find that the contract is sufficiently certain, as the parties have a contractual means of resolving a dispute as to the terms. (E) is incorrect because in a commercial situation, where the parties are familiar with the particular trade with which the contract is concerned, the courts are likely to imply terms which are normal in the trade into the contract to make it work."},{n:19,id:"CTR138",scenario:"A scrapyard owner emailed a scrap metal dealer, offering to sell the dealer 50 tonnes of scrap iron for £100 per tonne. In the email, the scrapyard owner requested a response by email. The same day, before checking emails, the dealer visited the scrapyard and offered to buy 50 tonnes of scrap iron for £100 per tonne.",q:"Do these facts give rise to a contract between the scrapyard owner and the scrap metal dealer?",opts:["Yes, because the two offers match.","No, because the dealer was not aware of the scrapyard owner's offer.","Yes, because the means of acceptance was no less advantageous than the method requested.","No, because there was no intention to be bound.","No, because the scrapyard owner specified acceptance by email."],ans:"B",expl:"(B) To accept an offer, the offeree must be aware of the offer. Here, the scrap metal dealer was not aware of the scrapyard owner's offer, so they could not accept it. (A) is not correct. Two matching offers cannot constitute an agreement unless one was made with knowledge of the other. (C) is not correct. Where an offer specifies a method of acceptance, acceptance by another method no less disadvantageous to the offeror may be sufficient to create an agreement, but here the offer by the scrap metal merchant was not an acceptance of the offer for the reason as explained above. (D) is incorrect. This is not the reason why there is no contract. There is a presumption in commercial dealings that the parties intend to be bound, and in this case each party presumably intended their offers to be capable of giving rise to a binding contract, if accepted. But in this case there was no acceptance. (E) is incorrect. This is not the reason why there is no contract. There was no attempt to accept the original offer."},{n:20,id:"TRT009",scenario:"An adult cyclist was knocked from his bike and suffered a head injury, leaving him unconscious. He was taken to hospital, where a doctor determined that he needed to undergo emergency surgery which would necessitate a blood transfusion. The cyclist remained unconscious, so the doctor was unable to ask for his consent. The doctor carried out the surgery and the transfusion and saved the life of the cyclist. When the cyclist recovered, he was angry because he objected to receiving the blood transfusion. He says that he would have refused the surgery rather than accept the transfusion.",q:"If the cyclist brings a claim in tort against the doctor, which of the following is true?",opts:["The doctor is not liable for trespass to the person because he did not intend to cause any harm to the cyclist.","The doctor is liable for trespass to the person because the cyclist would not have consented to the medical treatment.","The doctor is not liable for trespass to the person because he can rely on the defence of necessity.","The doctor is not liable for trespass to the person because, even if conscious, the cyclist would not have been entitled to refuse the lifesaving treatment.","The doctor is not liable for trespass to the person because his actions did not amount to the intentional and direct application of force to the cyclist."],ans:"C",expl:"(C) The doctor is not liable. On these facts, the doctor can rely on the defence of necessity (as codified by statute). The defence applies on these facts because the doctor acted in an emergency, in the best interests of the cyclist, to protect his health. The cyclist did not have the capacity to give or withhold consent, and the situation was urgent, so the doctor could not wait until the cyclist regained consciousness to seek his consent. (A) is not correct. Trespass to the person is committed by the intentional and direct application of force. Intention to cause harm is not required. (B) is not correct. Trespass (specifically battery) requires the intentional direct application of unlawful force. In this case the force was not unlawful because it was administered in a situation of necessity, as discussed above. It does not matter that the cyclist would not have consented to the treatment had he been conscious. (D) is not correct. If the cyclist had been conscious and capable of giving or withholding consent, he would have had the absolute right to refuse the lifesaving treatment. (E) is not correct because it does not give the correct reason. The actions of the doctor were intentional and direct, and they did amount to the application of force. Force can include any unwanted contact. (There is an exception for the ordinary contacts of everyday life, but it does not apply on these facts.) The doctor is not liable because of the defence of necessity, as discussed above."},{n:21,id:"CNL072",scenario:`The Car Safety Association is a body set up by statute and required to test and rate the safety of "motor vehicles powered by petrol or diesel". Given the increased number of electric vehicles on the roads, the association began testing the safety of electrically powered cars as well. A manufacturer of these electric cars is unhappy with the safety rating from the association for their vehicles. In response, the manufacturer wants a court to judicially review the association's rating.`,q:"Which of the following grounds for the manufacturer's judicial review claim is most likely to be successful?",opts:["The association failed to comply with procedural requirements.","The association took into account irrelevant considerations.","The association's decision was improper.","The association's decision was unreasonable.","The association was acting outside the scope of their power."],ans:"E",expl:"(E) The manufacturer is most likely to succeed on its judicial review claim on the grounds that the association acted outside the scope of their power (that is, it acted ultra vires). Public bodies, like the association, have only the powers granted to them by statute. This means that the association is limited to testing and rating the safety of vehicles powered by petrol or diesel. When the association is testing cars powered by electricity, they are acting outside their powers, and thus the rating could be struck down on that basis. (A) is incorrect because no violation of procedure is apparent on the facts. (B) is incorrect. Although public authorities are required to take into account only relevant considerations, nothing indicates that the association considered anything irrelevant to the safety of the manufacturer's cars. (C) is incorrect because that choice does not state an actual ground for judicial review. (D) is incorrect. A public body's decisions cannot be outrageous or absurd, but nothing in the facts indicates that the safety rating awarded was absurd or outrageous."},{n:22,id:"ELS026",scenario:"A claimant was in a very serious car accident and was hospitalised for several months. The claimant had to undergo several complex surgeries as a result of the accident.",q:"In which of the following courts should the claimant initiate proceedings?",opts:["The County Court.","The Magistrates' Court.","The High Court, Queen's Bench Division.","The High Court, Chancery Division.","The Crown Court."],ans:"C",expl:"(C) The action should be initiated in the High Court, Queen's Bench Division, because the claim is likely to be considered complex due to the extensive surgeries and to exceed the County Court's £50,000 threshold. (A) is incorrect for this reason as well. (B) is incorrect; the Magistrates' Court is primarily a criminal court for minor offences. (D) is incorrect; the Chancery Division hears cases involving land, contracts, trusts, and wills. (E) is incorrect. The Crown Court deals with more severe criminal cases."},{n:23,id:"CTR083",scenario:"A misrepresentation is a false statement of fact or law that induces a party to enter into a contract.",q:"In which of the following situations would a misrepresentation generally not be recognised?",opts:["The party making the statement has made a partial nondisclosure.","The contract is one of utmost good faith.","The party making the statement has failed to correct a previous representation.","The party making the statement has failed to disclose material facts.","The party making the statement is in a fiduciary relationship with the party that they are making the statement to."],ans:"D",expl:"(D) As a general rule, silence will not amount to a misrepresentation. This is because the law requires a false statement (a positive act). There is no general duty to disclose facts. Therefore, (D) is the correct answer. (A) is incorrect because partial nondisclosure (or half-truths) is an exception to the general rule regarding silence, as even though the statement is technically true, it is misleading. (B) is incorrect because contracts uberrimae fidei (of utmost good faith) require the parties to make full disclosure, and are therefore another exception to the silence rule. (C) is incorrect because a party making a representation that was initially true has a duty to correct it if it turns out to be false before the contract is concluded. (E) is incorrect because as a general rule, parties in a fiduciary relationship with each other (that is, where there is a duty of trust and confidence) should make disclosure. Silence would not be acceptable."},{n:24,id:"CTR057",scenario:"A manufacturer of car parts enters into a contract with a supplier of machinery for the installation of an additional welding machine at a cost of £750,000, to complement its existing machine and allow it to build up future production. The contract between the parties includes the following clause: 'If the machine is not supplied within the contractually agreed time, the supplier will pay to the manufacturer a sum of £200,000 for each week that the manufacturer is without the machine'. There is a delay of three weeks in delivery of the welding machine, so the manufacturer brings a claim against the supplier for damages of £600,000.",q:"Will the manufacturer's claim succeed?",opts:["Yes. This was a term in the contract between the parties. The manufacturer has a valid claim.","Yes. This is a genuine pre-estimate of the loss that will be suffered by the manufacturer so the clause is valid and the claim is likely to succeed.","Yes. There is a clear breach of contract for which the manufacturer is entitled to bring a claim. As the amount is quantified in the contract, the courts are not required to determine the sum payable.","No. The sum set out in the clause appears to be extravagant and exorbitant in relation to the manufacturer's interest that it is designed to protect.","No. As this is not genuine compensation for the manufacturer's loss, it is an unliquidated damages clause and therefore not enforceable."],ans:"D",expl:"(D) A liquidated damages clause represents the parties' genuine attempts to pre-estimate the loss that may be suffered under the contract. Any clause that is extravagant, exorbitant, or unconscionable in relation to the legitimate interests of the party it is supposed to be protecting is likely to be viewed as a penalty clause by the courts and will not be enforceable. In the scenario, we are not told what loss the manufacturer is likely to suffer as a result of the delay in delivering the welding machine, but we are told that it is an additional machine, so the manufacturer will not be without one entirely. It is also suggested that the manufacturer will use the new machine to build up its production in the future, so it does not seem to have any specific business in mind which it risks losing if the machine is delivered late. The clause enables the manufacturer to claim nearly the entire contract price of the machine even after only a three-week delay, so it seems likely that the clause would be viewed as a penalty. (A) is incorrect because, irrespective of an agreed contract between the parties and a clear breach, a damages clause will be struck out if it is viewed by the courts as being penal in nature. (B) is incorrect because the clause does not appear to be a genuine pre-estimate of loss given the amount that would be payable in relation to the overall contract price. The test is whether the sum is extravagant or unconscionable in relation to the loss suffered by the innocent party to the breach. (C) is incorrect as it is irrelevant that the parties have agreed the damages payable if they are penal in nature, as discussed above. (E) is incorrect because unliquidated damages are what the courts will determine are payable in cases where there is no attempt by the parties to quantify the loss by way of a liquidated damages clause."},{n:25,id:"CTR020",scenario:"Two professional opera singers, a soprano and a tenor, each entered into a contract to perform in a sell out production of Madame Butterfly at the Royal Opera House. Their contractual obligations were for six weeks of rehearsals prior to the opening night, and two weeks of daily performances. The soprano missed the first two weeks of rehearsals, and the tenor missed several weeks of rehearsals and also the opening night. The opera promoters have terminated both their contracts and booked alternative singers.",q:"Are the promoters legally able to take this course of action?",opts:["Yes, both singers have breached a term of their contract enabling the promoters to bring the contract to an end and hire alternative singers.","Yes, in respect of the tenor, because failing to appear on the opening night is breach of a condition of the contract.","Yes, in respect of the soprano, because failing to attend several days of rehearsals is a breach of a condition of the contract.","No, neither singer has breached their contract sufficiently to warrant such a course of action by the promoters.","No, because the promoters did not give the singers notice of their intention to bring the contracts to an end."],ans:"B",expl:"(B) Breach of a condition constitutes a fundamental breach of contract, going to the root of it, and therefore entitling the innocent party to accept the repudiation and terminate the contract. (B) is therefore correct, as an opera singer missing the opening night of a show in which they have been contracted to perform would go to the root of the contract. (A) and (C) are incorrect as missing a few days of rehearsals is of less importance, and unlikely to go to the root of the contract, so this kind of breach is more likely to be viewed as a breach of warranty which only entitles the innocent party to damages, but does not give them the right to terminate the contract. (D) is incorrect because failing to appear on the opening night is a fundamental breach and likely to be seen as a breach of a condition of the contract. (E) is incorrect as there is no requirement that the innocent party to a breach of contract warn the other party that they intend to bring the contract to an end; all that is required is that they accept the repudiatory breach, and the actions of the promoters in booking an alternative singer would be sufficient for this."},{n:26,id:"CTR066",scenario:"A thief plans an armed robbery of a supermarket. He enters into a contract with a gun retailer for the purchase of a legal firearm, on terms that he will pay for it later. He uses it in the robbery, but then refuses to pay for it after the robbery goes wrong and he leaves with no money.",q:"Which of the following best explains whether the gun retailer can enforce his contract against the thief for payment for the firearm?",opts:["The gun retailer can enforce the contract because the parties have entered into a valid contract with all the necessary formalities: offer, acceptance, consideration, and legal intent.","The gun retailer cannot enforce the contract because there was no consideration because the thief did not pay for the firearm.","The gun retailer can enforce the contract because even though the gun is being used for an illegal purpose, that does not make the contract for the sale of it illegal in its creation.","The gun retailer cannot enforce the contract because the courts will not enforce an illegal contract.","The gun retailer cannot enforce the contract because the payment for the firearm was dependent upon the successful robbery. As the thief left with nothing, he would not be required to pay."],ans:"C",expl:"(C) This is the best answer. There is a general rule that the courts will not enforce an illegal contract. A contract can be either illegal as formed, or illegal in its performance. Even though the thief wishes to use the gun for an armed robbery, the firearm itself is legal. This contract was therefore not illegal in its formation, and the thief would not be able to use illegality as a reason not to pay the gun retailer. The only exception to this would be if the gun retailer knew that the thief was planning to use the gun for an armed robbery, but there is nothing in the scenario to suggest that this was the case. (A) is incorrect, as whilst all these formalities are required and appear to be present in this scenario, if it was illegal, this would make an otherwise valid contract void. (C) is therefore the better answer. (B) is incorrect because consideration can be executory, that is, it can consist of a promise to perform in the future (such as a promise of future payment). (D) is incorrect because in some cases contracts that become illegal by virtue of their performance will not be automatically void. (E) is incorrect because there is nothing in the scenario to suggest that payment was dependent upon the successful robbery. In fact, if this were the case, the gun retailer could then be said to have been aware of the intended purpose of the gun purchase, which could make the contract void for illegality in its creation."},{n:27,id:"TRT140",scenario:"A mother took her child to school to board a bus for a school trip. She left the child on the bus and went home. The bus then departed with the children on board and was involved in an accident caused by the negligence of the defendant. The mother received a telephone call at home notifying her that the child had been severely injured in the bus accident. The mother immediately collapsed from shock and is later diagnosed as suffering from a medically recognised psychiatric illness caused by shock.",q:"In a claim by the mother against the defendant, which of the following statements best describes the likely outcome of the claim?",opts:["The mother cannot recover damages for her psychiatric illness because she was not in the actual area of danger created by the defendant's negligence.","The mother can recover damages for her psychiatric illness because it has been diagnosed as a medically recognised condition.","The mother cannot recover damages for her psychiatric illness because she did not witness the accident in which her child was injured.","The mother can recover damages for her psychiatric illness because she has close ties of love and affection with her child, who was the immediate victim of the defendant's negligence.","The mother can recover damages for her psychiatric illness because it was preceded by her physical collapse."],ans:"C",expl:"(C) The mother cannot recover. The mother has suffered psychiatric harm without physical impact. She is a secondary victim of the defendant's negligence. For a duty of care to be owed to a secondary victim who suffers a medically recognised condition caused by sudden shock, the following must all be satisfied: (1) it must be reasonably foreseeable that a person of normal fortitude would suffer a psychiatric illness; (2) the claimant must have close ties of love and affection to the immediate victim; (3) the claimant must have been present at the accident or its immediate aftermath; and (4) the claimant must have witnessed the accident with her own senses. On the facts, the mother was told about the accident on the telephone, she did not witness it herself, so she does not satisfy all of the criteria for a duty of care to be owed to her. (B) is not correct. A medically recognised psychiatric illness is necessary but is not sufficient, as explained above. (D) is not correct. Close ties of love and affection are necessary but are not sufficient, as explained above. (A) is not correct. The fact that the mother was not in the area of danger means that she could not recover as a primary victim. However, she is not seeking to recover damages for psychiatric harm caused by any danger to her but rather caused by her relationship to another person injured by the defendant's negligence. She is a secondary victim but cannot recover because she did not satisfy all of the aspects for a duty of care to be owed to a secondary victim. (E) is not correct. The mother's physical collapse was caused by shock. The special rules for duty of care (described above) apply to shock-induced physical conditions, such as the collapse, in the same way as they apply to psychiatric conditions caused by shock."},{n:28,id:"TRT078",scenario:"A woman, aged 30 and unmarried, was killed in a road accident caused by the negligence of the defendant. The woman was survived by her two daughters aged 7 and 19, and her mother aged 60.",q:"In relation to damages for bereavement, which of the following statements is correct on these facts?",opts:["There can be no claim for bereavement damages.","Each of the daughters of the deceased may make a claim for bereavement damages.","Only the seven-year-old daughter may make a claim for bereavement damages.","Only the mother of the deceased may make a claim for bereavement damages.","A claim for bereavement damages may be made for the benefit of the deceased's daughters and mother jointly."],ans:"A",expl:"(A) There is no claim for bereavement damages. By law, a claim for bereavement damages can only be made for the spouse or civil partner of the deceased, and for parents of the deceased where the deceased was a minor and never married. So, on these facts, there is no one eligible to make a claim for bereavement damages. (B) is not correct because children cannot claim bereavement damages for the death of a parent (although they may be able to claim damages for loss of dependency). (C) is not correct for the same reason. (D) is not correct because, although the deceased was unmarried, she was not a minor (under 18), so the mother has no claim for bereavement damages. (E) is not correct. As stated above, none of the survivors here can claim bereavement damages."},{n:29,id:"CNL020",scenario:"The government wants to amend an Act of Parliament to allow it to introduce controls on what members of the public can upload onto the Internet. The House of Commons has rejected the proposed changes to the law. However, the government decides that it still wants to press ahead with the proposed changes, but this time under the royal prerogative.",q:"Which of the following best describes the constitutional position?",opts:["The government's decision would be legal because the government can decide which royal prerogative powers it has.","The government's decision would be illegal because the government would be using the royal prerogative to change the law.","The government's decision would be illegal because the government's proposed changes have not been approved by the Monarch.","The government's decision would be legal because if the powers are not already provided by the royal prerogative, new prerogative powers can be created.","The government's decision would be illegal because the proposed changes have not been approved by the House of Lords."],ans:"B",expl:"(B) The government's decision would be illegal as it would be using the royal prerogative to change the law. The royal prerogative is a collection of powers recognised by the common law as belonging to the Crown, which include the Monarch, government ministers, and government departments. Under the doctrine of parliamentary sovereignty, Acts of Parliament are supreme, which means the government cannot use the royal prerogative to change the law. If the government attempt to use the royal prerogative in a way which conflicts with statute, it would be illegal. This is the case here, because the government are attempting to increase their powers beyond that provided for by statute. (A) is incorrect because, as discussed, the government cannot use the royal prerogative to change the law. (A) is also incorrect because it wrongly suggests that the government can create new prerogative powers. (C) is incorrect because the Monarch has no power to override an Act of Parliament. (D) is incorrect because the government cannot create new prerogative powers. (E) is incorrect because the House of Lords itself has no power to override an Act of Parliament."},{n:30,id:"CTR023",scenario:"A man owes his friend £300. His friend agrees to accept £200 in full and final settlement of the debt; there is no other new consideration. The man relies on his friend's agreement to accept part payment to the point where it would be unjust for the friend to request the outstanding £100.",q:"Which legal principle may the courts invoke to prevent the friend going back on his promise to accept part payment of the debt?",opts:["Restitution.","Undue influence.","Promissory estoppel.","Insufficient consideration.","Revocation."],ans:"C",expl:"(C) The scenario summarises the requirements of the equitable doctrine of promissory estoppel, which prevents a party from going back on a promise to accept a lesser sum of money where the other party has altered their position as a result of the promise. (A) is incorrect as restitution is relevant only when other common law or equitable remedies would be insufficient, and is about restoring gains, rather than compensating for loss, on the basis that a wrongdoer should not profit from their wrongdoing. (B) is incorrect because undue influence is concerned with a party's ability to enter into a contract under their own free will, that is, whether or not the innocent party arrived at their own decision and therefore gave true consent. (D) is incorrect because the lack of consideration for the agreement to accept the lesser sum is the reason why that agreement would not be enforceable if the doctrine of promissory estoppel did not apply. (E) is also incorrect because revocation is concerned with taking back an offer before acceptance can be made, thus preventing a valid contract from being formed in the first place."},{n:31,id:"TRT044",scenario:"A patient attended his doctor for treatment. The doctor decided that the patient needed an injection of drugs. The doctor administered the injection but carelessly gave the patient twice the recommended amount of the drug. In a normal person, this would not have been harmful. However, the patient was unusually susceptible to the drug and suffered a very severe painful reaction to the excessive dose.",q:"In an action by the patient against the doctor, which of the following statements is correct?",opts:["The patient's claim in not likely to succeed because he consented to the injection.","The patient's claim is likely to succeed even though his excessive reaction to the drug was not foreseeable.","The patient's claim is not likely to succeed because his excessive reaction to the drug was not foreseeable.","The patient's claim is likely to succeed because the doctor is liable for all the direct consequences of his actions.","The patient's claim is likely to succeed provided that he can persuade the court that it would be fair, just, and reasonable to impose a duty of care on the doctor."],ans:"B",expl:"(B) The patient's claim is likely to succeed. The patient will make a claim against the doctor in the tort of negligence. The doctor owes the patient a duty of care and has breached that duty, causing damage. In negligence, the general rule is that a defendant is not liable for damage which is too remote a consequence of his actions, and damage is too remote if it is not reasonably foreseeable as a result of the defendant's negligence. However, the 'egg shell skull' rule provides an exception which allows damage which may be unforeseeable to be recovered. This rule describes the situation in which the claimant suffers from a pre-existing condition which causes the effect of the defendant's negligence to be more extensive or severe than might have been reasonably foreseeable. The rule is applicable on these facts, so the claim is likely to succeed even though the excessive reaction was not foreseeable. Therefore, (C) is not correct. (A) is not correct. The patient did consent to the injection, but he did not consent to the doctor's negligence in administering the injection. (D) is not correct. In a negligence claim the defendant is not liable for all the direct consequences of his actions. Damage which is a direct consequence of the defendant's actions, but which is too remote, is not recoverable. However, as discussed above, the damage in this case was not too remote. (E) is not correct. Doctor to patient is an established duty situation. So, there is no need for the court to be persuaded to impose a duty of care on the doctor."},{n:32,id:"CTR048",scenario:"A woman and her colleague enter into a written contract setting out the terms for the sale of the woman's touring caravan. The woman and her colleague had previously spoken on the phone regarding a potential sale, and the woman had suggested to the colleague that the caravan would be externally painted and internally valeted prior to any sale. On delivery, neither the painting nor the valeting has been carried out.",q:"What is the colleague's position under contract law?",opts:["The colleague has no remedy because, when a contract has been reduced into writing, no terms other than the written terms can apply.","It is possible for terms, other than written terms, to form part of a contract, so the colleague would have a remedy for breach of contract.","It is possible for terms, other than written terms, to form part of a contract, but only if the parties intended it. The colleague has no remedy.","The telephone call forms a collateral contract, so the colleague would have a remedy for breach of contract.","As the parties had intended to contract on partly written and partly oral terms, the colleague has a remedy for breach of contract."],ans:"C",expl:"(C) The Parol Evidence Rule means that, as a general rule, external evidence cannot add to or vary a contract that has been reduced to writing, that is, there is a strong presumption that the written contract forms the entire agreement between the parties and contains all the terms. It is possible for terms other than written terms to form part of a written contract, but only if the parties so intended. In this scenario, there is nothing to suggest that the parties intended the woman's telephone conversation to be an additional term of the contract, so (C) is correct. (A) is incorrect because the Parol Evidence Rule has lots of exceptions, and there are cases where terms extrinsic to the written contract will form part of it, such as terms implied by statute. (B) is incorrect because, even though it is possible for terms other than written terms to form part of a written contract, the parties must have so intended. (D) is incorrect because there is no evidence that a collateral contract existed between the parties. A collateral contract in this case would be an oral secondary contract (regarding the painting and valeting), the consideration for which would be the colleague entering into the written contract. In this case, there is no reason to suppose that the suggestion that the caravan would be painted and valeted would survive the subsequent conclusion of the written contract. (E) is incorrect for the same reason as (D): there is nothing in the scenario to suggest that the parties have intended to contract on partly written and partly oral terms."},{n:33,id:"TRT098",scenario:"A teenager purchased a motorbike from a retail shop. He rode it on an off-road track over very rough terrain. As he bounced over a rock he landed hard and the shock absorbers failed, causing him to crash and suffer serious injuries. The shop has since gone out of business, so he made a claim against the manufacturer. The teenager produced evidence showing that the shock absorbers were dangerously inadequate under off-road conditions. He also relied on advertisements showing pictures of the motorbike in an off-road setting. The manufacturer presented evidence that the teenager had received the owner's instruction manual which warned that the bike was not suitable for off-road use.",q:"In a claim by the teenager against the manufacturer under the Consumer Protection Act 1987, which of the following circumstances would NOT be relevant to the claim?",opts:["The fact that the retail shop where the teenager purchased the motorbike has gone out of business.","The expectations of consumers as to the safety of a motorbike.","The advertisements showing the motorbike in an off-road setting.","The warning in the owners' instruction manual.","The fact that the shock absorbers were dangerously unsafe for off-road conditions."],ans:"A",expl:"(A) The fact that the retail shop has gone out of business is not relevant to the claim. In a claim under the Consumer Protection Act 1987 ('CPA'), the manufacturer of the motorbike would be a potential defendant as producer of the motorbike. In contrast, the supplier of the product (the retail shop) would be liable under the CPA in very limited circumstances - and even if it were also liable, liability is joint and several, so the teenager can seek recovery of the full amount of his damages from the manufacturer in any case. Therefore, whether the retail shop has gone out of business is not relevant to the teenager's claim against the manufacturer. (B) is not correct. The expectations of consumers as to the safety of a motorbike are relevant. Liability under the CPA depends on showing that the product was defective, and a product is defective if its safety is not such as persons generally are entitled to expect. (C) is not correct. The advertisements showing the motorbike in an off-road setting are relevant to the issue of whether the product was defective. They are part of the manner in which the motorbike was marketed, and this is one of the factors in determining whether the safety of the product was such as persons generally are entitled to expect. (D) is not correct. The warning in the owners' instruction manual is relevant to the issue of whether the product was defective. Instructions and warnings issued with the product are factors in determining whether the safety of the product was such as persons generally are entitled to expect. (E) is not correct. The fact that the shock absorbers were dangerously unsafe for off-road conditions is relevant because it supports the argument that the product was defective."},{n:34,id:"TRT115",scenario:"An investor and a sports club owned adjacent plots of land. The sports club was granted planning permission and constructed four tennis courts on its property. The courts were equipped with very bright lights for nighttime use. The courts were in constant use and remained open and illuminated by the lights until late every night. The investor then decided to use his plot of land to build a large dwelling house for himself. Once the house was built it became clear that the lights from the tennis courts interfered with the investor's enjoyment of the house. He was obliged to install blackout curtains in all the bedrooms. There are no other houses in the vicinity so no one else is disturbed by the lights.",q:"If the investor can establish that the interference from the lights is substantial and unreasonable, which of the following statements best describes the likely outcome if the investor makes a claim in nuisance against the sports club?",opts:["The investor will succeed because he has established the grounds for a private nuisance action.","The sports club will succeed in defending the claim because it obtained planning permission to build the tennis courts.","The investor will succeed because any degree of interference with a permitted use of his property is actionable as a nuisance.","The sports club will succeed in defending the claim because the tennis courts were built before the investor decided to build his house.","The investor will succeed because the glare from the lights constitutes a public nuisance for which he is suffering particular damage over and above the damage suffered by the public."],ans:"A",expl:"(A) The investor will succeed in a private nuisance action. Nuisance is an unlawful interference with the claimant's use and enjoyment of land. An interference is unlawful when it is substantial and unreasonable. Given that the investor has met this standard, he is likely to succeed. (B) is not correct because a grant of planning permission does not authorise a nuisance. (C) is not correct because the interference must exceed what is reasonable before it is actionable as a nuisance. (D) is not correct because it is not a defence to a claim in nuisance that the nuisance was already in existence before the claimant came to the nuisance. (E) is not correct. A public nuisance affects a class of the public. On the facts, no one other than the claimant is disturbed by the lights.",note:'The question ID is shown in the source as "TRT 115".'},{n:35,id:null,scenario:"A manufacturing company had a stainless-steel factory which obtained its electricity by a direct cable from the power station. A firm of contractors were doing work on the ground with an excavator and negligently damaged that cable (the manufacturing company did not own the cable). As a consequence, the stainless-steel factory was deprived of electricity for 15 hours. This caused: (1) physical damage to the factory's furnaces, (2) physical damage to the metal already in the furnaces, (3) loss of profit on the damaged metal, and (4) loss of profit on the metal that was not melted during the time the electricity was off. The manufacturing company claimed all these heads of damage in an action against the firm of contractors.",q:"Which of the following statements best describes all of the heads of damage the manufacturing company will recover?",opts:["Physical damage to the furnaces and to the metal already in the furnaces, and loss of profit on the damaged metal.","Physical damage to the furnaces and to the metal already in the furnaces.","Physical damage to the furnaces and to the metal already in the furnaces, and loss of profit on the damaged metal and on the metal that was not melted.","Physical damage to the furnaces only.","Loss of profit on the damaged metal and on the metal that was not melted."],ans:"A",expl:"(A) The company will recover all heads of damage except (4) loss of profit on the metal that was not melted. In the tort of negligence, certain kinds of damage are categorised as pure economic loss and are not recoverable. The loss of profit on the metal that was not melted during the time the electricity was off is pure economic loss because it resulted from damage caused to property not belonging to the claimant (the electricity cable). So, no duty of care is owed in respect of this damage and it is not recoverable. In contrast, the company can recover losses which flow from damage to property which it does own. So, it is owed a duty of care in respect of: (1) the physical damage to the furnace, (2) the physical damage to the metal in the furnace, and (3) the loss of profit which flowed from the damage to that metal. (B) is incorrect because it does not state all the damage which would be recoverable. The company could also recover (3) loss of profit on the damaged metal. (C) is incorrect because it does not state correctly the damages which could be recovered. The company cannot recover (4) loss of profit on the metal that was not melted because this is pure economic loss in respect of which no duty of care was owed, as explained above. (D) is incorrect because it does not state all the damage which would be recoverable. In addition to (1) physical damage to the furnaces only, the company can also recover (2) physical damage to the metal already in the furnaces, and (3) loss of profit on the damaged metal, as explained above. (E) is incorrect because it does not state correctly the damage which could be recovered. The company can recover (1) physical damage to the factory's furnaces, (2) physical damage to the metal already in the furnaces, and (3) loss of profit on the damaged metal, but not (4) loss of profit on the metal that was not melted during the time the electricity was off, because it resulted from damage caused to property not belonging to the claimant (the electricity cable).",note:'The question ID is cut off at the bottom of the answer screen in the source; only the first letters ("TRT") are partly visible. The lines of the facts are scrambled on the scan and have been put back in reading order.'},{n:36,id:"CTR150",scenario:"Jared visits the showrooms of Dreamtex Limited, where he signs an order for a sofa for his living room. On the front of the order form is a statement that the sofa will be delivered within six weeks. After eight weeks it has still not arrived. Jared contacts Dreamtex and complains about the delay. Dreamtex draw Jared's attention to a term in very small print on the back of the order form which says that all delivery dates are approximate only and that Dreamtex cannot guarantee them.",q:"What test would a court apply to determine whether the delivery term is unfair under the Consumer Rights Act 2015?",opts:["Whether it was included in bad faith and to the detriment of the consumer only.","Whether it is contrary to good faith and is to the detriment of the consumer only.","Whether it is included in bad faith and causes a significant imbalance in the parties' rights to the detriment of the consumer.","Whether it is contrary to good faith and causes a significant imbalance in the parties' rights to the detriment of the consumer.","Whether it was included in good faith only, regardless of the effect on the consumer."],ans:"D",expl:"(D) The standard for unfairness under the Consumer Rights Act 2015 looks to whether the term is contrary to good faith and causes a significant imbalance in the parties' rights to the detriment of the consumer. None of the other choices accurately reflects the standard."}],aC=[[1,eC],[2,nC],[3,rC],[4,oC],[5,iC]];let sC=0;const lC=aC.flatMap(([r,i])=>i.map(a=>({...a,src:`Set ${r} · Q${a.n}`,n:++sC}))),cC="Practice Questions Sets 1–5 (Combined) — Questions and Answers",qn=lC,uC=["A","B","C","D","E"],hC={CNL:"Constitutional & Administrative Law",DIS:"Dispute Resolution",ELS:"Legal System of England & Wales",TRT:"Tort",TAX:"Taxation",LGS:"Legal Services",ETH:"Ethics & Professional Conduct",BSL:"Business Law",CTR:"Contract",PRP:"Property Practice",LAN:"Land Law",TRU:"Trusts",WEA:"Wills & Administration of Estates",CRL:"Criminal Law",CRP:"Criminal Practice",ACC:"Solicitors' Accounts"},jc=r=>r?hC[r.slice(0,3)]??"Other":"Not stated";function dC({item:r,showAll:i,selected:a,revealed:l,onSelect:u,onToggleReveal:h}){const d=i||l,f=a&&r.ans&&a===r.ans;return C.jsxs("article",{id:`q${r.n}`,className:"rounded-lg border border-border bg-card shadow-card overflow-hidden",children:[C.jsxs("section",{className:"question p-5",children:[C.jsxs("header",{className:"flex flex-wrap items-center gap-2 mb-3",children:[C.jsxs("h2",{className:"text-lg font-semibold text-foreground",children:["Question ",r.n]}),C.jsxs("span",{className:"text-xs text-muted-foreground",children:["of ",qn.length]}),C.jsxs("div",{className:"ml-auto flex gap-2",children:[r.src&&C.jsx(Mn,{color:"secondary",children:r.src}),C.jsx(Mn,{color:"secondary",children:jc(r.id)}),r.id&&C.jsxs(Mn,{color:"information",children:["ID ",r.id]})]})]}),C.jsx("p",{className:"text-sm leading-relaxed text-foreground mb-3 whitespace-pre-line",children:r.scenario}),C.jsx("h3",{className:"text-sm font-semibold text-foreground mb-3",id:`q${r.n}-stem`,children:r.q}),C.jsxs("fieldset",{role:"radiogroup","aria-labelledby":`q${r.n}-stem`,className:"space-y-2",children:[C.jsx("legend",{className:"sr-only",children:"Select an answer"}),r.opts.map((m,g)=>{const y=uC[g],v=d&&r.ans===y,w=d&&a===y&&r.ans!==null&&r.ans!==y,S=a===y,P=v?"border-success bg-tag-green":w?"border-destructive bg-tag-red":S?"border-bord
