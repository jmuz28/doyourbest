 a claim of proprietary estoppel (therefore Option C is wrong). Option E is incorrect as his living arrangements are not relevant to his entitlement."}, {"ch": 7, "n": 2, "sc": ["A married couple bought a house with the help of a mortgage. The couple had four children in quick succession. The husband died before the mortgage was paid off and his widow had to work several jobs to keep the family fed and make the mortgage repayments. Each child left school as soon as they could to find work in order to contribute towards the household expenses and mortgage instalments. The widow repeatedly said that the house belonged to each and every one of the children. The widow died recently and her will left the house to a lodger she had recently taken in to earn extra money."], "st": "Which of the following best describes the entitlement to the house?", "o": ["The lodger and the children will share the house equally.", "The children can claim the house using proprietary estoppel.", "The lodger and the children share the house, the proportions to be calculated based on the principles of presumed resulting trust.", "The children are entitled to equal shares of the house by way of common intention constructive trust.", "The house belongs to the lodger."], "a": "B", "bx": "The correct answer was B. The assurance made by the mother was relied upon by the children who suffered detriment as a result (their contribution to the household expenses and the mortgage repayments). The remedy is based on the promise: equal shares in the house. Option D is wrong as the children cannot rely on common intention constructive trust as they cannot show common intention that they were to have a share when the house was bought (they were not yet born). The lodger has no entitlement to the house (therefore Options A, C and E are incorrect)."}, {"ch": 7, "n": 3, "sc": ["An unmarried couple bought a house which was conveyed to the man's sole name. The woman paid the deposit, which was 20% of the purchase price. The man paid the rest of the purchase price using his savings plus a mortgage. The mortgage instalments were paid by the man. The couple separated after 10 years. The woman is claiming an equal share of the house."], "st": "Which of the following provides the best advice regarding the woman's claim?", "o": ["The woman can claim a larger share in the house by way of common intention constructive trust.", "The woman can claim a share in the house by way of proprietary estoppel.", "The woman can only claim a 20% share in the house by way of presumed resulting trust.", "The woman cannot claim a share in the house as there was no written evidence of a trust.", "The woman cannot claim a share in the house as there was no oral agreement to share."], "a": "A", "bx": "The correct answer was A. The fact that the woman paid the deposit is evidence from which the court could infer both common intention as well as the act of detrimental reliance. The common intention is inferred so there is no need to provide evidence of an agreement (so Option E is incorrect). Option D is incorrect as the trust is implied so there is no need for written evidence. Option B is wrong as the elements of proprietary estoppel are not present. Although the woman did contribute 20% of the purchase price giving rise to a presumed resulting trust, this trust is displaced once the court finds that there is a common intention to share so Option C is wrong."}, {"ch": 7, "n": 4, "sc": ["An unmarried couple decided to move in together. The pair bought the man's flat at a 25% discount as he was a sitting tenant. The woman paid the full purchase price. The flat was conveyed into their joint names. Two years later, they sold the flat and used the proceeds to buy a small cottage which was conveyed to the woman as sole legal owner. The couple have since separated, and the man is claiming a half share of the cottage."], "st": "Which of the following best reflects the man's entitlement to the cottage?", "o": ["The man has no claim to the cottage as he paid no money towards the cottage.", "The man has no claim to the cottage as there was no written agreement to share the cottage.", "The man has no claim to the cottage as there was no common intention to share.", "The man has a claim to the cottage by relying on proprietary estoppel.", "The man has a claim to the cottage by way of a common intention constructive trust."], "a": "E", "bx": "The correct answer was E. The cottage was paid for from the proceeds of the sale of the flat, in which the man had a 25% beneficial interest (presumed resulting trust) by way of his discount. This means he contributed 25% of the purchase price of the cottage from which the court could infer both common intention and detrimental reliance and thus award him a share (up to 50%) of the property (so Options A-C are wrong). Option D is wrong because the requirements of proprietary estoppel are not present."}, {"ch": 7, "n": 5, "sc": ["A mother decided to buy a flat using her savings so that she could rent it out. This was to be her sole income after her retirement. The mother was short of 10% of the purchase price and her daughter made up the deficit. The flat was conveyed to the mother as the sole owner and duly rented out. The daughter helped her mother with some of the tenancy paperwork. The mother and daughter have now fallen out and the daughter is claiming a half share in the flat."], "st": "Which of the following best describes the daughter's entitlement to the flat?", "o": ["The daughter has a claim to the flat by way of common intention constructive trust.", "The daughter has a claim to the flat by way of proprietary estoppel.", "The daughter has a claim to the flat by way of resulting trust.", "The daughter has no claim to the flat as it is not a family home.", "The daughter has no claim to the flat as there was no agreement to share."], "a": "C", "bx": "The correct answer was C. The daughter's 10% contribution gives her a proportionate share of the beneficial interest by way of a presumed resulting trust in the absence of any contrary intention (so Options D and E are incorrect). The court cannot infer a common intention constructive trust as the flat was not intended as a family home but was purchased for investment purposes (so Option A is wrong). Option B is wrong as the elements of proprietary estoppel are not present."}, {"ch": 7, "n": 6, "sc": ["An unmarried couple buy a house in joint names with no express declaration of trust. They contributed unequally. They separate."], "st": "What is the starting point for their beneficial shares?", "o": ["Shares determined by who paid the mortgage.", "Shares proportionate to their contributions.", "Equity follows the law: they are presumed to be joint beneficial owners in equal shares.", "The higher contributor takes the whole.", "Equal shares only if they were married."], "a": "C", "x": ["Wrong. Mortgage payments are only one factor.", "Wrong. Contributions are relevant only to displace the presumption.", "Correct. Stack v Dowden: in joint names the starting point is equal beneficial ownership, which can be displaced.", "Wrong. There is no such rule.", "Wrong. Marriage is irrelevant."]}, {"ch": 7, "n": 7, "sc": ["A house is in a man's sole name. His partner made no financial contribution but they had an express discussion when buying it that it was 'ours'. She then spent substantial sums renovating it."], "st": "What is her best claim?", "o": ["A claim only if they married.", "A common intention constructive trust based on express agreement and detrimental reliance.", "A licence to occupy only.", "A presumed resulting trust.", "No claim, because she did not contribute to the purchase price."], "a": "B", "x": ["Wrong. Marriage is not required.", "Correct. Express discussions plus detrimental reliance can found a constructive trust.", "Wrong. A beneficial interest can arise.", "Wrong. She made no contribution to the purchase price.", "Wrong. An express common intention may suffice."]}, {"ch": 7, "n": 8, "sc": ["A couple hold a house in joint names. After separation, they lived apart for 14 years, during which the woman alone paid the mortgage and outgoings."], "st": "How may the court determine their shares?", "o": ["The shares must reflect only initial contributions.", "The man loses all interest.", "The court cannot alter shares in joint names.", "The shares must remain equal.", "The court may infer, or if necessary impute, a common intention that their shares changed over time."], "a": "E", "x": ["Wrong. The whole course of dealing is relevant.", "Wrong. Nothing suggests he loses everything.", "Wrong. The court can quantify unequal shares.", "Wrong. The equal presumption can be displaced.", "Correct. The courts accept that intentions to change over time and permits imputing fair shares where intention cannot be inferred."]}, {"ch": 7, "n": 9, "sc": ["A woman moves into her partner's house (in his sole name). She does housework and pays for some groceries. There were no discussions about ownership."], "st": "Is she likely to have a beneficial interest?", "o": ["No, because there is no express agreement and her conduct is unlikely to support an inferred common intention.", "Yes, she automatically takes half.", "Yes, through proprietary estoppel.", "Yes, because she has lived there a long time.", "Yes, a presumed resulting trust arises from the groceries."], "a": "A", "x": ["Correct. Without discussions or contributions referable to the acquisition, a common intention is hard to infer.", "Wrong. There is no automatic entitlement.", "Wrong. There is no assurance by the partner.", "Wrong. Length of occupation is not enough.", "Wrong. Groceries are not a contribution to the purchase price."]}, {"ch": 7, "n": 10, "sc": ["A couple buy a house in joint names. The TR1 contains an express declaration that they hold as tenants in common in shares of 70:30."], "st": "How will their beneficial shares be determined on separation?", "o": ["By imputing a fair share.", "By reference to their contributions.", "By the court's discretion.", "In accordance with the express declaration of trust, which is conclusive absent fraud or mistake.", "Equally, as the house is in joint names."], "a": "D", "x": ["Wrong. Imputation is unnecessary.", "Wrong. Contributions are relevant only without an express declaration.", "Wrong. The court gives effect to the declaration.", "Correct. An express declaration of beneficial interests is conclusive.", "Wrong. The express declaration displaces the equal presumption."]}, {"ch": 8, "n": 1, "sc": ["The trustee of a trust fund used some of the money to pay off his brother's personal debt. The brother knew where the money came from and promised the trustee that he would pay the money back to the trust once he finds employment. The trustee is now bankrupt and the beneficiaries of the trust are seeking to recover the funds from the brother."], "st": "Which of the following statements best describes the brother's liability?", "o": ["The brother is not liable as he did not personally misappropriate the money.", "The brother is not liable as he was not an appointed trustee.", "The brother is not liable as he is not a fiduciary.", "The brother is liable for knowing receipt.", "The brother is liable as a fiduciary."], "a": "D", "bx": "The correct answer was D. The trustee has breached the trust by misappropriating trust property. The brother is a constructive trustee as he has received the money knowing that it came from a breach of trust. Option A is incorrect as the brother need not personally misappropriate the trust property; receipt of the money knowing of its source is sufficient to attach liability. Options B and C are incorrect as the brother need not be a trustee or a fiduciary to be liable. Option E is wrong as the brother is not in a fiduciary position."}, {"ch": 8, "n": 2, "sc": ["A trustee used trust money for her own personal investments. Her friend, an investment banker, manages her investment portfolio and ensures that all profits are transferred to accounts out of reach of the beneficiaries of the trust. The friend is aware that the money was taken in breach of trust."], "st": "Which of the following statements best describes the friend's liability?", "o": ["The friend is liable as a fiduciary.", "The friend is liable for his dishonest assistance.", "The friend is not liable as he was not an appointed trustee.", "The friend is not liable as he never received any trust money.", "The friend is not liable as he was not the one who misappropriated the money."], "a": "B", "bx": "The correct answer was B. The friend dishonestly assisted the trustee in a breach of trust making him liable as an accessory (therefore Options C-E are wrong). The friend was not in a fiduciary position to the trust so Option A is wrong."}, {"ch": 8, "n": 3, "sc": ["A trust has a substantial shareholding in a private company. A man, the trust's solicitor, inspected the company accounts and found that the company was not being run efficiently. The man bought shares in the company and took control of it using both his and the trust's shareholding. The man worked hard and within a year managed to maximise the company's productivity. The shares are now worth more. The beneficiaries of the trust seek advice on whether the man should account for the profit he made on the shares."], "st": "Which of the following provides the best advice?", "o": ["The man must account for the profit as he is a fiduciary.", "The man must account for the profit as he has recipient liability.", "The man need not account for the profit as he used his own money to buy the shares.", "The man need not account for the profit as it was the result of his hard work and expertise.", "The man need not account for the profit as the trust also made a profit."], "a": "A", "bx": "The correct answer was A. As a solicitor to the trust, the man owes a fiduciary duty to the trust and must ensure that his duty does not conflict with his own personal interest. He would not have been in a position to profit but for his fiduciary relationship with the trust. It therefore follows that all profits made belong to the trust (Options C-E are therefore wrong). Option B is incorrect as the man is not a knowing recipient of misappropriated funds."}, {"ch": 8, "n": 4, "sc": ["The trustees of a trust hold a portfolio of trust investments which included a cottage. At their last meeting, the trustees unanimously decided to sell the cottage. One of the trustees bought the cottage, paying full market value for it. The trustee also ensured that the minutes of the meeting recorded her intention to buy the cottage. The beneficiaries are unhappy with the transaction and are insisting that transaction be set aside."], "st": "Which of the following statements provides the best advice regarding the cottage?", "o": ["The transaction stands as the trustee made no attempt to hide it from the beneficiaries.", "The transaction stands as the trustee paid the full market value.", "The transaction stands as the sale was approved by all the trustees.", "The transaction must be set aside due to conflict of interest.", "The transaction must be set aside as the cottage was not bought at an open auction."], "a": "D", "bx": "The correct answer was D. By purchasing the cottage, the trustee was acting as both the vendor and purchaser. According to the self-dealing rule, the transaction can be set aside at the insistence of the beneficiaries. Options A and B are wrong as the self-dealing rule operates even where the transaction is not hidden and where the trustee pays full market value. Option C is wrong because it is beneficiary consent required to avoid a breach of the self-dealing rule and not the trustees. Option E is wrong as it places too much emphasis on the lack of an open auction; the self-dealing rule would still apply at an open auction."}, {"ch": 8, "n": 5, "sc": ["A trustee of a trust is also a director of a company in which the trust has a substantial shareholding. The trustee is paid a generous director's fee by the company. The beneficiaries of the trust are unhappy that the trustee is profiting from the trust and are demanding an account of the fees paid to the trustee."], "st": "Which of the following statements best describes what the trustee should do?", "o": ["The trustee must account for the fees regardless of whether the directorship preceded the trusteeship.", "The trustee must account for the fees even if he can prove that his appointment as director was secured independently of the votes from the trust's shareholding.", "The trustee must account for his fees if his appointment as director depended on votes from the trust's shareholding.", "The trustee need not account for the fees as they are paid by the company, and not from trust funds.", "The trustee need not account for the fees as they are considered reimbursement for out-of-pocket expenses."], "a": "C", "bx": "The correct answer was C. If the trustee's directorship came as a direct result of his fiduciary position, he is not allowed to profit from it and must account for the profits. Option A is incorrect as the trustee is not liable to hold the profits on account if they were appointed a director prior to becoming a trustee. Option B is wrong as there must be a causal link between the use of the trust shareholding and the appointment as director. Option D is wrong as the focus is on whether the trustee gained their position as a director by virtue of the trust; it is irrelevant where the money comes from to pay the fees. Option E is wrong for similar reasoning to Option D."}, {"ch": 8, "n": 6, "sc": ["A trustee sells trust shares and gives the proceeds to an agent, who, knowing nothing suspicious and acting honestly, passes them on as instructed. The agent never benefits."], "st": "Is the agent liable?", "o": ["Yes, for knowing receipt.", "No, because he neither received beneficially with knowledge nor assisted dishonestly.", "Yes, for dishonest assistance.", "Yes, as a trustee de son tort.", "Yes, because all agents of trustees are fiduciaries."], "a": "B", "x": ["Wrong. He did not receive for his own benefit and lacked knowledge.", "Correct. Liability as a stranger requires unconscionable receipt or dishonest assistance.", "Wrong. He was honest.", "Wrong. He did not act as if he were a trustee.", "Wrong. An agent's honest conduct here gives no liability."]}, {"ch": 8, "n": 7, "sc": ["A trustee renews the trust's lease in his own name after the landlord refuses to renew it for the trust."], "st": "Must he hold the lease on trust?", "o": ["Yes, but only if he acted dishonestly.", "No, because the landlord refused the trust.", "Yes, under Keech v Sandford, even though the trust could not have obtained the renewal.", "No, because he paid for the renewal himself.", "No, if he told the beneficiaries."], "a": "C", "x": ["Wrong. Honesty is irrelevant.", "Wrong. The trust's inability is irrelevant.", "Correct. The strict rule in Keech v Sandford requires the trustee to hold the renewed lease for the trust.", "Wrong. Paying himself does not avoid the rule.", "Wrong. Notice alone does not amount to informed consent."]}, {"ch": 8, "n": 8, "sc": ["A trustee buys a beneficiary's equitable interest at a fair price after full disclosure. The beneficiary later seeks to set it aside."], "st": "Which rule applies?", "o": ["The transaction is void.", "The rule in Saunders v Vautier.", "The self-dealing rule: the transaction is voidable automatically.", "Keech v Sandford.", "The fair-dealing rule: the transaction stands if the trustee shows no advantage was taken and full disclosure was made."], "a": "E", "x": ["Wrong. It is not void.", "Wrong. That rule concerns termination of trusts.", "Wrong. Self-dealing concerns buying trust property itself.", "Wrong. Keech concerns lease renewals.", "Correct. Buying a beneficiary's interest is governed by the fair-dealing rule."]}, {"ch": 8, "n": 9, "sc": ["A bank employee helps a trustee move trust money abroad. He knows the money is being taken in breach of trust, but he personally thinks this is acceptable because the trustee is a valued customer."], "st": "Is he likely to be liable for dishonest assistance?", "o": ["No, because he believed it was acceptable.", "Yes, but only if he received a fee for his help.", "No, because only trustees can be liable for a breach of trust.", "No, because he never received the trust money for himself.", "Yes, because the test for dishonesty is objective: he did not act as an honest person would in the circumstances."], "a": "E", "x": ["Wrong. The test is objective, so his personal standards do not help him.", "Wrong. Payment is not a requirement of dishonest assistance.", "Wrong. A stranger who dishonestly assists a breach is personally liable.", "Wrong. Accessory liability does not require receipt of trust property.", "Correct. Barlow Clowes v Eurotrust confirms that dishonesty means not acting as an honest person would in the circumstances; his own view is irrelevant."]}, {"ch": 8, "n": 10, "sc": ["A man receives £50,000 from a trustee. He suspects that it may come from the trust but deliberately decides not to ask any questions, as he does not want to know the answer."], "st": "Is he likely to be liable for knowing receipt?", "o": ["Yes, because constructive knowledge, such as wilfully shutting his eyes to the obvious, is sufficient.", "No, because knowing receipt requires dishonest assistance.", "Yes, but only if he spends the money.", "No, because he had no actual knowledge of the breach.", "No, because a recipient is never liable unless he is a fiduciary."], "a": "A", "x": ["Correct. Actual or constructive knowledge suffices; wilfully shutting one's eyes to the obvious is constructive knowledge.", "Wrong. Recipient and accessory liability are separate.", "Wrong. Liability arises on receipt with the necessary knowledge.", "Wrong. Actual knowledge is not required.", "Wrong. A stranger can be liable as a constructive trustee."]}, {"ch": 9, "n": 1, "sc": ["A man died and his will left his estate to three trustees to hold on trust for his three children until they attain the age of 21. Two of the children have reached the age of 21 and have received their share of the trust fund. One of the children is still under the age of 21. The trust fund comprises a portfolio of shares. One of the trustees has just died."], "st": "Which of the following best describes whether it is necessary to appoint a replacement trustee?", "o": ["There is no requirement to appoint a replacement trustee as there are two surviving trustees.", "There is no requirement to appoint a replacement trustee because there is no land in the trust investments.", "A replacement trustee must be appointed because one of the trustees has died.", "A replacement trustee must be appointed because one of the beneficiaries is still under the age of 21.", "A replacement trustee must be appointed because the original appointment consisted of three trustees."], "a": "A", "bx": "The correct answer was A. There is no need to appoint a replacement trustee (therefore Options C-E are wrong). The same is true even if the trust consists of land (therefore Option B is wrong). Two trustees are sufficient to give good receipt for the sale of land and ensure overreaching."}, {"ch": 9, "n": 2, "sc": ["The testator's will appointed two trustees to hold property on trust for her five grandchildren until they attain the age of 20. The will also provided that the testator's son has the right to appoint replacement trustees. All the beneficiaries are still under the age of 20. The testator's son predeceased her. One of the trustees has just died."], "st": "Which of the following has the best right to appoint the replacement trustee?", "o": ["The son's personal representative.", "The surviving trustee.", "The personal representative of the trustee who died.", "The testator's personal representative.", "The court."], "a": "B", "bx": "The correct answer was B. The persons with the right to appoint (in order) are: • The person nominated in the instrument to make appointments. The son was nominated but he has died. • The surviving or continuing trustees. • If all the trustees are dead, then the personal representative of the last surviving trustee. From the facts, there is one surviving trustee who has the right to appoint the replacement trustee. All other options are therefore incorrect."}, {"ch": 9, "n": 3, "sc": ["The trustees of a large fund commissioned an investment advisor to draw up an investment plan but rejected the plan as they had strict views on investing in sustainable companies. The beneficiaries of the trust are all under 18. The trust instrument is silent on the issue of investment."], "st": "Which of the following provides the best advice regarding this issue?", "o": ["The trustees are in breach of their duty of care.", "The trustees are not in breach of their duty of care as they have the power to invest as if they were absolutely entitled to the trust property.", "The beneficiaries can consent to a more ethical investment plan.", "The trustees must prove that any investment they choose is just as financially sound as the plan they rejected.", "The trustees must accept the original investment plan."], "a": "D", "bx": "The correct answer was D. The trustees are not in breach if they can prove that their investment plan was just as profitable as the rejected investments (therefore Options A and E are wrong). Option B is incorrect because the power to invest is always subject to their duty of care. The trustees' primary duty in investing is to seek the best financial return. Option C is incorrect as minor beneficiaries cannot give valid consent."}, {"ch": 9, "n": 4, "sc": ["A woman died last month leaving an estate of £90,000 to be divided equally between her three children when they attain the age of 25. All of her children are under 25. Her eldest son, who is 22, has requested an advance of capital to set up his online fitness business. The woman's will makes no mention of the trustees' power of advancement."], "st": "What is the maximum amount the trustees can apply in accordance with the request?", "o": ["£0.", "£15,000.", "£30,000.", "£45,000.", "£60,000."], "a": "C", "bx": "The correct answer was C. The trustees have the power to advance to a beneficiary the full presumptive share of that beneficiary. As her eldest son is entitled to 1/3 of the trust funds (£30,000), the trustees can advance up to that full amount. If the trust had been created prior to 1 October 2014, the eldest son would have only been entitled to up to half of his presumptive share (ie £15,000). All other options are therefore incorrect."}, {"ch": 9, "n": 5, "sc": ["A man died last week leaving his estate on trust to his wife for life, remainder to his four children. All the children are under 18. The eldest child, who is aged 16, wants to attend catering college and would like the trustees to use some of the trust income to pay her college fees."], "st": "Which of the following best describes the trustees' right to pay towards the maintenance of the eldest child?", "o": ["The trustees are under a duty to maintain the beneficiary and must pay the college fees.", "The trustees can use no more than 1/4 of the income to pay the college fees.", "The wife must give consent before the trustees can use the trust income to pay the college fees.", "The trustees cannot use their power of maintenance unless expressly authorised by the trust instrument.", "The trustees have no right to use the trust income for the college fees."], "a": "E", "bx": "The correct answer was E. The trustees' power to maintain is subject to a prior life interest. The wife has a life interest in the trust property and is entitled to the trust income. This means the income cannot be used to maintain any person with an interest vested in remainder, including the children. All other options are therefore incorrect."}, {"ch": 9, "n": 6, "sc": ["A trust created in 2020 holds a fund of £60,000 for a beneficiary contingently on reaching 25. She is 20. The trust instrument is silent on advancement."], "st": "How much capital can the trustees advance to her?", "o": ["Up to £5,000 only.", "Only with the court's consent.", "Up to half of her presumptive share.", "Nothing until she reaches 25.", "Up to the whole of her presumptive share."], "a": "E", "x": ["Wrong. There is no such cap.", "Wrong. No court consent is needed.", "Wrong. The half limit applies to trusts created before 1 October 2014.", "Wrong. Section 32 allows advancement before the contingency.", "Correct. For trusts created after 1 October 2014, s 32 TA 1925 permits advancement of the whole presumptive share."]}, {"ch": 9, "n": 7, "sc": ["Trustees of a large fund, relying on their own instincts, invest heavily in a single company without obtaining any advice. The trust instrument is silent on investment."], "st": "Which statement best describes the trustees' position?", "o": ["They are likely to be in breach, as they must obtain and consider proper advice and have regard to the need for diversification.", "They are not in breach, as they may invest as if absolutely entitled to the trust assets.", "They are not in breach unless they acted dishonestly.", "They are in breach only because investing in shares is not permitted.", "They are not in breach if the beneficiaries are all adults."], "a": "A", "x": ["Correct. Under the Trustee Act 2000 the trustees must obtain and consider proper advice and have regard to the standard investment criteria, including diversification.", "Wrong. The general power of investment is subject to the duty to take advice and the standard investment criteria.", "Wrong. Negligent investment can be a breach without dishonesty.", "Wrong. The general power of investment allows investment in shares.", "Wrong. The beneficiaries' ages do not remove the trustees' duties."]}, {"ch": 9, "n": 8, "sc": ["A professional trustee invests trust money without taking advice, in an unsuitable high-risk scheme."], "st": "What standard of care applies?", "o": ["The trustee is liable only for dishonesty.", "No standard applies if the trust instrument is silent.", "The statutory duty of care, which is higher for a professional trustee who acts in the course of business.", "The standard of an ordinary prudent person only, regardless of expertise.", "The standard set by the beneficiaries."], "a": "C", "x": ["Wrong. Negligence suffices for liability.", "Wrong. The statutory duty applies by default.", "Correct. Section 1 TA 2000 takes account of special knowledge and of acting in the course of business.", "Wrong. The statutory standard reflects expertise.", "Wrong. The standard is set by statute."]}, {"ch": 9, "n": 9, "sc": ["A trust of land has a sole surviving trustee who wants to sell the land."], "st": "Can the sole trustee give a valid receipt for the capital money?", "o": ["Yes, if the beneficiaries consent.", "Yes, any trustee can give a receipt.", "No, because land can never be sold by trustees.", "No, because two trustees (or a trust corporation) are required to give a valid receipt for capital money from land.", "Yes, if the trust deed says so."], "a": "D", "x": ["Wrong. Beneficiary consent does not change the statutory rule.", "Wrong. A sole individual trustee cannot.", "Wrong. Trustees of land have power of sale.", "Correct. Two trustees or a trust corporation are required to give a valid receipt and to overreach.", "Wrong. The statutory requirement cannot be excluded."]}, {"ch": 9, "n": 10, "sc": ["A beneficiary aged 16 has a contingent interest (contingent on reaching 21) under a trust which carries the intermediate income. There is no prior interest."], "st": "May the trustees use income for her education?", "o": ["No, unless the trust instrument expressly allows it.", "Yes, under s 31 TA 1925, which gives a power to apply income for maintenance, education or benefit.", "Yes, but only capital may be used.", "No, because her interest is contingent.", "No, because she is under 18."], "a": "B", "x": ["Wrong. Section 31 applies unless excluded.", "Correct. Section 31 allows income to be used for maintenance, education or benefit of minor beneficiaries.", "Wrong. Section 31 concerns income.", "Wrong. Contingent interests carrying intermediate income qualify.", "Wrong. The power applies to minors."]}, {"ch": 10, "n": 1, "sc": ["Trustees are holding property on trust for a man for life, remainder to his son absolutely. Twelve years ago, the trustees invested in shares in breach of their investment powers. The father decided not to sue the trustees for the breach. He died five years ago. His son, who is now aged 24, wishes to take action for breach of trust."], "st": "Which of the following statements best explains the son's entitlement to sue?", "o": ["The son is barred from suing as the father had consented to the breach.", "The son is barred from suing as the breach occurred more than six years ago.", "The son is barred from suing as there was no fraud involved.", "The son can sue as he was only a child when the breach occurred.", "The son can sue as his interest accrued less than six years ago."], "a": "E", "bx": "The correct answer was E. The limitation period for breach of trust is six years. Time started running for the son when his interest came into possession on his father's death five years ago (by this time, the son had reached the age of majority) and not when the breach occurred (so Option B is wrong). This means he has one year remaining to take action. Option A is incorrect as if the father did consent to the breach, that would not impact on the son's position. Option C is wrong as fraud is irrelevant to this case; the situation focuses on when the interest of the beneficiary accrues. Option D is wrong because it is irrelevant whether the beneficiary was an adult or a child when the breach occurred."}, {"ch": 10, "n": 2, "sc": ["Trustees are holding property on trust for a woman for life, remainder to her son absolutely. Fifteen years ago, the trustees invested in land in breach of their investment powers. The woman decided not to sue the trustees. She died ten years ago. Her son, who is now aged 22, wishes to take action for breach of trust."], "st": "Which of the following statements best explains the son's entitlement to sue?", "o": ["The son is barred from suing as the breach occurred 15 years ago.", "The son is barred from suing as the mother died ten years ago.", "The son is barred from suing as there was no fraud involved.", "The son can sue as his interest accrued less than six years ago.", "The son can sue as the mother did not instigate the breach."], "a": "D", "bx": "The correct answer was D. The son was a minor when his mother died and was therefore under a disability. His disability ended, and time started running, when he turned 18. This means he has two years remaining to take action. Option A is incorrect as time begins to run from the point the child attains the age of majority, and not when the breach occurred. Option B is wrong as the child was still a minor when his mother died and since attaining the age of majority, the six-year period has not yet expired. Option C is wrong as fraud is irrelevant to this case; the situation focuses on when the beneficiary attains majority. Option E is wrong as it is irrelevant whether the mother instigated the breach or not."}, {"ch": 10, "n": 3, "sc": ["Three trustees hold a portfolio of investments on trust for the testator's infant children. The settlement expressly prohibits the trustees from investing in land. The first and second trustee decided to use part of the trust assets to buy a piece of land which they were convinced would increase in value within a year of the purchase. They did not discuss their plan with the third trustee. The third trustee signed all the documents relating to the purchase whenever asked to do so by the other trustees. The land has significantly decreased in value."], "st": "Which of the following best explains the liability of the third trustee?", "o": ["The third trustee is liable as she is required to actively participate in the management of the trust.", "The third trustee is vicariously liable for breaches committed by the other trustees.", "The third trustee is not liable because she was not informed of the other trustees' decision to invest in land.", "The third trustee is not liable because she never agreed to invest in land.", "The third trustee is not liable because she is only liable for her own breaches."], "a": "A", "bx": "The correct answer was A. The third trustee may not have actively committed the breach but her neglect of her duties led to the breach. She breached the trust by failing to take adequate action to stop the other trustees from committing the breach (therefore Options C and D are wrong). A trustee is only liable for their own acts or omissions (so Option B is incorrect). Option E is wrong because she has breached the trust through her omission."}, {"ch": 10, "n": 4, "sc": ["Two trustees are holding assets on trust for the children of the settlor until they turn 30. The trust assets comprise a portfolio of stocks and shares. The trust instrument prohibits investments in land. The trustees used 1/4 of the trust fund to buy a large plot of land five years ago. The land has now tripled in value. The beneficiaries are all adults under the age of 30 and they wish to take action against the trustees for breach of trust."], "st": "Which of the following provides the best advice regarding the trustees' liability?", "o": ["The trustees are not liable as the trust suffered no loss.", "The trustees are not liable as they can raise the defence of acquiescence since the beneficiaries are all adults.", "The trustees are not liable as they acted honestly and reasonably, and the court must excuse the breach.", "The trustees are liable as the beneficiaries did not consent to the breach.", "The trustees are liable as they invested outside their powers."], "a": "A", "bx": "The correct answer was A. Although the trustees had technically breached the trust by investing outside their powers, their actions had not caused loss to the trust fund. Breach of trust is only actionable if the beneficiaries can prove that they suffered loss as a result of the breach (Option D and E are therefore incorrect). Option B is wrong because there is no evidence of acquiescence. Option C is wrong as it supposes that the court must excuse the breach; such excusal is discretionary."}, {"ch": 10, "n": 5, "sc": ["A settlor set up a trust for the benefit of his children just before he died. The trust instrument contained a clause exempting the trustee from liability for loss or damage to the trust fund 'even if such loss or damage shall be caused by the trustee's own actual fraud'. The trustee is the testator's brother and he is a professional musician. He used trust money to pay off his gambling debts. He had planned to pay the money back to the trust as soon as he received his next pay cheque but he was out of work for more than a year and his actions were discovered before he could cover his tracks. On being sued for breach of trust, the trustee claimed the protection of the exemption clause."], "st": "Which of the following best explains the trustee's liability for breach of trust?", "o": ["The trustee is not liable for breach of trust as he intended to pay back the trust money.", "The trustee is not liable for breach of trust as his actions are absolved by the exemption clause.", "The trustee is not liable for breach of trust as he is a close family member.", "The trustee is liable for breach of trust because there is no limitation period to recover trust property.", "The trustee is liable for breach of trust because his actions cannot be absolved by the exemption clause."], "a": "E", "bx": "The correct answer was E. Despite the exemption clause's wording, it is clear from Armitage v Nurse that a trustee cannot rely on an exemption clause excluding liability for fraud or wilful wrongdoing as the core of a trust is the trustee's obligation to act honestly in the best interest of the beneficiaries (Option B is therefore incorrect). Option A is irrelevant; an intention to pay back money will not rid the trustee of liability. Option C is wrong as being a family member is irrelevant. Option D is incorrect because the issue of the limitation period is irrelevant if the trustee could rely on the exemption clause."}, {"ch": 10, "n": 6, "sc": ["Two trustees commit a breach of trust causing a loss of £60,000. One trustee is a solicitor who exclusively controlled the trust; the other relied on him."], "st": "Which statement best describes their liability to the beneficiaries?", "o": ["Neither is liable if they acted honestly.", "They are jointly and severally liable, though the court may order contribution or indemnity between them.", "Each is liable only for half.", "Only the solicitor is liable.", "Only the trustee who signed the documents is liable."], "a": "B", "x": ["Wrong. Honesty alone is not a defence.", "Correct. Trustees are jointly and severally liable; the Civil Liability (Contribution) Act 1978 and indemnity rules (eg against a solicitor-trustee) apply between them.", "Wrong. Liability to the beneficiaries is not divided.", "Wrong. The other trustee remains liable to the beneficiaries.", "Wrong. Signing is not the test."]}, {"ch": 10, "n": 7, "sc": ["A trustee acted honestly and reasonably in making an investment that later caused loss, but technically fell outside his powers."], "st": "Which provision may help him?", "o": ["Section 32 TA 1925.", "Section 61 TA 1925, allowing the court to relieve a trustee who acted honestly and reasonably and ought fairly to be excused.", "Section 53 LPA 1925.", "Section 31 TA 1925.", "Saunders v Vautier."], "a": "B", "x": ["Wrong. Section 32 deals with advancement.", "Correct. Section 61 gives the court discretion to grant relief.", "Wrong. Section 53 deals with formalities.", "Wrong. Section 31 deals with maintenance.", "Wrong. That rule concerns termination."]}, {"ch": 10, "n": 8, "sc": ["An adult beneficiary instigated a breach of trust in writing for his own benefit. The trust suffered a loss."], "st": "What remedy is available to the trustee?", "o": ["The trust is terminated.", "The beneficiary becomes a trustee.", "The court may impound the beneficiary's interest to indemnify the trustee.", "None; the trustee remains fully liable.", "The trustee is automatically excused."], "a": "C", "x": ["Wrong. The trust continues.", "Wrong. There is no such rule.", "Correct. Under s 62 TA 1925, the court may impound the interest of a beneficiary who instigated, requested or consented in writing.", "Wrong. Impounding is available.", "Wrong. Relief is discretionary."]}, {"ch": 10, "n": 9, "sc": ["A trustee fraudulently misappropriated trust property 15 years ago. The beneficiaries have only just discovered it."], "st": "Is their claim time-barred?", "o": ["Yes, unless the trustee consents.", "Yes, because 12 years have passed.", "No, because there is no limitation period for fraudulent breach of trust or recovery of trust property from the trustee.", "Yes, because six years have passed.", "No, but only if they sue within one year of discovery."], "a": "C", "x": ["Wrong. Consent is irrelevant.", "Wrong. There is no 12-year bar here.", "Correct. Section 21(1) Limitation Act 1980 disapplies the time limit for fraud and for recovery of trust property.", "Wrong. The six-year period does not apply to fraud.", "Wrong. There is no one-year rule."]}, {"ch": 10, "n": 10, "sc": ["An adult beneficiary, fully informed, consented to an investment outside the trustees' powers. The investment caused a loss."], "st": "Can that beneficiary sue the trustees for the loss?", "o": ["Yes, if the loss exceeds £10,000.", "Yes, because the trustees exceeded their powers.", "Yes, because consent is never a defence.", "No, because a beneficiary who gave informed consent cannot later sue for that breach.", "No, but the other beneficiaries also cannot sue."], "a": "D", "x": ["Wrong. There is no monetary threshold.", "Wrong. The breach is answered by consent as to that beneficiary.", "Wrong. Consent can be a defence.", "Correct. Informed consent by an adult beneficiary of full capacity is a defence against that beneficiary.", "Wrong. Non-consenting beneficiaries can still sue."]}, {"ch": 11, "n": 1, "sc": ["A trustee for two trusts took £15,000 from the first trust and £5,000 from the second trust to buy a car. The trustee recently filed for bankruptcy. The car is currently valued at £10,000."], "st": "Which of the following best explains the outcome of a tracing action?", "o": ["The first trust can claim the car.", "Both trusts share the proceeds of sale of the car equally.", "The second trust can claim the car.", "The second trust can claim £2,500 from the proceeds of sale of the car.", "The trustee in bankruptcy can claim the car."], "a": "D", "bx": "The correct answer was D. The car was bought from the mixed funds of both trusts so the rule is that they share the loss rateably/proportionately (the first trust can claim £7,500 and the second trust can claim £2,500). Therefore, Options A-C are incorrect. Option E is wrong because the car belongs to the two trusts, and cannot be claimed by the trustee in bankruptcy."}, {"ch": 11, "n": 2, "sc": ["The beneficiaries of a trust fund recently discovered that their sole trustee withdrew £60,000 from the trust account and deposited it into his personal account, which had a balance of £20,000. He then withdrew £20,000 from his account to pay for a piece of artwork. Finally, he withdrew the rest of the money to pay for a luxury holiday. The artwork has doubled in value. The trustee The sister is entitled to raise the defence of change of position and keep the painting.", "The beneficiaries and the sister share the proceeds of the painting equally."], "a": "B", "bx": "The correct answer was B. The sister clearly had no knowledge of the breach of trust, which makes her an innocent volunteer. She is not personally liable to the trust (therefore Option A is wrong) but tracing is available against her as she was unjustly enriched (therefore Option C is incorrect). The defence of change of position is not applicable here as tracing will not lead to an inequitable outcome (therefore Option D is wrong). As the sister has no claim to the artwork, Option E is wrong."}, {"ch": 11, "n": 4, "sc": ["The beneficiaries of a trust discovered that their trustee withdrew £20,000 from the trust account and deposited it into his personal account in a different bank, which was overdrawn by £10,000. He later withdrew £10,000 from the account to pay for a hair transplant procedure."], "st": "Which of the following best explains the beneficiaries' right to trace?", "o": ["The beneficiaries are entitled to trace and claim £10,000 as the trustee only dissipated £10,000.", "The beneficiaries are entitled to trace and claim the full £20,000.", "The beneficiaries' right to trace is lost.", "The beneficiaries are entitled to trace against the hair transplant clinic.", "The beneficiaries are entitled to trace against the bank."], "a": "C", "bx": "The correct answer was C. The principle of lowest intermediate balance meant that £10,000 had been dissipated as soon as the money was deposited into the overdrawn account. The remaining £10,000 was used to pay for the procedure and is no longer identifiable (therefore Options A and B are wrong). The hair transplant clinic is a bona fide purchaser and is not subject to a tracing action (therefore Option D is wrong). The bank is only liable if there is proof of recipient liability, which is unlikely on the facts (therefore Option E is wrong)."}, {"ch": 11, "n": 5, "sc": ["A trustee used trust money to pay for repairs to the roof of her father's flat. She told her father that the money came from the sale of her car which she no longer needed since she started working from home. The father obtains welfare benefits and has been trying for years to save enough to pay for the repairs. The trustee recently lost her job and has filed for bankruptcy."], "st": "Which of the following is the best advice regarding the remedies available to the beneficiaries?", "o": ["Tracing is available against the father as he has recipient liability.", "The father is personally liable to compensate the trust from his savings.", "The flat must be sold and the beneficiaries are entitled to a proportionate share of the proceeds.", "There can be no tracing against the father.", "The beneficiaries can trace and claim the money from the trustee."], "a": "D", "bx": "The correct answer was D. The father is an innocent volunteer and is prima facie subject to a tracing action. The father is not a knowing recipient nor is he personally liable to the trust (therefore Options A and B are wrong). However, it is clear that he can raise the defence of change of position as the tracing action would lead to an unfair outcome (therefore Option C is wrong). Option E is incorrect as the trustee's liability towards the trust is a personal one but tracing is unavailable as she no longer has the trust money in her possession."}, {"ch": 11, "n": 6, "sc": ["A trustee pays £5,000 of trust money into his own account containing £5,000 of his own money. He withdraws £5,000 and buys shares now worth £8,000, then spends the rest."], "st": "What can the beneficiaries claim?", "o": ["The shares, as the beneficiaries have a first charge over property bought with the mixed fund.", "Only a personal claim.", "Half of the shares.", "Nothing, as the trustee is presumed to spend his own money first.", "£5,000 from the account."], "a": "A", "x": ["Correct. The presumption that a trustee spends his own money first (Re Hallett) is subject to the beneficiaries' first charge over property bought with the mixed fund.", "Wrong. A proprietary claim is available.", "Wrong. They can claim the asset representing trust money.", "Wrong. The presumption is not applied so as to defeat the beneficiaries' claim to the shares.", "Wrong. The account has been spent."]}, {"ch": 11, "n": 7, "sc": ["A trustee mixes money from two innocent trusts in one current account and spends some of it. Applying the rule in Clayton's Case would produce an unfair result."], "st": "What approach is the court likely to take?", "o": ["Apply a pari passu (proportionate) approach, as in Barlow Clowes v Vaughan.", "Award the whole balance to the first trust.", "Always apply 'first in, first out'.", "Award the whole balance to the second trust.", "Refuse tracing altogether."], "a": "A", "x": ["Correct. Clayton's Case may be displaced where it would be impractical or unjust.", "Wrong. That would be unfair.", "Wrong. The rule is not mandatory.", "Wrong. That would be unfair.", "Wrong. Tracing is available."]}, {"ch": 11, "n": 8, "sc": ["A trustee uses trust money to pay one of five annual life insurance premiums. On his death the policy pays out £1m."], "st": "What can the beneficiaries claim, following Foskett v McKeown?", "o": ["Only a personal claim against the estate.", "A proportionate share of the policy proceeds reflecting the contribution of trust money.", "Nothing, because the premiums were paid before.", "The whole £1m.", "Only the amount of the premium paid."], "a": "B", "x": ["Wrong. A proprietary claim is available.", "Correct. Foskett v McKeown allowed a proportionate share of the proceeds.", "Wrong. Tracing applies.", "Wrong. Only a proportionate share is available.", "Wrong. They are entitled to a share of the asset, not just the money."]}, {"ch": 11, "n": 9, "sc": ["A trustee gives £20,000 of trust money to his aunt, telling her it is a lottery win. Believing him, she mixes it with her own savings and spends the lot renovating her home."], "st": "Which of the following best describes the beneficiaries' claim against the aunt?", "o": ["She is liable for dishonest assistance.", "They can force the sale of her home and take a proportionate share.", "They can claim the full £20,000 from her savings.", "She is personally liable for knowing receipt.", "Tracing is unlikely to be allowed, as it would be inequitable and the aunt can rely on change of position."], "a": "E", "x": ["Wrong. She was not dishonest.", "Wrong. Forcing a sale would be inequitable against an innocent volunteer.", "Wrong. The money has been spent, and she is an innocent volunteer with no personal liability.", "Wrong. She had no knowledge of the breach.", "Correct. Tracing must not have an inequitable result; an innocent volunteer who has changed her position can resist it."]}, {"ch": 11, "n": 10, "sc": ["A trustee transfers trust money to a buyer who purchases a car from him for full value, honestly and without notice of the breach."], "st": "Can the beneficiaries trace the car?", "o": ["No, because cars cannot be traced.", "Yes, if they act within six years.", "No, because the buyer is a bona fide purchaser for value without notice.", "Yes, if the trustee is bankrupt.", "Yes, against any recipient."], "a": "C", "x": ["Wrong. Any property can be traced.", "Wrong. Timing is irrelevant.", "Correct. Equitable tracing is defeated by a bona fide purchaser for value without notice.", "Wrong. Bankruptcy is irrelevant.", "Wrong. The bona fide purchaser defence applies."]}]},Q=D.q,L="ABCDE";let i=0,A={};
