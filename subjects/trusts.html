<script>
const D={"t": ["The three certainties", "Formalities for the creation of trusts", "Constitution of trusts", "Exceptions to the maxim that equity will not assist a volunteer", "Beneficial entitlement", "Purpose trusts", "Resulting trusts", "Family home trusts", "Liability of strangers and the fiduciary relationship", "Trustees", "Trustees' liability", "Equitable tracing and equitable remedies"], "q": [{"ch": 0, "n": 1, "sc": ["A company director died leaving a will by which her estate is to be held on trust for her son for life and after his death to be divided between all the present and past employees of her company. The son is concerned that the trust is not workable. He has a complete list of past and present employees but is unsure that all of them can be traced."], "st": "Which of the following statements provides the best advice regarding the trust?", "o": ["The trust is valid because the company still exists.", "The trust is valid because there are a large number of employees who can benefit from it.", "The trust is valid because there is a complete record of past and present employees.", "The trust is not valid because a company cannot be a beneficiary.", "The trust is not valid because the class of beneficiaries is administratively unworkable."], "a": "C", "bx": "The correct answer was C. This is a fixed trust and certainty of objects is determined by whether the trustees can compile a complete list of all beneficiaries. Options A, B, D and E are wrong because the reasons given do not determine the validity of the trust."}, {"ch": 0, "n": 2, "sc": ["A settlor recently transferred £10m to set up a trust with the following clause: 'The trustees shall apply the net income of the fund in making at their absolute discretion payments to any of my relatives or dependants in such amounts, at such times and on such conditions as they think fit'."], "st": "Which of the following statements provides the best advice regarding the trust?", "o": ["The trust is not valid due to conceptual uncertainty.", "The settlor has created a fixed trust.", "The validity of the trust depends on the trustees being able to draw up a complete list of all the beneficiaries.", "The beneficiaries of the trust are not entitled to equal shares of the trust income.", "The trustees must ensure that the beneficiaries receive payment."], "a": "D", "bx": "The correct answer was D. This is a discretionary trust (Option B is wrong), and as such the trustees are under no obligation to ensure payment to all the beneficiaries (not Option E). The test to determine conceptual certainty is the individual ascertainability test, the trustees need not draw up a complete list of the beneficiaries so not Option C. Option A is wrong because the description of the class of beneficiaries is conceptually certain."}, {"ch": 0, "n": 3, "sc": ["A client is seeking advice on the following gift in her husband's will: '£500,000 to my wife, and I am confident that she will make good use of the money to take good care of our children'."], "st": "Which of the following statements provides the best advice regarding the gift?", "o": ["The wife holds the money on trust for the children.", "The husband intended to create a trust.", "The money will be returned to the husband's estate.", "The children are entitled to the money absolutely.", "The wife is entitled to the money absolutely."], "a": "E", "bx": "The correct answer was E. 'I am confident' are precatory words, which are not emphatic enough to show certainty of intention to create a trust. As there is no trust, the answer cannot be A, B or D. The wife (who is the donee) is absolutely entitled to the money so Option C is wrong."}, {"ch": 0, "n": 4, "sc": ["A testator's will made the following bequest: 'My shares in Energy plc to my cousin from which he must ensure regular payments to his mother, my aunt, to maintain a reasonable standard of living for her'."], "st": "Which of the following statements provides the best advice regarding the gift?", "o": ["The gift is void for lack of certainty of subject matter.", "The gift is void for lack of certainty of objects.", "The cousin can take the shares absolutely.", "The aunt is the beneficiary of the trust.", "The cousin is the beneficiary of the trust."], "a": "D", "bx": "The correct answer was D. There was intention to create a trust with the trustee (the cousin) holding for the benefit of his mother (the testator's aunt), who is the object (Option B is wrong). The subject matter is certain: the shares (Option A is wrong). The beneficial interest ('reasonable standard of living') is certain as the amount can be objectively assessed by the court. The cousin is a trustee so he cannot benefit from the shares (so not Options C or E)."}, {"ch": 0, "n": 5, "sc": ["A testator's will contains the following clause: 'The bulk of my residue to be divided amongst all the faithful employees and the dependants of such employees of my former company as my executors think fit'. The testator's company ceased operating a decade ago and the executors are unsure if there are any records left of the employees."], "st": "Which of the following statements provides the best advice regarding the gift?", "o": ["The gift is valid because there are a large number of beneficiaries who can benefit from it.", "The gift is valid because the executors can use extrinsic evidence to identify the beneficiaries.", "The gift is not valid because the company no longer exists.", "The gift is not valid because the executors cannot draw up a complete list of all the beneficiaries.", "The gift is not valid because the subject matter is uncertain."], "a": "E", "bx": "The correct answer was E. The subject matter of the gift is uncertain due to the word 'bulk'. There is no valid gift so the answer cannot be A or B. Options C and D are incorrect because the reasons given are not why the gift is invalid."}, {"ch": 0, "n": 6, "sc": ["A testator's will leaves '50 of my 950 shares in Acorn Ltd to my nephew on trust for my niece'. The shares have never been divided or separately identified."], "st": "Which of the following statements best describes the position?", "o": ["The trust fails for uncertainty of objects.", "The trust is valid, as the shares are identical intangible assets and need not be segregated.", "The niece takes all 950 shares.", "The trust is valid only if the nephew chooses which 50 shares are held on trust.", "The trust fails for uncertainty of subject matter, as the 50 shares have not been segregated."], "a": "B", "x": ["Wrong. The niece is clearly identified.", "Correct. Following Hunter v Moss, a trust of part of a holding of identical shares is valid without segregation.", "Wrong. The trust is of 50 shares only.", "Wrong. No selection is needed because the shares are identical.", "Wrong. Segregation is required for tangible goods, not identical shares."]}, {"ch": 0, "n": 7, "sc": ["A testator's will states: 'I leave £20,000 to my trustees to pay a reasonable income to my housekeeper for the rest of her life'."], "st": "Which of the following statements best describes the gift?", "o": ["The trust is valid, as the court can objectively quantify a 'reasonable income'.", "The housekeeper takes the £20,000 absolutely.", "The trust is valid only if the trustees agree on the figure.", "The trust fails, as 'reasonable income' is uncertain.", "The gift fails, as a housekeeper cannot be a beneficiary."], "a": "A", "x": ["Correct. In Re Golay's Trust, 'reasonable income' was held certain because the court can assess it objectively.", "Wrong. The words create a trust of income, not an outright gift.", "Wrong. Certainty does not depend on the trustees agreeing.", "Wrong. The court can quantify the amount objectively.", "Wrong. Anyone with capacity to hold property can be a beneficiary."]}, {"ch": 0, "n": 8, "sc": ["A settlor transfers £1m to trustees to distribute 'among such of my old friends as the trustees think fit'."], "st": "Which test of certainty of objects applies to this trust?", "o": ["The test of whether a person has a reasonable claim on the settlor.", "The 'is or is not' (individual ascertainability) test, because it is a discretionary trust.", "No test applies, because the trustees have absolute discretion.", "The complete list test, because the trustees must know every beneficiary.", "The charitable public benefit test."], "a": "B", "x": ["Wrong. There is no such test.", "Correct. McPhail v Doulton applies the 'is or is not' test to discretionary trusts; 'old friends' may still fail for conceptual uncertainty.", "Wrong. Certainty of objects must still be satisfied.", "Wrong. The complete list test applies to fixed trusts.", "Wrong. This is a private trust, not a charity."]}, {"ch": 0, "n": 9, "sc": ["A father writes to his son: 'I give you my cottage in the full confidence that you will let your sister live there when she needs to'."], "st": "What is the most likely effect of these words?", "o": ["The son takes the cottage absolutely, as the words are merely precatory.", "The sister has a licence binding on the son.", "The son holds the cottage on trust for his sister.", "The son holds the cottage on trust for himself and his sister equally.", "The gift fails and the cottage remains with the father."], "a": "A", "x": ["Correct. Words expressing hope or confidence do not show sufficient certainty of intention to create a trust (Re Adams and the Kensington Vestry).", "Wrong. The precatory words create no enforceable right.", "Wrong. There is no certainty of intention.", "Wrong. There is no intention to create any trust.", "Wrong. The outright gift to the son is effective."]}, {"ch": 0, "n": 10, "sc": ["A settlor declares that her bank account is to be held on trust for the benefit of 'the majority of my grandchildren'. She has five grandchildren."], "st": "Which of the following best describes the trust?", "o": ["The trust fails for uncertainty of subject matter only.", "The trust is valid, as the trustees can choose the grandchildren.", "The trust fails, as the beneficial interests are uncertain.", "The trust is valid, and three grandchildren take equally.", "The trust is valid, and each grandchild takes one-fifth."], "a": "C", "x": ["Wrong. The bank account is certain; the problem lies with the objects and their shares.", "Wrong. No discretion was conferred on the trustees.", "Correct. It is unclear which grandchildren benefit or in what shares, so the trust fails for uncertainty.", "Wrong. Nothing identifies which three.", "Wrong. The settlor did not provide for all five to benefit."]}, {"ch": 1, "n": 1, "sc": ["A woman was granted shares in a private company in her divorce settlement and decided to hold the shares on trust for her only son. The woman announced her intention at a family gathering and later left a voicemail to the son confirming her decision."], "st": "Which of the following statements best summarises the outcome of the woman's actions?", "o": ["There is no valid declaration of trust as the woman did not execute a trust deed.", "There is no valid declaration of trust as the woman did not complete the share transfer forms.", "There is no valid declaration of trust as there was nothing in writing confirming the woman's statement.", "There is no valid declaration of trust as the woman did not appoint a trustee.", "There is a valid declaration of trust."], "a": "E", "bx": "The correct answer was E. There are no formality requirements for the creation of trusts of personalty so long as the three certainties are met. This means that there is no requirement to execute a trust deed (so Option A is wrong) and there is no requirement for the trust to be evidenced in writing (so Option C is wrong). Option B is incorrect because the issue is whether the woman has validly declared the trust; the requirement for a share transfer form is a constitution requirement, which is a separate matter. Option D is incorrect because the woman made a self-declaration of trust."}, {"ch": 1, "n": 2, "sc": ["A father is the beneficiary of a trust and wishes to transfer the benefits under the trust to his infant daughter. He informed the trustees orally of his intention to create a trust of his equitable interest for his daughter, after which he ensures that all payments received from the trustees are paid into investment accounts he set up for his daughter. He reviews the investments regularly and makes changes where necessary."], "st": "Which of the following statements best summarises the outcome of the father's actions?", "o": ["There is a valid trust as the father is an active trustee.", "There is no valid trust as the father should have executed a trust deed.", "There is no valid trust as the father should have assigned his equitable interest to the daughter in writing.", "There is no valid trust as the father should have appointed a trustee.", "There is no valid trust as a beneficiary cannot also be a trustee."], "a": "A", "bx": "The correct answer was A. The father has created a valid sub-trust with his daughter as the beneficiary where he is an active trustee. As the father has not dropped out of the picture entirely, there is no need to comply with the formality requirements that the disposition must be in writing and signed (so Option C is wrong). The father has made a self-declaration of trust (so Option D is wrong) and there is no requirement for a trust deed (therefore Option B is wrong). Option E is incorrect because a beneficiary can be a trustee."}, {"ch": 1, "n": 3, "sc": ["A will trust contains the following provision: 'All my investments to be held on trust for my son until he turns 25; he is to be paid the income before then'. The testator has just died and the son, who is aged 19, met with the trustees and informed them that he does not wish to take any benefit from his father's estate. According to the will, the testator's daughter is the residuary legatee."], "st": "Which of the following statements best describes the effect of the son's actions?", "o": ["The trustees continue to hold the property on trust for the son.", "The trustees must pay any income to the son.", "The investments belong to the daughter.", "The son's actions have no legal effect, he should have disclaimed in writing.", "The son's actions have no legal effect, he should have disclaimed by deed."], "a": "C", "bx": "The correct answer was C. The son's oral disclaimer is valid because a disclaimer is not a disposition requiring written evidence or deed (so Options D and E are wrong). The legal effect of the disclaimer is that the investments will fall into the residue and pass to the daughter (therefore Options A and B are wrong)."}, {"ch": 1, "n": 4, "sc": ["At a family dinner celebrating her son's 18th birthday, the mother announced that, as a birthday present for the son, she intends to hold her apartment in London on trust for him. She then wrote the same on a birthday card which she signed. A month later, the mother and son had an argument and are no longer on speaking terms. The son seeks advice on his rights to the apartment."], "st": "Which of the following statements best describes the outcome of the mother's actions?", "o": ["There is no valid declaration of trust as the mother should have executed a trust deed.", "There is no valid declaration of trust as the mother did not appoint trustees.", "There is no valid declaration of trust as she should have conveyed the apartment to him by deed.", "There is a valid enforceable declaration of trust.", "There is a valid declaration of trust provided the son can show that he is not a volunteer."], "a": "D", "bx": "The correct answer was D. The oral declaration of trust over land was followed by evidence of trust by signed writing in the card and therefore this is a valid declaration of trust. There is no requirement for a trust deed to comply with the statutory formalities (so Option A is wrong). Option B is wrong because the mother made a self-declaration of trust. Option C is incorrect because the need for a deed of conveyance is a constitution requirement, separate to the formality requirements. Option E is wrong because it is irrelevant whether the son is a volunteer or not."}, {"ch": 1, "n": 5, "sc": ["Under a settlement, trustees are holding trust assets worth £50,000 on a bare trust for a man. The man wished to transfer his benefit to his grandchildren without incurring stamp duty. He set up a trust benefitting his grandchildren with the same trustees and orally directed the trustees to hold the investments for the benefit of the second trust."], "st": "Which of the following statements best summarises the outcome of the man's actions?", "o": ["The oral direction is effective to transfer the interest to the grandchildren regardless of whether the trust assets are personalty or realty.", "The oral direction is effective to transfer the interest to the grandchildren provided the trust assets are pure personalty.", "The oral direction is effective to transfer the interest to the grandchildren as both trusts have the same trustees.", "The oral direction is not effective because the grandchildren are volunteers.", "The oral direction is not effective as it should have been done in writing."], "a": "E", "bx": "The correct answer was E. There is movement of a subsisting equitable interest from the bare trust to the trust benefitting the grandchildren. This requires compliance with the statutory formalities that the declaration of trust must be in writing and signed. Options A-D are wrong because they ignore the fact that the disposition was not made in writing."}, {"ch": 1, "n": 6, "sc": ["A man orally declares that he holds his freehold flat on trust for his niece. Nothing is put in writing. The man later refuses to recognise the niece's interest."], "st": "Which of the following best describes the niece's position?", "o": ["The trust is void, as declarations of trusts of land must be made by deed.", "The trust is valid but unenforceable, as a declaration of a trust of land must be evidenced in signed writing.", "The niece can enforce the trust because she is a volunteer.", "The trust is fully enforceable, as no formalities apply to declarations of trust.", "The trust is enforceable only if the niece paid for the flat."], "a": "B", "x": ["Wrong. A deed is not required for the declaration.", "Correct. Under s 53(1)(b) LPA 1925, the declaration must be manifested and proved by signed writing; without it the trust is unenforceable.", "Wrong. Being a volunteer is irrelevant to formalities.", "Wrong. Section 53(1)(b) applies to land.", "Wrong. Payment is irrelevant to s 53(1)(b)."]}, {"ch": 1, "n": 7, "sc": ["A beneficiary under a bare trust of shares telephones the trustees and tells them that from now on they should hold his equitable interest for his sister."], "st": "Is the disposition effective?", "o": ["Yes, because oral directions to trustees are always effective.", "Yes, because shares are personalty.", "Yes, provided the trustees agree.", "No, because a disposition of a subsisting equitable interest must be in writing signed by the beneficiary.", "No, because the transfer must be made by deed."], "a": "D", "x": ["Wrong. Grey v IRC holds the opposite.", "Wrong. Section 53(1)(c) applies to personalty too.", "Wrong. Trustee agreement cannot cure the lack of writing.", "Correct. Section 53(1)(c) LPA 1925 requires signed writing; Grey v IRC shows an oral direction is ineffective.", "Wrong. Writing, not a deed, is required."]}, {"ch": 1, "n": 8, "sc": ["A beneficiary directs the bare trustee of shares to transfer both the legal title and the beneficial interest in the shares to a charity. The trustee does so. Nothing was put in writing by the beneficiary."], "st": "Was writing required for the beneficial interest to pass?", "o": ["No, because where the legal and equitable interests pass together, s 53(1)(c) does not apply.", "Yes, because any transfer of an equitable interest needs signed writing.", "Yes, because charities can only receive gifts by deed.", "No, because shares can never be held on trust.", "Yes, unless the charity gave consideration."], "a": "A", "x": ["Correct. In Vandervell v IRC, the transfer of the legal title with the beneficial interest did not require separate writing.", "Wrong. Vandervell is an exception to this.", "Wrong. There is no such requirement.", "Wrong. Shares are commonly held on trust.", "Wrong. Consideration is irrelevant here."]}, {"ch": 1, "n": 9, "sc": ["A woman signs a letter declaring that she holds her house on trust for her son. At the same time she orally declares that she holds her jewellery on trust for her daughter. Nothing about the jewellery is put in writing."], "st": "Which of the trusts are enforceable?", "o": ["Only the trust of the jewellery is enforceable.", "Both trusts are enforceable.", "Only the trust of the house is enforceable.", "Neither trust is enforceable, because a deed is needed for both.", "Neither trust is enforceable, because the trusts were declared at the same time."], "a": "B", "x": ["Wrong. The house trust is evidenced in signed writing, so it is enforceable.", "Correct. The trust of land is evidenced by signed writing as s 53(1)(b) LPA 1925 requires, and a trust of personalty needs no formalities.", "Wrong. A trust of personalty such as jewellery can be declared orally.", "Wrong. No deed is needed to declare a trust.", "Wrong. The timing of the declarations is irrelevant."]}, {"ch": 1, "n": 10, "sc": ["A testator's will leaves £100,000 'to my trustees to hold on the trusts I have communicated to them'. Before making the will, the testator told the trustees the terms and they agreed."], "st": "What type of trust is this, and is it likely to be enforced?", "o": ["A resulting trust for the estate.", "An express trust that must comply with s 53(1)(b).", "A half-secret trust, likely to be enforced as the terms were communicated and accepted before the will.", "A half-secret trust, which is void because the terms are not in the will.", "A fully secret trust, which is void."], "a": "C", "x": ["Wrong. There is no failure of the trust here.", "Wrong. Section 53(1)(b) concerns land declarations inter vivos.", "Correct. The will shows a trust on its face; communication and acceptance before or at the will's execution allows a half-secret trust to be enforced.", "Wrong. Half-secret trusts are enforced if communicated in time.", "Wrong. The will refers to the trust, so it is half-secret, not fully secret."]}, {"ch": 2, "n": 1, "sc": ["A man bought a house and furnished it lavishly with expensive furniture. He took his new wife to the house for the first time, telling her to close her eyes. He opened the front door and told her to open her eyes, assuring her that everything she sees belongs to her. The man later became bankrupt and the trustee in bankruptcy is claiming the furniture. The wife claims that the furniture was a gift to her."], "st": "Which of the following statements best describes the position with regard to the furniture?", "o": ["There was a valid gift of the furniture to the wife.", "The man holds the furniture on trust for his wife.", "The trustee in bankruptcy can claim the furniture.", "The wife can claim the furniture as she has provided marriage consideration.", "The wife can sue for breach of covenant and claim damages equivalent to the value of the furniture."], "a": "C", "bx": "The correct answer was C. There has been no valid delivery (by deed) of the furniture to the wife (so not Option A). He did not declare a trust of the furniture with his wife as the beneficiary so Option B is wrong. There was no covenant to benefit the wife, so Options D and E are wrong."}, {"ch": 2, "n": 2, "sc": ["According to the terms of a settlement signed by the settlor and his trustees, the trustees are to hold property on trust for the settlor's daughter until she turns 25. The settlement includes a covenant by the settlor to settle all the property he is due to inherit from his mother's estate. Two months ago, his mother's personal representatives conveyed her house to him in accordance with the terms of her will. The settlor died last week without having transferred the house to the trustees."], "st": "Which of the following statements provides the best advice to the daughter?", "o": ["The daughter can claim the house by specific performance.", "The daughter can claim damages equivalent to the value of the house.", "The daughter can sue the trustees for damages equivalent to the value of the house.", "The trustees can sue on the daughter's behalf and claim the house by specific performance.", "The daughter has no cause of action."], "a": "E", "bx": "The correct answer was E. The daughter was a volunteer and not entitled to an order of specific performance (so Option A is wrong). She was not a party to the settlement and cannot sue for damages (so Options B and C are incorrect). The trustees will not be allowed to sue on her behalf (so Option D is wrong)."}, {"ch": 2, "n": 3, "sc": ["A man declared a trust whereby his brother is to hold the man's house on trust for the brother's daughter. The man wrote, 'My brother is the trustee of my house and his daughter is the beneficiary, on a piece of paper which he signed. He gave the paper and the deeds of his house to his brother. The man died leaving his entire estate to charity."], "st": "Which of the following statements provides the best advice regarding the house?", "o": ["The house will pass to the charity.", "The brother holds the house on trust for his daughter.", "The brother can claim the house for his daughter by specific performance.", "The brother is entitled to damages to the value of the house for his daughter.", "The daughter can claim the house by specific performance."], "a": "A", "bx": "The correct answer was A. The trust was incompletely constituted as a deed of conveyance/transfer form is required to convey land. The daughter (beneficiary) is a volunteer and has no claim to the house. As the trust has not been constituted, and the daughter is a volunteer, Options B-E are wrong."}, {"ch": 2, "n": 4, "sc": ["A woman met her friend for coffee. The friend admired the bracelet the woman was wearing. She took the bracelet off and fastened it on her friend's wrist, saying, 'It looks good on you, you should have it'. As they were leaving the coffee shop, the woman took the bracelet back, saying that her outfit is incomplete without it. She died a week later. According to her will, all her jewellery is to be given to her sister."], "st": "Which one of the following statements best describes the claim to the bracelet?", "o": ["The friend can sue for the value of the bracelet.", "The sister will inherit the bracelet.", "The bracelet belongs to the friend.", "The woman holds the bracelet on trust for her friend.", "The sister holds the bracelet on trust for the friend."], "a": "B", "bx": "The correct answer was B. The facts suggested an attempted inter vivos gift of the bracelet to the friend, but the gift was imperfect as the woman did not part with possession of the bracelet (she took it back). Option A is wrong as the friend is a volunteer. Option C is wrong due to the imperfect delivery of the bracelet. Options D and E are wrong as there is no indication of an intention to create a trust on the part of the woman."}, {"ch": 2, "n": 5, "sc": ["A husband covenanted to settle after-acquired property from his father's estate to his marriage settlement. The beneficiaries of the settlement are the married couple, their children and the couple's two nieces. The husband later inherited some shares from his father but he and his wife died in a car accident before he could transfer the shares to the settlement. The husband and wife have no children."], "st": "Which one of the following statements best explains the nieces' claim to the shares?", "o": ["The nieces can claim the shares by specific performance.", "The nieces can sue for breach of covenant and claim damages to the value of the shares.", "The nieces have no claim to the shares.", "The nieces can compel the trustees to sue on their behalf.", "The nieces can sue the trustees for damages to the value of the shares."], "a": "C", "bx": "The correct answer was C. Only the parties to the marriage and their children have marriage consideration. The nieces are volunteers. They have no right to specific performance or damages (so Options A, B, D and E are incorrect)."}, {"ch": 2, "n": 6, "sc": ["A woman wishes to give her shares in a private company to her nephew. She signs a stock transfer form and gives it with the share certificate to the nephew, but he does not send them to the company before she dies."], "st": "Which of the following best describes the position?", "o": ["The gift takes effect only if her will confirms it.", "The gift fails, because the nephew was not registered as shareholder.", "The shares are held on resulting trust for the woman's estate.", "The gift fails, as gifts of shares require a deed.", "The gift is complete in equity under the rule in Re Rose, as she did everything required of her."], "a": "E", "x": ["Wrong. The will is irrelevant.", "Wrong. Registration is not required for equity to treat the gift as complete.", "Wrong. There is no resulting trust where the gift is effective in equity.", "Wrong. No deed is required to transfer shares.", "Correct. Under Re Rose, the gift is effective in equity once the transferor has done all she needs to do."]}, {"ch": 2, "n": 7, "sc": ["A man declares himself trustee of his antique clock for his granddaughter. He keeps the clock in his home."], "st": "Is the trust properly constituted?", "o": ["Yes, because on a self-declaration the settlor already holds legal title.", "No, because the clock must be delivered to the granddaughter.", "No, because a trustee cannot also be the settlor.", "Yes, but only if the granddaughter gave consideration.", "No, because a deed of gift is needed."], "a": "A", "x": ["Correct. Where a settlor declares himself trustee, no transfer of title is needed.", "Wrong. Delivery is needed for a gift, not a self-declaration.", "Wrong. A settlor can be trustee.", "Wrong. Consideration is not needed.", "Wrong. No deed is required for a self-declaration of trust of personalty."]}, {"ch": 2, "n": 8, "sc": ["A settlor transfers registered land to trustees by a properly executed TR1, but the transfer has not yet been registered at HM Land Registry when the settlor dies."], "st": "Which of the following best describes the trust?", "o": ["The trust fails, as legal title had not passed.", "The trust is likely to be treated as constituted, because the settlor did everything required of her.", "The land passes under the settlor's will.", "The beneficiaries must sue the estate for specific performance.", "The trustees hold on resulting trust for the estate."], "a": "B", "x": ["Wrong. Equity intervenes under Re Rose.", "Correct. Applying Re Rose (and Mascall v Mascall), equity treats the transfer as complete once the transferor has done all in her power.", "Wrong. The land is subject to the trust.", "Wrong. Volunteers cannot obtain specific performance.", "Wrong. There is no failure giving rise to a resulting trust."]}, {"ch": 2, "n": 9, "sc": ["A man covenants by deed with trustees to transfer £50,000 to them on trust for his adult nephew. He never makes the transfer. The nephew is not a party to the deed."], "st": "Can the nephew enforce the covenant?", "o": ["Yes, by obtaining specific performance.", "Yes, because the covenant was made by deed.", "No, because covenants to settle money are void.", "No, because he is a volunteer and not a party to the deed.", "Yes, because he is within the marriage consideration."], "a": "D", "x": ["Wrong. Specific performance is not available to volunteers.", "Wrong. The deed binds the parties to it, not the nephew.", "Wrong. The covenant is not void; it just cannot be enforced by him.", "Correct. Equity will not assist a volunteer, and a non-party cannot sue on the covenant.", "Wrong. There is no marriage settlement."]}, {"ch": 2, "n": 10, "sc": ["A man writes a signed letter to his daughter saying, 'I give you my registered freehold cottage'. He hands her the letter but never executes a transfer of the cottage. He dies, leaving everything to his wife."], "st": "Which of the following best describes the daughter's position?", "o": ["The gift is effective, as the letter was signed.", "The gift is effective because the man intended to make it.", "The man's estate holds the cottage on trust for the daughter.", "The gift fails, as legal title to land must be transferred by deed and registered.", "The daughter can enforce the gift as a volunteer."], "a": "D", "x": ["Wrong. A signed letter is not a deed of transfer.", "Wrong. Intention alone does not constitute the gift.", "Wrong. He intended a gift, not a trust, and equity will not turn a failed gift into a trust.", "Correct. The man did not do what was needed to transfer legal title to land, and equity will not assist a volunteer.", "Wrong. Equity will not assist a volunteer."]}, {"ch": 3, "n": 1, "sc": ["A woman worked abroad and visited her grandfather twice a year. During one such visit, her grandfather informed her that he did not expect to live long enough for her next visit. He gave her the deeds to his house and told her, 'I want you to have the house; you have your own set of keys'. The woman's grandfather died a month later. His will left his whole estate to a local children's charity."], "st": "Which of the following statements best describes the woman's entitlement to the house?", "o": ["The house will pass to the charity.", "The woman can claim the house by estoppel.", "The woman can claim the house by relying on donatio mortis causa.", "There was an inter vivos gift of the house to the woman.", "There is a valid trust of the house benefitting the woman."], "a": "A", "bx": "The correct answer was A. There was an imperfect lifetime gift of the house to the woman but none of the exceptions are applicable to perfect the gift. It is not Option B because the elements of estoppel were not present. It is not Option C because the donor was not anticipating death from a known cause. It is not Option D because he did not convey the house to her by deed. It is not Option E because he had no intention to create a trust."}, {"ch": 3, "n": 2, "sc": ["A decade ago, the testator made a will leaving her entire estate to several animal charities. Two years ago, she suffered a stroke and her nephew decided to move in with her as her caregiver. Last year, she presented him with the deeds to her house, telling him that the house is his when she dies. A month ago, they both signed a document purporting to be a deed leaving the house to the nephew. There was no other signature on the document. The testator died last week. Her will appointed her nephew as the executor."], "st": "Which of the following best describes the entitlement to the house?", "o": ["The nephew can claim the house as there was a deed of conveyance in his favour.", "The nephew can claim the house as he is the executor of the estate.", "The nephew can claim the house by donatio mortis causa as there was delivery of the title deeds to him.", "The nephew can claim the house as she had done everything in her power to transfer the house to him.", "The nephew can claim the house using estoppel."], "a": "B", "bx": "The correct answer was B. The document they signed is neither a deed nor a will (lacking proper formalities) so not Option A. There was an imperfect lifetime gift of the house to the nephew but her intention to make the gift continued up to her death. As he was appointed her executor, all the requirements of Strong v Bird have been met and the gift is perfected. Option E is wrong because even though the nephew may have suffered detriment in having to look after his aunt, he did so voluntarily, not because she promised him the house. There was no evidence that she was contemplating her death so Option C is wrong. She has not done everything possible to transfer the house so Option D is wrong."}, {"ch": 3, "n": 3, "sc": ["A man turned 80 last month; his only surviving next of kin are his daughter and her son. The man wanted to ensure that they should have some security in the event of his passing. He gave the title deeds to his house to his daughter, saying, 'I want you to hold my house for your son'. He then wrote, 'This house is for my grandson' on the back of one of the deeds, which he signed, saying, 'There, now it is official'. The man died last week. His will, which was executed in 1980, appointed his best friend as his executor and left his entire estate to charity."], "st": "Which of the following statements best describes the entitlement to the house?", "o": ["The daughter holds on trust for the grandson as there was a continuing intention to benefit the grandson and the gift was perfected on the man's death.", "Donatio mortis causa applies and the daughter holds on trust for the grandson.", "The man's personal representatives hold the house on trust for the grandson.", "The grandson is not entitled to the house.", "The daughter holds on trust for the grandson as the man had done everything in his power to transfer the house to her."], "a": "D", "bx": "The correct answer was D. The man had intended to create a trust of the house with his daughter as trustee holding for the benefit of her son, but the trust was incompletely constituted as he failed to vest the legal title to the house on the daughter. None of the exceptions are applicable to perfect the trust (so all the other options are wrong)."}, {"ch": 3, "n": 4, "sc": ["A woman has two children: a son from a brief relationship with a man who died before they could marry, and a daughter from her marriage. When the woman turned 80, she decided to execute a will but mistakenly assumed that any gift left in the will to her son would be invalid due to his illegitimacy. The woman's will names her son as her executor and left her whole estate to her daughter. Later that same day, she told her son that the house belongs to him. She passed the title deeds of the house to him together with a note saying, 'The house is yours. Love, Mum'. The next day, worried that she may not have properly conveyed the house to him, she wrote a cheque for the value of the house to him. No one else knew about the cheque and on her death, the cheque was found stapled to the will."], "st": "Which of the following statements best describes the entitlement to the house?", "o": ["The daughter inherits the whole estate including the house.", "The son is entitled to the house as he is the executor of the estate.", "The son is not entitled to the house but he can claim the value of the house as represented by the cheque.", "The son can claim the house by relying on donatio mortis causa.", "The daughter holds the house on trust for the son."], "a": "A", "bx": "The correct answer was A. There was an imperfect lifetime gift of the house to the son. Although he was appointed as the executor of his mother's estate, the rule in Strong v Bird is inapplicable as there was no continuing intention on the mother's part to give him the house (the cheque negated continuing intention) so Options B and C are wrong. There was no evidence that she was contemplating her death so Option D is wrong. There was no intention to create a trust so Option E is wrong."}, {"ch": 3, "n": 5, "sc": ["Fifteen years ago, a man and a woman started a relationship and she moved in with him. The man was the sole owner of the house in which they lived and he paid the mortgage instalments. The couple never married but had two children together. Five years ago, the man fell in love with his personal assistant and moved in with her. Before he moved out, he told the mother of his children not to worry as the house was now hers. He told her where the title deeds to the house were kept. She started paying the mortgage instalments and spent a lot of money and effort installing a new fitted kitchen. The man is now seeking to evict the woman and their children from his house."], "st": "Which of the following statements best describes the woman's entitlement to the house?", "o": ["The woman is not entitled to the house as there is nothing in writing to support her claim.", "The woman is not entitled to the house as she has provided no consideration.", "The woman is entitled to the house as the man had done everything in his power to transfer it to her.", "The woman is entitled to the house by relying on donatio mortis causa.", "The woman is entitled to the house by estoppel."], "a": "E", "bx": "The correct answer was E. The man made a promise to the woman that the house was hers and in reliance on his promise, she suffered detriment (paying mortgage instalments, installing fitted kitchen) thus perfecting the gift. The promise need not be made in writing so Option A is wrong. So long as she can prove all the elements of estoppel, consideration is not required, so Option B is wrong. None of the other exceptions are applicable so Options C and D are wrong."}, {"ch": 3, "n": 6, "sc": ["A man in hospital awaiting major heart surgery hands his daughter the key to a box containing his watch, saying, 'If I don't survive the operation, the watch is yours'. He dies during the operation."], "st": "Which of the following best describes the daughter's claim?", "o": ["She can claim only by proprietary estoppel.", "She has no claim, as the gift was not completed in his lifetime.", "She is entitled under the rule in Re Rose.", "She is entitled to the watch as a valid donatio mortis causa.", "She is entitled under the rule in Strong v Bird."], "a": "D", "x": ["Wrong. There is no assurance and detriment.", "Wrong. A DMC takes effect on death.", "Wrong. Re Rose concerns doing everything to transfer title.", "Correct. The gift was made in contemplation of impending death, conditional on death, and dominion was parted with by delivering the key.", "Wrong. Strong v Bird requires the donee to be appointed executor."]}, {"ch": 3, "n": 7, "sc": ["A woman tells her son that her shares will be his. She never transfers them. Her will appoints the son as executor and leaves everything to charity. She maintained her intention to give him the shares until her death."], "st": "What is the son's likely position?", "o": ["He has no claim, as the gift was never made.", "He holds the shares on trust for the charity.", "He can keep the shares under the rule in Strong v Bird.", "He can claim only if he gave consideration.", "He can claim the shares by donatio mortis causa."], "a": "C", "x": ["Wrong. Strong v Bird perfects the imperfect gift.", "Wrong. The gift is perfected, so the charity does not take the shares.", "Correct. An immediate intention to give, continuing to death, is perfected when the donee becomes executor.", "Wrong. Consideration is not needed.", "Wrong. There was no contemplation of death."]}, {"ch": 3, "n": 8, "sc": ["A woman tells her neighbour, 'I'll leave you my field if you look after my horses'. For ten years the neighbour cares for the horses unpaid, turning down paid work to do so. The woman's will leaves the field to her cousin."], "st": "What is the neighbour's best claim?", "o": ["The rule in Strong v Bird.", "None, because the promise was not in writing.", "Proprietary estoppel, based on assurance, reliance and detriment.", "A resulting trust, as she contributed to the field.", "Donatio mortis causa."], "a": "C", "x": ["Wrong. The neighbour is not the executor.", "Wrong. Estoppel does not require writing.", "Correct. An assurance relied on to the claimant's detriment can found proprietary estoppel, even without writing.", "Wrong. She did not contribute to the purchase price.", "Wrong. There was no contemplation of impending death."]}, {"ch": 3, "n": 9, "sc": ["A man diagnosed with a terminal illness gives his friend the deeds to his unregistered house, saying, 'It's yours when I die'. Shortly afterwards he dies of the illness."], "st": "Which statement best reflects the modern position on land and donatio mortis causa?", "o": ["A DMC can never apply to land.", "The friend takes the house under Strong v Bird.", "The gift fails because a DMC must be made by deed.", "The friend takes the house under Re Rose.", "Following King v Chiltern Dog Rescue, a DMC of land is possible in principle, but the courts apply the requirements strictly."], "a": "E", "x": ["Wrong. Sen v Headley held that land can be the subject of a DMC.", "Wrong. The friend is not the executor.", "Wrong. A DMC does not require a deed.", "Wrong. The man had not done everything to transfer the house.", "Correct. Sen v Headley accepted DMC of land; King v Chiltern Dog Rescue stressed that the requirements must be strictly applied."]}, {"ch": 3, "n": 10, "sc": ["A man promises his niece £10,000, and shortly afterwards changes his mind and tells her he will not give it after all. He later dies, having appointed the niece as his executor."], "st": "Can the niece rely on the rule in Strong v Bird?", "o": ["No, because Strong v Bird applies only to land.", "No, because the man's intention to give did not continue until his death.", "Yes, because promises of money are always enforceable.", "Yes, if she can show she relied on the promise.", "Yes, because she was appointed executor."], "a": "B", "x": ["Wrong. Strong v Bird is not limited to land.", "Correct. Strong v Bird requires a continuing intention to make an immediate gift until death.", "Wrong. A gratuitous promise is not enforceable.", "Wrong. Reliance is relevant to estoppel, not Strong v Bird.", "Wrong. Appointment as executor is not enough by itself."]}, {"ch": 4, "n": 1, "sc": ["A testator's will contains the following provision: 'My house to be held on trust to allow my mother to live in the house during her lifetime and after her death to be held on trust for such of my niece and nephew as survive my mother and reach the age of 21 years in equal shares'. The niece is now 18 and the nephew is 22."], "st": "Which of the following statements best describes the parties' beneficial interests?", "o": ["They all have vested interests.", "They all have contingent interests.", "The mother and the nephew have vested interests, but the niece has a contingent interest.", "The mother has a contingent interest, but the niece and nephew have vested interests.", "The mother has a vested interest, but the niece and nephew have contingent interests."], "a": "E", "bx": "The correct answer was E. The mother has an interest that is vested in possession as she is able to enjoy the house now. The niece and nephew have contingent interests, the contingency being twofold, that they survive the mother and reach the age of 21. The nephew has only met one of the conditions, so his interest remains contingent. All other options are therefore incorrect."}, {"ch": 4, "n": 2, "sc": ["A man dies and is survived by his wife and a son who is aged 27 years. The man's will leaves his residuary estate on trust 'to pay the income to my wife for her life and after her death to my son if he survives my wife and attains the age of 25 years but if he does not so survive then to my brother absolutely'. The wife wishes to bring the trust to an end."], "st": "Whose consent is required to bring the trust to an end?", "o": ["The wife.", "The wife and the son.", "The wife, the son, and the brother.", "The wife and the brother.", "The son and the brother."], "a": "C", "bx": "The correct answer was C. To bring the trust to an end, the rule in Saunders v Vautier applies. All the beneficiaries (whether they have a vested or contingent interest) must be adults, in agreement and together are absolutely entitled. Option C is the only choice featuring all three beneficiaries; therefore all other options are incorrect."}, {"ch": 4, "n": 3, "sc": ["A settlor recently transferred £10m to set up a trust with the following clause: 'The trustees shall apply the net income of the fund in making at their absolute discretion payments to any of my relatives in such amounts, at such times and on such conditions as they think fit'. The settlor has a large family, but the trustees are able to draw up a complete list of all his relatives, at least a dozen of whom are minors. As the list is complete, the relatives want to bring the trust to an end and the money to be divided equally between themselves."], "st": "Which of the following best represents the beneficiaries' position regarding termination of the trust?", "o": ["The trust can be terminated because there is a complete list of all beneficiaries.", "The trust can be terminated because the beneficiaries are all in agreement.", "The trust can be terminated because the beneficiaries all have vested interests.", "The trust cannot be terminated because the beneficiaries are not all adults.", "The trust cannot be terminated because not all the beneficiaries have met the contingency."], "a": "D", "bx": "The correct answer was D. To compel the trustees to terminate the trust and distribute the money, the beneficiaries must use the rule in Saunders v Vautier. The rule is only applicable if all the beneficiaries are adults. Option A is incorrect because it is irrelevant whether a complete list is available. Option B is incorrect because the agreement of all beneficiaries is not sufficient; all beneficiaries must also be adults. Option C is incorrect as this is a discretionary trust. Option E is incorrect because the trust did not impose a contingency."}, {"ch": 4, "n": 4, "sc": ["A woman settled property on trust for her husband for life, remainder to her daughter for life, remainder to her grandson absolutely. The husband and grandson are still alive, but the daughter has just died."], "st": "Which statement best describes the beneficiaries' entitlement?", "o": ["On the husband's death, the property will pass to the grandson.", "On the husband's death, the property will pass to the daughter's estate.", "On the husband's death, the property will pass to the grandson provided he is still alive.", "On the husband's death, the property will go on resulting trust back to the settlor's estate if the grandson is dead.", "On the husband's death, the property will pass to the husband's estate."], "a": "A", "bx": "The correct answer was A. The husband and daughter both have a life interest in the property. The daughter's entitlement is lost on death, meaning that her estate cannot claim the property (so Option B is wrong). As the grandson is a remainder person, the property will not pass to the husband's estate (so Option E is wrong). So, on the husband's death, the property will pass to the grandson. While the husband is alive, the grandson's interest is vested in interest but becomes vested in possession when the husband dies. Options C and D are wrong because if the grandson is dead the property will pass to the grandson's estate."}, {"ch": 4, "n": 5, "sc": ["A man has settled property on trust for his son for life, then to his granddaughter if she qualifies as a solicitor. Both beneficiaries are adults. The granddaughter has not yet qualified as a solicitor."], "st": "Which statement best describes the beneficiaries' interests?", "o": ["Both have vested interests.", "The son's interest is vested, but the granddaughter's interest is contingent.", "Both have contingent interests.", "The son's interest is contingent, but the granddaughter's interest is vested.", "On the son's death, the property will pass to the granddaughter."], "a": "B", "bx": "The correct answer was B. The son has a vested interest, but the granddaughter must meet a condition before becoming entitled so her interest is contingent. Given that the granddaughter has not yet met the condition, her interest remains contingent (therefore Options A, C and D are wrong). Option E is incorrect as the granddaughter must meet the contingency before she can claim the property."}, {"ch": 4, "n": 6, "sc": ["Property is held on trust 'for my son for life, remainder to my daughter absolutely'. Both are alive and adults."], "st": "How is the daughter's interest best described?", "o": ["Vested in interest.", "Void for uncertainty.", "Discretionary.", "Contingent.", "Vested in possession."], "a": "A", "x": ["Correct. Her right is certain but postponed until the son's death, so it is vested in interest.", "Wrong. The gift is certain.", "Wrong. She has a fixed entitlement.", "Wrong. No condition is attached.", "Wrong. She cannot enjoy the property while the son is alive."]}, {"ch": 4, "n": 7, "sc": ["A trust is for 'my granddaughter absolutely if she attains 25'. The granddaughter is now 21 and the sole beneficiary. She wants the trust fund now."], "st": "Can she call for the fund?", "o": ["Yes, but only half the fund.", "Yes, under Saunders v Vautier, as the sole adult beneficiary absolutely entitled.", "No, unless the settlor consents.", "No, because the trustees have discretion.", "No, because she has not reached 25."], "a": "B", "x": ["Wrong. She is entitled to the whole.", "Correct. An adult beneficiary of full capacity entitled to the whole beneficial interest can terminate the trust, even before the contingency is met.", "Wrong. The settlor's consent is not needed.", "Wrong. This is a fixed trust.", "Wrong. Saunders v Vautier allows her to override the age condition."]}, {"ch": 4, "n": 8, "sc": ["A trust gives income to the trustees' discretion among the settlor's three adult children for 21 years, then capital to them equally. All three children agree they want the trust ended."], "st": "Can they end it?", "o": ["Yes, but only with the trustees' consent.", "No, because the 21-year period has not expired.", "No, because the trust is discretionary.", "Yes, all the beneficiaries are adult, of full capacity and together absolutely entitled.", "No, because the court's approval is always needed."], "a": "D", "x": ["Wrong. The trustees' consent is not required.", "Wrong. They can override the settlor's timing.", "Wrong. Objects of a discretionary trust can collectively terminate it if they are all of the beneficiaries.", "Correct. Saunders v Vautier extends to a group of beneficiaries who between them are absolutely entitled, including under a discretionary trust.", "Wrong. Court approval is not required where all are adult and agree."]}, {"ch": 4, "n": 9, "sc": ["A trust is 'to my wife for life, then to such of my children as reach 21'. There are two children aged 23 and 15."], "st": "Which statement best describes the children's interests?", "o": ["Both children have contingent interests.", "The elder child's interest is vested in possession.", "The elder child's interest is vested in interest; the younger child's interest is contingent.", "Both interests are discretionary.", "Both children have vested interests in possession."], "a": "C", "x": ["Wrong. The elder child has satisfied the contingency.", "Wrong. The wife's life interest postpones possession.", "Correct. The elder child has met the condition, but must wait for the wife's death; the younger child has not yet met it.", "Wrong. These are fixed interests.", "Wrong. Neither can enjoy the property while the wife is alive."]}, {"ch": 4, "n": 10, "sc": ["A sole beneficiary aged 17 of a bare trust of shares asks the trustees to transfer the shares to her."], "st": "Must the trustees comply?", "o": ["Yes, because she is the sole beneficiary.", "No, because only the settlor can end the trust.", "Yes, because shares are personalty.", "Yes, if her parents consent.", "No, because she is a minor and cannot give a valid discharge."], "a": "E", "x": ["Wrong. Being the sole beneficiary is not enough while she is a minor.", "Wrong. The settlor has no such power.", "Wrong. The nature of the property is irrelevant.", "Wrong. Parental consent does not satisfy the rule.", "Correct. Saunders v Vautier requires the beneficiary to be an adult of full capacity."]}, {"ch": 5, "n": 1, "sc": ["A testator has died leaving her whole estate on trust for the purpose of providing scholarships for the children of the employees of her company and the children of her friends. Her trustees require advice on the validity of the trust."], "st": "Which of the following provides the best advice regarding the trust?", "o": ["The testator created a valid private purpose trust.", "The testator created a valid charitable trust for the advancement of education.", "The testator created a valid express private trust.", "The testator created an invalid charitable trust due to the lack of public benefit.", "The testator created an invalid charitable trust due to the lack of conceptual certainty in its description of the beneficiaries."], "a": "D", "bx": "The correct answer was D. Whilst the purpose may be charitable, the potential beneficiaries are all connected by a personal nexus and cannot be considered a section of the public sufficient for a charitable trust (so Option B is incorrect). Option A is wrong because the trust does not meet the necessary requirements for a valid private purpose trust. Option C is wrong because of the objects have not been described with conceptual certainty due to the word 'friends'. Option E is wrong because charitable trusts do not require beneficiaries, so the issue of conceptual certainty is not relevant."}, {"ch": 5, "n": 2, "sc": ["A man died and his will left '£15,000 on trust, the income of which to be used to maintain my baby tortoise, Methuselah'. His executors and trustees require advice on the validity of this legacy. They are willing to care for the tortoise if required."], "st": "Which of the following provides the best advice regarding the legacy?", "o": ["The legacy is a valid express private trust as the object of the trust is the tortoise.", "The legacy is a valid charitable trust for the advancement of animal welfare.", "The legacy is void as it had not been expressly limited in perpetuity.", "The legacy is a valid private purpose trust.", "The legacy has a charitable purpose but fails due to the lack of public benefit."], "a": "C", "bx": "The correct answer was C. Private purpose trusts benefitting pets are exceptionally valid provided they have been limited in perpetuity or if the animal in question would not live beyond the perpetuity period. Neither is applicable here (therefore Option D is wrong). Option A is wrong because the objects of a private trust must be human. The purpose is to benefit a specific animal and therefore is not charitable (therefore Options B and E are wrong)."}, {"ch": 5, "n": 3, "sc": ["A woman has died and her will left a legacy of £10,000 on trust 'to the bishop of my church for the saying of masses for my soul for so long as the law allows; the masses are to be attended by my immediate family only'. The bishop is happy to hold the masses. Her executors and trustees require advice on the validity of this legacy."], "st": "Which of the following best describes the legacy?", "o": ["The legacy is a valid private purpose trust.", "The legacy is a valid charitable trust for the advancement of religion.", "The legacy is a valid express private trust as the beneficiaries are the testator's immediate family.", "The legacy is void as an express private trust due to the lack of conceptual certainty.", "The legacy is void as a private purpose trust for offending the rule against perpetuities."], "a": "A", "bx": "The correct answer was A. The purpose may be charitable but lacked public benefit as it was only open to family members (therefore Option B is incorrect). The trust has been set up for a specific purpose, so it is clearly not an express private trust (therefore Options C and D are wrong). Option E is incorrect as the woman limited the trust for 'so long as the law allows' meaning that it does not offend the perpetuities rule."}, {"ch": 5, "n": 4, "sc": ["A woman died and her will left a legacy of £10,000 to be held on trust 'the income from which is to be paid annually to the vicar of my local church to be used for the purposes of a summer holiday for the next 10 years'. Her executor and trustees require advice on this trust."], "st": "Which of the following best describes the legacy?", "o": ["The legacy is valid.", "The legacy is a valid charitable trust for the advancement of religion.", "The legacy is void as a private purpose trust as the purpose is not an acceptable purpose.", "The legacy is void as a private purpose trust for offending the rule against perpetuities.", "The legacy is void as an express private trust as there are no named beneficiaries."], "a": "A", "bx": "The correct answer was A. Whilst the trust is a private purpose trust, it is valid as it benefits an ascertainable individual (the vicar) and the trust is limited in perpetuity (10 years). Option B is wrong as there is no 'public' recognised for it to be charitable. Option C is wrong as the purpose is acceptable within the limited exceptions recognised in law (see Re Denley). Option D is wrong as the trust is limited by 10 years (well within the perpetuity period) and Option E is wrong as this is not a private trust."}, {"ch": 5, "n": 5, "sc": ["A man died leaving a will containing the following: '£3,000 on trust to place a park bench in the village green in my name; and another £3,000 on trust to maintain the park bench'. Her executor and trustees require advice on the validity of the trusts. They are happy to comply with the man's requests if required."], "st": "Which of the following provides the best advice regarding both trusts?", "o": ["Both trusts are void.", "Both trusts are valid as private purpose trusts.", "Both trusts are valid as charitable trusts.", "The trust for the placing of a park bench is void but the trust for the maintenance of the bench is valid.", "The trust for the placing of a park bench is valid but the trust for the maintenance of the bench is void."], "a": "E", "bx": "The correct answer was E. Both are private purpose trusts which must be limited in perpetuity. The first trust is impliedly limited in perpetuity as the court assumes that the bench will be put up within 21 years (therefore Option A is wrong). The second is void as it was not expressly limited in perpetuity (therefore Options B and D are wrong). Option C is wrong as this is not a charitable trust."}, {"ch": 5, "n": 6, "sc": ["A testator leaves £50,000 on trust to provide a sports ground 'for the benefit of the employees of my company', limited to 21 years."], "st": "Which of the following best describes the trust?", "o": ["A void trust for uncertainty of objects.", "A valid Re Denley-type trust, as it benefits ascertainable individuals and is limited to the perpetuity period.", "A valid charitable trust for the promotion of sport.", "A valid trust only if the employees consent.", "A void private purpose trust."], "a": "B", "x": ["Wrong. Employees are a certain class.", "Correct. Re Denley upholds purpose trusts that directly benefit ascertainable individuals within the perpetuity period.", "Wrong. Employees of one company lack public benefit (Oppenheim).", "Wrong. Consent is not required.", "Wrong. It falls within the Re Denley principle."]}, {"ch": 5, "n": 7, "sc": ["A testator leaves money on trust 'for the relief of poverty among my relatives'."], "st": "Is this likely to be charitable?", "o": ["No, because charitable trusts cannot benefit individuals.", "Yes, because the poor relations exception means a personal nexus does not defeat public benefit for poverty trusts.", "No, because there is a personal nexus.", "Yes, but only if the relatives are named.", "No, because relief of poverty is not a charitable purpose."], "a": "B", "x": ["Wrong. Charities benefit individuals as part of the public.", "Correct. Trusts for the relief of poverty are treated as an exception to the personal nexus rule.", "Wrong. Poverty trusts are an exception.", "Wrong. Naming is not required.", "Wrong. Relief of poverty is a listed charitable purpose."]}, {"ch": 5, "n": 8, "sc": ["A testator leaves £30,000 'to promote the political aims of the Green Party'."], "st": "Is this a valid charitable trust?", "o": ["Yes, as environmental protection is charitable.", "No, because it lacks certainty of subject matter.", "Yes, because it benefits the public.", "No, because a trust whose main purpose is political is not charitable.", "Yes, if limited to 21 years."], "a": "D", "x": ["Wrong. The stated purpose is political, not environmental protection.", "Wrong. The sum is certain.", "Wrong. Political purposes cannot satisfy charity law.", "Correct. Trusts with political purposes are not charitable.", "Wrong. Perpetuity limits do not make it charitable."]}, {"ch": 5, "n": 9, "sc": ["A testator leaves £5,000 on trust 'to maintain my horse, Star, for as long as the law allows'."], "st": "Which of the following best describes the trust?", "o": ["A valid charitable trust for animal welfare.", "A gift to the trustees absolutely.", "A void trust for offending the rule against perpetuities.", "A void trust, as an animal cannot be a beneficiary.", "A valid private purpose trust under the anomalous exception for animals, limited to the perpetuity period."], "a": "E", "x": ["Wrong. Benefiting one animal is not charitable.", "Wrong. The trustees hold the money for the purpose.", "Wrong. 'As long as the law allows' limits it to the perpetuity period.", "Wrong. The exception applies despite no human beneficiary.", "Correct. Trusts for the maintenance of specific animals are an anomalous exception if limited in perpetuity."]}, {"ch": 5, "n": 10, "sc": ["A testator leaves money on trust 'for the advancement of education' by providing scholarships for children living in a particular city."], "st": "Which of the following best describes the trust?", "o": ["A valid private purpose trust.", "A void trust because it is too wide.", "A valid charitable trust, as it advances education and benefits a section of the public.", "A void trust for lack of public benefit.", "A valid trust only if the children are named."], "a": "C", "x": ["Wrong. It qualifies as charitable.", "Wrong. Charitable trusts need not satisfy the certainty of objects test.", "Correct. Education is a charitable purpose and children in a city are a section of the public.", "Wrong. There is no personal nexus here.", "Wrong. Charitable trusts have no named beneficiaries."]}, {"ch": 6, "n": 1, "sc": ["A woman paid for the full purchase price of a flat but the title was conveyed to her boyfriend. There was no evidence that the flat was a gift to him. They moved in together but separated after five years. The boyfriend sold the flat and refused to share the proceeds of sale with the woman."], "st": "Which of the following is most likely to happen to the proceeds of sale?", "o": ["As the legal owner, the boyfriend is entitled to keep the proceeds.", "The boyfriend and the woman are entitled to equal shares in the proceeds.", "The woman is entitled to the proceeds.", "The boyfriend is entitled to a larger share of the proceeds as he was the legal owner.", "The woman is entitled to a larger share of the proceeds as she paid the purchase price."], "a": "C", "bx": "The correct answer was C. The woman paid the purchase price for a flat in the name of the boyfriend. This gave rise to a presumed resulting trust in her favour (therefore Option A is incorrect). In the absence of any evidence that it was meant as a gift to the boyfriend, he holds the whole proceeds of sale on resulting trust for her (therefore Options B, D and E are wrong)."}, {"ch": 6, "n": 2, "sc": ["Last year, a father bought a house that was conveyed to his son, who had just graduated from university with a degree in medicine. The father and son had a falling out last month as the son decided that he wanted to be a professional gamer instead of a doctor. The father wants the house back and is seeking your advice."], "st": "Which of the following statements provides the best advice?", "o": ["The son is not entitled to keep the house.", "The house belongs to the father as he paid for it.", "The son is holding the house on presumed resulting trust for the father.", "The son is entitled to the house.", "There is no presumption of advancement as the son is an adult."], "a": "D", "bx": "The correct answer was D. There are two presumptions at play here. When the father transferred the house to his son, there is a presumption of resulting trust in the father's favour. However, the relationship of father and son gives rise to a presumption of advancement (therefore Option E is wrong), which presumes a gift from father to son. The presumption of advancement prevails over the presumption of resulting trust (therefore Option C is wrong); the house belongs to the son (therefore Options A and B are incorrect)."}, {"ch": 6, "n": 3, "sc": ["The testator's will contains the following clause: 'My residuary estate to be held on trust for my only daughter'. The daughter predeceased the testator. The testator did not alter his will before he died."], "st": "Which of the following best describes what happens to the residue?", "o": ["The residue is held on presumed resulting trusts for the daughter's estate.", "The residue is held on presumed resulting trust for the testator's estate.", "The residue is held on automatic resulting trust for the daughter's estate.", "The residue is held on automatic resulting trust for the testator's estate.", "The residue should pass to the daughter's next of kin."], "a": "D", "bx": "The answer was D. There was a failure of beneficial interest as the daughter predeceased the father, meaning that the daughter was never entitled to the residue (and thus her estate is not entitled - Options C and E are therefore incorrect). This is an event giving rise to an automatic resulting trust. Now that the testator has died, and his will was unaltered, the trustees hold the residue on automatic resulting trust for the testator's estate. This is not a presumed resulting trust-type situation, so Options A and B are incorrect."}, {"ch": 6, "n": 4, "sc": ["A man paid for a house which was conveyed to the man and his girlfriend jointly. After the relationship broke down, the man claims to be entitled absolutely and that his former girlfriend has no beneficial interest in the house."], "st": "Which of the following best describes the entitlement to the house?", "o": ["The man cannot rely on presumed resulting trust to claim the house.", "The girlfriend holds the house on automatic resulting trust for the man.", "The girlfriend holds the house on presumed resulting trust for the man.", "The girlfriend provided no consideration and has no entitlement to the house.", "The girlfriend has no entitlement to the house as she and the man were not married."], "a": "A", "bx": "The answer was A. The house was conveyed to the man and his girlfriend jointly. This means they both hold the legal title. Their entitlement is determined by another type of trust (an implied trust of land - considered in Revise SQE Land Law) but resulting trust is not relevant (therefore all other options are incorrect)."}, {"ch": 6, "n": 5, "sc": ["A daughter contributed 30% towards a house that was conveyed to her father, who paid the remainder of the purchase price. The father died and left the house to his son."], "st": "Which of the following best describes the entitlement to the house?", "o": ["The daughter has no entitlement to the house.", "The daughter has a 30% beneficial interest in the house.", "The son is absolutely entitled to the house.", "The son and the daughter share the house equally.", "The daughter is absolutely entitled to the house."], "a": "B", "bx": "The correct answer was B. The daughter contributed towards the purchase price of the house that was in the father's name. This gave rise to a presumed resulting trust in her favour (therefore Option A is wrong). The father held the house on trust for himself and the daughter proportionate to their contributions (therefore Option E is wrong). This meant that the father could only leave his share of the house (70%) to the son (therefore Options C and D are incorrect)."}, {"ch": 6, "n": 6, "sc": ["A woman transfers £40,000 to her friend without explanation. There is no evidence of a gift or loan."], "st": "What does the law presume?", "o": ["The friend holds on constructive trust.", "The money is a loan repayable with interest.", "The friend holds on automatic resulting trust.", "The money is a gift.", "The friend holds the money on presumed resulting trust for the woman."], "a": "E", "x": ["Wrong. No unconscionable conduct is shown.", "Wrong. There is no evidence of a loan.", "Wrong. Automatic resulting trusts arise on failure of the beneficial interest.", "Wrong. There is no presumption of advancement between friends.", "Correct. A voluntary transfer to a stranger raises a presumption of resulting trust."]}, {"ch": 6, "n": 7, "sc": ["Trustees hold a fund 'for my nephew if he marries'. The nephew dies unmarried."], "st": "What happens to the fund?", "o": ["It passes to the nephew's estate.", "It is held on automatic resulting trust for the settlor or his estate.", "It passes to charity cy-près.", "It passes to the Crown as bona vacantia.", "The trustees keep it."], "a": "B", "x": ["Wrong. The nephew's interest never vested.", "Correct. The beneficial interest fails, giving rise to an automatic resulting trust.", "Wrong. This is not a charitable trust.", "Wrong. There is a settlor to whom it can result.", "Wrong. Trustees cannot benefit."]}, {"ch": 6, "n": 8, "sc": ["A father pays for a car registered in his adult son's name. There is evidence that the father intended the son to hold it for the family."], "st": "What is the likely position?", "o": ["The car is the son's absolutely because of the presumption of advancement.", "The presumption of advancement cannot be rebutted.", "The car is held on trust for the whole family equally.", "The car belongs to the father as legal owner.", "The presumption of advancement is rebutted by the evidence, so the son holds on resulting trust for the father."], "a": "E", "x": ["Wrong. The presumption is rebutted by evidence of intention.", "Wrong. It is rebuttable.", "Wrong. Nothing suggests equal shares for the family.", "Wrong. The son is the legal owner.", "Correct. Presumptions are rebuttable by evidence of actual intention."]}, {"ch": 6, "n": 9, "sc": ["A woman transfers money to her husband to buy shares in his name. There is no evidence of intention."], "st": "Which presumption applies?", "o": ["An automatic resulting trust.", "A presumption of advancement in favour of the husband.", "A presumed resulting trust in favour of the wife, as there is no presumption of advancement from wife to husband.", "A constructive trust in favour of the husband.", "No presumption applies between spouses."], "a": "C", "x": ["Wrong. There is no failure of the beneficial interest.", "Wrong. Advancement traditionally applies husband to wife, not wife to husband.", "Correct. The presumption of advancement does not apply to transfers from wife to husband.", "Wrong. There is no basis for a constructive trust.", "Wrong. The presumption of resulting trust applies."]}, {"ch": 6, "n": 10, "sc": ["A man transfers his flat to his brother to put it beyond the reach of his creditors. Later he wants it back, relying on a presumed resulting trust."], "st": "Following Patel v Mirza, what is the likely approach?", "o": ["The court will consider the policy behind the illegality and whether denying the claim is proportionate, rather than simply barring reliance on illegality.", "The claim succeeds automatically because the brother gave no consideration.", "The presumption of advancement applies between brothers.", "The flat passes to the creditors.", "The claim must fail because he cannot rely on his own illegality."], "a": "A", "x": ["Correct. In Patel v Mirza the Supreme Court replaced the old reliance-based approach with a range of factors approach.", "Wrong. Illegality must still be considered.", "Wrong. There is no presumption of advancement between siblings.", "Wrong. Creditors are not automatically entitled.", "Wrong. The old reliance-based approach has been replaced."]}, {"ch": 7, "n": 1, "sc": ["A man and a woman started dating. The woman bought a house and the man moved in with her. The house was paid for using her savings plus a mortgage. The man made no contribution to either the purchase price or the mortgage instalments. There were no discussions about sharing the house. The man was unemployed and received 'pocket money' from the woman. The woman later received an improvement grant from the council and she agreed with the man that he should carry out the work covered by the grant in return for her keeping him. The man carried out work worth more than £15,000 and claimed an interest in the house."], "st": "Which of the following best describes the man's entitlement to the house?", "o": ["The man can claim a proportionate share in the house by way of presumed resulting trust.", "The man can claim a 50% share in the house by way of common intention constructive trust.", "The man can claim a share in the house by way of proprietary estoppel.", "The man cannot claim a share in the house as the woman made him no promises.", "The man cannot claim a share in the house as he was already living rent free and receiving pocket money."], "a": "D", "bx": "The correct answer was D. There was no resulting trust in the man's favour as he did not contribute towards the purchase price or the mortgage instalments (therefore Option A is wrong). Option B is incorrect as there was no evidence of common intention to share giving rise to a common intention constructive trust. There was no promise giving rise to
