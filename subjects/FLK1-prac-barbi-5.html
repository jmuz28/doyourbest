s addressed to the firm, the principal method must be used: this means that it is the firm's expense and business money that must be used to pay the fee. The net amount of £5,000 will be noted on the business side of the client ledger (debit £5,000) and the VAT of £1,000 will be recorded on the firm's cash ledger and HMRC VAT ledger. The VAT of £1,000 will be added to the firm's overall bill to the client. The other answers are incorrect as they either use the wrong amount and/or are recorded on the client side rather than the business side."},{n:42,id:null,scenario:`A commercial lease contains the following tenant covenant:
"The lessor covenants not to assign the lease without the landlord's written consent".
The tenant wishes to assign the lease and has found a reliable prospective tenant, but the landlord does not like the prospective tenant because he supports Real Madrid, a football team which the landlord dislikes.`,q:"Does the tenant have any redress?",opts:["No, as this is an absolute covenant against assignment, the landlord can unreasonably withhold their consent.","Yes, even though this is an absolute covenant against assignment, the landlord cannot unreasonably withhold their consent.","No, as a landlord always has a right to withhold consent for any reason under the doctrine of freedom of contract.","Yes, as this is a qualified covenant against assignment, the landlord cannot unreasonably withhold their consent.","No, even though this is a qualified covenant against assignment, can unreasonably withhold their consent."],ans:"D",expl:`(D) The landlord would not be allowed to unreasonably withhold consent because the words 'without the landlord's written consent' make this a qualified covenant. With a qualified covenant, statute will assist the tenant and provides that the landlord cannot unreasonably withhold their consent, which the landlord appears to be doing. His dislike of a football team is not sufficient reason for him to refuse consent. (A) and (B) are incorrect because the words "without the landlord's written consent' make this a qualified covenant, as explained above. An absolute covenant would simply provide: "The lessor covenants not to assign the lease". (C) is simply incorrect; there is no such rule. (E) is incorrect, for the reasons explained above - because the language used is treated as a qualified covenant, consent cannot unreasonably be withheld.`,note:'The question ID is not visible in the source: a browser status bar covers the end of the explanation. The covenant is described as a tenant covenant but begins "The lessor covenants"; this is as shown in the source.'},{n:43,id:"CRL068",scenario:"A defendant was charged with driving without insurance. His lawyer explains that driving without insurance is a strict liability offence.",q:"Which of the following best describes what is meant by the phrase 'strict liability offence'?",opts:["An offence that is taken very seriously by the court.","An offence where the defendant need only be reckless to be found guilty.","An offence that consists of a mental element without a coincident act.","An offence which is complete by an actus reus alone.","An offence to which a defendant must plead guilty."],ans:"D",expl:"(D) Strict liability is defined as a criminal act that can be completed by the physical act (actus reus) alone and does not require any corresponding mental state (mens rea). As soon as a defendant does the act, the offence is complete. (A) is incorrect because no offence is defined in such a way. (B) is incorrect because the defendant's mental state at the time is irrelevant. It does not matter if he acts intentionally, recklessly, or completely innocently - he is liable. (C) is the reverse of strict liability and, therefore, incorrect. (E) is incorrect because whilst the prosecution does not have to prove any guilty knowledge or recklessness, they do have to prove the defendant did the act.",note:zi},{n:44,id:"CRP018",scenario:"A street robbery takes place in a crowded town centre. A shopper is at the scene of the robbery and goes to a nearby police station to provide a statement of what he witnessed. He describes the perpetrator as having a black hooded top, brown hair, and blue eyes. The police officer taking the statement goes back to the scene of the robbery with the shopper to see if the suspect is still in the vicinity. The shopper points out a person nearby who has a black hooded top, brown hair, and blue eyes and confirms that they are the perpetrator of the robbery. The suspect is arrested and subsequently denies the offence in interview.",q:"Should an identification procedure be held?",opts:["Yes, as the shopper has purported to identify the perpetrator.","Yes, as the suspect's appearance matches with the first description.","No, as the street identification constitutes identification by confrontation.","No, as the street identification means that the victim has recently seen the suspect and so there is no benefit in carrying out any further procedure.","No, as the street identification constitutes identification by group identification."],ans:"A",expl:"(A) An identification procedure should be held because the shopper has purported to identify the perpetrator. Identification procedures must be held when: (1) a witness has identified or purported to identify a suspect, (2) a witness expresses the ability to identify a suspect, or (3) there is a reasonable chance of a witness being able to identify the suspect. Here, the shopper has purported to identify the suspect. The sighting of the suspect in the vicinity of where the offence took place is not a formal identification. As the suspect is not known to the witness, a formal identification process should now take place. (B) is wrong as it is irrelevant whether the first description matched the appearance of the suspect; the key is that the shopper has purported to identify the suspect. (C) and (E) are incorrect because confrontation and group identification are two types of formal (if unusual) identification procedures that can be used once a suspect has been identified. Here, the suspect was not known at the time of the street identification, so the street identification was neither type of identification procedure. (D) is wrong as the suspect is not known to the witness, and so an identification procedure should still be held.",note:zi},{n:45,id:"LAN089",scenario:"A, B, and C purchased a property together in 2010. They all contributed equally to the purchase price and were all registered as joint proprietors. They held the property as beneficial tenants in common. A died in 2018. A buyer for the property has been found and a contract entered into for the sale.",q:"Which of the following best describes how the buyer's position should be protected in relation to his purchase?",opts:["The buyer should register an estate contract on the Land Charges Register.","The buyer should ensure that A's personal representatives join in the sale.","The buyer should ensure that a third trustee is appointed to overreach the beneficial interest.","The buyer does not need to do anything other than take a transfer from B and C as they are the surviving co-owners.","The buyer should ensure that a third trustee is appointed to override the beneficial interest."],ans:"D",expl:"(D) The buyer does not need to do anything other than take a transfer from B and C as they are the surviving co-owners. A buyer may take free of a beneficiary's interest under a trust through a legal process called overreaching. The purchase money is paid to at least two trustees, which transfers the interest of the beneficiaries from the land and attaches it to the money. Here, there are two surviving trustees, so the buyer can overreach the beneficial interest by taking a transfer from B and C and paying them the purchase money. (A) is incorrect because registration of an estate contract land charge is relevant to unregistered title, but here, title to the property is registered. (B) is incorrect because it is not a necessary step to protect the buyer's position. As explained above, the transfer by B and C, the surviving co-owners, is sufficient to overreach the behind-the-scenes beneficial interest. (C) is incorrect because only two trustees are required to give a valid receipt to effect overreaching. (E) is incorrect because the term 'override' is not relevant in this context."},{n:46,id:"ACC046",scenario:"A firm of solicitors has paid a disbursement of £250 for a client on receipt of a cheque from the client of £1,500 to be held on account of costs. Subsequently the firm is informed by its bank that the cheque has been dishonoured and the client account goes overdrawn.",q:"Which of the following statements is correct concerning the transaction?",opts:["There is no breach of the SRA Accounts Rules if the client account goes overdrawn.","There is a breach of the SRA Accounts Rules and the firm must terminate its relationship with the client as soon as is reasonably practicable.","There is a breach of the SRA Accounts Rules because the firm has drawn against a cheque before it has cleared.","The firm must promptly transfer £250 from the business account to the client account, to remedy the breach.","The firm must promptly transfer £1,500 from the business account to the client account, to remedy the breach."],ans:"D",expl:"(D) A firm must not withdraw more than the money that is held for that client. This is a breach of the SRA Accounts Rules and the firm must promptly, upon discovery, remedy this breach. (A) is incorrect because there is a breach of the Rules for the reasons set out above. (B) is incorrect because there is no obligation on the firm to cease to act for a client that provides it with insufficient funds. (C) is incorrect because there are no Rules that state a firm cannot draw against an uncleared cheque. This is poor practice however, and most firms will have systems in place to prevent this from happening. (E) is incorrect because the firm need only transfer the amount by which the client account is overdrawn.",note:zi},{n:47,id:"LAN012",scenario:"A property owner is concerned because his neighbour has decided to keep pigs on their land. The property owner believes this activity breaches a covenant entered into by the property owner's predecessor in title. The covenant states that there must be 'no noxious odorous or offensive activity' taking place on the neighbour's land.",q:"Which of the following is a condition that must be satisfied for the property owner to enforce the benefit of the covenant at law?",opts:["The property owner's predecessor in title must have once held the legal estate in the land to be benefitted as well as the land to be burdened.","The neighbour's land must be part of a building scheme of development.","The covenant must be positive in nature.","The covenant must be personal in nature.","The covenant must have been intended to run with the land held by the predecessor in title."],ans:"E",expl:"(E) One condition the property owner must satisfy is that the covenant must have been intended to run with the land held by the property owner's predecessor in title. Additionally, in order to enforce the benefit of the covenant at law, the property owner must show that (1) the covenant touches and concerns his land; (2) at the time the covenant was made, the property owner's predecessor in title held the legal estate in the land to be benefitted; and (3) the property owner now holds the legal estate in the land to be benefitted. (A) is incorrect because the property owner's predecessor in title did not need to have held both the legal estate in the land to be benefitted and the land to be burdened for the property owner to enforce the covenant. As explained above, the predecessor in title needed to have held only the legal estate in the land to be benefitted. (B) is incorrect because whether the neighbour's land is part of a building scheme may be relevant to enforcement of the covenant in equity, but the question asks about enforcement at law. (C) is incorrect because in addition to not being a relevant condition, positive covenants generally bind only the original contracting parties and are difficult to enforce. (D) is incorrect because the opposite is true: the covenant must not be personal in nature in order for the property owner to enforce it. In other words, the covenant must touch and concern the land to be benefitted."},{n:48,id:"WEA140",scenario:`An executor is administering the estate of a man who died recently. There are sufficient assets to pay off the man's debts, which comprise a mortgage of £50,000 and £10,000 of unsecured debts. The will makes the following gifts:
· A house (worth £100,000 and subject to a £50,000 mortgage) to the man's son, gifted "free from mortgage";
· A valuable watch (worth £50,000) to the man's brother;
· Quoted shares (worth £50,000) to the man's daughter; and
· The residuary estate (worth £100,000) to the man's wife.`,q:"How should the man's debts be funded from the estate?",opts:["The executor should pay the mortgage and other debts from the residuary estate.","The executor should pay the mortgage from the sale of the house and sell the watch to pay the other debts.","The executor should sell the house to pay off the mortgage and other debts.","The executor should pay the mortgage from the sale of the house and pay the other debts from the residuary estate.","The executor should use funds generated from the house, watch, shares, and residuary estate to pay off all debts on a proportionate basis."],ans:"A",expl:'(A) The executor should pay the mortgage and other debts from the residuary estate. This situation involves the payment of debts of a solvent estate, as there are sufficient assets to meet all liabilities. A secured debt, such as the mortgage on the house, should be paid from the asset against which it is secured, unless a contrary intention is expressed in the will. Here, the gift of the house is expressly made "free from mortgage". This means that the mortgage will be paid from the residuary estate. In addition unsecured debts should be paid from the residuary estate, rather than from specific legacies, such as the gifts of the watch and shares. Property specifically gifted in the will should not be used to pay debts unless other assets have been exhausted. Therefore, the residuary estate should be used to pay the mortgage and other debts. Accordingly, (B), (C), (D), and (E) are incorrect.'},{n:49,id:"PRP161",scenario:"An unmarried couple is pleased to receive an email from their solicitor confirming that their purchase of a freehold house has just completed. The solicitor has confirmed that she will remove the seller's legal charge from the charges register and will register a Form A restriction to reflect the fact that the buyers will hold the beneficial interest as tenants in common.",q:"When does title pass to the buyers?",opts:["Title passes on exchange.","Title passes when the Form A restriction is registered.","Title passes on registration.","Title passes on completion.","Title passes when the seller's legal charge is removed."],ans:"C",expl:"(C) If title to land is registered, title passes to the buyers on registration. Here, you are told that there is a charges register, so this title is already registered. Thus, title passes on registration. (A) is incorrect. Exchange merely creates the obligation to buy and sell; there is no passage of title at this time. (B) is incorrect. Title passes when the registration of the buyers as registered proprietors takes place. The registration of the Form A restriction deals with the beneficial interest as between the unmarried couple and is not relevant to the passing of title. (D) is incorrect. Title passes on completion if the title is unregistered, which is not the case here. (E) is incorrect. Removal of the legal charge does not have any effect on when title passes."},{n:50,id:"TRU134",scenario:"An artist and doctor, an unmarried couple, have been living together in a flat registered in the name of the doctor alone. At the time of the purchase, the doctor paid 30% of the purchase price, and the artist paid nothing. The remaining amount was raised by a mortgage on the property. Throughout their relationship the doctor repeatedly assured the artist that the flat should be considered both of theirs, but there is no written evidence of this. The parties have now separated, and the artist wants to claim an equitable interest in the property.",q:"Does the artist have a valid basis for claiming an interest in the flat?",opts:["Yes, because the doctor's statements show an intention that the artist should have an interest in the flat.","Yes, because the parties lived in the flat as a family home.","No, because there is no written declaration of trust in favour of the artist.","No, because the flat is registered in the name of one party alone.","No, because the artist paid nothing toward the purchase price."],ans:"A",expl:"(A) The artist has a valid claim for an interest in the flat because the doctor's statements show an intention that the artist should have an interest in the flat. When the non-legal owner attempts to assert an equitable interest in the family home, the court will impose a constructive trust in favour of the non-legal owner if the non-legal owner can establish that: (1) the parties had a common intention, either express or inferred, that the non-legal owner should have an equitable interest in the property; and (2) the non-legal party relied to their detriment on the common intention. To establish that the parties had an express common intention, the non-legal owner must show that there were actual discussions between the parties which led the non-legal owner to the belief that they should have an interest in the property. Here, the legal owner, the doctor, repeatedly assured the artist that the flat should be considered both of theirs. These statements show an express common intention that the artist should have a share in the flat. (B) is incorrect because the fact the parties lived in the flat as a family home is insufficient to show that the artist has a claim to the flat. (C) is incorrect because the court can impose a constructive trust in favour of the non-legal owner when there is no declaration of trust. (D) is incorrect because a non-legal owner can claim an interest in property through an express declaration of trust or by asking the court to impose a common intention constructive trust. (E) is incorrect because a non-legal owner can have an equitable interest in property despite not paying toward the purchase price."},{n:51,id:"LAN003",scenario:"A property owner enters into a written agreement by deed with a woman to let a flat to her. The agreement is for one year and provides for payment of £500 per month rent. It was intended that the woman live there on her own. Both parties signed the agreement. The property owner is keen to make sure that he can easily regain possession of the flat and so he has described the arrangement in the agreement as a 'licence to occupy'.",q:"Is a court likely to find the parties' agreement to be a licence?",opts:["No, because the arrangement has all of the hallmarks of a lease and the label given to the arrangement is irrelevant.","Yes, because that is what the agreement provides and the language in the agreement will be held to be conclusive.","No, because the agreement will be construed to be a tenancy at will because it is only for one year.","No, because the agreement will be construed to be a tenancy at sufferance because it is only for one year.","Yes, because an agreement to let for one year or less is considered to be a licence."],ans:"A",expl:"(A) The woman's occupation will be under the terms of a lease because the arrangement has all the hallmarks of a lease and the label given to the arrangement is irrelevant. There are three necessary characteristics for any lease or tenancy: (1) exclusive possession (2) for a fixed or periodic term certain (3) in consideration of a premium or periodic payments. If the substance of the arrangement between the parties is that a lease has been created, this will be conclusive, and the label given to it is not. Here, the woman has exclusive possession of the flat for a period of one year in consideration of a payment of £500 per month. Since these characteristics are present, the fact that the property owner has called it a licence does not prevent the arrangement from being a lease. (B) is incorrect because, as explained above, it is the actual arrangement that is the key, not what the parties have called it. So, the fact that the property owner has described it as a licence is not conclusive. (C) is incorrect because a tenancy at will is an arrangement whereby the tenant, with the owner's consent, occupies the land at the will of the owner who may terminate the tenancy at any time. Here, the agreement describes a fixed term of one year. (D) is incorrect because a tenancy at sufferance can arise when, after the expiry of a lease, the tenant continues in possession without the consent of the landlord, which is not the case here. (E) is incorrect because there is no such rule. It seems that the formalities for the grant of a legal lease have been complied with (the agreement was made by deed) but even if not, the woman would still have a lease rather than a licence due to the presence of the characteristics explained above."},{n:52,id:"PRP103",scenario:"A couple are purchasing a property and note from the Property Information Form that the seller built a garage at the property eight years ago. The buyer's local search reveals no planning permissions relating to this property.",q:"Can the local authority take enforcement action against the buyers after the purchase completes?",opts:["Yes, because the local authority has 10 years to take enforcement action for lack of planning permission.","No, because the time limit for enforcement action for lack of planning permission is one year.","Yes, because the local authority has unlimited jurisdiction to take enforcement action for lack of planning permission.","No, because the time limit for enforcement action for lack of planning permission is four years.","No, because the time limit for enforcement action for lack of planning permission is five years."],ans:"D",expl:"(D) The time limit for enforcement for unauthorised building work is four years, so the enforcement period passed four years ago, as the garage was built eight years ago. (A) is incorrect. A 10-year enforcement period applies to unauthorised material change of use and not to building without permission. (B) is incorrect as the one-year enforcement period applies to actions to enforce building regulations. (C) is incorrect as the unlimited jurisdiction time limit applies to when a local authority seeks an injunction to require an owner to bring a building up to the building regulations standards. (E) is incorrect because the period is four rather than five years.",note:zi},{n:53,id:"CRP106",scenario:"A defendant is convicted at trial in the Magistrates' Court of one charge of actual bodily harm ('ABH') and one charge of criminal damage, arising from the same facts. The magistrates proceed immediately to sentence.",q:"What is the maximum sentence the magistrates could impose on the defendant?",opts:["One month's imprisonment.","Three months' imprisonment.","Six months' imprisonment.","12 months' imprisonment.","A fine."],ans:"D",expl:"(D) The maximum sentence the magistrates could impose on the defendant is 12 months' imprisonment. Both ABH and criminal damage are either way offences. The Magistrates' Court can impose a maximum sentence of 12 months' imprisonment for two or more either way offences. For this reason, (A), (B), (C), and (E) are incorrect."},{n:54,id:"TRU053",scenario:"In her will a woman appointed three trustees to hold all her estate on trust for her son for life with remainder to his children in equal shares. One of the adult children wishes to raise a capital sum, and one of the trustees has offered to purchase the child's interest in remainder. The son and other trustees have indicated that they would consent to the purchase.",q:"Which of the following statements best describes the position of the trustee?",opts:["The trustee may not purchase the adult child's interest due to conflict of interest.","The trustee may purchase the adult child's interest because the other trustees have indicated that they would consent to the purchase.","The trustee may purchase the adult child's interest provided the trustee pays the full market value and makes full disclosure of all material facts.","The trustee may not purchase the adult child's interest because consent may not be obtained from the settlor.","The trustee may purchase the adult child's interest because the son consented."],ans:"C",expl:"(C) The trustee may purchase the adult child's interest provided they pay the full market value and make full disclosure of all material facts. The 'fair-dealing rule' applies to the purchase by a trustee of a beneficiary's interest. A trustee may purchase the interest of a beneficiary provided that the price is fair and that full disclosure of all material facts is made. Therefore, (A) is incorrect. (B), (D), and (E) are incorrect because consent need not be obtained from the co-trustees, the settlor, or another beneficiary."},{n:55,id:"LAN139",scenario:"A landlord and tenant entered into a new 10-year lease of commercial premises. On conclusion of the transaction, the tenant's solicitor paid the relevant stamp duty land tax on the lease, submitted a bill to their client and closed the file, and put the lease into storage. The solicitor took no further steps.",q:"What action should the solicitor have taken on completion of the lease?",opts:["The solicitor should have registered the lease at Her Majesty's Revenue and Customs.","The solicitor should have served notice of the lease on the landlord.","The solicitor should have placed a notice of the lease in the London Gazette as it was for 10 years.","The solicitor should have ensured that the tenant took a share in the management company.","The solicitor should have registered the lease at Her Majesty's Land Registry."],ans:"E",expl:"(E) A lease for seven years or more is registrable in its own right at HMLR, so the solicitor should have registered the lease to fully protect the tenant's interests. (A) is incorrect, as HMRC deals with tax, stamp duty land tax, and the like; it is not deal with registration of interests in land. (B) is incorrect, as this is the grant of a new lease by the landlord and, thus, notice would not need to be served on the landlord because the landlord would already know they have entered a lease with the tenant. If this had been an assignment of an existing lease, the landlord would have to be notified. (C) is incorrect, as there is no such requirement. (D) is incorrect, as there is no indication in the question that a management company was involved."},{n:56,id:"CRL112",scenario:"A football supporter is at a football match. She has bought some crisps to snack on and is sitting next to an aisle in the stadium waiting for the match to begin. As she waits, she starts throwing her crisps on the floor in boredom, to see how far she can make them go down the aisle. She foresees the risk that she might hit someone with a crisp and it is an unreasonable risk to take, but she continues throwing the crisps. One of the crisps lands on another spectator.",q:"Is the football supporter guilty of battery?",opts:["Yes, because she had indirect intention.","No, because she did not have direct intention.","Yes, because she was reckless.","No, because there was no direct application of force.","Yes, because of transferred malice."],ans:"C",expl:"(C) The football supporter is guilty of battery. Battery is the intentional or reckless application of unlawful personal force upon another person. The test for recklessness is whether the defendant foresaw the risk of the harm occurring and, in the circumstances known to the defendant, it was an unreasonable risk to take. Here, the football supporter foresaw the risk that the crisp might hit someone. There is no social utility in throwing crisps, so it is an unreasonable risk to take in these circumstances. (A) is incorrect because indirect intention is only available to specific intent offences and battery is a basic intent offence. (B) is incorrect because recklessness can also satisfy the mens rea requirements for battery. (D) is incorrect as battery can be committed by indirect application of force. (E) is incorrect as transferred malice does not apply where the offence intended and the offence committed are different."},{n:57,id:"TRU009",scenario:"A woman sends a signed letter to her son in which she states that she gives him her cottage, Greenacre, to hold on trust for the son's two daughters equally. The following week, the woman dies. Greenacre is still registered in her name. In her will she appoints her son to be her executor and leaves all her estate to a named charity.",q:"Is the trust of Greenacre valid?",opts:["No, because it is incompletely constituted.","Yes, because the son takes the legal title as executor.","No, because there is no written declaration of trust.","No, because there is no signed writing to prove its terms.","Yes, because the every effort test is satisfied."],ans:"B",expl:"(B) The trust is valid because the son takes the legal title as executor. The woman was attempting to create a trust of land with her son as trustee and his daughters as beneficiaries. The requirements for a valid declaration of trust are that the three certainties and the beneficiary principle must be satisfied and, where the trust property is land, the declaration and its terms must be supported by evidence in signed writing. Here, the letter to the son demonstrates certainty of intention (the son is to hold the property on trust), certainty of subject matter (Greenacre), and certainty of objects (the son's two daughters). The beneficiary principle is met as the two daughters are ascertainable human beneficiaries. In addition, the settlor must transfer the land to the trustee by means of a deed of transfer which must be registered at HM Land Registry. Where no such transfer is made, the trust is said to be incompletely constituted. Such a trust will usually fail unless one of the exceptions applies. The every effort test applies where the settlor has done everything required of her to complete the transfer of the legal title, and has put the property outside her control. The woman has not satisfied this test because she did not complete a deed transferring the legal title and deliver it to the trustee. A second exception is the rule in Strong v Bird which applies where the settlor makes an attempt to transfer the title which fails, her intention continues up to her death, and the intended trustee or donee acquires the legal title as her personal representative. All these requirements are met in this case. The letter was a failed attempt to transfer the legal title, and there is nothing to suggest that the settlor had changed her mind before she died. Therefore, the son takes the legal title as executor and holds Greenacre on trust for his daughters. (A) is incorrect because, although the trust is incompletely constituted, it does not fail. (C) is incorrect because there is no requirement for a declaration of trust to be in writing. (D) is incorrect because the signed letter is sufficient to prove the terms of the trust. (E) is incorrect because, as stated above, the every effort test is not satisfied."},{n:58,id:"TRU094",scenario:"A trust of successive interests has been created with one life tenant and one remainderman. The remainderman wishes to receive an advancement of capital.",q:"Which of the following best states the legal position with respect to the advancement?",opts:["The remainderman may not receive an advancement of capital.","The remainderman may receive an advancement of capital, but it is at the discretion of the trustees only.","The remainderman may receive an advancement of capital, but it is at the discretion of the life tenant only.","The remainderman may receive an advancement of capital, but it must be with the written consent of the trustees.","The remainderman may receive an advancement of capital, but it is at the discretion of the trustees and must be with the written consent of the life tenant."],ans:"E",expl:"(E) Trustees' power to advance capital is discretionary. When there is a trust of successive interests, any beneficiary with a prior interest must give their written consent to an advance. Therefore, an advancement of capital to a remainderman must be with the written consent of the life tenant. (A) is incorrect because the remainderman may receive an advancement of capital if the above requirements are met. (B), (C), and (D) are incorrect because the remainderman can receive an advancement at the trustees' discretion and with the written consent of the life tenant."},{n:59,id:"LAN129",scenario:"A man and wife purchased a house together in 1972. Both of their names appear on the proprietorship register, which contains no restrictions. The man has now died and the wife wants to sell the house and move to a smaller property.",q:"Is the wife entitled to sell the property?",opts:["No, because a second trustee must be appointed to overreach the husband's beneficial interest.","No, because the husband's interest in the property must first be passed to her by way of assent.","No, because the husband's personal representative must join in the sale.","Yes, because she has taken her husband's interest in the property by survivorship.","Yes, because her husband's interest in the property has passed to her by way of gift."],ans:"D",expl:"(D) The wife is entitled to sell the property because she has taken her husband's interest by survivorship. The proprietorship register indicates the current legal owners of a property, that is, the holders of the legal estate. The legal estate must be held as joint tenants and under a joint tenancy, if one of the co-owners dies, their interest passes to the survivor automatically by virtue of the doctrine of survivorship. A restriction is placed on the proprietorship register to indicate ownership by parties of the beneficial interest as tenants in common. Here, the husband and wife were both listed on the proprietorship register, indicating they held the legal estate as joint tenants. There were no restrictions on the proprietorship register indicating ownership of the beneficial interest as tenants in common. Thus, since the legal estate and beneficial interest was held as joint tenants, the wife took her husband's interest upon his death by virtue of survivorship and she is entitled to sell the property. (A), (B), and (C) are incorrect because, as explained above, the wife is entitled to sell the property on her own without the addition of a trustee or personal representative, and without taking any further action to acquire her husband's interest. Since the property was held as joint tenants, the wife automatically acquired her husband's interest upon his death and can sell the property on her own. (E) is incorrect because there is no suggestion on these facts that the property has passed to her by way of gift. As explained above, she has acquired her husband's interest upon his death by virtue of the doctrine of survivorship."},{n:60,id:"CRL083",scenario:"A woman is at the makeup display in the supermarket. She is thinking about problems she is having at work and some health troubles that are worrying her. She absent-mindedly picks up a lipstick. Whilst she is holding the lipstick, she receives a telephone call from her doctor. She unthinkingly puts the lipstick in her bag and walks out of the supermarket, forgetting to pay for the lipstick. When the woman later finds the lipstick in her bag, the woman decides it would be too embarrassing to take the lipstick back and so, deciding to keep it, she puts it in her makeup bag.",q:"Is the woman guilty of theft?",opts:["No, because she did not have the intent to steal when she picked up the lipstick.","Yes, she committed theft when she walked out of the supermarket without paying for the lipstick.","Yes, she committed theft when, deciding to keep it, she put the lipstick in her makeup bag.","Yes, she committed theft when she put the lipstick in her bag.","No, because she did not return the lipstick because she was embarrassed."],ans:"C",expl:"(C) The woman committed theft when she decided to keep the lipstick and put it in her makeup bag, as it is only at this stage that all the elements of theft are made out - dishonest appropriation of property belonging to another with intent to permanently deprive. Whilst the woman may have been motivated by embarrassment, there was a later appropriation here, as the woman has assumed the rights of the owner. She was at this stage dishonest because her actions are dishonest by the standards of a reasonable, honest person. (A) is incorrect because the theft was committed at the stage of deciding to keep the lipstick; as at the point of picking it up, there was no dishonesty. (B) and (D) are incorrect as again there was no dishonesty at the stage of walking out of the shop or putting it in her bag. (E) is incorrect, as whilst embarrassment may be natural, it does not remove the dishonesty from the action."}],xc="The scan captures this explanation out of order; it has been reassembled in reading order from the page image.",nk=[{n:61,id:"PRP227",scenario:`A woman is buying an old mansion house and has had a survey carried out. The survey states as follows:
'The property is a listed building which was extended seven years ago by the current owner to include a single-storey extension consisting of an attached conservatory at the rear.'
The woman's solicitor has conducted searches which have revealed no planning permissions or listed building consent relating to the property.`,q:"What advice should the woman's solicitor give in relation to this issue?",opts:["As the property is a listed building, the single-storey extension required both planning permission and listed building consent, but the time for enforcement has passed.","As the property is a listed building, the single-storey extension required only listed building consent, but the time for enforcement passed seven years ago.","As the extension referred to is only single-storey, it will fall within the permitted development rules, so no express planning permission or listed building consent was required to build the extension.","As the property is a listed building, the single-storey extension required both planning permission and listed building consent, and the local authority may bring an enforcement action at any time.","As the property is a listed building, the single-storey extension required listed building consent, but the time for enforcement passed one year ago."],ans:"D",expl:"(D) The solicitor should advise that because the property is a listed building, the extension required both planning permission and listed building consent, and the local authority may bring an enforcement action at any time. Listed buildings are buildings on a statutory list because of their special architectural or historical qualities. Most work to a listed building requires both planning permission and listed building consent. Building work would certainly require such consents and there is no time limit for enforcement. Thus, (A) is incorrect. (B) is incorrect, as the extension requires both planning permission and listed building consent. (C) is incorrect, as the permitted development rules do not apply to listed buildings. (E) is incorrect because it incorrectly provides that the enforcement period is six years.",note:'The explanation says (E) "incorrectly provides that the enforcement period is six years", but option (E) says the time for enforcement "passed one year ago". This is as shown in the source.'},{n:62,id:"CRP059",scenario:"A defendant is charged with actual bodily harm ('ABH') for tattooing his friend without his consent. The incident is alleged to have occurred at a party that both attended. The defendant's defence, as set out in his defence case statement, is that his friend consented. After charge, the prosecution obtained the friend's phone records, which indicate he sent the defendant repeated text messages after the alleged incident talking about how much fun he had at the party. The prosecution do not intend to rely on this evidence at trial.",q:"Are the prosecution under an obligation to disclose the text messages to the defence?",opts:["No, as the messages are evidence that the defence can reasonably be expected to collate themselves through the defendant's phone records.","No, because the prosecution do not intend to rely on the messages.","Yes, as the messages potentially undermine the prosecution case or assist the defence.","Yes, as the prosecution have a duty to disclose all material relating to the matter.","Yes, as it is in the interest of justice for the prosecution to disclose the messages."],ans:"C",expl:"(C) The prosecution are under an obligation to disclose the text messages to the defence. The prosecution have an ongoing duty to disclose any evidence that might reasonably be considered capable of undermining the prosecution case or assisting the defence. The text messages potentially undermine the prosecution case and therefore should be disclosed. (A) and (B) are incorrect as the prosecution are under an ongoing duty to disclose. (D) is incorrect as the duty to disclose does not extend to all material, only that which potentially undermines the prosecution or assists the defence. (E) is incorrect as the relevant test for disclosure is not the interest of justice."},{n:63,id:"PRP230",scenario:"A man is moving to a new town and is keen on purchasing a property he saw recently. The rear of the property has a large, open area of grassland on which the man would like to keep his horses. While viewing the property, however, the man was concerned to see a herd of goats grazing in this area, as well as several local children playing football.",q:"What will the solicitor acting for the man do to discover the nature of the activities which he observed?",opts:["The solicitor will carry out a public access search.","The solicitor will carry out a rights of common search.","The solicitor will carry out a commons registration search.","The solicitor will carry out a local search with no optional enquiries.","The solicitor will carry out an environmental search."],ans:"C",expl:"(C) The commons registration search is an optional part of the local search. It is used to discover whether the property abuts or is adjacent to a town or village green in common land, that is, it will discover land that is designated for public use. (A) and (B) are incorrect because there is no search with such names. (D) is incorrect. A local search has two parts: the first part reveals whether there are registrations by the local authority in the local land charges register. The second part is a standard set of enquiries of the local authority which include questions about roads fronting the property, public rights of way, and planning entries and building regulations relevant to the property. Although the commons registration search is part of the local search, it is optional and not part of the standard enquiries. (E) is incorrect, as the environmental search discovers issues such as former contaminative use of the land and flooding."},{n:64,id:"TAX019",scenario:"A wife uses £5,500 of her £12,500 annual personal allowance. Her husband's taxable income is £30,000 for the year. The couple have a son who lives with them and who made £20,000 in the same tax year.",q:"What, if anything, may the wife do with the £7,000 of personal allowance that she did not use?",opts:["The wife may not do anything with the unused £7,000 personal allowance.","The wife may transfer the unused £7,000 personal allowance to her husband.","The wife may transfer the unused £7,000 personal allowance to her son.","The wife may transfer £1,250 of the unused personal allowance to her husband.","The wife may transfer £1,250 of the unused personal allowance to her son."],ans:"D",expl:"(D) The wife may transfer £1,250 of the unused personal allowance to her husband. Effectively, the marriage allowance enables a basic rate taxpayer to transfer £1,250 of unused personal allowance to a spouse if the spouse also is a basic rate taxpayer. Here, with an income of £30,000, the recipient spouse is a basic rate taxpayer, and so the wife may effectively transfer £1,250 to her husband to reduce the husband's tax liability by £250 (20% of £1,250). Therefore, (A) is incorrect. (B) would be incorrect because only £1,250 can be used toward the allowance. (C) and (E) are incorrect because the allowance may be transferred only to a spouse or a civil partner."},{n:65,id:"CRL105",scenario:"A woman sets fire to a caravan and watches it burn to the ground.",q:"Which of the following would mean the woman was not guilty of the charge of aggravated arson?",opts:["The caravan belonged to the woman.","The woman had checked that there were no people inside or near the caravan before setting it on fire.","The woman has the consent of the caravan's owner to set it on fire.","The woman did not intend to endanger life.","No one was injured or killed as a result of the fire."],ans:"B",expl:"(B) The woman would not be guilty of aggravated arson if she had checked that there were no people inside or near the caravan. Arson is committing criminal damage by fire. Aggravated arson has all the elements of ordinary arson, but there is an additional mens rea requirement that the defendant must intend or be reckless as to the endangerment of life by the damage caused to the property. If the woman had checked that there were no people in or near the caravan, she would not have intended or been reckless as to the endangerment of life. (A) is incorrect as the property damaged can belong to the defendant or to someone else for aggravated arson. (C) is incorrect as the ordinary defences applicable to criminal damage do not apply. (D) is incorrect as recklessness will suffice for aggravated arson. (E) is incorrect as there is no requirement for death or injury to result; the additional requirement relates to mens rea rather than actus reus."},{n:66,id:"PRP167",scenario:"The buyer of a residential dwelling was due to complete their purchase of the property yesterday. However, their mortgage advance did not arrive on time, and completion did not take place. The buyer's solicitor received a notice to complete from the seller's solicitor at 4:30 PM yesterday afternoon.",q:"Within what timeframe is the buyer required to complete?",opts:["11 working days","9 working days","14 working days","10 working days","30 working days"],ans:"D",expl:"(D) The recipient has 10 working days (excluding the day of service) within which to complete following the service of the notice to complete. This notice was served yesterday (within office hours) so that was the day of service, thus leaving the 10 working days for the buyer to complete. Therefore, the remaining answers are incorrect."},{n:67,id:"WEA016",scenario:"A woman's valid will makes a gift of £30,000 to her brother. Two years after making the will, the woman crosses out the original gift and writes above it a gift of £20,000. She signs her name next to this amendment in the presence of two witnesses who then sign next to the amendment in the woman's presence. The wording relating to the original gift is no longer legible.",q:"Which of the following statements best describes the effect of this alteration?",opts:["The brother will receive £20,000.","The brother will receive £30,000.","The brother will receive nothing.","The amendment will invalidate the will and the intestacy rules will apply.","The brother will receive £50,000 in total."],ans:"A",expl:"(A) The brother will receive £20,000. An alteration made to a will after it is executed is valid if it was made with the same formalities required for a will - in writing and signed by the testator in the presence of two or more witnesses present at the same time who each sign in the presence of the testator. Here, the woman altered the gift to her brother in writing, signed it, and had it properly witnessed. This is a validly executed alteration to a will, so the brother will receive the revised gift of £20,000. (B) is incorrect. The original gift was validly altered. (C) is incorrect. The revised gift to the brother is valid, as the change was appropriately executed. (D) is incorrect. The alteration will not invalidate the will. (E) is incorrect. The brother will receive only one gift of £20,000."},{n:68,id:"CRP050",scenario:"A defendant appears in the Magistrates' Court charged with battery. The defendant earns minimum wage in a meatpacking warehouse and has no savings. He is of good character and is likely to lose his job if convicted.",q:"What are the defendant's options for representation in court?",opts:["A representation order can be granted if the interests of justice test is passed, or the defendant can privately fund his representation.","A representation order can be granted if the means test is passed, or the defendant can privately fund his representation.","A representation order can be granted if the interests of justice test is passed, but privately funding representation is not possible in the Magistrates' Court.","A representation order can be granted if the interests of justice test and the means test are passed, but privately funding representation is not possible in the Magistrates' Court.","A representation order can be granted if the interests of justice test and the means test are passed, or the defendant can privately fund his representation."],ans:"E",expl:"(E) A representation order can be granted if the interests of justice test and the means test are passed, or the defendant can privately fund his representation. (A) and (B) are incorrect as they include only part of the test for the grant of a representation order for publicly funded representation. The defendant must satisfy two requirements for an order to be awarded: the interests of justice test and the means test. Private funding is always an alternative to public funding, and so (C) and (D) are incorrect."},{n:69,id:"PRP231",scenario:"A woman is selling her property and has found an interested buyer. For the last five years, the woman has allowed her neighbour to take a shortcut across her land to reach a nearby park. However, this arrangement has never been formalised. A worn path has now been created in the rear of the property by the neighbour's regular crossing.",q:"Does the woman have a duty to disclose this use in the contract with the buyer?",opts:["No, because the use is a latent defect, and latent defects need not be disclosed.","Yes, because otherwise the woman would be liable for nondisclosure.","No, because the use is a patent defect and patent defects need not be disclosed.","No, under the doctrine of 'caveat emptor'.","Yes, because the use is a patent defect and patent defects must be disclosed."],ans:"C",expl:"(C) The woman need not disclose the use, as it is a patent defect. A right-of-way which is visible, such as the one in the question, is a patent defect. It does not need to be disclosed in the contract because the seller's duty of disclosure does not extend to patent defects. (Note that a prudent solicitor would advise the woman to disclose the right-of-way anyway - to avoid any possible misrepresentation claim - but disclosure is not actually required under the circumstances.) (A) is incorrect, both because the defect is patent (obvious) rather than latent (not obvious), and because the rule is the opposite of that stated - latent defects must be disclosed. (B) is incorrect because for the reasons just explained - disclosure is not required here, so non-disclosure will not result in liability. (D) is incorrect as the doctrine of 'caveat emptor' (that is, let the buyer beware) is the reason that the defect does not need to be referred to in the contract - because the defect is observable, the doctrine of caveat emptor applies and the buyer has the burden of discovering the defect. (E) is incorrect because it has the rule backwards - patent defects need not be disclosed, as discussed above."},{n:70,id:"LAN023",scenario:"A homeowner borrows £50,000 from a bank. The loan is secured by a second mortgage over the homeowner's house. The contractual date to redeem the mortgage is six months after creation of the mortgage. After six months, the homeowner is unable to repay the loan and falls three months behind in interest payments.",q:"Can the bank exercise a power of sale over the property?",opts:["No, because the bank has only a second charge over the property.","Yes, because six months have elapsed since the homeowner entered into the mortgage and the interest payments are more than two months in arrears.","No, because the power of sale has not become exercisable.","Yes, but only if the bank takes possession proceedings in the High Court.","Yes, provided that the bank secures the agreement of the first mortgagee."],ans:"B",expl:"(B) The bank may exercise a power of sale over the property because six months have elapsed since the homeowner entered into the mortgage and the interest payments are more than two months in arrears. A legal mortgagee has the power to sell a mortgaged property without the need to apply to a court, provided the contractual date set to redeem the mortgage has passed and other conditions, such as interest payments being more than two months in arrears, are satisfied. Here, the contractual date to redeem the mortgage was six months after the mortgage's creation. This date has now passed, the homeowner has not made interest payments for three months, and therefore the power of sale has become exercisable. (A) is incorrect because the fact that the bank has a second charge is irrelevant. A lender with a charge ranking behind another lender can still exercise a power of sale. Whether there will be any funds left after the sale to pay off the second charge is a concern for the second lender since the sale proceeds will be used to pay off the first charge before theirs. However, this is not relevant to whether the second lender has the right to exercise a power of sale. (C) is incorrect because, as explained above, the power of sale has become exercisable. (D) is incorrect because the bank will not necessarily need to take proceedings in the High Court. The venue for the proceedings will depend on the value of the claim, which is not provided in the facts. (E) is incorrect because it is irrelevant. The second mortgagee does not need to secure the agreement of the first mortgagee to exercise the power of sale, but the first lender will be paid first out of the sale proceeds due to the doctrine of priority of mortgages."},{n:71,id:"CRP028",scenario:"A defendant is standing trial in the Crown Court on a charge of theft. The defendant is age 20 and has no previous convictions. The defendant previously worked as a labourer on a building site for two years but is currently unemployed. The defendant has no affiliation with community or charity groups.",q:"Should the judge give the jury a good character direction in this case?",opts:["Yes, relating to both propensity and credibility.","No, as the defendant is unemployed.","No, as the defendant has no affiliation with community or charity groups.","Yes, but relating only to propensity.","Yes, but relating only to credibility."],ans:"A",expl:"(A) The judge should give the jury a good character direction in this case. If the defendant has no previous convictions, they are entitled to have the judge give a good character direction to the jury. A good character direction consists of two parts: the propensity direction and the credibility direction. The propensity direction is that a person of good character is less likely to have committed this offence. The credibility direction is that a person of good character is more likely to be credible where they assert their innocence either before or during trial. (B) and (C) are incorrect, as good character directions are available to any defendant with no previous convictions or other specific evidence of bad character. (D) and (E) are incorrect, as the defendant is entitled to both a propensity and credibility direction."},{n:72,id:"CRP114",scenario:"A 14-year-old child is convicted after trial in the Youth Court for criminal damage. The 14-year-old has one previous conviction for which he received a referral order.",q:"Which of the following best describes the court's power to make a referral order?",opts:["The court must impose a referral order, as it is the 14-year-old's second conviction.","The court may impose a referral order, as the 14-year-old has received a referral order before.","The court may impose a referral order, as it is the 14-year-old's second conviction.","The court cannot impose a referral order, as the 14-year-old is over the age of 12.","The court cannot impose a referral order, as the sentencing follows conviction after trial rather than a guilty plea."],ans:"E",expl:"(E) The court cannot impose a referral order on the 14-year-old because the sentencing follows conviction after trial rather than a guilty plea. Referral orders are not available when a defendant has pleaded not guilty to all charges and is convicted after trial. If a defendant pleads guilty to an imprisonable offence and it is their first offence, the court must impose a referral order. If the defendant pleads guilty to some offences but not guilty to others, a referral order may be imposed. Likewise, if the defendant has previous convictions, a referral order may be imposed. Here, the defendant has a previous conviction but has not pleaded guilty to any offences, so (A), (B), and (C) are incorrect. Referral orders are available to all defendants aged 10-17, so (D) is incorrect.",note:xc},{n:73,id:"WEA097",scenario:"A man and his brother died in an accident last month. The man's valid will appointed his brother, sister, and 14-year-old son as his executors. The man's wife and 18-year-old daughter are also alive.",q:"Who has the best right to apply for a grant of representation to the man's estate?",opts:["The sister only.","The sister and wife only.","The sister and son only.","The sister, wife, and daughter only.","The wife only."],ans:"A",expl:"(A) The sister should apply for a grant of representation (specifically, a grant of probate), as she is the executor named in the will. The man's brother is also named as an executor, but this appointment cannot take effect because he has died. Minors also cannot take a grant, so the 14-year-old son cannot apply. Therefore, (C) is incorrect. As the sister has the right to apply for the grant as an executor under the will, the other family members do not have the right to apply for a grant. If the man had died intestate or without appointing an executor in his will, other family members might be eligible to apply. Consequently, the man's wife and daughter have no right to a grant, and (B), (D), and (E) are incorrect."},{n:74,id:"WEA126",scenario:"A woman died six months ago, leaving her entire large estate to her partner who she met last year. She is survived by her daughters, aged 15, 27, and 35. The woman's daughters are bringing a claim against the woman's estate under the Inheritance (Provision for Family and Dependants) Act 1975. The 27-year-old daughter is disabled and lived with the woman who supported her care needs. The 35-year-old daughter works full-time and lives independently.",q:"What is the likely outcome of the daughters' claims?",opts:["All three daughters are likely to succeed in their claims.","Only the 27-year-old daughter is likely to succeed in her claim.","Only the 15-year-old daughter is likely to succeed in her claim.","None of the daughters is likely to succeed in their claims.","Only the 15-year-old and 27-year-old daughters are likely to succeed in their claims."],ans:"E",expl:"(E) Only the 15-year-old and 27-year-old daughters are likely to succeed in their claims. When hearing a claim under the Inheritance (Provision for Family and Dependants) Act 1975, the court will consider whether the will or intestacy has failed to make reasonable financial provision for the applicant. In the case of children, the standard applied is the financial provision required for their maintenance such that they can live decently and comfortably. This is measured objectively. Consequently, as the woman clearly maintained the 15-year-old daughter (as a minor) and the 27-year-old daughter (who is disabled and lived with the woman), they are likely to succeed in their claims for financial provision for future maintenance. In contrast, the claim of the 35-year-old is likely to fail, as she did not live with the woman, is employed full-time, and so is evidently able to maintain herself. Therefore, (A), (B), (C), and (D) are incorrect."},{n:75,id:"CRL117",scenario:"The bookkeeper for a veterinary practice withdrew £2,000 from one of the practice's bank accounts to pay the bookkeeper's rent for the month. The bookkeeper intended to replace the money a few days later once she had been paid.",q:"Which of the following would be the most appropriate offence with which to charge the bookkeeper?",opts:["Fraud by false representation.","Fraud by failure to disclose information.","Fraud by abuse of position.","Conspiracy to defraud.","Theft."],ans:"C",expl:"(C) The bookkeeper should be charged with fraud by abuse of position. A defendant commits fraud by abuse of position when she abuses her position in which she is expected to safeguard the financial interests of another. Here, the bookkeeper was in a position where she was expected to safeguard the veterinary practice's accounts. She abused that position by using the practice's funds to pay her own rent. (A) is incorrect because fraud by false representation requires a false representation, and nothing in the facts indicates any such representation was made. (B) is likewise incorrect because fraud by failure to disclose requires a failure to disclose information one is under a duty to disclose to make a gain for herself, and here there is no evidence of such a nondisclosure. (D) is incorrect because conspiracy requires an agreement and there was no agreement under the facts. (E) is arguably correct, but not as clearly as (C). Theft requires the taking of another person's property with an intention to permanently deprive the other of that property. It seems the bookkeeper wished to 'borrow' the money rather than permanently deprive the practice of it, and so (C) is the better choice."},{n:76,id:"CRP118",scenario:"A defendant is charged with section 18 grievous bodily harm ('s18 GBH') after hitting a person over the head with a glass bottle.",q:"Where will the defendant's case be tried?",opts:["Magistrates' Court because s18 GBH is summary only.","Magistrates' Court or Crown Court, depending on where the defendant elects trial.","Magistrates' Court or Crown Court, depending on whether the Magistrates' Court accepts jurisdiction.","Magistrates' Court or Crown Court, depending on whether the Magistrates' Court accepts jurisdiction and where the defendant elects trial.","Crown Court because s18 GBH is indictable only."],ans:"E",expl:"(E) The defendant's case will be tried in the Crown Court because s18 GBH is an indictable only offence and can be tried only in the Crown Court. (A) is wrong as s18 GBH is not summary only; it is indictable only. (B), (C), and (D) are wrong as s18 GBH is not an either way offence; it is indictable only. (Note that s20 GBH, which has a less culpable mens rea, is triable either way.)"},{n:77,id:"CRP129",scenario:"A defendant was convicted in the Magistrates' Court of possession of class A drugs and sentenced to a community order. The defendant wants to appeal her sentence to the Crown Court. Her solicitor advises against this, as it is the solicitor's advice that the sentence is commensurate with the seriousness of the offence.",q:"If the defendant decides to proceed on the appeal, could she receive a more serious sentence?",opts:["No, the Crown Court is restricted to the sentence imposed by the Magistrates' Court.","No, the Crown Court could only decrease the sentence or quash it entirely.","Yes, the Crown Court could increase the sentence imposed, but it is restricted to the Magistrates' Court's sentencing powers.","Yes, the Crown Court could increase the sentence imposed with no restrictions.","Yes, the Crown Court could increase the sentence by adding up to an additional 28 days in custody to the sentence imposed by the Magistrates' Court."],ans:"C",expl:"(C) The defendant could receive a more serious sentence. The Crown Court has the power to impose any sentence it wishes, but it is restricted by the Magistrates' Court's sentencing powers. This means the court has the power to increase the community order up to six months' imprisonment, the maximum the Magistrates' Court can impose for a single offence. (A) and (B) are incorrect because the Crown Court could increase the defendant's sentence. (D) is incorrect because the Crown Court is restricted by the maximum sentence the Magistrates' Court can impose. (E) is incorrect because the Crown Court can impose any sentence up to the Magistrates' Court's maximum.",note:xc},{n:78,id:"PRP201",scenario:"A solicitor in the pre-completion team of a conveyancing department has just received a purchase file - the client is buying an existing home. Contracts have exchanged. The solicitor has submitted their certificate of title to the mortgage lender and notes that there is an epitome of title on the file.",q:"What pre-completion searches must the solicitor carry out on this file?",opts:["A full land charges search and a bankruptcy search.","An official search with priority and a bankruptcy search.","No pre-completion searches are required under the circumstances.","An official search with priority and a company search.","A full land charges search and a company search."],ans:"A",expl:"(A) The solicitor must carry out a full land charges search and a bankruptcy search. The facts indicate there is an epitome of title on the file, which means the title is unregistered. Therefore, a full land charges search is required. The facts also indicate the solicitor has submitted a certificate of title to the mortgage lender. Because a mortgage lender is involved, a pre-completion bankruptcy search is required. Therefore, (C) is incorrect. (B) and (D) are incorrect because an official search with priority is carried out with respect to registered land, and here the land is unregistered. (D) is also incorrect along with (E) because the facts indicate the client is buying a home; generally, not something a company purchases."},{n:79,id:"ETH049",scenario:"A landlord and tenant are engaged in a dispute. Both parties want to instruct separate solicitors at the same firm because they each have prior relationships with these particular solicitors. The solicitors both work in the same branch office of the firm.",q:"Should the firm act for both parties?",opts:["Yes, because clients are free to instruct a solicitor of their choice.","No, on the basis of a conflict of interest.","No, because the solicitors both work in the same branch office of the firm.","Yes, provided the firm explains the risks to the parties and they give their written consent.","Yes, because the parties will be instructing different solicitors."],ans:"B",expl:"(B) There would be a conflict of interest if the firm acted on both sides of the dispute, so the firm must decline to act for both parties even if the parties agree to the firm acting. Neither of the exceptions to client conflicts apply to this situation. (A) is incorrect because there is a conflict of interest. (D) is incorrect because consent will not solve the conflict problem. (E) is incorrect because a conflict of interest covers the entire firm, not just individual solicitors within the firm. (C) is incorrect because the result would be the same even if the solicitors worked in different branch offices of the firm."},{n:80,id:"CRP094",scenario:`A witness is giving evidence for the defence in a trial for theft. The witness has provided an alibi to the defendant, and she has a previous conviction for theft herself. In examination in chief, unprompted, the defence counsel asks, "You were at your home with the defendant at the time of the theft, weren't you?". This is a matter in issue between the prosecution and defence, as the prosecution maintains the defendant was at the shop where the theft occurred.`,q:"What recourse, if any, does the prosecution have?",opts:["Because of the defence's leading question, the prosecution are entitled to ask leading questions in cross-examination as well.","The prosecution have no recourse, as the defence are entitled to ask leading questions during examination in chief.","The prosecution are entitled to object to the question because it is a leading question.","Because of the defence's leading question, the prosecution can seek to undermine the reliability of the witness's evidence.","Because of the defence's leading question, the prosecution can seek to undermine the integrity of the witness's evidence by adducing her previous conviction."],ans:"C",expl:"(C) The prosecution are entitled to object to the question because it is a leading question. Leading questions are not permissible during e[xamination in chief unless they] are regarding issues which are not disputed. (A), (D), and (E) are incorrect, as whilst the prosecution can ask leading questions during cr[oss-examination], undermine the quality of the evidence, and adduce the witness's bad character, none of these are related to the prosecution asking a lea[ding question …] the prosecution does have recourse.",note:"A pop-up window covers the right-hand end of three lines of the explanation in the source. The words in square brackets are inferred, and some covered text (including the reason given for (B)) cannot be recovered."},{n:81,id:"ETH023",scenario:"A solicitor attends a client at the police station who has been arrested and charged with murder. The client tells the solicitor that she committed the crime but intends to plead not guilty.",q:"Can the solicitor represent the client under these circumstances?",opts:["No, because the solicitor knows that the client is guilty.","Yes, because it is the job of the prosecution to prove the client's guilt.","Yes, provided the client does not make statements or give evidence asserting her innocence.","Yes, because the client's statement about her guilt is not relevant.","Yes, because the solicitor has a duty to act in the best interests of their client."],ans:"C",expl:"(C) Where, prior to the commencement of the court proceedings, the client admits to the solicitor that they are guilty of the charge, the solicitor can act further but only if the client does not put forward evidence in denial of guilt. (A) is incorrect because a client is entitled to plead not guilty and put the prosecution to proof of its case. (B) is incorrect because it is not the best answer; the statement is subject to the proviso that the client does not put forward misleading evidence. (D) is incorrect because the solicitor must respond to the information given by the client in a way that is compatible with the solicitor's ethical duties. (E) is incorrect because it assumes that the principle to act in a client's best interests takes precedence over the principle to uphold the rule of law and the proper administration of justice. Where these two principles conflict, it is the duty to uphold the law which takes precedence."},{n:82,id:"TRU084",scenario:"A trustee placed £15,000 of trust money into her own bank account, which had an existing balance of £1,000. She drew out £4,000 from the account to pay her rent and spent a further £1,000 on an emerald ring. The breach was discovered, and the trustee's creditors are bringing bankruptcy proceedings against her. The emerald ring is now worth £5,000, and the balance of £11,000 remains in the trustee's bank account.",q:"Which assets can be claimed for the trust in a proprietary claim?",opts:["The ring only.","£11,000 from the bank account only.","The ring and £10,000 from the bank account.","The ring and £11,000 from the bank account.","£11,000 from the bank account and a charge against the ring for £1,000."],ans:"D",expl:"(D) The ring and £11,000 from the bank account can be claimed for the trust in a proprietary claim. Where a trustee mixes trust funds with her own in a bank account, the trust may claim a charge over the account for the amount of trust money in it. When funds are withdrawn from the account, the trustee is treated as spending her own money first. Following this rule, the rent payment consisted of the trustee's £1,000 plus £3,000 of trust money. The ring was purchased with trust funds alone. Where a trustee purchases an asset with trust funds, the trust may claim the asset as representing trust property, or a charge over the asset for the trust funds it represents. In this case, the trust will choose to claim the ring as representing their lost £1,000 and will benefit from the rise in value of the ring. In addition, the trust can claim a charge over the bank account for the remaining £14,000 taken from the trust, and so will claim the whole balance of £11,000 left in the account. (The trust still has a personal claim against the trustee for the £3,000 of trust money spent on the trustee's rent but will rank alongside the trustee's other creditors in this claim.) (A) is incorrect because the trust may make a proprietary claim to the funds in the bank account. (B) is incorrect because the trust may claim the ring in addition to the money in the bank account. (C) is incorrect because the trust may claim the ring as representing only £1,000 of trust money. (E) is incorrect because the trust has the option of adopting the ring as representing £1,000 of trust money and so will claim the increase in value."},{n:83,id:"WEA083",scenario:"A woman died intestate three months ago. She was unmarried and had three daughters. The daughters are age 20, 19, and 15. The 19-year-old died last week from a serious illness, whilst the woman's estate was yet to be administered. The 19-year-old had made a valid will, knowing that she was unlikely to survive her illness.",q:"Which of the following best describes the beneficiaries' interests in the woman's estate following the death of the 19-year-old?",opts:["The 20-year-old daughter has a vested interest in the whole of the woman's estate.","The 20-year-old daughter and the 15-year-old daughter both have vested interests in one-half of the woman's estate.","The 20-year-old daughter has a vested interest in one-third of the estate, and the 15-year-old has a contingent interest in one-third of the woman's estate. The 19-year-old had a vested interest in one-third of the estate, which will pass in accordance with her will.","The 20-year-old daughter has a vested interest in one-half of the estate. The 15-year-old daughter has a contingent interest in one-half of the estate.","The 20-year-old daughter has a contingent interest in one-half of the estate. The 15-year-old daughter has a vested interest in one-half of the estate."],ans:"C",expl:"(C) The 20-year-old daughter has a vested interest in one-third of the estate, and the 15-year-old daughter has a contingent interest in one-third of the estate. The 19-year-old daughter had a vested interest in one-third of the estate, which will pass in accordance with her will. When a person dies intestate without a spouse or civil partner, the intestacy rules' strict order of entitlement applies to determine who will inherit the estate. As the woman was unmarried at the time of her death, her estate will pass to her issue on statutory trusts. The woman's issue are her three daughters. Therefore, each daughter is entitled to one-third of the woman's estate. As the 20-year-old and 19-year-old daughters are over 18, they have vested interests. Consequently, when the 19-year-old dies, she is able to pass on her share of the estate via her will. The 17-year-old has a contingent interest as she is under 18 and unmarried. (A), (B), (D), and (E) are incorrect because they do not, therefore, accurately reflect the application of the intestacy rules to this estate.",note:'The explanation refers to "the 17-year-old", but the youngest daughter in the facts is 15. This is as shown in the source.'},{n:84,id:"ACC037",scenario:"A firm has received a cheque from a client for £1,000. Part of the cheque is a payment of £700 by the client to the firm to be held on account of any future costs incurred on behalf of the client. The remaining sum of £300 is in payment by the client of the firm's latest bill for professional charges.",q:"Which of the following actions is the best way to deal with this payment?",opts:["Split the cheque by paying £300 into the client account and £700 into the business account.","Pay the whole amount into the client account without delay and transfer £300 from the client account to the business account within 21 days of receipt.","Pay the whole amount into the client account promptly and transfer £300 out of the client account and into the business account promptly.","Pay the whole amount into the client account wi
