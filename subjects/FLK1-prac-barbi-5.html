x?-1:s.x>l.x?1:s.y<l.y?-1:s.y>l.y?1:0),X1(i)}function X1(r){if(r.length<=1)return r.slice();const i=[];for(let l=0;l<r.length;l++){const u=r[l];for(;i.length>=2;){const h=i[i.length-1],d=i[i.length-2];if((h.x-d.x)*(u.y-d.y)>=(h.y-d.y)*(u.x-d.x))i.pop();else break}i.push(u)}i.pop();const s=[];for(let l=r.length-1;l>=0;l--){const u=r[l];for(;s.length>=2;){const h=s[s.length-1],d=s[s.length-2];if((h.x-d.x)*(u.y-d.y)>=(h.y-d.y)*(u.x-d.x))s.pop();else break}s.push(u)}return s.pop(),i.length===1&&s.length===1&&i[0].x===s[0].x&&i[0].y===s[0].y?i:i.concat(s)}var Z1=Tg,Ag=Cg;const J1=k.forwardRef(({className:r,sideOffset:i=4,...s},l)=>T.jsx(Z1,{children:T.jsx(Ag,{ref:l,sideOffset:i,className:ge("z-50 overflow-hidden rounded-md bg-popover px-3 py-1.5 text-xs text-popover-foreground animate-fade-in",r),...s})}));J1.displayName=Ag.displayName;const qp="The scan captures this explanation out of order; it has been reassembled in reading order from the page image.",ek=[{n:1,id:"PRP229",scenario:"A woman would like to purchase a house on a large plot of land. She intends to use the space in the rear of the property for a garden featuring her prizewinning roses. The woman has heard, though, that one of the property's neighbours has a right-of-way over the land in question which would prevent her from planting her garden. The woman's solicitor has sent her a copy of the register of title of the land.",q:"Where should reference to the right-of-way appear on the title?",opts:["The Proprietorship Register.","The Property Register.","The Charges Register.","The deed of easement which created the right-of-way.","The conveyance which created the right-of-way."],ans:"C",expl:"(C) The Charges Register. The woman is interested in purchasing land which is subject to the burden of a right-of-way because another property enjoys an easement over that land. The burden of a right-of-way would appear on the Charges Register of the burdened title. (A) is incorrect as the Proprietorship Register specifies the class of title held and the name of the current holder or holders of the legal estate. (B) is incorrect as the Property Register identifies the property by its postal address and reference to the title plan. It also specifies the legal estate held, and, if a leasehold, it will give brief details of the lease (date, parties, term, rent, et cetera). It also will indicate whether the property has any benefits (such as rights-of-way) over neighbouring land. (D) and (E) are incorrect because the facts ask specifically where the reference should appear on the title - and the question makes it clear that this is a registered title. It might be necessary to look at a conveyance or deed if the right-of-way is not yet registered."},{n:2,id:"PRP065",scenario:"A solicitor has received an email from a buyer client who is concerned that the father of the seller is living at the property. The solicitor has investigated the title and the seller is the sole registered proprietor.",q:"How is the buyer's position protected in this situation?",opts:["The solicitor acting for the buyer will seek confirmation from the seller's solicitor that the seller's father will sign the contract of sale as confirmation that they will vacate the property on completion.","The solicitor acting for the buyer will check the Property Information Form to be satisfied that the seller has disclosed their father as a non-owning occupier.","The solicitor acting for the buyer will advise their buyer client to carry out a physical inspection of the property.","The solicitor acting for the buyer will advise their buyer client to have a survey of the property carried out.","The solicitor acting for the buyer will seek confirmation from the seller's solicitor that the seller's father has received independent legal advice."],ans:"A",expl:"(A) The Special Conditions make provision for this and require a non-owning occupier to sign the contract of sale as evidence that they will move out of the property on completion. (B) is incorrect. Whilst the buyer's solicitor would expect to see the presence of the father disclosed on the Property Information Form, this does not in itself protect the buyer. (C) is incorrect. The buyer's solicitor will advise their buyer client to physically inspect the property, but this does not protect the buyer if the father chooses not to move out. (D) is incorrect. As is the case with the physical inspection, the buyer's solicitor will advise their client to have a survey of the property carried out, but this does not protect the buyer if the father chooses not to move out. (E) is incorrect. It would be prudent to seek confirmation that the seller's father has received independent legal advice, but of itself this does not protect the buyer. It is the signing of the contract by the non-owning occupier (in this case the father) which provides greater protection.",note:qp},{n:3,id:"ETH010",scenario:"A solicitor is acting for a client who is acquiring the interest of his co-owner in a jointly owned property. The co-owner is not represented by a lawyer even though the solicitor advised him at the outset to seek independent advice. The solicitor drafts the transfer document heavily in favour of his client and includes clauses that any reasonable solicitor would have removed. When the co-owner hesitates to sign the transfer document, the solicitor assures him that it is standard practice to include such clauses.",q:"Were the solicitor's actions in accordance with the SRA Standards and Regulations?",opts:["Yes, because the solicitor acted in the best interests of his client.","Yes, because the solicitor had previously advised the co-owner to obtain independent legal advice.","Yes, because the co-owner has made the choice not to be represented by a lawyer.","No, because the solicitor is likely to be taking unfair advantage of the co-owner.","No, because the solicitor acted despite an own interest conflict."],ans:"D",expl:"(D) A solicitor is under a duty not to take unfair advantage of clients or others. The opposing party's lack of legal knowledge where they have not instructed a lawyer means that unfair advantage might be taken in this situation. The suggestion in the fact pattern that a reasonable solicitor would have removed the clauses is sufficient to suggest that this might amount to unfair advantage. Assuring the co-owner that these were standard clauses is a clear breach. Therefore, (A) is incorrect. (B) is incorrect because although the solicitor was correct to advise the co-owner to take independent advice, this will not discharge him of the duty not to take unfair advantage if the co-owner chooses not to be represented. (C) is incorrect because although it was the co-owner's decision not to be represented, the solicitor still has a duty not to take unfair advantage of the co-owner's lack of legal knowledge. (E) is incorrect because there is no conflict of interest issue here. Rather, the solicitor breached the Code by taking advantage of an unrepresented party."},{n:4,id:"CRL065",scenario:"A teenager stole a car from his neighbour's driveway. The teenager was stopped for speeding, and the police discovered the car was stolen. The teenager was charged with theft which requires proof of intention to permanently deprive. At trial, the teenager raised as a defence that he intended to return the car before anyone realised it had been taken. The trial judge instructed the jury that, although the prosecution must prove each element of the offence beyond a reasonable doubt, the defendant has the responsibility to prove his defence on the balance of probabilities. The judge further instructed the jury that if the jury found on the balance of probabilities that the teenager intended to return the car, it should find him not guilty.",q:"Was the judge's instruction regarding the burden of proof correct?",opts:["Yes, because it is permissible to place on the defendant the burden of proving a defence on the balance of probabilities.","No, because the instruction placed an improper burden of proof on the defendant.","Yes, because in a criminal case the prosecution must prove all disputed issues beyond a reasonable doubt.","No, because the teenager's defence was a tacit admission, relieving the prosecution of its burden of proof.","Yes, because the instruction was correct as to both the prosecution's burden and the defendant's burden."],ans:"B",expl:"(B) The instruction was incorrect because it placed an improper burden on the defendant. In a criminal case, the prosecution has the legal and evidential burden to prove all 'elements' of the crime. Elements include the behaviour, result, and mental state found in the definition of the crime charged. This means the prosecution must raise these elements and provide sufficient evidence for each one (the evidential burden). Where the evidential burden is on the prosecution, it is always beyond a reasonable doubt. Because theft requires an intent to permanently deprive, the prosecution must prove that mental state beyond a reasonable doubt. By instructing the jury that the teenager had the burden of proving his intent to return the car, the judge relieved the prosecution of the burden of proving an intent to permanently deprive. Thus, (E) is incorrect. (A) provides a statement that usually is true - the defendant usually has the burden of proving a defence by the balance of probabilities - but not in this case, where that would result in relieving the prosecution of its burden. An intent to return the car would show a lack of intent to deprive permanently, which would negate liability. (C) is incorrect because it is too broad. The prosecution is not required to prove all disputed issues beyond a reasonable doubt, only the basic elements of the crime charged. (D) is incorrect because it, too, is too broad. The defence does serve as an admission of a taking, but the prosecution would still have to prove the other elements of theft, such as the intent to permanently deprive."},{n:5,id:"WEA055",scenario:`A man made a valid will 10 years ago. It includes the following provisions:
(1) I give my ABC plc shares to my friend's two daughters in equal shares.
(2) I give the remainder of my estate to my sister.
There are no other relevant clauses. The man died last month. The friend's younger daughter died last year, but the other daughter survives. The man's sister is also still alive.`,q:"How will the man's estate be distributed?",opts:["The man's sister will inherit the entire estate.","The friend's surviving daughter will inherit all of the ABC plc shares, and the man's sister will inherit the remainder of the estate.","The friend's surviving daughter will receive half of the ABC plc shares, and the other half of the shares will pass to the man's sister, who will also inherit the rest of the estate.","As a key beneficiary has died, the will is invalid due to lapse, so the whole estate will be distributed under the intestacy rules.","The ABC plc shares will pass via the intestacy rules, and the sister will inherit the remainder of the estate."],ans:"C",expl:`(C) The friend's surviving daughter will receive half of the shares, and the other half of the shares will pass to the sister as the residuary beneficiary (the man's sister) who will inherit the remainder of the estate. If a beneficiary has predeceased the testator, the gift to them will lapse - that is, fail. In the case of a gift to two or more people "in equal shares", the death of one of these beneficiaries will not entitle the surviving beneficiaries to receive the share of the deceased beneficiary. Here, therefore, the surviving daughter will receive half of the shares, but the other half of the shares will lapse and fall into the residue, passing to the man's sister as the residuary beneficiary. (A) and (B) are, therefore, incorrect. (D) is incorrect. The partially lapsed gift of shares will not affect the validity of the will itself. (E) is incorrect. Half of the shares will pass to the friend's surviving daughter under the will, and the other half of the shares will pass to the sister as part of the residuary estate. The intestacy rules will not apply.`},{n:6,id:"TAX130",scenario:"A sole trader has standard-rated sales of £80,000 (excluding VAT) and zero-rated sales of £15,000 for the quarter ended 30 June 2019. The sole trader has standard-rated expenses including VAT of £8,400.",q:"What is the sole trader's VAT liability for the quarter ended 30 June 2019?",opts:["£7,600","£11,933","£17,600","£14,320","£14,600"],ans:"E",expl:"(E) £14,600. The sole trader would owe VAT on the standard rates sales at a rate of 20% (20% x £80,000 = £16,000). No tax would be owed with respect to the zero-rated supplies. However, the sole trader may recover the VAT they paid in the quarter. The facts indicate that the sole trader's expenses for the quarter were £8,400 inclusive of VAT. To calculate the amount of the expense that was VAT, we divide the expenses by six (as one-sixth of the expense is VAT). £8,400/6 = £1,400. £16,000 - £1,400 = £14,600."},{n:7,id:"WEA006",scenario:"A man who was blind died recently. He made a will two years ago, leaving all of his assets to a friend. A neighbour has told the man's children that the friend exerted a lot of influence over the man and behaved in a controlling manner towards the man in the final years of his life. The man's children are upset not to receive anything under his will.",q:"Which of the following best describes whether the children can challenge the validity of the man's will?",opts:["The children can challenge the validity of the will if they can prove that the friend's actions amounted to coercion.","The children have no basis on which to challenge the validity of the will.","The children can challenge the validity of the will on the basis of lack of capacity.","The children can challenge the validity of the will if they can prove that the actions of the friend amounted to strong persuasion.","The children can challenge the validity of the will if they can rebut the presumption that the man acted with knowledge and approval when making the will."],ans:"A",expl:"(A) The children can challenge the validity of the will if they can prove that the friend's actions amounted to coercion. For a will to be valid, the testator must have acted with an intention to make the particular will. A challenger may prove lack of intention by showing the testator made the will as a result of duress (that is, as a consequence of a threat of force), due to fraud, or because of undue influence (meaning coercion or pressure overpowered the testator's free will). The children can, therefore, challenge the will on the basis of undue influence if they can prove that there was coercion or pressure that overpowered the freedom of action of the man. (B) is incorrect, as it may be possible to challenge the will on the basis of undue influence. (C) is incorrect. A will may be challenged for lack of capacity (that is, that the testator was unable to make decisions for themselves because of impairments of the brain). However, there is nothing to suggest that the man lacked capacity, and blindness does not affect a testator's legal capacity. (D) is incorrect. Strong persuasion does not constitute undue influence. A higher level of pressure or coercion is required. (E) is incorrect. The usual presumption of knowledge and approval does not apply here, as the man was blind. This will assist the children in challenging the validity of the will."},{n:8,id:"CRL052",scenario:"Two friends were watching football at their favourite pub. Each was a fan of a different competing team. The friends got into an argument about which team was better. Harsh words were exchanged. In an uncontrolled fit of rage, one friend broke a beer mug and slashed at the other's face with it. The friend being attacked twisted to avoid being hit in the face with the sharp glass, and it caught him in the neck, severing his jugular vein. The man died as a result and the attacker was charged with murder.",q:"Which of the following elements would the attacker not have to show to claim loss of control as a partial defence to the murder charge?",opts:["An abnormality of mental functioning.","His role in the killing resulted from some loss of control.","A qualifying trigger.","A hypothetical person of his age and gender might have reacted in the same way.","Fear of serious violence from the victim or things done or said constituting circumstances of such a grave character that it caused the defendant to have a justifiable sense of being wronged."],ans:"A",expl:"(A) Loss of control is a partial defence when the defendant kills another and (1) his acts and omissions in doing or being a party to the killing resulted from his loss of self-control, (2) the loss of self-control had a qualifying trigger, and (3) a person of the defendant's sex and age, with a normal degree of tolerance and self-restraint and in the circumstances of the defendant, might have reacted in the same or in a similar way to him. An abnormality of mental functioning is an element of diminished responsibility, not loss of control. All the other answer choices are part of the elements of loss of control."},{n:9,id:"TRU042",scenario:"A settlor appoints two trustees to hold funds on trust for her grandchildren, all under the age of 18. The trust deed contains no express powers dealing with the appointment of trustees. One of the trustees is undergoing medical treatment, and she appoints an attorney to act on her behalf for six months. During this period the trustee dies.",q:"Who has the power to appoint a replacement trustee?",opts:["The surviving trustee.","The settlor.","The deceased trustee's attorney.","The deceased trustee's personal representatives.","The beneficiaries."],ans:"A",expl:"(A) The surviving trustee has the power to appoint a replacement trustee. In the absence of express powers in the trust instrument, statutory provisions apply. Where a trustee dies, the surviving trustee has power to appoint a replacement. (B) is incorrect because there are no express powers in the trust instrument, so the settlor has no further power to appoint new trustees once the trust has been created. (C) is incorrect because the powers of an attorney come to an end when the principal dies. (D) is incorrect because a deceased trustee's personal representatives only have power to appoint new trustees when a sole trustee dies. (E) is incorrect because the beneficiaries do not have power to appoint new trustees. (If all the beneficiaries are of full age and capacity and together absolutely entitled, they may direct the trustees to retire and appoint new trustees of their choice, but this is not the case here.)"},{n:10,id:"TRU137",scenario:"A settlor created a valid trust to benefit her adult child for life with the remainder to her grandchildren. The settlor appointed three trustees, one of whom the beneficiaries have never liked. The settlor has recently died, and the beneficiaries would like to remove the trustee from office. The settlor's child is currently 58, and the grandchildren are aged 27 and 31. There is no person nominated in the trust instrument to appoint new trustees.",q:"Can the beneficiaries remove the trustee from office?",opts:["Yes, because all the beneficiaries agree that the trustee should be removed.","Yes, because trustees are obligated to keep the beneficiaries happy.","No, because beneficiaries have no power to remove or appoint trustees.","No, because trustees can be removed by the court only.","No, because the trustee was appointed by the settlor."],ans:"A",expl:"(A) The beneficiaries can remove the trustee from office because they all agree that the trustee should be removed. Beneficiaries have the power to remove a trustee from office when three requirements are met. First, there must be no person nominated in the trust instrument to appoint new trustees. Second, the beneficiaries must be of full age and capacity and, taken together, must be absolutely entitled to the trust property. Third, the beneficiaries must act unanimously. All of those requirements are met here, and so the beneficiaries can remove the trustee from office. (C) and (D) are, therefore, incorrect. (B) is incorrect because, although trustees are under a duty to manage the trust property for the beneficiaries, this does not mean they necessarily have to keep the beneficiaries happy. Furthermore, this duty does not give beneficiaries the power to remove trustees in all circumstances. (E) is incorrect because a trustee having been appointed by the settlor does not take away the beneficiaries' power to replace them."},{n:11,id:"CRL140",scenario:"A father takes his 9-year-old son to a deserted house. The father knocks on the door, and when there is no answer, he lifts his son up and pushes him through a small open window. On his father's instructions, the son picks up several items of jewellery. Then he goes to the front door and opens it to let his father in. Before the father can enter, the police arrive.",q:"Of which offence(s) could the father be convicted, if any?",opts:["None.","Burglary by trespass with intent only.","Burglary by offence committed following trespass only.","Both burglary by trespass and burglary by offence committed following trespass.","Aiding and abetting burglary only."],ans:"D",expl:"(D) The father could be convicted of both types of burglary. Here, the father can be liable for all offences as principal because he used an innocent agent; his son is beneath the age of criminal responsibility (10) and so cannot be criminally liable. A person commits burglary by trespass with intent when they knowingly or recklessly enter a building or part of a building as a trespasser with the intent to steal, inflict grievous bodily harm, or cause criminal damage. Here, the boy entered the property as a trespasser with intent to commit theft. A person commits burglary by offence committed following trespass when, after having entered the building as a trespasser, they commit or attempt to commit theft or inflict or attempt to inflict grievous bodily harm. Here, once the boy was inside the property, he committed theft by taking the jewellery. The father can be liable for both of these offences as principal. Therefore, (A), (B), and (C) are incorrect. (E) is incorrect, as the father is the principal."},{n:12,id:"CRL110",scenario:"A man drinks a bottle of whiskey whilst watching a football match and becomes extremely intoxicated. On his way home, he picks up a bottle from the street. He approaches a passerby and smashes the bottle on their arm, causing a deep gash. Police attend the scene. Upon arrest, the man punches the police officer in the face, giving him a black eye. The man is charged with s18 grievous bodily harm ('GBH') for the attack on the passerby and actual bodily harm ('ABH') for the attack on the police officer.",q:"Which best describes the effect of intoxication on both these offences?",opts:["ABH and s18 GBH are both basic intent offences, and so intoxication will not negate mens rea.","ABH is a specific intent offence so intoxication can negate mens rea, but s18 GBH is a basic intent offence so intoxication will not negate mens rea.","ABH is a basic intent offence so intoxication can negate mens rea, but s18 GBH is a specific intent offence so intoxication will not negate mens rea.","ABH and s18 GBH are both specific intent offences, and so intoxication can negate mens rea.","ABH is a basic intent offence and so intoxication will not negate mens rea, but s18 GBH is a specific intent offence and so intoxication can negate mens rea."],ans:"E",expl:"(E) Intoxication will not negate the mens rea of ABH, but it can negate the mens rea of s18 GBH. Voluntary intoxication cannot negate the mens rea of basic intent offences, but it can negate the mens rea of specific intent offences. Offences of basic intent are those which can be committed either intentionally or recklessly. Specific intent offences cannot be committed recklessly; intention is required for the offence to be committed. ABH can be committed either by assault or battery, and so ABH's mens rea is that of either assault or battery. The mens rea of assault is intention or recklessness regarding causing apprehension of immediate, unlawful violence. The mens rea of battery is intention or recklessness regarding the application of force. This means both forms of ABH can be committed recklessly, and so both are basic intent offences. By contrast, the mens rea of s18 GBH is intention to cause serious harm; the offence cannot be committed recklessly. This means s18 GBH is an offence of specific intent. For these reasons, (A), (B), (C), and (D) are incorrect."},{n:13,id:"TRU138",scenario:"In his will, an avid birdwatcher gave £70,000 to trustees on trust to invest and use the income for the support of the Society for the Protection of Birds. Shortly before his death, the society closed, and its remaining assets were given to another bird-related organisation.",q:"Which of the following best describes the legal position with respect to the trust?",opts:["The gift will be applied cy-pres for a similar purpose.","The trust fails and the trustees hold on resulting trust for the residue of the woman's estate.","The funds will be applied cy-pres if the court finds evidence of general charitable intention.","The trust fails because its terms breach the inalienability rule.","The trustees have discretion to use the fund for a similar purpose."],ans:"C",expl:"(C) The gift will be applied cy-pres if the court finds evidence of general charitable intention. Where a trust for a charitable purpose fails from the outset because it is impossible or impractical to carry out, the funds may be applied cy-pres to a similar charitable purpose provided that the testator has shown a general charitable intention. The court looks at the will as a whole to discern whether such an intention is present. The trust for the Society for the Protection of Birds is a charitable trust because it is for a charitable purpose, it is for the public benefit, and it is exclusively charitable. The purpose cannot be carried out, so the result will depend on whether general charitable intention can be found. (A) is incorrect because the application of the cy-pres doctrine in these circumstances depends upon the court finding evidence of general charitable intention. (B) is incorrect because the trust will not fail if general charitable intention can be found. (D) is incorrect because the inalienability rule does not apply to charitable trusts. (E) is incorrect because the application of the fund is not for the trustees to decide.",note:`Option (B) refers to "the woman's estate", but the testator in the facts is a man ("his will", "his death"). This is as shown in the source.`},{n:14,id:"CRP083",scenario:"A defendant is standing trial for handling stolen goods in the Crown Court. She was arrested following an illegally conducted stop and search and had been found to be in possession of some stolen items. The defence are making an application to have evidence of the items found in the defendant's possession excluded, as it is the result of an illegal search.",q:"What is the standard the court will use to decide whether this evidence is admissible?",opts:["The evidence may be excluded if it is reasonable to do so.","The evidence must be excluded if it is reasonable to do so.","The evidence may be excluded if it will have an adverse effect on the fairness of the proceedings.","The evidence must be excluded if it will have an adverse effect on the fairness of the proceedings.","The evidence may be excluded if it is in the interest of justice."],ans:"C",expl:"(C) The court may exclude the evidence if it would have an adverse effect on the fairness of the proceedings. The court's discretionary power to exclude evidence is often used when police officers have breached their duties under PACE in obtaining evidence. Evidence will be excluded if, considering all the circumstances, the admission of the evidence would have an adverse effect on the fairness of proceedings. This generally will be the case if the police's breaches are significant and substantial and have rendered the evidence unreliable. Breaches that may lead to evidence being excluded for unfairness include illegal searches, improperly conducted covert surveillance, and improperly obtained identification evidence. (A) and (B) are wrong as the test for exclusion is not reasonableness. (D) is wrong as the test is discretionary, not mandatory. (E) is wrong as the test is fairness, not the interest of justice."},{n:15,id:"LAN031",scenario:"A man agrees to sell his house to his friend for £220,000. They make the agreement orally over a cup of coffee.",q:"Do the parties have a valid contract for the sale and purchase of the man's house?",opts:["Yes, because the agreement involves an offer, acceptance, consideration, and intention to create legal relations.","No, because the agreement for a sale of land must be in writing.","Yes, because there is consensus ad idem between the parties.","No, because the parties are friends and so there is no intention to create legal relations.","No, because a deed is required to create or convey a legal estate or an interest in land."],ans:"B",expl:"(B) The parties have not created a valid contract for the sale and purchase of the man's house because the agreement for a sale of land must be in writing. To be valid, a contract for the sale of land must be in writing, signed by the contracting parties (or those with authority to sign on their behalf), and include all the terms to which the parties have agreed. Here, the agreement was made orally rather than in writing and therefore no valid contract was created. (A) is incorrect because though these are the four general requirements for a contract, as stated above, a contract for the sale of land must also be in writing. (C) is incorrect because it is a phrase to describe the state of mind of contracting parties but it is not relevant here as the parties' agreement was not in writing as required. (D) is incorrect because the fact that the parties are friends does not necessarily negate their intention to create legal relations. If the contract had been in writing, it could have been valid, despite the fact that the parties are friends. (E) is incorrect because while a deed is required to convey or transfer property on completion, a deed is not required for a contract for the sale of land. At this stage, the parties are agreeing to the sale and purchase of land, which requires only a valid written contract."},{n:16,id:"TRU016",scenario:"A settlor transfers land to trustees to hold on trust for his grandchildren. He prepares a written confirmation of the terms of the trust.",q:"Who must sign the written confirmation in order to create a valid trust of the land?",opts:["The trustees only.","The settlor only.","The trustees and the settlor.","The settlor and the beneficiaries.","The settlor or his lawfully authorised agent."],ans:"B",expl:"(B) A declaration of trust of land must be evidenced by some writing signed by the settlor. (A), (C), and (D) are incorrect because there is no requirement for the declaration to be signed by the trustees or the beneficiaries. (E) is incorrect because the statute does not permit signature by an agent on the settlor's behalf."},{n:17,id:"CRL099",scenario:"A woman discovers her husband has had an affair with another man by discovering lots of love letters from the man to her husband. The woman goes to the man's house early one evening to speak with him, taking with her the letters. She sees all the lights are out, so she assumes there is no one at home. The woman sets fire to the love letters and posts them through the letterbox before leaving. The woman expects the letters to burn out on the doorstep. In fact, the fire spreads to the carpet and the rest of the house. The man is asleep upstairs and dies.",q:"Is the woman guilty of manslaughter?",opts:["Yes, because she acted negligently.","Yes, because she acted recklessly.","Yes, because a reasonable person would have checked to see if anyone was at home.","Yes, because she has committed an intentional, dangerous, and unlawful act which caused the death of the man.","No, because she has not intentionally committed an unlawful act."],ans:"D",expl:"(D) The woman is guilty of manslaughter. There is no intention to kill or cause grievous bodily harm here, so voluntary manslaughter is not available. Likewise, there is no duty of care, so gross negligence manslaughter is not available. The only form of manslaughter that could apply here is unlawful act manslaughter ('UAM'). UAM requires an act that is intentional, unlawful, and dangerous that causes the death of the victim. To be 'unlawful', there must be an underlying criminal offence. Here, we have an act that is intentional (she deliberately sets fire to the letters, if not the house) and dangerous (posting burning items through the letterbox) that causes the death of the victim. The act is also unlawful because it is arson. The definition of arson is intentionally or recklessly damaging or destroying property belonging to another by fire. Here we have the intentional damage to her husband's love letters and the reckless damage to the carpet and house, which will satisfy the requirement. (A), (B), and (E) are incorrect because the woman intentionally set fire to the letters. (C) is incorrect because it is irrelevant whether a reasonable person would have checked to see if anyone was at home."},{n:18,id:"PRP122",scenario:`A solicitor in a busy conveyancing department has received the following email from a client who is buying a residential property:
'I have just received a copy of my mortgage offer. I understand that your firm will receive your copy tomorrow. I would like your advice on whether the interest rate and mortgage product are suitable for me. As you know, I don't know much about finance and would welcome your views! I am keen to know whether you think I'm getting a good deal!'`,q:"How should the solicitor respond to this email?",opts:["They should investigate current market rates and promptly answer the email to ensure that they give timely service to the buyer client.","They should forward the email to an independent financial adviser and ask them to comment directly to the buyer client because the conveyancing firm can only give generic advice.","They should prepare their firm's standard mortgage report promptly, and make sure it includes a paragraph answering the client's questions.","They should email the client promptly, declining to answer the questions raised and explaining that a conveyancing firm can give only generic comments on a mortgage offer.","They should delete the email because a conveyancing firm is not permitted to give specific advice on mortgage products."],ans:"D",expl:"(D) The solicitor should email the client promptly, declining to answer the questions raised and explaining that a conveyancing firm can give only generic comments on a mortgage offer. Under the financial services rules, solicitors cannot give advice about specific financial products such as mortgages and generally may give only generic advice. (A) is incorrect as such a course of action is prohibited. (B) is incorrect because whilst a solicitor may suggest that the client takes independent financial advice, they would breach the duty of confidentiality owed to the client if they simply forwarded the email without first obtaining their client's consent. (C) is incorrect for the reasons already explained - the form may not give the specific advice sought by the client. (E) is incorrect. Although it is true that the firm cannot give specific advice, there is no reason to delete the query from the firm's records."},{n:19,id:"WEA031",scenario:"A man passes away alone at home. Following his death, his will is found torn in half on the floor of his bedroom. His sister, who was the sole beneficiary of the will, seeks to claim her inheritance under it.",q:"Which of the following outcomes is most likely?",opts:["The will is conclusively revoked, as it has been destroyed.","The will is not revoked, as the will had not been disposed of in a bin.","The will is presumed to be revoked, as it was found mutilated after the man's death.","The will is not revoked, as there is no evidence that it was the man who tore up the will.","The will is not revoked, as the man did not burn or otherwise totally destroy the will."],ans:"C",expl:"(C) The will is presumed to be revoked because it was found mutilated after the man's death. A will may be revoked through its intentional destruction by the testator. If a will is found mutilated when the testator died, it is rebuttably presumed the testator mutilated the will with the intention to revoke it. Here, the will was found torn in half after the man's death, and so it is rebuttably presumed that he mutilated it with the intent to revoke it. (A) is incorrect because the presumption that the testator revoked the will is rebuttable; it is not conclusive. (B) is incorrect. Revocation by destruction does not require that the will be disposed of in a bin. (D) is incorrect because it is presumed that the man tore up the will. The sister can rebut this presumption. (E) is incorrect. A will can be revoked by burning, tearing, or otherwise destroying it. Therefore, tearing up the will can be sufficient to revoke it."},{n:20,id:"TAX174",scenario:`On 1 January 2021, a shopkeeper purchased a new commercial building for £600,000 plus £150,000 VAT. The stamp duty land tax rates for commercial buildings at the time were as follows:
· 0% up to £150,000
· 2% £150,001 - £250,000
· 5% of amounts over £250,000`,q:"What is the stamp duty land tax (SDLT) payable by the shopkeeper?",opts:["£27,000","£0","£17,500","£19,500","£24,500"],ans:"A",expl:"(A) £27,000. SDLT on a new commercial building is payable on the VAT inclusive price at the non-residential rates. Thus, the tax will be based on £750,000. Under the rates given, nothing is owed for the first £150,000, £2,000 is owed on the next £100,000 (2% of amount between £150,000 - £250,000) and £25,000 would be owed on the £500,000 purchase price above £250,000 (£500,000 x 5% = £25,000). £2,000 + £25,000 = £27,000."},{n:21,id:"TRU027",scenario:"A man and his son buy a house, contributing equally to the purchase price. The house is conveyed into the name of the son alone to enable his father to claim state benefits by concealing his assets, which the father has done. The father and son are now estranged, and the father wishes to claim a share in the house. There is no written evidence to support his claim.",q:"What is the likely result of the father's claim?",opts:["It will be up to the court to decide based on public interest.","It will succeed because the presumption of resulting trust applies.","It will fail because a trust of land requires signed written evidence to enforce it.","It will succeed because the father does not need to plead his improper intention.","It will fail because only the registered owner is entitled to land."],ans:"A",expl:"(A) If a property transfer was made as part of an illegal or fraudulent transaction, the court must decide whether it is in the public interest to allow a claim. The court would take into account all relevant factors, including the underlying purpose of the relevant law and the respective conduct of the parties. In these circumstances, the court would likely consider whether creditors have in fact been deceived, whether the son was aware of the scheme, and the effect on either party of allowing the man's claim. None of the other answer choices is as good as (A) because they each provide a definitive result. (C) is incorrect because the requirement that a declaration of trust of land be evidenced in signed writing does not apply to an implied trust, as would arise here if the court decides that is in the public interest. (E) is incorrect because, although the registered owner is entitled at common law, a claimant can establish an equitable interest under a trust."},{n:22,id:"TRU059",scenario:"A testator died leaving a will in which he left the residue of his estate to trustees on trust for his widow for life with remainder to his nephew, provided he attains the age of 25. The will contains no express powers. The widow is still alive, and the nephew is 17 and about to go to university. He asks the trustees to give him some of the income to help with his university fees.",q:"May the trustees use the income in this way?",opts:["No, because the nephew is under 18 and cannot give them a valid receipt.","No, because the nephew has only a contingent interest.","No, because the will contains no express powers.","No, because the trustees only have power to apply the income for the nephew's maintenance.","No, because the nephew has no interest in the income."],ans:"E",expl:"(E) The trustees cannot use the income to pay the nephew's university fees because he has no interest in the income. The power to pay or apply income for a beneficiary's maintenance, education, or benefit only applies where the beneficiary has an interest in the income. In this case, the income has been expressly given in the will to the testator's widow, and so the trustees must pay the income to the widow and have no power to use it for the benefit of the nephew. (A) is incorrect because, although a child under 18 cannot give a valid receipt, this is not the reason why the trustees cannot pay the income to the nephew. (B) is incorrect because the power to use income for a beneficiary's maintenance, education, or benefit does apply to beneficiaries with a contingent interest, but they also must have an interest in the income. (C) is incorrect because no express power would change the duty of trustees to pay the income to the beneficiary entitled to income under the will. (D) is incorrect because the nephew has no interest in the income. If he did, the trustees could use the income for the beneficiary's education or benefit, not just for his maintenance."},{n:23,id:"WEA045",scenario:'A woman made a will leaving a gift of "£5,000 to my grandchildren living at my death". The woman has recently died. The woman has two children and three grandchildren currently, aged 21, 16, and 12.',q:"Which of the following best describes how this gift will be distributed?",opts:["The gift is valid, but each grandchild will be entitled to share the gift only if they reach the age of 18.","The gift is valid, and the three grandchildren are entitled to share the gift now.","The gift is valid and will benefit both the current and any future grandchildren.","The gift fails because gifts of this type can never be valid as they unfairly exclude future grandchildren.","The gift is valid and will benefit both the current and any future grandchildren who reach the age of 18."],ans:"B",expl:`(B) The gift is valid, and the three grandchildren are entitled to share the gift now. A class gift is a gift of property to be divided among beneficiaries who fulfil a general description, and class closing rules apply to determine how and when a class gift should be distributed. However, the class closing rules are not necessary here because the will leaves the gift to the woman's grandchildren "living at my death". Therefore, it does not matter that grandchildren may be born in the future. The gift is expressly limited to the three current grandchildren, irrespective of their ages. (A) is incorrect. The provision in the will does not stipulate that the grandchildren need to reach the age of 18. (C) and (E) are incorrect. The gift expressly benefits only the three current grandchildren and does not extend to any future grandchildren. (D) is incorrect. Gifts of this type can be valid.`},{n:24,id:"ACC055",scenario:"A solicitor's client is selling their property. The solicitor received a deposit, as a stakeholder, in the form of a cheque for £20,000 from the firm representing the buyer in this transaction.",q:"Which of the following statements is correct with respect to the cheque?",opts:["The solicitor should place the deposit in the client's account, labelled as stakeholder money held for client and buyer.","The solicitor must post the cheque directly to the client.","The solicitor should immediately place the deposit in the business account for this client.","The solicitor must place the deposit in the client account and hold it for the client alone.","The solicitor must open a separate stakeholder account in the name of both buyer and seller."],ans:"E",expl:"(E) A solicitor must record for whom they hold client money. Thus, the solicitor must open a separate stakeholder account in the name of both buyer and seller. (A) is incorrect; it was allowed under the previous version of the SRA Accounts Rules, but it is not allowed under the current version of the Rules. (B) and (D) are incorrect as until completion, the money does not only belong to the client alone - it belongs to both the client and the buyer. (C) is incorrect, as this is client money and not business money because it is not money available for the use of the solicitor."},{n:25,id:"LAN119",scenario:"An equestrian enthusiast put their horse in a field near to their home 15 years ago. They have never spoken to anyone about their use of the field but have enclosed it with a fence and have kept it in good order. They have now decided that they should take steps to formalise the position because they own another two horses and want to be sure that they can continue to use the field. The owner of the horses went to see a solicitor who discovered that the title to the field is unregistered.",q:"What advice is the solicitor likely to give to their client?",opts:["The owner of the land could require the client to remove their horses and leave at any time.","The client could make an application for title to the land by adverse possession as they have been in occupation of the land for over 20 years.","The owner of the land will always be able to defeat any application for adverse possession, irrespective of the length of occupation of the land by the client.","The client could make an application for voluntary first registration of title to the land.","The client could make an application for title to the land by adverse possession as they have been in occupation of the land for over 12 years."],ans:"E",expl:"(E) In the unregistered system, it is possible to lose title if someone has occupied the titleholder's land exclusively, without permission, and unchallenged for at least 12 years. Here, the occupation was without permission, as the equestrian never spoke to anyone about the use. It has been 15 years, and there is no suggestion that the title or use has been challenged. An adverse possessor's right to the unregistered land is then superior to the interest of the previous owner. Therefore, (A) and (C) are incorrect. (B) is incorrect, as it is contrary to the facts. The possession has been for 15 years and not 20. Twenty years is the period for acquisition of a prescriptive right to use land. (D) is incorrect as voluntary first registration can be made only if the title deeds are held, which in this case is not the case here.",note:qp},{n:26,id:"PRP228",scenario:"A man has agreed to purchase a house from an acquaintance. Both parties are using the Contract Incorporating the Standard Conditions of Sale (5th edition - 2018 revision), unamended. Contracts were exchanged last week. This week, before completion, there was a fire in the area that spread to the house and completely destroyed it. Neither the buyer nor the seller had insurance on the property in place between exchange and completion. The man is unsure of his position and consults his solicitor.",q:"Is the man bound to proceed with the purchase?",opts:["No, because the property is not in the same condition that it was on exchange of contracts.","No, because risk in the property does not pass to the buyer until completion.","Yes, because title to the property passes to the buyer on exchange of contracts.","No, because the seller did not maintain insurance on the property after exchange of contracts.","Yes, because risk in the property passes to the buyer on exchange of contracts."],ans:"E",expl:"(E) The buyer is contractually bound to proceed with the purchase because under the standard conditions of sale, risk in the property passes to the buyer on exchange of contracts. This means that if the property is destroyed or damaged between exchange and completion, the buyer must still proceed with the purchase. (A) is incorrect because it is irrelevant that the property is not in the same condition as it was on exchange, because, as explained above, risk passed to the buyer on exchange. (B) is incorrect because, as explained above, risk in the property passes to the buyer on exchange (not on completion). (C) is incorrect because title to the property does not pass on exchange. If the land is unregistered, title passes on completion; if the land is registered, title passes when the purchase is registered. (D) is incorrect because the standard conditions do not require the seller to insure the property between exchange and completion. There is no requirement on the buyer to insure the property during this time, either, though given that risk passes to the buyer on exchange, it would be prudent for the buyer to do so. In practice, most properties are insured by both the seller and the buyer between exchange and completion."},{n:27,id:"CRP133",scenario:"Two suspects attend a solicitor's office. They have been jointly charged with grievous bodily harm ('GBH') and want the solicitor to represent them both. The suspects gave consistent accounts in police interview, both denying the offence and alleging mistaken identity. The solicitor believes the suspects are not guilty and wants to act for them both.",q:"Is the solicitor able to act for both suspects?",opts:["Yes, the solicitor can act for both suspects as long as there is no conflict between their accounts.","Yes, a solicitor can act for multiple suspects in the same matter regardless of their accounts.","Yes, a solicitor can act for multiple suspects when they sincerely believe the suspects did not commit the alleged offence.","No, the risk of a potential conflict of interest means the solicitor can act for only one of the suspects.","No, the risk of a potential conflict of interest means the solicitor should decline to act for either suspect now they have spoken to both."],ans:"A",expl:"(A) The solicitor can act for both suspects as long as there is no conflict between their accounts. A solicitor can act for more than one suspect or defendant in the same matter as long as there is no conflict between the accounts provided. If the accounts conflict, the solicitor must withdraw from representing at least one of the suspects or defendants. (B) is incorrect, as a solicitor cannot act for multiple suspects if their accounts conflict. (C) is incorrect, as there is no requirement that the solicitor sincerely believe the suspects' innocence. (D) and (E) are incorrect, as a solicitor can represent more that one suspect in the circumstances of this case."},{n:28,id:"TAX159",scenario:"In December 1999, a man purchased a house for £176,000. The man has always rented out the house to tenants. In December 2000, he installed a new bathroom at a cost of £6,400. In January 2021, he sold the house for £642,000. He also paid stamp duty land tax at 1% of the purchase price when he bought the house.",q:"What is the chargeable gain on disposal of the house?",opts:["£466,000","£459,600","£445,540","£457,840","£464,240"],ans:"D",expl:"(D) £457,840. On disposal of a chargeable asset, any purchase costs incurred at acquisition are deductible (for example, SDLT). The costs of any capital improvements are also deductible (for example, the new bathroom). The chargeable gain is always the gain pre-deduction of the annual exemption. So, it is sale price £642,000 - (£176,000 + £1,760 + £6,400) = £457,840."},{n:29,id:"WEA115",scenario:"A man died nine weeks ago, leaving a will in which his brother was appointed as his sole executor. The will leaves £50,000 to the man's son, who moved abroad many years ago and whose whereabouts are unknown. The executor has tried to locate the man's son but has failed. The residuary beneficiaries are pressurising the executor to distribute the £50,000 to them on the basis that the son is missing, but the executor is worried about his liability should the son try to claim his share of the estate in the future. The executor now plans to place advertisements to publicise the man's death in the London Gazette, a local newspaper, and a few other appropriate publications.",q:"How may the executor best protect himself against liability for a future claim from the son?",opts:["He should seek an indemnity from the residuary beneficiaries.","He should wait six months from the date of the man's death before distributing the estate.","He should seek a Benjamin Order.","He should wait at least two months from the date of the advertisements before distributing the estate.","He should wait six months from the issue of the grant of probate before distributing the £50,000."],ans:"C",expl:"(C) Seeking a Benjamin Order is the only way for the executor to gain full protection from a future claim by the son, a known beneficiary. A Benjamin Order is a court order giving the PRs leave to distribute the estate, taking into account the interests of a known claimant who cannot be found. (A) is incorrect. An indemnity provides some protection to the PR, but there is a risk that the beneficiaries might have insufficient funds to cover the indemnity payment. Consequently, this is not the best protection for the executor. (B) and (D) are incorrect. Placing advertisements will not protect against a claim from a known beneficiary. (E) is incorrect. Waiting six months would protect against claims under the Inheritance (Provision for Family and Dependants) Act 1975, which seek to challenge the estate distribution under the will. However, the son would appear not to be eligible to make such a claim, as he was not being maintained by his father, and here the risk is instead that the son will return and seek to claim the £50,000 left to him under the will."},{n:30,id:"LAN035",scenario:"A bank grants a £100,000 mortgage to a man to purchase a home. Title to the property is registered in the man's sole name. The man's wife contributed to the purchase price and lives at the property, but the bank was unaware of this when it granted the mortgage. The man is soon unable to keep up with the mortgage payments and the bank brings proceedings to repossess the property.",q:"Will the bank be able to force the wife to vacate the property upon repossession?",opts:["Yes, because the bank will obtain an order for possession naming the husband, which means the wife will have to vacate as well.","No, because the wife has an equitable interest.","Yes, because the bank will join the wife as a party in possession proceedings for non-payment of the mortgage and obtain an order for possession effective against her.","Yes, because the wife's name is not on the registered title to the property.","No, because the wife will have an overriding interest by virtue of her actual occupation of the property plus her contribution to the purchase price."],ans:"E",expl:"(E) The bank will not be able to force the wife to vacate on repossession because the wife has an overriding interest by virtue of her actual occupation of the property plus her contribution to the purchase price. If property is owned in the name of one party but there is someone else living at the property who has an interest in the property (such as a spouse who has contributed to the purchase price), courts are willing to allow the non-owning occupier to stay in occupation of the property, thus defeating the mortgagee's ability to repossess. (A) and (C) are incorrect because, as explained above, the wife has an overriding interest whether she is joined in the possession proceedings or not. The bank will take subject to her interest and will not be able to force her to vacate. (B) is incorrect because the wife does not have an equitable interest; she is not a tenant with an equitable tenancy. She has an overriding interest as an occupier with an interest in the land. (D) is incorrect because the wife's name need not be on the title for her to have an interest. Here, the wife contributed to the purchase price which gives her a beneficial interest in the property."}],zi="The scan captures this explanation out of order; it has been reassembled in reading order from the page image.",bc='The question screens for questions 31, 32 and 33 are missing from the source (the question screens jump from "30 of 90" to "34 of 90"). The options, answer and explanation come from the answer screen. The bracketed facts and question are inferred from the options and explanation and are not source text.',tk=[{n:31,id:"PRP133",scenario:"[Facts not shown in the source. From the options and explanation, a solicitor has acted for a buyer of a registered title with the aid of a mortgage, and completion has just taken place.]",q:"[Question not shown in the source: what should the solicitor do following completion?]",opts:["The solicitor should send a stamp duty land tax return and pay any tax due within 14 days and apply to register the change of ownership and mortgage at the land registry within two months of completion.","The solicitor should send a stamp duty land tax return and pay any tax due within 30 days and apply to register the change of ownership and mortgage at the land registry within two months of completion.","The solicitor should send a stamp duty land tax return and pay any tax due within 14 days and apply to register the change of ownership and mortgage at the land registry within the priority period of the official search.","The solicitor should prepare a schedule of the title deeds and apply to register the change of ownership and mortgage at the land registry within two months of completion.","The solicitor should prepare an epitome of title and apply to register the change of ownership and mortgage at the land registry within the priority period of the official search."],ans:"C",expl:"(C) The solicitor should send a stamp duty land tax (SDLT) return and pay any tax due within 14 days and apply to register the change of ownership and mortgage at the land registry within the priority period of the official search. An SDLT return is due within 14 days, and any tax due must be paid within that period. This is a strict deadline. And a solicitor should register a change of title and mortgage on registered land (the facts make it clear that this is a registered title) within the official search with priority time period (30 working days) or risk having an intervening interest registered that would be good against the buyer. (A), (B), and (D) include incorrect timescales. (E) is incorrect because the epitome of title (listing and giving copies of title documents) is prepared for unregistered land, and it is prepared by the seller's solicitor in the pre-contract stage.",note:bc},{n:32,id:"LAN081",scenario:"[Facts not shown in the source. From the options and explanation, a landowner has granted a legal easement by deed over the landowner's registered land (the servient tenement) for the benefit of a neighbour's land.]",q:"[Question not shown in the source: how will the burden of the easement be shown on the landowner's register of title?]",opts:["It will appear on the Charges Register.","It does not need to be registered as it does not benefit the landowner's land.","It will appear on the Property Register.","It will appear as a restriction on the Proprietorship Register.","It will be registered using form AN1."],ans:"A",expl:"(A) Legal easements are ones created by deed. The burden of a legal easement will appear as a notice on the Charges Register of the servient tenement (that is, the land burdened by the easement). Here, the landowner owns the servient tenement (the land burdened by the easement), so the burden will appear on the landowner's Charges Register. (B) is incorrect because the right must be registered as a burden against the servient tenement. (C) is incorrect because a right benefitting land appears on the Property Register. The benefit of the easement will appear as a notice on the Property Register of the grantee's register of title. (D) is incorrect because a restriction on the Proprietorship Register is not appropriate here. The Proprietorship Register indicates the current legal owners of the property. (E) is incorrect because form AN1 is used to register an agreed notice, which is not relevant here. An agreed notice does not require the consent of the registered proprietor (that is, the landowner), and is used to make an entry in respect of the burden of an interest affecting a registered estate or charge. It might be used, for example, to protect a buyer's interest in an estate contract.",note:bc+" The answer screens for questions 30, 31 and 32 appear twice in the source; they are included once."},{n:33,id:"WEA047",scenario:'[Facts not shown in the source. From the options and explanation, a woman made a will giving "my shares" to her daughter and the residue of her estate to her son. When she executed the will she owned shares in BT plc. When she died she no longer owned the BT plc shares but owned shares in HSBC plc and M&S plc and cash that she did not have when she executed the will.]',q:"[Question not shown in the source: how will the woman's estate be distributed?]",opts:["[The son will inherit the entire estate.]","The daughter will inherit the shares in HSBC plc and M&S plc, and the son will inherit the remainder of the estate.","The son will inherit the whole estate apart from the cash, as the woman did not have this money when she executed the will.","The daughter is entitled to ask the personal representatives to buy shares in BT plc for her, and the son will inherit the remainder of the estate.","The will is invalid, as the woman died owning different assets to those that she owned when she executed the will."],ans:"A",expl:`(A) The son will inherit the entire estate. The basic rule of succession is that a will speaks from the date of death unless a contrary intention is apparent in the will. Therefore, the will disposes of the assets owned by the woman at the time when she died, even though these are different from the assets that she owned when she executed the will. However, this basic rule will not apply if a contrary intention is apparent in the will. When a testator makes a gift of "my shares", they are normally taken to have shown an intention contrary to the basic rule. Instead, the testator intended for the beneficiary to receive the property as it was on the day of the will's execution and not on the day of the testator's death. Consequently, the gift of shares to the daughter will fail because the BT plc shares the woman owned when she wrote the will were not in her estate when she died. Therefore, the son will inherit the entire estate. (B) is incorrect. The gift of shares to the daughter will fail, and she will receive nothing. The son inherits the entire estate. (C) is incorrect. The will generally speaks from the date of death, so the cash will be covered by the gift of the residuary estate to the son even though the woman did not hold this cash when she executed the will. (D) is incorrect. The daughter is not entitled to ask the personal representatives to buy shares in BT plc for her. (E) is incorrect. Although particular gifts may fail, the will's validity is not impacted by the changes in the woman's assets after she made the will.`,note:bc+" Option (A) is cut off on the answer screen; its wording is taken from the first sentence of the explanation."},{n:34,id:"WEA074",scenario:"A woman died intestate last week. The woman was survived by a brother, half-sister, grandparents, and several aunts.",q:"Who is entitled to share in the distribution of the woman's estate?",opts:["The woman's brother only.","The woman's brother and half-sister.","The woman's brother, half-sister, and grandparents.","The woman's grandparents only.","The woman's brother, half-sister, grandparents, and aunts."],ans:"A",expl:"(A) Only the woman's brother is entitled to inherit the woman's estate. When a person dies intestate without a spouse or civil partner, the strict order of entitlement under the intestacy rules applies to determine who will inherit the estate. The order of entitlement begins with issue, parents, siblings of the whole blood, and then siblings of the half blood. In this situation, the woman's brother is entitled to all of her estate to the exclusion of all other relatives. The brother has priority over the woman's half-sister, who would be classified as a sister of the half blood. Accordingly, (B) is incorrect. (C) and (D) are incorrect for that reason and also because grandparents are entitled to share in an estate only if there are no living issue, parents, or siblings of the whole or half blood. (E) is incorrect for the reasons explained above; also, aunts and uncles come after grandparents in the order of entitlement."},{n:35,id:"CRP138",scenario:"A suspect has been arrested on suspicion of a number of high value burglaries. The investigating inspector has reasonable grounds to believe that, if permitted to inform someone of her arrest, the suspect will notify other parties involved in the burglaries and thereby trigger the removal of evidence from her property.",q:"Can the inspector prevent the suspect from informing someone of her arrest?",opts:["No, every person under arrest has the right to notify someone of their arrest.","No, only an officer of the rank of superintendent or above can prevent a suspect from informing someone of their arrest.","Yes, the right to inform someone of arrest can be refused entirely.","Yes, the right to inform someone of arrest can be delayed for a maximum of 36 hours.","Yes, the right to inform someone of arrest can be delayed for a maximum of 96 hours."],ans:"D",expl:"(D) The inspector can prevent the suspect from informing someone of her arrest for a maximum of 36 hours. A suspect has a right to have a friend, relative, or other person informed of their arrest. Delay is permitted only when: (1) the suspect is arrested on an indictable only or either way offence; (2) a police officer of the rank of inspector or above has authorised the delay in writing; and (3) the officer has reasonable grounds to believe that exercise of the right will lead to interference with evidence, interference with others, alerting other suspects, or hindering the recovery of property related to the offence. The right can be delayed a maximum of 36 hours and should only be delayed as long as necessary. Here the suspect was arrested for burglary, which is an either way offence. The officer believes the exercise of the right may lead to the interference with evidence. Therefore, the inspector can authorise the delay in writing for a maximum of 36 hours. (A) is incorrect, as it is possible to delay the right to notify a person of arrest in certain circumstances. (B) is incorrect because the officer must have the rank of inspector or above. (C) and (E) are incorrect, as 36 hours is the maximum by which the right to inform someone can be delayed."},{n:36,id:"CRL069",scenario:"A man is upset that his neighbour plays loud music late into the night. The man decides that as soon as the neighbour is gone, he will burn the neighbour's house down. The man purchased a petrol can, filled it, and brought it home. One evening, the music was silent. The man assumed his neighbour was gone for the night, and so he retrieved the can and some matches and walked toward his neighbour's house. He opened his neighbour's gate and started pouring petrol on the house. Fortunately, the neighbour was home and came outside when he heard his gate open. He tackled the man and prevented him from lighting a match to burn the house.",q:"Which of the following presents the earliest time at which the man could be found guilty of attempting to commit arson?",opts:["When the man purchased the petrol because that was the first step in preparation of completing the offence.","When the man walked through his neighbour's gate because he had taken a substantial step toward completing the offence.","When the man walked toward the neighbour's house with petrol and matches in hand, because that is more than merely preparatory towards completing the offence.","When the man decided to burn the house down, because that is when he formed the intent to commit the arson.","When the man poured the petrol on the house, because that satisfied the circumstance element of the offence but not the result element."],ans:"C",expl:"(C) The earliest the man could be convicted of attempt is when he walked toward his neighbour's house with petrol and matches in hand. Attempt is defined as an act which is more than merely preparatory in the commission of the offence. The man went beyond mere preparation when he started walking toward the neighbour's house with petrol and matches in hand. (A) and (D) are incorrect because doing a preparatory act or merely deciding to commit a criminal offence do not go far enough toward completion. (B) and (E) are incorrect because they are farther along in the man's actions than (C), and they state tests not used in the UK."},{n:37,id:"CRL060",scenario:"A father and his son were arguing on the front lawn of the son's house. The father, who was a bigger and slower man, attempted to end the argument by pushing his son as hard as he could. The son, fearful that his father would continue to escalate the fight as he had done in the past, tackled the father and pinned him to the ground, although the son could have easily escaped into his house.",q:"If the son is tried for common assault, what is his best defence?",opts:["The son did not attempt to hurt the father.","The son knew that the father had escalated fights in the past.","It was reasonable in the circumstances for the son to pin the father to the ground to prevent further violence.","The father started the fight first by pushing the son.","The son does not have to run off and can do anything he wants to prevent his father from hitting him again."],ans:"C",expl:"(C) The defence of self-defence is available to use against a charge of common assault if the defendant was being reasonable in protecting himself. (A) is incorrect because the focus is on whether the force used was reasonable and not on whether the force was used in an attempt to hurt. (B) is incorrect because it does not go far enough - that the son knew his father escalated things in the past makes the force reasonable only if we have a fact telling us the son believed the father would escalate things here. (D) is incorrect because it does not go to whether the force used was reasonable. (E) is incorrect because it goes too far; the son can do only reasonable things to prevent his father from hitting him."},{n:38,id:"LAN096",scenario:"A woman is about to commence proceedings for divorce from her husband. She does not hold a legal interest in the matrimonial home. Title to the home is registered at Her Majesty's Land Registry.",q:"Which of the following best describes how her home right should be protected?",opts:["A notice on the register of title.","A Class F land charge.","A restriction on the register of title.","A caution on the register of title.","No protection is available for this right."],ans:"A",expl:"(A) The woman's home right should be protected by a notice on the register of title. Rights of occupation enjoyed by a non-owning spouse or civil partner under the Family Law Act 1996 are protected by registration of the home right as a notice on the registered proprietor's register of title. A notice is an entry in the register in respect of the burden of an interest affecting a registered estate or charge. Here, title to the home is registered, so the woman's home right will be protected by a notice on the home's register of title. (B) is incorrect because registration of a Class F land charge is how the woman would protect her home right if title to the property were unregistered. Here, title to the home is registered. (C) is incorrect because a restriction is not the appropriate means of protection here. A restriction is used to prevent any dealing with land other than in accordance with the terms of that restriction. It is used, for example, to protect the beneficial interest of parties holding as tenants in common. (D) is incorrect because a caution on the register of title is not the appropriate method of protection here. A caution against first registration is used, for example, to protect a party's interest in unregistered land and ensure that the cautioner receives notification of an application to register the land. (E) is incorrect because, as explained above, protection for the woman's home right is available in the registered and unregistered system. Here, the woman will protect her interest with a notice on the register of title."},{n:39,id:"CRP121",scenario:"A woman witnessed a violent robbery in the street. She provided a statement to the police shortly after the incident, detailing events. She subsequently suffered a stroke and was taken to hospital where she remains. The suspected robber is now on trial.",q:"Will the prosecution be able to adduce the woman's written statement at court?",opts:["Yes, because the statement is not hearsay.","Yes, under the rule of res gestae.","Yes, because the woman is not available to attend.","No, as the prosecution could secure the woman's attendance via video link.","No, because the statement is hearsay."],ans:"C",expl:"(C) The prosecution will be able to adduce the woman's written statement because the woman is not available to attend. Hearsay is a statement made outside of court, which is adduced to prove the truth of its content. A written witness statement is therefore hearsay, and so (A) is incorrect. Hearsay can be admissible if the witness is not available. A witness is considered unavailable when they are dead, unfit owing to bodily or mental condition, or outside of the UK and it is not reasonably practicable to secure their attendance. Here, the woman having a stroke and remaining in hospital will satisfy the requirement for unavailability, and so (C) is correct. (B) is incorrect. Res gestae is also a category of admissible hearsay, and it refers to when a witness was so emotionally overpowered by the events at the time of making the statement that concoction can be disregarded (think of the content of a panicky 999 call, for example). Here, there is no suggestion of the witness being emotionally overpowered at the time of making the statement. (D) is incorrect as in these kind of circumstances where the witness is in ill health the written statement can be adduced. (E) is incorrect because the statement is hearsay.",note:'The source explanation says "(E) is incorrect because the statement is hearsay", although the statement is hearsay; the point is that it is admissible hearsay. This is as shown in the source.'},{n:40,id:"TRU120",scenario:"A trustee was appointed under a trust of concurrent interests with two equally entitled beneficiaries. The trustee removed £10,000 from the trust bank account and gave it to their cousin. The cousin remarked to the trustee that they were surprised at the gift as they thought the trustee had no money. The trustee merely winked in reply. The trustee is bankrupt, so a tracing claim has little or no value.",q:"Which of the following best states the legal position regarding the cousin's liability?",opts:["The cousin took the funds free of the interest of the trust beneficiaries because the cousin had no notice of the trust.","The cousin likely acted with conscious impropriety and should not retain the funds.","The cousin likely had sufficient knowledge of the circumstances such that it would be unconscionable for the cousin to retain the funds.","The cousin likely facilitated a breach of trust by being a dishonest accessory.","The cousin likely would be considered an innocent volunteer recipient."],ans:"C",expl:"(C) The cousin likely had sufficient knowledge of the circumstances such that it would be unconscionable for the cousin to retain the funds. A knowing recipient is a person who receives money or property traceable to a breach of trust with knowledge of the breach. The person must have sufficient knowledge as to make it unconscionable for the recipient to retain the property. Unconscionability will be found if the recipient's knowledge falls into one of the following categories: (1) actual knowledge, (2) wilfully closing one's eyes to the obvious, (3) wilfully and recklessly failing to make such inquiries as an honest and reasonable person would make, (4) knowledge of circumstances which would indicate the facts to an honest and reasonable person, or (5) knowledge of circumstances which would put an honest and reasonable person on inquiry. Here, the cousin thought that the trustee had no money, and the trustee merely winked when the cousin mentioned this. The cousin should have known that there was something suspicious about the money, and he would likely be considered to have wilfully closed his eyes to the obvious or at least have had knowledge that would put a reasonable person on inquiry. (A) is incorrect because it is part of the standard for bona fide purchasers. A person who acquires title to trust property for value and without notice of the trust takes the property free of the equitable interests of the beneficiaries. Here, the cousin received trust property for free and had knowledge of suspicious circumstances. (B) and (D) are incorrect because the cousin does not meet the definition of a dishonest accessory. A dishonest accessory is a person who dishonestly facilitates a breach of trust. Dishonesty is described as unconscious impropriety. Here, the cousin did not facilitate the breach of trust; the trustee had already removed it from the trust bank account. (E) is incorrect because an innocent volunteer recipient comes into possession of trust property with no knowledge or suspicion that a breach of trust has occurred. As explained above, the cousin had suspicions about the source of the money.",note:'The scan shows the first paragraph of the facts out of order; it has been put back in reading order. The explanation describes dishonesty as "unconscious impropriety", while option (B) says "conscious impropriety". This is as shown in the source.'},{n:41,id:"ACC058",scenario:"A solicitor is acting for a client on a corporate transaction. The client is registered for VAT. The solicitor receives an invoice for £5,000, plus £1,000 VAT. The invoice was addressed to the firm and is from a tax consultant who was used throughout the transaction. The solicitor pays this fee on its client's behalf.",q:"Which of the following entries is a correct entry to record this payment?",opts:["Debit £5,000 client ledger, client side","Debit £5,000 client ledger, business side","Credit £6,000 client ledger, business side","Debit £6,000 client ledger, client side","Debit £6,000 client ledger, business side"],ans:"B",expl:"(B) Debit £5,000 client ledger, business side. As the invoice i
