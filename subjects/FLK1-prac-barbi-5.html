thin 7 days of receipt and then transfer the amount of £300 out of the client account and into the business account within 7 days of transfer.","Split the cheque by paying £700 into the client account and £300 into the business account."],ans:"C",expl:"(C) The best way to deal with this cheque is to pay the whole amount into the client account promptly and transfer £300 out of the client account and into the business account promptly. When a cheque contains both business and client funds (mixed receipts), a firm has options: it can split the cheque, deposit the whole amount into the client account and then transfer the relevant amount into the business account, or deposit the whole amount into the business account and then transfer the relevant amount into the client account. Splitting a cheque is not popular with law firms, as banks can refuse to split cheques. Therefore, the best answer is to pay the mixed receipts into the client account and transfer business money to the business account (the choices do not provide for the other option, paying the mixed receipts into the business account first). The SRA Accounts Rules specify that the cheque must be paid into the client account promptly, and the transfer to the business account must be made promptly. (A) is incorrect as the split has been done incorrectly. The payment on account of fees of £700 should be paid into the client account and the £300 payment of the bill should be paid into the business account. In any event splitting cheques is not the best practice as banks may refuse to do this. (B) is incorrect as £300 of the payment is business money (as it was paid on account of the firm's bill for professional services) and so it must be transferred into the business account promptly - 21 days is not 'promptly' for a transfer to the business account. (D) is incorrect because 7 days is unlikely to be considered 'promptly' for the transfer of receipts into the client account. (E) is not the best practice as explained above.",note:"The question screen for this question appears twice in the source; it is included once."},{n:85,id:"LAN025",scenario:"A buyer completed the purchase of a piece of land with unregistered title last week.",q:"When does legal title transfer to the buyer?",opts:["Upon exchange of contracts.","When the money passes from buyer to seller.","Once the disposition is registered at Her Majesty's Land Registry.","Upon completion.","Once the agreement to buy and sell is made."],ans:"D",expl:"(D) The legal title in an unregistered transaction passes on legal completion (that is, the point in the transaction when the purchase price is paid by the buyer and the document of transfer is handed to the buyer's solicitor). (A) and (E) are incorrect because exchange is the point that the agreement to buy and sell is created and the completion date is set. But no title passes at this point in the transaction. (B) is incorrect because while a transfer of money may happen in conjunction with completion, the transfer alone is not determinative; the occurrence of legal completion is. (C) is incorrect because it describes when legal title passes in the registered system (that is, upon registration of the disposition at Her Majesty's Land Registry)."},{n:86,id:"CRL126",scenario:"It is a sunny day, and there are a lot of visitors at the local beach. Many of them put up windbreaks and leave their personal belongings alongside them whilst they bathe in the sea. A local man walks along the beach, looking for deserted windbreaks. Having found one, he rifles through the possessions left alongside it, looking for something to steal. The local man cannot see any items worth taking and so leaves without having taken anything.",q:"Which offence is the local man guilty of?",opts:["Burglary by trespass with intent.","Burglary by offence following trespass.","Theft.","Attempted burglary.","Attempted theft."],ans:"E",expl:"(E) The man is guilty of attempted theft. Theft is the dishonest appropriation of property belonging to another, with intention to permanently deprive the other of it. A person is guilty of attempting to commit an offence if they do something which is more than merely preparatory towards its commission and intend the completed offence to be committed. Here, the man rifled through others' possessions, looking for something to steal. The man has done acts which are more than merely preparatory, and so he is guilty of attempted theft. (A), (B), and (D) are incorrect because there is no burglary (or attempt at burglary), as a windbreak does not satisfy the requirement of a building or part of a building. (C) is incorrect because there is no completed theft, as the man did not take any item.",note:xc},{n:87,id:"LAN140",scenario:"A landowner has used a private water pipe which runs beneath his neighbour's land for 12 years. The landowner's title does not contain reference to any right to use the water pipe. The neighbour has just discovered the use and is threatening to cut off the water supply, claiming that the landowner has no right to use the water pipe. The landowner visits his solicitor for advice.",q:"What advice is the landowner's solicitor likely to give in this matter?",opts:["The landowner does not have a legal right to use the water pipe, nor has he acquired a prescriptive right to do so.","The landowner does have a legal right to use the water pipe because it is an essential service.","The landowner does not have a legal right to use the water pipe but has acquired a prescriptive right to do so.","The landowner does not have a legal right to use the water pipe but can require the water company to grant them the right to use the pipe.","The landowner does have a legal right to use the water pipe, as taking something from another's land amounts to a profit a prendre."],ans:"A",expl:"(A) The solicitor should advise that the landowner does not have a legal right to use the water pipe, nor has he acquired a prescriptive right to do so. There is no reference on the title to a right to use the water pipe, so no legal right to do so exists. The landowner would need to use the pipe without permission for 20 years to acquire a prescriptive right to do so. Here, though the use apparently was without permission (because the neighbour just discovered the use), it has been for only 12 years, so no prescriptive right has been acquired. (B) is incorrect, as the fact that a water supply might be considered an essential service does not confer a right to use a pipe under some else's property. (C) is incorrect for the reason already explained - 12 years' use is insufficient time to acquire a prescriptive right. Twenty years' use is required. (D) is incorrect, as a water company cannot grant rights to use private pipes running beneath privately owned land. (E) is incorrect for two reasons. First, a profit a prendre is a right to take something from the land of another such as wood; it is not the right to use someone else land; and second, to acquire a legal right, the right would need to be provided for by deed."},{n:88,id:"CRL119",scenario:"A statute was enacted with the express purpose of preventing civil servants from taking advantage of undocumented immigrants. It made it an offence to accept money in exchange for issuing such a person a driver's licence. During an undercover investigation, an immigrant was recorded offering £500 to a civil servant in exchange for issuing the licence. The civil servant agreed to the deal and later that day exchanged the licence for the money. At that point, both parties were arrested.",q:"Which of the following statements is correct regarding the criminal liability of the parties?",opts:["The civil servant can be convicted of committing the statutory offence and conspiracy to commit the statutory offence, but the immigrant cannot be convicted of any offence.","The civil servant can be convicted only of committing the statutory offence, but the immigrant cannot be convicted of any offence.","The civil servant can be convicted of committing the statutory offence and conspiracy to commit the statutory offence, and the immigrant can be convicted of conspiracy to commit the statutory offence.","The civil servant and the immigrant can both be convicted only of conspiracy to commit the statutory offence.","Neither the civil servant nor the immigrant can be convicted of any offence."],ans:"B",expl:"(B) The civil servant can be convicted only of committing the statutory offence, but the immigrant cannot be convicted of any offence. One cannot be convicted of conspiracy to commit a crime where he is the intended victim and the offence involved is one designed to protect that person. Here, we are told that the purpose of the statute is to prevent civil servants from taking advantage of undocumented immigrants. Neither can the civil servant be convicted of conspiracy because one cannot conspire with the intended victim. Therefore (A), (C), (D), and (E) are incorrect."},{n:89,id:"CRL106",scenario:"A man discovers that his wife has a lover. He goes to the lover's house, intending to speak with him. He knocks on the door, but there is no answer. He sees an open window and climbs inside the house. He calls out for the lover but realises that he is out. The man looks around the house to see what he can discover. He finds a permanent marker pen. He writes on the wall 'cheating scum', puts the pen down, and then leaves the house by the window.",q:"Is the man guilty of burglary?",opts:["Yes, because the man committed criminal damage after having entered as a trespasser.","Yes, because burglary was committed when the man entered as a trespasser with malicious intent.","No, because the man can plead provocation.","No, because the man lacked mens rea at the point of entry and did not commit an underlying offence after entry.","No, because theft is necessary for burglary to be committed."],ans:"D",expl:"(D) There are two types of burglary, and neither is made out here. Both types require that the defendant knowingly or recklessly enters a building as a trespasser. The first is committed at the point of entry to the property as a trespasser if the defendant intends to steal, commit grievous bodily harm ('GBH'), or commit criminal damage. Here, at the point of entry, the man does not intend to commit criminal damage. The second type of burglary involves the commission of an underlying offence after having entered the building as a trespasser. The underlying offences are theft, attempted theft, GBH, or attempted GBH. The man did not commit any of these underlying offences. (A) is incorrect as criminal damage is not an underlying offence for burglary. (B) is incorrect as there is no requirement for malicious intent. (C) is incorrect as provocation is not a defence known in law. (E) is incorrect as other offences can underlie burglary as well."},{n:90,id:"ETH016",scenario:"During a telephone conversation, a secretary in a solicitor's firm told the solicitor on the other side of a transaction that the secretary would use their best endeavours to arrange for the £10,000 to be sent by bank transfer that day to complete a transaction, but said that her statement was not intended to be an undertaking. After their conversation the solicitor on the other side notified her client and took various administrative steps to prepare to close the file. The £10,000 was not sent. The solicitor on the other side is now demanding the money and accusing the secretary's firm of being in breach of undertaking.",q:"Is the secretary's firm in breach of undertaking?",opts:["Yes, because the secretary said that the £10,000 would be sent and it was not.","No, because the secretary indicated that her statement was not intended to be an undertaking.","No, because an undertaking can only be given by a solicitor.","Yes, because the transaction did not complete.","No, because the secretary did not use the word 'undertake' when she said the £10,000 would be sent."],ans:"B",expl:"(B) The secretary's firm is not in breach of undertaking because the secretary said that she did not intend to give an undertaking. (A) is incorrect because her statement was not intended to be an undertaking, so the firm cannot be in breach. (C) is incorrect because an undertaking does not have to be given by a solicitor. (D) is incorrect. The transaction did not complete, but this is irrelevant as there was no undertaking. (E) is incorrect. It is true that no undertaking came into existence, but that is because the secretary said that she did not intend to give one, not because her original statement was not specifically expressed as an undertaking. Even if she did not use the word 'undertake', the secretary could have created an undertaking by telling the solicitor that the money would be sent."}],rk=[...ek,...tk,...nk],ok="Simulated Exam Part 4 (FLK1) — Questions and Answers",hr=rk,ik=["A","B","C","D","E"],sk={CNL:"Constitutional & Administrative Law",DIS:"Dispute Resolution",ELS:"Legal System of England & Wales",TRT:"Tort",TAX:"Taxation",LGS:"Legal Services",ETH:"Ethics & Professional Conduct",BSL:"Business Law",CTR:"Contract",PRP:"Property Practice",LAN:"Land Law",TRU:"Trusts",WEA:"Wills & Administration of Estates",CRL:"Criminal Law",CRP:"Criminal Practice",ACC:"Solicitors' Accounts"},jc=r=>r?sk[r.slice(0,3)]??"Other":"Not stated";function ak({item:r,showAll:i,selected:s,revealed:l,onSelect:u,onToggleReveal:h}){const d=i||l,f=s&&r.ans&&s===r.ans;return T.jsxs("article",{id:`q${r.n}`,className:"rounded-lg border border-border bg-card shadow-card overflow-hidden",children:[T.jsxs("section",{className:"question p-5",children:[T.jsxs("header",{className:"flex flex-wrap items-center gap-2 mb-3",children:[T.jsxs("h2",{className:"text-lg font-semibold text-foreground",children:["Question ",r.n]}),T.jsx("span",{className:"text-xs text-muted-foreground",children:"of 90"}),T.jsxs("div",{className:"ml-auto flex gap-2",children:[T.jsx(ur,{c
