uently arranges for the client to buy some stocks in a company and completes all of the necessary paperwork on the client's behalf. The solicitor receives a fee of £100 for referring the client to the stockbroker. The solicitor decides to keep the fee but does not disclose this to the client."], "st": "Has the solicitor complied with the relevant SRA Financial Services (Conduct of Business) Rules 2001?", "o": ["Yes, because the solicitor received a payment from someone other than the client.", "No, the solicitor can rely on the introducing exemption.", "Yes, because the solicitor has not charged the client the £100 fee.", "No, the solicitor is entitled to receive financial benefits in exchange for such referrals.", "No, the solicitor must disclose the referral fee to the client."], "a": "E", "bx": "The correct answer was E. Under the SRA Conduct of Business Rules, solicitors are required to disclose such fees (eg referral fees) paid to the solicitor by a third party. Option D is incorrect because there is a requirement for the solicitor to disclose such fees to the client. Option C is incorrect because the fact the solicitor has not charged the client for the referral is irrelevant. Option A is incorrect because the solicitor did not disclose the referral fee to the client. Option B is incorrect because the 'introducing' exemption would not apply here as the solicitor received a fee, which was not disclosed to the client."}, {"ch": 6, "n": 6, "sc": ["A solicitor is not FCA authorised and works at a firm that is not FCA authorised. A client asks for a recommendation on which specific unit trust to buy."], "st": "Without an applicable exclusion or exemption, would the solicitor breach the general prohibition by giving the advice?", "o": ["Yes, because advising on the merits of buying a specific investment is a regulated activity.", "No, because unit trusts are not specified investments.", "No, because solicitors are exempt from FSMA 2000.", "No, because generic advice is always permitted.", "Yes, but only if the solicitor charges a fee."], "a": "A", "x": ["Correct. Specific advice on buying a specified investment is a regulated activity under the Regulated Activities Order.", "Wrong. Units in collective investment schemes are specified investments.", "Wrong. Solicitors are not automatically exempt.", "Wrong. This advice is specific, not generic.", "Wrong. A fee is not the trigger."]}, {"ch": 6, "n": 7, "sc": ["A solicitor who is not FCA authorised wishes to carry on an exempt regulated activity under the DPB exemption."], "st": "Which of the following is a condition in s 327 FSMA 2000?", "o": ["The activity must be the firm's main business.", "The firm must receive commission from the product provider and keep it.", "The firm must be authorised by the FCA.", "The client must be a professional investor.", "The activity must arise out of, or be complementary to, the provision of a particular professional service to a particular client."], "a": "E", "x": ["Wrong. The activity must be incidental, not the main business.", "Wrong. Commission must be accounted to the client.", "Wrong. The exemption is for firms not authorised by the FCA.", "Wrong. There is no such requirement.", "Correct. This is one of the s 327 conditions."]}, {"ch": 6, "n": 8, "sc": ["A firm is aware that a person who carries on a regulated activity without authorisation or exemption commits an offence."], "st": "What is this rule called under s 19 FSMA 2000?", "o": ["The DPB exemption.", "The introducing exclusion.", "The general prohibition.", "The specified investment rule.", "The financial promotion restriction."], "a": "C", "x": ["Wrong. The DPB exemption is in Part XX FSMA.", "Wrong. This is an exclusion in the RAO.", "Correct. Section 19 is the general prohibition.", "Wrong. No such rule.", "Wrong. The financial promotion restriction is in s 21."]}, {"ch": 6, "n": 9, "sc": ["A firm relying on the DPB exemption receives a £300 commission from a product provider after arranging an investment for a client."], "st": "What must the firm do with the commission?", "o": ["Pay it to the FCA.", "Return it to the product provider.", "Pay it to the SRA.", "Account to the client for it, unless the client has agreed otherwise after being informed.", "Keep it, as it was paid by a third party."], "a": "D", "x": ["Wrong. Not required.", "Wrong. Not required.", "Wrong. Not required.", "Correct. Firms must account to clients for commission received, consistent with the DPB conditions and SRA rules.", "Wrong. Keeping it without informing the client is not permitted."]}, {"ch": 6, "n": 10, "sc": ["An exempt professional firm is arranging for a client to buy shares as part of the administration of an estate."], "st": "Which SRA rules govern how the firm carries on this exempt regulated activity?", "o": ["No rules apply because it is exempt.", "The FCA Handbook in full.", "The SRA Accounts Rules only.", "The SRA Financial Services (Scope) Rules and the SRA Financial Services (Conduct of Business) Rules.", "The SRA Transparency Rules only."], "a": "D", "x": ["Wrong. Exempt activities are still regulated by the SRA.", "Wrong. The full FCA Handbook applies to FCA-authorised firms.", "Wrong. The Accounts Rules are not the governing regime here.", "Correct. EPFs must comply with these two sets of SRA rules.", "Wrong. Not the relevant rules."]}, {"ch": 7, "n": 1, "sc": ["A solicitor agrees to act for a client on a 'no win, no fee' CFA. The success fee is set at 20%. The solicitor's usual charging rate is £200. The client's claim is successful. The client is awarded £2,500 in damages. The solicitor's fees amount to £2,000."], "st": "What success fee will the client be liable to pay?", "o": ["A sum of £500 payable from the damages awarded.", "A sum of £400.", "A sum of £2,000.", "A sum of £2,400.", "The client is not liable to pay a success fee."], "a": "B", "bx": "The correct answer was B. The success fee is set at 20% of the solicitor's usual fees. The solicitor's usual fees are £2,000, so the success fee is £400. Option A is incorrect because success fees are not linked to the damages awarded. Options C and D are wrong because they include the solicitor's usual fees. The claimant was successful so they are liable to pay the success fee (therefore option E is incorrect)."}, {"ch": 7, "n": 2, "sc": ["An adult man is arrested and taken to a police station. The man has not been charged with a criminal offence."], "st": "Which of the following statements most accurately describes the man's eligibility for free legal advice while at the police station?", "o": ["The man is automatically entitled to free legal advice if he wants it.", "The man may access free legal advice if he can show he passes the merits test and the means test.", "The man may access free legal advice if he can satisfy the interests of justice test and the means test.", "The man is not eligible for free legal advice because he has not been charged with a criminal offence.", "The man may access free legal advice if a duty solicitor receives a representation order to act on the man's behalf."], "a": "A", "bx": "The correct answer was A. Anyone attending at a police station is entitled to free legal advice. Options B and C are incorrect because they make reference to eligibility tests for legal aid more generally. Such tests are not applicable to advice provided at a police station. Option D is incorrect because advice is available to people attending at a police station on a voluntary basis. Option E is wrong because representation orders are not required for legal advice at a police station."}, {"ch": 7, "n": 3, "sc": ["A client instructs their solicitor to act on their behalf in relation to divorce proceedings. The client has very limited financial resources and is in receipt of welfare benefits. The client only needs assistance filling out the relevant court documentation."], "st": "Is the client eligible for legal aid?", "o": ["Yes, the client
