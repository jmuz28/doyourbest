<script>
const D={"t": ["The court structure of England and Wales", "Sources of law: primary legislation", "Sources of law: statutory interpretation", "Sources of law: case law", "The regulation of legal services", "Overriding legal obligations", "Financial services", "Funding options for legal services"], "q": [{"ch": 0, "n": 1, "sc": ["A client wants to bring an action against an individual concerning a property dispute. The estimated value of the claim is £100,000."], "st": "Which of the following courts have jurisdiction to hear the case?", "o": ["The King's Bench Division of the High Court and the County Court.", "The County Court only.", "The Chancery Division of the High Court only.", "The Chancery Division of the High Court and the King's Bench Division of the High Court.", "The Chancery Division of the High Court and the County Court."], "a": "E", "bx": "The correct answer was E. The Chancery Division of the High Court and the County Court have jurisdiction to hear civil cases concerning property disputes. The claimant can choose whether to commence proceedings in the High Court or the County Court. The fact the case is worth £100,000 does not mean the case will automatically be sent to the High Court."}, {"ch": 0, "n": 2, "sc": ["A man is accused of murder, an indictable-only offence. The trial is heard in the Crown Court. After hearing all the evidence, the man is found not guilty of the offence by the jury."], "st": "Which of the following best describes the avenues of appeal open to the prosecution?", "o": ["An appeal against the verdict can be brought by the prosecution. The appeal would be considered by the Court of Appeal (Criminal Division).", "An appeal can be brought by the prosecution on the basis that the sentence given was unduly lenient. The appeal would be considered by the Court of Appeal (Criminal Division).", "An appeal can be brought by the prosecution by way of case stated and would be considered by the King's Bench Division of the High Court.", "There is no route of appeal open to the prosecution in this case.", "An appeal can be brought by the prosecution by way of case stated and would be considered by the Court of Appeal (Criminal Division)."], "a": "D", "bx": "The correct answer was D. There is no route of appeal available to the prosecution. The prosecution cannot appeal against the sentence as no sentence has been imposed (therefore option B is incorrect). Appeals by way of case stated are only available for cases that started in the magistrates' court. The trial in this case is for an indictable-only offence so it is not possible for the case to have been heard in the magistrates' court at first instance. Furthermore, appeals by way of case stated are not heard in the Court of Appeal (options C and E are therefore wrong). Option A is wrong because the prosecution has no right to appeal against a verdict; the right to appeal is restricted to terminating rulings."}, {"ch": 0, "n": 3, "sc": ["A claimant is bringing a case against a defendant, seeking damages for personal injury. The claimant alleges that the defendant caused a road traffic accident. The defendant denies this and refuses to accept responsibility for causing the accident."], "st": "Which of the following best describes the burden of proof and standard of proof that the court will apply in deciding the issue?", "o": ["The burden of proof lies with the defendant to prove that they were not responsible for the accident. The standard of proof is the balance of probabilities.", "The burden of proof lies with the claimant to prove the allegation. The standard of proof is the balance of probabilities.", "The burden of proof lies with the claimant to prove the allegation beyond a reasonable doubt.", "The burden of proof lies with the claimant to disprove the defendant's account. The standard of proof is beyond a reasonable doubt.", "The burden of proof lies with both parties. The claimant must prove the allegation and the defendant must disprove the claimant's allegation. The standard of proof is the balance of probabilities."], "a": "B", "bx": "The correct answer was B. In civil cases the burden of proof rests with the claimant. The standard of proof in civil cases is the balance of probabilities."}, {"ch": 0, "n": 4, "sc": ["A claimant's case was initially heard by a district judge in the County Court. The case involved a low-value contract dispute. The decision of the district judge was in favour of the defendant. The claimant wishes to appeal. They believe the judge did not apply the law correctly."], "st": "Which court is likely to hear the appeal case?", "o": ["The case would be considered by a circuit judge in the County Court.", "The case would be considered by a High Court judge in the High Court.", "The case would be considered by the Court of Appeal (Civil Division).", "The case would be considered by the Supreme Court.", "The case would be considered by a High Court judge in the County Court."], "a": "A", "bx": "The correct answer was A, the case would be considered by a circuit judge in the County Court. Remember that in civil cases the appeal is usually heard by the next level of judge, rather than the next court in the court hierarchy."}, {"ch": 0, "n": 5, "sc": ["A solicitor wants to appear in court on behalf of her client in a criminal matter. The case is likely to be considered by the Crown Court at first instance."], "st": "Which of the following best describes the solicitor's right to exercise their rights of audience in this matter?", "o": ["The solicitor can appear in the Crown Court on behalf of their client as solicitors are automatically granted rights of audience when they are admitted.", "The solicitor can appear in the Crown Court on behalf of their client if they have undertaken the relevant assessments in both civil and criminal advocacy and have successfully applied for higher rights of audience.", "The solicitor can appear in the Crown Court on behalf of their client if they have permission from their client.", "The solicitor can appear in the Crown Court on behalf of their client if they have undertaken the relevant assessments in criminal advocacy and have successfully applied for higher rights of audience.", "The solicitor can appear in the Crown Court on behalf of their client as solicitors are automatically granted higher rights of audience when they are admitted."], "a": "D", "bx": "The correct answer was D. In these scenarios, remember to ask yourself (1) Is the case being heard in a senior court? (2) Is the case civil or criminal? The Crown Court is a senior court. The case is a criminal case. This means that the solicitor can appear on behalf of their client only if they have undertaken the relevant assessments in criminal advocacy and have successfully applied for higher rights of audience in criminal courts."}, {"ch": 0, "n": 6, "sc": ["A woman is charged with common assault, a summary-only offence. She is convicted in the magistrates' court and wishes to challenge both her conviction and sentence on the facts."], "st": "To which court will her appeal normally be made?", "o": ["The King's Bench Division of the High Court by way of case stated.", "The Crown Court, by way of a rehearing.", "The Supreme Court.", "The County Court.", "The Court of Appeal (Criminal Division)."], "a": "B", "x": ["Wrong. Case stated is for errors of law or jurisdiction, not a challenge on the facts.", "Correct. A defendant convicted in the magistrates' court may appeal against conviction and/or sentence to the Crown Court as of right.", "Wrong. The Supreme Court is not the first appeal route from the magistrates' court.", "Wrong. The County Court is a civil court.", "Wrong. The Court of Appeal (Criminal Division) hears appeals from the Crown Court on trials on indictment."]}, {"ch": 0, "n": 7, "sc": ["A defendant is tried in the Crown Court for robbery and is convicted by the jury."], "st": "Which of the following best describes the defendant's route of appeal against conviction?", "o": ["Appeal to the King's Bench Division by way of case stated.", "Appeal directly to the Supreme Court.", "Appeal to the Court of Appeal (Criminal Division), with leave.", "Appeal to the Crown Court by way of rehearing.", "There is no right of appeal against a jury verdict."], "a": "C", "x": ["Wrong. Case stated is available only for cases that started in the magistrates' court (or appeals heard in the Crown Court from it).", "Wrong. The Supreme Court hears only further appeals on points of law of general public importance.", "Correct. Appeals from trials on indictment go to the Court of Appeal (Criminal Division), with permission.", "Wrong. Rehearing in the Crown Court applies to appeals from the magistrates' court.", "Wrong. A convicted defendant can appeal against conviction."]}, {"ch": 0, "n": 8, "sc": ["A prosecution in the magistrates' court results in an acquittal. The prosecution believes the magistrates misinterpreted a statutory definition."], "st": "Which route of appeal is open to the prosecution?", "o": ["An appeal to the Court of Appeal (Criminal Division) against the verdict.", "No route of appeal, because the prosecution can never appeal an acquittal.", "An appeal by way of case stated to the King's Bench Division (Divisional Court) on a point of law.", "An appeal to the Crown Court against the acquittal on the facts.", "A referral to the Criminal Cases Review Commission."], "a": "C", "x": ["Wrong. The Court of Appeal does not hear appeals direct from the magistrates' court.", "Wrong. Case stated is available to the prosecution.", "Correct. Either party may appeal by way of case stated on a point of law or jurisdiction from the magistrates' court.", "Wrong. The prosecution has no right of appeal to the Crown Court against an acquittal.", "Wrong. The CCRC reviews possible miscarriages of justice against convicted persons."]}, {"ch": 0, "n": 9, "sc": ["A defendant is charged with a criminal offence and pleads not guilty."], "st": "Which of the following best describes the burden and standard of proof?", "o": ["The prosecution must prove guilt beyond reasonable doubt (so the tribunal is sure).", "The burden is shared equally between the parties.", "The defendant must prove innocence beyond reasonable doubt.", "The defendant must prove innocence on the balance of probabilities.", "The prosecution must prove guilt on the balance of probabilities."], "a": "A", "x": ["Correct. In criminal cases the legal burden is on the prosecution and the standard is beyond reasonable doubt.", "Wrong. The burden is not shared.", "Wrong. This reverses the burden and misstates the standard.", "Wrong. The defendant does not generally bear the burden of proving innocence.", "Wrong. Balance of probabilities is the civil standard."]}, {"ch": 0, "n": 10, "sc": ["A newly qualified barrister has just been called to the Bar and completed pupillage."], "st": "Which statement best describes her rights of audience?", "o": ["She has rights of audience in all courts but may need to be supervised by a 'qualified person' until she has three years' standing.", "She has rights of audience in the lower courts only.", "She has no rights of audience until she has three years' standing.", "She may appear in any court without restriction from the day she is called.", "She must undertake further assessments to obtain higher rights of audience."], "a": "A", "x": ["Correct. Barristers acquire rights of audience in all courts, but practising without a qualified person requires three years' standing.", "Wrong. This describes solicitors on admission.", "Wrong. She has rights of audience; the restriction concerns supervision.", "Wrong. This ignores the 'qualified person' requirement.", "Wrong. Higher rights assessments apply to solicitors."]}, {"ch": 1, "n": 1, "sc": ["The government has introduced a Bill that will change national taxation policy. The Bill has passed through the House of Commons but is opposed in the House of Lords. The Parliament Acts 1911 and 1949 are invoked in order to pass the Bill into law."], "st": "Which of the following statements most accurately outlines the requirements that need to be satisfied in order for the Bill to become law?", "o": ["The Bill is a public Bill so both Houses of Parliament will need to reach agreement on the Bill before it can receive royal assent.", "The House of Lords can delay the Bill for a maximum of one month. After that, the Bill can receive royal assent without the approval of the House of Lords.", "The House of Lords can delay the Bill for a maximum of two years. After that, the Bill can receive royal assent without the approval of the House of Lords.", "The Bill is a private Bill and both Houses of Parliament will need to reach agreement on the Bill before it can receive royal assent.", "The House of Lords can delay the Bill for a maximum of one year. After that, the Bill can receive royal assent without the approval of the House of Lords."], "a": "B", "bx": "The correct answer was B. The House of Lords can delay the Bill for a maximum of one month. After that, the Bill can receive royal assent without the approval of the House of Lords. This is because the Bill would be classified as a 'money' Bill. The Parliament Acts prevent the Lords from delaying money Bills for longer than one month."}, {"ch": 1, "n": 2, "sc": ["A [fictitious] Act of Parliament has recently been enacted. The Act is known as the 'Education Act 2025'. Under the words 'Education Act 2025', the following information is stated:", "2025 c.45 [12 November 2025]"], "st": "Which of the following statements most accurately describes 'The Education Act 2025'?", "o": ["The long title of the Act is the 'Education Act 2025'. The Act is deemed to be in force from 12 November 2025. The Act was passed on the 45th day in 2025.", "The short title of the Act is the 'Education Act 2025'. The Act received royal assent on 12 November 2025. The Act was passed on the 45th day in 2025.", "The short title of the Act is the 'Education Act 2025'. The Act is deemed to be in force from 12 November 2025. The Act was passed on the 45th day in 2025.", "The short title of the Act is the 'Education Act 2025'. The Act received royal assent on 12 November 2025. The Act was the 45th Act passed by Parliament in 2025.", "The long title of the Act is the 'Education Act 2025'. The Act received royal assent on 12 November 2025. The Act was the 45th Act passed by Parliament in 2025."], "a": "D", "bx": "The correct answer was D. The 'Education Act 2025' is the short title, rather than the long title (therefore options A and E are wrong). The '2025 c.45' indicates the year the Act was passed and the chapter number. The chapter number indicates that it was the 45th Act to be passed in 2025 (as opposed to the 45th day, therefore options B and C are incorrect). The date shown in brackets is the date on which the Act received royal assent."}, {"ch": 1, "n": 3, "sc": ["A highly controversial [fictitious] Act changed the legal test for 'dishonesty' in theft cases. The statutory test for dishonesty has attracted significant criticism and there is a growing pressure on the government to reform the law in this area."], "st": "Which of the following statements most accurately describes the legal effect of the Act?", "o": ["The Act is in force and the statutory test for dishonesty must be applied by judges hearing criminal law cases unless and until the law is changed by Parliament.", "The Act is in force but the statutory test for dishonesty may be overturned if the matter is considered by the Court of Appeal or the Supreme Court.", "The Act is in force and the statutory test for dishonesty must be applied by judges hearing theft cases unless and until the law is changed by Parliament.", "The Act is in force and the statutory test for dishonesty may be applied by judges hearing theft cases unless and until the law is changed by Parliament.", "The Act is in force but the statutory test for dishonesty may be overturned if the matter is considered by the Supreme Court."], "a": "C", "bx": "The correct answer was C. The Act is in force and the statutory test for dishonesty must be applied by judges hearing theft cases unless and until the law is changed by Parliament. The role of the judiciary is to interpret and apply the law laid out in statutes, not to override it (therefore options B and E are wrong). The law remains in force unless and until Parliament changes it. Option A is incorrect because it states the test must be applied in all criminal law cases, which is inaccurate (the Act lays out the test for dishonesty in theft cases). Option D is incorrect because it states that judges 'may' apply the test."}, {"ch": 1, "n": 4, "sc": ["A Bill that proposes to extend the lifetime of Parliament to six years has been proposed by the government. The Bill has completed its passage through the House of Commons but is opposed by the House of Lords."], "st": "Which of the following statements most accurately describes the steps that may be taken to pass the Bill into law?", "o": ["The House of Commons has the power to bypass the requirement for approval of the House of Lords.", "The House of Commons does not have the power to bypass the requirement for approval of the House of Lords.", "The House of Commons has the power to bypass the requirement for approval of the House of Lords if the Bill has been delayed by more than one year.", "The House of Commons has the power to bypass the requirement for approval of the House of Lords if the Bill has the overwhelming support of the House of Commons.", "The House of Commons has the power to bypass the requirement for approval of the House of Lords if the Bill has been delayed by more than one month."], "a": "B", "bx": "The correct answer was B. The House of Commons does not have the power to bypass the requirement for approval of the House of Lords. This is because the Bill seeks to extend the lifetime of Parliament beyond five years. The powers that the House of Commons have to bypass the requirement for approval of the House of Lords cannot be used to enact proposals to extend the lifetime of Parliament beyond five years."}, {"ch": 1, "n": 5, "sc": ["A client has approached a solicitor for advice. The solicitor has identified a statute that is likely to be relevant to the client's case. The solicitor needs to check whether the Act has come into effect."], "st": "Which of the following statements most accurately describes the part of the Act that describes when and how the Act will come into force?", "o": ["The explanatory notes will explain the purpose and scope of the Act and will state when the Act comes into effect.", "The relevant government minister is responsible for determining when the Act comes into effect.", "The Act will come into effect on the date that is specified in the commencement section of the Act. If there is no commencement section, the Act will be deemed in force from the date it completed the parliamentary stages of the legislative process.", "The date of royal assent is stated at the beginning of the Act. The date the Act received royal assent will usually be the date that the Act comes into effect.", "A commencement section within the Act will typically outline how and when the Act comes into effect. The Act may come into effect as a whole or in stages, and may come into effect immediately, on a specified date or on a date to be determined by the relevant government department."], "a": "E", "bx": "The correct answer was E. The commencement section outlines when and how an Act is to come into force. Option A is incorrect as the explanatory notes have no legal effect and merely provide a description or explanation behind an Act's intention. Option B is incorrect, as while the relevant government minister is responsible in some way, the question asks which part of the Act describes when and how the Act will come into force. Option D is wrong in that royal assent will not usually be the date that the Act comes into force. Option C is wrong because it does not accurately explain the operation of the commencement section."}, {"ch": 1, "n": 6, "sc": ["A government Bill is introduced in the House of Commons."], "st": "At which stage are the main principles of the Bill first debated and voted on?", "o": ["First reading.", "Royal assent.", "Second reading.", "Report stage.", "Committee stage."], "a": "C", "x": ["Wrong. First reading is a formal introduction without debate.", "Wrong. Royal assent is the final formality.", "Correct. Second reading is when the general principles are debated and voted on.", "Wrong. Report stage considers amendments made in committee.", "Wrong. Committee stage examines the Bill clause by clause."]}, {"ch": 1, "n": 7, "sc": ["A backbench MP who is not a government minister introduces a Bill to ban a particular practice nationwide."], "st": "How is this Bill best classified?", "o": ["A government Bill.", "A private members' Bill.", "A hybrid Bill.", "A private Bill.", "A money Bill."], "a": "B", "x": ["Wrong. Government Bills are introduced by ministers.", "Correct. A public Bill introduced by a backbench MP is a private members' Bill.", "Wrong. Hybrid Bills combine public and private features.", "Wrong. Private Bills affect particular individuals or organisations, not the public generally.", "Wrong. Nothing suggests a money Bill."]}, {"ch": 1, "n": 8, "sc": ["A non-money Bill has passed the House of Commons in two successive sessions but is rejected by the House of Lords on each occasion. The Bill does not seek to extend the life of Parliament."], "st": "Which statement best describes the position under the Parliament Acts 1911 and 1949?", "o": ["The Bill may receive royal assent after a delay of one month.", "The Bill may receive royal assent only if the Supreme Court approves.", "The Bill can never become law without the Lords' consent.", "The Bill may receive royal assent without the Lords' consent, provided one year has passed between the Commons second reading in the first session and its passing in the second session.", "The Bill can become law only after a general election."], "a": "D", "x": ["Wrong. One month applies to money Bills.", "Wrong. The courts have no such role.", "Wrong. The Parliament Acts allow the Lords to be bypassed for most public Bills.", "Correct. For non-money public Bills, the Lords can delay for about one year (two sessions) before the Parliament Acts can be used.", "Wrong. No election is required."]}, {"ch": 1, "n": 9, "sc": ["A solicitor reads the opening words of a statute: 'An Act to make provision about the regulation of drones; and for connected purposes.'"], "st": "What is this part of the Act called?", "o": ["The preamble.", "The short title.", "The commencement section.", "The long title.", "The explanatory notes."], "a": "D", "x": ["Wrong. A preamble is a statement of purpose that appears in some older Acts.", "Wrong. The short title is the name by which the Act is cited.", "Wrong. The commencement section deals with when the Act comes into force.", "Correct. The long title describes the purpose and scope of the Act.", "Wrong. Explanatory notes are separate and have no legal effect."]}, {"ch": 1, "n": 10, "sc": ["A minister makes regulations under a power conferred by an Act of Parliament."], "st": "How is this law best described?", "o": ["Retained common law.", "A private members' Bill.", "Primary legislation.", "Case law.", "Secondary (delegated) legislation, usually made by statutory instrument."], "a": "E", "x": ["Wrong. Not relevant.", "Wrong. This is a type of Bill, not a regulation.", "Wrong. Primary legislation is made by Parliament itself.", "Wrong. Case law is made by judges.", "Correct. Law made by ministers under a power in a parent Act is secondary legislation."]}, {"ch": 2, "n": 1, "sc": ["During the course of a criminal trial, a judge is required to interpret the precise meaning of a word used within a statute. The judge first looks at the natural ordinary meaning of the word used. However, such an interpretation of the word would lead to a repugnant outcome. The judge therefore interprets the words in a different way, which does not lead to a repugnant outcome."], "st": "What rule of statutory interpretation has the judge used to interpret the statute?", "o": ["The literal rule.", "The mischief rule.", "The parliamentary sovereignty rule.", "The golden rule.", "The purposive approach."], "a": "D", "bx": "The correct answer was D. The courts apply the golden rule where application of the literal rule would lead to a result that is 'absurd' or 'repugnant' (option A is therefore wrong). The mischief rule and purposive approach are used to understand the intention of Parliament (therefore options B and E are wrong). Option C is wrong as no such rule exists."}, {"ch": 2, "n": 2, "sc": ["The High Court is considering a civil case concerning an employment law issue. The applicable section within the relevant statute is ambiguous. One of the parties claims that the minister responsible for introducing the legislation made clear statements about the meaning of the relevant section during parliamentary debates. The party claims that the statements clearly illustrate how Parliament intended the section to be applied to cases such as the one the court is hearing."], "st": "Which of the following statements most accurately describes whether the court may consult official records of the relevant parliamentary debates?", "o": ["The court cannot refer to Hansard. All courts are prohibited from consulting Hansard because of the principle of parliamentary privilege.", "The court may refer to Hansard as this is necessary to interpret the relevant statute.", "The court may refer to Hansard if the relevant minister consents to the material being cited/used.", "The court may consult Hansard if the relevant minister consents to waive parliamentary privilege.", "The court may refer to Hansard because the relevant statute is ambiguous, and Hansard contains clear statements made by a minister as to the meaning of the section."], "a": "E", "bx": "The correct answer was E. The court may refer to Hansard in cases where the relevant statute is ambiguous or obscure, and where the material from Hansard contains clear statements that were made by a minister regarding the meaning or scope of the relevant statute (therefore option A is incorrect). These criteria are satisfied in the scenario. The references to consent and parliamentary privilege are merely distractors and are not a requirement (therefore options C and D are incorrect). Option B is wrong because it is not sufficiently precise as to the circumstances when Hansard may be used."}, {"ch": 2, "n": 3, "sc": ["A court is considering a complex criminal law appeal. During the course of the case, various questions have arisen as to the precise meaning of a phrase contained within a statute. Both parties have put forward arguments regarding the correct interpretation of the phrase. A leading and highly respected academic in the field of criminal law has explored the relevant section of the statute extensively and has published articles on the matter. The judges hearing the case feel it would be useful to refer to the relevant articles to assist in construing the relevant section of the statute."], "st": "Which of the following statements most accurately describes the extent to which the court can use such external aids to assist in interpreting the statute?", "o": ["The court may refer to external aids such as academic writings as the statute is unclear. In this case, the court may refer to the academic articles to assist in interpreting the relevant legislation.", "The court may refer to external aids such as academic writings if it wishes to. In this case, the court may refer to the academic writings to assist in interpreting the relevant legislation.", "The court may refer to external aids such as academic writings if both parties agree and the court feel it would assist in interpreting the relevant provision.", "The court may not refer to academic writings since they are not parliamentary publications.", "The court may refer to external aids as the statute is unclear. However, academic writings are not recognised as external aids to statutory interpretation."], "a": "A", "bx": "The correct answer was A. Academic writings can be used as external/extrinsic aids to statutory interpretation (therefore option D is wrong). They can only be used where the statute is unclear or ambiguous (therefore option B is wrong). The scenario facts confirm that the statute is unclear and that the use of academic articles written by a well-respected academic would aid statutory interpretation. Option C is wrong as the consent of both parties is not required, and option E is wrong because the academic writings are treated as external aids."}, {"ch": 2, "n": 4, "sc": ["A judge is considering a criminal law case. The defendant is charged with driving a vehicle on a public footpath contrary to an Act of Parliament. The relevant provision within the statute states that 'it is an offence to drive a car, motorcycle or any other motor-powered vehicle on a public footpath'. The defendant argues that he cannot be guilty of this offence as he was driving an electric scooter."], "st": "Which of the following statements most accurately describes the likely outcome should the judge apply the literal rule/approach?", "o": ["A literal interpretation of the section would likely include electric scooters. The ordinary meaning of the term 'vehicle' would likely include scooters.", "A literal interpretation of the section would likely exclude electric scooters. The ordinary and plain meaning of the term 'vehicle' would probably not include reference to scooters.", "A literal interpretation of the section would likely include electric scooters. The Act is designed to ensure footpaths are safe for pedestrians so the court would interpret the section in accordance with Parliament's intention.", "A literal interpretation of the section would likely exclude electric scooters. The statute specifically lists motor-powered vehicles. The electric scooter is not 'motor-powered' and would not be classified as a 'vehicle'.", "A literal interpretation of the section would likely include electric scooters. The statute is designed to ensure that footpaths are safe for pedestrians. It is clear that any power-driven vehicle would pose a risk to pedestrians. The court would include electric-powered vehicles within the definition of a 'motor-powered vehicle'."], "a": "D", "bx": "The correct answer was D. A literal interpretation of the section would likely exclude electric scooters (therefore option A is wrong). Remember that the question required you to apply a literal interpretation of the words used. The statute specifically lists motor-powered vehicles. The electric scooter is not 'motor-powered' and probably would not be classified as a 'vehicle' either. Option B is wrong because it does not deal with the issue of 'motor-powered'. The literal rule requires that the words are given their ordinary and natural meaning. The court would not take into account the purpose of the statute if they applied the literal rule (therefore options C and E are wrong). Make sure you read the question carefully. The answer to this question would have been different if it asked you to determine the likely outcome if a different rule of statutory interpretation had been applied."}, {"ch": 2, "n": 5, "sc": ["Parliament has recently passed legislation that criminalises the sale and distribution of a new and dangerous drug."], "st": "Which of the following statements most accurately describes the presumptions that a court would presume are implied in the statute?", "o": ["The court would presume that the statute does not apply retrospectively and that any criminal offences stated in the statute require proof of mens rea (intention).", "The court would presume that the statute does not apply retrospectively, and that any criminal offences require proof of mens rea unless the statute expressly states otherwise.", "The court would presume that the statute does not apply retrospectively and comes into force on the stated commencement date.", "The court would presume that any criminal offences stated in the statute require proof of mens rea (intention) unless the statute implies otherwise.", "The court would presume that the statute alters any relevant pre-existing common law."], "a": "B", "bx": "The correct answer was B. The courts always presume that certain things are implied in all statutes. These presumptions are only rebutted if the legislation expressly states otherwise. In the example given, courts would presume that the statute does not apply retrospectively, and that any criminal offences require proof of mens rea unless the statute expressly states otherwise. Remember that you have to select the single best answer. Other options in this question were factually accurate but were not the single 'best' answer."}, {"ch": 2, "n": 6, "sc": ["A statute refers to 'any house, office, room or other place'. The court must decide whether an outdoor football ground falls within 'other place'."], "st": "Which rule of language is most relevant?", "o": ["Expressio unius est exclusio alterius.", "The mischief rule.", "The golden rule.", "Noscitur a sociis.", "Ejusdem generis."], "a": "E", "x": ["Wrong. Expressio unius means express mention of one thing excludes others.", "Wrong. This is a rule of interpretation, not a rule of language.", "Wrong. This is a rule of interpretation, not a rule of language.", "Wrong. Noscitur a sociis reads a word in the light of its context, but the classic list-then-general-words point is ejusdem generis.", "Correct. Ejusdem generis: general words following a list of specific words are read as limited to the same kind (Powell v Kempton Park Racecourse)."]}, {"ch": 2, "n": 7, "sc": ["A judge looks at the law before the Act was passed, identifies the defect the Act was meant to remedy, and interprets the words to suppress that defect."], "st": "Which approach has been applied?", "o": ["The mischief rule.", "The rule in Pepper v Hart.", "Ejusdem generis.", "The golden rule.", "The literal rule."], "a": "A", "x": ["Correct. This describes the mischief rule from Heydon's Case.", "Wrong. Pepper v Hart concerns use of Hansard.", "Wrong. This is a rule of language.", "Wrong. The golden rule avoids absurd or repugnant outcomes.", "Wrong. The literal rule gives words their ordinary meaning."]}, {"ch": 2, "n": 8, "sc": ["A judge wishes to use material within the Act itself to help interpret an ambiguous section."], "st": "Which of the following is an internal (intrinsic) aid?", "o": ["Hansard.", "An academic article.", "A dictionary.", "A Law Commission report.", "The long title of the Act."], "a": "E", "x": ["Wrong. Hansard is an external aid.", "Wrong. Academic writings are external aids.", "Wrong. Dictionaries are external aids.", "Wrong. Law Commission reports are external aids.", "Correct. The long title, along with schedules and interpretation sections, is an internal aid."]}, {"ch": 2, "n": 9, "sc": ["A court is interpreting legislation that affects a right protected by the European Convention on Human Rights."], "st": "What does s 3 Human Rights Act 1998 require?", "o": ["The court must disapply incompatible primary legislation.", "So far as possible, legislation must be read and given effect in a way that is compatible with Convention rights.", "The court must always follow the literal meaning.", "The court must strike down any incompatible legislation.", "The court must refer the question to the European Court of Human Rights."], "a": "B", "x": ["Wrong. Primary legislation remains valid and in force.", "Correct. Section 3 imposes this interpretive obligation.", "Wrong. Section 3 can require departure from the literal meaning.", "Wrong. UK courts cannot strike down primary legislation; they may make a declaration of incompatibility under s 4.", "Wrong. There is no such referral mechanism."]}, {"ch": 2, "n": 10, "sc": ["A statute imposes a new criminal offence. It is silent on whether it applies to conduct before it came into force."], "st": "Which presumption will the court apply?", "o": ["That the statute binds only the Crown.", "That the statute does not apply retrospectively.", "That the statute applies retrospectively.", "That the statute creates strict liability.", "That the statute changes the common law."], "a": "B", "x": ["Wrong. The presumption is that statutes do not bind the Crown unless stated.", "Correct. There is a presumption against retrospective effect, particularly for criminal law.", "Wrong. This is the opposite of the presumption.", "Wrong. The presumption is that mens rea is required.", "Wrong. The presumption is against altering the common law."]}, {"ch": 3, "n": 1, "sc": ["The Court of Appeal is considering a civil appeal. The appellant's submissions rely on a previous decision of the JCPC which indicates that the appeal should be allowed. The JCPC judgment did not indicate that the decision would be binding in England and Wales. The respondent's submissions rely on a previous decision of the Court of Appeal which indicates that the appeal should not be allowed."], "st": "How should the Court of Appeal treat the two decisions to which it has been referred?", "o": ["The court should treat both previous decisions as having persuasive value only and must decide which of the two to follow.", "The court should consider itself bound by the earlier decision of the Court of Appeal.", "The court should consider itself bound by the earlier decision of the JCPC.", "The court should consider itself bound by both decisions and must choose which of the two to follow.", "The court should treat both earlier decisions as having persuasive value only and may choose whether to apply either precedent to the instant case."], "a": "B", "bx": "The correct answer was B. The Court of Appeal is bound to follow its own previous decisions (therefore options A and E are wrong). Its previous decisions are not merely persuasive. The Court of Appeal may only depart from its previous decisions in limited circumstances, which do not apply here. The decisions of the JCPC are usually persuasive only (therefore options C and D are wrong)."}, {"ch": 3, "n": 2, "sc": ["In the [fictitious] case of Jones v Morritt, the Court of Appeal decided that the [fictitious] case Smith v Hodgson was wrongly decided and overruled the decision. Smith v Hodgson was decided by the Divisional Court (High Court)."], "st": "Which of the following statements most accurately describes the status of Smith v Hodgson?", "o": ["The effect of the Court of Appeal decision in Jones v Morritt is that Smith v Hodgson is now a persuasive precedent rather than a binding precedent.", "The effect of the Court of Appeal decision in Jones v Morritt is that Smith v Hodgson remains good law and may be relied on in future cases.", "The effect of the Court of Appeal decision in Jones v Morritt is that Smith v Hodgson remains a binding precedent on all inferior courts.", "The effect of the Court of Appeal decision in Jones v Morritt is that Smith v Hodgson was distinguished and may be relied on in future cases.", "The effect of the Court of Appeal decision in Jones v Morritt is that Smith v Hodgson is no longer good law."], "a": "E", "bx": "The correct answer was E. The Court of Appeal overruled the decision in Smith v Hodgson. Where a court overrules a precedent, that precedent ceases to be good law. Options A, B, C and D state that Smith v Hodgson will continue to have a binding or persuasive effect on future cases, and so cannot be correct."}, {"ch": 3, "n": 3, "sc": ["In an appeal before the Supreme Court, the respondent relies on an earlier House of Lords decision that indicates that the Supreme Court should find in the respondent's favour. The appellant relies on more recent authorities from the Court of Appeal, which suggest that the Supreme Court should find in favour of the appellant."], "st": "Which of the following statements most accurately describes how the Supreme Court should treat the authorities to which it has been referred?", "o": ["The court should consider itself bound by the earlier decision of the House of Lords.", "The court should not consider itself to be bound by the decisions of its predecessor, the House of Lords, or the Court of Appeal decisions.", "The court should consider itself bound by the most recent legal authority to which it has been referred.", "The court should treat all authorities as having persuasive value only and must decide which of the authorities to follow.", "The court should consider itself bound by the earlier decision of the House of Lords and may only depart from the decision if there are compelling reasons to do so."], "a": "E", "bx": "The correct answer was E. Previous decisions of the House of Lords bind the Supreme Court (therefore option B is wrong). The Supreme Court does, however, have the power to depart from an existing precedent where there are compelling reasons to do so (therefore option A is wrong). This means that option E is the most accurate description of the Supreme Court's position. Option C is incorrect as the Supreme Court is only bound by itself, and no other court. Option D is wrong because the Supreme Court cannot treat its own previous decision as persuasive."}, {"ch": 3, "n": 4, "sc": ["The Court of Appeal (Criminal Division) is hearing a criminal appeal case concerning the interpretation of the phrase 'motor-powered vehicle'. The appellant submits that an electric-powered scooter ought to be regarded as a 'motor-powered vehicle'. In support of this submission, the appellant is relying on a previous Supreme Court decision. The [fictitious] Supreme Court case did not concern an electric-powered scooter but the leading judgment included the following statement:", "'For the purposes of determining whether a vehicle falls within the scope of the Act, one must determine whether the vehicle in question is one which is mechanically propelled, rather than whether it is powered by a motor. If it is mechanically propelled, it is likely to fall within the statute.'"], "st": "Which of the following statements most accurately describes the effect of the Supreme Court's statement?", "o": ["The statement is a legally binding precedent that the Court of Appeal is bound to follow.", "The statement is a legally binding precedent that the Court of Appeal may follow, distinguish or overrule.", "The statement has persuasive effect only and the Court of Appeal may apply the precedent.", "The statement has persuasive effect only but is likely to be highly influential because of the seniority of the Supreme Court.", "The statement is a legally binding precedent, but the Court of Appeal may distinguish the case on the basis that the material facts are not the same as those in the present case."], "a": "D", "bx": "The correct answer was D. The statement made is likely to be considered obiter dicta and thus is not binding (therefore options A, B and E are incorrect). It does not specifically deal with whether an electric scooter falls within s 1(2). Obiter dicta statements made by the Supreme Court are likely to be very persuasive to lower courts, such as the Court of Appeal. Option C is incorrect because it is not as accurate as option D."}, {"ch": 3, "n": 5, "sc": ["The High Court hears an appeal concerning a contract law dispute. The case was first considered by the County Court. The High Court determines that the County Court's decision is wrong."], "st": "Which of the following most accurately describes the decision of the High Court?", "o": ["Both the High Court and the County Court decisions would be considered legally binding on inferior courts.", "The High Court has distinguished the previous decision of the County Court. Both the High Court and the County Court decisions would be considered legally binding on inferior courts.", "The High Court has overruled the previous decision of the County Court.", "The High Court decision reversed the County Court's decision. The High Court decision sets a new precedent that inferior courts are bound to follow in future cases.", "The High Court decision reversed the County Court's decision. The High Court decision sets a new precedent that all courts are bound to follow in future cases."], "a": "D", "bx": "The correct answer was D. The High Court has considered an appeal and reversed the County Court decision. Option E is incorrect because it states that the new precedent binds all other courts. High Court decisions only bind courts below it in the court hierarchy. Option C is wrong because the High Court has not overruled a decision; it has reversed it. Options A and B are incorrect because the County Court decision would not be legally binding."}, {"ch": 3, "n": 6, "sc": ["A judge sitting in the County Court is referred to a relevant High Court decision on the same point."], "st": "How should the County Court treat the High Court decision?", "o": ["It must follow it only if the parties agree.", "It may treat it as persuasive only.", "It may ignore it if it is more than ten years old.", "It may overrule it.", "It is bound to follow it."], "a": "E", "x": ["Wrong. Agreement is irrelevant.", "Wrong. High Court decisions bind the County Court.", "Wrong. Age does not affect binding status.", "Wrong. A lower court cannot overrule a higher court.", "Correct. The County Court is bound by decisions of the High Court."]}, {"ch": 3, "n": 7, "sc": ["The Court of Appeal is referred to one of its own earlier decisions. It finds that the earlier court overlooked a binding statutory provision."], "st": "Which statement is most accurate?", "o": ["The Court of Appeal may depart only with the consent of the Supreme Court.", "The Court of Appeal may depart only if the decision is over 30 years old.", "The Court of Appeal may depart from its earlier decision because it was made per incuriam.", "The Court of Appeal must refer the case to the Supreme Court.", "The Court of Appeal is always bound by its earlier decisions."], "a": "C", "x": ["Wrong. No such consent is required.", "Wrong. Age is not an exception.", "Correct. Per incuriam is one of the Young v Bristol Aeroplane exceptions.", "Wrong. No referral is required.", "Wrong. There are recognised exceptions."]}, {"ch": 3, "n": 8, "sc": ["A judge in a decided case explains the legal principle on which the decision was based."], "st": "What is this part of the judgment called?", "o": ["Stare decisis.", "Obiter dicta.", "The headnote.", "Per incuriam.", "The ratio decidendi."], "a": "E", "x": ["Wrong. Stare decisis is the doctrine of standing by previous decisions.", "Wrong. Obiter dicta are things said by the way and are not binding.", "Wrong. The headnote is a reporter's summary.", "Wrong. Per incuriam means a decision made through lack of care.", "Correct. The ratio is the legal reasoning necessary for the decision and forms the binding part."]}, {"ch": 3, "n": 9, "sc": ["A High Court judge is referred to an earlier Court of Appeal decision. The judge finds that the material facts of the present case are significantly different."], "st": "What can the judge do?", "o": ["Treat the earlier decision as obiter.", "Distinguish the earlier decision.", "Refuse to follow it because the Court of Appeal is not binding on the High Court.", "Reverse the earlier decision.", "Overrule the earlier decision."], "a": "B", "x": ["Wrong. The ratio of a case does not become obiter.", "Correct. A court may distinguish a precedent where the material facts differ.", "Wrong. Court of Appeal decisions bind the High Court.", "Wrong. Reversal occurs on appeal in the same case.", "Wrong. Only a higher court can overrule."]}, {"ch": 3, "n": 10, "sc": ["The Supreme Court is asked to depart from one of its own previous decisions."], "st": "Which statement best describes its power to do so?", "o": ["It may do so only if the earlier decision was by a majority.", "It can never depart from its own previous decisions.", "It may depart from its own previous decisions when it appears right to do so, following the 1966 Practice Statement, but does so sparingly.", "It may do so only if the European Court of Human Rights has disagreed.", "It may do so only with the permission of Parliament."], "a": "C", "x": ["Wrong. A majority decision is not a requirement.", "Wrong. The power exists.", "Correct. The Practice Statement (adopted by the Supreme Court) allows departure, but the power is used rarely.", "Wrong. Strasbourg case law must be taken into account but is not a precondition.", "Wrong. No permission is needed."]}, {"ch": 4, "n": 1, "sc": ["A solicitor is authorised to provide legal services by the SRA. The solicitor has a valid practising certificate."], "st": "Which of the following best describes the effect of authorisation?", "o": ["The solicitor may carry on all reserved legal activities.", "The solicitor may carry on all reserved legal activities and must adhere to regulation by the SRA in respect of any reserved legal activities they carry on.", "The solicitor may carry on all reserved legal activities and must adhere to the relevant statutory regulations.", "The solicitor may carry on all reserved legal activities, except notarial activities, and must adhere to regulation by the SRA in respect of all legal services they provide.", "The solicitor may carry on all reserved legal activities, except notarial activities, and is subject to regulation by the SRA in respect of such activities."], "a": "D", "bx": "The correct answer was D. All solicitors are subject to regulation by the SRA. Authorisation does not allow a solicitor to engage in all reserved legal activities because they cannot carry on notarial activities. Options A, B and C are therefore incorrect. Option E is incorrect because regulation by the SRA applies to all legal activities, not just reserved activities."}, {"ch": 4, "n": 2, "sc": ["An authorised firm specialises in high-value commercial contract work. They have a number of large offices across the north-west of England. The firm has PII cover of £3 million."], "st": "Would this level of PII coverage likely satisfy the SRA's requirement to have adequate and appropriate indemnity insurance?", "o": ["The PII coverage complies with the SRA MTCs so would meet with adequate and appropriate requirement.", "The PII coverage meets the requirements stipulated in the SRA Indemnity Insurance Rules so would meet with adequate and appropriate requirement.", "The PII coverage may not be considered to be adequate and appropriate because of the size of the firm and the nature of the work it undertakes.", "The PII coverage may not be considered to be adequate and appropriate because it has not complied with the minimum level of coverage stipulated in the MTCs.", "The PII coverage may not be considered to be adequate and appropriate because it has not complied with the minimum level of coverage stipulated in the SRA Indemnity Insurance Rules."], "a": "C", "bx": "The correct answer was C. Whether PII coverage is considered adequate and appropriate depends on whether it is suitable for the specific firm, taking into account the firm's specific circumstances. Options B and E are incorrect because the minimum level of coverage is stipulated in the MTCs. Options A and D are incorrect because compliance with the MTCs does not determine whether the level of coverage is adequate and appropriate."}, {"ch": 4, "n": 3, "sc": ["A woman successfully applies for a job in a law firm. The role is for the position of a civil litigation solicitor. The law firm is authorised by the SRA. The woman used to work as a solicitor. For the last three years, she has worked as a university lecturer. During this period, she did not renew her practising certificate."], "st": "Which of the following statements most accurately describes her position?", "o": ["The woman is appropriately qualified and is entitled to offer legal services through an authorised body. She does not need to apply for a practising certificate to take up the job offer.", "If the woman accepted the role without obtaining a practising certificate, she would only be able to offer non-reserved legal services.", "If the woman accepted the role without obtaining a practising certificate, she may commit a criminal offence should she carry on any reserved legal activities.", "The woman is a qualified solicitor and is therefore entitled to take up the job offer. She may apply for a practising certificate if she wants to carry on any reserved legal activities.", "The woman must obtain a practising certificate to take up the job offer. The role is that of a solicitor so she must have a valid practising certificate. Acting as a solicitor without a valid practising certificate is a criminal offence."], "a": "E", "bx": "The correct answer was E. It is a criminal offence to act as a solicitor without a practising certificate. A practising certificate is a requirement irrespective of whether the solicitor plans to carry on reserved legal activities. Options A, B, C and D are therefore incorrect."}, {"ch": 4, "n": 4, "sc": ["A solicitor is considering practising on a freelance basis."], "st": "Which of the following statements most accurately describes the relevant authorisation requirements the solicitor must comply with should they decide to operate on a freelance basis?", "o": ["The solicitor must obtain SRA authorisation to operate as a sole registered practice if they intend to carry on reserved legal activities.", "The solicitor must obtain SRA authorisation to operate as a sole registered practice.", "The solicitor must provide any reserved legal services through an approved firm/body.", "The solicitor is required to operate as a sole registered practice.", "The solicitor must obtain SRA authorisation to operate as a sole registered practice regardless of whether they intend to carry on reserved legal activities."], "a": "C", "bx": "The correct answer was C. Freelance solicitors may provide reserved legal activities through an approved firm/body. Freelance solicitors are only required to register as sole registered practices if they want to offer reserved legal services through their practice. Options A, B, D and E are incorrect as they all suggest that registration as a sole registered practice is a requirement for all freelance solicitors."}, {"ch": 4, "n": 5, "sc": ["A chartered legal executive works for a law firm authorised by the SRA. They engage in reserved legal activities."], "st": "Which of the following statements most accurately describes the relevant regulatory requirements?", "o": ["The legal executive is subject to regulation by CILEx Regulation. The firm they work in is subject to regulation by the SRA.", "The legal executive is regulated by the SRA because they work for an authorised firm. The firm is also regulated by the SRA.", "The legal executive is regulated by the SRA because they carry on reserved legal activities. The firm is regulated by the SRA.", "The legal executive is subject to regulation by the Legal Services Board. The firm is regulated by CILEx Regulation.", "The legal executive and the firm are subject to regulation by CILEx Regulation."], "a": "A", "bx": "The correct answer was A. Chartered legal executives are subject to the regulation of their approved regulatory body, CILEx Regulation (therefore options B and C are wrong). The firm is authorised by the SRA and is therefore regulated by the SRA (therefore options D and E are wrong)."}, {"ch": 4, "n": 6, "sc": ["A person who is not authorised or exempt issues a claim form in the County Court on behalf of a client for a fee."], "st": "Which statement best describes the position under the Legal Services Act 2007?", "o": ["The conduct of litigation is a reserved legal activity, and carrying it on without being entitled to do so is a criminal offence.", "Issuing a claim is not a reserved legal activity.", "It is only a disciplinary matter for the SRA.", "It is permitted if the client consents.", "It is permitted if no fee is charged."], "a": "A", "x": ["Correct. The conduct of litigation is reserved under s 12 LSA 2007, and carrying it on when not entitled is an offence under s 14.", "Wrong. Issuing proceedings is part of the conduct of litigation.", "Wrong. An unregulated person is not subject to SRA discipline; it is a criminal matter.", "Wrong. Client consent does not confer entitlement.", "Wrong. Charging is irrelevant to whether the activity is reserved."]}, {"ch": 4, "n": 7, "sc": ["A client asks which body oversees the approved regulators of the legal profession in England and Wales, such as the SRA and BSB."], "st": "Which body is this?", "o": ["The Legal Ombudsman.", "The Law Society.", "The Legal Services Board.", "The Bar Council.", "The Solicitors Disciplinary Tribunal."], "a": "C", "x": ["Wrong. The Legal Ombudsman deals with service complaints.", "Wrong. The Law Society is the representative body for solicitors.", "Correct. The LSB, created by the LSA 2007, oversees the approved regulators.", "Wrong. The Bar Council is the representative body for barristers.", "Wrong. The SDT hears disciplinary prosecutions against solicitors."]}, {"ch": 4, "n": 8, "sc": ["A firm's client is dissatisfied with the service received and has exhausted the firm's complaints procedure."], "st": "To which body may the client then take a complaint about poor service?", "o": ["The Legal Services Board.", "The Bar Standards Board.", "The Legal Ombudsman.", "The Solicitors Disciplinary Tribunal.", "The High Court."], "a": "C", "x": ["Wrong. The LSB does not deal with individual complaints.", "Wrong. The BSB regulates barristers.", "Correct. The Legal Ombudsman handles service complaints after the firm's procedure has been used.", "Wrong. The SDT deals with serious misconduct prosecutions.", "Wrong. The client may sue, but the complaints route is the Ombudsman."]}, {"ch": 4, "n": 9, "sc": ["A firm is reviewing the SRA's approach to supervision."], "st": "Which statement best describes risk-based regulation?", "o": ["The regulator inspects every firm every year on the same basis.", "Firms set their own risk ratings with no regulatory oversight.", "Risk is assessed solely by the size of a firm's turnover.", "The regulator assesses the likely impact and probability of risks and targets its resources at the greatest risks.", "The regulator acts only after a complaint is made."], "a": "D", "x": ["Wrong. Risk-based regulation targets resources rather than treating all firms alike.", "Wrong. The regulator assesses risk.", "Wrong. Turnover alone does not determine risk.", "Correct. This describes risk-based regulation.", "Wrong. It is proactive, not purely reactive."]}, {"ch": 4, "n": 10, "sc": ["A solicitor wants to understand which of the following is one of the seven SRA Principles."], "st": "Which of the following is an SRA Principle?", "o": ["Act in accordance with the client's instructions in all circumstances.", "Act in a way that protects the solicitor's personal reputation.", "Act in a way that maximises the firm's profits.", "Act with the approval of the Law Society.", "Act with integrity."], "a": "E", "x": ["Wrong. Acting in the client's best interests is a Principle, but not following instructions in all circumstances.", "Wrong. This is not a Principle.", "Wrong. This is not a Principle.", "Wrong. This is not a Principle.", "Correct. Acting with integrity is one of the seven Principles."]}, {"ch": 5, "n": 1, "sc": ["A solicitor working for a large law firm alleges that she has been subject to discriminatory treatment because of her religious beliefs. Consequently, she commences a civil claim against the firm. A fellow colleague plans to give evidence against the employer. The employer becomes aware of the colleague's intention to give evidence against the firm. As a consequence of this, the colleague is informed that the firm will not consider his application for a promotion."], "st": "Has the employer engaged in any prohibited conduct under the Equality Act 2010?", "o": ["Yes, the employer has subjected the colleague to harassment.", "Yes, the employer has subjected the colleague to direct discrimination.", "No, the employer is entitled to restrict access to promotions.", "Yes, the employer has subjected the colleague to victimisation.", "No, the employer's treatment of the colleague is not linked to a protected characteristic."], "a": "D", "bx": "The correct answer was D. The colleague's treatment is a consequence of the employer believing that the colleague will do a protected act rather than because of a protected characteristic. The relevant prohibited conduct is victimisation. Options A and B are incorrect because they identify the wrong prohibited conduct. Option C is incorrect because an employer cannot subject an employee to a detriment because they will or might do a protected act. Option E is wrong because victimisation does not need to be linked to a protected characteristic."}, {"ch": 5, "n": 2, "sc": ["An employee with a disability at a firm of solicitors requests a parking space closer to the main entrance of the building. The employee's disability makes it difficult for the employee to walk unaided for long periods of time."], "st": "Which of the following best describes the employer's obligations to the disabled employee?", "o": ["The Equality Act 2010 requires the employer to make any necessary adjustments to ensure that the employee with a disability is not placed at a disadvantage compared to those who do not have a disability.", "The Equality Act 2010 requires the employer to make reasonable adjustments to ensure that the employee with a disability is not placed at any disadvantage compared to those who do not have a disability.", "The Equality Act 2010 requires the employer to make reasonable adjustments to ensure that the employee with a disability is not placed at a substantial disadvantage compared to those who do not have a disability.", "The Equality Act 2010 requires the employer to make significant adjustments to ensure that the employee with a disability is not placed at a disadvantage compared to those who do not have a disability.", "The Equality Act 2010 requires the employer to make adjustments to ensure that the employee with a disability is not placed at an unfair disadvantage compared to those who do not have a disability."], "a": "C", "bx": "The correct answer was C. An employer is obliged to make reasonable adjustments to prevent an employee with a disability suffering a significant disadvantage. The other options include incorrect descriptions of the obligation to make adjustments."}, {"ch": 5, "n": 3, "sc": ["A solicitor acts for a client in relation to the acquisition of a company. Just hours before the transaction is due to complete, the solicitor acquires information that causes her to suspect her client will be using the transaction to launder money. The solicitor reports this to the nominated officer, who makes a SAR to the relevant authority."], "st": "What action should the solicitor now take?", "o": ["Proceed with the transaction since the solicitor has made a disclosure to the nominated officer.", "Proceed with the transaction only if she has obtained authorisation from the relevant authority.", "Proceed with the transaction so that the client is not alerted to the money laundering disclosure and ensuing investigation.", "Inform the client that she can no longer act on behalf of the client because a SAR is pending.", "Inform the client that a disclosure has been made and then proceed with the transaction."], "a": "B", "bx": "The correct answer was B. The solicitor should only proceed with the transaction if they have received consent from the NCA. Without such consent, the solicitor commits a direct-involvement offence under POCA (options C and E are therefore incorrect). Option A is incorrect because a disclosure to the nominated officer does not provide a defence to money laundering. Option D is incorrect because the solicitor should not inform the client of the disclosure or proceed with the transaction."}, {"ch": 5, "n": 4, "sc": ["Some months ago, a newly qualified solicitor dealt with a transaction on behalf of a client. The client lives and works in the south-east of England. The firm is based in the north-east of England. The solicitor never met the client face to face. The transaction involved multiple jurisdictions. The solicitor failed to spot that the client was using the transaction to launder the proceeds of crime, despite the fact that the solicitor ought to have at least suspected that the client was involved in money laundering. The solicitor claims that she had not received any training on how to deal with suspected money laundering. The firm that employs the solicitor has no records to show the solicitor had undertaken the relevant training."], "st": "Which of the following statements most accurately outlines the solicitor's position in respect of liability under POCA?", "o": ["The solicitor will most likely be liable for the offence of failing to make a disclosure.", "The solicitor will most likely be liable for failing to make a SAR.", "The solicitor will not be liable for an offence under POCA because she had no knowledge or suspicion of money laundering.", "The solicitor has not committed an offence under POCA because it is the duty of the nominated officer to make SARs to the NCA.", "The solicitor has likely committed a failure to disclose offence but is likely to be able to rely on the training defence."], "a": "E", "bx": "The correct answer was E. The solicitor was required to make a disclosure because she ought to have suspected money laundering (therefore option A is wrong). However, the firm's failure to provide training is likely to provide the solicitor with a defence. Option C is incorrect because it is sufficient to show that the solicitor ought to have suspected money laundering. Option B is incorrect because the offence related to failure to make a SAR applies to nominated officers only. Option D is incorrect because solicitors are required to disclose suspicion of money laundering to the nominated officer."}, {"ch": 5, "n": 5, "sc": ["A solicitor working for a law firm is approached by a prospective client. The client wants to establish a business relationship with the firm. The client needs advice and services in connection with divorce proceedings."], "st": "Which of the following best describes the solicitor's obligations in respect of CDD?", "o": ["The solicitor may verify the client's identity applying the firm's standard CDD measures.", "The solicitor must verify the client's identity applying simplified due diligence measures.", "The solicitor must verify the client's identity applying EDD measures.", "The solicitor will need to verify the client's identity if the solicitor suspects money laundering.", "The solicitor must verify the client's identity applying the firm's standard CDD measures."], "a": "E", "bx": "The correct answer was E. Solicitors are obliged to apply due diligence measures before establishing a business relationship with a new client. The scenario does not suggest that there is a high risk of money laundering, so the solicitor does not need to apply EDD measures (therefore, option C is incorrect). Options A and D are incorrect because they suggest that the requirement for standard due diligence measures to be followed only applies in certain circumstances, which is incorrect. Option B is incorrect because simplified due diligence is not applicable to this type of case."}, {"ch": 5, "n": 6, "sc": ["A firm requires all trainee solicitors to be able to work late every evening without notice. The policy applies to everyone but puts trainees with childcare responsibilities, who are more often women, at a particular disadvantage. The firm cannot justify the policy."], "st": "Which type of prohibited conduct is this most likely to be?", "o": ["Victimisation.", "A failure to make reasonable adjustments.", "Direct discrimination.", "Indirect discrimination.", "Harassment."], "a": "D", "x": ["Wrong. No protected act is involved.", "Wrong. This duty relates to disability.", "Wrong. The policy is not applied because of sex.", "Correct. A provision, criterion or practice applied to all that puts a group with a protected characteristic at a particular disadvantage, and which cannot be justified, is indirect discrimination.", "Wrong. No unwanted conduct violating dignity is described."]}, {"ch": 5, "n": 7, "sc": ["A solicitor at a firm repeatedly makes offensive jokes about a colleague's sexual orientation, creating a humiliating environment for the colleague."], "st": "Which type of prohibited conduct has most likely occurred?", "o": ["Victimisation.", "Harassment.", "Indirect discrimination.", "No prohibited conduct because they were only jokes.", "Discrimination arising from disability."], "a": "B", "x": ["Wrong. No protected act is involved.", "Correct. Unwanted conduct related to a protected characteristic that creates a humiliating or offensive environment is harassment.", "Wrong. There is no policy applied to all.", "Wrong. Jokes can amount to harassment.", "Wrong. Disability is not relevant."]}, {"ch": 5, "n": 8, "sc": ["A solicitor reports a suspicion of money laundering to the firm's nominated officer. She then tells the client that a report has been made, in a way likely to prejudice any investigation."], "st": "Which offence has she most likely committed?", "o": ["Concealing under s 327 POCA.", "Acquisition, use and possession under s 329 POCA.", "Failure to disclose under s 330 POCA.", "Tipping off under s 333A POCA.", "No offence, as she had already made a report."], "a": "D", "x": ["Wrong. There is no suggestion she concealed criminal property.", "Wrong. There is no suggestion she acquired criminal property.", "Wrong. She did make a disclosure.", "Correct. Disclosing that a report has been made, where likely to prejudice an investigation, is tipping off.", "Wrong. Making a report does not excuse tipping off."]}, {"ch": 5, "n": 9, "sc": ["A solicitor is asked to act for a new client who is a politically exposed person (PEP) from overseas."], "st": "Which level of customer due diligence is required?", "o": ["Due diligence only if money laundering is suspected.", "Standard due diligence only.", "Simplified due diligence.", "No due diligence, provided the client is known to a partner.", "Enhanced due diligence."], "a": "E", "x": ["Wrong. CDD is required regardless of suspicion.", "Wrong. PEPs require more than standard measures.", "Wrong. Simplified due diligence applies to low-risk situations.", "Wrong. Personal knowledge does not remove the requirement.", "Correct. PEPs are a high-risk category requiring enhanced due diligence under the Money Laundering Regulations 2017."]}, {"ch": 5, "n": 10, "sc": ["A solicitor is asked to hold £50,000 for a client who has no apparent reason to use the firm's client account, since there is no underlying legal transaction."], "st": "Which of the following is the best course of action?", "o": ["Refuse to hold the money, as the client account must not be used as a banking facility, and consider whether a report to the nominated officer is needed.", "Hold the money for no longer than 12 months.", "Hold the money, provided the firm charges a fee.", "Hold the money and tell the client that it may be reported.", "Hold the money, as the client has given instructions."], "a": "A", "x": ["Correct. The SRA Accounts Rules prohibit providing a banking facility, and this is a money laundering warning sign.", "Wrong. There is no such time limit allowing it.", "Wrong. Charging does not make it permissible.", "Wrong. Warning the client risks tipping off.", "Wrong. Client instructions do not override the rule."]}, {"ch": 6, "n": 1, "sc": ["A client instructs her solicitor to act for her in the purchase of 75% of the shares of a private limited company from another company. The solicitor is asked to arrange all of the necessary documentation for the purchase. Neither the solicitor nor her firm is authorised by the FCA to carry on a 'regulated activity'."], "st": "Will the solicitor breach the general prohibition if they carry out the activities for the client?", "o": ["Yes, because the solicitor can only carry on a regulated activity if they have FCA authorisation.", "No, because an exclusion applies where such a transaction involves at least 50% of the voting shares in the company.", "No, because all law firms that are authorised to provide reserved legal activities through the SRA can rely on the DPB exemption.", "No, because shares in a private limited company are not specified investments.", "Yes, because no exclusions or exemptions apply."], "a": "B", "bx": "The correct answer was B. There is an exemption where the investment relates to a body corporate and certain criteria are met (eg the transaction involves more than 50% of the shares). Option E is therefore incorrect. Option C is incorrect because only law firms that engage in exempt regulated activities may rely on the exemption and such firms must be registered. Option A is incorrect because some regulated activities can be carried on by virtue of the DPB exemption (and therefore FCA authorisation is not always required). Option D is incorrect because shares in a private limited company are specified investments."}, {"ch": 6, "n": 2, "sc": ["A client asks a solicitor to explain the key differences between a repayment mortgage and an endowment mortgage. Neither the solicitor nor their firm is authorised by the FCA to carry on a regulated activity."], "st": "Can the solicitor give the explanation requested about the types of mortgages without breaching the general prohibition?", "o": ["Yes, because the client has requested the advice from the solicitor.", "No, because the advice is not a necessary part of the provision of his legal services.", "Yes, because the solicitor is not receiving a fee in return for the advice.", "Yes, because the provision of generic advice is outside the scope of the Financial Services and Markets Act 2000.", "No, because the solicitor is not authorised by the FCA to give advice about mortgages."], "a": "D", "bx": "The correct answer was D. The advice sought is generic and is therefore not caught by the Act. All other options are therefore incorrect because they refer to requirements linked to regulated activities."}, {"ch": 6, "n": 3, "sc": ["A solicitor is contacted by an existing client and asked to give advice on whether she should buy a specific plot of land. The client plans to develop the land to return a profit. Neither the solicitor nor her firm is authorised by the FCA to carry on a 'regulated activity'."], "st": "Would the solicitor breach the general prohibition if they give the advice requested?", "o": ["No, because the advice relates to investment in land, which is outside the scope of regulated activities.", "No, because the client has requested the advice and the advice is incidental to the legal services provided to the client.", "Yes, because the advice relates to a specified investment.", "Yes, because the client is an existing client and the advice is incidental to the legal services provided.", "No, because the advice is not specific."], "a": "A", "bx": "The correct answer was A. Remember that land is not a specified investment (therefore, option C is incorrect). As such, activities relating to land investments are not caught by the Act. Because the advice does not relate to any regulated activities, options B and D are incorrect. Option E is incorrect because it refers to the nature of the advice given (the activity) rather than the nature of the investment (specified investment). It is worth noting that while the solicitor will not breach the general prohibition, they may face SRA disciplinary proceedings for giving such advice."}, {"ch": 6, "n": 4, "sc": ["A solicitor works for a firm that relies on the DPB exemption. The solicitor has acted for the client in a recent litigation matter. The client was awarded substantial damages. During a telephone conversation, the solicitor encourages the client to invest in shares in a company. The solicitor then provides the client with a brochure containing information regarding investing in a specific company."], "st": "Has the solicitor communicated a financial promotion in contravention of the Financial Services and Markets Act 2000?", "o": ["No, the solicitor has provided legal advice to the client.", "Yes, the solicitor has communicated a financial promotion and no exemptions are likely to apply.", "No, because the advice was provided over the telephone and so an exemption will likely apply.", "Yes, the solicitor committed an offence at the point they provided the written information to the client.", "No, the solicitor works for an EPF so does not require FCA authorisation."], "a": "B", "bx": "The correct answer was B. There is clear communication of a financial promotion. Such promotions cannot usually be communicated by those not authorised by the FCA (option E is incorrect). The solicitor is promoting an investment opportunity rather than providing legal advice (option A is therefore incorrect). No exemptions are likely to apply, so option C is incorrect. The communication first occurred over a telephone call (a real-time communication), so option D is incorrect."}, {"ch": 6, "n": 5, "sc": ["A solicitor introduces his client to a stockbroker. The solicitor does not give any advice relating to stocks to the client. The solicitor subseq
