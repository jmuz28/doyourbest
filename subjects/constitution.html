The police may impose conditions under s 14.", "Correct. A senior officer may impose conditions on an assembly (place, maximum duration, maximum numbers), but there is no power to ban all assemblies in a district (R (Jones) v Commissioner of Police of the Metropolis [2019]).", "Wrong. The notice requirement applies to processions.", "Wrong. The home secretary's consent concerns banning processions.", "Wrong. Unlike processions, there is no power to ban assemblies generally."]}, {"ch": 5, "n": 8, "sc": ["Police stop coaches carrying protesters on their way to a demonstration at an air base and send them back to London. There is not enough evidence that violence is imminent."], "st": "Which of the following best describes the legal position?", "o": ["The police acted unlawfully because they can only act after violence has occurred.", "The police acted lawfully because they may take any steps to prevent a possible breach of the peace.", "The police acted lawfully because protesters have no right to travel to a demonstration.", "The police acted unlawfully because there was not enough evidence that a breach of the peace was imminent.", "The police acted lawfully because the protest was an unauthorised procession."], "a": "D", "x": ["Wrong. Police may act to prevent an imminent breach of the peace.", "Wrong. Preventive action must be reasonable and depends on an imminent breach.", "Wrong. There is a right to protest, and interference must be justified.", "Correct. In R (Laporte) v Chief Constable of Gloucestershire [2007], it was unlawful to stop people travelling to protest because there was not enough evidence that violence was imminent.", "Wrong. There was no procession offence on these facts."]}, {"ch": 5, "n": 9, "sc": ["During a demonstration, a protester repeatedly swears at a police officer who is managing the crowd. No members of the public are nearby. The protester is charged with causing harassment, alarm or distress under s 5 of the Public Order Act 1986."], "st": "Which of the following best describes the likely outcome?", "o": ["The protester will be convicted because the officer is a person within hearing.", "The protester cannot be charged because s 5 does not apply to protests.", "The protester will be convicted of riot.", "The protester will be convicted because swearing is always abusive.", "The protester is unlikely to be convicted, as police officers are unlikely to be harassed, alarmed or distressed by swearing."], "a": "E", "x": ["Wrong. The officer being within hearing is not enough; they must be likely to be harassed, alarmed or distressed.", "Wrong. Section 5 can apply during protests.", "Wrong. Riot requires 12 or more people using or threatening violence.", "Wrong. The words must be within the hearing or sight of someone likely to be caused harassment, alarm or distress.", "Correct. Whether someone is likely to be harassed, alarmed or distressed is a question of fact. Swearing at police officers is unlikely to be an offence, as they are used to it (DPP v Orum [1988])."]}, {"ch": 5, "n": 10, "sc": ["Twenty-one people stand peacefully on a roadside verge next to a public highway near a monument, protesting against a ban on a festival. They are not blocking the road. They are charged with taking part in a trespassory assembly."], "st": "Which of the following best describes the likely outcome?", "o": ["They will be convicted because any assembly near a monument is a trespassory assembly.", "They will be acquitted because trespassory assemblies are not an offence.", "They will be convicted of obstruction of the highway.", "They will be convicted because the public has only a right to pass and repass along the highway.", "They will be acquitted because their reasonable and non-obstructive use of the highway was not a trespass."], "a": "E", "x": ["Wrong. A trespass must be proved.", "Wrong. Taking part in a prohibited trespassory assembly can be an offence; here, though, there was no trespass.", "Wrong. They were not blocking the highway.", "Wrong. The House of Lords accepted that reasonable, non-obstructive use of the highway, including peaceful assembly, can be lawful.", "Correct. In DPP v Jones (Margaret) [1999], the protesters were acquitted because they were not trespassing: their use of the highway was reasonable and caused no obstruction."]}, {"ch": 6, "n": 1, "sc": ["A local council refuses a building firm planning permission to build an estate. The firm appeals, but the planning inspector upholds the refusal. The planning inspector is the brother of the chair of the council. The building firm seeks judicial review of the decision to refuse planning permission."], "st": "Which of the following arguments would be the most likely to succeed?", "o": ["The refusal is irrational.", "The refusal is illegal.", "The refusal is a breach of legitimate expectation.", "The refusal is a fettering of discretion.", "The refusal is a breach of natural justice."], "a": "E", "bx": "The correct answer was E. The chair of the council is related to the planning inspector. This would give the appearance of bias to the fair-minded and informed observer. There is no need to prove that there was actual bias, just a real possibility of it.", "x": ["Wrong. There is no basis for saying the decision is irrational.", "Wrong. The council and inspector had the power to refuse.", "Wrong. No promise or practice creating a legitimate expectation is suggested.", "Wrong. Nothing suggests a rigid policy fettered the decision.", "Correct. The family link gives the appearance of bias to the fair-minded and informed observer. A real possibility of bias is enough; actual bias need not be proved."]}, {"ch": 6, "n": 2, "sc": ["The secretary of state has power under the [fictitious] Carbon Act 2021 to make regulations on the type of fuel used by airliners, as he sees fit. The Act requires that, before making the regulations, the secretary of", "state shall consult any employer appearing to him to be a substantial employer of persons engaged in aircraft manufacturing. The secretary of state makes regulations, but does not consult a company that is the largest aircraft manufacturer in the UK."], "st": "Which of the following best summarises the legal position?", "o": ["The secretary of state has the power to make any regulations that he wants.", "The secretary of state has absolute discretion on whom he consults.", "The secretary of state has a duty to consult the company.", "The secretary of state may make any regulations he wants, as long as they are neither illegal nor irrational.", "The secretary of state may not make the regulations without the agreement of the company."], "a": "C", "bx": "The correct answer was C. This is because although the secretary of state has discretion upon whom he consults, he must exercise it in a reasonable way. He cannot ignore the largest employer.", "x": ["Wrong. The power to make regulations is subject to the statutory duty to consult.", "Wrong. The discretion over whom to consult must be exercised reasonably.", "Correct. The secretary of state has discretion over whom to consult but must exercise it reasonably, and cannot ignore the largest aircraft manufacturer.", "Wrong. This overlooks procedural impropriety, the failure to consult.", "Wrong. A duty to consult is not a duty to obtain agreement."]}, {"ch": 6, "n": 3, "sc": ["A local council decides that all children in its schools should receive free school meals, irrespective of their family income. The council raises the rate of council tax to pay for this."], "st": "Which of the following would have sufficient interest to apply for judicial review of the decision?", "o": ["Any legal person.", "Any incorporated or statutory body.", "The secretary of state for education.", "Local council taxpayers.", "The prime minister."], "a": "D", "bx": "The correct answer was D. This is because the local taxpayers are directly affected by the decision, because they must pay more council tax. None of the other candidates are affected by the decision.", "x": ["Wrong. Not every legal person has sufficient interest.", "Wrong. Being a corporate or statutory body does not of itself give sufficient interest.", "Wrong. The secretary of state is not directly affected.", "Correct. Local council taxpayers are directly affected because they must pay more council tax.", "Wrong. The prime minister is not directly affected."]}, {"ch": 6, "n": 4, "sc": ["Local councils have the power to grant licences to drive a taxi. A woman applies for a licence but is told by the council that it is not their policy to grant any more taxi licences for their area."], "st": "Which of the following would be the woman's best course of action?", "o": ["The woman should apply for judicial review.", "The woman should sue for breach of contract.", "The woman should apply to the European Court of Human Rights.", "The woman should be advised that the council has the power to refuse licence applications.", "The woman should sue the council for negligent performance of their duties."], "a": "A", "bx": "The correct answer was A. This is because the refusal to grant any licences is a fettering of discretion, which makes the decision illegal. Judicial review is the correct procedure to raise this issue.", "x": ["Correct. A policy of never granting licences fetters the council's discretion, making the decision illegal, and judicial review is the correct procedure.", "Wrong. There is no contract with the council.", "Wrong. Domestic remedies come first, and judicial review is the right route.", "Wrong. The council may refuse individual applications, but not by a blanket policy.", "Wrong. The issue is public law illegality, not negligence."]}, {"ch": 6, "n": 5, "sc": ["The NHS provides a home for seven severely ill patients and has assured them that this accommodation will be available for the rest of their lives. Because of a policy change, the NHS decides to close this home and transfer the seven patients to local council care. The patients object to this change and apply for judicial review."], "st": "Which of the following best summarises the legal position?", "o": ["The patients do not have sufficient interest.", "The NHS may move the patients if it is in the public interest.", "The NHS has no obligation to consult the patients.", "The NHS has no legal power to make this decision.", "The NHS is not a public body."], "a": "B", "bx": "The correct answer was B. This is because, although the NHS have made a promise to a small group of people, they will not have raised a substantive legitimate expectation, if the NHS can show that they had sound policy reasons for making the decision and this is not unfair to the claimants.", "x": ["Wrong. The patients are directly affected and plainly have sufficient interest.", "Correct. A promise to a small group does not create an enforceable substantive legitimate expectation if the NHS has sound policy reasons and the change is not unfair to them.", "Wrong. The promise and its impact may require consultation; this is too absolute.", "Wrong. The NHS does have power to make the decision.", "Wrong. The NHS is a public body."]}, {"ch": 6, "n": 6, "sc": ["A council grants planning permission for a development. A neighbour who objects wants to apply for judicial review of the decision. Ten weeks have passed since the decision was made."], "st": "Which of the following best describes the time limit position?", "o": ["The neighbour must apply within 28 days.", "The neighbour is out of time, as the time limit for planning decisions is six weeks.", "The neighbour is within time, as the time limit is one year.", "The neighbour is within time, as the time limit for judicial review is three months.", "There is no time limit for judicial review."], "a": "B", "x": ["Wrong. 28 days is not the time limit for judicial review.", "Correct. The claim form must generally be filed within three months, but for planning decisions the limit is six weeks, and these limits are strictly applied.", "Wrong. One year is the limit for Human Rights Act claims.", "Wrong. The general limit is three months, but planning decisions have a shorter limit.", "Wrong. Strict time limits apply."]}, {"ch": 6, "n": 7, "sc": ["An Act of Parliament provides that decisions of a specialist tribunal 'shall not be subject to appeal or be liable to be questioned in any court'. A claimant argues that the tribunal made an error of law."], "st": "Which of the following best describes the likely approach of the courts?", "o": ["The courts may review the decision because a decision based on an error of law is not a true decision protected by the clause.", "The claimant must petition Parliament.", "The courts may review the decision only with the minister's permission.", "The courts can only make a declaration of incompatibility.", "The courts cannot review the decision because the ouster clause is clear."], "a": "A", "x": ["Correct. In R (Privacy International) v Investigatory Powers Tribunal [2019], an error of law made a decision legally invalid and ultra vires, so it was not a 'decision' at all and could be judicially reviewed.", "Wrong. Judicial review remains available.", "Wrong. No ministerial permission is needed.", "Wrong. This is not a Human Rights Act issue.", "Wrong. The courts interpret ouster clauses narrowly to protect access to justice."]}, {"ch": 6, "n": 8, "sc": ["A chief constable is dismissed by a police authority without being told of the allegations against him or given any opportunity to respond."], "st": "Which of the following grounds of judicial review is most likely to succeed?", "o": ["Irrationality.", "Illegality, as the authority had no power to dismiss.", "Breach of a legitimate expectation.", "Procedural impropriety, as a breach of the right to a fair hearing.", "Fettering of discretion."], "a": "D", "x": ["Wrong. The real issue is the unfair procedure.", "Wrong. Nothing suggests the authority lacked power to dismiss; the defect is procedural.", "Wrong. No promise or established practice is suggested.", "Correct. Natural justice requires a fair hearing where a public body's decision affects an individual's rights, as when a chief constable was dismissed in Ridge v Baldwin [1964].", "Wrong. No rigid policy is suggested."]}, {"ch": 6, "n": 9, "sc": ["A non-statutory panel, set up by City institutions and woven into the government's system of regulation, makes a decision about a company takeover. The company seeks judicial review. The panel argues it is not a public body because it has no statutory powers."], "st": "Which of the following best describes the legal position?", "o": ["The panel cannot be judicially reviewed because it has no statutory powers.", "The panel can be reviewed only under the Human Rights Act 1998.", "The company must sue the panel in contract instead.", "The panel may be judicially reviewed because it performs a public function.", "The panel may be judicially reviewed only if it receives government funding."], "a": "D", "x": ["Wrong. The source of power is not decisive; what matters is whether the function is public.", "Wrong. Judicial review is available on ordinary public law grounds.", "Wrong. There was no contract; judicial review was the appropriate route.", "Correct. In R v City Panel on Takeovers and Mergers, ex parte Datafin [1987], the panel was performing a public function as part of the government's regulatory system, so it was amenable to judicial review.", "Wrong. Funding is not the test."]}, {"ch": 6, "n": 10, "sc": ["A prisoner serving a mandatory life sentence is told by the home secretary the minimum term he must serve, but is given no reasons for the decision."], "st": "Which of the following best describes the likely outcome of a judicial review?", "o": ["The decision is unlawful because fairness may require reasons to be given unless there is justification for not doing so.", "The decision is lawful because there is no duty to give reasons for any decision.", "The decision is lawful because the home secretary acted under the prerogative.", "The decision is unlawful because it is irrational.", "The decision is lawful because sentencing decisions cannot be reviewed."], "a": "A", "x": ["Correct. In R v Secretary of State for the Home Department, ex parte Doody [1994], the House of Lords held that reasons should be given unless there is justification for not doing so.", "Wrong. In ex parte Doody, fairness required reasons to be given.", "Wrong. The decision was not made under the prerogative, and prerogative decisions may also be reviewable.", "Wrong. The defect is the lack of reasons, a procedural fairness point, not irrationality.", "Wrong. Such decisions can be reviewed."]}, {"ch": 7, "n": 1, "sc": ["The Supreme Court has made a declaration that a section of an Act of Parliament is incompatible with human rights."], "st": "Which of the following statements best summarises the legal position?", "o": ["Parliament is obliged to repeal the offending section.", "Parliament may repeal the offending section.", "Parliament may refer the matter back to the Supreme Court.", "Parliament may wait for the result of any appeal to the European Court of Human Rights.", "Parliament is obliged to compensate the complainant who brought the case."], "a": "B", "bx": "The correct answer was B. This is because Parliament is sovereign. The courts cannot tell Parliament what it must do.", "x": ["Wrong. A declaration of incompatibility does not oblige Parliament to act.", "Correct. Parliament is sovereign, so it may (but need not) repeal the section; the courts cannot tell Parliament what to do.", "Wrong. Parliament does not refer matters back to the Supreme Court.", "Wrong. This is not the legal effect of a declaration.", "Wrong. A declaration creates no obligation to compensate."]}, {"ch": 7, "n": 2, "sc": ["A client alleges that his human rights have been violated and wishes to apply to the European Court of Human Rights."], "st": "Which of the following statements best describes how the application should be made?", "o": ["The client's case must be referred to the European Court of Human Rights by the Supreme Court.", "The client's case may be referred to the European Court of Human Rights by any UK court or tribunal.", "The client must appeal from the final decision of a UK court.", "The client may apply to the European Court of Human Rights.", "The client's case may be referred to the European Court of Human Rights by the High Court or any higher court."], "a": "D", "bx": "The correct answer was D. This is because the UK is a party to the ECHR and must accept the right of victims to complain to that court. However, there is no route of appeal linking the UK courts to the European Court of Human Rights.", "x": ["Wrong. There is no referral route from UK courts to the European Court of Human Rights.", "Wrong. UK courts cannot refer cases to the European Court of Human Rights.", "Wrong. There is no appeal route from UK courts to Strasbourg.", "Correct. The UK accepts the right of individuals to complain to the European Court of Human Rights, but there is no appeal or referral link from the UK courts.", "Wrong. No UK court refers cases to the European Court of Human Rights."]}, {"ch": 7, "n": 3, "sc": ["Section 2 of the Human Rights Act 1998 states that 'a court or tribunal determining a question which has arisen under this Act in connection with a Convention right must take into account any judgment of the European Court of Human Rights'."], "st": "Which of the following statements is the most accurate interpretation of the meaning of these words?", "o": ["A court or tribunal must follow a judgment of the European Court of Human Rights.", "A court or tribunal may choose to follow a judgment of the European Court of Human Rights.", "A court or tribunal should normally follow a judgment of the European Court of Human Rights.", "A court or tribunal must consider a judgment of the European Court of Human Rights.", "A court or tribunal must not follow a judgment of the European Court of Human Rights."], "a": "C", "bx": "The correct answer was C. The UK courts have interpreted s 2 to mean that the UK courts should normally follow decisions of the European Court of Human Rights.", "x": ["Wrong. Section 2 does not make Strasbourg judgments binding.", "Wrong. This understates how the courts have applied s 2.", "Correct. The UK courts have interpreted s 2 to mean that they should normally follow decisions of the European Court of Human Rights.", "Wrong. This reflects the literal words but not how the courts have interpreted them.", "Wrong. Nothing prevents the courts following Strasbourg."]}, {"ch": 7, "n": 4, "sc": ["Under the Human Rights Act 1998 it is unlawful for a public authority to act in a way that is incompatible with a convention right. A 'victim of the unlawful act' may bring proceedings against the authority."], "st": "Which of the following best describes the meaning of victim?", "o": ["A claimant who is aggrieved by the unlawful act.", "A claimant who wishes to stop the unlawful act.", "A claimant who has suffered physical harm from the unlawful act.", "A claimant who has suffered financial loss from the unlawful act.", "A claimant who has been personally affected by the unlawful act."], "a": "E", "bx": "The correct answer was E. This is the definition adopted by the European Court of Human Rights. Section 7(6) of the Human Rights Act 1998 states that UK courts should use the same test.", "x": ["Wrong. Being aggrieved is not enough.", "Wrong. Wanting to stop the act is not enough.", "Wrong. Physical harm is not required.", "Wrong. Financial loss is not required.", "Correct. A victim is someone personally affected by the act. This is the Strasbourg test, which s 7(6) of the Human Rights Act 1998 requires UK courts to use."]}, {"ch": 7, "n": 5, "sc": ["Under the Human Rights Act 1998 claims may be brought against a 'public authority'."], "st": "Which of the following statements best defines the meaning of public authority?", "o": ["A public authority is a person (natural or legal) who receives public funding.", "A public authority is a person (natural or legal) who performs a governmental function.", "A public authority is a person (natural or legal) who has statutory powers.", "A public authority is a person (natural or legal) who performs functions of a public nature.", "A public authority is a person (natural or legal) who performs a public service."], "a": "D", "bx": "The correct answer was D. That is the definition in the Act. The other answers are the factors that a court should consider when deciding whether a person is a public authority.", "x": ["Wrong. Public funding is a factor, not the definition.", "Wrong. Governmental function is a factor, not the definition.", "Wrong. Statutory powers are a factor, not the definition.", "Correct. The Act defines a public authority as a person who performs functions of a public nature; the other options are factors the courts consider.", "Wrong. Providing a public service is a factor, not the definition."]}, {"ch": 7, "n": 6, "sc": ["An Act provides that the surviving spouse, or a person who lived with the tenant 'as his or her wife or husband', may succeed to a tenancy. A man whose same-sex partner has died claims the tenancy. Excluding him would infringe Article 8 (read with Article 14)."], "st": "Which of the following best describes how the court should approach the Act?", "o": ["The court must apply the ordinary meaning and refuse the claim.", "The court must declare the Act invalid.", "The court must refer the question to the European Court of Human Rights.", "The court must make a declaration of incompatibility without considering interpretation.", "The court should interpret the legislation, so far as possible, in a way compatible with Convention rights, and may read the words to include same-sex partners."], "a": "E", "x": ["Wrong. Section 3 requires a Convention-compatible interpretation where possible.", "Wrong. Courts cannot invalidate Acts of Parliament.", "Wrong. UK courts cannot refer cases to Strasbourg.", "Wrong. A declaration under s 4 is only made if a compatible interpretation is not possible.", "Correct. Section 3 of the Human Rights Act 1998 requires legislation to be read compatibly with Convention rights so far as possible. In Ghaidan v Godin-Mendoza [2004], the words were interpreted to include a same-sex couple."]}, {"ch": 7, "n": 7, "sc": ["The government introduces a Bill which the minister in charge believes may infringe Convention rights. The government still wants to proceed with it."], "st": "Which of the following best describes the minister's obligation under s 19 of the Human Rights Act 1998?", "o": ["The minister must obtain the consent of the European Court of Human Rights.", "The minister must withdraw the Bill.", "The minister must either make a statement of compatibility or state that they cannot make one but the government wishes to proceed.", "The minister must hold a referendum.", "The minister must obtain the approval of the Supreme Court."], "a": "C", "x": ["Wrong. Strasbourg plays no role in the legislative process.", "Wrong. The Human Rights Act does not prevent Parliament making laws that infringe rights.", "Correct. Section 19 requires the minister to make a statement of compatibility, or to state that they cannot do so but the government wants to proceed with the Bill.", "Wrong. No referendum is required.", "Wrong. There is no pre-enactment approval by the courts."]}, {"ch": 7, "n": 8, "sc": ["A woman believes that a local authority breached her Article 8 rights by unlawfully disclosing her medical records. The disclosure happened 14 months ago. She wishes to bring a claim under the Human Rights Act 1998."], "st": "Which of the following best describes the time limit position?", "o": ["She is out of time because the time limit for Human Rights Act claims is one year.", "She is within time because there is no time limit for human rights claims.", "She is out of time because the limit is three months.", "She is out of time because the limit is six weeks.", "She is within time because the limit is six years."], "a": "A", "x": ["Correct. The time limit for Human Rights Act claims is one year, so a claim brought 14 months later is out of time.", "Wrong. There is a time limit.", "Wrong. Three months is the general judicial review limit.", "Wrong. Six weeks is the limit for planning judicial reviews.", "Wrong. Six years is not the limit for Human Rights Act claims."]}, {"ch": 7, "n": 9, "sc": ["A suspected terrorist is held by a public authority and subjected to inhuman and degrading treatment. The authority argues that the treatment was justified to protect national security."], "st": "Which of the following best describes the legal position?", "o": ["The treatment is lawful if authorised by a judge in advance.", "The treatment is lawful if it is in accordance with the law.", "The treatment is lawful if it is proportionate to the threat to national security.", "The treatment breaches Article 8 only.", "The treatment breaches Article 3, which is an unqualified right that can never be justified."], "a": "E", "x": ["Wrong. No authorisation can justify inhuman or degrading treatment.", "Wrong. Being in accordance with the law does not make it lawful under Article 3.", "Wrong. Proportionality applies to qualified rights, not Article 3.", "Wrong. This is primarily an Article 3 issue.", "Correct. Article 3 is the only unqualified right: torture or inhuman or degrading treatment is never permitted."]}, {"ch": 7, "n": 10, "sc": ["A public authority places a covert surveillance camera in a person's home to investigate suspected crime. There is no legal basis for the surveillance."], "st": "Which of the following best describes whether the interference with Article 8 can be justified?", "o": ["It cannot be justified because Article 8 is an absolute right.", "It is justified because Article 8 is subject to exceptions.", "It is justified because the prevention of crime is a legitimate aim.", "It cannot be justified because any interference with a qualified right must be in accordance with the law, as well as necessary in a democratic society for a legitimate aim.", "It is justified if the authority acted in good faith."], "a": "D", "x": ["Wrong. Article 8 is a qualified right.", "Wrong. The exceptions only apply if their conditions are met.", "Wrong. A legitimate aim is not enough without a legal basis.", "Correct. Under Article 8(2), an interference must be in accordance with the law and necessary in a democratic society for a listed aim, such as preventing crime. Without a legal basis, it cannot be justified.", "Wrong. Good faith does not satisfy the requirements."]}, {"ch": 8, "n": 1, "sc": ["A client is involved in a legal dispute and wishes to know whether an article of the Trade and Cooperation Agreement between the UK and EU can be enforced in a national court."], "st": "Which of the following statements best describes how an article is enforced?", "o": ["Depending upon the wording, the article may be directly applicable.", "Depending upon the wording, the article has direct effect.", "Depending upon the wording, the article has horizontal direct effect.", "Depending upon the wording, the article has vertical direct effect.", "Depending upon the wording, the article has vertical and horizontal direct effect."], "a": "E", "bx": "The correct answer was E. Although the UK has left the EU, it has agreed that articles of the Trade and Cooperation Agreement can have direct effect, meaning that they are enforceable in a UK court. Articles have both vertical and horizontal direct effect.", "x": ["Wrong. Direct applicability describes how regulations operated during membership, not how TCA articles are enforced.", "Wrong. This is incomplete: the articles have both vertical and horizontal direct effect.", "Wrong. This is incomplete: they also have vertical direct effect.", "Wrong. This is incomplete: they also have horizontal direct effect.", "Correct. The UK has agreed that, depending on their wording, articles of the Trade and Cooperation Agreement can have direct effect, both vertical and horizontal, in UK courts."]}, {"ch": 8, "n": 2, "sc": ["A man was unaware that EU law still had any effect in the UK, so you need to explain what 'assimilated law' is."], "st": "Which of the following statements most accurately describes assimilated law?", "o": ["assimilated law is the EU law that applied when the UK joined the EU.", "assimilated law is the EU law that was implemented by delegated legislation.", "assimilated law is the EU law that applied before leaving the EU.", "assimilated law is the EU law passed by the European Parliament.", "assimilated law is the EU law made applicable by the Withdrawal Agreement."], "a": "C", "bx": "The correct answer was C. The UK kept the EU law that applied in the UK on 31 December 2020. Retained EU law, that has not been specifically repealed, has now been converted into assimilated law.", "x": ["Wrong. Assimilated law reflects EU law as at the end of the transition period, not when the UK joined.", "Wrong. It is not confined to EU law implemented by delegated legislation.", "Correct. The UK kept the EU law that applied on 31 December 2020; retained EU law not specifically repealed has been converted into assimilated law.", "Wrong. It is not limited to law passed by the European Parliament.", "Wrong. Assimilated law is not law made applicable by the Withdrawal Agreement."]}, {"ch": 8, "n": 3, "sc": ["What was once EU law is now known as assimilated law in the UK."], "st": "Which of the following statements is the most accurate description of how the UK courts may interpret assimilated law?", "o": ["A UK court may refer questions of assimilated law to the CJEU.", "A UK court is bound by decisions of the CJEU on assimilated law.", "A UK court is bound to follow previous decisions of a UK court on assimilated law.", "A UK court may depart from previous decisions of UK courts and the CJEU on assimilated law.", "A higher UK court may depart from previous decisions of UK courts and the CJEU on assimilated law."], "a": "E", "bx": "The correct answer was E. This is because UK courts may no longer refer questions of what was once EU law to the CJEU and are no longer bound by EU law. However, the lower courts are still bound by past precedents defining the meaning of EU law. As is usual in the precedent system, only the higher courts, the Court of Appeal and the Supreme Court, may change past precedents.", "x": ["Wrong. UK courts can no longer refer questions to the CJEU.", "Wrong. UK courts are no longer bound by CJEU decisions.", "Wrong. This is too broad: the higher courts may depart from past precedents.", "Wrong. This is too broad: lower courts remain bound by past precedents.", "Correct. UK courts are not bound by EU law or the CJEU and cannot refer questions to it, but under normal precedent rules only the higher courts (Court of Appeal and Supreme Court) can depart from past precedents."]}, {"ch": 8, "n": 4, "sc": ["EU law remains in force in the UK as 'assimilated law'. If assimilated law conflicts with UK law, which source of law must UK courts follow?"], "st": "Which of the following statements is the most accurate statement of the legal position?", "o": ["UK law has supremacy over assimilated law.", "Assimilated law has supremacy over UK law.", "Assimilated law has supremacy over UK law enacted before leaving the EU.", "UK law has supremacy over assimilated law unless the assimilated law protects human rights.", "Assimilated law has supremacy over UK case law but not UK statute law."], "a": "A", "bx": "The correct answer was A. When the UK left the EU, retained EU law had supremacy over UK Acts of Parliament enacted before leaving the UK. When retained EU law was converted into assimilated law, assimilated law had no supremacy over UK law. The normal position of a UK Act of Parliament being supreme over any other source of law was restored. EU general principles of law protecting human rights no longer apply in the UK and even the Human Rights Act 1998 could be repealed.", "x": ["Correct. Assimilated law has no supremacy over UK law, so the normal supremacy of an Act of Parliament is restored.", "Wrong. Assimilated law has no supremacy.", "Wrong. That described retained EU law, before its conversion into assimilated law.", "Wrong. EU general principles protecting human rights no longer apply in the UK.", "Wrong. Assimilated law has no supremacy over UK law of any kind."]}, {"ch": 8, "n": 5, "sc": ["The UK completed its Withdrawal Agreement (the Trade and Cooperation Agreement) with the EU in 2020. The UK accepted that the Withdrawal Agreement could be enforced in UK courts."], "st": "Which of the following does the Withdrawal Agreement allow claimants in the UK courts to do?", "o": ["Enforce rights created under the Withdrawal Agreement.", "Enforce rights created under EU regulations.", "Enforce rights created under EU directives.", "Enforce decisions made by the CJEU.", "Enforce rights created under EU decisions."], "a": "A", "bx": "The correct answer was A. This is because the UK agreed in the Withdrawal Agreement to allow provisions of the Agreement that meet the conditions for direct effect under EU law to be enforced in UK courts.", "x": ["Correct. The UK agreed that provisions of the agreement meeting the conditions for direct effect could be enforced in UK courts.", "Wrong. EU regulations as such are not enforceable under the agreement.", "Wrong. EU directives as such are not enforceable under the agreement.", "Wrong. CJEU decisions are not enforceable in UK courts under the agreement.", "Wrong. EU decisions as such are not enforceable under the agreement."]}, {"ch": 8, "n": 6, "sc": ["Before Brexit, a claimant sought to rely directly on an article of the EU Treaty in a national court, without any national implementing legislation."], "st": "Which of the following best describes when a Treaty article had direct effect, following Van Gend en Loos?", "o": ["A Treaty article had direct effect only against private parties.", "A Treaty article had direct effect only after a CJEU ruling in the claimant's case.", "A Treaty article had direct effect only if the national Parliament approved it.", "Treaty articles never had direct effect.", "A Treaty article had direct effect if it was clear, precise and unconditional, creating individual rights enforceable in national courts."], "a": "E", "x": ["Wrong. Direct effect was not limited to private parties.", "Wrong. No case-specific CJEU ruling was required.", "Wrong. No separate national approval was required.", "Wrong. Van Gend en Loos established that Treaty articles may have direct effect.", "Correct. Van Gend en Loos [1963] held that Treaty articles with clear, unconditional and precise wording create individual rights enforceable in national courts."]}, {"ch": 8, "n": 7, "sc": ["A client asks when retained EU law became 'assimilated law' in the UK."], "st": "Which of the following is the correct date?", "o": ["31 December 2020.", "31 December 2023.", "31 January 2020.", "1 January 2024.", "1 January 2021."], "a": "D", "x": ["Wrong. That was IP completion day, when EU law ceased to have effect in the UK.", "Wrong. Conversion took effect from 1 January 2024.", "Wrong. That was exit day, when the UK ceased to be an EU member.", "Correct. Under the Retained EU Law (Revocation and Reform) Act 2023, retained EU law converted into assimilated law from 1 January 2024.", "Wrong. Retained EU law existed from then, but it was not yet assimilated law."]}, {"ch": 8, "n": 8, "sc": ["A government minister wants to update a piece of assimilated law in the light of scientific developments, using delegated legislation."], "st": "Which of the following best describes the minister's power?", "o": ["The minister must use the super-affirmative procedure.", "The minister must use the affirmative resolution procedure.", "The minister can change assimilated law only by an Act of Parliament.", "The minister has powers to revoke, reform, update or restate assimilated law by delegated legislation, using only the negative resolution procedure.", "The minister needs the CJEU's agreement."], "a": "D", "x": ["Wrong. Only the negative resolution procedure is required.", "Wrong. The affirmative procedure is not required.", "Wrong. Ministers have extensive delegated powers over assimilated law.", "Correct. Under the Retained EU Law (Revocation and Reform) Act 2023, ministers have extensive powers to change assimilated law (including Acts of Parliament) by delegated legislation, needing only the negative resolution procedure. These include updating for technological or scientific change.", "Wrong. The CJEU has no role."]}, {"ch": 8, "n": 9, "sc": ["While the UK was an EU member, Spanish fishermen argued that the Merchant Shipping Act 1988 breached EU law by restricting their right to register fishing vessels in the UK."], "st": "Which of the following best describes how the House of Lords approached this conflict in Factortame?", "o": ["The House of Lords referred the matter to the European Court of Human Rights.", "The House of Lords held that the conflict could only be resolved by Parliament repealing the 1972 Act.", "The House of Lords applied the Act because Parliament is sovereign and EU law could not prevail.", "The House of Lords held that the European Communities Act 1972 had given EU law supremacy over UK Acts, so the conflicting Act could be disapplied.", "The House of Lords declared the Act incompatible with the Human Rights Act 1998."], "a": "D", "x": ["Wrong. Strasbourg was not involved.", "Wrong. The court gave effect to EU law supremacy under the 1972 Act.", "Wrong. During membership, Parliament had accepted EU law supremacy through the 1972 Act
