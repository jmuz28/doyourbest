<script>
const D={"t": ["The constitution and conventions", "Parliament: Parliamentary sovereignty and parliamentary privilege", "Central government and devolved institutions", "The Crown and the royal prerogative", "Legislation: Primary and secondary", "Public order law", "Judicial review", "Human rights", "European Union law"], "q": [{"ch": 0, "n": 1, "sc": ["The government wants to repeal the Human Rights Act 1998. The [fictitious] Human Rights (Repeal) Bill has been passed by the Commons by a large majority. The House of Lords, however, has rejected the Bill, also by a large majority."], "st": "Which of the following best describes the legal position in this case?", "o": ["It is not possible to repeal the Human Rights Act 1998 because that would breach an international treaty, the European Convention on Human Rights.", "The government must obtain royal assent.", "The government must obtain consent from the House of Lords.", "The government must pass the Bill through the Commons again.", "The government must wait a year and then pass the Bill through the Commons again."], "a": "E", "bx": "The correct answer was E. If the House of Lords disagrees with the House of Commons, this is the procedure required by the Parliament Acts 1911 and 1949. All Acts of Parliament may be repealed, even important constitutional Acts.", "x": ["Wrong. Every Act of Parliament can be repealed, even important constitutional Acts; a treaty does not limit Parliament's legislative power.", "Wrong. Royal assent is needed for any Bill, but it does not deal with the Lords' rejection.", "Wrong. Under the Parliament Acts 1911 and 1949 the Lords' consent is not required.", "Wrong. Simply passing the Bill through the Commons again at once is not enough; the Parliament Acts require a one-year delay.", "Correct. Where the Lords reject a Bill, the Parliament Acts 1911 and 1949 allow the Commons to pass it again after a year without the Lords' consent."]}, {"ch": 0, "n": 2, "sc": ["The Scottish Parliament votes to reduce the rate of income tax in that country. The UK government disagrees with this course of action."], "st": "Which of the following best describes the course of action the UK government can take to stop this?", "o": ["Negotiate with the Scottish government.", "Use the royal prerogative.", "Nothing, the Scottish Parliament has the power to legislate on this subject.", "Pass a UK Act of Parliament.", "Order the Scottish government not to do this."], "a": "D", "bx": "The correct answer was D. Although the Scottish Parliament has the power to change the income tax rate under the Scotland Act 2012, the UK Parliament has sovereignty and can overrule it.", "x": ["Wrong. Negotiation is possible politically, but it does not give the UK government any legal means to stop the change.", "Wrong. There is no prerogative power to override a devolved legislature.", "Wrong. The Scottish Parliament has the power, but the UK Parliament remains sovereign and can still overrule it.", "Correct. Although the Scotland Act 2012 gives the Scottish Parliament power over the income tax rate, the UK Parliament is sovereign and can overrule it by Act.", "Wrong. The UK government has no power simply to order a devolved government to stop legislating within its competence."]}, {"ch": 0, "n": 3, "sc": ["The Lord Chancellor is obligated by law to uphold the independence of the judiciary. A judge has been much criticised in the media for a controversial decision he has made. The Lord Chief Justice (LCJ) wants the Lord Chancellor to defend the judge, but the Lord Chancellor declines."], "st": "What options are available to the Lord Chancellor?", "o": ["The LCJ may seek a judicial review to compel the Lord Chancellor to act.", "The LCJ may only seek to criticise the Lord Chancellor.", "The LCJ can do nothing, as the Lord Chancellor is his constitutional superior.", "The LCJ can do nothing, as the Lord Chancellor decides the meaning of an Act.", "The LCJ can do nothing, as the obligation owed by the Lord Chancellor is too vague to enforce."], "a": "B", "bx": "The correct answer was B. This is because the guarantee of judicial independence is not specific enough to be enforced in the courts. But it does lay down a principle that could be used as a basis of criticism.", "x": ["Wrong. The duty is not specific enough to be enforced in the courts, so judicial review would not compel the Lord Chancellor to act.", "Correct. The guarantee of judicial independence is too general to be enforced in court, but it sets out a principle that can be the basis of criticism.", "Wrong. The Lord Chancellor is not the LCJ's constitutional superior, and the LCJ can at least criticise.", "Wrong. It is the courts, not the Lord Chancellor, that interpret Acts of Parliament.", "Wrong. The duty is too vague to enforce in court, but that does not leave the LCJ with nothing: he can criticise."]}, {"ch": 0, "n": 4, "sc": ["A client who has been accused of speeding approaches a solicitor for legal advice. He is to be tried in the magistrates' court for this alleged offence, but he claims that he has a constitutional right under Magna Carta to trial by jury."], "st": "What advice should the solicitor give him?", "o": ["Magna Carta has been repealed, so trial by jury is no longer guaranteed.", "Magna Carta is a document with no legal effect.", "Speeding is governed by road traffic legislation.", "All constitutional rights are subject to exceptions.", "The UK does not have a written constitution guaranteeing rights."], "a": "C", "bx": "The correct answer was C. This is because although Magna Carta is an Act of Parliament, all Acts of Parliament can be repealed or amended by later Acts of Parliament.", "x": ["Wrong. Magna Carta is an Act of Parliament; the point is that later Acts can override it, not that it has been repealed in full.", "Wrong. Magna Carta does have legal effect as an Act of Parliament.", "Correct. Magna Carta is an Act of Parliament, but every Act can be repealed or amended by a later Act. Speeding is governed by later road traffic legislation, which determines how the offence is tried.", "Wrong. This is too vague; the actual reason is that later legislation overrides the earlier Act.", "Wrong. It is true that the UK has no written constitution, but this misses the point that later statute prevails over Magna Carta."]}, {"ch": 0, "n": 5, "sc": ["The Supreme Court has decided that a certain category of self-employed people are not liable to pay income tax. The government is concerned because there are thousands of people in this category and there will be a major loss of tax revenue."], "st": "What is the best course of action that the government could take?", "o": ["Use the royal prerogative to tax the self-employed.", "Appeal the decision to the European Court of Human Rights.", "Order the Justices of the Supreme Court to change their decision.", "Use Parliament to pass an Act amending the tax law.", "Accept the decision of the Supreme Court."], "a": "D", "bx": "The correct answer was D. This is because Parliament has sovereignty and can change any law it wants, including decisions by the highest court. There is no prerogative power to tax; only Parliament can do this.", "x": ["Wrong. There is no prerogative power to tax; only Parliament can do this.", "Wrong. The European Court of Human Rights is not an appeal court for domestic tax decisions.", "Wrong. The government cannot order the judges to change their decision; that would offend judicial independence.", "Correct. Parliament is sovereign and can change any law, including the effect of a decision of the highest court, by passing an amending Act.", "Wrong. The government does not have to accept the decision: Parliament can change the law."]}, {"ch": 0, "n": 6, "sc": ["A former Cabinet minister plans to publish memoirs revealing private Cabinet discussions held many years ago. The government relies on the convention of Cabinet confidentiality and asks the court to stop the publication solely because the convention has been breached."], "st": "Which of the following best describes the legal position?", "o": ["The court must refer the matter to Parliament because only Parliament can enforce conventions.", "The court must stop publication because the convention of Cabinet confidentiality is legally binding.", "The court will stop publication because conventions take priority over Acts of Parliament.", "The court will stop publication because breach of a convention is a criminal offence.", "The court will not enforce the convention as such, because conventions are not legally enforceable."], "a": "E", "x": ["Wrong. There is no legal procedure for Parliament to enforce conventions in this way.", "Wrong. Conventions are non-legal rules; the courts do not enforce them.", "Wrong. Conventions are not law and cannot override an Act of Parliament.", "Wrong. Breach of a convention is not a criminal offence.", "Correct. The courts will not enforce conventions, as shown with Cabinet confidentiality in Attorney General v Jonathan Cape [1976]. Conventions are obeyed mainly because of the political difficulties of breaking them."]}, {"ch": 0, "n": 7, "sc": ["The prime minister advises the King to prorogue Parliament for five weeks at a critical time, without any reasonable justification, preventing Parliament from scrutinising the government. A campaigner challenges the advice in court."], "st": "Which of the following best describes the likely outcome?", "o": ["The court will declare the prorogation incompatible with the Human Rights Act 1998.", "The court will refuse to consider the case because prorogation is a matter of convention.", "The court will hold that the King personally acted unlawfully.", "The court will hold that the prorogation was lawful because the prerogative power to prorogue is unlimited.", "The court will hold that the prorogation was unlawful because it frustrated Parliament's ability to carry out its constitutional functions without reasonable justification."], "a": "E", "x": ["Wrong. The case was not decided under the Human Rights Act 1998.", "Wrong. In R (Miller) v Prime Minister [2019] the Supreme Court did decide the lawfulness of the prorogation.", "Wrong. The King acts on the advice of the prime minister; the challenge concerns that advice.", "Wrong. The prerogative is limited by the constitutional principles of parliamentary sovereignty and accountability.", "Correct. In R (Miller) v Prime Minister [2019], the court found no legal power under the prerogative to suspend Parliament for over a month without reasonable justification, because it would prevent ministerial accountability to Parliament."]}, {"ch": 0, "n": 8, "sc": ["A student argues that the UK is a federal state because the Scottish Parliament, Senedd Cymru and the Northern Ireland Assembly each have their own law-making powers."], "st": "Which of the following best describes the UK constitution?", "o": ["The UK is a federal state because devolution is protected by a written constitution.", "The UK is a unitary state because sovereign power is retained by central government and Parliament, even though power has been devolved.", "The UK is a confederation of four independent countries.", "The UK is a federal state because legislative power is divided between central and regional bodies.", "The UK is a unitary state only in relation to England."], "a": "B", "x": ["Wrong. The UK has no written constitution protecting devolution.", "Correct. In a unitary state, sovereign powers are concentrated in central government. Devolved bodies get their powers from Acts of the UK Parliament, which remains sovereign.", "Wrong. The four parts of the UK are not independent states.", "Wrong. In a federal state power is divided by a constitution; devolution in the UK does not divide sovereignty.", "Wrong. The whole UK is a unitary state."]}, {"ch": 0, "n": 9, "sc": ["An Act of Parliament passed in 1985 appears to conflict with a provision of an earlier Act that is regarded as a constitutional statute. The later Act does not expressly refer to the earlier one."], "st": "Which of the following best describes how the court would approach the conflict, applying Thoburn v Sunderland City Council?", "o": ["The earlier constitutional statute cannot be impliedly repealed; it could only be repealed expressly.", "The court will refer the conflict to Parliament.", "Constitutional statutes can never be repealed.", "The later Act impliedly repeals the earlier Act, as with any two inconsistent Acts.", "The court will declare the later Act invalid."], "a": "A", "x": ["Correct. In Thoburn, Laws LJ said the European Communities Act 1972 could not be impliedly repealed by a 1985 Act that seemed to contradict it; it could only be repealed expressly.", "Wrong. There is no procedure for referring such a conflict to Parliament.", "Wrong. Constitutional statutes can be repealed, but only expressly.", "Wrong. Thoburn established that constitutional statutes are an exception to implied repeal.", "Wrong. The courts cannot declare an Act of Parliament invalid."]}, {"ch": 0, "n": 10, "sc": ["An Act of Parliament contains general words giving a minister power to set fees for using a tribunal. The minister sets fees so high that many people cannot afford to bring claims. The Act does not expressly authorise restricting access to the courts."], "st": "Which of the following best describes how the courts are likely to approach the minister's power?", "o": ["The courts will refer the fees to Parliament for approval.", "The courts must uphold the fees because the Act gives the minister a broad power.", "The courts can only make a declaration of incompatibility.", "The courts will declare the Act of Parliament invalid.", "The courts will interpret the Act so that it does not authorise fees that contravene the fundamental principle of access to the courts."], "a": "E", "x": ["Wrong. The courts do not refer delegated measures to Parliament.", "Wrong. General words are interpreted in line with fundamental constitutional principles.", "Wrong. The courts can interpret the general words narrowly, so a declaration is unnecessary.", "Wrong. The courts cannot declare an Act invalid; the issue is the scope of the minister's power.", "Correct. The courts interpret Acts so that they do not contravene fundamental constitutional principles such as access to the courts (R (Unison) v Lord Chancellor [2017]). Only an Act that expressly restricts such a right must be obeyed."]}, {"ch": 1, "n": 1, "sc": ["A client approaches a solicitor about a parliamentary Bill that he opposes. The House of Commons has agreed to it twice, but the House of Lords has rejected it."], "st": "What steps could the client take to prevent the Bill becoming law?", "o": ["The client could petition the monarch to refuse the royal assent.", "The client could ask the Supreme Court to declare the Bill unconstitutional.", "The client could petition the House of Lords to reject the Bill again.", "The client could petition the monarch, but they would not refuse the royal assent.", "The client could petition the House of Commons to reconsider."], "a": "D", "bx": "The correct answer was D. This is because under the sovereignty of Parliament, the courts will not question an Act of Parliament nor investigate the procedure under which it was passed. This includes the Parliament Act procedures, where if a Bill is passed twice by the House of Commons, the agreement of the House of Lords is not required. The Bill will still require the royal assent, but this is never refused.", "x": ["Wrong. The client could petition the monarch, but the royal assent is never refused.", "Wrong. The courts will not question an Act of Parliament or the procedure under which it was passed.", "Wrong. Once the Parliament Act procedure has been used, the Lords' agreement is not required.", "Correct. The client may petition the monarch, but royal assent is never refused, and the courts will not look into Parliament Act procedures.", "Wrong. The Commons has already agreed to the Bill twice; this is not a legal way of preventing it."]}, {"ch": 1, "n": 2, "sc": ["A campaigning group that protects the rights of children claims that a new Children's Act contravenes the United Nations Convention on the Rights of the Child. The UK is a party to this international treaty."], "st": "Which of the following is the most likely outcome for the group?", "o": ["The group could apply to the European Court of Human Rights.", "The group could apply to the International Court of Justice, which is the court of the United Nations.", "The group could apply to a UK court, but that court would enforce the Children's Act.", "The group could apply to a UK court and that court would hold the Children's Act invalid.", "The group could apply to a UK court and that court would declare that the Children's Act was incompatible with human rights."], "a": "C", "bx": "The correct answer was C. This is because under the sovereignty of Parliament, the courts will not question an Act of Parliament. Whether the Act contravenes international law or not is irrelevant.", "x": ["Wrong. The European Court of Human Rights deals with the ECHR, not the UN Convention on the Rights of the Child.", "Wrong. Individuals and groups cannot bring this kind of claim before the International Court of Justice.", "Correct. Under parliamentary sovereignty, the courts will not question an Act of Parliament, so they would enforce the Children's Act. Whether it breaches international law is irrelevant.", "Wrong. UK courts have no power to hold an Act of Parliament invalid.", "Wrong. A declaration of incompatibility concerns ECHR rights under the Human Rights Act, not the UN Convention."]}, {"ch": 1, "n": 3, "sc": ["A client has had his land confiscated by an Act of Parliament. He claims that, contrary to Parliament's own standing orders, he was not notified that this was being considered, so he was unable to put forward his arguments that the Bill should not be passed."], "st": "Which of the following is the most likely decision of the court in this matter?", "o": ["The court will investigate whether the client's claim was true.", "The court will declare the Act to be invalid.", "The court will interpret the Act so that it does not deprive the client of his right to property.", "The court will judicially review the Act for breach of natural justice.", "The court will not investigate the client's claim."], "a": "E", "bx": "The correct answer was E. This is because under the sovereignty of Parliament, the courts will not question an Act of Parliament nor investigate the procedure under which it was passed. There are many theoretical arguments that, in certain circumstances, an Act of Parliament would be invalid, but none of them have succeeded in court.", "x": ["Wrong. The courts will not investigate the procedure by which an Act was passed.", "Wrong. The courts cannot declare an Act of Parliament invalid.", "Wrong. Interpretation cannot avoid an Act that expressly confiscates the land.", "Wrong. Acts of Parliament cannot be judicially reviewed for breach of natural justice.", "Correct. Under parliamentary sovereignty, the courts will not question an Act or investigate the procedure under which it was passed, even if standing orders were breached."]}, {"ch": 1, "n": 4, "sc": ["During a debate in the House of Commons, an MP accuses a famous businessman of a serious criminal offence. The MP is interviewed outside Parliament, where he repeats the allegation. A newspaper reports the debate and the interview with the MP. The businessman wants to sue for defamation."], "st": "Which of the following best summarises the legal position?", "o": ["Only the MP can be sued.", "Only the newspaper can be sued.", "Neither the newspaper nor the MP can be sued.", "The MP cannot be sued.", "Both the MP and newspaper can be sued."], "a": "E", "bx": "The correct answer was E. What is said in a parliamentary proceeding, such as a debate, is protected by absolute privilege. If, however, it is repeated outside Parliament, there is no protection from defamation proceedings. Fair and accurate reports of parliamentary proceedings are protected by qualified privilege, but not the repetition of statements made outside of a parliamentary proceeding.", "x": ["Wrong. The newspaper's report of the interview repeated outside Parliament is not protected either.", "Wrong. The MP is liable for repeating the allegation outside Parliament.", "Wrong. Neither is protected: the MP repeated the allegation outside Parliament, and the newspaper reported that repetition.", "Wrong. The MP is protected for the debate but not for the repetition outside Parliament.", "Correct. What was said in the debate has absolute privilege, but the repetition outside Parliament is not protected. A fair and accurate report of the debate has qualified privilege, but a report of the outside repetition does not."]}, {"ch": 1, "n": 5, "sc": ["A client is an MP, who is employed as a parliamentary consultant, by the Road Transport Group, at an annual salary of £10,000. The Road Transport Group opposes proposed new restrictions on the hours worked by lorry drivers. The Group instructs their consultant MP to vote against these measures in Parliament and say that they will no longer employ him if he refuses."], "st": "Which of the following best summarises the position of the client?", "o": ["An MP cannot have a job with an outside body.", "An MP cannot receive any payments from an outside body.", "An MP can be dismissed from their consultancy with an outside body.", "An MP cannot be instructed on how to vote by an outside body.", "An MP can have a job with an outside body."], "a": "D", "bx": "The correct answer was D. MPs are permitted outside interests, although they must register them, but the body or person that employs them must not try to control the MP's conduct in Parliament. If the employer told their MP how to vote, this would be a breach of parliamentary privilege and they could be punished for contempt of Parliament.", "x": ["Wrong. MPs are allowed outside interests, provided they register them.", "Wrong. MPs may be paid by outside bodies, subject to registration.", "Wrong. The issue is not whether the consultancy can end but that the employer is trying to control the MP's vote.", "Correct. MPs may have registered outside interests, but no outside body may try to control an MP's conduct in Parliament. An instruction on how to vote would be a breach of parliamentary privilege and could be punished as contempt of Parliament.", "Wrong. This is true but incomplete: it misses the key point that the employer cannot tell the MP how to vote."]}, {"ch": 1, "n": 6, "sc": ["An Act of Parliament passed in 2010 requires local councils to publish certain information annually. A later ordinary Act passed in 2022 is inconsistent with that requirement but does not expressly mention the 2010 Act."], "st": "Which of the following best describes the legal position?", "o": ["The 2010 Act prevails because Parliament cannot change an earlier Act without expressly repealing it.", "Both Acts are void for inconsistency.", "The court must decide which Act is more reasonable.", "The 2022 Act prevails because, under the doctrine of implied repeal, a later inconsistent Act repeals the earlier one to the extent of the inconsistency.", "The court must make a declaration of incompatibility."], "a": "D", "x": ["Wrong. Ordinary Acts can be impliedly repealed; only constitutional statutes need express repeal (Thoburn).", "Wrong. The courts cannot declare Acts void.", "Wrong. The courts do not judge the reasonableness of Acts of Parliament.", "Correct. Parliament cannot bind its successors, and an ordinary later Act impliedly repeals an earlier inconsistent Act to the extent of the inconsistency.", "Wrong. Declarations of incompatibility concern Convention rights under the Human Rights Act 1998."]}, {"ch": 1, "n": 7, "sc": ["Several MPs are charged with false accounting after making false expenses claims. They argue that their expenses claims are parliamentary proceedings protected by parliamentary privilege, so they cannot be prosecuted."], "st": "Which of the following best describes the legal position?", "o": ["Only the Speaker can authorise the prosecution.", "The MPs may be prosecuted only if Parliament first votes to expel them.", "The MPs may be prosecuted because parliamentary privilege does not prohibit prosecution for false expenses claims.", "The MPs cannot be prosecuted because expenses claims are proceedings in Parliament.", "The MPs may only be disciplined by the House of Commons."], "a": "C", "x": ["Wrong. No such authorisation is required.", "Wrong. Expulsion is not a precondition of prosecution.", "Correct. Making false expenses claims is subject to the criminal law, and parliamentary privilege does not prohibit prosecution (R v Chaytor [2010]).", "Wrong. Submitting expenses claims is not a protected parliamentary proceeding.", "Wrong. The criminal courts have jurisdiction alongside Parliament's own disciplinary procedures."]}, {"ch": 1, "n": 8, "sc": ["A court must interpret an ambiguous section of an Act of Parliament. One party wants to rely on a clear statement made in Parliament by the minister promoting the Bill, recorded in Hansard."], "st": "Which of the following best describes whether the court may consider the statement?", "o": ["The court may never look at parliamentary debates, because of parliamentary privilege.", "The court must follow the minister's statement whatever the wording of the Act.", "The court must ask Parliament to confirm what the section means.", "The court may look at Hansard to help decide the meaning of the statute, following Pepper v Hart.", "The court may look at Hansard only if both parties agree."], "a": "D", "x": ["Wrong. Pepper v Hart allows reference to Hansard in appropriate cases.", "Wrong. Hansard is only an aid to interpretation; the statutory words govern.", "Wrong. There is no procedure for asking Parliament to interpret its Acts.", "Correct. Under Pepper v Hart [1992], the court may look at a parliamentary debate to help decide the meaning of a statute.", "Wrong. The parties' agreement is not the test."]}, {"ch": 1, "n": 9, "sc": ["A House of Commons committee publishes an official report, by order of the House, containing statements that a company says are defamatory. The company wants to sue the House's publisher."], "st": "Which of the following best describes the legal position?", "o": ["The company can sue only if the report was inaccurate.", "The publisher can be sued because publications outside the chamber are not protected.", "The company must apply to the Speaker for permission to sue.", "The publication is protected by absolute privilege under the Parliamentary Papers Act 1840.", "The publication has only qualified privilege, so malice must be proved."], "a": "D", "x": ["Wrong. Absolute privilege does not depend on accuracy.", "Wrong. The Parliamentary Papers Act 1840 protects official parliamentary publications.", "Wrong. There is no such permission procedure.", "Correct. After Stockdale v Hansard, Parliament passed the Parliamentary Papers Act 1840, giving its official publications absolute privilege.", "Wrong. Qualified privilege applies to fair and accurate media reports, not to Parliament's official publications."]}, {"ch": 1, "n": 10, "sc": ["The Speaker of the House of Commons certifies that a Bill contains only provisions dealing with taxation. The House of Lords refuses to pass it."], "st": "Which of the following best describes the legal position?", "o": ["The Bill must be referred to a Joint Committee of both Houses.", "The Supreme Court must decide whether the Bill is a money Bill.", "The Bill cannot become law without the agreement of the House of Lords.", "The House of Lords can delay the Bill for one year.", "The Bill can be presented for royal assent if the Lords have not passed it within one month."], "a": "E", "x": ["Wrong. There is no requirement to refer money Bills to a Joint Committee.", "Wrong. The Speaker certifies money Bills, and the courts do not question parliamentary procedure.", "Wrong. The Lords do not have to agree to a money Bill.", "Wrong. The one-year delay applies to ordinary public Bills, not money Bills.", "Correct. Under the Parliament Acts, the Lords may only delay a money Bill (taxation or expenditure) for one month, after which it can become an Act without their agreement."]}, {"ch": 2, "n": 1, "sc": ["The prime minister wishes to appoint a key adviser as a Cabinet minister. The appointment of ministers is governed by convention."], "st": "Which of the following conventions would govern this appointment?", "o": ["The adviser must be a member of the House of Commons or the House of Lords.", "The adviser must be a member of the House of Commons.", "The adviser must be nominated by the Cabinet.", "The adviser must be nominated by the prime minister's political party.", "The adviser must be a member of the House of Lords."], "a": "A", "bx": "The correct answer was A. This is because convention requires a minister to be a member of either of the two Houses of Parliament. Otherwise, the minister cannot be accountable to Parliament.", "x": ["Correct. Convention requires a minister to be a member of either House of Parliament, so that they are accountable to Parliament.", "Wrong. Ministers may also come from the House of Lords.", "Wrong. Ministers are chosen by the prime minister, not nominated by the Cabinet.", "Wrong. There is no convention that the party must nominate ministers.", "Wrong. Ministers may come from either House, not only the Lords."]}, {"ch": 2, "n": 2, "sc": ["A civil servant in the Home Office authorises the unlawful deportation of an alleged illegal immigrant."], "st": "Which of the following is the most appropriate person against whom legal action should be taken?", "o": ["The civil servant.", "Her Majesty's government.", "The secretary of state for home affairs.", "The attorney general.", "The prime minister."], "a": "C", "bx": "The correct answer was C. This is because the government minister in charge of the department takes legal responsibility for what happens in their department.", "x": ["Wrong. Legal responsibility for the department's actions rests with the minister, not the individual civil servant.", "Wrong. Action is brought against the responsible minister, not the government in general.", "Correct. The minister in charge of the department takes legal responsibility for what happens in that department.", "Wrong. The attorney general is not responsible for Home Office decisions.", "Wrong. The prime minister is not legally responsible for individual departmental decisions."]}, {"ch": 2, "n": 3, "sc": ["A government minister has been convicted for driving while disqualified. The prime minister seeks advice upon whether he must require the minister to resign. The Independent Adviser on Ministerial Standards consults the Ministerial Code to advise the prime minister."], "st": "Which of the following best describes the position under the code?", "o": ["The minister must resign if he commits a criminal offence.", "The minister must resign if he is in breach of collective responsibility.", "The minister must resign if he is in breach of Cabinet confidentiality.", "The minister must resign if he compromises the political impartiality of the Civil Service.", "The minister must resign if he knowingly misleads Parliament."], "a": "E", "bx": "The correct answer was E. This is because the Ministerial Code tells ministers what they can and cannot do, but only in this example does it require resignation. Usually, resignation is left to the discretion of the prime minister.", "x": ["Wrong. A criminal offence does not automatically require resignation under the Code; that is for the prime minister to decide.", "Wrong. Breach of collective responsibility is not an automatic resignation matter under the Code.", "Wrong. Breach of Cabinet confidentiality does not of itself require resignation under the Code.", "Wrong. This is a breach of the Code but not one that requires resignation.", "Correct. The Ministerial Code only requires resignation where a minister knowingly misleads Parliament; otherwise resignation is at the prime minister's discretion."]}, {"ch": 2, "n": 4, "sc": ["The first minister of Northern Ireland wishes to appoint a member of his political party, John, as a minister."], "st": "Which of the following best describes the procedure for doing this?", "o": ["The first minister nominates John and the monarch appoints him.", "The first minister appoints John.", "The first minister appoints John with the agreement of the deputy first minister.", "A political party in the Northern Ireland Assembly nominates John.", "The first minister appoints John with the agreement of the secretary of state for Northern Ireland."], "a": "D", "bx": "The correct answer was D. This is what the devolution legislation for Northern Ireland requires. It is unusual because in the government of the UK, Scotland and Wales the prime minister or first minister nominates a minister and the King appoints them.", "x": ["Wrong. In Northern Ireland, ministers are not nominated by the first minister and then appointed by the monarch.", "Wrong. The first minister does not appoint ministers in Northern Ireland.", "Wrong. Ministers are not appointed jointly by the first and deputy first ministers.", "Correct. The Northern Ireland devolution legislation requires ministers to be nominated by the political parties in the Assembly. This differs from the UK, Scotland and Wales, where the prime minister or first minister nominates and the King appoints.", "Wrong. The secretary of state for Northern Ireland plays no part in appointing ministers."]}, {"ch": 2, "n": 5, "sc": ["An Act of the Scottish Parliament is passed, with a simple majority, declaring that Scotland is an independent country and no longer part of the UK."], "st": "Which of the following best describes the effect of this Act?", "o": ["The Act would only be law in Scotland.", "The Act would not be law because it is outside the legislative competence of the Scottish Parliament.", "The Act would not be law because a two-thirds majority of the Scottish Parliament is required.", "The Act would be law if the Supreme Court agreed.", "The Act would be law for all of the UK."], "a": "B", "bx": "The correct answer was B. This is because the devolution legislation for Scotland does not allow the Scottish Parliament to legislate on the Union with England or the constitution. Remember that the devolved legislatures have limited powers.", "x": ["Wrong. The Act would not be law even in Scotland, as it is outside competence.", "Correct. The Scotland Act does not allow the Scottish Parliament to legislate on the Union with England or the constitution, so the Act is outside its legislative competence.", "Wrong. No majority, however large, gives the Scottish Parliament competence over the Union.", "Wrong. The Supreme Court cannot validate an Act that is outside competence.", "Wrong. The Scottish Parliament cannot legislate for the whole UK."]}, {"ch": 2, "n": 6, "sc": ["A senior civil servant in a government department makes a decision under a statutory power that the Act gives to the secretary of state. The secretary of state never personally considered the case. The affected person argues that the decision is invalid because the minister did not make it."], "st": "Which of the following best describes the legal position?", "o": ["The decision is valid because civil servants have their own independent statutory powers.", "The decision is invalid unless the civil servant was given written authority.", "The decision is invalid because only the secretary of state can exercise the power.", "The decision is valid only if Parliament approves it.", "The decision is valid because civil servants may act in the name of the minister, who remains accountable to Parliament."], "a": "E", "x": ["Wrong. The civil servant acts in the minister's name, not under an independent power.", "Wrong. The Carltona principle does not require written authority.", "Wrong. The Carltona principle allows officials to act for the minister.", "Wrong. Parliamentary approval is not needed.", "Correct. Under Carltona v Commissioner of Works [1943], civil servants may exercise the minister's powers in the minister's name, and the minister remains responsible to Parliament."]}, {"ch": 2, "n": 7, "sc": ["The Cabinet decides to build a new airport runway. A Cabinet minister who opposes the decision gives a press conference publicly criticising it, while wishing to remain in the government. The convention has not been suspended."], "st": "Which of the following best describes the minister's position under the convention of collective responsibility?", "o": ["The minister may criticise the decision because ministers have freedom of speech.", "The minister must support the Cabinet decision or resign.", "The minister must be dismissed by the King.", "The minister may criticise the decision only in the House of Lords.", "The courts may order the minister to stop criticising the decision."], "a": "B", "x": ["Wrong. Collective responsibility requires ministers to support Cabinet decisions.", "Correct. Collective responsibility means all ministers must support Cabinet decisions; a minister who cannot do so is expected to resign.", "Wrong. Ministers are appointed and dismissed on the advice of the prime minister; the convention operates politically.", "Wrong. The convention applies wherever the minister speaks.", "Wrong. Conventions are not enforced by the courts."]}, {"ch": 2, "n": 8, "sc": ["The UK Parliament passes an Act on a devolved matter in Scotland without the consent of the Scottish Parliament. The Scottish government argues that the Act is invalid because it breaches s 2 of the Scotland Act 2016."], "st": "Which of the following best describes the legal position?", "o": ["The Act is valid because the Sewel Convention, although recognised in statute, is a convention that the courts will not enforce.", "The Act must be referred to the Scottish Parliament for approval.", "The Act is valid only in England and Wales.", "The Act is invalid because the Sewel Convention is now a statutory rule enforceable by the courts.", "The Act is invalid because devolved matters are outside the competence of the UK Parliament."], "a": "A", "x": ["Correct. Section 2 of the Scotland Act 2016 recognises that the UK Parliament will not normally legislate on devolved matters without consent. But in R (Miller) v Secretary of State for Exiting the EU [2017] the Supreme Court held this is a convention that cannot be enforced as law.", "Wrong. There is no legal requirement for Scottish approval.", "Wrong. The Act is valid as legislated, including for Scotland.", "Wrong. Miller (2017) held that statutory recognition did not turn the convention into an enforceable legal rule.", "Wrong. The UK Parliament remains sovereign and can legislate on any matter."]}, {"ch": 2, "n": 9, "sc": ["The Scottish government introduces a Bill in the Scottish Parliament to hold a referendum on Scottish independence, without any agreement from the UK government. The Lord Advocate refers the question of competence to the Supreme Court."], "st": "Which of the following best describes the likely outcome?", "o": ["The Scottish Parliament can legislate for the referendum with a two-thirds majority.", "The Scottish Parliament cannot legislate for the referendum because it relates to reserved matters such as the Union.", "The Scottish Parliament can legislate for the referendum because it would only be advisory.", "The Scottish Parliament can legislate for the referendum because the Sewel Convention protects it.", "The Supreme Court will refuse to decide because the issue is political."], "a": "B", "x": ["Wrong. No special majority gives competence over reserved matters.", "Correct. In Reference by the Lord Advocate of devolution issues [2022], the Supreme Court held that the Scottish Parliament cannot legislate for a referendum on Scottish independence.", "Wrong. The Supreme Court held that even an advisory referendum relates to reserved matters.", "Wrong. The Sewel Convention concerns UK legislation on devolved matters; it gives the Scottish Parliament no extra competence.", "Wrong. The Supreme Court did decide the reference."]}, {"ch": 2, "n": 10, "sc": ["A tribunal orders a government department to disclose certain communications under the Freedom of Information Act 2000. The Attorney General uses the statutory veto to override the decision simply because he disagrees with it."], "st": "Which of the following best describes the legal position?", "o": ["The veto can only be used if there are reasonable grounds, and the courts will scrutinise it closely.", "The veto is valid because Cabinet communications are always protected by convention.", "The veto is invalid because ministers can never override judicial decisions.", "The veto can only be challenged by Parliament.", "The veto is valid because ministers may override courts and tribunals whenever they wish."], "a": "A", "x": ["Correct. A minister may override a court decision on disclosure only if the court is satisfied there are reasonable grounds (R (Evans) v Attorney General [2015]). The courts interpret such powers to protect the independence of the judiciary.", "Wrong. Under the Freedom of Information Act 2000, communications can be disclosed if in the public interest; convention does not prevent this.", "Wrong. The statute allows a veto, but only on reasonable grounds.", "Wrong. The veto can be challenged in the courts.", "Wrong. Mere disagreement is not enough."]}, {"ch": 3, "n": 1, "sc": ["After a general election, no political party has a majority in the House of Commons. The existing prime minister wants to carry on in office."], "st": "Which of the following statements best summarises what the monarch should do?", "o": ["The monarch should dismiss the prime minister.", "The monarch should appoint the leader of the largest political party in the House of Commons as prime minister.", "The monarch should agree that the prime minister can carry on in office.", "The monarch should advise the prime minister to form a coalition government of the two largest parties in the House of Commons.", "The monarch should allow the political parties in the House of Commons to negotiate."], "a": "E", "bx": "The correct answer was E. This is because the convention is that the prime minister should be able to command a majority in the House of Commons. If there is no obvious candidate, the parties in the Commons would be left to negotiate a coalition or minority government. The monarch should not become involved.", "x": ["Wrong. The monarch should not intervene by dismissing the prime minister.", "Wrong. The test is who can command a majority in the Commons, not simply who leads the largest party.", "Wrong. The monarch should not take sides by endorsing the existing prime minister.", "Wrong. The monarch should not advise on forming a coalition.", "Correct. The convention is that the prime minister must command a majority in the Commons. Where there is no obvious candidate, the parties should be left to negotiate and the monarch should not become involved."]}, {"ch": 3, "n": 2, "sc": ["A close relative of the monarch is prosecuted for dangerous driving."], "st": "Which of the following best summarises the legal position?", "o": ["The relative can be prosecuted, but not sentenced to imprisonment.", "The relative has immunity from the criminal law.", "The Crown Proceedings Act 1947 means that the law cannot be enforced against the relative.", "By convention, members of the royal family are not prosecuted for minor offences.", "The relative has no legal immunities or privileges."], "a": "E", "bx": "The correct answer was E. This is because only the monarch is above the law. The rest of the royal family have no legal immunities. Be careful. You were asked about the legal position, not about convention.", "x": ["Wrong. The relative has no special protection from sentencing.", "Wrong. Only the monarch is immune; other royals are not.", "Wrong. The Crown Proceedings Act 1947 concerns the Crown as government, not royal relatives.", "Wrong. The question asks about the legal position, not convention.", "Correct. Only the monarch is above the law; other members of the royal family have no legal immunities or privileges."]}, {"ch": 3, "n": 3, "sc": ["An overseas possession of the Crown has been invaded by a foreign state. The government decides to send armed forces to recapture the territory. The government requisitions a ship, belonging to a private company, to transport soldiers to the possession and refuses to pay any compensation."], "st": "Which of the following best summarises the legal position?", "o": ["The government has no legal power to requisition a ship.", "The government has the legal power to requisition a ship.", "The government has the legal power to requisition a ship, but must pay compensation.", "The government has no legal power to requisition a ship, without the authority of an Act of Parliament.", "The government has no legal power to requisition a ship, without the permission of Parliament."], "a": "C", "bx": "The correct answer was C. This because the government has a prerogative power to requisition property for use in military action. Case law states that compensation must be paid.", "x": ["Wrong. There is a prerogative power to requisition property for military action.", "Wrong. The power exists, but compensation must be paid.", "Correct. The government has a prerogative power to requisition property for military action, but case law (De Keyser) requires compensation to be paid.", "Wrong. No Act of Parliament is needed; this is a prerogative power.", "Wrong. Parliament's permission is not required to use the prerogative."]}, {"ch": 3, "n": 4, "sc": ["A man has been refused a passport on the grounds that he is not a UK citizen. He believes that he can prove that he is a UK citizen."], "st": "Which of the following best summarises the man's legal position?", "o": ["If the man can prove he is a UK citizen, the government must give him a passport.", "The man cannot challenge a decision made under the royal prerogative.", "If the man can prove he is a UK citizen, the government has a discretion to give him a passport.", "If the man can prove he is a UK citizen, the government must have a valid reason for refusing him a passport.", "The man cannot challenge the citizenship or the passport decision."], "a": "D", "bx": "The correct answer was D. This is because although the granting of a passport is a prerogative power, refusal could be judicially reviewed if there was no legal or rational reason for rejection.", "x": ["Wrong. Issuing a passport is a discretionary prerogative power; citizenship does not create an absolute entitlement.", "Wrong. Some prerogative decisions, such as passports, can be judicially reviewed.", "Wrong. The discretion is not unlimited: a refusal must have a lawful and rational reason.", "Correct. Granting a passport is a prerogative power, but a refusal could be judicially reviewed if there was no lawful or rational reason for it.", "Wrong. Both the citizenship question and the passport refusal can be challenged."]}, {"ch": 3, "n": 5, "sc": ["A volcanic eruption causes an emergency on a Caribbean island. The prime minister wants to send armed forces to the island to provide humanitarian assistance to the islanders."], "st": "Which of the following is the best description of the legal position?", "o": ["The prime minister needs the agreement of the House of Commons.", "The prime minister needs legislation to authorise this.", "The prime minister can send the armed forces, but must justify it to the House of Commons.", "The prime minister needs the agreement of the monarch.", "The prime minister has the power to do this and does not need any authorisation."], "a": "C", "bx": "The correct answer was C. This is because a convention has developed in the twenty-first century that the Commons must authorise the deployment of the armed forces abroad for military action. This does not apply to emergencies or humanitarian actions, where the government is merely accountable to Parliament.", "x": ["Wrong. The convention requiring Commons agreement applies to military action, not humanitarian deployments.", "Wrong. No legislation is needed; this is a prerogative power.", "Correct. The modern convention that the Commons authorises deployment abroad applies to military action. For humanitarian action the government is merely accountable to Parliament.", "Wrong. The monarch acts on ministerial advice; their agreement is a formality.", "Wrong. This ignores the government's accountability to Parliament."]}, {"ch": 3, "n": 6, "sc": ["During wartime the government took possession of a hotel for military use. An Act of Parliament covering the same matter provided for compensation. The government argues that it acted under the royal prerogative instead, so no compensation is payable."], "st": "Which of the following best describes the legal position?", "o": ["Compensation is payable only if Parliament votes for it.", "The government may choose to act under either the prerogative or the Act.", "Where an Act covers the same ground, the prerogative is superseded, and the government must act under the Act and pay compensation.", "The prerogative prevails because it is older than the Act.", "No compensation is payable in wartime."], "a": "C", "x": ["Wrong. Compensation was due under the existing Act.", "Wrong. Where an Act covers the same ground, the government cannot rely on the prerogative instead.", "Correct. In Attorney General v De Keyser's Royal Hotel [1920] the government had to compensate under the Defence of the Realm Act 1914, because the sovereignty of Parliament must be respected.", "Wrong. Acts of Parliament supersede prerogative powers.", "Wrong. The Act provided for compensation."]}, {"ch": 3, "n": 7, "sc": ["A trade union challenges a decision made under the royal prerogative to ban union membership for staff at a national security establishment. The government argues that prerogative decisions can never be judicially reviewed."], "st": "Which of the following best describes the legal position following the GCHQ case?", "o": ["Prerogative decisions can be reviewed only with the monarch's consent.", "All prerogative decisions can be reviewed in the same way as statutory decisions.", "Some prerogative decisions can be reviewed, but areas of high government policy such as national security may be non-justiciable.", "Prerogative decisions can never be judicially reviewed.", "Prerogative decisions can be reviewed only on grounds of human rights."], "a": "C", "x": ["Wrong. No such consent is required.", "Wrong. Some subjects are non-justiciable.", "Correct. The GCHQ case held that only some prerogatives can be reviewed: decisions affecting citizens' rights may be, but areas of high government policy are non-justiciable.", "Wrong. The GCHQ case held that some prerogative powers are reviewable.", "Wrong. The grounds of review are illegality, irrationality and procedural impropriety."]}, {"ch": 3, "n": 8, "sc": ["Parliament passed an Act replacing a prerogative compensation scheme with a statutory one, but the minister never brought the Act into force. Instead, the minister introduced a new prerogative scheme with lower rates of compensation."], "st": "Which of the following best describes the legal position?", "o": ["The minister acted unlawfully because the executive cannot use the prerogative to frustrate the will of Parliament.", "The minister acted lawfully because the Act was not yet in force.", "The minister acted lawfully because compensation schemes are non-justiciable.", "The minister acted lawfully because commencement is entirely a matter for the minister.", "The minister acted unlawfully because prerogative powers were abolished by the Act."], "a": "A", "x": ["Correct. In R v Secretary of State for the Home Department, ex parte Fire Brigades Union [1995], the House of Lords held that the executive could not use the prerogative to frustrate the will of Parliament.", "Wrong. Even though the Act was not in force, the minister could not use the prerogative to undermine it.", "Wrong. The House of Lords did review the decision.", "Wrong. The minister's discretion over commencement does not allow the Act to be frustrated.", "Wrong. The prerogative had not been abolished; the problem was frustrating Parliament's will."]}, {"ch": 3, "n": 9, "sc": ["The government proposes to withdraw from an international treaty using the royal prerogative. The treaty was given effect by an Act of Parliament and confers rights on UK citizens in domestic law."], "st": "Which of the following best describes the legal position?", "o": ["The government needs the approval of the monarch only.", "An Act of Parliament is required because withdrawal would change domestic law and remove rights.", "The government cannot withdraw from the treaty in any circumstances.", "The government may withdraw using the prerogative because treaty-making is a prerogative power.", "The government needs only a resolution of the House of Commons."], "a": "B", "x": ["Wrong. The monarch acts on ministerial advice; this does not avoid the need for an Act.", "Correct. In R (Miller) v Secretary of State for Exiting the EU [2017], the Supreme Court held that because withdrawal would change UK law and citizens' rights, an Act of Parliament was required.", "Wrong. Withdrawal is possible if Parliament authorises it.", "Wrong. The prerogative cannot be used to change domestic law.", "Wrong. A resolution is not enough to change the law."]}, {"ch": 3, "n": 10, "sc": ["A court finds that a government minister has disobeyed an order not to deport a person while legal proceedings were pending. The minister argues that court orders cannot be made against the Crown."], "st": "Which of the following best describes the legal position?", "o": ["Court orders can be made against ministers, and a minister who disobeys can be found in contempt of court.", "Only the monarch can discipline a minister.", "The Crown Proceedings Act 1947 gives ministers full immunity from the law.", "The minister cannot be subject to court orders because he acts for the Crown.", "The minister can be prosecuted for a criminal offence but not found in contempt."], "a": "A", "x": ["Correct. In M v Home Office [1994], the Crown was interpreted to mean the monarch personally. Court orders can therefore be made against government ministers, who can be punished for contempt if they disobey.", "Wrong. Ministers are subject to the jurisdiction of the courts.", "Wrong. The Crown Proceedings Act 1947 restricted the Crown's immunities: the Crown can be sued in contract and tort.", "Wrong. In M v Home Office, the Crown was interpreted to mean the monarch personally.", "Wrong. Contempt of court is available against ministers."]}, {"ch": 4, "n": 1, "sc": ["A client is being tried for an offence under an Act of Parliament that was not in force on the date when the offence was committed."], "st": "Which of the following decisions would the court make?", "o": ["The court would declare the Act of Parliament void.", "The court would order Parliament to either bring the Act into force or repeal it.", "The court would acquit the client.", "The court would make a declaration of incompatibility under the Human Rights Act 1998.", "The court would convict the client."], "a": "C", "bx": "The correct answer was C. This is because if an Act of Parliament is not in force it is not the law. It is a basic principle of statutory interpretation that an Act of Parliament is not retrospective unless it explicitly says so.", "x": ["Wrong. The court cannot declare an Act void; the point is that it was not yet law.", "Wrong. The court has no power to order Parliament to act.", "Correct. An Act that is not in force is not law, and an Act is not retrospective unless it expressly says so, so the client must be acquitted.", "Wrong. No Convention incompatibility arises; the Act simply did not apply.", "Wrong. The client cannot be convicted under a law that was not in force when the act was done."]}, {"ch": 4, "n": 2, "sc": ["The largest political party in the House of Lords is opposed to a Bill that has passed all its stages in the House of Commons and wants to prevent this Bill from becoming law."], "st": "Which of the following statements best summarises the legal position?", "o": ["The House of Lords can vote against the Bill and prevent it becoming law.", "The House of Lords can only amend the Bill, but not prevent it from becoming law.", "The House of Lords may refer the Bill to a Joint Committee of the Commons and Lords.", "The House of Lords may delay the Bill, but not prevent it from becoming law.", "The House of Lords can vote against the Bill and then royal assent will be refused."], "a": "D", "bx": "The correct answer was D. This is because the House of Lords cannot prevent the House of Commons passing an Act, but only delay the Commons for a year. Usually, the two Houses compromise and agree amendments, because the government does not want to wait a year for its legislation.", "x": ["Wrong. The Lords cannot permanently prevent a Bill becoming law.", "Wrong. The Lords can do more than amend; they can delay the Bill.", "Wrong. This is not the legal mechanism for opposing a Bill.", "Correct. The Lords cannot stop the Commons passing an Act but can delay it for a year under the Parliament Acts.", "Wrong. Royal assent is never refused."]}, {"ch": 4, "n": 3, "sc": ["A haulage firm objects to some new regulations made by the secretary of state for transport. They have been approved by both Houses of Parliament, but the haulage firm can prove that the enabling Act does not give the secretary of state the power to make these regulations. The firm seeks a judicial review."], "st": "Which of the following best summarises the legal position?", "o": ["The secretary of state has an inherent power to make regulations.", "The secretary of state may use the royal prerogative to make regulations.", "The secretary of state's regulations have been approved by Parliament and are legal.", "The secretary of state's regulations are illegal and void.", "The secretary of state's regulations cannot be judicially reviewed."], "a": "D", "bx": "The correct answer was D. This is because there must be a power under an enabling or parent Act, which allows the secretary of state to make the regulations. Without such a power, Parliament's approval is irrelevant.", "x": ["Wrong. Ministers have no inherent power to make regulations; it must come from a parent Act.", "Wrong. The prerogative cannot be used to make these regulations.", "Wrong. Parliamentary approval cannot cure regulations made without power.", "Correct. Delegated legislation must be authorised by the enabling Act; without that power the regulations are illegal and void, whatever Parliament has approved.", "Wrong. Delegated legislation can be judicially reviewed."]}, {"ch": 4, "n": 4, "sc": ["In a court case, the Supreme Court has declared that a particular section of an Act of Parliament is incompatible with the human rights protected under the Human Rights Act 1998. The secretary of state for home affairs wishes to remove the incompatibility as soon as possible."], "st": "Which of the following courses of action would take the least time?", "o": ["The secretary of state could ask Parliament to repeal the offending Act of Parliament.", "The secretary of state could ask Parliament to amend the offending Act of Parliament.", "The secretary of state could ask the Supreme Court to reconsider the case.", "The secretary of state could ask Parliament to repeal the Human Rights Act 1998.", "The secretary of state could ask Parliament to make a Remedial Order."], "a": "E", "bx": "The correct answer was E. This is because there is a 'fast-track' procedure under s 10 of the Human Rights Act 1998, where a Remedial Order may be made that can repeal or amend an Act of Parliament. As it is delegated legislation, it does not have to go through the numerous stages required for a parliamentary Bill.", "x": ["Wrong. Repealing the Act takes time, as a Bill must go through all its parliamentary stages.", "Wrong. An amending Act also needs the full Bill procedure.", "Wrong. The Supreme Court has already decided; this would not remove the incompatibility.", "Wrong. Repealing the Human Rights Act would be slow and would not remove the incompatibility in the offending Act.", "Correct. Section 10 of the Human Rights Act 1998 provides a fast-track Remedial Order, a form of delegated legislation that can amend or repeal the incompatible provision without full Bill procedure."]}, {"ch": 4, "n": 5, "sc": ["A new set of regulations has been made by the secretary of state using a statutory power that requires the affirmative resolution procedure. The House of Commons and the House of Lords have not voted to approve these regulations. A client wishes to judicially review these regulations."], "st": "Which of the following best summarises the legal position?", "o": ["The court would declare the regulations void for procedural impropriety.", "The court would declare the regulations valid, as minor defects in procedure are immaterial.", "The court would refer the regulations back to Parliament for approval.", "The court would refuse to judicially review legislation.", "The court would ask the secretary of state to confirm that he approves the regulations."], "a": "A", "bx": "The correct answer was A. This is because procedural impropriety is one of the bases of judicial review. Failure to comply with the laying requirements laid down in the parent Act might lead to the court declaring the regulations void.", "x": ["Correct. Failure to follow the affirmative resolution procedure required by the parent Act is procedural impropriety, so the court may declare the regulations void.", "Wrong. Failure to obtain required parliamentary approval is not a minor defect.", "Wrong. The court does not refer regulations back to Parliament.", "Wrong. Delegated legislation can be judicially reviewed.", "Wrong. The minister's approval is irrelevant; the Act requires approval by both Houses."]}, {"ch": 4, "n": 6, "sc": ["A government Bill contains a clause allowing the secretary of state to amend or repeal provisions of the Act itself by regulations."], "st": "What is this type of clause called?", "o": ["A money Bill clause.", "A Remedial Order.", "A Henry VIII clause.", "A commencement clause.", "A sunset clause."], "a": "C", "x": ["Wrong. Money Bills concern taxation and expenditure.", "Wrong. A Remedial Order is a particular measure under s 10 of the Human Rights Act 1998, not the general name for such clauses.", "Correct. A Henry VIII clause gives a minister power to change an Act of Parliament using delegated legislation. It is controversial because it lets the executive make law instead of the legislature.", "Wrong. A commencement clause deals with when an Act comes into force.", "Wrong. A sunset clause makes legislation expire on a set date."]}, {"ch": 4, "n": 7, "sc": ["Regulations are made by a minister under a parent Act that requires the negative resolution procedure. Thirty days after the regulations were laid, the House of Lords passes a resolution annulling them."], "st": "Which of the following best describes the legal position?", "o": ["The regulations were law when made, but have been annulled by the resolution within the 40-day period.", "The regulations must be referred to the Supreme Court.", "The regulations were never law because they needed approval by both Houses.", "The regulations remain law because only the House of Commons can annul them.", "The regulations remain law because the House of Lords cannot interfere with delegated legislation."], "a": "A", "x": ["Correct. Under the negative resolution procedure, the legislation is law when made but may be annulled by a resolution of either House within 40 days.", "Wrong. No referral is required.", "Wrong. That describes the affirmative procedure.", "Wrong. A resolution of either House may annul.", "Wrong. The House of Lords has this power under the negative procedure."]}, {"ch": 4, "n": 8, "sc": ["A client is concerned that a planned Order in Council will damage her business. She wants to petition the King to stop it."], "st": "What is the best advice to give her?", "o": ["She should apply to the Supreme Court to block the Order before it is made.", "She should make her objections to the government department and minister responsible, as the King and Privy Council play only a ceremonial role.", "She should do nothing, as Orders in Council cannot be challenged.", "She should petition the Privy Council, which decides the content of the Order.", "She should petition the King, who decides whether to approve Orders in Council."], "a": "B", "x": ["Wrong. There is no procedure to block an Order before it is made.", "Correct. The King and Privy Council only play a ceremonial role in approving this secondary legislation; the government department and minister actually decide.", "Wrong. Delegated legislation may be challenged, for example by judicial review once made.", "Wrong. The Privy Council is merely a ceremonial body nowadays.", "Wrong. The King's role in approving Orders in Council is only ceremonial."]}, {"ch": 4, "n": 9, "sc": ["An Act of Parliament receives royal assent. It states that its provisions will come into force on a day appointed by the secretary of state in regulations. No regulations have yet been made."], "st": "Which of the following best describes the legal position?", "o": ["The King decides when the Act comes into force.", "The Act is not yet in force; it will come into force on the dates set by the secretary of state's regulations.", "The Act is in force but cannot be enforced in court.", "The Act will automatically come into force one year after royal assent.", "The Act is in force from royal assent."], "a": "B", "x": ["Wrong. Commencement is decided by the Act or the minister, not the King.", "Correct. An Act may contain a section stating when it comes into force or, more commonly, delegate power to a minister to set the date by order or regulation. Different parts may come into force at different times.", "Wrong. An Act that is not in force is not law.", "Wrong. There is no automatic one-year rule.", "Wrong. Where commencement is delegated, the Act is not in force until the appointed day."]}, {"ch": 4, "n": 10, "sc": ["The Scottish Parliament passes an Act that interferes with landowners' rights to property in a way that is incompatible with the ECHR."], "st": "Which of the following best describes the legal position?", "o": ["The Act is valid because the courts will always respect the decision of an elected body.", "The courts can only make a declaration of incompatibility.", "Only the UK Parliament can decide whether the Act is valid.", "The Act is valid because the Scottish Parliament is sovereign within Scotland.", "The Act can be held to be outside competence and not law because it is incompatible with Convention rights."], "a": "E", "x": ["Wrong. The courts give respect to the elected body (Axa), but they can still find an Act incompatible.", "Wrong. Declarations of incompatibility apply to UK Acts; devolved Acts incompatible with the ECHR are outside competence.", "Wrong. The courts decide questions of devolved competence.", "Wrong. The Scottish Parliament is not sovereign; its powers are limited by statute.", "Correct. The devolved legislatures have limited powers. In Salvesen v Riddell [2013], a Scottish Act was held incompatible with the ECHR because it infringed the right to property."]}, {"ch": 5, "n": 1, "sc": ["The police learn that a man plans to lead a public procession through the streets of a major town to protest police violence. He has not notified the police of the procession."], "st": "Which of the following best summarises the legal position?", "o": ["The failure to notify means that the police may ban the public procession.", "The failure to notify means that the police may ban the public procession with the permission of the home secretary.", "The failure to notify means that the police may ban the public procession with the permission of the local council and home secretary.", "The failure to notify means that the police may impose conditions on the route of the procession.", "The failure to notify means that the police may prosecute the man for an offence."], "a": "E", "bx": "The correct answer was E. This is because the power to impose conditions depends upon the senior officer of police reasonably believing that the procession may result in serious public disorder, serious damage to property or serious disruption to the life of the community or that the purpose of the organisers is to intimidate others. To ban the procession, the chief officer of police must reasonably believe that there will be serious public disorder. Failure to notify is just an offence that may be committed by the organiser.", "x": ["Wrong. Failure to notify does not give the police a power to ban; a ban requires reasonable belief of serious public disorder.", "Wrong. Failure to notify does not trigger the banning procedure.", "Wrong. As above, failure to notify is not a ground for a ban.", "Wrong. Conditions depend on a reasonable belief of serious disorder, damage, disruption or intimidation, not on failure to notify.", "Correct. Failure to give notice is simply an offence that may be committed by the organiser."]}, {"ch": 5, "n": 2, "sc": ["A man is a supporter of United and attends a football match against City. When he leaves the ground, he and his fellow United supporters are stopped from walking to the railway station by the police. In the previous fixture between United and City there had been many violent clashes between the supporters of the two clubs. The police tell the United supporters that they must wait one hour for the City supporters", "to disperse. The man refuses to obey the police officer, tries to push past him and is arrested."], "st": "Which of the following best summarises the legal position?", "o": ["The police have no power to deprive the man of his liberty.", "The police may arrest for breach of the peace.", "The police may arrest for obstruction of the highway.", "The police may arrest because this is an unauthorised public procession.", "The police may arrest because this is an unauthorised public assembly."], "a": "B", "bx": "The correct answer was B. This is because the previous violence makes it reasonable to believe that violence might recur. The police may take reasonable steps to prevent this happening. This includes temporarily detaining people and if they refuse, arresting them.", "x": ["Wrong. The police may take reasonable steps, including temporary detention, to prevent an imminent breach of the peace.", "Correct. Previous violence makes it reasonable to believe violence might recur, so the police may take reasonable steps to prevent it, including temporary detention and arrest if people refuse.", "Wrong. The facts concern preventing violence, not obstructing the highway.", "Wrong. Fans walking from a ground are not a public procession needing notice.", "Wrong. This is not an unauthorised public assembly offence."]}, {"ch": 5, "n": 3, "sc": ["Two men are drunk when they leave a public house and begin fighting. A barmaid leaving work sees them, is frightened and calls the police. A police officer arrests both men."], "st": "Which of the following offences have the two men committed?", "o": ["Riot.", "Violent disorder.", "Affray.", "Fear or provocation of violence.", "Harassment, alarm or distress."], "a": "C", "bx": "The correct answer was C. This is because 12 persons are required for riot, 3 for violent disorder and we are not told that either party has used threatening, abusive or insulting words. Two persons fighting could be an affray and the barmaid is a person of reasonable firmness, who might fear for her safety.", "x": ["Wrong. Riot requires 12 or more people.", "Wrong. Violent disorder requires at least three people.", "Correct. Two people fighting can amount to affray, as a person of reasonable firmness (like the barmaid) might fear for their safety.", "Wrong. There is no evidence of threatening, abusive or insulting words.", "Wrong. There is no evidence of threatening, abusive or insulting words or behaviour aimed at causing harassment, alarm or distress."]}, {"ch": 5, "n": 4, "sc": ["A crowd gathers outside the constituency office of an MP to protest against government policy. They shout loud slogans and play loud music frightening the staff in the office and making it difficult for them to work."], "st": "Which of the following best summarises the legal position?", "o": ["A senior officer of police can disperse the crowd because it is a breach of the peace.", "The chief officer of police can apply to the local council to ban the protest as it is a trespassory assembly.", "A senior officer of police can limit the duration of this public assembly.", "A police officer can arrest the protesters for threatening behaviour.", "A police officer can arrest the protesters for riot."], "a": "C", "bx": "The correct answer was C. It is not a trespassory assembly because the protesters have not entered the constituency office. Breach of the peace, threatening behaviour and riot all require violence or a threat of violence. A senior officer of police has powers to control a public assembly if they reasonably believe that there may be a serious disruption to the life of the community. This includes noise which is likely to intimidate, harass or cause alarm or distress.", "x": ["Wrong. Breach of the peace requires violence or a threat of violence.", "Wrong. It is not a trespassory assembly as the protesters have not entered the office.", "Correct. A senior police officer may impose conditions on a public assembly, including its duration, where they reasonably believe there may be serious disruption to the life of the community, which includes intimidating noise.", "Wrong. Threatening behaviour requires violence or a threat of violence.", "Wrong. Riot requires 12 people using or threatening violence for a common purpose."]}, {"ch": 5, "n": 5, "sc": ["A large crowd of people, who support animal rights, gather on the pavement outside a shop selling animals. They display signs and shout slogans indicating their disapproval of this trade, but do not use or threaten any violence or make any insulting remarks. Many passers-by stop to watch, and the street is completely blocked to people and vehicles. The police ask the protesters to disperse and when they refuse, arrest them."], "st": "Which of the following crimes have the protesters committed?", "o": ["Obstruction of the highway.", "Aggravated trespass.", "Causing harassment, alarm or distress.", "Fear or provocation of violence.", "Breach of the peace."], "a": "A", "bx": "The correct answer was A. A small demonstration on the highway may be permitted, but blocking the highway is not allowed. They are not trespassing nor using violence or threatening words.", "x": ["Correct. A small demonstration on the highway may be lawful, but completely blocking it is obstruction of the highway.", "Wrong. The protesters are on the public pavement, not trespassing.", "Wrong. There are no threatening, abusive or insulting words or behaviour.", "Wrong. No violence is used or threatened.", "Wrong. Breach of the peace requires violence or a threat of violence."]}, {"ch": 5, "n": 6, "sc": ["A group plans a public procession through a city centre to support a campaign. The organiser asks how much notice must be given to the police."], "st": "Which of the following best describes the notice requirement under the Public Order Act 1986?", "o": ["Oral notice must be given 24 hours in advance.", "No notice is required for a peaceful procession.", "Written notice must be given to the local council 28 days in advance.", "Written notice must be given to a police station at least six days in advance, unless that is not reasonably practicable.", "Notice must be given to the home secretary."], "a": "D", "x": ["Wrong. The notice must be written and at least six days in advance.", "Wrong. Notice is required for processions demonstrating support or opposition or publicising a cause.", "Wrong. Notice goes to the police, not the council.", "Correct. Under ss 11-13 of the Public Order Act 1986, organisers must give written notice to a police station at least six days in advance, giving the date, time, route and organisers' names, unless this is not reasonably practicable.", "Wrong. Notice is not given to the home secretary."]}, {"ch": 5, "n": 7, "sc": ["Protesters plan to hold a series of static demonstrations across London over two weeks. The Commissioner of Police imposes a ban on all of the group's assemblies throughout London."], "st": "Which of the following best describes the legal position?", "o": ["The ban is unlawful because the police have no power to impose any conditions on assemblies.", "The ban is unlawful because, although the police may control individual assemblies, there is no power to ban all assemblies in the district.", "The ban is lawful because assemblies need six days' notice.", "The ban is lawful if the home secretary consents.", "The ban is lawful because the police may ban any assembly."], "a": "B", "x": ["Wrong.
