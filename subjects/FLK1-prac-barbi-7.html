ppear to be an actionable nuisance, as stated above. Second, a person is only liable for nuisances created by independent contractors where the activities with which the contractor is engaged carry a special danger of causing a nuisance. This does not appear to be satisfied on the facts (the contractors were engaged to paint the house, not to do an inherently noisy activity). (C) is not correct. If the workers had caused an actionable nuisance, then the householder could have claimed against them personally. If the nuisance had been caused during the course of their employment, then the claim could also have been pursued against their employer, who would be vicariously liable for their tort. (D) is not correct. It is not sufficient for the householder to show that the noise made by the workers interfered with her quiet enjoyment of her land. She must also show that the interference was substantial and unreasonable and resulted from a continuing state of affairs, as discussed above. (E) is not correct. Private nuisance provides a remedy for unlawful interference with the use and enjoyment of land. This does not require tangible damage to property; intangible damage such as interference with amenity caused by noise is recoverable in nuisance."},{n:15,id:"DIS021",scenario:`A pharmaceutical manufacturer has contracted to supply a healthcare company with a certain medication, but due to circumstances that the manufacturer says is out of its control, it has not been able to supply the quantities required under the contract.
To meet its own obligations, the healthcare company purchased the medication from a different supplier, and it stopped ordering from the manufacturer. Each party considers the other to be in breach of contract.
The healthcare company is now threatening proceedings. The manufacturer cannot afford to lose the healthcare company as a client and is not keen on a lengthy, drawn-out court process. It would prefer for the matter to be resolved amicably at the earliest possible opportunity. There is a binding arbitration clause in the contract.`,q:"Which of the following statements best describes the most sensible option for the manufacturer to achieve its objective?",opts:["The manufacturer should look to commence legal proceedings as quickly as possible.","The manufacturer should invoke the contractual arbitration clause within the contract.","The manufacturer should indicate that they would like to try mediation before arbitration.","The manufacturer should wait to see if the healthcare company issues proceedings.","The manufacturer should wait for the healthcare company to invoke the arbitration clause."],ans:"C",expl:"(C) As the manufacturer cannot afford to lose the healthcare company as a client, is not keen on a lengthy process, and would prefer for the matter to be resolved amicably, it would be sensible for the manufacturer to suggest mediation instead of arbitration. In mediation, a neutral third party guides the disputing parties to resolve their differences. It usually is quicker than arbitration or litigation and is more likely to produce an amicable settlement than other more rigid forms of ADR. However, if the healthcare company insists on arbitration, the dispute must proceed to arbitration in accordance with the contract. (A) is incorrect because it would be inappropriate to issue proceedings when there is a binding arbitration clause in the contract, and it is less likely to result in a quick and amicable settlement. (B) is incorrect because, whilst this is an option in view of the contractual clause, mediation is more likely to result in an amicable settlement than arbitration and can almost certainly be organised more quickly. Neither (D) nor (E) is the most sensible option as the manufacturer wants the dispute resolved as quickly as possible; waiting for the healthcare company to make the first move will do nothing toward achieving a speedy resolution.",note:"The question screen appears twice in the PDF (the second copy is scrolled down to show option E). It is included once."},{n:16,id:"DIS236",scenario:"A solicitor is advising a new client who is named as a defendant in a civil dispute. The claimant states that the parties had orally agreed further terms which were never written down. The defendant disputes this. The solicitor is advising the client on the burden of proof.",q:"Which of the following is the correct advice?",opts:["The claimant needs to prove the allegation beyond reasonable doubt.","The claimant needs to prove the allegation on the balance of probabilities.","The defendant needs to disprove the allegation beyond reasonable doubt.","The defendant needs to disprove the allegation on the balance of probabilities.","The judge will decide who has the burden based on the demeanour of the parties during trial."],ans:"B",expl:"(B) In a civil dispute, the claimant needs to prove their allegations on the balance of probabilities. Conceptually, this means the claimant's version of the facts must be slightly more believable than the defendant's version. It follows that (A), (C), (D), and (E) are incorrect."},{n:17,id:"ETH119",scenario:'A solicitor is writing to a prospective witness requesting their attendance at court. She writes: "We will of course reimburse your travel costs and pay other subsistence expenses plus an additional £1,000 if my client is successful".',q:"Which of the following payments to the witness would be prohibited by the SRA Standards and Regulations?",opts:["Travel expenses.","Loss of earnings.","Childcare expenses.","The £1,000 success fee.","Meals and refreshments."],ans:"D",expl:"(D) The SRA Codes provide that a witness must not be offered any benefit which is dependent on the outcome of the case. Doing this would place the solicitor in breach of the SRA Codes, and also the SRA Principle to act in a way that upholds the constitutional principle of the rule of law and the proper administration of justice. Conversely, it is not a breach of regulatory duties to pay a witness's legitimate expenses, such as travel expenses, loss of earnings, childcare, or meal expenses. For this reason, (A), (B), (C), and (E) are incorrect."},{n:18,id:"DIS056",scenario:"A claimant is suing a letting agent for breach of contract, seeking the return of a deposit paid of £2,000.",q:"Which of the following is correct regarding the Particulars of Claim in this case?",opts:["As this is an unspecified claim for less than £10,000, the claimant must include the Particulars of Claim on the back of the claim form.","As this is a debt claim for less than £10,000, the claimant must include the Particulars of Claim on the back of the claim form.","Although this is an unspecified claim for less than £10,000, the claimant may draft the Particulars of Claim in a separate document or on the back of the claim form.","Although this is a debt claim for less than £10,000, the claimant may draft the Particulars of Claim in a separate document or on the back of the claim form.","As this is an unspecified claim for less than £10,000, the claimant may include the particulars in a letter."],ans:"D",expl:`(D) It is true that the claim is a debt claim (that is, a claim for a specified sum), and the Particulars of Claim are normally included on the claim for debt/specified claims, as they tend to be short and simple, but they may still be served in a separate document. In other words, the Particulars of Claim (that is, a written statement setting out the details of the claimant's case) may be in a separate document or on the back of the claim form. If drafted in a separate document, it must be served within 14 days of the claim form. (A), (C), and (E) are incorrect, as this is a debt claim and not an unspecified claim (all claims for damages are "unspecified claims"). (B) is incorrect as there is no requirement to include the Particulars of Claim on the back of the claim form, although this is frequently done in specified claims.`},{n:19,id:"DIS097",scenario:"A solicitor acting for a claimant has attempted to serve the claim form upon the defendant by faxing the court papers to the fax address that appears on the defendant's headed notepaper. The defendant's solicitor wishes to dispute that this represents good service because the defendant has not provided express consent to service by this method.",q:"Which of the following statements best describes the process for the defendant's solicitor to raise this as an issue?",opts:["The defendant should plead in the defence that the claimant has not validly served the proceedings.","The defendant must indicate on the acknowledgment of service that they believe service to be defective and make an application within 14 days seeking an order for re-service.","The defendant should raise validity of service as a preliminary issue at the first case management conference.","The defendant should make an immediate application to strike out the claim.","The defendant should inform the claimant's solicitor of the invalidity of service and invite them to re-serve the proceedings in the correct manner."],ans:"B",expl:"(B) If a defendant proposes to argue that service was not valid, the appropriate course of action is to file the acknowledgement of service stating that the validity of service is not accepted. Then the defendant should lodge an application within 14 days seeking an order to have the claimant re-serve the proceedings in a proper manner. This may be difficult for them if the time period for service has expired. (A) and (C) are incorrect because the issue should be brought to the court's attention at the earliest possible stage. It would be too late for the defendant to include it in the defence or bring it up at the case management conference. (D) is incorrect because the likely order is for re-service, not to strike out the claim. (E) is incorrect because, whilst this is an informal option, the defendant's best interests would be to proceed formally as per (B).",note:"The OCR of the facts was scrambled; they were read from the page image."},{n:20,id:"DIS005",scenario:"A machine operator sued their former employer in the County Court for an injury that arose whilst operating a machine in the employer's factory. The claim was heard before a Circuit Judge. The employee lost and would like to appeal on grounds that the judgment is unjust because of a serious procedural or other irregularity in the proceedings.",q:"Which of the following courts have the power to grant permission for the appeal?",opts:["The High Court only.","The Court of Appeal only.","The County Court which heard the case only.","The High Court and the Court of Appeal.","The County Court which heard the case and the High Court."],ans:"E",expl:"(E) A party wishing to appeal must make an application to appeal in either the court where the decision was made or the court in which the appeal would be heard. Here, the case was heard by a Circuit Judge in the County Court. Cases heard by Circuit Judges are appealed to the High Court. Therefore, the County Court which heard the case and the High Court may grant permission for the appeal here. (A) and (C) are incorrect because they each fail to mention the second possibility. (B) and (D) are incorrect because the Court of Appeal hears appeals (and can grant permission for an appeal) only from a decision of the High Court."},{n:21,id:"DIS112",scenario:"A driver brings a claim against a defendant arising from a car accident. A bystander who was sitting on a park bench near the accident saw it happen. The case proceeded, the bystander's signed witness statement was served, and the case is now near trial. The solicitor for the claimant receives notice of the trial date and would like to have a witness summons issued to the bystander. The witness indicated they would be happy to attend trial, but only if they will be paid for their attendance.",q:"Which of the following best states the legal position regarding compensation of witnesses?",opts:["A witness cannot be compensated for attending trial.","A witness can be given money to offset expenses of attending trial only.","A witness can be given money to compensate them for loss of their time for attending trial only.","A witness can be compensated for expenses of attending trial and for their loss of time in attending trial.","A witness can be given money for attending trial only after the trial is completed."],ans:"D",expl:"(D) A party may ask the court to issue a summons to compel a witness to attend court to give evidence at the trial. Importantly, the party must also send an appropriate sum to cover the witness's expenses in attending and compensating them for their loss of time, called the 'conduct money'. The conduct money must be sufficient to cover the cost of the witness getting to and from court and the amount the witness will lose by way of income for attending, although there is a maximum amount. There are additional sums payable for subsidence or overnight stay. If the conduct money is not included and tendered to the witness, the witness summons is not effective. (A) is incorrect because a witness may receive compensation for certain expenses and losses, as described above. (B) is incorrect because a witness may be compensated for lost time from work as well. (C) is incorrect because expenses may be compensated. (E) is incorrect because the compensation must be made up front.",note:`The facts were read from the page image. ${zi} Source slip: the explanation says "subsidence" where "subsistence" is meant. The original wording is kept.`},{n:22,id:"DIS129",scenario:"A solicitor is representing a defendant in a personal injury claim worth £35,000. The claimant was injured when a display rack fell from the wall in the defendant's store and hit the claimant. The claimant alleges that the defendant used bolts to mount the display that did not meet the specifications in the display's assembly instructions. The defendant was careful to use proper bolts, but no longer has documentation to prove this. Therefore, with court permission, the defendant instructs their solicitor to hire a materials engineer to determine the strength of the bolts used.",q:"Which of the following states the legal position with respect to the defendant's expert's report?",opts:["The report may not give an opinion on matters central to the party's case.","The report may give an opinion on matters central to the case only if the expert is reasonably certain as to their opinion.","The report may not include the expert's opinion and is limited to facts which the expert has observed.","The report may not include the expert's opinion if the opinion relates to an inference.","The report may give an opinion on matters central to the party's case only if the expert is certain as to their opinion beyond reasonable doubt."],ans:"B",expl:"(B) An expert's report may give an opinion on matters central to the case so long as the expert is reasonably certain as to their opinion. Therefore, (A) is incorrect. (C) is incorrect because unlike lay witnesses (whose testimony usually is limited to facts they observed), an expert witness may give evidence in the form of their opinion. (D) is incorrect as an expert may give evidence regarding opinion, inference, or conclusion so long as the matter is within their area of expertise and they are reasonably certain as to the opinion, inference, or conclusion. As the expert need only be reasonably confident, (E) is incorrect because it states the expert must be confident beyond reasonable doubt, which is too high a standard."},{n:23,id:"DIS096",scenario:"An electrician was injured when the equipment that was supplied by his employer malfunctioned whilst the electrician was re-wiring an office. The electrician commences proceedings against his employer in the County Court. The employer blames the manufacturer of the equipment, who had recently supplied the equipment directly to the employer. The employer believes that the manufacturer should bear at least part of the responsibility for the accident.",q:"How should the employer best proceed with respect to the manufacturer?",opts:["Deny liability in their defence, blame the manufacturer, and wait for the claimant to amend the claim form to join the manufacturer.","Deny liability in their defence, blame the manufacturer, and write an open letter to the claimant's solicitors inviting them to cease the claim and commence a new action against the manufacturer.","Serve a contribution notice upon the claimant, offering to accept a proportion of the blame if the claimant adds the manufacturer as a defendant.","Deny liability in their defence, blame the manufacturer, and issue a Part 20 claim form seeking a contribution and/or indemnity from the manufacturer.","Pay the claim and start a new action against the manufacturer to recoup their losses."],ans:"D",expl:"(D) If a defendant believes someone who is not presently a party to the claim is liable (at least in part) for the claimant's loss, the defendant should deny liability and issue a Part 20 claim (that is, a claim against the third party) within the proceedings. That non-party thereby becomes a third party in the claim and can be held liable for the claimant's losses. (A) is incorrect because the claimant does not have an incentive to join the manufacturer. (B) is not the best choice for the reason just stated - there is no guarantee that the claimant will cease the claim and issue one against the manufacturer in response to the open letter. (C) suffers the same flaw - there is no guarantee the claimant will comply (indeed, as a practical standpoint, they are unlikely to give up the claim against the manufacturer - a bird in the hand is worth two in the bush). (E) is a possibility, but it is not very efficient, as it would require two proceedings rather than just one. Therefore, it is clearly not the best choice.",note:`${zi} Source slip: in the explanation for (C), "give up the claim against the manufacturer" appears to mean the existing claim against the employer. The original wording is kept.`},{n:24,id:"DIS166",scenario:"A woman is the beneficiary under a trust. Recently, she realised that the trustee has not been investing trust funds properly, as the funds have not grown as expected. The woman would like to commence proceedings against the trustee and instructs a solicitor. The solicitor estimates the value of the claim at £225,000. The client lives in Manchester and does not like to travel. The trustee works out of London.",q:"In which court should the client's solicitor issue the claim?",opts:["The High Court of Justice, Queen's Bench Division.","The High Court of Justice, Manchester District Registry, Queen's Bench Division.","The High Court of Justice, Chancery Division.","The High Court of Justice, Manchester District Registry, Chancery Division.","The High Court of Justice, Queen's Bench Division, Manchester District Registry, Commercial Court."],ans:"D",expl:"(D) The claim should be issued in the High Court of Justice, Manchester District Registry, Chancery Division. Generally, claims exceeding £100,000 are issued in the High Court. The High Court has registries in most large towns and cities, and the claimant should indicate on their claim form the district out of which they wish the claim to issue. As the client lives in Manchester, Manchester would be the best registry. And the Chancery Division of the High Court is the division that handles equity and trusts. (A), (B), and (E) are incorrect as breach of trust claims are among the type of claims handled by the Chancery Division. (C) is incorrect as the client is unlikely to want to travel to London to attend the trial."},{n:25,id:"DIS063",scenario:"A food supply company claims damages from a haulage company for breach of contract. The parties entered a long-term contract on 1 April 2019. On 30 June 2020 the haulage company failed to deliver goods as agreed. Because of the haulage company's failure to deliver the goods, the food supply company was unable to fulfil its contractual obligations to a large restaurant client on 2 July 2020, and the food supply company incurred additional expenses as a result.",q:"The food supply company proposes to sue the haulage company for losses arising from breach of contract. When will the limitation period expire?",opts:["2 July 2026.","30 June 2026.","1 April 2025.","2 July 2023.","30 June 2023."],ans:"B",expl:"(B) In a contract claim, the limitation period expires six years from the date of the breach. Here, the breach occurred on the date the delivery was missed (30 June 2020) and so the food supply company has until 20 June 2026 to bring a claim. (A) is incorrect because we use the date of the breach rather than the date damages from the breach were incurred. (C) is incorrect because it is based on six years from the date the contract was made rather than the date of the breach. (D) and (E) are incorrect because both are using a three-year limitation period, which is the period for personal injury claims. Additionally, (D) is using the wrong trigger (the day the damages were incurred).",note:'The facts were read from the page image. Source slip: the explanation gives the expiry date as "20 June 2026", which conflicts with the correct option (30 June 2026). The original wording is kept.'},{n:26,id:"DIS248",scenario:"A man was injured whilst working at his employer's factory. The man's solicitor sends a letter of claim to the man's employer, seeking £27,000 damages. The company refused to settle, arguing that the man's own negligence was the primary cause of his injury. The man's solicitor sends the claim form to the County Court Money Claims Centre (CCMCC) in Salford for issuance. After issuance, the company acknowledges service and files a defence.",q:"Which of the following best describes how the court will likely proceed after receiving the defence?",opts:["The court will keep the claim in the CCMCC in Salford but will transfer it for trial if the claim does not settle.","The court will transfer the claim to the hearing centre closest to the company's address.","The court will transfer the claim to a neutral hearing centre, somewhere between the claimant's and the defendant's location.","The court will choose a hearing centre to case manage the claim based on court availability at the time of allocation.","The court is likely to transfer the claim to the hearing centre closest to the claimant's home."],ans:"E",expl:"(E) Following receipt of a defence or admission, the court will normally transfer a claim to the hearing centre local to the defendant's home address (if the defendant is an individual) or the claimant's preferred hearing centre (if the defendant is a company). Here, since the defendant is a company, the court is likely to transfer the case to the hearing centre closest to the claimant. This is for the convenience of the claimant. (A) is incorrect because Salford is for issue, not case management. (B) is incorrect because whilst the case would normally transfer to the hearing centre closest to the defendant, this will not happen here because the defendant is a company. (C) is not correct because the court will not look to find a venue convenient to both parties. (D) is incorrect because the decisions of which court will case manage at this stage is not based on availability.",note:"The OCR of the question screen was scrambled; the facts and options were read from the page image."},{n:27,id:"TRT141",scenario:"A woman lives near to a busy road. Recently she witnessed a very bad accident in which two cars collided and several people were injured. She did not know any of the victims personally, but she could not help staying to watch as the ambulances arrived and people were cut free from the wreckage. She was never in any danger herself but, as a result of what she saw, she suffered from post-traumatic stress disorder ('PTSD'). This was made worse by a pre-existing medical condition which causes her to be particularly anxious. She has since found out that the accident was caused by the negligence of a bus driver.",q:"If the woman brings a claim against the bus driver to recover damages for her PTSD, which of the following statements best explains the likely outcome?",opts:["The woman is not likely to succeed in her claim because she did not know any of the victims personally.","The woman is not likely to succeed in her claim because she was not in the area of danger and only people who are in the area of danger are entitled to claim.","The woman is not likely to succeed in her claim because she is guilty of contributory negligence by staying to watch.","The woman is likely to succeed in her claim because she did witness the events with her own unaided senses.","The woman is likely to succeed in her claim because PTSD amounts to a medically recognised psychiatric illness."],ans:"A",expl:"(A) The woman is not likely to succeed. The woman has suffered psychiatric harm caused without physical impact. The special principles for duty of care in respect of this type of harm depend on whether the woman is classed as a primary or secondary victim of the bus driver's negligence. On the facts, she was not in the area of danger created by the bus driver's negligence, so she is a secondary victim. As a secondary victim, she is only owed a duty of care if she satisfies certain requirements. One of these is that she must have had close ties of love and affection with the persons who were endangered by the bus driver's negligence. On the facts, she did not know any of the victims personally. So, no duty of care would be owed to her, and she is not likely to succeed in her claim. (B) is not correct. Persons who are in the area of danger are classed as primary victims. It is not correct to say that only primary victims can claim. Persons outside the area of danger are classed as secondary victims and may be owed a duty of care provided they satisfy the requirements discussed above. A secondary victim who can establish the elements of duty, breach, and damage can make a successful claim. (C) is not correct because it does not state the correct reason why the woman is not likely to succeed in her claim. She is not likely to succeed because, on the facts, she is not owed a duty of care. So, there is no claim and the defence of contributory negligence does not arise. (D) is not correct. It is true that, for a duty of care to be owed to secondary victims, they must have witnessed the events with their own unaided senses. However, this is just one of the requirements to be satisfied before a duty is owed. A further requirement is the need for close ties of love and affection, which is not satisfied on the facts. (E) is not correct. It is true that, for a duty of care to be owed in respect of psychiatric harm without physical impact, the claimant must suffer from a medically recognised psychiatric illness. However, this is not sufficient by itself for a duty to arise, as discussed above.",note:"Source slip: the facts describe a collision between two cars but attribute it to the negligence of a bus driver. The original wording is kept."},{n:28,id:"TRT013",scenario:"A missile company conducted a routine rocket engine test at a remote site. The rocket engine was mounted on a concrete test stand, with the thrust of the engine directed downward into the ground. When the engine was fired up, huge clouds of flame and smoke filled the air, and particles of debris from the rocket fell onto an adjoining farm. The particles of debris were blown away shortly thereafter by the wind without any damage to the land.",q:"Which of the following best states the reason why the company will avoid liability in trespass?",opts:["The farmer bought and operated his farm knowing that the company used the adjoining property for testing its rocket engines.","Neither the company nor any of its employees set foot upon the farmer's land.","The company had no reason to anticipate that the tests would cause any of the results that occurred.","The rocket testing program is essential to military security, so the company's conduct was excused as a necessity to protect the public.","There is no damage to the farmer's land."],ans:"C",expl:"(C) If the company had no reason to anticipate that the tests would cause the results that occurred, then the company has not intended to commit the act constituting trespass. Absent such intent, there is no cause of action for trespass. Trespass to land is an intentional unlawful direct interference with the claimant's possession of land. The intent required is not intent to trespass; thus, mistake as to the lawfulness of an entry onto another's land is no defence as long as the defendant intended the entry upon that particular piece of land. Here, the company, in firing the rocket engine, caused debris to fall onto the farmer's property. This would be a sufficient physical interference for purposes of a trespass action. However, maintenance of this action requires a showing that the company intended to send this debris onto the land of the farmer. If (as stated in (C)) the company had no reason to anticipate that its rocket engine tests would cause the debris to fall onto the farmer's property, then the company did not intend to make any entry onto the farmer's property, and will not be liable for trespass. (A) is incorrect because the fact that the farmer bought and operated the farm with knowledge that the company used the adjoining land for engine tests will not allow the company to avoid liability for an act that would otherwise be characterised as a trespass. The farmer's knowledge of the use to which the company put the adjoining property cannot be taken as implied consent to the scattering of debris on the farmer's land. (B) is incorrect because a physical interference does not require that the defendant personally set foot on the land. There is a trespass if, for example, the defendant floods the claimant's land or, as here, causes debris to settle on the claimant's land. (D) is incorrect because the defence of necessity arises to protect the public from what is perceived to be a greater danger, and the defendant's action was prompted by a reasonable perception that it was required to avoid an immediate and imminent danger judged by the circumstances at the time. Here, the facts state that the rocket test was 'routine' and so it could not be an immediate and imminent danger. (E) is incorrect because trespass to land is actionable per se. In other words, actual damages need not be proven. In the absence of actual damages, nominal damages will be awarded to the claimant.",note:"The OCR of the question screen was scrambled; the facts and options were read from the page image."},{n:29,id:"DIS193",scenario:"On behalf of a pedestrian, a solicitor initiates a claim against a driver who had injured the pedestrian in an accident. The solicitor sends a letter of instruction to an expert witness requesting that the expert prepare a report showing how the accident occurred.",q:"Which privilege, if any, would the report fall under?",opts:["Legal advice privilege.","Litigation privilege.","Without prejudice privilege.","Common interest privilege.","The report is not privileged and must be disclosed."],ans:"B",expl:"(B) Litigation privilege relates to communications with third parties (for example, experts and barristers) for purposes of preparation for trial. Here, the report was prepared to assist the pedestrian's solicitor for trial. However, note that if the pedestrian wishes to rely on the report at trial, it must be exchanged with the other party, and the privilege is lost. (A) is incorrect. Legal advice privilege relates to communications with a client, so there is no litigation privilege regarding the report. (C) is incorrect. Without prejudice privilege arises from settlement negotiations. The communication and report here were not related to settlement. (D) is incorrect. Common interest privilege may apply when there are multiple defendants or claimants. The privilege allows such parties to send documents (for example, correspondence) amongst themselves without fear that those documents will become subject to inspection. The correspondence and report here were not exchanged between co-parties and so this privilege does not apply. (E) is incorrect. Litigation privilege will be lost only if the pedestrian wishes to rely on the report.",note:'Source slip: the explanation for (A) says "there is no litigation privilege regarding the report"; in context it appears to mean there is no legal advice privilege. The original wording is kept.'},{n:30,id:"DIS086",scenario:"A dentist is the defendant in a claim for injuries caused by inadequate dental treatment. The dentist has repeatedly flouted the requirements of the pre-action protocol for the resolution of clinical disputes by repeatedly ignoring requests for alternative dispute resolution. The dentist also failed to respond adequately to the letter of notification, as their letter of response was unclear regarding the extent to which they admit breach of duty and causation. The claim settled shortly after issue of proceedings.",q:"What order is the court likely to make as a result of the defendant's pre-action conduct?",opts:["An order for the dentist to pay an additional 25% damages to the claimant as a penalty for failure to comply with the protocol.","An order that the dentist should not be permitted to challenge the claimant's bill of costs.","An order finding the dentist in contempt of court.","An order for the dentist to pay interest on the claimant's damages at a rate higher than normally would be allowed and costs to be paid on an indemnity basis.","An order that the claimant can have an additional three months to serve the bill of costs."],ans:"D",expl:"(D) When the court believes that the claim should have been capable of resolution without the issue of proceedings, it may order the defendant to pay interest on the claimant's damages at a rate higher than normally would be allowed. The court may also order the defendant to pay the claimant's costs on an indemnity basis, that is, the court giving the benefit of the doubt to the receiving party as to whether the costs were reasonably incurred. (A) is incorrect because the court does not have the power to award additional punitive damages to the claimant in this situation. (B) is incorrect because the court cannot tie the defendant's hands in the costs proceedings in this manner. (C) is incorrect because a party will not be found to be in contempt of court by failing to comply with the protocol, which does not carry the same weight as CPR. (E) is incorrect because the court is not in a position to influence the costs assessment process in this manner."},{n:31,id:"ETH138",scenario:"A solicitor provides a client with their hourly rate and an estimate of £10,000 for dealing with a dispute on the assumption that the matter will be settled. It is not settled and the client instructs the solicitor to institute court proceedings. Due to this change in instructions, the original estimate is exceeded. The solicitor's next communication about costs is the final bill, which amounts to £30,000.",q:"Which of the following statements best describes the solicitor's regulatory position in respect of the original estimate?",opts:["The original estimate is not relevant because the client made the decision to change their instructions.","The original estimate was just an indication of costs and is not relevant to actual costs.","The solicitor had a duty to update the original estimate.","The solicitor cannot charge any more than the original estimate.","The original estimate is not relevant because the client was also given the solicitor's hourly rate and can work out costs for themselves."],ans:"C",expl:"(C) An estimate should be a reasonable assessment, but it should be kept under review. If circumstances change, the client must be provided information about how this affects the costs position, and an updated estimate should be provided. (A) is incorrect; whilst it is true that the original estimate is no longer relevant, this information must be updated. (B) is incorrect; an estimate is relevant because it means that the client is given information about the likely overall costs, and that informs their decision-making. (D) is incorrect; the solicitor can charge more than the original estimate but should note that this might be subject to legal and regulatory scrutiny. (E) is incorrect because the duty is on the solicitor to provide information in a way that the client can understand.",note:'The OCR read the final bill as "€30,000"; the page image shows £30,000.'},{n:32,id:"DIS227",scenario:"A claim is being pursued under the personal injury protocol. The defendant responds to the letter of claim by admitting negligence but disputing quantum.",q:"According to the protocol, what is the earliest point at which the claimant can issue proceedings?",opts:["The claimant can issue proceedings immediately.","Three months from the defendant's response.","Fourteen days from the defendant's response.","Twenty-one days after serving the medical report and an up-to-date schedule of loss.","Twenty-eight days after serving their witness statement and medical report."],ans:"D",expl:"(D) The claimant must serve the medical report and an up-to-date schedule of loss and allow 21 days for the defendant to make an offer. If no acceptable offer is forthcoming, they are free to issue proceedings. (A) is incorrect because the claimant must supply the medical report and schedule and allow the 21-day period for an offer. To issue immediately would not be in the spirit of the protocol. (B) is incorrect because the three-month period applies only if liability is not admitted; this gives the defendant time to investigate the claim. (C) is incorrect because there is no requirement under the protocol for the claimant to give the defendant 14 days' notice of intention to issue. (E) is incorrect because the claimant is not required to serve their medical report at this stage. In addition, 21 days' notice is appropriate, not 28."},{n:33,id:"TRT046",scenario:"A worker was employed by employer X and subsequently by employer Y. Both employers exposed the worker to excessive levels of noise, in breach of their duty of care to him. The worker now suffers from industrial deafness caused by the excessive noise. The worker issues proceedings against employer Y. The court finds that employer X and employer Y both made a material contribution to the worker's injury. The court finds that industrial deafness is a divisible injury, of which 75% was caused by employer X and 25% by employer Y.",q:"In relation to the amount of damages recoverable by the worker, which of the following statements is correct?",opts:["The worker is entitled to recover 100% of his damages from employer Y.","The worker is entitled to recover 100% of his damages from employer Y unless employer Y seeks a contribution from employer X to reflect employer X's share of responsibility.","The worker is only entitled to recover 25% of his damages from employer Y.","The court can order employer X to pay a contribution to the damages paid to the worker by employer Y.","The worker will not need to pursue a claim against both employer X and employer Y to recover his damages in full."],ans:"C",expl:"(C) The worker is only entitled to collect 25% of his damages from employer Y. The worker has suffered an injury which is divisible. This means that damages can be apportioned between employer X and employer Y according to the share of the injury which each of them caused. Each is only liable to pay for the share of the damage which they caused. Employer Y was found to have caused 25% of the worker's injury, so the worker can recover only 25% of his damages from employer Y. Therefore, (A) is not correct. (B) is not correct. Employer Y cannot seek a contribution from employer X because contribution only applies where both employers are liable for the same damage. In the case of a divisible injury, the employers are not both liable for the same damage. They are each liable only for the share of the damage which they caused, as explained above. (D) is similarly incorrect. Employer Y is only liable to pay damages to the worker for the share of his injury which employer Y caused. There is no scope for employer Y to seek a contribution from employer X. (E) is not correct. Since both employers are each only liable to pay damages for the share of the injury which each caused, the worker would need to pursue a claim against both employers to recover his damages in full."},{n:34,id:"TRT095",scenario:"The occupier of a large country estate organises a craft fair inside a large tent erected on an open field on the estate. To raise funds for the estate, exhibitors at the fair are charged a fee for a stall. The public are allowed free entry to shop at the fair. The floor of the tent is covered with rush matting for visitors to walk on. After the first few shoppers have entered, it becomes clear that the rush matting is curling up at the edges and is causing a tripping hazard. So, the occupier puts up a large sign at the entrance to the tent saying: 'please take care, uneven floor'. Unfortunately, a lady visiting the craft fair to shop trips on the curled edge of the matting and is injured.",q:"In an action by the lady against the occupier under the Occupiers' Liability Act 1957 ('the Act'), which of the following is correct?",opts:["The occupier is not likely to be liable to the lady because the sign constituted a warning to persons using the premises and appears to have been sufficient to discharge the duty of care owed to them.","The occupier is not likely to be liable to the lady because a tent erected in an open field is not a premises within the meaning of the Act, so no duty of care arises under the Act.","The occupier is not likely to be liable to the lady because entry for the public was free, so no duty of care arises under the Act.","The occupier is likely to be liable to the lady because liability for death or personal injury cannot be excluded.","The occupier is likely to be liable to the lady because he owed her a duty of care under the Act, and the breach of this duty caused the injury which she suffered."],ans:"E",expl:"(E) The occupier is likely to be liable. Under the Occupiers' Liability Act 1957 ('the Act') the occupier of premises owes a duty to lawful visitors to take reasonable care to see that they will be reasonably safe in using the premises for the purposes for which they are invited or permitted to be there. So, the occupier here owed the lady a duty of care. On the facts, he appears to have failed to take such reasonable care. He became aware that the rush matting was causing a tripping hazard but did not do anything to make it safe. While the notice ('please take care, uneven floor') is a warning of the danger, the Act provides that a warning of the danger does not, without more, discharge the occupier's duty unless it enables the visitor to be reasonably safe. On the facts, the notice did not enable visitors to be reasonably safe because shoppers distracted by the displays are not likely to notice the curled edge of the matting. So, the occupier likely was in breach of his duty. Such breach clearly caused the damage suffered. (A) is not correct because, on the facts, the warning notice was not sufficient to discharge the occupier's duty of care to the lady, as explained above. (B) is not correct. The definition of premises under the Act extends to cover any fixed or moveable structure, and so would cover a tent erected on the land. So, a duty of care does arise under the Act in respect of damage caused by the state of the premises, which would include the state of the flooring of the tent. (C) is not correct. The duty under the Act is owed by an occupier to his lawful visitors. A lawful visitor is a person whom the occupier has invited or permitted to enter the premises. Payment for entry is not a condition of being a lawful visitor. Therefore, the occupier did owe a duty of care to the lady. (D) is not correct even though it states the correct result. It is true that liability for death or personal injury caused by a breach of the occupier's duty under the Act cannot be excluded. However, the notice ('please take care, uneven floor') does not purport to exclude liability. Rather, it is simply a warning, and not adequate to discharge the occupier's duty of care, as discussed above.",note:zi},{n:35,id:"TRT125",scenario:"An article in a newspaper falsely stated that the manager of a professional football team had been siphoning off proceeds from ticket sales to support his gambling habits, with the result that the club was suffering serious financial difficulties. The manager wishes to bring an action against the newspaper for defamation.",q:"Which of the following statements describes an element which the manager must prove in order to make a successful claim against the newspaper for defamation?",opts:["The manager must prove that the newspaper was negligent in publishing the article.","The manager must prove that the newspaper acted with malice in publishing the article.","The manager must prove that the newspaper did not reasonably believe that publishing the article was in the public interest.","The manager must prove that the newspaper article caused him to suffer specific quantifiable financial loss.","The manager must prove that the statement is likely to cause serious harm to his reputation."],ans:"E",expl:"(E) The manager must prove that the statement is likely to cause serious harm to his reputation. For a successful claim in defamation, the manager must prove that a defamatory statement which referred to him was published. On the facts, the statement clearly referred to the manager and was published. A defamatory statement is one which would tend to lower the claimant in the eyes of right-thinking members of society, which appears to be satisfied on the facts. Statute also provides that a statement is not defamatory unless its publication has caused, or is likely to cause, serious harm to the reputation of the claimant. So, the manager must establish this to be successful. (A) is not correct. Negligence is not a requirement for a defamation action. (B) is not correct. Proof of malice is not a requirement for a defamation action. (C) is not correct. The newspaper may seek to rely on the defence of publication on a matter of public interest. The burden would be on the newspaper to prove both that the defamatory statement was on a matter of public interest and that the newspaper reasonably believed that publishing the statement was in the public interest. The defence might apply to allegations of corruption in sport. However, this choice does not describe this correctly because the defendant has the burden of proving this defence; the claimant does not have the burden of disproving it. (D) is not correct. The defamatory statement was published by the newspaper in written form and so is libel. For a successful claim in libel, it is not necessary to show specific quantifiable financial loss (special damage). The claimant only needs to establish general damage to reputation itself which must be sufficiently serious, as explained above.",note:"The answer screen prints the ID as 'TRT 125'."},{n:36,id:"DIS121",scenario:"A claimant has issued proceedings against a defendant for trespass. The defendant files an acknowledgment of service within a week of being served. The claimant believes the defendant has no viable defence and so immediately applies for summary judgment, including written evidence to support the application.",q:"Which of the following best states the legal position with regard to the application?",opts:["The application was made too early, as the defendant had not yet filed a defence.","The application was within a proper timescale, and the defendant must now serve a defence.","The application was made too early, as the claimant had to wait at least 14 days after the defendant acknowledged service before applying for summary judgment.","The application was made too early, as the claimant had to wait at least two days after the defendant acknowledged service before applying for summary judgment.","The application was within a proper timescale, and the defendant must serve evidence in response at least seven days before the hearing."],ans:"E",expl:"(E) As soon as the defendant files an acknowledgment of service, it is open for the claimant to make an application for summary judgment. If the claimant applies for summary judgment following acknowledgment of the claim and includes written evidence to support the application, the defendant must serve evidence in response at least seven days before the hearing on the application. (A) is incorrect because the claimant does not need to wait until the defendant has filed a defence. (B) is incorrect because the defendant is not required to serve a formal defence at this point (although it may be helpful in opposing the application). (C) and (D) are incorrect because there is no two-day or 14-day waiting period.",note:zi}],rk="The scan captures this explanation out of order; it has been reassembled in reading order from the page image.",dr="The OCR of this question screen was scrambled; the facts and options were read from the page image.",ok=[{n:1,id:"DIS068",scenario:"A claimant initiated a negligence action against a defendant in the County Court. The case is before a District Judge. The claimant fails to recover when the District Judge makes an obvious error in applying the law. Due to this error, the claimant would like to appeal.",q:"To which of the following courts would they appeal?",opts:["The Supreme Court.","The Court of Appeal.","The High Court.","The County Court (to a Circuit Judge).","The County Court (to another District Judge)."],ans:"D",expl:"(D) When a civil case is heard by a District Judge of the County Court, an appeal would be to a Circuit Judge of the County Court. All of the other answers are incorrect. The Supreme Court generally hears civil appeals from the Court of Appeal, the Court of Appeal generally hears civil appeals from the High Court, the High Court generally hears civil appeals from Masters and decisions by a Circuit Judge of a County Court, and District Judges typically do not hear appeals."},{n:2,id:"DIS137",scenario:`A man brings a civil claim for battery against another man when attempts at alternative dispute resolution fail. The claim alleges that the defendant hit the claimant with a beer glass whilst at a pub because the claimant made a derogatory statement about the defendant's favourite football player. The claimant is seeking £20,000 damages.
The defendant believes the claimant is seeking too much money and is keen to make a Part 36 offer to limit the costs he might have to pay.`,q:"What is the shortest period the defendant may give the claimant to accept the offer for it to take effect as a Part 36 offer?",opts:["7 days.","14 days.","21 days.","28 days.","30 days."],ans:"C",expl:"(C) A Part 36 offer must stay open for a minimum of 21 days. The time in which the offer may be accepted is called the relevant period."},{n:3,id:"BSL126",scenario:"A company was incorporated several years ago with the Companies (Model Articles) Regulations 2008 (unamended) for private companies limited by shares as its articles of association. The company has four shareholders who are also the directors of the company. One of the directors wishes to retire from the company and transfer their shares to their child.",q:"Which of the following statements best describes the power of the directors on the application of the child to register the share transfer?",opts:["The board must register the transfer of shares as it is a transfer to a member of an existing shareholder's family.","The board must offer the shares to the existing shareholders in the same ratio as they already hold shares, and only if they decline the offer can the board register the transfer.","The board can register the transfer only after the members have approved the share transfer.","The board have an absolute power to refuse to register the transfer.","The board can refuse to register the transfer only if the stock transfer form is incorrectly completed."],ans:"D",expl:"(D) The directors have an absolute power to refuse to register a transfer of shares under the Model Articles. (A) is incorrect as there are no exemptions from the absolute power to refuse to register the shares in the Model Articles. (B) is based on the concept of preemption. Preemption applies only when the company seeks to issue new ordinary shares for cash. That is not the case here. (C) is incorrect as the members have no power to approve a transfer under the Model Articles. (E) is incorrect as although the board do not have to consider an incorrectly completed stock transfer form, they also have an absolute power to refuse to register any transfer.",note:dr},{n:4,id:"BSL075",scenario:"A company is in liquidation. The liquidator has funds of £60,000. The preferential creditors are owed £15,000. The unsecured creditors are owed £75,000.",q:"Which of the following best reflects the legal position regarding payment to the various creditors?",opts:["The preferential creditors will be paid two-thirds of the debt owed them before any unsecured creditor can be paid.","The preferential creditors will be paid £60,000 and the unsecured creditors will receive nothing.","The preferential creditors will be paid £15,000 and the unsecured creditors will receive £60,000.","The preferential creditors will split £10,000 and the unsecured creditors will split £50,000.","The preferential creditors will be paid in full and the ordinary creditors will split £45,000."],ans:"E",expl:"(E) The preferential creditors will be paid in full first, leaving £45,000 to be divided amongst the unsecured creditors. Here, the assets were £60,000 and the preferential creditors were owed only £15,000, so the preferential creditors will be paid in full. (A) is incorrect because preferential creditors are paid in full to the extent there are sufficient assets - they don't share proportionally with unsecured creditors. (B) is incorrect. The preference allows preferred creditors to be paid what is owed them ahead of the ordinary creditors; the preference is not an entitlement to assets beyond what is owed to the preferred creditors. (C) is incorrect because whilst it states the amounts owed to the various creditors, the estate's assets are only £60,000, so the ordinary creditors will not be paid in full. (D) is incorrect for much the same reason that (A) is incorrect - there are sufficient funds to pay the preferred creditors in full; the unpreferred creditors will share what's left.",note:`The OCR misread several "£" signs in the facts and options as "€" or "$"; they have been corrected to £ as in the explanation. ${rk}`},{n:5,id:"BSL099",scenario:"An investor subscribed for 200 £1 shares in a company but was only required to pay 50p per share on subscription. The investor was advised that he would not be required to make any further payment as regards the shares, and the company even passed a resolution to confirm this position. The company very quickly began to fail and soon became insolvent. The company now owes substantial sums to its creditors.",q:"Which of the following best describes the position of the investor on the insolvency of the company?",opts:["The investor will receive back their capital contribution of £100.","The investor will not receive back their capital contribution of £100.","The investor will be required to pay an additional £100 by the liquidator.","The investor will be required to contribute personally to the debts of the company.","The investor is not required to make any further payments due to the resolution passed by the company."],ans:"C",expl:"(C) Shareholders can only be liable on an insolvency for any amount that remains outstanding on their shares. Shares can be allotted fully paid up, unpaid, or partly paid. If shares are fully paid up then the shareholder will have no liability to a liquidator on an insolvency. If shares are partly paid, that is, the full issue price has not yet been paid by the shareholder to the company, then the shareholder is obliged to pay any outstanding amounts. The investor would therefore be required to pay the additional £100 outstanding. (A) is incorrect because there is very little likelihood that the shareholders would be paid anything on an insolvency, as they would rank behind the creditors of the company who are unlikely to be repaid their debts in full. (B) is incorrect because, although it is correct that the investor will not receive back their capital contribution of £100, they would also be required to contribute the additional £100 outstanding on their shares. (D) is incorrect because this is a limited liability company, so the liability of shareholders is limited to their capital contribution and any amount outstanding on their shares. (E) is incorrect because the statutory obligation to pay any sums outstanding on insolvency would override the resolution passed by the company.",note:dr},{n:6,id:"BSL165",scenario:`Three surveyors are partners in a surveyor's firm. The partnership agreement is silent about the payment of salaries and the division of profits and losses. Partner 1 works four days a week in the firm, and partners 2 and 3 each work three days a week. Partner 2 invested £80,000 in the firm, partner 1 invested £20,000, and partner 3 invested £50,000.
Profits for this year of the business are £300,000.`,q:"How should these profits be divided between the partners?",opts:["Partner 1: £120,000; Partner 2: £90,000; Partner 3: £90,000.","Each partner receives £100,000.","Each partner receives £50,000 and the remaining £150,000 is reinvested in the business.","Partner 1: £160,000; Partner 2: £40,000; Partner 3: £100,000.","Partner 1: £40,000; Partner 2: £160,000; Partner 3: £100,000."],ans:"B",expl:"(B) Each partner will receive £100,000. In the absence of a provision in the partnership agreement to the contrary, profits are shared equally among the partners. So, if partners contribute unequal shares at the outset of the partnership and want to share in profits pro rata to their capital contributions, or in relation to the time devoted to the business, this would need to be dealt with in the partnership agreement. In this scenario there is nothing to suggest that the partners have agreed to a pro rata profit sharing arrangement, so the profits would be split equally between the three partners. It follows that none of the other answer choices can be correct.",note:`The OCR read partner 2's investment as "$80,000"; it is shown as £80,000.`},{n:7,id:"BSL153",scenario:"A partner in a florist business recently ordered roses from a new supplier for £2,000 without the knowledge or consent of the other three partners. The roses were ordered using the firm's headed notepaper. The partnership agreement provides that contracts of more than £500 require approval of the majority of the partners.",q:"Which of the following states the legal position as to liability on the contract?",opts:["The partnership is liable for the debt and the supplier is entitled to pursue any one of the partners for the full £2,000.","Only the partner who ordered the roses is liable for the debt, as they entered into a contract above the authorised limit in the partnership agreement.","The partnership is liable for the debt and the supplier is entitled to pursue any one of the partners for up to £500.","The partnership is liable for the debt even if the supplier knew about the limit in the partnership agreement because it was for carrying on partnership business.","The partnership is not liable for the debt because the partner ordered the roses without the knowledge or consent of the other partners."],ans:"A",expl:"(A) The partnership is liable for the debt and the supplier is entitled to pursue any one of the partners for the full £2,000. Any partner is liable for the full amount of a partnership debt. Under the Partnership Act 1890, every partner is an agent of the firm and the other partners for the purpose of the business of the partnership. A partner who carries out business of the kind usually carried on by the firm will bind the firm and the partners. The exception to this is if the partner does not actually have the authority to act for the firm and the person with whom the partner is dealing either knows that the partner has no authority or does not know or believe the partner to be a partner. The purchase of roses for a florist appears to be the carrying on of regular business, and there is no indication that the supplier had knowledge of the limitation on the partner's authority. Therefore, the partnership will be liable for the debt based on apparent authority and (B) is incorrect. (C) is incorrect as limitation in the partnership agreement does not bind a third party. (D) is incorrect as a creditor cannot rely on apparent authority if they are aware that the partner does not have authority. (E) is incorrect as apparent authority can bind the partnership when the partner acted outside of his actual authority.",note:dr},{n:8,id:"BSL209",scenario:`A company wishes to change its name by special resolution and to give directors authority to allot preference shares by ordinary resolution. A written resolution is sent out to all eligible members on the 1st of the month, which was a weekday. The shareholdings in the company are:
Shareholder 1: 50%
Shareholder 2: 20%
Shareholder 3: 20%
Shareholder 4: 10%
The company has adopted the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association.
Shareholder 4 signs and returns the resolution on the 5th of the month. Shareholder 1 signs and returns the resolution on the 15th of the month. Shareholder 2 signs and returns the resolution on the 20th of the month. Shareholder 3 signs and returns the resolution on the 30th of the month.`,q:"When were the resolutions passed?",opts:["Both resolutions were passed on the 20th of the month.","The written resolutions were not passed, as Shareholder 3 did not return the resolution in time.","The ordinary resolution was passed on the 15th of the month, and the special resolution was passed on the 20th of the month.","Both resolutions were passed on the 28th of the month.","The special resolution was passed on the 15th of the month, and the ordinary resolution was passed on the 20th of the month."],ans:"C",expl:"(C) The ordinary resolution was passed on the 15th of the month, and the special resolution was passed on the 20th of the month. A written resolution is passed once sufficient votes are returned to the company. To pass an ordinary resolution requires over 50% of the shares to vote in favour - this happened on the 15th of the month, as Shareholder 4's 10% vote was received on the 5th and Shareholder 1's 50% vote was received on the 15th. A special resolution requires a majority of 75%, which was reached on the 20th when the company received Shareholder 2's 20% vote in addition to the 60% already received. (A) is incorrect as the resolutions can be passed at different times, and the ordinary resolution had received enough votes by the 15th. (B) is incorrect. It is true that a shareholder's vote must be received within 28 days of the date the resolution was circulated and that, therefore, Shareholder 3's vote was received too late to count. However, the written resolutions passed as soon as enough votes were returned; it does not matter whether all of the members return their resolution. (D) is incorrect, as although the written resolution lapses on the 28th day after circulation, the resolutions will be passed as soon as enough votes are returned to reach the requisite majorities. (E) is incorrect as an ordinary resolution requires a majority of over 50%, which was reached on the 15th, and a special resolution requires a majority of 75%, which was reached on the 20th.",note:"The question screen appears twice in the PDF (the second copy is scrolled down to show options B–E). It is included once."},{n:9,id:"BSL047",scenario:"A young woman inherited 50 £100 8% cumulative preference shares. The company was happy to register the woman as the new owner of the shares.",q:"To which of the following rights is a holder of a company's cumulative preference shares always entitled?",opts:["Conversion of the preferred shares into ordinary shares.","Voting rights.","Dividends to be rolled over from years in which dividends were not paid, to future years.","Guaranteed dividends.","A fixed percentage dividend based on the company's profitability."],ans:"C",expl:"(C) A cumulative preferred dividend means that the holders of these shares are entitled to a dividend each year, but to the extent that there are no profits available for the purpose, the dividend will be carried forward until profits are available. (A) is incorrect as preference shares do not carry a right to conversion. (B) is incorrect because it is unlikely that preference shares will carry voting rights (except in relation to decisions that affect that particular class of shares), as it is usually ordinary shares that have full voting rights. (D) is incorrect as no dividends are guaranteed. There must be profits available for the purpose, as it is expressly prohibited by the Companies Act 2006 to pay a dividend out of capital. (E) is incorrect because a preference share gives a fixed percentage dividend based on the nominal value of the shares, not the company's profitability."},{n:10,id:"BSL200",scenario:"A company has adopted the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association. It has three equal shareholders who are also the only directors. The company wishes to award a three-year service contract to one of the directors.",q:"Which of the following best describes the procedure to award the service contract to the director?",opts:["The board must first approve the contract by special resolution and the shareholders must then approve the contract by special resolution.","The contract need only be approved by a majority of the three directors to be valid.","Such a contract cannot be approved through any process because it is for more than two years.","The contract can be approved by a majority vote of either the directors or the shareholders.","The board must first adopt a resolution approving the contract and then it must be approved by the shareholders by ordinary resolution."],ans:"E",expl:'(E) The board must first adopt a resolution approving the contract and then it must be approved by the shareholders by ordinary resolution. A service contract of up to two years can be entered by the board alone, but a contract over two years must be approved by board resolution and then voted on by the shareholders as an ordinary resolution (that is, a resolution that requires only a majority for approval). (A) is incorrect as there is no "special resolution" by directors and, as just indicated, the shareholders can approve through ordinary resolution. (B) is incorrect as the directors still need to vote on the contract as shareholders despite the fact that the three directors are also the only shareholders. (C) and (D) are incorrect for the reasons indicated above - contracts of more than two years can be approved, but the shareholders must be involved as well as the directors. (D) is incorrect as the service contract is awarded by the board after the members have approved the duration.',note:"Source slip: the explanation deals with (D) twice, and the second statement does not sit easily with the explanation of (E) (board resolution first, then shareholder approval). The original wording is kept."},{n:11,id:"BSL128",scenario:"A company was incorporated several years ago and has adopted the Companies (Model Articles) Regulations 2008 (unamended) for private companies limited by shares as its articles of association. It now wishes to raise capital by issuing more shares. Currently, the company has only two shareholders: Shareholder Able holds 600 £1 ordinary shares, and Shareholder Baker holds 300 £80 preference shares. No resolution has been passed to disapply pre-emption rights. The company wants to issue another 600 £1 ordinary shares at a £99 premium.",q:"How many shares must be offered to each shareholder and at what price?",opts:["300 to Able at not more than £1 per share; 300 to Baker at not more than £100 per share.","400 to Able at not more than £100 per share; 200 to Baker at not more than £100 per share.","600 to Able at not more than £1 per share; none to Baker.","600 to Able at not more than £100 per share; none to Baker.","The shares need not be offered to either shareholder because the company has two classes of shares."],ans:"D",expl:"(D) Able must be offered all 600 shares at not more than £100 per share. When a company allots ordinary shares after the initial allotment, existing ordinary shareholders have a right to purchase a portion of the shares to maintain their proportional ownership if the shares are to be issued for cash. This is called the pre-emption right. Here, the company is seeking to issue 600 shares at £100 per share (£1 plus a £99 premium). Since Able is the only ordinary shareholder and Able holds 100% of the issued ordinary shares, Able must be offered 100% of the shares to be allotted at a price no more than the price at which they would be offered to an outside person. As Baker does not hold any ordinary shares, Baker would not have any pre-emption rights in the shares to be allotted. Therefore, (A) and (B) are incorrect because they offer a pre-emption right to Baker. (A) is also incorrect with respect to the maximum price to Able. (C) is incorrect for the same reason. (E) is incorrect because the fact that the company has more than one class of stock does not negate the pre-emption right of ordinary shareholders.",note:`The facts were checked against the page image, which shows Baker's holding as "300 £80 preference shares".`},{n:12,id:"BSL113",scenario:`A company went into liquidation on the 1st of this month. The liquidator is considering the following antecedent transactions to consider whether they could be challenged to swell the funds available to pay the creditors.
A warehouse was sold to a director three years ago for £10,000. The director sold the property last year for £50,000.
A carpark was sold to a developer for £15,000 18 months ago. After obtaining planning permission to redevelop the carpark for residential use, the carpark was sold for £100,000.
An oil painting which had hung in the board room was sold for £5,000 at auction 10 months ago. The purchaser resold the painting two months later for £10,000.`,q:"Which of the transactions fall within the relevant time for a transaction at an undervalue?",opts:["All of the transactions.","The sale of the carpark and the sale of the painting only.","The sale of the carpark only.","The sale of the painting only.","The sale of the warehouse and the sale of the oil painting only."],ans:"B",expl:"(B) The sale of the carpark and the sale of the painting both are within the relevant time period. The relevant time period for a transaction at an undervalue is within two years of a company's insolvency. (A) and (E) are incorrect as the sale of the warehouse falls outside of the two-year period. (C) and (D) are incorrect as they each include only one of the transactions made within the relevant time frame.",note:"The facts were read from the page image. Option (E) is cut off on the question screen and is taken from the answer screen."},{n:13,id:"BSL193",scenario:`A company was incorporated 10 years ago. It has adopted the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association. It has an issued share capital of 1,000 ordinary £1 shares. Only 100 shares were issued in the company's initial allotment. The remaining 900 shares were issued at a premium at various times over the past 10 years. Due to a temporary slow-down in the company's business, the company has only £30,000 in accumulated profits from which to declare dividends. However, the company has £90,000 in its share premium account.
Because the company is solvent and business is beginning to rebound, the directors vote to pay a dividend of £5 on account of each outstanding share, and the shareholders approve the distribution through an ordinary resolution.`,q:"Was the dividend properly approved under the Companies Act 2006?",opts:["Yes, because the company was solvent when the dividend was approved.","Yes, because the company had sufficient cash reserves to pay the dividend.","Yes, because the directors resolved to make the distribution and the shareholders approved through an ordinary resolution.","No, because the company did not have sufficient available funds to pay the distribution.","No, because the shareholders did not approve by special resolution."],ans:"D",expl:"(D) The dividend was not properly approved because the company did not have sufficient funds to pay the dividend. Dividends can be paid only out of profits; they cannot be paid out of the share premium account (which includes premiums above a share's nominal or par value received upon issuance of the share). Here, the company had only £30,000 (£3 per share) to distribute as a dividend and it declared a £5 per share dividend. Therefore, (B) is incorrect. (A) is incorrect because whilst a company must be solvent to declare a dividend, that is just the starting point. There also must be sufficient profits, and as explained above, here there were not. (C) is incorrect (though it states the correct procedure - board resolution for a dividend approved by an ordinary shareholder's resolution) - as there still must be sufficient funds to pay the dividend, and here there were not. (E) is incorrect because a special resolution is not required.",note:`Source slip: on the stated figures, £30,000 of profits across 1,000 shares is £30 per share, so a £5 dividend (£5,000 in total) would be covered. The explanation's "£3 per share" does not match the facts. The answer and wording are kept as given in the source.`},{n:14,id:"BSL137",scenario:"A private limited company was incorporated with the Companies (Model Articles) Regulations 2008 ('the Model Articles') as its articles of association several years ago. It is classed as a small company.",q:"Which of the following must be included when the accounts are filed at Companies House?",opts:["An audit report.","A director's report.","A strategic report.","A chairman's report.","A balance sheet."],ans:"E",expl:"(E) The only documents that must be included with the accounts of a small company are a profit and loss statement and a balance sheet which give a true and fair view of the company. Medium and large companies must also include an independent auditor's report (A), a director's report (B), and a strategic report (C), but these are not required for a small company and, hence, are incorrect choices. (D) is incorrect, as although there is usually a chairman's report to accompany the accounts, there is no legal requirement for one."},{n:15,id:"DIS024",scenario:`A merchant brings a claim for professional negligence against a firm of solicitors which represented the merchant in a breach of contract claim. The claim alleges that the firm did not contact two important witnesses despite the merchant's providing the firm with details about the witnesses. The firm denies it was provided with these details.
Standard disclosure in the professional negligence case has now taken place in accordance with directions. Whilst the firm has disclosed most of its file of papers, the merchant maintains that a note of her attendance at the solicitors' office, when she initially provided details of the witnesses, is missing. The note is crucial to the success of her case.`,q:"What should the claimant be advised to do?",opts:["The claimant should write to the court stating that the defendant's disclosure is inadequate, with the reasons why.","The claimant should do nothing, as the claimant's barrister will be able to cross-examine the solicitor at the trial.","The claimant should make an application for specific disclosure of the note.","The claimant should make an application to the court to vary the directions.","The claimant should wait until exchange of witness statements to raise the issue of the missing note of her attendance."],ans:"C",expl:"(C) A party who is not content with the disclosure provided by an opponent has a few options, including filing an application for specific disclosure. The claimant can very specifically identify the documents that it seeks. If the court orders the defendant to supply it, they will have difficulty avoiding disclosure if the document exists. If it does not exist, it will certainly be a point for cross-examination at the trial, and it will be for the court to determine any inference that it may wish to draw from its absence. (A) is incorrect because writing to the court will have no effect. (B) is incorrect because the claimant is likely to be criticised for not raising the matter earlier. (D) is incorrect because an application to vary directions is not necessary in this case. An application for specific disclosure is used when a party believes that their opponent's disclosure was inadequate. (E) is incorrect because it would be wrong to wait until witness statement exchange to raise this important issue. The issue should be raised earlier
