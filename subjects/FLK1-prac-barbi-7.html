on if title to the land is already registered; here, it is unregistered. (D) is incorrect because the correct time period, as explained above, is registration within two months of completion. (E) is incorrect because title does not pass in either the registered or unregistered system on exchange of contracts.",note:"The question line was cut short in the OCR; it was read from the page image."},{n:23,id:"BSL170",scenario:"A company which manufactured car parts went into creditors' voluntary liquidation last year. The liquidator is now finalising the amount available for unsecured creditors. The liquidator has realised £500,000 and has incurred costs of £75,000. The preferential creditors are owed £66,000 and the unsecured creditors are owed £1,500,000.",q:"How much will an unsecured creditor who is owed £375,000 receive?",opts:["£125,000","£89,750","£375,000","£106,250","£108,500"],ans:"B",expl:"(B) The unsecured creditor will receive £89,750. Unsecured creditors receive a proportion of the proceeds realised by the liquidator after the liquidator subtracts the expenses of winding up and pays the preferential debts. Here, the liquidator realised £500,000. After subtracting expenses (£75,000) and paying the preferential creditors the £66,000 owed to them, £359,000 remains to pay the unsecured creditors proportionally. The unsecured creditor here holds 25% of the total unsecured debt (that is, £375,000 of the £1,500,000 unsecured debt) and so is entitled to 25% of the £359,000 that remains to pay the unsecured creditors. Thus, (A), (C), (D), and (E) (which are based on not subtracting out the proper amount for expenses and the preferential debts) are incorrect."},{n:24,id:"BSL218",scenario:"A company granted a floating charge over all the assets of the company to Bank 1, and a fixed charge over its premises to Bank 2.",q:"If the company wishes to sell assets, which of the following statements best describes who must consent to the sale?",opts:["Only Bank 2 must consent to the sale of the premises.","Only Bank 1 must consent to the sale of the premises.","Only Bank 2 must consent to the sale of inventory.","Bank 1 and Bank 2 must both consent to the sale of the premises.","Bank 1 and Bank 2 must both consent to the sale of inventory."],ans:"A",expl:"(A) The holder of a fixed charge must give consent for the asset charged to be sold. An asset charged by way of floating charge can be freely sold until the floating charge crystallises. Therefore, Bank 2 must consent to sale of the premises which are charged by way of fixed charge. (B), (D), and (E) are incorrect, as a floating charge holder does not need to consent to the sale of an asset charged by way of floating charge. (C) is incorrect as the fixed charge is taken only over the premises and not over inventory.",note:'A word is missing from the OCR of the facts ("all the [assets] of the company"); it has been completed from the answer screen, which has the same wording.'},{n:25,id:"ETH128",scenario:"A firm is instructed to act for three clients who wish to set up a company. They are all planning to contribute equal capital and take equal shareholdings.",q:"Can one solicitor draw up the shareholders agreement on the clients' behalf?",opts:["No, because there is an inherent conflict between the interests of each client.","Yes, because there is no actual conflict.","Yes, because this will be cheaper and more convenient for the clients.","Yes, because there is no significant risk of conflict, but the solicitor will need to stop acting for some or all of the clients if this changes.","No, because this would require SRA permission."],ans:"D",expl:"(D) If the solicitor takes the view that the clients' interests are the same (for example, that they are all taking equal benefit and responsibility, and there is no need to negotiate) and there is no significant risk of a conflict arising, then the decision can be taken to act, but only on the basis that the solicitor will monitor the situation and stop acting if a conflict subsequently arises. (A) is incorrect because whether a conflict exists, or is likely to arise, is a matter of fact based on the circumstances. (B) is incorrect because even if there is no actual conflict, a solicitor will be prevented from acting if there is a significant risk of conflict. (C) is incorrect because it does not address the concern regarding a conflict of interest. (E) is incorrect because the SRA does not give permission to act and instead expects the solicitor to make a judgement based on regulatory duties and the facts of the matter."},{n:26,id:"BSL225",scenario:"Two mechanics run their business through the medium of a private company limited by shares. Following some important documents being overlooked, the board resolved to change the company's registered office from its trading premises to its accountants' offices. The company was incorporated with the Companies (Model Articles) Regulations 2008 ('the Model Articles') as its articles of association.",q:"What must be filed with the Registrar of Companies following the change of registered office?",opts:["A copy of the company's new letterhead, the Change of Registered Office Address form, and the board resolution changing the registered office.","A copy of the company's new letterhead and the Change of Registered Office Address form only.","The board resolution changing the registered office only.","The Change of Registered Office Address form only.","The board resolution changing the registered office and the Change of Registered Office Address form only."],ans:"D",expl:"(D) Following the change of registered office, the only thing that must be filed at Companies House is a Change of Registered Office Address form. (A), (C), and (E) are incorrect as board resolutions are not filed at Companies House. (B) is incorrect as although the company must change its letterhead to show its current registered office, this is not filed at Companies House."},{n:27,id:"PRP124",scenario:`A buyer client has just received their mortgage offer to assist with their purchase of a commercial warehouse unit. The mortgage offer includes the following:
'This mortgage offer is made on an endowment basis'.
The client telephones their solicitor to ask what this means.`,q:"How will the solicitor respond?",opts:["This means that the borrower's monthly repayments include an element of capital and interest.","This means that the borrower's monthly repayments are interest only and the capital is due at the end of the term.","This means that the borrower's monthly repayments are linked to a personal pension policy.","This means that the borrower's monthly repayments are capital only and the interest is due at the end of the term.","This means that the borrower's monthly repayments are linked to a life insurance policy."],ans:"E",expl:"(E) This is a mortgage combined with a life insurance policy. The borrower pays a lower monthly sum and pays a sum of money into the life insurance policy, hoping that when the policy matures, it pays out enough money to enable the borrower to repay the balance on the mortgage. (A) is incorrect because it describes a standard repayment mortgage. (B) is incorrect because it describes an 'interest only mortgage'. At the end of the term on an interest only mortgage, the entire capital balance becomes due. (C) is incorrect because it describes a 'pension mortgage'. (D) is incorrect because no mortgage is set up that way."},{n:28,id:"PRP126",scenario:"A paralegal in a busy conveyancing department is working in the pre-completion team. Their principal has taken the afternoon off and has left a note for the paralegal requesting that they apply for the mortgage advance. The paralegal has looked through the file and is not sure how to do this.",q:"What should the paralegal do to comply with their principal's request?",opts:["Submit the pre-completion searches.","Submit the online application to the lender.","Submit the request for mortgage advance to the lender.","Submit the certificate of title to the lender.","Submit the title guarantee to the lender."],ans:"D",expl:"(D) To apply for a mortgage advance, a certificate of title ('CoT') is submitted to the lender. A CoT involves the solicitor confirming a series of statements which confirm to the lender that the title is good and marketable. The CoT also acts as a request for drawdown of the mortgage advance. Thus, the remaining answers are incorrect."},{n:29,id:"BSL117",scenario:"A bank is notified that one of its borrowers has gone into liquidation and is reviewing its security for the money owed by the borrower. Although the bank dutifully registered each charge with Companies House, it is concerned that one of its loans might be unsecured.",q:"Which of the following loans is most likely to be automatically unsecured?",opts:["A loan to buy office premises five years ago; a floating charge was taken over the premises a year after the loan was made.","A loan of operating capital made six months ago; a floating charge was granted when the loan was made.","A loan to cover an overdraft eight months ago; a floating charge was granted six months after the overdraft loan was made.","A loan granted 12 months ago to enable the company to purchase new premises; a floating charge was taken over the premises.","A loan to purchase plant and machinery; a floating charge was granted three years ago when the loan was made."],ans:"C",expl:"(C) The floating charge granted to secure the existing overdraft is unsecured. A floating charge is automatically void if it was created for no consideration within 12 months ending with the onset of insolvency and at a time the company was insolvent or became insolvent as a result. As this floating charge was granted for no new consideration, it could be void if the company was insolvent at the time. (A) and (E) are incorrect as the charges in each were granted outside the relevant timeframe for attack by a liquidator. (B) and (D) are incorrect as the floating charge in each was given for fresh consideration."},{n:30,id:"ETH149",scenario:"A solicitor's firm had until recently acted for a commercial business, Client A, in general corporate-commercial matters. The solicitor had not been personally involved in those matters. The solicitor has now been instructed to act for another business, Client B, in its bid to take over Client A's business. The firm holds confidential information about Client A that would be material in Client B's matter.",q:"Which of the following statements best describes whether the solicitor can act for Client B in accordance with the SRA Code of Conduct?",opts:["Because Client A is no longer a client of the firm, the solicitor is entitled to act against their interests and make full disclosure of any material information to Client B.","Because Client A is owed a duty of confidentiality by the firm, the solicitor cannot act against Client A's interests.","Because Client A and Client B have adverse interests, the solicitor must either seek Client A's written consent to her acting and to the protection of their information, or she must put in place effective measures so that there is no real risk of disclosure.","Because the solicitor did not personally act for Client A, the solicitor is entitled to act against Client A's interests.","Because of the connection between the instructions from Client A and Client B, the solicitor is prohibited from acting for Client B."],ans:"C",expl:"(C) Client A (the former client) and Client B (the current client) have adverse interests and the solicitor must comply with the SRA Codes, which state that a solicitor must not act for a client in a matter where that client has an interest adverse to the interest of another current or former client for whom the solicitor (or their business or employer) holds confidential information which is material to that matter, unless: (1) effective measures have been taken which result in there being no real risk of disclosure of the confidential information (for example, putting structural safeguards in place so that the Client B team does not have access to the Client A files); or (2) the current or former client whose information the solicitor holds has given informed consent, given or evidenced in writing, to the solicitor acting, including to any measures taken to protect their information. (A) is incorrect because the firm continues to owe a duty of confidentiality to former clients, and the duty of confidentiality takes precedence over the duty of disclosure. (B) is incorrect because a solicitor can act against the interests of a former client provided that the former client's confidential information is protected from misuse. (D) is incorrect because the entire firm owes a duty of confidentiality to Client A, regardless of which solicitors worked on those matters. (E) is incorrect because the conflict between confidentiality versus disclosure does not necessarily prevent the solicitor from acting, but she must ensure that her actions comply with the SRA Codes, which are predominantly concerned with the protection of confidential information from misuse.",note:"The OCR of options (A) and (C) was garbled; option (A) was read from the page image and (C) from the answer screen."},{n:31,id:"PRP024",scenario:"A solicitor is acting for a client in relation to the purchase of a property. The buyer and seller agree a 10% deposit on exchange of contracts and that a solicitor will hold the deposit as agent for the seller.",q:"Under this agreement, which solicitor will hold the funds and what is the consequence of the deposit being held by a solicitor as agent for the seller?",opts:["The seller's solicitor will hold the deposit and pay over the deposit to the seller on completion.","The buyer's solicitor will hold the deposit and pay over the deposit to the seller on completion.","The seller's solicitor will hold the deposit and may pay over the deposit to the seller immediately after exchange.","The buyer's solicitor will hold the deposit and may pay over the deposit to the seller immediately after exchange.","The seller's solicitor will hold the deposit and may pay over the deposit to the seller immediately after the property is registered in the buyer's name."],ans:"C",expl:"(C) If a buyer and seller agree that a deposit will be held by a solicitor as agent, it means that the buyer's deposit will be held by the seller's solicitor and may be paid over to the seller immediately after exchange has taken place. This may occur, for example, when the buyer is buying a new build property. It presents a risk to the buyer because if the seller spends the money between exchange and completion, the buyer may have difficulty recovering the deposit in the event of the seller's default. Thus, the standard conditions of sale provide that on exchange of contracts, the buyer's deposit is held by the seller's solicitor as stakeholder (meaning the deposit will be paid to the seller only on completion). (A) is incorrect because this answer choice describes the consequence when the deposit is held as stakeholder, not as agent. (B) and (D) are incorrect because the buyer's solicitor does not hold the deposit after exchange; the seller's solicitor does. (E) is incorrect because, as explained above, when the deposit is held as agent it may be paid over the seller immediately after exchange."},{n:32,id:"ETH107",scenario:"A solicitor is acting for two individuals on their purchase of a business. The first individual tells the solicitor that he will imminently be made bankrupt.",q:"What of the following steps should the solicitor now take?",opts:["The solicitor should do nothing because this information was given to them in confidence.","The solicitor should immediately inform the second individual because this will have a bearing on the transaction.","The solicitor should cease to act because a conflict of interest has arisen.","The solicitor should obtain the first individual's consent to disclose the information to the second individual. If the first individual does not consent to this, the solicitor will need to cease acting.","The solicitor should immediately cease to act for the first individual."],ans:"D",expl:"(D) The information the solicitor has received is material to the matter in which he is instructed by the two clients. The solicitor therefore has a duty to disclose it to the second individual, but the solicitor cannot do this without consent because of the duty of confidentiality. Therefore, (A) is incorrect. (B) is incorrect because the solicitor needs the first individual's consent to disclose the information as it is subject to the duty of confidentiality. (C) is not correct because at this point, the solicitor should seek the first individual's consent to disclose the information to the other party. If the first individual does not consent, then the solicitor should cease to act. (E) is incorrect because the ceasing to act for the first individual does not address the problem. The solicitor still has a duty of confidentiality to the first individual, and a duty of disclosure to the second individual.",note:Fi},{n:33,id:"PRP050",scenario:"A man is selling his property which has a large garden. There is a rough track at the bottom of the garden which has been created by the constant passing over the land by the man's neighbour. The man has let his neighbour take a shortcut over the land for 15 years, though the arrangement has never been formalised.",q:"Does the man have a duty to disclose this use in the contract with the buyer?",opts:["Yes, because otherwise the seller would be liable for nondisclosure.","No, because the use is a latent defect, and latent defects need not be disclosed.","No, under the doctrine of 'caveat emptor'.","No, because the use is a patent defect and patent defects need not be disclosed.","Yes, because the use is a patent defect and patent defects must be disclosed."],ans:"D",expl:"(D) The seller need not disclose the use, as it is a patent defect. A right-of-way which is visible, such as the one in the question, is a patent defect. It does not need to be disclosed in the contract because the seller's duty of disclosure does not extend to patent defects. (Note that a prudent solicitor would advise the seller to disclose the right-of-way anyway - to avoid any possible misrepresentation claim - but disclosure is not actually required under the circumstances.) (A) is incorrect because for the reasons just explained - disclosure is not required here, so non-disclosure will not result in liability. (B) is incorrect, both because the defect is patent (obvious) rather than latent (not obvious), and because the rule is the opposite of that stated - latent defects must be disclosed. (C) is incorrect as the doctrine of 'caveat emptor' (that is, let the buyer beware) is the reason that the defect does not need to be referred to in the contract - because the defect is observable, the doctrine of caveat emptor applies and the buyer has the burden of discovering the defect. (E) is incorrect because it has the rule backwards - patent defects need not be disclosed, as discussed above."},{n:34,id:"PRP028",scenario:"A seller and buyer have exchanged contracts for the sale and purchase of a property. The parties are using the Contract Incorporating the Standard Conditions of Sale (5th edition - 2018 revision) unamended. The property burnt down between exchange of contracts and completion. Neither the buyer nor the seller had insurance on the property in place between exchange and completion. The buyer is now refusing to complete.",q:"Is the buyer bound to proceed with the purchase?",opts:["No, because risk in the property does not pass to the buyer until completion.","No, because the property is not in the same condition that it was on exchange of contracts.","Yes, because risk in the property passes to the buyer on exchange of contracts.","No, because the seller did not maintain insurance on the property after exchange of contracts.","Yes, because title to the property passes to the buyer on exchange of contracts."],ans:"C",expl:"(C) The buyer is contractually bound to proceed with the purchase because under the standard conditions of sale, risk in the property passes to the buyer on exchange of contracts. This means that if the property is destroyed or damaged between exchange and completion, the buyer must still proceed with the purchase. (A) is incorrect because, as explained above, risk in the property passes to the buyer on exchange (not on completion). (B) is incorrect because it is irrelevant that the property is not in the same condition as it was on exchange, because, as explained above, risk passed to the buyer on exchange. (D) is incorrect because the standard conditions do not require the seller to insure the property between exchange and completion. There is no requirement on the buyer to insure the property during this time, either, though given that risk passes to the buyer on exchange, it would be prudent for the buyer to do so. In practice, most properties are insured by both the seller and the buyer between exchange and completion. (E) is incorrect because title to the property does not pass on exchange. If the land is unregistered, title passes on completion; if the land is registered, title passes when the purchase is registered.",note:"Possible source error: Standard Condition 7.1.1 of the Standard Conditions of Sale (5th edition) states that the property is at the seller's risk until completion, so the source's answer and explanation appear to be inconsistent with the Standard Conditions named in the facts. The source's answer and wording are kept unchanged."},{n:35,id:"PRP097",scenario:"A solicitor acting for the buyer of a residential property, which is situated in a national park, has noted that the seller has added a small porch to the front of the property but has indicated on the Property Information Form that this was done recently under the permitted development rights. The solicitor has now received the result of the local search which has revealed an Article 4 direction disapplying deemed planning permission. The solicitor informs the buyer that the porch might pose a problem.",q:"Is the solicitor correct?",opts:["No, the Article 4 direction disapplies deemed permission and so planning permission for small projects is not required.","Yes, the Article 4 direction means that building regulation consent should have been obtained for the works.","Yes, the Article 4 direction means that the permitted development rights have been removed, so express planning permission was required.","No, the Article 4 direction means that express planning permission has been given for the works.","No, because under Town and Country Planning (General Permitted Development) Order 1995, express consent is not required for small developments such as porches."],ans:"C",expl:"(C) The solicitor is correct because the Article 4 direction means that the permitted development rights have been removed, so express planning permission was required. Town and Country Planning (General Permitted Development) Order 1995 grants permission ('deemed permission') to undertake small developments (such as small home extensions, porches, fences, and conservatories) without applying for express permission from the local planning authority. However, the Article 4 direction disapplies such permitted development rights. Therefore, planning permission was required for the porch. As the work was done recently and planning permission was not obtained, the buyer could be subject to an enforcement action if the seller does not obtain retrospective planning permission. (A) is incorrect because it states the opposite of the effect of disapplication. (B) is incorrect because deemed permission and Article 4 (the subject of this question) goes to planning permission rather than building regulation. (D) and (E) are incorrect because, as explained, Article 4 removes deemed permission and is not a grant of express permission or a disapplication of the requirement of express permission."},{n:36,id:"BSL102",scenario:"A year ago, a company borrowed £220,000 from the bank. £140,000 of the loan is still outstanding. The loan was secured by a fixed charge in the bank's favour over the company's premises, which are now worth £120,000. The bank enforces its security, and the company immediately goes into insolvent liquidation.",q:"How does the bank rank as a creditor?",opts:["The bank will be a secured creditor for £140,000 only.","The bank will be a secured creditor for £220,000 only.","The bank will be a secured creditor for £120,000 only.","The bank will be a secured creditor for £120,000 and a preferential creditor for £20,000.","The bank will be a secured creditor for £120,000 and an ordinary creditor for £20,000."],ans:"E",expl:"(E) The bank is a secured creditor up to the value of the asset charged (£120,000) and is an ordinary creditor for the outstanding balance beyond the value of the charged asset (£20,000). (A) is incorrect because the bank is secured only to the extent of the £120,000 value of the asset charged. (B) is incorrect for the same reason. Additionally, although £220,000 was originally borrowed, only £140,000 is still owed to the bank. (C) is incorrect because it fails to recognize the bank's position with respect to the £20,000 it is owed beyond the value of the charged asset. (D) is incorrect because the bank is unsecured as to the extra £20,000; preferential creditors are employees and HMRC."}],ak=[["Set 6",tk],["Set 7",nk],["Set 9",ok],["Set 11 / Set 12",ik]];let sk=0;const lk=ak.flatMap(([r,i])=>i.map(a=>({...a,src:`${r} · Q${a.n}`,n:++sk}))),ck="Practice Questions Sets 6, 7, 9, 11 and 12 (Combined) — Questions and Answers",Bn=lk,hk=["A","B","C","D","E"],uk={CNL:"Constitutional & Administrative Law",DIS:"Dispute Resolution",ELS:"Legal System of England & Wales",TRT:"Tort",TAX:"Taxation",LGS:"Legal Services",ETH:"Ethics & Professional Conduct",BSL:"Business Law",CTR:"Contract",PRP:"Property Practice",LAN:"Land Law",TRU:"Trusts",WEA:"Wills & Administration o
