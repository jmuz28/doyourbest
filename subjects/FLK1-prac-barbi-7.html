x?-1:a.x>l.x?1:a.y<l.y?-1:a.y>l.y?1:0),XT(i)}function XT(r){if(r.length<=1)return r.slice();const i=[];for(let l=0;l<r.length;l++){const h=r[l];for(;i.length>=2;){const u=i[i.length-1],d=i[i.length-2];if((u.x-d.x)*(h.y-d.y)>=(u.y-d.y)*(h.x-d.x))i.pop();else break}i.push(h)}i.pop();const a=[];for(let l=r.length-1;l>=0;l--){const h=r[l];for(;a.length>=2;){const u=a[a.length-1],d=a[a.length-2];if((u.x-d.x)*(h.y-d.y)>=(u.y-d.y)*(h.x-d.x))a.pop();else break}a.push(h)}return a.pop(),i.length===1&&a.length===1&&i[0].x===a[0].x&&i[0].y===a[0].y?i:i.concat(a)}var ZT=Cg,Rg=Sg;const ek=T.forwardRef(({className:r,sideOffset:i=4,...a},l)=>k.jsx(ZT,{children:k.jsx(Rg,{ref:l,sideOffset:i,className:ge("z-50 overflow-hidden rounded-md bg-popover px-3 py-1.5 text-xs text-popover-foreground animate-fade-in",r),...a})}));ek.displayName=Rg.displayName;const Mp="The scan captures this explanation out of order; it has been reassembled in reading order from the page image.",Hi="The PDF stops after the answer screen for Q56 (its page footer reads '117 of 121'), so the answer screens for Q57–Q60 are missing. No answer, explanation or question ID is available, and none has been added.",tk=[{n:1,id:"LGS088",scenario:"A solicitor is working in the area of banking and finance law at a firm which is regulated by the Solicitors Regulation Authority ('SRA'). The firm has decided to set up a department providing investment management advice to high net worth individuals on a variety of different investments such as shares and gilts. The firm seeks advice as to whether they require authorisation from the Financial Conduct Authority ('FCA').",q:"Which of the following best describes the legal position in relation to the need for authorisation?",opts:["The firm is exempt from authorisation by the FCA as they are a member of a Designated Professional Body.","The firm must apply for authorisation by the FCA as it is likely to be carrying on a regulated activity by advising on specified investments.","The firm does not need authorisation by the FCA as providing investment management advice to high net worth individuals is not a regulated activity.","The firm is exempt from authorisation by the FCA provided that the employees providing the advice are members of the Law Society.","The firm does not need authorisation from the FCA as they are providing advice only to high net worth individuals who will generally be experienced investors."],ans:"B",expl:"(B) The firm must apply for authorisation from the FCA as it is likely to be carrying on a regulated activity by advising on specified investments. Under the general prohibition, no person may carry on regulated activity in the UK unless they are authorised or exempt from authorisation. If there is a regulated activity, the Financial Services and Markets Act 2000 exempts incidental activity of members of certain Designated Professional Bodies, including members of the SRA. Under this exemption, if a solicitor provides a financial service incidentally to the provision of legal advice and does not receive compensation for this from anyone else without accounting to the client for it, the services will be exempted. Here, the firm's new department will be carrying on a specified activity (advising) in relation to specified investments (shares). They cannot rely on the Designated Professional Bodies exemption because the department is effectively a new business and the investment advice will not be incidental to the legal services provided. Thus, the firm requires authorisation to comply with the general prohibition. (A) and (D) are incorrect because, as explained above, the firm cannot rely on the Designated Professional Bodies exemption and will require authorisation. (C) and (E) are incorrect because providing advice on specified investments will be a regulated activity (unless an exclusion applies) and the financial acumen of the client is irrelevant."},{n:2,id:"CNL027",scenario:"At the last general election, the Conservative Party, who was in government, won 310 seats. The Labour Party won 250 seats. The Liberal Democrats won 50 seats. Other smaller parties won the remaining 40 seats.",q:"What would be expected to happen next?",opts:["The political parties would negotiate with each other to determine who will form the next government.","The Monarch would invite the leadership of the main political parties to a meeting and would organise the negotiations between the parties to determine who will form the next government.","The Speaker of the House of Commons would invite the leadership of the main political parties to a meeting and would organise the negotiations between the parties to determine who will form the next government.","The House of Lords would meet and vote to determine who should form the next government.","The House of Commons would meet and vote to determine who should form the next government."],ans:"A",expl:"(A) The political parties would negotiate with each other to determine who will form the next government. Under the facts, no one party has a majority of the seats in the House of Commons. This is called a 'Hung Parliament'. In this situation, the political parties would be expected to negotiate with each other to determine who could form a government. (B) and (C) are incorrect because the Monarch and Speaker of the House of Commons do not get involved in the negotiations. (D) is incorrect because the House of Lords plays no part in this process. (E) is incorrect because in the case of a Hung Parliament, the decision as to who will form the next government is reached through negotiations between the parties, not by a vote in the Commons."},{n:3,id:"DIS104",scenario:"A man was injured when his neighbour negligently cut a large branch from his tree. The branch fell and hit the man, breaking his arm and several ribs. The claim has a total value of £45,000, including a claim for personal injury valued at £20,000. The man instructs a solicitor to issue a claim.",q:"In which court should the solicitor start the proceedings?",opts:["The solicitor should commence proceedings in the High Court, Queen's Bench Division.","The solicitor should commence proceedings in the High Court, Chancery Division.","The solicitor should commence proceedings in the County Court.","The solicitor should commence proceedings in the Small Claims Court.","The solicitor should commence proceedings in a specialist court."],ans:"C",expl:"(C) The solicitor should commence proceedings in the County Court based upon the value of the claim. A case involving personal injury should not issue out of the High Court unless the value of the claim exceeds £50,000. Otherwise, it should lie with the County Court. (A) is incorrect because the value is insufficient to issue in the High Court. (B) is incorrect because the Chancery Division of the High Court does not hear claims for personal injury. A personal injury claim sits with the Queen's Bench Division. (D) is incorrect because 'small claims court' refers in fact to 'small claims track' and only applies to claims with a value of less than £10,000 and personal injury claims below £1,000. (E) is incorrect because there are no specialist courts that would be involved in the case management of a claim involving personal injury."},{n:4,id:"TRT079",scenario:"A mother died in an accident caused by the negligence of a driver. The mother was unmarried and had four children. Her two oldest children (aged 18 and 20) had left home and were no longer dependent on her. The other two children were aged 6 and 10 at the time of their mother's death and were financially dependent on her. The mother left a will in which her estate was left to her two oldest children.",q:"In respect of the claims that can be brought for the two children aged 6 and 10, which of the following statements is correct?",opts:["The children will only be entitled to recover the same damages as their mother would have recovered if she had survived.","The children will be entitled to recover the same damages as their mother would have recovered if she had survived, as well as damages for their loss of dependency on their mother and for damages for bereavement.","The children will be entitled to recover damages for their loss of dependency on their mother and damages for bereavement.","The children will be entitled to recover only damages for their loss of dependency on their mother.","The children will be entitled to recover only damages assessed as consolation for their grief on the loss of their mother."],ans:"D",expl:"(D) The children have a claim for their loss of dependency on their mother. This is their only claim. It is calculated by reference to the portion of the mother's income which she would have spent on supporting them and the likely period for which such support would have continued. (There is also a separate claim for the benefit of the mother's estate, but the two children aged 6 and 10 are not the beneficiaries of this claim because the estate was left to the two oldest children.) (A) is not correct. The two children aged 6 and 10 will rely on a new cause of action arising for their benefit as dependants. This allows them to recover their loss of dependency. It does not allow them to recover the damages which their mother would have recovered if she had survived. (B) is not correct. Of the damages listed in this choice, only the damages for loss of dependency are recoverable by the two children aged 6 and 10. (C) is not correct. The children are not entitled to recover damages for bereavement because these damages by statute are not applicable to children for the death of a parent. (E) is not correct. The children are not entitled to recover damages assessed as consolation for their grief, because bereavement damages are not available for the death of a parent."},{n:5,id:"CNL046",scenario:"Under the Ferries Act 2018, the government has the power to set the prices of certain ferry services in the UK. Pursuant to the Act, the government has passed a regulation limiting the length of boats for hire on Lake Windermere. Both Houses of Parliament have approved the regulation. Before being approved, the regulation was debated in the House of Commons for just 60 minutes, and those MPs who represent constituencies in which Lake Windermere sits were unable to take part in the debate. The companies that provide boats for hire on Lake Windermere want to challenge the validity of the regulation.",q:"On what basis could the regulation be challenged?",opts:["The regulation is ultra vires because insufficient time was allowed to debate the regulation in Parliament.","The regulation is ultra vires because it is outside the scope of the power granted to government by the Act.","The regulation is ultra vires because MPs for the constituencies where Lake Windermere is located did not take part in the debate on the regulation in the House of Commons.","The regulation cannot be challenged because the courts have no power to strike down secondary legislation.","The regulation cannot be challenged because it has been approved by both Houses of Parliament."],ans:"B",expl:"(B) The regulation could be challenged on the ground that it is outside the scope of the power granted by the Act (that is, it is ultra vires). The regulation is a piece of secondary legislation, which is legislation made under powers granted by an Act of Parliament. The power to make secondary legislation is limited by the Act of Parliament granting the power. Here, the Act gave the government authority to make regulations for the fares charged by ferry services. However, the regulation goes to the length of boats that may be hired on a specific lake. This is outside the scope of the power granted by the Act and so the regulation could be struck down on the basis that it is ultra vires. (A) and (C) are incorrect because they arrive at the correct result but for the wrong reason. The regulation is ultra vires because it exceeds the law-making authority granted by the Act, not because of the amount of time provided for debate or the fact that certain MPs were not part of the debate. In fact, the courts could not consider the parliamentary procedure by which the regulation was approved. (D) is incorrect because the courts do have the power to strike down secondary legislation which is ultra vires. (E) is incorrect because the fact that the regulation has been passed in both Houses will not prevent it from being challenged. As mentioned, the courts can strike down secondary legislation which is ultra vires."},{n:6,id:"TRT045",scenario:"A motorist, driving carelessly, knocked over a pedestrian. The pedestrian suffered a broken wrist. However, the pedestrian then acted unreasonably by refusing to have medical treatment for the injury. As a result, the pedestrian's wrist did not heal correctly, resulting in a permanent painful disability. The motorist has accepted responsibility for the initial broken wrist but denies liability for the permanent disability.",q:"In a claim by the pedestrian against the motorist to recover damages for the permanent disability, which of the following statements is correct?",opts:["The pedestrian's actions in refusing medical treatment amount to a new intervening act that breaks the chain of causation between her disability and the motorist's negligence, so the claim in respect of the disability will fail entirely.","The pedestrian's actions in refusing medical treatment amount to a new intervening act that breaks the chain of causation between her disability and the motorist's negligence, so the claim in respect of the disability will succeed but the amount of damages for the disability will be reduced.","Because, 'but for' the motorist's negligence, the pedestrian would not have been injured at all, the claim in respect of the disability will succeed in full.","The pedestrian's actions in refusing medical treatment amount to a failure to take reasonable care for her own safety, which has contributed to the harm she suffered, so the claim in respect of the disability will fail entirely.","The defence of voluntary assumption of risk will apply to the pedestrian's refusal of medical treatment, so the claim in respect of the disability will fail entirely."],ans:"A",expl:"(A) The claim will fail entirely. Where a new act has intervened between the defendant's original negligence and the claimant's final injury, the new intervening act is said to break the chain of causation so that the defendant is not liable for that injury. The new intervening act can be an act of the claimant herself. For the claimant's own actions to break the chain of causation, the claimant must have acted entirely unreasonably - which is confirmed on the facts. (B) is not correct. The pedestrian's actions do amount to a new intervening act (as discussed above). However, the effect will be to defeat the claim for the disability entirely, rather than just reducing the damages awarded for the disability. (C) is not correct. It is true that, 'but for' the motorist's negligence, the pedestrian would not have been injured at all. This explains why the motorist did accept responsibility for the initial broken wrist. However, the further permanent disability was not caused by the motorist's negligence, so the claim in respect of the disability will fail. (D) is not correct. It correctly states that the claim for the disability will fail but it does not give the correct reason. It is not correct to say that the pedestrian's actions contributed to the harm she suffered. Her actions were the sole cause of the harm she suffered, because they broke the chain of causation, as discussed above. (E) is not correct. It correctly states that the claim for the disability will fail but it does not give the correct reason. The defence of voluntary assumption of risk applies where the claimant assumed the risk of the defendant's negligence. So, it does not apply on these facts."},{n:7,id:"CNL144",scenario:"A French citizen applies to a local authority for a licence to operate a market stall. The local authority refuses to grant the licence because the applicant is French. The applicant wishes to challenge the decision of the local authority.",q:"Which of the following is most likely to be the basis of the applicant's claim?",opts:["The local authority has acted in breach of Article 14 of the European Convention on Human Rights ('ECHR') – the prohibition of discrimination.","The local authority has violated the automatic disqualification rule.","The local authority has acted contrary to a mandatory procedural requirement.","The local authority has acted ultra vires.","The local authority has acted contrary to legitimate expectations."],ans:"A",expl:"(A) Article 14 is the most likely basis of the applicant's claim. The local authority is a public authority, and so is required to act in a way that complies with the Human Rights Act 1998 and the Convention rights incorporated into UK law. This includes Article 14 – the prohibition of discrimination on various grounds, including nationality. Because the public authority denied the licence on the basis of nationality, Article 14 provides the strongest basis for a claim. (B) is incorrect because the automatic disqualification rule applies only if the decision maker has a financial interest in the matter, and here there is no indication of that. (C) is incorrect because mandatory procedural requirements are imposed by statute, and there is no statute at issue here. (D) is incorrect because, similarly, the concept of ultra vires applies when a public authority has acted contrary to an Act of Parliament, which is not at issue here. (E) is incorrect because legitimate expectations arise when a public body has given rise to a belief that a power will be exercised in a certain manner, either by an explicit promise or by previous action by the public body. The facts don't indicate either of those to be the case.",note:"The answer screen prints the ID as 'CNL 144'."},{n:8,id:"TRT066",scenario:"A worker employed in a warehouse to open packaging was provided by his employer with a sharp knife to cut the packaging. Recently, as the worker was using the knife to cut open a parcel, the tip broke off the blade and a fragment of the metal struck him in the eye, causing a severe injury. Enquiries have shown that the blade snapped because of a latent defect caused by a lack of care in the manufacturing process. The worker's employer had purchased the knives from a reputable supplier.",q:"In a claim by the worker to recover damages for his injury, which of the following is correct?",opts:["By establishing that there was a latent defect in the knife caused by the fault of the manufacturer, the worker can successfully pursue a claim in negligence against his employer, because the employer is deemed to have been negligent.","Establishing that there was a latent defect in the knife caused by the fault of the manufacturer does not enable the worker to successfully pursue a claim in negligence against his employer, because his employer was not at fault for the defect.","By purchasing the knife from a reputable supplier, the worker's employer has complied with its duty to take reasonable care to provide safe equipment and so will not be liable to the worker.","The only claim which the worker can successfully pursue would be a claim against the manufacturer, since the manufacturer's lack of care in the manufacturing process caused the defect in the knife.","Because the worker was not a party to the contract for sale of the knife, he cannot bring a successful claim against the manufacturer in respect of his injury caused by the defect in the knife."],ans:"A",expl:"(A) The worker can successfully pursue a claim in negligence against his employer. The Employer's Liability (Defective Equipment) Act 1969 ('the 1969 Act') applies where an employee is injured in the course of employment by defective equipment provided by their employer. Provided that the defect is attributable to fault on the part of some third party, the employer is also deemed to have been negligent. (B) is not correct. Although the employer could not have discovered the latent defect in the knife and so was not actually at fault, on the facts the 1969 Act applies so that the employer is deemed to have been negligent. (C) is not correct. It is true to say that the employer may have complied with its common law duty to take reasonable care to provide safe equipment. However, the 1969 Act applies so that the employer is deemed to have been negligent. (D) is not correct. The worker may be able to pursue a claim against the manufacturer of the knife, but this would not be the only claim which he could successfully pursue. He could also pursue a claim against his employer, as discussed above. (E) is not correct. It is correct that the worker was not a party to the contract for purchase of the knife. However, it is not correct to say that he could not bring a successful claim against the manufacturer in respect of his injury caused by the defect in the knife under the Consumer Protection Act 1987."},{n:9,id:"ETH052",scenario:"A solicitor has been asked to act for a family who have been involved in a road traffic accident. The father was driving when colliding with a lorry. The father and one minor daughter, aged six, were both seriously injured, despite wearing their seat belts. The father wishes the solicitor to act for him and the daughter in suing the driver of the lorry for damages. The father alleges that the lorry was over the white line in the road in his lane, and that this is what caused the collision. The lorry driver alleges that the father was overtaking on a blind corner. Until last year the solicitor used to deal with civil claims such as this, but now deals primarily with criminal law.",q:"Which of the following statements best describes how the solicitor should act in the circumstances?",opts:["The solicitor can act for the father, but not the daughter, because she is under 18.","The solicitor can act for the father, but not the daughter, because she cannot give direct instructions.","The solicitor can act for both the father and the daughter.","The solicitor can act for the father, or the daughter, but not both.","The solicitor cannot act for either of them because she now deals primarily with criminal law."],ans:"D",expl:"(D) The lorry driver is alleging conduct on the part of the father which might amount to contributory negligence. The daughter might have a claim against her father, which is a clear conflict of interest. Both (A) and (B) are incorrect. A minor is not to be denied legal representation just because they are under 18. (C) is incorrect because of the significant risk of a conflict of interest. (E) is incorrect, provided the solicitor is sufficiently up to date to deal with the case in a competent and timely manner."},{n:10,id:"ETH022",scenario:"A solicitor is acting for a client in a personal injury claim. An important witness is reluctant to give evidence because the court is located several hours from the witness's home. The solicitor promises the witness that if he gives evidence and the client's claim is successful, the solicitor will reimburse him for his travel expenses. The witness consents in writing to this arrangement, but ultimately, he does not give evidence and no payment is made.",q:"Did the solicitor breach the SRA Code of Conduct?",opts:["No, because a solicitor may offer to pay a witness's travel expenses.","No, because the witness consented in writing to the arrangement.","Yes, because the offer was dependent on the outcome of the case.","No, because the solicitor did not make any payment to the witness.","Yes, because payments to witnesses and offers of payment are always prohibited."],ans:"C",expl:"(C) A solicitor must not provide or offer to provide any benefit to a witness if the benefit is dependent upon the nature of the evidence or the outcome of the case. (A) is incorrect. Although paying a witness's legitimate travel expenses is not a breach, here the solicitor offered to make the payment if the client's claim was successful. Thus, the offer was dependent on the outcome and was a breach of the Code of Conduct. (B) is incorrect because it is immaterial that the witness agreed in writing to the arrangement. (D) is incorrect because the offer itself was a breach, even if no payment was made to the witness. (E) is incorrect because it is too broad. Such offers and payments are only prohibited if dependent upon the nature of the evidence or the outcome of the case."},{n:11,id:"DIS085",scenario:"A claimant is pursuing a case where no specific protocol applies. They are aware of their obligation to conduct their pre-action dealings with their opponent in accordance with the Practice Direction on Pre-Action Conduct and Protocols. In accordance with the direction, they have written to their opponent with concise details of the claim, and their opponent has responded with a denial of liability, providing details of why they say the claim is not accepted.",q:"What is the most appropriate next step that the parties should be considering, in line with the practice direction?",opts:["The claimant's representative should contact the defendant's representative for an initial discussion about the relative strengths of each party's case.","The defendant should consider making an application for summary judgment.","The parties should disclose key documents relevant to the issues in dispute.","The claimant should send a copy of their witness statement to the defendant setting out the evidence in support of their case.","The parties should ask the court to nominate a suitable expert to provide a report to help the parties resolve the issues in dispute."],ans:"C",expl:"(C) The parties should disclose key documents relevant to the issues in dispute. Under the practice direction, the court expects the parties to be open and transparent. As part of this, they should each be disclosing any documents which the other party will reasonably expect to have disclosed to them. (A) is incorrect because there is no requirement under the practice direction for a specific discussion between the parties to attempt to narrow issues in the case. (B) is incorrect because it is too early for an application for summary judgment. A defendant cannot make an application for summary judgment until the claimant has served the Particulars of Claim and the defendant has served the acknowledgment or defence. (D) is incorrect because the claimant is not required to provide their witness statement to the proposed defendant at this stage in the claim. (E) is incorrect because it is up to the parties to agree the identity of an expert. The court will become involved only if a single joint expert were instructed and the parties are unable to agree on whom to instruct."},{n:12,id:"DIS019",scenario:"A shareholder in a small company has a dispute with the company's managing director regarding share allocation. The shareholder contends that there was an agreement to create additional shares in the company for allocation to the shareholder. The managing director denies the existence of this agreement. The shareholder makes a pre-action request for the parties to engage in alternative dispute resolution ('ADR'), which the managing director rejects out of hand. The managing director believes the gulf between their respective positions is too great for ADR to have any reasonable prospects of success. The shareholder decides to litigate, but their claim is unsuccessful.",q:"Which of the following states the legal position with respect to the managing director's refusal to engage in ADR?",opts:["Although the managing director was under a duty to participate in ADR, because they won, the issue has been rendered moot and they cannot be penalised by the court.","Although the managing director was not under a duty to participate in ADR, they were under a duty to set out their reasons. Having failed to do so, the court has discretion to penalise them with respect to legal costs.","Although the managing director was under a duty to consider ADR, they cannot be penalised with respect to costs as they won the case.","The managing director was under no duty to participate in ADR because they believed the prospects for success were low. Therefore, the court cannot penalise them.","Because the parties' disputed whether or not an agreement exists, ADR was inappropriate in this case. Therefore, the managing director cannot be penalised with respect to costs."],ans:"B",expl:"(B) Although ADR is voluntary, it is encouraged. If one party requests ADR, the other party must state reasons for refusing. If they fail to do so (or if the court later finds the reasons to be unreasonable), the court has discretion to penalise the refusing party with respect to costs. (A) is incorrect in that participation in ADR is not required, although a party who refuses to participate without a valid reason can be penalised even if they ultimately win the lawsuit. (C) is incorrect for the same reason (that is, a party who refuses to participate without a valid reason can be penalised even if they ultimately win). (D) is incorrect because the mere belief that ADR is inappropriate would not insulate the managing director from penalty; they had to set out (reasonable) reasons. (E) is incorrect because the fact that parties dispute even crucial facts is not itself a valid reason for refusing to consider ADR."},{n:13,id:"TRT014",scenario:"A man owns a drone which he flies by remote control. On one occasion last month he deliberately flew the drone over the garden of his neighbour, skimming it just above his neighbour's head. The drone caused no damage or injury of any kind. The drone carried a camera, but it was switched off, so no photographs were taken.",q:"If the neighbour pursues a claim in tort against the man who flew the drone, which of the following statements is correct?",opts:["The neighbour's claim should be for interference with privacy.","The man would have a defence to any claim in respect to the drone because the drone did not cause any damage.","The neighbour's claim should be for nuisance.","The neighbour's claim should be for trespass to land.","Flying a drone does not give rise to an established duty of care, and it would not be fair, just, and reasonable to impose a duty of care in this novel situation."],ans:"D",expl:"(D) The neighbour's claim should be for trespass to land. By flying the drone into the neighbour's air space, the man has committed the tort of trespass to land. Land includes the airspace above, up to the height necessary for ordinary use of the land. The drone flew just above the neighbour's head, so this is satisfied. Entry of the drone into the air space was intentional and direct, as is required for trespass. Trespass is actionable per se, so it does not matter that the drone did not cause any damage. (A) is not correct. There is no specific tort of interference with privacy. There is a tort of misuse of private information, but this is not applicable on the facts (the man did not acquire or use any information, as the camera was turned off). (B) is not correct. There could be a claim in trespass to land which is actionable per se, as discussed above. So, it would not be a defence to this claim that no damage was caused by the drone. (C) is not correct. The tort of nuisance does deal with interference with the use and enjoyment of land. However, it involves indirect interference and requires a continuing state of affairs, and the drone was flown over the land on one occasion only. (E) is not correct. An argument about duty of care would only be relevant in response to a claim in negligence. In this case, the claim in respect of the drone would be in trespass to land."},{n:14,id:"DIS057",scenario:"A restaurant is making a breach of contract claim against the supplier of its professional oven. The limitation period is about to expire, and the restaurant is seeking advice about when time stops running for limitation purposes.",q:"Which of the following is correct?",opts:["The limitation period stops on the date the claim form is sent to the court for issue.","The limitation period stops on the date the court issues the claim form.","The limitation period stops on the date of service of the claim form.","The limitation period stops on the date of deemed service of the claim form.","The limitation period stops on the date of deemed service of the Particulars of Claim if served separately from the claim form."],ans:"B",expl:"(B) The time for limitations purposes stops running when the claim form is issued by the court. (A) is incorrect because the court must actually issue the claim form for running of the limitation period to stop. (C) is incorrect. The limitation period stops before the claim form is actually served. (D) and (E) are not relevant for limitation purposes but govern when the defendant must respond to the proceedings."},{n:15,id:"CTR043",scenario:"A ship builder entered into a contract to build a cruise ship for a customer. They agreed to a price of £2,000,000. Shortly after the contract was signed, the pound was devalued significantly so the ship builder demanded an extra £200,000 to complete the build or they would terminate the contract. The customer did not want to pay the extra money, but they paid it because the ship builder threatened to terminate the contract, and because they already had a lucrative contract in place for the cruise ship. Two years later the customer now wants to recover the extra £200,000.",q:"Will they be able to?",opts:["No. The customer has affirmed the contract by paying the money and taking no other action to avoid the contract.","No. Because of the currency devaluation the ship builder was entitled to request more money.","No. Both parties had provided additional consideration to support the promise to pay more money, as the customer was receiving a benefit because delivery of the ship would enable performance of their other contract.","Yes. The contract is void due to the economic duress of the ship builder.","Yes. Illegitimate pressure was applied by the ship builder so the customer can recover the extra money."],ans:"A",expl:"(A) Even though this appears to be a case of economic duress, by paying the money and also waiting two years to bring a claim, it is likely that the courts would find that the customer had affirmed the contract. (B) is incorrect because the price agreed was a term of the contract, and there is nothing in the scenario to suggest there was any clause that allowed a price adjustment for currency fluctuations. In the absence of such a clause, the ship builder would be expected to take the hit on the devaluation of the pound. While it is true that the customer's ability to comply with the terms of its other contract could be seen as consideration to support the promise to pay more money, it is clear from the facts of the scenario that the additional money was obtained under duress, therefore (C) is incorrect. (D) is incorrect because duress renders a contract voidable at the option of the party subject to the duress, not void. (E) is incorrect because, whilst in this scenario there appears to have been illegitimate pressure, which is required to bring a claim for duress, the fact that the customer paid the money and then waited to bring a claim makes (A) the better answer because the customer is likely to be held to have affirmed the contract."},{n:16,id:"ELS051",scenario:"A law professor was asked to speak to junior lawyers at a firm about drafting legal arguments and how best to apply case law. The topic was primarily focussed on judgements and the weight that obiter dicta and ratio decidendi carry.",q:"Which of the following best states the legal position?",opts:["Ratio decidendi and obiter dicta are terms relating to parts of a case and both create binding precedent.","Obiter dicta is a court statement explaining the basis of the court's decision and only obiter dicta creates binding precedent.","Ratio decidendi is a court statement explaining the basis of the court's decision but it does not create binding precedent.","Obiter dicta is a court statement of a legal principle that forms part of the binding precedent established by the case.","Obiter dicta is a court statement regarding a matter not necessary to the court's decision and so the statement does not create binding precedent."],ans:"E",expl:`(E) Obiter dicta (also known simply as obiter) is a term used to describe statements a court makes that are not necessary to the court's decision; essentially, they are said "by the way". Therefore, obiter remarks do not have a binding precedential effect, although it may be used as persuasive authority. The choices suggesting that the obiter forms binding precedent (choices (A), (B), and (D)) are, therefore, incorrect. (C) is incorrect because ratio decidendi (also known simply as ratio) is a term used to describe court statements that are essential to the court's decision; that is, statements directly related to the legal reasoning upon which a decision is based. Ratio has a binding precedential effect.`},{n:17,id:"TRT116",scenario:"A student lives with his parents in a house which they own. A company has opened a music venue in an old warehouse nearby. Everyone in the area is complaining about the noise, which carries on late into the night. The student has suffered from this in the same way as everyone else and would like to do something about it. He is considering bringing an action in tort against the company to seek an injunction.",q:"When considering an action in tort by the student against the company, which of the following is correct?",opts:["The student could pursue successful claims in both public nuisance and private nuisance.","The student could pursue a successful claim in public nuisance but not in private nuisance.","The student could pursue a successful claim in private nuisance but not in public nuisance.","The student is more likely to have a successful claim in the tort of negligence than in nuisance.","The student is unlikely to have a successful claim leading to the grant of an injunction."],ans:"E",expl:"(E) The student is unlikely to be successful. The student could not pursue a successful claim in public nuisance because, although the noise appears to have affected a class of the public, he has not suffered particular damage over and above that suffered by the class in general. He cannot pursue a successful claim in private nuisance because he does not have a proprietary interest in the land affected by the noise (the house owned by his parents). Therefore, he is unlikely to have a successful claim leading to the grant of an injunction and (A) is not correct. (B) is not correct because the student cannot pursue a successful claim in public nuisance, as explained above. (C) is not correct because the student cannot pursue a successful claim in private nuisance since he does not have an interest in the land, as indicated above. (D) is not correct. The student cannot make a successful claim in the tort of negligence because intangible damage, such as interference with amenity caused by noise, does not amount to actionable damage in negligence."},{n:18,id:"CNL042",scenario:"The House of Commons is debating a bill. Some of its provisions apply only to England.",q:"Which of the following best explains the legislative process for these provisions?",opts:["The legislative process is changed by adding an extra stage at which MPs representing English constituencies vote on the provisions that apply only to England.","The legislative process is changed so that MPs representing Scottish constituencies have no role in voting on the bill.","The legislative process is changed so that the entire bill is debated only by MPs representing English constituencies.","The legislative process does not change from the legislative process for any other bill.","The legislative process is changed so that the Speaker of the House of Commons has the power to accept or reject the provisions that apply only to England."],ans:"D",expl:"(D) The legislative process does not change from the legislative process for any other bill. Although some of the Bill's provisions apply only to England, MPs representing any of the UK constituencies can vote on those provisions. (A) is incorrect because it refers to the former stage in the Commons' legislative process known as English Votes for English Laws, which has been abolished. (B) is incorrect because any MP can vote on the England-only provisions. (C) is incorrect because, as indicated, the legislative process is the same as any other bill. The fact that some provisions of the Bill apply only to England does not affect the process. (E) is incorrect because no such procedure exists."},{n:19,id:"CNL171",scenario:"A man committed a serious offence when he was age 15. At the time, the man was living in a state which had signed the European Convention on Human Rights ('ECHR'). The man served a sentence of 10 years and was released. Two years later, the state decided to deport the man back to his home country. The man argued that this would be in breach of his right to family life as all his family now live in the state. He has had an unblemished record since his first offence, and he has a job. The state argued that the seriousness of the crime means that the young man remains a danger to the public. The young man was unsuccessful in the highest court of the state. He brings his case to the European Court of Human Rights ('ECtHR').",q:"Which of the following statements represents the man's best argument to convince the ECtHR that he should be allowed to stay?",opts:["That deporting him is not reasonable and does not support a reasonable aim, and that there are more reasonable ways of achieving the same aim.","That deporting him is not fair and does not support a fair aim, and that there are fairer ways of achieving the same aim.","That deporting him is not an effective way of achieving the state's aim and there are more restrictive ways of achieving the same aim.","That deporting him does not rationally support the state's aim and there are more restrictive ways of achieving the same aim.","That deporting him does not rationally support the state's aim, and there are less onerous ways of achieving the same aim."],ans:"E",expl:`(E) The man's best argument is that deporting him does not rationally support the state's aim and there are less onerous ways of achieving that aim. The man claims that his deportation would violate his right to family life, which is a qualified right. Interference with qualified rights must be proportional. This choice properly describes the proportionality test. (A) and (B) are incorrect because those choices reference reasonableness and fairness, respectively, which are not terms used in the proportionality test. (C) and (D) are incorrect because they reference "more" restrictive means rather than less restrictive means.`},{n:20,id:"TRT071",scenario:"A scouting association appointed a new volunteer scout leader, after ensuring that she had the required qualifications and experience. The association entrusted the leader with the task of taking a group of young adults on an overnight camping trip. Due to the leader's carelessness in failing to inspect the camp area, the group set up their tents perilously close to an unmarked ravine. During the night, one of the scouts fell into the ravine and was injured. The injured woman brings an action for negligence against the scouting association.",q:"Can the scouting association be liable for the negligent actions of the scout leader?",opts:["Yes, because the scouting association could be vicariously liable for the actions of the scout leader if there is a relationship akin to employment.","No, because the scout leader is a volunteer and she is not employed by the scouting association.","Yes, because the scouting association is responsible for using reasonable care in selecting scout leaders.","No, because the scouting association has no duty of care towards the injured woman.","Yes, because the scouting association appointed the scout leader and the scout leader is therefore employed by it."],ans:"A",expl:"(A) The scouting association can be liable. Although the scout leader is a volunteer and therefore not employed by the scouting association, the claimant may be able to establish a relationship akin to employment sufficient to give rise to vicarious liability on the part of the scouting association. The court may find that such relationship exists because the scout leader's tort (negligence) was committed as a result of an activity undertaken on behalf of the association, the scout leader's activity was an integral part of the association's activities, and the association created the risk of the scout leader's tort by assigning leadership of the camping trip to her. (B) is incorrect in a case such as this where a relationship akin to employment is created. (C) is incorrect. It is true that the scouting association may itself owe a duty to use reasonable care in selecting scout leaders. However, on the facts, this duty has been complied with because the association made certain that the leader had the required qualifications and experience. (D) is incorrect. The scouting association may be vicariously liable, as explained above. Also, it is not correct to say that the scouting association did not itself owe a duty of care to the injured woman. It is likely to have owed her a duty to use reasonable care in selection of the scout leader (which, on the facts, it did). (E) is incorrect because the scout leader is a volunteer. The fact that she was appointed by the scouting association is not sufficient to make her an employee of the association."},{n:21,id:"ELS068",scenario:"A newly qualified solicitor has a cousin who would like to hire the solicitor to try a Multi-Track case in the High Court. The cousin is keen to hire the solicitor because the solicitor is very familiar with the complex business matters involved in the case.",q:"Can the solicitor try the case in High Court for her client?",opts:["Yes, because solicitors have an automatic right to appear before the High Court upon qualification as a solicitor.","No, because a solicitor has a right to appear before the High Court only after representing clients in lower courts for five years.","No, because a solicitor may not appear before the High Court until they have completed additional advocacy assessments and apply for higher rights of audience with the Solicitors Regulation Authority.","Yes, because the solicitor is familiar with the complex business dealings involved in the case.","No, because a solicitor may not appear in High Court unless they also qualify as a barrister."],ans:"C",expl:"(C) A solicitor has no right of audience before the High Court unless they complete additional advocacy assessments and apply for a higher rights of audience with the Solicitors Regulation Authority ('SRA'). (A) is incorrect because there is no automatic right to appear (that is, a right of audience) before the High Court. (B) is incorrect as the experience of a solicitor is not important; only a solicitor that has obtained higher rights of audience can represent someone at the Crown Court. (D) is incorrect because the solicitor's familiarity with the case is not relevant to obtaining a right of audience. (E) is incorrect as a solicitor may apply for higher rights of audience; they need not seek separate qualification as a barrister.",note:"Source slip: the explanation for (B) refers to the Crown Court, although the question concerns the High Court. The original wording is kept."},{n:22,id:"ETH065",scenario:"An employee of a chemical manufacturing company has approached a solicitor, asking her to act for him in a personal injury claim involving a chemical spillage at the company. Until two years ago, other solicitors at the firm acted for the same company, advising on a variety of issues, including employment, environmental, and financial issues. The company ended its retainer when it decided to appoint different solicitors as legal advisers.",q:"Which of the following best describes how the solicitor should proceed in the circumstances?",opts:["Act for the employee, because the solicitor has easy access to information about the company's processes.","Refuse to act for the employee, but contact the company and offer to act for it in the case.","Act for the employee, because different solicitors at the firm acted for the company.","Act for the employee, because the company ended its retainer two years ago.","Act for the employee, provided appropriate safeguards are in place regarding confidential information."],ans:"E",expl:"(E) The fact that the company is a former client does not end the duty of confidentiality. There may well be confidential information, for instance, in relation to environmental matters. (D) is therefore incorrect. The firm cannot act where it holds confidential information material to the employee's case, unless either (1) measures are taken to ensure there is no real risk of disclosure, or (2) the former client consents. (A) is incorrect because the information is confidential to the company. (B) is incorrect because it is improper to contact another solicitor's client in such circumstances. (C) is incorrect because the entire firm owes a duty of confidentiality to the company. Therefore, if it holds confidential information that is material to the matter, it cannot act for the employee unless safeguards are in place or the company consents."},{n:23,id:"CNL114",scenario:"A man has been sacked from his employment at a company on the grounds that his disability means that he cannot complete the tasks that his job required.",q:"Which of the following best explains why the man cannot make an application for judicial review against the Company?",opts:["The law has not been breached.","The claim is not a claim of last resort.","The claim involves an issue that is purely hypothetical.","The claim involves an issue that is not a justiciable matter.","The Company is not a public body."],ans:"E",expl:"(E) The man cannot make an application for judicial review because the Company is not a public body. Judicial review is available only against public law bodies, and companies are not public law bodies. Examples of public law bodies include government departments, local authorities, and agencies created by statute. (A), (C), and (D) are incorrect because there is a live, legal dispute between the man and the Company. (B) is incorrect. This choice refers to the fact that judicial proceedings may be brought only if they are the last resort. However, for the reasons discussed, the most appropriate way to resolve this legal dispute is via a tribunal and not judicial review. Since (B) assumes that judicial review proceedings can be brought in the first place, it is not the best answer."},{n:24,id:"LGS105",scenario:`A solicitor is acting for a client in relation to the purchase of a substantial shareholding in a company. The transaction is progressing well but the client is due to go on holiday and will be out of contact for a few days. The client gives the solicitor authority to sign any necessary documents on the client's behalf in his absence. The solicitor duly signs the share purchase contract. Neither the solicitor nor her firm is authorised by the Financial Conduct Authority to carry on a "regulated activity" as defined in the Financial Services and Markets Act 2000 ('FSMA') and related secondary legislation.`,q:"Which of the following best describes the activity specified in the Financial Services and Markets Act 2000 (Regulated Activities) Order 2001, which the solicitor carried out in signing the share purchase contract?",opts:["Advising","Arranging","Dealing as Agent","Managing","Safeguarding"],ans:"C",expl:"(C) Under the general prohibition of FSMA, a solicitor may not carry on regulated activity in the UK unless they are authorised or exempt from authorisation. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. The specified activities might be remembered with the mnemonic device 'ADAMS'. Activities = Advising, Dealing as an agent, Arranging, Managing, and Safeguarding. Dealing as agent is buying, selling, subscribing for, or underwriting investments as agent for a client. Here, the solicitor contracted for the purchase of the shares as agent on the client's behalf, which is the specified activity of dealing as agent. (A) is incorrect because, in signing the share purchase agreement, the solicitor was not advising, that is, giving advice to the client which the client would then act upon. (B) is incorrect because the solicitor was not making arrangements, that is, arranging for another person to buy, sell, subscribe for, or underwrite a particular investment. As explained above, in signing the share purchase agreement, the solicitor contracted for the purchase of the shares herself on behalf of the client. (D) is incorrect because the solicitor was not managing, that is, managing assets belonging to another person in circumstances which involve the exercise of discretion. The solicitor was not exercising discretion as to which shares to buy, but rather implementing an agreed share purchase transaction. (E) is incorrect because the solicitor was not safeguarding, that is, administering or safeguarding (looking after) the shares. This specified activity is more relevant to probate and trust work."},{n:25,id:"CTR045",scenario:"A husband runs a printing business. His wife asks him to print a number of brochures for her pet grooming business. The husband agrees to print the brochures for £100. After the brochures have been printed, the wife refuses to pay.",q:"What is the position under contract law?",opts:["The wife has no legal obligation to pay. As they are married, this constitutes a domestic and social arrangement where there is a presumption that the parties do not intend to be legally bound.","The wife has a legal obligation to pay. As they are married, this constitutes a domestic and social arrangement where there is a presumption that the parties intend to be legally bound.","The wife has a legal obligation to pay. Even though they are married, they both were acting in a commercial context.","The wife has no legal obligation to pay as she agreed to do so before the brochures were printed, so there is no consideration for the parties' promises.","The wife has a legal obligation to pay her husband for any costs incurred in the printing so he is not out of pocket, but nothing more."],ans:"C",expl:"(C) Even though the parties are husband and wife, and there is a presumption that they do not intend to be legally bound, that presumption would be rebutted by the fact that they are both acting in a business capacity. (A) is therefore incorrect for the same reason. Whilst marriage raises a presumption that there is no legal intent, it can be rebutted by evidence to the contrary, as in this scenario. (B) is incorrect because in a domestic and social arrangement there is no presumption that the parties intended to be legally bound. That is the position in a commercial context. (D) is incorrect because the timing of the wife's agreement is irrelevant. The promise to pay was consideration for both promises and is executory (a promise to do something in the future). (E) is incorrect because in this context the law does not distinguish between costs incurred and the contractual obligation to pay. Either the wife is legally obliged to pay or she is not, and in this case it would appear that she is."},{n:26,id:"LGS042",scenario:"A firm of solicitors has a late shift, from 6pm to midnight, to meet the demands of overseas clients. To attract employees to work these shifts, the firm offers a nightly bonus of £100. The majority of employees who work the late shift are men because the majority of female employees were reluctant to be leaving the office late at night.",q:"Which of the following statements best describes whether the firm can justify this policy under the Equality Act 2010?",opts:["The policy is direct sex discrimination and cannot be justified.","The policy is indirect sex discrimination but could be justified because offering a bonus is a proportionate means of achieving the legitimate aim of covering the late shift.","The policy is direct discrimination but could be justified because offering a bonus is a proportionate means of achieving the legitimate aim of covering the late shift.","The policy is indirect sex discrimination and could not be justified because offering a bonus is not a proportionate means of achieving the legitimate aim of covering the late shift.","The policy is indirect sex discrimination but could be justified because offering a bonus is a reasonable means of achieving the genuine aim of covering the late shift."],ans:"B",expl:"(B) The firm's policy is an example of indirect discrimination on the grounds of the protected characteristic of sex but could be justified. Indirect discrimination is when a policy or provision is apparently neutral but on closer examination puts individuals with a protected characteristic at a disadvantage compared with individuals who do not have that characteristic. The firm's policy is apparently neutral in that all employees who work the late shift get the bonus. However, the policy puts female employees at a disadvantage as the majority of the employees working the late shift who are eligible for the bonus are male. Indirect discrimination can be justified if the firm uses a proportionate means to achieve a legitimate aim. Here, it is a legitimate aim to have employees cover the late shift to meet client demands and paying a bonus to incentivize employees to work unsociable hours is a proportionate means of achieving that aim. (A) is incorrect because, as explained above, the policy is indirectly, not directly, discriminatory. The bonus is not expressed as payable only to male employees. (C) is incorrect because this is indirect discrimination and, in any event, direct discrimination on the grounds of sex cannot be justified. (D) is incorrect because, as explained above, offering a bonus to employees working the late shift is a proportionate means of achieving a legitimate aim. (E) is incorrect because while this is indirect discrimination, to justify it, the firm must show the policy is a proportionate means of achieving a legitimate aim."},{n:27,id:"DIS047",scenario:"A boat owner decides to take his boat out to sea on an inclement day. When returning into the harbour, the boat owner loses control and his boat collides with another boat, damaging it. The boat owner refuses to pay for the damages, claiming that the accident was not his fault but rather was attributable entirely to the inclement weather. Consequently, the claimant issues proceedings for the cost of repairs to his boat. The defendant files a defence maintaining the denial of liability. The claimant now wishes to make an application for summary judgment.",q:"What must the claimant prove to be successful in the application for summary judgment?",opts:["The claimant must prove that the defendant has been unreasonable.","The claimant must prove that he has given the defendant the opportunity to resolve the claim and that they have complied with the spirit of the Practice Direction on Pre-Action Conduct and Protocols.","The claimant must prove that the defendant has no real prospect of successfully defending the claim and that there is no other compelling reason why the claim should be disposed of at trial.","The claimant must prove that the level of cost that they are claiming for repair to their property is reasonable and competitive.","The claimant must prove that the defendant is in a position to pay any judgment awarded."],ans:"C",expl:"(C) To succeed on the application, the claimant must prove that the defendant cannot realistically defend this action and that there is no other compelling reason why the claim should be disposed of at trial. If the defendant is able to establish that there is a viable argument, then the application must fail. (A) is incorrect because proving that the defendant acted unreasonably is not a requirement or consideration for this application. It is the prospects of success that are important. (B) is incorrect because, whilst important to abide by the spirit of Practice Directions on Pre-Action Conduct and Protocols at all times, it is not a determining factor on an application for summary judgment. (D) is incorrect because proving that the costs claimed are reasonable is a separate issue to the summary judgment argument. If the court finds that the defendant has no realistic defence to the claim, the defendant is still entitled to argue that the amount claimed is excessive. (E) is incorrect because the defendant's ability to pay the judgment is not a relevant consideration in determining whether judgment should be granted."},{n:28,id:"TRT093",scenario:"[…] employees have caught a youth entering the gym without permission to use the fitness equipment. They warned him against entering without paying, but he did it again the following week. He began to use one of the fitness machines which then collapsed onto him, causing him a serious injury and smashing his expensive mobile phone. The evidence later showed that the machine had a worn safety bolt. The company running the gym had been aware of this serious and dangerous defect but had not found time to have it repaired.",q:"In a claim by the youth against the company for damages for his personal injury and property loss, which of the following statements is correct?",opts:["The youth is not likely to have any successful claim against the company because he entered the premises and used the machine without permission, so the company did not owe him a duty of care.","The youth is not likely to have any successful claim against the company because, while the company owed a duty of care to the youth, it was not in breach of that duty.","The youth is not likely to have any successful claim against the company because, while the company owed a duty of care to the youth to take reasonable care to see that he does not suffer injury to his person, it was not in breach of that duty, and because it did not owe him a duty of care as to his property.","The youth is likely to have a successful claim against the company for all of his damages because the company breached its duty to take reasonable care to see that he does not suffer injury to his person or property.","The youth is likely to have a successful claim against the company for his personal injury, but not for his mobile phone, because the company breached its duty to take reasonable care to see that he does not suffer death or personal injury."],ans:"E",expl:"(E) The youth can recover damages for his personal injury but not for his mobile phone. The youth suffered an injury caused by the state of the premises (the defective fitness machine). The company is the occupier of the premises. The youth is not a lawful visitor; he entered the premises as a trespasser. In these circumstances, the duty owed is governed by the Occupiers' Liability Act 1984. An occupier owes a duty to a trespasser provided the following are satisfied: the occupier is aware of the danger (the company knew of the defect); the company was aware that a trespasser may come into the vicinity (it was aware of the youth's previous trespasses); and it would be reasonable to expect the occupier to offer protection (the defect was serious and dangerous). The duty is to take reasonable care to see that the trespasser does not suffer personal injury. The duty does not cover damage to property. On the facts, the duty appears to have been breached because the occupier was aware of the dangerous defect in the machine but had not found time to have it repaired. Causation of damage is also satisfied. Therefore, the youth should have a claim in respect of his personal injury but not for the damage to his mobile phone. (A) is not correct because the company did owe the youth a duty to take reasonable care to see that he does not suffer injury to his person. (B) is not correct. The company does appear to be in breach of the duty owed to the youth, as discussed above. (C) is not correct in two respects. First, the youth is […] not likely to have a successful claim in respect of his mobile phone because he was a trespasser. Second, the company did breach its duty as to the youth's personal injury, as discussed above. (D) is not correct. The company's duty to see that the youth does not suffer injury applies only to personal injury, not to property damage.",note:`The first line of the facts is cut off at the top of the question screen, so the opening words are missing (shown as […]); the facts imply the company runs a gym. The question screen also lists the options out of order in the scan; they are shown here in A–E order as on the page image. ${Mp} The right-hand edge of one line of the explanation is cut off (shown as […]).`},{n:29,id:"ELS062",scenario:"A solicitor is explaining to their client that the judge has considered the Hansard to aid in interpretation of legislation involved in the client's case.",q:"What type of aid to interpretation has the judge used?",opts:["A language aid.","An extrinsic aid.","An intrinsic aid.","A jurisdictional aid.","A presumptive aid."],ans:"B",expl:"(B) The Hansard is the official record of debates that took place when the Act was considered in Parliament. It gives insight into what the politicians in Parliament were thinking when they passed the Act. It is not part of the Act and so is an extrinsic aid to interpretation. (A) is incorrect. Language aids are rules for interpreting the language used in a law, such as expressio unius est exclusio alterius (roughly, 'expression of one thing is the exclusion of another') or noscitur a sociis (a word is interpreted by the company it keeps). (C) is incorrect as the term 'intrinsic aid' refers to things within the legislation itself, such as its long or short title, or even punctuation within the legislation. (D) is incorrect as no such aid to interpretation exists. Jurisdiction refers to the power of a court to hear a case. (E) is incorrect. Like (D), there is no such term in common use. However, presumptions (basically, unwritten rules that are widely observed) can be used when interpreting legislation, such as the presumption that statutes usually do not intend to alter the common law or that an ambiguity should be interpreted in favour of a defendant."},{n:30,id:"CTR109",scenario:`A seller offers to sell goods to a buyer. The seller sends the buyer its standard terms and conditions of business, expressly drawing the buyer's attention to them. They exclude liability for late delivery. They also include the following clause 9: "These terms and conditions will prevail over any terms which the buyer seeks to introduce." The buyer replies to the seller, sending its own terms and conditions of business and saying that these will apply if a contract is concluded. These terms and conditions do not include any exclusion of liability for late delivery. The seller delivers the goods late.`,q:"Does the seller's exclusion of liability for late delivery form part of the contract?",opts:["No, the parties have not agreed on the terms governing the contract, so the seller's exclusion of liability is not part of the contract.","No, clause 9 is an entire agreement clause. It is not effective, so the seller's exclusion of liability is not part of the contract.","No, clause 9 is a prevail clause. However, the contract has been formed on the basis of the buyer's terms and conditions so the seller's exclusion of liability is not part of the contract.","Yes, clause 9 is a prevail clause. It will prevent the buyer from relying on its own terms and conditions, so the seller's exclusion of liability is part of the contract.","Yes, the seller has not accepted the buyer's terms and conditions, so the seller's terms and conditions remain in place and its exclusion of liability is part of the contract."],ans:"C",expl:"(C) If an offeree seeks to change the terms of an offer in response to the offer, the response is not an acceptance but rather a counteroffer, which the original offeror may accept or reject. Here, the buyer's reply to the seller provided its terms would control rather than the seller's terms. Therefore, the reply was a counteroffer, rejecting the seller's offer (including clause 9, the seller's prevail clause) and offering to enter into the contract on the basis of its own standard terms and conditions of business. The seller accepted the counteroffer by delivering the goods. The contract was therefore governed by the buyer's standard terms and conditions, and these do not include the exclusion of liability. This situation is known as a battle of forms situation, and in a battle of forms, the last shot generally prevails. (A) is incorrect because by delivering the goods, the seller is deemed to have agreed on the buyer's terms. (B) is incorrect because clause 9 is a prevail clause (that is, a clause that purports to dictate which form - offer or acceptance - will prevail), not an entire agreement clause. An entire agreement clause is a clause that provides the written contract constitutes the entire agreement between the parties. Such a clause can be effective, but its purpose is to uphold the parol evidence rule. (D) is incorrect because the seller's prevail clause does not form part of the contract. The buyer rejected it (and the rest of the seller's standard terms and conditions) by making its counteroffer. (E) is incorrect because the seller's terms and conditions do not remain in place. They have been rejected by the buyer's counteroffer."},{n:31,id:"CNL028",scenario:"Parliament has granted powers to the Secretary of State to decide applications for loans provided by the government to small businesses. A small business has applied for a loan but is concerned that given the large number of applications, the Secretary of State will take a long time to decide their application.",q:"Who can decide the applications for the loans?",opts:["The applications must be decided by civil servants, but they need to be approved by the Secretary of State before the decision is final.","The applications must be decided personally by the Secretary of State.","The applications could be decided by civil servants on behalf of the Secretary of State.","The applications could be decided by the Secretary of State after consulting the Prime Minister.","The applications must be decided by the Secretary of State but need to be approved by the Monarch before the decision is final."],ans:"C",expl:"(C) The applications could be decided by civil servants on behalf of the Secretary of State. Under the Carltona doctrine, Parliament grants powers to the Secretary of State with the understanding that those powers could be exercised by civil servants on behalf of the Secretary of State. Given the number of decisions that government departments make, the Secretary of State is unlikely to be involved with the vast majority of decisions. Thus, (B) is incorrect. (A) is incorrect both because the Secretary of State theoretically could decide the applications, and because under the Carltona doctrine, decisions of civil servants need not be approved by the Secretary of State. (B) is incorrect because, as discussed, civil servants acting under the Secretary of State could decide the applications. (D) is incorrect because the Prime Minister would not be consulted. (E) is incorrect both because the applications can be decided by civil servants rather than the Secretary of State and because the decisions need not be approved by the Monarch."},{n:32,id:"CTR049",scenario:"A woman goes into a shop and purchases an electric toothbrush. On returning home she discovers that the brush head is missing and she is therefore unable to use it to clean her teeth. She returns to the shop the next day to obtain a refund, and is told that there is nothing they can do, as she should have checked the product before purchasing it and leaving the shop.",q:"Does the woman have any recourse against the shop?",opts:["Yes. There is an implied term in her contract with the shop that the goods should be of satisfactory quality.","Yes. The shop should have a standard returns policy for the return of goods within 14 days.","No. There was nothing in the contract between the woman and the shop that mentioned the requirement that the brush head be included.","No. The woman should have raised the issue before concluding the contract and leaving the shop; she is now too late.","No. The lack of brush head was a defect that would have been obvious to the woman if she had inspected the toothbrush before leaving the shop."],ans:"A",expl:"(A) The Consumer Rights Act 2015 ('CRA') implies terms into contracts for the sale of goods between a consumer and a retailer that, amongst other things, the goods are of statutory quality (which means that they must be fit for the purpose for which they are usually supplied - here, cleaning teeth). Therefore (A) is correct. Many retail stores have policies allowing the return of unwanted or defective goods within a particular timescale, but they are under no legal obligation to do so, so (B) is incorrect. (C) is incorrect because it is an implied term of the contract that the toothbrush should be of satisfactory quality pursuant to the CRA, and this includes fitness for its usual purpose: cleaning teeth. Therefore it is reasonable to assume that the brush head was included within the box. (D) is incorrect because the limitation period for bringing a contractual dispute is six years, and there is no legal reason why the woman should have brought up, or even known about, the issue before the contract was concluded or leaving the shop. It was reasonable for her to assume that the product was complete. When she discovered that it was not, she had rights of recourse against the retailer. There are exceptions under the CRA if defects have been brought to the buyer's attention or as regards any defects that would have been obvious had the buyer inspected the product prior to the sale. However, it is reasonable to assume that the toothbrush came in a sealed box, and therefore the woman would not have had the opportunity to inspect it before she got home. Therefore (E) is incorrect.",note:'Source slip: the opening of the explanation says "statutory quality" where the option and the rest of the explanation refer to "satisfactory quality". The original wording is kept.'},{n:33,id:"CNL164",scenario:"Recently, an American lawyer retained a client who trades with businesses in Wales. The client is concerned over the fact that the Welsh Parliament has passed an Act that amends certain retained EU law. The UK government has not passed any regulations barring the Welsh Parliament from modifying this particular retained EU law. Moreover, the retained EU law concerns a matter falling within the Welsh Parliament's legislative competence.",q:"Which of the following best explains the legal position?",opts:["The Act is valid because the Welsh Parliament is not bound to comply with this retained EU law.","The Act is not valid because the Welsh Parliament is bound to comply with this retained EU law.","The Act is not valid because it has not been approved by the Supreme Court.","The Act is valid because it has been approved by the UK Parliament.","The Act is valid because the devolved legislatures may legislate contrary to any retained EU law."],ans:"A",expl:"(A) The Act is valid because the Welsh Parliament is not bound to comply with this retained EU law. With the end of the transition period (in December 2020), the devolved legislatures are now free to legislate contrary to retained EU law falling within their legislative competence, unless excepted by regulations passed by the UK government under the European Union (Withdrawal) Act 2018. Because the UK government has not passed any such regulations, and this retained EU law falls within the Welsh Parliament's legislative competence, the Welsh Parliament was free here to legislate contrary to the retained EU law. (B) is incorrect because legislation passed by the Welsh Parliament after the end of the transition period does not need to comply with this retained EU law. (C) and (D) are incorrect because those procedures do not exist. (E) is incorrect because it is too broad. The devolved legislatures may legislate contrary to retained EU law, assuming the retained EU law is within the devolved institutions' legislative competence and is not excepted by regulations passed by the UK government."},{n:34,id:"ELS008",scenario:"A legal research intern wants to explore the appeals process and so asks a senior judge to explain the direction that appeals can be made.",q:"Which of the following is not a direction by which an appeal can be made?",opts:["The Crown Court to the Court of Appeal.","The Court of Appeal to the Supreme Court.","The High Court to the Supreme Court.","The High Court to the Court of Appeal.","The Magistrates' Court to the Court of Appeal."],ans:"E",expl:"(E) Appeals from the Magistrates' Court will go either to the Crown Court or to the High Court by way of case stated. Appeals from the Crown Court will be heard in the Criminal Division of the Court of Appeal, as can be seen in (A). As in (B) the Court of Appeal decision can be appealed to the Supreme Court, and as in (D) the High Court's decision can be appealed to the civil division of the Court of Appeal. (C) the High Court's decision can be appealed straight through to the Supreme Court if the matter is of public significance."},{n:35,id:"DIS008",scenario:"A solicitor is acting for a claimant in a claim against their former financial adviser. The parties complied with the pre-action protocol but could not settle the claim. As a result, the claimant issued proceedings. The claimant's solicitor then received notice that the claim was proposed to be allocated to the multi-track. The claimant's solicitor is confident of success but is aware of potential weaknesses in the claim and of the escalating costs now that court proceedings are underway. Therefore, the solicitor would like to explore settlement at this stage.",q:"Which of the following describes the most appropriate course of action for the solicitor to adopt with a view to achieving settlement at this stage of the claim?",opts:["The claimant's solicitor should make an immediate application for summary judgment.","The claimant's solicitor should request further information to narrow the issues stated in the defence.","The claimant's solicitor should ask the defendant for an interim payment.","The claimant's solicitor should write an open letter to the defendant asking them to admit liability for the advice.","The claimant's solicitor should ask the court to order a stay for alternative dispute resolution to enable potential settlement to be explored."],ans:"E",expl:"(E) The solicitor should ask for a stay for alternative dispute resolution (for example, mediation or negotiated settlement). This is likely to be granted by the District Judge and it will give the parties the opportunity to consider the strengths
