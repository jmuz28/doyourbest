of their respective cases and actively engage to see if settlement can be achieved at this point. (A) is incorrect because an application for summary judgment asks the court to enter judgment for the applicant without proceeding to trial because evidence shows the other party has no real prospect of success. As the facts indicate the solicitor is aware of weaknesses in the claim and we are at an early stage of the proceeding, it is unlikely an application for summary judgment will succeed. (B) is incorrect because, although a request for information can narrow issues, such a request is not a mechanism to promote settlement. (C) is incorrect because the grant of an interim payment is not a settlement device either, it is merely an application asking the court to order the other party to pay something before the case is settled. Such an order can be 'without prejudice' - meaning the court could rule in the paying party's favour later. (D) is incorrect because the defence already disputes liability. The defendant is unlikely to respond to a request to admit with anything other than a reiteration of the denial set out in the defence."},{n:36,id:"TRT131",scenario:"A consumer wanted to invest her modest savings. She could not afford to pay for financial advice. However, she obtained free advice from an investment advisor who has the practice of providing the first half hour of consultation free of charge. The consumer invested her savings in reliance on the advice. Unfortunately, the investment fell in value and she lost all her money. An independent review later showed that her loss was caused by the negligence of the investment advisor, whose advice had been totally inappropriate.",q:"In a claim in tort by the consumer against the advisor, which of the following best describes the duty of the advisor?",opts:["The advisor did not owe a duty of care to the consumer because the advice was given for free.","The advisor did not owe a duty of care to the consumer because she suffered pure economic loss.","The advisor did owe a duty of care to the consumer because he was in business as an investment advisor.","The advisor did owe a duty of care to the consumer because he knew that she was relying solely on his advice to invest her savings and it was reasonable for her to do so.","The advisor did not owe a duty of care to the consumer because it was not reasonable for her to rely on his advice without further independent enquiry."],ans:"D",expl:"(D) The advisor did owe a duty of care to the consumer. The consumer would consider a claim in the tort of negligence and would need to establish that the advisor owed her a duty of care. The consumer has suffered pure economic loss. The advisor would only owe a duty of care in respect of such loss if there were a special relationship involving an assumption of responsibility by the advisor and reasonable reliance by the consumer. This choice correctly recognises such a relationship. The advisor knew the purpose of the advice, that it would be communicated to the consumer, and that she would rely on it without independent enquiry. She did rely on it and it was reasonable for her to do so. (A) is not correct. The fact that the advice was given for free does not prevent the duty of care from arising. On these facts, a duty would be owed. (B) is not correct. It is true that the consumer suffered pure economic loss. However, it is not correct to say that the advisor did not owe a duty of care in respect of such loss, as explained above. (C) is not correct. On these facts, it is true that the advisor owed a duty of care to the consumer. However, this choice does not give the correct reason. The duty does not arise simply because the advisor was in business as an investment advisor. Rather, it arises because of a special relationship involving an assumption of responsibility by the advisor and reasonable reliance by the consumer. (E) is not correct. It is true that it must be reasonable for the consumer to rely on the advice. On the facts, it does appear reasonable for the consumer to have relied on the advice without further independent enquiry. Her savings were modest, she could not afford to pay for advice, and the advisor offered a free consultation knowing the purpose of the advice and that it would be relied on. Therefore, a duty of care is owed."},{n:37,id:"TRT101",scenario:"A worker at a petrochemical plant was severely burned when a pipe carrying hot oil exploded. The worker brought an action against the company that manufactured the pipe. At trial, the worker presented evidence that the pipe burst because it had corroded at a higher than normal rate, and that this was caused by small fissures formed in the pipe coating during manufacturing. The manufacturer presented evidence that the risk of such fissures was known but could not be entirely eliminated despite its rigorous checking process, which met the highest industry standards.",q:"Which of the following statements best describes whether the worker will succeed in a claim against the manufacturer?",opts:["The claim is not likely to succeed because the manufacturer could not have discovered the defect in the pipe even with the exercise of reasonable care, so the 'state of the art' defence in the Consumer Protection Act 1987 will apply.","The claim is likely to succeed because the manufacturer is liable in negligence because the pipe was defective and injured the worker.","The claim is not likely to succeed because the manufacturer did not fall below a reasonable standard of care and so is not liable in negligence.","The claim is likely to succeed because the fact that the pipe was defective means that the manufacturer is liable under the Consumer Protection Act 1987.","The claim is not likely to succeed because the defective pipe was being used in the course of a business, so the Consumer Protection Act 1987 does not apply."],ans:"D",expl:"(D) The claim is likely to succeed because the manufacturer is liable to the worker under the Consumer Protection Act 1987 ('CPA'). The manufacturer is a potential defendant under the CPA as producer of the pipe. The pipe is defective because its safety was not such as persons generally are entitled to expect. The manufacturer is liable to the worker because he suffered damage caused by the defect in the product. Liability under the CPA is strict; it is not necessary to prove that the defect was caused by any fault on the part of the manufacturer. On the facts, there is no defence to the claim under the CPA as discussed below. (A) is not correct because the 'state of the art' defence under the CPA will not apply. This defence applies where the producer could not have discovered the defect because of the state of scientific and technical knowledge at the time. However, this defence has been narrowly interpreted. It does not apply where the risk of a defect is known about, even if the knowledge does not exist to enable it to be avoided. (B) is not correct because it does not state the correct reason why the claim is likely to succeed. The manufacturer is not likely to be liable in negligence. A duty of care was owed to the worker, but the manufacturer does not appear to have fallen below a reasonable standard of care, so is not in breach of duty. (C) is not correct. It is true that the manufacturer is not likely to be liable in negligence because it did not fall below a reasonable standard of care. However, the claim is likely to succeed under the CPA, as explained above. (E) is not correct. The CPA does apply and the claim is likely to succeed, as explained above. The CPA does not apply to damage caused to property used for business, but that is not the case here. The CPA does apply where damage is caused by a defective product, even if the product is used for business purposes, as is the pipe in the question."},{n:38,id:"CTR114",scenario:"A customer takes their suit to a dry cleaners for cleaning. On the wall behind the dry cleaners' counter is a prominent notice which says 'All cleaning is subject to our standard terms and conditions, a copy of which is available on request'. The customer leaves their suit with the dry cleaners and is given a ticket, but does not ask to see the terms and conditions. The terms and conditions say that the dry cleaners exclude all liability for any loss of or damage to items left for cleaning, however caused.",q:"Is the exclusion of liability likely to be incorporated into the contract between the customer and the dry cleaners?",opts:["Yes, because sufficient steps were taken to bring the exclusion to the customer's attention.","No, because the terms and conditions were brought to the customer's attention too late.","Yes, because merchants are free to exclude liability so long as the fact that the contract is subject to terms is clearly displayed.","No, because the customer did not ask for a copy of the terms and conditions.","No, because the terms of the exclusion needed to be drawn specifically to the customer's attention."],ans:"E",expl:"(E) It is possible to incorporate terms, including exclusions of liability, into a contract by referring to them in a notice. However, the more onerous or unusual the term, the greater the effort required to bring it to the other party's attention. This is a particularly broad exclusion of liability covering, for example, damage caused by the dry cleaner's negligence. It is unlikely to be incorporated into the contract unless the exclusion itself (and not just the fact that all cleaning is subject to terms and conditions) has been drawn specifically to the customer's attention. Therefore, (A) is incorrect. (B) is not correct because the contract was concluded at the latest when the suit was accepted for cleaning and the customer was handed the ticket, and the customer should have seen the notice before then. (C) is incorrect because it is too broad. As explained above, exclusion is possible, but onerous exclusions require more specific notice. (D) is incorrect because a notice such as this is capable of incorporating terms and conditions into a contract even if they have not been read."},{n:39,id:"DIS164",scenario:"A woman hired a clown to perform at her son's sixth birthday party. On the day of the party, the clown did not arrive as agreed. The woman called the clown, who informed her that he received a last minute, far much more lucrative offer for the day and so he took it. He informed the woman he would send her a full refund of her deposit. The woman was quite upset that the clown had ruined her party plans and instructed a solicitor to issue proceedings against the clown.",q:"Which of the following would not be necessary to state in the Particulars of Claim?",opts:["That the woman had a contract for the clown to perform.","A statement of losses incurred explaining the damages claimed.","The date that performance was due.","That the woman chose the clown over hiring a bouncy castle because the clown explained he had not had a job in some time.","The nature and purpose of the contract, including a statement of consideration."],ans:"D",expl:"(D) That the woman chose the clown over hiring a bouncy house need not be included in the Particulars of Claim. The Practice Direction requires the Particulars to include enough information to allow the parties and the judge to identify the issues in the case early and to enable the judge to give directions to ensure that the trial can proceed promptly, fairly, and proportionately. In a breach of contract case, that the nonbreaching party chose to enter a contract with the breaching party to help them because they are down on their luck generally is not relevant to the claim. All of the other choices are things that should be included: (A) that the parties had a contract, (B) the damages claimed, (C) the date that performance was due, and (E) the nature, purpose, and consideration for the contract.",note:'Source slip: the explanation says "bouncy house" where option (D) says "bouncy castle". The original wording is kept.'},{n:40,id:"ETH124",scenario:"A junior solicitor is supervising a large team of paralegals, all of whom provide legal services in the personal injury department of a law firm. The solicitor's supervision extends to managing issues such as requests for holiday leave and other employment-related matters.",q:"Which of the following statements best describes what the SRA expects in terms of supervising non-solicitor employees?",opts:["The SRA does not have any expectations about supervision of non-admitted staff.","The SRA expects supervising solicitors to remain accountable for the work carried out by non-solicitor staff.","The SRA expects owners of the firm, not individual solicitors employed in it, to ensure the supervision of non-solicitor staff.","The SRA expects solicitors to supervise non-solicitor staff in employment-related matters only.","Supervision is not a regulatory concern."],ans:"B",expl:"(B) In acting as a supervisor or manager to others providing legal services, a solicitor must remain accountable for the work carried out through them and effectively supervise work being done for clients. The owners of an SRA-authorised firm must ensure that there is effective supervision. This is justified because of the need to ensure that the firm is well managed and a safe place from which to deliver services to clients. (A) is incorrect because the SRA's expectation is that all staff in an SRA-authorised firm (whether legally qualified or not) are subject to effective supervision. (C) is incorrect because both firms and individual solicitors have supervisory responsibilities. (D) is incorrect because the SRA requires supervision of the provision of legal services and not just employment-related matters. (E) is incorrect because regulatory expectations as to supervision are contained in the SRA Standards and Regulations."},{n:41,id:"CTR133",scenario:"A director of a company executes a deed by which the director promises to the company's bank that all the company's debts to the bank will be paid.",q:"Which of the following would be a reason for making this promise in a deed?",opts:["Because this is a guarantee.","In case there is no consideration for the director's promise.","To obtain the benefit of a six-year time limit for bringing proceedings.","To avoid any problems with privity.","If the transaction related to a purchase of land by the company."],ans:"B",expl:"(B) A promise made in a deed will be binding even if there was no consideration for it. It is common for guarantees (such as this one) to be made by deed, in case there is a problem with consideration. (In this case, there could be a problem with consideration if the guarantee is of the company's existing debts, so that the bank is not giving any new consideration for the director's promise.) (A) is incorrect because the requirement for guarantees is that they must be in writing, not that they must be by deed. (C) is incorrect because the time limit for claims under deeds is 12 years, not six years. (D) is incorrect because there should not be any problems with privity. The parties to a contract are in privity. Here the parties are the bank and the director. Additionally, if there were a problem with privity, concluding the contract in a deed would not solve that problem. (E) is not correct because contracts for the purchase of land have to be in writing - it is conveyances of land which have to be by deed. And in any case, the guarantee is likely to be separate from the contract for the purchase of the land."},{n:42,id:"CTR074",scenario:"A contract between two parties has been terminated for breach. The party in breach has done nothing towards performance of the contract and has benefitted from their wrongdoing at the expense of the innocent party.",q:"Which remedy for breach would be the most appropriate under the circumstances?",opts:["Specific performance.","Damages.","Injunction.","Restitution.","Rescission."],ans:"D",expl:"(D) Where one party (usually the party in breach) has been unjustly enriched by their wrongdoing, that is, the breach of contract, the law may make an order for restitution to the innocent party. To take advantage of this, the innocent party is required to show that they have a legitimate interest in preventing the party in breach from retaining the benefit they have received. Restitution aims to return to the innocent party the gain that the party in breach has made, either in the form of money or property. Restitution usually applies where other remedies such as specific performance, damages, injunctions, or rescission are seen as inadequate. Therefore (A), (B), (C), and (E) are all incorrect."},{n:43,id:"DIS062",scenario:`A client is contemplating suing her former solicitor for negligent advice in respect of her divorce settlement. The client contends that she received significantly less than her legal entitlement because of her solicitor's negligent failure to seek disclosure of her former husband's assets and negotiate a proper settlement.
The client first consulted the solicitor on 10 May 2018, received written advice recommending settlement on 1 August 2018, and the settlement was concluded on 1 September 2018.`,q:"Which of the following best describes the applicable limitation period?",opts:["Three years starting from the date of the first consultation.","Six years starting from the date of the first consultation.","Three years starting from the date of the advice recommending settlement.","Three years starting from the date the settlement was concluded.","Six years starting from the date the settlement was concluded."],ans:"E",expl:"(E) The limitation period for a non-personal injury ('PI') negligence-based claim is six years. The time starts to run from the accrual date, which is the date the tortious act occurred. Here, that would be the date at which the negligent settlement took place. (A), (C), and (D) are incorrect as the three-year period applies only to PI negligence-based claims. (A) and (B) are also incorrect because there was no negligence at the point of the initial consultation. (C) is further incorrect because the advice does not cause injury until the settlement is finalised."},{n:44,id:"DIS159",scenario:"A manufacturer failed to pay a supplier for goods the manufacturer ordered, claiming the goods were not delivered. The supplier did not want to jeopardise its relationship with the manufacturer, who, at the time, was the supplier's biggest customer. However, the relationship between the two has soured and the manufacturer seldom places orders with the supplier. The supplier decides that it will make a claim for the debt. However, the end of the limitation period is near. It ends on 20 November. On 5 November, the supplier's solicitors issue court proceedings to stop the limitation clock running.",q:"Which of the following best describes the deadline for service of the claim form upon the manufacturer?",opts:["The claimant must serve the claim form before 20 November.","The claimant must serve the claim form within 14 days of issue, that is, by 19 November.","The claimant must serve the claim form within 14 days of 20 November, that is, by 4 December.","The claimant must serve the claim form within four months of issue, that is, by 5 March.","The claimant must serve the claim form within one month of issue, that is, by 5 December."],ans:"D",expl:"(D) A claimant must serve an issued claim form within four months of the date of issue, failing which the court will not permit the claimant to continue with the claim. It will be extremely difficult to persuade the court to allow the claim to continue if the claimant fails to serve in time. (A) is incorrect because the claimant need only issue the claim form, not serve it, by the end of the limitation period. (B) is incorrect because the period is four months, not 14 days. Fourteen days refers to the period that the claimant has available to serve Particulars of Claim following service of the claim form. (C) is incorrect for the same reason - it refers to the period for serving the Particulars of Claim. Additionally, the trigger date is not 20 November, which represents the end of the limitation period. (E) is incorrect because the period is four months, not one month.",note:Mp},{n:45,id:"CTR084",scenario:"A breeder enters into a contract with a woman for the sale of a horse for £3,000. The contract is concluded and the horse is delivered, but the woman subsequently tells the breeder that she is unable to pay the £3,000 but will give her a £2,750 horse box in full and final settlement, saying that the breeder should 'take it or leave it'. The breeder agrees. The breeder later changes her mind and sues the woman for the extra £250.",q:"Will the breeder be successful in her claim?",opts:["Yes, because the horse box did not represent the full value of the outstanding debt.","Yes, because part payment of an existing debt is only sufficient consideration if made by a third party.","Yes, because an object (that is, the horse box) is not adequate consideration for the part payment of a monetary debt.","No, because payment by another method is sufficient consideration for the promise to forgo the balance of an outstanding debt.","No, because she had agreed to part payment and is estopped from going back on her promise."],ans:"D",expl:"(D) There is a general rule that an agreement to accept part payment in full and final settlement of a debt does not preclude the debtor from subsequently claiming the balance. However, there are a number of exceptions to this general rule, usually where some additional benefit is conferred on the debtor in consideration of their promise to forgo the balance of their debt. An example of this is payment by another method, so (D) is correct. (A) is incorrect because it is irrelevant that the value of the outstanding debt and the value of the horse box are not the same if the breeder has agreed to the deal in full and final settlement of the debt. (B) is incorrect because whilst part payment of a debt by a third party is sufficient consideration for a promise to forgo the balance of the debt, it is not the only situation where consideration will be sufficient, as discussed above. (C) is incorrect because of the rule discussed above. Part payment by another method is sufficient consideration for a promise to forego the balance of a debt. (E) is incorrect because whilst promissory estoppel is an equitable doctrine that prevents a debtor going back on a promise to accept part payment, other conditions must also be met, primarily that the creditor has relied on the promise to their detriment. This does not appear to be the case in this scenario.",note:'Source slip: the explanation describes the debtor (rather than the creditor) as the party who could later claim the balance and who promises to forgo it, and refers to estoppel preventing a "debtor" going back on a promise to accept part payment. The original wording is kept.'},{n:46,id:"LGS016",scenario:"A client is contemplating entering into a conditional fee agreement with a solicitor to fund a professional negligence action against another solicitor. Additionally, the client wishes to enter into an after the event insurance policy.",q:"Which of the following best describes what the after the event policy will cover?",opts:["The solicitors' costs (own solicitor and other side) whether or not the client is successful.","The solicitors' costs (own solicitor and other side) and disbursements whether or not the client is successful.","The solicitors' costs (own solicitor and other side) and any damages payable to the other side.","The disbursements and the other side's solicitor's costs in the event the claim is unsuccessful.","The disbursements and the other side's solicitor's costs in the event the claim is successful."],ans:"D",expl:"(D) If the claim is unsuccessful, the after the event insurance policy will cover disbursements and the other side's solicitor's costs. Disbursements are expenses incurred by the solicitor to progress the claim, such as experts' reports, court fees, medical records, and so on. After the event policies also cover the risk of having to pay costs to the other side if the client's claim is unsuccessful. (A) and (B) are incorrect as the policy will only cover liability to pay the other side's costs and the client's own disbursements. After the event insurance is often associated with a conditional fee agreement, so the client will likely not have any liability to pay his own solicitor's costs if unsuccessful, but this would be due to the conditional fee agreement rather than the after the event insurance policy. (C) is incorrect as an after the event policy does not cover payment of damages. (E) is incorrect because after the event insurance does not apply when the claim is successful. In that case, disbursements and costs are recovered from the defendant."},{n:47,id:"CTR116",scenario:"A woman is considering buying a second-hand car from a private seller. The woman asks the seller whether the car has been involved in any accidents, and the seller says that it has not. Relying on the seller's statement, the woman buys the car. She then learns that the car had previously been written off as a result of an earlier accident of which the seller had not been aware.",q:"Can the woman rescind the contract for misrepresentation?",opts:["Yes, if she can prove that the seller did not have reasonable grounds for making the statement.","No, because the seller's statement was a term of the contract, not a representation.","Yes, for fraudulent misrepresentation.","Yes, unless the seller can prove that they had reasonable grounds for making the statement.","No, because the seller was not aware of the accident."],ans:"D",expl:"(D) The seller's statement appears to have been a representation on which the woman relied. The seller was not aware of the accident, so the misrepresentation was not fraudulent. In cases of non-fraudulent misrepresentation, the innocent party can rescind the contract unless the party who made the misrepresentation can prove that they had reasonable grounds for believing, and did believe, that it was true. The burden of disproving negligence is therefore on the person who made the misrepresentation. This means that (A) is not correct. (B) is incorrect because in a situation such as this, where the person making the statement has limited knowledge and expertise, the statement is likely to be categorised as a misrepresentation rather than as a term of the contract. (C) is incorrect because the misrepresentation was not deliberate. The seller was not aware of the accident. (E) is not correct because, to defend a claim for misrepresentation, it is not sufficient for the person who made the statement to show that they were not aware that it was false: they have to show that they had reasonable grounds for believing, and did believe, that it was true. Here, the seller would have to show that they were not negligent in believing that the statement was true."},{n:48,id:"ETH110",scenario:"A firm intends to carry out a marketing campaign in which it will advertise that it will share 25% of its fees with anyone who refers personal injury clients to them.",q:"Which of the following best describes whether the arrangement is permissible?",opts:["The arrangement is permissible because the share of fees paid by the firm will be for marketing purposes.","The arrangement is not permissible because it will result in the payment of prohibited referral fees.","The arrangement will only be permissible if the firm has an agreement in writing with anyone who refers clients to the firm, and if the firm notifies each referred client of the arrangement.","The arrangement is not permissible because referral fees are prohibited in all matters.","The arrangement will only be permissible if each referred client consents to the arrangement."],ans:"B",expl:"(B) The Legal Aid, Sentencing and Punishment of Offenders Act 2012 (LASPO) prohibits the payment or receipt of referral fees in claims for damages following personal injury or death. Because the firm will share its fees in exchange for referrals of personal injury matters, this arrangement would result in the payment of prohibited referral fees. (A) is incorrect because the fee paid will be in exchange for the referral, not for marketing; therefore, it will be a prohibited referral fee. (C) is incorrect. This choice states the general rule for permitted fee sharing arrangements, but this is a prohibited referral fee because it is a personal injury matter. (D) is incorrect because payments in exchange for a referral are generally permitted, but are prohibited in personal injury matters. (E) is incorrect because this is a prohibited referral fee, and the client's consent will not solve the problem."},{n:49,id:"CNL099",scenario:'The police learn that an animal rights group intends to hold a protest outside a scientific laboratory that conducts testing on animals. The area where the group intends on protesting is restricted to only employees of the laboratory. The laboratory is located in central England, and around 40 activists are likely to attend. A previous protest two months ago caused damage to the windows of the laboratory, and some activists have stated that they "want to finish the job this time".',q:"Which of the following best explains what the police can do in advance of the protest?",opts:["Because the protest is a trespassory assembly, the police can apply to the Home Secretary to ban it.","Because the protest is a trespassory assembly, the police can apply to the local council to ban it.","Because the protest is a public assembly, the police can apply to the Home Secretary to ban it.","Because the protest is a public assembly, the police can apply to the local council to ban it.","Because the protest is a trespassory assembly, the police must direct the protestors to conduct the protest in a manner so as to prevent disorder or damage to property."],ans:"B",expl:"(B) Because the protest is a trespassory assembly, the police can apply to the local council to ban it before it takes place. A trespassory assembly includes any assembly of 20 or more persons on land to which the public have no right of access, which is likely to be held without the permission of the occupier, and which may cause significant damage to buildings of scientific importance. The planned protest here meets this definition. Because the protest is to take place outside of London, the application to ban the assembly has to be made to the local council rather than the Home Secretary. (A) is incorrect because the Home Secretary can ban trespassory assemblies only in London and Greater London. (C) and (D) are incorrect because the protest does not qualify as a public assembly, as the public have no right of access to the land. (E) is incorrect because the police have the ability to ban a trespassory assembly before it occurs. They are not required (nor are they likely) to allow it to proceed."},{n:50,id:"DIS084",scenario:`A cyclist suffers multiple injuries following a collision with a car. The solicitors for the cyclist write to the driver's insurers indicating that they are intending to bring a claim. They subsequently send a letter of claim to the driver, with a copy to his insurers, stating that they will commence formal legal proceedings unless they receive a formal admission of liability within 21 days.
The driver's insurers respond on Day 20, stating that they are investigating the claim and will come back to the cyclist's solicitors as soon as possible with confirmation of whether liability can be admitted. The cyclist instructs his solicitors to ignore this and issue proceedings, having already obtained a medical report.`,q:"What is the likely impact of the cyclist's pre-action conduct?",opts:["The cyclist is in breach of the personal injury protocol, and he is likely to be penalised in costs or interest.","The court will not consider the conduct of the cyclist to be unreasonable if the claim is subsequently settled.","The court will debar the cyclist from relying upon the medical report obtained prior to commencement.","The driver will be entitled to apply to strike out the claim.","The court will discount any award of compensation by 10% to take into account the unreasonable nature of the cyclist's pre-action conduct."],ans:"A",expl:"(A) The cyclist is in breach of the Personal Injury Protocol because the protocol provides that if a defendant responds to a letter of claim, the claimant must then give the defendant three months to investigate the claim. As the claimant did not comply, the judge is likely to be unhappy at the pre-action conduct of the claimant and his solicitors, and the judge may deprive the cyclist of interest on his damages. The judge also may order the cyclist to pay part of the driver's wasted costs because the claim may have settled earlier without significant cost of court proceedings, if the cyclist had complied with the protocol. (B) is incorrect because the court is very likely to find the conduct of the cyclist unreasonable. (C) is incorrect because the rules do not provide for denial of relying on a medical report as a penalty for non-compliance with the protocol. (D) is incorrect because failure to accord with protocol does not automatically give the other party a right to judgment or to strike out the claim. (E) is incorrect because the rules do not permit the court to reduce the damages to reflect non-compliance with protocol.",note:"The question screen for this question appears twice in the PDF. It is included once."},{n:51,id:"LGS068",scenario:"A solicitor at a large firm represented a client accused of manslaughter. After thoroughly investigating the matter, the solicitor managed to clear the client. The client paid the solicitor's substantial bill by transferring money to the solicitor's firm from a bank account in North Korea. As this country has been listed as a high-risk jurisdiction, the solicitor worried that the client might be laundering money and reported the matter to the firm's Money Laundering Reporting Officer ('MLRO'). The MLRO investigated the matter and decided the client's source of funds was legitimate.",q:"What must the solicitor do now?",opts:["Report her suspicions to the National Crime Agency.","Refuse to represent the client in any future engagements.","Report her suspicions to the client.","Nothing.","Report her suspicions to the local police."],ans:"D",expl:"(D) The solicitor does not have any further obligations regarding her money laundering suspicions at this point. Under the Proceeds of Crime Act 2002, solicitors are required to make disclosures of suspicions of money laundering. In firms, the obligation is to report to the MLRO. The MLRO is in turn responsible for ensuring that, when appropriate, information is disclosed to the relevant authority. Here, the solicitor has reported her suspicions to the MLRO. She has therefore fulfilled her obligation and need not undertake further action. It is the MLRO's duty to determine whether to make disclosures to the relevant authority. (A) and (E) are incorrect because, as explained above, the solicitor need only report to the MLRO. It is the MLRO's duty to determine whether to report to the relevant authority, which is the National Crime Agency, not the local police. (B) is incorrect because solicitors do not have a duty to refuse future engagements merely because they once suspected a client might be engaging in money laundering. In any event, here, the MLRO investigated and determined the client's source of funds was legitimate. (C) is incorrect because the solicitor's obligation is to report to the MLRO. Reporting suspicions to the client could constitute the offence of tipping off."},{n:52,id:"CNL150",scenario:"The current government lacks a majority of seats in the House of Commons. This leads the Commons to pass a motion of no confidence in the government.",q:"Which of the following best explains what happens next under the Fixed-term Parliaments Act 2011?",opts:["The Prime Minister must immediately resign.","The Queen must immediately dismiss the Prime Minister.","A general election must be held if the House of Commons has not passed a motion signaling confidence in the government within 14 days of the no confidence motion.","A general election must be held immediately.","A general election must be held if, within seven days of the no confidence motion, the House of Commons has not passed a motion signaling confidence in the government."],ans:"C",expl:"(C) A general election must be held if the House of Commons does not pass a motion of confidence in the government within 14 days of the no confidence motion. Normally, general elections in the House of Commons are held every five years. However, under the Fixed-term Parliaments Act 2011, an earlier election will be held if the Commons passes a motion of 'no confidence' in the government and that is not followed within 14 days by a motion of confidence in the government. (A) and (B) are incorrect because those events do not necessarily follow a no confidence vote. (D) is incorrect because an election does not immediately follow the no confidence vote. Rather, the 14-day period must expire without a vote of confidence in the government. (E) is incorrect because the period is 14 days, rather than seven days."},{n:53,id:"DIS098",scenario:"A claimant in a personal injury case issues proceedings after the defendant inadvertently failed to reply to the letter of claim. Upon receiving the Particulars of Claim, the defendant's solicitor is considering how to respond. Because there was no response to the letter of claim, there has been no opportunity to investigate. The solicitor is aware that there are numerous witnesses to the accident, all of whom he will need to interview and probably an attendance at the accident scene will be necessary. It will be impossible to complete all of this investigatory work and file a defence within the standard timescale for filing a defence.",q:"Which of the following describes the best steps for the defendant's solicitor to take now in addition to acknowledging service?",opts:["File a defence as best they can within 14 days of the acknowledgment.","Request the claimant to allow them an additional 14 days (42 days in total from service of the Particulars) in which to file a defence.","Request the claimant to allow him an additional 28 days (56 days in total from service of the Particulars) in which to file a defence.","Make an application to the court for an additional 28 days (56 days in total from service of the Particulars) in which to file a defence.","The solicitor should file the acknowledgment of service and file a blanket defence within 14 days of the acknowledgment."],ans:"C",expl:"(C) A defendant must respond to a claim within 14 days of the deemed date of service of the Particulars of Claim. One possible response is an acknowledgment of service with an indication they will file a defence, which ordinarily must then be filed within 14 days of the acknowledgment (a maximum of 28 days from the deemed date of service of the Particulars). However, the defendant may ask the claimant to agree an extension of up to another 28 days (a total of 56 days from the deemed date of service of the Particulars). If the claimant refuses the extension, or it becomes clear that even more time is needed, the defendant can apply to the court for additional time. Under our facts, the solicitor believes they cannot complete their investigation within the 28-day period. Therefore, the best next step for the solicitor is to ask the claimant for an extension. (A) would not be a good approach because the solicitor will not be able to complete the investigation within 14 days and so will be unable to file a full and detailed defence. (B) is possible, but as the solicitor may ask for an additional 28 days rather than just 14, that would be more prudent. (D) is incorrect because the defendant should first ask the claimant for an extension and should make an application only if the claimant does not agree or if it appears the agreed time will not be sufficient. (E) is incorrect because blanket defences generally are inappropriate. The defendant must admit or deny the claims in the Particulars paragraph by paragraph, and it appears the solicitor would not be able to do so properly without more time for investigation."},{n:54,id:"DIS247",scenario:"A cyclist was riding his bicycle at speed along a country lane when a car suddenly pulled out in front of the cyclist. The cyclist hit the car and suffered significant injuries, including a broken shoulder. The cyclist instructs a solicitor to issue proceedings against the car's driver when negotiations for settlement break down. The solicitor estimates the cyclist's damages at £45,000.",q:"Which of the following statements best describes how the solicitor should start the proceedings?",opts:["The solicitor should send the claim form to their local High Court district registry that will issue the claim form and determine which court to allocate the claim.","The solicitor should send the claim form by special delivery to the local county court.","The solicitor should take the claim form for issue in person to the local county court.","The solicitor should send the claim form by first class post to their local county court for issue.","The solicitor should send the claim form to the County Court Money Claims Centre (CCMCC) in Salford to issue the claim form."],ans:"E",expl:"(E) There is now one County Court issuing centre based in Salford, the CCMCC, and all claims are issued from this court. (A) is incorrect because it would be inappropriate for the claimant to issue in the High Court bearing in mind its value. (B), (C), and (D) are incorrect because the prescribed process for issue in the County Court is now through the bulk issuing centre in Salford."},{n:55,id:"CTR067",scenario:"An artist is selling his work in an art catalogue. His advert states that he will only sell to reputable galleries in London. A dealer calls the artist to purchase one of the paintings and assures him that he is the owner of a well-known gallery in Bond Street, London. The artist agrees to sell him the painting and the contract is agreed orally and the painting collected. A few weeks later the artist's friend tells him he has seen his work on display in a small gallery in a Northern seaside town.",q:"Does the artist have any recourse against the dealer under the law of mistake?",opts:["Yes, the artist would be able to argue 'non est factum' as he was entering into a contract that was radically different to what he had envisaged.","Yes, the location of the gallery was fundamental to the contract, so it is likely that the contract would be held to be void.","No, the artist's only remedy is to rescind the contract for misrepresentation.","No, the location of the gallery was not fundamental to the contract, so the artist's only remedy is to sue the dealer for breach of warranty.","No, the location of the gallery was not fundamental to the contract, so the artist would have no recourse against the dealer."],ans:"B",expl:"(B) When one party is mistaken as to the identity of the other, the contract may be void, provided that the identity of the party is of fundamental importance to the other party. It is clear from the scenario that this is the case for the artist, so (B) is the correct answer. (A) is incorrect because non est factum specifically relates to written contracts, and means that a party is bound by their signature unless they mistakenly believe that the document signed represents something completely different from what it actually represents. There must be a fundamental and radical difference, and the signatory must not have been careless in signing the document. (C) is incorrect because, while the contract may be voidable for misrepresentation if it is not void for mistake, this is not the artist's only remedy. The difference is important, because a mistake makes the contract void, not voidable. (D) is incorrect because the location of the gallery was of fundamental importance to the artist, and because there is no suggestion that the dealer's assurance has become a term of the contract. (E) is incorrect for the same reason, and also because it may be the case that the artist would have a claim for misrepresentation rather than having no recourse to the dealer."},{n:56,id:"DIS162",scenario:"The owner of a hardware store in Newbury has a contractual dispute with a lawn mower importer from Southampton. Both parties have incorporated their businesses and have properly registered their companies at Companies House. Early on, the importer directed the store owner to contact him only through his nominated solicitors. After negotiations break down, the store owner commences proceedings against the importer. To this end, the store owner issues a claim and mails a sealed copy of the proceedings to the importer's place of business, which is the company's registered office.",q:"Was the importer validly served?",opts:["Yes, because service by first class post to the importer's registered office is the only valid method of service here as the importer is a company.","No, because service on the importer's nominated solicitors is the only valid method of service here as the importer is a company.","Yes, because service either by first class post to the importer's registered office or on the nominated solicitors was proper under the circumstances.","No, because personal service on the importer is the only valid method of service here under the circumstances.","Yes, because service either by first class post to the importer's registered office or personal service on the importer was proper under the circumstances."],ans:"C",expl:"(C) Generally, when a defendant has nominated solicitors to accept service, the claim must be served on the nominated solicitors. However, if the defendant is a company, service by delivery or posting to the company's registered agent will also be sufficient. Here, the defendant is a company and service was made by post to the defendant's registered office. (A) and (B) are incorrect because, as just explained, service here is not limited to either first class post or delivery to the defendant's nominated solicitors, as either one will do. (D) and (E) are incorrect as personal service would not be a proper method of service because the defendant is a registered company and has nominated solicitors to receive process.",note:`Source slip: the explanation refers to posting to the company's "registered agent", although the facts and the next sentence refer to the registered office. The original wording is kept.`},{n:57,id:null,scenario:"A woman was cutting the grass in her garden with a lawn mower. The mower had a safety guard to prevent it from throwing up stones as the blades spun, but the woman removed it to allow the mower to travel more quickly. Unfortunately, the mower struck a stone, which spun out, flew over the boundary and hit the woman's next-door neighbour, injuring him.",q:"In a claim by the neighbour against the woman to recover damages for his injury, which of the following correctly explains the likely outcome?",opts:["The neighbour will be successful because the actions of the woman led to him suffering a foreseeable injury.","The neighbour will not be successful because the stone flew over the boundary before it hit him, so the accident did not happen on premises of which the woman was the occupier.","The neighbour will not be successful because this is not an established duty situation, so the woman could not owe him a duty of care.","The neighbour will not be successful because, while the woman could owe him a duty of care if the court was prepared to impose a duty in this novel situation, the court would be unlikely to do so.","The neighbour will be successful because the woman is likely to owe him a duty of care in these circumstances and she has acted in breach of that duty."],ans:null,expl:null,note:Hi},{n:58,id:null,scenario:'A claimant in a breach of contract case issues proceedings on 1 March. However, there is a delay in serving the defendant, and the claim form has a deemed service date of 5 May. The claim form is marked "Particulars of Claim to follow". The claimant serves the Particulars of Claim on 16 May.',q:"Was the Particulars of Claim served within the prescribed timescale?",opts:["Yes, as a claimant must serve the Particulars of Claim within four months of service of the issuance of proceedings.","No, as a claimant must serve the Particulars of Claim along with the claim form.","Yes, as a claimant must serve the Particulars of Claim within 28 days of service of the claim form.","No, as the claimant must serve the Particulars of Claim within two months of the issuance of proceedings.","Yes, as a claimant must serve the Particulars of Claim within 14 days of service of the claim form."],ans:null,expl:null,note:Hi},{n:59,id:null,scenario:"A justice is hearing a case involving a contract for the sale of goods of steel and aluminium between two parties. The legislation states that 'the buyer will be required to pay taxable interest on imports on purchase of steel, copper, and brass'.",q:"What rule would the judge apply to determine the applicability of the statute for a contract of aluminium?",opts:["Ratio decidendi.","Noscitur a sociis.","In pari materia.","Ejusdem generis.","Expressio unius est exclusio alterius."],ans:null,expl:null,note:Hi},{n:60,id:null,scenario:"A parent is acting as a Litigation Friend for his 17-year-old son, who was injured in a road traffic accident whilst riding through a busy street on his scooter. The Litigation Friend is ready to issue proceedings as the defendant with whom his son collided continues to dispute responsibility for the accident.",q:"Which of the following documents must the claimant enclose in this type of case when sending the claim form to the court for issue?",opts:["A statement signed by the Litigation Friend. This should deal with the Litigation Friend's fitness to act.","A signed form confirming that the minor is happy for the Litigation Friend to act.","A letter from the defendant (or their representatives) making it clear that they have no objections to the Litigation Friend acting in this case.","A certificate signed by the minor's family doctor with an assessment of the minor's ability to understand the litigation process and the purpose of the proceedings.","A 'certificate of suitability', which should certify the Litigation Friend's suitability to act on behalf of the claimant."],ans:null,expl:null,note:Hi}],zi="The scan captures this explanation out of order; it has been reassembled in reading order from the page image.",nk=[{n:1,id:"DIS189",scenario:"An electronics manufacturer believes that a large department store chain breached the supply contract between the two. As a result, the electronics manufacturer would like to initiate a claim against the chain. The claim has a stated value of £22,500.",q:"To which track is the court most likely to allocate the case?",opts:["Multi-track.","Fast track.","Small claims track.","The Technology and Construction Track.","The Commercial Track."],ans:"B",expl:"(B) The court is likely to allocate the case to the fast track. Cases involving at least £10,000 (or £1,000 for personal injuries) and up to £25,000 are allocated to the fast track. (A) is incorrect because multi-track is the appropriate track for claims worth in excess of £25,000. (C) is incorrect because cases involving less than £10,000 or less than £1,000 for pain and suffering or loss of amenity are allocated to small claims. (D) and (E) are incorrect because Technology and Construction and Commercial are not tracks, but rather they are names of specialist courts within the Queen's Bench Division."},{n:2,id:"DIS231",scenario:"A cyclist was riding his bicycle at speed along a country lane when his front wheel hit a significant pothole in the road. The impact threw the cyclist from his bicycle, which resulted in significant injuries, including a fractured pelvis. The claimant brings a claim against the Highways Authority on the basis they have failed in their statutory duty to maintain the road. The claim alleges damages of not more than £250,000, including substantial past and future loss claims in addition to compensation for personal injury. The defendant believes that the claim is overstated because the claimant's medical report indicates they are making a reasonably good recovery from the injury.",q:"How should the defendant raise their concerns regarding the statement of value?",opts:["The defendant should wait for the Directions Questionnaire and indicate therein that they take issue with the value stated.","The defendant should indicate in the defence that they dispute the value stated on the claim, explaining why.","The defendant should raise issue with the statement of value endorsed on the claim form when filing their Acknowledgment of Service.","The defendant should not raise the issue at this stage but should instead raise it at the Costs and Case Management Conference.","The defendant should not raise the issue at this stage but should instead raise it when filing the final updated schedule of loss."],ans:"B",expl:"(B) The defendant should include this in the defence, explaining why, ideally by reference to each item claimed in the schedule of past and future losses and expenses. Where possible, the defendant should provide their own valuation. (A), (D), and (E) are incorrect because they all provide the defendant should wait to raise the issue. It is important that the parties make the court aware at the earliest possible stage of the proceeding of a dispute regarding any key point of the case. This assists the court in allocation and case management and ensures that the court allocates the appropriate level of resource to the right cases. (C) is incorrect because whilst the defendant can mention the dispute in the acknowledgment, it need not be, but must be raised in the defence."},{n:3,id:"TRT023",scenario:"A doctor examines his patients using disposable plastic gloves, designed to be used once only and thrown away after each patient. In order to save costs, the doctor uses the same gloves for several patients instead of disposing of them. As a consequence, an infection is transferred from one patient to another during the doctor's examination.",q:"In a negligence claim by the infected patient against the doctor, which of the following is correct?",opts:["The patient will not have a successful claim against the doctor because she consented to the examination.","The doctor is not in breach of his duty of care if he honestly believed that the best course of action was to re-use the gloves.","The doctor is in breach of his duty of care because cost is never a relevant consideration when assessing breach of duty.","The doctor is in breach of his duty of care if a reasonable doctor would not have re-used the gloves.","The doctor is not in breach of his duty of care if a reasonable person would have expected him to re-use the gloves."],ans:"D",expl:"(D) The doctor owes the patient a duty of care and he is in breach of his duty if he fails to exercise reasonable care. This is measured according to the care to be expected of a reasonable doctor. So, if a reasonable doctor would not have re-used the gloves, the doctor is in breach of duty. (A) is not correct. The patient's consent to the examination would mean that the doctor does not commit a battery by examining her. However, the patient does not consent to the examination being carried out negligently. (B) is not correct. The standard of reasonable care is objective and impersonal so the doctor's own honest belief does not prevent him being in breach if a reasonable doctor would not have re-used the gloves, as stated above. (C) is not correct because it is wrong to say that cost is never a relevant consideration when assessing breach of duty. The duty is not to take every possible precaution whatever the cost. The court must look at the magnitude of the risk (e.g., of transmitting infection) and the practicability of taking precautions (e.g., by changing gloves). So, if a risk was very small and the cost of avoiding it was very high, a defendant might be justified in not incurring the cost. However, that is not likely to apply on these facts. (E) is not correct because it refers to the standard of care as measured by reference to an ordinary person. Here, as explained above, the standard is that of a reasonable doctor."},{n:4,id:"ETH087",scenario:"A solicitor works at a law firm which specialises in personal injury matters. Recently, there have been important changes in the civil procedure rules that will affect the practice of the solicitors within the firm. The firm has advised all staff that, due to the difficult economic climate, there is no budget for training this year. As a result, the solicitor fails to learn about the changes.",q:"Which of the following statements best describes whether the solicitor and firm are subject to regulatory action?",opts:["The firm, and not the solicitor, is subject to regulatory action.","Both the firm and the solicitor are subject to regulatory action.","Neither the firm nor the solicitor is subject to regulatory action.","The solicitor, and not the firm, is subject to regulatory action.","The SRA must decide whether the solicitor or the firm is primarily responsible for the solicitor's failure to learn about the changes, as only one of the parties can be subject to regulatory action."],ans:"B",expl:"(B) A solicitor must maintain their competence to carry out their role and keep their professional knowledge and skills up to date. Additionally, a firm must ensure that their managers and employees are competent to carry out their role, and keep their professional knowledge and skills, as well as understanding of their legal ethical and regulatory obligations, up to date. Many different types of learning activities will be valid, including in-house presentations and training sessions, team meetings, circulation of relevant articles and information, and shadowing opportunities. (A), (C), (D), and (E) are incorrect because both the solicitor and the firm are subject to regulatory action in this situation.",note:"The OCR of this question screen was scrambled; the facts and options were checked against the page image."},{n:5,id:"DIS212",scenario:`A homeowner in Manchester brings a claim against a ladder company from Liverpool for injuries the homeowner sustained when a ladder the company sold collapsed. The claim alleges that the grade and thickness of metal used in the ladder was not sufficient to support the weight that the company claimed the ladder could hold. The ladder was made several years ago by a Chinese subcontractor hired by the company, based on designs made by the subcontractor.
After the company's solicitor advises the company on the duty of disclosure, an officer of the company tells the solicitor that to the extent that any records relating to the ladder still exist, they would be in China, in possession of the subcontractor. The court has made an order for standard disclosure.`,q:"Which of the following statements most accurately describes the manufacturer's obligations with respect to the documents in China?",opts:["The manufacturer has a duty to disclose any relevant documents relating to manufacture of the ladder that were ever in its possession.","The manufacturer has no duty to disclose any documents in China as they are outside of a UK court's jurisdiction.","The manufacturer has no duty to disclose any documents in China as they are not in the manufacturer's possession.","The manufacturer has a duty to conduct an exhaustive search for documents in China.","The manufacturer has an absolute duty to search for documents in China."],ans:"A",expl:"(A) The duty of disclosure is wide ranging. The manufacturer must disclose any documents relating to manufacture of the ladder that were ever in its possession. Under standard disclosure, parties must disclose relevant documents (that is, documents upon which they will rely, as well as documents which affect their case or their opponent's case) that are or were within their control. (B) and (C) are incorrect as the manufacturer would have a duty to disclose documents in China if they are in the manufacturer's control, which includes documents the manufacturer has or had a right to possess, inspect, or copy. The mere fact that documents may be in China does not foreclose disclosure. (D) and (E) are incorrect because the duty to search for disclosable documents does not necessarily require an exhaustive search and is not absolute - the court expects each party to make only a reasonable and proportionate search, and what is reasonable and proportionate depends on the nature of the case, its value, and its importance."},{n:6,id:"DIS0134",scenario:`A man brings a civil claim for battery against another man when attempts at alternative dispute resolution fail. The claim alleges that the defendant hit the claimant with a shovel whilst the two were arguing about a hedge bordering their property. The claimant is seeking £20,000 damages.
The defendant believes the claimant is seeking too much money and so makes a Part 36 offer of £12,000. The claimant does not accept the offer and instead makes a Part 36 offer of £17,000. The defendant does not accept the offer. At trial, the court awards the claimant £11,000.`,q:"What costs order would you expect the trial judge to make?",opts:["The claimant will be ordered to pay the defendant's costs from the end of the relevant period of the claimant's offer because the claimant recovered less than their offer.","The claimant will be ordered to pay all of the defendant's costs because the claimant recovered less than the defendant's Part 36 offer.","The defendant will be ordered to pay all of the claimant's costs because the claimant won their claim.","The defendant will be ordered to pay all of the claimant's costs up to the end of the relevant period of the claimant's offer, and the claimant will be ordered to pay the defendant's costs incurred thereafter.","The defendant will be ordered to pay all of the claimant's costs up to the end of the relevant period of the defendant's offer, and the claimant will be ordered to pay the defendant's costs incurred thereafter."],ans:"E",expl:"(E) The defendant will be ordered to pay all of the claimant's costs up to the end of the relevant period of the defendant's offer, and the claimant will be ordered to pay the defendant's costs incurred thereafter. If a defendant makes a Part 36 offer, the claimant does not accept the offer, and the claimant wins the claim but does not beat the offer at trial, the defendant will usually be ordered to pay the claimant's costs up to the end of the relevant period of the defendant's offer, and the claimant will usually be ordered to pay the costs the defendant incurred thereafter. (A) is incorrect because it is based on the end of the relevant period of the claimant's offer, which is not relevant under the facts here. (B) is incorrect because the result stated is wrong: a claimant who wins their claim but fails to beat the defendant's Part 36 offer pays the defendant's costs incurred after the end of the relevant period of the offer; the claimant does not pay all of the defendant's costs. (C) is incorrect because it fails to take into account that the claimant did not beat the defendant's Part 36 offer. The purpose of Part 36 is to encourage settlement by making continuing to trial less advantageous should a party who rejects a Part 36 offer not beat the offer at trial by shifting costs to the party who rejected the offer from that point forward. (D) is incorrect as it is just a fuller restatement of (A).",note:"The end of the facts is cut off in the OCR; it was read from the page image. The answer screen prints the ID as 'DIS0134' (four digits), which is kept as shown."},{n:7,id:"DIS191",scenario:"The owner of a clothing store issued proceedings against a supplier for breach of contract. The case was assigned to the multi-track, and it progressed to disclosure. The District Judge has listed the case for a Case Management Conference.",q:"When must the parties file the disclosure report?",opts:["Each party must file a disclosure report not less than 28 days before the first Case Management Conference.","Each party must file a disclosure report not less than 14 days before the first Case Management Conference or otherwise with the Directions Questionnaire.","Each party must file a disclosure report not less than 21 days before the first Case Management Conference.","Each party must file a disclosure report not less than 28 days before the first Case Management Conference or otherwise with the Directions Questionnaire.","Each party must file a disclosure report not less than 14 days before filing the Directions Questionnaire."],ans:"B",expl:"(B) In a non-personal injury, multi-track claim such as the contract claim here, each party must file their disclosure report at least 14 days before the first Case Management Conference. The parties must discuss and agree the scope of the disclosure requirements in the case. (A), (C), and (D) are incorrect because 14 days is the correct timescale. (E) is incorrect because the filing of the disclosure report is tied to the Case Management Conference, not the filing of the Directions Questionnaire. Furthermore, although a party could file the report with the Directions Questionnaire, it is not required to be filed before the Directions Questionnaire."},{n:8,id:"ETH043",scenario:"A solicitor has invested a significant amount of money in a company. The company wants to bring a risky but potentially lucrative claim against its competitor, and wants to instruct the solicitor because his fees will be reduced due to his connection with the company.",q:"Should the solicitor accept instructions to act on behalf of the company?",opts:["Yes, because he has good knowledge of the company's finances and so has the skill and expertise to act.","Yes, provided the company's directors give their written consent and hold the appropriate board meeting to authorise that course of action.","No, the solicitor should decline to act on the basis of an own interest conflict.","Yes, because the solicitor and the company share a substantially common interest in bringing a successful claim against the competitor.","Yes, provided the risks are explained in writing to the company and a limited retainer is created."],ans:"C",expl:"(C) The fact that the solicitor has a financial stake in the company may mean that the solicitor will not give impartial advice with respect to this risky claim. As this creates an own interest conflict, the solicitor is prohibited from acting. (A) is incorrect. While it might be true that the solicitor has the skill and expertise to act, this does not override the own interest conflict. (B) is incorrect because the own interest conflict would override the consent of the directors. (D) is incorrect because the 'substantially common interest' exception applies to client conflicts, not own interest conflicts. A solicitor must not act if there is an own interest conflict. (E) is incorrect because a limited retainer would not be possible in these circumstances and the own interest conflict is the key point."},{n:9,id:"DIS204",scenario:"In an architect's negligence claim, the parties have disclosed reports from their respective experts. The experts disagree on a number of matters in their reports and are required to hold a joint discussion regarding their conclusions.",q:"May the solicitors for each party attend the joint discussion?",opts:["Yes, the solicitors for both parties may attend so that they may ask questions of the experts, with a view to securing concessions on their position.","No, only the solicitor for the defendant may attend so that they may ask questions of the experts, with a view to securing concessions on their position.","No, only the solicitor for the claimant may attend so that they may ask questions of the experts, with a view to securing concessions on their position.","No, neither solicitor may attend as the goal is to allow the experts to identify the issues between them and try to agree where possible.","Yes, the solicitors for both parties may attend to aid the experts in arriving at a common view."],ans:"D",expl:"(D) Generally, when the court orders parties' experts to meet, the purpose is to allow the experts to discuss among themselves the issues on which they agree and the issues on which they disagree, with a goal of streamlining the case. The solicitors usually should not attend for fear that the solicitors will try to sway an expert's view to favour the solicitor's client. This would run counter to the fact that the experts owe their duty to the court and not to the party that instructed them. Since all of the other choices suggest that at least one of the solicitors should attend, they are incorrect."},{n:10,id:"DIS169",scenario:"A claimant initiated a simple breach of contract case against a defendant, which was allocated to the fast track. Settlement efforts were unsuccessful, and all necessary pre-trial steps have taken place.",q:"Who must prepare and file the trial bundles and what is the least number of bundles that may be prepared?",opts:["The claimant must prepare and file at least three bundles.","The defendant must prepare and file at least three bundles.","Each party must prepare and file at least three bundles.","The claimant must prepare and file at least six bundles.","The defendant must prepare and file at least six bundles."],ans:"D",expl:"(D) The claimant must prepare and file a minimum of six trial bundles and they must be filed between three and seven days before the trial is to take place. It follows that the other answer choices are incorrect."},{n:11,id:"TRT039",scenario:"An inexperienced worker who was instructed to clean the floors of a shop mixed ammonia and chlorine bleach in a large pail. He was immediately overcome by fumes and collapsed. A customer who was nearby came to the worker's assistance and also was overcome by fumes, ultimately suffering lung damage. The customer sued the worker, alleging negligence. In defence, the worker presented uncontroverted evidence that he could not read the warning labels on the containers and that, while he knew he was mixing ammonia and bleach, he had never been made aware of the danger of mixing the two chemicals.",q:"Which of the following is true in the customer's negligence action?",opts:["The worker did not owe the customer a duty of care because the customer voluntarily came over to assist the worker.","The worker did owe a duty of care to the customer but was not in breach of duty because the worker was not aware of the risk from mixing the two chemicals.","The worker did owe a duty of care and will be found liable if the customer can show that a reasonable person in the worker's position would have been aware of the risk of mixing the two chemicals.","The worker did owe a duty of care and, to avoid being found in breach of duty, must prove beyond a reasonable doubt that an ordinary reasonable person would not have been aware of the risk of mixing the two chemicals.","The worker did owe a duty of care and, to avoid being found in breach of duty, must prove on the balance of probabilities that an ordinary reasonable person would not have been aware of the risk of mixing the two chemicals."],ans:"C",expl:"(C) The worker owed the customer a duty of care. He will be in breach of that duty if he fell below the standard of care to be expected of a reasonable person in his position. The burden of proving breach of duty is on the customer as claimant. (A) is not correct because the worker did owe a duty of care to the customer. A person who creates a dangerous situation owes a duty of care to a person who comes to the rescue. (B) is not correct. The worker is in breach of duty if he fell below a reasonable standard of care; this standard is objective and impersonal. It does not depend on the worker's own appreciation of the risk, but on whether a reasonable person in his position would have appreciated the risk. (D) and (E) are both incorrect because the burden of proving breach of duty is on the claimant, not the defendant. The standard of proof is on the balance of probabilities, so answer (D) also states an incorrect standard.",note:"The OCR of this question screen was scrambled; the facts and options were read from the page image."},{n:12,id:"TRT003",scenario:"A hockey player who was playing before a hostile crowd in the opponent's packed stadium missed a shot into an open net as the horn sounded, ending the game. As the crowd cheered and jeered, the puck bounced back to him and he shot it in anger toward the stands, aiming at one of the fans. He did not strike the fan he was aiming at, but he did hit a fan who had been looking the other way and did not see the puck that was shot in his direction. He was struck in the face by it and suffered a broken nose. The manager fined the player for violation of the game rules.",q:"Which of the following statements best describes the outcome of a claim for battery made by the fan against the player?",opts:["No claim for battery exists, because by attending a hockey game, the fan assumed the risk of pucks being shot into the stands.","No claim for battery exists, because the player did not have the intent to strike the particular fan with the puck.","A claim in battery exists, because the player did intend the puck to strike someone in the crowd.","A claim in battery exists, because the player violated league rules by intentionally shooting the puck out of the playing area.","No claim in battery exists because the player did not create any reasonable apprehension of harm in the fan, as he had turned away from the rink."],ans:"C",expl:"(C) The fan will be successful in his battery action because the player had the requisite intent for battery. To establish a prima facie case for battery, the claimant must show an intentional direct application of unlawful force to the claimant's person by the defendant. Under the doctrine of transferred intent, it is sufficient that the player intended to strike someone in the crowd, even though he in fact hit someone different from the person he was aiming at. (A) is wrong because assumption of risk is not a defence to intentional torts. The fan may have assumed a risk of injury from a hockey puck's being accidentally or even negligently shot into the stands, but he did not assume the risk of a player's intentionally shooting the puck at a spectator. (B) is wrong because the player need not have intended to strike that particular fan to be liable. (D) is wrong. The fact that the player violated league rules when he shot the puck into the stands tends to establish only that a spectator does not impliedly consent to a puck's intentionally being shot at him, thus negating the defence of consent in a battery action. It does nothing to establish that the player did have the intent to commit a battery. (E) is incorrect as creation of reasonable apprehension of harm is not an element in a claim for battery. It is an element required in a claim for assault where harm is threatened but not actually carried out."},{n:13,id:"DIS107",scenario:"A claim arising from a breach of contract has failed to resolve by agreement and is currently at trial. The judge has decided to follow the typical format for trial of the case.",q:"Disregarding the consideration of any preliminary issues, what is the likely order of events of the case?",opts:["The claimant will make its opening submission and then call their witnesses, after which the defendant will make an opening submission and call their witnesses.","The defendant will make their opening submission and call their witnesses, after which the claimant will make an opening submission and call their witnesses.","The claimant will make their opening submission, then the defendant will make their opening submission, then the claimant will call its witnesses first.","The claimant will make their opening submission, then the defendant will make their opening submission, followed by the defendant calling witnesses first.","The defendant will make their opening submission, then the claimant will make their opening submission, followed by the claimant calling witnesses first."],ans:"C",expl:"(C) The trial will start with opening submissions by both barristers, usually with the claimant going first, followed by consideration of any preliminary issues (which is not relevant here, as the call of question told you to disregard), then the claimant usually will call their witnesses first. (A) is incorrect because the defendant will usually make their opening submission before the claimant calls their witnesses. (B) is incorrect because the plaintiff ordinarily makes their opening submission first, and both parties will make their opening submissions before witnesses are called. (D) is incorrect because the claimant ordinarily will call their witnesses before the defendant does. (E) is incorrect because the claimant ordinarily presents their opening submission first."},{n:14,id:"TRT117",scenario:"A householder sees that workers employed by a building company have come to her neighbour's house to paint the windows. As the workers carry out their duties, they play loud music on the radio. The work takes one day to complete. The householder is angry at the disturbance caused by the music and decides to pursue a claim in private nuisance.",q:"In relation to the householder's claim in private nuisance, which of the following is correct?",opts:["The householder is not likely to have a successful claim in nuisance because the noise disturbance only lasted for one day.","The householder is likely to have a successful claim against her neighbour in respect of the noise caused by the contractor she employed, but her damages will be minimal.","The householder could not pursue a successful claim against the workers who caused the noise because any claim would be against their employer, who would be vicariously liable for the noise.","The householder is likely to have a successful claim against the workers themselves because their noise interfered with her quiet enjoyment of her land, but her damages will be minimal.","The householder is not likely to have a successful claim in nuisance because there was no tangible damage caused to her property."],ans:"A",expl:"(A) The householder is not likely to have a successful claim. Private nuisance is an unlawful interference with the claimant's use and enjoyment of land. An interference is unlawful when it is substantial and unreasonable. Private nuisance also requires there to be a continuing state of affairs. On the facts, neither of these appear to be satisfied because the noise disturbance only lasted for one day. Therefore, she is not likely to have a successful claim. (B) is not correct. First, on the facts, there does not a
