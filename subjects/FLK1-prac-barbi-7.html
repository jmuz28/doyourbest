by a request for specific disclosure."},{n:16,id:"BSL073",scenario:"A charity is considering forming as a company limited by guarantee to take advantage of separate legal personality, and because they will not be required to have the word 'limited' at the end of the company's name.",q:"Which of the following best describes the liability of a member of a company limited by guarantee?",opts:["The members' liability is limited to any amounts outstanding on their shares.","The members are liable to contribute fully to the debts of the company at any time.","The members are liable to contribute fully to the debts of the company in the event of the company being wound up.","The members' liability is limited to the amount agreed to be guaranteed at any time.","The members' liability is limited to the amount agreed to be guaranteed in the event of the company being wound up."],ans:"E",expl:"(E) A company limited by guarantee requires its members to pay a fixed, guaranteed amount (usually £1) in the event of the company being wound up. (A) is incorrect as a company limited by guarantee has no shareholders (for obvious reasons) but the company must have at least one member (or guarantor). (B) and (C) are incorrect as a company limited by guarantee limits the liability of its members to the amount they have guaranteed on a winding up. (D) is incorrect because the guaranteed amount is not required to be paid at any time, only on the winding up of the company.",note:dr},{n:17,id:"BSL107",scenario:"After many years of successful business as a personal trainer, a sole trader was made bankrupt six months ago.",q:"Which of the following actions will the sole trader be able to take whilst they are bankrupt?",opts:["Apply for a mortgage of £100,000.","Be appointed as a director of a gym company.","Set up a personal training partnership.","Trade as a personal trainer under their spouse's name.","Apply for a job as a personal trainer."],ans:"E",expl:"(E) The bankrupt may apply for (and take) a job as a personal trainer. Bankrupts are subject to various restrictions during their bankruptcy, but they are allowed to work. (A) is incorrect as a bankrupt cannot apply for credit whilst subject to a bankruptcy order. (B) is incorrect as a bankrupt cannot act as a company director. (C) is incorrect as a bankrupt cannot be a partner. (D) is incorrect as a bankrupt cannot trade under another name without disclosure of the bankruptcy."},{n:18,id:"DIS172",scenario:"A woman issues a road accident claim for damages arising from a collision with the defendant's car. The case is allocated to the fast track. The claim is about to go to trial. The solicitor for the woman would like to cross-examine the defendant's sister-in-law, who was in the defendant's car at the time of the accident. However, the defendant's sister-in-law has indicated that she will not attend the trial because she must go to work that day.",q:"May the solicitor do anything to ensure that the defendant's sister-in-law attends the trial?",opts:["No, because the defendant's sister-in-law is not a party.","No, because the defendant's sister-in-law has a good excuse.","No, because the defendant's sister-in-law can exercise the privilege for close relatives.","Yes, the solicitor may issue a witness summons to compel attendance of the defendant's sister-in-law.","Yes, the solicitor may ask the court to issue a summons to compel attendance of the defendant's sister-in-law."],ans:"E",expl:"(E) A party may ask the court to issue a summons to compel a witness, including non-parties, to attend court to give evidence at the trial. Thus, (A) is incorrect. (B) is incorrect as well. To alleviate the burden of having to miss work, the court will require the woman to pay the witness's expenses for attending the trial and for their loss of time (that is, 'conduct money'). (C) is incorrect because there is no privilege for close relatives that allows them to refuse to give evidence. (D) is incorrect because the solicitor must ask the court to issue the summons."},{n:19,id:"DIS135",scenario:`A woman brings a breach of contract claim against a builder for £25,000, alleging that the builder failed to properly complete an extension the builder added to the woman's home. The woman claims that after she paid the builder, she discovered that the extension is smaller than agreed and used material inferior to those agreed. The builder maintains that he completed the work as agreed. Nonetheless, the builder sends the woman a Part 36 offer of £8,000. The offer's deemed service date is 1 June, and it gives the woman 21 days to accept.
The woman does not accept the offer and the claim proceeds to trial. Although the court agrees that the extension was smaller than agreed, it finds that the materials were adequate and awards the woman £7,000.`,q:"What costs order would you expect the trial judge to make?",opts:["The builder pays the woman's costs until 1 June, and the woman pays the builder's costs thereafter.","The builder pays the woman's costs until 23 June, and the woman pays the builder's costs thereafter.","The builder pays the woman's full costs because she won her claim.","The woman pays the builder's full costs because based on recovery, her damages claim was patently unreasonable.","The woman pays the builder's full costs because she won only part of her claim and the builder's offer was within 20% of the damages awarded."],ans:"B",expl:"(B) The builder likely will be ordered to pay the woman's costs until 23 June, and the woman likely will be ordered to pay the builder's costs thereafter. If a defendant makes a Part 36 offer, the claimant does not accept the offer, and the claimant wins the claim but does not beat the offer at trial, the defendant will usually be ordered to pay the claimant's costs up to the end of the relevant period of the defendant's offer, and the claimant will usually be ordered to pay the costs the defendant incurred thereafter. The relevant period is the deemed delivery date plus the time (not less than 21 days) during which the offeror says the offer may be accepted. Here, the woman the offer was to settle for was £8,000, the woman won, but was awarded only £7,000, and the relevant period ended 21 days after its 1 June deemed delivery date. (A) is incorrect because the costs shift after the end of the relevant period and not from its start. (C) is incorrect because it does not take account of the cost shifting effect of rejecting a Part 36 offer and not beating it. (D) and (E) are incorrect - the woman would not be ordered to pay all of the builder's costs for the reasons stated in these choices.",note:'The sentence beginning "Here, the woman the offer was to settle for…" is garbled in the source itself; it is kept as printed.'},{n:20,id:"BSL086",scenario:"A majority shareholder owns 60% of the 1,000 ordinary £1 shares in a company. There are four other shareholders each owning 10% of the ordinary shares of the company. A resolution is proposed to wind up the company, with the majority shareholder and two of the other shareholders in favour, and two shareholders against.",q:"Is it possible for the resolution to wind up the company to be passed?",opts:["Yes, because an ordinary resolution is required to wind up a company, and if 3 out of 5 shareholders vote in favour, then this will be enough to pass the resolution.","No, because an ordinary resolution is required to wind up a company, and if 3 out of 5 shareholders vote in favour, then this will not be enough to pass the resolution.","Yes, because a special resolution is required to wind up a company, and if 3 out of 5 shareholders vote in favour, then this will be enough to pass the resolution.","No, because a special resolution is required to wind up a company, and if 3 out of 5 shareholders vote in favour, then this will not be enough to pass the resolution.","Yes, because a special resolution is required to wind up the company, but the majority shareholder could demand a poll and the shareholders in favour would represent 80% of the votes cast, which is enough to pass the resolution."],ans:"E",expl:"(E) The decision to wind up a company must be made by special resolution. The normal method of voting at a company meeting is by a show of hands, that is, one vote per shareholder. However, it is open to five shareholders or more, or shareholders with more than 10% of the voting rights or 10% of the paid-up capital of the company to demand a poll instead. A poll changes the voting from one vote per shareholder to one vote per share. (A) and (B) are incorrect as an ordinary resolution is insufficient to wind up a company. (C) is incorrect as 3 out of 5 shareholders on a show of hands would not be enough to pass a special resolution. It would only represent 60% of the votes, and 75% is required. (D) is incorrect as, while it is correct that 3 out of 5 shareholders voting in favour will not be enough to pass the resolution, the majority shareholder has sufficient votes to demand a poll, which would change the vote from a show of hands to one vote per share.",note:dr},{n:21,id:"BSL050",scenario:"A company secretary hired cars from a third party, stating that they were for use in the company's business. However, the company secretary was lying and used the cars personally.",q:"Would the company be liable to pay for the cars?",opts:["Yes, because the company secretary had express authority to enter into a contract of this nature.","Yes, because the company secretary had implied authority to enter into a contract of this nature.","Yes, because the company secretary had apparent authority to enter into contracts of this nature.","No, because the company secretary was acting outside their authority to enter into a contract of this nature.","No, because the company secretary does not have authority to enter into contracts on behalf of a company at all."],ans:"C",expl:"(C) The company secretary's powers are usually expressly delegated by the board of directors, but their authority can also be apparent (or ostensible). This means that the company can be bound by the acts of a company secretary even if they were not authorised by the board, if the contracts the company secretary entered into were of an administrative nature, that is, of the type that a third party could reasonably assume would be within the powers of the company secretary. Case law has shown that ordering cars would fall within this. (A) is incorrect as there is nothing in the scenario to suggest that the company secretary has expressly been granted the authority to enter into this contract. (B) is incorrect because implied authority is derived from previous dealings between the parties or because the authority in question flows naturally from authority expressly given. (D) is incorrect because the company secretary was acting within their apparent (or ostensible) authority. (E) is incorrect because the company secretary has authority to enter into contracts of an administrative nature on behalf of a company."},{n:22,id:"BSL078",scenario:"A director has acted in breach of her statutory duty not to accept benefits from third parties by accepting a case of champagne from a supplier for promising to award them a lucrative new contract.",q:"Which of the following is correct?",opts:["The breach cannot be ratified.","The breach may be ratified by the rest of the board of directors.","The breach may be ratified by the shareholders by an ordinary resolution, but the vote of the director (if also a member) will be disregarded.","The breach may be ratified by the shareholders by an ordinary resolution, and the vote of the director (if also a member) will count towards the required majority.","The breach may be ratified by the shareholders by a special resolution, but the vote of the director (if also a member) will be disregarded."],ans:"C",expl:"(C) Under the provisions of the Companies Act 2006, the company can ratify conduct by a director amounting to negligence, default, breach of duty, or breach of trust in relation to the company. The decision of the company to ratify such conduct must be made by an ordinary resolution (a simple majority), and is passed only if the necessary majority is obtained, disregarding votes in favour of the resolution by the director (if a member of the company) and any member connected with him. This does not prevent the director or any such member from attending, being counted towards the quorum, and taking part in the proceedings at any meeting at which the decision is considered. (A) is incorrect as it is possible for a breach to be ratified. (B) is incorrect as it is the shareholders, not the directors, that ratify the conduct. (D) is incorrect as the vote of the director in question (if also a member) will not count towards the required majority. (E) is incorrect as it is an ordinary resolution, rather than a special resolution, that is required."},{n:23,id:"DIS065",scenario:"A client initiated a negligence action against their former solicitor in the County Court. The claim was heard before a District Judge. The client won his case, and the former solicitor would like to appeal on grounds that the District Judge wrongly applied the law.",q:"Which of the following have the power to grant permission for the appeal?",opts:["The High Court only.","The Court of Appeal only.","The District Judge that heard the case and a Circuit Judge in the County Court.","The High Court and the Court of Appeal.","The District Judge that heard the case and the High Court only."],ans:"C",expl:"(C) A party wishing to appeal must make an application to appeal in either the court where the decision was made or the court in which the appeal would be heard. Here, the case was heard by a District Judge in County Court. Cases heard by District Judges are appealed to a Circuit Judge in the County Court. Therefore, the County Court District Judge who heard the case or a County Court Circuit Judge may grant permission for the appeal here. (A), (B), and (D) are incorrect because the High Court does not hear appeals from a County Court District Judge ruling and so the High Court cannot grant permission. The same is true for the Court of Appeal. (E) is incorrect because, whilst the County Court (District Judge) may grant appeal, the High Court will not hear the case on appeal and, thus, it cannot grant permission."},{n:24,id:"DIS235",scenario:"A claimant wishes to serve a notice to her employers (defendant) requiring them to prove the authenticity of a document tendered as evidence that they have not been negligent or in breach of their statutory duty. The defendant disclosed the document as part of standard disclosure.",q:"What is the latest date on which the notice may be served?",opts:["No later than 14 days before trial or seven days after disclosure, whichever is earlier.","No later than 21 days before trial or 14 days after disclosure, whichever is earlier.","No later than the last date available for the exchange of witness statements or within seven days of disclosure, whichever is later.","No later than the last date available for the exchange of witness statements or within seven days of disclosure, whichever is earlier.","No later than the last date available for the exchange of witness statements or within 14 days of disclosure, whichever is earlier."],ans:"C",expl:"(C) The claimant must serve the notice no later than the last date available for the exchange of witness statements. If it had been the case that the defendant had served the document late in the case, after witness statement exchange, the claimant must serve the notice within seven days of disclosure. It follows that the other choices, stating different time periods, are incorrect."},{n:25,id:"DIS029",scenario:"A solicitor is outlining to his client the important component parts of the disclosure list in a fast track case before asking the client to sign the disclosure statement.",q:"Which of the following statements most accurately describes the three sections of the disclosure list?",opts:["Documents the party controls, documents that party controlled but no longer does, and a list of witnesses whom the party plans to have testify at trial.","Documents the party controls but as to which the party objects to the other party inspecting, the steps taken to conduct the search, and a list of witnesses the party plans to have testify at trial.","Documents the party controls, documents that party controlled but no longer does, and the steps taken to conduct the search.","Documents the party controls and does not object to the other party inspecting, documents the party controls but does object to the other party inspecting, and documents no longer in the party's control.","Documents the party controls, the steps taken to conduct the search, and the certification of duty."],ans:"D",expl:"(D) The three sections of the disclosure list are: documents the party controls and does not object to the other party inspecting, documents the party controls but does object to the other party inspecting, and documents no longer in the party's control. (A) is incorrect because a list of witnesses is not one of the sections. (B) is incorrect for the same reason and because the steps taken to conduct the search is part of the disclosure statement rather than the disclosure list. Thus, (C) is incorrect as well. The same is true for the certification of duty included in choice (E); it's part of the disclosure statement rather than the list."},{n:26,id:"DIS127",scenario:"A solicitor is representing a client in a personal injury claim worth £40,000. The client was injured when a display rack fell from the wall in the defendant's store and hit the claimant. The solicitor believes the defendant used bolts to mount the display that did not meet the specifications in the display's assembly instructions. To prove this, the client instructs the solicitor to hire a materials engineer whom the client happened to have business dealings with in the past. The client believes that because of their past relationship, the engineer will give evidence favourable to the client.",q:"Which of the following states the legal position with respect to the expert?",opts:["The fact that the expert has given evidence in the client's favour in the past would disqualify the expert from the present case due to potential bias.","The solicitor may instruct an expert but must seek permission from the court first.","The solicitor may not instruct an expert because the use of expert witnesses in personal injury cases is limited to complex medical malpractice issues.","The expert would owe a duty to the claimant to support the claimant's case to the best of their ability.","The solicitor may immediately instruct the expert, as each side has a right to whatever support it deems necessary to make its claim or defence."],ans:"B",expl:"(B) The solicitor may instruct an expert but must seek permission from the court first. The parties to a dispute may seek expert evidence whenever a claim involves issues that are not within the ordinary experience of the judge and the expert's special skill, knowledge, or training would help the judge to understand the issue. However, the court has the power to control the role of experts as part of the overriding objective to deal with cases at proportionate cost, and so the parties must seek permission from the court to hire an expert. Therefore, (E) is incorrect. (A) is incorrect because the mere fact that an expert has given evidence favourable to one party in the past does not mean they have the inability to act with impartiality in the present case. (C) is incorrect because experts are allowed whenever they would help the court, as indicated above. (D) is incorrect as an expert owes a duty to the court to be impartial; the expert must act with independence, integrity, and impartiality. The expert's duty is not to the party who hired the expert."},{n:27,id:"BSL186",scenario:"A company has appointed a new financial controller with instructions to save costs and increase efficiency. One suggestion the controller has made in order to improve cash flow is to delay paying suppliers until the company's customers have paid the company. The directors are concerned that this will enable the creditors to issue a winding up petition against the company.",q:"Which of the following creditors would be able to apply for the company to be wound up?",opts:["A creditor who is owed £10,000 and whose invoice has been outstanding for 21 days.","A creditor who is still owed £500 in respect of an unpaid judgment despite a bailiff's attending the company's premises.","A creditor who is owed £500 and who obtained a judgment against the company yesterday.","A creditor who has issued proceedings against the company for £1,500 in respect of an overdue debt.","A creditor who is owed £1,000 and served a statutory demand on the company 14 days ago."],ans:"B",expl:"(B) A creditor must be able to prove the company is insolvent to be able to issue a winding up petition. A creditor can prove insolvency by either: serving a statutory demand which is not paid within 21 days in respect of a debt of £750 or more, or showing that they obtained a judgment, attempted to execute the judgment, and that the debt is not fully satisfied. Here, the creditor obtained a judgment, but the bailiff nonetheless was unable to obtain full payment from the debtor. (A) is incorrect, as although the creditor is owed more than £750, the facts indicate only that the invoice was outstanding for 21 days and do not mention a statutory demand. (C) is incorrect, as although a judgment has been obtained, the creditor has not yet failed to execute the judgment. (D) is incorrect as the creditor has not yet obtained a judgment for the debt. (E) is wrong, as although the creditor has served a statutory demand, it has not been outstanding for more than 21 days."},{n:28,id:"BSL123",scenario:"A company granted a fixed charge over its premises to Bank 1, and a floating charge over all the assets of the company to Bank 2.",q:"If the company wishes to sell assets, which of the following statements best describes who must consent to the sale?",opts:["Bank 1 and Bank 2 must both consent to a sale of the premises.","Bank 1 and Bank 2 must both consent to the sale of inventory.","Only Bank 1 must consent to the sale of the premises.","Only Bank 2 must consent to sale of premises.","Only Bank 1 must consent to the sale of inventory."],ans:"C",expl:"(C) The holder of a fixed charge must give consent for the asset charged to be sold. An asset charged by way of floating charge can be freely sold until the floating charge crystallises. Therefore Bank 1 must consent to sale of the premises which are charged by way of fixed charge. (A), (B), and (D) are incorrect as a floating charge holder does not need to consent to the sale of an asset charged by way of floating charge. (E) is incorrect as the fixed charge is taken only over the premises and not over inventory."},{n:29,id:"BSL155",scenario:`Three friends set up a partnership 15 years ago. On 1 September one partner retires and is replaced the same day by a new partner. The partnership notified existing creditors of the change on 10 September; a notice was published in the London Gazette prior to the partner's retirement.
The partnership entered into two contracts to buy goods on 5 September, one with an existing supplier and one with a new supplier.`,q:"Which of the following best describes the liability of the new partner and the retiring partner?",opts:["The new partner will be liable for both debts and the retiring partner will not be liable for either debt.","The new partner will be liable for both debts and the retiring partner will be liable for both debts.","The new partner will be liable for both debts and the retiring partner will be liable for the debt to the existing supplier.","The new partner will be liable for the debt to the new supplier only and the retiring partner will be liable to the new supplier only.","The new partner will be liable for the debt to the existing supplier only and the retiring partner will be liable to the new supplier only."],ans:"C",expl:"(C) The new partner will be liable for both debts and the retiring partner will be liable for the debt to the existing supplier. A partner is liable for all debts incurred whilst they were a partner. Here, the new partner came into the partnership on 1 September and both debts were incurred on 5 September. Therefore, the new partner is liable for both debts. A retiring partner is liable for debts incurred by the partnership after they retire until the correct notice is given: existing suppliers are entitled to actual notice of retirement, whereas a notice in the London Gazette is sufficient notice for anyone who has never dealt with the partnership whilst the retiring partner was a partner. Here, a notice was published in the London Gazette on 1 September, and the contract with the new supplier was on 5 September. So, the retiring partner is not liable on that debt. On the other hand, the contract with the existing supplier was made the same day (5 September) and that supplier was not given notice until 10 September, so the retiring partner is liable on that debt. It follows that the other choices are incorrect.",note:"Source slip: the facts say the Gazette notice was published before the partner's retirement, while the explanation says it was published on 1 September. The original wording is kept."},{n:30,id:"DIS194",scenario:`A solicitor meets with a prospective client following a road traffic accident. The client tells the solicitor that after the collision, she called the police to attend. The solicitor notes this in the solicitor's file.
Sometime later, when the police report arrives, and after speaking to witnesses, the solicitor suspects that the client might not have called the police to attend. The solicitor raises this with the client, and the client apologises and says that she was confused in the aftermath of the accident, and that she had not called the police to attend.`,q:"The solicitor knows that the note must be disclosed, but is there any ground to object to inspection?",opts:["No, there are no grounds available under the facts on which to object to inspection.","Yes, the solicitor may object to inspection on the basis of legal advice privilege.","Yes, the solicitor may object to inspection on the basis that litigation privilege protects the document.","Yes, the solicitor may object to inspection on the basis that common interest privilege protects the document.","Yes, the solicitor may object to inspection on the basis that without prejudice privilege protects the document."],ans:"B",expl:"(B) The document is disclosable as it adversely affects the client's case, but the party can object to inspection on the basis of legal advice privilege, as this protects against disclosure of all documents relating to interaction between the solicitor and their client. (A) is incorrect because there is a valid objection to inspection based on legal advice privilege. (C) is incorrect because litigation privilege relates to communications with third parties (for example, experts and barristers) for purposes of preparation for trial; it does not apply to communication between a solicitor and client, which is protected by legal advice privilege. (D) is incorrect because common interest privilege applies in situations where there are multiple parties on one side of the case who send communications amongst themselves - the privilege can be asserted to prevent disclosure of those communications. (E) is incorrect because without prejudice privilege applies to communications between opposing parties with a view toward negotiation or settlement.",note:dr},{n:31,id:"BSL105",scenario:`A sole trader has been advised by an insolvency practitioner to enter into an individual voluntary arrangement ('IVA'). The sole trader owes the following amounts as unsecured debts:
£1,000 to Creditor 1
£2,000 to Creditor 2
£11,000 to Creditor 3
£25,000 to Creditor 4`,q:"Which of the following correctly represents the creditors who must vote in favour of the proposals for the IVA to be approved?",opts:["Creditors 1, 2, and 3.","Creditor 4 only.","Creditors 3 and 4.","Creditors 1, 2, and 4.","All the creditors must vote in favour."],ans:"C",expl:"(C) Approval of an IVA requires the agreement of the debtor's unsecured creditors holding at least 75% in value of unsecured debt. If such approval is obtained, the practitioner's proposals become binding on every ordinary unsecured creditor who has notice of the meeting. Creditors 3 and 4 are needed to hit the 75% threshold. (A) and (B) are incorrect because although these choices include 75% of the number of creditors, together they do not hold 75% of the outstanding debt, which is what is required. (B) is incorrect because although Creditor 4 is the largest creditor, alone (B) does not hold 75% in value of the debt. (E) is incorrect as not all of the creditors must vote in favour - it is sufficient to have only 75% in value. Thus, Creditors 1 and 2 need not vote in favour.",note:`The answer screen prints the ID as 'BSL 105'. Source slip: the explanation does not address (D), and its first sentence on (A) and (B) refers to "75% of the number of creditors", which fits (A) and (D) rather than (B). The original wording is kept.`},{n:32,id:"DIS260",scenario:"A client is considering initiating a claim against his former accountant. The client knows that the accountant will dispute the claim, and asks their solicitor what the burden of proof is in a civil dispute.",q:"What should the solicitor tell the client?",opts:["The accountant will be required to disprove the allegation beyond reasonable doubt.","The accountant will be required to disprove the allegation on the balance of probabilities.","All burdens will be on the accountant.","The client will be required to prove the allegation on the balance of probabilities.","The client will be required to prove the allegation beyond reasonable doubt."],ans:"D",expl:"(D) The client will be required to prove the allegations on the balance of probabilities. (A), (B), (C), and (E) are incorrect as the claimant needs to prove the allegation on the balance of probabilities."},{n:33,id:"BSL131",scenario:"A company grants a charge over its premises to secure a loan being made by its bank.",q:"Which of the following best describes the filing requirements at Companies House following the grant of the charge?",opts:["A copy of the charge, the requisite form, and the fee must be filed at Companies House within 15 days of the creation of the charge.","A copy of the charge, the requisite form, and the fee must be filed at Companies House within 21 days of the creation of the charge.","A copy of the charge and board resolution authorizing the charge, the requisite form, and the fee must be filed at Companies House within 15 days of the creation of the charge.","A copy of the charge and board resolution authorizing the charge, the requisite form, and the fee must be filed at Companies House within 21 days of the creation of the charge.","A copy of the charge and members' resolution authorizing the charge, the requisite form, and the fee must be filed at Companies House within 21 days of the creation of the charge."],ans:"B",expl:"(B) Following the grant of a charge, the company must file the fee, a copy of the charge, and the requisite form at Companies House within 21 days. (A) and (C) are incorrect as they have the wrong deadline for filing. (C) is also wrong because there is no requirement that a board resolution be filed too. (E) is incorrect because the members don't approve charges and so there is no need to file a members' resolution.",note:"Source slip: the explanation does not address option (D). The original wording is kept."},{n:34,id:"BSL134",scenario:"A private limited company was incorporated with the Companies (Model Articles) Regulations 2008 ('the Model Articles') as its articles of association. The company has issued new ordinary shares to a new investor in order to raise more capital for expansion.",q:"What must be filed with the Registrar of Companies following the issue of the new shares?",opts:["A Return of Allotment of Shares form, together with the members' special resolution disapplying pre-emption rights only.","The minutes of the board meeting at which the directors resolved to issue the shares only.","The minutes of the members' meeting at which the special resolution to disapply the pre-emption rights was passed only.","A Return of Allotment of Shares form, together with the members' special resolution disapplying pre-emption rights, and the board resolution to issue the new shares only.","A Return of Allotment of Shares form, together with the members' special resolution disapplying pre-emption rights, and the ordinary resolution giving the directors the power to allot shares."],ans:"A",expl:"(A) The Return of Allotment of Shares form together with any necessary shareholders' resolutions must be filed with the Registrar of Companies following the issue of new shares. When a company issues additional ordinary shares for cash after the initial share allotment, the existing shareholders have a pre-emption right to purchase a proportional amount of the new shares to allow them to maintain their current ownership interest in the company. Since the shares here were issued to a new investor, the members also had to pass a special resolution to disapply the statutory pre-emption rights. Thus, that resolution had to be filed too. (B) and (D) are incorrect as board minutes are not filed with the Registrar of Companies. (C) is incorrect as minutes of general meetings are not filed with the Registrar of Companies. (E) is incorrect as the directors already have power to allot shares if the company has only one class of shares and is issuing the same class of shares."},{n:35,id:"BSL169",scenario:"A company went into creditors' voluntary liquidation last year. The liquidator is now finalising the amount available for unsecured creditors. The liquidator has realised £500,000 and has incurred costs of £75,000. The preferential creditors are owed £66,000 and the unsecured creditors are owed £1,500,000.",q:"How much will unsecured creditors receive?",opts:["£1,500,000","£500,000","£434,000","£425,000","£359,000"],ans:"E",expl:"(E) The unsecured creditors will split £359,000. The liquidator must pay back the creditors of the company in a set order. First, the liquidator must subtract the expenses of winding up (including the liquidator's costs). Then, the preferential debts are paid. The unsecured creditors are next in the order of priority for distribution. Thus, here we subtract the £75,000 in expenses and the £66,000 needed to pay the preferred creditors from the £500,000 the liquidator realised. (A) is incorrect because it reflects the whole amount owed to the unsecured creditors and they will receive only what is left after paying expenses and preferred creditors, as explained above. (B) is incorrect because it does not subtract out either the expenses or the amount needed to pay the preferred creditors. (C) is incorrect because it is subtracting out only the amount needed to pay the preferred creditors. (D) is incorrect because it is subtracting out only the £75,000 needed to pay the liquidator's expenses."},{n:36,id:"DIS180",scenario:"A patient brings a claim against his doctor. The patient alleges that the doctor negligently performed a surgery, leaving the patient with a lifetime disability. During the course of the litigation, the doctor has failed to comply with the appropriate protocol on several occasions. The patient eventually prevails in the case, and the judge is now assessing costs.",q:"On which basis are costs most likely to be assessed?",opts:["The standard basis, meaning that the court will not consider proportionality of the costs.","The standard basis, meaning that the court will consider proportionality of the costs.","The indemnity basis, meaning that the court will not consider proportionality of the costs.","The indemnity basis, meaning that the court will consider proportionality when awarding costs.","The indemnity basis, meaning that the court will not consider proportionality and will award costs even if it was unreasonable for the solicitor to do the work at all."],ans:"C",expl:"(C) When a party fails to follow the protocol, the judge is likely to award costs on the indemnity basis. The court will not consider proportionality - meaning that the costs incurred would be proportional to the needs of the case. The effect is that it is difficult for the paying party to object to a particular cost unless it can claim that it was unreasonable for the solicitor to do the work at all. (A) is incorrect because, firstly, the judge is likely to award costs under the indemnity basis and not the standard basis, because the doctor failed to follow the protocol. Secondly, the judge will consider proportionality when using the standard basis. (B) is incorrect. Although the answer correctly identifies the effect of using the standard basis, in that proportionality will be considered, the standard basis is unlikely to be used under these facts. (D) is incorrect. When using the indemnity basis, proportionality is not considered. (E) is incorrect. Although it is true that proportionality will not be considered, the paying party might be able to avoid paying a cost if they can show it was unreasonable for the solicitor to do the work at all.",note:'The question screen reads "accessed"; this has been corrected to "assessed".'}],Fi="The OCR placed some option texts before their letters on this screen; the options are shown in the order confirmed by the answer screen.",ik=[{n:1,id:"BSL124",scenario:"A company was incorporated several years ago with the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association. The company is currently valued at £5 million and wishes to borrow £1 million to acquire new premises. The loan will be secured by a fixed charge over the premises.",q:"Which of the following best describes the procedure necessary to borrow the money?",opts:["The board may resolve to enter the loan and grant the charge without shareholder approval.","The board may resolve to enter the loan and grant the charge only after the shareholders have approved the terms of the loan.","The shareholders may resolve to enter the loan and grant the charge without board approval.","The board may resolve to enter the loan only after the shareholders resolve to grant the charge.","The finance director has the power to enter the loan and grant the charge without approval of the board or the shareholders."],ans:"A",expl:"(A) Unless there are any restrictions in the articles (unamended Model Articles do not include any), the board has the power to borrow money. Therefore, a board resolution is all that will be needed to enter the loan and grant the charge. No shareholder approval is needed. Therefore, (B), (C), and (D) are incorrect. (E) is wrong because we do not have facts to support it. Decisions can be delegated to an individual director by the board, but nothing in the facts indicates that the board delegated its power here."},{n:2,id:"BSL136",scenario:"A private limited company was incorporated on 1st January two years ago with the Companies (Model Articles) Regulations 2008 ('the Model Articles') as its articles of association. The company's accounting reference date is changed to 30 September. The company is classed as a small company.",q:"What is the latest date it can file its annual accounts?",opts:["31st December","1st January","30th June","1st July","31st July"],ans:"C",expl:"(C) A private company should file its accounts no later than nine months after the relevant accounting reference period. (A) and (B) are incorrect as the date of filing is not linked to the date of incorporation, but to the accounting reference period. 30 June is nine months after 30 September. It follows that none of the other choices is correct.",note:'The word "not" is displaced to the end of the explanation on the answer screen; it has been restored to its place in the sentence.'},{n:3,id:"PRP109",scenario:`A couple are buying a large, old property and have had a survey carried out which has stated as follows:
'A listed building which was extended 11 years ago by the current owner to include a single-storey lounge extension at the rear.'
The solicitor's search has revealed no planning permissions or listed building consent relating to the property.`,q:"What advice should the solicitor acting for the couple give in relation to this issue?",opts:["As the extension referred to is only single-storey, it will fall within the permitted development rules, so no express planning permission or listed building consent was required to build the extension.","As the property is a listed building, the single-storey extension required both planning permission and listed building consent, but the time for enforcement has passed.","As the property is a listed building, the single-storey extension required only listed building consent, but the time for enforcement passed seven years ago.","As the property is a listed building, the single-storey extension required listed building consent, but the time for enforcement passed one year ago.","As the property is a listed building, the single-storey extension required both planning permission and listed building consent, and the local authority may bring an enforcement action at any time."],ans:"E",expl:"(E) The solicitor should advise that because the property is a listed building, the extension required both planning permission and listed building consent, and the authority may bring an enforcement action at any time. Listed buildings are buildings on a statutory list because of their special architectural or historical qualities. Most work to a listed building requires both planning permission and listed building consent. Building work would certainly require such consents and there is no time limit for enforcement. Thus, (B) is incorrect. (A) is incorrect, as the permitted development rules do not apply to listed buildings. (C) is incorrect, as the extension requires both planning permission and listed building consent. (D) is incorrect because it incorrectly provides that the enforcement period is 10 years."},{n:4,id:"PRP035",scenario:"A solicitor is acting for a first-time buyer whose parents are gifting him the 10% deposit. The buyer has mentioned that his parents have concerns about the deposit arrangement and would like to speak to a solicitor. The son has asked his solicitor to represent his parents as well for convenience.",q:"How should the solicitor respond to this request?",opts:["The solicitor should agree to act for the parents in addition to the son since the parties' interests are the same.","The solicitor should decline to act for the parents due to the risk of a conflict of interest.","The solicitor should agree to act for the parents because the parents are considered a 'lender' to the buyer.","The solicitor should cease acting for the son and decline to act for the parents due to the risk of a conflict of interest.","The solicitor should agree to act for the parents because the solicitor must act in accordance with the son's instructions."],ans:"B",expl:"(B) The solicitor should decline to act for the parents due to the risk of a conflict of interest. A solicitor must avoid a conflict of interest or 'significant risk' of a conflict of interest between two or more clients on a transaction. A conflict of interest can arise if someone is gifting a deposit to the buyer of a property and a solicitor should, therefore, avoid acting for both parties. Here, the parents have expressed concerns about the deposit arrangement, which indicates a significant risk that a potential conflict could arise. Thus, the solicitor should decline to act for the parents. (A) is incorrect because, as explained above, the parents' and the son's interests could come into conflict in this transaction and the solicitor should therefore decline to act for the parents. (C) is incorrect because there is no indication of a lending relationship here; the parents are gifting the deposit. Further, whether or not the parents are considered a 'lender' does not remove the risk of a potential conflict arising, which the solicitor must avoid. (D) is incorrect because the solicitor does not need to cease representation of the son. The solicitor needs only to avoid the significant risk of a conflict arising by declining to represent the parents in addition to the son. (E) is incorrect because, as explained above, the solicitor must avoid a conflict of interest and must decline to represent the parents despite the son's request."},{n:5,id:"LAN102",scenario:"A woman has exchanged contracts regarding the sale of her property. The contract included a fittings and contents form upon which the woman indicated that she was removing the ornamental shrubs and two small trees from the garden at the property. On the day of completion, the buyer attends the property and tells the woman that she is not entitled to remove the shrubs and trees from the property.",q:"Is the buyer correct?",opts:["Yes, because the trees and shrubs form part of the land and must be left at the property on completion.","No, the woman can remove the shrubs and trees because the fittings and contents form forms part of the contract.","Yes, because the trees and shrubs are personal property and can be removed on completion.","No, because the property must be left in the same condition as it was on exchange of contracts.","Yes, due to the degree of annexation, the trees and shrubs form part of the land."],ans:"B",expl:"(B) Although the trees and shrubs do form part of the land, the woman has indicated on the fittings and contents form that they will be removed, and as this forms part of the contract, she is entitled to take the specified items. (A) is incorrect because the fittings and contents form supersedes the basic legal position. (C) is incorrect because the trees and shrubs are not personal property, they form part of the land. (D) is incorrect because the fittings and contents form permits the woman to remove the trees and shrubs. (E) is incorrect. The degree of annexation is one of the tests to be applied if it is not possible to distinguish between a fixture and a fitting whereas trees and shrubs are, by definition, part of the land.",note:'Option (C) was checked against the page image; it does begin "Yes", as shown.'},{n:6,id:"LAN009",scenario:"A solicitor is advising a client who is selling part of some farmland which the client owns. The client wants a right of way over the land he is selling.",q:"Which of the following states the legal position with respect to the right of way?",opts:["Easements implied by existing use may continue by reservation to the seller.","Easements may be reserved impliedly to the buyer.","The contract for the sale of the land will automatically reserve appropriate rights over the land being sold.","The seller must expressly reserve any easements he wishes to retain over the land he is to sell.","The seller will retain all of the rights he may need by virtue of section 62 of the Law of Property Act 1925."],ans:"D",expl:"(D) The seller must expressly reserve any easements he wishes to retain over the land he is to sell. A seller should always specifically consider the rights required on a sale and the seller's solicitor should draft them, rather than seek to rely on implied easements. (A) is incorrect because easements implied by existing use on a sale of part of a landholding are in favour of the land being acquired (not the land being retained by the seller). (B) is incorrect because it is nonsensical (sellers, not buyers, reserve easements). (C) is incorrect because the contract for the sale of land (for example, the widely used Standard Conditions of Sale) does not automatically reserve any such rights in favour of a seller. (E) is incorrect because there can be no implied reservation of easements in favour of the land being retained by the seller on a sale of part by virtue of section 62. Section 62 operates only to grant necessary rights for the benefit of the land being sold off; it does not apply to any reservation of rights needed by the seller.",note:"The OCR of the facts was garbled; they were read from the page image."},{n:7,id:"BSL114",scenario:"A company supplies eco-friendly nail products to customers so they can achieve salon-style nails at home. Eighteen months ago, the company borrowed money from a director to buy an electric delivery van. The business has struggled financially over the last few months, and the board decide to repay the loan to the director whilst they have the cash to do so. The company has also paid a creditor who issued a statutory demand against the company and threatened to put the company into liquidation if the debt was not paid.",q:"Could either of these two transactions amount to a preference if the company goes into liquidation or administration within six months of the payments?",opts:["Yes, both the transactions are likely to be preferences, as they came within the relevant time period.","No, neither of the transactions is likely to be a preference, as they occurred outside the relevant time period.","The payment to the director could amount to a preference but not the payment to the outside creditor, as a payment to an unconnected third party never is a preference.","The payment of the outside creditor could be a preference but not the payment to the director, as a payment to the outside creditor came within the relevant time period but the payment to the director did not.","The payment to the director could amount to a preference but not the payment of the debt, as the payment to the outside creditor does not show any intention to prefer."],ans:"E",expl:"(E) A preference arises where one person is preferred by a company, that is, where one person has been paid ahead of other creditors or put in a better position on insolvent liquidation or administration. However, for a payment to constitute a preference, the company must have desired to prefer the creditor. Here, the facts made it clear the company had a desire to favour the director, but the company was more or less forced to pay the outside creditor, because they had issued a statutory demand. (A) is incorrect. While it is true that both transactions came within the relevant time period (two years for connected persons, six months for others) as explained above, the payment to the outside creditor was not a preference because the company did not have an intention to prefer the outside creditor. (B) is incorrect. Again, the time period is not a problem, but as explained above, the payment to the director likely is a preference because it was made with a desire to prefer the director. (C) is incorrect as a company can enter into a preference with an unconnected third party if they make a payment to the third party with a desire to prefer them and that puts the third party in a better position than they otherwise would have been in liquidation. (D) is incorrect because both payments were made within the relevant time period."},{n:8,id:"LAN097",scenario:"A husband is the sole registered proprietor of a matrimonial home he lives in with his wife. The wife contributed a portion of the home's purchase price. The husband now wishes to take out a mortgage over the property for the purposes of his business. A bank agrees to provide him the mortgage.",q:"Which of the following is a requirement that must be satisfied prior to the bank's completion of the mortgage?",opts:["The wife must be given full financial information.","The husband and wife must choose a solicitor to represent both of them in the process.","The wife must be a registered proprietor of the home for the husband to take out a mortgage over the property.","The husband must not have any existing loans in his sole name that are secured by the same property.","The wife must remove any registered home right notice on the property's register of title."],ans:"A",expl:"(A) One requirement that must be satisfied prior to the bank's completion of the mortgage is that the wife must be given full financial information. If a mortgagee is lending money for a purpose other than the acquisition of the property (for example, to finance one spouse's business), the other spouse is effectively acting as guarantor of the spouse's debts. As such, that spouse must be separately represented by another solicitor and given full financial information. These requirements are designed to protect the spouse who is not a registered proprietor of the marital home. Here, since the bank is lending money to finance the husband's business, the wife must be given full financial information prior to completion of the mortgage. (B) is incorrect because, as explained above, one requirement is that the husband and wife must be represented by separate solicitors. (C) is incorrect because the wife need not be a registered proprietor of the home for the husband to take out a mortgage. The creditor must satisfy itself, though, that she understands the implications of the transaction in a meaningful way. (D) and (E) are incorrect because no such requirements apply in this situation."},{n:9,id:"LAN098",scenario:"A man has recently inherited his late mother's house. The man has confirmed that the title to his mother's house is unregistered. He cannot locate the title deeds to the house. The man wishes to sell the house and, on the advice of his solicitor, agrees to the making of an application to Her Majesty's Land Registry ('HMLR') prior to the property being marketed.",q:"Which of the following best describes the title that HMLR is likely to award the man in these circumstances?",opts:["Title absolute.","Gift title.","Qualified title.","Good leasehold title.","Possessory title."],ans:"E",expl:"(E) It is likely that HMLR will only award a possessory title when presented with the application for first registration based on lost deeds. Possessory title is a class of title based on factual possession of the land rather than documentary evidence. It might be granted, for example, when the title deeds have been lost. Possessory title can later be upgraded to title absolute if the Registered Proprietor can show that the possessory title has not been challenged for 12 years since it was granted. (A) is incorrect because title absolute will not be granted in this circumstance since the title deeds cannot be produced. (B) is incorrect because there is no such class of title. (C) is incorrect because it is not applicable here. Qualified title is rare in practice and is awarded when a specified interest is excepted from the effect of registration and is therefore not covered by the guarantee of title which would otherwise be available. (D) is incorrect because this class of title would be granted if the freehold title is not produced when an application is made to register a leasehold title."},{n:10,id:"LAN131",scenario:"A father is the sole registered proprietor of a property. His daughter contributed the full purchase price of £200,000 when the property was purchased and the father contributed nothing. The father and daughter entered into a declaration of trust to reflect this arrangement. The property is now being sold for £250,000.",q:"How will the sale proceeds be distributed?",opts:["£200,000 will pass to the daughter and £50,000 to the father.","£125,000 will pass to each party.","£250,000 will pass to the father.","£200,000 will pass to the father and £50,000 to the daughter.","£250,000 will pass to the daughter."],ans:"E",expl:"(E) In distribution of the sale proceeds, £250,000 will pass to the daughter. A declaration of trust sets out the agreement between co-owners as to how their beneficial interest is held, which dictates how sale proceeds will be split upon an eventual sale of the property. Here, the daughter contributed 100% of the purchase price and the father contributed 0%. Thus, the daughter is entitled to the full sale proceeds upon sale, which means £250,000 will pass to her. (A) through (D) are incorrect because, as explained above, the daughter is entitled to the full amount of sale proceeds. Though he is the registered proprietor, the father is not entitled to any portion of the proceeds. He is holding the property on behalf of his daughter as a bare trustee. The declaration of trust is conclusive as to the agreement between the co-owners as to the beneficial interest.",note:Fi},{n:11,id:"PRP091",scenario:"An unmarried couple have had an offer accepted to purchase a property which they wish to use as their home. When they viewed the property, the couple met the seller, who is a single woman and the sole registered proprietor. When the couple visited their solicitor to discuss the purchase, they mentioned the fact that they had seen some men's shoes by the front door and some large coats and suits in a wardrobe. They wondered whether somebody else was living at the property with the seller.",q:"How will the couple's solicitor discover who is living at the property?",opts:["By looking at the Property Information Form and advising their clients to physically inspect the property.","By looking at the Leasehold Information Form and carrying out a local search.","By looking at the Property Information Form and advising their clients to have a survey carried out.","The solicitor will visit the property to establish whether any occupiers are living there.","By looking at the special conditions on the draft contract to see if an occupier has been declared."],ans:"A",expl:"(A) The seller is required to disclose the presence of any occupiers on the property information form, and the solicitor will advise their buyer client to physically inspect the property again. (B) is incorrect. The leasehold information form does not contain details of occupiers, and the local search is not relevant in this case. (C) is incorrect as the purpose of a survey is to establish the physical condition of the property and not who lives there. (D) is incorrect as a solicitor does not typically visit the property to establish whether there are any occupiers; it typically is up to the buyers to double check what is provided on the property information form regarding occupiers. (E) is incorrect. Once the solicitor has established whether there are any occupiers by looking at the property information form and advising their client to physically inspect, they will then raise an additional enquiry of the seller's solicitor seeking assurance that the occupier will sign the relevant special condition on the draft contract."},{n:12,id:"PRP108",scenario:"A solicitor is acting for the buyer of a residential dwelling. The Property Information Form indicates that the seller converted a single dwelling house into a house with a separate shop at the front, on the first floor. This was ideal for the buyer because she is the sole proprietor of a tailoring business, and the shop is in a good location for the business. The work was carried out six years ago. The solicitor's local search has revealed no planning permissions relating to the property.",q:"What advice should the solicitor give their client with respect to the conversion?",opts:["That the conversion constituted a material change of use and the local authority still has four years to take enforcement action.","That the conversion constituted a material change of use and the local authority still has 10 years to take enforcement action.","That the conversion constituted a material change of use and that the local authority has an unlimited period of time to take enforcement action.","That the conversion constituted a material change of use, but the buyer should not be concerned because the work was carried out by the seller.","That the conversion constituted a material change of use, but the buyer should not be concerned because the local authority can no longer take enforcement action."],ans:"A",expl:"(A) The solicitor should advise the client that the conversion constituted a material change of use and the local authority still has four years to take enforcement action. The time limit for enforcement in relation to a material change of use is 10 years. The question indicates that the work was done six years ago, which leaves a further four years for enforcement action. (B) is incorrect, as the enforcement period is 10 years from the first breach, which happened six years ago. (C) is incorrect, as the local authority has only 10 years to take enforcement action; their remit is not unlimited. (D) is incorrect as planning problems run with the property and not with the property owner. Accordingly, the local authority could pursue the current buyer/owner to correct the problem created by the work carried out by the previous seller. (E) is incorrect because, as explained, on our facts, the local authority still has four years to take enforcement action."},{n:13,id:"LAN121",scenario:"The owner of a property with registered title has taken a shortcut to the public highway by walking through their neighbour's woodland for the last five years. When challenged by the neighbour, the owner went to see their solicitor, because they were convinced that their property enjoyed a right-of-way over the woodland.",q:"How would a right of way be evidenced on the owner's title?",opts:["It would appear as a restriction on the proprietorship register.","It would appear as a notice on the charges register.","It would appear as a restriction on the property register.","It would appear as a notice on the property register.","It would not matter because the owner has acquired right by prescription."],ans:"D",expl:"(D) A right which benefits a property appears on the property register of the title taking the benefit. Thus, all of the other answers are incorrect."},{n:14,id:"PRP088",scenario:"A woman is acting as attorney for her elderly mother in the purchase of a brand-new retirement flat. The woman has been to view the property. She believes it is perfect for her mother as it has a large, communal garden and a warden on site. However, the woman is concerned because she thinks that the land upon which the development is being built was formerly used as a petrol station. She telephones the solicitor she instructed for the purchase to express her concern.",q:"What will the solicitor do to address the woman's concerns?",opts:["The solicitor will carry out a local search.","The solicitor will carry out a contaminated land search.","The solicitor will carry out an environmental search.","The solicitor will carry out a drainage and water search.","The solicitor will advise their client to physically inspect the property."],ans:"C",expl:"(C) An environmental search should be carried out on every purchase and will reveal whether the land upon which the property is being built has ever been put to contaminative use. (A) is incorrect. Although a local search will be carried out on every purchase, it will not address the woman's concerns. The first part of a local search reveals whether there are registrations by the local authority in the land charges register. The second part is a standard set of enquiries of the local authority which include enquiries about roads fronting the property, public rights of way, and planning entries and building regulations relevant to the property. A local search may also include optional enquiries, but none of the enquiries deal with contaminative land use. (B) is incorrect, as there is no search with this name. (D) is incorrect, as drainage and water search reveals only whether the property is connected to public water and foul water drainage services. (E) is incorrect. Physical inspection is considered to be part of the pre-contract searches, but it would not reveal the former use of the land for contaminative uses, as evidence of such use usually is buried in the land itself.",note:Fi},{n:15,id:"ETH053",scenario:"A solicitor has acted for a limited company, which manufactures furniture, for a number of years, advising on various business matters. The owning shareholders of the company are three siblings. They are also the three directors. Two of the directors work full-time in the business. The third is a non-executive director who is not employed by the company, and does not work in the business. The non-executive director claims that he is being pushed out of the company because the other directors have decided that all profits are to be paid out in salaries to the working directors, and no dividends are to be paid to shareholders. The non-executive director seeks advice.",q:"Which of the following best describes how the solicitor should proceed?",opts:["The solicitor can advise the non-executive director because he is a shareholder in the company.","The solicitor can advise the non-executive director because he is a director of the client, namely the limited company.","The solicitor can advise the non-executive director if the other two directors consent.","The solicitor cannot advise the non-executive director because there is a conflict of interest with the company.","The solicitor cannot advise the non-executive director because there is a conflict of interest between the directors."],ans:"D",expl:"(D) The client is the limited company, a separate legal entity. The conflict of interest would be between the non-executive director and the company. (E) could be correct, if all three directors were also clients of the firm, but this does not necessarily follow from acting for the company. (A) and (B) are incorrect because the client is the company. The solicitor should not give advice to the non-executive director where there is a conflict between the non-executive director and the company. (C) is incorrect because neither of the limited exceptions to client conflicts of interest apply."},{n:16,id:"LAN113",scenario:`Two people swap unsigned text messages which contain the following message:
"I agree to sell you 32 Acacia Avenue, Reading, for £250,000, if you agree to complete by Friday."
"I agree to buy 32 Acacia Avenue, Reading, from you for £250,000, and we will complete this coming Friday".`,q:"Have the parties entered into a valid contract for the sale and purchase of 32 Acacia Avenue?",opts:["Yes, because the text messages are in writing, which is sufficient to create a contract for the sale of land.","No, because there is no acceptance sufficient to create contract for the sale of land.","Yes, because all of the elements of a valid contract for the sale of land are present.","No, because a contract for the sale of land must be in writing and signed by both parties.","Yes, because the sale of land may be effected through electronic means."],ans:"D",expl:"(D) In addition to the usual requirements, a contract for the sale of land must be in writing and signed by both parties. The text messages likely qualify as writing but nothing in the facts indicates that the signature requirement was satisfied by a form of electronic signature. (A) is correct as far as it goes, but it does not address the lack of a valid signature. (B) is incorrect because the second text is a sufficient acceptance as it agrees to each term of the offer. (C) is incorrect due to the lack of valid signatures from both parties, which is a necessary element of a contract for the sale of land. (E) is incorrect because whilst it might be true, again, there was no signature here."},{n:17,id:"PRP076",scenario:"A solicitor acting for a buyer of a property has investigated the unregistered title produced by the seller's solicitor as part of the contract package. The solicitor has noted that the root of title shows Peter Green and Brenda French as the buyers. The sellers in the draft contract are shown as Peter Green and Brenda Green. The buyer's solicitor raises a pre-contract enquiry asking the seller's solicitor to remedy the break in the chain of ownership. Peter and Brenda married after they purchase the property.",q:"What is the most likely solution to resolve this issue?",opts:["A transfer between the named parties.","A deed of change of name for Brenda French.","A passport or other suitable identification document for Brenda French.","The marriage certificate between Peter Green and Brenda French.","A statutory declaration by Brenda French."],ans:"D",expl:"(D) The easiest way to resolve the issue is by obtaining and producing a copy of the marriage certificate for Peter and Brenda, as that would be sufficient explanation for the change of name from Brenda French to Brenda Green. (A) and (B) could be possible solutions in other circumstances (Peter might have transferred the property into the joint names of himself and Brenda; Brenda might have changed her name) but here, you are told that the parties got married, so the most likely solution for this issue is to produce a copy of the marriage certificate. (C) is incorrect as a passport is not a document of title. (E) is incorrect because a statutory declaration would not deal with a change of name."},{n:18,id:"BSL178",scenario:"A delicatessen has been operated successfully for several years by a sole trader. A few months ago, a large supermarket opened close to the trader's business premises. As a result, the trader has lost business and now is unable to pay debts as they become due.",q:"Who of the following could apply to make the trader bankrupt?",opts:["A baker who is owed £3,000.","A cooked meats supplier who is owed £2,000.","The trader's spouse, who is worried about the extent of the trader's trade debts.","The trader's bank, who is owed £6,000 on a loan secured by a fixed charge over the business premises.","A local beekeeper who is owed £5,000 for honey."],ans:"E",expl:"(E) One or more unsecured creditors who is/are owed at least £5,000 combined can present a petition for an order of bankruptcy to the bankruptcy court. (C) is incorrect as a debtor can apply online to declare themself bankrupt, but their spouse cannot. (A) and (B) are incorrect as the unsecured creditors here are not owed enough. (D) is incorrect as a secured creditor cannot apply for a bankruptcy order.",note:`${Fi} Source slip: the explanation says one or more unsecured creditors owed at least £5,000 "combined" can petition, yet treats the baker (£3,000) and the meats supplier (£2,000), who together are owed £5,000, as not owed enough. The original wording is kept.`},{n:19,id:"BSL132",scenario:"A company has just appointed a new non-executive director by ordinary resolution of the members.",q:"What must be filed at Companies House in respect of the director's appointment?",opts:["The ordinary resolution to appoint the director within 15 days.","The ordinary resolution to appoint the director within 14 days.","The Appointment of Director form within 15 days.","The Appointment of Director form within 14 days.","The service contract of the director within 14 days."],ans:"D",expl:"(D) Following the appointment of a director, the Appointment of Director form must be filed at Companies House within 14 days. (A) and (B) are incorrect as an ordinary resolution to appoint a director is not filed at Companies House. (C) is incorrect as the deadline is 14 days, not 15 days. (E) is incorrect as a non-executive director does not have a service contract, and in any event a service contract is not filed at Companies House.",note:"The answer screen prints the ID as 'BSL 132'."},{n:20,id:"LAN059",scenario:"A shop owner held a lease of a shop situated on a pier at the seaside. During a bad storm, the pier collapsed into the sea. The pier owner has made it clear that they are not going to rebuild the pier. The shop owner's lease still has two years left to run and the shop owner's landlord is trying to recover rent from the shop owner. The shop owner goes to see his solicitor for advice as the lease makes no provision for these circumstances.",q:"Which of the following best describes the advice that the solicitor will give to the shop owner?",opts:["The shop owner will be liable to pay the rent for the next two years because the lease term has not expired.","The shop owner will be liable to pay the rent because it is the shop owner's responsibility to ensure the pier is rebuilt.","The shop owner will not be liable to pay the rent because the lease has come to an end by frustration.","The shop owner will not be liable to pay the rent because he can sue the landlord for breaching the covenant for quiet enjoyment.","The shop owner will not be liable to pay the rent because the lease has come to an end by forfeiture."],ans:"C",expl:"(C) The shop owner will not be liable to pay the rent because the lease has come to an end by frustration. The doctrine of frustration brings to an end a party's obligations under a contract if an event occurs due to the fault of neither party rendering the contract impossible to perform. Normally a lease will make provision for the party's rights and obligations if the premises can no longer be occupied, but this was not included in the shop owner's lease. Though frustration rarely applies to leases in practice, here, the pier's collapse has rendered the shop owner's lease impossible to perform. Thus, the shop owner is no longer liable for the rent. (A) is incorrect because, as explained above, frustration will bring the lease to an end, so the shop owner's liability to pay rent has come to an end. (B) is incorrect because, as explained above, the shop owner will not be liable for rent. Neither of the parties to the lease - the shop owner nor the landlord - is responsible for the event that has made the contract impossible to perform. The shop owner is not responsible for ensuring the pier is rebuilt. (D) is incorrect because quiet enjoyment is not relevant here. Quiet enjoyment is an obligation imposed on the landlord such that the landlord must not interfere physically or in any other way with the tenant's enjoyment of the property. (E) is incorrect because forfeiture is not relevant here. Forfeiture is the method by which the landlord brings a lease to an end due to breach of covenant. Neither the shop owner nor the landlord has breached a covenant here. As explained above, frustration has made the lease impossible to perform."},{n:21,id:"LAN037",scenario:"In 1975, a landowner sold Blackacre to a buyer by way of conveyance. This transaction did not trigger first registration of the title. In that conveyance, the landowner imposed a covenant on Blackacre not to build more than one dwelling on the land. The buyer has now sold Blackacre to a developer who wants to build three houses on Blackacre. The developer's solicitor carried out a full land charges search and it revealed a D(ii) restrictive covenant charge registered against the name of the 1975 buyer.",q:"Is the developer bound by the landowner's covenant?",opts:["Yes, because registration of the covenant as a D(ii) restrictive covenant land charge constitutes notice of it.","No, because the covenant should have been registered as a C(i) puisne mortgage land charge.","Yes, because the covenant will appear on the charges register of the title following first registration of title.","Yes, because the developer's solicitor saw the covenant in the 1975 conveyance, which constitutes actual notice to the developer.","No, because the title to Blackacre is not registered."],ans:"A",expl:"(A) The developer will be bound by the landowner's covenant because registration of the covenant as a D(ii) restrictive covenant land charge constitutes notice of it. To be enforceable against a subsequent buyer of land, equitable rights and interests, such as a restrictive covenant, must be protected by registration as land charges. Registration as a land charge constitutes actual notice to all persons of the interest or right registered, making the interest binding on all subsequent owners of the land. (B) is incorrect because a C(i) land charge protects a puisne mortgage, which is not relevant here. (C) and (D) are incorrect because it is registration as a land charge that constitutes actual notice, not the appearance of the covenant on the charges register after first registration of title or the fact that the developer's solicitor has seen the document containing the covenant. (E) is incorrect because it is irrelevant that title to Blackacre is unregistered; interests related to the property may still be binding on a subsequent buyer."},{n:22,id:"LAN079",scenario:"A buyer completed his purchase of a piece of land with unregistered title five months ago. The buyer has just discovered that his solicitor has not submitted the application for first registration to Her Majesty's Land Registry ('HMLR').",q:"Which of the following best describes the status of the land?",opts:["Title passed to the buyer on completion and is retained by the buyer.","The legal estate has reverted to the seller due to failure to register within two months of completion.","Title will pass to the buyer on registration.","The legal estate will revert to the seller if the title is not registered within six months of completion.","Title passed to the buyer upon exchange of contracts."],ans:"B",expl:"(B) The legal estate has reverted to the seller due to failure to register within two months of completion. After a triggering event (such as a conveyance on sale of freehold land), an application to HMLR for first registration of the buyer's title to the land must be made within two months of completion. Failure to register within the two-month deadline means that the transfer of the legal estate to the buyer becomes void and the legal estate reverts to the seller. Here, five months have passed since completion and the buyer's title has not been registered. Thus, the legal estate has reverted to the seller. (A) is incorrect because title to unregistered land does pass to the buyer on completion, but the title passes back to the seller if first registration does not take place within two months of completion. (C) is incorrect because this is the positi
