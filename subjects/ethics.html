solicitor may not act due to the substantial risk of a conflict of interest arising. However, if both parties gave informed consent, effective safeguards were put in place concerning protection of confidential information and the solicitor was satisfied it was reasonable to do so, acting for both parties may be possible.", "The solicitor may act provided that the proposed mortgage is a standard document that does not need to be negotiated, the Law Society/UK Finance standard certificate of title is used and it is otherwise reasonable to act. Both parties would need to give informed consent, effective safeguards would need to be put in place concerning protection of confidential information and the solicitor would need to be satisfied it is reasonable to do so."], "a": "A"}, {"ch": 6, "n": 6, "sc": ["A solicitor acts for a tenant taking a lease of a shop from a landlord who is not legally represented. The landlord has prepared the draft lease himself, and the solicitor notices that it contains drafting errors that are favourable to the tenant."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor must point out and correct each of the errors for the landlord.", "The solicitor need not highlight or remedy the specific errors, but should avoid taking unfair advantage of the landlord by pointing out the need for him to take independent legal advice.", "The solicitor should proceed to completion as quickly as possible before the landlord notices the errors.", "The solicitor must cease to act, as the landlord is unrepresented.", "The solicitor should offer to act for the landlord as well, to ensure fairness."], "a": "B"}, {"ch": 6, "n": 7, "sc": ["An unmarried couple instruct a solicitor to act for them on the joint purchase of a house that they will live in together. One partner contributes most of the deposit and handles all communication with the solicitor."], "st": "Which of the following best describes the position?", "o": ["The solicitor cannot act for both buyers, as their financial contributions differ.", "The solicitor may act for both and take instructions solely from the partner who contributed most.", "The solicitor may act for both only under the competing for the same objective exception.", "The solicitor may act for both, but need not advise on how the equitable interest should be held.", "The solicitor may usually act for both, but should obtain instructions from both clients, given the risk of undue influence, and the buyers should receive separate advice on how the equitable interest should be held."], "a": "E"}, {"ch": 6, "n": 8, "sc": ["A solicitor has acted for two unconnected clients for many years. One client agrees to sell a residential property to the other at market value, subject to contract. Both clients ask the solicitor to act for them on the sale and purchase, believing it will save time and costs."], "st": "Which of the following best describes the position?", "o": ["The solicitor should not act for both, as an arm’s length sale for value between unconnected parties is very likely to give rise to a conflict of interest, and neither exception is likely to apply.", "The solicitor may act for both, as there is an absolute right to act for long-standing clients.", "The solicitor may act for both under the substantially common interest exception.", "The solicitor may act for both under the competing for the same objective exception.", "The solicitor may act for both provided that the price has been agreed."], "a": "A"}, {"ch": 6, "n": 9, "sc": ["Two separate developers ask the same solicitor to act for them in bidding for a plot of land being sold at auction. Each developer is aware that the other intends to bid."], "st": "Which of the following best describes the position?", "o": ["The solicitor cannot act for both developers, as only one can acquire the land.", "The solicitor may act for both developers without any further conditions.", "The solicitor may act for both developers under the substantially common interest exception.", "The solicitor will usually be able to act for both developers under the competing for the same objective exception, subject to informed written consent, effective safeguards and the solicitor being satisfied it is reasonable to act.", "The solicitor may act for both developers only if they agree not to bid against each other."], "a": "D"}, {"ch": 6, "n": 10, "sc": ["A married couple jointly own their family home. The husband runs a business and the couple propose to mortgage the home to secure a loan for the husband’s business only. They ask the same solicitor to act for both of them on the mortgage."], "st": "Which of the following best describes the position?", "o": ["The solicitor may always act for joint mortgagors, as no conflict of interest arises between spouses.", "The solicitor may act for the husband only, and the wife must instruct a solicitor from a different firm in all cases.", "It may not be possible to act for both, given the potential for undue influence and conflict where the mortgage secures only one owner’s business borrowing; if the solicitor does act, the Etridge guidelines must be followed.", "The solicitor may act for both under the competing for the same objective exception.", "The solicitor may act for both provided that the lender agrees."], "a": "C"}, {"ch": 7, "n": 1, "sc": ["A solicitor completes a property transaction for a client and sends them a bill totalling £350 (inclusive of VAT and disbursements). The client sends a cheque for £350 in payment of the bill and the solicitor pays it into the firm's general client bank account."], "st": "What action, if any, should the solicitor take now with respect to this matter?", "o": ["The solicitor should wait for the cheque to clear before closing the client's property file and ledger.", "The solicitor can close the client's property file and ledger without waiting for the cheque to clear.", "Once the cheque has cleared, the solicitor should transfer £350 from the client account to the business account promptly.", "The solicitor must transfer £350 from the client account to the business account immediately, even if the cheque has not yet cleared.", "The solicitor must report the matter to the Solicitors Regulation Authority immediately as the cheque has been paid into the wrong bank account, placing client money at risk."], "a": "C"}, {"ch": 7, "n": 2, "sc": ["A trainee solicitor works for a sole practitioner firm specialising in private client work. The sole practitioner leaves the trainee in charge of the firm's trusts and probate department while she is on holiday for two months. When the sole practitioner returns from holiday, she discovers that the trainee has made some errors. During the two month period, the trainee has paid over £5,000 business money into the firm's general client bank account, and over £800,000 client money into the firm's business bank account. The trainee has also stored £20,000 cash, found in the home of a deceased client, in his filing cabinet for over a month."], "st": "What action, if any, should the sole practitioner take with respect to these issues?", "o": ["The sole practitioner should terminate the trainee's contract of employment immediately and then ensure that all money is paid or transferred into the correct bank accounts within two weeks.", "The sole practitioner should leave the money where it is for now and report the trainee to the Solicitors Regulation Authority immediately for placing client money at risk.", "The sole practitioner must ensure all money is paid or transferred correctly into the firm's client account immediately or business account promptly. She should also report herself to the Solicitors Regulation Authority for failures in supervision leading to client money being placed at risk.", "The sole practitioner should ask the trainee to pay or transfer all money into the correct bank accounts within two weeks.", "The sole practitioner should ensure all the money is paid or transferred correctly into the firm's business and client accounts promptly, and then train the trainee solicitor how to keep client money safe in the future."], "a": "C"}, {"ch": 7, "n": 3, "sc": ["A firm acts for several big educational trusts in managing their legal affairs. A junior solicitor notices some anomalies on the client ledgers of several of these trusts. There are unexplained payments to the personal bank account of one of the firm's senior partners, totalling approximately £600,000. The solicitor alerts the firm's Compliance Officer for Finance and Administration (COFA), but the COFA appears frightened and tells the solicitor to forget about the payments, without providing any explanation as to why they have been made."], "st": "What action, if any, should be taken by the junior solicitor considering the COFA's response?", "o": ["The junior solicitor should report the matter to the Solicitors Regulation Authority promptly so that they can investigate the matter.", "The junior solicitor should take no further action beyond alerting the COFA.", "The junior solicitor should ask the senior partner about the unexplained payments and request that he returns the money from his personal bank account as soon as possible.", "The junior solicitor should transfer money from the business account into the client account within the next six months to replace the unexplained payments made to the senior partner.", "The junior solicitor should take no further action for now and leave the matter for the firm's accountant to check at the end of the firm's accounting period."], "a": "A"}, {"ch": 7, "n": 4, "sc": ["Two solicitors are setting up a new law firm, in which they will become partners. Neither has had experience of managing a firm before and they are concerned about the regulatory requirements for safeguarding client money."], "st": "Which of the following statements best describes the legal position of the solicitors?", "o": ["The solicitors do not need to appoint a Compliance Officer for Finance and Administration as the firm will only have two partners.", "The solicitors should appoint a Compliance Officer for Finance and Administration so that they can pass on their responsibility for safeguarding client money to them.", "Each solicitor is only responsible for her own actions when safeguarding client money.", "Both solicitors must update themselves and provide training for their employees so that everyone has sufficient understanding of the regulatory requirements for safeguarding client money.", "The regulatory requirements for safeguarding client money only apply to the solicitors and any of the firm's employees responsible for giving legal advice to clients."], "a": "D"}, {"ch": 7, "n": 5, "sc": ["A solicitor tells a senior partner in his firm that he has reported her to the Solicitors Regulation Authority (SRA) for serious breaches of the Accounts Rules amounting to a serious failure to safeguard client money. In response, the senior partner threatens to terminate his contract of employment."], "st": "What action, if any, should the solicitor now take?", "o": ["The solicitor must look for another job as the SRA will intervene shortly to stop the firm from operating.", "The solicitor should explain to the senior partner that terminating his employment contract as a response to him reporting her to the SRA would be a further breach of the SRA's regulatory requirements.", "The solicitor should take no action for now and wait to see if his employment contract is terminated. If it is, he must report this to the Solicitors Disciplinary Tribunal.", "The solicitor must resign from his job immediately to avoid any further confrontations with the senior partner. He should then start a claim against the firm for constructive dismissal.", "The solicitor should contact the SRA to retract his earlier report to protect his job, stating that he was mistaken about any risks to client money."], "a": "B"}, {"ch": 7, "n": 6, "sc": ["A solicitor acts for the personal representatives of a deceased client. One of the personal representatives brings to the office some diamond jewellery and £800 in cash found in the deceased’s empty house, and asks the solicitor to look after them. It is late on the Friday before a bank holiday weekend."], "st": "What action should the solicitor take?", "o": ["The solicitor should keep the cash and jewellery locked in the firm’s safe over the weekend, then pay the cash into the general client account promptly and place the jewellery somewhere safe, such as a bank deposit box in the personal representatives’ names.", "The solicitor may leave the items on her desk, as the office will be locked over the weekend.", "The solicitor should pay the cash into the firm’s business account, as it will be used to pay the firm’s fees.", "The solicitor should take the items home for safekeeping over the weekend.", "The solicitor should refuse to accept the items, as solicitors cannot hold assets other than money."], "a": "A"}, {"ch": 7, "n": 7, "sc": ["A trainee solicitor receives a cheque for £2,000 from a client. Of this, £1,200 is in payment of an interim bill already sent to the client, and £800 is money on account of future costs and disbursements. The trainee pays the whole cheque into the firm’s business account."], "st": "What action, if any, should now be taken?", "o": ["No action is required, as the cheque was paid in for the firm’s fees.", "The whole £2,000 must be transferred to the client account immediately.", "The trainee must report herself to the SRA, as paying a mixed receipt into the business account is always a serious breach.", "The £800 client money element must be transferred promptly into the client account, so that client money is kept separate from business money.", "The £800 may remain in the business account until the next bill is delivered."], "a": "D"}, {"ch": 7, "n": 8, "sc": ["A solicitor acts es while he is on leave. She notices a series of payments from client ledgers to a property company that do not relate to any client matter. A search at Companies House shows that her colleague is the sole director of the company."], "st": "What action, if any, should be taken?", "o": ["The solicitor should wait until her colleague returns from leave and ask him to explain the payments.", "The solicitor should leave the matter for the firm’s accountant to identify in the next accountant’s report.", "The solicitor should report the matter to the firm’s COFA; the money wrongly withdrawn should be replaced in the client account, using business money if necessary, and the matter reported to the SRA and the police.", "The solicitor should transfer the money back to the client ledgers from the property company’s account herself.", "The solicitor should take no action, as the payments may have been authorised by the clients."], "a": "C"}]},Q=D.q,L="ABCDE";let i=0,A={};
