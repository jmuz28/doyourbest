<script>
const D={"t": ["SRA Principles", "SRA Code of Conduct", "Ethics and professional conduct in dispute resolution", "Ethics and professional conduct in business law and practice", "Ethics and professional conduct in criminal law and practice", "Ethics and professional conduct in wills and the administration of estates", "Ethics and professional conduct in property practice", "Ethics and professional conduct in solicitors' accounts"], "q": [{"ch": 0, "n": 1, "sc": ["A solicitor works in a firm, specialising in wills and probate. The solicitor is recently qualified and has little experience in practice. The solicitor is instructed by a senior partner to send drafted wills to clients, requesting their signature. When the solicitor asks about who will witness the signatures, the senior partner informs him that the solicitor and the senior partner can sign the will as witnesses when the will is returned to the firm. The senior partner identifies this as normal practice, which is affirmed by other solicitors within the firm. The solicitor does not consider his own conduct to be dishonest."], "st": "Which of the following best describes the ethical position of the solicitor?", "o": ["The solicitor is likely to have acted without integrity in his conduct. As a result, the solicitor is treated as having also acted dishonestly according to the standards of ordinary decent people.", "The solicitor is likely to have acted without integrity in his conduct. However, it is likely that the solicitor will be treated as having acted honestly according to the standards of ordinary decent people.", "The solicitor is likely to have acted without integrity in his conduct. In addition, it is likely that the solicitor will be treated as having acted dishonestly according to the standards of ordinary decent people.", "The solicitor is likely to have acted with integrity in his conduct. However, it is likely that the solicitor will be treated as having acted dishonestly according to the standards of ordinary decent people.", "The solicitor is likely to have acted with integrity in his conduct. In addition, it is likely that the solicitor will be treated as having acted honestly according to the standards of ordinary of decent people."], "a": "B"}, {"ch": 0, "n": 2, "sc": ["A solicitor is the sole director of a company. The solicitor is on the roll but does not hold a practising certificate. Through the company, the solicitor engages in a fraudulent scheme which secures her over £20 million."], "st": "Which of the following best describes whether the solicitor has acted contrary to the SRA Principles?", "o": ["The solicitor is not subject to the SRA Principles because she does not hold a practising certificate.", "The solicitor has failed to act in a way that upholds public trust and confidence in companies, and the directors who work in those companies.", "The solicitor is not subject to the SRA Principles because she was not acting in the role as a solicitor.", "The solicitor has failed to act in a way that upholds public trust and confidence in the solicitors, profession and in legal services provided by authorised persons.", "The solicitor has acted in a way that upholds public trust and confidence in the solicitors, profession and in legal services provided by authorised persons as her conduct was not to do with her role as a solicitor."], "a": "D"}, {"ch": 0, "n": 3, "sc": ["A solicitor is appearing in the magistrates' court defending their client, who is charged with theft, contrary to s 1 Theft Act 1968. The solicitor calls a witness to give evidence in support of their client in the knowledge that such evidence is untrue. The solicitor claims that they were acting in the best interests of their client, which was to seek an acquittal. The solicitor also claims that they were intimidated by the client. The client is convicted."], "st": "Has the solicitor acted in accordance with the SRA Principles?", "o": ["No, the solicitor has failed to act in a way that upholds the constitutional principle of the rule of law, and the proper administration of justice.", "Yes, the solicitor cannot be said to have acted contrary to the SRA Principles given that the client was nonetheless convicted of the offence.", "No, the solicitor has failed to act in the best interests of his client given that the client has been convicted of the offence.", "Yes, the solicitor has acted in the best interests of their client, which outweighs all other interests.", "Yes, the solicitor cannot be said to have acted contrary to the SRA Principles where they have been intimidated or pressured to act in a certain way."], "a": "A"}, {"ch": 0, "n": 4, "sc": ["A solicitor has been approached by a privately funded client seeking representation in a highly contested contract dispute. The case is likely to attract a significant fee for the solicitor and his firm. The solicitor is a contract law specialist; however, he currently has a full workload and lacks the capacity to take on any more work at this time. The client has advised that if the solicitor cannot act for them, then the client will approach a different firm."], "st": "What is the best advice that can be given to the solicitor?", "o": ["The solicitor should act for the client because it would be contrary to his firm's interests to lose a high fee-paying client.", "The solicitor should act for the client but should seek to delay the client's case so as to allow him to complete his current workload before dealing with the new client's case.", "The solicitor should decline to act for the client unless he can secure written consent from them that they accept he has a high workload which may limit his time spent on the client's case.", "The solicitor should act for the client and do his best to balance the workload.", "The solicitor should decline to act for the client because he does not have the capacity to take on any more work."], "a": "E"}, {"ch": 0, "n": 5, "sc": ["A solicitor owns a substantial number of shares in a private limited company. The solicitor has been approached by a client seeking to sue that company for negligence under the Consumer Protection Act 1987. Should the client succeed, the company is likely to suffer a great financial loss and suffer poor publicity. The client's case has merits but is weak in many regards."], "st": "Which of the following is the best advice to give to the solicitor in line with the SRA Principles?", "o": ["The solicitor should act for the client as the solicitor can be trusted to act independently.", "The solicitor should act for the client because he has a duty to act in his client's best interests, and not his own interests.", "The solicitor should not act for the client as to do so would compromise his independence.", "The solicitor should act for the client because the case is weak and the client is likely to lose regardless of the independence of the solicitor.", "The solicitor should not act for the client as to do so would compromise his duty as a shareholder to the company."], "a": "C"}, {"ch": 0, "n": 6, "sc": ["A solicitor working in a high street firm posts a series of abusive and offensive comments about a particular community on her personal social media account late one evening. The posts do not mention her firm or her profession, and she was not acting for any client at the time. A member of the public who recognises her reports the posts to the Solicitors Regulation Authority (SRA)."], "st": "Which of the following best describes the ethical position of the solicitor?", "o": ["The solicitor is not subject to the SRA Principles because the posts were made in her private life.", "The solicitor will only have breached the SRA Principles if the posts identified her as a solicitor or named her firm.", "The solicitor has failed to act in the best interests of each client, as her conduct may cause clients to leave the firm.", "The solicitor is likely to have failed to act in a way that upholds public trust and confidence in the solicitors’ profession, as the SRA Principles can apply to conduct outside practice.", "The solicitor has not breached the SRA Principles because no criminal offence has been committed."], "a": "D"}, {"ch": 0, "n": 7, "sc": ["A solicitor represents a client charged with an offence who has pleaded not guilty. During the trial, the client tells the solicitor in confidence that he did commit the offence, but that he wishes to maintain his not guilty plea. The client instructs the solicitor to secure an acquittal ‘in any way possible’, reminding the solicitor that she must act in his best interests."], "st": "Which of the following best describes how the SRA Principles apply to the solicitor?", "o": ["The solicitor’s duty to act in the best interests of the client outweighs all other Principles, because the client’s liberty is at stake.", "Where the Principles conflict, those which safeguard the wider public interest, such as the rule of law and the proper administration of justice, take precedence over the client’s individual interests.", "The solicitor must follow the client’s instructions, as the SRA Principles are of equal weight and the client decides which should prevail.", "The solicitor must immediately inform the court that the client has admitted his guilt.", "The SRA Principles do not apply because the admission was made in confidence."], "a": "B"}, {"ch": 0, "n": 8, "sc": ["A solicitor specialising in land disputes is instructed by a man in respect of a boundary dispute with his neighbour. Several weeks later, the neighbour approaches the same solicitor and asks him to act on her behalf in the same dispute, explaining that she has heard he is the best local specialist."], "st": "What is the best advice that can be given to the solicitor?", "o": ["The solicitor may act for both parties provided that both give informed consent in writing.", "The solicitor must cease to act for the man and act for the neighbour instead, as she has chosen him as the best specialist.", "The solicitor may continue to act for the man but must not act for the neighbour, as the parties are in direct conflict in the same dispute.", "The solicitor may act for both parties provided that different fee earners in his firm handle each matter.", "The solicitor may act for both parties because they have a common interest in resolving the dispute."], "a": "C"}, {"ch": 0, "n": 9, "sc": ["A solicitor who has practised exclusively in family law for many years is approached by a long-standing friend who runs a technology company. The friend asks the solicitor to conduct complex patent infringement litigation on behalf of the company, and offers a generous fee. The solicitor has never handled intellectual property work."], "st": "Which of the following best describes the solicitor’s position in line with the SRA Principles?", "o": ["The solicitor should decline the instructions, as acting in the client’s best interests requires him to consider whether he has the appropriate expertise to deal with the matter.", "The solicitor may accept the instructions because all solicitors are qualified to practise in every area of law.", "The solicitor may accept the instructions provided that the client agrees to a reduced fee to reflect his inexperience.", "The solicitor must decline the instructions because he would lack independence when acting for a friend.", "The solicitor may accept the instructions because the client has chosen him and it is for the client to decide who is competent to act."], "a": "A"}, {"ch": 0, "n": 10, "sc": ["A solicitor acts for a client buying a house and recommends a particular surveyor. Unknown to the client, the surveyor pays the solicitor a commission for every client referred. The solicitor does not tell the client about the commission, and there is no agreement allowing the solicitor to keep it."], "st": "Which of the following best describes the ethical position of the solicitor?", "o": ["The solicitor has acted properly because the surveyor, not the client, paid the commission.", "The solicitor has acted properly provided that the surveyor was competent and the survey was accurate.", "The solicitor must pay the commission directly to the client, and may never keep it even with the client’s agreement.", "The solicitor has only breached the SRA Principles if the commission exceeded the solicitor’s fee.", "The solicitor has failed to act in the client’s best interests by making a secret profit, and must account to the client for the commission unless the client agrees otherwise."], "a": "E"}, {"ch": 1, "n": 1, "sc": ["A solicitor acts for a buyer in a conveyancing matter. The solicitor has been contacted by the seller of the property demanding receipt of the deposit money by 9 am the following morning. Unable to make contact with the buyer, the solicitor telephones the seller and states that the firm will pay the deposit money by 9 am tomorrow."], "st": "Which of the following best describes the ethical position of the solicitor and the firm?", "o": ["Both the solicitor and their firm are bound by the undertaking and are personally liable to perform the undertaking as provided.", "Neither the solicitor nor the firm are bound by the undertaking and are not personally liable to perform the undertaking as provided, but the buyer will be liable to perform the undertaking.", "The solicitor, but not the firm, is bound by the undertaking and is personally liable to perform the undertaking as provided.", "Neither the solicitor nor the firm are bound by the undertaking, nor are they personally liable to perform the undertaking as provided.", "The firm, but not the solicitor, is bound by the undertaking and is personally liable to perform the undertaking as provided."], "a": "A"}, {"ch": 1, "n": 2, "sc": ["A solicitor acts on behalf of a woman who was involved in a road traffic accident. The woman is the defendant in a personal injury claim. The woman has no counter-claim against the claimant. The solicitor wishes to refer the woman to an insurance company in order to secure after the event (ATE) insurance to fund the solicitor's services. The insurance company offer the solicitor a referral fee of £200."], "st": "Will the solicitor be in breach of the Code of Conduct by accepting the referral fee?", "o": ["Yes, the solicitor must not accept the referral fee in claims for damages following personal injury in any circumstances.", "No, the solicitor can accept the referral fee in claims for damages following personal injury because they are acting for the defendant. The solicitor must account for the referral fee, unless agreed otherwise.", "Yes, the solicitor must not accept the referral fee in claims for damages following personal injury given the potential for an own interest conflict.", "No, the solicitor can accept the referral fee in claims for damages following personal injury because the fee is under £500. The solicitor must account for the referral fee, unless agreed otherwise.", "Yes, the solicitor must not accept the referral fee in claims for damages without the consent of the woman."], "a": "B"}, {"ch": 1, "n": 3, "sc": ["A solicitor is arrested for assault following a house party. The police issue the solicitor with a caution but do not charge him with a criminal offence."], "st": "Is the solicitor obligated to notify the Solicitors Regulation Authority (SRA) of his caution?", "o": ["No, the solicitor is only required to notify the SRA if he was convicted of an offence.", "Yes, the solicitor must notify the SRA of his caution, but need not do it personally. The solicitor may notify the SRA via the firm's manager.", "No, the solicitor is only required to notify the SRA if he was charged with, or convicted of, an offence.", "Yes, the solicitor must notify the SRA of his caution personally or via the firm's compliance officer.", "No, the solicitor is only required to notify the SRA of circumstances which involve serious misconduct, which the assault is not."], "a": "D"}, {"ch": 1, "n": 4, "sc": ["A solicitor is acting for a client whose mother has just died. The solicitor was instructed to deal with the probate. Based upon the initial instructions, the solicitor concluded the matter to be non-contentious and gave the client a likely quote of £1,000 plus VAT for costs. The solicitor has received correspondence from another firm of solicitors advising that they have been instructed to contest the will. Reviewing the documentation that forms part of the objections to the will, the solicitor considers the matter to be more complicated than originally thought."], "st": "Which of the following is the best course of action that should be taken by the solicitor?", "o": ["The solicitor must give the client an update on the likely increase in costs if the matter becomes litigated.", "The solicitor must give the client an updated quote to reflect the contested nature of the probate.", "The solicitor is not permitted to alter the £1,000 fee as that is the original price quoted and agreed with the client.", "The solicitor does not need to inform the client of the likely increase in costs given that the original quoted price was only an estimate.", "The solicitor must charge the £1,000 fee plus VAT as agreed or cease to act."], "a": "A"}, {"ch": 1, "n": 5, "sc": ["A solicitor acts for a man who is buying a house. The solicitor is also later instructed to act for a mortgage company from whom the man has sought a loan in respect of the house. The man has recently been in touch with his solicitor, identifying that he is relieved that the survey of the property, sent to the mortgage company to value the house, omitted evidence which he considers would have prevented his loan from being approved. The solicitor did not identify a conflict of interest between the man and the mortgage provider when he accepted the instructions. However, the solicitor is now concerned that a conflict may exist and requires advice."], "st": "Which of the following is the best advice that should be given to the solicitor?", "o": ["The solicitor can continue to act for the man but must cease to act for the mortgage company. The solicitor must not disclose the reason for ceasing to act to the mortgage company.", "The solicitor can continue to act for both the man and the mortgage company. The solicitor must not disclose the information provided by the man to the mortgage company.", "The solicitor must cease to act for both the man and the mortgage company. The solicitor must not disclose the reason for ceasing to act to both the man and the mortgage company.", "The solicitor can continue to act for the man but must cease to act for the mortgage company. The solicitor must disclose the reason for ceasing to act to the mortgage company.", "The solicitor can continue to act for the man but must cease to act for the mortgage company. The solicitor must not disclose the reason for ceasing to act to the mortgage company unless the man consents to the disclosure."], "a": "E"}, {"ch": 1, "n": 6, "sc": ["A firm of solicitors launches a new fixed-fee will-writing service. To promote it, a solicitor emails all of the firm’s current and former private clients, none of whom have opted out of marketing. The solicitor also proposes that the firm’s staff telephone members of the public selected at random from a local directory to offer the service."], "st": "Which of the following best describes the position under the Code of Conduct?", "o": ["Both the emails and the telephone calls are permitted, as solicitors may advertise their services freely.", "The emails to current and former clients are permitted, but the unsolicited telephone calls to members of the public are not.", "Neither the emails nor the telephone calls are permitted, as all unsolicited approaches are prohibited.", "The telephone calls are permitted provided that they are made by non-admitted staff rather than solicitors.", "The emails are permitted only to current clients, and not to former clients."], "a": "B"}, {"ch": 1, "n": 7, "sc": ["A solicitor acts for an employer settling a claim brought by a former employee who alleges harassment by a senior manager. The employer instructs the solicitor to include a clause in the settlement agreement preventing the employee from reporting the matter to any regulator or to the police, failing which the settlement sum must be repaid."], "st": "Which of the following best describes the solicitor’s position?", "o": ["The solicitor may include the clause because the employee is free to refuse the settlement.", "The solicitor may include the clause provided that the employee takes independent legal advice before signing.", "The solicitor must include the clause because they must act in the best interests of their client.", "The solicitor must not include the clause, as using an NDA to prevent reporting to regulators or the police is improper and a breach of the Code.", "The solicitor may include the clause, but only in relation to reports made to the police and not to the SRA."], "a": "D"}, {"ch": 1, "n": 8, "sc": ["A client asks her solicitor to draft a loan agreement under which she will lend a substantial sum to a company owned by the solicitor. The client says she trusts the solicitor completely, has taken independent legal advice and is willing to give her informed consent in writing to the solicitor acting."], "st": "Which of the following best describes the position of the solicitor?", "o": ["The solicitor may act because the client has taken independent legal advice.", "The solicitor may act provided that effective safeguards are in place to protect confidential information.", "The solicitor must not act, as there is an own interest conflict and there are no exceptions to this rule, even with the client’s consent.", "The solicitor may act under the substantially common interest exception, as both parties want the loan to proceed.", "The solicitor may act because the client’s written informed consent is sufficient."], "a": "C"}, {"ch": 1, "n": 9, "sc": ["A partner delegates the preparation of a client’s employment tribunal claim to a newly recruited paralegal. The partner does not review the paralegal’s work or check on progress. The paralegal misses the deadline for filing the claim, and the client suffers a loss as a result. The partner argues that the error was entirely the paralegal’s fault."], "st": "Which of the following best describes the position under the Code of Conduct?", "o": ["The partner remains accountable for the work carried out through the paralegal and has failed to supervise it effectively.", "Only the paralegal is responsible, as the paralegal carried out the work.", "Neither the partner nor the paralegal is responsible, as paralegals are not regulated by the SRA.", "The firm’s compliance officer for legal practice alone is responsible for the failure.", "The partner is only responsible if he expressly agreed with the client to supervise the matter personally."], "a": "A"}, {"ch": 1, "n": 10, "sc": ["A man contacts a solicitor and says he acts on behalf of his elderly grandmother, who relies heavily on him. He produces a letter, apparently signed by his grandmother, asking the solicitor to transfer the title to her holiday home into the man’s name. The solicitor has never met the grandmother."], "st": "What is the best course of action for the solicitor?", "o": ["The solicitor should proceed with the transfer, as the letter is sufficient written authority.", "The solicitor should refuse to act under any circumstances, as instructions can never come from a third party.", "The solicitor should proceed provided that the man confirms in writing that his grandmother has capacity.", "The solicitor should report the man to the police for attempted fraud.", "The solicitor should satisfy himself that the instructions are genuine, for example by meeting the grandmother without the man present, explaining the consequences of the transfer and obtaining her written consent if she wishes to proceed."], "a": "E"}, {"ch": 2, "n": 1, "sc": ["A solicitor is acting for a client in a breach of contract claim. The solicitor, who is of Muslim faith, discovers that the client is a member of a far-right wing political party which has links to anti-Islamic protest groups. As a result, the solicitor ceases to act for the client."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["Yes. The solicitor can cease to act for the client on the basis of their affiliation with a political party where it would cause a direct conflict with their own race religion or sexual orientation.", "Yes. The solicitor is the party who decides whether or not it is appropriate to represent or continue to represent a client.", "No. The solicitor has a duty not to discriminate against a client on the basis of their political or ethical views.", "No. Although the solicitor can cease to act for the client, they ought to have secured alternative representation for them first.", "No. The solicitor is under a duty to act in the client's best interests, which are not served by them ceasing to act on the client's behalf."], "a": "C"}, {"ch": 2, "n": 2, "sc": ["A solicitor is acting for a client in a personal injury claim arising from a road traffic accident. The only witness to the accident is elderly, lives 40 miles away from the court at which the trial is taking place, and is in receipt of state benefits as her main form of income. The witness contacts the solicitor to say that she will not be prepared to attend trial unless the solicitor pays her to do so. The solicitor has already served the witness's statement on the defendant and, without her oral evidence, it weakens the client's case substantially."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor should agree to reimbursing the witness for any travel expenses and other associated losses she suffers as a result of attending court, but no more.", "The solicitor should agree to reimbursing the witness for any travel expenses and other associated losses she suffers as a result of attending court, as well as paying her a small fee.", "The solicitor should agree to reimbursing the witness for any travel expenses and other associated losses she suffers as a result of attending court, but no more. The solicitor can, however, arrange for the client to make a small payment to the witness in exchange for her attendance at court.", "The solicitor should agree to reimbursing the witness for any travel expenses and other associated losses she suffers as a result of attending court, as well as paying her a fee. The witness's statement has already been filed, and so it could not be argued that the fee was dependant on the nature of the evidence.", "The solicitor should refuse to pay the witness anything at all."], "a": "A"}, {"ch": 2, "n": 3, "sc": ["A solicitor is acting for a large company which has issued a claim against a small company for breach of contract. The defendant is represented by a trainee solicitor. The solicitor for the claimant makes an application for an interim payment order. During the course of discussions with the defendant's representative, the solicitor informs them that counsel will be representing the claimant at the scheduled hearing and that, as a result, the defendant is facing a significant interim payment order as well as a substantial costs order being made against them following the hearing. The solicitor has not, in fact, instructed counsel to represent the claimant at the hearing, although it is being considered by the claimant."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["Yes. Whilst the solicitor is not allowed to mislead the defendant's solicitor, the fact that their client is still considering the instruction of counsel is sufficient to mean that they have not breached the Code.", "Yes. The solicitor has not misled the defendant's solicitor, they have merely set out a hypothetical scenario for the defendant's solicitor to consider.", "No. There is a clear attempt to mislead the defendant's solicitor about the nature of the costs order which the court will make.", "No. There is a clear attempt to mislead the defendant's solicitor about the attendance of counsel.", "No. There is a clear attempt to mislead the defendant's solicitor about the nature and size of the interim payment order which the court is likely to make."], "a": "D"}, {"ch": 2, "n": 4, "sc": ["A solicitor is acting for a client (the respondent) in opposing an application to amend a statement of case which has already been served. During the course of the hearing, a legal executive acting for the applicant mistakenly states that, even with the permission of the court, the respondent still needs to provide written consent to the statement of case being amended. The solicitor knows this is not the case, however it assists the respondent's case significantly if the application is refused by the court. The solicitor therefore informs the court that the respondent refuses to provide written consent and the application therefore fails."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["No. The solicitor has deliberately misled the applicant by failing to identify their incorrect reading of the procedural rules.", "No. The solicitor has deliberately misled the court by failing to identify the applicant's incorrect reading of the procedural rules.", "No. Although the solicitor has not deliberately misled the court, by failing to correct the applicant's mistake they have been complicit in misleading the court.", "Yes. The solicitor has acted in their client's best interests by simply taking advantage of a mistake made by the applicant.", "Yes. Whilst the court has been misled, the solicitor was not directly responsible for this."], "a": "B"}, {"ch": 2, "n": 5, "sc": ["A solicitor is instructed to act on behalf of a client who is in dispute with their neighbour over the location of the boundary between their respective land. The solicitor's client argues that the neighbour has moved the boundary and that the client is, in fact, entitled to six inches more land than they currently have. The solicitor acted for the seller of their client's land 18 years ago and remembers being told by the seller that the boundary fence had been moved by agreement due to a mistake in the original title. The solicitor knows that sharing this information with their current client will save them a significant amount of money and stress in litigating the matter."], "st": "Which of the following is the best advice to give to the solicitor in line with the SRA Code of Conduct?", "o": ["The solicitor's duty is to act in the best interests of their current client, rather than owing a duty to their former client. The solicitor is therefore entitled to share the information with their current client.", "The solicitor owes a duty of confidentiality to their former client. They cannot therefore share the information with their current client under any circumstances.", "The solicitor owes a duty of confidentiality to their former client. The only circumstance in which they could disclose the information is if they were required to do so by law.", "The solicitor's duty to their current client is to make them aware of all information material to their matter about which the solicitor has knowledge. The information is relevant and the solicitor must therefore disclose it.", "The solicitor owes a duty of confidentiality to their former client, however also owes a duty to their current client to make them aware of all information material to their matter about which the solicitor has knowledge. Unless consent to share the information can be obtained from the former client, the solicitor must cease to act in the matter."], "a": "E"}, {"ch": 2, "n": 6, "sc": ["A solicitor represents a claimant at trial. Owing to time pressure, the solicitor only read the claimant’s witness statements briefly before the hearing. In summing up the evidence, the judge states that one of the claimant’s witnesses said something which the witness did not in fact say. The solicitor does not notice the error and does not correct the judge."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["Yes. A solicitor only breaches the duty not to mislead the court where they act intentionally.", "No. The solicitor has misled the court, albeit unintentionally, as whether a solicitor has misled the court is assessed objectively.", "Yes. It was the judge, not the solicitor, who made the mistake.", "Yes. The solicitor did not draft the witness statements and so is not responsible for their contents.", "No. The solicitor has deliberately misled the court and must be struck off."], "a": "B"}, {"ch": 2, "n": 7, "sc": ["A wealthy client instructs a solicitor to bring defamation proceedings against a journalist who has published an investigative article about the client’s business dealings. The solicitor considers the claim to be weak. The client explains that the real aim is to pressure the journalist into withdrawing the article through the cost of litigation, and asks the solicitor to send correspondence threatening exaggerated financial consequences."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor should follow the client’s instructions, as litigation strategy is a matter for the client.", "The solicitor may issue proceedings, provided that the correspondence is marked ‘without prejudice’.", "The solicitor may proceed because the weakness of a claim alone is never a breach of the Code.", "The solicitor may proceed provided that the client accepts the risk of an adverse costs order.", "The solicitor should not pursue the claim in this way, as it bears the hallmarks of a SLAPP and the solicitor remains responsible for the litigation strategy and its ethical boundaries."], "a": "E"}, {"ch": 2, "n": 8, "sc": ["A solicitor acts for a defendant in a breach of contract claim brought by an unrepresented individual. The solicitor writes to the claimant stating that, unless the claimant accepts a settlement offer well below the likely value of the claim, the defendant will make as many procedural applications as possible to delay the trial and run up costs."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["No. The solicitor has abused their position by taking unfair advantage of an unrepresented party.", "Yes. The solicitor is entitled to put the client’s position in the strongest possible terms.", "Yes. The solicitor owes no duty to the claimant, who is not their client.", "No. The solicitor should instead have advised the claimant on the strength of their claim.", "Yes. The claimant could have obtained legal advice if they wished."], "a": "A"}, {"ch": 2, "n": 9, "sc": ["A solicitor acts for a man defending a claim by his former partner, who says she paid cash for renovation work on his property. While reviewing documents for disclosure, the solicitor sees the man remove a builder’s receipt showing that the former partner paid £4,000 in cash. The man says he does not want to ‘complicate things’ by disclosing it."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor may omit the receipt, as the client decides which documents to disclose.", "The solicitor should disclose the receipt to the other side without telling the client.", "The solicitor may omit the receipt provided that they do not refer to it in court.", "The solicitor must explain that the receipt is relevant and must be disclosed and, if the client refuses, the solicitor must cease to act.", "The solicitor must report the client to the police for attempting to pervert the course of justice."], "a": "D"}, {"ch": 2, "n": 10, "sc": ["A solicitor is instructed by two defendants to the same negligence claim. After the solicitor has taken instructions from both, the second defendant reveals in confidence information which suggests that the first defendant was primarily responsible, and which would be material to the first defendant’s defence."], "st": "Which of the following is the best advice to give to the solicitor?", "o": ["The solicitor may continue to act for both defendants under the competing for the same objective exception.", "The solicitor may continue to act for the first defendant and must disclose the information to them.", "The solicitor must cease to act for both defendants, as the duty of confidentiality to the second defendant conflicts with the duty of disclosure to the first.", "The solicitor may continue to act for both defendants provided that both give informed consent in writing.", "The solicitor must cease to act for the second defendant only."], "a": "C"}, {"ch": 3, "n": 1, "sc": ["A solicitor acts for a private limited company, which has agreed in principle a new banking facility with a high street lender, subject to formal agreement of terms and bespoke security documentation. The bank will require completion of a debenture over the company's assets and a first legal charge over the company's business premises. The client has asked whether the solicitor may also act for the bank, in order to save costs."], "st": "Which of the following best describes the position?", "o": ["The solicitor may act for the client and the bank here, provided that they follow current guidance from the Law Society.", "The solicitor may act for the client and the bank here, as the parties are competing for the same objective.", "The solicitor cannot act for the client and the bank here, as the loan and security documentation will need to be negotiated, and guidance from the Law Society in relation to residential transactions does not apply.", "The solicitor could act for the client and the bank in relation to the investigation of title and/or completion, as the clients will most likely have a substantially common interest. The bank will need separate representation for negotiation of the terms of the documentation.", "The solicitor may act for the client and the bank as the parties have a substantially common interest, subject to both the client and the bank giving informed consent, effective safeguards being in place and the solicitor being satisfied that it is reasonable so to act."], "a": "D"}, {"ch": 3, "n": 2, "sc": ["A client is a sole practitioner in an accountancy business and he has agreed to borrow a substantial sum from a high street lender. The loan will be used to expand the business, but to secure it, the lender will require a first legal charge over the matrimonial home that the client owns jointly with his wife. The client's wife has asked the client's solicitor to act for her in the transaction."], "st": "Which of the following best describes the position?", "o": ["Provided the solicitor is satisfied there is no conflict of interest or a significant risk of one, they may act for both the client and the client's wife in relation to the proposed legal charge.", "The solicitor may not act for the client and the client's wife in relation to the proposed legal charge in any circumstances.", "The solicitor may act for the client only. The client's wife will require separate representation.", "The solicitor may act for both the client and the client's wife, but will need to adhere to the guidelines from relevant case law in advising the wife.", "Provided the solicitor is satisfied there is no conflict of interest, or a significant risk of one, they may act for both the client and the client's wife, with careful adherence to the guidelines from relevant case law."], "a": "E"}, {"ch": 3, "n": 3, "sc": ["A solicitor is approached to carry out due diligence on a private limited company. The solicitor's spouse is employed by the company as finance director and has a minority shareholding in the company."], "st": "Which of the following best describes the position?", "o": ["The solicitor cannot act as there is an own interest conflict, due to the financial interest of the solicitor's spouse.", "The solicitor cannot act as there is a conflict of interest.", "The solicitor cannot act as there is an own interest conflict, unless the client gives informed consent to the solicitor acting.", "The solicitor can act as there is no conflict of interest with an existing or former client.", "The solicitor can act as they do not have a personal interest in the company, provided that they disclose the interest of their spouse."], "a": "A"}, {"ch": 3, "n": 4, "sc": ["A solicitor has been asked to act on the incorporation of a private limited company by the four proposed director-shareholders. The proposed director-shareholders have agreed finance terms with a high street lender and they agree as to the proposed management structure and shareholdings."], "st": "Which of the following best describes the position?", "o": ["The solicitor may not act for all four proposed director-shareholders as although there is no immediate conflict of interest, there is a significant risk of one arising.", "The solicitor may not act here under any circumstances.", "The solicitor may act here, despite the potential risk of a conflict of interest arising, using the substantially common interest exception.", "The solicitor may act here, despite the potential risk of a conflict of interest arising, as the proposed director-shareholders are competing for the same objective.", "The solicitor may act here, despite the potential risk of a conflict of interest arising, using the substantially common interest exception, subject to the conditions of the exception."], "a": "E"}, {"ch": 3, "n": 5, "sc": ["A solicitor has been asked to act for both a retiring partner and a continuing partner on the retiring partner's exit from the business. Both partners have a good working relationship and they have agreed the basic terms."], "st": "Which of the following best describes the position?", "o": ["The solicitor cannot act as there is a conflict of interest between the retiring partner and the continuing partner.", "The solicitor cannot act, as there is a significant risk of a conflict of interest between the retiring partner and the continuing partner.", "The solicitor could act, despite the significant risk of a conflict of interest, provided that both the retiring and continuing partner give informed consent.", "The solicitor could act, as the retiring and continuing partners would be competing for the same objective. Both the retiring and continuing partners would need to give informed consent, effective safeguards would need to be put in place concerning protection of confidential information and the solicitor would need to be satisfied it is reasonable to do so.", "The solicitor could act, despite the significant risk of a conflict of interest, provided that both the retiring and continuing partners give informed consent, effective safeguards are put in place concerning protection of confidential information and the solicitor is satisfied it is reasonable to do so."], "a": "B"}, {"ch": 3, "n": 6, "sc": ["Two separate companies ask the same solicitor to act for them in bidding for the business assets of a company that is being sold through a liquidation process. Both companies are aware that the other is bidding."], "st": "Which of the following best describes the position?", "o": ["The solicitor cannot act for both companies in any circumstances, as they are seeking to acquire the same asset.", "The solicitor may act for both companies under the substantially common interest exception.", "The solicitor may act for both companies without any conditions, as both know of the other’s bid.", "The solicitor may act for whichever company instructed them first.", "The solicitor may act for both companies under the competing for the same objective exception, provided that both give informed written consent, effective safeguards protect confidential information and the solicitor is satisfied it is reasonable to act."], "a": "E"}, {"ch": 3, "n": 7, "sc": ["A solicitor acts for a buyer in the acquisition of a private limited company. Keen to keep the transaction on track, the solicitor tells the seller’s solicitors that his client’s bank finance offer is in place. In fact, the bank has not yet issued a finance offer, although the client expects one shortly."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["Yes. The statement is likely to become true shortly, so no harm has been caused.", "No. The solicitor has misled the other party by confirming that a finance offer is in place when it is not.", "Yes. The duty not to mislead applies only to clients and the court.", "Yes. The solicitor was acting in the best interests of the client.", "No. But the breach is cured if the finance offer is issued before completion."], "a": "B"}, {"ch": 3, "n": 8, "sc": ["Three individuals plan to buy a small business together. They have agreed between themselves the price and how they will share ownership, and they ask the same solicitor to act for all three of them on the purchase."], "st": "Which of the following best describes the position?", "o": ["The solicitor will usually be able to act for all three joint buyers, subject to compliance with the Code of Conduct on conflicts of interest.", "The solicitor may never act for more than one buyer in a business transaction.", "The solicitor may act for the buyers and the seller, as all parties have agreed the price.", "The solicitor may act for only one of the buyers, chosen by the other two.", "The solicitor may act for all three buyers only under the competing for the same objective exception."], "a": "A"}, {"ch": 3, "n": 9, "sc": ["Two long-standing corporate clients of a firm wish to enter into a commercial supply agreement with each other. The terms are still to be negotiated at arm’s length, and both clients ask the same solicitor to act for them in agreeing the contract to save time and costs."], "st": "Which of the following best describes the position?", "o": ["The solicitor may act for both clients as they are both existing clients of the firm.", "The solicitor may act for both clients under the competing for the same objective exception.", "The solicitor may act for both clients provided that both give informed consent.", "The solicitor should not act for both clients, as agreeing a commercial contract between two clients at arm’s length gives rise to a conflict of interest.", "The solicitor may act for both clients if separate fee earners handle each side."], "a": "D"}, {"ch": 3, "n": 10, "sc": ["A solicitor acts for a company that is borrowing from a bank. The bank requires a personal guarantee from the elderly mother of the company’s sole director, who has no involvement in the business. The director asks the solicitor also to act for his mother in relation to the guarantee."], "st": "Which of the following best describes the position?", "o": ["The solicitor may always act for both the borrower and a third party guarantor.", "The solicitor may act for the mother provided that the director gives informed consent.", "The solicitor may only act for both if satisfied that there is no conflict of interest or significant risk of one, which is unlikely given the potential for undue influence; if acting, the Etridge guidelines must be followed.", "The solicitor may act for both under the competing for the same objective exception.", "The solicitor may act for the mother because she is not borrowing any money herself."], "a": "C"}, {"ch": 4, "n": 1, "sc": ["A man is charged with burglary, contrary to s 9 Theft Act 1968. The prosecution's evidence largely rests on the visual identification of a witness to the offence. The witness claims to have seen the man enter and exit the building at the time the alleged offence was committed. The witness' view was obstructed, and it was night-time when the identification was made. The man informs his solicitor that he committed the offence in question but wishes to plead not guilty."], "st": "Which of the following best describes the ethical position of the solicitor?", "o": ["The solicitor must cease to act for the man immediately and must inform the court they are ceasing to act for professional reasons.", "The solicitor may continue to represent the man. The solicitor is able to cross-examine prosecution witnesses, make a submission of no case to answer, and examine-in-chief defence witnesses, including the man.", "The solicitor may continue to represent the man. The solicitor is able to cross-examine prosecution witnesses and make a submission of no case to answer. However, the solicitor is not permitted to put forward a positive case for the defence.", "The solicitor must cease to act for the man immediately and must inform the court as to the reasons for ceasing to act.", "The solicitor may continue to represent the man. The solicitor is unable to cross-examine prosecution witnesses, make a submission of no case to answer, or put forward a positive case for the defence."], "a": "C"}, {"ch": 4, "n": 2, "sc": ["A woman is charged with theft, contrary to s 1 Theft Act 1968, and pleads guilty. At present, the facts of the case indicate that a custodial sentence cannot be imposed. Immediately before the sentencing hearing starts, the prosecutor hands the defence solicitor the antecedents and asks if they are agreed. In confidence, the defence solicitor speaks with the woman. The woman explains that she has previous convictions for theft and that, as these are currently missing from the paperwork, the antecedents are therefore inaccurate. The defence solicitor now believes that these convictions will impact the sentence, making custody a strong possibility."], "st": "Which of the following best describes what action the solicitor should take to ensure that they comply with their ethical obligations?", "o": ["The solicitor must firstly explain to the woman that they now have a duty to disclose these previous convictions to the court, and ask whether she consents to doing so. The solicitor must explain that if the woman does not consent, then the solicitor must cease to act. The solicitor must disclose the reason for ceasing to act to the court.", "The solicitor may continue to act for the woman but must not disclose the previous convictions to the court or the prosecutor.", "The solicitor must firstly explain to the woman that they now have a duty to disclose these previous convictions to the court, and ask whether she consents to doing so. The solicitor must explain that if the woman does not consent, then the solicitor must cease to act. The solicitor must only disclose the reason for ceasing to act to the court if asked by the judge.", "The solicitor must cease to act immediately and has a duty to disclose the previous convictions to the court or the prosecutor.", "The solicitor must firstly explain to the woman that they now have a duty to disclose these previous convictions to the court, and ask whether she consents to doing so. The solicitor must explain that if the woman does not consent, then the solicitor must cease to act. The solicitor must not, however, disclose the reason for ceasing to act to the court, even if asked by the judge."], "a": "E"}, {"ch": 4, "n": 3, "sc": ["A solicitor advocate appears on behalf of a woman charged with assault. The woman maintains that she did not commit the offence. However, in a meeting with the solicitor, the woman discloses that she is distraught with the stress of proceedings, and tells the solicitor that she has 'had enough' and that she wishes to plead guilty to the offence despite the fact that she is innocent. The solicitor's attempts to dissuade the woman from entering such a plea are unsuccessful."], "st": "Which of the following correctly identifies the appropriate conduct of the solicitor?", "o": ["If the woman insists on entering a guilty plea, despite maintaining her innocence, the solicitor can continue to represent her and there are no restrictions on the mitigation the solicitor can put forward at any sentencing hearing.", "If the woman insists on entering a guilty plea, despite maintaining her innocence, the solicitor must withdraw immediately from the case, as to continue to represent the woman would mean they would be knowingly misleading the court.", "If the woman insists on entering a guilty plea, despite maintaining her innocence, the solicitor can continue to represent the woman, but the solicitor must inform the court that the woman is pleading guilty against the solicitor's advice.", "If the woman insists on entering a guilty plea, despite maintaining her innocence, the solicitor must withdraw immediately from the case, as to continue to represent the woman would mean they would be knowingly misleading the court. The solicitor must also inform the court as to the reason that they are ceasing to act.", "If the woman insists on entering a guilty plea, despite maintaining her innocence, the solicitor can continue to represent her, but there are restrictions on what the solicitor can say at any sentencing hearing in terms of mitigation."], "a": "E"}, {"ch": 4, "n": 4, "sc": ["A man is charged with assault. The man is a member of a far-right extremist group with previous convictions for racially aggravated assault. The man has extreme views on immigration and has previously expressed a hatred towards non-white communities. The man seeks to instruct a solicitor to act on his behalf. The solicitor finds the man's views and beliefs abhorrent as they are in conflict with their own."], "st": "Which of the following best describes the position of the solicitor?", "o": ["The solicitor would be entitled to refuse the man's instructions as the conflict between their political views and opinions and that of the man would mean that they would be professionally embarrassed.", "The solicitor would be obliged to accept the instruction, despite finding the conduct, opinions and beliefs of the man unacceptable, and must act in the best interests of the man in representing him.", "The solicitor would not be entitled to refuse the man's instruction on the basis that they find the conduct, opinions and beliefs of the man unacceptable. To do so would be discriminatory.", "The solicitor would be entitled to refuse the man's instruction on the basis that they find the conduct, opinions and beliefs of the man unacceptable, as such refusal would not be discriminatory.", "The solicitor would be obliged to accept the instruction but could apply to the court to be released from their professional obligations to the man, as to represent him would not be in his best interests."], "a": "D"}, {"ch": 4, "n": 5, "sc": ["A solicitor works in a criminal practice and is instructed to act on behalf of a man charged with burglary. Following a meeting, the solicitor overhears the man on his mobile phone negotiating to buy firearms for a planned burglary of a commercial premises."], "st": "Which of the following best describes the solicitor's duty in this case?", "o": ["The solicitor should contact the police immediately. Disclosure to the police is permitted by law in this circumstance and will not amount to a breach of confidence.", "The solicitor should confront the man and advise him that he should not engage in criminal conduct. If the man refuses to cease in his conduct, the solicitor should contact the police.", "The solicitor is not permitted to contact the police, as to do so would breach the solicitor's duty to maintain client confidentiality, unless the man consents to the disclosure.", "The solicitor should contact the police immediately. Whilst disclosure to the police is permitted by law in this circumstance, disclosure will still amount to a breach of confidence.", "The solicitor is not permitted to contact the police, as to do so would breach the solicitor's duty to maintain client confidentiality."], "a": "A"}, {"ch": 4, "n": 6, "sc": ["A man is charged with theft and tells his solicitor that he took the goods from a shop without paying. During the interview, the solicitor tells the man that if he says he believed he had already paid, he would have a good defence, and suggests that the man adopt that account in his defence statement."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["Yes. The solicitor must act in the best interests of the client, which includes identifying any available defence.", "Yes. It is for the client, not the solicitor, to decide what account to give.", "No. The solicitor must not suggest a defence to fit the facts or put words into the client’s mouth, as this would influence the substance of evidence.", "No. The solicitor should have advised the client to plead guilty.", "Yes, provided that the client signs the defence statement personally."], "a": "C"}, {"ch": 4, "n": 7, "sc": ["A man is charged with murder and tells his solicitor he wishes to plead guilty. From the man’s account, the solicitor considers that a partial defence of loss of control may be available, which, if successful, would avoid the mandatory life sentence. The man still says he wants to plead guilty."], "st": "Which of the following best describes the solicitor’s professional obligations?", "o": ["The solicitor should advise the man that the defence is available, explain its strengths and limitations and the effect of a guilty plea, and obtain the man’s signature on a written record of the advice and his decision.", "The solicitor must enter a not guilty plea on the man’s behalf, as a defence is available.", "The solicitor must not mention the defence, as doing so would influence the man’s evidence.", "The solicitor must cease to act immediately, as the man’s instructions are contrary to his best interests.", "The solicitor must inform the court that the man has a possible defence but is pleading guilty."], "a": "A"}, {"ch": 4, "n": 8, "sc": ["A defence solicitor decides that there are compelling reasons why they can no longer act for a client charged with robbery, as continuing would professionally embarrass them. The trial is listed for the following week, and the court asks the solicitor why they are withdrawing."], "st": "What should the solicitor tell the court?", "o": ["The solicitor must explain the full reasons for withdrawing, as the duty to the court is paramount.", "The solicitor must disclose the reasons only if the judge orders them to do so.", "The solicitor must continue to act until the trial has concluded.", "The solicitor should tell the court that the client has dismissed them.", "The solicitor should inform the court that they are unable to continue to act for professional reasons, without disclosing confidential information."], "a": "E"}, {"ch": 4, "n": 9, "sc": ["A duty solicitor at a police station is asked to advise two suspects arrested for the same burglary, both of whom are eligible for legal aid. After a private consultation with the first suspect, it becomes clear that the first suspect intends to blame the second, and the solicitor now holds confidential information from the first suspect that is relevant to the second."], "st": "Which of the following best describes what the solicitor should do?", "o": ["The solicitor may continue to act for both, as legal aid rules require one solicitor for all co-suspects.", "The solicitor should cease to act for both suspects, informing the police that each requires separate legal advice, and must maintain confidentiality.", "The solicitor should cease to act for the first suspect only and continue to advise the second.", "The solicitor may continue to act for both if both consent in writing.", "The solicitor should inform the police of what the first suspect has said."], "a": "B"}, {"ch": 4, "n": 10, "sc": ["A solicitor represents a woman jointly charged with fraud alongside a co-defendant, who has separate representation. The co-defendant’s solicitor telephones the woman’s solicitor and asks for details of what the woman has said about the offence, explaining that it would help both defendants."], "st": "How should the woman’s solicitor respond?", "o": ["The solicitor should provide the information, as both solicitors owe a duty to the court.", "The solicitor may provide a summary of the information, provided that it is marked confidential.", "The solicitor should provide the information if they consider it to be in the woman’s best interests, without needing to consult her.", "The solicitor should not respond to the request; if disclosure appears to be in the woman’s best interests, the solicitor must explain this to her and obtain her written informed consent first.", "The solicitor must report the request to the prosecution."], "a": "D"}, {"ch": 5, "n": 1, "sc": ["A solicitors' firm was appointed as executor of the deceased's will. The firm inserted a clause in the will that they would not be liable for any loss or damage unless it was caused by their actual fraud. The firm did not tell the testator that they had done this. The beneficiaries of the will consider that the solicitors' firm has taken an excessive time to administer the will and lost them money. The beneficiaries complain to the firm, but the firm dismiss the complaint."], "st": "Which of the following is the best course of action for the beneficiaries?", "o": ["The beneficiaries should sue the solicitors' firm.", "The beneficiaries should complain to the Legal Ombudsman.", "The beneficiaries have no remedy as such clauses are legal.", "The beneficiaries have no claim as their complaint has gone through the correct procedure and been dismissed.", "The beneficiaries should ask the solicitors' firm to reconsider their complaint."], "a": "B"}, {"ch": 5, "n": 2, "sc": ["A solicitor is engaged by a son, who brings his mother to the solicitor's practice and explains that his mother wants to change her will. The solicitor is told by the son that his mother's previous will divided her property equally between her three children, but now she wants to leave all her property to her son. The solicitor also learns that the mother has recently been discharged from a care home, at the request of her son, and entrusted to his care."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor should accept the son's request as any will may be revoked.", "The solicitor should accept the son's request if they are satisfied that the mother has the mental capacity to make a will.", "The solicitor should accept the son's request as there is no legal obligation to leave money to all children.", "The solicitor should accept the son's request if a doctor certifies that the mother has the legal capacity to make a will.", "The solicitor should accept the son's request if they have confirmed with the mother that they represent her instructions."], "a": "E"}, {"ch": 5, "n": 3, "sc": ["The executors of a will have instructed a solicitor to apply for the grant of probate on their behalf. The executors are going to undertake the estate administration themselves upon receiving the grant of probate. After 18 months, probate has still not been granted, but the solicitor will not explain why. The executors are concerned about the delay and increasing expense and wish to make a complaint."], "st": "Which of the following most accurately represents the solicitor's conduct in this case?", "o": ["The solicitor has misled the executors.", "The solicitor has taken unfair advantage of the executors.", "The solicitor has not established an effective complaints procedure.", "The solicitor has not progressed the matter within an agreed or reasonable time.", "The solicitor has not given proper information to the executors about the likely cost."], "a": "D"}, {"ch": 5, "n": 4, "sc": ["The executors of a will ask a solicitor to make an application for probate on their behalf. The solicitor accepts the instruction, but upon reading the will discovers that the testatrix has left land to the testatrix's daughter. That land adjoins land owned by the solicitor, and the solicitor wishes to buy that land."], "st": "Which of the following is the best advice to give the solicitor in line with the SRA Code of Conduct?", "o": ["The solicitor should inform the executors of the possible conflict of interest and gain their consent to proceed.", "The solicitor should inform the beneficiaries of the possible conflict of interest and gain their consent to proceed.", "The solicitor should not accept the instruction as there is a conflict of interest.", "The solicitor may accept the instruction and offer to buy the land after probate has been granted.", "The solicitor should not accept the instruction because they would be taking unfair advantage of the client."], "a": "C"}, {"ch": 5, "n": 5, "sc": ["A solicitor drew up a will for an elderly man ten years ago. The solicitor had some concerns about the man's mental state and requested a capacity assessment by a medical practitioner. The man was content for the assessment to be made but insisted that he did not want his family to know. The medical practitioner certified that the man had sufficient mental capacity to make a will, making a full report confirming this, and the will was executed in the presence of the medical practitioner. The man has recently died and his son, who is unhappy about the terms of the will, seeks the solicitor's advice."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor may accept the instruction, as the man was a former and not a current client.", "The solicitor may accept the instruction if the former client consents to the disclosure of the confidential information.", "The solicitor may not accept the instruction because the confidential information is material to the son's claim.", "The solicitor may accept the instruction but must not disclose the confidential information about mental capacity.", "The solicitor may not accept the instruction because there are always conflicts of interest in disputes between family members."], "a": "C"}, {"ch": 5, "n": 6, "sc": ["A solicitor who is a long-standing family friend of a client is instructed to draft the client’s new will. The client tells the solicitor that she wishes to leave the solicitor a valuable painting as a gift in the will. The client has not taken any independent legal advice about the gift."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor may draft the will including the gift, as the client is free to leave her property to whomever she wishes.", "The solicitor should satisfy himself that the client has taken independent legal advice about the gift, record the advice and obtain written confirmation, and cease to act if the client refuses to take such advice but still wishes to include the gift.", "The solicitor may draft the will provided that the gift is witnessed by another solicitor in the firm.", "The solicitor must refuse to draft the will in any circumstances.", "The solicitor may draft the will if the value of the gift is below the solicitor’s fee."], "a": "B"}, {"ch": 5, "n": 7, "sc": ["A client asks a solicitor to draft a simple will. The solicitor tells the client that it is the default position that the drafting firm is appointed as executor, and that the firm will only prepare the will if it is named as executor. The client, who knows little about wills, agrees."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["Yes. It is common for solicitors who draft wills to be appointed as executors.", "Yes. The client agreed to the appointment.", "Yes, provided that the firm’s executor fees are reasonable.", "No. The solicitor has exploited the client’s lack of knowledge; the solicitor should explain the options for executors, that an executor need not be a professional, and that preparing the will is not conditional on the firm’s appointment.", "No. Solicitors who draft a will are prohibited from acting as its executors."], "a": "D"}, {"ch": 5, "n": 8, "sc": ["A deaf client instructs a solicitor to prepare her will. Her son, who is the main beneficiary under the proposed will, offers to act as her sign-language interpreter during the meeting to save time and expense."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor should arrange a sign-language interpreter who is independent of the client and her family, to avoid any risk of undue influence.", "The solicitor should accept the son’s offer, as he knows his mother best.", "The solicitor should decline to act, as deaf clients cannot give clear instructions.", "The solicitor should accept the son’s offer, provided that the son signs a statement confirming his translation is accurate.", "The solicitor should take written instructions only and avoid any meeting."], "a": "A"}, {"ch": 5, "n": 9, "sc": ["Two brothers believe their elderly parents may have recently changed their wills. They visit the solicitor who usually acts for their parents and ask the solicitor to tell them whether new wills have been made and what they contain. Both parents are alive."], "st": "Which of the following best describes the solicitor’s position?", "o": ["The solicitor may tell the brothers the contents of the wills, as they are close family members.", "The solicitor may confirm that new wills have been made, but must not reveal their contents.", "The solicitor may disclose the contents if the brothers are beneficiaries.", "The solicitor should direct the brothers to obtain copies from the Probate Registry.", "Without the parents’ permission, the solicitor cannot disclose the contents of the wills, nor even confirm whether they drafted them."], "a": "E"}, {"ch": 5, "n": 10, "sc": ["A solicitor prepared a will for a client who has since died. The solicitor is not named as an executor. A relative who is disputing the will sends the solicitor a request for information about the circumstances surrounding the preparation and execution of the will (a Larke v Nugus request)."], "st": "Which of the following best describes how the solicitor should proceed if they choose to respond?", "o": ["The solicitor must provide the information immediately, as they are legally obliged to comply with the request.", "The solicitor must refuse, as the duty of confidentiality ended on the client’s death.", "The solicitor should obtain the consent of the executors before making any disclosure and, if they refuse, advise them that the court may compel production of the documents.", "The solicitor may respond but is not permitted to charge for preparing the statement.", "The solicitor should obtain the consent of the relative making the request before responding."], "a": "C"}, {"ch": 6, "n": 1, "sc": ["A solicitor acts for the proposed tenant of a lease of commercial property and the heads of terms provide that the tenant will pay the landlord's legal costs in relation to the preparation, negotiation and completion of the lease. The landlord's solicitors have requested an undertaking from the tenant solicitor's firm to meet these costs before they will issue draft documentation. The tenant is a long-established, regular and reliable client of the tenant solicitor's firm and they are keen to proceed without delay. Accordingly, to expedite the process, the tenant's solicitor confirms in a telephone conversation with the landlord's solicitor that the tenant solicitor's firm will meet these costs."], "st": "Which of the following best describes who is liable for the costs?", "o": ["The solicitor and the firm are liable as an undertaking has been given.", "The solicitor is liable as undertakings are personally binding.", "An undertaking has not been given, as the word 'undertake' or 'undertaking' was not used and it was neither given, nor confirmed in writing.", "The firm is liable as the undertaking was clearly given on behalf of the firm.", "The client is liable as the undertaking was given on their behalf."], "a": "A"}, {"ch": 6, "n": 2, "sc": ["A property developer client has instructed a solicitor in relation to the proposed gift of one of the properties from their portfolio, to their adult daughter. The daughter has asked if the solicitor can also act for her on the transfer."], "st": "Which of the following best describes the position?", "o": ["In no circumstances can the solicitor act here, as it is never possible to act for transferor and transferee in a property transaction, due to the potential for conflict of interest.", "The solicitor should be able to act in this matter on the facts. Due to the connection between the parties and the fact that the transaction involves a gift, there is unlikely to be a conflict of interest or a significant risk of one arising.", "The solicitor can act in this matter as the parties are competing for the same objective.", "The solicitor can act in this matter as the parties have a substantially common interest.", "The solicitor should not act in this matter, as the daughter will be the one to benefit from the transaction and there is an imbalance of power between them."], "a": "B"}, {"ch": 6, "n": 3, "sc": ["The seller of a residential property, who is keen to proceed as soon as possible, instructs their solicitor to submit draft contract documentation to three interested parties."], "st": "Which of the following best describes the position?", "o": ["The solicitor will be unable to do this under the Code of Conduct and must immediately cease to act. They will owe a duty of confidentiality to the seller and so must not disclose their reasons for ceasing to act.", "Provided that the solicitor informs all three prospective buyers of the situation, there will be no breach of the Code of Conduct. They will owe a duty of confidentiality to the seller.", "The solicitor must obtain the seller's consent to disclose the position to the prospective buyers and, if this is not forthcoming, they must cease to act immediately. If it is forthcoming, disclosure must be made immediately.", "The solicitor must obtain the seller's consent to disclose the position to the prospective buyers and, if this is not forthcoming, they must cease to act immediately. They will owe a duty of confidentiality to the seller.", "The solicitor must obtain the seller's consent to disclose the position to the prospective buyers and, if this is not forthcoming, they must cease to act immediately. They will owe a duty of confidentiality to the seller. If the seller's consent is forthcoming, disclosure must be made."], "a": "E"}, {"ch": 6, "n": 4, "sc": ["A solicitor is instructed to act in relation to the acquisition of a leasehold flat and is aware that their firm acted for the previous owner of the property in long, protracted and unsuccessful litigation concerning liability for repairs under the lease. The freehold owner and management company denied liability and a settlement was never reached. The main reason that the litigation was unsuccessful was because the lease was defective as originally drafted. The value, marketability and security for lending purposes were adversely affected and the former client sold to the current seller for a cash sum significantly below their original acquisition cost. The current purchase is in excess of the market value for a similar flat without a seriously defective lease and the lease is unlikely to be acceptable to the buyer's lender."], "st": "Which of the following best describes the position?", "o": ["The duty of confidentiality to the former client takes precedence over the duty of disclosure to the new client in these circumstances.", "There is a conflict between the duty of confidentiality to the former client and the duty of disclosure to the new client. Unless the former client provides consent to share the information, the solicitor must cease to act in the matter.", "The solicitor is under a duty to their new client to disclose all information material to their matter about which the solicitor has knowledge. This clearly includes this information and therefore the solicitor must disclose it.", "The duty of confidentiality to the former client will always take precedence.", "The solicitor should act in the best interests of current, rather than former, clients and should therefore disclose the information."], "a": "B"}, {"ch": 6, "n": 5, "sc": ["A solicitor has been instructed to act on the purchase of a freehold residential property, for owner-occupation and their client has asked whether the firm may also act for the lender, a high street bank, in the same matter."], "st": "Which of the following best describes the position?", "o": ["The solicitor may act provided that the proposed mortgage is a standard document that does not need to be negotiated, the Law Society/UK Finance standard certificate of title is used and it is otherwise reasonable to act.", "The solicitor may act despite the risk of conflict of interest, under the substantially common interest exception. Both parties would need to give informed consent, effective safeguards would need to be put in place concerning protection of confidential information, and the solicitor would need to be satisfied it is reasonable to do so.", "The solicitor may act despite the risk of conflict of interest, under the competing for the same objective exception. Both parties would need to give informed consent, effective safeguards would need to be put in place concerning protection of confidential information, and the solicitor would need to be satisfied it is reasonable to do so.", "The
