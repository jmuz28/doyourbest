<script>
const D={"t": ["SRA Principles", "SRA Code of Conduct", "Ethics and professional conduct in dispute resolution", "Ethics and professional conduct in business law and practice", "Ethics and professional conduct in criminal law and practice", "Ethics and professional conduct in wills and the administration of estates", "Ethics and professional conduct in property practice", "Ethics and professional conduct in solicitors' accounts"], "q": [{"ch": 0, "n": 1, "sc": ["A solicitor works in a firm, specialising in wills and probate. The solicitor is recently qualified and has little experience in practice. The solicitor is instructed by a senior partner to send drafted wills to clients, requesting their signature. When the solicitor asks about who will witness the signatures, the senior partner informs him that the solicitor and the senior partner can sign the will as witnesses when the will is returned to the firm. The senior partner identifies this as normal practice, which is affirmed by other solicitors within the firm. The solicitor does not consider his own conduct to be dishonest."], "st": "Which of the following best describes the ethical position of the solicitor?", "o": ["The solicitor is likely to have acted without integrity in his conduct. As a result, the solicitor is treated as having also acted dishonestly according to the standards of ordinary decent people.", "The solicitor is likely to have acted without integrity in his conduct. However, it is likely that the solicitor will be treated as having acted honestly according to the standards of ordinary decent people.", "The solicitor is likely to have acted without integrity in his conduct. In addition, it is likely that the solicitor will be treated as having acted dishonestly according to the standards of ordinary decent people.", "The solicitor is likely to have acted with integrity in his conduct. However, it is likely that the solicitor will be treated as having acted dishonestly according to the standards of ordinary decent people.", "The solicitor is likely to have acted with integrity in his conduct. In addition, it is likely that the solicitor will be treated as having acted honestly according to the standards of ordinary of decent people."], "a": "B", "bx": "The correct answer was B. Remember from your study of wills and the administration of estates that the execution of a will must be witnessed or acknowledged at the time that the will is signed by the testator, and that the witnesses must sign the will in the presence of the testator. To sign the will without the testator being present would be to act contrary to the law. As a result, option B represents the most likely outcome should the SRA pursue a disciplinary action. Given the solicitor's belief at the time, his conduct is unlikely to be considered as being dishonest by the standards of ordinary decent people. However, given the reckless disregard for the law stated above, which he would be expected to know and apply, the solicitor is likely to be treated as having acted without integrity by blindly following the advice of the senior partner. Option A is wrong because it presupposes that a finding that the solicitor acted with a lack of integrity automatically means they are dishonest. Whilst there is a large degree of overlap, it is possible for an individual to be acting without integrity but not be dishonest. Option C is wrong on the basis that whilst the solicitor is likely to have acted without integrity, his state of knowledge and belief at the time would likely render his conduct honest according to the standards of ordinary decent people. Option D is wrong because the solicitor is unlikely to be dishonest in his conduct. Option E is wrong because it is unlikely the solicitor will be treated as having acted with integrity by recklessly disregarding the law."}, {"ch": 0, "n": 2, "sc": ["A solicitor is the sole director of a company. The solicitor is on the roll but does not hold a practising certificate. Through the company, the solicitor engages in a fraudulent scheme which secures her over £20 million."], "st": "Which of the following best describes whether the solicitor has acted contrary to the SRA Principles?", "o": ["The solicitor is not subject to the SRA Principles because she does not hold a practising certificate.", "The solicitor has failed to act in a way that upholds public trust and confidence in companies, and the directors who work in those companies.", "The solicitor is not subject to the SRA Principles because she was not acting in the role as a solicitor.", "The solicitor has failed to act in a way that upholds public trust and confidence in the solicitors, profession and in legal services provided by authorised persons.", "The solicitor has acted in a way that upholds public trust and confidence in the solicitors, profession and in legal services provided by authorised persons as her conduct was not to do with her role as a solicitor."], "a": "D", "bx": "The correct answer was D. The solicitor will have acted contrary to Principle 2: You act in a way that upholds public trust and confidence in the solicitors' profession and in legal services provided by authorised persons. Her position as a solicitor would likely have supplied or instilled respectability and trust in the scheme and thus she has acted contrary to that Principle even though she was not acting in the role of a solicitor (thus option E is wrong). Option A is wrong because the solicitor is subject to the SRA Principles despite not holding a practising certificate. Option B is incorrect because the focus of the SRA Principles is on her role as a solicitor, not her role as a director. Option C is wrong because the SRA Principles apply to conduct, either inside or outside of practice, which would diminish the public's trust if they knew it was done by a solicitor."}, {"ch": 0, "n": 3, "sc": ["A solicitor is appearing in the magistrates' court defending their client, who is charged with theft, contrary to s 1 Theft Act 1968. The solicitor calls a witness to give evidence in support of their client in the knowledge that such evidence is untrue. The solicitor claims that they were acting in the best interests of their client, which was to seek an acquittal. The solicitor also claims that they were intimidated by the client. The client is convicted."], "st": "Has the solicitor acted in accordance with the SRA Principles?", "o": ["No, the solicitor has failed to act in a way that upholds the constitutional principle of the rule of law, and the proper administration of justice.", "Yes, the solicitor cannot be said to have acted contrary to the SRA Principles given that the client was nonetheless convicted of the offence.", "No, the solicitor has failed to act in the best interests of his client given that the client has been convicted of the offence.", "Yes, the solicitor has acted in the best interests of their client, which outweighs all other interests.", "Yes, the solicitor cannot be said to have acted contrary to the SRA Principles where they have been intimidated or pressured to act in a certain way."], "a": "A", "bx": "The correct answer was A. A solicitor is first and foremost an officer of the court. The preamble to the SRA Principles is clear that should the Principles come into conflict, those which safeguard the wider public interest (such as the rule of law, and public confidence in a trustworthy solicitors' profession and a safe and effective market for regulated legal services) take precedence over an individual client's interests (therefore option D is wrong). The conviction or acquittal of the client does not affect the solicitor's compliance, or lack thereof, with the SRA Principles (options B and C are therefore incorrect). Option E is wrong because the solicitor has chosen to act in a manner which is contrary to the rule of law and proper administration of justice; their fear of the client does not affect this."}, {"ch": 0, "n": 4, "sc": ["A solicitor has been approached by a privately funded client seeking representation in a highly contested contract dispute. The case is likely to attract a significant fee for the solicitor and his firm. The solicitor is a contract law specialist; however, he currently has a full workload and lacks the capacity to take on any more work at this time. The client has advised that if the solicitor cannot act for them, then the client will approach a different firm."], "st": "What is the best advice that can be given to the solicitor?", "o": ["The solicitor should act for the client because it would be contrary to his firm's interests to lose a high fee-paying client.", "The solicitor should act for the client but should seek to delay the client's case so as to allow him to complete his current workload before dealing with the new client's case.", "The solicitor should decline to act for the client unless he can secure written consent from them that they accept he has a high workload which may limit his time spent on the client's case.", "The solicitor should act for the client and do his best to balance the workload.", "The solicitor should decline to act for the client because he does not have the capacity to take on any more work."], "a": "E", "bx": "The correct answer was E. The solicitor has a duty to act in the best interests of the client. If the solicitor lacks the capacity to take on the client's case, it would be contrary to the client's interests if he tried to (thus option D is wrong). Option A is wrong because the solicitor must act in the best interests of the client, and not of himself or his firm. Option B is wrong because it would not be in the best interests for the client's case to be delayed, and the solicitor is unlikely to act independently and with integrity should he attempt to delay a client's case for his own financial gain. Option C is wrong because the solicitor should not act for the client due to his high workload, and seeking such consent would be inappropriate and would put his own interest above his client."}, {"ch": 0, "n": 5, "sc": ["A solicitor owns a substantial number of shares in a private limited company. The solicitor has been approached by a client seeking to sue that company for negligence under the Consumer Protection Act 1987. Should the client succeed, the company is likely to suffer a great financial loss and suffer poor publicity. The client's case has merits but is weak in many regards."], "st": "Which of the following is the best advice to give to the solicitor in line with the SRA Principles?", "o": ["The solicitor should act for the client as the solicitor can be trusted to act independently.", "The solicitor should act for the client because he has a duty to act in his client's best interests, and not his own interests.", "The solicitor should not act for the client as to do so would compromise his independence.", "The solicitor should act for the client because the case is weak and the client is likely to lose regardless of the independence of the solicitor.", "The solicitor should not act for the client as to do so would compromise his duty as a shareholder to the company."], "a": "C", "bx": "The correct answer was C. The solicitor must act with independence. This means that he must act in an unbiased and objective manner without consideration for his own interests, or the interests of others. Should the solicitor accept these instructions, it is questionable whether he would be able to maintain his independence. Option A is wrong because the best advice is that the solicitor must act in the best interests of the client and with independence; it is inappropriate to accept instructions merely on the basis that we should trust people to act independently. If the risk is present, the risk should be avoided. Whilst option B is technically correct, it is misleadingly used here because the solicitor would not be acting in the client's best interests if the solicitor chose to act for the client. Option D is wrong because the relative strength or weakness of a client's case does not alter the fact that the solicitor may lack independence. In fact, if the case is weaker, the solicitor may find it easier to act in a biased manner. Option E is incorrect as the solicitor's duty to the company is not a relevant consideration."}, {"ch": 0, "n": 6, "sc": ["A solicitor working in a high street firm posts a series of abusive and offensive comments about a particular community on her personal social media account late one evening. The posts do not mention her firm or her profession, and she was not acting for any client at the time. A member of the public who recognises her reports the posts to the Solicitors Regulation Authority (SRA)."], "st": "Which of the following best describes the ethical position of the solicitor?", "o": ["The solicitor is not subject to the SRA Principles because the posts were made in her private life.", "The solicitor will only have breached the SRA Principles if the posts identified her as a solicitor or named her firm.", "The solicitor has failed to act in the best interests of each client, as her conduct may cause clients to leave the firm.", "The solicitor is likely to have failed to act in a way that upholds public trust and confidence in the solicitors’ profession, as the SRA Principles can apply to conduct outside practice.", "The solicitor has not breached the SRA Principles because no criminal offence has been committed."], "a": "D", "x": ["Wrong. The SRA Principles are not confined to practice: they can apply to conduct outside practice which would diminish public trust if it were known to be done by a solicitor.", "Wrong. There is no need for the posts to name her firm or profession; what matters is whether the conduct, if known to be a solicitor's, would undermine public trust in the profession.", "Wrong. Principle 7 (best interests of each client) concerns how she acts for clients; a possible loss of clients is not the relevant Principle here.", "Correct. Principle 2 requires a solicitor to act in a way that upholds public trust and confidence in the solicitors' profession. The Principles can apply to conduct outside practice, and abusive and offensive posts by a solicitor are likely to breach Principle 2.", "Wrong. A breach of the SRA Principles does not require a criminal offence; conduct falling short of a crime can still undermine public trust and confidence."]}, {"ch": 0, "n": 7, "sc": ["A solicitor represents a client charged with an offence who has pleaded not guilty. During the trial, the client tells the solicitor in confidence that he did commit the offence, but that he wishes to maintain his not guilty plea. The client instructs the solicitor to secure an acquittal ‘in any way possible’, reminding the solicitor that she must act in his best interests."], "st": "Which of the following best describes how the SRA Principles apply to the solicitor?", "o": ["The solicitor’s duty to act in the best interests of the client outweighs all other Principles, because the client’s liberty is at stake.", "Where the Principles conflict, those which safeguard the wider public interest, such as the rule of law and the proper administration of justice, take precedence over the client’s individual interests.", "The solicitor must follow the client’s instructions, as the SRA Principles are of equal weight and the client decides which should prevail.", "The solicitor must immediately inform the court that the client has admitted his guilt.", "The SRA Principles do not apply because the admission was made in confidence."], "a": "B", "x": ["Wrong. Best interests of the client does not override everything else. Where the Principles conflict, the public interest Principles take precedence.", "Correct. The preamble to the SRA Principles provides that where they conflict, those safeguarding the wider public interest (such as the rule of law and the proper administration of justice) take precedence over an individual client's interests. The solicitor may test the prosecution's case but must not mislead the court.", "Wrong. The Principles are not of equal weight in a conflict, and it is not for the client to choose which prevails.", "Wrong. The solicitor owes a duty of confidentiality and is not required to tell the court of the admission; the duty is not to mislead the court.", "Wrong. Confidentiality does not disapply the SRA Principles; the solicitor remains bound by them and must not mislead the court."]}, {"ch": 0, "n": 8, "sc": ["A solicitor specialising in land disputes is instructed by a man in respect of a boundary dispute with his neighbour. Several weeks later, the neighbour approaches the same solicitor and asks him to act on her behalf in the same dispute, explaining that she has heard he is the best local specialist."], "st": "What is the best advice that can be given to the solicitor?", "o": ["The solicitor may act for both parties provided that both give informed consent in writing.", "The solicitor must cease to act for the man and act for the neighbour instead, as she has chosen him as the best specialist.", "The solicitor may continue to act for the man but must not act for the neighbour, as the parties are in direct conflict in the same dispute.", "The solicitor may act for both parties provided that different fee earners in his firm handle each matter.", "The solicitor may act for both parties because they have a common interest in resolving the dispute."], "a": "C", "x": ["Wrong. The neighbour and the man are in direct conflict (if one wins, the other loses). Informed consent only matters where one of the Para 6.2 exceptions applies, and neither does here.", "Wrong. There is no basis for dropping the existing client; the solicitor may continue to act for the man.", "Correct. As in the book's boundary dispute example, the parties are in direct conflict. The solicitor could not act in the best interests of each client while acting for the opposing party, so he may continue to act for the man but must not act for the neighbour.", "Wrong. Using different fee earners does not cure a direct conflict between two clients in the same dispute.", "Wrong. The parties do not share a substantially common interest; each wants to win the dispute."]}, {"ch": 0, "n": 9, "sc": ["A solicitor who has practised exclusively in family law for many years is approached by a long-standing friend who runs a technology company. The friend asks the solicitor to conduct complex patent infringement litigation on behalf of the company, and offers a generous fee. The solicitor has never handled intellectual property work."], "st": "Which of the following best describes the solicitor’s position in line with the SRA Principles?", "o": ["The solicitor should decline the instructions, as acting in the client’s best interests requires him to consider whether he has the appropriate expertise to deal with the matter.", "The solicitor may accept the instructions because all solicitors are qualified to practise in every area of law.", "The solicitor may accept the instructions provided that the client agrees to a reduced fee to reflect his inexperience.", "The solicitor must decline the instructions because he would lack independence when acting for a friend.", "The solicitor may accept the instructions because the client has chosen him and it is for the client to decide who is competent to act."], "a": "A", "x": ["Correct. Acting in the client's best interests (Principle 7) requires the solicitor to consider whether he has the appropriate expertise to deal with the issues presented. With no IP experience, he should decline.", "Wrong. Being qualified does not mean a solicitor is competent in every area; competence and expertise must be considered.", "Wrong. Reducing the fee does not make up for a lack of expertise or serve the client's best interests.", "Wrong. A friendship does not of itself destroy independence; the real problem on these facts is lack of expertise.", "Wrong. The duty to consider competence lies with the solicitor and cannot be passed to the client."]}, {"ch": 0, "n": 10, "sc": ["A solicitor acts for a client buying a house and recommends a particular surveyor. Unknown to the client, the surveyor pays the solicitor a commission for every client referred. The solicitor does not tell the client about the commission, and there is no agreement allowing the solicitor to keep it."], "st": "Which of the following best describes the ethical position of the solicitor?", "o": ["The solicitor has acted properly because the surveyor, not the client, paid the commission.", "The solicitor has acted properly provided that the surveyor was competent and the survey was accurate.", "The solicitor must pay the commission directly to the client, and may never keep it even with the client’s agreement.", "The solicitor has only breached the SRA Principles if the commission exceeded the solicitor’s fee.", "The solicitor has failed to act in the client’s best interests by making a secret profit, and must account to the client for the commission unless the client agrees otherwise."], "a": "E", "x": ["Wrong. Who pays the commission is irrelevant; an undisclosed commission is a secret profit.", "Wrong. The quality of the survey does not cure the undisclosed financial benefit.", "Wrong. Too absolute: the solicitor must account to the client, but the client may agree otherwise.", "Wrong. Any secret or unauthorised profit is a problem, whatever its size relative to the fee.", "Correct. Acting in a client's best interests requires a solicitor to avoid secret or unauthorised profits, which put the solicitor's interests in conflict with the client's. The solicitor must account to the client for the commission unless the client agrees otherwise."]}, {"ch": 1, "n": 1, "sc": ["A solicitor acts for a buyer in a conveyancing matter. The solicitor has been contacted by the seller of the property demanding receipt of the deposit money by 9 am the following morning. Unable to make contact with the buyer, the solicitor telephones the seller and states that the firm will pay the deposit money by 9 am tomorrow."], "st": "Which of the following best describes the ethical position of the solicitor and the firm?", "o": ["Both the solicitor and their firm are bound by the undertaking and are personally liable to perform the undertaking as provided.", "Neither the solicitor nor the firm are bound by the undertaking and are not personally liable to perform the undertaking as provided, but the buyer will be liable to perform the undertaking.", "The solicitor, but not the firm, is bound by the undertaking and is personally liable to perform the undertaking as provided.", "Neither the solicitor nor the firm are bound by the undertaking, nor are they personally liable to perform the undertaking as provided.", "The firm, but not the solicitor, is bound by the undertaking and is personally liable to perform the undertaking as provided."], "a": "A", "bx": "The correct answer was A. The solicitor, by providing an undertaking that the deposit will be paid by 9 am the following morning, will be personally bound by that undertaking. However, given that the solicitor acts on behalf of their firm, the firm will also be bound by that undertaking. Therefore, all other options are incorrect."}, {"ch": 1, "n": 2, "sc": ["A solicitor acts on behalf of a woman who was involved in a road traffic accident. The woman is the defendant in a personal injury claim. The woman has no counter-claim against the claimant. The solicitor wishes to refer the woman to an insurance company in order to secure after the event (ATE) insurance to fund the solicitor's services. The insurance company offer the solicitor a referral fee of £200."], "st": "Will the solicitor be in breach of the Code of Conduct by accepting the referral fee?", "o": ["Yes, the solicitor must not accept the referral fee in claims for damages following personal injury in any circumstances.", "No, the solicitor can accept the referral fee in claims for damages following personal injury because they are acting for the defendant. The solicitor must account for the referral fee, unless agreed otherwise.", "Yes, the solicitor must not accept the referral fee in claims for damages following personal injury given the potential for an own interest conflict.", "No, the solicitor can accept the referral fee in claims for damages following personal injury because the fee is under £500. The solicitor must account for the referral fee, unless agreed otherwise.", "Yes, the solicitor must not accept the referral fee in claims for damages without the consent of the woman."], "a": "B", "bx": "The correct answer was B. The restriction on referral fees in personal injury cases applies only to claimant clients; it does not apply to defendant clients. Given that the defendant has no counter-claim, there is no restriction on the solicitor obtaining the referral fee (therefore options A, C, and E are wrong). However, the solicitor must account to the client for any financial benefit obtained, which includes referral fees. Option D is wrong because the level of referral fee is irrelevant to the Code of Conduct."}, {"ch": 1, "n": 3, "sc": ["A solicitor is arrested for assault following a house party. The police issue the solicitor with a caution but do not charge him with a criminal offence."], "st": "Is the solicitor obligated to notify the Solicitors Regulation Authority (SRA) of his caution?", "o": ["No, the solicitor is only required to notify the SRA if he was convicted of an offence.", "Yes, the solicitor must notify the SRA of his caution, but need not do it personally. The solicitor may notify the SRA via the firm's manager.", "No, the solicitor is only required to notify the SRA if he was charged with, or convicted of, an offence.", "Yes, the solicitor must notify the SRA of his caution personally or via the firm's compliance officer.", "No, the solicitor is only required to notify the SRA of circumstances which involve serious misconduct, which the assault is not."], "a": "D", "bx": "The correct answer was D. The Code of Conduct requires the solicitor to notify the SRA of any caution, charge, or conviction that they are subjected to. Because of this, it is irrelevant that the solicitor is not charged or convicted of the offence; the caution is sufficient (therefore options A and C are wrong). Option B is wrong in that notification through the firm's manager is not sufficient: the solicitor must either notify the SRA personally or through the firm's compliance officer. Option E is wrong on the basis that the seriousness of the misconduct is not relevant to the automatic notification procedure."}, {"ch": 1, "n": 4, "sc": ["A solicitor is acting for a client whose mother has just died. The solicitor was instructed to deal with the probate. Based upon the initial instructions, the solicitor concluded the matter to be non-contentious and gave the client a likely quote of £1,000 plus VAT for costs. The solicitor has received correspondence from another firm of solicitors advising that they have been instructed to contest the will. Reviewing the documentation that forms part of the objections to the will, the solicitor considers the matter to be more complicated than originally thought."], "st": "Which of the following is the best course of action that should be taken by the solicitor?", "o": ["The solicitor must give the client an update on the likely increase in costs if the matter becomes litigated.", "The solicitor must give the client an updated quote to reflect the contested nature of the probate.", "The solicitor is not permitted to alter the £1,000 fee as that is the original price quoted and agreed with the client.", "The solicitor does not need to inform the client of the likely increase in costs given that the original quoted price was only an estimate.", "The solicitor must charge the £1,000 fee plus VAT as agreed or cease to act."], "a": "A", "bx": "The correct answer was A. As the matter is now contested, the likelihood is that the costs will be of a higher amount than that expected by the solicitor, and of a higher amount initially communicated to the client. As the solicitor is unlikely to be able to give an accurate estimate at this point in time (therefore option B is wrong), the solicitor is better advised to update the client by advising on the likely increase in price. The solicitor is not obligated to maintain their original quote, therefore options C and E are wrong. Option D is incorrect because the solicitor is under a duty to provide the client with the best possible information in relation to costs when appropriate and as the matter progresses (ie they owe a continuing duty)."}, {"ch": 1, "n": 5, "sc": ["A solicitor acts for a man who is buying a house. The solicitor is also later instructed to act for a mortgage company from whom the man has sought a loan in respect of the house. The man has recently been in touch with his solicitor, identifying that he is relieved that the survey of the property, sent to the mortgage company to value the house, omitted evidence which he considers would have prevented his loan from being approved. The solicitor did not identify a conflict of interest between the man and the mortgage provider when he accepted the instructions. However, the solicitor is now concerned that a conflict may exist and requires advice."], "st": "Which of the following is the best advice that should be given to the solicitor?", "o": ["The solicitor can continue to act for the man but must cease to act for the mortgage company. The solicitor must not disclose the reason for ceasing to act to the mortgage company.", "The solicitor can continue to act for both the man and the mortgage company. The solicitor must not disclose the information provided by the man to the mortgage company.", "The solicitor must cease to act for both the man and the mortgage company. The solicitor must not disclose the reason for ceasing to act to both the man and the mortgage company.", "The solicitor can continue to act for the man but must cease to act for the mortgage company. The solicitor must disclose the reason for ceasing to act to the mortgage company.", "The solicitor can continue to act for the man but must cease to act for the mortgage company. The solicitor must not disclose the reason for ceasing to act to the mortgage company unless the man consents to the disclosure."], "a": "E", "bx": "The correct answer was E. At first, there appeared to be no conflict between the man (as the borrower) and the mortgage company (as the lender). However, following the man's disclosure to the solicitor about the survey, the solicitor now holds material information which they would have to disclose to the mortgage company if they continued to act for them. As this material is adverse to the man, the solicitor is now faced with a conflict of interest. Unable to rely on any of the exceptions, the solicitor must cease to act for the mortgage company immediately and, given their duty of confidence to the man, must not disclose the reason for them ceasing to act. Option A is not the best answer because the solicitor can disclose the information to the mortgage company if the man consents (thus why option E is the best answer). Option B is wrong because the man and the mortgage company now have contrary interests and a conflict exists. Option C is incorrect because the solicitor can continue to act for the man in these circumstances as there does not appear to be any confidential information on the facts held by the solicitor in respect of the mortgage company. Option D is wrong because the solicitor is not permitted to disclose the reason for ceasing to act unless permitted by law (not evident here) or with the client's consent."}, {"ch": 1, "n": 6, "sc": ["A firm of solicitors launches a new fixed-fee will-writing service. To promote it, a solicitor emails all of the firm’s current and former private clients, none of whom have opted out of marketing. The solicitor also proposes that the firm’s staff telephone members of the public selected at random from a local directory to offer the service."], "st": "Which of the following best describes the position under the Code of Conduct?", "o": ["Both the emails and the telephone calls are permitted, as solicitors may advertise their services freely.", "The emails to current and former clients are permitted, but the unsolicited telephone calls to members of the public are not.", "Neither the emails nor the telephone calls are permitted, as all unsolicited approaches are prohibited.", "The telephone calls are permitted provided that they are made by non-admitted staff rather than solicitors.", "The emails are permitted only to current clients, and not to former clients."], "a": "B", "x": ["Wrong. Advertising is permitted, but unsolicited approaches to members of the public are not.", "Correct. The Code prohibits unsolicited approaches to members of the public to advertise legal services. Approaching current or former clients is outside that prohibition, so the emails are permitted but the cold calls are not.", "Wrong. Not all unsolicited approaches are prohibited; the restriction applies to members of the public, not to current or former clients.", "Wrong. The prohibition applies to approaches made on the firm's behalf, whoever makes the calls.", "Wrong. Former clients may be contacted, like current clients."]}, {"ch": 1, "n": 7, "sc": ["A solicitor acts for an employer settling a claim brought by a former employee who alleges harassment by a senior manager. The employer instructs the solicitor to include a clause in the settlement agreement preventing the employee from reporting the matter to any regulator or to the police, failing which the settlement sum must be repaid."], "st": "Which of the following best describes the solicitor’s position?", "o": ["The solicitor may include the clause because the employee is free to refuse the settlement.", "The solicitor may include the clause provided that the employee takes independent legal advice before signing.", "The solicitor must include the clause because they must act in the best interests of their client.", "The solicitor must not include the clause, as using an NDA to prevent reporting to regulators or the police is improper and a breach of the Code.", "The solicitor may include the clause, but only in relation to reports made to the police and not to the SRA."], "a": "D", "x": ["Wrong. The employee's ability to refuse does not make an improper clause acceptable.", "Wrong. Independent advice does not make it proper to use an NDA to prevent reporting to regulators or the police.", "Wrong. Best interests of the client never requires a solicitor to act improperly; public interest duties take precedence.", "Correct. The Code and SRA guidance prohibit using NDAs to prevent or discourage reports to a regulator or law enforcement agency. Including the clause would be improper.", "Wrong. Reporting to the police and to the SRA are both protected; neither may be prevented."]}, {"ch": 1, "n": 8, "sc": ["A client asks her solicitor to draft a loan agreement under which she will lend a substantial sum to a company owned by the solicitor. The client says she trusts the solicitor completely, has taken independent legal advice and is willing to give her informed consent in writing to the solicitor acting."], "st": "Which of the following best describes the position of the solicitor?", "o": ["The solicitor may act because the client has taken independent legal advice.", "The solicitor may act provided that effective safeguards are in place to protect confidential information.", "The solicitor must not act, as there is an own interest conflict and there are no exceptions to this rule, even with the client’s consent.", "The solicitor may act under the substantially common interest exception, as both parties want the loan to proceed.", "The solicitor may act because the client’s written informed consent is sufficient."], "a": "C", "x": ["Wrong. Independent legal advice does not cure an own interest conflict.", "Wrong. Safeguards are a condition of the Para 6.2 exceptions for conflicts between clients; they have no part in own interest conflicts.", "Correct. Under Para 6.1 a solicitor must not act where there is an own interest conflict or a significant risk of one. There are no exceptions to this rule, even where the client consents or obtains independent legal advice.", "Wrong. The substantially common interest exception applies only to conflicts between clients, not to own interest conflicts.", "Wrong. Consent, however informed, cannot permit acting where there is an own interest conflict."]}, {"ch": 1, "n": 9, "sc": ["A partner delegates the preparation of a client’s employment tribunal claim to a newly recruited paralegal. The partner does not review the paralegal’s work or check on progress. The paralegal misses the deadline for filing the claim, and the client suffers a loss as a result. The partner argues that the error was entirely the paralegal’s fault."], "st": "Which of the following best describes the position under the Code of Conduct?", "o": ["The partner remains accountable for the work carried out through the paralegal and has failed to supervise it effectively.", "Only the paralegal is responsible, as the paralegal carried out the work.", "Neither the partner nor the paralegal is responsible, as paralegals are not regulated by the SRA.", "The firm’s compliance officer for legal practice alone is responsible for the failure.", "The partner is only responsible if he expressly agreed with the client to supervise the matter personally."], "a": "A", "x": ["Correct. The Code makes a solicitor who supervises or manages others accountable for the work carried out through them, and requires effective supervision. The partner failed to supervise the paralegal at all.", "Wrong. Delegating the work does not delegate accountability.", "Wrong. The partner is regulated and accountable for work done through people he supervises.", "Wrong. Compliance officers have their own duties, but these do not remove the supervisor's accountability.", "Wrong. Accountability for supervision arises under the Code, not from a specific agreement with the client."]}, {"ch": 1, "n": 10, "sc": ["A man contacts a solicitor and says he acts on behalf of his elderly grandmother, who relies heavily on him. He produces a letter, apparently signed by his grandmother, asking the solicitor to transfer the title to her holiday home into the man’s name. The solicitor has never met the grandmother."], "st": "What is the best course of action for the solicitor?", "o": ["The solicitor should proceed with the transfer, as the letter is sufficient written authority.", "The solicitor should refuse to act under any circumstances, as instructions can never come from a third party.", "The solicitor should proceed provided that the man confirms in writing that his grandmother has capacity.", "The solicitor should report the man to the police for attempted fraud.", "The solicitor should satisfy himself that the instructions are genuine, for example by meeting the grandmother without the man present, explaining the consequences of the transfer and obtaining her written consent if she wishes to proceed."], "a": "E", "x": ["Wrong. A letter from a third party who may be exerting influence is not enough; the solicitor must be satisfied that the instructions represent the client's wishes.", "Wrong. Instructions can come through a third party, provided the solicitor is satisfied that they represent the client's wishes.", "Wrong. The grandson's assurance is not independent confirmation of capacity or of genuine instructions.", "Wrong. There is no evidence of fraud justifying a police report; the proper step is to verify the instructions.", "Correct. Under Para 3.1 a solicitor only acts on instructions from the client, or someone authorised by them, and must be satisfied that third-party instructions represent the client's wishes. Seeing the grandmother alone, explaining the consequences and getting her written consent addresses the risk of undue influence."]}, {"ch": 2, "n": 1, "sc": ["A solicitor is acting for a client in a breach of contract claim. The solicitor, who is of Muslim faith, discovers that the client is a member of a far-right wing political party which has links to anti-Islamic protest groups. As a result, the solicitor ceases to act for the client."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["Yes. The solicitor can cease to act for the client on the basis of their affiliation with a political party where it would cause a direct conflict with their own race religion or sexual orientation.", "Yes. The solicitor is the party who decides whether or not it is appropriate to represent or continue to represent a client.", "No. The solicitor has a duty not to discriminate against a client on the basis of their political or ethical views.", "No. Although the solicitor can cease to act for the client, they ought to have secured alternative representation for them first.", "No. The solicitor is under a duty to act in the client's best interests, which are not served by them ceasing to act on the client's behalf."], "a": "C", "bx": "The correct answer was C. Under Para 1.1, a solicitor is under a duty not to discriminate by allowing their personal views to affect professional relationships and the way in which they provide their services. The solicitor has ceased to act for the client on the basis of their political affiliation and is therefore in breach of Para 1.1, making options A and B incorrect. Option D is incorrect as the solicitor is not entitled to cease to act for the client in these circumstances and option E is wrong as, although a solicitor does have a duty to act in the client's best interests, there is no reason why this should not continue to be the case."}, {"ch": 2, "n": 2, "sc": ["A solicitor is acting for a client in a personal injury claim arising from a road traffic accident. The only witness to the accident is elderly, lives 40 miles away from the court at which the trial is taking place, and is in receipt of state benefits as her main form of income. The witness contacts the solicitor to say that she will not be prepared to attend trial unless the solicitor pays her to do so. The solicitor has already served the witness's statement on the defendant and, without her oral evidence, it weakens the client's case substantially."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor should agree to reimbursing the witness for any travel expenses and other associated losses she suffers as a result of attending court, but no more.", "The solicitor should agree to reimbursing the witness for any travel expenses and other associated losses she suffers as a result of attending court, as well as paying her a small fee.", "The solicitor should agree to reimbursing the witness for any travel expenses and other associated losses she suffers as a result of attending court, but no more. The solicitor can, however, arrange for the client to make a small payment to the witness in exchange for her attendance at court.", "The solicitor should agree to reimbursing the witness for any travel expenses and other associated losses she suffers as a result of attending court, as well as paying her a fee. The witness's statement has already been filed, and so it could not be argued that the fee was dependant on the nature of the evidence.", "The solicitor should refuse to pay the witness anything at all."], "a": "A", "bx": "The correct answer was A. Under Para 2.3, a solicitor should not provide or offer to provide any benefit to a witness dependent on the nature of their evidence. Reimbursing the witness for travelling expenses would not be a benefit, as it puts them in the same position as they would have been in were it not for the need to attend court. If the solicitor pays the witness a fee, that would class as a benefit, rendering options B and D incorrect. Option C is incorrect as the solicitor would be responsible for arranging a benefit to be paid to the witness, breaching Para 2.3. Finally, option E is incorrect as reimbursement of losses is not in breach of the Code."}, {"ch": 2, "n": 3, "sc": ["A solicitor is acting for a large company which has issued a claim against a small company for breach of contract. The defendant is represented by a trainee solicitor. The solicitor for the claimant makes an application for an interim payment order. During the course of discussions with the defendant's representative, the solicitor informs them that counsel will be representing the claimant at the scheduled hearing and that, as a result, the defendant is facing a significant interim payment order as well as a substantial costs order being made against them following the hearing. The solicitor has not, in fact, instructed counsel to represent the claimant at the hearing, although it is being considered by the claimant."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["Yes. Whilst the solicitor is not allowed to mislead the defendant's solicitor, the fact that their client is still considering the instruction of counsel is sufficient to mean that they have not breached the Code.", "Yes. The solicitor has not misled the defendant's solicitor, they have merely set out a hypothetical scenario for the defendant's solicitor to consider.", "No. There is a clear attempt to mislead the defendant's solicitor about the nature of the costs order which the court will make.", "No. There is a clear attempt to mislead the defendant's solicitor about the attendance of counsel.", "No. There is a clear attempt to mislead the defendant's solicitor about the nature and size of the interim payment order which the court is likely to make."], "a": "D", "bx": "The correct answer was D. Under Para 1.4, a solicitor must not mislead their opponent. The solicitor has unambiguously confirmed to the defendant's solicitor that counsel has been instructed to conduct the hearing, which is clearly a misleading statement. This makes options A and B incorrect. Options C and E are incorrect as these statements are not misleading, they are just predictions about the outcome designed to put pressure on the defendant's representative. The statement that counsel is attending when the solicitor has no confirmation that this will be the case, however, is deliberately misleading."}, {"ch": 2, "n": 4, "sc": ["A solicitor is acting for a client (the respondent) in opposing an application to amend a statement of case which has already been served. During the course of the hearing, a legal executive acting for the applicant mistakenly states that, even with the permission of the court, the respondent still needs to provide written consent to the statement of case being amended. The solicitor knows this is not the case, however it assists the respondent's case significantly if the application is refused by the court. The solicitor therefore informs the court that the respondent refuses to provide written consent and the application therefore fails."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["No. The solicitor has deliberately misled the applicant by failing to identify their incorrect reading of the procedural rules.", "No. The solicitor has deliberately misled the court by failing to identify the applicant's incorrect reading of the procedural rules.", "No. Although the solicitor has not deliberately misled the court, by failing to correct the applicant's mistake they have been complicit in misleading the court.", "Yes. The solicitor has acted in their client's best interests by simply taking advantage of a mistake made by the applicant.", "Yes. Whilst the court has been misled, the solicitor was not directly responsible for this."], "a": "B", "bx": "The correct answer was B. Under Para 2.7, a solicitor must draw the court's attention to any procedural irregularities of which they are aware, and which are likely to have a material effect on the outcome of the proceedings. In this case, the solicitor knows that the applicant has accidentally misled the court on the wording of the test, and by failing to correct the mistake, the solicitor has deliberately misled the court themselves. This makes options D and E incorrect. Option A is incorrect as it is the court who has been misled, not the applicant, and option C is incorrect as the failure to correct the mistake was deliberate on the part of the solicitor."}, {"ch": 2, "n": 5, "sc": ["A solicitor is instructed to act on behalf of a client who is in dispute with their neighbour over the location of the boundary between their respective land. The solicitor's client argues that the neighbour has moved the boundary and that the client is, in fact, entitled to six inches more land than they currently have. The solicitor acted for the seller of their client's land 18 years ago and remembers being told by the seller that the boundary fence had been moved by agreement due to a mistake in the original title. The solicitor knows that sharing this information with their current client will save them a significant amount of money and stress in litigating the matter."], "st": "Which of the following is the best advice to give to the solicitor in line with the SRA Code of Conduct?", "o": ["The solicitor's duty is to act in the best interests of their current client, rather than owing a duty to their former client. The solicitor is therefore entitled to share the information with their current client.", "The solicitor owes a duty of confidentiality to their former client. They cannot therefore share the information with their current client under any circumstances.", "The solicitor owes a duty of confidentiality to their former client. The only circumstance in which they could disclose the information is if they were required to do so by law.", "The solicitor's duty to their current client is to make them aware of all information material to their matter about which the solicitor has knowledge. The information is relevant and the solicitor must therefore disclose it.", "The solicitor owes a duty of confidentiality to their former client, however also owes a duty to their current client to make them aware of all information material to their matter about which the solicitor has knowledge. Unless consent to share the information can be obtained from the former client, the solicitor must cease to act in the matter."], "a": "E", "bx": "The correct answer was E. Under Para 6.3, a solicitor is under a duty to keep confidential the affairs of all current and former clients unless disclosure is required by law or the client consents to the information being shared. This makes option C incorrect. In this case, this clashes with the duty under Para 6.4 to inform the client of all information of which the solicitor has knowledge which is material to their matter. The duty of confidentiality trumps the duty of disclosure, making options A and D incorrect. Option B is incorrect because it fails to take into account the duty of disclosure."}, {"ch": 2, "n": 6, "sc": ["A solicitor represents a claimant at trial. Owing to time pressure, the solicitor only read the claimant’s witness statements briefly before the hearing. In summing up the evidence, the judge states that one of the claimant’s witnesses said something which the witness did not in fact say. The solicitor does not notice the error and does not correct the judge."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["Yes. A solicitor only breaches the duty not to mislead the court where they act intentionally.", "No. The solicitor has misled the court, albeit unintentionally, as whether a solicitor has misled the court is assessed objectively.", "Yes. It was the judge, not the solicitor, who made the mistake.", "Yes. The solicitor did not draft the witness statements and so is not responsible for their contents.", "No. The solicitor has deliberately misled the court and must be struck off."], "a": "B", "x": ["Wrong. Whether the court has been misled is judged objectively; intention is not required.", "Correct. Para 1.4 requires a solicitor not to mislead the court. The test is objective, so a solicitor can mislead the court unintentionally, for example by failing to correct an inaccurate account of evidence they should have known.", "Wrong. The solicitor has a duty to draw the court's attention to errors like this and to make sure the court is not misled.", "Wrong. Who drafted the statements is irrelevant; the solicitor presenting the evidence must know it well enough to avoid misleading the court.", "Wrong. The misleading was not deliberate, and striking off is not the automatic consequence."]}, {"ch": 2, "n": 7, "sc": ["A wealthy client instructs a solicitor to bring defamation proceedings against a journalist who has published an investigative article about the client’s business dealings. The solicitor considers the claim to be weak. The client explains that the real aim is to pressure the journalist into withdrawing the article through the cost of litigation, and asks the solicitor to send correspondence threatening exaggerated financial consequences."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor should follow the client’s instructions, as litigation strategy is a matter for the client.", "The solicitor may issue proceedings, provided that the correspondence is marked ‘without prejudice’.", "The solicitor may proceed because the weakness of a claim alone is never a breach of the Code.", "The solicitor may proceed provided that the client accepts the risk of an adverse costs order.", "The solicitor should not pursue the claim in this way, as it bears the hallmarks of a SLAPP and the solicitor remains responsible for the litigation strategy and its ethical boundaries."], "a": "E", "x": ["Wrong. The solicitor stays responsible for the litigation strategy and its ethical limits; they cannot simply follow instructions to abuse the process.", "Wrong. Labelling correspondence 'without prejudice' does not make abusive or exaggerated threats acceptable.", "Wrong. The problem is not only that the claim is weak but its purpose and the threats of exaggerated consequences, which are hallmarks of a SLAPP.", "Wrong. The client accepting a costs risk does not make an abusive claim proper.", "Correct. A claim brought mainly to silence a journalist through the cost of litigation, with exaggerated threats, bears the hallmarks of a Strategic Lawsuit against Public Participation (SLAPP). Pursuing it would breach the Principles (including public trust and the proper administration of justice) and the Code."]}, {"ch": 2, "n": 8, "sc": ["A solicitor acts for a defendant in a breach of contract claim brought by an unrepresented individual. The solicitor writes to the claimant stating that, unless the claimant accepts a settlement offer well below the likely value of the claim, the defendant will make as many procedural applications as possible to delay the trial and run up costs."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["No. The solicitor has abused their position by taking unfair advantage of an unrepresented party.", "Yes. The solicitor is entitled to put the client’s position in the strongest possible terms.", "Yes. The solicitor owes no duty to the claimant, who is not their client.", "No. The solicitor should instead have advised the claimant on the strength of their claim.", "Yes. The claimant could have obtained legal advice if they wished."], "a": "A", "x": ["Correct. Under Para 1.2 a solicitor must not abuse their position by taking unfair advantage of clients or others. Threatening an unrepresented party with tactical delay and cost to force an undervalue settlement does exactly that.", "Wrong. Advancing the client's case strongly does not allow threats of abusive procedural tactics.", "Wrong. Duties not to take unfair advantage are owed to others, including opposing parties.", "Wrong. The solicitor must not advise the opponent; the breach lies in taking unfair advantage, not in failing to advise.", "Wrong. That the claimant could have taken advice does not permit the solicitor to exploit their unrepresented status."]}, {"ch": 2, "n": 9, "sc": ["A solicitor acts for a man defending a claim by his former partner, who says she paid cash for renovation work on his property. While reviewing documents for disclosure, the solicitor sees the man remove a builder’s receipt showing that the former partner paid £4,000 in cash. The man says he does not want to ‘complicate things’ by disclosing it."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor may omit the receipt, as the client decides which documents to disclose.", "The solicitor should disclose the receipt to the other side without telling the client.", "The solicitor may omit the receipt provided that they do not refer to it in court.", "The solicitor must explain that the receipt is relevant and must be disclosed and, if the client refuses, the solicitor must cease to act.", "The solicitor must report the client to the police for attempting to pervert the course of justice."], "a": "D", "x": ["Wrong. Disclosure duties under the CPR are not a matter of client choice, and the solicitor must not take part in misleading the court.", "Wrong. Confidentiality prevents the solicitor disclosing without the client's consent; the proper course is to advise the client and cease to act if they refuse.", "Wrong. Leaving out a relevant document the solicitor knows about would mislead the court and the other side, whether or not it is mentioned.", "Correct. The receipt must be disclosed. The solicitor must explain this to the client and, if the client refuses, must cease to act rather than mislead the court or breach confidentiality.", "Wrong. Confidentiality applies, and a police report is not the proper response; the solicitor should advise and, if necessary, cease to act."]}, {"ch": 2, "n": 10, "sc": ["A solicitor is instructed by two defendants to the same negligence claim. After the solicitor has taken instructions from both, the second defendant reveals in confidence information which suggests that the first defendant was primarily responsible, and which would be material to the first defendant’s defence."], "st": "Which of the following is the best advice to give to the solicitor?", "o": ["The solicitor may continue to act for both defendants under the competing for the same objective exception.", "The solicitor may continue to act for the first defendant and must disclose the information to them.", "The solicitor must cease to act for both defendants, as the duty of confidentiality to the second defendant conflicts with the duty of disclosure to the first.", "The solicitor may continue to act for both defendants provided that both give informed consent in writing.", "The solicitor must cease to act for the second defendant only."], "a": "C", "x": ["Wrong. Co-defendants are not 'competing for the same objective' in the sense of the exception.", "Wrong. The solicitor cannot disclose the second defendant's confidential information; confidentiality trumps disclosure.", "Correct. Where a second client has already shared confidential information relevant to the first, the solicitor must cease to act for both. Otherwise the duty of confidentiality to one would conflict with the duty of disclosure to the other.", "Wrong. Consent cannot resolve the conflict between confidentiality and disclosure once the information is held.", "Wrong. Ceasing to act only for the second defendant still leaves the solicitor holding information material to the first, which they cannot disclose."]}, {"ch": 3, "n": 1, "sc": ["A solicitor acts for a private limited company, which has agreed in principle a new banking facility with a high street lender, subject to formal agreement of terms and bespoke security documentation. The bank will require completion of a debenture over the company's assets and a first legal charge over the company's business premises. The client has asked whether the solicitor may also act for the bank, in order to save costs."], "st": "Which of the following best describes the position?", "o": ["The solicitor may act for the client and the bank here, provided that they follow current guidance from the Law Society.", "The solicitor may act for the client and the bank here, as the parties are competing for the same objective.", "The solicitor cannot act for the client and the bank here, as the loan and security documentation will need to be negotiated, and guidance from the Law Society in relation to residential transactions does not apply.", "The solicitor could act for the client and the bank in relation to the investigation of title and/or completion, as the clients will most likely have a substantially common interest. The bank will need separate representation for negotiation of the terms of the documentation.", "The solicitor may act for the client and the bank as the parties have a substantially common interest, subject to both the client and the bank giving informed consent, effective safeguards being in place and the solicitor being satisfied that it is reasonable so to act."], "a": "D", "bx": "The correct answer was D. The solicitor cannot act under guidance from the Law Society as the conditions do not apply (this is not just a residential mortgage on standard terms). Therefore, option A is incorrect. The competing for the same objective exception does not apply here, so option B is incorrect. Option C is partially correct as, although separate representation will usually be required where commercial terms require negotiation, a solicitor may act in relation to the investigation of title and/or completion, under the substantially common interest exception (making option D correct). Option E is also incorrect, as it does not make this distinction, although it does outline the conditions attached to the exception, which option D does not."}, {"ch": 3, "n": 2, "sc": ["A client is a sole practitioner in an accountancy business and he has agreed to borrow a substantial sum from a high street lender. The loan will be used to expand the business, but to secure it, the lender will require a first legal charge over the matrimonial home that the client owns jointly with his wife. The client's wife has asked the client's solicitor to act for her in the transaction."], "st": "Which of the following best describes the position?", "o": ["Provided the solicitor is satisfied there is no conflict of interest or a significant risk of one, they may act for both the client and the client's wife in relation to the proposed legal charge.", "The solicitor may not act for the client and the client's wife in relation to the proposed legal charge in any circumstances.", "The solicitor may act for the client only. The client's wife will require separate representation.", "The solicitor may act for both the client and the client's wife, but will need to adhere to the guidelines from relevant case law in advising the wife.", "Provided the solicitor is satisfied there is no conflict of interest, or a significant risk of one, they may act for both the client and the client's wife, with careful adherence to the guidelines from relevant case law."], "a": "E", "bx": "The correct answer was E. The solicitor may act for both the client and the client's wife, but will need to adhere to guidance from case law (specifically, the Etridge guidelines). The solicitor must, however, first be satisfied that there is no conflict of interest and no significant risk of one arising in so acting. Option D is incorrect as it omits this additional detail, which is present in option E. Options A, B and C are incorrect as they do not make reference to the Etridge guidelines. Option B is also incorrect as it may be possible to act for both the client and the client's wife in some circumstances. Although the solicitor may ultimately decide that the client's wife may require separate representation (option C), they will need to consider first whether there is a conflict of interest or a significant risk of one arising."}, {"ch": 3, "n": 3, "sc": ["A solicitor is approached to carry out due diligence on a private limited company. The solicitor's spouse is employed by the company as finance director and has a minority shareholding in the company."], "st": "Which of the following best describes the position?", "o": ["The solicitor cannot act as there is an own interest conflict, due to the financial interest of the solicitor's spouse.", "The solicitor cannot act as there is a conflict of interest.", "The solicitor cannot act as there is an own interest conflict, unless the client gives informed consent to the solicitor acting.", "The solicitor can act as there is no conflict of interest with an existing or former client.", "The solicitor can act as they do not have a personal interest in the company, provided that they disclose the interest of their spouse."], "a": "A", "bx": "The correct answer was A. This is an own interest conflict, rather than a conflict of interest, therefore, options B and D are incorrect. Options C and E are incorrect as the own interest conflict rule is strict and without exception. SRA guidance makes specific reference to the financial interests of connected parties to the solicitor; therefore, option E is also incorrect on this point."}, {"ch": 3, "n": 4, "sc": ["A solicitor has been asked to act on the incorporation of a private limited company by the four proposed director-shareholders. The proposed director-shareholders have agreed finance terms with a high street lender and they agree as to the proposed management structure and shareholdings."], "st": "Which of the following best describes the position?", "o": ["The solicitor may not act for all four proposed director-shareholders as although there is no immediate conflict of interest, there is a significant risk of one arising.", "The solicitor may not act here under any circumstances.", "The solicitor may act here, despite the potential risk of a conflict of interest arising, using the substantially common interest exception.", "The solicitor may act here, despite the potential risk of a conflict of interest arising, as the proposed director-shareholders are competing for the same objective.", "The solicitor may act here, despite the potential risk of a conflict of interest arising, using the substantially common interest exception, subject to the conditions of the exception."], "a": "E", "bx": "The correct answer was E. The competing for the same objective exception does not apply on the facts, so option D is incorrect. Options A and B are incorrect, as the solicitor will need to consider whether there is a significant risk of conflict of interest arising and, if there is, they may still be able to act under the substantially common interest exception. Therefore, option C is partially correct, although option E is most correct as it refers to the relevant conditions."}, {"ch": 3, "n": 5, "sc": ["A solicitor has been asked to act for both a retiring partner and a continuing partner on the retiring partner's exit from the business. Both partners have a good working relationship and they have agreed the basic terms."], "st": "Which of the following best describes the position?", "o": ["The solicitor cannot act as there is a conflict of interest between the retiring partner and the continuing partner.", "The solicitor cannot act, as there is a significant risk of a conflict of interest between the retiring partner and the continuing partner.", "The solicitor could act, despite the significant risk of a conflict of interest, provided that both the retiring and continuing partner give informed consent.", "The solicitor could act, as the retiring and continuing partners would be competing for the same objective. Both the retiring and continuing partners would need to give informed consent, effective safeguards would need to be put in place concerning protection of confidential information and the solicitor would need to be satisfied it is reasonable to do so.", "The solicitor could act, despite the significant risk of a conflict of interest, provided that both the retiring and continuing partners give informed consent, effective safeguards are put in place concerning protection of confidential information and the solicitor is satisfied it is reasonable to do so."], "a": "B", "bx": "The correct answer was B. Option A is incorrect as there is no immediate conflict of interest, because the basic terms are agreed. However, there is a significant risk of conflict arising, due to the potential for future disagreement and further negotiations as the deal progresses. Option D is incorrect, as the competing for the same objective exception does not apply on the facts. Despite the business connection and good relationship between the partners, the transaction is essentially a sale and purchase, for value, calling for negotiations of commercial terms at arm's length. Therefore, the substantially common interest exception will be unlikely to apply and option E (which mentions its conditions) is incorrect. Option C is also incorrect as informed consent only applies where either of the exceptions apply."}, {"ch": 3, "n": 6, "sc": ["Two separate companies ask the same solicitor to act for them in bidding for the business assets of a company that is being sold through a liquidation process. Both companies are aware that the other is bidding."], "st": "Which of the following best describes the position?", "o": ["The solicitor cannot act for both companies in any circumstances, as they are seeking to acquire the same asset.", "The solicitor may act for both companies under the substantially common interest exception.", "The solicitor may act for both companies without any conditions, as both know of the other’s bid.", "The solicitor may act for whichever company instructed them first.", "The solicitor may act for both companies under the competing for the same objective exception, provided that both give informed written consent, effective safeguards protect confidential information and the solicitor is satisfied it is reasonable to act."], "a": "E", "x": ["Wrong. Two clients bidding for the same asset may still be acted for under the competing for the same objective exception.", "Wrong. The bidders do not share a common purpose; they are competing.", "Wrong. Even if the exception applies, the Para 6.2 conditions must be met.", "Wrong. Being instructed first is not the test under the Code.", "Correct. 'Objective' includes an asset sought through a liquidation. The solicitor may act for both bidders under the competing for the same objective exception (Para 6.2(b)), provided both give informed consent given or evidenced in writing, effective safeguards protect confidential information and the solicitor is satisfied it is reasonable to act."]}, {"ch": 3, "n": 7, "sc": ["A solicitor acts for a buyer in the acquisition of a private limited company. Keen to keep the transaction on track, the solicitor tells the seller’s solicitors that his client’s bank finance offer is in place. In fact, the bank has not yet issued a finance offer, although the client expects one shortly."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["Yes. The statement is likely to become true shortly, so no harm has been caused.", "No. The solicitor has misled the other party by confirming that a finance offer is in place when it is not.", "Yes. The duty not to mislead applies only to clients and the court.", "Yes. The solicitor was acting in the best interests of the client.", "No. But the breach is cured if the finance offer is issued before completion."], "a": "B", "x": ["Wrong. The statement was untrue when made; it is irrelevant that it may become true later.", "Correct. Para 1.4 prohibits misleading others, including the other side. Confirming that a finance offer is in place when it is not is misleading.", "Wrong. The duty not to mislead extends to third parties, including other solicitors.", "Wrong. Best interests of the client do not justify misleading the other side.", "Wrong. A later finance offer does not cure the earlier misleading statement."]}, {"ch": 3, "n": 8, "sc": ["Three individuals plan to buy a small business together. They have agreed between themselves the price and how they will share ownership, and they ask the same solicitor to act for all three of them on the purchase."], "st": "Which of the following best describes the position?", "o": ["The solicitor will usually be able to act for all three joint buyers, subject to compliance with the Code of Conduct on conflicts of interest.", "The solicitor may never act for more than one buyer in a business transaction.", "The solicitor may act for the buyers and the seller, as all parties have agreed the price.", "The solicitor may act for only one of the buyers, chosen by the other two.", "The solicitor may act for all three buyers only under the competing for the same objective exception."], "a": "A", "x": ["Correct. A solicitor may usually act for joint buyers in transactional work, as they usually share the same interest, subject to Para 6.2. Best practice is to take instructions from all of them.", "Wrong. There is no prohibition on acting for joint buyers.", "Wrong. Acting for buyer and seller in an arm's length sale is very likely to involve a conflict.", "Wrong. There is no rule that only one buyer may be represented.", "Wrong. Joint buyers are not competing; any exception would be substantially common interest."]}, {"ch": 3, "n": 9, "sc": ["Two long-standing corporate clients of a firm wish to enter into a commercial supply agreement with each other. The terms are still to be negotiated at arm’s length, and both clients ask the same solicitor to act for them in agreeing the contract to save time and costs."], "st": "Which of the following best describes the position?", "o": ["The solicitor may act for both clients as they are both existing clients of the firm.", "The solicitor may act for both clients under the competing for the same objective exception.", "The solicitor may act for both clients provided that both give informed consent.", "The solicitor should not act for both clients, as agreeing a commercial contract between two clients at arm’s length gives rise to a conflict of interest.", "The solicitor may act for both clients if separate fee earners handle each side."], "a": "D", "x": ["Wrong. Being existing clients does not prevent a conflict of interest.", "Wrong. The clients are not competing for an asset, contract or opportunity in the defined sense.", "Wrong. Consent alone is not enough; an exception must apply first.", "Correct. SRA guidance lists agreeing a commercial contract between two clients as an example of a conflict of interest. As terms are to be negotiated at arm's length, the solicitor should not act for both.", "Wrong. Separate fee earners do not remove the conflict between the firm's two clients."]}, {"ch": 3, "n": 10, "sc": ["A solicitor acts for a company that is borrowing from a bank. The bank requires a personal guarantee from the elderly mother of the company’s sole director, who has no involvement in the business. The director asks the solicitor also to act for his mother in relation to the guarantee."], "st": "Which of the following best describes the position?", "o": ["The solicitor may always act for both the borrower and a third party guarantor.", "The solicitor may act for the mother provided that the director gives informed consent.", "The solicitor may only act for both if satisfied that there is no conflict of interest or significant risk of one, which is unlikely given the potential for undue influence; if acting, the Etridge guidelines must be followed.", "The solicitor may act for both under the competing for the same objective exception.", "The solicitor may act for the mother because she is not borrowing any money herself."], "a": "C", "x": ["Wrong. Acting for both borrower and third-party guarantor is often not possible, owing to the risk of conflict.", "Wrong. It is the mother's interests and the risk of undue influence that matter; the director's consent is irrelevant.", "Correct. With a guarantee, it is highly likely that there will be a conflict or significant risk of one, given the potential for undue influence. A solicitor may only act if satisfied that there is no such conflict and, if acting, must follow the Etridge guidelines.", "Wrong. The borrower and guarantor are not competing for an objective.", "Wrong. The mother's personal assets are at risk under the guarantee, so her interests may well conflict with the borrower's."]}, {"ch": 4, "n": 1, "sc": ["A man is charged with burglary, contrary to s 9 Theft Act 1968. The prosecution's evidence largely rests on the visual identification of a witness to the offence. The witness claims to have seen the man enter and exit the building at the time the alleged offence was committed. The witness' view was obstructed, and it was night-time when the identification was made. The man informs his solicitor that he committed the offence in question but wishes to plead not guilty."], "st": "Which of the following best describes the ethical position of the solicitor?", "o": ["The sol
