icitor must cease to act for the man immediately and must inform the court they are ceasing to act for professional reasons.", "The solicitor may continue to represent the man. The solicitor is able to cross-examine prosecution witnesses, make a submission of no case to answer, and examine-in-chief defence witnesses, including the man.", "The solicitor may continue to represent the man. The solicitor is able to cross-examine prosecution witnesses and make a submission of no case to answer. However, the solicitor is not permitted to put forward a positive case for the defence.", "The solicitor must cease to act for the man immediately and must inform the court as to the reasons for ceasing to act.", "The solicitor may continue to represent the man. The solicitor is unable to cross-examine prosecution witnesses, make a submission of no case to answer, or put forward a positive case for the defence."], "a": "C", "bx": "The correct answer was C. This is because the solicitor is not obliged to withdraw from the case (options A and D are therefore wrong). The solicitor is able to continue to act for the man, and is permitted to put the prosecution to proof. This means that the solicitor is able to cross-examine prosecution witnesses and make a submission of no case to answer (therefore option E is wrong). However, the solicitor is not permitted to put forward any positive defence for the man which they know to be false or misleading (therefore option B is incorrect). The solicitor is not permitted to allow the man to give evidence that he did not, for example, commit the offence in question. Given that the prosecution's case is relatively weak in this instance due to the difficulties of the eyewitness testimony, the solicitor will likely be able to test the prosecution's case without putting forward a positive (and false) case for the defence."}, {"ch": 4, "n": 2, "sc": ["A woman is charged with theft, contrary to s 1 Theft Act 1968, and pleads guilty. At present, the facts of the case indicate that a custodial sentence cannot be imposed. Immediately before the sentencing hearing starts, the prosecutor hands the defence solicitor the antecedents and asks if they are agreed. In confidence, the defence solicitor speaks with the woman. The woman explains that she has previous convictions for theft and that, as these are currently missing from the paperwork, the antecedents are therefore inaccurate. The defence solicitor now believes that these convictions will impact the sentence, making custody a strong possibility."], "st": "Which of the following best describes what action the solicitor should take to ensure that they comply with their ethical obligations?", "o": ["The solicitor must firstly explain to the woman that they now have a duty to disclose these previous convictions to the court, and ask whether she consents to doing so. The solicitor must explain that if the woman does not consent, then the solicitor must cease to act. The solicitor must disclose the reason for ceasing to act to the court.", "The solicitor may continue to act for the woman but must not disclose the previous convictions to the court or the prosecutor.", "The solicitor must firstly explain to the woman that they now have a duty to disclose these previous convictions to the court, and ask whether she consents to doing so. The solicitor must explain that if the woman does not consent, then the solicitor must cease to act. The solicitor must only disclose the reason for ceasing to act to the court if asked by the judge.", "The solicitor must cease to act immediately and has a duty to disclose the previous convictions to the court or the prosecutor.", "The solicitor must firstly explain to the woman that they now have a duty to disclose these previous convictions to the court, and ask whether she consents to doing so. The solicitor must explain that if the woman does not consent, then the solicitor must cease to act. The solicitor must not, however, disclose the reason for ceasing to act to the court, even if asked by the judge."], "a": "E", "bx": "The correct answer was E. In line with Para 1.4, the solicitor must not mislead the court. To continue to act without correcting the inaccuracies of the antecedents, after having been explicitly asked to check them by the prosecution, would mislead the court and breach the duty under Para 1.4 (therefore option B is wrong). However, Para 6.3 also requires the solicitor to maintain client confidentiality: a solicitor must not disclose client information without the client's consent. Option E represents the best answer here given that the solicitor must seek the consent of the client to continue to act, and if the client is unwilling to disclose the material, at that point the solicitor must cease to act. Option A is wrong because the solicitor would be in breach of their duty of confidence if they were to disclose the reasons for ceasing to act. Option C is wrong because the solicitor is not permitted to disclose client information, even if asked by the judge. Option D is wrong because the necessity to cease to act only arises where the client refuses to consent to the disclosure, meaning that the solicitor would be in breach of their duty to not mislead the court."}, {"ch": 4, "n": 3, "sc": ["A solicitor advocate appears on behalf of a woman charged with assault. The woman maintains that she did not commit the offence. However, in a meeting with the solicitor, the woman discloses that she is distraught with the stress of proceedings, and tells the solicitor that she has 'had enough' and that she wishes to plead guilty to the offence despite the fact that she is innocent. The solicitor's attempts to dissuade the woman from entering such a plea are unsuccessful."], "st": "Which of the following correctly identifies the appropriate conduct of the solicitor?", "o": ["If the woman insists on entering a guilty plea, despite maintaining her innocence, the solicitor can continue to represent her and there are no restrictions on the mitigation the solicitor can put forward at any sentencing hearing.", "If the woman insists on entering a guilty plea, despite maintaining her innocence, the solicitor must withdraw immediately from the case, as to continue to represent the woman would mean they would be knowingly misleading the court.", "If the woman insists on entering a guilty plea, despite maintaining her innocence, the solicitor can continue to represent the woman, but the solicitor must inform the court that the woman is pleading guilty against the solicitor's advice.", "If the woman insists on entering a guilty plea, despite maintaining her innocence, the solicitor must withdraw immediately from the case, as to continue to represent the woman would mean they would be knowingly misleading the court. The solicitor must also inform the court as to the reason that they are ceasing to act.", "If the woman insists on entering a guilty plea, despite maintaining her innocence, the solicitor can continue to represent her, but there are restrictions on what the solicitor can say at any sentencing hearing in terms of mitigation."], "a": "E", "bx": "The correct answer was E. The solicitor is still permitted to represent the woman; however, the solicitor would be restricted as to what they could say in mitigation (therefore option A is wrong) (for example that she was remorseful for her conduct, as she had maintained to the solicitor that she is innocent and this would therefore be actively misleading the court). Options B and D are wrong because the solicitor can continue to represent the woman without misleading the court, as long as they observe the restrictions on mitigation. Options C and D are equally wrong because they would involve a breach of confidentiality by disclosing the reason for withdrawing to the court."}, {"ch": 4, "n": 4, "sc": ["A man is charged with assault. The man is a member of a far-right extremist group with previous convictions for racially aggravated assault. The man has extreme views on immigration and has previously expressed a hatred towards non-white communities. The man seeks to instruct a solicitor to act on his behalf. The solicitor finds the man's views and beliefs abhorrent as they are in conflict with their own."], "st": "Which of the following best describes the position of the solicitor?", "o": ["The solicitor would be entitled to refuse the man's instructions as the conflict between their political views and opinions and that of the man would mean that they would be professionally embarrassed.", "The solicitor would be obliged to accept the instruction, despite finding the conduct, opinions and beliefs of the man unacceptable, and must act in the best interests of the man in representing him.", "The solicitor would not be entitled to refuse the man's instruction on the basis that they find the conduct, opinions and beliefs of the man unacceptable. To do so would be discriminatory.", "The solicitor would be entitled to refuse the man's instruction on the basis that they find the conduct, opinions and beliefs of the man unacceptable, as such refusal would not be discriminatory.", "The solicitor would be obliged to accept the instruction but could apply to the court to be released from their professional obligations to the man, as to represent him would not be in his best interests."], "a": "D", "bx": "The correct answer was D. A solicitor is never obligated to accept instructions so long as such refusal is not as a result of any discrimination. Whilst it is arguable that the solicitor has discriminated against the man because of his extremist views, it is unlikely that this will amount to discriminatory conduct within Para 1.1 of the Code (therefore option C is wrong). Option A is unlikely to be the best answer because professional embarrassment would not be in issue. Options B and E are wrong because a solicitor is never obligated to accept instructions."}, {"ch": 4, "n": 5, "sc": ["A solicitor works in a criminal practice and is instructed to act on behalf of a man charged with burglary. Following a meeting, the solicitor overhears the man on his mobile phone negotiating to buy firearms for a planned burglary of a commercial premises."], "st": "Which of the following best describes the solicitor's duty in this case?", "o": ["The solicitor should contact the police immediately. Disclosure to the police is permitted by law in this circumstance and will not amount to a breach of confidence.", "The solicitor should confront the man and advise him that he should not engage in criminal conduct. If the man refuses to cease in his conduct, the solicitor should contact the police.", "The solicitor is not permitted to contact the police, as to do so would breach the solicitor's duty to maintain client confidentiality, unless the man consents to the disclosure.", "The solicitor should contact the police immediately. Whilst disclosure to the police is permitted by law in this circumstance, disclosure will still amount to a breach of confidence.", "The solicitor is not permitted to contact the police, as to do so would breach the solicitor's duty to maintain client confidentiality."], "a": "A", "bx": "The correct answer was A. The solicitor is able to make a disclosure of the affairs of the client where the disclosure is permitted by law (Para 6.3). Potential commission, or attempted commission, of a criminal offence would be a matter to be disclosed. There is no breach of confidence as the disclosure would be permitted by law (therefore options C, D, and E are wrong). Option B is wrong because the solicitor is not obligated under the Code to dissuade the man from committing or attempting to commit an offence."}, {"ch": 4, "n": 6, "sc": ["A man is charged with theft and tells his solicitor that he took the goods from a shop without paying. During the interview, the solicitor tells the man that if he says he believed he had already paid, he would have a good defence, and suggests that the man adopt that account in his defence statement."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["Yes. The solicitor must act in the best interests of the client, which includes identifying any available defence.", "Yes. It is for the client, not the solicitor, to decide what account to give.", "No. The solicitor must not suggest a defence to fit the facts or put words into the client’s mouth, as this would influence the substance of evidence.", "No. The solicitor should have advised the client to plead guilty.", "Yes, provided that the client signs the defence statement personally."], "a": "C", "x": ["Wrong. Best interests do not allow putting forward a defence the solicitor knows to be false.", "Wrong. The solicitor must not construct or suggest a false account for the client.", "Correct. A solicitor must not suggest a defence to fit the facts or put words into a client's mouth. This would influence the substance of evidence and risk misleading the court.", "Wrong. The solicitor advises on plea, but the breach here is suggesting a false defence, not failing to advise a guilty plea.", "Wrong. A signature does not cure the solicitor's improper part in creating the account."]}, {"ch": 4, "n": 7, "sc": ["A man is charged with murder and tells his solicitor he wishes to plead guilty. From the man’s account, the solicitor considers that a partial defence of loss of control may be available, which, if successful, would avoid the mandatory life sentence. The man still says he wants to plead guilty."], "st": "Which of the following best describes the solicitor’s professional obligations?", "o": ["The solicitor should advise the man that the defence is available, explain its strengths and limitations and the effect of a guilty plea, and obtain the man’s signature on a written record of the advice and his decision.", "The solicitor must enter a not guilty plea on the man’s behalf, as a defence is available.", "The solicitor must not mention the defence, as doing so would influence the man’s evidence.", "The solicitor must cease to act immediately, as the man’s instructions are contrary to his best interests.", "The solicitor must inform the court that the man has a possible defence but is pleading guilty."], "a": "A", "x": ["Correct. The solicitor must advise on the available defence, its strengths and limitations and the effect of a guilty plea. The decision on plea is the client's, and it is good practice to keep a signed record of the advice and the client's decision.", "Wrong. Plea is for the client to decide; the solicitor cannot override the client's instructions.", "Wrong. Advising on an available defence is part of acting in the client's best interests, not improperly influencing evidence.", "Wrong. The solicitor can continue to act on a guilty plea after giving full advice.", "Wrong. Telling the court about the advice or defence would breach confidentiality."]}, {"ch": 4, "n": 8, "sc": ["A defence solicitor decides that there are compelling reasons why they can no longer act for a client charged with robbery, as continuing would professionally embarrass them. The trial is listed for the following week, and the court asks the solicitor why they are withdrawing."], "st": "What should the solicitor tell the court?", "o": ["The solicitor must explain the full reasons for withdrawing, as the duty to the court is paramount.", "The solicitor must disclose the reasons only if the judge orders them to do so.", "The solicitor must continue to act until the trial has concluded.", "The solicitor should tell the court that the client has dismissed them.", "The solicitor should inform the court that they are unable to continue to act for professional reasons, without disclosing confidential information."], "a": "E", "x": ["Wrong. Confidentiality prevents disclosing the reasons for withdrawing.", "Wrong. Confidentiality continues; the solicitor should not disclose the reasons even if asked.", "Wrong. A solicitor may withdraw for compelling professional reasons.", "Wrong. That would be untrue and would mislead the court.", "Correct. The solicitor should simply tell the court they cannot continue to act for professional reasons. They must not disclose confidential information, consistently with Para 6.3."]}, {"ch": 4, "n": 9, "sc": ["A duty solicitor at a police station is asked to advise two suspects arrested for the same burglary, both of whom are eligible for legal aid. After a private consultation with the first suspect, it becomes clear that the first suspect intends to blame the second, and the solicitor now holds confidential information from the first suspect that is relevant to the second."], "st": "Which of the following best describes what the solicitor should do?", "o": ["The solicitor may continue to act for both, as legal aid rules require one solicitor for all co-suspects.", "The solicitor should cease to act for both suspects, informing the police that each requires separate legal advice, and must maintain confidentiality.", "The solicitor should cease to act for the first suspect only and continue to advise the second.", "The solicitor may continue to act for both if both consent in writing.", "The solicitor should inform the police of what the first suspect has said."], "a": "B", "x": ["Wrong. One solicitor may be appointed for co-defendants on legal aid only where there is no conflict; legal aid does not override the conflict analysis.", "Correct. Where a conflict exists, the solicitor must cease to act for at least one client and tell the police that separate advice is needed. Since the solicitor holds confidential information from the first suspect relevant to the second, they must cease to act for both, maintaining confidentiality.", "Wrong. Continuing for the second suspect would leave the solicitor holding the first suspect's confidential information, material to the second.", "Wrong. Consent does not resolve the clash between confidentiality and disclosure.", "Wrong. Disclosing what the first suspect said would breach confidentiality."]}, {"ch": 4, "n": 10, "sc": ["A solicitor represents a woman jointly charged with fraud alongside a co-defendant, who has separate representation. The co-defendant’s solicitor telephones the woman’s solicitor and asks for details of what the woman has said about the offence, explaining that it would help both defendants."], "st": "How should the woman’s solicitor respond?", "o": ["The solicitor should provide the information, as both solicitors owe a duty to the court.", "The solicitor may provide a summary of the information, provided that it is marked confidential.", "The solicitor should provide the information if they consider it to be in the woman’s best interests, without needing to consult her.", "The solicitor should not respond to the request; if disclosure appears to be in the woman’s best interests, the solicitor must explain this to her and obtain her written informed consent first.", "The solicitor must report the request to the prosecution."], "a": "D", "x": ["Wrong. Duties to the court do not require disclosure of a client's confidential information.", "Wrong. Marking information confidential does not make disclosure without consent lawful.", "Wrong. Disclosure requires the client's informed consent, not just the solicitor's view of her interests.", "Correct. The woman's account is confidential (Para 6.3). If disclosure seems to be in her best interests, the solicitor should explain this and get her specific, informed consent, ideally in writing, before disclosing anything.", "Wrong. There is no duty to report the request to the prosecution."]}, {"ch": 5, "n": 1, "sc": ["A solicitors' firm was appointed as executor of the deceased's will. The firm inserted a clause in the will that they would not be liable for any loss or damage unless it was caused by their actual fraud. The firm did not tell the testator that they had done this. The beneficiaries of the will consider that the solicitors' firm has taken an excessive time to administer the will and lost them money. The beneficiaries complain to the firm, but the firm dismiss the complaint."], "st": "Which of the following is the best course of action for the beneficiaries?", "o": ["The beneficiaries should sue the solicitors' firm.", "The beneficiaries should complain to the Legal Ombudsman.", "The beneficiaries have no remedy as such clauses are legal.", "The beneficiaries have no claim as their complaint has gone through the correct procedure and been dismissed.", "The beneficiaries should ask the solicitors' firm to reconsider their complaint."], "a": "B", "bx": "The correct answer was B. Clauses excluding liability are legal, but solicitors are obliged to warn clients that they propose to include such a clause and explain what its effect would be. Paras 8.2-8.5 of the Code require solicitors to have a complaints procedure and inform clients in writing of its provisions. If a complaint is not resolved to the client's satisfaction, they must be informed in writing of their right to complain to the Legal Ombudsman. As the firm has dismissed the claim, the next step in the process is to complain to the Legal Ombudsman. Therefore all other options are incorrect."}, {"ch": 5, "n": 2, "sc": ["A solicitor is engaged by a son, who brings his mother to the solicitor's practice and explains that his mother wants to change her will. The solicitor is told by the son that his mother's previous will divided her property equally between her three children, but now she wants to leave all her property to her son. The solicitor also learns that the mother has recently been discharged from a care home, at the request of her son, and entrusted to his care."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor should accept the son's request as any will may be revoked.", "The solicitor should accept the son's request if they are satisfied that the mother has the mental capacity to make a will.", "The solicitor should accept the son's request as there is no legal obligation to leave money to all children.", "The solicitor should accept the son's request if a doctor certifies that the mother has the legal capacity to make a will.", "The solicitor should accept the son's request if they have confirmed with the mother that they represent her instructions."], "a": "E", "bx": "The correct answer was E. Legally, it is correct that a person can revoke their existing will, simply by making a new will, and there is no obligation in English law to leave money to children or any other relative. However, there is a suspicion here that the son might have undue influence over his mother. We are not given any information in the question that the mother might lack mental capacity, so the better answer is E. The primary duty under Para 3.1 of the Code is that the solicitor must satisfy themselves that the son's instructions represent the wishes of the mother, which covers both mental capacity and duress. All other options are therefore incorrect."}, {"ch": 5, "n": 3, "sc": ["The executors of a will have instructed a solicitor to apply for the grant of probate on their behalf. The executors are going to undertake the estate administration themselves upon receiving the grant of probate. After 18 months, probate has still not been granted, but the solicitor will not explain why. The executors are concerned about the delay and increasing expense and wish to make a complaint."], "st": "Which of the following most accurately represents the solicitor's conduct in this case?", "o": ["The solicitor has misled the executors.", "The solicitor has taken unfair advantage of the executors.", "The solicitor has not established an effective complaints procedure.", "The solicitor has not progressed the matter within an agreed or reasonable time.", "The solicitor has not given proper information to the executors about the likely cost."], "a": "D", "bx": "The correct answer was D. The executors could probably base the complaint on all five of the possible answers, but you are asked to select the best answer. The question does not tell us very much about what the solicitor has done, so we do not know whether they have misled the executors or taken advantage of them or what kind of complaints procedure they have or whether they have agreed the cost of the application or agreed a timescale. But the grant of probate should usually be obtained well within a year of making the application, so 18 months, without explanation, is not a reasonable time (Para 1.3). Therefore, option D is the best answer."}, {"ch": 5, "n": 4, "sc": ["The executors of a will ask a solicitor to make an application for probate on their behalf. The solicitor accepts the instruction, but upon reading the will discovers that the testatrix has left land to the testatrix's daughter. That land adjoins land owned by the solicitor, and the solicitor wishes to buy that land."], "st": "Which of the following is the best advice to give the solicitor in line with the SRA Code of Conduct?", "o": ["The solicitor should inform the executors of the possible conflict of interest and gain their consent to proceed.", "The solicitor should inform the beneficiaries of the possible conflict of interest and gain their consent to proceed.", "The solicitor should not accept the instruction as there is a conflict of interest.", "The solicitor may accept the instruction and offer to buy the land after probate has been granted.", "The solicitor should not accept the instruction because they would be taking unfair advantage of the client."], "a": "C", "bx": "The correct answer was C. This is a clear example of an own interest conflict (Para 6.1). An executor cannot purchase property from the estate as a result of the self-dealing rule, nor should someone acting for them (therefore option D is wrong). There is no provision in Part 6 of the Code for clients or anyone else to consent where such a conflict exists (therefore options A and B are incorrect). As to option E, we have no information in the question that the solicitor would be taking unfair advantage, by, for example, obtaining a low price for the land."}, {"ch": 5, "n": 5, "sc": ["A solicitor drew up a will for an elderly man ten years ago. The solicitor had some concerns about the man's mental state and requested a capacity assessment by a medical practitioner. The man was content for the assessment to be made but insisted that he did not want his family to know. The medical practitioner certified that the man had sufficient mental capacity to make a will, making a full report confirming this, and the will was executed in the presence of the medical practitioner. The man has recently died and his son, who is unhappy about the terms of the will, seeks the solicitor's advice."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor may accept the instruction, as the man was a former and not a current client.", "The solicitor may accept the instruction if the former client consents to the disclosure of the confidential information.", "The solicitor may not accept the instruction because the confidential information is material to the son's claim.", "The solicitor may accept the instruction but must not disclose the confidential information about mental capacity.", "The solicitor may not accept the instruction because there are always conflicts of interest in disputes between family members."], "a": "C", "bx": "The correct answer was C. If the solicitor accepts the son as his client, he must disclose 'information material to the matter of which [the solicitor] has knowledge' (Para 6.4.(a)). Knowledge about the testator's mental capacity is clearly material, but it is confidential, so as there is no way of taking 'effective measures' to prevent disclosure (therefore option D is wrong) and as it is now impossible to obtain the consent of the former client (therefore option B is wrong), the solicitor must decline to act for the son (Para 6.5). Obligations of confidence are owed to former clients, even from ten years ago, so option A is incorrect. Option E is too wide a principle; there is not always a conflict of interests for a solicitor dealing with family disputes."}, {"ch": 5, "n": 6, "sc": ["A solicitor who is a long-standing family friend of a client is instructed to draft the client’s new will. The client tells the solicitor that she wishes to leave the solicitor a valuable painting as a gift in the will. The client has not taken any independent legal advice about the gift."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor may draft the will including the gift, as the client is free to leave her property to whomever she wishes.", "The solicitor should satisfy himself that the client has taken independent legal advice about the gift, record the advice and obtain written confirmation, and cease to act if the client refuses to take such advice but still wishes to include the gift.", "The solicitor may draft the will provided that the gift is witnessed by another solicitor in the firm.", "The solicitor must refuse to draft the will in any circumstances.", "The solicitor may draft the will if the value of the gift is below the solicitor’s fee."], "a": "B", "x": ["Wrong. Freedom of testamentary disposition does not override the solicitor's own interest in the gift.", "Correct. A significant gift to the solicitor creates an own interest conflict. The solicitor should make sure the client takes independent legal advice about the gift and should record it. If the client refuses advice but still wants the gift, the solicitor should cease to act.", "Wrong. Who witnesses the will does not address the own interest conflict.", "Wrong. Too absolute: the concern can be addressed by the client taking independent advice.", "Wrong. The gift's value relative to the fee is irrelevant; a significant gift raises the conflict."]}, {"ch": 5, "n": 7, "sc": ["A client asks a solicitor to draft a simple will. The solicitor tells the client that it is the default position that the drafting firm is appointed as executor, and that the firm will only prepare the will if it is named as executor. The client, who knows little about wills, agrees."], "st": "Has the solicitor acted in accordance with the SRA Code of Conduct?", "o": ["Yes. It is common for solicitors who draft wills to be appointed as executors.", "Yes. The client agreed to the appointment.", "Yes, provided that the firm’s executor fees are reasonable.", "No. The solicitor has exploited the client’s lack of knowledge; the solicitor should explain the options for executors, that an executor need not be a professional, and that preparing the will is not conditional on the firm’s appointment.", "No. Solicitors who draft a will are prohibited from acting as its executors."], "a": "D", "x": ["Wrong. That it is common does not justify misrepresenting the position to a client.", "Wrong. Agreement obtained by exploiting the client's lack of knowledge is not proper consent.", "Wrong. The issue is taking unfair advantage of the client, not the level of fees.", "Correct. Telling the client that the firm's appointment is the default and a condition of drafting takes unfair advantage of the client (Para 1.2). The solicitor should explain the options, including that an executor need not be a professional.", "Wrong. Solicitors who draft wills may be appointed executors if the client freely chooses this."]}, {"ch": 5, "n": 8, "sc": ["A deaf client instructs a solicitor to prepare her will. Her son, who is the main beneficiary under the proposed will, offers to act as her sign-language interpreter during the meeting to save time and expense."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor should arrange a sign-language interpreter who is independent of the client and her family, to avoid any risk of undue influence.", "The solicitor should accept the son’s offer, as he knows his mother best.", "The solicitor should decline to act, as deaf clients cannot give clear instructions.", "The solicitor should accept the son’s offer, provided that the son signs a statement confirming his translation is accurate.", "The solicitor should take written instructions only and avoid any meeting."], "a": "A", "x": ["Correct. Using the main beneficiary as interpreter risks undue influence and doubts about whether the instructions are the client's own. An independent interpreter lets the solicitor be satisfied the instructions represent her wishes (Para 3.1).", "Wrong. As the main beneficiary, the son has an interest that could compromise the instructions.", "Wrong. Deafness does not prevent a client giving clear instructions; it calls for appropriate adjustments.", "Wrong. A statement from the son does not remove the risk of undue influence.", "Wrong. Avoiding a meeting would not help the solicitor confirm that the instructions are the client's own."]}, {"ch": 5, "n": 9, "sc": ["Two brothers believe their elderly parents may have recently changed their wills. They visit the solicitor who usually acts for their parents and ask the solicitor to tell them whether new wills have been made and what they contain. Both parents are alive."], "st": "Which of the following best describes the solicitor’s position?", "o": ["The solicitor may tell the brothers the contents of the wills, as they are close family members.", "The solicitor may confirm that new wills have been made, but must not reveal their contents.", "The solicitor may disclose the contents if the brothers are beneficiaries.", "The solicitor should direct the brothers to obtain copies from the Probate Registry.", "Without the parents’ permission, the solicitor cannot disclose the contents of the wills, nor even confirm whether they drafted them."], "a": "E", "x": ["Wrong. Family relationship does not override confidentiality.", "Wrong. Even confirming that wills exist is confidential information.", "Wrong. Being potential beneficiaries gives no right to the contents of a living person's will.", "Wrong. A living person's will is not available from the Probate Registry.", "Correct. The solicitor owes a duty of confidentiality to the parents (Para 6.3). Without their permission, the solicitor cannot disclose the contents of their wills, nor even confirm whether they have drafted them."]}, {"ch": 5, "n": 10, "sc": ["A solicitor prepared a will for a client who has since died. The solicitor is not named as an executor. A relative who is disputing the will sends the solicitor a request for information about the circumstances surrounding the preparation and execution of the will (a Larke v Nugus request)."], "st": "Which of the following best describes how the solicitor should proceed if they choose to respond?", "o": ["The solicitor must provide the information immediately, as they are legally obliged to comply with the request.", "The solicitor must refuse, as the duty of confidentiality ended on the client’s death.", "The solicitor should obtain the consent of the executors before making any disclosure and, if they refuse, advise them that the court may compel production of the documents.", "The solicitor may respond but is not permitted to charge for preparing the statement.", "The solicitor should obtain the consent of the relative making the request before responding."], "a": "C", "x": ["Wrong. The solicitor is not obliged to answer immediately, and confidentiality must be considered first.", "Wrong. The duty of confidentiality continues after the client's death.", "Correct. The duty of confidentiality survives death and passes to the personal representatives. The solicitor should obtain the executors' consent before disclosing and, if they refuse, explain that the court may compel production.", "Wrong. The point is confidentiality and consent, not whether a charge can be made.", "Wrong. Consent must come from the executors, not the person asking for the information."]}, {"ch": 6, "n": 1, "sc": ["A solicitor acts for the proposed tenant of a lease of commercial property and the heads of terms provide that the tenant will pay the landlord's legal costs in relation to the preparation, negotiation and completion of the lease. The landlord's solicitors have requested an undertaking from the tenant solicitor's firm to meet these costs before they will issue draft documentation. The tenant is a long-established, regular and reliable client of the tenant solicitor's firm and they are keen to proceed without delay. Accordingly, to expedite the process, the tenant's solicitor confirms in a telephone conversation with the landlord's solicitor that the tenant solicitor's firm will meet these costs."], "st": "Which of the following best describes who is liable for the costs?", "o": ["The solicitor and the firm are liable as an undertaking has been given.", "The solicitor is liable as undertakings are personally binding.", "An undertaking has not been given, as the word 'undertake' or 'undertaking' was not used and it was neither given, nor confirmed in writing.", "The firm is liable as the undertaking was clearly given on behalf of the firm.", "The client is liable as the undertaking was given on their behalf."], "a": "A", "bx": "The correct answer was A. The undertaking will be personally binding on the solicitor, and as it was made on behalf of the firm, the firm will be liable too. Therefore, options B and D are partially correct. An undertaking was given, even though the word 'undertake' or 'undertaking' was not used. There is clearly an enforceable promise and there is no need for an undertaking to be made, or confirmed in writing. Therefore, option C is incorrect. Option E is incorrect, as it does not reflect the terms of the undertaking and the solicitor did not clearly and expressly disclaim personal liability. The undertaking should have been given in writing, with careful attention to its terms. The solicitor should also have obtained cleared funds on account before giving it."}, {"ch": 6, "n": 2, "sc": ["A property developer client has instructed a solicitor in relation to the proposed gift of one of the properties from their portfolio, to their adult daughter. The daughter has asked if the solicitor can also act for her on the transfer."], "st": "Which of the following best describes the position?", "o": ["In no circumstances can the solicitor act here, as it is never possible to act for transferor and transferee in a property transaction, due to the potential for conflict of interest.", "The solicitor should be able to act in this matter on the facts. Due to the connection between the parties and the fact that the transaction involves a gift, there is unlikely to be a conflict of interest or a significant risk of one arising.", "The solicitor can act in this matter as the parties are competing for the same objective.", "The solicitor can act in this matter as the parties have a substantially common interest.", "The solicitor should not act in this matter, as the daughter will be the one to benefit from the transaction and there is an imbalance of power between them."], "a": "B", "bx": "The correct answer was B. The transaction is not at arm's length as it is a gift and there is a connection between the parties, so the solicitor should be able to act here, as it is unlikely there will be a conflict of interest or a significant risk of one arising. There is no evidence on the facts of inequality of bargaining power or vulnerability, which makes option E incorrect. Option A is incorrect in that there is no absolute prohibition on acting for transferor and transferee, but it is highly unlikely that there will not be a conflict of interest or a significant risk of one arising, where there is a sale at arm's length (typically for value) usually between unconnected parties. The risk increases the more complex a transaction is, as there is likely to be more need for negotiation between the parties. Option C is incorrect as parties to a conveyancing transaction have different objectives (disposal and acquisition respectively). Option D is also possibly correct. Due to the nature of the transaction, it could be argued that the parties have a substantially common interest (in which case the three conditions in Para 6.2 would need to be complied with). However, option B is most correct and straightforward here."}, {"ch": 6, "n": 3, "sc": ["The seller of a residential property, who is keen to proceed as soon as possible, instructs their solicitor to submit draft contract documentation to three interested parties."], "st": "Which of the following best describes the position?", "o": ["The solicitor will be unable to do this under the Code of Conduct and must immediately cease to act. They will owe a duty of confidentiality to the seller and so must not disclose their reasons for ceasing to act.", "Provided that the solicitor informs all three prospective buyers of the situation, there will be no breach of the Code of Conduct. They will owe a duty of confidentiality to the seller.", "The solicitor must obtain the seller's consent to disclose the position to the prospective buyers and, if this is not forthcoming, they must cease to act immediately. If it is forthcoming, disclosure must be made immediately.", "The solicitor must obtain the seller's consent to disclose the position to the prospective buyers and, if this is not forthcoming, they must cease to act immediately. They will owe a duty of confidentiality to the seller.", "The solicitor must obtain the seller's consent to disclose the position to the prospective buyers and, if this is not forthcoming, they must cease to act immediately. They will owe a duty of confidentiality to the seller. If the seller's consent is forthcoming, disclosure must be made."], "a": "E", "bx": "The correct answer was E. Option E outlines all of the key requirements. Option A is incorrect as there is no requirement immediately to cease to act just because a potential contract race arises. Consent to disclose must be obtained and, if received, disclosure must be made immediately. If it is not forthcoming, the solicitor must cease to act immediately, but will owe a duty of confidentiality to the seller. Option B is incorrect as it omits the need to obtain client consent to the disclosure before making it. Option C is only partially correct as it fails to mention the duty of confidentiality. Option D is also only partially correct as it omits the need to disclose, should consent be forthcoming."}, {"ch": 6, "n": 4, "sc": ["A solicitor is instructed to act in relation to the acquisition of a leasehold flat and is aware that their firm acted for the previous owner of the property in long, protracted and unsuccessful litigation concerning liability for repairs under the lease. The freehold owner and management company denied liability and a settlement was never reached. The main reason that the litigation was unsuccessful was because the lease was defective as originally drafted. The value, marketability and security for lending purposes were adversely affected and the former client sold to the current seller for a cash sum significantly below their original acquisition cost. The current purchase is in excess of the market value for a similar flat without a seriously defective lease and the lease is unlikely to be acceptable to the buyer's lender."], "st": "Which of the following best describes the position?", "o": ["The duty of confidentiality to the former client takes precedence over the duty of disclosure to the new client in these circumstances.", "There is a conflict between the duty of confidentiality to the former client and the duty of disclosure to the new client. Unless the former client provides consent to share the information, the solicitor must cease to act in the matter.", "The solicitor is under a duty to their new client to disclose all information material to their matter about which the solicitor has knowledge. This clearly includes this information and therefore the solicitor must disclose it.", "The duty of confidentiality to the former client will always take precedence.", "The solicitor should act in the best interests of current, rather than former, clients and should therefore disclose the information."], "a": "B", "bx": "The correct answer was B. The duty of confidentiality will trump the duty of disclosure unless informed consent is given. Options A and D are partially correct, as the duty of confidentiality usually takes precedence; however, this is subject to permitted exceptions (including where informed consent has been obtained from the former client, as provided for in option B). Options C and E are incorrect, as they do not acknowledge the duty of confidentiality owed to previous clients."}, {"ch": 6, "n": 5, "sc": ["A solicitor has been instructed to act on the purchase of a freehold residential property, for owner-occupation and their client has asked whether the firm may also act for the lender, a high street bank, in the same matter."], "st": "Which of the following best describes the position?", "o": ["The solicitor may act provided that the proposed mortgage is a standard document that does not need to be negotiated, the Law Society/UK Finance standard certificate of title is used and it is otherwise reasonable to act.", "The solicitor may act despite the risk of conflict of interest, under the substantially common interest exception. Both parties would need to give informed consent, effective safeguards would need to be put in place concerning protection of confidential information, and the solicitor would need to be satisfied it is reasonable to do so.", "The solicitor may act despite the risk of conflict of interest, under the competing for the same objective exception. Both parties would need to give informed consent, effective safeguards would need to be put in place concerning protection of confidential information, and the solicitor would need to be satisfied it is reasonable to do so.", "The solicitor may not act due to the substantial risk of a conflict of interest arising. However, if both parties gave informed consent, effective safeguards were put in place concerning protection of confidential information and the solicitor was satisfied it was reasonable to do so, acting for both parties may be possible.", "The solicitor may act provided that the proposed mortgage is a standard document that does not need to be negotiated, the Law Society/UK Finance standard certificate of title is used and it is otherwise reasonable to act. Both parties would need to give informed consent, effective safeguards would need to be put in place concerning protection of confidential information and the solicitor would need to be satisfied it is reasonable to do so."], "a": "A", "bx": "The correct answer was A. The exception under the Law Society guidance will most probably apply here. Option B is incorrect as although the substantially common interest exception may also apply on the facts, and the pre-conditions are correctly set out, it would be more straightforward to rely on the Law Society guidance. For the same reason, option D is also incorrect and it does not specifically refer to the substantially common interest exception. Option C is incorrect, as the competing for the same objective exception does not apply on the facts. Option E is incorrect as it conflates the Law Society guidance with the conditions attached to the exceptions to the general rule."}, {"ch": 6, "n": 6, "sc": ["A solicitor acts for a tenant taking a lease of a shop from a landlord who is not legally represented. The landlord has prepared the draft lease himself, and the solicitor notices that it contains drafting errors that are favourable to the tenant."], "st": "Which of the following best describes how the solicitor should proceed?", "o": ["The solicitor must point out and correct each of the errors for the landlord.", "The solicitor need not highlight or remedy the specific errors, but should avoid taking unfair advantage of the landlord by pointing out the need for him to take independent legal advice.", "The solicitor should proceed to completion as quickly as possible before the landlord notices the errors.", "The solicitor must cease to act, as the landlord is unrepresented.", "The solicitor should offer to act for the landlord as well, to ensure fairness."], "a": "B", "x": ["Wrong. The solicitor acts for the tenant and is not obliged to correct the landlord's drafting.", "Correct. A solicitor must not take unfair advantage of an unrepresented party (Para 1.2). The tenant's solicitor need not point out or fix the errors, but should suggest that the landlord takes independent legal advice.", "Wrong. Rushing to completion to exploit the errors would be taking unfair advantage.", "Wrong. The other side being unrepresented is no reason to stop acting.", "Wrong. Acting for landlord and tenant would be a conflict of interest."]}, {"ch": 6, "n": 7, "sc": ["An unmarried couple instruct a solicitor to act for them on the joint purchase of a house that they will live in together. One partner contributes most of the deposit and handles all communication with the solicitor."], "st": "Which of the following best describes the position?", "o": ["The solicitor cannot act for both buyers, as their financial contributions differ.", "The solicitor may act for both and take instructions solely from the partner who contributed most.", "The solicitor may act for both only under the competing for the same objective exception.", "The solicitor may act for both, but need not advise on how the equitable interest should be held.", "The solicitor may usually act for both, but should obtain instructions from both clients, given the risk of undue influence, and the buyers should receive separate advice on how the equitable interest should be held."], "a": "E", "x": ["Wrong. Different financial contributions do not of themselves stop the solicitor acting for joint buyers.", "Wrong. Instructions should come from both clients, given the risk of duress or undue influence.", "Wrong. Joint buyers are not competing; if anything they share a common interest.", "Wrong. In residential cases the buyers need separate advice on how the equitable interest should be held.", "Correct. A solicitor may usually act for joint buyers, subject to Para 6.2, as they usually share the same interest. It is best practice to take instructions from all of them, given the risk of undue influence, and in residential cases they should get separate advice on how the equitable interest will be held."]}, {"ch": 6, "n": 8, "sc": ["A solicitor has acted for two unconnected clients for many years. One client agrees to sell a residential property to the other at market value, subject to contract. Both clients ask the solicitor to act for them on the sale and purchase, believing it will save time and costs."], "st": "Which of the following best describes the position?", "o": ["The solicitor should not act for both, as an arm’s length sale for value between unconnected parties is very likely to give rise to a conflict of interest, and neither exception is likely to apply.", "The solicitor may act for both, as there is an absolute right to act for long-standing clients.", "The solicitor may act for both under the substantially common interest exception.", "The solicitor may act for both under the competing for the same objective exception.", "The solicitor may act for both provided that the price has been agreed."], "a": "A", "x": ["Correct. A conflict is very likely where land is sold for value at arm's length between unconnected parties. Substantially common interest does not usually apply to a sale, and competing for the same objective does not apply because the parties seek different objectives (disposal and acquisition).", "Wrong. Long-standing relationships give no right to act despite a conflict.", "Wrong. Buyer and seller at arm's length have different interests, not a common purpose.", "Wrong. The parties want different things, disposal and acquisition, so they are not competing for the same objective.", "Wrong. Agreeing the price does not remove the risk of conflict as further negotiation may arise (eg from searches or survey)."]}, {"ch": 6, "n": 9, "sc": ["Two separate developers ask the same solicitor to act for them in bidding for a plot of land being sold at auction. Each developer is aware that the other intends to bid."], "st": "Which of the following best describes the position?", "o": ["The solicitor cannot act for both developers, as only one can acquire the land.", "The solicitor may act for both developers without any further conditions.", "The solicitor may act for both developers under the substantially common interest exception.", "The solicitor will usually be able to act for both developers under the competing for the same objective exception, subject to informed written consent, effective safeguards and the solicitor being satisfied it is reasonable to act.", "The solicitor may act for both developers only if they agree not to bid against each other."], "a": "D", "x": ["Wrong. Two clients bidding for the same asset may be acted for under the competing for the same objective exception.", "Wrong. The Para 6.2 conditions must still be met.", "Wrong. Rival bidders do not have a substantially common interest.", "Correct. It will usually be possible, under the competing for the same objective exception, to act for two or more buyers bidding at auction. This is subject to informed written consent, effective safeguards and the solicitor being satisfied that it is reasonable to act.", "Wrong. The exception expressly covers competing bidders; they need not agree to stop competing."]}, {"ch": 6, "n": 10, "sc": ["A married couple jointly own their family home. The husband runs a business and the couple propose to mortgage the home to secure a loan for the husband’s business only. They ask the same solicitor to act for both of them on the mortgage."], "st": "Which of the following best describes the position?", "o": ["The solicitor may always act for joint mortgagors, as no conflict of interest arises between spouses.", "The solicitor may act for the husband only, and the wife must instruct a solicitor from a different firm in all cases.", "It may not be possible to act for both, given the potential for undue influence and conflict where the mortgage secures only one owner’s business borrowing; if the solicitor does act, the Etridge guidelines must be followed.", "The solicitor may act for both under the competing for the same objective exception.", "The solicitor may act for both provided that the lender agrees."], "a": "C", "x": ["Wrong. There is a real possibility of undue influence where the mortgage secures only one owner's business debts.", "Wrong. Too absolute: the solicitor may act if satisfied there is no conflict, following the Etridge guidelines.", "Correct. Undue influence is a real possibility where a jointly owned home is mortgaged to secure the business borrowing of only one owner. The solicitor may act only if there is no conflict or significant risk of one and, if acting, must follow the Etridge guidelines.", "Wrong. Joint mortgagors are not competing for an objective.", "Wrong. The lender's agreement does not address the conflict between the two mortgagors."]}, {"ch": 7, "n": 1, "sc": ["A solicitor completes a property transaction for a client and sends them a bill totalling £350 (inclusive of VAT and disbursements). The client sends a cheque for £350 in payment of the bill and the solicitor pays it into the firm's general client bank account."], "st": "What action, if any, should the solicitor take now with respect to this matter?", "o": ["The solicitor should wait for the cheque to clear before closing the client's property file and ledger.", "The solicitor can close the client's property file and ledger without waiting for the cheque to clear.", "Once the cheque has cleared, the solicitor should transfer £350 from the client account to the business account promptly.", "The solicitor must transfer £350 from the client account to the business account immediately, even if the cheque has not yet cleared.", "The solicitor must report the matter to the Solicitors Regulation Authority immediately as the cheque has been paid into the wrong bank account, placing client money at risk."], "a": "C", "bx": "The correct answer was C. This is because the cheque represents business money as it is in payment of a bill already delivered to the client. The money should have been paid into the firm's business bank account instead of the general client account. This is a breach of Accounts Rule 4.1 that requires client money to be kept separate from business money, and should be corrected promptly by transferring £350 from the general client account to the business account (Accounts Rule 6.1). However, the transfer must wait until after the cheque has cleared. If the client to business transfer is made before the cheque has cleared, the transfer will be from other clients' money, which is a clear breach of the Accounts Rules. Option D is therefore incorrect. Options A and B are both incorrect as they treat the cheque as client rather than business money. Option E is incorrect because it is business money, rather than client money, that has been paid into the wrong account. Therefore, no money belonging to clients, or third parties, has been placed at risk, such as to justify reporting the matter to the SRA."}, {"ch": 7, "n": 2, "sc": ["A trainee solicitor works for a sole practitioner firm specialising in private client work. The sole practitioner leaves the trainee in charge of the firm's trusts and probate department while she is on holiday for two months. When the sole practitioner returns from holiday, she discovers that the trainee has made some errors. During the two month period, the trainee has paid over £5,000 business money into the firm's general client bank account, and over £800,000 client money into the firm's business bank account. The trainee has also stored £20,000 cash, found in the home of a deceased client, in his filing cabinet for over a month."], "st": "What action, if any, should the sole practitioner take with respect to these issues?", "o": ["The sole practitioner should terminate the trainee's contract of employment immediately and then ensure that all money is paid or transferred into the correct bank accounts within two weeks.", "The sole practitioner should leave the money where it is for now and report the trainee to the Solicitors Regulation Authority immediately for placing client money at risk.", "The sole practitioner must ensure all money is paid or transferred correctly into the firm's client account immediately or business account promptly. She should also report herself to the Solicitors Regulation Authority for failures in supervision leading to client money being placed at risk.", "The sole practitioner should ask the trainee to pay or transfer all money into the correct bank accounts within two weeks.", "The sole practitioner should ensure all the money is paid or transferred correctly into the firm's business and client accounts promptly, and then train the trainee solicitor how to keep client money safe in the future."], "a": "C", "bx": "The correct answer was C. This is because the sole practitioner should have ensured that the trainee solicitor had adequate supervision while she was on holiday. This lack of supervision (and the trainee's lack of awareness of the relevant regulations) has led to large amounts of client money being placed at risk (for example, client money in the business account might be wrongly used to pay business expenses or creditors; or cash in the filing cabinet is at risk of being stolen). This is sufficiently serious to warrant a report to the SRA, even if action is taken as required to pay client money into the client account immediately, and business money into the business account promptly. Option A is incorrect because the sole practitioner should take some of the blame for the errors, so firing the trainee is unlikely to be appropriate. It is also incorrect because the time limit of two weeks is too long. Option B is incorrect because the money cannot be left where it is, it must be placed in the correct accounts in accordance with the relevant regulations (immediately for client money and promptly for business money). Further, even if the trainee's errors are reported to the SRA, the sole practitioner also bears responsibility for failing to train or supervise him properly, Option D is incorrect because the time limit of two weeks is too long. It may also be wiser for the sole practitioner to allocate the money to the correct accounts herself. Option E is almost correct in that the business money should be transferred promptly into the business account and it would be sensible to train the trainee. However, the client money must be paid or transferred into the client account immediately, rather than promptly, so the answer is incorrect. Watch out for time limits in questions. You must select the correct one carefully."}, {"ch": 7, "n": 3, "sc": ["A firm acts for several big educational trusts in managing their legal affairs. A junior solicitor notices some anomalies on the client ledgers of several of these trusts. There are unexplained payments to the personal bank account of one of the firm's senior partners, totalling approximately £600,000. The solicitor alerts the firm's Compliance Officer for Finance and Administration (COFA), but the COFA appears frightened and tells the solicitor to forget about the payments, without providing any explanation as to why they have been made."], "st": "What action, if any, should be taken by the junior solicitor considering the COFA's response?", "o": ["The junior solicitor should report the matter to the Solicitors Regulation Authority promptly so that they can investigate the matter.", "The junior solicitor should take no further action beyond alerting the COFA.", "The junior solicitor should ask the senior partner about the unexplained payments and request that he returns the money from his personal bank account as soon as possible.", "The junior solicitor should transfer money from the business account into the client account within the next six months to replace the unexplained payments made to the senior partner.", "The junior solicitor should take no further action for now and leave the matter for the firm's accountant to check at the end of the firm's accounting period."], "a": "A", "bx": "The correct answer was A. This is because in the absence of any other explanation, it appears that the senior partner may be stealing large sums of client money from the educational trusts. If this is the case, client money is at risk, constituting a serious breach of the Accounts Rules which should be reported to the SRA promptly so that they can investigate and take action (Paras 7.7 and 7.8). It is also suspicious that the COFA appears frightened. It may also be appropriate for the solicitor to report the matter to the police at the same time. Option B is incorrect because although alerting the COFA in the first instance is appropriate, if the COFA cannot provide an explanation and will not take any action, the solicitor must protect client money by reporting to the SRA. Option C is not the best option as it is inadvisable to confront the senior partner as it may give them a chance to cover their tracks. The COFA's fear may also indicate some potential threat from the senior partner. Option D is incorrect because although it is appropriate to replace any client money withdrawn wrongly from the client account with money from the business account, this should be done promptly on discovery of the breach of the Accounts Rules, rather than within six months. Option E is incorrect because there may be an ongoing risk to client money, so leaving the matter to the end of the accounting period and waiting for the accountant's report is too late."}, {"ch": 7, "n": 4, "sc": ["Two solicitors are setting up a new law firm, in which they will become partners. Neither has had experience of managing a firm before and they are concerned about the regulatory requirements for safeguarding client money."], "st": "Which of the following statements best describes the legal position of the solicitors?", "o": ["The solicitors do not need to appoint a Compliance Officer for Finance and Administration as the firm will only have two partners.", "The solicitors should appoint a Compliance Officer for Finance and Administration so that they can pass on their responsibility for safeguarding client money to them.", "Each solicitor is only responsible for her own actions when safeguarding client money.", "Both solicitors must update themselves and provide training for their employees so that everyone has sufficient understanding of the regulatory requirements for safeguarding client money.", "The regulatory requirements for safeguarding client money only apply to the solicitors and any of the firm's employees responsible for giving legal advice to clients."], "a": "D", "bx": "The correct answer was D. This is because everyone working in the law firm, whatever their role (Accounts Rule 1.1), must comply with the regulatory requirements for safeguarding client money (Para 4.2 Code for Individuals, Para 5.2 Code for Firms and the Accounts Rules). The solicitors should only employ staff who are competent for their roles and should make sure they are trained appropriately (Para 3.6 Code for Individuals and para 4.3 Code for Firms). Option A is incorrect because all law firms must have a COFA. Option B is incorrect because the solicitors cannot escape responsibility for safeguarding client money. Option C is incorrect because the solicitors will be jointly and severally responsible for compliance with the Accounts Rules (Rule 1.2) so that client money is kept safe. Option E is incorrect because all employees of the firm, not just those responsible for giving legal advice, must comply with the Accounts Rules (Rule 1.1)."}, {"ch": 7, "n": 5, "sc": ["A solicitor tells a senior partner in his firm that he has reported her to the Solicitors Regulation Authority (SRA) for serious breaches of the Accounts Rules amounting to a serious failure to safeguard client money. In response, the senior partner threatens to terminate his contract of employment."], "st": "What action, if any, should the solicitor now take?", "o": ["The solicitor must look for another job as the SRA will intervene shortly to stop the firm from operating.", "The solicitor should explain to the senior partner that terminating his employment contract as a response to him reporting her to the SRA would be a further breach of the SRA's regulatory requirements.", "The solicitor should take no action for now and wait to see if his employment contract is terminated. If it is, he must report this to the Solicitors Disciplinary Tribunal.", "The solicitor must resign from his job immediately to avoid any further confrontations with the senior partner. He should then start a claim against the firm for constructive dismissal.", "The solicitor should contact the SRA to retract his earlier report to protect his job, stating that he was mistaken about any risks to client money."], "a": "B", "bx": "The correct answer was B. This is because it is a breach of both the Code for Individuals and the Code for Firms for the senior partner to subject the solicitor to detrimental treatment (such as terminating his employment contract), for reporting her to the SRA. Option A is incorrect as there is no obligation on the solicitor to seek employment elsewhere unless he wishes to do so, and although the SRA may investigate the firm for breaches of the Codes and Accounts Rules, it cannot be assumed that the SRA will intervene to stop the firm operating. It may be inadvisable for the solicitor to wait and see whether his employment contract is terminated (Option C), but in any event, any report he makes should be to the SRA rather than the Solicitors Disciplinary Tribunal (making option C wrong in this respect). Option D is incorrect because there is no obligation on the solicitor to resign and bring a claim for constructive dismissal unless he chooses to do so. Option E is incorrect because it would be a breach of the regulatory requirements to tell the SRA that client money is not at risk when this is not true (for example, Principles 2, 4, 5 and 7; Paras 4.2, 7.7 and 7.8 of the Code for Individuals)."}, {"ch": 7, "n": 6, "sc": ["A solicitor acts for the personal representatives of a deceased client. One of the personal representatives brings to the office some diamond jewellery and £800 in cash found in the deceased’s empty house, and asks the solicitor to look after them. It is late on the Friday before a bank holiday weekend."], "st": "What action should the solicitor take?", "o": ["The solicitor should keep the cash and jewellery locked in the firm’s safe over the weekend, then pay the cash into the general client account promptly and place the jewellery somewhere safe, such as a bank deposit box in the personal representatives’ names.", "The solicitor may leave the items on her desk, as the office will be locked over the weekend.", "The solicitor should pay the cash into the firm’s business account, as it will be used to pay the firm’s fees.", "The solicitor should take the items home for safekeeping over the weekend.", "The solicitor should refuse to accept the items, as solicitors cannot hold assets other than money."], "a": "A", "x": ["Correct. The cash is client money and must be kept safe and paid into the client account promptly; locking it in the firm's safe over the bank holiday is appropriate. The jewellery is not money and should be kept somewhere safe, such as a bank deposit box in the personal representatives' names.", "Wrong. Leaving cash and jewellery on a desk does not keep client assets safe.", "Wrong. Money held for the estate is client money and must not be paid into the business account.", "Wrong. Taking client assets home is not an appropriate way to keep them safe.", "Wrong. Solicitors may hold other client assets, provided they keep them safe."]}, {"ch": 7, "n": 7, "sc": ["A trainee solicitor receives a cheque for £2,000 from a client. Of this, £1,200 is in payment of an interim bill already sent to the client, and £800 is money on account of future costs and disbursements. The trainee pays the whole cheque into the firm’s business account."], "st": "What action, if any, should now be taken?", "o": ["No action is required, as the cheque was paid in for the firm’s fees.", "The whole £2,000 must be transferred to the client account immediately.", "The trainee must report herself to the SRA, as paying a mixed receipt into the business account is always a serious breach.", "The £800 client money element must be transferred promptly into the client account, so that client money is kept separate from business money.", "The £800 may remain in the business account until the next bill is delivered."], "a": "D", "x": ["Wrong. The £800 on account of future costs is client money and cannot remain in the business account.", "Wrong. The £1,200 is for a bill already delivered, so it is business money and may stay in the business account.", "Wrong. A mixed receipt may be paid into the business account if the client money element is transferred promptly; this is not automatically a serious breach to report.", "Correct. This is a mixed receipt. The £1,200 for the delivered bill is business money, but the £800 on account is client money. Client money must be kept separate from business money (Accounts Rule 4.1), so the £800 must be transferred to the client account promptly.", "Wrong. Client money cannot be held in the business account until a later bill."]}, {"ch": 7, "n": 8, "sc": ["A solicitor acts for a buyer in a property purchase. At completion, the solicitor undertakes to the seller’s solicitors that she will transfer the outstanding balance of £300,000 to them by the end of the day. The solicitor is then called into a lengthy meeting and considers dealing with the transfer the following week."], "st": "Which of the following best describes the solicitor’s obligations?", "o": ["The solicitor may transfer the money within a reasonable time, as no timescale was legally binding.", "The solicitor is personally obliged to comply with the undertaking and must authorise the withdrawal of the completion monies so that they are transferred by the end of the day at the latest.", "Only the client is liable for the payment, as it is the client’s money.", "The solicitor may delay the transfer, provided she notifies the seller’s solicitors in writing.", "The undertaking is unenforceable, as it was given orally."], "a": "B", "x": ["Wrong. The solicitor promised to pay by a specific time and is bound by that.", "Correct. A solicitor is personally bound by an undertaking, and the firm is bound too. She must make sure the completion monies are withdrawn and sent by the end of the day as promised.", "Wrong. The solicitor and the firm are bound by the undertaking, whatever the source of the funds.", "Wrong. Notifying the other side does not release the solicitor from the undertaking.", "Wrong. An undertaking need not be in writing to be binding."]}, {"ch": 7, "n": 9, "sc": ["A firm receives a cheque in settlement of a costs claim and pays it into its business account, although part of the sum is due to another firm that previously acted for the client. The other firm reports the matter to the SRA, which opens an investigation and asks the firm for copies of ledgers, bank statements and correspondence."], "st": "How should the firm respond to the SRA’s request?", "o": ["The firm may refuse to provide any documents, as they are subject to client confidentiality.", "The firm need only respond once the investigation has been concluded.", "The firm should ask the other firm to withdraw its report before responding.", "The firm should only provide documents if ordered to do so by the Solicitors Disciplinary Tribunal.", "The firm must cooperate and respond promptly with full and accurate explanations, information and documents, balancing its duty of confidentiality with its duty to assist the SRA in the public interest."], "a": "E", "x": ["Wrong. The Code requires cooperation with the SRA, and confidentiality does not justify refusing.", "Wrong. The firm must respond promptly, not after the investigation ends.", "Wrong. The firm cannot make its cooperation depend on the report being withdrawn.", "Wrong. The duty to cooperate is owed to the SRA directly; no tribunal order is needed.", "Correct. Para 7 of the Code requires solicitors to cooperate with the SRA and respond promptly with full and accurate explanations, information and documents. The firm must balance confidentiality with its duty to assist the regulator in the public interest."]}, {"ch": 7, "n": 10, "sc": ["A solicitor is covering a colleague’s files while he is on leave. She notices a series of payments from client ledgers to a property company that do not relate to any client matter. A search at Companies House shows that her colleague is the sole director of the company."], "st": "What action, if any, should be taken?", "o": ["The solicitor should wait until her colleague returns from leave and ask him to explain the payments.", "The solicitor should leave the matter for the firm’s accountant to identify in the next accountant’s report.", "The solicitor should report the matter to the firm’s COFA; the money wrongly withdrawn should be replaced in the client account, using business money if necessary, and the matter reported to the SRA and the police.", "The solicitor should transfer the money back to the client ledgers from the property company’s account herself.", "The solicitor should take no action, as the payments may have been authorised by the clients."], "a": "C", "x": ["Wrong. Waiting risks further loss of client money and lets the colleague cover his tracks.", "Wrong. Leaving it to the accountant's report is too late when client money may be at ongoing risk.", "Correct. Unexplained payments to a company controlled by the colleague suggest that client money is being misused, a serious breach. The solicitor should report to the COFA. The money should be replaced promptly in the client account (from business money if necessary), and the matter reported to the SRA and the police.", "Wrong. The solicitor cannot move money out of a third party's account, and replacing it is a matter for the firm.", "Wrong. Payments unrelated to any client matter are not explained by client authority, so inaction is inappropriate."]}]},Q=D.q,L="ABCDE";let i=0,A={};

$('tb').innerHTML=D.t.map((t,ch)=>{const qs=Q.map((q,k)=>[q,k]).filter(([q])=>q.ch===ch),r=qs.filter(([q,k])=>A[k]===q.a).length;
return '<tr><td>Chapter '+(ch+1)+': '+esc(t)+'<div class="meter"><i style="width:'+(r/qs.length*100)+'%"></i></div></td><td class="n">'+r+' / '+qs.length+'</td></tr>'}).join('');window.scrollTo({top:0})}
$('prev').onclick=()=>{if(i>0){i--;show()}};
$('next').onclick=()=>{if(i<Q.length-1){i++;show()}else summary()};
$('back').onclick=()=>{i=0;show()};
$('rs').onclick=()=>{A={};i=0;upd();show()};
document.addEventListener('keydown',e=>{if($('quiz').classList.contains('hidden'))return;
if(e.key==='ArrowRight')$('next').click();else if(e.key==='ArrowLeft')$('prev').click();else{const k=L.indexOf(e.key.toUpperCase());if(k>=0&&!A[i])$('opts').children[k].click()}});
const cs=$('chsel');cs.innerHTML='<option value="" disabled>Select a chapter…</option>'+D.t.map((t,c)=>'<option value="'+c+'">Chapter '+(c+1)+': '+esc(t)+'</option>').join('');
cs.onchange=()=>{const c=+cs.value;i=Q.findIndex(q=>q.ch===c);show()};
const _show=show;show=function(){_show();cs.value=String(Q[i].ch)};
upd();show();
</script></body></html>
