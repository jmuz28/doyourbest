 after the event carry less weight.","D. The court will strike out the claimant's claim for failing to engage with ADR.","E. The court is bound to accept the claimant's argument, because lack of reasonable prospect of success is one of the Halsey considerations."],a:2,e:"Silence in the face of an invitation to ADR is unreasonable in and of itself. Objections raised at the time are much more likely to be accepted than those raised after ignoring an invitation, and adverse costs sanctions can be imposed even on a successful party."},{ch:1,q:"A small online retailer has a £7,500 money dispute with a supplier. The claim is issued on paper in June 2026. The retailer's director refuses to attend any mediation, saying she prefers a judge to decide. Which of the following best describes the position?",o:["A. Mediation is entirely voluntary, so the director may refuse without consequence.","B. Attending a small claims mediation session is a compulsory step for money claims under £10,000, and failure to attend may lead to costs consequences.","C. Mediation is only compulsory where the claim is issued online.","D. The court will automatically refer the matter to arbitration.","E. Mediation is compulsory only for claims above £10,000."],a:1,e:"For cases issued on or after 22 May 2024, attending a small claims mediation session is an integrated, compulsory step in money disputes under £10,000, whether issued on paper or online, and non-attendance can attract costs consequences."},{ch:1,q:"A manufacturer and a distributor are in dispute under a supply contract. The manufacturer wants a binding outcome, a decision-maker with technical expertise in the industry and complete confidentiality, and is content not to have the matter go to court afterwards. Which form of dispute resolution best meets these objectives?",o:["A. Mediation, because it is the most flexible process.","B. Early neutral evaluation, because it gives an expert view of the merits.","C. Litigation in the Commercial Court, because judges have commercial expertise.","D. Arbitration, because the arbitrator can have specialist expertise, the proceedings are confidential and the award is binding.","E. Negotiation between solicitors, because it is the cheapest option."],a:3,e:"Arbitration offers an expert arbitrator, confidential proceedings and awards, and a decision binding on the parties. Mediation and ENE are not binding, and court judgments are public."},{ch:1,q:"An arbitral award is made against a client on 1 March. The client believes there was a serious irregularity in the conduct of the proceedings which caused it substantial injustice. Which of the following best describes the client's position?",o:["A. The client may challenge the award under section 68 of the Arbitration Act 1996, but must apply within 28 days of the award.","B. The client may challenge the award under section 66 of the Arbitration Act 1996 at any time within six years.","C. The client may refer the dispute to the County Court for a full rehearing.","D. The client has no means of challenging an arbitral award in any circumstances.","E. The client may challenge the award under section 68 of the Arbitration Act 1996 within 21 days of the award."],a:0,e:"Section 68 allows a challenge only for serious irregularity causing substantial injustice, and the application must be made within 28 days of the award. Section 66 concerns enforcement, not challenge. By contrast, an appeal on a point of law is brought under s.69 and generally requires the court's permission unless all parties agree."},{ch:1,q:"A client is involved in a neighbour dispute. She is keen to resolve it but wants to retain the ability to go to court if no agreement is reached, and she would like an apology from her neighbour as part of any settlement. Which option is most suitable?",o:["A. Arbitration, because it produces a binding decision.","B. Mediation, because the parties can return to court if it fails and settlement terms can be creative, such as an apology.","C. Litigation, because the court can order an apology.","D. Arbitration, because the arbitrator can impose an injunction.","E. Early neutral evaluation, because it produces a binding assessment."],a:1,e:"Mediation allows parties to return to court if no settlement is reached, and permits creative terms (e.g. an apology). Where flexibility to return to court is key, arbitration should be disregarded; ENE is non-binding."},{ch:2,q:"A client was injured in an accident on 10 April 2021 but, through no fault of her own, did not know until 1 September 2022 that the injury was significant and attributable to the defendant. She is an adult. When does the limitation period for her personal injury claim expire?",o:["A. 10 April 2024.","B. 10 April 2027.","C. 1 September 2025.","D. 1 September 2028.","E. 10 April 2036."],a:2,e:"Personal injury claims must be brought within three years of the date of the cause of action or the date of knowledge, whichever is later. The date of knowledge (1 September 2022) is later, so time expires on 1 September 2025."},{ch:2,q:"A boy suffered a personal injury when he was 12 years old. He has just turned 18. Which of the following best describes the limitation position?",o:["A. The claim is already statute barred, as more than three years have passed since the injury.","B. He has three years from his 18th birthday to issue proceedings.","C. He has six years from his 18th birthday to issue proceedings.","D. He has three years from the date of the injury, extended by the court on application.","E. There is no limitation period for injuries suffered by children."],a:1,e:"For children, the three-year personal injury limitation period does not begin to run until the child reaches 18."},{ch:2,q:"A defective boiler flue was negligently installed in a client's house in 2010. Damage to the house occurred in 2016 but was not discovered until 2026. Which of the following best describes the limitation position for a latent damage claim in negligence?",o:["A. The client has three years from discovery in 2026 to bring the claim.","B. The client has six years from 2016 to bring the claim, which has expired, and no other period applies.","C. The claim is statute barred because it must be brought within 15 years of the negligent act, which expired in 2025.","D. The client has six years from discovery to bring the claim.","E. Limitation does not apply to latent damage claims."],a:2,e:"Latent damage claims may be brought within six years of the damage or three years from the date of knowledge, but always subject to a 15-year longstop from the negligent act or omission. The longstop expired in 2025."},{ch:2,q:"A client instructs a solicitor on the final day of the limitation period for a breach of contract claim. There is no good reason to apply for an extension. The client wishes to explore settlement with the defendant first. What is the most appropriate course?",o:["A. Write a letter before action and wait for the defendant's response before issuing.","B. Issue proceedings protectively and delay service of the claim form while investigations and ADR take place, serving within four months of issue.","C. Issue and serve proceedings the same day, as the pre-action protocol cannot be followed.","D. Apply to the court for an extension of the limitation period.","E. Advise the client that the claim is already statute barred."],a:1,e:"The CPR allow a party to 'issue protectively', lodging the claim with the court but not serving it for up to four months, enabling investigations and ADR. Pre-action conduct is not required where limitation is about to expire."},{ch:2,q:"A client wishes to bring a breach of contract claim for £15,000. No specific pre-action protocol applies. The client asks what happens if the pre-action guidance is not followed. Which of the following best describes the position?",o:["A. Compliance with the Practice Direction on Pre-Action Conduct and Protocols (PDPACP) is mandatory and the claim will be struck out for non-compliance.","B. The PDPACP does not apply to contract claims.","C. The PDPACP is not mandatory, but the court will consider whether the parties have complied in substance when deciding whether to impose sanctions, such as costs orders or interest adjustments.","D. There are no consequences, because no specific protocol applies.","E. The claimant must follow the Professional Negligence pre-action protocol by default."],a:2,e:"Where no protocol applies, the PDPACP is the fallback. It is not mandatory, but failure to comply in substance without good reason can lead to sanctions, including costs (possibly on the indemnity basis) and interest adjustments."},{ch:3,q:"A client has a personal injury claim valued at £70,000. The facts are complex. In which court may proceedings be commenced?",o:["A. The County Court only, because the claim is under £100,000.","B. The High Court only, because it is a personal injury claim.","C. The High Court, because personal injury claims worth more than £50,000 may be commenced there.","D. The Court of Appeal, because the facts are complex.","E. The small claims track, because it is a personal injury claim."],a:2,e:"Personal injury claims worth £50,000 or less must be commenced in the County Court; those worth more than £50,000 may be commenced in the High Court, which is most appropriate where facts are complex."},{ch:3,q:"A claimant sends a claim form by first-class post on Wednesday 3 June. There are no bank holidays that week. When is the claim form deemed served?",o:["A. Wednesday 3 June.","B. Thursday 4 June.","C. Friday 5 June.","D. Monday 8 June.","E. Tuesday 9 June."],a:2,e:"A claim form is always deemed served on the second business day after the relevant step (here, posting) is taken, regardless of method. Thursday is the first business day and Friday the second."},{ch:3,q:"A defendant's solicitors have provided a single email address for correspondence, but have not confirmed in writing that they will accept service by email. The claimant emails the claim form to that address. Has the claim form been validly served?",o:["A. Yes, because email is a permitted method of service under CPR 6.3.","B. Yes, because the solicitors provided the email address.","C. No, because service by email is only valid where the recipient has expressly confirmed willingness to accept service by that method.","D. No, because claim forms can never be served by email.","E. Yes, provided a hard copy is posted within 14 days."],a:2,e:"Service by fax or other electronic means is only permitted where the recipient has expressly confirmed willingness to accept service in that way."},{ch:3,q:"A claim form was issued on 14 May. The particulars of claim are to be served separately. The claim form is served on 1 September. What is the latest date for service of the particulars of claim?",o:["A. 15 September, being 14 days after service of the claim form.","B. 14 September, being the end of the four-month period from issue.","C. 29 September, being 28 days after service of the claim form.","D. 14 November, being six months from issue.","E. There is no time limit for service of the particulars of claim."],a:1,e:"Particulars served separately must be served within 14 days after the claim form, but not outside the four-month period from issue. Four months from 14 May is 14 September, which falls before the 14-day deadline."},{ch:3,q:"The claimant issued a claim against the wrong company within the limitation period, naming 'ABC Holdings Ltd' when it intended to sue 'ABC Trading Ltd'. The limitation period has now expired. The claimant seeks to substitute the correct defendant. On what basis may the court permit substitution?",o:["A. It is desirable to add the new party so that the court can resolve all the matters in dispute.","B. The new party is to be substituted for a party named in the claim form in mistake for the new party.","C. Substitution is never permitted after the limitation period has expired.","D. The defendant consents in writing to the substitution.","E. The claimant agrees to pay the costs of the amendment."],a:1,e:"Outside the limitation period (where the original claim was issued in time), substitution may be permitted where the new party is substituted for a party named in mistake. The 'desirable' test applies within the limitation period."},{ch:4,q:"Particulars of claim are deemed served on a defendant on 2 March. The defendant files an acknowledgment of service on 10 March. By what date must the defence be filed, absent any agreed extension?",o:["A. 16 March.","B. 24 March.","C. 30 March.","D. 27 April.","E. 7 April."],a:2,e:"Filing an acknowledgment of service extends the time for filing a defence to 28 days from deemed service of the particulars of claim. 28 days from 2 March is 30 March."},{ch:4,q:"A defendant believes the English courts have no jurisdiction. It indicates this on its acknowledgment of service but makes no application to dispute jurisdiction within 14 days of filing the acknowledgment. What is the consequence?",o:["A. The claim form is automatically set aside.","B. The defendant is treated as having accepted jurisdiction and must file a defence.","C. The defendant may apply at any time before trial.","D. The claimant must apply to the court to establish jurisdiction.","E. The proceedings are stayed pending a hearing on jurisdiction."],a:1,e:"If the defendant fails to apply within 14 days of filing the acknowledgment, the court treats the defendant as having accepted jurisdiction, and a defence must then be filed."},{ch:4,q:"The claimant obtained judgment in default. The defendant can show that it paid the claim in full a week before judgment was entered. Which of the following best describes the court's position on an application to set aside?",o:["A. The court may set aside the judgment if the defendant applied promptly.","B. The court must set aside the judgment, as this is a mandatory ground.","C. The court must set aside the judgment only if the defendant has a real prospect of defending the claim.","D. The court cannot set aside a judgment that has been properly entered.","E. The court may set aside the judgment on condition that the defendant pays a sum into court."],a:1,e:"The court must set aside default judgment where the defendant settled and paid the claim before judgment was entered, or filed an acknowledgment or defence before the deadline. These are mandatory grounds."},{ch:4,q:"One of two co-claimants wishes to discontinue its claim. The other co-claimant refuses to consent. Which of the following best describes the procedure?",o:["A. The claimant may simply file and serve a notice of discontinuance.","B. The claimant must apply for the court's permission to discontinue.","C. The claimant cannot discontinue while a co-claimant objects.","D. The defendant must consent to the discontinuance.","E. The proceedings are automatically stayed."],a:1,e:"Where there is more than one claimant, the others must give written consent; if a co-claimant refuses, the claimant wishing to discontinue must apply for the court's permission. A discontinuing claimant is usually liable for the defendant's costs on the standard basis."},{ch:4,q:"A defendant admits part of a specified claim and makes an offer to settle the whole matter. Which of the following best describes what happens next?",o:["A. The court stays proceedings and lists a disposal hearing.","B. The claimant has 14 days to decide whether to accept the offer; if rejected, the matter proceeds as a disputed case and the defendant must file a defence.","C. Judgment is automatically entered for the admitted sum and the balance is dismissed.","D. The claimant must accept the offer within 28 days or lose the right to the admitted sum.","E. The court sets instalment payments without reference to the claimant."],a:1,e:"In a part admission of a specified claim, the claimant has 14 days to accept or reject the offer. If rejected, the matter proceeds as a disputed case and a defence must be filed."},{ch:5,q:"A defendant's defence responds to paragraph 4 of the particulars of claim, which alleges late delivery, with the single word 'Denied'. Which of the following best describes the effect?",o:["A. This is a valid denial and the claimant must prove the allegation.","B. This is a bare denial, which is insufficient under the CPR and may be treated as an admission.","C. This is a non-admission and the claimant must prove the allegation.","D. This is a valid denial provided the defence carries a statement of truth.","E. The claimant must file a reply to defence to challenge the denial."],a:1,e:"A denial must be reasoned, setting out the defendant's version of events. A bare denial is insufficient and may be treated as an admission."},{ch:5,q:"A claimant brings a negligence claim in the County Court and wishes to claim interest on damages. Which of the following best describes the basis on which interest may be awarded?",o:["A. Interest is awarded automatically at 8%.","B. Interest must be specifically claimed, and the rate is at the court's discretion under s.69 County Courts Act 1984.","C. Interest must be specifically claimed, and the rate is fixed at the contractual rate.","D. Interest may only be claimed in the High Court under s.35A Senior Courts Act 1981.","E. Interest cannot be claimed in tort."],a:1,e:"The court will not award interest unless it is specifically claimed. In tort claims, the rate is always at the court's discretion: s.69 County Courts Act 1984 (County Court) or s.35A Senior Courts Act 1981 (High Court)."},{ch:5,q:"A claimant wishes to amend its particulars of claim after they have been served. The defendant refuses consent. What must the claimant do?",o:["A. Amend freely, because amendments are always permitted before trial.","B. Obtain the court's permission to amend.","C. Discontinue and reissue the claim.","D. Serve a notice of amendment, which takes effect after 14 days.","E. Obtain the consent of the court office only."],a:1,e:"After service, a statement of case may be amended only with the written consent of all parties or the court's permission. Without consent, permission is required."},{ch:5,q:"Which of the following is NOT a required element of particulars of claim under CPR 16.4(1)?",o:["A. A concise statement of the facts relied upon.","B. Details of any interest claimed.","C. A statement and grounds if exemplary or aggravated damages are sought.","D. A full list of all documents on which the claimant intends to rely at trial.","E. Any other matters required by the relevant Practice Direction."],a:3,e:"CPR 16.4(1) requires a concise statement of facts, details of interest, a statement and grounds for exemplary/aggravated damages, and any matters required by a Practice Direction. Listing documents is a disclosure step, not a requirement of the particulars."},{ch:5,q:"A claimant has been served with the defendant's counterclaim. How long does the claimant have to file a defence to the counterclaim, and may this be extended by agreement?",o:["A. 14 days from service; the parties may agree an extension of up to 28 days.","B. 28 days from service; no extension is possible.","C. 14 days from service; any extension requires the court's permission.","D. 21 days from service; the parties may agree an extension of up to 56 days.","E. There is no time limit, because a defence to counterclaim is optional."],a:0,e:"The claimant may file a defence to a Part 20 counterclaim within 14 days of service, and the parties can agree between themselves an extension of up to 28 days."},{ch:6,q:"A claimant wishes to apply for summary judgment before the defendant has filed an acknowledgment of service or a defence. Which of the following best describes the position?",o:["A. The claimant may apply without permission at any time.","B. The claimant requires the court's permission to apply for summary judgment at this stage.","C. Summary judgment can only be sought by a defendant.","D. The claimant must wait until the case management conference.","E. The claimant should apply for judgment in default instead, which requires permission."],a:1,e:"Permission to apply for summary judgment is not needed unless the application is made by the claimant before the defendant has filed an acknowledgment of service and defence."},{ch:6,q:"An applicant seeks an interim injunction. The court is satisfied there is a serious question to be tried and that damages would be an adequate remedy for the applicant if it succeeds at trial. Under American Cyanamid, what will the court normally do?",o:["A. Grant the injunction, because there is a serious question to be tried.","B. Refuse the injunction, because damages would be an adequate remedy.","C. Proceed directly to the balance of convenience.","D. Grant the injunction if the applicant gives an undertaking in damages.","E. Order a split trial."],a:1,e:"Under the American Cyanamid test, if damages would be an adequate remedy for the claimant, an injunction should normally be refused."},{ch:6,q:"A freezing injunction is granted on a without notice application. Which of the following must the applicant do?",o:["A. Serve the application notice, evidence, court order and a statement of the respondent's right to apply to set it aside within seven days of the order.","B. Serve the court order only within 14 days.","C. Notify the respondent at least three days before the order takes effect.","D. Nothing further; the order takes effect until trial without service.","E. Serve the order within 21 days and file a certificate of service."],a:0,e:"On a without notice order, the applicant must serve the application notice, evidence, court order and a statement explaining the respondent's right to have it set aside, within seven days of the order being granted."},{ch:6,q:"A claimant brings a personal injury claim. The defendant has not admitted liability and no judgment has been obtained, but the claimant has strong evidence. The defendant refuses a voluntary interim payment. On which ground under Part 25 could the claimant apply?",o:["A. Admission of liability.","B. Judgment for damages to be assessed.","C. That the court is satisfied that, if the claim went to trial, the claimant would obtain judgment for a substantial amount of money against the defendant.","D. That the defendant is likely to dissipate assets.","E. No ground is available; an interim payment requires an admission."],a:2,e:"Part 25 provides three alternative grounds: admission of liability, judgment obtained, or the court being satisfied that the claimant would obtain judgment for a substantial sum at trial. The third ground is difficult to prove and requires significant evidence."},{ch:6,q:"A claimant has twice failed to comply with directions. The court makes an order that unless the claimant files its expert report by 4.00 p.m. on 10 July, its claim will be struck out. The claimant misses the deadline. What may the claimant do?",o:["A. Nothing; the strike-out is final.","B. Apply for relief from sanctions under CPR 3.9, which the court will assess using the Denton criteria.","C. Agree a 28-day extension with the defendant without reference to the court.","D. Apply for summary judgment.","E. Appeal to the Court of Appeal as of right."],a:1,e:"A party who fails to comply with an unless order may apply for relief from sanctions under CPR 3.9. The court applies the Denton v TH White criteria: seriousness of the default, why it occurred, and all the circumstances."},{ch:7,q:"A defended breach of contract claim is valued at £60,000. The trial is expected to last two days and each party intends to call one expert. To which track is the claim most likely to be allocated?",o:["A. Small claims track.","B. Fast track.","C. Intermediate track.","D. Multi-track.","E. The court has no power to allocate before the CMC."],a:2,e:"The intermediate track covers claims of £25,001–£100,000 with a trial expected to last no more than three days and limited expert evidence."},{ch:7,q:"A claimant's solicitor realises he will miss a deadline for exchanging witness statements by five days. No hearing dates will be affected. What should he do first?",o:["A. Apply to the court for relief from sanctions immediately.","B. Seek to agree an extension with the other side under CPR 3.8, which may be up to 28 days provided no hearing date is put at risk.","C. Serve the statements late without telling anyone.","D. Apply to strike out the defence.","E. Discontinue and reissue the claim."],a:1,e:"The first step is to try to agree an extension of up to 28 days under CPR 3.8, provided it does not put any hearing date at risk. If not agreed, or more time is needed, an application to court is required."},{ch:7,q:"On allocation, a claim is valued at £18,000 plus £1,500 interest and £2,000 costs. What value will the court use for allocation purposes?",o:["A. £21,500.","B. £19,500.","C. £20,000.","D. £18,000.","E. £16,000."],a:3,e:"For allocation purposes the court disregards any amount not in dispute, such as interest, costs and contributory negligence. The relevant value is £18,000."},{ch:7,q:"A claim is allocated to the multi-track. Which of the following is most likely to occur next?",o:["A. The court will fix a case management conference and/or a pre-trial review, at which a legal representative must attend.","B. The court will apply the standard Practice Direction 28 timetable rigidly.","C. The trial will be listed within 30 weeks of filing the directions questionnaire.","D. Statements of case will be limited to 10 pages.","E. The parties will be ordered to mediate before any further step."],a:0,e:"On the multi-track, the court will fix a CMC or pre-trial review, or both, which must be attended by a legal representative. The 30-week timetable is fast track; page limits apply on the intermediate track."},{ch:7,q:"Which of the following is NOT listed in CPR 1.1(2) as part of dealing with a case justly and at proportionate cost?",o:["A. Ensuring the parties are on an equal footing.","B. Saving expense.","C. Ensuring the case is dealt with expeditiously and fairly.","D. Ensuring the successful party recovers all of its costs.","E. Promoting or using alternative dispute resolution."],a:3,e:"CPR 1.1(2) includes equal footing, saving expense, proportionality, expedition and fairness, appropriate allocation of court resources, promoting ADR, and enforcing compliance. Full costs recovery is not part of it."},{ch:8,q:"A defendant alleges that the claimant was contributorily negligent in failing to wear a seatbelt. On whom does the burden of proving contributory negligence lie?",o:["A. The claimant, on the balance of probabilities.","B. The defendant, on the balance of probabilities.","C. The defendant, beyond reasonable doubt.","D. Neither party; the court decides on the evidence.","E. The claimant, beyond reasonable doubt."],a:1,e:"The burden lies on the party making the allegation. It shifts to the defendant where they allege contributory negligence. The civil standard is the balance of probabilities."},{ch:8,q:"A witness states: 'The pavement was wet and icy.' Another witness states: 'The pavement was far too dangerous for anyone to walk on.' Which best describes the admissibility of these statements?",o:["A. Both are admissible as perceptions of fact.","B. The first is an admissible perception of fact; the second is an inadmissible opinion.","C. Both are inadmissible opinions.","D. The second is admissible because it relates to a fact in issue.","E. Both are admissible only if the witnesses are experts."],a:1,e:"Statements that give the witness's perception of a fact are admissible under s.3 Civil Evidence Act 1972; statements drawing a conclusion based on the witness's own values are inadmissible opinion."},{ch:8,q:"A party wishes to rely on a witness statement containing hearsay but does not intend to call the witness to trial, and fails to serve a hearsay notice. What is the effect?",o:["A. The evidence becomes inadmissible.","B. The evidence remains admissible, but the failure may affect the weight the court attaches to it.","C. The whole claim is struck out.","D. The evidence is admissible only if the opponent consents.","E. The party must call the witness to give oral evidence."],a:1,e:"Failure to serve a hearsay notice does not render the evidence inadmissible, but it may affect the weight the court attaches to it at trial."},{ch:8,q:"A single joint expert's report is unfavourable to the defendant. Which of the following is NOT an option available to the defendant?",o:["A. Seek the court's permission to rely on a second expert's evidence.","B. Cross-examine the single joint expert at trial.","C. Obtain a second report and send it to the single joint expert for comment.","D. Rely on a second expert's report at trial without the court's permission.","E. Put written questions to the expert on the report."],a:3,e:"Expert evidence cannot be relied on without the court's permission. A second report may be sent to the single joint expert but cannot itself be produced to the court without permission."},{ch:8,q:"An expert instructed by the claimant is asked by the claimant to revise her report to make it more favourable. What should the expert do?",o:["A. Revise the report, because she is instructed and paid by the claimant.","B. Revise the report only if the defendant consents.","C. Decline, because her overriding duty is to assist the court, not the instructing party.","D. Withdraw from the case without explanation.","E. Revise the report but omit the statement of truth."],a:2,e:"Although instructed by a party, an expert's overriding duty is to assist the court and they should not amend their report to be more favourable to a party's case."},{ch:9,q:"During a reasonable search, a defendant finds that an important invoice relevant to the claim was destroyed in a flood last year. Which best describes the defendant's obligation?",o:["A. The document need not be disclosed, as it no longer exists.","B. The document must still be disclosed on Form N265 with an explanation of how it was lost or destroyed.","C. The defendant must recreate the document.","D. The defendant must apply for non-party disclosure.","E. The document is privileged."],a:1,e:"A document remains within a party's control even if no longer in its possession. If lost or destroyed it must still be disclosed, with a detailed explanation on Form N265."},{ch:9,q:"A solicitor writes to a client advising on the merits of her claim. Separately, the solicitor writes to an expert, after proceedings are contemplated, seeking a report for use in the litigation. Which best describes the privilege position?",o:["A. Both letters are protected by legal advice privilege.","B. The letter to the client attracts legal advice privilege; the letter to the expert attracts litigation privilege.","C. Neither letter is privileged.","D. Both letters attract without prejudice privilege.","E. The letter to the client attracts litigation privilege; the letter to the expert is not privileged."],a:1,e:"Legal advice privilege covers confidential lawyer–client communications for the dominant purpose of legal advice. Communications with third parties such as experts are covered only by litigation privilege, which requires litigation to exist or be reasonably contemplated."},{ch:9,q:"A claimant serves a notice requesting inspection of documents listed in the defendant's disclosure list. Within what period must the defendant allow inspection?",o:["A. 3 days.","B. 7 days.","C. 14 days.","D. 21 days.","E. 28 days."],a:1,e:"A party must allow inspection within seven days of receiving notice of the documents the other party wishes to inspect."},{ch:9,q:"Before issuing proceedings, a prospective claimant believes the prospective defendant holds a maintenance log that would show whether the claim is worth pursuing. Which best describes the requirements for a pre-action disclosure application?",o:["A. Proceedings must already have been issued.","B. Both parties are likely to be parties to the proceedings; the documents are identified; the respondent would have a duty to disclose them if proceedings had started; and early disclosure is desirable (e.g. to save costs or avoid proceedings).","C. The claimant need only show that the documents exist.","D. The application must be made under CPR 31.17 against a non-party.","E. The claimant must show the defendant has acted dishonestly."],a:1,e:"Pre-action disclosure (N244 plus witness statement) requires likely parties, identified documents falling within standard disclosure, and that early disclosure is desirable to save costs, assist resolution without proceedings or dispose fairly of the anticipated proceedings."},{ch:9,q:"In a high-value multi-track commercial dispute with very large volumes of electronic documents, which disclosure approach is the court most likely to adopt?",o:["A. Standard disclosure in all cases, without variation.","B. No disclosure at all.","C. A tailored order (e.g. issue-by-issue disclosure, or relied-upon documents plus specific requests), with the parties agreeing methods such as keyword searches to limit e-disclosure.","D. Disclosure of documents only 14 days before the final hearing.","E. Disclosure limited to documents that support the disclosing party's case."],a:2,e:"On the multi-track the court is most likely to depart from standard disclosure, making tailored orders. Parties are required to agree ways to limit e-disclosure, such as keyword searches and agreed categories."},{ch:10,q:"Which of the following correctly describes costs assessed on the indemnity basis?",o:["A. Costs must be proportionate and reasonable; doubt is resolved in favour of the paying party.","B. Costs must be reasonable; proportionality is not required; doubt is resolved in favour of the receiving party.","C. Costs must be proportionate; doubt is resolved in favour of the receiving party.","D. Costs are fixed by reference to the complexity band.","E. Costs are limited to court fees."],a:1,e:"On the indemnity basis, costs need only be reasonable (no proportionality requirement) and doubt is resolved in favour of the receiving party, generally producing higher awards."},{ch:10,q:"A defendant makes a valid Part 36 offer of £40,000 with a 21-day relevant period. The claimant accepts it 10 days after the relevant period expires. Which best describes the costs consequences?",o:["A. The defendant pays the claimant's costs on the standard basis up to the date of acceptance.","B. The defendant pays the claimant's costs to expiry of the relevant period; the claimant pays the defendant's costs from expiry to acceptance, both on the standard basis.","C. The defendant pays the claimant's costs on the indemnity basis throughout.","D. Each party bears its own costs.","E. The claimant pays all the defendant's costs from the date of the offer."],a:1,e:"Where a defendant's Part 36 offer is accepted outside the relevant period, costs split at expiry: the defendant pays the claimant's costs up to expiry, and the claimant pays the defendant's costs from expiry to acceptance, on the standard basis."},{ch:10,q:"A claimant makes a Part 36 offer to accept £200,000. The defendant does not accept. At trial the claimant is awarded £250,000. Which of the following is a consequence the court may order, unless unjust?",o:["A. The claimant pays the defendant's costs from expiry of the relevant period.","B. Indemnity costs from expiry of the relevant period, interest on those costs, enhanced interest on damages, and an additional amount of 10% of damages (£25,000).","C. An additional amount of £75,000.","D. No consequence, because the court has full discretion.","E. Standard costs only, because the offer was beaten by more than 20%."],a:1,e:"Where a claimant equals or beats its own Part 36 offer, the court may award indemnity costs and interest from expiry, enhanced interest, and an additional amount of up to 10% of damages up to £500,000 (here £25,000), capped at £75,000."},{ch:10,q:"A personal injury claimant loses at trial and a costs order is made against her. She was awarded no damages. Under qualified one-way costs shifting (QOCS), which best describes the position, assuming no fundamental dishonesty?",o:["A. The defendant may enforce the costs order in full.","B. The court cannot make any costs order against her.","C. The costs order is made but is effectively unenforceable, since enforcement is limited to the level of damages and interest awarded.","D. The claimant's solicitor must pay the costs personally.","E. Her ATE insurer is automatically liable."],a:2,e:"QOCS does not prevent a costs order being made but limits its enforcement to the level of damages and interest awarded. If nothing is awarded, the order is effectively unenforceable. Protection may be lost for fundamental dishonesty."},{ch:10,q:"In a multi-track claim valued at £80,000, by when must a party's costs budget (Precedent H) be filed, and what is the consequence of failing to file it on time?",o:["A. With the directions questionnaire; the party is limited to recovering court fees only.","B. No later than 21 days before the first CMC; the party is limited to recovering court fees only.","C. No later than 7 days before the first CMC; the claim is struck out.","D. At trial; the party loses its right to costs on the indemnity basis.","E. No later than 21 days before the first CMC; the party pays a fine."],a:1,e:"For claims over £50,000, the costs budget must be filed no later than 21 days before the first CMC. A party who fails to file on time is limited to recovering applicable court fees."},{ch:11,q:"A claimant serves a witness summons on a key witness five days before trial, together with an offer to pay the witness's travel expenses. Which best describes the validity of the summons?",o:["A. It is valid, as it was accompanied by an offer of expenses.","B. It is invalid, as it must be served at least seven days before the court date.","C. It is valid, as there is no time limit for service.","D. It is invalid, as only the court can serve a witness summons.","E. It is valid only in the High Court."],a:1,e:"A witness summons must be accompanied by an offer to compensate expenses or lost working time and must be served at least seven days before the court date."},{ch:11,q:"At trial, the defendant's barrister asks the claimant: 'You didn't check your mirror before pulling out, did you?' What type of question is this, and at which stage would it normally be used?",o:["A. A non-leading question, used in examination-in-chief.","B. A leading question, used in cross-examination.","C. A leading question, used in re-examination.","D. A non-leading question, used in cross-examination.","E. A leading question, used in examination-in-chief."],a:1,e:"Leading (closed) questions suggest an answer and are used in cross-examination by the opposing party. Non-leading (open) questions are used in examination-in-chief."},{ch:11,q:"A defendant loses at trial before a Circuit Judge in the County Court. To which judge does an appeal lie, and within what period must permission be sought?",o:["A. A District Judge, within 21 days.","B. A High Court Judge in the High Court, within 21 days.","C. The Court of Appeal, within 28 days.","D. Another Circuit Judge, within 14 days.","E. A High Court Judge, within 28 days."],a:1,e:"Appeal from a Circuit Judge in the County Court lies to a High Court Judge in the High Court. Time to appeal from the County Court is 21 days from the decision."},{ch:11,q:"A judgment debtor is employed and has a joint bank account with his spouse containing £10,000. The judgment debt is £3,000. Can the claimant obtain a third-party debt order against the joint account?",o:["A. Yes, because the account balance exceeds the judgment debt.","B. Yes, but only for half the balance.","C. No, because a third-party debt order can only be made where the funds are owed to the defendant alone.","D. No, because third-party debt orders are only available in the High Court.","E. Yes, provided the spouse consents."],a:2,e:"A third-party debt order can only be made where the funds are owed to the defendant and the defendant alone. A joint account does not qualify. An attachment of earnings order may be considered as the debtor is employed."},{ch:11,q:"A claimant wishes to enforce a £3,500 judgment by seizure and sale of the defendant's goods. Which best describes the appropriate court and order?",o:["A. The County Court only, by warrant of control.","B. The High Court only, by writ of control.","C. Either the County Court (warrant of control) or the High Court (writ of control).","D. The County Court, by attachment of earnings order.","E. The High Court, by charging order."],a:2,e:"For debts between £600 and £5,000, the claimant may apply to either the County Court (warrant of control) or the High Court (writ of control). Under £600 is County Court only; over £5,000 is High Court only."},{ch:1,q:"During proceedings, the court stays a £9,000 claim for 28 days so the parties can try ADR. The defendant replies promptly, explaining that the mediator's quoted fee is £7,500 and that mediation would cost almost as much as the claim is worth. Which best describes the likely position?",o:["A. The refusal is unreasonable, because the court ordered a stay.","B. The refusal is likely to be justified, because the cost of ADR would be disproportionately high compared with the sum in dispute.","C. The refusal is unreasonable, because mediation is compulsory for all claims.","D. The refusal is justified only if the defendant goes on to win at trial.","E. The refusal is unreasonable, because the defendant didn't propose arbitration instead."],a:1,e:"One of the Halsey considerations is whether the costs of ADR would be disproportionately high. Objections raised at the time are more likely to be accepted than ones raised later."},{ch:1,q:"A claimant won at trial but unreasonably ignored three invitations to mediate. Which of the following is NOT a sanction listed in the guide?",o:["A. Depriving the claimant of their costs.","B. Ordering the claimant to pay some of the other side's costs.","C. Depriving the claimant of interest on damages.","D. Striking out the claimant's claim.","E. Ordering a higher rate of interest to be paid on damages."],a:3,e:"The listed adverse costs sanctions are losing costs, paying the other side's costs, interest adjustments and losing interest. Striking out is not one of them."},{ch:1,q:"At mediation, the parties shake hands on a settlement but write nothing down. The defendant later refuses to pay. Which best describes the claimant's position?",o:["A. The oral settlement can be enforced through the court as a mediated agreement.","B. The mediator can enforce the settlement.","C. The oral settlement isn't enforceable through the courts unless there is a written agreement.","D. The mediator's notes automatically become a binding contract.","E. The claimant can apply under s.66 Arbitration Act 1996."],a:2,e:"Unless there is a written agreement (essentially a contract), the outcome of mediation isn't enforceable through the courts."},{ch:1,q:"A client wins an arbitration, but the other side doesn't pay the award. What should the client do?",o:["A. Start fresh court proceedings for the full claim.","B. Apply to the High Court under s.66 Arbitration Act 1996 to enforce the award in the same way as a judgment.","C. Ask the arbitrator to enforce the award.","D. Appeal under s.69.","E. Refer the dispute to mediation."],a:1,e:"Under s.66, a final arbitral award can be enforced through the High Court in the same way as a court judgment."},{ch:1,q:"The claim and defence have been filed. At which stage of the litigation process does a judge allocate the claim to a track and give directions?",o:["A. Stage 1 – pre-action conduct.","B. Stage 2 – commencing and defending.","C. Stage 3 – case management.","D. Stage 4 – trial.","E. Stage 5 – post-trial."],a:2,e:"At Stage 3 (case management) the judge allocates the claim to one of four tracks and sets directions and deadlines."},{ch:2,q:"A surveyor negligently inspected a client's building in March 2020. The resulting damage happened in May 2022 and was immediately obvious. When does the limitation period expire?",o:["A. March 2023.","B. March 2026.","C. May 2025.","D. May 2028.","E. March 2035."],a:3,e:"For tort claims other than personal injury and latent damage, time runs for six years from the date the damage occurs (May 2022), not the date of the negligent act."},{ch:2,q:"A client wants to bring a £30,000 claim against a neighbour but is worried about funding. What should the solicitor check first?",o:["A. Whether legal aid is available.","B. Whether the client already has before-the-event insurance, for example through a household policy.","C. Whether the client will agree a damages-based agreement.","D. Whether a litigation funder is interested.","E. Whether the neighbour has after-the-event insurance."],a:1,e:"The solicitor should always check first whether the client already has BTE insurance, often included in household or motor policies."},{ch:2,q:"A client signs a conditional fee agreement and wins. Which best describes the success fee?",o:["A. It is unlimited and recoverable from the losing party.","B. It is capped at 100% of base costs and isn't recoverable from the losing party.","C. It is capped at 50% of damages.","D. It is capped at 25% of base costs.","E. It is recoverable only in personal injury claims."],a:1,e:"Under a CFA the success fee is a percentage uplift capped at 100%, and it is not recoverable from the losing party."},{ch:2,q:"A defendant receives a letter before action in a straightforward debt claim. Under the PDPACP, how long should the defendant normally take to respond?",o:["A. 7 days.","B. 14 days.","C. 28 days.","D. Three months.","E. Six months."],a:1,e:"The response should come within 14 days in a straightforward case, and no more than three months in a very complex one."},{ch:2,q:"A delivery driver negligently injures a pedestrian while working. Whom should the pedestrian sue?",o:["A. The driver only.","B. The employer only.","C. Both the driver and the employer, on the basis of vicarious liability.","D. The employer's insurer only.","E. Whichever party has more assets."],a:2,e:"Where an employee commits a tort in the course of employment, the claim should be brought against both the employee and the company (vicarious liability)."},{ch:3,q:"A developer has a complex £400,000 claim about defective construction work. Where is the claim most appropriately started?",o:["A. The County Court.","B. The Chancery Division.","C. The Technology and Construction Court in the King's Bench Division.","D. The Family Division.","E. The Patents Court."],a:2,e:"The TCC is a specialist court within the King's Bench Division, and the High Court is appropriate for complex claims above £100,000."},{ch:3,q:"A claimant personally serves a claim form on a limited company by handing it to the receptionist. Is service valid?",o:["A. Yes, because anyone at the company's office may accept service.","B. No, because personal service on a company requires leaving the document with a person holding a senior position.","C. Yes, if it is followed up by post.","D. No, because a company can only be served by email.","E. Yes, because the receptionist is an employee."],a:1,e:"Personal service on a company requires leaving the document with a person holding a senior position."},{ch:3,q:"A defence is emailed to the claimant's solicitors, who have agreed in writing to accept service by email, at 5.10 p.m. on Thursday. When is it deemed served?",o:["A. Thursday.","B. Friday.","C. Saturday.","D. Monday.","E. Tuesday."],a:1,e:"For documents other than a claim form, service by email after 4.30 p.m. on a business day is deemed to take place on the next business day."},{ch:3,q:"A claimant personally serves the claim form and the particulars of claim. Which further step is required?",o:["A. File a certificate of service within 21 days of serving the particulars of claim.","B. File a certificate of service within 7 days.","C. No further step is needed.","D. Serve a notice of issue on the court within 14 days.","E. Obtain the defendant's written acknowledgment."],a:0,e:"A claimant who serves personally must file a certificate of service within 21 days of serving the particulars of claim."},{ch:3,q:"A straightforward breach of contract claim is valued at £120,000, excluding interest. In which court may it be started?",o:["A. The County Court only.","B. The High Court only.","C. Either the County Court or the High Court.","D. The Court of Appeal.","E. The Commercial Court only."],a:2,e:"Claims worth more than £100,000 may be started in either the County Court or the High Court."},{ch:4,q:"The parties have already agreed the maximum 28-day extension for filing the defence. The defendant needs another 14 days. What must the defendant do?",o:["A. Agree a further extension with the claimant.","B. Apply for the court's permission, because extensions beyond 56 days require a court order.","C. File an acknowledgment of service.","D. Nothing, because the CPR allow an automatic further 14 days.","E. File a partial defence."],a:1,e:"Agreed extensions give a maximum of 56 days in total from deemed service of the particulars of claim; anything beyond that requires a court order."},{ch:4,q:"A claimant obtains default judgment in a specified debt claim. What must the claimant give the court?",o:["A. Only the original claim amount.","B. The date payment was due, an up-to-date interest figure and the daily rate of interest.","C. A witness statement on the merits.","D. Evidence of the defendant's assets.","E. A draft order for a disposal hearing."],a:1,e:"In a specified claim, the court then enters judgment for a specific, up-to-date amount, with daily interest continuing until payment."},{ch:4,q:"A defendant who was in hospital when the claim was served applies to set aside default judgment five months after learning of it, with no explanation for the delay. What is the likely outcome?",o:["A. The court must set the judgment aside.","B. The court may refuse, because it must consider whether the application was made promptly.","C. The court must set the judgment aside, because illness is a mandatory ground.","D. The judgment is automatically void.","E. The court will stay the judgment pending trial."],a:1,e:"Illness is a discretionary 'good reason' ground, and the court must consider whether the defendant applied promptly. An unexplained delay may lead to refusal."},{ch:4,q:"The court sets aside a default judgment on condition that the defendant pays £10,000 into court by a set date. The defendant doesn't pay. What happens?",o:["A. The judgment stands.","B. The claim is struck out.","C. The defendant may defend anyway.","D. The claimant must reapply for judgment.","E. The court lists a disposal hearing."],a:0,e:"Where set-aside is conditional on a payment into court, the judgment stands if the defendant fails to pay."},{ch:4,q:"The parties settle a claim. The defendant insists that the settlement terms stay confidential. Which order is most suitable?",o:["A. A standard consent order.","B. A Tomlin order.","C. A notice of discontinuance.","D. Judgment in default.","E. A disposal order."],a:1,e:"A Tomlin order keeps the terms in a confidential schedule, whereas the terms of a standard consent order are a matter of public record."},{ch:5,q:"A claimant relies on an oral contract. What must the particulars of claim include?",o:["A. A copy of the contract.","B. The contractual words used, and by whom, to whom, when and where they were spoken.","C. Only the date of the contract.","D. A witness statement.","E. Nothing further."],a:1,e:"For an oral contract, the pleading must set out the contractual words used and state by whom, to whom, when and where they were spoken."},{ch:5,q:"A contract claim pleads interest, but the contract specifies no rate. What rate will apply?",o:["A. 1%.","B. Base rate.","C. The statutory rate of 8%.","D. 10% above base rate.","E. No interest is recoverable."],a:2,e:"In contract claims, any contractual rate takes priority; where none is specified, the statutory rate of 8% applies."},{ch:5,q:"A claimant receives a defence that raises no new issues. Must the claimant file a reply?",o:["A. Yes, within 14 days.","B. Yes, or the defence is treated as admitted.","C. No, because a reply to defence is optional.","D. Yes, with permission.","E. Only on the multi-track."],a:2,e:"A reply to defence is entirely optional; the claimant is not required to file one."},{ch:5,q:"Before serving the particulars of claim, a claimant wants to add a second defendant. Is permission required?",o:["A. No, because the document hasn't been served.","B. Yes, because adding, removing or substituting a party always requires the court's permission.","C. Only if the defendant objects.","D. No, provided the new defendant consents.","E. Only outside the limitation period."],a:1,e:"Adding, removing or substituting a party always requires the court's permission, whether or not the statement of case has been served."},{ch:5,q:"A defendant receives a Part 18 request for further information. Which best describes how they must respond?",o:["A. In a letter, with no formalities.","B. File and serve the response within the time set, verified by a statement of truth.","C. Orally at the CMC.","D. Only if the request is in a court order.","E. Within 7 days, without a statement of truth."],a:1,e:"The response must be filed, served on the other parties within the time limit set, and accompanied by a statement of truth."},{ch:6,q:"In a with-notice application, when must the application notice, draft order and evidence be served on the respondent?",o:["A. At least 1 day before the hearing.","B. At least 3 days before the hearing.","C. At least 7 days before.","D. At least 14 days before.","E. At the hearing."],a:1,e:"In a with-notice application, the documents must be served on the respondent at least three days before the hearing."},{ch:6,q:"A defendant applies for summary judgment. When must the claimant (as respondent) serve its written evidence?",o:["A. At least 3 days before the hearing.","B. At least 7 days before the hearing.","C. At least 14 days before.","D. At the hearing.","E. Within 28 days of the application."],a:1,e:"The respondent must have at least 14 days' notice of the hearing and must serve its evidence at least seven days before it."},{ch:6,q:"A claimant fears the defendant will destroy copied software files held at the defendant's premises. Which remedy fits best?",o:["A. A freezing injunction.","B. A search order, applied for without notice and supervised by an independent solicitor.","C. Security for costs.","D. An interim payment.","E. Summary judgment."],a:1,e:"Search orders address a real risk that evidence will be destroyed, are usually sought without notice, and must be supervised by an independent solicitor."},{ch:6,q:"A defendant has reason to believe that the claimant company won't be able to pay the defendant's costs if the claim fails. What may the defendant apply for?",o:["A. A freezing injunction.","B. Security for costs, which the court has discretion to order.","C. Summary judgment.","D. A non-party costs order.","E. An unless order."],a:1,e:"An impecunious claimant company is a ground for security for costs, but the court keeps a discretion and will consider whether an order would stifle a genuine claim."},{ch:6,q:"On its face, a particulars of claim discloses no legally recognisable cause of action. Which is the most direct remedy?",o:["A. Summary judgment, which requires an in-depth look at the merits.","B. Striking out under CPR 3.4(2)(a).","C. An unless order.","D. An interim injunction.","E. A Part 18 request."],a:1,e:"Striking out under CPR 3.4(2)(a) (no reasonable grounds) can be based on the face of the statement of case alone, without examining the evidence."},{ch:7,q:"On the fast track, when does the Practice Direction 28 timetable suggest disclosure should take place?",o:["A. Within 2 weeks of filing the directions questionnaire.","B. Within 4 weeks.","C. Within 10 weeks.","D. Within 14 weeks.","E. Within 22 weeks."],a:1,e:"The suggested fast track timetable provides for disclosure within four weeks of filing the directions questionnaire."},{ch:7,q:"What standard limit applies to witness statements on the intermediate track?",o:["A. 10 pages.","B. 20 pages.","C. 30 pages.","D. 50 pages.","E. No limit."],a:2,e:"Witness statements are limited to 30 pages; the 10-page limit applies to statements of case and the 20-page limit to expert reports."},{ch:7,q:"A claim appears suitable for the multi-track. Which directions questionnaire do the parties use?",o:["A. N149.","B. N150.","C. N244.","D. N265.","E. N1."],a:1,e:"Form N150 is used for all tracks other than the small claims track, which uses N149."},{ch:7,q:"After allocation, a defendant adds a substantial counterclaim. Can the claim be moved to another track?",o:["A. No, because allocation is final.","B. Yes, the court may reallocate where circumstances have changed, on application or of its own motion.","C. Only with both parties' consent.","D. Only on appeal.","E. Only at the pre-trial review."],a:1,e:"Where circumstances have changed since allocation, the court may reallocate the claim on application by a party or on its own initiative."},{ch:7,q:"A party serves its expert report two months late, and as a result the trial date has to be vacated. It applies for relief from sanctions. What is the likely assessment at stage 1?",o:["A. The breach is trivial.","B. The breach is serious or significant, which makes relief less likely.","C. Stage 1 isn't relevant.","D. Relief is automatic.","E. The court must grant relief if the party applies promptly."],a:1,e:"Relief is usually granted only for breaches that are neither serious nor significant and do not affect hearing dates. A breach that loses the trial date is serious."},{ch:8,q:"A witness statement includes facts the witness was told by a colleague. What must the statement do?",o:["A. Leave those facts out.","B. Identify them as matters of information or belief and state their source.","C. Present them as within the witness's own knowledge.","D. Attach the colleague's statement.","E. Include them only in an exhibit."],a:1,e:"A witness statement must distinguish matters within the witness's own knowledge from matters of information or belief, and identify the source."},{ch:8,q:"At trial, what is the usual role of a witness's statement?",o:["A. It is read aloud by counsel.","B. It stands as the witness's evidence-in-chief, after which the witness is cross-examined.","C. It replaces oral evidence altogether.","D. It is used only for cross-examination.","E. It is excluded unless the parties agree."],a:1,e:"The witness confirms the statement on oath; it stands as evidence-in-chief, and the opposing party may then cross-examine."},{ch:8,q:"Evidence reads: 'Ann told Ben, who told me, that the lorry was speeding.' How is the court likely to treat it?",o:["A. As inadmissible.","B. As admissible hearsay, but multiple hearsay may reduce its weight.","C. As expert evidence.","D. As conclusive.","E. As inadmissible opinion."],a:1,e:"Hearsay is admissible under s.1 Civil Evidence Act 1995; whether evidence involves multiple hearsay is one of the factors affecting its weight."},{ch:8,q:"A party serves a hearsay notice. Within what period may the opponent serve a notice to attack the witness's credibility?",o:["A. 7 days.","B. 14 days.","C. 21 days.","D. 28 days.","E. Any time before trial."],a:1,e:"A notice to attack credibility must be served within 14 days of the hearsay notice."},{ch:8,q:"Within what period may a party put written questions to the opposing expert on their report?",o:["A. 7 days of service.","B. 14 days.","C. 21 days.","D. 28 days.","E. At trial only."],a:3,e:"Parties may put questions to the opposing expert within 28 days of service of the report; the CPR set no timescale for the expert's reply."},{ch:9,q:"A solicitor sends a client (a) a general leaflet on how litigation works and (b) a letter advising on the merits of her claim. Which is privileged?",o:["A. Both.","B. Neither.","C. Only (b).","D. Only (a).","E. Both, but only once proceedings start."],a:2,e:"General advice about the litigation process isn't privileged; a letter advising on the merits attracts legal advice privilege."},{ch:9,q:"A party decides that a privileged expert report helps its case. What may it do?",o:["A. Nothing, because privilege can't be waived.","B. Waive privilege by writing to the opponent and inviting inspection, after which privilege generally can't be reclaimed.","C. Waive privilege temporarily.","D. Apply to court before waiving.","E. Disclose it only to the judge."],a:1,e:"A party may waive privilege by telling the opponent it no longer relies on it and inviting inspection; once waived it generally cannot be reclaimed."},{ch:9,q:"A claimant believes the defendant's search for documents was inadequate. What is the first step?",o:["A. Apply for non-party disclosure.","B. Write to the defendant explaining why the search seems inadequate and what is needed to put it right.","C. Apply to strike out the defence.","D. Apply immediately for specific disclosure.","E. Raise it at trial."],a:1,e:"The dissatisfied party should first write to the other side; only if the issue isn't rectified should it apply on Form N244 for specific disclosure."},{ch:9,q:"What is the standard disclosure direction on the small claims track?",o:["A. Standard disclosure.","B. Each party files and serves copies of the documents it relies on at least 14 days before the final hearing.","C. No documents are exchanged.","D. Issue-by-issue disclosure.","E. E-disclosure."],a:1,e:"On the small claims track, each party files and serves copies of the documents it intends to rely on at least 14 days before the final hearing."},{ch:9,q:"A company's accountant holds the company's ledgers, and the company has a right to take copies of them. Are the ledgers within the company's control?",o:["A. No, because it doesn't physically hold them.","B. Yes, because the company has a right to inspect or take copies of them.","C. Only if the accountant agrees.","D. Only if they are privileged.","E. Only on the multi-track."],a:1,e:"Under CPR 31.8, a document is within a party's control if it has (or had) possession, or a right to inspect or take copies."},{ch:10,q:"A receiving party serves a notice of commencement of detailed assessment. The paying party serves no points of dispute within 21 days. What may the receiving party do?",o:["A. Request an assessment hearing.","B. Apply for a default costs certificate for the full amount.","C. Nothing, until three months have passed.","D. Apply for summary assessment.","E. Apply for an interim certificate only."],a:1,e:"If no points of dispute are served within 21 days, the receiving party can apply for a default costs certificate for the full amount."},{ch:10,q:"A fast track trial lasts one day. How will costs normally be dealt with?",o:["A. Detailed assessment.","B. Summary assessment, based on a statement of costs filed at least 24 hours before the hearing.","C. Provisional assessment.","D. Costs reserved.","E. Costs capping."],a:1,e:"The court should make a summary assessment at the end of a fast track trial or any hearing lasting no more than one day, based on a statement of costs filed at least 24 hours in advance."},{ch:10,q:"A solicitor negligently misses a filing deadline, and both parties incur wasted costs as a result. Against whom may the court make an order?",o:["A. The client only.","B. The solicitor personally, by a wasted costs order.","C. The court itself.","D. The opponent.","E. No one."],a:1,e:"Wasted costs orders are made against legal representatives personally for improper, unreasonable or negligent acts or omissions."},{ch:10,q:"A claimant makes a written 'Part 36' offer that states a 14-day period for acceptance. Is it a valid Part 36 offer?",o:["A. Yes.","B. No, because the relevant period must be at least 21 days.","C. Yes, if the defendant accepts within 14 days.","D. Only if the court approves.","E. Yes, in fast track cases."],a:1,e:"A valid Part 36 offer must state a relevant period of 21 days or more."},{ch:10,q:"At the end of an interim hearing, the court orders 'costs in the case'. What does this mean?",o:["A. Each party pays its own costs.","B. The party who ultimately wins the case recovers these costs.","C. The applicant pays regardless of the outcome.","D. The decision on costs is deferred to the judge.","E. The costs are thrown away."],a:1,e:"'Costs in the case' means the party who ultimately wins recovers these costs as part of its overall costs award. Deferral is 'costs reserved'."},{ch:11,q:"A multi-track trial is fixed for 1 December. When must the pre-trial checklist be filed?",o:["A. Two weeks before trial.","B. Eight weeks before trial.","C. Ten weeks before trial.","D. Seven days before trial.","E. At the CMC."],a:1,e:"The pre-trial checklist (listing questionnaire) is filed by all parties eight weeks before the trial date."},{ch:11,q:"In what order are closing speeches made?",o:["A. Claimant first, then defendant.","B. Defendant first, then claimant.","C. Simultaneously in writing.","D. At the judge's choice.","E. Only the claimant speaks."],a:1,e:"In closing speeches, the defendant goes first, followed by the claimant."},{ch:11,q:"A Master in the High Court makes a decision. Where does an appeal lie?",o:["A. A Circuit Judge.","B. A High Court Judge.","C. The Court of Appeal.","D. A District Judge.","E. The Supreme Court."],a:1,e:"A Master is treated as equivalent to a District J
