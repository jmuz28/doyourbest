al to that retainer of which the individual is aware. There are certain exceptions to this duty, but none applies to this scenario. Therefore, the solicitor must disclose the information about the technology company to the client. (A) and (E) are incorrect because the solicitor does not owe any duty of confidentiality to the friend - the friend is not, and has never been, his client. (B) is incorrect because it is immaterial that the solicitor learned the information in a personal capacity. (D) is incorrect because there is no indication that the friend's information is subject to any legal privilege."},{n:74,id:"ETH097",scenario:"A solicitor is acting for a client in a contentious dispute and the other party has accused the solicitor of acting improperly. The client has decided that they want to settle the matter with the other party. When drafting the settlement agreement, the solicitor includes a clause prohibiting the other party from making a report about them to the Solicitors Regulation Authority.",q:"Do the rules of professional conduct allow the solicitor to include this clause in the settlement agreement?",opts:["Yes, provided the solicitor obtains their client's consent to do so.","Yes, provided the other party is legally represented.","No, the solicitor must not include the clause.","Yes, this type of clause is permitted.","Yes, provided it is in the client's best interests to do so."],ans:"C",expl:"(C) A solicitor must not attempt to prevent anyone from providing information to the SRA or any other body exercising regulatory, supervisory, investigatory, or prosecutory functions in the public interest. (A) is incorrect because obtaining the client's consent to include the clause will not resolve the breach of the SRA Code of Conduct. (B) is incorrect because the fact that the other party is represented will not resolve the breach of the Code. (D) is incorrect because this type of clause is not permitted. (E) is incorrect because this would constitute a breach of the Code even if it is in the client's best interests to include a clause of this nature."},{n:75,id:"DIS133",scenario:"A solicitor is representing a client in a £750,000 contract claim against a manufacturer. The manufacturer was hired to build a machine that tests the pulling power of train engines. The client claims the machine that was delivered failed to meet the specifications the client provided in a number of ways. Because the engineering aspects of the machine are complex, and the case involves a significant amount of money, the court has allowed each to hire their own expert on the matter. The court's order includes a requirement that the parties arrange a without prejudice meeting of the experts to identify the issues on which the experts agree and disagree. The claimant would like to attend the meeting to ensure his position is known.",q:"Which of the following correctly states the legal position relating to the claimant's attendance at the meeting of the experts?",opts:["Because each party has hired their own experts, they each have a right to attend the without prejudice meeting.","Because each party has hired their own experts, the solicitors for each party have a right to attend the meeting.","Because each party has hired their own experts, both the parties and their solicitors have a right to attend the meeting.","Because the defendant is presumed innocent, only the defendant and the defendant's solicitor may attend the meeting.","Because the meeting is for the experts to narrow the issues, and the experts owe a duty of impartiality, neither the parties nor their solicitors should attend the meeting."],ans:"E",expl:"(E) When a court orders experts to meet to agree the issues, neither the parties nor their legal representatives should attend the meeting. As choice (E) indicates, regardless of who instructs the experts, they owe a duty to the court to be impartial and to try to keep costs proportionate; allowing the parties or solicitors to attend could interfere with the impartiality and efficiency sought. Thus, (A), (B), and (C) are incorrect. It's worth noting that (D) is incorrect not only because neither party should attend, but also because the idea that the defendant is presumed innocent is related to criminal cases and has no application in civil cases."},{n:76,id:"BSL184",scenario:`A company trading as a country house hotel went into liquidation last month. The liquidator has discovered the following transactions:
• An antique desk was sold to a director's spouse 18 months ago for £5,000. It was valued in the accounts at £100,000.
• A paddock was sold to a director four years ago for £75,000. Three months later, the director sold the land for £250,000.
• A garden statue was sold to a collector for £20,000 12 months ago. It was discovered after sale that it was an early Barbara Hepworth sculpture and valued at £3 million.`,q:"Which of the transactions fall within the relevant time to be set aside as a transaction at an undervalue?",opts:["The sale of the statue and the sale of the desk only.","The sale of the statue only.","The sale of the desk only.","The sale of the paddock and the statue only.","All of the transactions."],ans:"A",expl:"(A) The sale of the desk and the sale of the statue both are within the relevant time period. The relevant time period for a transaction at an undervalue is within two years of a company's insolvency. (D) and (E) are incorrect as the sale of the warehouse falls outside of the two-year period. (C) and (B) are incorrect as they each include only one of the transactions made within the relevant time frame.",note:'The source explanation refers to "the sale of the warehouse"; this appears to mean the sale of the paddock (four years ago). The question ID is shown in the source as "BSL 184".'},{n:77,id:"TAX070",scenario:"A man has worked for a small, unquoted trading company since 2010. In December 2020, he left the company and sold his 10% shareholding in the company which he had acquired in 2010. The man realised a chargeable gain of £56,200 on the sale. He had non-savings income for the year of £24,000. He did not have any losses to carry forward. In 2020/21, the annual exempt amount for 2020/21 was £12,300, and the business asset disposal relief rate was 10% on gains up to £1,000,000.",q:"How much capital gains tax will the man have to pay for the tax year 2020/21?",opts:["£7,430","£4,390","£5,620","£10,540","£56,200"],ans:"B",expl:"(B) £4,390. Ordinarily, to calculate capital gains tax, we would subtract the annual exempt amount from the chargeable gain to arrive at the taxable gain (£56,200 - £12,300 = £43,900 taxable gain). We then would apply a 10% rate to the amount of the taxable gain that is still within the taxpayer's basic rate band above the taxpayer's other income and apply a 20% rate to amounts in excess of the basic rate band. However, we would not do that here because Business Asset Disposal Relief (formerly called Entrepreneurs' Relief) is available when a person sells shares in a company in which he was an officer or employee for at least two years and the person owned at least 5% of the company's trading shares. The man qualifies as he was employed by the company for 10 years and owned 10% of the shares. Under the relief a 10% rate applies to the taxable capital gain. Thus, the man would owe £4,390 (£43,900 x 10%)."},{n:78,id:null,scenario:"A case has been brought before the Court of Appeal, and there is a concern by the judge that the Act of Parliament which is the subject of the litigation has an ambiguity issue.",q:"Which of the following statements best describes the situation in which the judge in the Court of Appeal would be permitted to review and amend an Act of Parliament?",opts:["If the Act in fact has ambiguous wording.","If the judge in this scenario did not agree with the Act.","If the Act is incompatible with a prior Supreme Court ruling.","There is no situation in which the Court could overlook an Act of Parliament.","If the case would be difficult to interpret."],ans:"D",expl:"(D) Courts can only interpret an Act of Parliament but cannot otherwise amend them. That is the role of Parliament. (A) is incorrect as any ambiguity must be dealt with by way of interpretation using, for example, the rules of language and statutory interpretation. (B) is incorrect because a judge must apply or interpret a statute even if he/she does not agree with it. (C) is incorrect because under the legal system of the United Kingdom, statutes take precedence over a Supreme Court ruling. The fact that the statute may be incompatible with a prior Supreme Court ruling is thus irrelevant. (E) is incorrect. A court cannot amend an Act of Parliament just because it is difficult to interpret.",note:"No question ID is shown on the answer screen for this question in the source document."},{n:79,id:"BSL213",scenario:"A plumber has been trading successfully for many years as a sole trader. To increase capacity, the plumber has decided to add another plumber to the business. However, the new plumber wants the protection of limited liability. Therefore, the two decide to run the business as a private limited company. Both the plumbers will be directors and equal shareholders in the company.",q:"Which of the following will not have to be included in the application for registration to incorporate their company?",opts:["The location of where the company will be trading.","A statement of capital and initial shareholders.","Details of the company's business activity.","Details of persons with significant control.","Details of the subscribers."],ans:"A",expl:"(A) The location of the registered office must be provided on incorporation but not the company's trading address (if this is different); a company can use another address as its registered office, for example, its solicitor's office. (B) - (E) are wrong as a statement of capital and initial shareholders, details of the company's business activity, details of persons with significant control, and details of the subscribers must be provided."},{n:80,id:"BSL223",scenario:"A company was incorporated several years ago with the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association. To raise more capital for expansion, the company issued new preference shares to an investor. It also appointed the investor as a non-executive director.",q:"What forms must be filed at Companies House, and when, following the issue of shares and the appointment of the non-executive director?",opts:["Appointment of Director form within 14 days of appointment and Return of Allotment of Shares form within 14 days of issue of shares.","Appointment of Director form within 14 days of appointment and Return of Allotment of Shares form within 15 days of issue of shares.","Appointment of Director form within 15 days of appointment and Return of Allotment of Shares form within 15 days of issue of shares.","Appointment of Director form within 14 days of appointment and Return of Allotment of Shares form within one month of issue of shares.","Appointment of Director form within 15 days of appointment and Return of Allotment of Shares form within one month of issue of shares."],ans:"D",expl:"(D) Following the issue of preference shares, the company file a Return of Allotment of Shares form within one month of the issue of shares. Following the appointment of a director, the company must file an Appointment of Director form within 14 days. None of the other answers have the correct time limits."},{n:81,id:"BSL034",scenario:"Three business associates form a general partnership. A supplier brings a successful breach of contract claim against the partnership and the partners.",q:"Which of the following statements is correct?",opts:["The supplier will be able to collect the judgment from partnership assets only.","The supplier will be able to collect the judgment from the personal assets of all three of the partners only.","The supplier will be able to collect the judgment from the personal assets of the non-signing partners, but only after the personal assets of the partner who signed the contract are exhausted.","The supplier will be able to collect the judgment from the personal assets of the partner who signed the contract only, but only after partnership assets are exhausted.","The supplier will be able to collect the judgment from the personal assets of all the partners."],ans:"E",expl:"(E) A partnership creditor can recover the debt from the partnership or from any of the partners, as each partner is liable for the debts of the partnership. (A) is incorrect because a partnership does not have limited liability, and therefore a creditor can pursue the partners personally for their debt. (B) is incorrect as, to the extent that there are partnership assets and property available, these can be utilised to pay a debt before recourse to the partners personally. (C) and (D) are both incorrect because the partners are jointly liable for the debt.",note:"On the answer screen the explanation text is captured out of order by the scan; it has been reassembled here in reading order from the page image."},{n:82,id:"TRT048",scenario:"A patient went to a hospital's emergency department complaining of agonising stomach pains. The duty doctor would not see him and advised him to go home and see his own doctor in the morning. During the night the patient died of a rare form of poisoning which was untreatable.",q:"What is the liability of the hospital to the patient?",opts:["The hospital owed the patient a duty of care which has been breached, so the hospital is liable in negligence.","The poisoning is a new intervening act which breaks the chain of causation, so the hospital is not liable.","The hospital did not breach its duty of care as the patient would have died anyway, so the hospital is not liable.","The hospital owed the patient a duty of care which has been breached, but no causal link can be established, so the hospital is not liable.","The hospital owed the patient a duty of care which has been breached, but the loss suffered (the death) is too remote, so the hospital is not liable."],ans:"D",expl:"(D) The hospital is not liable. It is clear that a hospital owes a duty of care to its patients, and in this scenario the duty was breached because the doctor sent the patient home without examining him. However, as well as a duty of care that is breached, a causal link between the breach of duty and the loss suffered must be established. This is done by applying the 'but for' test; that is, but for the hospital's breach of duty, would the patient's death have occurred? In this scenario, the death was inevitable as the poisoning was untreatable. Therefore the negligence did not cause the death. (A) is incorrect for the reasons given above. The hospital owes a duty of care that has been breached, but no causal link between the negligence and loss can be established. (B) is incorrect because the poisoning had taken place before the patient arrived at the hospital, so it cannot be said to be an intervening act that breaks the chain of causation. Therefore this argument would not be available to the hospital. (C) is incorrect because a hospital has a duty of care to its patients that was breached. The fact that the patient would have died anyway is relevant to causation but not to establishing breach of duty. (E) is incorrect. The hospital had a duty of care, which was breached by sending the patient home. If the patient had died of an illness that was treatable, the hospital would have been liable for his death. The loss suffered (the death) would not have been too remote from the negligence to establish liability. However, in this particular scenario, liability is not established because of the lack of a causal link, not because of remoteness."},{n:83,id:"LGS045",scenario:"A disabled client wants to attend a meeting at the offices of a small high street firm of solicitors. The client is a wheelchair user, and the firm's offices are accessed by a steep flight of stairs. The firm is considering its obligations under the Equality Act 2010 (the 'Act') as it acknowledges that the client is placed at a substantial disadvantage compared to non-disabled clients by not being able to access the offices.",q:"Which of the following best describes the firm's obligations to the client under the Act?",opts:["The firm does not have an obligation to the client to make adjustments, as the Act relates only to employees.","The firm must make any necessary adjustments to its premises to allow the client to access them.","The firm must make substantial adjustments to its premises to allow the client to access them.","The firm must make any reasonable adjustments to its premises to allow the client to access them, taking into account the cost and resources of the firm.","The firm does not have an obligation to the client to make any adjustments because the client could have the meeting by telephone call."],ans:"D",expl:"(D) The firm has an obligation to make reasonable adjustments to its premises to allow the client to access them, taking into account the cost and resources of the firm. The firm acknowledges that the disabled client is placed at a substantial disadvantage compared to non-disabled clients, and therefore the firm has an obligation to provide reasonable adjustments. In assessing what is reasonable, the firm can take into account its resources and the likely cost of the adjustment. (A) is incorrect as the Act applies to the provision of legal services, and firms have a legal obligation to provide reasonable adjustments to ensure that both disabled clients and employees are not placed at a substantial disadvantage compared to those who are not disabled. (B) is incorrect as the firm is not required to make all necessary adjustments, only those which are reasonable. Not all adjustments will be reasonable in the circumstances. Some may be too costly or impractical. (C) is incorrect as there is no obligation to make substantial adjustments, only reasonable ones. (E) is incorrect because, as explained above, the firm has an obligation to make reasonable adjustments."},{n:84,id:"CNL043",scenario:"Under powers granted by the Car Parking Act 2010, the government has laid before the House of Commons and the House of Lords a draft of the Parking Regulations 2019, which set new levels of parking fines. The regulations are subject to the negative resolution procedure.",q:"What powers do Parliament have in respect of the regulations?",opts:["Only the House of Commons has 40 days during which they can vote to reject the regulations.","Both the House of Commons and the House of Lords can amend the regulations.","Only the House of Commons can amend the regulations before approving them.","Only the House of Lords can amend the regulations before approving them.","Both the House of Commons and House of Lords have 40 days to vote to reject the regulations."],ans:"E",expl:"(E) Both the House of Commons and House of Lords have 40 days to vote to reject the regulations. The regulations are a form of secondary legislation, in that they are made under powers granted by an Act of Parliament. The negative resolution procedure gives both the House of Commons and the House of Lords 40 days during which they can vote to reject the regulations. If no such vote is made by both Houses, the regulations become law. (A) is incorrect because it is limited to the House of Commons. However, the negative resolution procedure applies to both Houses. (B), (C), and (D) are incorrect because they provide for amendment and neither House has the power to amend the regulations."},{n:85,id:"CTR018",scenario:"A woman owes her friend £250. The woman is struggling to afford the payment, so her friend agrees to accept £200 from the woman's husband in full and final settlement of the debt. Six months after agreeing to accept £200, the friend sues the woman for the remaining £50.",q:"Is the friend entitled to the additional £50 after accepting the lesser amount in full and final settlement of the debt?",opts:["No, because part payment of a debt by a third party is good consideration for the promise to forego the balance.","Yes, because there is no intention to create legal relations because the relationship between the woman and her husband is a domestic and social one.","Yes, because there is no additional consideration for the friend's promise to accept part payment.","No, because she agreed to the lesser sum in full and final settlement of the debt and therefore cannot go back on this promise.","Yes, because a third party cannot get involved in a contract due to the rules of privity of contract."],ans:"A",expl:"(A) As a general rule, a promise to accept part payment of a debt will not preclude the promisor from subsequently claiming the balance. This is because there is no consideration flowing from the promisee as regards this separate contract. However (A) is correct, because there are a number of exceptions to this general rule, and payment by a third party, if agreed to by the promisor, is one of them. (B) is incorrect because the contractual relationships here are between the woman and her friend, and the friend and the husband. (C) is incorrect for the reasons already discussed: payment by a third party is sufficient to constitute valid consideration for the friend's promise to forego the balance. (D) is incorrect because the reason she is not entitled to the money is that the part payment was made by a third party, not because she accepted it in full and final settlement. If payment had not been made by a third party, the general rule would apply and the friend would have been entitled to sue for the balance. (E) is incorrect because privity of contract is not relevant here. Privity of contract concerns the ability of third parties to acquire rights under a contract, but there is no question here of the husband acquiring rights.",note:"On the answer screen the explanation text is captured out of order by the scan; it has been reassembled here in reading order from the page image."},{n:86,id:"DIS036",scenario:"A customer obtains judgment against a self-employed painter and decorator and obtains a warrant of control to enforce the judgment. The painter/decorator has the following items of value at his property: a TV he has bought on hire purchase, a computer he uses for gaming, a table he uses for wall papering, a mountain bike, an expensive suit, and a bed with a special orthopaedic mattress.",q:"Which of the following items may be seized to satisfy the debt to the customer?",opts:["The TV, computer, and mountain bike.","The computer, the mountain bike, and the suit.","The computer, the table, and the bed.","The computer, the table, and the suit.","The TV, the suit, and the mountain bike."],ans:"B",expl:"(B) The computer, mountain bike, and expensive suit may be seized. Under a warrant of control, goods owned by a judgment debtor may be seized to satisfy the judgment; however, equipment used in the debtor's trade or household items necessary for basic domestic needs cannot be seized. Thus, the table is exempt because it is an item of equipment necessary for the painter to do his job. The bed is also exempt because it is required for satisfying basic domestic needs. The TV is also exempt because it has been bought on hire purchase, and the painter, therefore, is not the owner. (B) is the only answer choice that does not include one of these three items. Note that whilst basic items of clothing would fall within the exemption for basic domestic needs, an expensive suit falls outside of the scope of this category."},{n:87,id:"CTR103",scenario:"A bartender, who was also an aspiring musician, admired a violin that a street performer played on the street outside his pub for several weeks. Based on the violin's appearance and the quality of the sound that it produced, both the street performer and the bartender genuinely believed that it was an old Italian violin, but the matter was never discussed between them. Eventually, the performer agreed to sell the violin to the bartender for a large sum of money. After receiving the violin, the bartender took the violin to be appraised and discovered that it was actually a modern reproduction worth considerably less than he had paid for it.",q:"Is the bartender entitled to claim that the contract is void?",opts:["Yes, because the parties have made a mistake and are at cross-purposes and so there is no true agreement, as required by contract law.","Yes, because the violin is not in fact an old Italian violin, therefore there has been a misrepresentation which would entitle the bartender to rescind the contract.","Yes, because the contract is voidable in equity.","No, because this is a mistake as to the subject matter of the contract. Such contracts cannot normally be set aside.","No, because a mistake only renders a contract voidable, not automatically void."],ans:"D",expl:"(D) The circumstances in which a court will find a contract void due to a common mistake as to the quality of the subject matter (as opposed to its existence) are very limited. A contract for the sale of an old master which subsequently turns out to be a modern copy is mentioned by the courts as an example of a mistake that would not render the contract void. Similarly, if a violin turns out to be a modern replica rather than an old Italian violin, this is a mistake as to the quality of the subject matter that would not render the contract void. (A) is incorrect. The parties are not at cross-purposes: both the bartender and the street performer thought the violin was an old Italian violin. Their mistake was common to both of them. (If they had been at cross-purposes, this would have been a case of mutual mistake, where the parties are both mistaken, but about different things.) (B) is incorrect because the scenario does not indicate that the street performer used the age or origin of the violin to induce the bartender to enter into the contract. (C) is incorrect as there is no basis for making a contract voidable for mistake in equity. (E) is incorrect because mistake renders a contract void, not voidable."},{n:88,id:"DIS175",scenario:"The owner of an office building brings a professional negligence claim against the building's architect. The court allocates the case to the multi-track. The defendant denies liability but makes a Part 36 settlement offer of £25,000, inclusive of interest. The claimant rejects the offer, and the case continues to trial. After hearing all the evidence, the judge awards £20,000, inclusive of interest and taking into account contributory negligence on the part of the claimant. The parties make no submissions as to costs.",q:"What order for costs is the court likely to make?",opts:["None, because costs usually are not recoverable in a case within the multi-track.","The judge will order the architect to pay the claimant's costs of the action in full on the standard basis, since the architect lost the case.","The judge will order the claimant to pay the architect's costs in full on the indemnity basis, since the claimant recovered less than the rejected offer.","None, because qualified, one-way cost shifting applies to this case.","The judge will order the architect to pay the claimant's costs up to date when the relevant period for acceptance of the Part 36 offer expired and will order the claimant to pay the architect's costs thereafter."],ans:"E",expl:"(E) The judge will order the architect to pay the claimant's costs (on the standard basis) up to the date when the relevant period for acceptance of the Part 36 offer expired, and will order the claimant to pay the architect's costs thereafter. If a claimant rejects a defendant's Part 36 offer and fails to beat it (that is, the claimant secures a less advantageous result at trial than was made in the offer), the court will, unless it considers it unjust to do so, award the claimant their costs up to the expiration of the relevant period for accepting the Part 36 and award the defendant their costs on the standard basis from the date when the relevant period for acceptance expired. (A) is incorrect because it states the position for cases in the small claims track; the claim here is in the multi-track. Therefore, (B) and (C) are incorrect as neither party will be awarded their full costs. (D) is incorrect because one-way cost shifting applies only in personal injury cases."},{n:89,id:"DIS233",scenario:"At trial, a witness called on behalf of the claimant gives evidence that contradicts evidence previously given in their signed witness statement. This evidence seriously undermines the claimant's case.",q:"How should trial counsel for the claimant proceed?",opts:["Ask the judge to disregard the witness's evidence because it is contrary to the witness statement.","Request an adjournment so that they can remind the witness of their witness statement.","Ask the judge to declare the witness a 'hostile' witness so that counsel can cross-examine the witness to prove they made an inconsistent statement in the past.","Attempt to impugn or attack the credibility of the witness.","Ask the witness why they are obviously lying."],ans:"C",expl:"(C) The best option is for the court to declare the witness a 'hostile' witness. If the judge is happy to do so, this will enable the barrister to cross-examine the witness on the facts of the case. (A) is incorrect because the judge will not disregard what the witness has said. The best that the trial counsel can hope for is that the court declares the witness hostile. (B) is incorrect because the court is unlikely to agree to a request for an adjournment in these circumstances. (D) and (E) are incorrect because counsel who calls a witness is not free to attack the witness's credibility unless and until declared a hostile witness by the judge."},{n:90,id:"BSL156",scenario:"Three friends set up a partnership 10 years ago. On 1 April, one partner retires and is replaced by a new partner. The partnership notified existing creditors of the change on 31 March, and a notice was published in the London Gazette on 6 April. The partnership entered into two contracts to buy goods on 2 April, one with an existing supplier and one with a new supplier.",q:"Which of the following best describes the liability of the new partner and the retiring partner?",opts:["The new partner will be liable for the debt to the existing supplier only and the retiring partner will be liable to the existing supplier only.","The new partner will be liable for both debts and the retiring partner will not be liable for either debt.","The new partner will be liable for both debts and the retiring partner will be liable for both debts.","The new partner will be liable for both debts and the retiring partner will be liable for the debt to the new supplier.","The new partner will be liable for the debt to the existing supplier only and the retiring partner will be liable to the new supplier only."],ans:"D",expl:"(D) The new partner will be liable for both debts and the retiring partner will be liable for the debt to the new supplier. A partner is liable for all debts incurred whilst they were a partner. Here, the new partner came into the partnership on 1 April and both debts were incurred on 2 April. Therefore, the new partner is liable for both debts. A retiring partner is liable for debts incurred by the partnership after they retire until the correct notice is given: existing suppliers are entitled to actual notice of retirement, whereas a notice in the London Gazette is sufficient notice for anyone who has never dealt with the partnership whilst the retiring partner was a partner. Here, a notice was published in the London Gazette on 6 April, and the contract with the new supplier was made before that - on 2 April. So, the retiring partner is liable on that debt. On the other hand, the contract with the existing supplier was made the same day (2 April) and that supplier was given notice earlier, on 31 March. So, the retiring partner is not liable on that debt. It follows that the other choices are incorrect."}],Z1=[...Q1,...X1,...J1],ek="Simulated Exam Part 1 (FLK1) — Questions and Answers",dr=Z1,tk=["A","B","C","D","E"],nk={CNL:"Constitutional & Administrative Law",DIS:"Dispute Resolution",ELS:"Legal System of England & Wales",TRT:"Tort",TAX:"Taxation",LGS:"Legal Services",ETH:"Ethics & Professional Conduct",BSL:"Business Law",CTR:"Contract"},Rc=r=>r?nk[r.slice(0,3)]??"Other":"Not stated";function rk({item:r,showAll:i,selected:a,r
