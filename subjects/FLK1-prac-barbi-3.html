d against future total profits, including gains. Companies can use a trade loss against total profits in the same year, in the prior year (but only after a current year claim is made) or can carry forward to future total profits. Total profits include gains."},{n:36,id:"DIS165",scenario:"A woman was injured when the driver of the car next to her on a motorway crossed over into the woman's lane whilst texting. The woman suffered a broken hip, broken ribs, and a punctured lung. She will need extensive therapy and is unlikely to regain the ability to walk unaided. The driver was convicted of dangerous driving under section 2 of the Road Traffic Act 1988. The woman instructs a solicitor to issue proceedings against the driver.",q:"Which of the following best describes the information that needs to be included by the solicitor in the woman's Particulars of Claim?",opts:["A statement of the court's jurisdiction, details of the woman's injuries, details of the accident, and a schedule of past and future losses.","A statement of the applicable limitation period, details of the accident, a schedule of past and future losses, and a statement of truth.","Details of the accident, details of the driver's conviction, details of the claimant's injuries, and a statement of truth.","A statement of the court's jurisdiction, a statement of the applicable limitation period, details of the accident, and details of the claimant's injuries.","A statement of the applicable limitation period, details of the accident, a schedule of the claimant's injuries, and details of the driver's conviction."],ans:"C",expl:"(C) Details of the accident, details of the driver's conviction, details of the claimant's injuries, and a statement of truth would all be needed in the Particulars of Claim for a road traffic accident claim. The Practice Direction requires the Particulars to include enough information to allow the parties and the judge to identify the issues in the case early and to enable the judge to give directions to ensure that the trial can proceed promptly, fairly, and proportionately. This would include the information stated in (C). The Particulars of Claim must also include a statement of truth. In every road accident case, the Particulars must include details about the accident (such as the time, date, place of occurrence, and the alleged negligent acts), the claimant's injuries, and a schedule of past and future losses. If the defendant was convicted of a road traffic offence, details of the offence should be included as well; otherwise the defendant could object to introduction of the offence details at trial. On the other hand, there is no need to include a statement of the limitation period or a statement of the court's jurisdiction. If the defendant believes the court lacks jurisdiction or that the limitation period expired, these are defences that the defendant must raise. Since one of these two elements is in (A), (B), (D), and (E), none of them is the best choice."},{n:37,id:"DIS082",scenario:"A former client wishes to make a claim against their former solicitors for professional negligence in respect of the purchase of their house. The client's current solicitors send a letter of claim to the former solicitors pursuant to the Professional Negligence Pre-Action Protocol. The current solicitors advise the client that, as they have only an incomplete file (not having retained all of the correspondence relating to the purchase transaction), it would be beneficial to seek disclosure and inspection of the file from the former solicitors to facilitate settlement.",q:"Assuming the disclosure is within the scope of standard disclosure, which one of the following statements is correct?",opts:["It is not possible to obtain disclosure until there are proceedings.","It is not possible to obtain pre-action disclosure until there are proceedings unless the former solicitors are prepared to give disclosure voluntarily.","It is not possible to make an application for pre-action disclosure unless the client's solicitors prove the evidence will be lost without pre-action disclosure.","It is possible to make an application for pre-action disclosure if disclosure would fairly assist in disposing of the claim and save costs.","It is possible to obtain pre-action disclosure only against a non-party."],ans:"D",expl:"(D) If within the scope of standard disclosure and if disclosure would fairly assist in disposing of the claim and save costs, a party may make an application for pre-action disclosure. Therefore, (A) is incorrect. (B) is incorrect because pre-action disclosure is not limited to cases in which the party from whom disclosure is sought does so voluntarily. (C) is incorrect because, as explained above, the standard for disclosure is broader than the standard in (C) (that is, disclosure is not limited to cases where the party seeking disclosure proves the evidence will be lost otherwise, although that would certainly be one situation in which pre-action disclosure likely would be granted). (E) is incorrect, as an application for pre-action disclosure can be made against a likely party to the proceedings, although in practice, prior to making the application, the party will be asked to provide disclosure voluntarily."},{n:38,id:"CTR151",scenario:"An accountancy firm has a contract with a computer support company. The contract provides that the computer support company will provide support to the firm 24 hours a day, seven days a week at a cost of £2,000 per month. A month before the accountancy firm's busy tax season, it neglects to pay the computer support company. The company had been losing money on the contract and believed in good faith that the missed payment gave them the right to terminate the contract. When the computer support company contacted the accountancy firm to terminate the contract, the firm agreed to pay the company an additional £500 per month for the remainder of the contract term if the computer support company agreed to continue providing support. The computer support company agreed.",q:"Is a court likely to find the price modification enforceable?",opts:["No, the modification is void due to economic duress.","No, the modification is unenforceable for lack of consideration.","No, because the modification is voidable because of duress to the person.","Yes, because there was consideration for the variation.","Yes, because loss-making contracts are automatically void under the Supply of Goods and Services Act 1982."],ans:"D",expl:"(D) The court is likely to uphold the modification because it was supported by consideration. Parties to a contract can modify the contract if there is consideration to support the modification. Here, the computer support company believed in good faith that it had a right to terminate the contract based on the missed payment. If there is a genuine dispute as to rights under a contract, an agreement to give up the right to litigate the dispute constitutes sufficient consideration to support a modification such as a compensation term. Therefore, (B) is incorrect. (A) is incorrect because a contract is only voidable (rather than void) for economic duress and only if one party uses its stronger financial position in an illegitimate way. It is doubtful (even if this choice said voidable rather than void) that a court would find settlement of a good faith dispute to be 'illegitimate'. (C) is incorrect because duress against the person involves physical threats, and there were no such threats here. (E) is incorrect because there is no such rule."},{n:39,id:"TAX113",scenario:"Three partners (A, B, and C) are in a partnership together. They have prepared accounts for the year ended 31 March 2021 and generated a tax adjusted trade profit of £180,000. They have agreed to distribute only £100,000 of these profits. The partnership agreement specifies that Partner C shall receive a salary of £20,000 and that the balance should be allocated to A, B, and C in the profit share ratio of 5:3:2, respectively.",q:"What is Partner C's share of the partnership profits?",opts:["£36,000","£20,000","£56,000","£40,000","£52,000"],ans:"E",expl:"(E) £52,000. First, it should be noted that it does not matter that the partners have agreed to distribute only £100,000 of their £180,000 profit. For tax purposes, a partnership's entire annual profit must be allocated among the partners. Thus, the partners must allocate the entire £180,000 profit. Partner C receives a salary of £20,000 from the tax adjusted total profit, leaving £160,000 to be distributed. The remaining £160,000 is divided 5:3:2 among the three partners, so Partner C receives their £20,000 plus 2/10ths of £160,000 (£32,000)."},{n:40,id:"TRT068",scenario:"A man is employed to drive a lifting truck in his employer's warehouse. One day, the windscreen on the truck shattered suddenly. A piece of glass flew into the man's eye and injured him. The employer had purchased the truck from a reputable supplier and had carried out regular checks and maintenance. Expert tests have not revealed why the windscreen shattered and have not been able to identify any defect or lack of care in its design or manufacture.",q:"In an action by the employee against the employer to recover damages for his injury, which of the following best states the likely outcome?",opts:["The employer is likely to be liable to the employee because liability is imposed on the employer by statute where an employee is injured by defective work equipment provided by the employer.","The employer is not likely to be liable to the employee because the employee cannot prove that anyone was negligent in the design, manufacture, or use of the truck.","The employer is not likely to be liable to the employee because the employer fulfilled its duty of care to the employee by purchasing the truck from a reputable supplier and carrying out regular checks and maintenance.","The employer is likely to be liable to the employee because an employer has a strict duty to ensure the safety of employees during the course of their employment.","The employer is not likely to be liable to the employee because the employer is absolved from liability by statute where work equipment contained a latent defect which the employer could not have discovered with reasonable care."],ans:"B",expl:"(B) The employer is not likely to be liable. An employer owes its employees a duty to take reasonable care to provide them with safe work equipment. This duty is expanded by statute: The Employers' Liability (Defective Equipment) Act 1969 ('the 1969 Act') provides that where an employee suffers personal injury in the course of his employment caused by defect in equipment provided by his employer for the purposes of the employer's business, and the defect is attributable to the fault of a third party (whether identified or not), the injury shall be deemed to be also attributable to negligence on the part of the employer. On these facts, however, the employee cannot prove that the failure of the truck windscreen was caused by fault on the part of anyone. Because there is no fault to be attributed to the employer under the statute, the employer does not appear to be in breach of its duty and is not likely to be liable to the employee. (A) is not correct because it does not recognise that the statute (the 1969 Act) only attributes negligence to the employer where the claimant can show that the defect was caused by fault on the part of someone. (C) is not correct because it does not explain the correct reason why the employer is not likely to be liable, which is explained above. If the defect in the truck had been caused by negligence on the part of the manufacturer, the 1969 Act would attribute this to the employer, despite the employer having taken reasonable care in purchasing and maintaining the truck. (D) is not correct. The duty owed by the employer is to take reasonable care. It is not a strict duty to ensure safety. Even where the 1969 Act applies, liability depends on establishing some fault, which is then attributed to the employer. (E) is not correct. The correct application of the relevant statute is as discussed above."},{n:41,id:"CNL155",scenario:"The Circuses (Prohibition of Wild Animals) Act has been granted the Royal Assent. The legislation does not state when or how it is to come into force.",q:"Which of the following best explains when the Act will come into effect?",opts:["Three months after the Royal Assent.","Once the government have made a commencement order.","Immediately on being granted the Royal Assent.","When the House of Commons and the House of Lords have both voted in favour of the Act coming into effect.","Fourteen days after the Royal Assent."],ans:"C",expl:"(C) The Act will come into effect immediately on being granted the Royal Assent. If an Act of Parliament is silent on when or how it is to come into force (that is, it lacks a commencement provision), then it will immediately take effect on being granted the Royal Assent. There is no delay. Therefore, (A) and (E) are incorrect. (B) is incorrect because no power has been given to the government to make a commencement order. If the Act gave government the power to make a commencement order, then the Act would be effective as provided in the order. (D) is incorrect because the Act will come into force immediately on being granted the Royal Assent. There is no need for the House of Commons and House of Lords to do anything after the Royal Assent."},{n:42,id:"CTR082",scenario:"On 1 October, a fishing tackle supplier offered to sell a fishing rod to a keen angler for £250. As the rod wasn't quite what he was looking for, the angler emailed the fishing tackle supplier on 2 October to offer him £200 for it. On 7 October, the supplier offered to sell the rod to a third party for £240. This offer was accepted by the third party also on 7 October. On 5 October the angler changed his mind and wrote to the supplier accepting the offer to buy the rod for £250. The supplier received the letter of acceptance on 8 October.",q:"Was a contract concluded and, if so, between which parties?",opts:["No contract has been created.","There is a contract between the supplier and the third party created on 7 October.","There is a contract between the supplier and the angler created on 2 October.","There is a contract between the supplier and the angler created on 5 October.","There is a contract between the supplier and the angler created on 8 October."],ans:"B",expl:"(B) There is no contract between the angler and the supplier, as the angler's counteroffer of £200 on 2 October terminated the original offer of £250, meaning the original offer was no longer capable of acceptance. As there is no indication that the supplier accepted the counteroffer, he was therefore legally entitled to offer to sell the rod to the third party, and the third party accepted this offer, thus creating a valid contract on 7 October. Therefore (B) is the correct answer. (A) is incorrect because a contract was validly created between the supplier and the third party. (C) is incorrect because there is no indication that the supplier accepted the counteroffer, and without a valid acceptance, no contract is formed. (D) is incorrect because, even though the postal rule would ordinarily operate to make acceptance valid on this date, the angler's counteroffer had terminated the supplier's original offer so that the angler could not validly accept the original offer. (E) is incorrect because there is no offer capable of acceptance. If there had been an offer, (E) will still be incorrect, as under the postal rule acceptance would have taken place when the acceptance was posted on 5 October."},{n:43,id:"DIS156",scenario:'A claim form marked "Particulars of Claim to follow" is issued on 14 October. The claim form is deemed served on 5 December. The Particulars of Claim was then served on 18 December.',q:"Was the Particulars of Claim served within the prescribed timescale?",opts:["Yes, as a claimant must serve the Particulars of Claim within four months of service of the issuance of proceedings.","No, as a claimant must serve the Particulars of Claim along with the claim form.","Yes, as a claimant must serve the Particulars of Claim within 28 days of service of the claim form.","No, as the claimant must serve the Particulars of Claim within two months of the issuance of proceedings.","Yes, as a claimant must serve the Particulars of Claim within 14 days of service of the claim form."],ans:"E",expl:"(E) Following service of the claim form, a claimant has 14 days to serve the Particulars of Claim. However, in any case, service must take place within four months of the issuance of proceedings. Here, the claim form was served on 5 December and the Particulars of Claim was served on 18 December, which is within the 14-day prescribed period. Additionally, the proceedings were issued on 14 October, and 18 December is well within the four-month outer limit. (A) is a true statement, but the limiting factor under the facts here would be the date of the service of the claim form, as the end of the 14-day period comes long before the end of the four-month period under our facts. (B) is incorrect. Whilst the Particulars of Claim may be included with the claim form, as explained above, the Particulars may be served later. (C) and (D) are incorrect as they do not state valid timescales."},{n:44,id:"BSL201",scenario:"A company has seven unrelated shareholders. Three of the shareholders are directors. The directors propose to sell some land owned by the company to one of the shareholders who is not a director. The land has been independently valued at £150,000, and it is agreed that this will be the sale price. The company has adopted the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association.",q:"Is a vote of the shareholders required to approve the sale?",opts:["No, because the transaction falls under the directors' general authority to manage the business.","Yes, the shareholders must pass an ordinary resolution to approve the transaction and the shareholder who is buying the land will be allowed to vote on the matter.","Yes, the shareholders must pass an ordinary resolution to approve the transaction and the shareholder buying the land will not be allowed to vote on the matter.","Yes, the shareholders must pass a special resolution to approve the transaction and the shareholder buying the land will be allowed to vote on the matter.","Yes, the shareholders must pass a special resolution to approve the transaction and the shareholder buying the land will not be allowed to vote on the matter."],ans:"A",expl:"(A) A vote of the shareholders will not be needed because the sale falls under the directors' general authority to manage the business. Directors have the power to sell a company's land to anyone, including a shareholder. A vote of the shareholders is required only if the sale is a substantial property transaction ('SPT'). A purchase or sale of property is an SPT if the company is buying from or selling to a director or someone closely connected to a director. The special procedure does not apply when, as here the purchase or sale involves a shareholder who is not a director. It follows that the other choices are incorrect as all of the other choices provide that approval from the shareholders is required. It should be noted that if the buyer were a director, the correct answer would be (B) - the transaction would have to be approved by the shareholders by ordinary resolution and the shareholder would be allowed to vote because any shareholder can vote at a general meeting."},{n:45,id:"CTR068",scenario:"A woman contracts with a construction company to have a billiards room constructed in her house at a cost of £100,000. The contract states that the billiards room must accommodate a full size snooker table, with a space of two metres around the edge of the table. The billiards room is constructed, and the woman discovers that there is space of only 1.2 metres around a full size snooker table. This is still enough to allow snooker to be played. The billiards room as built is worth £10,000 less than it would have been if it had been the specified size. The cost of rebuilding the room to the specified size would be £140,000.",q:"What remedy would be available to the woman?",opts:["The cost of rebuilding the billiards room outweighs the benefit that the woman would receive, therefore she would not have any remedy.","The woman is entitled to have the billiards room rebuilt to the specification required by her contract.","The woman would be entitled to damages for the difference in value between the billiards room as built, and what she had actually contracted for.","The woman would be entitled to nominal damages only.","The woman would be entitled only to damages for loss of amenity."],ans:"C",expl:"(C) Damages for breach of contract are designed to compensate the innocent party for their loss. Damages are usually calculated on an expectation interest basis to put the innocent party back into the position they would have been in had the contract been properly performed. In the case of construction contracts, there are two different measures of damages: (1) how much it would cost to cure a defect, and (2) the difference in value between what was contracted for and what the innocent party actually received. In the scenario, the cost of curing the defect is disproportionate to the benefit that would be gained, as the woman can still play snooker as required. However, in cases such as these, the courts have recognised the loss in the value of what was contracted for, or have awarded damages for loss of amenity. In many cases there will be no difference in value between what was contracted and what was actually built. However, where there is a difference, this will be awarded as damages. Therefore (C) is the right answer. (A) is incorrect because whilst the woman is unlikely to have a claim for the cost of cure, in cases like this the courts may award damages for any difference in value and/or for loss of amenity. (B) is incorrect because the cost of rebuilding the billiards room to the original specification outweighs the benefit that the woman would receive from doing so. She can still play snooker in the room as constructed. (D) is incorrect as nominal damages are usually awarded only when there has been no actual loss to the innocent party. (E) is incorrect because, on these facts, there is a clear difference between the value of the snooker room as built and as specified. If there had been no clear difference, then the woman might have recovered only damages for loss of amenity."},{n:46,id:"CNL012",scenario:"Concerned about national security, Parliament has passed the Anti-Encryption Act 2021, which makes it illegal to communicate through any messaging system which is encrypted end-to-end, meaning that the police and other agencies cannot access those messages. The 2021 Act also makes it a civil offence to have sent a message through such a system at any time, including before the enactment of the 2021 Act. A campaign group concerned about freedom of expression on the internet wishes to challenge the validity of the 2021 Act.",q:"Which of the following best explains how the courts are likely to respond to the challenge to the validity of the 2021 Act?",opts:["The 2021 Act is valid, even though it is contrary to the rule of law because it has retrospective effect.","The 2021 Act is invalid because it breaches the rule of law.","The 2021 Act is valid and has no constitutional implications.","The 2021 Act is invalid because it gives too much power to the government to regulate how people can communicate with each other.","The 2021 Act is invalid because Parliament cannot oversee how the government exercises the powers provided by the legislation."],ans:"A",expl:"(A) It is likely that the courts will find the law valid even though it has retrospective effect and, therefore, violates principles of the rule of law. This is because under the doctrine of parliamentary sovereignty, Parliament can legislate contrary to the rule of law. (B) is incorrect because, as indicated, parliamentary supremacy means that Parliament can make a law contrary to the rule of law. (C) is incorrect because it is too broad. The UK constitution includes the rule of law (so there are constitutional implications), but because of parliamentary sovereignty, the constitution is not the supreme law. (D) and (E) are incorrect because Parliament is not limited in its lawmaking powers - it can give government the power to regulate communications."},{n:47,id:"CTR111",scenario:"A company sells a consignment of sand to a glass manufacturer for use in the manufacturer's business. The sand is contaminated and so it is not of satisfactory quality. The glass manufacturer cannot use it. There are no express terms in the contract relevant to this question.",q:"What remedies may be available to the glass manufacturer?",opts:["Only damages.","Only termination of the contract and rejection of the goods.","Termination of the contract and rejection of the goods, and/or damages.","Only specific performance.","Only an injunction."],ans:"C",expl:"(C) The seller is in breach of the term implied in the Sale of Goods Act 1979 that the goods sold must be of satisfactory quality. This term is a condition, so the innocent party's remedies are to terminate the contract and reject the goods, and/or sue for damages. (A) is incorrect because, as well as suing for damages, the buyer has the option to terminate and reject the goods. (B) is incorrect because the buyer has the option to sue for damages instead of, or as well as, terminating the contract and rejecting the goods. (D) is incorrect because specific performance is a remedy to compel performance, not to remedy the situation where performance has been attempted but was defective. (E) is incorrect because an injunction is an order restraining a breach of contract, and here the breach has already taken place."},{n:48,id:"ETH027",scenario:"A solicitor is representing a client in civil court. The solicitor had anticipated that the other side would rely on a particular statutory provision, but the opposing solicitor fails to mention it. The solicitor realises that the statutory provision would greatly harm her client's chances of success.",q:"Which of the following statements best describes how the solicitor should proceed?",opts:["The solicitor should mention the statutory provision to the court in her argument but do her best to distinguish it from her client's case.","The solicitor should report the opposing solicitor to the proper regulatory authority.","The solicitor should immediately cease to act.","The solicitor should not mention the statutory provision to the court in her argument.","The solicitor should explain the situation to the client and act in accordance with the client's instructions."],ans:"A",expl:"(A) A solicitor should draw the court's attention to relevant cases and statutory provisions, and any material procedural irregularity of which they are aware, and which are likely to have a material effect on the outcome of the proceedings. This is true even where the opponent fails to disclose it. (B) is incorrect because the solicitor's own responsibilities in this case are at issue. (C) is incorrect because ceasing to act would not address the solicitor's duty to not mislead the court; the solicitor should disclose the statutory provision. (D) is incorrect. It is true that avoiding the statutory provision would be in the client's best interests, but the solicitor has a duty to not mislead the court and that duty controls in this situation. (E) is incorrect because the client's wishes do not override the solicitor's duties to the court."},{n:49,id:"ELS017",scenario:"A UK court is called upon to interpret whether a computer-based program provided medical services that amount to practicing medicine without proper registration in violation of the Medical Act 1983.",q:"In interpreting the Act, which of the following is not a rule of statutory interpretation that the court might use?",opts:["The mischief rule.","The literal rule.","The intrinsic rule.","The golden rule.","The purposive approach."],ans:"C",expl:"(C) The other rules exist as rules of statutory interpretation. A court applying the mischief rule (A) determines what mischief the statute in question was set out to remedy and interprets the statute in a way that would best achieve that result. Under the literal rule (B), when interpreting statutes, courts will give words their ordinary meaning. Occasionally, applying ordinary meanings to words under the literal rule can lead to absurd results. When that happens, under the golden rule (D), courts may use something other than a word's ordinary meaning to avoid the absurd result. Under the purposive approach (E), a court uses extraneous material from the pre-enactment phase of legislation to try to discern the meaning of the words used in the statute."},{n:50,id:"TRT081",scenario:"A bus driver was driving along a road when a child suddenly ran into the road in front of the bus. The driver swerved to avoid the child and collided with a motorbike. The motorbike rider was badly injured. He survived for several weeks and endured great pain and suffering. Then he died, leaving a wife and children who were financially dependent on him. The child who ran into the road cannot be found. Accident investigation reports show that the bus driver was driving carefully and within the speed limit and could not have avoided the collision.",q:"If an action in tort is brought against the bus driver in respect of the accident which killed the motorbike rider, which of the following best states the likely outcome?",opts:["There will not be a successful claim for the motorbike rider's estate because the bus driver was not in breach of his duty of care to the motorbike rider, but the motorbike rider's dependants will have a successful claim for their loss of dependency.","There will not be any successful claim for either the motorbike rider's estate or his dependants because the bus driver was not in breach of his duty of care to the motorbike rider.","There will not be a successful claim because, since the motorbike rider has now died, there can be no claims for his pain and suffering or for any financial losses in the period after death.","There will be a successful claim by the motorbike rider's dependants to recover damages for both his pain and suffering and their own financial loss, because they have a separate claim arising on his death.","There will be successful claims for both the motorbike rider's estate and for his dependants because the bus driver caused the rider's pain and suffering before death and the dependants' loss of financial dependency after death."],ans:"B",expl:"(B) There will not be any successful claim. Any claim would be based on negligence and would depend on establishing duty of care, breach of duty, and causation of damage. The evidence shows that the bus driver did not fall below a reasonable standard of care and so was not in breach of duty. Therefore, the motorbike rider would not have had a successful claim, and there is no claim to survive his death for the benefit of his estate. Neither is there a claim for the benefit of his dependants because such a claim depends on the deceased having a valid claim had he not died. (A) is not correct. As the motorbike rider could not have a successful claim himself, there could be no claim for loss of dependency because such claim depends on the deceased having a valid claim had he not died. (C) is not correct because it does not give the correct reason for the inability to make a successful claim, which is stated above. (D) is not correct. Any claim by the motorbike rider's dependants depends on the deceased himself having a valid claim, which is not satisfied here. (Also, had this been satisfied, a claim by the dependants could not recover damages for the motorbike rider's pain and suffering. This would need to be the subject of a separate claim for the motorbike rider's estate.) (E) is not correct. It is not sufficient that the bus driver caused the loss and damage suffered. He must also have been in breach of the duty of care which he owed to the motorbike rider, as discussed above."},{n:51,id:"CTR136",scenario:"A car enthusiast is looking for engine oil suitable for their 1958 Jaguar. They find a supplier advertising specialist oil for vintage cars. They telephone the supplier to check that the oil is suitable for the Jaguar and the supplier says that it is. They complete the supplier's order form and send it to the supplier with payment. The supplier then delivers the oil. It turns out the oil is not suitable for the Jaguar. The supplier's order form contained an exclusion clause which says 'The statutory implied condition of satisfactory quality is hereby expressly excluded'. The car enthusiast nevertheless claims the supplier breached their contract.",q:"Can the supplier rely on the exclusion clause?",opts:["No, because the clause is void under the Unfair Contract Terms Act 1977.","No, because the clause does not cover the breach.","No, because the supplier never accepted the offer contained in the order form signed by the enthusiast.","Yes, because the enthusiast became aware of the exclusion clause before placing their order.","Yes, because the breach goes to the quality of the oil."],ans:"B",expl:"(B) The enthusiast's claim will be for breach of the implied statutory condition of fitness for purpose. The condition applies in this case because the enthusiast has made their purpose known expressly to the supplier. The exclusion clause covers only satisfactory quality, so it does not cover the breach that has arisen. (A) is incorrect because this seems to be a consumer contract, so it is subject to the Consumer Rights Act 2015 ('CRA'), rather than the Unfair Contract Terms Act 1977 ('UCTA'). (If the UCTA had applied, then the clause would have been subject to the reasonableness test, not void; under the CRA it is void.) (C) is not correct because the supplier did accept the offer contained in the order form. A contract for goods may be accepted by delivering the goods, which is what the supplier did. Therefore, the terms of the order form were terms of the contract. (D) is incorrect for the reasons stated above: whilst the exclusion clause was part of the contract, it governed breaches of quality and the breach here was of fitness for purpose. (E) is incorrect factually; the breach does not go to the quality of the oil, but rather to its fitness for the purposes stated by the enthusiast.",note:"On the answer screen the explanation text is laid out across columns that the scan captures out of order; it has been reassembled here in reading order from the page image."},{n:52,id:"CNL105",scenario:"During a meeting of Cabinet, the Prime Minister introduces a proposal for a significant new road building programme. The Secretary of State strongly disagrees with the proposal, but it is later adopted as government policy.",q:"Which of the following options available to the Secretary of State is the most constitutionally appropriate?",opts:["The Secretary of State must either support the proposal or resign from the government.","The Secretary of State can explain their concerns about the proposal in a television interview.","The Secretary of State can express their concerns about the proposal in a statement to the House of Commons.","The Secretary of State can request that the Monarch intervene and advise the Prime Minister that the proposal should not be pursued any further.","The Secretary of State can express their concerns about the proposal in a statement to the House of Lords."],ans:"A",expl:"(A) Under the doctrine of collective responsibility, the Secretary of State must support the proposal or resign from the government. Under the doctrine of collective responsibility, when the government is developing policy, ministers are free to express their concerns in private. However, once government policy has been decided, ministers must defend and support the policy in public and before Parliament, even if they disagree with the policy. If a minister finds that they cannot support the policy, then they must resign from the government. (B), (C), and (E) are incorrect because, due to collective responsibility, it would not be appropriate for the Secretary to express their concerns to Parliament or the media. (D) is incorrect because the Monarch does not get actively involved in political matters in this manner."},{n:53,id:"BSL228",scenario:"A company is planning to change its registered office from its trading address to the office of its accountant. It needs to change its website and notepaper to reflect the change.",q:"When will the change of registered office be effective?",opts:["14 days after the board resolution to change the registered office.","When the Change of Registered Office Address form is registered by the Registrar of Companies.","14 days after the Change of Registered Office Address form is filed at Companies House.","Immediately when the board resolve to change the registered office.","At the end of the board meeting at which the board resolve to change the registered office."],ans:"B",expl:"(B) A company may change its registered office by giving notice to the Registrar of Companies. The change takes effect on registration of the notice by the Registrar. (A), (D), and (E) are incorrect as the change is not effective until it is registered at Companies House. (C) is incorrect as the change takes effect on registration of the notice by the Registrar, although there is a 14-day period after registration when a document will be validly served if sent to the previous registered office."},{n:54,id:"TRT037",scenario:"A car owner lent his car to his girlfriend so she could collect a pizza. The girlfriend drove to the pizzeria and properly parked in the adjoining carpark. Instead of going to the pizzeria, however, she first went into a nearby bookstore to purchase a book. The girlfriend then went to the pizzeria and picked up the pizza, which had been ready for 10 minutes. Just as the girlfriend left to return to the car, another car struck the owner's parked car, causing extensive damage. The owner did not carry insurance, and the car required £800 worth of bodywork.",q:"Which of the following states the most likely result in a claim in negligence by the owner against his girlfriend?",opts:["The owner is likely to bring a successful claim because the girlfriend exceeded her authority when she went to the bookstore.","The owner is unlikely to succeed in a claim against his girlfriend, because she did not create a foreseeable risk of damage to the owner's car.","The owner is likely to bring a successful claim because, but for the girlfriend's delay in getting the pizza, the owner's car would not have been damaged.","The owner is unlikely to succeed in a claim against his girlfriend because she did not damage the car, it was damaged by another.","The owner is likely to bring a successful claim because the girlfriend breached her duty of care to the owner by leaving the car in the carpark while she went to the bookstore."],ans:"B",expl:"(B) The girlfriend is not liable for the damage to the car because a reasonable person would not have foreseen damage arising from her delay in collecting the pizza. Where there is no established duty of care, the claimant is in a novel duty situation, and a duty of care will only be owed by the girlfriend to the car owner if: (1) the car owner was a foreseeable victim; (2) there is a relationship of sufficient proximity between the car owner and the girlfriend; and (3) the court would consider it fair, just, and reasonable to impose a duty of care. Assuming that the girlfriend did owe a duty of care to her boyfriend, he must then show that she was in breach of duty. She is in breach if she fell below a reasonable standard of care. She is not likely to be in breach of duty by failing to take precautions against events that cannot reasonably be foreseen. Here, it is true that, had the girlfriend collected the pizza immediately, the owner's car would not have been at the location it was at the time it was struck. However, a mere delay in picking up a pizza whilst leaving a car properly parked does not create a foreseeable risk of damage to the car. Thus, there is no basis for holding the girlfriend liable in negligence. (A) is incorrect because the mere fact that the girlfriend stopped at the bookstore, when the owner loaned her the car specifically to pick up the pizza, will not mean that the girlfriend acted in a manner that created an unreasonable risk of damage to the car. The concept of 'exceeding one's authority' might be relevant in the context of an employer trying to avoid vicarious liability for the tortious conduct of an employee by arguing that the employee acted outside the scope of her employment. However, in the context of this question, the girlfriend's having stopped at the bookstore will not subject her to liability. (C) is incorrect because the fact that the owner's car would not have been damaged if the girlfriend had not delayed in getting the pizza is not enough to establish liability for negligence. The fact that the damage to the owner's car was unforeseeable will preclude a finding that the girlfriend acted negligently by delaying in getting the pizza. (D) is incorrect because, if the girlfriend had acted negligently (by not parking the car properly, for example), her negligence could have been a cause of the damage, for which she could remain liable unless the negligent act of the driver who struck the car broke the chain of causation. (E) is incorrect because a mere delay in picking up a pizza whilst leaving a car properly parked does not constitute a breach of duty, as it is not behaviour that created any particular foreseeable risk to the owner's car."},{n:55,id:"CTR040",scenario:"A car dealer advertises a car for sale in the newspaper. The advert states 'beautifully maintained Aston Martin DB9 previously owned by James Bond actor Daniel Craig - £100,000 or near offer'. A James Bond enthusiast sees the advert and offers the car dealer £95,000 which the car dealer accepts, telling him it had always been his dream to drive a car owned by 007. On delivery of the car, the enthusiast notices in the registration document that there have been no previous owners by the name of Daniel Craig.",q:"Can the enthusiast bring the contract to an end?",opts:["No. The enthusiast should have made his own enquiries prior to the sale and he is therefore bound by its terms.","No. The term regarding previous ownership is incidental to the main purpose (the sale of a car) and is therefore a breach of a warranty which would only entitle the enthusiast to damages.","Yes. The term regarding previous ownership goes to the root of the contract and is therefore a breach of a condition which would entitle the enthusiast to repudiate the contract.","Yes. This was a misrepresentation by the car dealer which would make the contract void.","No. The statement was 'mere puff', or advertisers' speak, and not intended to be taken seriously and relied upon."],ans:"C",expl:"(C) The fact that the car was owned by Daniel Craig is the reason the James Bond enthusiast purchased it. It is therefore so fundamental that it goes to the root of the contract, and so would be classified as a condition. Breach of a condition entitles the innocent party to terminate the contract. (A) is incorrect because the enthusiast has no special knowledge that would have enabled him to verify the statement without having seen the logbook in advance. (B) is incorrect because for the James Bond enthusiast, the fact that the car was previously owned by Daniel Craig is the reason he purchased it, and therefore a breach of this term is more than incidental to the performance of the rest of the contract; it goes to the root of it. (D) is incorrect because the advert goes beyond a misrepresentation, particularly to the James Bond enthusiast. The enthusiast would not be purchasing the car were it not for the fact that it was owned by Daniel Craig, therefore the statement is a term of the contract. (E) is incorrect as the statement made by the car dealer goes beyond 'mere puff', particularly as the dealer has full knowledge of the reason the enthusiast wants to buy the car and would have relied upon the statement in coming to the decision to buy the car."},{n:56,id:"DIS067",scenario:"A contractor issued proceedings against a customer for breach of contract in the County Court. The case is heard before a Circuit Judge. The case is tried, and the contractor is not successful in its claim. The contractor believes the court did not correctly apply the law.",q:"If the contractor appeals the case, to which court(s) may the contractor seek permission to appeal?",opts:["The County Court which heard the case and the High Court only.","The High Court and the Court of Appeal only.","The County Court which heard the case only.","The Court of Appeal only.","The High Court only."],ans:"A",expl:"(A) A party wishing to appeal must make an application to appeal in either the court where the decision was made or the court in which the appeal would be heard. Here, the case was heard by a Circuit Judge in County Court. Cases heard by Circuit Judges are appealed to the High Court. Therefore, the County Court which heard the case and the High Court may grant permission for the appeal here. (B) and (D) are incorrect because the Court of Appeal hears appeals (and can grant permission for an appeal) only from a decision of the High Court. (C) and (E) are incorrect because they each fail to mention the second possibility."},{n:57,id:"ETH012",scenario:`A solicitor drinks too much at a nightclub and becomes belligerent. After the solicitor punches a hole in a wall, the nightclub owner tells the solicitor that he will have to pay for the damage. The solicitor says, "Don't you know who I am?", and truthfully states that he is a senior partner at a global firm, knows many powerful people in the legal community, and is prepared to pursue various legal claims against the nightclub if the owner pursues the matter further. The owner allows the solicitor to leave. A witness to the incident complains to the SRA.`,q:"Which of the following statements best describes whether the complaint will succeed?",opts:["The complaint will likely not succeed as the events took place in the solicitor's own time.","The complaint will likely succeed because the solicitor embarrassed the firm.","The complaint will likely succeed because the solicitor took unfair advantage of the manager.","The complaint will succeed only if the solicitor is convicted of a criminal offence.","The complaint will likely not succeed as the solicitor did not make any false statements."],ans:"C",expl:"(C) A solicitor should not take unfair advantage of third parties in the solicitor's professional or personal capacity. As such, a solicitor should not use his professional status or qualification to take unfair advantage of another person in order to advance the solicitor's personal interests. Here the solicitor used his position to intimidate the manager and was clearly in breach of the Code. (A) is incorrect because the fact that the solicitor was acting in a personal capacity is irrelevant; the requirement extends to the solicitor's private life. (B) is incorrect. It may be true that the solicitor's conduct embarrassed the firm, but the complaint will succeed because the solicitor unfairly took advantage of a third party. (D) is incorrect. A solicitor can violate the Code of Conduct without being convicted of a criminal offence. The latter would probably lead to disciplinary proceedings against the solicitor and the possibility that he is struck of the roll. (E) is incorrect because taking unfair advantage does not require making false statements."},{n:58,id:"TRT061",scenario:"A traffic accident occurred when two cars collided at a junction between a main road and a side road. Driver A was driving along the main road when driver B pulled out of the side road into the side of driver A's car. Neither driver was physically injured but driver A's car was damaged. Driver A was exceeding the speed limit at the time of the accident and was later convicted of a road traffic offence. However, the evidence showed that driver A would have been unable to avoid the collision even if she had been driving within the speed limit, and the damage to her car would have been the same.",q:"In an action by driver A against driver B to recover the money she paid for repairs to her car, which of the following best describes the likely outcome?",opts:["Driver A will not have a successful claim because her own carelessness provides driver B with a complete defence to the claim.","Driver A is likely to have a successful claim, but her damages are likely to be reduced because of her contributory negligence.","Driver A is likely to have a successful claim, but her damages are likely to be reduced because of her illegal activity in exceeding the speed limit.","Driver A is likely to have a successful claim and can recover the full cost of repairs to her car.","Driver A will not have a successful claim because she was exceeding the speed limit at the time of the collision, and so the defence of illegality will apply."],ans:"D",expl:"(D) Driver A will prevail. Driver B owes a duty of care to driver A and has breached that duty, causing A's damage. No relevant defences apply, as discussed below. (A) is not correct. Driver A's carelessness does not provide driver B with a complete defence to the claim. In some circumstances the claimant's carelessness gives rise to the partial defence of contributory negligence, but that defence does not apply on these facts. Although driver A did fail to take reasonable care for her own safety, the facts show that this did not contribute to the harm she suffered, because the damage to her car would have been the same even had she been driving within the speed limit. So, (B) is not correct because driver A's damages will not be reduced. (C) is not correct. The defence of illegality applies where the claimant seeks to rely on her criminal activity as the basis for her claim. It is a complete defense, so if it were applicable it would bar driver A's damages rather than reduce them. (E) is not correct. The defence of illegality will not apply where the claimant's criminal activity is just part of the background circumstances. On these facts, driver A's offence of exceeding the speed limit does not form the basis of her claim."},{n:59,id:"CTR042",scenario:"A student is induced to enter into a contract to buy a television from a retailer for £1,000. After the television has been delivered, the student wins another, more expensive, television of a higher specification in a newspaper competition. Having no use for the first television, the student sells the television to his cousin. During the course of the sale, the student discovers that the specification of the television he bought from the retailer was not what he was led to believe when he was induced to buy it, and he had therefore entered into the contract as a result of the retailer's negligent misrepresentation. The student is only able to sell the television to his cousin for £500. The cousin accepts the television and pays £500 for it.",q:"What options are available to the student?",opts:["The student could rescind the contract with the retailer as a result of the negligent misrepresentation.","The student could sue the retailer for damages but would receive only nominal damages as he has a higher specification television as a result of the newspaper competition win.","The student could sue the retailer for damages and would receive £500.","The student has no remedy against the retailer because he has acquired a better television as a result of the newspaper competition win.","The student has no remedy under the law of misrepresentation against the retailer because he should have made his own enquiries into the specification of the television."],ans:"C",expl:"(C) It is clear that there has been a misrepresentation by the retailer, which would ordinarily entitle the student to rescind the contract. However, the television has now been sold on to the student's cousin in good faith and for value, and the acquisition by a third party of rights to goods that are the subject matter of a contract is a bar to rescission, meaning that it is not available. Therefore, the student's only remedy is to sue for damages calculated on the basis of his loss, which is the difference between the price paid for the television from the retailer and the price it was sold on to the cousin for, or £500. (A) is incorrect for the reasons set out above: as a third party has acquired the television in good faith and for value, the contract cannot be rescinded as the goods cannot be taken away from the third party. (B) is incorrect because the student has suffered loss as a result of the misrepresentation, so nominal damages would not be an appropriate measure. (D) is incorrect because the fact that the student has acquired a television from elsewhere does not have any bearing on the original purchase of the television from the retailer or the subsequent sale to the cousin. (E) is incorrect because there is no reason to suggest that the student should have checked the specification - as might have been the case, for example, if he had specialist knowledge of televisions."},{n:60,id:"DIS122",scenario:"A new bride is unhappy with the photographs produced by her wedding photographer. She complains and asks for her money back. The photographer believes the photographs to be of good quality and believes that the bride is simply trying to avoid paying for them. The bride issues proceedings, and the photographer intends to make an application for summary judgment because he believes litigation will be a waste of time and money given the quality of his photographs.",q:"What is the earliest time at which the photographer can apply for summary judgment?",opts:["As soon as the claimant serves the Particulars of Claim and the photographer files an acknowledgment of service.","Two days after claimant serves the Particulars of Claim and the photographer files an acknowledgment of service.","Seven days after claimant serves the Particulars of Claim and the photographer files an acknowledgment of service.","Fourteen days after claimant serves the Particulars of Claim and the photographer files an acknowledgment of service.","Twenty-one days after claimant serves the Particulars of Claim and the photographer files an acknowledgment of service."],ans:"A",expl:"(A) A defendant cannot make an application for summary judgment until the claimant has served the Particulars of Claim and the defendant has filed the acknowledgment or defence. (B), (C), (D), and (E) are incorrect as there is no two-, seven-, 14-, or 21-day waiting period."}],J1=[{n:61,id:"CNL111",scenario:"The UK Parliament wants to enact legislation regarding use of the Welsh language in public institutions within Wales. The Welsh language is a matter that has been devolved to the Welsh Parliament.",q:"Which of the following best explains how the UK Parliament should proceed with this proposed legislation?",opts:["The UK Parliament should seek the consent of the Welsh Parliament for the proposed legislation, and if the Welsh Parliament refuses consent, the UK Parliament cannot proceed with the legislation.","The UK Parliament should seek the consent of the Welsh Parliament for the proposed legislation, and if the Welsh Parliament refuses consent, the UK Parliament can still proceed with the legislation.","The UK Parliament should proceed as normal with the legislation, without seeking the Welsh Parliament's consent for the proposed legislation.","The UK Parliament should seek the consent of the Welsh Parliament for the proposed legislation, and if the Welsh Parliament refuses consent, the UK Parliament may proceed with approval from the House of Lords.","The UK Parliament should seek the consent of the Welsh Parliament for the proposed legislation, and if the Welsh Parliament refuses consent, the UK Parliament may proceed with approval from the Supreme Court."],ans:"B",expl:"(B) The UK Parliament should seek consent from the Welsh Parliament but may proceed with the proposed legislation if the Welsh Parliament refuses to grant consent. The UK Parliament created the Welsh Parliament through an Act of Parliament and retains the power to legislate for Wales even if the matter has been devolved to the Welsh Parliament. However, under the Sewel Convention, if the UK Parliament wishes to legislate on a matter that has been devolved to the Welsh Parliament, then normally the consent of the Welsh Parliament is required. However, if the Welsh Parliament does not consent, the UK Parliament can still pass the legislation. Thus, (A) is incorrect. (C) is incorrect because, due to the Sewel Convention, the UK Parliament should seek the Welsh Parliament's consent to pass the legislation. (D) and (E) are incorrect because those procedures do not exist."},{n:62,id:"BSL210",scenario:"A baker and his friend have traded successfully as a partnership for many years. They recently incorporated their business. They require advice on which decisions of the company must be made by shareholders' ordinary resolution. The company has adopted the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association.",q:"Which of the following decisions can the company make by ordinary resolution?",opts:["Changing the name of the company.","Changing the articles of the company.","Removing a director.","Winding up the company.","Reducing the company's share capital."],ans:"C",expl:"(C) A director can be removed by ordinary resolution of the company. (A) is incorrect as a special resolution is required to change the name of the company. (B) is incorrect as a special resolution is required to change the articles of the company. (D) is incorrect as a special resolution is required to wind up the company, and (E) is wrong as a special resolution is required to reduce the company's share capital."},{n:63,id:"CNL070",scenario:"A council has decided to grant an application for a new shopping centre. The location of the shopping centre contains some medieval remains which will be lost with the new development. The British Medieval History Society, which includes some of the leading medieval historians in the country and has a large membership across the country, wish to challenge this decision.",q:"Which of the following best explains whether the Society will have standing to bring an application for judicial review?",opts:["They are likely to have standing because they have a sufficient interest in this decision.","They are unlikely to have standing because they are not the 'victim' of this decision.","They are unlikely to have standing because they are not directly affected by this decision.","They are likely to have standing because they are the 'victim' of this decision.","They are unlikely to have standing because they are an association rather than an individual."],ans:"A",expl:"(A) The Society is likely to have standing because they have a sufficient interest in this decision. The normal test for standing is whether the party has a sufficient interest to raise the issue. Usually, a group of people who individually lack standing do not acquire standing by forming an association or group. However, it has been held that if the association is responsible, well resourced, has expertise, and there is unlikely to be an alternative claimant, they are likely to be deemed to have a sufficient interest. The Society is likely to have standing here because they have expertise in the matters that the application raises and it is unlikely that another claimant would bring the application. (B) and (D) are incorrect because the 'victim' test is used only for human rights cases. (C) is incorrect because, even if the individuals forming a group or association are not directly affected by a decision, they may still be able to establish a sufficient interest by meeting the requirements discussed above. (E) is incorrect because, under certain circumstances, like the case here, groups or associations can establish standing for judicial review claims."},{n:64,id:"TRT133",scenario:"A man hires a marquee for a party. He pays the hire charges in advance. As the marquee is being transported to the party venue, the vehicle carrying it is involved in a road accident caused by the negligence of a car driver. The marquee is damaged beyond repair. The man is obliged to hire an alternative marquee at a substantial extra cost. The alternative marquee is not as luxurious as the original and the man is disappointed and embarrassed during the party. The original marquee hire company has now gone out of business. The man seeks to recover all of his losses from the car driver.",q:"In an action by the man against the driver, which of the following best states the likely outcome?",opts:["The man can recover damages to compensate for all of his losses except for his disappointment and embarrassment.","The man can recover damages to compensate for his disappointment and embarrassment but not for any of his other losses.","The man can recover damages to compensate for the extra costs of hiring the alternative marquee but not for any of his other losses.","The man cannot recover damages to compensate for any of his losses.","The man can recover damages to compensate for all of his losses."],ans:"D",expl:"(D) The man cannot recover damages to compensate for any of his losses. The action by the man against the car driver would be in the tort of negligence. Mere disappointment and embarrassment are not a kind of harm that is recoverable in the tort of negligence. The man's other losses (hire charges paid in advance and extra hire charges) all stem from damage caused to property which did not belong to him and so are classed as pure economic loss, in respect of which no duty of care is owed. (A) is not correct because it assumes that the man could recover the original hire charges and the extra charges, both of which are classed as pure economic loss and so not recoverable. (B) is not correct because mere embarrassment and disappointment are not a kind of harm that is recoverable in the tort of negligence. (C) is not correct because the extra cost of hiring an alternative marquee is classed as pure economic loss in respect of which no duty of care is owed. (E) is not correct because none of the man's losses are recoverable in the tort of negligence, as explained above."},{n:65,id:"DIS196",scenario:"The solicitor representing an accountant in a professional negligence claim sends a letter to a forensic accountant, who the solicitor might instruct to be an expert witness in the case. The solicitor included all of the relevant documents with the letter so that the forensic accountant could confirm whether they would be prepared to be an expert witness in the case. The forensic accountant responds by email, strongly recommending that the client settle because there is no viable defence. However, the client refuses to settle and suggests another expert, who produces a report in the client's favour.",q:"Is the solicitor duty bound to permit inspection of the first forensic accountant's email?",opts:["Yes, because inspection of all information that is adverse to the party's interests must be permitted.","Yes, because the duty of disclosure applies to emails as well as documents written in physical form.","No, because legal advice privilege protects the email.","No, because litigation privilege protects the email.","No, because without prejudice privilege protects the email."],ans:"D",expl:"(D) Litigation privilege protects communications between a solicitor and a third party (for example, an expert or a barrister) sent for purposes of preparation for trial. The exchange here was with a potential expert on the case, and it was clearly prepared in contemplation of litigation. Therefore, the client can successfully object to inspection on the basis of litigation privilege. (A) and (B) are incorrect because both are overbroad - inspection is not mandated as to privileged documents. (C) is incorrect because common interest privilege applies in situations where there are multiple parties on one side of the case who send communications amongst themselves - the privilege can be asserted to prevent disclosure of those communications. The first forensic accountant was not a co-party, so there was no common interest here. (E) is incorrect because without prejudice privilege applies to communications between opposing parties, with a view toward negotiation or settlement. The exchange here was not with the claimant, but rather with an expert.",note:"The source explanation for (C) discusses common interest privilege, although option (C) refers to legal advice privilege. It is reproduced as it appears in the source."},{n:66,id:"ELS022",scenario:"A contractual dispute comes before a judge in the High Court. A previously reported case, heard by the Court of Appeal, found in favour of the claimant. The judge knows that, provided the case before him fulfils certain criteria, he is bound to follow the previous decision of the Court of Appeal.",q:"Which of the following is not a factor in establishing whether a statement made in one case is binding on a later case?",opts:["The statement is a statement of law.","The facts of the case mirror the previous case.","The previous judgement was decided in a court that would bind the current court.","The reasoning was similar in the previous case.","The statement was not obiter dicta."],ans:"B",expl:"(B) The facts of the case do not have to mirror the previous case to establish that a statement in the previous case is binding on the later one. The doctrine of precedent relates to the legal decisions made by judges in higher courts. Decisions made in lower (or equal) courts will rely on the earlier decisions of the higher courts, subject to certain requirements. The Court of Appeal is a higher court than the High Court, so provided that the facts are materially the same (there is no requirement for the facts to exactly mirror each other though), the ratio decidendi (the legal reason for the decision) will need to be followed. (A), (C), (D), and (E) are all factors establishing whether a statement made in one case will be binding on a later case."},{n:67,id:"LGS010",scenario:"A freelance solicitor is acting for a client on the sale of a house. She is drafting the relevant contract of sale and will be filing a number of forms with the Land Registry. The freelance solicitor is not authorised as a sole practitioner with the Solicitors Regulation Authority.",q:"Which statement best explains the conditions which the freelance solicitor must meet to be able to provide the client with legal advice?",opts:["The freelance solicitor must have the minimum level of professional indemnity coverage required by the SRA and that coverage must be adequate and appropriate.","The freelance solicitor must have three years' post-qualification experience and adequate and appropriate professional indemnity insurance only.","The freelance solicitor must have four years' post-qualification experience and adequate and appropriate professional indemnity insurance only.","The freelance solicitor must have three years' post-qualification experience, have the minimum level of professional indemnity coverage required by the SRA, and not hold client money.","The freelance solicitor must have three years' post-qualification experience, have adequate and appropriate professional indemnity insurance, not hold client money, and notify the SRA that they are acting as a freelance solicitor."],ans:"E",expl:"(E) Subject to a number of conditions, a freelance solicitor can carry out reserved legal activities without being authorised as a sole practitioner by the SRA. These include that the freelance solicitor must have three years' post-qualification experience, must take out and maintain adequate and appropriate insurance, must not hold client money, and must notify the SRA that they are acting as a freelance solicitor. Here, the freelance solicitor is carrying out a reserved legal activity (preparing documents relating to real estate, including the contract for sale of land) and is not authorised as a sole practitioner by the SRA. In order to provide the client with legal advice in this matter, the freelance solicitor must meet all of the conditions listed in this answer choice. (A) and (D) are incorrect because the freelance solicitor does not need to purchase insurance on the SRA's minimum terms if she meets the conditions explained above. (B) and (C) are incorrect because they do not correctly list the full set of conditions and requirements explained above."},{n:68,id:"BSL046",scenario:"A newly appointed board of directors of a limited company are considering the powers available to them. On incorporation, the company adopted the model articles of association for private companies limited by shares.",q:"Absent a specific provision in the company's articles of association, which of the following powers is reserved exclusively for the shareholders, not the directors?",opts:["Entering into contracts on behalf of the company.","Recommending dividends.","Entering into loans.","Amending the articles of association.","Appointing directors."],ans:"D",expl:"(D) Amending the articles of association is a decision reserved exclusively for the shareholders of the company, as the articles represent a contract between the company and its members (although the board of directors may recommend an amendment). Amendment of the articles requires approval of the amendment by special resolution, that is, it requires approval by at least 75% of the shareholders voting. (A) is incorrect because the model articles of association for a private company limited by shares state that, subject to any provision in the articles to the contrary, the directors are responsible for the management of the company's business, for which purpose they may exercise all the powers of the company. (B) is incorrect because one of the roles of the directors is to recommend a dividend if there are profits available for the purpose. The shareholders then vote by ordinary resolution whether to approve and declare the recommended dividend. (C) is incorrect because the model articles of association for a private company limited by shares state that, subject to any provision in the articles to the contrary, the directors are responsible for the management of the company's business, for which purpose they may exercise all the powers of the company. (E) is incorrect because the model articles provide that directors may be appointed by an ordinary resolution of the members or by a decision of the directors."},{n:69,id:"CNL145",scenario:"An individual's wife was deported by the Home Office. The individual alleges that the deportation breached their right to a family life as protected by Article 8 of the European Convention on Human Rights ('ECHR') by deporting his wife. The interest group Anti-Deport want to bring the individual's case before the courts.",q:"Which of the following reasons best explains why the interest group cannot bring the case before the courts?",opts:["The individual's case is weak on the merits.","The courts have discretion over whether to hear the case, and they are unlikely to be in favour in this instance.","Interest groups cannot bring claims alleging a breach of Article 8.","The interest group does not have a sufficient interest.","The interest group is not a 'victim'."],ans:"E",expl:"(E) The interest group cannot bring this case before the courts because it is not a 'victim', and thus lacks standing. Claims against public authorities for a breach of human rights can be brought only by the victim of the alleged action (that is, someone directly affected by the alleged conduct). Otherwise, there is no standing. Thus, an action cannot be brought on behalf of someone else. (A) is incorrect because the court cannot hear the case and get to the merits unless there is standing. Additionally, we do not have sufficient facts to make such a judgment on this issue. (B) is incorrect because the courts do not have discretion over whether to hear a case that lacks standing. (C) is incorrect because there is no such limitation. (D) is incorrect because it states the more general standing test used for judicial review claims."},{n:70,id:"CTR123",scenario:"A manufacturer in England enters into a contract with a shipowner to transport a consignment of machine parts to a buyer in Japan. The contract contains a clause excluding liability for any damage to the machine parts caused by the shipowner or anyone else involved in their carriage. The shipowner enters into a separate contract with a port operator to load the machine parts onto the shipowner's ship. The port operator's employees damage the machine parts whilst loading them.",q:"Can the port operator rely on the exclusion of liability in the contract between the manufacturer and the shipowner?",opts:["No, the port operator is not a party to the contract containing the exclusion clause.","No, because the exclusion clause is void under the Unfair Contract Terms Act 1977.","Yes, because the shipowner holds the benefit of the exclusion clause on trust for the port operator.","No, because the port operator was not expressly named in the contract between the manufacturer and the shipowner.","Yes, because the port owner can rely on the Contracts (Rights Against Third Parties) Act 1999 (unless it has been excluded)."],ans:"E",expl:'(E) This question is about the doctrine of privity of contract. The port operator is not a party to the contract between the manufacturer and the shipowner. However, under the Contracts (Rights of Third Parties) Act 1999, a third party has a right to enforce a provision of the contract if they were named in the contract (specifically or by class) and it appears the term was intended to be enforceable by the third party. Here, the contract excludes liability for the shipowner and for "anyone else involved" in carriage of the goods. The port operator appears to be within the described class (that is, someone involved in carriage of the goods), and the clause clearly applies to third parties. Even before the 1999 Act, in cases such as this, the courts have found that there is an implied collateral contract with a person who is intended to benefit from an exclusion clause. (B) is incorrect because under the Unfair Contract Terms Act 1977 the exclusion is subject to the reasonableness test and is not automatically void. (C) is not the correct answer, because there is no indication that the parties intended a trust. (D) is incorrect because a third party can rely on the Contracts (Rights Against Third Parties) Act 1999 even if they are not expressly named in the contract; it is enough that they are part of a class of persons intended to benefit from the contract.',note:'The source explanation does not address option (A). The Act is referred to in the source both as the "Contracts (Rights Against Third Parties) Act 1999" and the "Contracts (Rights of Third Parties) Act 1999"; both are kept as they appear.'},{n:71,id:"BSL197",scenario:"A company was incorporated five years ago to operate a public house. It has an issued share capital of 1,000 ordinary £1 shares. Due to a temporary slow-down in the company's business, the company has only £20,000 in accumulated profits from which to declare dividends. However, business has begun to rebound. Assuming that the trend will continue, the directors vote to pay a dividend of £5 per share dividend and the shareholders approve the distribution through an ordinary resolution. Unfortunately, the rebound in business was short-lived, and the company becomes insolvent a few months after the dividend is paid.",q:"If payment of the dividend is found to have been improper, which of the following best states the legal position on liability for the payment and who may be held liable for the amount paid?",opts:["Only the directors are liable, and they are liable for the full amount of the dividend.","The directors and any shareholder who received the dividend are liable, and they are liable for the full amount of the dividend.","Only the directors are personally liable, but any shareholder who received a dividend knowing it was unlawfully declared must return the dividend (or the portion that is unlawful).","Only the directors are personally liable, but only to the extent the dividend was unlawful.","The directors and any shareholder who received the dividend are liable for the dividend, but only to the extent the dividend was unlawful."],ans:"C",expl:"(C) If a dividend is unlawful, the directors may be held personally liable for approving the dividend. However, any shareholder who received the dividend knowing it was unlawfully declared must return the dividend (or the portion of it that is unlawful). It follows that the other answer choices are incorrect."},{n:72,id:"BSL179",scenario:"A sole trader was made bankrupt six months ago, after many years of successful business trading as a butcher.",q:"Which of the following actions will the sole trader be able to take whilst they are bankrupt?",opts:["Trade as a butcher under their spouse's name.","Be appointed as a director of a company specialising in barbeque meat.","Apply for a job as a butcher.","Apply for a credit card with a credit limit of £25,000.","Set up a partnership with a friend trading as a butchers' shop."],ans:"C",expl:"(C) The bankrupt may apply for (and take) a job as a butcher. Bankrupts are subject to various restrictions during their bankruptcy, but they are allowed to work. (A) is incorrect as a bankrupt cannot trade under another name without disclosure of the bankruptcy. (B) is incorrect as a bankrupt cannot act as a company director. (D) is incorrect as a bankrupt cannot apply for credit whilst subject to a bankruptcy order. (E) is incorrect as a bankrupt cannot be a partner."},{n:73,id:"ETH070",scenario:"A solicitor is acting for a client who is planning to make a significant investment in a technology company. One night, the solicitor is at a party and encounters an old friend from university, for whom he has never acted. The friend mentions that she works as a scientist for the same technology company, and that she suspects the company will face financial ruin because it recently discovered a serious defect in its bestselling product.",q:"Should the solicitor disclose the information about the technology company to his client?",opts:["No, because the solicitor owes a duty of confidentiality to the friend.","No, because the solicitor learned the information while acting in a personal capacity.","Yes, because the solicitor has a duty to disclose this material information to the client.","No, because the solicitor's knowledge is based on privileged information.","Yes, because the solicitor's duty of confidentiality to the friend does not apply in this situation."],ans:"C",expl:"(C) Any individual who is advising a client must make that client aware of all information materi
