x?-1:a.x>l.x?1:a.y<l.y?-1:a.y>l.y?1:0),G1(i)}function G1(r){if(r.length<=1)return r.slice();const i=[];for(let l=0;l<r.length;l++){const u=r[l];for(;i.length>=2;){const d=i[i.length-1],h=i[i.length-2];if((d.x-h.x)*(u.y-h.y)>=(d.y-h.y)*(u.x-h.x))i.pop();else break}i.push(u)}i.pop();const a=[];for(let l=r.length-1;l>=0;l--){const u=r[l];for(;a.length>=2;){const d=a[a.length-1],h=a[a.length-2];if((d.x-h.x)*(u.y-h.y)>=(d.y-h.y)*(u.x-h.x))a.pop();else break}a.push(u)}return a.pop(),i.length===1&&a.length===1&&i[0].x===a[0].x&&i[0].y===a[0].y?i:i.concat(a)}var K1=wg,Tg=bg;const Y1=k.forwardRef(({className:r,sideOffset:i=4,...a},l)=>T.jsx(K1,{children:T.jsx(Tg,{ref:l,sideOffset:i,className:ge("z-50 overflow-hidden rounded-md bg-popover px-3 py-1.5 text-xs text-popover-foreground animate-fade-in",r),...a})}));Y1.displayName=Tg.displayName;const Q1=[{n:1,id:"CNL079",scenario:"Created by statute, the Gambling Executive regulates the betting industry. The Executive has the power to grant and withdraw the licence that every bookmaker is required to have to operate in the UK. The Executive has decided to withdraw the licence from a bookmaker after hearing rumours that the bookmaker is laundering money. The bookmaker challenges the Executive's decision by judicial review.",q:"Which of the following grounds is most likely to be successful for the bookmaker's judicial review claim?",opts:["The Executive has made a biased decision.","The Executive has violated the bookmaker's right to be heard.","The Executive has failed to comply with the general duty to give reasons.","The Executive has failed to comply with the general duty to consult.","The Executive has made an unreasonable decision."],ans:"B",expl:"(B) The bookmaker is most likely to succeed on the ground that the Executive violated the bookmaker's right to be heard. Before a decision is made which adversely affects someone, that individual has a right to be heard. The extent of the right varies from case to case. For a forfeiture case (that is, where someone is deprived of a right), the individual is entitled to hear the case against them and to respond. Here, the bookmaker had the right to run a gambling business, which means they should have had the opportunity to respond to the case against them before losing their licence. (A) is incorrect because nothing in the facts indicates that there was evidence of bias by the Executive. (C) and (D) are incorrect because there is no general duty to give reasons or a general duty to consult at common law. (E) is incorrect because the test for 'unreasonableness' is a high threshold (it requires the decision to be so outrageous that it is deemed to be unlawful), and there are no facts to support that finding."},{n:2,id:"CNL128",scenario:"In a case before the Court of Appeal in 2021, the Court of Appeal must interpret a provision of retained EU law. The appellant wishes to rely on the interpretation provided by the High Court in a case from 2011. However, the respondent argues that the court is free to adopt its own interpretation of the law.",q:"Which of the following best describes the legal position?",opts:["The Court of Appeal should refer the case to the Supreme Court, which is not bound by retained domestic case law.","The High Court's judgment from 2011 forms part of retained EU case law, and it is not binding on the Court of Appeal.","The High Court's judgment from 2011 forms part of retained EU case law, and it is binding on the Court of Appeal.","The High Court's judgment from 2011 forms part of retained domestic case law, and it is not binding on the Court of Appeal.","The High Court's judgment from 2011 forms part of retained domestic case law, and it is binding on the Court of Appeal."],ans:"D",expl:"(D) Although the High Court's judgment is part of retained domestic case law, it is not binding on the Court of Appeal. Because the High Court's judgment from 2011 pre-dates the end of the transition period (in December 2020), and it involves the interpretation of retained EU law by a domestic court, it forms part of retained domestic case law. The UK courts are bound by retained domestic case law only from courts that are higher or equivalent to them. Thus, the High Court's decision is not binding on the Court of Appeal. (A) is incorrect because there is no provision allowing for the Court of Appeal to refer matters to the Supreme Court in this way. (B) and (C) are incorrect because the High Court's judgment is part of retained domestic case law, not retained EU case law. (E) is incorrect because, as mentioned, the High Court's judgment does not bind the Court of Appeal."},{n:3,id:"BSL010",scenario:"Four friends set up a partnership to operate a car repair business. Each of the four contributed £5,000 to the business and pledged to work at the business full time. Additionally, one of the friends already owned an expensive diagnostic computer because she had been repairing cars as a sole trader for some time. She offered to allow the partnership to use the diagnostic computer in its business. However, she insisted that the machine would remain hers. Since the partnership began, the diagnostic computer has been upgraded several times and the partners used partnership funds to pay for the upgrades. After three years, the partner who owned the diagnostic computer decided to retire from the partnership and return to her work as a sole trader. When giving notice of her desire to leave, she also told her partners that she would be taking her diagnostic computer with her. As a new diagnostic computer would cost £12,000, the other three partners are keen to keep it.",q:"Does the partner have a right to take back the diagnostic computer?",opts:["Yes, because the partnership failed to register the diagnostic computer as partnership property at Companies House.","No, because the diagnostic computer became partnership property when the partner allowed the partnership to use it.","Yes, because partners are entitled to a return of their contribution upon retirement.","Yes, because the partner never intended the diagnostic computer to become partnership property.","No, because the diagnostic computer became partnership property when the partner allowed the partnership to pay for repairs and maintenance on the computer."],ans:"D",expl:"(D) Property will be considered partnership property if it was brought into the partnership with the intention that it would be partnership property. Here, the partner made it clear at the beginning of the partnership that she wished her diagnostic computer to remain her property. (A) is incorrect as there is no requirement to register partnership property with Companies House. The fact that the partner allowed the partnership to use the diagnostic computer (B), and that the partnership paid for upgrades to the computer (E), does not affect the general rule: intent controls. (C) is incorrect as the partner did not contribute the diagnostic computer, as explained above. If it had been contributed, it would have become partnership property and she would not necessarily have had a right to its return in kind. On dissolution, partners have a right only to their share of partnership assets."},{n:4,id:"DIS249",scenario:"A business owner is involved in a dispute with a business partner regarding equity in the business. The value of the claim is approximately £150,000.",q:"Which court would you expect to deal with this case?",opts:["The County Court.","The High Court (Queen's Bench Division).","The High Court (Chancery Division).","The small claims court.","One of the specialist courts."],ans:"C",expl:"(C) The Chancery Division deals with disputes relating to business, equity, and trusts. It also deals with some land and property disputes. It would be the appropriate venue for this case, on the facts given. (A) is incorrect because whilst the County Court does deal with some business disputes, a case of this type (involving the equity of the owners) falls within the ambit of the Chancery Court. (B) is incorrect because the Queen's Bench Division predominantly deals with tort and contract claims. (D) is incorrect because the small claims court actually refers to the small claims track, which in any event is reserved for managing the simplest claims in a cost-effective and efficient manner. A claim for £150,000 is well outside the £10,000 limit for the small claims track. (E) is incorrect because the Chancery Court will be in a position to deal with this dispute."},{n:5,id:"LGS083",scenario:"A client has instructed a solicitor to advise in relation to the purchase of a house. The client is financing the purchase partly through savings and partly through the sale of some shares. The solicitor recommended that the client speak to a stockbroker about which shares to sell and provided details of the broker to the client. The stockbroker gave the solicitor an introduction fee of £100. After taking the stockbroker's advice, the client asked the solicitor to sort out the paperwork for the sale of the shares, which the solicitor did. Neither the solicitor nor his firm is authorised by the Financial Conduct Authority to carry on a 'regulated activity' as defined in the Financial Services and Markets Act 2000 and related secondary legislation. The stockbroker is authorised by the Financial Conduct Authority.",q:"Has the solicitor breached the general prohibition against carrying on a regulated activity?",opts:["No, because the only relevant investment is land, which is not a specified investment.","Yes, because land is a specified investment and no exclusion applies.","Yes, because arranging is a specified activity and shares are a specified investment and no exclusion applies.","No, because while there is a specified activity and a specified investment, the acting through an authorised person exclusion applies.","No, because while there is a specified activity and a specified investment, the acting as a trustee exclusion applies."],ans:"C",expl:"(C) The solicitor has breached the general prohibition against carrying on a regulated activity because arranging is a specified activity and shares are a specified investment and no exclusion applies. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. Here, the solicitor has been asked to make arrangements (a specified activity) for the client to sell shares (a specified investment). The solicitor cannot rely on the acting through authorised persons exclusion. Though the solicitor may arrange specified investments if the client receives advice from a person authorised by the Financial Conduct Authority, the exclusion is not available if the solicitor received payment from the authorised person. As the stockbroker (an authorised person) paid the solicitor an introduction fee of £100, this exclusion will not be available. Thus, the solicitor has carried on a regulated activity in breach of the general prohibition. (A) and (B) are incorrect because the relevant investment here is the sale of shares, which are a specified investment. (D) is incorrect because, as explained above, the acting through an authorised person exclusion is not available if the solicitor receives a payment from that person. (E) is incorrect because the relevant exclusion is acting through an authorised person, not acting as a trustee."},{n:6,id:"TRT136",scenario:"A man borrowed a motorbike from a friend to use for a camping trip. The man stowed his backpack and tent on the back of the motorbike. At a service area en route, he briefly left the motorbike in a parking spot for cars in violation of the posted regulations. Whilst he was away, a car driver crashed into the motorbike. The motorbike was so badly damaged that it was unusable. The man had to hire a replacement motorbike for the remainder of his trip. Also, his backpack and tent, worth a total of £150, were destroyed, requiring him to replace them before he could proceed on his trip.",q:"In a claim by the man against the car driver, which of the following statements is correct?",opts:["The man cannot recover any damages for either the motorbike or the backpack and tent because the motorbike was not legally parked.","The man cannot recover any damages for either the motorbike or the backpack and tent because the motorbike did not belong to him and the total cost of the backpack and tent was less than £275.","The man cannot recover any damages for the costs of hiring a replacement motorbike nor for the cost of replacing his backpack and tent because this is all pure economic loss.","The man cannot recover any damages for the motorbike and replacement motorbike hire, but he can recover for the cost of replacing his backpack and tent.","The man cannot recover any damages for the motorbike, but he can recover for the cost of the replacement motorbike hire and the cost of replacing the backpack and tent."],ans:"D",expl:"(D) The man can recover for the backpack and tent. Damage to property which did not belong to the claimant is classed as pure economic loss and cannot be recovered. Hence, the man cannot recover for the damage to the motorbike and hire of a replacement because the motorbike did not belong to him. However, he can recover for the cost of replacing the backpack and tent because this is property which did belong to him, so the cost of replacing it is not pure economic loss. (B) is not correct. It correctly notes that damage to the motorbike is not recoverable because it did not belong to the man, but it incorrectly asserts that he cannot recover for the cost of replacing the backpack and tent because it is less than £275. Unlike in a defective product action under the Consumer Protection Act 1987, there is no such restriction on property damage recovery in an ordinary negligence action. (C) is not correct because it incorrectly assumes that all of the losses are pure economic loss. (A) is not correct. It assumes that the defence of illegality would apply. The law of tort does not permit a claimant to base a claim on his own illegal act. However, the fact that the motorbike was not legally parked is only part of the background circumstances. The claim is not based on illegal conduct, so the defence of illegality will not apply. (E) is not correct. The man cannot recover for the cost of the replacement motorbike hire because it did not flow from damage to his own property; rather, it flowed from damage to a motorbike that did not belong to him."},{n:7,id:"LGS098",scenario:"A firm of solicitors is not authorised by the Financial Conduct Authority to carry on a 'regulated activity' as defined in the Financial Services and Markets Act 2000 ('FSMA') and related secondary legislation.",q:"Which of the following activities would the firm be able to conduct in its business if no FSMA exclusion or exemption applies?",opts:["Safeguarding a client's portfolio of shares.","Advising a client on payments into a pension scheme.","Arranging for a client to purchase Premium Bonds.","Managing a client's debenture.","Contracting for a client to purchase a funeral plan."],ans:"C",expl:"(C) Under the general prohibition of FSMA, a firm of solicitors may not carry on regulated activity in the UK unless they are authorised or exempt from authorisation. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. The specified activities and investments might be remembered with the mnemonic device 'ADAMS F.M.DIPS'. Activities = Advising, Dealing as an agent, Arranging, Managing, and Safeguarding. The specified investments most relevant to a solicitor = Funeral plans, Mortgage contracts, Debentures, Insurance contracts, Pension schemes, and Shares in a company. The firm would be able to arrange for the client to purchase Premium Bonds because while arranging is a specified activity, Premium Bonds are not specified investments. (A), (B), and (D) each clearly involve specified activities (safeguarding, advising, and managing, respectively) and specified investments (shares, pension plans, and debentures). (E) clearly involves a specified investment as well (funeral plan) and contracting on behalf of someone is dealing as an agent (a specified activity)."},{n:8,id:"DIS148",scenario:"A man sustained internal injuries in a car accident. He was rushed to hospital and into surgery. The surgery went well, but the surgeon accidentally left a sponge in the man's abdomen. Nonetheless, the man recovered from his injuries. However, about a year later, the man developed sepsis. He underwent a second surgery during which the sponge was discovered.",q:"How long does the man have to make a claim against the first surgeon?",opts:["Six years from date of the first surgery.","Three years from date of the first surgery.","Six years from date of the second surgery.","Three years from date of the second surgery.","One year from date of the second surgery."],ans:"D",expl:"(D) The basic limitation period for personal injury claims is three years from the date of accrual, which is the date of the first surgery here. However, it would not be fair to start the limitation period on accrual because the man did not know of the negligence; he did not find out about it until his second surgery. In such cases, we use the date of knowledge. Therefore, the man has three years from the date of the second surgery in which to bring his claim. It follows that the other answer choices are incorrect."},{n:9,id:"TRT026",scenario:"A group of teenage children are working together to renovate a children's playground. They are trying to move a heavy wooden beam when one of them accidentally drops the end he is carrying. It lands on a fellow teenager's leg and injures him. In an action in negligence by the injured person against the teenager, the teenager admits owing a duty of care but denies being in breach.",q:"On the issue of breach of duty, which one of the following statements is NOT correct?",opts:["The standard of care which the teenager must meet is objective and impersonal.","No account will be taken of the teenager's own lack of experience in building and renovating.","The standard of care which the teenager must meet is that of a reasonable adult undertaking the same task and no account will be taken of his age.","In determining how the teenager ought to have acted, the court will take into account the magnitude of the risk involved.","In determining how the teenager ought to have acted, the court will take into account the practicability of taking precautions against the risk involved."],ans:"C",expl:"(C) It is not correct to say, as choice (C) states, that, in assessing breach of duty, no account will be taken of the teenager's age. For defendants who are not adults, their duty is assessed according to the standard of care to be expected of a reasonable child of the same age. (C) is therefore the correct answer. (A) and (B) are incorrect because they are both correct statements of law. The standard of care is an objective one - that of a reasonable teenager. It does not take account of this particular teenager's lack of experience. (D) and (E) are incorrect because they are both correct statements. When assessing the standard of reasonable care, the court will look at the magnitude of the risk created by the defendant's actions and the practicability of taking precautions."},{n:10,id:"TRT092",scenario:"A business owner wished to stage an event on his premises. He engaged an independent contractor to build an outside pavilion for the event. Before engaging the contractor, the business owner carefully checked that the contractor had appropriate qualifications and experience. Once the pavilion was built, the business owner carried out a thorough safety inspection. However, on the first day of the event, the pavilion collapsed, injuring several of the customers. Evidence later showed that the contractor who erected the pavilion had carelessly failed to secure the roof struts and this had caused the collapse.",q:"In a claim by the customers against the business owner, which of the following statements is correct?",opts:["The business owner will not be liable to the customers because they were owed a duty of care by the contractor rather than by the business owner.","The business owner will not be liable to his customers even though he owed a duty of care in respect of the safety of the premises, because he discharged that duty by acting reasonably to engage a competent contractor and checking the work.","The business owner will be liable to the customers because they were lawful visitors to his premises, and an occupier owes lawful visitors an absolute duty to ensure that the premises are in a safe condition.","The business owner will be liable to the customers because an occupier of premises owes a duty to lawful visitors which cannot be discharged by employing an independent contractor.","The business owner will not be liable to the customers because the independent contractor's negligence was an intervening act that broke the chain of causation."],ans:"B",expl:"(B) The business owner will not be liable to the customers. Harm has been caused to the customers by the state of the premises, the business owner is the occupier of the premises, and the customers are his lawful visitors. So, liability is governed by the Occupiers' Liability Act 1957. The occupier owes a duty of care in respect of the condition of the premises. That duty may be discharged by employing an independent contractor to carry out work of construction, maintenance, or repair, provided that the occupier acted reasonably in entrusting the work to an independent contractor and took reasonable steps to satisfy himself that the contractor was competent and the work properly done. So, on the facts, the business owner discharged the duty which he owed to his customers. (A) is not correct. The independent contractor did owe a duty of care to the customers, but the business owner also owed them a duty of care (as discussed above). (C) is not correct. The duty owed by an occupier to lawful visitors is not an absolute duty to see that premises are safe. It is a duty to take reasonable care to see that the visitor will be reasonably safe. (D) is not correct. The duty owed by an occupier to lawful visitors can be discharged by employing an independent contractor provided the conditions discussed above are satisfied. (E) is not correct. The fact that the independent contractor was at fault would not break the chain of causation or discharge the occupier's duty. The further conditions discussed above must also be met."},{n:11,id:"BSL023",scenario:"Three partners form a partnership to operate a car repair business. The partnership agreement states that the partners do not have authority to enter into transactions on behalf of the partnership in excess of £5,000. One of the partners orders a new diagnostic computer for the garage from a third party for £10,000.",q:"Which of the following statements is correct regarding the partner's apparent authority in this situation?",opts:["The partner had no apparent authority because it must be derived from the express powers and purposes contained in the partnership agreement.","The partner had no apparent authority because it may be limited by a formal resolution of the partners at the peril of third parties who are unaware of the limitation.","It is uncertain whether the partner had apparent authority because it arises solely from previous dealings between the parties.","The partner had apparent authority here because the purchase appears to be carrying on in the usual way business carried on by the firm.","The partner had apparent authority because it is a natural consequence of authority expressly given to the partner."],ans:"D",expl:"(D) Under the Partnership Act, each partner is an agent of the firm, and the act of any partner carrying on in the usual way business of the kind carried on by the firm will bind the firm through apparent authority. This rule will apply unless the third party knew the partner had no authority to act or did not know the partner was a partner. Purchasing a diagnostic computer would seem to be connected to operating a car repair business, and nothing in the facts indicates the third party was aware of the £5,000 limitation. Therefore, the partner had apparent authority and the partnership will be bound. (A) is incorrect because this describes actual or express authority. (B) is incorrect because limitations which are not known by the third party do not affect apparent authority. Additionally, 'resolutions' are normally associated with decisions made by shareholders of companies. (C) is incorrect. Whilst apparent authority can arise from previous dealings between the partnership and the third party, it can also arise from the position of the partner as a partner. (E) is incorrect as it describes implied express authority, which arises from the expectations of the partner based on communications and/or prior conduct as between the partnership and that partner."},{n:12,id:"DIS187",scenario:"A motorcyclist is involved in a multi-vehicle accident on a country road and suffered severe injuries. The motorcyclist contends the accident was attributable to the negligence of the driver of a car travelling in the opposite direction. After receiving a letter of claim from the motorcyclist, the car driver's insurers instruct solicitors. The solicitors incur significant costs obtaining witness statements, a plan and photographs of the location, and a copy of the police report. It soon becomes clear to them that the accident was not caused by their insured, but rather by the negligence of a van driver who had pulled out in front of the insured's car. The motorcyclist accepted that the van driver was at fault. The van driver's insurers accepted liability and ultimately settled the claim, so the motorcyclist never issued proceedings.",q:"Can the car driver's insurer recover any of their costs from the claimant or the responsible party?",opts:["Yes, the insurers can look to the claimant to pay their wasted costs in investigating the claim that he intimated against their insured.","No, the insurers cannot recover any of the cost from either of the other parties involved in the accident.","Yes, the insurers can recover the costs incurred from the negligent party responsible for the accident.","No, other than the cost of any disbursements incurred, for example, the police report fee or the cost of obtaining the plan and photographs.","Yes, the claimant can claim the costs associated with the investigation, but none of the cost relating to interaction between their nominated solicitors and the claimant's representatives."],ans:"B",expl:"(B) It is unlikely that the insurers will be able to recover any cost incurred in the protocol period. Generally, if the parties comply with the appropriate protocols and fail to resolve their issues, but the claimant nevertheless decides not to continue with the claim, it is unlikely that the defendant will be able to recover any costs. (But note that if proceedings were issued and the claim stayed to allow the parties to comply with the protocols, an award to recover some of the wasted costs of complying with the protocols is more likely.) (A), (C), (D), and (E) are incorrect because investigation costs are not recoverable pre-issue."},{n:13,id:"TRT119",scenario:"The owner of a top floor flat engaged a building contractor to renovate the flat by carrying out extensive structural works. The contractor warned the flat owner that the work would create substantial amounts of dust likely to affect his neighbour in the flat below. The contractor advised that, for an extra cost, precautions could be taken to minimise the spread of dust. However, the flat owner decided not to pay for this, so the work went ahead without it. The contractor carried out all of the work and at no time did the flat owner undertake any work himself. The work lasted for six months and, as predicted, caused a substantial interference by spread of dust to the neighbour's flat below.",q:"In an action in the tort of private nuisance by the neighbour against the flat owner to recover damages for the effects of the dust, which of the following best states the likely outcome?",opts:["The flat owner is not liable in nuisance for damages caused by the dust because he did not create the nuisance, having not done any of the work himself.","The flat owner is liable in nuisance for damages caused by the dust because he is the occupier of the land where the dust originated.","The flat owner is not liable in nuisance for damages caused by the dust because he has exercised reasonable care by choosing a competent independent contractor.","The flat owner is liable in nuisance for damages caused by the dust because the building work for which the contractor was engaged carried a special danger of causing a nuisance.","The flat owner is not liable in nuisance for damages caused by the dust because the dust spreading to the neighbour's flat constituted a trespass to land."],ans:"D",expl:"(D) The flat owner is liable. The facts show that the dust has caused an interference with the neighbour's use and enjoyment of his land which was substantial and unreasonable. Therefore, the contractor has created an actionable nuisance. The general rule is that a person is not liable for the torts of their independent contractor. However, as an exception to this, an occupier of land is liable for a nuisance created by an independent contractor where the work for which the contractor was engaged carried a special danger of creating a nuisance. Therefore, (A) is not correct. (B) is not correct. It is not sufficient for liability in private nuisance that the defendant was the occupier of the land from which the nuisance originated. On the facts, the flat owner is liable, but for the reasons discussed above. (C) is not correct. As a general rule, an occupier would not be liable for a nuisance created by a carefully chosen independent contractor. However, on the facts, the flat owner is liable because he employed a contractor to do work which carried a special danger of causing a nuisance, as explained above. (E) is not correct. Trespass to land deals with intentional and direct interference with the claimant's possession of land. In contrast, the tort of nuisance covers damage which is indirect, such as the harm that occurred here."},{n:14,id:"BSL217",scenario:"On incorporation several years ago, a company issued 100 £1 ordinary shares. The company now wishes to issue 100 preference shares to a new investor. The company has the Companies (Model Articles) Regulations 2008 (unamended) for private companies limited by shares as its articles of association.",q:"Which of the following best describes the members' resolutions which must be passed before the shares can be allotted?",opts:["A members' ordinary resolution to give the directors the power to allot the shares only.","A members' special resolution to disapply preemption rights only.","A members' special resolution to change the articles to include the preference share rights.","A members' special resolution to give the directors the power to disapply preemption rights and a members' special resolution to change the articles to include the preference share rights.","A members' ordinary resolution to give the directors the power to allot the shares, and a members' special resolution to change the articles to include the preference share rights."],ans:"E",expl:"(E) The directors have the power to allot shares if the company has only one class of shares. Here the company is issuing a different class, so the directors need the members to pass an ordinary resolution to give them the power to allot the preference shares. Only equity shares are subject to the statutory preemption rights (and not preference shares) so there is no need to disapply preemption rights. The articles need to be changed by special resolution to include the rights enjoyed by the preference shares. None of the choices other than (E) has the correct combination."},{n:15,id:"CTR002",scenario:"On 10 April, the owner of a farm posted a letter to a new resident of the area who had expressed an interest in buying the farm. In this letter, the farm owner offered to sell the farm to the resident for £100,000. The offer expressly stated that the offer would expire on 1st June, 'if acceptance by the offeree has not been received by the offeror on or before that date.' On 29 May, the resident sent a written acceptance to the farm owner by post. However, the acceptance was not delivered to the farm owner until 2 June. On 4 June, the farm owner entered into a contract to sell the farm to another buyer for more money but did not inform the resident of the transaction. When the resident followed up by phone on 10 June, the farm owner told him that he had sold the farm to another buyer.",q:"Which of the following best describes the results of the above transaction?",opts:["No contract between the farm owner and the resident arose on 2 June.","An enforceable contract arose on 29 May.","An enforceable contract arose on 2 June because the farm owner's silence constituted an acceptance of the resident's message.","A voidable contract arose on 1 June.","No contract arose between the parties as post was not an acceptable method of communicating acceptance."],ans:"A",expl:"(A) No contract arose on 2 June because the farm owner's offer expired on 1 June, when the farm owner had not received the resident's acceptance. If a period of acceptance is stated in an offer, the offeree must accept within that period to create a contract. Failure to accept in time terminates the power of acceptance in the offeree (that is, a late acceptance will not be effective and will not create a contract). Under the postal rule, an acceptance is generally effective the moment it is posted in the post box. However, the postal rule does not apply where the offer states that acceptance will not be effective until received. In that case, acceptance is effective only upon receipt. Here, the farm owner opted out of the postal rule because the offer specifically stated that the acceptance must be received by 1 June to be effective. Thus, no contract was created by sending the acceptance on 29 May as there was no valid acceptance. (B) is incorrect because of the requirement that acceptance be received by 1 June. This requirement obviates the postal rule, so that the mere mailing of a letter does not operate as an effective acceptance. (C) is incorrect because the farm owner was not obligated to respond in any way to the message received on 2 June. Once the specified time passed without receipt of acceptance, the offer (as well as the resident's power of acceptance) was terminated. Thus, receipt of the message on 2 June created neither a contract nor an obligation on the part of the farm owner to respond to the message. (D) is incorrect because no contract, voidable or otherwise, arose on 1 June. As explained above, there could be no contract because acceptance of the offer was not received as specified by the offer. Also, the facts do not indicate a ground under which a contract could be voidable. A voidable contract is a contract that one or both parties may elect to avoid or to ratify (for example, contracts of minors). The facts of this question provide no basis for concluding that any contract that might have arisen between these parties would be voidable. (E) is incorrect as there is no suggestion on the basis of the facts of the scenario that the parties had excluded post as an acceptable means of communication."},{n:16,id:"ETH076",scenario:"A solicitor is instructed by a client on a complex litigation matter. As the solicitor does not know how long the matter will take, he quotes his hourly rate of £200 plus VAT in the client care letter without further explanation. At the end of the matter the client is shocked when the bill comes to £50,000 plus VAT. The client refuses to pay the bill and complains.",q:"Is the client's complaint likely to succeed?",opts:["No, because the firm could not assess the costs at the outset, so an hourly rate is the best they could be expected to provide.","No, because the client never asked for clarification about the fee.","No, provided the firm can justify the legal fees based on time spent on the file.","Yes, because the firm should have clearly explained the fees and given a realistic indication at the outset of the likely level of work involved.","Yes, because the firm was required to include a maximum fee in the client care letter."],ans:"D",expl:"(D) It is accepted that firms might not know how long a matter such as litigation might take at the outset, but the firm will be required to give the best possible information about how their matter will be proceed, which should include a reasonable estimate of the likely number of hours the matter might take together with a statement of the hourly rate (plus VAT). Therefore, (A) is incorrect. (B) is incorrect because the fact that the client did not ask for clarification on the fee has no bearing on the solicitor's duties. (C) is incorrect. The firm might try to justify the costs on this basis, but if the client was not given a reasonable estimate of hourly rate and likely number of hours at the outset, the client's complaint is likely to succeed. (E) is incorrect because the firm need not provide an exact maximum fee amount. However, the firm must give the best possible information about the likely overall cost. If the matter is being charged on an hourly basis, this would include an estimate of how many hours' work might be involved."},{n:17,id:"DIS142",scenario:"A restaurant owner is suing a meat supplier for £3,000 for failure to deliver meat within the timescales of their contract.",q:"If the restaurant owner does not include the Particulars of Claim on the N1 claim form, when must they be served?",opts:["Within 28 days of filing the claim form.","Within 28 days of serving the claim form.","Within 14 days of filing the claim form.","Within 14 days of service of the claim form.","Within 10 days of service of the claim form."],ans:"D",expl:"(D) If the Particulars of Claim (that is, a written statement setting out the details of the claimant's case) are not included on the back of the claim form, they may be in a separate written document served along with the claim form or within 14 days following service. It follows that the other time periods are incorrect."},{n:18,id:"CNL095",scenario:"A group want to hold a procession in Manchester against government policy on the Middle East. They provide the necessary notice to the police.",q:"How can the police respond to the notice?",opts:["The police can ban the procession in their absolute discretion.","The police must allow the procession to proceed without limitation.","The police can impose any conditions on the procession they deem fit.","The police can impose conditions to prevent serious disorder, damage, or disruption to the life of the community.","The police can make an application to the Home Secretary to ban the procession."],ans:"D",expl:"(D) The police can impose any conditions on the procession they believe are necessary to prevent serious disorder, serious damage, or serious disruption to the life of the community, or if the purpose of the procession is to intimidate others. This is compliant with the freedom of expression and freedom of association, as those rights can be limited for the purpose of national security or the prevention of disorder. (A), (B), and (C) are incorrect because they are too broad. As to (A), the police can ban a procession only if they believe that no conditions can be imposed to prevent serious disorder. For (B), the police can impose conditions on processions under the circumstances discussed above. As to (C), the police cannot impose any conditions they deem fit - only those discussed above. (E) is incorrect because the Home Secretary can ban processions only within London."},{n:19,id:"LGS019",scenario:"A client and a solicitor enter into a conditional fee agreement ('CFA') in a breach of contract claim. The CFA provides for a success fee of 10%. The solicitor's usual hourly rate is £250. During the course of the case, the solicitor incurs disbursements of £400 and undertakes 30 hours of work. The client loses the case and is ordered to pay the opponent's costs and disbursements.",q:"Which of the following correctly states the client's liability for his solicitor's costs under the conditional fee agreement?",opts:["The client must pay the solicitor £7,500 in fees and £400 for disbursements only.","The client must pay the solicitor £400 for disbursements only.","The client must pay the solicitor £750 in fees and £400 for disbursements only.","The client has no liability for the solicitor's costs.","The client must pay the solicitor £440 for disbursements only."],ans:"B",expl:"(B) The client must pay the solicitor £400 for disbursements. A conditional fee agreement provides that if a case is successful, the solicitor can charge their fee to the client with a percentage uplift (the success fee) beyond the normal fees charged. If the claim is unsuccessful, the client does not pay any fee to their solicitor, although they will be liable to pay the other side's costs and disbursements and their own disbursements. Here, since the client's claim was unsuccessful, they are not liable for their solicitor's fees and no success fee is owed. With regard to the solicitor's costs, the client is therefore only liable for the disbursements. (A) and (C) are incorrect as the client lost the case and so has no liability for the solicitor's fees under the conditional fee agreement. (D) is incorrect as the client is still liable for their solicitor's disbursements even if the claim is unsuccessful. (E) is incorrect because the success fee relates only to the hourly rate and not the disbursements. In any event, a success fee applies only if the client's claim is successful."},{n:20,id:"TRT057",scenario:"Three youths agreed to take a taxi without paying the fare. In the taxi they travelled to the city centre, and when the taxi stopped at traffic lights, two of them jumped out and ran off without paying the fare. The third youth was unable to jump out quickly enough and remained in the taxi. When the taxi driver realised what was happening, he set off at speed in an attempt to make sure the remaining youth did not escape without paying. The youth then jumped from the taxi as it was moving and sustained serious injuries.",q:"In an action in negligence by the youth against the taxi driver to recover damages for his injuries, which of the following best describes the likely outcome?",opts:["The taxi driver will not be liable to the youth because, in the circumstances, he did not owe the youth a duty of care.","The taxi driver will be liable to the youth, but the youth will suffer a reduction in the damages which he recovers.","The taxi driver will not be liable to the youth because the defence of illegality will apply.","The taxi driver will be liable to the youth because he intentionally set off at speed.","The taxi driver will not be liable to the youth because the youth failed to take reasonable care for his own safety."],ans:"C",expl:"(C) The taxi driver will not be liable because the defence of illegality will apply to defeat the youth's claim entirely. The youth was engaged in criminal activity by acting pursuant to a plan to make off without paying the fare, which had already been partially carried out. The defence of illegality is a rule of public policy which prevents a claimant from recovering compensation for damage suffered as a result of their own illegal actions. So, the claimant cannot recover damages for harm suffered whilst he is taking part in criminal activity (jumping out of the taxi without paying the fare). The defence of illegality is a complete defence, defeating the claim entirely. (B) is not correct because it only suggests that damages would be reduced. (A) is not correct because the taxi driver did owe the youth a duty of care (established duty owed by driver to passengers). (D) is not correct. The fact that the taxi driver intentionally set off at speed may mean that he was in breach of his duty of care. However, he is likely to escape liability for such breach because the defence of illegality will apply. (E) is not correct. Where the claimant failed to take reasonable care for his own safety, and this contributed to the injuries suffered, the defence of contributory negligence is likely to apply. The effect of this defence is not to defeat the claim entirely, but only to result in a reduction in damages. On the facts here, the youth has failed to take reasonable care for his own safety. However, rather than the partial defence of contributory negligence, he is likely to be met with the complete defence of illegality, as explained above."},{n:21,id:"TRT011",scenario:"A thief stole a car and sold it to a purchaser who acted in good faith without knowledge that the car was stolen. The purchaser had the car resprayed a different colour. The original owner of the car, from whom it was stolen, discovered what has happened and seeks damages from the purchaser.",q:"In a claim by the original owner of the car against the purchaser, which of the following statements is correct?",opts:["The original owner will only have a claim for trespass to goods, based on the fact that the car has been resprayed a different colour.","The original owner will have no claim for trespass to goods because the purchaser acted in good faith.","The original owner will have a claim for conversion because, although the purchaser was mistaken, a mistake as to ownership is no defence.","The original owner will not have a claim for conversion because the purchaser's mistake as to ownership provides a complete defence.","The original owner will not have a claim for conversion because of the mistake as to ownership, but he will have a claim for trespass to goods because the purchaser has taken possession of the car."],ans:"C",expl:"(C) The purchaser has committed the tort of conversion by dealing with the car in a way which is seriously inconsistent with the rights of the owner. Conversion requires intent, but this refers to an intention to deal with the goods, not to an intention to commit conversion. So, a mistake as to ownership is no defence. Therefore, (D) is not correct. (A) is not correct because the owner can bring a claim in conversion as well. By itself, spraying paint onto the car could amount to trespass. Here the purchaser has gone beyond trespass and assumed ownership over the car, so also committing the tort of conversion. Trespass to goods and conversion can exist concurrently, although the owner will only be able to recover one award of damages to compensate for his loss. (B) is not correct because the fact that the purchaser acted in good faith would not be a defence to trespass to goods. (E) is not correct because, as discussed above, the original owner will have a claim for conversion."},{n:22,id:"TRT031",scenario:"A man was sitting in his garden next to a busy motorway. He saw a heavy goods vehicle stop on the road because its load had caught fire. Although his garden hose was within reach, he did not get up to help put out the fire because he reasonably feared that the vehicle's fuel tank might explode. So he did nothing, and the vehicle and its load of goods were totally destroyed. The owner of the vehicle has been informed of the man's conduct and is angry that the man did nothing to help prevent the owner's loss.",q:"If the owner makes a claim in the tort of negligence against the man, which of the following statements best explains the likely outcome?",opts:["The owner could not make a successful claim because the man did not fall below a reasonable standard of care in not going to help put out the fire, as his fear of an explosion was reasonable.","The owner could make a successful claim for the whole of the owner's loss because the man breached his duty of care in not going to help put out the fire.","The owner could make a successful claim but only for the value of the vehicle and goods which were destroyed, and not for any loss of profits that he would have made on the goods because this would be pure economic loss.","The owner could not make a successful claim because the man did not owe any duty of care to the owner in respect of his failure to act.","The owner could not make a successful claim because causation cannot be established, as the man might not have been able to put out the fire even if he had gone to help."],ans:"D",expl:"(D) The owner could not make a successful claim against the man. In the tort of negligence, the general rule is that no duty of care is owed in respect of an omission to act (subject to exceptions which are not relevant on the facts of the question). (A) is not correct. It is true that the owner could not make a successful claim against the man, but (A) does not give the correct reason for this. The correct reason is that no duty of care was owed. So, the issue of breach of duty by falling below a reasonable standard of care does not arise. (B) is not correct. The owner could not make a successful claim because no duty of care was owed, as discussed above. (C) is not correct for two reasons. First, the owner could not make a successful claim because no duty of care was owed, as stated above. Second, the loss of profit on the goods which were destroyed is not pure economic loss. (E) is not correct. It is true that the owner could not make a successful claim against the man, but (E) does not give the correct reason for this. The correct reason is that no duty of care was owed, so the issue of causation of damage does not arise."},{n:23,id:"LGS035",scenario:"An employee of a firm of solicitors discovers that his team is not being considered for promotion despite having the same level of qualification and experience as employees in a different team who are being considered. When he asks his line manager about this difference, he is told that this is because the team who is being considered for promotion is available to work late nights and weekends. The employee discovers that the members of the team up for promotion are all single, which is why they are available late nights and weekends, whereas the majority of his team members are married or in civil partnerships.",q:"Under the Equality Act 2010, would the employee's team have a potential claim for discrimination against the firm?",opts:["No, because marriage/civil partnership is not a protected characteristic.","Yes, because the firm is directly discriminating against the employee's team on the grounds of marriage/civil partnership.","No, because the firm has a legitimate reason for not considering the employee's team for promotion.","Yes, because the firm is indirectly discriminating against the employee's team on the grounds of marriage/civil partnership.","No, because the firm is using proportionate means to differentiate between the employee's team and the team up for promotion."],ans:"D",expl:"(D) The employee's team would have a potential claim for indirect discrimination on the grounds of the protected characteristic of marriage/civil partnership. Indirect discrimination is when a policy or provision is apparently neutral but on closer examination puts individuals with a protected characteristic at a disadvantage compared with individuals who do not have that characteristic. Here, the firm's policy is apparently neutral in that it does not say it is only considering single employees for promotion. However, the policy puts people with a protected characteristic, here marriage/civil partnership, at a disadvantage when compared with people who don't have that characteristic. Here, all of the members of the team up for promotion due to being able to work nights and weekends are single and the majority of the team not up for promotion are married or in a civil partnership, so those who are married or in a civil partnership are put at a disadvantage compared to those who are single. (A) is incorrect because marriage/civil partnership is a protected characteristic under the Equality Act, along with age, sex, disability, gender re-assignment, pregnancy and maternity, race, religion or belief, and sexual orientation. (B) is incorrect because, as explained above, the policy is indirectly, not directly, discriminatory. (C) is incorrect because although indirect discrimination can be justified if for a legitimate reason, the firm must also show that it is achieving this reason by proportionate means. (E) is incorrect because to justify discrimination, it is not enough to use proportionate means; the firm must also show it has a legitimate aim."},{n:24,id:"CNL173",scenario:"Two friends are comparing notes from their Constitutional Law class. One friend mentions that she did not write down the definition of the term 'parliamentary privilege' when the lecturer mentioned it in class that day. She asks her friend if he took down the definition. The friend affirms that he did.",q:"Which of the following best sets out what the notes should say?",opts:["The highest source of law in the UK's legal system is an Act of Parliament.","Government ministers must support government policy in public or before Parliament.","Statements said in Parliament cannot be challenged before the courts.","During debates, members of the House of Commons and House of Lords should not refer to cases which are currently before the courts.","The courts do not question the validity of Acts of Parliament."],ans:"C",expl:"(C) Parliamentary privilege is a collection of rules which apply to members of the House of Commons and House of Lords and include the rule that statements said in Parliament cannot be challenged before the courts. (A) is incorrect as it reflects the concept of parliamentary sovereignty (sometimes call parliamentary supremacy). (B) is incorrect because it reflects the concept of collective responsibility. (D) is incorrect because it reflects the sub judicie rule. (E) is incorrect because it reflects the Enrolled Bill Rule."},{n:25,id:"CTR013",scenario:"A property owner decided to turn the garage on her property into a gym. She entered into a written agreement with a contractor who agreed to do the job personally for £12,500. The contractor was to begin work by 14 May. On 15 May, he had not yet started. The property owner telephoned the contractor, who told her that he was hired for another big job and would not work on her garage. Over a period of several months, the property owner made many calls to other local contractors, but none of them would agree to do the job for the price agreed by the original contractor. On 3 June of the following year, the property owner sued the original contractor for specific performance.",q:"Which of the following represents the contractor's best argument in his defence against the property owner's claim?",opts:["Specific performance is an equitable remedy, and because the property owner waited for over a year to sue, the equitable defence of laches (lapse of time) will apply.","Specific performance is inappropriate, because a contract for services is involved.","Specific performance is inappropriate, because nominal damages are available to the property owner.","Specific performance is inappropriate, because the property owner's failure to obtain another contractor for the job is an indication that £12,500 was an unfair price.","Specific performance is inappropriate as equity requires the party who seeks to avail themselves of an equitable remedy to come to equity 'with clean hands', that is, not to have acted in an improper manner."],ans:"B",expl:"(B) The contractor's best argument is that a contract to provide services is not specifically enforceable as you cannot compel someone to work for you. Thus, the property owner cannot obtain specific performance of the contractor's agreement to perform personal work for her. One of the prerequisites to obtaining specific performance is that a plaintiff must show that the legal remedy is inadequate. Where the innocent party has contracted for something rare or unique, money damages are inadequate compensation for loss of the bargain. Generally, the services to be performed under a contract for services are not unique and money damages can remedy a breach. Thus, specific performance is not available in such cases. In addition, even in the case of unique services, a court will not order one party to work for another, in part because such an order is tantamount to unconstitutional involuntary servitude. Another requirement for specific performance is that enforcement must be feasible. Enforcing a services contract generally would create complicated and time-consuming supervision problems and courts are reluctant to undertake it. In this case, the contractor agreed to perform work for the property owner personally. Thus, this was a contract to provide services. However, the services to be performed by the contractor were not unique or capable of being performed solely by him. The property owner could obtain adequate compensation by receiving the amount, above her contract price with the contractor, that it will cost to have someone else perform the required work (plus reasonable compensation for the delay in performance). Thus, specific performance is inappropriate here. (A) is incorrect because circumstances that would permit the defence of laches do not appear to be present. Laches is available as an equitable defence if the innocent party has unreasonably delayed in bringing the action and the delay is prejudicial to the other party. Laches does not arise automatically just because there is a delay of one year before a claim is filed. Here, there is no evidence that the property owner's delay in bringing a claim was unreasonable, given that she spent several months trying to find another contractor, or that the contractor has been prejudiced by the delay. Therefore, laches will not give the contractor a strong defence. (C) is incorrect because nominal damages would not be an adequate legal remedy. Nominal damages are appropriate where there is a breach, but no actual loss. Here, nominal damages would not compensate the property owner for the amount she will have to pay above the price agreed to by the contractor. Thus, the availability of nominal damages would not, by itself, render specific performance an inappropriate remedy. Regarding (D), a court may inquire into the relative values of agreed-upon consideration and deny an equitable remedy if it finds a contract to be unconscionable, particularly if other factors are present, such as harshness or unfairness to the defendant. But the mere fact that the property owner could not find another contractor to do the job for the price agreed upon by the contractor does not mean that the contract was unconscionable. Thus, the contractor will not succeed in his contention that specific performance should be denied on the basis that the price for which he agreed to do the work was too low. (E) is incorrect as the requirement to come to equity 'with clean hands' applies to the party seeking the remedy, in this case the property owner, and there is no suggestion of improper conduct on her part, only on the part of the contractor."},{n:26,id:"CNL174",scenario:"An American lawyer and a British solicitor are collaborating on a case involving a multi-national company with offices in both the US and the UK. The solicitor mentions the Cardinal Convention. The US lawyer says he is not familiar with that term and asks the solicitor to explain.",q:"Which of the following would be the solicitor's most accurate response?",opts:["The Monarch always acts on the advice of her ministers, in particular the Prime Minister.","The House of Lords will grant a second reading to, and will otherwise not block, legislation seeking to implement a commitment that the political party forming the government made in their manifesto at the last election.","Discussions about policy within government should be kept confidential.","The highest source of law in the UK's legal system is an Act of Parliament.","When Parliament grants a power to the Secretary of State in an Act, that power could be exercised by a civil servant within the Secretary of State's department."],ans:"A",expl:"(A) The Cardinal Convention is a convention (that is, a rule that is not law but which nonetheless is expected to be followed) which requires the Monarch to act on the advice of government ministers. (B) is incorrect because it reflects the Salisbury Convention. (C) is incorrect because it reflects an aspect of collective responsibility. (The other aspect is that government ministers will support government policy in public or before Parliament, regardless of their own views.) (D) is incorrect because it reflects parliamentary sovereignty (sometimes called parliamentary supremacy). (E) is incorrect because it reflects the Carltona Doctrine."},{n:27,id:"TAX096",scenario:"In the year ended 30 June 2020, a company had a tax adjusted trading profit of £800,200 and property income of £45,000. It also realised a chargeable capital gain of £25,000 and a capital loss of £80,000. In the prior year, the company made a tax adjusted trading profit of £520,000 and chargeable capital gains of £9,000.",q:"How much, if any, of the capital loss arising in the year ended 30 June 2020 may be carried forward to the year ended 30 June 2021?",opts:["£67,300","£80,000","£0","£55,000","£46,000"],ans:"D",expl:"(D) £55,000. Companies must offset their capital losses against their chargeable gains in the same year, and excess losses must be carried forward to be used against future chargeable gains. Capital losses cannot be carried back and cannot be used against any other type of income. Neither is the annual exemption against capital gains available to companies. Thus, we deduct the £80,000 capital loss from the 2020 tax year gain of £25,000, which leaves a negative £55,000 (loss) to be carried forward into the 2021 tax year. We ignore the trading profit (so (C) is incorrect), and the capital gain made in the year before (so (E) is incorrect)."},{n:28,id:"TRT144",scenario:"A teenager was a spectator at a motorbike race. He was standing next to the track when two of the bikes collided together just in front of him. Debris flew into the air and a piece hit the teenager on the arm, causing a minor injury. The teenager was so shocked that he has now begun to suffer from post-traumatic stress disorder ('PTSD'). Evidence shows that the crash was caused by the negligence of the race organisers.",q:"In an action by the teenager against the race organisers to recover damages for the harm he suffered, which of the following best states the likely outcome?",opts:["The teenager is likely to recover damages for both the cut to his arm and the PTSD because the PTSD was a consequence of his physical injury.","The teenager is likely to recover damages for the cut to his arm but not for the PTSD because psychiatric harm is not recoverable in the tort of negligence.","The teenager is likely to recover damages for both the cut to his arm and the PTSD because he witnessed the traumatic events with his own senses.","The teenager is likely to recover damages for both the cut to his arm and the PTSD because he was in the area of danger created by the organiser's negligence.","The teenager is not likely to recover damages for his PTSD because it was not foreseeable that he would suffer psychiatric harm as a result of such a minor injury."],ans:"A",expl:"(A) The teenager will likely be able to recover all of his damages in a negligence action. The organiser owed the teenager a duty of care in respect of the personal injury which he suffered, and this duty extends to psychiatric harm which is consequential on physical injury. The facts show that the duty was breached and that this caused the teenager's damage, both the physical injury and psychiatric harm. (B) is not correct. The teenager is likely to recover for all his injuries for the reasons set out above. Also, the statement in this choice is too broad because there are circumstances in which a duty of care is owed in respect of psychiatric harm. (C) is not correct because it does not explain the correct reason why the teenager's claim is likely to be successful. The defendant owed him a duty of care in respect of his psychiatric harm because it was consequent on physical injury, not because he witnessed events with his own senses. (D) is not correct because it does not explain the correct reason why the teenager's claim is likely to be successful. The defendant owed him a duty of care in respect of his psychiatric harm because it was consequent on physical injury, as discussed above, not because he was in the area of danger. If the claimant had been in the same place but had not suffered physical injury, then it would be correct to say that a duty was owed to him in respect of his psychiatric harm because he was in the area of danger, but that is not the case here. (E) is not correct. The fact that the teenager suffered a physical injury for which the race organiser was liable means that it is not necessary to show that the psychiatric injury from which he also suffered was reasonably foreseeable. The claimant has suffered a personal injury comprising both the physical and psychiatric harm. So long as some personal injury was foreseeable, the defendant is liable since the defendant must take its victim as it finds him."},{n:29,id:"ETH095",scenario:"A solicitor is instructed by the driver of a vehicle, who was involved in a road traffic accident involving a coach driver and is taking action against the coach driver to recover the costs of repair to his vehicle. The driver client's passenger, who is the driver client's cousin, was injured in the accident. The driver client and passenger want the same solicitor to act for them both and are willing to provide written consent. The coach driver disputes liability and alleges that the driver client was at fault, and there is some evidence to suggest that the driver client was at least partially responsible.",q:"Do the rules of professional conduct allow the solicitor to act for both the driver client and the passenger?",opts:["No, but the solicitor may refer one of the parties to a different member of the solicitor's firm.","No, because there is a significant risk of a conflict of interest.","Yes, because there cannot be a conflict of interest between family members.","Yes, because at this point there is no conflict of interest; however, should further evidence emerge to show that the driver client was at fault, the solicitor would need to cease acting for one of the parties.","Yes, because the driver client and the passenger have a substantially common interest."],ans:"B",expl:"(B) A solicitor must not act where there is a conflict of interest between clients, or a significant risk of conflict. There is a significant risk of a conflict here - there is some evidence that the driver client may be responsible for the passenger's injuries - and the solicitor should not accept instructions from them both. (A) is incorrect because a conflict covers the entire firm, not just individual solicitors within the firm. (C) is incorrect because there can be a conflict between family members. (D) is incorrect because at this point there is a significant risk of a conflict of interest. (E) is incorrect. This is not a situation that would enable the solicitor to use the 'substantially common interest' exception to the conflicts of interest provisions of the SRA Code of Conduct."},{n:30,id:"CTR117",scenario:"A double glazing company agrees with a home owner to install new windows in the homeowner's house on 15 August. On 12 August, the double glazing company telephones the homeowner and says that the windows will not be ready for installation until 22 August. The homeowner reluctantly says that they accept the delay.",q:"Can the home owner change their mind on 14 August and enforce the contract based on the original installation date?",opts:["No, there has been a binding variation of the contract.","No, the homeowner has expressly waived their right to insist on the original date.","No, the homeowner has impliedly waived their right to insist on the original date.","Yes, because the homeowner can give notice to reinstate the original date.","Yes, because there was no consideration for the homeowner's agreement to vary the date."],ans:"B",expl:"(B) The homeowner will not be able to enforce the original date because they waived their right to insist on the original date. Generally, for a variation of a contract to be enforceable, it must be supported by consideration to be enforceable. However, equity provides a way around this. Where a party promises not to enforce the other party's obligation, the courts may conclude that the agreement is at least temporarily effective through waiver. The waiving party can reinstate the original obligation. However, they must give reasonable notice. Here, the homeowner agreed that the company could delay installation, which would constitute a waiver. It is unlikely that the court would find giving notice of reinstate the day before performance was reasonable. (A) is not correct because there has not been a binding variation, because the double glazing company has not given any consideration for their agreement to accept the delay. (C) is incorrect because the waiver is express, not implied, as the homeowner expressly agreed to the delay. (D) is not correct for the reasons stated above: notice given on 14 August to insist on performance on 15 August is not reasonable. (E) is incorrect because, whilst it is right that there was no consideration and therefore no binding variation of the contract, the doctrine of waiver still prevents the homeowner from enforcing the original date."}],X1=[{n:31,id:"ELS058",scenario:"A civil lawyer has to advise their client on options in resolving a dispute between the client and the client's cousin. The client and their cousin have not been able to come to terms and so would like a neutral third party to decide the dispute for them and to issue a binding and enforceable resolution. However, the client does not want the matter to go to court as family is involved.",q:"How should the solicitor advise the client if the solicitor agrees that a binding decision from a neutral third party would be best under the circumstances?",opts:["The cousins should hire a mediator to settle the dispute given the client's goals.","The cousins should engage in independent negotiation and settlement given the client's goals.","The client must seek court resolution given the client's goals.","The cousins can hire either a mediator or an arbitrator to settle the dispute given the client's goals.","The cousins should hire an arbitrator to settle the dispute given the client's goals."],ans:"E",expl:"(E) Arbitration is a means of alternative dispute resolution in which a neutral third party (the arbitrator) hears evidence from each side and makes a binding decision. The court is not involved. (A) and (D) are incorrect because while a mediator is a neutral third party, the mediator does not settle the parties' dispute, but rather assists them in coming to their own resolution. The mediator does not issue a ruling. Therefore, since the client desires a binding and enforceable decision from a third party, advising the client to hire a mediator is not good advice. (B) is not good advice because the client and solicitor agree that resolution must come from a third party and there must be a binding decision. Negotiation takes place between the parties without the aid of a neutral third party, and that has already failed as the client and their cousin have not been able to come to terms. (C) is incorrect. Although it is true that a judge is a neutral third party who can render a binding decision, the client wants to avoid court."},{n:32,id:"CTR019",scenario:"A teacher and his friend entered into a contract for the sale of a kitten as a pet for the friend's children. After the contract had been agreed, the teacher told his friend that the kitten had a sweet nature and was good around children. However, six weeks later when the kitten is delivered, it badly scratches the friend's son's face.",q:"Would the friend succeed in an action against the teacher for misrepresentation?",opts:["No, the statement has no legal effect as it was made after the contract had been concluded.","No, the statement by the teacher was a statement of opinion not of fact.","Yes, the friend relied on the statement as to the kitten's temperament.","No, as the teacher's statement that the kitten had a sweet nature and is good around children was made innocently.","Yes, as this was a sale of goods contract, there is an implied term that the goods, in this case the kitten, would be fit for the buyer's purpose, that is, a gentle family pet."],ans:"A",expl:"(A) A misrepresentation is a statement of fact or law that induces a party to enter into the contract. (A) is therefore correct, as the statement regarding the kitten's nature was made by the teacher after the contract had been concluded, so it could not have induced the friend to buy the kitten. (B) is incorrect as, whilst it can be argued that the teacher's statement was one of opinion not fact, (A) is the better answer because of the timing of the statement. (C) is incorrect because the friend cannot have relied on the statement as an inducement to enter into the contract, as it was made after the contract was concluded. It could not therefore be a representation. Similarly, (D) is incorrect as it is irrelevant whether the statement was made fraudulently, negligently, or innocently, as it is not a representation due to the timing. (E) is incorrect. As this was a sale by a consumer, not a business, neither the Sale of Goods Act 1979 nor the Consumer Rights Act 2015 will imply a condition requiring that the kitten be suitable for the buyer's purpose."},{n:33,id:"LGS071",scenario:"A solicitor at a large firm is representing a client in the purchase of an energy company. The client's transaction is scheduled to complete next week. The solicitor is concerned that the client might be involved in money laundering. The solicitor sent an email to the Money Laundering Reporting Officer ('MLRO') setting out her concerns. However, she got an 'Out of Office' reply that indicates the MLRO is out of the office for two weeks.",q:"What action should the solicitor now take?",opts:["Report her suspicions to the National Crime Agency.","Report her suspicions to her supervisor.","Do nothing as she has already reported the matter to the MLRO.","Wait until the MLRO comes back and resubmit her suspicions.","Determine whether the firm has appointed a deputy MLRO and report her suspicions to this person."],ans:"E",expl:"(E) The solicitor's best course of action to take next is to determine whether the firm has appointed a deputy MLRO and report her suspicions to this person. When the MLRO is away, best practice is for firms to make alternative arrangements, such as appointing an alternative or a deputy MLRO and informing staff about these arrangements. The MLRO and deputy MLRO should be trained to investigate and properly handle suspicious activity reports. (A) is incorrect as it is the MLRO's (or deputy's) duty to report to the National Crime Agency. The solicitor's duty is to report to the MLRO and/or deputy MLRO as necessary. As explained above, the solicitor should first determine whether the firm has appointed an alternative or deputy MLRO. If the firm has not, only then must the solicitor report directly to the National Crime Agency. (B) is not correct because the solicitor's supervisor apparently is not the MLRO or deputy and so does not necessarily have the training needed to properly handle the matter. (C) and (D) are incorrect because the client's transaction is due to close before the MLRO returns so it would not be reasonable to wait or do nothing. Reports should be made as soon as reasonably practicable."},{n:34,id:"LGS065",scenario:"A UK solicitor has undertaken conveyancing work for a client. Over a short period of time, the client buys and sells a number of flats. The client draws money from a number of different bank accounts to pay for the flats, explaining that he maintains several companies and the various flats belong to the different companies. This allays any suspicions the solicitor has. Two months later, the solicitor discovers the client has been charged with an offence of money laundering in relation to these transactions.",q:"Which one of the following offences might the solicitor have committed?",opts:["Concealing or disguising criminal property.","Converting or transferring criminal property.","Acquiring, using, or having possession of criminal property.","Failing to report knowledge or suspicion of money laundering.","Entering into or becoming concerned in an arrangement which facilitates the retention, use, or control of criminal property by or on behalf of another person."],ans:"D",expl:"(D) The solicitor might have committed the offence of failing to report knowledge or suspicion of money laundering. Under the Proceeds of Crime Act 2002 ('POCA') it is an offence to fail to report knowledge or suspicion of money laundering. An offence can be committed if a person should have known or been suspicious in the circumstances. In other words, the test to determine the requisite mental state is an objective one. Here, the client's actions - drawing money from different bank accounts to buy and sell a number of flats - could have raised reasonable grounds for suspicion that the client was money laundering. Thus, the solicitor might have committed the offence of failure to report. (A), (C), and (E) are incorrect because they are direct money laundering offences. The solicitor is not directly involved in money laundering here such as by concealing, acquiring, or arranging. (B) is incorrect as this is not a money laundering offence under POCA."},{n:35,id:"TAX121",scenario:"A company has an accounting year end date of 31 March. It commenced trading in April 2019 and generated a trade loss of £88,000 in its first accounting period. In the second accounting period, year ended 31 March 2021, it made a capital gain on the disposal of property of £75,000. There were no other losses or profits in either accounting period.",q:"Can the company offset its trade loss of £88,000 made in the first accounting period against the chargeable gain of £75,000 in the second accounting period?",opts:["No, a trade loss can be carried forward and used only against same trade profits in a subsequent accounting period.","No, a trade loss can be offset only against trade profits from an earlier accounting period.","Yes, a trade loss can be carried forward and used against future total profits, including gains.","No, a trade loss can only be used against other income in the same year and cannot carry forward.","No, a chargeable gain can be relieved only by a capital loss."],ans:"C",expl:"(C) Yes, a trade loss can be carried forward and use
