<script>
const D={"t": ["The nature and principles of land law", "Unregistered land", "Registered land", "Freehold estates", "Leasehold estates", "Easements", "Freehold covenants", "Mortgages", "Co-ownership"], "q": [{"ch": 0, "n": 1, "sc": ["A client, who owns a large area of undeveloped land, contacts a solicitor as he has discovered reserves of coal on his land. He asks the solicitor to send him a copy of his title deeds as he has been informed by a friend that he can sell the coal unless there is an agreement with the Coal Authority confirming that they own this."], "st": "Which of the following best represents the legal position?", "o": ["For the Coal Authority to have any claim on this coal they need to have a specific legal agreement registered against the title deeds.", "There is no requirement for a specific agreement from the Coal Authority, the client is entitled to sell any coal he finds and can dig to any level he likes as he owns everything above and below his land.", "The client cannot extract this coal himself. He must ask the Coal Authority to do this for him. If they do they will cover all costs and give him 50% of the profits by way of compensation.", "There is no requirement for a specific agreement from the Coal Authority, the client is entitled to sell any coal he finds but he can only dig to 300m below the surface level.", "The client cannot extract this coal himself. All reserves of coal are owned by the Coal Authority who must grant licences for exploration and extraction of the same."], "a": "E", "bx": "The correct answer was E. This is because despite mines and minerals being included within the statutory definition of land, all mines were privatised in 1994 and as such, statute now confirms that reserves of coal will not belong to individual landowners. Options A-D are all incorrect as they suggest that the client can extract the coal, either with permission or in the absence of any legal agreement registered against the title deeds."}, {"ch": 0, "n": 2, "sc": ["A client has recently purchased a property. Upon moving in, he has realised that the previous owners have removed all light fittings and light switches and replaced these with ones of far inferior quality. They have also removed a microwave that was integrated into the fitted kitchen unit and have caused damage to the surrounding cupboards when the microwave was removed. The client has spoken to the previous owner directly who has informed him that these items were their personal possessions, and they were told by their legal adviser to remove them."], "st": "How should the solicitor advise the client when considering these specific items?", "o": ["Whether these items are classed as fixtures or chattels will depend upon the degree of annexation and the purpose of annexation. If there is any damage caused when removing these, they will be classed as fixtures; if, however, there is no damage, but the item was merely a temporary improvement then it will be a chattel. It is likely the client will only be able to make a claim for the microwave.", "If the previous owner received advice from their legal adviser to remove these items then there is nothing the client can do, even if the advice is incorrect.", "These items are all classed as chattels and the previous owner is entitled to remove them. There is nothing further the client can do.", "These items are all classed as fixtures. The previous owner should not have removed them. The client must make a claim in the small claims court to recover any money lost in replacing these items.", "Whether these items are classed as fixtures or chattels will entirely depend upon the degree of annexation only. If there is any damage caused when removing the items, they will all be classed as fixtures. The client will be able to make a claim for all items that have been removed."], "a": "A", "bx": "The correct answer was A. This is because whether an item is a fixture or a chattel is usually fairly straightforward, but where there is any ambiguity you need to consider the degree of annexation and the purpose of annexation. Here, the microwave was part of a fitted kitchen and damage has been caused when removing it, meaning it is a fixture. The light fittings and switches, however, are unlikely to have caused damage when being removed and so the purpose of annexation would be considered; here it would seem obvious that they were fitted to create a temporary improvement and so would be a chattel. Option B is incorrect as if there has been incorrect legal advice given then the client may well have a private action against that solicitor and so it is incorrect to say there is nothing he can do. Options C, D and E are incorrect as they do not consider that one of the items is a fixture and the other is a chattel."}, {"ch": 0, "n": 3, "sc": ["A client has sought advice in respect to legal ownership of the property that she lives in with her husband. She has received a copy of the title deeds and it is only her husband who has legal ownership of the property. The client informs her solicitor that she was the one who paid the full purchase price for the property at the time and is now concerned that she will have to leave the property should her husband die before her and that she will have no way of getting her money back. She is now approaching her 80th birthday and wishes to make sure all her financial affairs are in order before she updates her Will."], "st": "Which of the following best represents the client's legal position?", "o": ["The client is not shown as a legal owner on the title deeds and as such she does not have any legal ownership or entitlement to benefit from the property.", "Regardless of whether the client is shown on the title deeds, she can clearly show that she has legal ownership in the property as she has paid for the purchase of the property in full. The property will automatically transfer to her on her husband's death.", "As she has contributed to the purchase price the client will hold an interest in the property. Her husband owns the whole of the legal ownership but holds this on trust for the client by way of a resulting trust. The client is entitled to 100% of the equity if the property is sold.", "As she has contributed to the purchase price, the client will hold an interest in the property. However, as she is married this will be limited to a 50% interest. If the client's husband dies, the property will be sold, and she will receive 50% of the equity.", "As she has contributed to the purchase price, the client will hold an interest in the property. The client's husband owns the whole of the legal ownership but holds this on trust for her by way of a constructive trust. The client is entitled to 100% of the equity if the property is sold."], "a": "C", "bx": "The correct answer was C. This is because this is a clear example of a trust, which provides an equitable right to the party who does not have legal ownership of the property. Option A is incorrect as whilst it is true that the client does not have legal ownership, this also states that she has no entitlement to benefit from the property, which is incorrect. Option B is incorrect as legal ownership of property does not transfer automatically. There must always be a deed registered with HM Land Registry. Option D is incorrect as this states that the client's interest is limited to 50%; as she contributed 100% of the purchase price then it is not limited to 50% simply due to their marriage. Option E is incorrect as this refers to a constructive trust. The distinction between the resulting and constructive trust is that this was a direct contribution to the purchase price, which makes this a resulting trust."}, {"ch": 0, "n": 4, "sc": ["A Building Society has sought legal advice on their interest in 84 Lower Mast Farm, upon which they were granted a mortgage five years ago. The legal owners have defaulted on the mortgage and the Building Society wish to seek possession of the property. They have obtained a copy of the title deeds which do not show their legal interest. It has transpired that whilst the Deed was correctly executed, it was never registered with HM Land Registry."], "st": "Which of the following best represents the legal position of the Building Society?", "o": ["For a legal interest in land to be valid, there must be a valid deed and it must be executed. If this has happened then there is nothing for the Building Society to worry about and their legal interest is protected.", "For a mortgage to be a valid legal interest, there must be a valid deed, it must be executed and it must also be registered with HM Land Registry to take effect as a legal interest. If it has not been registered in this way then the mortgage will be an equitable one only. The Building Society can still assert their rights in full if they register a notice against the title deeds.", "For a mortgage to be a legal interest it must be executed and it must also be registered with HM Land Registry to take effect as a legal interest. If it has not been registered in this way then the Building Society have no way of enforcing any of their rights.", "As the Building Society has contributed towards the purchase price, they can clearly demonstrate that they have an equitable interest in the land by way of a constructive trust.", "For a mortgage to be a valid legal interest, there must be a valid deed and it must be executed and they must register a restriction in the property register of the title deeds. If these have been satisfied then there is nothing for the Building Society to worry about and their legal interest is protected."], "a": "B", "bx": "The correct answer was B. This is because this is a clear example of the principles of fairness that equity provides. It would be unjust for the mortgagee to lose their investment due to no fault of their own. The requirements have not been met for this to be a legal mortgage and so it will automatically fall to an equitable interest. They do need to register a notice against the title deeds, which is considered further in Chapters 2 and 8. Options A and E are incorrect as legal interests are only valid if they are made by a deed and registered. Option C is incorrect as it states that the Building Society have no way of enforcing their rights; however, if they register a notice against the title deed, they can enforce their rights. Option D is incorrect as the grant of a mortgage does not confer an equitable interest upon a mortgage lender by way of a constructive trust."}, {"ch": 0, "n": 5, "sc": ["A client has sought advice on the validity of an agreement made with a neighbour over the purchase of a small strip of the neighbouring land. This was a verbal agreement between them, and the neighbour told the client that the land would be left to him in his Will. The neighbour has recently died and the client has been made aware that there is no Will and the entire neighbouring estate, including the strip of land promised to him, has been inherited by the neighbour's family. They are now refusing to uphold the verbal agreement."], "st": "Does the client have any demonstrable interest in the neighbouring land?", "o": ["As the neighbour had verbally promised this land to the client there was no need for a deed. As long as the parties were in agreement with the transaction then it will be valid and the client can enforce this agreement against the neighbour's family.", "As the neighbour had verbally promised this land to the client then there was no need for a deed and the client can rely on the doctrine of promissory estoppel to enforce this agreement against the neighbour's family.", "As the neighbour has verbally promised this land to the client then there would be no legal estate demonstrated unless a deed has been signed and it has been registered with HM Land Registry. That would have then transferred the land from the legal ownership of the neighbour to the client. As this has not happened and the land has not been left in a Will then the client will have no claim against the neighbouring estate.", "As the neighbour has verbally promised this land to the client then this would be a legal interest in the land by way of right of entry. The client has the right to use the land for as long as he wishes in accordance with the agreement made.", "As the neighbour has verbally promised this land to the client then this would be an equitable right by way of a constructive trust. The client has the right to use the land for as long as he wishes in accordance with the agreement made."], "a": "C", "bx": "The correct answer was C. This is because there is no legal estate here as there is no deed and it has not been registered. The neighbour could have left the land in a Will as landowners are entitled to transfer land in this way, but as he has not done this then the rules of intestacy will apply, and the client has no claim on the estate on a verbal promise. Option A would not be the best answer since it is notoriously difficult to demonstrate a valid verbal agreement. Option B is incorrect as you do not have enough information to demonstrate that there is promissory estoppel here, which requires a person to act to their detriment on the promise of another. We do not know that the client has acted to his detriment. Option D is incorrect as rights of entry are legal interests and so must be made by a deed. Option E is incorrect as you would need to demonstrate that the client has made a significant contribution to the upkeep or other payment on the land. You do not have this information to be able to select this as an answer."}, {"ch": 0, "n": 6, "sc": ["A client asks which estates in land are capable of existing at law."], "st": "Under s 1(1) of the Law of Property Act 1925, which estates can be legal estates?", "o": ["Any estate created by deed.", "The fee simple absolute in possession and the term of years absolute.", "The fee simple and the life interest.", "The fee simple in remainder and the leasehold.", "The term of years absolute only."], "a": "B", "x": ["Wrong. A deed does not make every estate legal.", "Correct. Section 1(1) recognises only these two legal estates.", "Wrong. A life interest is equitable.", "Wrong. A fee simple in remainder is not 'in possession'.", "Wrong. The freehold is also a legal estate."]}, {"ch": 0, "n": 7, "sc": ["Two neighbours sign a written agreement for one to sell land to the other. The document contains all the agreed terms and is signed by both, but it is not a deed."], "st": "Is the contract valid?", "o": ["Yes, but only if registered.", "No, because it must be witnessed.", "No, because it must be a deed.", "Yes, a contract for the sale of land must be in writing, contain all the expressly agreed terms and be signed by or on behalf of each party.", "No, because oral contracts are required."], "a": "D", "x": ["Wrong. Registration is not a validity requirement.", "Wrong. Witnessing is not required for the contract.", "Wrong. A deed is needed for the transfer, not the contract.", "Correct. This satisfies s 2 of the Law of Property (Miscellaneous Provisions) Act 1989.", "Wrong. Oral contracts for land are void."]}, {"ch": 0, "n": 8, "sc": ["A document purporting to grant a right of way is signed by the grantor but is not witnessed."], "st": "Is it a valid deed?", "o": ["Yes, because it is in writing.", "Yes, if it is registered.", "No, because deeds must be signed by both parties.", "Yes, if it says it is a deed.", "No, because a deed signed by an individual must be signed in the presence of a witness who attests the signature, and it must be delivered."], "a": "E", "x": ["Wrong. Writing alone is insufficient.", "Wrong. Registration does not cure invalid execution.", "Wrong. Only the grantor need sign.", "Wrong. It must also be witnessed.", "Correct. Section 1 of the 1989 Act requires the document to be clear on its face that it is a deed, and to be signed, witnessed and delivered."]}, {"ch": 0, "n": 9, "sc": ["A client paid the full purchase price of a house conveyed into her son's sole name, with no intention of making a gift."], "st": "What is the likely equitable position?", "o": ["The client has a licence only.", "The son holds on a resulting trust for the client.", "The son owns the whole beneficial interest.", "The son holds on an express trust.", "The client has a legal interest."], "a": "B", "x": ["Wrong. The interest is proprietary.", "Correct. A direct contribution to the price without an intention to give raises a presumed resulting trust.", "Wrong. Equity presumes a resulting trust.", "Wrong. There is no express declaration.", "Wrong. The legal title is with the son."]}, {"ch": 0, "n": 10, "sc": ["A buyer of land is classed as 'equity's darling'."], "st": "What does this describe?", "o": ["A mortgagee in possession.", "A beneficiary under a trust.", "A bona fide purchaser of a legal estate for value without notice.", "A volunteer receiving a gift.", "A tenant in common."], "a": "C", "x": ["Wrong. Not the term.", "Wrong. Not the term.", "Correct. Such a purchaser takes free of unregistrable equitable interests in unregistered land.", "Wrong. A volunteer has not given value.", "Wrong. Not the term."]}, {"ch": 1, "n": 1, "sc": ["A client is purchasing a property which is currently unregistered. It had been legally owned by two individuals who have both died and the property is being sold by their son who is acting as their executor under the Will. The solicitor has received the title deeds and carried out a search on the Land Charges Register, which reveals a restrictive covenant. The solicitor is satisfied with the enquiries and searches and completes the transaction. The client then receives a letter from the daughter of the previous owners, claiming that she has an equitable interest in the property as she loaned some money to her parents to extend the property some ten years ago. She claims that she is owed £10,000 from the property."], "st": "Which of the following best represents the client's legal position?", "o": ["This should have been registered as a Class F land charge. The solicitor completed the necessary searches which showed no Class F entry and so the client will not be bound by this.", "This is an equitable interest that is subject to overreaching. The property was legally owned by two people and so the interest has been overreached and the daughter's equitable interest now vests in the purchase money and not the property. The client will not be bound by this.", "This is an equitable interest that is subject to overreaching. It has not been overreached as the purchase money has not been paid to two legal owners or to trustees. The client will be bound by this unless he is a bona fide purchaser of the legal estate for value without notice.", "The property was legally owned by two people but as the money has been paid to a trustee the interest has been overreached and this equitable interest now vests in the purchase money and not the property. The client will not be bound by this.", "This is an equitable interest that is subject to overreaching. It has not been overreached as the purchase money has not been paid to two legal owners or two trustees. The client will be bound by this unless he is a bona fide purchaser of the legal estate for value without notice and he can demonstrate that he has acted in good faith, and reasonable enquiries have been made."], "a": "E", "bx": "The correct answer was E. This is because the interest is one which is not a registrable land charge and so the doctrine of overreaching would have offered the client a defence mechanism. However, the money was not paid to two legal owners or two trustees and as such we then must consider the doctrine of notice to understand whether the client would be bound by this third-party equitable interest. Option A is incorrect as this is not a right which is classed as a family home right, which generally focuses on rights between married parties. Option B is incorrect as it does not matter that the land was owned by two people; what matters is who the money is paid to. The legal owners have died and so money cannot be paid to them, only their trustees or legal representatives. Option C is incorrect as it does not explore the doctrine of notice in enough detail. Option D is incorrect as, again, it does not matter who the money is paid to, but how many people it is paid to. It has only been paid to one trustee and so overreaching does not occur."}, {"ch": 1, "n": 2, "sc": ["A client claims that she has an interest in a property which was previously owned by her ex-partner. The client states that they both entered into an estate contract specifying that she would be offered first refusal to purchase the property. The client has become aware that her ex-partner has recently sold the property and she is distraught at the thought of not being given the opportunity to buy the property from him."], "st": "Which of the following best represents the legal position of this client?", "o": ["An estate contract is a legal interest and as such 'binds the world'. The new purchaser would be bound by the contract and the client can enforce the same.", "An estate contract is an equitable interest which must be registered as a land charge to be enforceable. However, if the purchaser knew about the contract then they would be bound by it and the client can enforce the same.", "An estate contract is an equitable interest which must be registered as a land charge to be enforceable. This will apply even if the purchaser knew of the existence of the contract. The purchaser will not be bound by it and the client cannot enforce the same.", "An estate contract is a legal interest and as such 'binds the world'. However, it must still be registered as a land charge to be enforceable. The client cannot enforce the same.", "An estate contract is an equitable interest which must be registered as a land charge to be enforceable. However, if the purchaser is a bona fide purchaser of the legal estate for value without notice then they will not be bound by it and the client cannot enforce the same."], "a": "C", "bx": "The correct answer was C. This is because estate contracts are registrable equitable interests. Failure to register such an interest will deem it void, even if the purchase knows of its existence. Options A and D are incorrect as an estate contract is not a legal interest. Options B and E are incorrect as the law is very clear on the types of interests that must be registered to be enforceable, estate contracts are one of those interests and so it does not matter if the purchaser knew of this in any other way - if it is not registered then it is void."}, {"ch": 1, "n": 3, "sc": ["A Building Society was granted a second mortgage over a piece of unregistered land before compulsory registration was introduced in the area. The title deeds to the property were retained by the first mortgagee. The mortgage has not been repaid in full and the Building Society have become aware that the property was recently sold. They wish to enforce the remaining mortgage against the new owner and claim they have a legal interest in the property which the new purchase is bound by."], "st": "Which of the following best reflects the legal position of the Building Society?", "o": ["As this mortgage is a puisne mortgage, it is a legal interest and, as legal interests bind the world, it will be binding on the new purchasers.", "As this mortgage is a puisne mortgage, it needs to be registered as a land charge to protect the mortgagee's legal interest.", "As this mortgage is a puisne mortgage, it needs to be registered as a land charge to protect the mortgagee's legal interest. If it is not registered then it will be subject to the doctrine of notice.", "As this mortgage is a puisne mortgage, it needs to be registered as a land charge to protect the mortgagee's legal interest. If it is not registered then the interest is void, even if the purchase has notice of the same.", "As this mortgage is a puisne mortgage, it needs to be registered as a land charge to protect the mortgagee's legal interest. If it is not registered then the purchaser will be protected by overreaching if the purchase money was paid to two trustees."], "a": "D", "bx": "The correct answer was D. This is because of similar reasons shown in question 2. This can however sometimes cause confusion when there is mention of a mortgage as there can be an automatic assumption that they are always legal rights. The important point to note is that puisne mortgages will only arise in unregistered land and are a second or subsequent mortgage, which is why they are explicitly excluded by legislation as being a legal right."}, {"ch": 1, "n": 4, "sc": ["A client is purchasing an unregistered property. The title deeds include a conveyance dated 18 January 1956 and an assent dated 6 May 1982. The conveyance contains a description of the property but no plan. The wording of the conveyance states: 'the property shown edged red on the plan contained within the conveyance dated 28 February 1955 and made between ...'. The solicitor has not been sent any other title deeds."], "st": "Which of the following best reflects the legal position?", "o": ["The current owner has provided title deeds dating back at least 15 years and showing an unbroken chain of ownership. There is a description of the property which is all that is needed and the seller has proven that he has a good root of title.", "The current owner has provided title deeds dating back at least 15 years and showing an unbroken chain of ownership. There is a description of the property but there must also be a plan to prevent there being any doubt being cast on the legitimacy of the title. The seller has not proven that he has a good root of title.", "The current owner has provided title deeds dating back at least 15 years and showing an unbroken chain of ownership. There are no other requirements necessary and the seller has proven he has a good root of title.", "The current owner has provided title deeds dating back at least 15 years and showing an unbroken chain of ownership. There is a description of the property but there must also be a plan to prevent there being any doubt being cast on the legitimacy of the title. The seller has not proven that he has a good root of title and the solicitor will need to ask to see the earlier conveyance to fully satisfy these requirements.", "The current owner has provided title deeds dating back at least 15 years and showing an unbroken chain of ownership. There are no other requirements necessary and the seller has proven he has a good root of title. The solicitor should insist upon paying the purchase money to two trustees to prevent any doubt being cast on the legitimacy of the title."], "a": "D", "bx": "The correct answer was D. A root of title is a deed which must show an unbroken chain of ownership dating back at least 15 years, but which also contains a recognisable description of the property and not cast any doubt on the legitimacy of the title. A missing plan would not meet these requirements as it does not provide an adequate description of the land in question. Option A is incorrect as a description of the land will include a plan. Option B is incorrect as it does not go far enough in the legal position of the question and further evidence is needed to fully satisfy the requirements of a good root of title. Option C is incorrect as it does not fully encompass the requirements of a good root of title and just going back 15 years is not enough. Option E is incorrect as this refers to overreaching an equitable right, which may be needed, but does not relate to the root of title to prove that this person owns the land they are selling."}, {"ch": 1, "n": 5, "sc": ["A client has recently purchased an unregistered property from a sole legal owner. The legal owner had, however, died and so the purchase money was paid to two trustees who had been appointed by the will to deal with the deceased owner's legal affairs. Shortly after moving into the property, the client is visited by a family member of the deceased legal owner claiming that they had been living in the property up until six months ago when they left to go travelling. The family member claims to have an interest in the land under a trust as they had always paid for the maintenance and upkeep of the land. The property was completely vacant and there were no personal possessions in the same at the time the client inspected the same. The client wants to know if she will be bound by this claim of an interest in the land."], "st": "Which of the following best represents the legal position of the client?", "o": ["The client has paid the purchase money to two owners or two trustees and this automatically overreaches any unknown third-party interest in the land. The client is not bound by the same.", "As the legal estate was owned by a sole owner, the third-party interest must be registered as a land charge to be valid. If it has not been registered then it will not be binding on the client.", "As the legal estate was owned by a sole owner, the third-party interest must be registered as a land charge to be valid. If it has not been registered then it will only be binding if the client did not make reasonable enquiries.", "The client has paid the purchase money to two owners or two trustees, which does not automatically overreach any unknown third-party interest in the land, but the client will not be bound by the same if they can demonstrate that they made reasonable enquiries.", "This right is a legal right and so continues to bind all future owners regardless of whether it has been registered or whether the client was aware of the same. The client will be bound by the third-party interest."], "a": "A", "bx": "The correct answer was A. This is because payment of the purchase money to two owners or two trustees is the safest way of preventing a new owner from being bound by unknown equitable interests. It is a defence mechanism for unknown equitable interests and so the doctrine of notice does not need to be considered if there is payment made in this way. This is why options B-E can be disregarded."}, {"ch": 1, "n": 6, "sc": ["A buyer of unregistered land discovers that a restrictive covenant created in 1980 was never registered as a land charge."], "st": "What is the effect?", "o": ["The covenant is a legal interest that binds anyway.", "The covenant is void against a purchaser of the legal estate for money or money's worth.", "The buyer is bound if they knew of it.", "It must be registered now by the buyer.", "It is overreached."], "a": "B", "x": ["Wrong. It is equitable.", "Correct. A Class D(ii) land charge created after 1925 is void against a purchaser for money or money's worth if not registered.", "Wrong. Notice is irrelevant for registrable charges.", "Wrong. Not the buyer's obligation.", "Wrong. Covenants are not overreachable."]}, {"ch": 1, "n": 7, "sc": ["A spouse who is not on the legal title of an unregistered matrimonial home wants to protect her right to occupy."], "st": "How should this be protected?", "o": ["By a caution against first registration only.", "It cannot be protected.", "By registering a Class C(iv) land charge.", "By a restriction.", "By registering a Class F land charge."], "a": "E", "x": ["Wrong. Not the method.", "Wrong. It can be protected.", "Wrong. C(iv) is for estate contracts.", "Wrong. Restrictions are for registered land.", "Correct. Home rights under the Family Law Act 1996 are registered as a Class F land charge in unregistered land."]}, {"ch": 1, "n": 8, "sc": ["A buyer of unregistered land needs to check the Land Charges Register."], "st": "Against what are land charges registered?", "o": ["The address of the property.", "The county only.", "The name of the estate owner at the time of creation.", "The title number.", "The name of the buyer."], "a": "C", "x": ["Wrong. Not by address.", "Wrong. County is relevant, but the search is against names.", "Correct. Land charges are registered against names, which is why name searches are needed.", "Wrong. Unregistered land has no title number.", "Wrong. Not the buyer."]}, {"ch": 1, "n": 9, "sc": ["A buyer completes the purchase of unregistered land on a sale."], "st": "What is the consequence for registration?", "o": ["The sale triggers compulsory first registration, which must be applied for within two months.", "Only a mortgage triggers registration.", "Registration is voluntary.", "The land remains unregistered.", "Registration is required within 30 days."], "a": "A", "x": ["Correct. A transfer on sale triggers first registration under s 4 of the Land Registration Act 2002.", "Wrong. A sale triggers it too.", "Wrong. It is compulsory.", "Wrong. It must be registered.", "Wrong. Not the period."]}, {"ch": 1, "n": 10, "sc": ["An equitable easement was created over unregistered land in 1990."], "st": "How should it be protected?", "o": ["Through the doctrine of notice.", "As an overriding interest.", "As a Class F land charge.", "It needs no protection.", "As a Class D(iii) land charge."], "a": "E", "x": ["Wrong. Registrable interests are not governed by notice.", "Wrong. Not relevant to unregistered land.", "Wrong. Class F is for home rights.", "Wrong. It requires registration.", "Correct. Post-1925 equitable easements are Class D(iii) land charges."]}, {"ch": 2, "n": 1, "sc": ["A solicitor is acting for the buyer of a freehold property with registered title. The solicitor is aware that there is a non-owner occupier in the property and there is a trust deed in place specifying what should happen to the sale proceeds between the current legal owner and this third party."], "st": "What will the buyer's solicitor look for when examining the register of title to the property to confirm that this third-party interest is properly registered?", "o": ["a notice referring to the trust deed in the Property Register", "a notice referring to an easement in the Proprietorship Register", "a restriction referring to the trust deed in the Charges Register", "a restriction on dealings in the Proprietorship Register", "a restriction on dealings in the Charges Register."], "a": "D", "bx": "The correct answer was D. This is because any legal interest which restricts the way in which the property is dealt with on a registrable disposition, such as how the sale proceeds are distributed, must be protected by way of a restriction in the Proprietorship Register. The answers referring to the Charges Register are incorrect as the only matters that can be recorded in the Charges Register are mortgages or other financial burdens secured against the property and other rights or interests, such as leases, rights of way or restrictive covenants. Likewise, the references to the Property Register are incorrect as that will usually only include details of the property such as the address, owners and when it was first registered and rights the property benefits from, such as rights of way."}, {"ch": 2, "n": 2, "sc": ["A solicitor has recently completed the purchase of a property for their client. The client has contacted the solicitor in a very distressed manner stating that his neighbour has started to use a path at the rear of his garden to access the local woods. When challenged, the neighbour informed him that he has an easement allowing him to do this which he granted to himself when he sold the land in 2000 and he has used the path every week since that time. There is nothing within the register of title which mentions this easement."], "st": "Which of the following best represents the client's legal position?", "o": ["The easement must be registered as a notice within the Charges Register of the register of title to be enforceable.", "Any easement which was an overriding interest prior to 2003 will continue to be an overriding interest and so will be binding on the client.", "The easement must be registered as a restriction within the Proprietorship Register to be enforceable.", "Any easement which was an overriding interest prior to 2002 will continue to be an overriding interest and so will be binding on the client.", "The easement must be registered as a notice within the Property Register to be enforceable."], "a": "B", "bx": "The correct answer was B. This is because all legal easements are registrable dispositions and so to be enforceable they must be completed by registration and noted on the Charges Register as a notice. However, you need to be aware of the dates in this question. You are told that the easement was granted in 2000 and the neighbour has used the same every week since then. This would make the easement an overriding interest and it continues to be an overriding interest. This makes options A, C and E incorrect as they all refer to entries in the register of title, which is not required for an overriding interest. This provision applies to any overriding interest created before the Land Registration Act (LRA) 2002 came into force. This is why option D is also incorrect as that states 2002, whereas the LRA 2002 did not actually come into force until 2003."}, {"ch": 2, "n": 3, "sc": ["A woman has owned a property in her sole name for the past ten years. At the time of the purchase, she granted a mortgage over the property to a Building Society. Five years ago, her partner moved in with her and contributed significantly to some extensive renovations to the property. One year ago, the woman and her partner separated and six months ago the partner moved out, but left all his personal belongings, hoping that they would reconcile, and he would then return to the property. The woman lost her job three months ago and has not been able to repay the mortgage. The Building Society are considering their legal position and may seek possession of the property. The partner has contacted a solicitor for advice."], "st": "Which of the following best reflects the partner's legal position?", "o": ["The partner can demonstrate that he has an equitable interest in the property by his financial contribution, but this will not override the interest of the Building Society as he is not currently in actual occupation of the property.", "The partner does not have any equitable interest in the property. He would have to make a claim to the small claims court to recover any money he has invested into the property.", "The partner can demonstrate that he has an equitable interest in the property by his financial contribution, but this will not override the interest of the Building Society as he was not in actual occupation of the property at the time of completion.", "The partner can demonstrate that he has an equitable interest in the property by his financial contribution, and this will override the interest of the Building Society as he has left his belongings and has an intention to return to the property.", "The partner does not have any equitable interest in the property, however if he moves back into the property before any legal action is taken by the Building Society he will be able to claim that he is in actual occupation and prevent any sale from taking place."], "a": "C", "bx": "The correct answer was C. Again, this is a question where you need to pay close attention to the dates. To be an overriding interest in this way there has to be evidence of a qualifying interest in the land, which the partner could demonstrate by his financial contribution which will likely be a constructive trust. However, this must also be coupled with actual occupation of the land, which must be at the time of 'completion'. Completion in this scenario will be the date the mortgage completed, which we know is before the partner moved in; as such, there is no way the Building Society could be aware of his occupation or make any relevant enquiries before the mortgage completed. Had the mortgage been granted after his occupation then this may very well be an overriding interest, especially if he could demonstrate his intention to return. This is why the other options are incorrect."}, {"ch": 2, "n": 4, "sc": ["A client has contacted his solicitor following the purchase of his first property to say that a woman has recently attended the property and was very surprised to see that it had been sold. She expressed that she has an interest in the property as she contributed towards the mortgage and general upkeep of the property for five years whilst she lived there with the previous owner. She has been away to university for five months but always intended to return and states that this is her home. This woman was not named as a legal owner and there was no notice or restriction in the title deeds mentioning this supposed interest. The solicitor knows that a general enquiry was made to the seller asking if there were any other occupiers, to which he replied 'no'. The client cannot recall seeing any possessions in the home that may have belonged to the woman."], "st": "How should the solicitor advise this client?", "o": ["The woman can demonstrate that she has an interest in the property by way of her contributions. Any interests of this nature are automatically overriding and binding on a future purchaser. The client will be bound by her interest.", "The woman can demonstrate that she has an interest in the property by way of her contributions. Interests of this nature must be registered as a restriction in the Charges Register to be binding on a future purchaser. As there was no mention of this in the register of title the client will not be bound by her interest.", "The woman can demonstrate that she has an interest in the property by way of her contributions. She can also demonstrate that she is in actual occupation as she only left temporarily and had full intention to return. The client will be bound by her interest.", "The woman can demonstrate that she has an interest in the property by way of her contributions. Interests of this nature must be registered as a restriction in the Proprietorship Register to be binding on a future purchaser. As there was no mention of this in the register of title the client will not be bound by her interest.", "The woman can demonstrate that she has an interest in the property by way of her contributions. She can also demonstrate that she is in actual occupation as she only left temporarily and had full intention to return. An enquiry was made about any third-party interest and the seller failed to disclose this. The client will not be bound by her interest."], "a": "E", "bx": "The correct answer was E. This is because the woman can demonstrate a third-party interest due to her contributions to the mortgage and general upkeep. She can also demonstrate that she was in actual occupation of the property due to her intention to return. However, one of the exceptions to the overriding rules applies here as a specific enquiry was made to the previous owner asking if there were any other occupiers. Leaving temporarily to go to university does not remove her occupation status and the fact that the previous owner failed to provide this information, when it was reasonable to expect him to do so, does mean that the client will not be bound by this third-party interest."}, {"ch": 2, "n": 5, "sc": ["A solicitor is acting on behalf of a client in the purchase of a house which is registered with HM Land Registry. The register of title reveals that the legal owner holds the property on trust for his two children, who are aged 18 and 21."], "st": "Which of the following should the solicitor ensure the purchase money is paid to, to ensure the client takes the house free of the beneficial interest of the children?", "o": ["To the legal owner and an appointed second trustee.", "To the children who are the beneficiaries of the trust.", "Purchase money can only be paid to the legal owner.", "To both the legal owner and the children who are the beneficiaries of the trust.", "To a separate trust company on behalf of the children."], "a": "A", "bx": "The correct answer was A. This is because, as the property is subject to a trust, the solicitor should ensure that they use overreaching to remove the beneficial interest held in the property and place it with the legal owner and a second appointed trustee. HM Land Registry permits a legal owner to appoint a second trustee simply for the purpose of overreaching. B, D and E are incorrect as we have no information about the trust - there could be conditions stating that the trust money is not paid to them until they reach a certain age. C is incorrect as the legal owner may be deceased or may have lost capacity; in that case the money would be paid to a suitable appointed person."}, {"ch": 2, "n": 6, "sc": ["A buyer completes a transfer of registered land but has not yet registered the transfer."], "st": "Who holds the legal title until registration?", "o": ["Nobody.", "The buyer.", "HM Land Registry.", "The seller, who holds it on bare trust for the buyer.", "The buyer's lender."], "a": "D", "x": ["Wrong. The seller still holds it.", "Wrong. Not until registration.", "Wrong. HM Land Registry does not hold title.", "Correct. Legal title passes only on registration under s 27 of the Land Registration Act 2002, so this is the 'registration gap'.", "Wrong. The lender does not hold the title."]}, {"ch": 2, "n": 7, "sc": ["A legal lease of five years is granted out of a registered freehold."], "st": "How does it bind a buyer of the freehold?", "o": ["It does not bind the buyer.", "As an overriding interest under Sch 3, para 1 of the Land Registration Act 2002.", "Only by a restriction.", "Only if noted on the register.", "Only if the buyer knew of it."], "a": "B", "x": ["Wrong. It binds.", "Correct. Legal leases of seven years or less override.", "Wrong. Not required.", "Wrong. Not required.", "Wrong. Notice is irrelevant."]}, {"ch": 2, "n": 8, "sc": ["A buyer wishes to rely on the Land Registry's guarantee where the register is wrong and the buyer suffers loss."], "st": "What remedy is available?", "o": ["Damages from the seller only.", "An indemnity under Sch 8 of the Land Registration Act 2002.", "Nothing.", "A refund of SDLT.", "A new title number."], "a": "B", "x": ["Wrong. Indemnity is also available.", "Correct. Schedule 8 provides for indemnity for loss caused by mistakes in the register.", "Wrong. There is a remedy.", "Wrong. Unrelated.", "Wrong. Unrelated."]}, {"ch": 2, "n": 9, "sc": ["A beneficiary under a trust of a registered house is not in actual occupation."], "st": "How can the beneficiary protect their interest against a sale by a sole trustee?", "o": ["By entering a restriction (Form A) in the proprietorship register.", "By an overriding interest.", "By a land charge.", "By a notice in the charges register.", "It cannot be protected."], "a": "A", "x": ["Correct. Trust interests are protected by restriction, so that overreaching is required.", "Wrong. Not without actual occupation.", "Wrong. Land charges are for unregistered land.", "Wrong. Trust interests cannot be protected by notice.", "Wrong. A restriction is available."]}, {"ch": 2, "n": 10, "sc": ["A buyer's solicitor inspects the property before exchange and finds an occupier who, when asked, discloses no interest."], "st": "Can the occupier later claim an overriding interest against the buyer?", "o": ["Yes, if they paid towards the price.", "Yes, if they register a notice later.", "Yes, because actual occupation always overrides.", "No, because an occupier who fails to disclose their interest on reasonable enquiry cannot rely on Sch 3, para 2.", "No, unless they are a spouse."], "a": "D", "x": ["Wrong. Contribution does not override the exception.", "Wrong. Too late.", "Wrong. There are exceptions.", "Correct. Paragraph 2(b) excludes interests not disclosed on reasonable enquiry.", "Wrong. Not relevant."]}, {"ch": 3, "n": 1, "sc": ["A client has been gifted a freehold estate in land from his uncle who has recently died. There were some specific terms of the gift including: 'the property will be transferred to my nephew until he marries'. The client is confused by what this means."], "st": "How should the solicitor advise the client when considering this term?", "o": ["The client has been gifted the property and so will receive the fee simple absolute in possession; the term has no bearing on this type of ownership.", "The client has been gifted the property but his ownership would be voidable when he marries.", "The client has been gifted the property based on a life interest and he can remain in the property for the remainder of his life.", "The client has been gifted the property but his ownership would be terminated automatically when he marries.", "The client has been gifted the property but he is free to sell it and can do so providing he is not married when the sale takes place."], "a": "D", "bx": "The correct answer was D. This is because this is an example of a determinable fee simple estate which terminates automatically on the occurrence of a specified event. As the uncle has already died, the property would then revert to the trustees. Option A is incorrect as the transfer would be subject to a trust which would include these terms and so it would always have a bearing on the ownership. Option B is incorrect as it refers to the ownership being voidable, which only applies to conditional fee simple estates. Option C is incorrect as this is not a life interest. Option E is incorrect as the client may well be able to sell the property but he would need the trustees' consent and the same terms would then apply to any other property he purchased with the sale money."}, {"ch": 3, "n": 2, "sc": ["A client has sought legal advice following the death of her elderly neighbour. She has known the neighbour all her life and knew that he did not have any relatives. On his deathbed, he told her that he did not have a Will but wanted her to live in his property for the rest of her life as she was his only 'family'. The client would like to know how the property can be transferred to her."], "st": "Which of the following best represents the legal position?", "o": ["The legal estate can be transferred providing that all formal requirements of a deed are met and the legal estate is registered.", "The legal estate does not need to be transferred and the client can live there under the terms of the verbal agreement which would be a life estate. She can live there for the rest of her life and upon her death it will transfer to the neighbour's family under the intestacy rules.", "The legal estate can be transferred but the client would hold a determinable fee simple estate and it would be terminated automatically upon the client's death.", "The legal estate cannot be transferred unless all formal requirements of a deed are met. If so, then the interest created would be a life estate and upon her death it will transfer to the neighbour's family under the intestacy rules.", "The legal estate cannot be transferred unless all formal requirements of a deed are met. If so, then the interest created would be a life estate and the client can live there for the rest of her life, and upon her death it will transfer to the Crown."], "a": "E", "bx": "The correct answer was E. This is because whilst the intentions of the neighbour may have been to allow his friend to live in his property for the rest of her life, there can be no estate or interest created in land unless there is a deed which satisfies the formal requirements of a deed. If there is a deed then the client can live there for the rest of her life. Upon her death it will revert to the Crown as you are told that the neighbour has no family and no Will. Option A is incorrect as it does not go far enough to explain the full situation that the client faces. Option B is incorrect as there cannot be the creation of this type of interest in land verbally, and it must be by way of a deed. Option C is incorrect as the death of one party can never be a determinable condition. The event must be one that is specific but may never occur. Option D is incorrect as you have been told that there is no family to inherit the estate."}, {"ch": 3, "n": 3, "sc": ["A client has recently purchased a freehold estate. He knew there had been a lease granted out of the freehold estate for a term of 55 years. The lease is due to expire next year but he wants to retain possession of the land now as he would like to redevelop the same. He wants to know how to remove the lease from the freehold estate."], "st": "How should the solicitor advise the client?", "o": ["The client owns the fee simple absolute in possession of the freehold land and so is entitled to do whatever he likes with that land.", "The client owns the fee simple absolute of the freehold land, but while there is a valid lease granted out of that freehold estate, he cannot take possession of the land. He would need to obtain a court order to remove the lease.", "The client owns the fee simple absolute of the freehold land, but while there is a valid lease granted out of that freehold estate, he cannot take possession of the land. He would need to wait until the full term of the lease has expired before he can apply to close the leasehold title and obtain possession of the land.", "The client owns the fee simple absolute of the freehold land, but while there is a valid lease granted out of that freehold estate, he cannot take possession of the land. He would need to obtain a court order to remove the lease.", "The client owns the fee simple absolute in possession of the freehold land but would still need a court order to remove the lease."], "a": "C", "bx": "The correct answer was C. This is because a legal lease will have its own separate title number and is a separate legal estate. The owner of the freehold estate will be unable to take possession of the land during the term of the lease unless there is a breach of the terms of the lease, which we will consider in more detail in Chapter 5. Option A is incorrect due to the reasons already mentioned and options B, D and E are all incorrect as they refer to court orders, which would not be available to the client simply because he wants possession of the land."}, {"ch": 3, "n": 4, "sc": ["Two clients have been granted a life estate in a freehold estate of land. The terms state: 'the property is transferred to the clients for their joint lives and will then pass to my uncle'."], "st": "Which of the following best represents the interest the clients hold in this freehold estate?", "o": ["A determinable fee simple which is voidable upon the death of one of the clients.", "A conditional fee simple which is voidable upon the death of both clients.", "A fee simple in remainder which will transfer to the uncle upon the death of both clients.", "A fee simple in remainder which will transfer to the uncle upon the death of one of the clients.", "A fee simple in reversion which will transfer to the uncle upon the death of one of the clients."], "a": "D", "bx": "The correct answer was D. This is because the use of the words 'their joint lives', means the estate will transfer to the uncle when one of the clients dies as they both need to be alive for the life interest to remain. Had he used the words 'for their lives', that would mean both of their lives as individuals. This is also an example of a fee simple in remainder as the estate will transfer to a specified third party once the life interest has come to an end. A is incorrect as a determinable fee simple can only be used for a specific but unpredictable event occurs, and although we don't know when death will occur, we know that it will definitely happen at some point. B and C are incorrect as the wording of the question makes it clear that it is on the death of one of the clients, not both. E is incorrect as the property will transfer to the uncle after the death of the clients, if it were to pass back to the original owner it would be a reversion, but as it goes to another third party it is in remainder."}, {"ch": 3, "n": 5, "sc": ["A client owns a freehold estate in land and would like to allow his friend to live there for the remainder of the client's life. Once the client dies, he would like to transfer the freehold estate to his partner and allow her to live there for the remainder of her life before eventually transferring to his children."], "st": "Which of the following best represents the estate in land that the client should create?", "o": ["A leasehold estate.", "A fee simple in remainder.", "A determinable fee simple.", "A fee simple in reversion.", "A conditional fee simple."], "a": "B", "bx": "The correct answer was B. This is because the life tenant is entitled to remain in the property until their or another's death, in this scenario that would be the client. The property will then transfer to a separate individual rather than reverting to the client (which would be an estate 'in reversion'). This can also be inherited by the client's children in the usual way if the client dies before the life tenant. The life interest would remain in place until the death of the partner, but the children would become the trustees of the same. A is incorrect as the only way to create a leasehold estate is by granting a lease of a fixed term. C and E are incorrect as there is no specified condition or determinable event which would change the ownership. D is incorrect as the property will pass to another third party after the death of the partner. If it was to transfer back to the original owner it would be a reversion, but as it passes to another person it is in remainder."}, {"ch": 3, "n": 6, "sc": ["A transfer states that land is given 'to A on condition that he never sells alcohol on it'."], "st": "What type of estate is created?", "o": ["A conditional fee simple.", "A determinable fee simple.", "A fee simple in remainder.", "A term of years.", "A life estate."], "a": "A", "x": ["Correct. Words of condition ('on condition that') create a conditional fee simple, with a right of re-entry on breach.", "Wrong. Determinable estates use words such as 'until' or 'while'.", "Wrong. Not in remainder.", "Wrong. Not a lease.", "Wrong. No life interest is created."]}, {"ch": 3, "n": 7, "sc": ["Land is left 'to my wife for life, then to my son absolutely'."], "st": "What does the son hold during the wife's lifetime?", "o": ["A legal fee simple absolute in possession.", "A lease.", "A life interest.", "Nothing.", "An equitable fee simple in remainder."], "a": "E", "x": ["Wrong. Not in possession.", "Wrong. Not a lease.", "Wrong. The wife has the life interest.", "Wrong. He has a future interest.", "Correct. The son's interest takes effect on the wife's death, so it is in remainder and equitable."]}, {"ch": 3, "n": 8, "sc": ["A freehold owner sells land with the benefit of a covenant."], "st": "What does 'absolute' mean in 'fee simple absolute in possession'?", "o": ["The owner has no mortgage.", "The land is registered.", "The owner is in occupation.", "The estate lasts for a fixed period.", "The estate is not determinable or conditional."], "a": "E", "x": ["Wrong. Mortgages do not affect this.", "Wrong. Unrelated.", "Wrong. 'In possession' covers receipt of rents too.", "Wrong. That describes a term of years.", "Correct. 'Absolute' distinguishes it from modified fees."]}, {"ch": 3, "n": 9, "sc": ["A freehold owner lets the property on a 10-year lease and receives rent."], "st": "Does the landlord still hold a fee simple absolute 'in possession'?", "o": ["Yes, because 'possession' includes receipt of rents and profits.", "No, because the tenant occupies.", "Yes, but only after the lease ends.", "No, the estate is suspended.", "No, it becomes a fee simple in reversion only."], "a": "A", "x": ["Correct. Section 205 of the Law of Property Act 1925 defines possession to include the receipt of rents.", "Wrong. Physical occupation is not required.", "Wrong. It continues during the lease.", "Wrong. Not suspended.", "Wrong. The landlord still has a legal estate in possession."]}, {"ch": 3, "n": 10, "sc": ["A gift of land states that it is 'to my daughter until she qualifies as a doctor'."], "st": "What happens when she qualifies?", "o": ["The grantor must re-enter to end it.", "It becomes a life interest.", "The estate ends automatically, as it is a determinable fee simple.", "It becomes absolute.", "It becomes a lease."], "a": "C", "x": ["Wrong. That describes a conditional fee.", "Wrong. No.", "Correct. A determinable fee simple ends automatically on the specified event.", "Wrong. It ends.", "Wrong. No."]}, {"ch": 4, "n": 1, "sc": ["A client is renting a room in a shared house. She shares the house with four other friends, each having their own bedroom, and commonly shared rooms, such as the kitchen. The original agreement between the client and the landlord stated that she could rent the room for one year. It has now been four years and she has never had a new agreement. The landlord has never visited the property and the client is not sure if the landlord has keys. The client is up to date with her rent but the landlord has recently told her he is selling the house and given her and her friends notice to vacate the property. The client is unhappy with this and would like to know if she can stay. A friend has told her she may have a legal lease."], "st": "Which of the following is the best description of the client's legal position?", "o": ["If the client can demonstrate that she has exclusive possession, then she could make a claim for a legal lease to remain in the property.", "If the client can demonstrate that she has exclusive possession and the agreement is for a fixed term, then she could make a claim for a legal lease to remain in the property.", "The client does not have exclusive possession as she shares the house with four friends and will not have a legal lease.", "The landlord should have renewed the agreement with the client each year. Failure to do so will mean the client can make a claim for a legal lease to remain in the property.", "The client does not have exclusive possession and the agreement did not stipulate a definite maximum term. This does not meet the requirements of a legal lease."], "a": "E", "bx": "The correct answer was E. This is because there are two main requirements to determine if you have a legal lease. Those are that it must grant the client exclusive possession, meaning that she must be able to exclude the landlord completely. There must also be a definite fixed term agreed from the start, and this must be an agreed maximum period, which can then be ended sooner if necessary. A, B and C are incorrect as whilst she may have exclusive possession, she does not have a definite fixed term. D is incorrect as there is no need to renew the lease each year if it continues on a week by week or month by month basis."}, {"ch": 4, "n": 2, "sc": ["A client would like to grant a new lease of a house located on his farmland. The house has been on the land for many years. The client wants to keep the landlord obligations to a 'minimum' but is happy to include a clause granting quiet enjoyment to the tenant. The client sells the property and sometime later seeks advice on a complaint that the tenant has made. The tenant of the house is claiming that the client is in breach of the quiet enjoyment covenant as the noise of the animals and machinery coming from the farm is constantly disturbing the tenant. The tenant claims that the walls of the house are not soundproofed and wants the landlord to correct this immediately."], "st": "Which of the following best represents the correct legal position of the client?", "o": ["If there is anything which is causing substantial interference with the tenant's lawful enjoyment of the land then the client is in breach of the express clause for quiet enjoyment.", "If there is anything which is causing substantial interference with the tenant's lawful enjoyment of the land, which was existing before the lease was granted, then the client is not in breach of the express clause for quiet enjoyment.", "If there is anything which is causing substantial interference with the tenant's lawful enjoyment of the land, the client is in breach of the implied clause for non-derogation from grant.", "If there is anything which is causing substantial interference with the tenant's lawful enjoyment of the land, which took effect at the point the lease was granted, then the client is not in breach of the express clause for quiet enjoyment.", "If there is anything which is causing substantial interference with the tenant's lawful enjoyment of the land then the client is in breach of the express clause for non-derogation from grant."], "a": "B", "bx": "The correct answer was B. Here we are considering either the express or implied covenant for quiet enjoyment. We know that the landlord has expressly included this in the lease and so we do not need to be concerned with answer C which talks about implied covenants. Likewise, we do not need to be concerned about answer E which make reference to non-derogation from grant as that is not applicable here. Option B is correct as it talks about interference which was existing before the lease was granted. These covenants are prospective, meaning they only take effect from the moment they are granted. The problems arising from a lack of soundproofing would have been in existence for many years before the lease was granted. Option D is incorrect as it is worded incorrectly. It states that the landlord would not be in breach of the covenant for anything which starts at the point the lease is made, which is incorrect as the landlord could possibly be in breach in that situation. A is incorrect as it is too broad and makes reference to any interference, which is incorrect as it only applies from the date the lease is granted."}, {"ch": 4, "n": 3, "sc": ["A client has sought advice as she is being sued for breach of covenant in a lease. The client owned the leasehold estate in land for five years and then sold this to the new owner last month. The original landlord still owns the freehold estate in land and he has written to her complaining that she has breached a covenant that she had agreed to when the lease was granted. The covenant was: 'to cut the grass on the garden area belonging to the landlord at least once a month during the months of March to October'. The client has not cut the grass as she no longer lives there."], "st": "Which of the following is the best advice to give to the client?", "o": ["The client is in breach of this covenant as it is personal in nature and so it is forever enforceable under the privity of contract.", "The client is not in breach of this covenant but the new owner is. All covenants remain enforceable after the original tenant has sold the land.", "The client is in breach of this covenant as it touches and concerns the land and so is forever enforceable under the privity of contract.", "The client is not in breach of this covenant and neither is the new owner. This is no longer enforceable under the privity of estate.", "The client is in breach of this covenant as it is personal in nature and so it is forever enforceable under the privity of estate."], "a": "D", "bx": "The correct answer was D. This is a clear example of a covenant which is for the personal benefit of the original landlord. As the original tenant has sold her leasehold estate she is no longer bound by this covenant. The new leasehold estate owner does not need to comply with this covenant as it does not 'touch and concern' the land. Under the privity of contract only those covenants which are not personal in nature will be binding on the new estate owner. This is why the other answers can be disregarded. A, B and E are incorrect as personal covenants are not forever enforceable, definitely not to new owners. C is incorrect as personal covenants do not 'touch and concern the land'."}, {"ch": 4, "n": 4, "sc": ["A client has sought advice as her landlord has continually failed to repair a leak in the roof of the communal areas of a block of flats. This is causing flooding in the stairwells and is extremely dangerous as the stairs are slippery. The client pays a small rent of £30 per annum under the terms of the lease, but there is an express covenant saying that the landlord is responsible for the upkeep of these communal areas."], "st": "Which of the following is the best advice to give to this client?", "o": ["The client and all other flat owners should stop paying the rent immediately. They can then pool that money together to fix the roof and recoup the costs from the landlord by non-payment of future rent.", "Only the client should stop paying the rent immediately. She would then have to pay to have the roof fixed but continue to recoup the costs from the landlord by non-payment of future rent.", "The client could stop paying the rent due to the landlord's failure to fix the roof, but she must give him notice of the issue and give him reasonable time to repair the same before she fixes it herself. The client must ensure the correct procedure is followed or she may find that the landlord makes a claim for forfeiture for non-payment of rent.", "The client is only able to make a claim to the court for specific performance to make the landlord fix the roof. There are no other remedies available to her for breach of a repair covenant.", "The client could stop paying the rent due to the landlord's failure to fix the roof, but she must give him notice of the issue and give him reasonable time to repair the same before she fixes it herself."], "a": "C", "bx": "The correct answer was C. The client can stop paying a rent, even if it is a low rent like this one. If there is an express covenant for repair obligations then breach of that can be dealt with in one of three ways; an application for damages to the court if she pays for the repair herself; however, there is no guarantee she will be successful in that, or she could apply for specific performance to order the landlord to fix the same, or she could pay to fix the roof and stop paying future rent, but she must take caution when doing so and ensure she follows the correct procedures so she is not at risk of finding herself subject to court proceedings for forfeiture due to non-payment of rent, which is why E is incorrect as it does not include this additional information. A is incorrect as whilst the client could ask all of the other flat owners to chip in, that answer does not go far enough in warning the client of the consequences of doing so, which is why that is not the best answer. B is incorrect as it does not talk about giving the landlord prior notice, which she must do. D is incorrect as she has other remedies and this type of breach is not limited to specific performance."}, {"ch": 4, "n": 5, "sc": ["A client has sought advice on a demand for payment that she has recently received. The client was the owner of a freehold estate in land and she granted a lease of a house located on the freehold land in 1994. The term of the lease was 125 years. The client then sold her freehold estate to a new landlord in 1998. She has since received a letter from the original tenant under the lease demanding payment for damage caused to her house, which has arisen by the failure of the current landlord to maintain the land, which is an express covenant in the lease. The tenant claims that the current landlord is bankrupt and cannot afford to pay for the repairs and under the terms of the lease she can seek repayment from the original landlord."], "st": "Which of the following best reflects the correct legal advice?", "o": ["The client is no longer liable for any breach of covenant on the lease and all liability passed to the new landlord on completion of the sale.", "The client is no longer liable for any breach of covenant on the lease as the sale took place post-1996. As such, all liability passed to the new landlord on completion of the sale.", "The client is liable as the lease was created pre-1996. Privity of contract still exists between the original landlord and the original tenant and so the covenants can be enforced for the duration of the lease term.", "The client is liable as the lease was created post-1996. Privity of contract still exists between the original landlord and the original tenant and so the covenants can be enforced for the duration of the lease term.", "The client is no longer liable for any breach of covenant in the lease and the tenant would need to sue the current landlord in the usual way to claim damages."], "a": "C", "bx": "The correct answer was C. You are told that the lease was created in 1994 and so you need to consider the pre-1996 rules. These clearly state that the original parties to the lease enjoy privity of contract; they are the original parties to the lease and so the covenants are enforceable between them for the duration of the lease. B and D are incorrect as they talk of the lease being created post 1996, which it was not and the question states it was created in 1994. A and E are incorrect as the lease was created pre-1996 and so there remains privity of contract between the original parties to the lease."}, {"ch": 4, "n": 6, "sc": ["A tenant takes a 'lease' of a flat for 'as long as the landlord's business continues'."], "st": "Is this a valid term of years?", "o": ["Yes, because rent is payable.", "No, because the maximum duration is uncertain (Prudential Assurance v London Residuary Body).", "Yes, if it is in writing.", "Yes, because there is exclusive possession.", "No, because leases must exceed 21 years."], "a": "B", "x": ["Wrong. Rent is not decisive.", "Correct. A term must have a certain maximum duration.", "Wrong. Writing does not cure uncertainty.", "Wrong. Certainty of term is also required.", "Wrong. No such requirement."]}, {"ch": 4, "n": 7, "sc": ["A landlord grants a three-year lease of a house orally at a market rent, with the tenant taking possession immediately."], "st": "Is the lease legal?", "o": ["No, it is a licence.", "Yes, under s 54(2) of the Law of Property Act 1925, as it is a lease of three years or less, in possession, at the best rent reasonably obtainable, without a fine.", "No, because all leases need a deed.", "No, because it must be registered.", "Yes, but only if witnessed."], "a": "B", "x": ["Wrong. Exclusive possession for a term at a rent suggests a lease.", "Correct. Section 54(2) is an exception to the deed requirement.", "Wrong. There is an exception.", "Wrong. Not registrable.", "Wrong. Not required."]}, {"ch": 4, "n": 8, "sc": ["A tenant agrees in writing to take a 10-year lease but no deed is executed. The tenant goes into possession."], "st": "What is the tenant's position in equity?", "o": ["An equitable lease under the doctrine in Walsh v Lonsdale.", "A freehold.", "No interest.", "A licence only.", "A legal lease."], "a": "A", "x": ["Correct. A specifically enforceable contract for a lease creates an equitable lease.", "Wrong. No.", "Wrong. Equity recognises the agreement.", "Wrong. More than a licence.", "Wrong. No deed, so not legal."]}, {"ch": 4, "n": 9, "sc": ["The landlord of a residential lease for a term of less than seven years is silent on repairs."], "st": "What does s 11 of the Landlord and Tenant Act 1985 imply?", "o": ["The landlord must redecorate annually.", "Nothing.", "The landlord must keep the structure and exterior, and installations for water, gas, electricity and heating, in repair.", "The tenant must repair everything.", "The tenant must insure."], "a": "C", "x": ["Wrong. Not included.", "Wrong. Obligations are implied.", "Correct. Section 11 implies these landlord obligations.", "Wrong. Not under s 11.", "Wrong. Not included."]}, {"ch": 4, "n": 10, "sc": ["A tenant breaches a covenant not to keep pets. The lease contains a forfeiture clause."], "st": "What must the landlord do before forfeiting?", "o": ["Obtain the tenant's consent.", "Serve a s 146 notice specifying the breach, requiring remedy if possible and compensation if required.", "Serve a s 17 notice.", "Wait until the lease expires.", "Nothing, the lease ends automatically."], "a": "B", "x": ["Wrong. Not required.", "Correct. Section 146 of the Law of Property Act 1925 applies to breaches other than non-payment of rent.", "Wrong. Unrelated.", "Wrong. Not required.", "Wrong. Forfeiture is not automatic."]}, {"ch": 5, "n": 1, "sc": ["A client has recently purchased a house and shortly after moving in he noticed his neighbour walking across his garden. When confronted, the neighbour informed the client that she must cross over his garden to access the park and that she has done so for over 25 years. The path is clearly visible. The only other means of accessing the park is to walk over a busy road which takes her twice as long. The client puts up a gate to prevent the neighbour from accessing his land and he has now been informed that she has made an application to the court for an easement by necessity."], "st": "Which of the following best represents the legal position?", "o": ["The neighbour's claim will be successful as she has no other means of safely accessing the park.", "The neighbour's claim will fail as she cannot prove that there has previously been a quasi-easement.", "The neighbour's claim will be successful as she can prove that it was the common intention of the parties for her to use this path.", "The neighbour's claim will fail under necessity but likely be successful if the application was made by prescription.", "The neighbour's claim will be successful. She has demonstrated that the land is
