completely landlocked."], "a": "D", "bx": "The correct answer was D. This is because necessity requires the land to be completely landlocked. Whilst it may be desirable for her to cross the land, it is not necessary. However, as she has used the right for over 20 years she could make a claim under prescription for long use. Options A and E are incorrect as they are referring to necessity and the land is not completely landlocked. Option B is incorrect as this is looking at an easement under the rule in Wheeldon v Burrows and not necessity. Option C is incorrect as it is clearly not the intention of the parties."}, {"ch": 5, "n": 2, "sc": ["A client has decided to sell a small piece of land from his very large farmland. The client will require vehicular access over the piece of land he is selling to attend to crops in an adjacent field. He has always accessed his crops in this way during his 30-year ownership of the farm."], "st": "Which of the following best represents the advice this client should be given?", "o": ["The client can continue to access the land as the easement will be implied by necessity.", "The client can continue to use the land as the easement will be implied by common intention.", "The client can continue to access the land if it is written into the deed as an express grant of an easement.", "The client can continue to use the land on the basis that he is granting an easement over part of his own land, and he exercised that same right when he owned all of that land.", "The client can continue to access the land if it is written into the deed as an express reservation of an easement."], "a": "E", "bx": "The correct answer was E. This is because the client needs continued access to the land, so this will be a reservation of an easement. If possible, it should always be written into a deed to avoid ambiguity in the future, so if the client has this opportunity then that is what he should be advised. Option A is incorrect as necessity requires the land to be completely unusable and landlocked, the question does not give any information on this being a possibility. Option B is incorrect as we do not know that this was the common intention between the parties. Option C is incorrect as he is not granting an easement, he is reserving one for himself and option D is incorrect as a seller cannot grant an easement in this way to themselves, only reserve one, which should be by deed."}, {"ch": 5, "n": 3, "sc": ["A client owns two plots of land. He sold plot A and retained plot B, where he still lives now. The client agreed with the new owner of plot A that he would reserve himself a right to use a footpath to the rear garden of plot A and this was contained in the deed. Ownership of plot A has changed again and the new owner is refusing to let the client use the footpath, stating that the only way the client can use the footpath is if the new neighbour expressly grants him an easement, which he is refusing to do."], "st": "Which of the following best represents the correct legal position?", "o": ["The neighbour is correct. A legal easement can only bind a future successor in title if the original grantor enters a new deed every time the land is sold.", "The neighbour is incorrect. Legal easements bind the world and if registered on the title deeds then this will be binding on every successor in title.", "The neighbour is correct. It is only the owner of servient land who can grant an easement over it when the land is sold.", "The neighbour is incorrect. There is clear and continued use and so the easement would be impliedly reserved into any future deed.", "The neighbour is correct. However, he could not grant the easement and it would need to be the owner of the dominant land to grant an easement over servient land."], "a": "B", "bx": "The correct answer was B. This is because the easement has been made by a deed and so, providing it is registered, all legal easements will continue to be binding on new owners of the land. Options A and C are incorrect as this is not how a legal easement operates and it may be impossible for the original grantee to enter into a new deed each time the land is sold, especially if they no longer own the adjoining land. Option D is incorrect in this scenario as it is not the best answer available. Whilst there may be a slight possibility that the easement could be implied, we know there is a deed and a legal easement will always trump an equitable one. Option E is incorrect as the owner of dominant land cannot grant themselves an easement - they would reserve themselves an easement."}, {"ch": 5, "n": 4, "sc": ["A client owns two flats in the same building, one above the other. Each flat has its own access, but there are services that are in common use with the other flat, such as drainage and chimneys. The client sells one flat and remains living in the other. She then stops the other flat owner from using the chimney by blocking it."], "st": "Which of the following best represents the legal position?", "o": ["This is an example of a quasi-easement and the neighbour will be able to make a claim for the easement to continue using the chimney.", "This is an example of a reservation of an easement by prescription due to long use.", "This is an example of a reservation of an easement by common intention.", "The client is entitled to stop any common services if she no longer needs use of the same. Providing her access is not blocked then there is no legal issue and the other neighbour would need to arrange a different means of using the chimney.", "This is an example of 'non derogation from grant' which means a person cannot grant something and then hold back rights that would make the grant useful."], "a": "E", "bx": "The correct answer was E. The new owner would still need to use the chimney after the purchase and so this is a derogation from what was expected when the right was granted. A is incorrect as we do not know from the question that the client was using the right before she sold the land. B and C are incorrect as you do not have enough information in the question to determine if either common intention or prescription are a valid option. D is incorrect as the client is not entitled to simply stop access or the use of common services and that would bring about of a claim of an easement in this way."}, {"ch": 5, "n": 5, "sc": ["A client has recently purchased a house and has encountered several difficulties with the neighbour. The client states that when she viewed the property she was told that she could park her car on a small piece of the neighbouring land. The neighbour's land is approximately one acre in size and they have a separate driveway. The client also has her own driveway. She is also unable to receive a clear television signal as the neighbour is building a large extension which is interfering with her TV signal. The client wants to claim an easement of these rights."], "st": "Which of the following best represents the client's legal position?", "o": ["The client would be able to make a claim for an easement of parking as the neighbouring land is big enough to accommodate this and it is not infringing too onerously on their own use of the land. The client cannot claim an easement for the right to a television signal as that is too vague.", "The client would not be able to claim an easement for parking as she has her own driveway, but she will be able to make a claim an easement for the right to the television signal.", "The client would be able to make a claim for an easement of parking and for the television signal, but only if the same has been in constant use for more than 20 years.", "The client would not be able to claim an easement for parking as she has her own driveway and she cannot claim an easement for the right to a television signal as that is too vague.", "The client would be able to make a claim for an easement of parking as the court would consider why the easement is necessary. If the neighbouring land is big enough to accommodate the easement and there is no possibility to park her car on her own driveway then this may be accepted. The client cannot claim an easement for the right to a television signal as that is too vague."], "a": "E", "bx": "The correct answer was E. You cannot have an easement to receive radio, telephone or other electronic signals over neighbouring land. The easement is too vague. Just because the client has a drive it does not mean that she has the means to park on it. Parking on the neighbouring drive may be the only possible parking available and so the court would consider all the circumstances. A, B, C and D are all incorrect on either one or both of the necessary elements."}, {"ch": 5, "n": 6, "sc": ["A claimant asserts a right to use a neighbour's garden as a park for recreation."], "st": "Which Re Ellenborough Park requirement is most relevant?", "o": ["Whether the right accommodates the dominant tenement.", "Whether the right was granted by deed.", "Whether the right is registered.", "Whether rent is paid.", "Whether there are two separate owners only."], "a": "A", "x": ["Correct. The right must benefit the dominant land, not merely its owner personally; in Re Ellenborough Park itself the garden right was held to qualify.", "Wrong. Formality relates to legal status, not existence.", "Wrong. Not a requirement of existence.", "Wrong. Not required.", "Wrong. Separate ownership is one requirement, but accommodation is the key issue here."]}, {"ch": 5, "n": 7, "sc": ["A claimant has used a path across neighbouring land openly, without permission and without force, for 25 years."], "st": "Which method of acquisition is most likely?", "o": ["Prescription.", "Necessity.", "Common intention.", "Section 62 LPA 1925.", "Express grant."], "a": "A", "x": ["Correct. Long use as of right (nec vi, nec clam, nec precario) for 20 years can found prescription.", "Wrong. Land not landlocked.", "Wrong. Not on the facts.", "Wrong. Requires a conveyance.", "Wrong. No deed."]}, {"ch": 5, "n": 8, "sc": ["A landowner sells part of his land. The buyer had, before the sale, used a driveway over the retained land, which was continuous and apparent and necessary for reasonable enjoyment."], "st": "Which rule may imply an easement?", "o": ["Non-derogation from grant only.", "Necessity.", "Section 2 of the 1989 Act.", "The rule in Wheeldon v Burrows.", "Prescription."], "a": "D", "x": ["Wrong. Wheeldon is the more specific rule.", "Wrong. Not landlocked.", "Wrong. Unrelated.", "Correct. Wheeldon v Burrows converts quasi-easements used by the common owner into easements on the sale of part.", "Wrong. Insufficient time."]}, {"ch": 5, "n": 9, "sc": ["A legal easement is expressly granted over registered land."], "st": "What is needed for it to be legal?", "o": ["It must be noted in the property register of the servient land.", "It must be used for 20 years.", "It must be created by deed and completed by registration.", "Nothing further.", "It must be in writing only."], "a": "C", "x": ["Wrong. It is noted in the charges register of the servient land.", "Wrong. That relates to prescription.", "Correct. Express legal easements over registered land are registrable dispositions under s 27 of the Land Registration Act 2002.", "Wrong. Registration is needed.", "Wrong. Writing alone creates at most an equitable easement."]}, {"ch": 5, "n": 10, "sc": ["A right is claimed to exclusive use of a neighbour's garage for storage."], "st": "Why may this fail as an easement?", "o": ["Because it may amount to exclusive possession, which is inconsistent with an easement.", "Because storage can never be an easement.", "Because garages are chattels.", "Because it must be registered first.", "Because easements must be positive."], "a": "A", "x": ["Correct. A right that leaves the servient owner without reasonable use (the 'ouster' principle) may fail.", "Wrong. Storage can be an easement.", "Wrong. Not relevant.", "Wrong. Not the reason.", "Wrong. Easements can be negative."]}, {"ch": 6, "n": 1, "sc": ["A client has sought legal advice as his neighbour's roof has recently fallen into disrepair and he wants to see if he can do anything about it. He shows his solicitor a deed in which the neighbour gave a covenant for the benefit of the client's house to: 'not to let the roof fall into disrepair'."], "st": "Which of the following best describes why the client is likely to be able to sue the neighbour under this covenant?", "o": ["The building scheme exception will apply.", "The doctrine of mutual benefit and burden will apply.", "It is a positive covenant.", "It is a restrictive covenant.", "The neighbour was the original party to the deed."], "a": "E", "bx": "The correct answer was E. This is because the neighbour is the original party to the deed and still the legal owner of the property, so it will always be enforceable against him. It is only if he then sells the property that you may need to consider whether it could be a building scheme, which is why option A is incorrect. Option B would not be the best answer as you do not have enough information to determine if this would apply. Options C and D are incorrect as it does not matter whether the covenant is positive or restrictive, what is required is proof that it is enforceable."}, {"ch": 6, "n": 2, "sc": ["A client has recently purchased a house and there is a covenant in the deeds stating: 'the purchaser and his successors in title must paint the fences every five years in white paint'. The previous owner owned the house for ten years and the fence was never painted."], "st": "Which of the following best describes what action the client must now take?", "o": ["No action is required as this is a positive covenant and is not binding on a successor in title.", "No action is required as this is a negative covenant and is not binding on a successor in title.", "The client must paint the fence immediately or risk being in breach of the positive covenant.", "The client must paint the fence immediately or risk being in breach of the restrictive covenant.", "The covenant has already been breached and so the client will now receive a fine."], "a": "A", "bx": "The correct answer was A. This is because this is a positive covenant, one requiring him to do something, usually at his own expense (buying paint) and so would not be enforceable on him as a future owner. Option B is incorrect as negative covenants are binding. Options C, D and E are incorrect as he is not bound by the covenant; they do not pass to a successor in title unless they have expressly agreed to the same."}, {"ch": 6, "n": 3, "sc": ["A client has asked for some legal advice. When he was considering selling his house two years ago he knew that his neighbour would be really upset if someone moved in with cats as they would ruin her vegetable patch. He included a restrictive covenant in the deed to say the purchaser cannot keep cats on the property. He sells the house and the new owner complies with the covenant. A year later, the new owner sells the property again and this subsequent owner has moved in with three cats. The neighbour calls the client very upset by this as he promised her this would never happen."], "st": "Which of the following best describes whether the client is able to enforce this covenant against the current owner?", "o": ["The client can enforce the covenant against the current owner as she is bound by the terms of the deed.", "The client can enforce the covenant against the current owner as it is a negative covenant and they are always enforceable.", "The client can enforce the covenant against the current owner as it is a positive covenant and they are always enforceable.", "The client cannot enforce the covenant against the current owner as it is a negative covenant and they are never enforceable.", "The client cannot enforce the covenant against the current owner as he no longer owns any land to be benefited by the covenant."], "a": "E", "bx": "The correct answer was E. This is because he cannot enforce a covenant where he does not own any land which benefited from the covenant at the time it was granted, which is why option A is incorrect. C is incorrect as this is not a positive covenant. B and D are incorrect as negative covenants are enforceable, but not by people who no longer have a connection to the land which benefits from the covenant."}, {"ch": 6, "n": 4, "sc": ["A building company have built ten houses on separate plots of land, which they then sell off individually to new owners. Each house is subject to the same covenants in their deeds, including a covenant stating that the owners cannot park any caravans on the driveway. A client purchased her house directly from the building company five years ago; her neighbours also bought directly from the building company but have recently sold their house to someone new who has moved in and parked his caravan on his driveway. This is blocking the client's view over the open fields."], "st": "What best describes the legal position of the client?", "o": ["The client would need to write to her Local Authority to complain.", "The client can only ask the new neighbour if he would be willing to move his caravan so her view is no longer blocked.", "The client can take legal action to enforce these covenants as they are considered a building scheme and directly enforceable between property owners.", "The client would need to contact the original building company to take legal action against the new neighbour.", "The client can only take action for her breach of her right to light and would need to file a claim with the court."], "a": "C", "bx": "The correct answer was C. This is because the client may wish to ask the neighbour to move his caravan; if he does not do so she would be able to enforce the covenant as it could be considered part of a building scheme. The original builder no longer owns any of the land and the building scheme is a way of allowing the landowners to enforce the covenants between themselves, which is why option D is incorrect. A is incorrect as the local authority would not have any involvement in the enforcement of private covenants. B is a possible option and would seem the most civil approach, but it is not a legal remedy for the client. E is incorrect as the client may not have a right to light and this could be a futile court application."}, {"ch": 6, "n": 5, "sc": ["A client has recently purchased some freehold land which contains a covenant with the local drainage authority specifying that the drainage authority would maintain the riverbanks to prevent flooding of the land. The client granted a lease over the land to a third party who wishes to use the land as a farm. This means that the client owns the freehold estate and the third party holds the leasehold estate in the land. The land has recently flooded, meaning there has been a breach of the covenant by the local drainage authority."], "st": "Which of the following best represents the party who can enforce this covenant against the drainage authority?", "o": ["Only the client can enforce the covenant as he holds the freehold estate in land and enforcement of covenants can only be between the freehold estate owners.", "Only the third party can enforce the covenant as he holds the leasehold estate in land and enforcement of covenant can only be made by the most recent estate owner.", "Neither the client or the third party can enforce the covenant and it can only be enforced by the original covenantee.", "Both the client and the third party can enforce the covenant as the benefit of the covenant has passed to them by common law.", "Both the client and the third party can enforce the covenant as the benefit of the covenant has passed to them by equity."], "a": "D", "bx": "The correct answer was D. This is because to enforce a covenant at common law you must own the legal estate; it does not specify whether this must be freehold or leasehold, which is why option A is incorrect. The only requirement of ownership of a legal estate is that it must be any legal estate. Covenants can be enforced by both the freehold and the leasehold owners. B is incorrect as the client is the original party to the deed and so is still able to take enforcement action by way of privity of contract. Option C is incorrect as covenants can be transferred to successors in title, they do not stop with the original parties to the deed. E is incorrect as the covenant has passed by common law and not equity."}, {"ch": 6, "n": 6, "sc": ["A covenant states that the covenantor will 'not build more than one house on the land'."], "st": "How is this best classified?", "o": ["An easement.", "A positive covenant.", "A profit.", "A restrictive covenant.", "A licence."], "a": "D", "x": ["Wrong. Not an easement.", "Wrong. It does not require action.", "Wrong. Not a profit.", "Correct. It restricts the use of the land without requiring expenditure.", "Wrong. Not a licence."]}, {"ch": 6, "n": 7, "sc": ["A successor to the covenantor's land breaches a restrictive covenant."], "st": "Which requirement must be satisfied for the burden to pass in equity under Tulk v Moxhay?", "o": ["The covenant must be negative, benefit the covenantee's land, be intended to run, and the successor must have notice (registration).", "The covenantee must be a company.", "The successor must agree in writing.", "The covenant must be positive.", "The covenant must be contained in a lease."], "a": "A", "x": ["Correct. These are the Tulk v Moxhay requirements.", "Wrong. Not required.", "Wrong. Not required.", "Wrong. Positive burdens do not run in equity.", "Wrong. Not required."]}, {"ch": 6, "n": 8, "sc": ["A buyer covenants to maintain a boundary wall. He later sells the land."], "st": "How can the original covenantee ensure the new owner is bound?", "o": ["By a chain of indemnity covenants or a direct covenant from each successor.", "By registering a notice.", "The burden passes automatically.", "It is impossible.", "By a restriction alone."], "a": "A", "x": ["Correct. Positive burdens do not run (Rhone v Stephens), so indirect methods are used.", "Wrong. Registration does not make the burden pass.", "Wrong. It does not.", "Wrong. Indirect methods exist.", "Wrong. A restriction can require a direct covenant, but this answer is less complete."]}, {"ch": 6, "n": 9, "sc": ["A restrictive covenant has become obsolete as the area has changed."], "st": "Which body can discharge or modify it?", "o": ["The local authority.", "The Upper Tribunal (Lands Chamber) under s 84 of the Law of Property Act 1925.", "HM Land Registry.", "The Planning Inspectorate.", "The High Court only."], "a": "B", "x": ["Wrong. Not this body.", "Correct. Section 84 gives the Upper Tribunal power to discharge or modify.", "Wrong. Not this body.", "Wrong. Not this body.", "Wrong. The tribunal is the primary forum."]}, {"ch": 6, "n": 10, "sc": ["A covenantee seeks to enforce a positive covenant using the doctrine of mutual benefit and burden."], "st": "When does Halsall v Brizell apply?", "o": ["Never in freehold land.", "Whenever any positive covenant exists.", "Where a successor takes the benefit of a right (such as use of a road) conditional on bearing a related burden (such as contributing to repair).", "Only in leases.", "Only if the covenant is registered."], "a": "C", "x": ["Wrong. It applies.", "Wrong. Only where linked.", "Correct. A successor who exercises the benefit must accept the related burden.", "Wrong. It applies to freeholds.", "Wrong. Registration is not the test."]}, {"ch": 7, "n": 1, "sc": ["A client has sought legal advice as she is purchasing a property and is granting a mortgage in the sum of £185,000 to a local bank. The mortgage terms and conditions include the following condition: 'the redemption of this mortgage can take place at any time once six months from the creation of the mortgage, but it must be redeemed by the mortgagor only'."], "st": "Which of the following reflects the best advice to provide about this term?", "o": ["That this is a general mortgage term to protect the interest of the mortgagee.", "That this is a valid term as the mortgagee has confirmed that the equitable right to redeem applies.", "This term would be invalid and unenforceable because it is an unfair term.", "This term would be considered a'clog and fetter' as it is unreasonable in its nature and there should be no restrictions on the right to redeem.", "This term would be considered a 'clog and fetter' as the mortgagee is trying to gain a collateral advantage from the mortgagor."], "a": "D", "bx": "The correct answer was D. This is because the clause could potentially make the mortgage irredeemable. If, for example, the client died she would never be able to repay the mortgage personally, therefore making the mortgage term unreasonable. A and B are incorrect as this is not or should not be a standard general or valid term. Whilst C may be a valid option for the client, unfair terms are generally governed by consumer protection legislation which may be outside the scope of advice a solicitor is permitted to give. E is incorrect as a collateral advantage is where the mortgagee tries to tie the client into some financial payments for the mortgagee's own benefit, such as insisting they take out life insurance with the mortgagee."}, {"ch": 7, "n": 2, "sc": ["A mortgage company has tried to commence repossession proceedings for non-payment of the mortgage against the mortgagor, who are a husband and wife. The wife has claimed undue influence by her husband and that she was unaware of the nature or extent of the mortgage. The mortgage money was used by the husband to try and raise money in stocks and shares. This was unsuccessful and they have now defaulted on the mortgage payments. The mortgage application stated that the purpose of the mortgage was to purchase a second property as a holiday home for both mortgagors."], "st": "Which of the following best reflects the wife's legal position in relation to the possession application?", "o": ["The wife can rely upon undue influence as there is a clear relationship of trust and confidence between the wife and her husband.", "The wife can rely upon undue influence as there is a clear legal relationship between the wife and her husband.", "Whilst there is a relationship of trust and confidence between the wife and her husband, the mortgagee was not put on notice as to the true purpose of the mortgage and so the undue influence can be rebutted.", "The wife can rely upon presumed undue influence as there is a clear relationship of trust and confidence between the wife and her husband.", "Whilst there is a relationship of trust and confidence between the wife and her husband, the mortgagee sent all the necessary legal documents to the mortgagors and so the undue influence can be rebutted."], "a": "C", "bx": "The correct answer was C. This is because whilst there is clearly a relationship of trust and confidence between husband and wife, the mortgagee did not know the true purpose of the mortgage and so they were not put on notice of the possible equitable interest of the wife and so could not take sufficient steps to protect themselves. A is incorrect as it does not go far enough in the scope of advice as with option C. B is incorrect as this is not an example of a legal relationship. D is incorrect as a relationship with presumed undue influence usually arises with a doctor-patient, solicitor-client relationship. E is incorrect as the undue influence can be rebutted if they take full steps to protect themselves, and just sending documents to the wife would not be sufficient."}, {"ch": 7, "n": 3, "sc": ["A client has sought legal advice. The client and her partner both live in the same property but her partner is the registered legal owner. The client has lived in the property since it was purchased and has always contributed to the mortgage and other significant works to the property, such as a recent extension. The client has discovered that her partner has fallen behind with the mortgage payments and there is a court hearing next week where the mortgagee is looking to take possession of the property. The client wants to stop this and has said that she will pay the mortgage and the arrears. The client is in full time employment and can afford to do this."], "st": "Which of the following best represents the legal position of the client?", "o": ["The client can ask the court to make her a party to the proceedings as a connected person. This will allow her to try and persuade the court to delay the proceedings.", "The proceedings will not be stopped as the court have no inherent jurisdiction to postpone any proceedings of this kind.", "The client can show that she is able to repay the mortgage in a reasonable time and so the proceedings would be postponed.", "The client can ask the court to consider that the mortgagee has not followed correct procedures and can ask them to postpone the proceedings as she will be extremely distraught if the property is repossessed.", "The client is not a legal owner of the property and so the court will not allow her to be involved in the proceedings in any way."], "a": "A", "bx": "The correct answer was A. This is because the client is the partner of the mortgagor and this would allow her to apply to become a party to the proceedings and ask to postpone proceedings. B and E are incorrect as the court do have inherent jurisdiction to postpone any proceedings or add a third party to the proceedings. C and D are incorrect as those would ordinarily be options available to the original mortgagor, not the third party."}, {"ch": 7, "n": 4, "sc": ["A mortgage company have recently taken possession of a residential property. They are owed £150,000 under the mortgage agreement. The property is a listed building and they have been made aware that there is valid planning and conservation area permission on the property for a full renovation, meaning the property is worth around £200,000. The mortgage company list the property with an online auction but fail to mention the relevant permissions that have been granted and they obtain £152,000 for the property, which they are very happy with as it means their mortgage is repaid in full and there is enough to cover the legal costs. The mortgagor is unhappy with this and wants advice."], "st": "Which of the following best represents the mortgagor's legal position?", "o": ["It is very unfortunate situation for the mortgagor, but the mortgage company cannot predict the property market in this way, and they are only able to sell the property for what someone is willing to pay for it.", "The mortgage company has done nothing wrong here, they have acted in good faith as they have sold the property to an unconnected person.", "The mortgage company only has an obligation to recover enough to repay the mortgage and the mortgagor should be happy with this otherwise they could have exercised their contractual rights to recover any shortfall had there been any.", "The mortgage company should not have listed the property with an online auction agent. This has breached their duty of care to the mortgagor. The mortgagor can sue the mortgage company for the £48,000 difference.", "The mortgage company had a duty to obtain a true market value of the property by providing all the relevant information to the auction agent. They may be in breach of this duty and the mortgagor could look to seek compensation between the amount received and what could have reasonably been achieved for the property."], "a": "E", "bx": "The correct answer was E. This is because when a mortgagee is granted a power of sale they have a legal obligation to obtain the true market value of the property. A mortgagee cannot simply sell the property at any price it wants to, or at an undervalue just to ensure their debt is paid off, which is why options A, B and C are incorrect. Option D is incorrect as there is no restriction on placing the property on the market with an online only agent."}, {"ch": 7, "n": 5, "sc": ["A client currently owes £122,000 on a mortgage agreement with Number 1 Bank. She then grants a further mortgage in favour of Number 2 Bank, on which she currently owes £32,000. She then grants a further mortgage in favour of Number 3 Bank, on which she currently owes £5,000. The client is now unable to pay any of the mortgage agreements and Number 2 Bank seek possession proceedings and an order to sell the property, which they are granted and recover the true market value of the property which was £150,000."], "st": "Which of the following best reflects the advice you would give in relation to how these mortgages would be repaid?", "o": ["Number 2 Bank would be required to repay the entirety of their loan first as they are the ones who sought the court orders and sold the property.", "Number 2 Bank would be required to repay all prior mortgages and then any costs and fees associated with the sale before paying their own mortgage.", "Number 2 Bank would be required to repay the entirety of their loan first as they are the ones who sought the court orders and sold the property; they would then repay Number 3 Bank as theirs is the smallest mortgage amount and Number 1 Bank would receive the surplus.", "Number 2 Bank would be required to pay £122,000 to Number 1 Bank, then £28,000 to themselves. Number 3 Bank and anyone else owed money, such as the solicitors or selling agents, would have to sue under a personal contract to recover their money.", "Number 2 Bank would be required to repay all mortgagees an equal sum proportionate to the value of their loan amount; they must leave enough to pay all associated fees and disbursements."], "a": "B", "bx": "The correct answer was B. This is because under the power of sale it specifies that all mortgages must be repaid in the order in which they were registered. So, those that are registered first in the title deeds must be repaid first, then the selling costs and then the balance to any other mortgagees who have a registered legal charge, which is why options D and E are incorrect. A and C are incorrect as Number 2 Bank are second in line with the registered mortgages and so Number 1 Bank have priority over them."}, {"ch": 7, "n": 6, "sc": ["A mortgage provides that the borrower cannot redeem for 40 years."], "st": "Is this likely to be valid?", "o": ["It may be valid if not oppressive or unconscionable, as in Knightsbridge Estates v Byrne, especially between commercial parties.", "It is valid only for residential mortgages.", "It is always valid.", "It is always void.", "It is void if over 25 years."], "a": "A", "x": ["Correct. Postponement of redemption is permitted unless it makes the right illusory or is oppressive.", "Wrong. Commercial context is relevant.", "Wrong. Not always valid.", "Wrong. Not always void.", "Wrong. No such rule."]}, {"ch": 7, "n": 7, "sc": ["A mortgagee wishes to sell the mortgaged property."], "st": "When does the statutory power of sale arise under s 101 of the Law of Property Act 1925?", "o": ["When the mortgage money becomes due (the legal redemption date has passed), provided the mortgage is by deed.", "Only with a court order.", "Only after the borrower is bankrupt.", "Only after 12 months' arrears.", "At any time after completion."], "a": "A", "x": ["Correct. The power arises when the money is due; s 103 governs when it becomes exercisable.", "Wrong. Not required.", "Wrong. Not required.", "Wrong. Not the rule.", "Wrong. Not before the money is due."]}, {"ch": 7, "n": 8, "sc": ["A residential borrower is in arrears. The lender seeks possession."], "st": "Which provision allows the court to adjourn or suspend possession?", "o": ["Section 2 of the 1989 Act.", "Section 146 of the Law of Property Act 1925.", "Section 14 TOLATA 1996.", "Section 84 of the Law of Property Act 1925.", "Section 36 of the Administration of Justice Act 1970."], "a": "E", "x": ["Wrong. Contracts for land.", "Wrong. Forfeiture of leases.", "Wrong. Trusts of land.", "Wrong. Covenants.", "Correct. Section 36 gives the court discretion where the borrower is likely to pay within a reasonable period."]}, {"ch": 7, "n": 9, "sc": ["A lender requires the borrower to buy all petrol for the business from the lender for the life of the mortgage and beyond."], "st": "What issue arises?", "o": ["It is a fixed charge.", "A collateral advantage that continues after redemption may be an unconscionable clog on the equity of redemption.", "No issue.", "It is a restrictive covenant.", "It is a valid term."], "a": "B", "x": ["Wrong. Not relevant.", "Correct. Collateral advantages surviving redemption may be struck down (Noakes v Rice).", "Wrong. There is an issue.", "Wrong. Not a covenant.", "Wrong. Not necessarily valid."]}, {"ch": 7, "n": 10, "sc": ["A mortgagee sells at the market value but the sale proceeds leave a surplus after paying the debt and costs."], "st": "What must be done with the surplus?", "o": ["It is paid to the first mortgagee only.", "It goes to the Crown.", "The mortgagee keeps it.", "It is shared equally between all lenders.", "It is held on trust for subsequent mortgagees and then the borrower, under s 105 of the Law of Property Act 1925."], "a": "E", "x": ["Wrong. No.", "Wrong. No.", "Wrong. Not permitted.", "Wrong. No.", "Correct. Section 105 governs the application of proceeds."]}, {"ch": 8, "n": 1, "sc": ["A client has sought advice on the legal ownership of a property that she has inherited. Her grandmother left a property to the client and her three cousins. The youngest cousin wants to sell the property immediately and is claiming that he does not need the client's consent to sell as they own it as tenants in common. The client believed they owned the property as joint tenants as they were all left the property at the same time in the grandmother's Will. The client and two other cousins have been registered legal owners for a year, but they held the property on trust for the youngest cousin as he was too young to be registered on the legal title. The client's cousin has recently turned 18 and so has now been registered on the legal title, and he is now saying that he wants the property sold immediately."], "st": "Which of the following is the most accurate statement of the legal position in this case?", "o": ["The client is correct - there is clearly unity of possession, interest, title and time here and so the property would be owned as a joint tenancy.", "The client is correct - there is unity of possession, interest and title, which is all that is needed to demonstrate a joint tenancy is established.", "As the cousins have all acquired their interest at different times, being when they each reached the age of 18, there is no unity of title and so a tenancy in common will be established.", "Unless they have all signed an express declaration that they wish to own the property as joint tenants, there will be a tenancy in common.", "As the cousins have all acquired their interest at different times, being when they each reached the age of 18, there is no unity of time and so a tenancy in common will be established."], "a": "E", "bx": "The correct answer was E. This is because for a joint tenancy to be established there must be unity of possession, interest, title and time, which is why option B is incorrect as 'time' is missing. A is incorrect as there is no unity of time here as the cousins all obtained their legal interest in the property when they turned 18, and unless they were all born on the same day then legal title will have been obtained on different days. C is incorrect as they do have unity of title, which occurs when they are all be registered on the title deeds once the youngest cousin has turned 18. D is incorrect as a tenancy in common does not only arise by way of an express declaration and it can also be implied by the actions of the parties."}, {"ch": 8, "n": 2, "sc": ["A client owns a property as joint tenants in law and equity with her partner. The client wishes to sever the joint tenancy and posts a letter by recorded delivery to her partner at their home address. The letter is delivered the next day and the client signs for it. The client died soon afterwards and her partner claims to have never seen the letter. Her partner would like to know if the joint tenancy has been severed."], "st": "Which of the following best represents the legal position?", "o": ["The joint tenancy in equity has not been severed. The partner must have seen the letter for this to be a valid severance.", "The joint tenancy in equity has not been severed, but the joint tenancy in law has. The partner does not need to see the letter for legal tenancy to be valid.", "The client satisfied all requirements for an effective severance by writing. The partner does not need to see the notice, but it must be posted. The fact it was sent recorded delivery will be sufficient evidence of this.", "Unless the partner murdered the client, the equitable joint tenancy will never be severed. Forfeiture is the only method that would sever a joint tenancy.", "This is clear evidence of mutual conduct to sever the equitable joint tenancy and so the severance will be valid."], "a": "C", "bx": "The correct answer was C. This is because the rules on severance of the equitable interest are very clear - all that is required is that it must be made in writing and it also needs to be posted, which is why option A is incorrect. Recorded delivery will be clear evidence that the letter has been posted and the partner does not need to see the letter for this to be valid. B is incorrect as a severance will only ever sever the equitable interest and the legal title cannot be severed. D is incorrect as there are other ways, apart from forfeiture, that will sever a joint tenancy. There is no evidence of mutual conduct here and so option E can be disregarded."}, {"ch": 8, "n": 3, "sc": ["Three clients own their property as joint tenants in law and equity. Client One has a Will which states that her share in any property that she owns at the time of her death will be gifted to her two children. A solicitor has been contacted by one of the children as their mother, Client One, has recently died and the child wants the property to be transferred to her and her brother in accordance with the Will. Clients Two and Three are refusing to discuss this with her."], "st": "Which of the following best reflects the legal position in this case?", "o": ["There is a clear tenancy in common of Client One's share as she has acted on her own share by gifting the property in her Will to her children. The children must be added to the title deeds as legal owners.", "The rules of survivorship apply in a joint tenancy and as such, upon the death of Client One, her legal and equitable share in the property will automatically vest in Clients Two and Three. Client One's children will not be entitled to a share of the property.", "There is a tenancy in common here and whilst the children will not be placed on the title deeds, they are now beneficiaries under a trust and Clients Two and Three have a legal obligation to ensure the children receive their equitable interest when the property is sold.", "Whilst the rules of survivorship apply in a joint tenancy, only the legal interest will vest in Clients Two and Three. Client One's equitable interest will pass to her children and they will receive a one-quarter share each.", "The rules of survivorship apply in a joint tenancy and as such, upon the death of Client One, her legal and equitable share in the property will automatically vest in Clients Two and Three. Client One's children will still be entitled to a share of the property but not until it is sold."], "a": "B", "bx": "The correct answer was B. Options A and C are incorrect as they both mention a tenancy in common, whereas the question explicitly states this is a joint tenancy in law and equity. D and E are incorrect as with a joint tenancy, on the death of one owner the legal and equitable interest will vest automatically with any other remaining joint tenants."}, {"ch": 8, "n": 4, "sc": ["Four friends purchase a piece of land near the seafront close to where they live. The purpose was to ensure that this particular piece of land was never developed which would possibly diminish the value of their own homes. The four friends agreed only to sell the land if the majority of them agreed. Client One wishes to sell but the other three all refuse. Client One makes an application to the court under s 14 Trusts of Land and Appointment of Trustees Act (TOLATA) 1996."], "st": "Which factors under s 15 TOLATA 1996 is the court most likely to take into consideration?", "o": ["The court will only consider the relevance of any secured creditors and it is their main propriety to ensure any mortgage is repaid.", "The court will only consider the welfare of any minors who can be expected to occupy the property and as this is a piece of land, with no property built upon it, they will order a sale.", "The court will only consider the original intention of the parties, and if that intention has changed the court must order a sale of the property.", "The court will consider any of the factors but will not order a sale of the property unless one of the owners is bankrupt.", "The court will consider the current purpose of the trust land and the original intention of the parties. If it is clear that the purpose is clear and continuing, then the court will not order a sale."], "a": "E", "bx": "The correct answer was E. This is because the court will look at a number of factors such as intention between the parties, the purpose that the property was purchased for, the welfare of any minors and whether there are any creditors who have an interest in the land. It is clear here that the original purpose of purchasing the land is still continuing. The four friends all agreed that they would only sell if the majority of them agreed to it. This has not changed and so the court would not order a sale. This is why options A, B, C and D are all incorrect as they only focus on one or two specific elements that the court will look at, but the court could look at a large number of different factors in determining a case and it is not limited to just one or two specific factors."}, {"ch": 8, "n": 5, "sc": ["A couple own a property together as joint tenants in law and equity. They have a daughter together who is 18 years old. The couple's relationship breaks down and Client One moves out of the property with their daughter. Some months later Client Two writes to Client One stating that he 'wishes to sever the joint tenancy with immediate effect'. Client Two immediately regrets this decision and breaks into Client one's new home and destroys the letter before Client One can see it. Client Two unfortunately dies two weeks later and his brother contacts Client One to state that he has been left his brother's half share in the property in the Will. The brother wishes to sell the property to release his share but Client One is refusing."], "st": "Which of the following best reflects the correct legal advice?", "o": ["The brother does have a legal right over the property as a beneficiary under a trust, and could ask the court to order a sale. It would appear that the original intention of the parties is no longer subsisting, and the court may force a sale.", "The brother does have a legal right over the property as a beneficiary under a trust, but the court must firstly give consideration to any creditors. If they do not wish to sell the property, then the court will not force a sale.", "The brother does not have any legal right over the property as the rule of survivorship will apply here as the tenancy was not correctly severed. Clients One and Two were still joint tenants in equity and law and the full property will transfer to Client One on the death of Client Two.", "The brother does not have any legal right over the property as even though the joint tenancy was effectively severed, Client Two's share of the property will automatically transfer to his daughter.", "The brother does have a legal right over the property as a beneficiary under a trust, and whilst the original intention of the parties may still be subsisting, the court will also take into account the welfare of any minors. As there is a child who is entitled to live in the property the court will not force a sale."], "a": "A", "bx": "The correct answer was A. This is because it is clear here that the joint tenancy has been severed. The letter was posted and it does not matter that it has not been seen by the other person. This means that the rule of survivorship does not apply, which is why option C is incorrect. B is incorrect as the rights of any creditors is not the most important factor for the court to consider. Option D is incorrect as, even though Client Two has a daughter, he has made clear provisions in his Will for his share in the property to pass to his brother; this express declaration takes precedent over other family members who may have been entitled to inherit the asset. Option E is incorrect as Client One moved out with the daughter and so it is no longer meeting that intention. The welfare of a minor will not be a factor as the child of the parties is now an adult."}, {"ch": 8, "n": 6, "sc": ["Two friends buy a house. The transfer says they hold 'in equal shares'."], "st": "How do they hold the beneficial interest?", "o": ["As trustees for the Crown.", "As tenants in common, as 'in equal shares' is a word of severance.", "As tenants in common at law.", "As joint tenants.", "As joint tenants in equity and at law with survivorship."], "a": "B", "x": ["Wrong. No.", "Correct. Words of severance create a tenancy in common in equity.", "Wrong. The legal title must be held as joint tenants.", "Wrong. Not with words of severance.", "Wrong. Survivorship does not apply."]}, {"ch": 8, "n": 7, "sc": ["Co-owners hold the legal title."], "st": "How must the legal estate be held?", "o": ["By any number of owners.", "By the eldest owner only.", "As tenants in common up to four.", "As joint tenants, by a maximum of four trustees.", "As tenants in common."], "a": "D", "x": ["Wrong. Maximum four.", "Wrong. No.", "Wrong. Not possible.", "Correct. Section 1(6) and s 34 of the Law of Property Act 1925 require a legal joint tenancy, and s 34 of the Trustee Act 1925 caps the number of trustees at four.", "Wrong. Not possible at law."]}, {"ch": 8, "n": 8, "sc": ["A joint tenant in equity becomes bankrupt."], "st": "What is the effect on the joint tenancy?", "o": ["The other joint tenant becomes the owner.", "No effect.", "It is severed, and the bankrupt's share vests in the trustee in bankruptcy.", "The legal title is severed.", "The bankrupt loses all interest without severance."], "a": "C", "x": ["Wrong. No.", "Wrong. There is an effect.", "Correct. Bankruptcy operates as an involuntary alienation, severing the equitable joint tenancy.", "Wrong. Legal title cannot be severed.", "Wrong. Severance occurs."]}, {"ch": 8, "n": 9, "sc": ["A joint tenant mortgages her equitable interest without the other's knowledge."], "st": "What is the effect?", "o": ["It severs the joint tenancy as an act operating on her own share.", "It is void.", "It makes the other a mortgagor.", "It severs the legal title.", "No effect."], "a": "A", "x": ["Correct. Dealing with one's own share is a Williams v Hiscock act of alienation, which severs.", "Wrong. Not void.", "Wrong. No.", "Wrong. Not legal title.", "Wrong. There is an effect."]}, {"ch": 8, "n": 10, "sc": ["A beneficiary under a trust of land wants the court to order a sale."], "st": "Under which provision is the application made?", "o": ["Section 15 TOLATA 1996.", "Section 36 of the Administration of Justice Act 1970.", "Section 84 of the Law of Property Act 1925.", "Section 30 of the Law of Property Act 1925.", "Section 14 TOLATA 1996."], "a": "E", "x": ["Wrong. Section 15 contains the factors, not the power.", "Wrong. Mortgage possession.", "Wrong. Covenants.", "Wrong. Repealed.", "Correct. Section 14 permits applications; s 15 lists the factors."]}]},Q=D.q,L="ABCDE";let i=0,A={};

else w.classList.add('hidden');
