r qualified by the state under any circumstances. (B) is incorrect because the state has no ability to restrict absolute rights. (C) is incorrect because it refers to limited rights. (D) and (E) are incorrect because the courts cannot 'approve' a breach of an absolute right.",note:"The source refers to Article 5 ECHR as the article prohibiting retrospective criminal offences (the prohibition is in Article 7 ECHR). The facts are reproduced as they appear in the source."},{n:2,id:"CNL125",scenario:"The High Court has to interpret a regulation that has been preserved as direct EU legislation. In a judgment from 2021, the CJEU authoritatively provided a definition of a key part of the regulation. This part of the regulation is relevant to the case before the High Court.",q:"Which of the following best explains how the High Court should approach the CJEU judgment?",opts:["The High Court must refer the matter to the Supreme Court.","The High Court must follow the CJEU judgment because it is retained domestic case law.","The High Court may follow the CJEU judgment because it is retained EU case law.","The High Court must follow the CJEU judgment because the regulation is retained EU law.","The High Court may follow the CJEU judgment even though the regulation is retained EU law."],ans:"E",expl:"(E) The High Court may follow the CJEU judgment even though the regulation is retained EU law. Generally, the UK courts are not bound by any judgments made by the CJEU after the end of the transition period (that is, December 2020), even if those decisions relate to retained EU law. Rather, the courts may 'have regard' for those decisions (that is, treat them as persuasive precedent). Thus, the High Court may follow the CJEU judgment because it was issued after the transition period, despite the fact that the regulation has been preserved as direct EU legislation, a type of retained EU law. (A) is incorrect because the High Court cannot make a reference to the Supreme Court in this way. (B) is incorrect because the CJEU judgment is not part of retained domestic case law. It is not a decision from the domestic courts, and it was handed down after the end of the transition period. (C) is incorrect because the CJEU judgment does not form part of retained EU case law. As mentioned, it was handed down after the end of the transition period. (C) is also incorrect because it erroneously suggests that the High Court need not follow retained EU case law. (D) is incorrect because that choice best explains the position if the CJEU judgment was issued before the end of the transition period."},{n:3,id:"BSL159",scenario:`Three friends established a dog walking business as a partnership. They agreed to share all profits in the ratio in which they had contributed capital: Partner 1 £10,000; Partner 2 £8,000; Partner 3 £2,000.
This year the business made a profit of £90,000.`,q:"How will the profit be shared?",opts:["Partner 1 will receive £30,000.","Partner 1 will receive £10,000.","Partner 2 will receive £36,000.","Partner 2 will receive £8,000.","Partner 3 will receive £18,000."],ans:"C",expl:`(C) The partners agreed to share profits in the same proportion that they contributed capital. In total the partners contributed £20,000 capital, so the profits are shared:
Partner 1: £10,000/£20,000 = one-half of all profits
Partner 2: £8,000/£20,000 = 2/5 of all profits
Partner 3: £2,000/£20,000 = 1/10 of all profits
If the partnership has profits of £90,000, then Partner 1 receives half (£45,000), Partner 2 receives 2/5 (£36,000), and Partner 3 receives 1/10 (£9,000). (C) is the only choice that reflects one of these figures.`},{n:4,id:"DIS257",scenario:"A specified sum claim has a total value of £80,000 but the defendant has admitted liability and has already made an interim payment of £20,000, paid to settle a specific ring-fenced element of the claim in its entirety.",q:"Which of the following best indicates the claim value which the claimant should state on the claim form?",opts:["£80,000.","£60,000.","£80,000 plus interest accrued to date.","£80,000 plus interest accrued to date and costs.","£60,000 plus interest accrued to date."],ans:"B",expl:"(B) In a debt claim (that is, a claim for a specified sum), the claim value should reflect the amount of the claim in dispute. An interim payment has been made of £20,000. The amount remaining in dispute in £60,000. This should be the amount quoted on the claim form as representing the claim value. (A) is incorrect because £80,000 includes the interim payment which has already been made. The defendant did not express the payment to be without prejudice and they intended to settle the specific aspect of the claim in its entirety. Therefore, this sum is no longer in dispute and should not be included in the disputed amount. (C) is incorrect because the accrued interest appears separately and independently, so it should not be included in the statement of value. Also £80,000 includes the interim payment. (D) is incorrect because costs are separately and specifically identified on the claim form. Therefore, costs should not be included when calculating the statement of value. (E) is incorrect because although £60,000 is the correct value as explained above, the claimant should not add the interest to it for the purpose of the statement of value."},{n:5,id:"ELS004",scenario:"Parties enter a contract for the sale of stocks and shares of a company. The Statute of Frauds of 1677 provides that a contract for the sale of goods, wares, and merchandise for £10 or more must be evidenced by a signed writing.",q:"Which of the following would be most appropriate rule of language for determining whether the contract for the stock must be evidenced by a writing?",opts:["Expressio unius est exclusio alterius.","Noscitur a sociis.","In pari materia.","Ejusdem generis.","The literal rule."],ans:"A",expl:"(A) Under this legal maxim, if one or more things of a class are expressly mentioned in a statute, the things not mentioned are excluded. (B) is incorrect because noscitur a sociis simply means that words are interpreted in the context of the words that surround it. Since the word stock or share is not within the Statute of Frauds provision this is not helpful here. (C) is incorrect because in pari materia is a rule of language that considers other statutes on the same subject to interpret the statute in question. Since we have no other statute here to help, this rule is not helpful here. (D) in incorrect. Ejusdem generis is not helpful here as it is used to interpret the meaning of a general word when more specific words follow it. Goods, wares, and merchandise all seem a bit general and so do not help here. (E) The literal rule is incorrect because it is a rule of interpretation rather than one of language."},{n:6,id:"TRT142",scenario:"A woman was part of a large crowd watching an air display. Suddenly two of the planes collided and crashed in flames. Both pilots were killed. There was no danger to the spectators as they were well away from the site of the crash, but the woman was extremely shocked by what she saw and began to suffer from post-traumatic stress disorder ('PTSD') as a result. Evidence shows that the crash was caused by the negligence of the display organiser.",q:"In an action by the woman against the display organiser to recover damages for her PTSD, which of the following best states the likely outcome?",opts:["The woman is not likely to be successful because psychiatric harm is never recoverable in the tort of negligence.","The woman is likely to be successful because the display organiser was in breach of its duty of care to the woman.","The woman is not likely to be successful because she was part of a large crowd of spectators, all of whom could have suffered from psychiatric harm.","The woman is not likely to be successful because she did not know personally the pilots who were the victims of the crash.","The woman is likely to be successful because it was reasonably foreseeable that witnessing such a shocking event could cause psychiatric harm."],ans:"D",expl:"(D) The woman is not likely to be successful. For a successful claim in the tort of negligence, the woman must show that the organiser owed her a duty of care. Under the circumstances here, she will not be able to do so. The woman has suffered psychiatric harm without any physical impact. She was not in the area of danger, so she is a secondary victim. No duty of care is owed to a secondary victim unless she can show that: (1) she suffered from a medically recognised psychiatric condition; (2) psychiatric harm was foreseeable in a person of ordinary fortitude; (3) she was present at the accident or its immediate aftermath; (4) she witnessed the events with her own unaided senses; and (5) she had close ties of love and affection with the immediate victim. On the facts, the woman satisfies all of these requirements except the last one. She did not know personally the pilots who were the victims of the attack, so no duty of care was owed to her in respect of her psychiatric harm. (A) is not correct because the statement is too broad. It is true that in some circumstances no duty of care is owed in respect of psychiatric harm caused without physical impact. However, it is not correct to say that psychiatric harm is never recoverable. (B) is not correct. Under the circumstances, the organiser did not owe the woman a duty of care, as discussed above. (C) is not correct because it does not state the correct reason why the woman is not likely to be successful. The claim is not likely to be successful because she did not know the victims. (E) is not correct. It is true that, where the claimant is a secondary victim, psychiatric harm must be reasonably foreseeable. However, this is not the only requirement for a duty to arise; all of the requirements discussed above must be satisfied."},{n:7,id:"LGS060",scenario:"A solicitor and several of his colleagues are in a meeting with a client. During the meeting, the client makes some statements that lead the solicitor to believe that the client may be involved in money laundering.",q:"What action should the solicitor now take?",opts:["Tell the client about his suspicions and stop offering services to them.","Tell the client about his suspicions and that he will have to put things on hold until an internal investigation clears them.","Tell the client about his suspicions but continue with the engagement unless an investigation confirms that they are involved in money laundering.","Say nothing to the client about the suspicions, leave the meeting quietly, and call the police.","Say nothing to the client about the suspicions and contact the firm's Money Laundering Reporting Officer to make a report after the meeting."],ans:"E",expl:"(E) The solicitor's best course of action is to say nothing to the client about the suspicions and contact the firm's Money Laundering Reporting Officer ('MLRO') to make a report after the meeting. Solicitors have obligations under the Proceeds of Crime Act 2002 ('POCA') to make disclosures of suspicions of money laundering (known as 'suspicious activity reports'). The MLRO is the person within an organisation designated to receive disclosures under POCA and to make disclosures to the National Crime Agency. (A), (B), and (C) are incorrect because there is an affirmative duty to not tip of the client that you are reporting them. Under POCA, it is an offence to disclose to a third person that a suspicious activity report has been made to the authorities if that disclosure might prejudice any investigation that might be carried out. (D) is incorrect because the duty in a firm is to report to the firm's MLRO, who will investigate the matter. If the suspicions are warranted, the MLRO will then report the matter to the National Crime Agency ('NCA') rather than to local police, as the NCA acts as a central point of contact for such matters."},{n:8,id:"DIS149",scenario:"A builder built a house for a homeowner. The builder finished the house on 20 August 2004, and the homeowner immediately moved in. On 25 September 2020, the homeowner discovered that the foundation to the house had a flaw due to faulty construction of the home which could not have been discovered by an inspection. The homeowner wants to initiate a claim against the builder, but they are concerned about the length of time that has passed since the house was built. Nonetheless, he consults a solicitor on 27 September 2020.",q:"If the homeowner were to initiate a claim against the builder, would the claim be timely?",opts:["The homeowner is not out of time in making a claim against the builder because the limitation period will expire on 25 September 2026, six years from the date they discovered the defect.","The homeowner is not out of time in making a claim against the builder because the limitation period will expire on 25 September 2023, three years from the date they discovered the defect.","The homeowner is not out of time because the limitation period expires on 20 August 2024, 20 years after the house was finished.","The homeowner is out of time because the limitation period expired on 20 August 2010, six years from the date of accrual.","The homeowner is out of time because the limitation period expired on 20 August 2019, 15 years after the house was finished."],ans:"E",expl:"(E) The Latent Damage Act 1986 applies to this case. That Act provides that a claim can be brought within six years of the date of accrual or three years from the earliest date on which the claimant knew, or reasonably ought to have known, material facts necessary to bring an action alleging negligence (the starting date). However, there also is a longstop provision of 15 years. That is the latest date a claim may be brought no matter when the negligence is discovered. Here, that date is 20 August 2019. So, the homeowner is out of time earlier because the longstop period has expired. (A) is incorrect. A claimant may bring an action six years from accrual, which begins when the building was delivered to the claimant, not six years from when the defect was discovered. The 'discovery' part of the Latent Damage Act is three years. (B) is incorrect because it does not take into account the longstop provision of the Act. (C) is incorrect because the longstop period is 15 years, not 20. (D) is incorrect because it does not take the possibility of the limitations being measured by discovery into account."},{n:9,id:"TRT028",scenario:"A mother is walking along a street with her son aged 5. She does not hold his hand nor exercise any other restraint. Suddenly and without warning, he runs into the road in front of a van, being driven carefully and within the speed limit. The van driver brakes very hard and avoids hitting the child. However, the driver suffers a whiplash injury to his neck as a result.",q:"In an action by the van driver against the mother in the tort of negligence, which of the following best states the likely outcome?",opts:["The mother is not liable to the van driver because the harm was caused by the child, not by the mother.","The mother is liable to the van driver because she is responsible for the negligence of her child.","The mother is not liable to the van driver because the child was not negligent, given that he behaved as any 5-year-old might.","The mother is liable to the van driver because she should have supervised her son more carefully.","The mother is not liable to the van driver because she does not owe a duty of care in respect of her omissions to act."],ans:"D",expl:"(D) The mother is liable to the van driver. The mother has a relationship of control over her young child. In these circumstances, she does have a duty to take reasonable care to prevent him from causing harm to the van driver. She has breached this duty by failing to take reasonable care to supervise the child, and her breach has caused the damage. (A) is not correct because the mother had a duty to take reasonable care to prevent the child from causing harm, as explained above. (B) is not correct because it does not explain correctly why the mother is likely to be liable. The mother is not liable because the child was negligent. She is liable for her own negligence - as explained above. (C) is not correct. It may be that the child himself was not negligent. However, the mother herself was negligent in failing to supervise. (E) is not correct. It is true that, in general, a duty of care is not owed in respect of an omission to act. However, the mother has a relationship of control over the child so, as an exception to the general rule, she does owe a duty to take reasonable care to prevent him from causing harm to others."},{n:10,id:"TRT103",scenario:"A manufacturer produces furniture which is sold to retailers in kit form, for assembly by them before sale to the ultimate purchaser. A retailer assembles one of the desks and sells it to a customer. The customer runs a small business and places the desk in his office at work. The first time the customer uses the desk, it collapses. No one is hurt but the customer's office computer, used for his business records, is smashed. The evidence shows that the desk collapsed because of a manufacturing defect which the retailer had failed to notice when assembling it. The retailer has now gone out of business, so the customer seeks a remedy from the manufacturer.",q:"In relation to a claim by the customer against the manufacturer for damage to the computer, which of the following statements best describes whether the manufacturer will be liable to the customer?",opts:["The manufacturer will likely be liable to the customer because damage has been caused by a defect in a product.","The manufacturer will not likely be liable to the customer because the retailer had the opportunity to examine the product during assembly prior to sale.","The manufacturer will likely be liable to the customer because the court may be prepared to infer from the presence of the defect that there was a failure by the manufacturer to take reasonable care.","The manufacturer will likely be liable to the customer because the retailer has gone out of business.","The manufacturer will likely be liable to the customer in contract for breach of the implied term requiring goods to be of satisfactory quality."],ans:"B",expl:"(B) The manufacturer will not likely be liable to the customer. The customer would be unable to pursue a successful claim in the tort of negligence because the manufacturer is unlikely to owe them a duty of care. A manufacturer does owe a duty of care to the end consumer, provided the product was put into circulation in the form in which it was intended to reach the end consumer with no reasonable probability of an intermediate examination. However, on the facts, the product was subject to an intermediate examination when it was assembled by the retailer. The customer would also be unable to pursue a successful claim under the Consumer Protection Act 1987 ('CPA'). The CPA does not cover damage to business property (the computer), nor does it cover damage to the defective product itself (the desk). (A) is not correct. The CPA applies where damage is caused by a defect in a product, but it is not applicable on these facts, as discussed above. (C) is not correct. It is true that a court may be prepared to infer a failure to take reasonable care from the existence of a defect in a product. Where a duty of care is owed, such inference could help to establish breach. However, on the facts, no duty of care is likely to be owed by this manufacturer to this customer, as explained above. (D) is not correct. The status of the retailer as a defendant does not affect the liability of the manufacturer. (E) is not correct. The product was purchased by the customer from the retailer. There was no contract between the customer and the manufacturer.",note:"The scan captures this explanation out of order; it has been reassembled in reading order from the page image."},{n:11,id:"BSL230",scenario:"Four friends want to open a hobby supply business. They each plan to contribute £12,000. They each also plan to work full time in the business, and each would like an equal say in its management, though they would like to run the business with as little formality as possible. Although none of the friends is wealthy, they strongly would prefer not risking any personal assets beyond their contributions. Finally, they would prefer to not pay corporation tax.",q:"Which of the following business mediums would best suit the friends?",opts:["A private company limited by shares.","A general partnership.","A limited liability partnership.","A private company limited by guarantee.","A limited partnership."],ans:"C",expl:"(C) The friends should form a limited liability partnership (LLP). An LLP is run like a partnership, but it is treated as an entity apart from the members. Therefore, the members may fully participate in management, but they are not liable for debts of the LLP beyond their contributions. Despite being an entity apart from the members, an LLP is taxed like a partnership, meaning it does not pay corporation tax; rather, each member pays income tax on their share of profits. (A) and (D) are incorrect as a company pays corporation tax and requires much more formality to run than an LLP (for example, formal meetings must be held, formal votes must be taken, there must be a board of directors, and so on). (B) is not a good choice because while it avoids formality and each partner may participate in management, each partner also is liable for the obligations of the partnership, and the friends said it was crucial that they not risk their personal assets. (E) is not a good choice because in a limited partnership, at least one partner (the general partner) is personally liable for the partnership's debts. The liability of the members in the case of a private company limited by shares, a public limited company, and a limited liability partnership is limited to their capital contribution. The liability of the members of a company limited by guarantee is limited."},{n:12,id:"DIS255",scenario:"In a medical negligence claim, the parties have disclosed reports from their respective experts. The experts disagree on a number of matters in their reports and are required to hold a joint discussion regarding their conclusions.",q:"Which of the following best describes the conduct of the joint discussion between the experts?",opts:["The experts and the solicitors from each party will attend. The solicitors may ask questions, and the experts' responses to such questions are admissible.","Only the experts will attend. They will discuss their reports and each will prepare a separate supplemental report setting out whether their position has moved to any degree from the original report.","The experts and solicitors from each party will attend. They will identify the issues between them, try to agree where possible, and file a joint statement.","Only the experts will attend. They will identify the issues between them, try to agree where possible, and file a joint statement.","The experts and solicitors from each party will attend. The court will expect the experts and solicitors to arrive at a common view."],ans:"D",expl:"(D) Typically, only the experts will attend the meeting. The court requires the experts to try to agree where possible and, where not possible, to set out clearly the areas of disagreement with reasons why. (A), (C), and (E) are incorrect because they each suggest that the solicitors should attend the meeting as well. (B) is incorrect because a joint statement is required."},{n:13,id:"TRT110",scenario:`A statute provides the following:
"For the protection of children and members of the public, no driver of a motor vehicle shall leave a child under age five alone and unattended in the vehicle".
A mother parked her car at the market and left her five-year-old child in the car while she did her shopping. The child left the car and began riding on shopping carts in the parking lot. The child struck an elderly shopper with a cart, injuring her.`,q:"In a claim by the injured shopper against the mother of the child, which of the following statements best describes the outcome?",opts:["The claim is likely to succeed because the mother breached the duty of care imposed by the statute.","The claim is not likely to succeed because the harm suffered by the shopper was not the kind which the statute was intended to protect.","The claim is likely to succeed because the mother breached her duty of care to supervise her child.","The claim is likely to succeed because the mother is vicariously liable for the tort committed by her child.","The claim is not likely to succeed because the statute does not expressly state that it gives rise to a civil claim."],ans:"C",expl:"(C) The claim is likely to succeed because the mother breached her duty of care to supervise her child. While a defendant generally does not owe a duty to exercise control over a third party to prevent them from causing harm to the claimant, such a duty may arise when the defendant has control over the third party or has assumed responsibility for the third party's actions. For example, a parent has control over their young child and has a duty to take reasonable care to prevent the child from causing harm to others. Here, the mother acted unreasonably by leaving her five-year-old child alone in her car while she went into the market to shop. Her breach of her duty of supervision was a cause of the harm suffered by the shopper, so the shopper's claim is likely to succeed. (A) is not correct. For a successful claim for breach of statutory duty, the claimant must show that the statute was designed to prevent the type of harm that the claimant suffered. Here, the statute appears to be intended to protect children from the dangers of being left alone and members of the public near the vehicle if the child were somehow to put it into gear. However, it does not appear to be intended to prevent a child from harming others by leaving the car and riding on shopping carts. So, even though the mother breached the duty of care imposed by the statute, the shopper's harm does not appear to be of a kind which the statute was intended to prevent. (B) is not correct. It is true that the harm suffered by the shopper was not the kind which the statute was intended to protect. However, as discussed above, the claim is likely to succeed because the mother breached her general duty of care to supervise her child. (D) is not correct. Parents ordinarily are not vicariously liable for the torts committed by their children. They may be directly liable, however, for failure to supervise, as discussed above. (E) is not correct. A statute may give rise to a civil claim even where it does not state whether a breach of the duty imposed would give rise to such claim.",note:'The statute in the facts refers to a child "under age five", while the child in the scenario is five years old; this is reproduced as it appears in the source.'},{n:14,id:"BSL216",scenario:"On incorporation several years ago, a company issued 100 £1 ordinary shares. The company wishes to disapply any preemption rights and to issue 100 £1 ordinary shares to a new investor. The company has the Companies (Model Articles) Regulations 2008 (unamended) for private companies limited by shares as its articles of association.",q:"Which of the following best describes the members' resolutions which must be passed before the shares can be allotted?",opts:["A members' ordinary resolution to give the directors the power to allot the shares only.","A members' special resolution to give the directors the power to disapply pre-emption rights only.","A members' special resolution to change the articles to remove the preemption rights.","A members' special resolution to give the directors the power to disapply preemption rights and a members' ordinary resolution to give the directors the power to allot the shares.","A members' ordinary resolution to give the directors the power to allot the shares and a members' special resolution to change the articles to remove the pre-emption rights."],ans:"B",expl:"(B) The directors have the power to allot shares if the company has only one class of shares. However, they need a shareholders' special resolution to disapply the statutory preemption rights. (A) and (D) are incorrect as the directors have power to allot shares if the company only has one class of shares. (C) and (E) are incorrect as the Model Articles do not contain preemption rights, so the articles do not require amendment. The preemption rights come from statute, not the Model Articles.",note:"The scan captures this explanation out of order; it has been reassembled in reading order from the page image."},{n:15,id:"CTR010",scenario:"On 1 February, the owner of a bowling alley saw a magazine advertisement from a major manufacturer of bowling balls offering sets of 40 balls in various weights and drilled in various sizes for £10 per ball. The owner immediately filled out the order form included in the advertisement for the 40 balls and posted it, properly stamped and addressed. On 2 February, the bowling alley owner received a letter from the manufacturer, sent out as part of its advertising campaign, stating that it would sell the bowling alley owner 40 bowling balls at £10 per ball. A day later, on 3 February, the manufacturer received the bowling alley owner's order. On 4 February, the balls were shipped.",q:"On what day did an enforceable contract arise?",opts:["1 February, the day the bowling alley owner deposited his order in the post.","2 February, the day the bowling alley owner received the letter from the manufacturer.","3 February, the day the manufacturer received the bowling alley owner's letter.","4 February, the day the balls were shipped.","An enforceable contract did not arise, as the parties were not in agreement."],ans:"D",expl:"(D) The contract arose when the balls were shipped. The general rule is that an offer can be accepted by performance or a promise to perform unless the offer clearly limits the method of acceptance. Here, the offer would be the bowling alley owner's order, because a magazine advertisement is usually held to be an invitation to treat rather than an offer. Thus, the manufacturer accepted and the contract was formed when it shipped the balls. (A) is wrong because the bowling alley owner's order was an offer to buy, and no contract could be formed until that offer was accepted. (B) is wrong because this is a case of crossing offers; even though both offers contain the same terms, they do not form a contract. (C) is wrong because no contract will be formed until there has been an acceptance, and, as stated, the bowling alley owner's letter was merely an offer. (E) is wrong because the owner of the bowling alley had made an offer to buy the balls by posting the order form, which was accepted by the conduct of the manufacturer in shipping the order."},{n:16,id:"ETH050",scenario:"A firm of solicitors has opened a branch office in a new city and conducts several marketing campaigns to advertise its services. The firm distributes leaflets to every home in the city and places an advert in the local newspaper. It also sends emails to the most prominent local business owners to inform them of the firm's company law services. Finally, the firm telephones current and former clients to let them know about the new office and the services it will provide.",q:"Which action by the firm violated the SRA Standards and Regulations?",opts:["Telephoning current clients.","Telephoning former clients.","Placing an advert in the local newspaper.","Distributing leaflets to every home in the city.","Sending emails to prominent business owners."],ans:"E",expl:"(E) A solicitor or firm must not make unsolicited approaches to members of the public to advertise its legal services. This means that a firm cannot advertise its services in a targeted or intrusive way. Sending emails to prominent local business owners is a targeted approach and is therefore prohibited. (A) and (B) are incorrect because, as an exception to the general rule, a solicitor or firm can make unsolicited approaches to current and former clients. (C) is incorrect because public advertising (such as on billboards, on the radio, in a newspaper, online, or on a social media platform) is generally allowed. (D) is incorrect because the SRA has stated that distributing leaflets to every home in a large geographic area is permitted because this is not targeted or intrusive.",note:"The scan captures this explanation out of order; it has been reassembled in reading order from the page image."},{n:17,id:"DIS161",scenario:"A greengrocer in London has a contractual dispute with a banana supplier from Portsmouth. The parties have been negotiating through their solicitors, and each has nominated their solicitor to receive all communications and proceedings. After negotiations break down, the greengrocer wants to commence proceedings against the supplier.",q:"Which of the following best states the legal position regarding service of the claim in this case?",opts:["The solicitors for the greengrocer may send the proceedings by first class post to the supplier's address, as such service is always authorized.","The solicitors for the greengrocer may email a photocopy of the sealed claim form to the owner of the building, as such service is always authorized.","The solicitors for the greengrocer must serve the proceedings upon the nominated solicitors, as that is the only valid method of service available under the facts.","The solicitors for the greengrocer must serve the proceedings personally on the supplier, as that is the only valid method of service under the facts.","The solicitors for the greengrocer may serve the proceedings on the supplier either by personal service or by service on the nominated solicitors."],ans:"C",expl:"(C) Because the supplier has nominated solicitors to accept service, the claimant's solicitors must serve the proceedings on the nominated solicitors. Therefore, all of the other choices are incorrect. It should be noted that the answer would be different if the defendant is a company. If the defendant is a company, delivery or posting to the company's registered agent will suffice. Note that (A) is incorrect in the context of this case. Typically, postal service is fine so long as there is a reasonable prospect of the proceedings coming to the attention of the defendants. However, when the defendant has nominated solicitors to accept service, the proceedings generally must be served on the nominated solicitor. Likewise, (B) is incorrect. Service by email requires the express consent of the party being served. (D) is incorrect in the context of this case as well, as service on the nominated solicitor is required."},{n:18,id:"CNL165",scenario:"In 2019, the Scottish Parliament enacted the Renewable Energy Act 2019. In 2021, it emerged that the Act breaches retained EU law. In response, the Scottish Parliament held a non-legislative vote to state that it intends for the legislation to be valid.",q:"Which of the following best explains the legal position?",opts:["The Act is valid because the Scottish Parliament is no longer bound by EU law passed after the transition period.","The Act is invalid because it breaches retained EU law.","The Act is valid because the Scottish Parliament is no longer bound by retained EU law.","The Act is invalid because it breaches EU law passed after the transition period.","The Act is valid because it has since been approved by the Scottish Parliament in a non-legislative vote."],ans:"B",expl:"(B) The Act is invalid because it breaches retained EU law. The European Union (Withdrawal) Act 2018 preserved the supremacy of EU law up until the end of the transition period. This means that if there is a conflict between retained EU law and legislation passed before the end of the transition period, the retained EU law will prevail. Because, here, the Scottish Parliament passed the Act in 2019, before the end of the transition period (in December 2020), the retained EU law will prevail. (A) is incorrect because, although it is true that the devolved legislatures (as well as the UK Parliament) are not bound by EU law enacted after the transition period, the Act here is in breach of retained EU law, which consists of EU law brought into UK law before the end of the transition period. (C) is incorrect because it is only legislation passed after the transition period that generally does not need to comply with retained EU law. (D) is incorrect because the Act breaches retained EU law, which consists of EU law brought into UK law before the end of the transition period. (E) is incorrect because no such procedure exists.",note:'The question ID is shown in the source as "CNL 165".'},{n:19,id:"LGS070",scenario:"A junior solicitor became suspicious of one of her clients, who was transferring large sums of money from unclear sources. The junior solicitor filed a suspicious activity report with her firm's Money Laundering Reporting Officer ('MLRO'). A few days later, the MLRO contacted the junior solicitor and assured her that the client was not involved in money laundering. The junior solicitor decided to let the matter rest, despite her misgivings about the client. Several months later, the client was arrested for his involvement in organised crime. The National Crime Agency report stated that any cursory look at this client's background and transactions would make it exceedingly obvious that they were involved in illegal activities.",q:"Which of the following best states the charges that would be most appropriate to bring against the junior solicitor and the MLRO?",opts:["Both the MLRO and the junior solicitor may be charged with arrangement of money laundering.","Both the MLRO and the junior solicitor may be charged with failure to report suspicion of money laundering.","The MLRO may be charged with arrangement of money laundering and the junior solicitor may be charged with failure to report.","The MLRO may be charged with failure to report and the junior solicitor may be charged with failure to comply with money laundering regulations.","The MLRO may be charged with failure to report suspicion of money laundering, but the junior solicitor may not be charged with anything."],ans:"E",expl:"(E) The MLRO may be charged with failure to report suspicion of money laundering, but the junior solicitor may not be charged with anything. Under the Proceeds of Crime Act 2002, solicitors are required to make disclosures of suspicions of money laundering. In firms, the obligation is to report to the MLRO. The MLRO is in turn responsible for ensuring that, when appropriate, information is disclosed to the relevant authority. Here, the junior solicitor reported her suspicions to the MLRO. She has therefore fulfilled her obligation and need not undertake further action. It is the MLRO's duty to determine whether or not to make disclosures to the relevant authority. The MLRO should have noticed that the client's actions were suspicious and notified the National Crime Agency. As this didn't happen, he may be potentially charged with failure to report. (A) and (C) are incorrect as there is no evidence on these facts that suggests the MLRO or the junior solicitor could be charged with arrangement. That offence covers arrangements which the defendant knew or suspected facilitated the acquisition, retention, use, or control of criminal property by or on behalf of another person. We do not have any evidence that the junior solicitor or the MLRO facilitated the client's involvement in money laundering. (B) is incorrect because, as explained above, the junior solicitor has fulfilled her reporting obligation and would not be charged with failure to report. (D) is incorrect because the Money Laundering, Terrorist Financing, and Transfer of Funds (Information on the Payer) Regulations 2017 outline customer due diligence rules that require professionals to know their clients and to monitor the use of their services by clients. There is no evidence the junior solicitor breached these regulations by actions such as failing to verify her client's identity or failing to keep sufficient records in relation to her client."},{n:20,id:null,scenario:"The defendant was the occupier of a small workshop employing three staff. Access to the workshop was via a lift from the ground floor to the first floor. The lift was controlled from inside the workshop on the first floor. A factory inspector needed to examine the lift shaft. The staff foreman agreed to turn the lift off until the inspection was complete. As the inspector was inside the lift shaft carrying out the inspection the lift suddenly descended, causing him a severe injury. Evidence at trial indicated that the staff foreman had turned the lift off as he agreed to do. The inspector's expert testified that there was nothing wrong with the lift that would cause it to malfunction and operate when it was turned off.",q:"Which of the following statements best explains whether the factory inspector is likely to have a successful claim against the defendant in respect of his injury?",opts:["The inspector is not likely to succeed because there is no explanation for why the lift descended.","The inspector may succeed because the court may be prepared to infer that a breach of duty must have occurred.","The inspector is not likely to succeed because one of the other staff in the workshop must have carelessly turned the lift back on, which would not be the defendant's fault.","The inspector may succeed provided he can show that the defendant instructed one of the staff to turn the lift back on.","The inspector is not likely to succeed because he accepted the risk of being injured by agreeing to go into the lift shaft."],ans:"B",expl:"(B) The inspector may succeed because the doctrine of res ipsa loquitur ('the thing speaks for itself') may apply. For res ipsa loquitur to apply three conditions must be satisfied. There must be an absence of explanation for how the accident occurred. The thing which caused the accident must have been under the control of the defendant. The accident must be such as would not normally happen if proper care had been taken. Each of these is satisfied on the facts, so the doctrine may apply to help the inspector establish a breach of the duty owed to him. (A) therefore, is not correct. (C) is not correct. The defendant is the employer of the three staff in the workshop. If one of the staff carelessly turned the lift back on, it is likely that they committed the tort of negligence against the inspector and it is likely that they were acting in the course of their employment. Therefore, the defendant employer would be vicariously liable. (D) is not correct. Even if a member of the staff acted of their own accord, the employer would be vicariously liable, as stated in (C). (E) is not correct. For the defence of voluntary assumption of risk to apply, the claimant must have had full knowledge of the risk and freely and voluntarily assumed the risk. On the facts, these requirements are not satisfied.",note:"No question ID is shown on the answer screen for this question in the source; the scan is cut off below the explanation."},{n:21,id:"TRT012",scenario:"A landowner had a swimming pool and a changing cabin constructed in her large garden. The pool was installed entirely within the confines of the landowner's property. However, one corner of the changing cabin extended a very short distance onto a far corner of her neighbour's land. At the time of the construction, neither the neighbour nor the landowner was aware that the changing cabin extended onto the neighbour's property.",q:"Which of the following statements best describes whether the neighbour will be successful in a claim for trespass?",opts:["The neighbour will not be successful, because the landowner did not intend to have the changing cabin encroach on the neighbour's property.","The neighbour will be successful, because the presence of the changing cabin on the neighbour's land has caused damage to his property.","The neighbour will not be successful, because the landowner did not actually enter the neighbour's property.","The neighbour will be successful, because the changing cabin extends onto the neighbour's land.","The neighbour will not be successful, because the neighbour was not aware of the intrusion at the time of construction."],ans:"D",expl:"(D) The neighbour will be successful. The presence of the cabin in the neighbour's land amounts to trespass. Trespass to land is an unlawful direct interference with the claimant's possession of land. The defendant's actions must be intentional, but the defendant need not intend to trespass. So, a mistake in placing the cabin on the neighbour's land would not excuse the landowner because the landowner intended that the cabin be constructed where it was. Therefore, (A) is not correct. (B) is not correct because trespass is actionable per se. It is not necessary to prove damage. (C) is not correct because trespass can be committed by placing something onto the land, such as the cabin. (E) is not correct because the claimant's knowledge of the encroachment is not a necessary element of the tort of trespass to land."},{n:22,id:"TRT032",scenario:"A hiker in an isolated area encountered a cross-country horse rider who had broken her leg. The hiker created a makeshift sled and began pulling the rider to the nearest road. The hiker decided to take a short cut across an icy pond even though he knew that the ice was thin and there was an alternative route. As the hiker was pulling her across the pond, the ice gave way and they went into the water. The hiker was unable to get out of the water and drowned. The rider was able to pull herself onto land and eventually was rescued. However, she suffered severe hypothermia and lost some of her toes to frostbite as a result of being in the water.",q:"Which of the following statements best describes whether the rider would have an action for negligence against the hiker's estate?",opts:["The hiker's estate is not liable, because the hiker did not survive the accident.","The hiker's estate is liable, because the hiker created a reasonable apprehension in the rider of immediate application of unlawful force to the rider's person.","The hiker's estate is not liable, because the hiker had no duty to come to the rider's aid.","The hiker's estate is liable, because the hiker should not have attempted to cross the ice.","The hiker's estate is not liable, because the rider voluntarily assumed the risks of the rescue."],ans:"D",expl:"(D) The hiker's estate will be liable to the rider because the hiker acted negligently when he was rescuing the rider by attempting to cross the ice. The first element for a claim in negligence is duty of care. There is generally no duty to act to carry out a rescue and, in light of this principle, the courts have also held that a person who does act to carry out a rescue only owes a limited duty to take reasonable care not to make the situation any worse. On the facts, the hiker does appear to be in breach of this limited duty because he fell below a reasonable standard of care by attempting to cross the ice, so making the situation worse. His breach clearly caused the rider's damage. (A) is incorrect. At common law, a tort action ended at the death of either the tortfeasor or the victim. However, the Law Reform (Miscellaneous Provisions) Act 1934 provides generally for the survival of causes of action in tort after the death of either party (except causes of action for defamation). Thus, the fact that the potential tortfeasor died would not preclude the rider from bringing an action against the tortfeasor's estate. (B) is incorrect because it refers to the requirements for an action in assault and here the action is in negligence. (C) is incorrect. It is true that, in general, there is no duty to carry out a rescue. However, once the hiker did undertake the rescue, he owed a duty to take reasonable care not to make the situation worse than it would otherwise have been - as explained above. (E) is incorrect. There is no suggestion that the rider voluntarily assumed the risk of the rescue (volenti non fit injuria)."},{n:23,id:"LGS036",scenario:"A firm of solicitors is looking for a new associate to join them. In the job advert they state that only solicitors who can work on Saturdays should apply. A potential applicant is Jewish and does not apply as he would not be able to work on Saturdays. The applicant queries the firm about the Saturday requirement, and the firm seeks advice about whether its advert is discriminatory under the Equality Act 2010.",q:"Which of the following best describes the firm's advert?",opts:["The advert is indirectly discriminatory on the grounds of religion which the firm can justify if it can show this is a proportionate means of achieving a legitimate aim.","The advert is indirectly discriminatory on the grounds of religion which the firm can justify if it can show this is a legitimate means of achieving a proportionate aim.","The advert is directly discriminatory on the grounds of religion which cannot be justified by the firm.","The advert is directly discriminatory on the grounds of religion which the firm can justify if it can show this is a proportionate means of achieving a legitimate aim.","The advert is not discriminatory because the firm has not mentioned a protected characteristic in the advert."],ans:"A",expl:"(A) The advert is indirectly discriminatory on the grounds of the protected characteristic of religion, which the firm can justify if it can show this is a proportionate means of achieving a legitimate aim. Indirect discrimination is when a policy or provision is apparently neutral but on closer examination puts individuals with a protected characteristic at a disadvantage compared with individuals who do not have that characteristic. The advert does not expressly exclude Jewish candidates, so is apparently neutral, but would place Jewish candidates at a disadvantage compared with non-Jewish candidates. Indirect discrimination on the grounds of race can be justified if the firm can show it is a proportionate means of achieving a legitimate aim. (B) is incorrect because while this is indirect discrimination, the correct standard for justification is that the action must be shown to be a proportionate means of achieving a legitimate aim. (C) and (D) are incorrect because, as explained above, the policy is indirectly, not directly, discriminatory on the grounds of religion. (E) is incorrect because indirect discrimination may result when a policy is apparently neutral. There does not have to be an express policy or statement related to a protected characteristic.",note:'The source explanation refers once to "indirect discrimination on the grounds of race", although the question concerns religion; it is reproduced as it appears.'},{n:24,id:"CNL026",scenario:"The Labour Prime Minister has decided to retire as Prime Minister and party leader. The Labour Party has a majority of the seats in the House of Commons.",q:"Ordinarily, what would be expected to happen next?",opts:["The Cabinet would decide who should be the next Prime Minister, without consulting anyone else.","The Monarch would appoint the leader of the Conservative Party as the next Prime Minister.","The Prime Minister would resign immediately and tell the Monarch who they should appoint as the next Prime Minister.","The Monarch would ask the Speaker of the House of Commons for advice as to who to appoint as the next Prime Minister.","The Labour Party would hold a leadership contest to appoint a new leader, and the winner would be appointed as the next Prime Minister."],ans:"E",expl:"(E) The Labour Party would hold a leadership contest to appoint a new leader, and the winner would be appointed as the next Prime Minister. The Prime Minister must be an MP who can command the confidence of the House of Commons. This usually means that the Prime Minister will be the leader of the political party who has a majority of the seats. When a Prime Minister retires, they will also resign as leader of their political party. The political party would then be expected to hold a leadership contest, according to their own internal rules. When the leadership contest has been concluded, the new leader of the party would then be appointed as Prime Minister. (A) is incorrect because the Cabinet would not decide who will next serve as Prime Minister. (B) is incorrect because, under these circumstances, the Prime Minister would come from the party currently in government (that is, the Labour Party). (C) is incorrect because the next Prime Minister would be selected by a leadership contest, not by the Prime Minister's own choosing. (D) is incorrect because the Monarch and Speaker of the House do not play a role in selecting the next Prime Minister."},{n:25,id:"CTR016",scenario:"A manufacturer of musical instruments received an order for a custom made guitar, and entered into a contract with the customer to supply the guitar for a total contract price of £750, payment on delivery. After the guitar had been delivered, the customer decided that they wanted to learn to play the piano rather than the guitar, and notified the manufacturer that they no longer required the guitar and would not be paying for it. The manufacturer terminated the contract and took the guitar back. They had already spent £250 making the guitar so immediately commenced proceedings against the customer for breach of contract. Before the case reached court, the manufacturer sold the guitar to a third party for £650.",q:"What damages would the court be likely to award in this scenario?",opts:["No damages would be awarded. The manufacturer has not incurred any losses as they were able to sell the guitar to a third party.","The manufacturer would receive £750, the agreed amount under the contract, due to the customer's express anticipatory breach.","The manufacturer would receive nominal damages to reflect the manufacturer's inconvenience.","The manufacturer would receive £250 to reflect the money they had expended in reliance on the contract.","The manufacturer would receive £100 damages to reflect the difference between the contract price and the price they received from the third party."],ans:"E",expl:"(E) Damages are intended to compensate the innocent party by putting them back into the position they would have been in had the contract been properly performed. In this scenario, putting the manufacturer back into the position they would have been in had the contract been performed would mean damages of £750. However, damages are intended to be compensatory, and the manufacturer mitigated their loss by selling the guitar to a third party, so they are only £100 short of the full contract price and therefore this would be the amount that the court would award. To award the full contract price would result in a windfall for the manufacturer and the full damages award would therefore be seen as punitive, which is contrary to civil law. Therefore (E) is the correct answer. (A) is incorrect as the manufacturer has clearly suffered a loss as they have not received the full £750 contract price, even having mitigated their loss by selling the guitar to a third party. (B) is incorrect because the manufacturer has mitigated their loss to the amount of £650, therefore the only compensation they are entitled to receive is the difference between £650 and the contract price, that is, £100. (C) is incorrect because nominal damages will be awarded only where a claimant has not suffered any loss, and as we have already seen, the manufacturer has suffered a loss of £100. (D) is incorrect because the reliance interest measure of damages is not relevant here. If the manufacturer had not been able to mitigate their loss, they would have claimed the full £750 contract price from the customer to reflect their performance interest, rather than the £250 they had expended in making the guitar. The reliance interest measure of damages is more appropriate where it is unclear what financial position the innocent party would have been in had the contract been properly performed. In this scenario it is clear that the manufacturer would have been paid £750 if the customer had not breached the contract."},{n:26,id:"CNL075",scenario:"The planning committee of a local council has allowed planning permission for a new car park near a train station. The car park has no parking spaces reserved for the disabled. According to the minutes of the committee meeting, the committee wanted to make as many parking spaces as possible available for all drivers at all times. The committee made no other considerations. An association eager to encourage disabled drivers wants to challenge the decision to grant planning permission via judicial review.",q:"Which of the following grounds for the association's judicial review claim is most likely to succeed?",opts:["The committee took into account irrelevant considerations in wanting to make as many spaces as possible available to all drivers.","The committee did not give effect to the legitimate expectations of disabled drivers.","The committee breached the Public Sector Equality Duty.","The committee made an unreasonable decision.","The committee failed to make the decision using the correct procedure."],ans:"C",expl:"(C) The association is most likely to succeed on the ground that the committee breached the Public Sector Equality Duty. The Public Sector Equality Duty places several requirements on bodies within the public sector, such as a local council. This includes showing due regard for removing or eliminating disadvantages suffered by those who share a protected characteristic. Disability is a protected characteristic. Here, the committee failed to consider this need when making its decision. That is sufficient to breach the Public Sector Equality Duty. (A) is incorrect. A public authority may take into account only relevant considerations. Surely, the number of parking spaces in a car park is relevant when planning a new car park. (B) is incorrect. A legitimate expectation that a public body will exercise power in a certain way can arise from an explicit promise or previous action by the public body. There is nothing in the facts to give rise to any legitimate expectation on the part of the association. (D) is incorrect. A decision must be outrageous or absurd to be considered unreasonable and a desire to maximise parking at a car park does not fall into this category. (E) is incorrect because there is nothing in the facts to indicate that the committee has failed to follow the correct procedures."},{n:27,id:null,scenario:`A company has the following income and gains for its year ended 31 March 2021.
• £210,000 trade profit
• Interest of £15,000
• Dividends of £10,000
• Capital gain of £10,000
It also has a capital loss brought forward from the prior year end of £30,000.`,q:"What are the company's total taxable profits?",opts:["£225,000","£215,000","£235,000","£205,000","£210,000"],ans:null,expl:null,note:"The source document does not contain an answer screen for this question: the answer screens go from question 26 straight to question 30 (the screens for questions 30 to 35 then appear twice). No answer or question ID is therefore available."},{n:28,id:null,scenario:"A woman went to watch her daughter compete in a cycling race. She had a clear view and could see the competitors coming down the road towards the finishing line, recognising her daughter from her distinctive clothing. Suddenly, the gantry over the finish line collapsed onto the group of cyclists. The mother saw it collapse onto her daughter and has begun to suffer from post-traumatic stress disorder ('PTSD') as a result. Evidence shows that the gantry collapsed because of the negligence of the company which erected it.",q:"In an action by the mother against the company to recover damages for her PTSD, which of the following best states the likely outcome?",opts:["The mother is likely to be successful because the company did owe her a duty of care in respect of her psychiatric harm.","The mother is not likely to be successful because damages for psychiatric harm are not recoverable in the tort of negligence.","The mother is not likely to be successful because she herself was not [in the area of] danger created by the company's negligence.","The mother is not likely to be successful because she was not physically injured.","The mother is likely to be successful because her psychiatric harm has made her a primary victim."],ans:null,expl:null,note:"The source document does not contain an answer screen for this question (see question 27). Part of option (C) is obscured in the scan; the bracketed words are inferred."},{n:29,id:null,scenario:"A longstanding client of a firm of solicitors informs them that a relative has slipped on a wet patch in a supermarket and needs advice on what steps they can take to get compensation for their injury. The client wants to refer their relative to the firm and requests that the firm shares 10% of its fees with him.",q:"Is the firm able to do this?",opts:["No, because a solicitor or firm is only permitted to share their fees with lawyers.","No, because referral fees are prohibited in all matters.","Yes, provided the fee sharing agreement is in writing and the firm informs the client's relative of the arrangement.","No, because this arrangement would result in the payment of a prohibited referral fee.","Yes, provided the client's relative consents to the arrangement."],ans:null,expl:null,note:"The source document does not contain an answer screen for this question (see question 27)."},{n:30,id:"CTR132",scenario:"A retailer sells a tumble dryer to a consumer. The contract contains a clause excluding the retailer's liability for breach of the statutory implied condition of satisfactory quality. The tumble dryer is poorly designed. As a result, it catches fire and the consumer is injured. The consumer sues the retailer. The court finds that the tumble dryer was negligently designed.",q:"Can the retailer rely on the exclusion clause to avoid liability for the injury to the consumer?",opts:["No, because liability for personal injury caused by negligence cannot be excluded.","Yes, because it is the manufacturer, not the retailer, which is responsible for the negligent design.","Yes, but only if the manufacturer can show that the exclusion clause is fair.","No, because liability for breach of the statutory implied conditions cannot be excluded.","Yes, but only if the manufacturer can show that the exclusion clause meets the reasonableness test."],ans:"D",expl:"(D) This is a consumer contract and so it is subject to the Consumer Rights Act 2015 ('CRA'). Under the CRA, a trader cannot exclude, among other terms, statutory implied terms going to the quality or fitness of the goods. A negligently designed tumble dryer is not of satisfactory quality. Since the implied quality term could not be excluded, the trader (the retailer) would be liable for damages caused by the goods. (A) is incorrect because it is focusing on the wrong party. It is true that the CRA prohibits a trader from excluding liability for personal injury or death arising from the trader's own negligence, but here the negligence was by the manufacturer (negligent design). The retailer's liability is based on selling goods that are not of satisfactory quality rather than on any negligence by the retailer. (B) is incorrect because, as just indicated, the retailer is liable for selling a defective product even though the retailer was not negligent. (C) is incorrect because this exclusion is prohibited and so it is not open to the trader to show that the exclusion is fair. (E) is incorrect because the reasonableness test is imposed by the Unfair Contract Terms Act 1977 ('UCTA'). The UCTA does not apply to consumer contracts."}],X1=[{n:31,id:"LGS027",scenario:"A solicitor is approached by a potential client with a personal injury claim. The client does not have any insurance to cover his legal fees and enquires whether the solicitor will accept the case on a contingency fee basis. The solicitor thinks that this will be a costly case to bring but one which is of potentially high value. She therefore proposes a damages based agreement with a success fee of 25% of the damages awarded.",q:"Is the solicitor permitted to enter into a damages based agreement on the basis described?",opts:["No, because damages based agreements are not allowed in personal injury cases.","No, because damages based agreements cannot be for more than 20% of the damages awarded in personal injury cases.","Yes, because the solicitor is able to set the success fee at any percentage of the damages awarded.","Yes, because the solicitor has concluded that this is a costly case which merits a high percentage success fee.","Yes, because damages based agreements can be for 25% of the damages in personal injury cases."],ans:"E",expl:"(E) The solicitor is permitted to enter into a damages based agreement for no more than 25% of the damages in personal injury cases. In a personal injury case, the legal costs payable under a damages based agreement cannot be more than 25% of the sum recoverable, excluding future losses. In non-personal injury cases, the sum payable can be no more than 50%. Here, the solicitor has proposed a success fee of 25% of the damages awarded in a personal injury case, which is permitted. (A) is incorrect because damages based agreements are available in personal injury cases. (B) is incorrect because, as explained above, the allowable success fee for personal injury claims is no more than 25% of the damages awarded. (C) is incorrect because, as explained above, there is a limit of 25% of damages awarded in personal injury cases and 50% in non-personal injury cases. (D) is incorrect because although the solicitor will consider the risk and reward when setting the success fee, the solicitor is still subject to the limitations on the success fee explained above."},{n:32,id:"CTR073",scenario:"An investor entered into a contract with a petrol company for the sale of an existing petrol station because the petrol company told the investor that the petrol station would sell 200,000 gallons of petrol per year. However, a local planning decision made after the statement by the petrol company but before the contract was concluded, meant that there would no longer be direct access to the petrol station from the main road. The investor's sales were significantly short of 200,000 gallons a year as a result, and she lost a substantial amount of money.",q:"Does the investor have a claim against the petrol company?",opts:["No. The 200,000 gallons of petrol figure was a statement of opinion, not of fact and therefore there was no misrepresentation.","No. The statement was not false at the time it was made and therefore it could not amount to a misrepresentation.","No. The investor should have made her own independent enquiries as to the amount of likely petrol sales and the local planning decisions.","Yes. The 200,000 gallons of petrol figure was a statement of fact and the petrol company has committed a fraudulent misrepresentation.","Yes. The 200,000 gallons of petrol figure was a statement of fact and the petrol company has committed a negligent misrepresentation."],ans:"E",expl:"(E) A misrepresentation is a false statement of fact or law that induces another person to enter into a contract. It is reasonable to assume that the petrol company had specialist knowledge of the throughput of the existing petrol station, so their statement is more likely to be a statement of fact rather than of opinion, given this knowledge. Failure to correct the statement after the subsequent planning decision amounts to a further misrepresentation, as a party making a statement which is true but subsequently becomes false, has a duty to correct it. Silence is not acceptable in these situations. (A) is incorrect for the reasons set out above. As the petrol company is likely to have had specialist knowledge regarding the throughput of petrol, the statement is more likely to be considered one of fact rather than of opinion. (B) is incorrect because, even though the statement may have initially been true, it then became false due to the planning decision and so the petrol company was under a duty to correct the statement previously made. (C) is incorrect because there is no information to suggest that the investor had any specialist knowledge regarding petrol sales, and the statement regarding the volume of petrol that could be sold was a statement designed to induce her into entering into the contract. Such representations, if untrue, are misrepresentations and the innocent party will then have the appropriate remedies available to them. (D) is incorrect because there is nothing to suggest the statement was made fraudulently. For a claim for fraudulent misrepresentation to succeed, the innocent party must show that the statement was made knowingly, recklessly, or without belief in the truth. The facts of the scenario do not show that the petrol company made a fraudulent misrepresentation; rather they were negligent in not realising that they needed to advise the investor of the planning decision or update their figures to reflect the decision."},{n:33,id:"ELS042",scenario:"A justice of the Supreme Court decides that she needs to consider the methods of statutory interpretation to decide the case in front of her.",q:"Which of the following methods would instruct the justice to look at the problem that the statute was seeking to remedy?",opts:["The literal rule.","The golden rule.","The mischief rule.","The purposive approach.","Expressio Unius est Exclusio Alterius."],ans:"C",expl:"(C) The mischief rule would instruct the justice to look at the problem that the statute was seeking to remedy. (A) is incorrect. Under the literal rule, courts use the ordinary meaning of words in a statute. The rule applies when there is no ambiguity and using ordinary meanings will not lead to absurd results. (B) is incorrect. Under the golden rule, courts may use something other than a word's ordinary meaning to avoid absurd results under the literal rule. (D) is incorrect. Under the purposive approach, a court uses extraneous material from the pre-enactment phase of legislation to try to discern the meaning of the words used in the statute. (E) is incorrect and is a rule of language (expression of the one excludes inclusion of others).",note:"The scan captures this explanation out of order; it has been reassembled in reading order from the page image."},{n:34,id:"ELS064",scenario:"A client has learned that he will be tried for common assault, a summary offence.",q:"In which court will the trial be heard?",opts:["In the Magistrates' Court only.","In either the Magistrates' Court or the Crown Court only.","In the Crown Court only.","In the High Court only.","In either the Magistrates' Court, Crown Court, or High Court."],ans:"A",expl:"(A) Summary matters can be heard only in the Magistrates Court. (B) is incorrect. Only either way offences may be tried in the Magistrates' Court or the Crown Court. (C), (D), and (E) are incorrect. As noted, summary offences are heard in the Magistrates' court only."},{n:35,id:"TAX164",scenario:"A company realised a chargeable gain of £16,000 on the disposal of a building in January 2020.",q:"What is the tax suffered by the company on its chargeable gain?",opts:["£370","£740","£3,040","£3,200","£1,600"],ans:"C",expl:"(C) £3,040. Companies pay corporation tax on gains at 19%. Companies do not have an annual exempt amount. Therefore, the company's tax suffered on the capital gain is 19% of £16,000 = £3,040."},{n:36,id:"DIS010",scenario:"A trader is suing a supplier because the goods the supplier provided did not quite meet the description in the contract. The directions order in the case requires the parties to serve their disclosure list by 25 June. The defendant serves their list on 25 June, but the claimant has failed to do so. The defendant then makes an application to strike out the claim, which the court has listed for a hearing before the District Judge. Thereafter, the claimant makes an application for relief from sanctions. The trader hands a bundle of documents to the supplier, which the trader says represents its disclosable documents.",q:"Which of the following orders will the court most likely make at the hearing?",opts:["The court is likely to strike out the claim.","The court is likely to order that a formal disclosure is not necessary, as the claimant has now provided copy documents to the defendant.","The court is likely to make an 'unless order', requiring the claimant to serve its disclosure list within 14 days, failing which the court will strike out the claim.","The court is likely to adjourn the hearing and ask to re-list in 28 days to see whether the claimant has complied with disclosure.","The court is likely to indicate that the question of whether and to what extent the claimant may rely on the documents is one for the trial judge."],ans:"C",expl:"(C) The court likely will make an 'unless order'. The defendant acted correctly in trying to force the issue by making an application. Courts will generally first issue an unless order before striking out a claim. Thus, although the defendant properly made an application to strike the claim for failure to disclose, because the claimant applied for relief from sanctions, the court is likely to grant a short period for the claimant to comply. If the claimant fails to comply within this timescale, the court will then strike out the claim. Therefore, (A) is incorrect. (B) is incorrect because formal disclosure is required, so the court will not permit the claimant to proceed without serving a formal disclosure list. (D) is incorrect because the court will make an appropriate order at this hearing. It would be a waste of court time to adjourn and bring the parties back to court in a month's time. (E) is incorrect because the court will wish to actively case manage the claim and make an order which enforces compliance with the court directions and in default, strike out."},{n:37,id:"DIS245",scenario:"A travel company is suing its IT contractor for breach of contract. Their claim is that the contractor's failure to provide the IT support to the necessary standard caused it to lose bookings. The travel company's bookings manager calculated losses to be £30,000.",q:"Which of the following statements best describes how the travel company's solicitor should start the proceedings?",opts:["The solicitor should send the claim form by first class post to their local county court for issue.","The solicitor should take the claim form for issue in person to the local county court.","The solicitor should send the claim form to the County Court Money Claims Centre (CCMCC) in Salford to issue the claim form.","The solicitor should send the claim form by special delivery to the local county court.","The solicitor should send the claim form to their local High Court district registry that will issue the claim form and determine which court to allocate the claim."],ans:"C",expl:"(C) There is now one County Court issuing centre based in Salford, the CCMCC, and all claims are issued from this court. (A), (B), and (D) are incorrect because the prescribed process for issue in the County Court is now through the bulk issuing centre in Salford. (E) is incorrect because it would be inappropriate for the claimant to issue in the High Court bearing in mind its value."},{n:38,id:"CTR145",scenario:"Two trading companies are negotiating over the sale of a consignment of 200 tonnes of soya beans. The seller offers to sell the beans to the buyer at 'a price to be agreed'. The buyer accepts the offer. The beans are delivered.",q:"Can the seller claim payment for the beans?",opts:["No, there is no contract because the price, an essential term, has not been agreed.","No, there is no contract because the parties had to provide for the price to be determined by a third party.","No, there is no contract because the parties had provided for the price to be determined unilaterally by the buyer.","Yes, there is a contract and the seller has a contractual entitlement to payment of a reasonable price.","Yes, there is no contract, but the seller is entitled to payment of a reasonable price as a quantum valebat."],ans:"D",expl:"(D) If no price has been agreed and none can be determined from the dealings between the parties, the Sale of Goods Act 1979 obliges the buyer to pay a reasonable price. This has the effect of supplying the missing term, and it means that there can still be a valid contract for the sale of goods when no price has been agreed. (A), (B), and (C) are incorrect because each suggests there is no contract. A provision for the price to be determined by a third party (such as an expert or an arbitrator) as suggested in (B) would have been another way of resolving the uncertainty, but it is not necessary. Similarly, a provision for the price to be determined unilaterally by one of the parties as suggested in (C) would have been another way of resolving the uncertainty, but it, too, was not necessary. (E) is incorrect. There is a contract here. A quantum valebat is a restitutionary remedy that applies if goods have been supplied when there was no entitlement to payment under the contract (for example, because partial performance of an entire contract has not been accepted), or if a contract has not been formed."},{n:39,id:"TAX116",scenario:"A company has trading profits of £560,000, not including capital allowances. They have purchased IT equipment worth £150,000. The company had not used any of the £200,000 annual investment allowance available for the year.",q:"Assuming no other business assets other than the IT equipment, what are the company's chargeable profits?",opts:["£410,000","£698,000","£548,000","£533,000","£710,000"],ans:"A",expl:"(A) Companies have an annual investment allowance of £200,000 per year. Asset purchases for up to this amount can be deducted at a 100% rate. Therefore, the company's taxable profits are £560,000 - £150,000 = £410,000."},{n:40,id:"TRT076",scenario:"[The question screen for this question is missing from the source document. From the answer discussion, the facts appear to involve an engineering company that engaged a gardener under a contract (which purported to exclude the company's liability for his actions), and the gardener's negligence caused loss to the proprietor of a garden centre.]",q:"[Which of the following best describes whether the company is vicariously liable for the negligence of the gardener?]",opts:["[Not visible in the
