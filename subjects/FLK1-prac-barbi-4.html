source. From the explanation, this option states that the company is not vicariously liable for the negligence of the gardener.]","[Not visible in the source. From the explanation, this option concerns whether the gardener was in a relationship 'akin' to employment with the company.]","The company is vicariously liable for the negligence of the gardener because the contract is not conclusive, and the facts show that he was an employee of the company.","The company is not vicariously liable for the negligence of the gardener because it took reasonable care to select a competent gardener.","The company is not vicariously liable for the negligence of the gardener because the contract expressly excludes any liability for his actions."],ans:"A",expl:"(A) The company is not vicariously liable. An employer is only vicariously liable for the torts of its employees or, under certain circumstances, persons who are in a relationship 'akin' to employment. The gardener does not satisfy either of these, so the company is not vicariously liable for his negligence. (B) is not correct. For a relationship 'akin' to employment to arise, the following must be satisfied: the tort was committed as a result of an activity undertaken by the tortfeasor on behalf of the defendant; the tortfeasor's activity was part of the business activity of the defendant; and the defendant, by engaging the tortfeasor to carry on the activity, created the risk of the tort. In addition, there must be close connection between the relationship and the tort. On the facts, these requirements are not satisfied, so a relationship 'akin' to employment does not exist between the gardener and the company. (C) is not correct. It is true to say that the contractual label which the parties have attached to their relationship is not conclusive. However, on the facts, none of the tests for determining whether someone is an employee appear to be satisfied. The gardener's work is not integrated into the business of the company (engineering), it does not exercise any control over his work (it has no expertise), and there are no other factors to suggest that the true nature of the relationship is that of employer-employee. (D) is not correct because it does not give the correct reason why the company is not vicariously liable. The company may owe a duty to take care in selecting a competent contractor which, on the facts, it has fulfilled. However, compliance with this duty would not protect the company from being vicariously liable. (The company is not vicariously liable, but for other reasons.) (E) is not correct. The first requirement for an exclusion of liability is that it must have been brought to the attention of the claimant (the proprietor of the garden centre). This has not happened here because the contract containing the purported exclusion was made between the engineering company and the gardener.",note:'The question screens for questions 40, 41 and 42 are missing from the source (the question screens jump from "39 of 90" to "43 of 90"). For this question the answer screen shows only options (C) to (E) and the explanation. The bracketed facts, question and options (A) and (B) are inferred from the explanation and are not source text.'},{n:41,id:"CNL108",scenario:"[The question screen for this question is missing from the source document. From the answer discussion, the facts concern a woman who is to be appointed to the House of Lords by the Monarch on the advice of the Prime Minister.]",q:"[In what capacity would the woman sit in Parliament?]",opts:["Law Lord.","Lord Spiritual.","Hereditary peer.","Life peer.","Member of Parliament."],ans:"D",expl:"(D) The woman would sit in the House of Lords as a life peer. Life peers are appointed to the House of Lords by the Monarch on the advice of the Prime Minister. (A) is incorrect because Law Lords are no longer appointed to the House of Lords. (B) is incorrect because the Lords Spiritual consist of the 26 most senior bishops of the Church of England. (C) is incorrect because a hereditary peerage is passed down through the family. Hereditary peers are not appointed. (E) is incorrect because MPs serve in the House of Commons.",note:'The question screen for this question is missing from the source (see question 40). The options and explanation come from the answer screen; the bracketed facts and question are inferred and are not source text. The question ID is shown in the source as "CNL 108".'},{n:42,id:"CTR110",scenario:"[The question screen for this question is missing from the source document. From the answer discussion, the facts concern a director who, acting on behalf of a company, enters into a contract with a supplier.]",q:"[Who is bound by the contract?]",opts:["The company and the supplier only.","The director and the supplier only.","The company's shareholders and the supplier only.","The director, the company, and the supplier only.","No one, there is no valid contract."],ans:"A",expl:"(A) The director is acting on behalf of the company. Companies have legal capacity so they can enter into contracts with third parties. This contract is between the company and the supplier, so they are both bound. (B) is incorrect because the director is acting as the agent of the company. Agents do not normally become party to the contracts that they conclude on behalf of their principals. (C) is incorrect because the company is a separate legal person from its shareholders, so the company can enter into contracts in their own name. (D) is incorrect for the same reasons as (B). (E) is incorrect because there is a valid contract, between the company and the supplier, as stated above.",note:"The question screen for this question is missing from the source (see question 40). The options and explanation come from the answer screen; the bracketed facts and question are inferred and are not source text."},{n:43,id:"DIS091",scenario:"A customer is suing their internet service provider ('ISP') for breach of contract. The ISP instructs a solicitor to respond to the customer's claim. The ISP disputes that there was a breach of contract as it believes that it complied at all times with the contract. The Particulars of Claim served by the claimant alleges that whilst the conduct giving rise to the breach occurred seven years ago, the customer was not aware of any facts showing the breach until a year ago. However, the ISP possesses a letter from the customer that is dated seven years ago and that asserts the same breach. Additionally, the claim alleges that breach occurred seven years ago.",q:"How should the ISP respond in the defence?",opts:["Deny the allegation of breach, neither admit nor deny the allegation that the defendant did not know of the breach before a year ago, and, if necessary, raise the limitation point at trial.","Deny the allegations of breach and that the defendant did not know of the breach before a year ago, and, if necessary, raise the limitation point at trial.","Deny the allegations of breach and that the defendant did not know of the breach before a year ago, and raise the defence that the claim is time barred.","Deny the allegation of breach, neither admit nor deny the allegation that the defendant did not know of the breach before a year ago, and raise the defence that the claim is time barred.","Neither admit nor deny the allegations of breach and that the defendant did not know of the breach before a year ago, and raise the defence that the claim is time barred."],ans:"C",expl:"(C) The ISP should deny the allegations of breach and that the defendant did not know of the breach before a year ago, and raise the defence that the claim is time barred. A defendant may defend a claim by asserting a procedural defence (such as lack of jurisdiction or expiration of the limitation period), negating one of the elements of the cause of action, or disputing the damages. In any case, the defence must be truthful - the defendant must admit allegations that are true, but may deny allegations they believe are false, and say that they neither admit nor deny (that is, issue a non-admission regarding) allegations that are not within their personal knowledge. Here, the ISP believes they complied at all times with the contract. Therefore, they may deny the allegation that they breached the contract. And while ordinarily when a claimant discovers a breach might not be within the knowledge of the defendant, here, the defendant has a letter showing the claimant knew of the breach seven years ago. Therefore, the ISP may deny that allegation as well. Finally, as the limitation period for breach of contract is six years from the date of the breach and the breach here occurred seven years ago, the ISP may raise the limitation as a defence. (A) is incorrect because the ISP may deny the allegation that the customer did not know of the breach until a year ago based on the letter. Additionally, expiration of the limitation period should be raised as early as possible to avoid needless costs, which makes (B) incorrect as well. (D) is incorrect for suggesting that the ISP should neither admit nor deny the allegation that the defendant did not know of the breach before a year ago. And (E) is incorrect for similar reasons - both allegations should be denied."},{n:44,id:"BSL076",scenario:"Three friends recently graduated from university with computer science degrees. None of them found a full time job. However, each of them was able to obtain paying computer software support projects for local government in Manchester. They decide to form a company to provide such services to the local government and now are trying to decide on a company name.",q:"Which of the following company names would require approval before it could be used?",opts:["Computer Software Support Limited.","Computer Software Support (Manchester) Limited.","Northern Computer Software Support Limited.","Manchester Council Computer Software Support Limited.","Manchester City Computer Software Support Limited."],ans:"D",expl:"(D) Approval is required for the use of a company name that suggests any connection to government or local authority. Therefore the use of the word 'council' would not be permitted without approval. (A), (B), (C), and (E) are all incorrect as they do not contain any words that suggest such a connection."},{n:45,id:"CTR102",scenario:"A woman entered a stationers and asked the price for printing a wedding invitation in accordance with a sample displayed in the shop's window. The shop assistant quoted the woman a price for 100 invitations. The woman placed an order with the shop assistant and paid the named price in full. The next day, the shop assistant called the woman and said there had been a mistake as to the price: the invitations selected by the woman actually cost 20% more. The woman refused to pay any additional money. The shop assistant said nothing further. The shop delivered invitations to the woman on time, but in a different style, worth the same price as the woman paid. Because her wedding was quickly approaching, the woman reluctantly used the inferior invitations.",q:"Will the woman's claim against the stationer for damages for breach of contract succeed?",opts:["Yes, because the shop assistant's silence was an acceptance of the woman's refusal to pay more money, creating a contract at the lower price.","Yes, because the invitations the woman received were inferior to the ones she ordered.","No, because the woman received invitations that were worth the price she paid.","No, because the woman was adequately informed of the mistake as to price.","No, because the woman used the invitations."],ans:"B",expl:"(B) The woman's claim will succeed because the invitations she received were inferior to the product she contracted to purchase. An offer was made by the stationer when the shop assistant quoted the woman a price in response to her inquiry about purchasing the invitations. Price quotations may be considered as offers if given in response to a specific inquiry. The woman accepted the offer by placing her order. Thus, a contract was formed at that time between the woman and the stationer for the purchase of those particular invitations at the price quoted. (A) suggests a variation of the original contract: the woman's refusal to pay more was an offer to change the price to the price originally quoted, and the shop assistant accepted this offer. However, there was already a contract at the price originally quoted so there was no need for a variation. (If there had been an offer to vary the contract, the shop assistant's silence would not have constituted acceptance, because acceptance must be communicated.) (C) is incorrect because the invitations the woman received were not the invitations she was promised under the contract. Even though they had a value equal to what she paid, this does not alter the fact that the stationer breached the contract by sending the wrong invitations. (D) is incorrect because the mistake was unilateral. The woman didn't learn of it until after the contract was formed, and there was no reason why she should have realised that there was a mistake (the difference in price was not great, and she is unlikely to have had a clear idea of the price of wedding invitations, because they are not a regular purchase). Generally, a contract is not void for unilateral mistake unless the non-mistaken party knew or should have known of the mistake when the contract was formed. (E) is incorrect because a buyer can accept nonconforming goods and still recover damages for the breach.",note:"The scan captures this explanation out of order; it has been reassembled in reading order from the page image."},{n:46,id:"CNL010",scenario:'The Home Secretary has instructed the police to arrest a journalist who has written a story about an affair that the Home Secretary has been having with a member of their staff. The Home Secretary told the police to arrest the journalist for "spreading malicious gossip about a politician", which is not an offence under the criminal law.',q:"Has the Home Secretary acted in a constitutionally appropriate and legal manner?",opts:["No, because Parliament did not specifically sanction the journalist's arrest.","Yes, because the Home Secretary has the inherent authority to order such an arrest under the common law.","Yes, because the Home Secretary has acted according to the rule of law, as the journalist's actions harmed the process of democracy.","No, because the Home Secretary has acted contrary to the rule of law, as they have sought to punish the journalist who has not breached any specific law.","No, because journalists have special protection."],ans:"D",expl:"(D) The Home Secretary has not acted constitutionally because the Home Secretary has acted contrary to the rule of law. A core principle of the rule of law is that an individual can be punished only according to a specific law. As there has been no breach of the law, the order to the police to arrest the journalist is illegal. (A) is incorrect because the arrest itself does not have to be sanctioned by Parliament; rather, there must be some law providing for the arrest. (B) is incorrect because the Home Secretary has no such inherent power. (C) is incorrect. Because the journalist did not breach any law, the arrest order violates the rule of law. (E) is incorrect because journalists have no special protection.",note:"The scan captures this explanation out of order; it has been reassembled in reading order from the page image."},{n:47,id:"CTR119",scenario:"A retired couple enter into a contract with a tour operator, paying a very substantial price for what they expect to be the cruise holiday of a lifetime. The flight organised by the operator is delayed so that the couple miss the start of the cruise. Next, the couple are allocated an inside cabin instead of the sea view cabin with balcony that they have booked. During the cruise, numerous scheduled ports of call are missed. Finally, the food served on the cruise is of poor quality and both husband and wife suffer food poisoning.",q:"What compensation can the couple recover for breach of contract?",opts:["Damages representing the cost of a new cruise as promised, plus damages for pain and suffering.","Damages representing the difference between the value of the holiday promised and the value of what was received, plus damages for pain and suffering and for disappointment and mental distress.","Damages representing the cost of a new cruise as promised, plus damages for pain and suffering and for disappointment and mental distress.","Damages representing the difference between the value of the holiday promised and the value of what was received, plus damages for pain and suffering and penal damages to punish the tour operator.","A refund of the price paid for the holiday, plus damages for pain and suffering and for disappointment and mental distress."],ans:"B",expl:"(B) The couple can recover expectation damages for the difference between the value of what was promised and what they received. They can also recover damages for pain and suffering. Because the purpose of the contract was enjoyment, this is one of the exceptional cases where damages will be awarded for loss of enjoyment and mental distress. (A) and (C) are incorrect because the courts will not award the cost of an entire new cruise when the claimants have already enjoyed the benefit, even limited, of a first cruise. Also in (A) there is no mention of disappointment or mental distress. (D) is incorrect because penal damages are not awarded for breach of contract. (E) is incorrect because an award of a refund would fail to take account of the benefit, even limited, that the couple have received under the contract."},{n:48,id:"ETH141",scenario:"A law firm is trying to reduce its overheads and decides that it will charge clients a fee of £100 for investigating complaints. They feel this will enable them to provide a more professional response than would otherwise be the case, and they ensure that the terms are very clearly stated in both their terms of business and their complaints procedure.",q:"Can the firm proceed with this plan in accordance with the SRA Standards and Regulations?",opts:["No, because client complaints must be dealt with free of charge.","Yes, because the SRA Standards and Regulations do not contain any relevant requirements about handling complaints.","Yes, because a £100 fee is reasonable.","Yes, because the firm will clearly inform the clients of the fee.","No, because the SRA state that a charge can be made only if the complaint is clearly without merit."],ans:"A",expl:"(A) The SRA states that all client complaints must be dealt with promptly, fairly, and free of charge. The law firm's proposals place them in breach of this regulatory duty. (B) is incorrect because the SRA Standards and Regulations contain specific requirements for handling complaints. (C) and (D) are incorrect because it is irrelevant that the fee is reasonable and clients will be informed; the firm cannot charge a client for dealing with their complaint. (E) is incorrect because a firm cannot charge a client for handling any complaint, even if the complaint is clearly without merit."},{n:49,id:"LGS006",scenario:"A firm of solicitors carrying out reserved legal activities has purchased professional indemnity insurance at the required minimum coverage level required by the Solicitors Regulation Authority.",q:"Which of the following best describes the additional professional indemnity insurance standard required by the SRA?",opts:["The insurance must be sufficient and appropriate.","The insurance must be adequate and appropriate.","The insurance must be reasonable and sufficient.","The insurance must be appropriate and reasonable.","The insurance must be adequate and sufficient."],ans:"B",expl:"(B) The insurance must be adequate and appropriate. The rest are incorrect as they do not properly describe the required standard."},{n:50,id:"TRT083",scenario:"A woman is injured in an accident caused by the negligence of the defendant. She survives and is able to continue working but her injuries reduce her life expectancy. As a result, her working life will be shortened and she is worried about the wages she will not earn during these 'lost years' because she has young children who are dependent on her.",q:"In a claim by the woman to recover damages, which of the following statements best explains the effect of her reduced life expectancy caused by the accident?",opts:["The woman can claim in full the gross wages she would have earned during the 'lost years'.","The woman cannot claim any sum for the wages she would have earned during the 'lost years' because such loss is too remote.","The woman cannot claim any sum for the wages she would have earned during the 'lost years' because her dependent relatives will have a separate claim for such loss.","The woman can claim a sum for the wages she would have earned during the 'lost years' but this will be subject to a reduction for the amount she would have spent on her own living expenses during that period.","The woman can claim in full the net wages she would have earned during the 'lost years'."],ans:"D",expl:"(D) The woman can recover damages for her loss of earnings during the years she would have worked but is no longer expected to survive. However, she must not be over-compensated. Had she lived, she would have spent part of her earnings on her own living expenses. So, the award of damages will reflect her earnings after deduction of those living expenses. (A) and (E) are not correct. The woman cannot recover her wages in full - as explained above. (A) is also incorrect because it refers to a calculation based on gross wages. The calculation would be based on net wages. (B) is not correct. Damages are too remote if they are not reasonably foreseeable. However, only the type of damages need be foreseeable, not its full extent. The woman has suffered a foreseeable type of damage (personal injury), so a reduction in life expectancy and consequential loss of earnings need not be specifically foreseeable. (C) is not correct. The loss caused by reduced life expectancy is suffered by the woman and must be recovered in her claim. The woman's dependent relatives do not have any separate claim against the defendant. In contrast, when the injured person dies leaving an outstanding claim against the defendant, the claim for the deceased's estate (which survives death) does not cover loss of future earnings but is instead a new claim for the dependents' own loss."},{n:51,id:"CTR144",scenario:"An employee of a company providing financial advice has a clause in their contract of employment restricting them from working as a financial adviser within a radius of 50 miles around the company's offices for six months after they leave their employment.",q:"Which of the following statements best describes the status of this clause?",opts:["It is valid because an employer has an absolute right to require employees to refrain from competing with the employer for at least six months.","It is void because it is a result of duress or undue influence by the employer.","It is voidable by the employee because such a clause restricts an employee from using the general skills that they have developed during their employment.","It is void for initial illegality unless it is reasonably necessary to protect the employer's legitimate interests.","It is valid because employers have a legitimate interest in preventing their employees from abusing the employer's reputation and contacts."],ans:"D",expl:"(D) This is a restraint of trade clause, sometimes called a 'restrictive covenant'. A restrictive covenant is void for illegality as a restraint of trade unless a court finds that it is reasonably necessary to protect the employer's legitimate interests. The court will consider, amongst other things, the activities prohibited and the duration and geographical scope of the prohibition. (Note that financial advisers tend to work over a very broad geographical area, so a 50-mile radius is by no means unrealistic.) (A) is incorrect because as just indicated, there is no absolute right to impose a restraint of trade. (B) is incorrect because we have no facts indicating that there was duress or undue influence. Duress requires illegitimate pressure and undue influence requires improper pressure. Since an employer can require an employee to enter a restrictive covenant to protect legitimate interests, we would need some facts indicating that the employer used illegitimate or improper pressure. Moreover, contracts entered into as a result of duress or undue influence are voidable, not void. (C) is incorrect because a restrictive covenant is not drafted so as to prevent the employee from using their skills; it is drafted so as to prevent them from competing. (In contrast, a clause which specifically prohibited the employee from using their general skills, as protected confidential know-how, might well be void.) (E) is not correct because the employer needs to prove that this clause is reasonably necessary to protect its legitimate interests."},{n:52,id:"CNL176",scenario:"A lecturer at university is preparing a lecture on UK constitutional law. One topic the lecturer plans to discuss is the royal prerogative.",q:"Which of the following best describes the royal prerogative?",opts:["Powers that are recognized by common law as belonging to the Crown and that do not derive from Acts of Parliament.","The Monarch must always act on the advice of her ministers, in particular the Prime Minister.","The Monarch's power to withhold the Royal Assent if the Monarch disagrees of an Act of Parliament.","The Monarch's power to publicly disagree with positions of the government.","Powers of the Crown that are derived from Acts of Parliament as opposed to common law."],ans:"A",expl:"(A) Royal prerogative powers are powers that are recognized by common law as belonging to the Crown and that do not derive from Acts of Parliament. (B) is incorrect as that reflects the cardinal convention. (C) is incorrect because it neither reflects the royal prerogative nor is accurate - by convention, the Monarch is expected to grant the Royal Assent to bills approved by Parliament. (D) is incorrect for similar reasons - it does not reflect the royal prerogative and misstates the cardinal convention (the Monarch must accept the advice of government ministers and may not disagree publicly in exchange for the right to be consulted, to warn, and to encourage government privately). (E) is incorrect because it misstates the description of the royal prerogative. As explained above, the royal prerogative is derived from common law and not from Acts of Parliament."},{n:53,id:"BSL203",scenario:"A company has voted to change its name. The company has adopted the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association.",q:"In addition to the required fee, what must be filed at Companies House to facilitate the name change?",opts:["New articles of association containing the new name and the shareholders' resolution to change the name.","A 'Change Your Company's Name by Resolution' form and the shareholders' special resolution to change the name.","A 'Change Your Company's Name by Resolution' form and the board resolution changing the name.","A 'Change Your Company's Name by Resolution' form and the shareholders' ordinary resolution to change the name.","Only a 'Change Your Company's Name by Resolution' form."],ans:"B",expl:"(B) A change in the company's name must be approved by a members' special resolution and all special resolutions must be filed at Companies House. There also is a special form for this purpose that must be filed: a 'Change Your Company's Name by Resolution' form. (A) is incorrect as new articles are not required, but the requisite form must be filed. (C), (D), and (E) are incorrect because a shareholders' special resolution (not a board resolution or an ordinary shareholders' resolution) is required."},{n:54,id:"TRT036",scenario:"A pilot was flying her small plane when the engine suddenly malfunctioned. The pilot had no choice but to make an emergency landing. She could see two possible landing sites: a ploughed field and a car park. She decided to land on the car park. As she came in to land on the car park, the plane's wing hit a parked car belonging to the claimant, causing it serious damage.",q:"Which of the following statements best describes the outcome of an action by the claimant against the pilot for the damage to his car?",opts:["The claimant will not succeed because the pilot made the decision to land on the car park rather than the field under emergency conditions.","The claimant will succeed if it is established that the pilot's choice to land on the car park rather than the field was not a reasonable choice under the circumstances.","The claimant will not succeed because the emergency conditions meant that the pilot had no choice but to land the plane.","The claimant will only succeed if it can be shown that the pilot knew that the engine was faulty.","The claimant will not succeed because there is nothing to suggest that the pilot should have known that the engine was faulty."],ans:"B",expl:"(B) The claimant will succeed under the conditions stated in choice (B). The claimant could bring a claim in negligence. He needs to establish that the pilot owed him a duty of care, that the duty was breached, and that the breach caused the damage. The duty would be breached by a failure to take reasonable care. So, a finding that the pilot's choice to land on the car park rather than the field was not reasonable under the circumstances would tend to establish that the pilot was in breach of her duty owed to the claimant. (A) is not correct. The pilot would be liable to the claimant if she fell below a reasonable standard of care, as stated in (B). The fact that she landed in emergency conditions is just one factor to be taken into account in determining what was reasonable. (C) is not correct. Although the pilot had no choice but to land, she was still obliged to exercise reasonable care in carrying out the landing, as stated above. (D) is not correct because the liability of the pilot depends on failing to take reasonable care during the landing, as discussed above. (E) is not correct. The pilot may not have been negligent in relation to the faulty engine but her liability for damage to the claimant's car depends on her failing to take reasonable care during the landing, as discussed above."},{n:55,id:"CTR094",scenario:"A landowner and his tenant, a farmer, entered into a written contract. It was customary in their industry for a landowner to give his tenants a seed and labour allowance to keep the land well maintained and suitable for growing crops. The contract between the landowner and the farmer expressly states that no sums are due to the farmer from the landowner. The farmer has requested his seed and labour allowance from the landowner.",q:"Is he entitled to it?",opts:["No. The parties have expressly agreed that the landowner is not required to pay anything to the farmer under the contract.","No. As the contract is in writing, the parol evidence rule will apply and therefore the contract terms cannot be varied.","No. The written contract represents the entire agreement between the parties.","Yes. The Sale of Goods Act 1979 would imply a term into the contract allowing the farmer to claim for the allowance.","Yes. The seed and labour allowance is an implied term due to the fact that it is customary in this industry for it to be paid."],ans:"A",expl:"(A) Terms can be implied into contracts by custom and usage, but terms agreed expressly between the parties will override any such terms. Thus (A) is the correct answer. (B) is incorrect as implied terms are one of the exceptions to the parol evidence rule. (C) is incorrect as there is no suggestion that the parties had included an entire agreement clause into their contract. (D) is incorrect because it would be custom and usage that would imply terms such as the seed and labour allowance into a contract, not statute. There is no indication of any reason why the Sale of Goods Act 1979 would apply to this contract. (E) is incorrect as terms are unlikely to be implied on the basis of custom and usage if they contradict express terms."},{n:56,id:"DIS066",scenario:"After a lengthy stay in a hospital, a pedestrian issued proceedings in the High Court against a lorry driver and his employer who the pedestrian claimed was at fault for the accident. The pedestrian lost at trial, and they want to appeal their case.",q:"From which court(s) may the pedestrian get permission to appeal?",opts:["The High Court only.","The Court of Appeal only.","The County Court.","The High Court and the Court of Appeal.","The Supreme Court only."],ans:"D",expl:"(D) A party wishing to appeal may make an application to appeal in either the court where the decision was made or the court in which the appeal would be heard. Here, the case was heard in the High Court, and the case would be appealed to the Court of Appeal, so either the High Court Judge or the Court of Appeal could give permission to appeal. (A) and (B) are incorrect because they each fail to mention the second possibility. (C) is somewhat obviously incorrect, as the County Court is a lower court. (E) is incorrect because the Supreme Court will not hear the appeal.",note:'This question appears twice in the source document (on two consecutive pages, both numbered "56 of 90"); it is reproduced once here.'},{n:57,id:"ETH158",scenario:"A junior solicitor becomes aware that her supervising partner has been lying to clients about the status of their cases. The junior solicitor visits the firm's compliance officer for legal practice ('COLP') and explains this to him. The COLP thanks the junior solicitor for informing him of the matter and says that he will report it to the SRA straight away. However, the COLP does not make any report to the SRA, and the junior solicitor does not check to ensure that a report was made.",q:"Has the junior solicitor breached the SRA Code of Conduct?",opts:["Yes, because she failed to report the matter to the SRA herself.","No, because she provided the information to the COLP on the understanding that the COLP would make a report to the SRA.","Yes, because she failed to ensure that the COLP reported the matter to the SRA.","No, because a junior solicitor is not obliged to report their supervisor's breaches.","No, because a solicitor is obliged to report their own serious breaches only, not the breaches of others."],ans:"B",expl:"(B) If a solicitor is aware that any person or body (including themselves) has committed a serious breach of a regulatory arrangement, they must ensure that a prompt report is made to the SRA or other approved regulator, as appropriate. Any obligation to provide information to the SRA is satisfied if the solicitor provides the information to their firm's COLP (compliance officer for legal practice) or COFA (compliance officer for finance and administration), as and where appropriate, on the understanding that they will provide the information to the SRA. (A) is incorrect because the solicitor met her obligation by providing the information to the COLP on the understanding the COLP would make a report. (C) is incorrect because the solicitor generally has no duty to check that a report was made. There is no indication here that the junior solicitor suspected that the COLP would not make a report. (D) is incorrect because there is no such exception. (E) is incorrect because a solicitor must report the serious breaches of other solicitors, as well as their own serious breaches."},{n:58,id:"TRT059",scenario:'A pilot runs a small business carrying passengers in his light aircraft. A customer books a flight. When the customer arrives, the weather is bad, so the pilot suggests that they go to the bar for a drink whilst they wait for the weather to improve. The pilot and passenger remain in the bar drinking together until they are both quite drunk. The passenger then asks the pilot to set off in the plane despite the bad weather. The pilot agrees to fly but says: "I will not accept any liability for the consequences." They set off in the plane but crash after a very short flight. Both survive, but the passenger is badly injured.',q:"In an action by the passenger against the pilot, which of the following best states the likely outcome?",opts:["The passenger will not have a successful claim because the defence of voluntary assumption of risk will apply.","The passenger will not have a successful claim because he failed to take reasonable care for his own safety.","The passenger will have a successful claim, but his damages will be reduced because of his failure to take reasonable care for his own safety.","The passenger will have a successful claim because the pilot owed him an established duty of care as his passenger, and his damages will not be reduced.","The passenger will not have a successful claim because the pilot expressly told the passenger that he would not accept any liability."],ans:"A",expl:"(A) The passenger will not prevail. Despite the fact that the pilot owed the passenger a duty of care, and was in breach of that duty, so causing the passenger's damage, the passenger voluntarily accepted the risk of the pilot's negligence by encouraging him to fly whilst drunk and in bad weather. (B) is not correct. A failure by the claimant to take reasonable care for his own safety, which contributed to causing the harm suffered, would give rise to the defence of contributory negligence. However, this is not a complete defence to the claim, but results in a reduction in damages. (C) is not correct. It is true that failure by the claimant to take reasonable care for his own safety, which contributed to causing the harm suffered, would give rise to the defence of contributory negligence, resulting in a reduction in damages. However, on these facts, the pilot will have the complete defence of voluntary assumption of risk, as explained above. (D) is not correct. It is true that the pilot owed his passenger a duty of care, but this is not sufficient to give rise to a successful claim, as explained above. (E) is not correct. The pilot's words are an attempt to exclude his liability to the passenger. However, by statute, where the defendant acts in the course of a business, liability for death or personal injury arising from negligence cannot be excluded."},{n:59,id:"CTR101",scenario:"A craftsperson entered into a written agreement with a carpenter for the construction of a garden shed on the craftsperson's property for her to use as a workshop. The contract provided that the carpenter would receive the contract price when the garden shed was fully completed. Halfway through construction, a piece of a defunct satellite re-entered the Earth's atmosphere and a large chunk of it crashed directly into the partially constructed shed, causing a fire and destroying the shed.",q:"What is the carpenter entitled to recover under the contract?",opts:["One-half of the contract price because he completed one-half of the shed before it was destroyed.","The entire contract price because the shed's destruction was beyond the carpenter's control.","The entire purchase price as the contract has been substantially performed.","The cost of his materials and reasonable labour costs.","Nothing."],ans:"E",expl:"(E) The carpenter will not be able to recover anything under the contract because he has not performed his duty. The requirement for complete performance was not discharged by frustration because construction has not been made impossible, but rather merely more costly. The carpenter can rebuild the shed. Thus, he is not entitled to any recovery. (A) is incorrect because the contract is not divisible (that is, it cannot be subdivided into components) or subject to stage payments; thus, completion of one-half of the shed does not entitle the carpenter to half of the price. (B) is incorrect because it is irrelevant that the carpenter was not at fault. As stated above, the carpenter cannot recover under the contract as he did not discharge his obligation. (C) is incorrect because there is nothing to suggest that the contract has been substantially performed. This would require a much greater degree of performance. What is required is substantial, but imprecise, performance of the main obligations under the contract. The main obligation under the contract in this example is construction of the shed and this has not happened. (D) is not correct. In an appropriate case, the carpenter might have recovered the cost of his materials and reasonable labour costs as a quantum meruit if the craftsperson had voluntarily accepted the partially completed shed. Here, there is nothing for her to accept."},{n:60,id:"DIS208",scenario:"A claimant wants to make an application for a search order to preserve relevant evidence and property.",q:"Which of the following must the claimant show to obtain the search order?",opts:["That their likelihood of success on the claim is beyond reasonable doubt and that there is a real risk that the defendant may dispose of relevant evidence.","That their likelihood of success on the claim is beyond reasonable doubt and that the documentation for preservation is crucial to determination of the case.","That there is a strong prima facie case against the defendant on merits and that there is a real possibility that the defendant will destroy evidence in its possession before an application can be made on notice.","That there is a strong prima facie case against the defendant on merits and that they have fully complied with any relevant pre-action protocol or with the spirit of the Practice Direction.","That there is a strong prima facie case against the defendant on merits and that it is in the public interest for the court to make the order."],ans:"C",expl:"(C) To obtain a search order for the preservation of evidence or property, the applicant must show a strong, prima facie case against the defendant on merits and that there is a real possibility that the defendant will destroy evidence in its possession before an application can be made on notice. In addition, the applicant must persuade the judge that the defendant's activities cause very serious potential or actual harm to the claimant's interests. (A) and (B) are incorrect because the applicant need not prove anything beyond a reasonable doubt - that is a criminal standard and has no application in civil law. (B) is also incorrect in that it suggests the applicant must prove that preservation of the evidence is crucial. This, too, is too high a standard. As indicated above, the applicant need only show a serious potential of harm to the claimant's interests. (D) is incorrect because there is no requirement that the applicant prove at this point that they have complied with relevant pre-action protocol or the spirit of the Practice Direction; although this will be relevant later in the case. (E) is incorrect because the wider public interest is not a specific consideration here."}],J1=[{n:61,id:"CNL175",scenario:"The current UK government adopts a position that Parliament should pass an Act relaxing limits on carbon emissions in factories by 10%. Two friends are watching the Secretary of State for Environment, Food, and Rural Affairs give a speech supporting the government's position. One friend says he cannot understand why the Secretary of State would be making such an argument, explaining the two went to school together and the Secretary of State is personally in favour of strict emission standards. The other friend explains that it's probably due to collective responsibility.",q:"Which of the following best states the legal position?",opts:["Under the doctrine of collective responsibility, the three branches of government are separate in terms of their function and personnel.","Under the doctrine of collective responsibility, the highest source of law in the UK's legal system is an Act of Parliament.","Under the doctrine of collective responsibility, government ministers may not be questioned in court for what is said before Parliament.","Under the doctrine of collective responsibility, government ministers must support government policy in public or before Parliament, regardless of their own views.","Under the doctrine of collective responsibility, government ministers must support all Acts proposed by Parliament."],ans:"D",expl:"(D) Under the doctrine of collective responsibility, government ministers must support government policy in public or before Parliament, regardless of their own views. (A) is incorrect as it reflects the concept of separation of powers. (B) is incorrect as it reflects the concept of parliamentary sovereignty (sometimes called parliamentary supremacy). (C) is incorrect because there is no such rule. It muddles parliamentary privilege, which provides, among other things, that members of the House of Commons and House of Lords may not be questioned in court for what is said in Parliament. (E) is incorrect because there is no such rule; collective responsibility goes to the duty ministers owe to government rather than to Parliament.",note:"The scan captures this explanation out of order; it has been reassembled in reading order from the page image."},{n:62,id:"BSL207",scenario:"Over a number of years, a company's core business has changed and it wishes to change its name by special resolution to better reflect the core business. The company has adopted the Companies (Model Articles) Regulations 2008 (unamended) as its articles of association. The company sends out a notice of general meeting to its shareholders by post on the 1st of the month, which was a weekday.",q:"If the meeting is held on full notice, what is the earliest day the company could hold the general meeting?",opts:["The 14th of the month.","The 15th of the month.","The 16th of the month.","The 18th of the month.","The 25th of the month."],ans:"D",expl:"(D) A general meeting can be called on 14 clear days' notice. This means you cannot count the date the notice is sent out or the date of the meeting itself. In addition, if the notice is not hand delivered, then you must allow two days for delivery of the notice. Therefore, if a notice is posted on the 1st of the month, the meeting can be held no earlier than the 18th. (A) is incorrect as here you have not allowed for 14 clear days, nor for the delivery days. (B) is wrong as you have not allowed for both clear days and not allowed for posting. (C) is incorrect as you have allowed for posting, but not for clear days. (E) is incorrect as a general meeting requires 14 days' notice, even if a special resolution is proposed."},{n:63,id:"CNL172",scenario:"A woman has a claim under the European Convention on Human Rights. There is a previous decision that would be unfavourable to her case. However, she wants to rely on the 'living instrument' principle to persuade the European Court of Human Rights ('ECtHR') to follow a different approach.",q:"Which of the following statements best describes how the living instrument principle affects the ECtHR's decision-making process?",opts:["The ECtHR may follow its previous decisions, but it is not obligated to follow its previous decisions if a new issue has arisen or a group of states has adopted a different, consistent approach.","The ECtHR must follow its previous decisions irrespective of whether a new issue has arisen or a group of states has taken a different approach.","The ECtHR must not follow its previous decisions and is obligated to take a different approach if a new issue arises justifying a change in approach.","The ECtHR must not follow previous decisions if it finds that its departure from the previous decision is 'necessary'.","The ECtHR must not follow its previous decisions if it finds there is a legitimate aim justifying the change in direction and the decision is proportionate."],ans:"A",expl:"(A) Under the living instrument approach, the ECtHR may follow previous decisions, but it is not obligated to if circumstances have changed since that decision was made. For instance, a change in socio-economic conditions may justify a different approach to human rights law. The ECtHR may also choose to follow a consistent approach adopted by a group of states on a particular issue. (B) is incorrect because the duty to follow previous cases is not mandatory, and the ECtHR does not have to follow an earlier decision if circumstances have changed. (C) is incorrect because the ECtHR can choose to follow its previous decisions if it wishes. (D) and (E) are incorrect because they refer to the proportionality test, which does not relate to the ECtHR's interpretation duties."},{n:64,id:"TRT134",scenario:"A casino was considering extending credit to a new customer, so it needed a credit reference from his bank. In the interests of customer confidentiality, the casino used an agency to seek the reference without disclosing the name of the casino or the purpose for which the reference was sought. The bank gave a favourable credit reference, which led the casino to extend credit to the customer. The customer ran up large gambling debts and then failed to pay. It transpired that the credit reference had been given carelessly and was inaccurate. In fact, the customer had no money in his bank account, so the casino was unable to recover the debt.",q:"In an action by the casino against the bank to recover the casino's losses from the customer's unpaid gambling debt, which of the following best states the likely outcome?",opts:["The casino will not be successful because the bank did not owe the casino a duty of care in respect of the losses from the unpaid debt.","The casino will not be successful because it has suffered pure economic loss which is never recoverable in the tort of negligence.","The casino will not be successful because it did not pay the bank for providing the credit reference, so no duty of care could be owed.","The casino will be successful because it relied on the bank's credit reference in extending credit to the customer, so the bank's negligence was a direct cause of the casino's loss.","The casino will not be successful because the loss which it suffered was not a reasonably foreseeable result of the bank's negligence."],ans:"A",expl:"(A) The casino will not be successful. The action by the casino against the bank would be in the tort of negligence, so the casino must show that the bank owed it a duty of care. The casino has suffered pure economic loss, and the general rule is that no duty of care is owed in respect of pure economic loss. An exception applies for pure economic loss caused by a negligent misstatement, where there is an assumption of responsibility by one party and reasonable reliance by the other. However, for an assumption of responsibility to arise, it must be shown that the bank knew the purpose of the statement and the person to whom it was made. Because the bank did not know this information, these requirements are not satisfied, so no duty of care would be owed by the bank to the casino. (B) is not correct because it is too broad to say that pure economic loss is never recoverable in the tort of negligence, given the exception discussed above. (C) is not correct because it does not state the correct reason why the bank is not liable. Despite the fact that the casino did not pay for the credit reference, a duty of care could have arisen if the conditions described above had been satisfied. (D) is not correct. It is true that the bank's negligence was the cause of the casino's loss, but this is not sufficient to give rise to a successful claim - because no duty of care was owed, as explained. (E) is not correct because it does not state the correct reason why the bank is not liable. On the facts, the loss suffered by the casino may well be a reasonably foreseeable result of the bank's negligence, but this is not sufficient for a successful claim, unless the bank owed a duty of care. However, no duty was owed under the circumstances here."},{n:65,id:"DIS027",scenario:"A new home buyer initiates a claim against the developer. The claim is assigned to the fast track. As part of a fast track claim, the court orders standard disclosure in the case.",q:"Which of the following statements most accurately describe the parties' obligations regarding documents that must be included under 'standard disclosure'?",opts:["The parties need only disclose documents and evidence that they plan to tender in support of their claim.","The parties need only disclose documents and evidence which supports their case.","The parties need only disclose documents that are physically within their own possession.","The parties need only disclose physical documents, but not emails, which require an order for specific disclosure.","The parties must disclose any documents upon which they will rely together with any documents that affect their case adversely or support the other party's case."],ans:"E",expl:"(E) The duty of disclosure is wide ranging. A party is under an obligation to disclose relevant documents that are damaging to its case or their opponent's case or that are helpful to the opponent's case. (A) is incorrect because, in addition to disclosing documents in support of its case, a party also is required to disclose documents which undermine its case or help or hurt the opponent's case. (B) is incorrect because the answer suggests that adverse documents are immune from disclosure, which is not the case. (C) is incorrect because relevant documents (that is, those helpful or adverse to either party's case) must be disclosed if in the party's control (that is, they have or had possession of the document or a right to possess, inspect, or copy). (D) is incorrect because disclosure obligations are not restricted to physical documents; they also include electronic documents."},{n:66,id:"LGS038",scenario:"A solicitor is bringing a claim against her firm for direct discrimination on the grounds of sex because she was passed over for promotion due to being on maternity leave.",q:"Can the firm seek to justify the sex discrimination against the employee under the Equality Act 2010?",opts:["Yes, if it can show that it has a legitimate aim only.","Yes, if it can show that it has a legitimate aim and the means of achieving that aim are proportionate.","Yes, if it can show that the aim was proportionate only.","No, direct discrimination based on sex cannot be justified.","No, it cannot justify direct sex discrimination because it has no legitimate aim."],ans:"D",expl:"(D) Direct discrimination on the grounds of sex cannot be justified. Generally, there is no justification for direct discrimination. The exceptions to this are for the protected characteristics of age and disability. (A) is incorrect because direct discrimination based on sex cannot be justified even if there is a legitimate aim. (B) is incorrect because direct discrimination based on sex cannot be justified even if there is a legitimate aim achieved by proportionate means. (C) is incorrect because direct discrimination based on sex cannot be justified. If justification is permitted, the firm must show its action is a proportionate means of achieving a legitimate aim. (E) is incorrect because direct discrimination on the grounds of sex cannot be justified, so the legitimacy of the aim is irrelevant."},{n:67,id:"LGS090",scenario:"A solicitor is acting for a client on a conveyancing matter. The solicitor has concluded that he is carrying on a regulated activity because he is advising the client about an insurance policy and no exclusion applies. However, the solicitor thinks he may be able to rely on the Designated Professional Bodies exemption because his firm is a member of the Solicitors Regulation Authority ('SRA'). Neither the solicitor nor his firm is authorised by the Financial Conduct Authority to carry on a 'regulated activity' as defined in the Financial Services and Markets Act 2000 and related secondary legislation.",q:"Which of the following best describes the availability of the Designated Professional Bodies exemption?",opts:["The exemption is available only if the activity is billed separately from the solicitor's other legal advice.","The exemption is available if the activity is incidental to the legal advice the solicitor is giving and to the work of the firm as a whole.","The exemption is available only if the solicitor receives a referral commission from an insurance broker and does not inform the client.","The exemption is available only for the specified activity of arranging.","The exemption is not available for activities relating to contracts of insurance."],ans:"B",expl:"(B) The exemption is available if the activity is incidental to the legal advice the solicitor is giving and to the work of the firm as a whole. If there is a regulated activity, the Financial Services and Markets Act 2000 exempts incidental activities of members of certain Designated Professional Bodies, including members of the SRA. Under this exemption, if a solicitor provides a financial service incidentally to the provision of legal advice and does not receive compensation for this from anyone else without accounting to the client for it, the services will be exempted. For the designated professional body exemption, the activity must be incidental to both the legal advice and the work of the firm as a whole. (A) is incorrect because there is no such requirement to bill separately for the solicitor to avail himself of this exemption. (C) is incorrect because the exemption does not apply if the solicitor receives compensation from anyone for which he does not account to the client. (D) is incorrect as there is no such limitation on the availability of the exemption. (E) is incorrect because the limitation on insurance-related activities applies to the necessary exclusion, not this exemption."},{n:68,id:"BSL048",scenario:"A young man was given one share of a company by his aunt. The company has issued 100 £1 shares. The company was happy to transfer the shares to the young man, as his aunt is the majority shareholder. The young man has never owned shares in any company before.",q:"To which of the following rights is the young man entitled?",opts:["To demand an annual dividend.","To take part in day-to-day management of the company.","To inspect the company books and records.","To demand that the company issue a new class of shares.","The right to call a meeting of shareholders."],ans:"C",expl:"(C) A shareholder has the right to inspect the register of members, register of directors, and PSC (persons with significant control) register pursuant to the provisions of the Companies Act 2006. (A) is incorrect as shareholders do not have an automatic right to a dividend, as the declaration of a dividend requires there to be profits available for the purpose and for the directors to recommend a dividend. (B) is incorrect as shareholders have no right to take part in the day-to-day management of the company: that power falls to the directors. (D) is incorrect as the shareholders would vote on whether to issue a new class of shares; it is not an automatic right of a shareholder to demand such an issue. (E) is incorrect because only shareholders who hold shares representing at least 5% of the paid-up voting capital can require the directors to call a meeting."},{n:69,id:"CNL100",scenario:"A group are planning to hold a march in Central London to campaign for animal rights. They intend on giving the police notice of this march.",q:"Which of the following is not a requirement of the notice?",opts:["The route of the march.","The date of the march.","The names and addresses of everyone intending to take part in the march.","The name and address of the person or persons organising the march.","That the notice be delivered to a police station in the area in which the march will take place."],ans:"C",expl:"(C) The notice need not include the names and addresses of everyone intending to take part in the march. The notice must include the date, time, and route of the march and the name and address of the person or persons organising the march. Further, it must be delivered to a police station in the area in which the march will take place. Therefore, (A), (B), (D), and (E) are incorrect."},{n:70,id:"CTR139",scenario:"A kitchen fitter agreed to supply and install a kitchen in a company's offices. When the work was completed, the company's manager noticed that some of the kitchen tiles are badly grouted and a joint in the drain under the sink is leaking because it was not put together properly.",q:"Assuming that there are no relevant terms in the contract, what are the company's remedies?",opts:["The company can claim damages for breach of a term implied under the Supply of Goods and Services Act 1982.","The company can require the kitchen fitter to come back to rectify the work.","The company can terminate the contract and reject the kitchen for breach of a condition implied under the Supply of Goods and Services Act 1982.","The company can refuse to pay for the kitchen because this is an entire contract.","The company can terminate the contract and claim damages because the kitchen is not of satisfactory quality."],ans:"A",expl:"(A) The Supply of Goods and Services Act 1982 ('SGSA') implies a term that services will be carried out with reasonable care and skill. That term seems to have been breached here. It is an innominate term, so the consequences of breach will depend on how serious the breach is. In this case, the breach is easily remedied, so it will be treated as a breach of warranty and the company will only be able to claim damages. (B) is incorrect, because there is no automatic right to require rectification (unless the contract provides for it). In practice, though, that is what the fitter might want to do. (If the Consumer Rights Act 2015 had applied then it would give an aggrieved consumer a right to rectification.) (C) is not correct because the relevant term is a 'term' and not a condition, and this breach is not serious enough to be treated as a breach of condition. (D) is incorrect because there has been substantial performance of the contract. When there is substantial performance and a minor breach, the nonbreaching party cannot cancel the contract. (E) is not correct for two reasons: First, it states the standard that applies in a sale of goods (satisfactory quality); the standard for services is lower (reasonable skill). Additionally, as discussed above, because the breach is relatively minor and there is substantial performance, the remedy would be damages rather than termination of the contract."},{n:71,id:"BSL231",scenario:"A woman began working in a restaurant several years ago. The owner soon noticed that the woman had a keen understanding of the restaurant business and made her the manager of the business. The restaurant continued to do well under her leadership. The owner recently incorporated the business and asked the woman whether she would be happy to sit on the company's board of directors and to run the business that way. The woman agreed, and the owner properly appointed the woman to sit on the board and properly reported the appointment to Companies House.",q:"What is the name given to a director who has been appointed like the woman?",opts:["A shadow director.","A de facto director.","An non-executive director.","A de jure director.","A innominate director."],ans:"D",expl:"(D) A de jure director is a director properly appointed by law, having complied with all the necessary formalities required by the Companies Act 2006. The facts indicate the woman was properly appointed and, therefore, she is a de jure director. (A) is incorrect because a shadow director is a person in accordance with whose directions or instructions the directors of the company are accustomed to act, but who is not properly appointed. A shadow director is typically an individual who still wants to exert some control over a company, but in a way that evades any potential responsibility or liability connected with the office of a director, for example, because they are a disqualified director. (B) is incorrect because a de facto director is someone who has not been formally appointed and registered with the Registrar of Companies, but who carries out all the duties of and behaves as a director. (C) is incorrect because the woman would be categorised as an executive director. That is a director who is responsible for the day-to-day running of the company (and an employee). A non-executive director usually is a consultant and takes more of a supervisory role overseeing the activity of the executive directors. (E) is incorrect. Innominate means not named or classified, and there is no such classification for directors."},{n:72,id:"BSL182",scenario:`A company has 100 shareholders who paid £100 for each share. The company has gone into liquidation owing the following money:
• £100,000 to a bank, secured by a fixed charge over the company's premises (worth £150,000)
• £10,000 to employees for last month's wages
• £300,000 to other creditors
The liquidator estimates that their costs will amount to £15,000. After sale of all the assets and repayment of the bank loan, the net proceeds of sale available for distribution amount to £125,000.`,q:"In what order will the creditors be paid?",opts:["The employees, the bank, and the liquidator.","The liquidator, the employees, and then the other creditors.","The liquidator, the employees, and the shareholders.","The liquidator, and the shareholders.","The liquidator, and the other creditors."],ans:"B",expl:"(B) The bank may sell the company's premises and will be paid first. The liquidator then must pay back the creditors of the company in a set order: expenses of winding up, preferential debts, monies secured by floating charges in order of priority, unsecured creditors, and finally, shareholders. As there is £125,000 available for the creditors after the bank is paid, the liquidator's costs will be paid next, then the employees, leaving £100,000 to be shared between the other creditors. There will be no money available for the shareholders."},{n:73,id:"ETH132",scenario:"The father of a solicitor is a surveyor with his own company. The solicitor is contacted to act by a client who intends to sue this company for a survey which failed to identify some significant defects in a property she purchased. In the full knowledge that the solicitor is related to the surveyor, the client completes a written authority to allow the solicitor to continue to represent her notwithstanding the family connection. Therefore, the solicitor accepts the instruction and prepares the case against the opponent. The dispute goes to court and the client is successful and the surveyor is ordered to pay compensation.",q:"Were the solicitor's actions in accordance with the SRA Standards and Regulations?",opts:["Yes, because a solicitor can act where there is an own interest conflict if they have received written consent from the client.","Yes, because a solicitor can act where there is an own interest conflict if they are satisfied it is in their client's best interests.","Yes, because a solicitor can act where there is an own interest conflict if the solicitor and the client have a substantially common interest.","No, because a solicitor cannot act if there is an own interest conflict unless the solicitor and the client are competing for the same objective.","No, because a solicitor cannot act if there is an own interest conflict or a significant risk of an own interest conflict."],ans:"E",expl:"(E) Because of the family relationship, the solicitor should identify an own interest conflict exists and not act. As there is an absolute bar on acting in such circumstance, (A), (B), (C), and (D) are incorrect. In addition, (C) and (D) are incorrect because these 'substantially common interest' and 'competing for the same objective' exceptions apply only to conflicts which arise between clients."},{n:74,id:"ETH021",scenario:'A solicitor is in the middle of a difficult court case which he is at risk of losing. He sends the following email to an important witness: "We will pay your travel expenses to court to give evidence. In addition, if your evidence is favourable and our client wins their case, we will pay a £2,000 success fee to you".',q:"Which of the following statements best describes the situation regarding the solicitor's email?",opts:["The solicitor should not have offered to pay travel expenses but was permitted to offer the £2,000.","The solicitor should not have offered to pay travel expenses or the £2,000.","The solicitor was permitted to offer to pay travel expenses and the £2,000.","The solicitor was permitted to offer to pay travel expenses but should not have offered the £2,000.","The solicitor should not have had any direct contact with a witness other than to ask for the name and address of the witness's lawyer."],ans:"D",expl:"(D) A solicitor is generally permitted to pay a witness's travel expenses but must not make or offer to make payments to a witness dependent upon their evidence or the outcome of the case. Offering the success fee is a clear breach of the Code. Therefore, (A), (B), and (C) are incorrect. (E) is incorrect because while a solicitor generally should not contact represented parties in a matter, there is no rule prohibiting contact with a witness. Here there is no indication that the witness is a party."},{n:75,id:"DIS179",scenario:"A borrower defaults on a loan obligation with their lender. To avoid enforcement agents, the borrower has moved several times over the past year and has transferred a bank account to their adult child to attempt to put the account beyond the court's reach. As a result of the non-payment, the lender properly initiates a claim against the borrower. The lender is concerned that the borrower will not be able to pay its costs should it prevail in the case, given that the borrower already defaulted on the loan. As a result, the lender makes an application to require the borrower to provide security for costs.",q:"Is the court likely to grant the security for costs order?",opts:["No, because the borrower is the defendant.","No, because it would be unjust to have the borrower provide security given the financial disparity between the parties.","Yes, because the borrower is clearly having financial difficulties and would likely not pay costs if ordered to do so.","Yes, because the borrower attempted to avoid collections by moving several times, and thus they likely will avoid paying costs.","Yes, because the borrower transferred assets to a third party."],ans:"A",expl:"(A) Only a defendant may make an application for security for costs. The order is available if the defendant is concerned that the claimant will not be able to pay the defendant's costs if the defendant wins the case, and can prove one of the situations set out in statute and court rules necessary for the grant, such as where the defendant can show the claimant resides outside the jurisdiction, the claimant is a company and there is reason to believe it will not be able to pay, the claimant has taken steps with regard to its assets to make it difficult to enforce an order for costs, and the like. The logic for limiting such orders to defendants is that the defendant cannot stop the claimant from bringing proceedings, whereas a claimant can choose not to bring proceedings when collecting from the defendant will be problematic. Accordingly, (B), (C), (D), and (E) are all incorrect."},{n:76,id:"BSL171",scenario:"A small company creates and sells personalised gift cards. The company has recently experienced a severe decrease in business. The sole director and shareholder of the company realises that soon the company will be unable to pay its debts. The director sells the company's inventory of paper to their spouse for £50; it is valued at £1,250 in the accounts. The director also gives their son security over the company's card embossing machine for a debt already owed to the son. Six weeks later, the company goes into liquidation.",q:"Which of the following statements reflects the legal position regarding the transfer to the spouse and the security granted to the director's son?",opts:["The security given to the director's son is not a preference, so it may not be voided by the court.","Both the transfer to the director's spouse and the security given to the director's son are preferences. They both may be voided by the court.","The transfer to the director's spouse is not a preference, so it may not be voided by the court.","Only the transfer to the director's spouse is a preference. It may be voided by the court.","The security given to the director's son is a preference. It may be voided by the court."],ans:"E",expl:"(E) The security given to the son is a preference and may be voided. A preference arises when a debtor does something that puts a creditor in a better position on liquidation or administration than they would have been had the event not occurred. Giving an unsecured creditor a security within six months of the onset of insolvency (or two years if the security is given to a connected person) when no new consideration was given for the security is a preference. A court may void a preference. Thus, (A) is incorrect. (B) and (D) are incorrect because the transfer to the spouse was not a preference. Nothing in the facts indicates the spouse was a creditor. Instead, the transfer to the spouse is a transfer at an undervalue - a transfer of property as a gift or for significantly less than market value within two years of a company's insolvency. (C) correctly states that the transfer to the spouse is not a preference, but it is not true that the transfer may not be voided by the court - the court may void a transfer at an undervalue as well as a preference."},{n:77,id:"TAX119",scenario:`A UK-resident trading company made various disposals during the year ended 31 March 2021, resulting in the following:
• Loss of £5,900 on the sale of two cars used in the business; each car cost and was sold for more than £6,000
• Gain of £12,000 on the sale of government stock
• Gain of £86,000 on the sale of an investment property`,q:"What is the net chargeable gain to include in the company's corporation tax computation for the year ended 31 March 2020 and the loss to carry forward?",opts:["Net gains of £92,100 and £0 capital loss carrying forward.","Gain of £86,000 and £5,900 loss carrying forward.","Gain of £98,000 and £5,900 loss carrying forward.","Gain of £86,000 and £0 capital loss carrying forward.","Net gains of £6,100 and £0 capital loss carrying forward."],ans:"D",expl:"(D) Gain of £86,000 and £0 capital loss carrying forward. Exempt assets are the same for companies and individuals. Cars and government stock are exempt assets and therefore any gain is not taxable, and any loss is not allowable. Only the gain on the investment property is taxable.",note:"The facts refer to the year ended 31 March 2021 but the question refers to the year ended 31 March 2020; both are reproduced as they appear in the source."},{n:78,id:"LGS096",scenario:"A newly qualified solicitor decided to work freelance. The solicitor is not authorised by the Financial Conduct Authority to carry on a 'regulated activity' as defined in the Financial Services and Markets Act 2000 ('FSMA') and related secondary legislation.",q:"Which of the following activities would the solicitor be able to conduct in her business if no FSMA exclusion or exemption applies?",opts:["Advising a client on the merits of a particular debenture.","Arranging for another person to sell land to a client.","Contracting for a mortgage contract on behalf of a client.","Managing a client's insurance contracts.","Safeguarding a client's company shares."],ans:"B",expl:"(B) Under the general prohibition of FSMA, a solicitor may not carry on regulated activity in the UK unless they are authorised or exempt from authorisation. A regulated activity is defined as an activity specified in the Regulated Activities Order relating to an investment specified in the Order, which is carried out in the course of business, and to which no exclusions apply. The specified activities and investments might be remembered with the mnemonic device 'ADAMS F.M.DIPS'. Activities = Advising, Dealing as an agent, Arranging, Managing, and Safeguarding. The specified investments most relevant to a solicitor = Funeral plans, Mortgage contracts, Debentures, Insurance contracts, Pension schemes, and Shares in a company. The solicitor would be able to arrange for the sale of land for a client because while arranging is a specified activity, land is not a specified investment. (A) is incorrect because advising is a specified activity and debentures are specified investments. (C) is incorrect because contracting on behalf of a client means the solicitor would be dealing as an agent, which is a regulated activity, and a mortgage contract is a specified investment. (D) and (E) are incorrect because both clearly involve regulated activities (managing and safeguarding, respectively) and specified investments (insurance contracts and shares in a company, respectively)."},{n:79,id:"BSL229",scenario:"A man and a woman decide to open a clothing store together. They file all papers necessary to register the business as a limited liability partnership (LLP). Each contributes £20,000 to the business, and both sign a lease on behalf of the LLP on the premises they will use as a store. The man then signs a contract on behalf of the LLP to purchases racks to display merchandise, and the woman signs a contract on behalf of the LLP to purchase clothes for the business to sell. Despite their best efforts, the man and woman close the store after one year because it is operating at a loss. After liquidating the assets of the business, £10,000 is left owing to the landlord, £4,000 is left owing on account of the racks, and £9,000 is left owing on account of the clothes that were purchased for the store.",q:"Which of the following statements is correct regarding liability for the debts still owed?",opts:["T
