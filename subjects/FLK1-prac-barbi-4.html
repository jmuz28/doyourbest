he man can be held liable for the amount left owing under the lease and for the racks only.","The woman can be held liable for the amount left owing on the lease only.","Both the man and woman can be held liable for the amount left owing on the lease, but not for the other debts.","The man and the woman can both be held liable for all of the debts remaining.","Neither the man nor the woman can be held liable for any of the debts remaining."],ans:"E",expl:"(E) Neither the man nor the woman can be held liable for any of the debts remaining. In a limited liability partnership (LLP), the members are not liable for the debts of the partnership. Here, the facts indicate that the man and the woman filed all papers necessary to form an LLP. The fact that they signed various contracts on behalf of the partnership does nothing to change the rule. As all the other choices suggest that the man or woman can be held liable for some or all the debts of the LLP, they are incorrect."},{n:80,id:"BSL221",scenario:"A company was incorporated several years ago with the Companies (Model Articles) Regulations 2008 (unamended) for private companies limited by shares as its articles of association. The company has four shareholders who are also the directors of the company. One of the directors wishes to retire from the company and transfer their shares to another of the existing shareholders.",q:"Which of the following statements best describes the power of the directors on the application of the transferee to register the share transfer?",opts:["The board can refuse to register the transfer only if the stock transfer form is incorrectly completed.","The board have an absolute power to refuse to register the transfer.","The board must register the transfer of shares as it is a transfer to an existing shareholder.","The board must offer the shares to the existing shareholders in the same ratio as they already hold shares, and only if they decline the offer can the board register the transfer.","The board can register the transfer only after the members have approved the share transfer."],ans:"B",expl:"(B) The directors have an absolute power to refuse to register a transfer of shares under the Model Articles. (A) is incorrect as although the board do not have to consider an incorrectly completed stock transfer form, they also have an absolute power to refuse to register any transfer. (C) is incorrect as there are no exemptions from the absolute power to refuse to register the shares in the Model Articles. (D) is based on the concept of preemption. Preemption applies only when the company seeks to issue new ordinary shares for cash. That is not the case here. (E) is incorrect as the members have no power to approve a transfer under the Model Articles."},{n:81,id:"BSL166",scenario:"Three friends are partners in a car wash business. A car wax supplier brings a breach of contract claim against the partnership and each partner individually in respect of a contract executed by one partner as an agent of the partnership. The partnership agreement stipulates that none of the partners is permitted to enter into a contract in excess of £10,000 without the unanimous consent of the other partners. The contract with the supplier is for £15,000.",q:"If the supplier is successful, from whom will the supplier be able to recover their damages?",opts:["The supplier will be able to recover from the personal assets of the partner who executed the contract only.","The supplier will be able to recover damages from any partner, but not the partnership, as it is not a legal entity.","The supplier will be able to recover from the personal assets of any partner.","The supplier will be able to recover from any partner, but only in proportion to how partners share losses.","The supplier will be able to recover from the assets of the partnership only."],ans:"C",expl:"(C) The supplier will be able to recover from the personal assets of any partner if the partnership cannot pay the debt out of partnership property. Partners are jointly liable for contracts of the partnership, and a creditor can seek payment from any (or all) of the partners. A debt will be considered a partnership debt if it was made by a partner with authority. Every partner has apparent authority to enter contracts that appear to be related to the partnership's business unless the third party knows the partner lacks such authority. Here, the contract was for car wax and the business is a car wash, so the contract appears to be connected to the business. And although the partners agreed that a partner needed unanimous consent to enter a contract of the size here, nothing indicates the supplier knew that. Therefore, the partnership is bound on the contract through apparent authority. (A) would be correct only if the party lacked authority of any kind to enter the contract, and here, as discussed above, the partner had apparent authority. (B) is incorrect as the creditor can pursue a partnership even though it is not a legal entity as the CPR allow this. (D) and (E) are incorrect because each partner may be held liable for the full amount of any debt of the partnership."},{n:82,id:"TRT049",scenario:"A pedestrian was injured in an accident caused by the negligence of a driver. The pedestrian suffered a fractured skull because of her pre-existing brittle bone condition. A person not suffering from that condition would only have suffered bruising and headaches as a result of the accident. The pedestrian was taken to hospital for treatment but then acted entirely unreasonably and in complete disregard of medical advice and discharged herself from hospital. On the way home, the pedestrian collapsed as a result of her head injury and suffered a broken wrist in the fall. The driver denies liability for all of the pedestrian's injuries.",q:"In a claim by the pedestrian against the driver, which of the following statements best describes the likely outcome?",opts:["The pedestrian will recover damages for all of her injuries because she can show that 'but for' the driver's negligence she would not have suffered any of the injuries.","The pedestrian will recover damages for her fractured skull but not for her broken wrist, because she cannot establish that 'but for' the driver's negligence she would not have suffered the broken wrist.","The pedestrian will recover damages for her fractured skull but not for her broken wrist because the broken wrist was not reasonably foreseeable and so was too remote a consequence of the driver's negligence.","The pedestrian will recover damages for all of her injuries because the 'egg shell skull rule' applies, as an exception to the rule that damage must be reasonably foreseeable.","The pedestrian will recover damages for her fractured skull but not for her broken wrist, because her actions in discharging herself from hospital broke the chain of causation between the driver's negligence and her broken wrist."],ans:"E",expl:"(E) The pedestrian will recover some of her damages. The driver owed the pedestrian a duty of care and was in breach. On the causation of damage issue, the pedestrian will recover damages for her fractured skull because the 'egg shell skull rule' applies to this injury. However, she will not recover damages for her broken wrist because her actions in discharging herself from hospital broke the chain of causation between the driver's negligence and her broken wrist. The claimant's own actions can break the chain of causation where the claimant has acted entirely unreasonably, and this is the case on the facts. (A) is not correct. It is correct to say that the pedestrian can show that, 'but for' the driver's negligence, she would not have suffered any of the injuries. So, she can establish causation in fact. However, this is not sufficient. She must also establish that her injuries were reasonably foreseeable and so not too remote, and that no intervening act broke the chain of causation between her injuries and the driver's negligence. On the facts, the chain of causation was broken in respect of her broken wrist, as discussed above. (B) is not correct because it does not explain the correct reason why the pedestrian cannot recover damages for her broken wrist. The pedestrian can establish that, 'but for' the driver's negligence, she would not have suffered the broken wrist. However, this is not sufficient because the chain of causation was broken by her intervening act (see discussion above). (C) is not correct because it also does not explain the correct reason why the pedestrian cannot recover damages for her broken wrist. The correct reason is that the injury to the wrist is not recoverable because the chain of causation was broken by her intervening act. (D) is not correct. It is correct to explain the 'egg shell skull rule' as an exception to the rule that damage must be reasonably foreseeable; and the rule does apply to the fractured skull. However, it is not correct to say that this will enable the pedestrian to recover damages for all of her injuries because the broken wrist is not recoverable, as discussed above."},{n:83,id:"ELS037",scenario:"A defendant in a criminal case is found guilty in the Crown Court of grievous bodily harm because a previous decision of the Court of Appeal, on materially similar facts and points of law, had found the defendant guilty. The defendant wishes to appeal her conviction.",q:"Which of the following statements best describes the position of the Court of Appeal's decision?",opts:["The decisions of the Court of Appeal bind all lower courts.","The decisions of the Court of Appeal bind all lower courts but only in regard to civil cases.","The Court of Appeal is normally bound by its own previous decisions.","The decisions of the Court of Appeal bind all courts.","The decisions of the Court of Appeal bind all lower courts unless there are appropriate factual differences between the cases."],ans:"E",expl:"(E) The Court of Appeal binds all lower courts in the hierarchy, both in criminal and civil cases, but only if the facts of the two cases are materially the same. If the two cases can be distinguished on the facts, then courts are able to depart from previous decisions. (A) is incorrect because, whilst it is true that the Court of Appeal binds all lower courts, if the cases can be distinguished then it is possible for a decision not to be binding. (B) is incorrect because the Court of Appeal binds all lower courts, both criminal and civil. Appeals to the Court of Appeal are either dealt with by the civil division or the criminal division, as appropriate. (C) is incorrect because the scenario relates to a Crown Court decision so whether the Court of Appeal is bound by its own previous decisions is irrelevant. If it were relevant the answer would still be incorrect as the Court of Appeal is usually bound by its own decisions in civil cases (with limited exceptions), but in criminal cases has a wide discretion to depart from its previous decisions where it is convinced that a case was wrongly decided and it would cause undue hardship to the defendant if the decision was followed. (D) is incorrect as the Court of Appeal does not bind the Supreme Court, and in some cases itself as seen above."},{n:84,id:"CNL109",scenario:"The House of Commons passes a bill regulating commercial fishing. The House of Lords votes against the bill. The government still wishes the bill to become law.",q:"Which of the following best explains the legal position?",opts:["The government can reintroduce the bill in the House of Commons in the same session of Parliament, and if it is passed by the House of Commons, it will immediately become law.","The government cannot reintroduce the bill and it cannot become law.","The government can reintroduce the bill in the House of Commons in the next session of Parliament, and it can still become law even if it is rejected by the House of Lords for a second time.","The House of Commons can immediately ask the House of Lords to reconsider their rejection of the bill.","The House of Commons and the House of Lords must present to the Monarch their reasons for or against the bill, and the Monarch will choose whether to grant the bill Royal Assent in order for it to become law."],ans:"C",expl:"(C) If the government reintroduces the bill in the next session of Parliament, it can still become law even if the House of Lords rejects it again. Under the Parliament Acts 1911-1949, if a bill has been passed by the House of Commons but is then rejected by the House of Lords, the House of Commons can reintroduce the bill in the next session of Parliament. If the House of Lords block the bill a second time, then the bill can still be sent for Royal Assent to become an Act of Parliament. One further condition is that a year needs to have elapsed between the bill being granted a Second Reading during the first session and a Third Reading during the second session in the House of Commons. Thus, (B) is incorrect. (A), (D), and (E) are incorrect because those procedures do not exist.",note:'The question ID is shown in the source as "CNL 109".'},{n:85,id:"CTR029",scenario:"A carpenter agreed with a property developer to perform carpentry work on a property that the developer was contracted to renovate, at an agreed contract price of £2,000. The developer had a separate contract with the property owner to undertake the renovation work by an agreed date, with a penalty if the work was not completed in time. It became apparent to the developer that the carpenter was not going to finish the work on time, so the developer offered the carpenter an extra £500 to do so. After the work was completed (on time), the developer refused to pay the carpenter the additional sum offered.",q:"Would the carpenter be successful in recovering the £500 if he took the developer to court?",opts:["No, the carpenter did nothing more than perform his existing contractual duty so there is no consideration for the promise to pay £500.","No, because it appeared that the carpenter was not going to finish on time, and the developer was acting under duress when he offered the additional £500.","Yes, the developer promised the additional money so should not be able to go back on his promise.","Yes, the £500 was part and parcel of the original contract to complete the work by a specified date.","Yes, the work being carried out on time meant the time penalty clause was not invoked, which would be sufficient consideration for the promise to pay £500."],ans:"E",expl:"(E) The carpenter finishing his work on time conferred a practical benefit on the developer because the penalty was not invoked. This is sufficient consideration for the promise of the additional £500, so (E) is the correct answer. (A) is incorrect because, for the reason already discussed, the practical benefit conferred on the developer is sufficient consideration even in the absence of any work by the carpenter over and above his additional contractual duty. (B) is incorrect because duress is relevant only when some form of pressure has been exerted over a party, and there is no suggestion in this scenario that this was the case. (C) is incorrect because it does not explain why the developer is bound to pay the £500. In the absence of any additional consideration or practical benefit to the party promising the additional money, the general rule is that performance of an existing contractual duty is not sufficient consideration for the promise of an extra payment. (D) is incorrect because the original contract was for £2,000. Even though the £500 was payment for completion of the carpenter's existing contractual duty, it did not form part of the contract originally agreed."},{n:86,id:"DIS222",scenario:"A claimant in a breach of contract claim issues proceedings on 1 February. It then sends a Part 36 offer in the correct form to the defendant by first class post on Monday 3 February. The offer specifies the shortest relevant period for acceptance allowed. The defendant decides on 28 February that it wishes to accept the offer. No other relevant communication was made.",q:"May the defendant accept the offer at this time?",opts:["Yes, because it is still within the relevant period.","Yes, because the claimant has not withdrawn the offer.","No, because the relevant period has expired, and no exception is available because the claimant chose the shortest allowable relevant period.","No, because the relevant period has expired and the defendant has not made an application to the court to accept after expiry of the relevant period.","No, because the offer was made too soon after issue of proceedings and so was invalid."],ans:"B",expl:"(B) The minimum relevant period for a Part 36 offer (that is, the minimum time that it must be kept open) is 21 days. Since the offer was made on 3 February and it will be deemed delivered two days later, the offer expired on 26 February. However, a Part 36 offer can be accepted at any time, even after expiry of the relevant period, so long as the offeror has not withdrawn it. The question indicates that the only facts relevant to the offer are set out in the question, and the question does not indicate that a withdrawal of the offer was made. Therefore, the defendant may accept the offer on 28 February. (A) is incorrect as the relevant period expired on 26 February, as just explained. (C) is incorrect because no exception is needed - the offer is open until it is withdrawn. (D) is incorrect for much the same reason as (C) - the offer is still open and so there is no need to make an application to the court to accept. (E) is incorrect because Part 36 offers can be made at any time, even before proceedings have issued."},{n:87,id:"CTR112",scenario:"A woman enters into a contract with a driving school to provide her with driving lessons. The only express terms of the contract relate to the price and the duration of the lessons. The woman is injured in an accident during a driving lesson. She wishes to make a claim on the driving school's insurance, but she learns that the driving school does not have the insurance that it was required by law to have.",q:"Will the woman be able to recover damages from the driving school under the contract?",opts:["No, because there was no term in the contract requiring the driving school to take out insurance.","Yes, because the courts will imply a term into the contract if it is reasonable to do so.","No, because the contract is void for illegality.","Yes, because the courts will imply a term into the contract if this is necessary to make the contract work.","Yes, because under the Consumer Rights Act 2015 a term will be implied requiring the driving school to take out insurance, and the driving school breached that term."],ans:"D",expl:"(D) The courts will imply a term into a contract if the term is necessary to make the contract work as intended (sometimes referred to as the 'business efficacy test'). Here, possession of the necessary insurance is essential for the lessons to take place, so a term requiring the driving school to take out that insurance is likely to be implied. Since the driving school did not take out such insurance, the woman may sue the school for breach of contract. (A) is incorrect because a term may be implied even if there is no relevant express term in a contract. (B) is incorrect because the test for implying a term is not whether it is reasonable to do so. The 'business efficacy' test is much more stringent. (C) is incorrect because the contract is not void, which would mean it was illegal from the start. At most, it is illegal in its performance, and that will not prevent the innocent party (the woman) from enforcing it if she was not aware of the illegality and took no part in it. (E) is incorrect because this is not one of the terms implied under the Consumer Rights Act 2015. (It is conceivable that the woman would succeed in a claim for a breach of the implied term requiring the driving school to perform its services with reasonable care and skill, but that is not her most straightforward option.)"},{n:88,id:"DIS105",scenario:"After attempts at alternative dispute resolution fail, a woman issues a road accident claim for damages arising from a car accident. The case is allocated to the fast track. It then proceeds through disclosure and a pre-trial review hearing is set. The court orders the parties to prepare a pre-trial review case summary.",q:"What should be included in the pre-trial review case summary?",opts:["A statement of the law each party intends to raise in their respective arguments.","Copies of the witness statements each party intends to rely on.","An agreed (if possible) summary of the case, including the issues of fact agreed and disputed and a synopsis of the evidence required.","A statement of the steps the parties have taken to resolve their dispute through alternative means.","A schedule of the costs incurred to date with details of the proposed trial costs as per the costs budget."],ans:"C",expl:"(C) Ahead of the hearing, the parties are required to file and serve an agreed (when possible) case summary together with a list of issues. These provide the court with helpful information about the case and the areas in dispute. (A) is incorrect as the parties are not required to set out the law on which they will rely. (B) is incorrect because the judge does not need to see the factual witness statements for the pre-trial review. (D) is incorrect because whilst the judge may be interested in the steps the parties took toward settlement, it is not something that the parties need to apprise the judge about in advance. (E) is incorrect because, unless requested, a full costs breakdown is not required."},{n:89,id:"DIS114",scenario:"The solicitor for the defendant has been struggling to locate a witness with whom the solicitor has spoken previously. The witness has not provided a signed statement, but the solicitor believes that, if the witness can be located and called to court to give evidence, their testimony would be helpful to the defendant's case. The solicitor is unsure whether they will be able to obtain a signed statement from the witness before the date set in the directions order for the exchange of witness statements, as that date is just a couple of days away.",q:"What are the most appropriate steps the solicitor can take with a view to getting the witness's testimony before the court?",opts:["The defendant's solicitor should seek permission to serve a witness summary, briefly summarising the evidence that the witness would give if called.","The solicitor should urgently instruct an enquiry agent to locate the witness and obtain their signed statement.","The solicitor should file a statement exhibiting a copy of the file note from their file of papers identifying the evidence that the witness would give.","The solicitor should serve a witness summons on the last known address of the witness, if they have knowledge of such an address.","The solicitor should write to the claimant's representative with a brief description of the evidence that the witness would give, accompanied by a Notice to Admit."],ans:"A",expl:"(A) The solicitor should seek permission to serve a witness summary. At trial, the court will place such weight on this evidence as it feels appropriate in the circumstances. (B) is incorrect because there is likely to be insufficient time to locate the witness and obtain a statement, and if this is not possible, there will be no opportunity to rely on the evidence. (C) is incorrect because this is not the appropriate way to try to adduce this evidence. The solicitor should serve a witness summary. (D) is incorrect because serving a witness summons at the witness's last known address will have no effect. This would only be helpful if the defendant has already served a signed statement from the witness, which is not the case here. (E) is incorrect because this is an inappropriate use of a Notice to Admit. Notices to Admit are used to secure agreement with an opponent as to uncontested facts."},{n:90,id:"BSL097",scenario:"Three friends set up a doughnut shop as a partnership several years ago. When they set up the business, each partner agreed to work full-time at the business and they agreed to split profits equally. However, they did not discuss their partnership rights any further. Now, two of the partners wish to expand the business by buying another doughnut shop. The third partner is concerned that they do not have enough time to successfully run another shop.",q:"Which of the following decisions can the two partners make without the agreement of the third partner?",opts:["To bring in a new partner who will take responsibility for running the new shop.","To buy a new doughnut shop.","To expel the third partner who does not want to buy the second shop.","To change the profit-sharing ratio in the partnership if they buy a second shop and the third partner does not agree to work there.","To convert the existing doughnut shop into a flower shop if they buy the second doughnut shop."],ans:"B",expl:"(B) The two partners may agree to buy another shop. As a general rule, decisions in a partnership require only a simple majority vote unless the partnership agreement provides otherwise. However, there are a few decisions that require unanimity (unless the partnership agreement provides otherwise). These are: the introduction of a new partner, a change in the nature of the partnership business, an alteration to the partnership agreement, or the expulsion of a partner. Buying a new doughnut shop is still carrying on the same business, so the decision to buy the second shop can be made by the two partners. (A) is incorrect as the introduction of a new partner requires unanimity. (C) is incorrect as expulsion requires unanimity. (D) is incorrect as this involves changing the partnership agreement, and (E) is incorrect as this is a change in the nature of the business."}],Z1=[...Q1,...X1,...J1],eT="Simulated Exam Part 2 (FLK1) — Questions and Answers",dr=Z1,tT=["A","B","C","D","E"],nT={CNL:"Constitutional & Administrative Law",DIS:"Dispute Resolution",ELS:"Legal System of England & Wales",TRT:"Tort",TAX:"Taxation",LGS:"Legal Services",ETH:"Ethics & Professional Conduct",BSL:"Business Law",CTR:"Contract"},Rc=r=>r?nT[r.slice(0,3)]??"Other":"Not stated";function rT({item:r,showAll:i,selected:a,revealed:l,onSelect:u,onToggleReveal:d}){const h=i||l,f=a&&r.ans&&a===r.ans;return k.jsxs("article",{id:`q${r.n}`,className:"rounded-lg border border-border bg-card shadow-card overflow-hidden",children:[k.jsxs("section",{className:"question p-5",children:[k.jsxs("header",{className:"flex flex-wrap items-center gap-2 mb-3",children:[k.jsxs("h2",{className:"text-lg font-semibold text-foreground",children:["Question ",r.n]}),k.jsx("span",{className:"text-xs text-muted-foreground",children:"of 90"}),k.jsxs("div",{className:"ml-auto flex gap-2",children:[k.jsx(ur,{color:"secondary",children:Rc(r.id)}),r.id&&k.jsxs(ur,{color:"information",children:["ID ",r.id]})]})]}),k.jsx("p",{className:"text-sm leading-relaxed text-foreground mb-3 whitespace-pre-line",children:r.scenario}),k.jsx("h3",{className:"text-sm font-semibold text-foreground mb-3",id:`q${r.n}-stem`,children:r.q}),k.jsxs("fieldset",{role:"radiogroup","aria-labelledby":`q${r.n}-stem`,className:"space-y-2",children:[k.jsx("legend",{className:"sr-only",children:"Select an answer"}),r.opts.map((m,g)=>{const y=tT[g],v=h&&r.ans===y,b=h&&a===y&&r.ans!==null&&r.ans!==y,E=a===y,R=v?"border-success bg-tag-green":b?"border-destructive bg-tag-red":E?"border-border-strong bg-tag-blue":"border-border bg-muted hover:bg-accent";return k.jsxs("label",{className:`flex gap-3 rounded-md border px-3 py-2 text-sm cursor-pointer transition-colors ${R}`,children:[k.jsx("input",{type:"radio",name:`q${r.n}`,value:y,checked:E,
