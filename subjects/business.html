<script>
const D={"t": ["Starting a new business: types of business medium", "Partnerships", "Limited companies: part 1", "Limited companies: part 2", "Financing a business, financial records and accounting requirements", "Termination and insolvency", "Trading profits and VAT", "Income tax", "Capital gains tax and inheritance tax", "Corporation tax"], "q": [{"ch": 0, "n": 1, "sc": ["A client wishes to set up business on their own, providing light gardening services. The client is keen to keep things as straightforward as possible and to minimise costs. They do not foresee a substantial capital outlay and they have no plans to take on employees or to borrow money."], "st": "Which of the following best describes the type of business medium the client should choose for their business and why?", "o": ["A private limited company. This is because there is little administrative burden in setting up and running a private limited company.", "A sole trader. Although limited liability would be of benefit to the client, their needs are straightforward and their investment and overheads would not be substantial. The additional burdens of starting and running a limited company would not be justified.", "A limited company in any event. The benefits of separate personality and limited liability are so great that they outweigh all other considerations.", "A private limited company. The client will be able to separate ownership and control and grant floating charges over the company's assets when they wish to expand the business.", "A public limited company. It will give the client better flexibility to expand and will enable shares to be offered to the public."], "a": "B", "bx": "The correct answer was B. Although separate personality and limited liability have clear benefits, they are not the client's main concern, particularly in view of the low capital outlay/risk. Therefore, option C is incorrect. The additional costs of forming and managing a company would be unjustified, making option A incorrect. Option D is incorrect as separation of ownership and control would be unnecessarily complicated, and they have no plans to borrow money, so the ability to grant floating charges is not a concern. Option E is incorrect as a public limited company (plc) would be even less appropriate than a private company; they have no desire to offer shares to the public and would be unlikely to meet the minimum capital requirements."}, {"ch": 0, "n": 2, "sc": ["A client wishes to start up a manufacturing business with a long-standing friend and business associate. The pair plan to buy premises, employ several staff, expand very quickly and trade internationally. In the medium term, the pair will need to borrow considerable funds."], "st": "Which of the following best describes the type of business medium the client and their friend should choose?", "o": ["A private limited company.", "A partnership.", "A public limited company.", "A limited liability partnership.", "A private company, limited by guarantee."], "a": "A", "bx": "The correct answer was A. The ambitious plans, nature of the business and need to borrow make a private limited company the obvious choice. There are likely to be significant liabilities and the ability to grant floating charges will be a clear advantage. Option B would be inappropriate as partners have unlimited liability and partnerships cannot grant floating charges. Limited companies are more recognised across the world than LLPs, which makes option D incorrect. A plc would be inappropriate in the short term as there are no plans to offer shares to the public (which makes option C incorrect). Option E is incorrect as a private company limited by guarantee would be more appropriate for a non-profit-making entity."}, {"ch": 0, "n": 3, "sc": ["A client holds 10,000 £1 ordinary shares in a private limited company, representing a 5% shareholding. The shares are fully paid and the company is being wound up, with substantial debts."], "st": "How much will the client be required to contribute on winding-up?", "o": ["The client will not be required to contribute on winding-up.", "The client will be required to contribute 5% of the company's outstanding debt.", "The client will be required to contribute £10,000.", "The client's liability will be unlimited.", "The client will be required to contribute towards the costs of winding-up."], "a": "A", "bx": "The correct answer was A. The client's liability will be limited to any amount unpaid on their shares, which in this case is nothing. Therefore, options B, C, D and E are incorrect. The client would only be required to contribute on winding-up if the shares were not fully paid. In these circumstances, liability would be limited to the unpaid amount."}, {"ch": 0, "n": 4, "sc": ["A client is a sole trader whose business is in financial difficulty. However, they have substantial personal assets and are keen to ascertain their liability for the debts of the business."], "st": "Which of the following best describes the client's liability?", "o": ["The business is a separate legal person, and the client will be able to keep their personal assets separate.", "The client will be personally liable for the debts of the business.", "The client's liability will be limited to the amount they contributed to the business.", "The client will be jointly and severally liable for the debts of the business.", "The client will not be liable as the business has not been registered at Companies House."], "a": "B", "bx": "The correct answer was B. The client's liability will be personal, without limit, as the business is unincorporated and does not have separate legal personality. Therefore, options A and C are incorrect. There is no requirement to register the business at Companies House, so option E is incorrect. Joint and several liability is inappropriate for a sole trader but would be relevant if the client were a partner. Therefore, option D is incorrect."}, {"ch": 0, "n": 5, "sc": ["A client is looking to set up a manufacturing business with two friends who are both experienced executives. They plan to expand quickly, have substantial borrowings and appoint over 50 employees. The client is happy not to be involved in the day-to-day management of the business, but he wants to make sure that his liability is limited to his investment. The client may also wish to sell his share in the business on his retirement in a few years' time."], "st": "Which of the following best describes the type of business medium the client and his two friends should choose?", "o": ["A private company, limited by shares.", "A partnership.", "A public limited company.", "A limited liability partnership.", "A private company, limited by guarantee."], "a": "A", "bx": "The correct answer was A. The client's key concerns are having limited liability, not being involved in the day-to-day management of the business and having transferrable shares. Therefore, option B is incorrect. The board structure (separation of ownership and control) and ambitious plans make this the obvious choice. There will be significant benefit to limited liability and the ability to grant floating charges. A public company would be less appropriate, although it would be possible to re-register as a public company later. Therefore, option C is incorrect. Companies limited by guarantee are usually non-profit-making entities, so option E is incorrect. Option D is incorrect as limited companies are more widely recognised than LLPs for trading purposes."}, {"ch": 0, "n": 6, "sc": ["Two accountants wish to set up a firm together. They want limited liability but would like to be taxed as if they were partners, with flexible internal arrangements."], "st": "Which business medium best suits them?", "o": ["A public limited company.", "Two sole traders sharing premises.", "A private company limited by shares.", "A general partnership.", "A limited liability partnership."], "a": "E", "x": ["Wrong. A plc is unsuitable and has minimum capital requirements.", "Wrong. This gives no limited liability.", "Wrong. A company gives limited liability but is taxed separately and is more formal.", "Wrong. Partners in a general partnership have unlimited liability.", "Correct. An LLP gives its members limited liability and separate legal personality, and is tax-transparent, so members are taxed like partners."]}, {"ch": 0, "n": 7, "sc": ["A client asks what a public limited company needs before it can trade."], "st": "Which is required?", "o": ["Approval from the Financial Conduct Authority.", "A listing on the London Stock Exchange.", "An auditor's certificate of solvency.", "At least 50 shareholders.", "A trading certificate, which requires allotted share capital of at least the authorised minimum."], "a": "E", "x": ["Wrong. FCA approval is not needed to trade.", "Wrong. A plc need not be listed.", "Wrong. Not required.", "Wrong. There is no such requirement.", "Correct. A plc must obtain a trading certificate under s 761 of the Companies Act 2006 before trading."]}, {"ch": 0, "n": 8, "sc": ["A sole trader incorporates a company and becomes its sole shareholder and director. A creditor of the company is unpaid."], "st": "Can the creditor normally sue the sole trader personally?", "o": ["No, unless the debt exceeds £10,000.", "Yes, because the company is a sham in all such cases.", "Yes, because the director controls the company.", "No, because the company is a separate legal person (Salomon v Salomon) and the shareholder's liability is limited.", "Yes, because there is only one shareholder."], "a": "D", "x": ["Wrong. No such threshold.", "Wrong. The veil is pierced only in exceptional circumstances.", "Wrong. Control does not create personal liability.", "Correct. Salomon confirms the separate personality of a one-person company.", "Wrong. A single-member company is still a separate person."]}, {"ch": 0, "n": 9, "sc": ["A client is advised that one advantage of a company over a partnership is the ability to grant a particular type of security."], "st": "Which security can a company grant that a partnership cannot?", "o": ["A fixed charge over land.", "A lien.", "A personal guarantee.", "A mortgage over shares.", "A floating charge."], "a": "E", "x": ["Wrong. Partners can grant fixed charges.", "Wrong. Not unique to companies.", "Wrong. Individuals can give guarantees.", "Wrong. Not unique to companies.", "Correct. Only companies (and LLPs) can grant floating charges; partnerships cannot."]}, {"ch": 0, "n": 10, "sc": ["A client is choosing between a sole tradership and a company and is concerned about publicity of financial information."], "st": "Which statement is correct?", "o": ["Companies' accounts are private.", "Neither has to make any filings.", "A sole trader must publish accounts.", "A company must file accounts at Companies House, which are publicly available; a sole trader need not.", "Only public companies file accounts."], "a": "D", "x": ["Wrong. They are public.", "Wrong. Companies must file.", "Wrong. A sole trader files tax returns but does not publish accounts.", "Correct. Companies must file accounts on the public register; sole traders have no such obligation.", "Wrong. Private companies also file."]}, {"ch": 1, "n": 1, "sc": ["Two clients start a business together. They each invest 50% of the capital and share profits equally. After a number of years, the business makes a loss."], "st": "Have the two clients been in partnership together?", "o": ["Yes, because they are in business together with a view to making a profit.", "Yes, but only because they agreed to invest equal amounts of capital.", "No, because they have not entered into a formal written partnership agreement.", "No, because the partnership has not been registered at Companies House.", "No, because they did not agree on how losses should be shared between them."], "a": "A", "bx": "The correct answer was A, as the s 1 PA criteria are met. Equal investment in capital, agreement as to how profits and losses are to be shared, and registration at Companies House are not requirements. Therefore, options B, E and D are incorrect. A formal partnership agreement is not required, but one is usually recommended. Therefore, option C is also incorrect."}, {"ch": 1, "n": 2, "sc": ["A client seeks advice from a solicitor in setting up a partnership business."], "st": "Which of the following most accurately describes the position under the Partnership Act 1890, in the absence of an express or implied agreement to the contrary?", "o": ["Partners will have an equal share of income profits, retirement of a partner will not dissolve the partnership, all partners are entitled to take part in the management of the business and a rogue partner may not be expelled by majority vote.", "Partners will have an equal share of income profits, retirement of a partner will dissolve the partnership and a rogue partner may be expelled by majority vote.", "Partners will have an equal share of income profits, retirement of a partner will dissolve the partnership, all partners are entitled to take part in the management of the business and a rogue partner may not be expelled by majority vote.", "Partners will receive income profits proportionate to their capital share, retirement of a partner will not dissolve the partnership and all partners are entitled to take part in the management of the business.", "Partners will receive income profits proportionate to their capital share, retirement of a partner will not dissolve the partnership and a rogue partner may not be expelled by majority vote."], "a": "C", "bx": "The correct answer was C. Partners will have an equal share of income profits regardless of capital input. Therefore, options D and E are incorrect on this point. Retirement of a partner will dissolve the partnership, therefore, options A, D and E are incorrect here. All partners are entitled to take part in the management of the business and a rogue partner may not be expelled by majority vote. Therefore, option B is also incorrect in this final respect."}, {"ch": 1, "n": 3, "sc": ["A client starts a partnership business with a friend, and they make unequal capital contributions. One of the partners works full-time for the business and the other works part-time. There is no formal written partnership agreement or any agreement as to how income and capital profits will be shared."], "st": "Which of the following best describes the position on the share of income and capital profits?", "o": ["Income and capital profits will be shared in accordance with the partners' respective capital contributions.", "Income and capital profits will be shared in accordance with the hours worked by each partner in the business.", "Income profits will be shared according to the hours worked by each partner and capital profits will be shared equally.", "The partners must enter into a formal written partnership agreement as the Partnership Act 1890 does not make any provision for this type of situation.", "Income profits will be shared equally, although it will most probably be implied that capital will be shared in proportion to the contributions made."], "a": "E", "bx": "The correct answer was E. Income profits will be shared equally, irrespective of partners' capital contributions and their hours worked. Therefore, options A, B and C are incorrect. It will most probably be implied that capital is shared in proportion to the contributions made, also making options A, B and C incorrect. Although a partnership agreement would be advisable in these circumstances, it is not a requirement, so option D is incorrect."}, {"ch": 1, "n": 4, "sc": ["A client is a partner in a bakery business and enters into a transaction to buy a conservatory for his home, with partnership money."], "st": "Which of the following best describes the liability of the firm for this transaction?", "o": ["The partnership as a whole will be liable. Individual partners, as joint owners of the business, always have authority to bind the firm, as agents of it. They do not need to act jointly.", "Only the contracting partner will be liable. Individual partners, despite being joint owners of the business, do not have authority to bind the firm, as agents of it. They must make decisions jointly.", "If the transaction was entered into with actual or apparent authority on the part of the contracting partner, the firm will be liable. It is unlikely that there will be apparent authority as the deal did not relate to the type of business in which the partnership normally deals.", "If the transaction was entered into with actual or apparent authority on the part of the contracting partner, the firm will be liable. It is unlikely that there will be apparent authority unless the third party actually knew that the person they were dealing with was a partner.", "If the transaction was entered into with actual or apparent authority on the part of the contracting partner, the firm will be liable. It is likely that there will be apparent authority on the facts."], "a": "C", "bx": "The correct answer was C. Although partners are agents of the business and may bind the partnership as individuals, actual and apparent authority need to be considered. Therefore, options A and B are incorrect. Option D is also incorrect - watch out for the exact wording in the question. The third party does not have to show that they actually knew that the person with whom they were dealing was a partner in the firm. They merely need to show that they believed that person to be a partner or had no reason to suspect that they were not. Option E is incorrect as apparent authority is unlikely on the facts."}, {"ch": 1, "n": 5, "sc": ["A client leaving a partnership has sought advice as to whether she will have any ongoing liability for the partnership's existing and future debts. The client has already written to the firm's existing and previous clients informing them of her departure."], "st": "Which of the following most accurately describes the position of the client?", "o": ["Upon leaving the partnership, the client will automatically cease to be liable for existing and future debts.", "The client can avoid liability for existing debts through deeds of release or novation. She can avoid liability for future debts by giving constructive notice to potential clients and avoiding being held out as a partner.", "The client will be liable for existing and future debts unless she enters into deeds of release or novation with the continuing partners and willing creditors.", "Provided that the client gives constructive notice to potential clients and does everything possible to avoid being held out as a partner, she will have no liability for existing and future debts.", "Upon leaving the partnership, the client will automatically cease to be liable for future debts."], "a": "B", "bx": "The correct answer was B. The client will need to take action to avoid liability for existing and future debts, so options A and E are incorrect. In respect of future debts, the client has already given actual notice to existing and former clients, so needs to give constructive notice and avoid being held out as a partner. As for existing debts, she will need deeds of release or novation. Note that an indemnity will not stop her being liable to the creditors but will entitle the outgoing partner to be indemnified by the continuing partners. Watch out for the fundamental distinction between existing and future debts. Options C and D are incorrect, as they do not make this distinction."}, {"ch": 1, "n": 6, "sc": ["A partnership has no written agreement. One partner wishes to dissolve the partnership immediately."], "st": "Can she do so?", "o": ["No, because only a majority can dissolve.", "Yes, in a partnership at will any partner may dissolve it by giving notice.", "No, because unanimous consent is required.", "Yes, but only after 12 months' notice.", "No, because a court order is always required."], "a": "B", "x": ["Wrong. Not the default rule.", "Correct. Under s 32 of the Partnership Act 1890, a partnership at will may be dissolved by notice.", "Wrong. Not required.", "Wrong. No such period.", "Wrong. Not required."]}, {"ch": 1, "n": 7, "sc": ["A partner dies. The partnership agreement is silent on death."], "st": "What is the default position under the Partnership Act 1890?", "o": ["The partnership is converted into an LLP.", "The deceased's personal representatives become partners.", "The partnership is dissolved.", "Nothing changes.", "The partnership continues with the remaining partners."], "a": "C", "x": ["Wrong. Not possible automatically.", "Wrong. Not the default.", "Correct. Section 33 provides for dissolution on the death of a partner, subject to agreement.", "Wrong. Dissolution occurs.", "Wrong. Only if the agreement provides for this."]}, {"ch": 1, "n": 8, "sc": ["A partnership agreement is silent on the introduction of new partners. The majority wish to admit a new partner, but one partner objects."], "st": "Can the new partner be admitted?", "o": ["Yes, by majority vote.", "Yes, if the senior partner agrees.", "No, because under s 24(7) unanimous consent is required to admit a new partner.", "No, unless the court approves.", "Yes, if the new partner contributes capital."], "a": "C", "x": ["Wrong. Majority is insufficient.", "Wrong. No such rule.", "Correct. Section 24(7) requires all existing partners to consent.", "Wrong. Court approval is not the test.", "Wrong. Capital is irrelevant."]}, {"ch": 1, "n": 9, "sc": ["A partner who is not a partner by agreement is represented as being one and a third party gives credit on the strength of that representation."], "st": "What is the effect?", "o": ["The third party has no remedy.", "The person becomes a full partner.", "No liability arises.", "The person may be liable as if a partner by 'holding out' under s 14.", "Only the firm is liable."], "a": "D", "x": ["Wrong. The third party may sue.", "Wrong. They are not a partner for all purposes.", "Wrong. Liability can arise.", "Correct. Section 14 imposes liability on a person held out as a partner.", "Wrong. The person held out may also be liable."]}, {"ch": 1, "n": 10, "sc": ["A partnership agreement contains a restraint of trade clause preventing an outgoing partner from practising anywhere in the UK for ten years."], "st": "Is the clause likely to be enforceable?", "o": ["Yes, because restraint clauses are always enforceable.", "No, because restraint clauses are illegal in partnerships.", "Probably not, because it is likely to be wider than reasonably necessary to protect legitimate interests.", "Yes, because all partners agreed to it.", "Yes, if the partner was paid."], "a": "C", "x": ["Wrong. They are not always enforceable.", "Wrong. Reasonable restraints are permitted.", "Correct. Restraints are enforceable only if reasonable in scope, area and duration.", "Wrong. Agreement alone is insufficient.", "Wrong. Payment does not make an unreasonable restraint valid."]}, {"ch": 2, "n": 1, "sc": ["Two new clients wish to set up a private company limited by shares."], "st": "Which of the following best describes the information required in order to complete form IN01?", "o": ["Full details of the shareholders, directors and company secretary (if any), the registered office, the name of the company, how many shares the company will have, their type and nominal value, and instructions on the articles.", "Full details of the shareholders, directors and company secretary (if any), the registered office, the name of the company, its trading name, how many shares the company will have, their type and nominal value and instructions on the articles.", "Full details of the shareholders, directors and company secretary (if any), the registered office, the name of the company, how many shares the company will have, their type and nominal value, instructions on the articles and details of any service contracts to be issued to the directors.", "Full details of the shareholders, directors and company secretary (if any), the registered office, the name of the company, how many shares the company will have, their type and nominal value, instructions on the articles and confirmation of registration with HMRC.", "Full details of the shareholders, directors and company secretary (if any), the registered office, the name of the company, how many shares the company will have, their type and nominal value, instructions on the articles, confirmation of the auditor and instructions on whether to adopt a company seal."], "a": "A", "bx": "The correct answer was A. The trading name (option B), directors' service contracts (option C), registration with HMRC (option D) and whether to have a company seal (option E) can all be decided after incorporation. Depending on the size and value of the company, an auditor may not be required (option E) and their appointment may be decided after incorporation."}, {"ch": 2, "n": 2, "sc": ["A client was a sole trader who recently incorporated their hairdressing business into a private limited company. They are the sole director and joint and equal shareholder with their spouse. Prior to receiving the certificate of incorporation, the client entered into a contract with a shampoo supplier. The contract was signed by the sole trader on behalf of the company."], "st": "With whom, if anyone, does the benefit of the contract reside?", "o": ["The company.", "The shareholders.", "The sole trader.", "The sole trader and the company jointly.", "The contract is void."], "a": "C", "bx": "The correct answer was C. The company is not able to enter into contracts until the certificate of incorporation has been issued. Until then, the company can have no liability, so options A and D are incorrect. If made after incorporation, the company would have the benefit of the contract as a separate legal person. The shareholders' liability would be limited thereafter, but they can have no liability until the company is incorporated, so option B is incorrect. The contract is not void as the sole trader will still be liable by virtue of privity of contract, so option E is incorrect."}, {"ch": 2, "n": 3, "sc": ["A private limited company was incorporated with unamended model articles of association but has since adopted amended articles."], "st": "What must be filed with Companies House following the adoption of the amended articles of association?", "o": ["The board minutes relating to the change and the shareholders' resolution sanctioning the adoption.", "The shareholders' resolution to adopt the amended articles of association only.", "The amended articles of association only.", "The shareholders' resolution to adopt the amended articles of association and the amended articles of association.", "The board resolution relating to the change and the new articles of association."], "a": "D", "bx": "The correct answer was D. It is the shareholders who need to pass a special resolution (SR) in general meeting (GM) in order to approve the amendment. Although the directors will usually pass a board resolution (BR) to call the GM, the amendment of the articles is not their decision to make. The company is under a duty to keep minutes of both meetings, but these do not need to be filed at Companies House, so option A is incorrect. BRs and most ordinary resolutions do not need to be filed, but SRs do, so option E is incorrect. Both the SR and the amended articles need to be filed, so options B and C are incorrect."}, {"ch": 2, "n": 4, "sc": ["A company wishes to call a general meeting to amend the articles of association. There are seven shareholders, all with ordinary voting shares. The client has 52,000 shares, a man has 20,000 shares and a woman has 20,000 shares. The remaining four shareholders have 2,000 shares each."], "st": "Which of the following best describes who would be required to agree to hold the meeting on short notice?", "o": ["The client, the man and the woman.", "Any four - a simple majority in number is required.", "The client, the man, the woman and any other shareholder.", "The client, as majority shareholder.", "The client, the man, the woman and any other two shareholders."], "a": "C", "bx": "The correct answer was C. In order to satisfy the conditions, there has to be a majority in number of shareholders, who together hold at least 90% of the company's voting shares. Both pre-conditions have to be satisfied. Option A is incorrect as it does not satisfy the 'majority in number' point. Option B is incorrect as it may not satisfy the shareholding threshold. Option D is incorrect as it satisfies neither. Option E exceeds the minimum requirements but could also authorise the decision."}, {"ch": 2, "n": 5, "sc": ["A client private limited company with unamended model articles of association has six directors and needs to approve the purchase of property worth £3,000 that is jointly owned by two of the directors (the 'selling directors'). Two directors do not support the transaction, but the remaining four (including the two selling directors and one of the other directors, who is also the chairperson) wish to vote in favour of it."], "st": "Which of the following best describes the situation should all directors attend and vote at the board meeting?", "o": ["The four directors in favour will be able to pass a board resolution (BR) as they represent the majority.", "The four directors in favour will be able to pass a BR as they represent the majority. However, the two selling directors will need to declare their personal interests in the transaction.", "The four directors in favour will be unable to pass the BR. The two selling directors will need to declare their personal interests in the transaction and will be unable to vote and count towards the quorum.", "The four directors in favour will be able to pass the BR. The two selling directors will need to declare their personal interests in the transaction and will be unable to vote and count towards the quorum. In the event of deadlock (which is anticipated on the facts), the chairperson will be able to exercise her casting vote.", "The decision must be authorised by an ordinary resolution of the shareholders."], "a": "D", "bx": "The correct answer was D. The two selling directors will need to declare their personal interests in the transaction and will be unable to vote and count towards the quorum when the decision is made, so options A, B and C are incorrect. That leaves four directors who are eligible to vote, two in favour and two against. The chairperson will have a casting vote to break the deadlock. An ordinary resolution will not be required as the transaction falls within the directors' general management powers and is not a substantial property transaction (see Chapter 4). Therefore, option E is incorrect."}, {"ch": 2, "n": 6, "sc": ["A private company wishes to change its name."], "st": "Which resolution is generally required under the Companies Act 2006?", "o": ["A special resolution (or another method provided by the articles).", "A unanimous written resolution.", "No resolution.", "An ordinary resolution.", "A board resolution only."], "a": "A", "x": ["Correct. Section 77 allows a change of name by special resolution or as provided in the articles.", "Wrong. Not required.", "Wrong. A resolution is required.", "Wrong. Not the default.", "Wrong. Directors cannot change the name alone, unless the articles provide."]}, {"ch": 2, "n": 7, "sc": ["A private company wishes to pass a resolution by written resolution."], "st": "Which resolution cannot be passed by written resolution?", "o": ["An ordinary resolution to approve a substantial property transaction.", "A special resolution to change the name.", "A resolution to remove a director under s 168.", "A special resolution to amend the articles.", "An ordinary resolution to authorise directors to allot shares."], "a": "C", "x": ["Wrong. This can be passed by written resolution.", "Wrong. This can be passed by written resolution.", "Correct. Removal of a director (and of an auditor) requires a general meeting.", "Wrong. This can be passed by written resolution.", "Wrong. This can be passed by written resolution."]}, {"ch": 2, "n": 8, "sc": ["A private company calls a general meeting."], "st": "What is the minimum notice period, unless short notice is agreed?", "o": ["14 clear days.", "10 working days.", "28 days.", "7 days.", "21 clear days."], "a": "A", "x": ["Correct. Section 307 requires at least 14 days' notice for a private company general meeting.", "Wrong. Not the rule.", "Wrong. Not the minimum.", "Wrong. Not sufficient.", "Wrong. 21 days applies to a plc annual general meeting."]}, {"ch": 2, "n": 9, "sc": ["A private company has unamended model articles. Two directors attend a board meeting."], "st": "What is the quorum for board meetings under the model articles?", "o": ["All directors.", "One.", "Two, unless otherwise fixed.", "Three.", "A majority of directors."], "a": "C", "x": ["Wrong. Not the rule.", "Wrong. One is enough only for a sole director.", "Correct. Model article 11(2) sets the quorum at two, unless fixed otherwise.", "Wrong. Not the rule.", "Wrong. Not the rule."]}, {"ch": 2, "n": 10, "sc": ["A written resolution is circulated to the members of a private company."], "st": "What majority is needed to pass a special resolution by written resolution?", "o": ["75% of those who respond.", "90% of members.", "All members.", "A simple majority of eligible members.", "At least 75% of the total voting rights of eligible members."], "a": "E", "x": ["Wrong. It is measured against all eligible members.", "Wrong. Not the rule.", "Wrong. Not required.", "Wrong. That is for an ordinary resolution.", "Correct. A written special resolution needs 75% of the total voting rights of eligible members."]}, {"ch": 3, "n": 1, "sc": ["A private limited company with unamended model articles of association wishes to sell some of its land to the father of one of the directors. All of the directors are shareholders. The property has been independently valued at £70,000 and the net asset value of the company is £600,000."], "st": "Does the proposed sale of land require shareholder approval?", "o": ["No, because the property has been independently valued.", "Yes, because the transaction is more than 10% of the company's net asset value.", "Yes, because the company's directors are also shareholders.", "No, because the transaction falls within the directors' general management powers.", "No, because the transaction does not exceed £100,000."], "a": "B", "bx": "The correct answer was B. The independent valuation is not a factor in determining whether shareholder approval is required (option A), neither is the fact that all shareholders are directors (option C) (although an SPT must be between the company and a director/someone connected with a director). The transaction would fall within general management powers (option D) if it were not an SPT as defined. Option E is incorrect as if the value of the transaction is more than £5,000, but up to and including £100,000, it may still be an SPT if it is more than 10% of the company's net asset value."}, {"ch": 3, "n": 2, "sc": ["A private limited company with unamended model articles of association and a net asset value of £85,000 wishes to enter into some property transactions. The finance director has agreed to buy a van from the company, for the sum of £3,000. The brother of the marketing director has agreed to sell an investment property to the company for the sum of £150,000. Finally, the company has agreed to purchase freehold premises for £90,000 from another company in which the sales director has a 15% shareholding and his wife has a 10% shareholding."], "st": "Which of the following best describes the required resolutions to authorise these transactions?", "o": ["A board resolution for the van and ordinary resolutions for the investment property and freehold premises.", "Ordinary resolutions for the van, investment property and freehold premises.", "Board resolutions for the van and investment property and an ordinary resolution for the freehold premises.", "Board resolutions for the van, investment property and freehold premises.", "A board resolution for the van and freehold premises and an ordinary resolution for the investment property."], "a": "C", "bx": "The correct answer was C. A board resolution is required for the van as the value is £5,000 or less, even though the transaction involves a director. Therefore, option B is incorrect on this point. An ordinary resolution is required for the freehold premises as the director is connected with the selling company (he and his wife, a connected person, own at least 20% of the shares) and the value exceeds 10% of the purchasing company's net asset value. Options D and E are wrong here. A board resolution is required for the investment property as, despite the value, siblings are not connected persons in the context of SPTs. Therefore, options A, B and E are incorrect in this respect."}, {"ch": 3, "n": 3, "sc": ["A private limited company with unamended model articles of association wishes to grant a two-year guaranteed fixed-term service contract to an existing director."], "st": "Which of the following best describes the required formalities?", "o": ["A board resolution will be required. The director will need to declare his interest in the proposed transaction, will be unable to vote, and will not count towards the quorum when the decision is made.", "An ordinary resolution will be required. In the board meeting that follows, the director will need to declare his interest in the proposed transaction, will be unable to vote and will not count towards the quorum when the decision is made.", "An ordinary resolution will be required. In the board meeting that follows, the director will not need to declare his interest in the proposed transaction but will be unable to vote and will not count towards the quorum when the decision is made.", "An ordinary resolution will be required. In the board meeting that follows, the director will not need to declare his interest in the proposed transaction, will be able to vote and will count towards the quorum when the decision is made.", "A board resolution will be required. The director will not need to declare his interest in the proposed transaction but will be unable to vote, and will not count towards the quorum when the decision is made."], "a": "E", "bx": "The correct answer was E. An ordinary resolution will not be required as the service contract is not for a guaranteed term of more than two years. Therefore, options B, C and D are incorrect on this point. The director will not be required to declare his interest as there is an exception to the general rule that applies, where a director's service contract is being considered (s 177(6)(c) CA), therefore options A and B are incorrect here. The director will not be able to vote and count towards the quorum of the board meeting, so option D is also incorrect here."}, {"ch": 3, "n": 4, "sc": ["A director of a private company, limited by shares, has taken, for their own personal benefit, a contract that was initially being negotiated by the company. The same director has also been awarded an excessive pay rise and the company has persistently failed to pay dividends when profits are available. The client, who has a 25% shareholding in the company, wishes to take action."], "st": "Which of the following best describes the legal position?", "o": ["The director has potentially breached the duty to avoid conflicts of interest. The directors may authorise a breach of this duty by board resolution, but the interested director's vote will not count. The client could remove the director from office.", "The director has potentially breached the duty to avoid conflicts of interest. The directors may authorise a breach of this duty by board resolution, but the interested director's vote will not count. The client may take derivative action or seek relief for unfairly prejudicial conduct.", "The director has potentially breached the duty to declare an interest in a transaction. The client may take derivative action or seek relief for unfairly prejudicial conduct.", "The director has potentially breached the duty to avoid conflicts of interest. The directors may authorise a breach of this duty by board resolution, but the interested director's vote will not count. The client may take derivative action or seek to remove the director from office.", "The director has potentially breached the duty to avoid conflicts of interest. The directors may authorise a breach of this duty by board resolution, but the interested director's vote will not count. The client may seek relief for unfairly prejudicial conduct or seek to remove the director from office."], "a": "B", "bx": "The correct answer was B. The client could not remove the director from office based on their voting power alone, as they are a minority shareholder. Therefore, options A, D and E are incorrect in this respect. On the facts, there has been no breach of the duty to declare an interest in a proposed transaction, so option C is incorrect. Option D also fails to mention the possibility of a petition for unfairly prejudicial conduct, option E does not mention a derivative action, and option A does not mention either of them. Both are relevant on the facts."}, {"ch": 3, "n": 5, "sc": ["A director of a private company limited by shares negotiated a contract that caused the company a significant loss. Since then, the director has cut outgoings, personally authorised all expenses to make sure they are strictly necessary and made some redundancies. The director checks the accounts on a daily basis, but despite the director's best efforts, the company loses a lucrative contract and becomes insolvent."], "st": "Which of the following best sets out the position of the director?", "o": ["The director may be liable for wrongful trading but is likely to have a defence on the facts.", "The director may be liable for wrongful trading and fraudulent trading.", "The director may be liable for wrongful trading.", "The director may be liable for fraudulent trading.", "The director may be liable for misfeasance."], "a": "A", "bx": "The correct answer was A. Although there is the potential for wrongful trading here, the director is likely to have a defence, as they could argue that they took every step to minimise potential loss to creditors as ought to have been taken. Therefore, options B and C are incorrect here. The director is unlikely to have had an intention to defraud here, so fraudulent trading is unlikely (as suggested in options B and D). Misfeasance is also unlikely here as there is no clear breach of directors' duties, so option E is incorrect."}, {"ch": 3, "n": 6, "sc": ["A director of a company uses confidential company information to buy land personally, which the company was hoping to acquire."], "st": "Which directors' duty has most likely been breached?", "o": ["The duty to avoid conflicts of interest under s 175.", "The duty to declare an interest in a proposed transaction under s 177.", "The duty to act within powers under s 171.", "No duty, as the company had not yet bought the land.", "The duty to exercise independent judgment under s 173."], "a": "A", "x": ["Correct. Exploiting a corporate opportunity is a s 175 conflict.", "Wrong. Section 177 concerns transactions with the company.", "Wrong. Not the main issue.", "Wrong. It does not matter that the company could not have taken the opportunity.", "Wrong. Not the main issue."]}, {"ch": 3, "n": 7, "sc": ["The shareholders want to remove a director before the end of his term."], "st": "What is required under s 168 of the Companies Act 2006?", "o": ["A written resolution.", "A board resolution.", "An ordinary resolution at a general meeting, with special notice of 28 days given to the company.", "A court order.", "A special resolution."], "a": "C", "x": ["Wrong. A written resolution cannot be used.", "Wrong. Shareholders remove directors.", "Correct. Section 168 requires an ordinary resolution at a meeting with special notice.", "Wrong. Not required.", "Wrong. An ordinary resolution suffices."]}, {"ch": 3, "n": 8, "sc": ["A company wishes to lend £15,000 to one of its directors."], "st": "What approval is required?", "o": ["An ordinary resolution of the members, unless an exception applies.", "Court approval.", "A special resolution.", "No approval is needed.", "A board resolution only."], "a": "A", "x": ["Correct. Loans to directors require member approval by ordinary resolution under s 197, subject to exceptions (for example, the £10,000 exception for small loans).", "Wrong. Not required.", "Wrong. An ordinary resolution is enough.", "Wrong. Approval is required.", "Wrong. Member approval is needed."]}, {"ch": 3, "n": 9, "sc": ["A shareholder holds 30% of the voting shares in a company."], "st": "Which resolution can the shareholder block alone?", "o": ["None.", "A special resolution.", "Any resolution of the members.", "An ordinary resolution.", "A board resolution."], "a": "B", "x": ["Wrong. They can block a special resolution.", "Correct. Holding more than 25% allows a shareholder to block a special resolution, which needs 75%.", "Wrong. Not every resolution.", "Wrong. 30% cannot block an ordinary resolution.", "Wrong. Shareholders do not vote on board resolutions."]}, {"ch": 3, "n": 10, "sc": ["A director is disqualified under the Company Directors Disqualification Act 1986 but continues to act as a director."], "st": "What is the consequence?", "o": ["It is a criminal offence and the director may be personally liable for the company's debts incurred while acting.", "Nothing, if the shareholders consent.", "The disqualification lapses automatically.", "It is a civil matter only.", "The company must be wound up."], "a": "A", "x": ["Correct. Acting while disqualified is an offence and gives rise to personal liability under s 15 CDDA.", "Wrong. Consent is irrelevant.", "Wrong. It does not lapse.", "Wrong. It is also criminal.", "Wrong. Not a consequence."]}, {"ch": 4, "n": 1, "sc": ["Five years ago, a company created a floating charge over its entire undertaking in favour of a bank. Three years later, the company completed a debenture in favour of a lender, which created a floating charge over all of its assets. The lender was aware of the prior charge, but it was not registered at Companies House. Both charges were duly executed by the parties and the lender's charge was registered at Companies House. The company is now in insolvent liquidation."], "st": "Which of the following best describes the position?", "o": ["The lender's charge takes priority as the bank's charge is void against the liquidator and the lender.", "The lender's charge takes priority as the bank's charge is void against the liquidator.", "The bank's charge takes priority, because the lender had actual notice of the prior charge.", "The bank's charge takes priority, because the date of creation determines the order of priority.", "The bank's charge takes priority, because the date of creation determines the order of priority and registration is voluntary."], "a": "A", "bx": "The correct answer was A. The lender's charge takes priority as the bank's charge is void against the liquidator and the lender, due to non-registration. Option B is wrong as the charge is void against both the liquidator and the lender. Notice is not a factor in the priority between floating charges, so option C is wrong. Although the date of creation determines the order of priority, this is subject to registration, and although registration is voluntary, non-registration still has serious consequences. Therefore, options D and E are incorrect."}, {"ch": 4, "n": 2, "sc": ["A company has a fixed charge over its freehold premises and a floating charge over its stock. Both charges were duly executed and registered and the fixed charge was granted first. The company is not in breach of either charge and is solvent."], "st": "Which of the following best describes the position as to dealing with the assets?", "o": ["The company may sell the freehold premises and stock without recourse to the lender(s).", "The company may sell the freehold premises but will need the bank's consent. It may sell the stock when the floating charge has crystallised.", "The company may sell the freehold premises but will need the bank's consent. It may sell the stock without recourse to the bank.", "The company may sell the freehold premises but the bank will need to be added as a party to the sale. It may sell the stock when the floating charge has crystallised.", "The company may sell the freehold premises but will need the bank's consent. It may sell the stock without recourse to the bank unless and until crystallisation occurs."], "a": "E", "bx": "The correct answer was E. This is because the lender's consent will be required for the sale of the premises, but the bank will not need to be added as a party to the sale as it does not have legal title to the property. Therefore, options A and D are wrong. It will be able to deal with the stock, freely, until crystallisation. Therefore options A, B, C and D are incorrect in this respect."}, {"ch": 4, "n": 3, "sc": ["A private limited company, formed in December 2010, with model articles of association and 100,000 ordinary shares, wishes to issue 50,000 new ordinary shares for cash. All of the shareholders are directors. Since incorporation, there have been no resolutions authorising the issue of shares."], "st": "Which of the following best describes the position?", "o": ["The board can issue the shares without recourse to the members.", "The members can issue the shares without reference to the board.", "An ordinary resolution will be required to authorise the issue of shares and a special resolution will be required to disapply the statutory pre-emption rights.", "An ordinary resolution will not be required to authorise the issue of shares, but a special resolution will be required to disapply the statutory pre-emption rights.", "An ordinary resolution will not be required to authorise the issue of shares and a special resolution will not be required to disapply the statutory pre-emption rights."], "a": "D", "bx": "The correct answer was D. This is because an ordinary resolution will not be required to authorise the issue as the company has only one class of shares. However, a special resolution will be required to disapply the statutory pre-emption rights as shares are being issued for cash. Therefore options A, C and E are incorrect. Option B is also incorrect as it is the directors who issue shares."}, {"ch": 4, "n": 4, "sc": ["A private limited company with unamended model articles of association wishes to authorise the purchase of some of its own shares for the sum of £50,000. Distributable profits are £200,000 and net assets are £1m."], "st": "Which of the following best describes the position?", "o": ["A special resolution will be required to authorise the purchase out of capital.", "The company may choose to purchase the shares out of profits, by way of ordinary resolution, or to purchase them out of capital, for which a special resolution will be required.", "The company may only purchase the shares out of profits and an ordinary resolution will be required.", "The company may only purchase the shares out of profits and a special resolution will be required.", "An ordinary resolution will be required to authorise the purchase out of profits."], "a": "C", "bx": "The correct answer was C. This is because the company may not purchase shares out of capital, as profits are available, so option A is incorrect. An ordinary resolution will be required. The company does not have a choice in these circumstances, so option B is incorrect. Option E is technically correct, but the additional detail in option C makes the position clearer and thus option C is the better answer. Option D is incorrect as it says that a special resolution is required. For a purchase out of capital, an ordinary resolution is required to approve the contract, in addition to the special resolution to use capital."}, {"ch": 4, "n": 5, "sc": ["A business has fixed assets of £200,000, current assets of £40,000, current liabilities of £20,000 and long-term liabilities of £100,000."], "st": "Which of the following best describes the position?", "o": ["Net assets are £20,000 and net current assets are £120,000.", "Net assets are £120,000 and net current assets are £20,000.", "Net assets are £100,000 and net current assets are £20,000.", "Net assets are £20,000 and net current assets are £100,000.", "Net assets are £300,000 and net current assets are £60,000."], "a": "B", "bx": "The correct answer was B. This is because current assets less current liabilities = net current assets. Total assets less total liabilities = net assets. Option A is incorrect as the figures are the wrong way around. Option C is incorrect as it deducted long-term liabilities from fixed assets. Option D used the same incorrect figures for net current assets and net assets. Option E is incorrect as it added together the incorrect figures."}, {"ch": 4, "n": 6, "sc": ["A company grants a charge to a bank."], "st": "Within what period must the charge be registered at Companies House?", "o": ["2 months.", "21 days beginning with the day after creation.", "14 days.", "There is no time limit.", "30 days."], "a": "B", "x": ["Wrong. Not the period.", "Correct. Section 859A requires delivery within 21 days.", "Wrong. Not the period.", "Wrong. There is a time limit.", "Wrong. Not the period."]}, {"ch": 4, "n": 7, "sc": ["A company wishes to pay a dividend."], "st": "From what may the dividend lawfully be paid?", "o": ["Loans from directors.", "Share capital.", "Profits available for the purpose (distributable profits).", "The share premium account.", "Any bank balance."], "a": "C", "x": ["Wrong. Not lawful.", "Wrong. Capital cannot be distributed.", "Correct. Under s 830 of the Companies Act 2006, distributions may be made only out of profits available for the purpose.", "Wrong. Share premium is capital.", "Wrong. Cash is not the test."]}, {"ch": 4, "n": 8, "sc": ["A company issues new shares for £3 each with a nominal value of £1."], "st": "How is the extra £2 per share recorded?", "o": ["In the revaluation reserve.", "In the share premium account.", "As profit.", "As a dividend.", "As a loan."], "a": "B", "x": ["Wrong. Not a revaluation.", "Correct. Any premium over nominal value is credited to the share premium account.", "Wrong. Not profit.", "Wrong. Not a dividend.", "Wrong. Not a loan."]}, {"ch": 4, "n": 9, "sc": ["A lender is considering taking security over a company's book debts, which are constantly changing."], "st": "Which type of security is usually appropriate?", "o": ["A fixed charge over land.", "A pledge.", "A floating charge.", "A legal mortgage.", "A personal guarantee from the bank."], "a": "C", "x": ["Wrong. The assets are not land.", "Wrong. A pledge requires possession.", "Correct. Fluctuating assets are usually charged by a floating charge.", "Wrong. Not suitable for changing assets.", "Wrong. Not relevant."]}, {"ch": 4, "n": 10, "sc": ["A company has two floating charges, both registered. The first was created before the second."], "st": "Which has priority, absent any agreement?", "o": ["The later floating charge.", "The larger charge.", "The charge registered later.", "The earlier floating charge.", "They rank equally."], "a": "D", "x": ["Wrong. Not the rule.", "Wrong. Size is irrelevant.", "Wrong. Creation, not registration date, governs.", "Correct. Floating charges rank in order of creation, provided they are registered.", "Wrong. Not the rule."]}, {"ch": 5, "n": 1, "sc": ["A bankruptcy order is made against a client, who is a sole trader. They have no secured debt, but owe money to an employee, trade supplier, HMRC and their civil partner."], "st": "Which of the following are potentially preferential creditors?", "o": ["The employee only.", "The employee, trade supplier and civil partner.", "The employee, HMRC and trade supplier.", "The employee and HMRC.", "HMRC and the trade supplier."], "a": "D", "bx": "The correct answer was D. The employee is primary preferential creditor and HMRC is secondary preferential creditor. The trade supplier will be an ordinary creditor and the civil partner will be a postponed creditor (so options B, C and E are incorrect). Option A also omits HMRC and option E omits the employee."}, {"ch": 5, "n": 2, "sc": ["A bankruptcy order is made against a man this month, following presentation of a bankruptcy petition in the previous month."], "st": "Which of the following most accurately describes a potential preference(s)?", "o": ["A gift of £10,000, made to the man's friend, 12 months ago.", "Repayment of a loan of £5,000 to the man's sister, 18 months ago.", "The sale of a property, for £120,000 less than its then market value, to the man's son, four years ago.", "Full repayment of his credit card balance, one year ago.", "Repayment of a loan of £5,000 to the man's sister, 18 months ago and full repayment of his credit card balance, one year ago."], "a": "B", "bx": "The correct answer was B. The man's sister is his associate. Provided that he was insolvent at the time or because of the transaction and had a desire to prefer, it will be voidable. Desire to prefer will be presumed in the circumstances. Options A and C are potential undervalues. Although a potential preference, option D is out of time as it is to an unconnected person (also making option E incorrect)."}, {"ch": 5, "n": 3, "sc": ["A company's assets exceed its liabilities, and it is generally able to pay its debts as they fall due. However, a statutory demand for an unsecured debt of £6,000 was served four weeks ago by a creditor and has not been complied with. The company has also not made an application to set it aside."], "st": "Which of the following best describes the position?", "o": ["The creditor may petition for the winding-up of the company.", "The company is able to pay its debts under insolvency legislation.", "The company is unable to pay its debts under insolvency legislation and the creditor may petition for the winding-up of the company.", "The company is unable to pay its debts under insolvency legislation, so the company will be wound up.", "The company is able to pay its debts under insolvency legislation as assets exceed liabilities and technically it can pay its debts as they fall due."], "a": "C", "bx": "The correct answer was C. Option A is partially correct, but omitted reference to insolvency legislation. Options B and E are incorrect as even though the company appears solvent, non-compliance with the statutory demand deems the company unable to pay its debts. Option D is incorrect as it omits the need for a winding-up petition."}, {"ch": 5, "n": 4, "sc": ["A company in liquidation has assets of £200,000 and liabilities of £400,000 after payment of fixed charge holders and winding-up expenses. Of the liabilities, £50,000 is owed to preferential creditors and there are no floating charge holders. The client is owed £50,000 as an unsecured creditor."], "st": "Which of the following best sets out what the client will receive?", "o": ["£25,000.00.", "£28,571.43.", "£0.50 for every £1.", "£18,750.00.", "£21,428.57."], "a": "E", "bx": "The correct answer was E. Preferential creditors are paid first, which reduces assets and liabilities by £50,000. £150,000/£350,000 = 0.42857143 × £50,000 = £21,428.57. Options A and C are incorrect as they do not take into account the preferential creditors. Options B and D are incorrect as they reduced only the liabilities and assets figures respectively by £50,000."}, {"ch": 5, "n": 5, "sc": ["A bankruptcy order is made against a client, who is the joint owner of the matrimonial home."], "st": "Which of the following best describes the position?", "o": ["All of the client's property will vest in the trustee in bankruptcy. A court order will be required to sell the home.", "All of the client's property will vest in the trustee in bankruptcy except for tools of the trade and most items essential for day-to-day living. A court order will not be required to sell the home.", "All of the client's property will vest in the trustee in bankruptcy except for tools of the trade, their interest in the home, and most items essential for day-to-day living. A court order will be required to sell the home.", "All of the client's property will vest in the trustee in bankruptcy except for tools of the trade, their interest in the home, and most items essential for day-to-day living. A court order will not be required to sell the home.", "All of the client's property will vest in the trustee in bankruptcy except for tools of the trade and most items essential for day-to-day living. A court order will be required to sell the home."], "a": "E", "bx": "The correct answer was E. Option A is incorrect as it did not exclude tools of the trade and day-to-day items. Options B and D are incorrect as a court order will be required. Options C and D are also incorrect as they suggest that the bankrupt's share of the home will not pass to the trustee in bankruptcy."}, {"ch": 5, "n": 6, "sc": ["A company's directors believe the company cannot continue as a going concern and want a moratorium while an insolvency practitioner tries to rescue it."], "st": "Which procedure is most appropriate?", "o": ["Members' voluntary liquidation.", "Receivership.", "Compulsory liquidation.", "Dissolution.", "Administration."], "a": "E", "x": ["Wrong. This is for solvent companies.", "Wrong. Not a rescue procedure in this sense.", "Wrong. Liquidation ends the company.", "Wrong. Not a rescue procedure.", "Correct. Administration aims to rescue the company and carries a statutory moratorium."]}, {"ch": 5, "n": 7, "sc": ["A liquidator discovers the company sold an asset to an unconnected person at an undervalue 18 months before the onset of insolvency, while insolvent."], "st": "Can the transaction be challenged?", "o": ["Yes, but only as a preference.", "No, because the company received some value.", "No, because it is outside six months.", "No, because the buyer was not connected.", "Yes, as a transaction at an undervalue, which can be challenged within two years."], "a": "E", "x": ["Wrong. It is an undervalue.", "Wrong. Significantly less value is enough.", "Wrong. Six months is the preference period for unconnected persons.", "Wrong. Connection affects only the presumption of insolvency.", "Correct. Transactions at an undervalue can be challenged within two years under s 238 of the Insolvency Act 1986."]}, {"ch": 5, "n": 8, "sc": ["An individual debtor wants to avoid bankruptcy by reaching a binding agreement with creditors."], "st": "Which procedure is designed for this?", "o": ["An individual voluntary arrangement (IVA).", "Administration.", "A company voluntary arrangement.", "Liquidation.", "A debenture."], "a": "A", "x": ["Correct. An IVA binds creditors if approved by 75% in value.", "Wrong. Administration is for companies.", "Wrong. A CVA is for companies.", "Wrong. Liquidation is for companies.", "Wrong. Not an insolvency procedure."]}, {"ch": 5, "n": 9, "sc": ["A liquidator is distributing a company's assets."], "st": "Which of the following is paid first, after fixed charge holders?", "o": ["Shareholders.", "Floating charge holders.", "Expenses of the liquidation.", "Preferential creditors.", "Unsecured creditors."], "a": "C", "x": ["Wrong. Last.", "Wrong. These come after preferential creditors and the prescribed part.", "Correct. Liquidation expenses are paid before preferential creditors.", "Wrong. These come after expenses.", "Wrong. Later."]}, {"ch": 5, "n": 10, "sc": ["A bankrupt individual co-operates fully, and no restrictions order is made."], "st": "When will they usually be discharged?", "o": ["Never.", "After three years.", "Only on application to court.", "Automatically after one year from the bankruptcy order.", "After six years."], "a": "D", "x": ["Wrong. Discharge occurs.", "Wrong. Not the rule.", "Wrong. Discharge is automatic.", "Correct. Section 279 of the Insolvency Act 1986 provides for automatic discharge after one year.", "Wrong. Not the rule."]}, {"ch": 6, "n": 1, "sc": ["In an accounting period, a company buys stock totalling £750,000, which it sells for £2m. It pays wages of £100,000 and other bills of £80,000 and buys new freehold premises and cars for £200,000 and £50,000 respectively."], "st": "Ignoring any capital allowances, what are the company's trading profits?", "o": ["£820,000.", "£1,070,000.", "£1,250,000.", "£1,020,000.", "£870,000."], "a": "B", "bx": "The correct answer was B. The cars and freehold premises are not deductible expenses as they are of a capital nature, rather than an income nature. Option A is incorrect as it deducted all figures from the sales. Option C is incorrect as it did not deduct any expenses other than the purchases. Option D is incorrect as it deducted everything except the premises (incorrectly deducting the cars as an expense) and option E is incorrect as it deducted everything except the cars (incorrectly deducting the premises as an expense)."}, {"ch": 6, "n": 2, "sc": ["A sole trader buys new plant and machinery costing £2m and has an existing pool of plant and machinery with a written down value of £1m in the previous financial year."], "st": "Ignoring any 'super deduction', which of the following best describes the capital allowances the sole trader will be able to claim?", "o": ["The sole trader will be able to claim 18% of the cost of the new plant and machinery and 18% of the written down value of the existing pool.", "The sole trader will be able to claim the cost of the new plant and machinery and 18% of the written down value of the existing pool.", "The sole trader will be able to claim the cost of the new plant and machinery up to £1m and 18% of the written down value of the existing pool.", "The sole trader will be able to claim the cost of the new plant and machinery up to £1m and 18% of both the written down value of the existing pool and the remaining cost of the new plant and machinery.", "The sole trader will be able to claim the cost of the new plant and machinery up to £1m and 18% of the remaining new plant and machinery cost."], "a": "D", "bx": "The correct answer was D. Option B is incorrect due to the cap of £1m on the annual investment allowance. Option E is incorrect as it fails to take into account the writing down allowance on the existing plant and machinery. Option C is incorrect as it fails to take into account the writing down allowance on the remaining cost of the new plant and machinery. Option A is incorrect as it fails to take into account the annual investment allowance."}, {"ch": 6, "n": 3, "sc": ["A sole trader makes a trading loss in the first year of trade, a profit in their second year of trade and a loss in their final year of trade. Prior to setting up the business, they had salary income for several years and they continue to receive a salary of £10,000 per annum for consultancy work."], "st": "Which of the following best describes the reliefs that may be available for the trading losses?", "o": ["Start-up loss relief, carry-across relief, carry-back relief and carry-forward relief.", "Start-up loss relief and terminal loss relief.", "Start-up loss relief, terminal loss relief and carry-forward relief on incorporation.", "Carry-across relief, carry-back relief and carry-forward relief.", "Start-up loss relief, carry-across relief, carry-back relief, carry-forward relief and terminal loss relief."], "a": "E", "bx": "The correct answer was E. All of the other options omit at least one of these reliefs. Option C is also incorrect as carry-forward relief on incorporation is irrelevant to the facts."}, {"ch": 6, "n": 4, "sc": ["A client sets up business as a private medical doctor and works exclusively in providing medical diagnosis and treatment. In their first year of business, the client made trading profits of £100,000."], "st": "Which of the following best describes the client's VAT position in their second year of business?", "o": ["The client must register for VAT as their taxable profits in the previous year exceeded £90,000.", "The client does not need to register for VAT as they make only exempt supplies. The client will be unable to recover any input tax paid.", "The client does not need to register for VAT as they make only zero-rated supplies.", "The client does not need to register for VAT as they make only exempt supplies. The client will be able to recover any input tax paid.", "The client must register for VAT as their taxable profits in the previous year exceeded £90,000. The client will be able to recover any input tax paid."], "a": "B", "bx": "The correct answer was B. The client does not need to register as they make only exempt supplies, so options A and E are incorrect. They do not make zero-rated supplies, so option C is incorrect. Businesses that make only zero-rated supplies may apply for registration for VAT and may recover input tax paid. The client will be unable to recover any input tax paid, so options D and E are also incorrect on this point."}, {"ch": 6, "n": 5, "sc": ["A client, who is a taxable person and registered for VAT, buys raw materials for £100 plus VAT and sells the finished products for £300 plus VAT."], "st": "Assuming VAT is chargeable at the standard rate, which of the following best describes the client's VAT liability?", "o": ["£40.", "£60.", "£80.", "£35.", "£25."], "a": "A", "bx": "The correct answer was A. Input tax at 20% of £100 (£20) may be deducted from output tax of 20% of £300 (£60). Option B is incorrect as it did not deduct the input tax and option C is incorrect as it added the input tax to the output tax. Options D and E are incorrect as they applied the rates of 17.5% and 12.5% respectively."}, {"ch": 6, "n": 6, "sc": ["A sole trader incurs various costs."], "st": "Which of the following is a deductible income expense in computing trading profits?", "o": ["Business entertainment of clients.", "Rent paid for business premises.", "The purchase price of a delivery van.", "Drawings taken by the owner.", "The cost of buying freehold premises."], "a": "B", "x": ["Wrong. Client entertainment is specifically disallowed.", "Correct. Rent is a revenue expense incurred wholly and exclusively for the trade.", "Wrong. Capital, although capital allowances may apply.", "Wrong. Drawings are not expenses.", "Wrong. Capital."]}, {"ch": 6, "n": 7, "sc": ["A VAT-registered business sells goods that are zero-rated."], "st": "Which statement is correct?", "o": ["The supply is outside the scope of VAT.", "No output VAT is charged, but the business can recover input VAT.", "VAT is charged at the standard rate.", "No output VAT is charged and no input VAT is recoverable.", "The business must deregister."], "a": "B", "x": ["Wrong. Zero-rated supplies are taxable supplies.", "Correct. Zero-rated supplies are taxable at 0%, so input tax is recoverable.", "Wrong. Not the standard rate.", "Wrong. That describes exempt supplies.", "Wrong. Not required."]}, {"ch": 6, "n": 8, "sc": ["A business's taxable supplies are expected to exceed the VAT registration threshold in the next 30 days alone."], "st": "What must the business do?", "o": ["Apply to deregister.", "Nothing, as registration is voluntary.", "Register only if it makes exempt supplies.", "Register for VAT under the 'future test'.", "Wait until the end of the year."], "a": "D", "x": ["Wrong. Not relevant.", "Wrong. Registration is compulsory here.", "Wrong. Not relevant.", "Correct. The forward-looking test requires registration if the threshold will be exceeded in the next 30 days alone.", "Wrong. Registration is required."]}, {"ch": 6, "n": 9, "sc": ["A business buys plant and machinery."], "st": "What is the purpose of capital allowances?", "o": ["To exempt the business from VAT.", "To defer income tax.", "To allow the business to pay dividends.", "To give tax relief for capital expenditure, which is otherwise not deductible.", "To reduce capital gains tax on disposal."], "a": "D", "x": ["Wrong. Unrelated.", "Wrong. Not the purpose.", "Wrong. Unrelated.", "Correct. Capital allowances give relief for certain capital expenditure.", "Wrong. Unrelated."]}, {"ch": 6, "n": 10, "sc": ["A VAT-registered trader receives an invoice from a supplier showing VAT."], "st": "What is this VAT called from the trader's perspective?", "o": ["Input tax.", "Exempt tax.", "Output tax.", "Reverse charge.", "Zero-rated tax."], "a": "A", "x": ["Correct. VAT paid on purchases is input tax.", "Wrong. No such term.", "Wrong. Output tax is charged on sales.", "Wrong. Not applicable.", "Wrong. No such term."]}, {"ch": 7, "n": 1, "sc": ["A client has a taxable salary of £41,000 and receives a gross dividend of £5,000 on shares that they own in a limited company. They have no other income."], "st": "How much income tax, if any, should the client pay on the dividend?", "o": ["The client will have to pay tax at the additional rate on the proportion of the dividend that exceeds their dividend allowance.", "The client will have to pay tax at the ordinary rate as the dividend does not exceed the basic rate threshold.", "The client will have to pay tax at the ordinary rate as the dividend does not exceed the basic rate threshold. However, the first £500 will be taxed at 0%.", "The client will have to pay tax at the ordinary rate on the entire dividend because it exceeds their dividend allowance.", "The client will have to pay tax at the upper rate on £4,500 of the dividend. The first £500 will be taxed at 0%."], "a": "E", "bx": "The correct answer was E. This is because their taxable salary already exceeds the basic rate band. The client is into the upper rate for the dividend (not the additional rate as suggested in option A, or the ordinary rate as suggested in options B, C and D). Option B is also incorrect, because it does not mention the dividend allowance and option D does not explain it correctly."}, {"ch": 7, "n": 2, "sc": ["A client has a total salary of £65,000 and pays interest of £100 on a loan to buy a share in a partnership. The client receives a gross dividend of £3,000 and gross interest of £1,000 on their savings. The personal allowance is £12,570 and the higher rate threshold for taxable income is £37,700."], "st": "Which of the following best describes the client's liability for income tax?", "o": ["The client is a higher rate taxpayer (HRT) and their basic rate band has been fully used up by their taxable salary. They will pay tax on the interest received and dividend at the higher/upper rates.", "The client is an HRT with taxable income of £56,330 and their basic rate band has been fully used up by their taxable salary. They will pay tax on the interest received and dividend at the higher/upper rates, but the first £500 of the interest will be taxed at 0% and the first £500 of the dividend will be taxed at 0%.", "The client is an HRT with taxable income of £56,330 and their basic rate band has been fully used up by their taxable salary. They will pay tax on the dividend at the higher/upper rates, but the interest received will be taxed at 0% as it falls within the personal savings allowance and the first £500 of the dividend will be taxed at 0%.", "The client is an HRT with taxable income of £56,430 and their basic rate band has been fully used up by their taxable salary. They will pay tax on the interest and dividend at the higher/upper rates, but the first £500 of the interest will be taxed at 0% and the first £500 of the dividend will be taxed at 0%.", "The client will not be liable to tax on the interest as it does not exceed £5,000. They will pay tax at a rate of 8.75% on £1,000 of the dividend as it does not exceed £37,700, but the first £500 of the dividend will be taxed at 0%."], "a": "B", "bx": "The correct answer was B. The taxable income figure in option D is incorrect, as it does not take into account the allowable relief. As a higher rate taxpayer, the dividend allowance (DA) will be £500 and the personal savings allowance (PSA) will be £500, not £1,000, as suggested in option C. Option A is incorrect as it ignores the PSA and DA. Option E is incorrect, as it does not take into account the progressive nature of income tax."}, {"ch": 7, "n": 3, "sc": ["A client has taxable non-savings/non-dividend income of £35,000 and receives gross interest of £6,000 on their savings. They have no other income."], "st": "What rate(s) of tax will they be required to pay on the interest?", "o": ["20%.", "40%.", "0% on £500, 20% and 40%.", "0% on £1,000 and 20%.", "0% and 20%."], "a": "C", "bx": "The correct answer was C. Taxable non-savings/non-dividend income (NSNDI) means that the personal allowance and any allowable reliefs have already been deducted. Taxable NSNDI of £35,000 and taxable savings income of £6,000 means that the client is a higher rate taxpayer, so they will be entitled to a personal savings allowance of £500, taxable at 0% (not £1,000 as suggested in option D). They will be taxed on the balance of £2,200 at 20% and the balance of £3,300 at 40%. All of the other options state the incorrect rate(s) and/or ignore the crossover between rates."}, {"ch": 7, "n": 4, "sc": ["A client has taxable non-savings/non-dividend income of £38,000 and no savings income. They receive a gross dividend of £2,000."], "st": "How much tax will they be required to pay on the dividend?", "o": ["£506.25.", "£337.50.", "£131.25.", "£17
