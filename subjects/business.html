5.", "£675."], "a": "A", "bx": "The correct answer was A. Taxable non-savings/non-dividend income (NSNDI) means that the personal allowance and any allowable reliefs have already been deducted. Taxable NSNDI of £38,000 and taxable dividend income of £2,000 means that the client is a higher rate taxpayer, so they will be entitled to a dividend allowance of £500, taxable at 0%. They will be taxed on the balance of £1,500 at 33.75%. Option B is incorrect as it suggests the dividend allowance is £1,000. Option C is incorrect as it calculates the tax at 8.75%. Options D and E are incorrect as they both ignore the dividend allowance and charge the whole amount to tax at 8.75% and 33.75% respectively."}, {"ch": 7, "n": 5, "sc": ["A client is concerned about potential liability under the general anti-abuse rule (GAAR) and penalties for late payment of income tax."], "st": "Which of the following best describes the position?", "o": ["Under the GAAR procedure, a taxpayer will be notified if an abusive tax avoidance arrangement (ATAA) is uncovered and a fine may be payable. Penalties for late payment include interest and fixed penalties.", "Under the GAAR procedure, a taxpayer will be notified if an ATAA is uncovered and a request for tax adjustments will be made. Penalties for late payment include interest and fixed penalties.", "Under the GAAR procedure, a taxpayer will be notified if an ATAA is uncovered, a fine may be payable and a request for tax adjustments will be made. Penalties for late payment include interest and fixed penalties.", "Under the GAAR, HMRC must notify a taxpayer before imposing a fine. The GAAR advisory panel deals with any representations made by the taxpayer. Penalties for late payment are limited to payment of interest.", "Any breach of GAAR will automatically be referred to a tax tribunal, which will consider any representations made by a taxpayer. Penalties for late payment include interest and fixed penalties."], "a": "B", "bx": "The correct answer was B. Fines are not payable under the GAAR (as suggested in options A, C and D), but a request for tax adjustments may be made. Penalties for late payment include interest and fixed penalties, which also makes option D incorrect. Breaches of the GAAR are not automatically referred to a tax tribunal, as suggested in option E."}, {"ch": 7, "n": 6, "sc": ["An individual's income tax is calculated."], "st": "In which order are categories of income taxed?", "o": ["Savings first, then dividends, then non-savings.", "Non-savings income, then savings income, then dividend income.", "Non-savings, then dividends, then savings.", "All income together at one rate.", "Dividends first, then savings, then non-savings."], "a": "B", "x": ["Wrong. Wrong order.", "Correct. Income is treated as forming the top slice in this order: non-savings, savings, dividends.", "Wrong. Wrong order.", "Wrong. Income tax is progressive and categorised.", "Wrong. Wrong order."]}, {"ch": 7, "n": 7, "sc": ["A taxpayer pays interest on a loan taken out to buy an interest in a partnership."], "st": "How is the interest treated?", "o": ["As non-deductible.", "As an expense of the partnership.", "As a tax credit.", "As a relief deducted from total income.", "As a capital loss."], "a": "D", "x": ["Wrong. It is deductible as a relief.", "Wrong. Not a partnership expense.", "Wrong. Not a credit.", "Correct. Interest on a qualifying loan to buy into a partnership is a relief.", "Wrong. Not capital."]}, {"ch": 7, "n": 8, "sc": ["An individual's adjusted net income exceeds £100,000."], "st": "What happens to the personal allowance?", "o": ["It is doubled.", "It is reduced by £1 for every £2 of income above £100,000.", "It is converted into a dividend allowance.", "It is lost entirely at once.", "It is unaffected."], "a": "B", "x": ["Wrong. Not correct.", "Correct. The personal allowance tapers at £1 for every £2 above £100,000.", "Wrong. Not correct.", "Wrong. It tapers.", "Wrong. It is affected."]}, {"ch": 7, "n": 9, "sc": ["A self-employed individual files a self-assessment return online."], "st": "What is the usual filing deadline?", "o": ["31 January following the end of the tax year.", "6 July.", "30 June.", "31 October following the end of the tax year.", "5 April."], "a": "A", "x": ["Correct. Online returns are due by 31 January.", "Wrong. Not the deadline.", "Wrong. Not the deadline.", "Wrong. 31 October is the paper deadline.", "Wrong. End of the tax year."]}, {"ch": 7, "n": 10, "sc": ["An employee receives a company car as a benefit in kind."], "st": "How is this treated for income tax?", "o": ["As savings income.", "As dividend income.", "As employment income, taxed on its cash equivalent.", "As exempt income.", "As a capital receipt."], "a": "C", "x": ["Wrong. Not savings.", "Wrong. Not a dividend.", "Correct. Benefits in kind are employment income.", "Wrong. Not exempt.", "Wrong. Not capital."]}, {"ch": 8, "n": 1, "sc": ["A client, who is a sole trader, purchased their business (which included a freehold commercial property) 10 years ago for £100,000. The client has now retired and has sold the business for £200,000. They have not made any previous capital disposals."], "st": "Which of the following will the client be able to deduct from the sale price in order to calculate their basic gain?", "o": ["The purchase price, estate agents' fees of £3,750 incurred in the sale, £2,500 spent repairing the roof, £3,000 in legal fees on the sale, £2,000 in legal fees on the purchase and £4,000 in installing a replacement kitchen and windows.", "Estate' agents fees of £3,750 incurred in the sale, £3,000 in legal fees on the sale and £2,000 in legal fees on the purchase.", "The purchase price, estate agents' fees of £3,750 incurred in the sale, £3,000 in legal fees on the sale and £2,000 in legal fees on the purchase.", "The purchase price, estate agents' fees of £3,750 incurred in the sale, £3,000 in legal fees on the sale, £2,000 in legal fees on the purchase and £4,000 in installing a replacement kitchen and windows.", "Estate agents' fees of £3,750 incurred in the sale, £3,000 in legal fees on the sale, £2,000 in legal fees on the purchase and £4,000 in installing a replacement kitchen and windows."], "a": "C", "bx": "The correct answer was C. This is because the purchase price must be deducted (which is why option B is incorrect and partially why option E is incorrect). The other items listed are allowable expenditure. Options A, D and E are incorrect, as repair/replacement/renewal of existing items does not qualify as allowable expenditure."}, {"ch": 8, "n": 2, "sc": ["A client is selling their 25% ordinary shareholding in a trading company for £2m. They bought the shares 20 years ago for £500,000 and they carry 25% of the voting rights in the company. You can assume that there is no allowable expenditure. The client was a director of the company, until they retired five years ago. The client is a higher rate taxpayer (HRT) and has only made one other capital disposal, three years ago, where they claimed business asset disposal relief (BADR) on a chargeable gain of £200,000."], "st": "Which of the following best describes the client's liability for capital gains tax (CGT)?", "o": ["The client will be entitled to the full annual exemption (AE) and to BADR on the chargeable gain. CGT will be charged at 24%, as the client is an HRT.", "The client will be entitled to the full AE and to BADR on the chargeable gain, up to £1m. CGT will be charged at 24% on the balance, as the client is an HRT.", "The client will be entitled to the full AE and to BADR on the chargeable gain up to £800,000. CGT will be charged at 24% on the balance, as the client is an HRT.", "The client will be entitled to the full AE and to BADR on the chargeable gain. CGT will be payable at a rate of 14%.", "The client will be entitled to the full AE, but not to BADR. CGT will be payable at a rate of 24% as the client is an HRT."], "a": "E", "bx": "The correct answer was E. The AE applies as the client has not made any previous capital disposals in the current tax year. However, BADR does not apply (as assumed in options A-D) as they fail to satisfy the condition of being an employee or officer of the company for the last two years. Options A, B and D are also incorrect, as if BADR had been available, they would have been taxed at a flat rate of 14% for the first £800,000 (bearing in mind the lifetime limit of £1m) and 24% on the balance. Option C would have been correct if all conditions for BADR had been satisfied."}, {"ch": 8, "n": 3, "sc": ["A trading partnership has three partners (a man, a woman and a client) who have been in partnership for five years. They share income profits equally and capital profits in accordance with their capital contributions, which are as follows: Man: 50% Woman: 30% Client: 20% Four years ago, the firm purchased office premises for £100,000, and they have just been sold for £200,000. None of the partners have made any previous capital disposals and they are all higher rate taxpayers."], "st": "Which of the following best describes the partners' liability to capital gains tax (CGT) on the sale?", "o": ["Each partner will pay CGT on the percentage of the basic gain that corresponds with the proportion in which they share capital profits. They will be entitled to deduct any allowable expenditure and the annual exemption first and it is likely they will qualify for BADR, paying tax at 14%.", "Each partner will pay CGT on the percentage of the basic gain that corresponds with the proportion in which they share capital profits. They will be entitled to deduct the annual exemption first, but it is unlikely that they will qualify for BADR.", "Each partner will be liable to pay CGT on one-third of the basic gain. They will be entitled to deduct any allowable expenditure and the annual exemption first and it is likely they will qualify for BADR, paying tax at 14%.", "Each partner will be liable to pay CGT on one-third of the basic gain. They will be entitled to deduct any allowable expenditure and the annual exemption first, but it is unlikely they will qualify for BADR, so they will pay tax at 24%.", "Each partner will pay CGT on the percentage of the basic gain that corresponds with the proportion in which they share in capital profits. They will be entitled to deduct any allowable expenditure and the annual exemption first and it is likely they will qualify for BADR, paying tax at 24%, as higher rate taxpayers."], "a": "A", "bx": "The correct answer was A. The express agreement sets the share of capital profits, which displaces the presumption of equal shares. Therefore, options C and D are incorrect. The allowable expenditure and annual exemption can be deducted. Option B is incorrect as it fails to mention the allowable expenditure and suggests BADR will not apply (as does option D). BADR applies as they have owned the business for at least two years and it gives a flat rate of 14% (not 24%, as suggested in option E). They are clearly within their lifetime limit, having not made any previous capital disposals."}, {"ch": 8, "n": 4, "sc": ["A client sold their holiday home in England two weeks ago. The client is a higher rate taxpayer and the property has never been let commercially. The property was bought for £400,000 five years ago and is now being sold for £700,000. Legal fees of £1,500 were paid on the acquisition, and solicitors' and estate agents' fees together totalling £3,500 have been incurred on the sale. Three years ago, the client built a substantial extension costing £100,000. The current annual exemption is £3,000 and the client has made no previous capital disposals."], "st": "Which of the following best identifies the client's capital gains tax liability?", "o": ["£58,400.", "£38,400.", "£19,200.", "£70,080.", "£46,080."], "a": "E", "bx": "The correct answer was E. £700,000 - £400,000 - £1,500 - £3,500 - £100,000 - £3,000 = £192,000 chargeable gain. This is taxed at 24% as the client is a higher rate taxpayer. Option A is incorrect, as the cost of the extension was not deducted, and tax was charged at 20%. Option B is incorrect as tax was charged at 20%. Option C is incorrect as tax was charged at 10%. Option D is incorrect, as the cost of the extension was not deducted. The transaction does not qualify for business asset disposal relief as it is not business property."}, {"ch": 8, "n": 5, "sc": ["A client who was a 50% partner in an accountancy business dies. He purchased his share in the business 10 years ago for £200,000 and it is now worth £350,000. He also owned, for eight years, business premises that were occupied by the business. There is no binding contract for sale of these assets in the partnership agreement."], "st": "Which of the following best describes the tax position in respect of the business interest and the premises?", "o": ["The personal representatives will pay capital gains tax (CGT) on the market value of the business interest and the chargeable gain on the premises.", "The personal representatives will pay CGT on the chargeable gain of the business interest and the premises.", "No CGT will be payable, but the personal representatives will acquire the business interest and the premises at their market value as at the date of the client's death. Inheritance tax will be payable.", "No CGT will be payable, but the personal representatives will acquire the business interest and the premises at their market value as at the date of the client's death. It is likely that business property relief (BPR) of 100% will apply to the business interest and BPR of 50% will apply to the premises.", "No CGT will be payable, but the personal representatives will acquire the business interest and the premises at their market value as at the date of the client's death. It is likely that BPR of 100% will apply to the business interest and the premises."], "a": "D", "bx": "The correct answer was D. There is no liability to CGT on death, so options A and B are incorrect. Option C is partially correct, but does not acknowledge BPR. BPR is correctly applied in option D, but incorrectly applied in option E."}, {"ch": 8, "n": 6, "sc": ["A taxpayer gives a valuable painting to her spouse."], "st": "What are the CGT consequences?", "o": ["It is a chargeable lifetime transfer for CGT.", "No gain or loss arises; the spouse takes over the original base cost.", "The gift is a potentially exempt transfer for CGT.", "The spouse pays CGT.", "CGT is payable on the market value."], "a": "B", "x": ["Wrong. This is an IHT concept.", "Correct. Transfers between spouses living together are on a no-gain/no-loss basis.", "Wrong. This is an IHT concept.", "Wrong. Not payable.", "Wrong. Not payable."]}, {"ch": 8, "n": 7, "sc": ["An individual gives his shares in an unlisted trading company to his son and dies five years later."], "st": "How is the gift treated for inheritance tax at the time it is made?", "o": ["As a transfer subject to CGT only.", "It is ignored.", "As a chargeable lifetime transfer.", "As a potentially exempt transfer.", "As an exempt transfer."], "a": "D", "x": ["Wrong. IHT is also relevant.", "Wrong. Not ignored.", "Wrong. CLTs are gifts to most trusts and companies.", "Correct. A lifetime gift to an individual is a PET.", "Wrong. Not exempt."]}, {"ch": 8, "n": 8, "sc": ["A sole trader sells business premises and buys new business premises with the proceeds within the required period."], "st": "Which CGT relief may be available?", "o": ["Private residence relief.", "Gift relief.", "Annual exemption only.", "Business asset disposal relief only.", "Roll-over relief."], "a": "E", "x": ["Wrong. Not a residence.", "Wrong. Gift relief applies to gifts.", "Wrong. Other reliefs may apply.", "Wrong. Not the relief for reinvestment.", "Correct. Roll-over relief defers the gain where proceeds are reinvested in qualifying business assets."]}, {"ch": 8, "n": 9, "sc": ["A business owner gives business assets to her daughter."], "st": "Which CGT relief may defer the gain?", "o": ["Indexation allowance.", "Taper relief.", "Private residence relief.", "Roll-over relief.", "Hold-over (gift) relief."], "a": "E", "x": ["Wrong. Not for individuals.", "Wrong. Abolished.", "Wrong. Not applicable.", "Wrong. Roll-over relief requires reinvestment.", "Correct. Gift relief allows the gain to be held over against the donee's base cost."]}, {"ch": 8, "n": 10, "sc": ["A taxpayer dies owning shares that have increased in value."], "st": "What is the CGT position?", "o": ["There is no CGT on death; the personal representatives acquire the assets at probate value.", "CGT is payable at 50%.", "CGT is payable on the increase.", "Gift relief applies.", "The beneficiaries pay CGT."], "a": "A", "x": ["Correct. Death is not a disposal for CGT, and there is a tax-free uplift to market value.", "Wrong. Not the rule.", "Wrong. No CGT on death.", "Wrong. Not relevant.", "Wrong. Not on death."]}, {"ch": 9, "n": 1, "sc": ["A man has a 40% shareholding in a trading company with four shareholders. Two of the other shareholders each own 28% of the shares and the remaining shareholder holds 4%. All shareholders are full-time working directors of the company. In the current financial year, the company makes trading profits and chargeable gains (after indexation) totalling £1.7m. The company pays directors' fees of £300,000, dividends of £700,000 and debenture interest of £100,000. It also makes a loan of £10,000 to the remaining shareholder."], "st": "Which of the following best describes the company's corporation tax liability and the position with the loan?", "o": ["The directors' fees, dividends and debenture interest are deductible expenses. A deposit must be paid to HMRC in respect of the loan, as this is a close company.", "The directors' fees and debenture interest are deductible expenses. A deposit must be paid to HMRC in respect of the loan, as this is a close company.", "The directors' fees, debenture interest and loan are deductible expenses. No deposit must be paid to HMRC in respect of the loan as it falls within one of the exceptions under the close company rules.", "The directors' fees, dividends, debenture interest and loan are deductible expenses. No deposit must be paid to HMRC in respect of the loan as it falls within one of the exceptions under the close company rules.", "The directors' fees and debenture interest are deductible expenses. No deposit must be paid to HMRC in respect of the loan as it falls within one of the exceptions under the close company rules."], "a": "E", "bx": "The correct answer was E. The dividends (options A and D) and loan (options C and D) are not deductible expenses. No deposit is payable, as although this is a close company, one of the exceptions applies. Therefore, options A and B are incorrect in this respect."}, {"ch": 9, "n": 2, "sc": ["In its first 12-month accounting period of trade, a company makes neither a trading profit nor a trading loss, but did make a chargeable gain (and no overall capital loss) from the sale of a freehold property. In the second 12-month accounting period, a trading loss was made and there was no capital gain or capital loss. In the third (but not final) accounting period, a trading profit was made and there was no capital gain or capital loss."], "st": "Which of the following best describes the corporation tax relief(s) that may be available to the company?", "o": ["Carry-across, carry-back and carry-forward.", "Carry-across and carry-forward.", "Carry-back and carry-forward.", "Carry-back, carry-forward and terminal carry-back.", "Carry-forward and terminal carry-back."], "a": "C", "bx": "The correct answer was C. Carry-across does not apply (as suggested in options A and B) as the company made no other profits in the loss-making year. Terminal carry-back does not apply (as suggested in options D and E) as the company has not ceased to trade."}, {"ch": 9, "n": 3, "sc": ["A company makes income profits of £800,000 and a chargeable gain (after indexation) of £900,000 in the same tax year. The directors are considering whether to pay dividends of £500,000 or directors' fees of £500,000."], "st": "Which of the following best describes the tax position?", "o": ["The company will pay income tax on the income profits and capital gains tax on the chargeable gain.", "The company will pay corporation tax on the income profits and chargeable gain. The dividends and directors' fees are deductible expenses.", "The company will pay income tax on the income profits and capital gains tax on the chargeable gain. The dividends and directors' fees are deductible expenses.", "The company will pay corporation tax on the income profits and chargeable gain. The directors' fees are deductible expenses.", "The shareholders and directors will pay income tax on their dividends and directors' fees respectively, and the company will pay corporation tax on the income profits."], "a": "D", "bx": "The correct answer was D. Companies do not pay income tax or capital gains tax (as suggested in options A and C). Dividends are not deductible expenses for corporation tax purposes, so options B and C are incorrect. Although income tax is payable by individuals on dividends and directors' fees, corporation tax is payable on both a company's income profits and chargeable gains, so option E is incorrect."}, {"ch": 9, "n": 4, "sc": ["A company makes income profits of £600,000 and a chargeable gain (after indexation) of £1m in the same tax year. The company pays directors' fees of £400,000 and pays debenture interest of £50,000."], "st": "Which of the following accurately states the company's corporation tax liability?", "o": ["£287,500.", "£400,000.", "£300,000.", "£387,500.", "£218,500."], "a": "A", "bx": "The correct answer was A ((£600,000 + £1,000,000 - £400,000 - £50,000) × 25%). Option B is incorrect as it does not deduct the directors' fees and debenture interest. Option C is incorrect as it does not deduct the debenture interest. Option D is incorrect as it does not deduct the directors' fees. Option E is incorrect because it applies corporation tax at 19%."}, {"ch": 9, "n": 5, "sc": ["In its third 12-month accounting period of trade, a company makes a trading profit from manufacturing, but a trading loss from its property portfolio (which made a profit in the second accounting period). It made no chargeable gain or loss in the same periods. In the fourth and final 12-month accounting period, trading profits were made for both parts of the business and there were no capital gains or capital losses."], "st": "Which of the following best describes the potential corporation tax relief(s) that may be available to the company?", "o": ["Carry-across, terminal carry-back and carry-forward.", "Carry-forward and terminal carry-back.", "Carry-across and carry-forward.", "Carry-back, carry-forward and terminal carry-back.", "Carry-across, carry-back and carry-forward."], "a": "E", "bx": "The correct answer was E. On the facts, all three reliefs may be an option and all other options omit one or more of them. Carry-across could be used for the trading loss in the third year, even though it relates to a different part of the business. Carry-back could be used against the trading profit in year two. Carry-forward could be used against the trading profit in year four. Terminal carry-back relief could not be used (as suggested in options A, B and D) as although the company is ceasing to trade, it did not make a loss in the final 12 months of trade."}, {"ch": 9, "n": 6, "sc": ["A company makes a capital gain on selling land."], "st": "Which tax applies to the gain?", "o": ["Income tax.", "VAT only.", "Capital gains tax.", "Corporation tax.", "Stamp duty."], "a": "D", "x": ["Wrong. Not income tax.", "Wrong. VAT may also apply, but the gain is taxed under corporation tax.", "Wrong. Companies do not pay CGT.", "Correct. Companies pay corporation tax on chargeable gains.", "Wrong. Not stamp duty."]}, {"ch": 9, "n": 7, "sc": ["A company makes a loss on the sale of a capital asset."], "st": "How can a capital loss generally be used?", "o": ["Against trading profits of the same year.", "Against dividends received.", "Carried back three years against trading profits.", "Against current or future chargeable gains only.", "It is lost."], "a": "D", "x": ["Wrong. Not against trading profits.", "Wrong. Not relevant.", "Wrong. Not carried back.", "Correct. Capital losses can be set only against chargeable gains.", "Wrong. It can be used."]}, {"ch": 9, "n": 8, "sc": ["A company is a 'close company'."], "st": "What does this mean?", "o": ["It is a non-profit company.", "It has closed down.", "It is controlled by five or fewer participators, or by participators who are directors.", "It has no employees.", "It is listed on a stock exchange."], "a": "C", "x": ["Wrong. Not the meaning.", "Wrong. Not the meaning.", "Correct. A close company is controlled by five or fewer participators or by director-participators.", "Wrong. Irrelevant.", "Wrong. Listed companies are generally not close."]}, {"ch": 9, "n": 9, "sc": ["A company calculates its taxable total profits."], "st": "Which of the following is deducted as a business expense?", "o": ["Corporation tax paid.", "Repayment of the principal of a loan.", "Dividends paid to shareholders.", "Capital expenditure on new premises.", "Salaries paid to employees."], "a": "E", "x": ["Wrong. Not deductible.", "Wrong. Capital.", "Wrong. Dividends are appropriations of profit.", "Wrong. Capital.", "Correct. Salaries are revenue expenses."]}, {"ch": 9, "n": 10, "sc": ["A company ceases trading after making a loss in its final 12 months."], "st": "Which relief may be available?", "o": ["Terminal carry-back relief.", "Personal allowance.", "Roll-over relief.", "Start-up loss relief.", "Gift relief."], "a": "A", "x": ["Correct. Terminal carry-back allows a final 12-month loss to be carried back three years.", "Wrong. Not for companies.", "Wrong. A capital gains relief.", "Wrong. This is for individuals.", "Wrong. Not relevant."]}]},Q=D.q,L="ABCDE";let i=0,A={};
