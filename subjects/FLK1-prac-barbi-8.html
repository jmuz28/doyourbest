use, so it does not form part of her estate passing through her will. The fact that the woman had continued to live in the house and received an ongoing benefit from the house does not change this. (Note, however, that the house will be included in the woman's taxable estate for inheritance tax purposes.) Accordingly, (A), (C), (D), and (E) are incorrect."},{n:17,id:"CRL072",scenario:"A police marksman was called to a scene where a man was holding his family hostage with a gun and threatening to kill them all. When the marksman arrived, he could see the man through an open window, holding a gun to his wife's head. The marksman shot the man in the head, killing him instantly. It was later discovered that the man's gun was imitation and could not fire any ammunition.",q:"Should the marksman be prosecuted for the homicide of the man?",opts:["The marksman should not be prosecuted for the homicide of the man because the circumstances of the situation amounted to a break in factual causation.","The marksman should be prosecuted for the homicide of the man because a marksman is required to warn a person before using deadly force.","The marksman should not be prosecuted for the homicide of the man because the shooting appeared necessary to protect the family.","The marksman should be prosecuted for the homicide of the man because the gun was an imitation firearm and therefore harmless.","The marksman should be prosecuted for the homicide of the man because the marksman's mistake was one of fact rather than law."],ans:"C",expl:"(C) The marksman should not be prosecuted because the shooting appeared to be necessary to protect the family. The defence of self-defence may be available; the defence can be used when force is used to protect oneself, another, or property. For this defence to be made out, the defendant must have believed force was immediately required to protect himself or another from physical harm, and the amount of force must have been reasonable on the facts as the defendant believed them to be. In a non-householder case like this one, the level of force must be proportionate to be deemed reasonable. Since the marksman believed the man had a gun to his wife's head and that she could be shot at any time, the force the marksman used appeared proportionate and therefore reasonable to save the woman and the family. (A) is incorrect because factual causation is satisfied; 'but for' the gunshot, the man would not have died. (B) is incorrect because nothing in law requires a marksman to give a warning before using deadly force. (D) is incorrect because we take the facts as the killer reasonably believed them to be, and here it appeared reasonable for the marksman to believe the gun was real. (E) is incorrect because it is true but not relevant under the defence of self-defence."},{n:18,id:"WEA004",scenario:"An elderly woman recently made a will with the assistance of a solicitor. The woman has now died. The will reads rationally, but the woman had become increasingly confused during the last months of her life and had been receiving medical care in relation to her neurological health. The woman's will leaves no assets to her daughter with whom she had not spoken for several years before the woman's death. The woman's daughter is unhappy with her entitlement under the will and is seeking to claim that the will is invalid.",q:"Which of the following statements about the validity of the will is accurate?",opts:["There is no way for the daughter to rebut the presumption that the woman had capacity.","The daughter can challenge the will on the basis of lack of legal capacity.","The daughter can challenge the will if she can prove that the woman lacked mental capacity.","It does not matter if the woman had capacity so long as the statutory formalities for executing a will were followed.","There was no need for the solicitor to obtain medical evidence about the woman's mental capacity before acting for her in relation to the will."],ans:"C",expl:"(C) The daughter can challenge the will if she can prove that the woman lacked mental capacity. In order to make a valid will, a testator must have legal and mental capacity. Those aged over 18 have legal capacity. A testator has mental capacity if, at the material time, they understood the nature of their act of making a will, the extent of their property, and the claims to which they ought to give effect. There is a presumption that a testator had mental capacity, but this can be rebutted by a will challenger who proves the testator lacked capacity. (A) is incorrect. The daughter can rebut the presumption of capacity by proving that the woman lacked capacity. (B) is incorrect. A person has legal capacity if they are age 18 or older, which is the case here since the woman was elderly. (D) is incorrect. The will is invalid if the woman lacked capacity, whether or not the statutory formalities were correctly followed. (E) is incorrect. Solicitors should obtain medical evidence and advice on a client's mental capacity if there are concerns about capacity, as in this case."},{n:19,id:"WEA138",scenario:"An executor is administering the estate of a woman who died recently. The woman had a son, currently aged 18, who has an interest in the estate contingent upon him reaching the age of 21. The executor will continue to hold the son's interest (comprising a sum in a high interest bank account) on trust in the meantime. The will contains no provisions in relation to the holding of this sum. The son has asked for all of the sum to be paid to him to assist with funding his university studies.",q:"Which of the following best states the position of the executors in relation to this request?",opts:["The son is not entitled to receive any of this sum, as he has only a contingent interest.","The son is entitled to receive only half of the sum held for him now.","The executor cannot pay this sum to the son but is able to make a loan to him.","The executor can choose to pay this sum to the son now.","The executor is required to pay the sum to the son if he is able to demonstrate a need for this money."],ans:"D",expl:"(D) The executor can choose to pay the sum to the son now. This situation concerns the executor's power to advance capital under section 32 Trustee Act 1925. As the will does not state otherwise, the executor has discretion to advance the sum held (the capital) to the son even though the son has a contingent interest. (A) is incorrect, as this power covers both vested and contingent interests. (B) is incorrect. There is no longer any limitation on the amount that can be advanced. (C) is incorrect because the capital can be paid to the son. (E) is incorrect. The executor has a wide discretion about whether to advance capital, and the son is not required to demonstrate a need for it."},{n:20,id:"CRL003",scenario:"A thief steals a tourist's wallet from his back pocket without the tourist even feeling it. A minute later, the tourist discovers that his wallet has gone and sees the thief with it. The tourist goes up to the thief to challenge her, and the thief punches the tourist in the face and runs away. People who witness the event quickly subdue the thief and turn her over to the police.",q:"Which of the following charge(s) would be the most appropriate for the prosecutor to charge the thief with under the circumstances?",opts:["Robbery.","Attempted robbery.","Theft and battery.","Battery.","Theft."],ans:"C",expl:"(C) Theft and battery are the most appropriate charges. Theft is the dishonest appropriation of property belonging to another, and battery is the intentional or reckless application of unlawful force on another. Here, the thief took the tourist's wallet without the tourist's permission but without any force. She is therefore guilty of theft. Also, she punched the tourist in the nose and so has committed a battery. For the thief to be guilty of robbery, force or the threat of force must have been used at the time of or immediately before taking the wallet, and that was not the case here. The thief did not use force against the tourist until after she had already stolen the tourist's wallet. Therefore, (A) and (B) are incorrect. (D) is not as good an answer as (C) because it leaves off the theft charge. (E) is not as good an answer as (C) because it leaves off the battery charge.",note:"Minor source slip kept: the facts say the tourist was punched 'in the face'; the explanation says 'in the nose'."},{n:21,id:"TRU063",scenario:`A testator died leaving a will in which he gave his residuary estate to trustees on trust for "such of my children and grandchildren and in such shares as my trustees in their absolute discretion think fit". The will contains no express powers. One of the testator's adult sons has approached the trustees asking for a payment of capital to help him to pay his debts.`,q:"Which of the following statements best describes the trustees' powers?",opts:["They may advance capital provided the advance is for the son's advancement or benefit.","They must consider the son's request and may pay capital to him at their absolute discretion.","They may advance capital as requested provided they obtain the consent of the other adult beneficiaries.","They have no power to pay capital to the son for the purpose described.","They have no power to pay capital to the son as he does not have an interest in capital."],ans:"B",expl:"(B) The trustees must consider the son's request and may pay capital to him at their absolute discretion. The statutory power to advance capital applies to trusts with fixed interests where a beneficiary has a vested or contingent interest in the capital of a fund. The statutory power does not apply to discretionary trusts. In a discretionary trust, the individual beneficiaries do not have interests in the capital. However, the trustees have power to pay out capital and a duty to consider whether to exercise their power. The trust described is a discretionary trust, so each beneficiary has the right to be considered, and the trustees have power to pay out capital at their discretion. (A) and (C) are incorrect because the statutory power of advancement is not relevant here. (D) is incorrect because the trustees' power may be exercised at their discretion whatever the purpose for which the money is to be used. (E) is incorrect because, although the beneficiaries do not have individual interests in the capital of the fund, the trustees have power to pay capital to all or any of them at their discretion."},{n:22,id:"WEA041",scenario:`A man died recently. His will included the following gift: "£50,000 to the children of my sister who reach the age of 18". The man is survived by his sister who has two children, aged 14 and 12. The sister is now pregnant with a third child, conceived before the man's death.`,q:"Which of the following best describes how this gift will be distributed?",opts:["The gift will fail, as none of the children have reached the age [of 18].","The gift of £50,000 will pass only to the 14-year-old and the 12-year-old, provided the[y] reach age 18.","The gift of £50,000 will pass only to the 14-year-old, the 12-year-old, and the baby provided they reach age 18.","The gift will fail for uncertainty.","The gift of £50,000 will pass to any current or future children of the sister who are born before the first child reaches the age of 18."],ans:"E",expl:"(E) The gift of £50,000 may pass to any current or future children of the sister who are born before the first child reaches the age of 18. A class gift is a gift of property to be divided among beneficiaries who fulfil a general description. Here, the class gift is to be divided among the children of the sister who reach the age of 18. Class closing rules apply to determine how and when a class gift should be distributed. Generally, a class closes - to the exclusion of any potential beneficiary not then living - when at least one beneficiary has a vested interest. When there is a contingent gift, the class closes at the date of the testator's death if there is any living beneficiary who has met the condition. If there is no beneficiary who meets the condition, the class remains open until the first beneficiary does. Here, none of the potential beneficiaries are yet 18, so the class will remain open until the date when the first beneficiary reaches the age of 18. Consequently, provided they reach the age of 18, the 14-year-old, 12-year-old, the baby, and any future children born within this time frame will all fall within the class before it closes and will be entitled to share the £50,000 once they reach the age of 18. (A) is incorrect. The gift will not fail, and any of the potential beneficiaries who reach the age of 18 will be able to claim a share of the gift. (B) and (C) are incorrect. All children of the sister who are born before the first beneficiary reaches the age of 18 can claim a share of the £50,000 once they themselves reach the age of 18. (D) is incorrect. A class gift such as this is valid.",note:"The end of option (A) is cut off on the question screen and missing from the answer screen; '[of 18]' is inferred. Option (B) reads 'the reach' on both screens; '[y]' is supplied."},{n:23,id:"TRU089",scenario:"A trustee's friend was having money troubles, so the trustee transferred trust funds into the name of his friend in breach of trust. The friend spent the money on general living expenses and paying down credit card debt. The trust beneficiaries wish to bring a personal claim in equity against the trustee's friend.",q:"What must the beneficiaries establish to hold the friend personally liable in equity?",opts:["The friend had sufficient knowledge as to make it unconscionable for him to retain the funds.","The friend facilitated the breach of trust.","The friend acquired the trust funds for value and without notice of the trust.","The friend was aware of the breach of trust.","The friend did not act as an honest person would in the circumstances."],ans:"A",expl:"(A) The beneficiaries must establish that the friend had sufficient knowledge as to make it unconscionable for him to retain the funds. Unconscionability will be found if the recipient actually knew that the money was trust property or was suspicious about the source of the funds but failed to make such enquiries as a reasonable and honest person would have made. If a third party received trust money with the requisite degree of knowledge of the breach of trust, they will be treated in equity as if they were a constructive trustee. The recipient will be personally liable to the beneficiaries to make good the loss to the trust fund. (B) and (E) are incorrect because these are parts of the test for accessory liability. If a third party has facilitated a breach of trust, the third party is liable as if they were a trustee if their assistance was dishonest. Dishonesty is defined as conscious impropriety or not acting as an honest person would in the circumstances. (C) is incorrect because it is the test for bona fide purchasers. A third party who acquires the legal title to trust property for value and without notice of the trust takes the property free of the equitable interests of the beneficiaries. (D) is incorrect because a recipient may be liable even though they were not aware of the nature of the breach. It is sufficient that they were suspicious about the source of the funds but failed to make such enquiries as a reasonable and honest person would have made."},{n:24,id:"TRU105",scenario:'A trust was established in 2014, a clause of which provided that "the investment powers under the Trustee Act 2000 shall apply to this trust". The trustees do not feel able to make a decision between two investment options, so they take advice from a financial adviser. The advice was poor, and the trust suffered a loss of £32,000.',q:"Are the trustees liable for this loss?",opts:["Yes, because the trustees should have made the investment decision themselves.","Yes, if the trustees should have known the advice was poor.","Yes, because trustees are liable for all trust losses.","No, if the trustees reasonably believed the financial adviser was qualified to give proper advice by reason of the adviser's ability and practical experience.","No, because the financial adviser is liable for the loss."],ans:"D",expl:"(D) The trustees are not liable for the loss if they reasonably believed the financial adviser was qualified to give proper advice by reason of the adviser's ability and practical experience. Trustees are under a statutory obligation to take proper advice before making an investment decision. Proper advice is the advice of a person the trustees reasonably believe to be qualified to give it by reason of their ability and practical experience. If the trustees obtain proper advice, then their duty is discharged, and the trustees will not be liable for a loss. (A) is incorrect because trustees have a duty to obtain and consider proper advice before exercising any power of investment except when the trustees reasonably conclude that in all the circumstances it is unnecessary and inappropriate. (B) is incorrect because the standard is not whether the trustees should have known the advice was poor; rather, the trustees must obtain and consider proper advice from a person reasonably believed to be qualified to give it. (C) is incorrect because trustees are not liable for trust losses from investments if they comply with the requirements of the duty to invest. (E) is incorrect because the financial adviser is not liable for the loss.",note:Wi},{n:25,id:"TRU014",scenario:"A settlor transfers funds to trustees to hold on trust for her son for life with remainder to her son's two daughters in equal shares provided they are living at the son's death and attain the age of 21. One of the daughters has died aged 18. The son and the other daughter are still alive.",q:"What will happen to the share of the daughter who has died?",opts:["It forms part of the daughter's estate and passes under her will or intestacy.","It passes to the surviving daughter.","It reverts to the settlor on resulting trust.","It passes to the surviving daughter provided she attains 21.","It passes to the surviving daughter provided she attains 21 and survives her father."],ans:"C",expl:"(C) The deceased daughter's share reverts to the settlor on resulting trust. The daughters have interests in remainder contingent upon attaining the age of 21 and surviving their father. The interests of the two daughters are separated by the use of the words 'in equal shares', and there is no provision to substitute either daughter should the other fail to meet the contingency. This means that, on the death of one of the daughters, her interest fails and her share passes back to the settlor (or the settlor's estate if she is dead). (A) is incorrect because the share of the daughter was not vested. (B), (D), and (E) are all incorrect because the terms of the trust do not make provision for the substitution of the daughter's share."},{n:26,id:"TRU125",scenario:"A trustee is the trustee of two separate trust funds. One day he realises that his personal bank current account has a balance of zero. He takes £2,000, in breach of trust, from the first trust and deposits the amount in his personal account. The trustee then takes £3,000, in breach of trust, from the second trust and deposits the amount in his account, creating a balance of £5,000. The trustee then removed £3,000 from his account and purchased a holiday. The sum of £2,000 remains in the account. The beneficiaries of the two trusts make a proprietary claim to the remaining sum.",q:"If the beneficiaries agree that the court should not follow the traditional rule, how should the remaining sum be divided?",opts:["£1,000 to each trust.","£2,000 to the first trust and nothing to the second trust.","Nothing to the first trust and £2,000 to the second trust.","£800 to the first trust and £1,200 to the second trust.","£1,200 to the first trust and £800 to the second trust."],ans:"D",expl:"(D) The first trust should receive £800, and the second trust should receive £1,200. If a trustee mixes funds of two trusts in a current account, the traditional rule is that the first money into the account is the first money out of the account. However, courts will instead divide the money proportionately if: (1) applying the first-in, first-out rule is contrary to the express or implied intention of the claimants, (2) it is impractical to apply the rule, or (3) applying the rule would cause injustice to the parties. Here, the beneficiaries agreed that the court should not apply the traditional rule, and so the court would divide the £2,000 proportionately. The payment of £3,000 for the trustee's holiday would be treated in proportion to the money paid into the account from the two trusts. This would mean that the payment consisted of £1,200 from the first trust and £1,800 from the second trust, leaving the £2,000 remaining in the account to be shared £800 to the first trust and £1,200 to the second trust. Accordingly, (A), (B), (C), and (E) are incorrect. Note that (C) would be the result if the court applied the traditional first-in, first-out rule."},{n:27,id:"CRL062",scenario:"A man broke into a home while its female owner was home watching television. The owner was a former mixed martial arts champion. She threw the man to the floor and broke his arm in the process. She then kicked the man several times and broke several of his ribs. Satisfied the man would not be able to harm her, she then called the police to have the man arrested. The police arrested not only the man, but the woman as well, and charged her with assault under Offences Against the Person Act 1861 section 47. At trial, the woman raises self-defence.",q:"Which of the following best states the standard for determining whether the defence of self-defence is available?",opts:["The force used must have been necessary under the actual circumstances.","The force used must have been reasonable under the actual circumstances.","The force used must not have been greater than necessary to resist the victim under the circumstances.","The force used must not have been grossly disproportionate in the circumstances as the defendant believed them to be at the time.","The force used must have been proportionate in the circumstances as the defendant believed them to be at the time."],ans:"D",expl:"(D) For self-defence, the force used must be reasonable based on the facts as the defendant believed them to be. However, the courts will not require a householder to make fine judgments. For householders, force will be considered reasonable so long as it is not grossly disproportionate. (A), (B), and (C) are incorrect both because the force need not actually have been necessary (just reasonable), and we do not judge by the actual circumstances but rather by the circumstances as the defendant believed them. (E) is incorrect because the force used can be disproportionate but may not be grossly disproportionate.",note:Wi},{n:28,id:"CRL089",scenario:"A guest is at a wedding of a Greek couple. He has drunk a lot of champagne and is feeling tipsy. The guest sees piles of plates set up on a table. In his drunken state, the guest believes these plates are a part of the Greek wedding ritual of smashing plates in order to deliver the couple good luck. As the newlyweds walk in, the guest picks up a few of the plates and starts smashing them on the floor. In fact, the plates are set out ready for the wedding buffet. The groom is furious at the guest and calls the authorities.",q:"Is the guest guilty of criminal damage?",opts:["No, because he honestly believed the owner would have consented.","Yes, because he was intoxicated and his judgment impaired.","No, because the belief that the owner wanted him to damage the plates was reasonable.","Yes, because consent must be obtained in advance.","Yes, because he should have awaited express instructions."],ans:"A",expl:"(A) The guest is not guilty of criminal damage because he honestly believed the owner would have consented. An honest belief in the consent of the owner is a defence to criminal damage. (B) is incorrect as the defence of belief in consent is entirely subjective; it will still apply even when the belief is unreasonably held in an intoxicated state. (C) is incorrect as the test for belief in consent is entirely subjective; the belief does not have to be reasonable. (D) and (E) are incorrect as there is no requirement for express consent to be given."},{n:29,id:"WEA071",scenario:"A man died intestate, survived by his wife and two daughters. The assets in his sole name totalled £400,000, comprising the family home (£350,000), personal belongings (£20,000), and £30,000 in bank accounts. The man had no debts. The wife hopes to continue living in the family home and would like it to be transferred to her.",q:"Can the wife receive the family home in satisfaction of her interest in the estate?",opts:["No, because the family home will be split equally between the wife and the daughters.","Yes, because the wife is entitled to the family home as a surviving spouse.","Yes, if the wife is able to pay equality money to the estate.","No, because the wife's interest in the estate is less than the value of the family home.","Yes, if the two daughters consent."],ans:"C",expl:"(C) The wife can receive the family home in satisfaction of her interest in the estate if she is able to pay equality money. The rules of intestate succession apply when a person dies without a will. Under these rules, when the deceased is survived by a spouse or civil partner and issue, the spouse or civil partner will receive personal chattels, £270,000, and one-half of the residue. The deceased's issue will take the other half of the residue. However, a surviving spouse can require the personal representatives to appropriate the family home to the spouse in partial or total satisfaction of their interest. If the property is worth more than the spouse's entitlement, the spouse can still require appropriation provided they pay over the difference - known as equality money - to the estate. Here, the wife is entitled to the personal belongings (£20,000), a statutory legacy of £270,000, and half of the remainder of the estate (half of £110,000, which is £55,000). This totals £345,000. Consequently, in order to receive the family home, which is valued at £350,000, the wife will need to pay £5,000 in equality money to make up the shortfall. (A) is incorrect because the family home will not be split equally between the wife and daughters. (B) is incorrect because a spouse is not entitled to the family home simply by virtue of being the surviving spouse. The spouse must ask the personal representatives to appropriate the home and must be able to pay any equality money. (D) is incorrect because, as explained above, the wife can receive the home even though her interest is less than its value if she can pay equality money. (E) is incorrect because the daughters' consent is not required.",note:`'€' in the OCR of the facts has been read as '£'. ${a1} At £322,000 the wife's entitlement would be £20,000 + £322,000 + £29,000 = £371,000, so no equality money would be needed; the source's figures (£345,000 and £5,000) are kept unchanged.`},{n:30,id:"TRU081",scenario:"In his will, a man left the residue of his estate to trustees on trust to invest and to use the income at their discretion to promote health and wellness in the village in which he was living at his death.",q:"Did the man's will create a valid trust?",opts:["Yes, it created a valid private discretionary trust.","No, because it breaches the inalienability rule.","Yes, it created a valid charitable trust.","No, because the beneficiaries are not defined.","Yes, it created a valid trust for a private purpose."],ans:"C",expl:"(C) The trust is valid as a charitable trust. A charitable trust is a type of purpose trust which is created for the benefit of an indefinite class of persons or the public in general. In order to be charitable, the purposes of the trust must be of a charitable nature (as defined in the Charities Act 2011), it must be for the public benefit, and its objects must be exclusively charitable. A charitable trust is enforceable on behalf of the public at large by the Attorney General, and it may continue indefinitely. Looking at the trust in this case, the advancement of health is one of the listed charitable purposes. The inhabitants of a particular area form an adequate cross-section of the public, and the purpose is exclusively charitable because there is no extra non-charitable purpose. Therefore, this is a valid charitable trust. (A) is incorrect because this is a trust for a purpose, not a discretionary trust. A discretionary trust is a private trust where a class of beneficiaries is defined and where the trustees have discretion as to how the fund is distributed among them. (B) is incorrect because the inalienability rule does not apply to charitable trusts. Private trusts must comply with the inalienability rule, which means that the capital of the fund must not be tied up for longer than the perpetuity period. (D) is incorrect because the requirement for beneficiaries to be certain does not apply to charitable trusts. (E) is incorrect because the trust's purpose is for the benefit of the public."},{n:31,id:"CRL051",scenario:"A woman gave her maid a vial of poison and told her to place it in the woman's husband's cup of tea to kill him. The maid never liked the woman's husband because he had been cruel to both of them for years. She followed through, and the man died from the poisoning. After a brief investigation of the man's death, local authorities arrest both the maid and the woman.",q:"What must a jury decide for the woman to be guilty of assisting or encouraging the murder of her husband?",opts:["The woman's conduct was capable of assisting or encouraging the maid, but it need not have in fact done so.","The woman's conduct was capable of assisting or encouraging the maid, and it did so in fact.","The woman actually assisted or encouraged the maid.","The maid must have known that the woman was assisting or encouraging her.","The woman's conduct caused the maid to commit the murder."],ans:"A",expl:"(A) The jury need only find the woman's conduct was capable of assisting or encouraging the maid. Additionally, the jury would have to find that the woman wanted the crime to be committed. The fact that the other person intends to commit the crime or actually does is not relevant. Therefore, (B), (C), and (E) are incorrect. (D) is incorrect as there is no requirement of knowledge on behalf of the other person as to what the defendant is doing. It is only the defendant's act that is relevant.",note:`${Wi} Option (D) is garbled on both screens; its wording is reconstructed from the fragments.`},{n:32,id:"TRU054",scenario:"In her will a woman appointed two trustees to hold her residuary estate on trust for her children. The trust fund includes a holding of 50% of the shares in a family company. One of the trustees holds 10% of the shares in the same company. The trustee is appointed to be a director of the company by a 75% majority vote and is paid £5,000 in director's fees.",q:"Which of the following best describes the position of the trustee in relation to the director's fees?",opts:["The trustee must hold the fees on trust for the beneficiaries.","The trustee may keep the fees.","The trustee must decline to accept the fees.","The trustee may keep the fees provided that any adult beneficiaries consent.","The trustee may keep the fees provided the other trustee consents."],ans:"A",expl:"(A) The trustee must hold the director's fees on trust for the beneficiaries. The general rule is that a trustee may not profit from their position, and that a trustee holds any profit received as a result of their trusteeship on trust for the beneficiaries. The rule does not apply where the profit would have been received regardless of the trusteeship. Here, the trustee was appointed as director by a 75% vote. Because the trust fund holds 50% of the shares, the trustee would not have been appointed director without the votes attached to the trust shares. This means that he cannot retain the director's fees and must hold the fees on trust. (B) is incorrect because the trustee may not keep the fees, as explained above. (C) is incorrect because, where the rule applies, a trustee is not required to decline a profit but holds it on trust for the beneficiaries. (D) and (E) are incorrect because the consent of the beneficiaries or co-trustees is irrelevant to whether a trustee may keep remuneration."},{n:33,id:"CRL102",scenario:"A man makes repeated silent telephone calls to a woman. The repeated calls make the woman extremely anxious. She is diagnosed with depression as a [result].",q:"Is the man liable for actual bodily harm ('ABH')?",opts:["No, as ABH requires the application of force, which is not satisfied here.","No, as the woman has not suffered any actual bodily harm.","No, as causation is not satisfied as the woman's mental health issues mean she breaks the chain of causation.","Yes, as here all the elements of assault, causation, and actual bodily harm are satisfied.","Yes, as here there is an indirect battery, causation, and actual bodily harm."],ans:"D",expl:"(D) The man is liable for actual bodily harm. ABH encompasses an assault or battery that causes actual bodily harm. Here, there is ABH based on assault, rather than battery. A defendant commits assault when they intentionally or recklessly cause another person to apprehend immediate, unlawful violence. Here, silent telephone calls are sufficient to satisfy this requirement. At the very least, the man is reckless in that he foresees the risk that the telephone calls may cause apprehension of immediate, unlawful violence, and it is an unreasonable risk to take. Causation is satisfied as there is no break in the chain of causation; a defendant must take their victim as they find them, so a predisposition to mental health issues (if this is the case) is not relevant. Diagnosed mental health issues like depression can satisfy the requirement of actual bodily harm. For these reasons, (A), (B), (C), and (E) are all incorrect.",note:"The last word of the facts is cut off by the scan; '[result]' is inferred."},{n:34,id:"CRL015",scenario:"A thief decided to break into a jeweller's home to steal valuables when the thief knew the jeweller would not be at home. The thief unlocked the front door to the jeweller's home with a key that the jeweller had left under a rock for emergencies. When the thief stepped through the doorway, a security alarm sounded and the thief ran away.",q:"What is the most serious crime for which the thief might be convicted?",opts:["Burglary.","Attempted burglary.","Theft.","Attempted theft.","No crime."],ans:"A",expl:"(A) The most serious crime for which the thief may be convicted is burglary. Burglary (9(1)(a) of the Theft Act) is entering a building or part of a building as a trespasser, knowing that they are a trespasser, with the intent to steal, commit grievous bodily harm, or commit criminal damage. Here, the thief entered the jeweller's house without permission and so knowingly committed a trespass. It does not matter how far he went into the jeweller's home so long as some part of his body entered. As soon as the thief trespassed with the intent to commit theft, he was guilty of burglary. (B) is incorrect. Although the thief could be convicted of attempted burglary, burglary is a more serious offence and the thief does not need to steal an item in fact to be guilty under section 9(1)(a). (C) is incorrect because theft requires the taking of property, and here the thief never had the opportunity to take any items. The thief could be found guilty of attempted theft because his intention was to steal. However, we are asked what the most serious crime is, and attempted theft is less serious than burglary. (E) is incorrect because, as discussed above, the thief's actions make out the crime of burglary and attempted theft."},{n:35,id:"CRL047",scenario:"A woman was arrested for stabbing and killing her husband. She had been abused by him for several years. Someone in prison with the woman mentioned voluntary manslaughter. When the woman meets with her lawyer, she asks him what voluntary manslaughter is.",q:"Which of the following best describes voluntary manslaughter?",opts:["Voluntary manslaughter is the intentional killing of a person.","Voluntary manslaughter is another name for homicide.","Voluntary manslaughter is when a defendant has a complete defence to murder but has still killed someone.","Voluntary manslaughter is when a defendant would have been convicted of murder but for the fact they lost control or suffered from diminished responsibility.","Voluntary manslaughter is when a defendant was provoked into killing someone."],ans:"D",expl:"(D) Voluntary manslaughter is when a defendant would normally be convicted of murder but has a partial defence, which results in them being convicted of manslaughter instead. The two main partial defences are loss of control and diminished responsibility. (A) is incorrect because an intentional killing is a murder. (B) is incorrect because it is too broad - all voluntary manslaughters are homicides, but not all homicides are voluntary manslaughters. The term 'homicide' includes murders and involuntary manslaughter as well as voluntary manslaughter. (C) is incorrect because voluntary manslaughter is not a complete defence to murder. A defendant facing a manslaughter charge is likely to spend a significant period of time in prison. (E) is wrong because provocation has now been replaced by loss of control as a partial defence."},{n:36,id:"TRU100",scenario:"A trustee is one of four trustees appointed under a trust constituted in 2009. Two years and six months ago, that trustee made a permanent move to France and has not returned to the United Kingdom since that time. The three other trustees, together with the beneficiaries, would like to replace this trustee.",q:"Can this trustee be replaced?",opts:["Yes, because the trustee is domiciled outside of the United Kingdom.","Yes, because a trustee who has been domiciled outside the United Kingdom for more than six months can be replaced.","Yes, because a trustee who has been domiciled outside the United Kingdom for more than 12 months can be replaced.","Yes, because a trustee who has been domiciled outside the United Kingdom for more than 18 months can be replaced.","Yes, because a trustee who has been domiciled outside the United Kingdom for more than two years can be replaced."],ans:"C",expl:"(C) A trustee who has been domiciled outside the United Kingdom for a continuous period of more than 12 months can be replaced. Accordingly, (A), (B), (D), and (E) are incorrect.",note:"The last line of the explanation is jumbled in the scan ('… QUESTION ID: TRU100 incorrect. are'); it has been reassembled. Source wording kept: the statutory ground (Trustee Act 1925, s 36(1)) is that the trustee 'remains out of the United Kingdom for more than twelve months', not domicile."}],fr="The options on the question screen are partly scrambled by the OCR; the option order and wording here follow the answer-discussion screen, which matches the explanation.",zp="The OCR displaces some words of this explanation; it has been reassembled in reading order from the answer screen.",l1=[{n:1,id:"TRU037",scenario:"In his will, a man left £10,000 to trustees on trust to invest and use the income to sponsor an annual tournament for members of the Southdown Golf Club.",q:"Would a court likely find the man created a valid trust?",opts:["Yes, he created a valid charitable trust.","No, because the objects of the trust are not of a charitable nature.","Yes, it is a valid gift to the members of the Golf Club on the terms of their mutual contracts.","No, because it contravenes the rule against inalienability.","No, because the objects are not exclusively charitable."],ans:"D",expl:"(D) The trust fails because it contravenes the rule against inalienability. A charitable trust must be for a charitable purpose as defined in the Charities Act 2011, it must be for the public benefit, and its objects must be exclusively charitable. The inalienability rule prevents the capital of a trust from being held indefinitely while the income is applied for some private purpose, but this rule does not apply to charitable trusts. In this case, the trust fails as a charitable trust because it fails the public benefit test. It also fails as a private trust because the fact that the trustees may spend only the income means that it breaches the inalienability rule. (A) is incorrect because the people who can benefit from the trust are defined by reference to a private relationship - the members of the Golf Club. This means they do not form an adequate cross-section of the public, and so the trust fails the public benefit test. (B) is incorrect because the advancement of amateur sport is within the list of charitable purposes. (C) is incorrect because the gift is not to the club but to trustees to be applied for the defined purpose. (E) is incorrect because this trust has only one purpose which would be charitable but for the lack of public benefit."},{n:2,id:"TRU048",scenario:"In his will a man appointed two trustees to hold his residuary estate on trust for his widow for life with remainder to his children. The trust fund includes shares in a family company which the trustees decide to sell. The shares have been valued at £10,000. One of the trustees purchases the shares from the trust for £10,000, having obtained informed consent from both the widow and the other trustee.",q:"Was the trustee's purchase of the shares valid?",opts:["Yes, because the trustee obtained the informed consent of the widow.","Yes, because the trustee paid what appears to be fair value for the shares and appeared to be acting in good faith.","No, because the trustee did not pay above fair value.","No, because of potential conflict of interest.","Yes, because the trustee obtained the consent of the other trustee."],ans:"D",expl:"(D) The purchase the shares was invalid because of potential conflict of interest. Trustees must not place themselves in a position where their personal interests conflict with their fiduciary duties to the trust. The 'self-dealing rule' applies to prevent a trustee from purchasing trust property, and any such purchase is voidable at the instance of the beneficiaries. (A) is incorrect because a trustee's purchase of trust property remains voidable, even if a beneficiary's consent was obtained. (B) and (C) are incorrect because the rule applies to whatever sum the trustee is prepared to pay for the trust property and regardless of whether the trustee acts in good faith. (E) is incorrect because the consent of a co-trustee does not prevent the application of the self-dealing rule."},{n:3,id:"CRL012",scenario:"A female store clerk was robbed at gunpoint. Whilst giving the robber her purse, the clerk was hit over the head by the robber with his gun, causing the clerk exquisite pain. The clerk cried out, and the robber dropped his gun in panic and ran away. The clerk, overwhelmed with fury and unable to restrain herself, grabbed the gun and shot at the robber, intending to shoot him in the back. Unfortunately, the clerk missed the robber and hit an innocent bystander who immediately died.",q:"Which of the following statements best reflects the charge that should be brought against the clerk?",opts:["The clerk should be charged with murder because she shot the bystander and not the robber.","The clerk should be charged with manslaughter because she suffered from a sufficient loss of control.","The clerk should be charged with murder because she intended to cause grievous bodily harm to the robber.","The clerk should be charged with murder because she was is in no danger when she shot at the robber.","The clerk should be charged with manslaughter because she did not mean to kill the bystander."],ans:"B",expl:"(B) The clerk should be charged with manslaughter because she suffered from a sufficient loss of control. Voluntary manslaughter is a killing that would be murder but for loss of control. Loss of control is sufficient to reduce a killing from murder to manslaughter if: (1) the defendant's role in the killing resulted from a loss of self-control, (2) the defendant's loss of self-control was caused by a qualifying trigger (here causing the woman to have a justifiable sense of being seriously wronged), and (3) a hypothetical person of defendant's age and sex might have reacted in the same way. Here, the fact that the clerk was seriously assaulted and robbed could be a trigger to make a person lose control and act in that way. She acted very quickly and would not have time to cool down. She had the intent and loss of control for manslaughter. Under 'transferred intent', if a defendant intends to commit an offence against a person and in trying to carry out that intent commits the same offence against another, her intent is transferred. Therefore (A) is incorrect. (E) is also incorrect for the same reason. (C) is wrong because it ignores the partial defence of loss of control. (D) is also wrong because the fact that the clerk was not in danger is not required for a loss of control defence.",note:"Option (C) is garbled on the question screen and completed from the answer screen. Source wording kept in option (D): 'was is in no danger'."},{n:4,id:"TAX089",scenario:"A sole trader made a trade loss in tax year 2020/21 of £40,000. In the same year, she had property income from a portfolio of investment residential properties of £10,000 and realised a gain of £60,000 from the sale of on[e] of these investment properties. The sole trader had trade profits in the prior year of £20,000 and is predicted to generate future trade profits of £20,000 per annum.",q:"Can the 2020/21 trade loss of £40,000 be offset against the 2020/21 gains of £60,000?",opts:["No, because trade losses cannot be used to relieve capital gains.","Yes, but the trader would need to use it against the property income in the same year, ignoring the personal allowance, before using what remains against the gain.","No, because a trade loss can only be carried forward and set against future trade profits.","Yes, and there is no requirement to use it against the property income first, as this is covered by the personal allowance.","Yes, but the trader would need to use it against the trade profits and property income in the prior year and current year, and only what remains could then be used to relieve the gain."],ans:"B",expl:"(B) Yes, but the trader would need to use it against the property income in the same year, ignoring the personal allowance, before using what remains against the gain. A sole trader who has generated a trade loss may use this trade loss against any gains but only after they have made a claim against income in the same tax year. The sole trader would need to relieve the 2020/21 property income of £10,000 (wasting the tax-free allowance) and then the remaining £30,000 of trade loss could be offset against the 2020/21 gains of £60,000."},{n:5,id:"TAX006",scenario:"A carpenter has taxable trade profits for the tax year 2020/21 of £75,000. He also owns an investment property which he rents out to the owner of a clothing store. The investment property generates a rental profit of £30,000. The personal allowance for tax year 2020/21 is £12,500.",q:"What is the carpenter's taxable income?",opts:["£111,000","£92,500","£100,500","£102,000","£95,000"],ans:"E",expl:"(E) £95,000. Both the carpenter's trade profits and rental profits are assessable. Therefore, in total his income was £105,000. He may deduct his personal allowance from this figure. However, as his income is above £100,000, the personal allowance must be tapered so that he loses £1 of allowance for every £2 of income above £100,000. He has £5,000 of income over £100,000, so £2,500 must be deducted from his £12,500 allowance, leaving him with a £10,000 allowance. Therefore, the carpenter's taxable income is £75,000 + £30,000 - £10,000 = £95,000.",note:fr},{n:6,id:"TAX075",scenario:"A shopkeeper has owned his own business for 10 years. It sells imported products from the United States. He sells the business for £800,000 to a large multinational internet firm. The shopkeeper's employment income is £50,000. [The personal allowance] is £12,500. The higher and additional rate thresholds are, respectively, £37,501 and £150,001. The capital gains tax allowance is £12,300.",q:"What is the shopkeeper's capital gains tax liability?",opts:["£0","£80,000","£78,770","£150,00[0]","£220,724"],ans:"C",expl:"(C) £78,770. Ordinarily, to calculate capital gains tax, we would subtract the annual exempt amount from the chargeable gain to arrive at the taxable gain (£800,000 - £12,300 = £787,300 taxable gain). We then would apply a 10% rate to the amount of the taxable gain that is still within the taxpayer's basic rate band above the taxpayer's other income and apply a 20% rate to amounts in excess of the basic rate band. However, we would not do that here because Business Asset Disposal Relief (formerly called Entrepreneurs Relief) is available when all or part of a trading business carried on by a sole trader or a partnership for at least two years is disposed of. Here, the shopkeeper sold a business that he carried on for 10 years. Under the relief, a 10% rate applies to the taxable capital gain. Thus, the man would owe (£800,000 - £12,300) × 10%; that is, £787,700 x 10%, which equals £78,770.",note:"The facts are jumbled in the scan ('whenShe is £12,500 … The personal de'); the bracketed words are inferred. Option (D) reads '£150,00' on both screens. Source slip kept: the explanation first gives the taxable gain as '£787,300'; £800,000 - £12,300 is £787,700, the figure it then uses to reach £78,770."},{n:7,id:"ETH135",scenario:"A solicitor speaks with the firm's compliance officer for legal practice (COLP) and explains that he has received a caution for an alleged dishonesty offence. The COLP tells him not to worry about this because he was not charged with the offence. The solicitor feels that this is something which he ought to disclose to the SRA, but he is happy to rely on the COLP's decision. The incident is reported in a local newspaper and comes to the SRA's attention. The SRA demand to know why the solicitor did not self-report.",q:"Which of the following statements best describes the solicitor's position?",opts:["The COLP's decision about whether to report is final and the SRA cannot take disciplinary action against the solicitor.","The solicitor's duty was to report the matter to his employer, not to the SRA.","The solicitor satisfied his obligation to report to the SRA when he made the COLP aware of the caution.","The solicitor had an obligation to report the caution to the SRA because he knew that the COLP did not intend to make a report.","The SRA did not need to be informed of the caution because this is not a regulatory matter."],ans:"D",expl:"(D) A solicitor is under a personal duty to report, amongst other things, criminal convictions, charges, and cautions to the SRA. Any obligation to provide such information is satisfied if the information is provided to the firm's COLP, but only on the understanding that the COLP will bring this to the SRA's attention. Where there is a difference of opinion and the COLP decides not to report, the SRA would require the solicitor to report the matter themselves. (A) is incorrect because the solicitor's duty is discharged only if the COLP makes the report, or there is at least an understanding that the COLP will make the report. (B) is incorrect because the SRA has a regulatory right to be informed of all serious matters, and a solicitor is specifically required to report any caution. (C) is incorrect because the regulatory duty is satisfied only when the SRA is made aware of the caution. (E) is incorrect because this is a regulatory matter. The SRA Code of Conduct requires solicitors to report these matters."},{n:8,id:"TAX081",scenario:"A solicitor is representing a client against Her Majesty's Revenue and Customs, who are asking for large sums of overdue capital gains tax. In poring over his client's recent financial transactions, the solicitor notices that the client has been very active financially.",q:"Which of the following transactions would be subject to capital gains tax?",opts:["The client sold a collectable camera at a gain of £2,000.","The client sold a race horse for a gain of £1 million.","The client sold an antique car for a gain of £50,000.","The client sold farmland netting a gain of £400,000.","The client received a premium bond prize of £100,000."],ans:"D",expl:"(D) Gains from the disposal of farmland are subject to capital gains tax. All the other transactions are exempt from capital gains tax: (A) Tangible personal property sold for less than £6,000 is exempt. (B) Chattels with a predictable life of 50 years or less - such as race horses - are exempt. (C) Gains from sales of cars are exempt. (E) Prize money and gambling winnings are exempt.",note:`${zp} Source point kept: the £6,000 chattels exemption depends on the disposal proceeds, not the size of the gain; the camera's sale price is not given.`},{n:9,id:"TAX037",scenario:"A man died in March 2020. Prior to June 2019, the man had made no disposals. In June 2019, he gave £25,000 to a registered charity. He paid his son's school fees of £4,500 in September 2019 and has paid these regularly for many years. He gave £18,000 to his sister on the occasion of her marriage in January 2020.",q:"What amount (if any) is chargeable to inheritance tax in respect of these events on the man's death?",opts:["£11,000","£18,000","£9,500","£18,000","£15,500"],ans:"A",expl:"(A) £11,000. We must first determine what gifts are chargeable to tax. Gifts to charity are not, and the September 2019 gift will be treated as a normal expense out of income (maintenance of family) which is exempt. That leaves only the £18,000 wedding present, which was a potentially exempt transfer when made, but that failed. The £18,000 amount can be reduced by the £1,000 under the gift to marriage exemption for gifts to others. The facts indicate that the man made no other gifts, so the annual gift exemption of £3,000 for the year of the gift and the preceding year can also be applied. Thus, altogether we can reduce the £18,000 gift by £7,000, leaving only £11,000 chargeable to IHT.",note:"Source slip kept: options (B) and (D) are both '£18,000' on both screens."},{n:10,id:"TAX068",scenario:"On 1 January 2021, a landlord sold an office building, making a taxable gain of £195,000 after applying the annual allowance. She had taxable income of £26,500 in 2020/21 after deduction of her personal allowance. The applicable capital gains tax rate is 10% for amounts within the basic rate band (up to £37,500) and 20% for amounts exceeding £37,500. The landlord made no other disposals of chargeable assets during 2020/21.",q:"What is the landlord's capital gains tax liability for 2020/21?",opts:["£35,440","£35,250","£39,000","£37,900","£41,540"],ans:"D",expl:"(D) £37,900. To calculate capital gains tax, we apply the 10% rate to any amount remaining of the taxpayer's basic rate band. The basic rate band is up to £37,500 under our facts. To determine how much of that band is left, we subtract the landlord's non-capital gains income (£26,500) from that top of the basic rate band (that is, £37,500 - £26,500), which leaves £11,000. Therefore, the first £11,000 of the capital gain will be taxed at 10% (£11,000 x 10% = £1,100). That leaves £184,000 to be taxed at 20% (£184,000 × 20% = £36,800). Adding the two together, we arrive at £37,900.",note:"The scan shows the facts out of order (the sentence about taxable income comes first); they are given here in reading order."},{n:11,id:"CRL101",scenario:"A man is driving a car with his colleague beside him in the passenger seat. They are going to a work conference. The man says to his colleague that he finds her very attractive and hopes they will share a room that evening. The colleague makes it clear she is absolutely not interested in having an affair. The man then puts his hand on her leg and says he will have to find some other way to persuade her and that she might like it if he forced her. In fear, the colleague opens the door whilst the car is moving and jumps out of the vehicle. She sustains a broken leg.",q:"Is the man guilty of s20 grievous bodily harm ('GBH')?",opts:["Yes, because the man's actions caused the colleague's broken leg, he foresaw the risk of some harm, and it was an unreasonable risk to take.","No, because the woman's actions by jumping out of the car broke the chain of causation.","No, because the man did not intend to cause serious harm.","No, because it was not a virtual certainty that serious harm would occur.","No, because the man did not foresee that it was a virtual certainty that serious harm would occur."],ans:"A",expl:"(A) The man is guilty of s20 GBH. A person commits s20 GBH by causing a wound or grievous bodily harm with intent to do so or with recklessness regarding causing some harm. Recklessness means that the person foresaw the risk that some harm may be caused and that it was unreasonable in the circumstances known to the person to take that risk. Here, the man must have foreseen that some harm could result from his aggressive sexual advances, and it was unreasonable for him to take that risk. The victim's behaviour did not break the chain of causation. A victim's act will only break the chain of causation where it is 'so daft as to be unforeseeable'. It is not so daft as to be unforeseeable that the colleague would seek to flee from the man's aggressive sexual advances, even by jumping from a moving vehicle. For this reason (B) is incorrect. (C), (D), and (E) are all incorrect because they do not give the correct definition for s20 GBH mens rea, as they refer to serious harm rather than some harm."},{n:12,id:"CRL042",scenario:"A lawyer from the United States hired a solicitor from England to take the SQE for him. The plan is discovered. The American lawyer is arrested while in London and charged with fraud by false representation under the Fraud Act 2006.",q:"Which of the following elements will not have to be proved in the case against the American lawyer?",opts:["Dishonesty.","The making of a false representation.","Knowledge that the representation might be untrue or misleading.","Intending malice towards another.","With intent to make a gain for himself or another, to cause loss to another, or to expose another to risk of loss."],ans:"D",expl:"(D) Fraud does not require any malice on the part of the defendant. Under the Fraud Act 2006, it is a crime to make a false representation dishonestly knowing that representation was or might be untrue or misleading with intent to make a gain for oneself or another, to cause loss to another, or to expose another to risk of loss. Therefore, the other elements ((A), (B), (C), and (E)) are required."},{n:13,id:"TAX062",scenario:"An elderly couple gifted £1 million of assets to their children three years before the couple passed away at the same time in an automobile crash. This gift was made after the couple had used up their available annual exemptions. There were no assets in the estate after this gift. The nil rate band is £325,000. The taper relief for gifts given between three and four years before a donor's death is 20%. The inheritance tax rate is 40%.",q:"What is the inheritance tax due on the estate?",opts:["£260,000","£208,000","£140,000","£112,000","No tax is due."],ans:"D",expl:"(D) £112,000. The gift will be included as part of the estate, as the gift was made within seven years of the time of death. However, the tax-free (nil rate) band is doubled since the gift came from both spouses. Thus, the taxable estate is £350,000, which is £1 million minus (2 x £325,000). £350,000 x 40% (the applicable tax rate) = £140,000. However, because the gift was made between three and four years before the couple's death, the estate may apply the 20% taper relief (in other words, only 80% of the tax will be due). £140,000 x 80% = £112,000."},{n:14,id:null,scenario:"A tourist takes a ride in a taxi cab. Upon arrival at the tourist's destination, the driver asks for £10 to cover the fare. The tourist, not speaking any English, holds out their wallet to the driver. The driver thinks he is entitled to charge more, as he is offering an interpretation service as well as the ride. The driver takes £20, and the tourist thanks him before getting out.",q:"Is the driver guilty of theft?",opts:["No, because the tourist consented to the driver taking £20.","No, because the driver does not believe his action to be dishonest.","No, because the tourist thanked the driver.","Yes, because the driver was dishonest by the standards of the reasonable, honest person.","No, because the driver is entitled to charge whatever he likes."],ans:"D",expl:"(D) The driver is guilty of theft. Theft is the dishonest appropriation of property belonging to another with the intention to permanently deprive the other […] assessed by the objective standards of reasonable and honest people. Here, the driver took an extra £10 from the tourist's wallet. The driver was dish[onest by the] standards of reasonable, honest people. (A) and (C) are incorrect as the owner's reaction is irrelevant in deciding whether an appropriation has taken [place. …] incorrect as dishonesty is assessed by the standards of the reasonable, honest person, and here the driver falls short of that objective standard.",note:"A pop-up advertisement covers the right-hand side of this answer screen, so parts of the explanation (marked […]) and the question ID are missing. The answer letter (D) is visible."},{n:15,id:"TRU133",scenario:"A nurse and a photographer, an unmarried couple, purchased a flat together as joint legal owners. The photographer paid 15% of the purchase price, and the remaining 85% was raised by a mortgage on the property. The nurse did not contribute anything to the purchase price. The property transfer form declared that the parties were beneficial joint tenants of the property. After living together for eleven years, the couple has separated and decided to sell the flat.",q:"How will the sale proceeds of the flat be distributed to the parties?",opts:["The court will look at the entire course of conduct between the parties to determine how the proceeds should be distributed.","The photographer will receive all of the sale proceeds unless the nurse can prove that the parties intended otherwise.","The photographer will receive all of the sale proceeds, and the nurse will receive nothing.","The photographer and nurse will each receive one-half of the sale proceeds unless the photographer can prove that the parties intended otherwise.","The photographer and nurse will each receive one-half of the sale proceeds."],ans:"E",expl:"(E) The photographer and nurse will each receive one-half of the sale proceeds. If the property transfer form states that the legal owners are to hold the property as beneficial joint tenants, the beneficial interest is held in equal undivided shares and will be divided equally on sale of the property. This is true regardless of the parties' unequal contributions to the purchase price. (C) is therefore incorrect. (A) is incorrect because the court looks at the course of conduct between the parties when there is no express declaration of trust and one party is trying to prove a common intention. Here, there is an express declaration, so the court does not need to look at the parties' conduct. (B) and (D) are incorrect because the declaration stating how the beneficial interest is held is conclusive."},{n:16,id:"TAX018",scenario:"A wife uses £6,500 of her £12,500 annual personal allowance. Her husband's taxable income is £130,000 for the year. The couple have a son who lives with them and who made £18,500 in the same tax year.",q:"What, if anything, may the wife do with the £6,000 of personal allowance that she did not use?",opts:["The wife may not do anything with the unused £6,000 personal allowance.","The wife may transfer the unused £6,000 personal allowance to her husband.","The wife may transfer the unused £6,000 personal allowance to her son.","The wife may transfer £1,250 of the unused personal allowance to her husband.","The wife may transfer £1,250 of the unused personal allowance to her son."],ans:"A",expl:"(A) The wife may not do anything with the unused £6,000 personal allowance. Effectively, the marriage allowance enables a basic rate taxpayer to transfer £1,250 of unused personal allowance to a spouse if the spouse also is a basic rate taxpayer. Here, with an income of £130,000, the spouse is a higher rate taxpayer and so the spouses may not use the allowance. (B) would be incorrect even if the spouses were both basic rate taxpayers because only £1,250 can be used for the allowance (which reduces the recipient's tax liability by 20% of £1,250, which is £250). (C) and (E) are incorrect because the allowance may be transferred only to a spouse or a civil partner. (D) is incorrect because the recipient spouse is a higher rate taxpayer.",note:"Possible source slip kept: the marriage allowance is transferred by a spouse whose income is below the personal allowance (a non-taxpayer, as the wife is here) to a basic rate spouse; the explanation describes the transferor as 'a basic rate taxpayer'."},{n:17,id:"TAX112",scenario:"A sole trader makes up accounts to 30 June each year. He ceased trading on 28 February 2021. His final tax adjusted profits for the year ended 30 June 2020 is £18,000 and for the 8-month period ended 28 February 2021 is £10,000. He has overlap profits from commencement of £3,000.",q:"What are the sole trader's trade profits for 2020/21?",opts:["£25,000","£7,000","£15,000","£28,000","£31,000"],ans:"A",expl:"(A) £25,000. The sole trader ceased to trade on 28 February 2021 and so his closing tax year is 2020/21. In the closing tax year, any accounting profits that end in that year are assessable less any overlap profits brought forward from commencement of trade. Therefore, the sole trader will be assessed on trade profits of £18,000 + £10,000 - £3,000, which equals £25,000.",note:`${fr} ${zp}`},{n:18,id:"TRU118",scenario:"A trustee appointed under a trust of successive interests wishes to purchase the beneficiary's life interest.",q:"Is the trustee permitted to purchase the life interest?",opts:["No, because the purchase of the life interest would be self-dealing.","No, unless the trustee receives permission from the court.","Yes, if the trustee acts as an honest and reasonable person would in the transaction.","Yes, if the other trust beneficiaries consent to the purchase.","Yes, if the trustee pays a fair price, makes full disclosure of all material facts, and in no way abuses their position."],ans:"E",expl:"(E) The trustee is permitted to purchase the life interest if they pay a fair price, make full disclosure of all material facts to the beneficiary, and in no way abuse their position. This is known as the fair dealing rule, which applies to trustee purchases of beneficial interests. (A) is incorrect because self-dealing occurs when a trustee buys trust property. In this situation, the trustee is buying a beneficiary's interest in the trust. (B) and (D) are incorrect because the trustee does not need the consent or permission of the court or other beneficiaries. (C) is incorrect because it describes the incorrect standard for purchases of beneficial interests."},{n:19,id:"TRU101",scenario:"The two trustees of a discretionary trust frequently cannot agree on how to administer the trust or distribute the trust funds. Each trustee has asked the other to resign, but they both refused. An adult beneficiary, frustrated by the trustees, applies to the court and asks the court to replace the trustees.",q:"Does the court have the power to replace the trustees in this situation?",opts:["Yes, if the court finds it is expedient to replace the trustees and it would be inexpedient, difficult, or impracticable to do so without the court's assistance.","Yes, if all the adult beneficiaries consent to the replacement.","Yes, if there is no person nominated in the trust instrument to replace trustees.","No, because only the existing trustees have the power to appoint or replace trustees.","No, unless one or both of the trustees has committed a breach of trust."],ans:"A",expl:"(A) The court has the power to appoint or replace trustees whenever it is expedient to do so, and it is found inexpedient, difficult, or impracticable to do so without the court's assistance. (D) is therefore incorrect. (B) is incorrect because the beneficiaries do not have to consent to the court's actions. (C) is incorrect because the court has the power to replace trustees regardless of whether there is a person nominated in the trust instrument. (E) is incorrect because the court can replace a trustee even if the trustee has not committed a breach of trust."},{n:20,id:"TAX073",scenario:"On 1 August 2020, a man sold a residential investment property realising a chargeable gain of £42,900. His taxable income was £18,030 for the tax year 2020/21. The annual exempt amount for the 2020/21 tax year is £12,300 and the tax rates for sales on residential property are 18% for any basic rate band available and 28% for any gains in excess of any available basic rate band. The basic rate band extends to £37,500.",q:"What is the man's capital gains tax liability for the tax year 2020/21 (to the nearest pound)?",opts:["£0","£4,173","£10,468","£6,621","£6,633"],ans:"D",expl:"(D) £6,621. To calculate the man's capital gains tax liability on the sale of residential property used wholly for investment, we subtract the annual exempt amount from the chargeable gain to arrive at the taxable gain (£42,900 - £12,300 = £30,600 taxable gain). We then would apply a 18% rate to the amount of the taxable gain that is still within the taxpayer's basic rate band above the taxpayer's other income and apply a 28% rate to amounts in excess of the basic rate band. The basic rate band is for income up to £37,500. The man's other income for the year was £18,030, which means he has £19,470 left of his basic rate band (£37,500 - £18,030). Since his capital gain is more than that amount, the first £19,470 of the gain will be taxed at 18% and the amount of gain above that, £11,130 (£30,600 - £19,470), will be taxed at 28%. £19,470 x 18% = £3,505, and £11,130 x 28% = £3,116. £3,505 + £3,116 = £6,621."},{n:21,id:"TAX029",scenario:`During his lifetime, a man made the following gifts into a discretionary trust:
• £160,000 on 10 July 2006
• £230,000 on 20 May 2014
• £295,000 on 24 December 2020
The above amounts are the chargeable amounts after exemptions. The trustees agreed to pay the tax in all cases, except for the gift on 24 December 2020. The nil rate bands were as follows:
2006/07 £300,000
2014/15 £325,000
2020/21 £325,000`,q:"Calculate the lifetime inheritance tax payable as a result of the gift on 24 December 2020.",opts:["£73,750","£0","£50,000","£40,000","£59,000"],ans:"C",expl:"(C) When determining the lifetime inheritance tax payable on a chargeable lifetime transfer (such as gifts to most trusts), we need to take into account other CLTs made by the donor in the previous seven years, because IHT is a cumulative tax. Here, we would not take into account the 2006 gift because it was made more than seven years before the 24 December 2020 gift. But we would add the gross amount of the 20 May 2014 gift (including any tax paid by the donor but not by the trustees). £230,000 (2014 gift) + £295,000 (2020 gift) = £525,000. From this, we subtract the nil rate band applicable to the current gift (£325,000), leaving £200,000 subject to tax. As the trustees are not paying this tax, it must be paid by the donor. Because of that, we use the grossed-up rate of 25%. 25% of £200,000 = £50,000.",note:"The question screen appears twice in the PDF; the first copy shows only options A and B in a different order. The option order here follows the second copy and the answer screen."},{n:22,id:"TAX034",scenario:`[The first part of the facts is missing from the scan. The explanation indicates that the woman held 6,000 shares (a 60% holding) in an unquoted company.] The woman's husband also owns a 15% holding in the company. On 31 December 2019, the woman gave 2,000 shares (representing a 20% holding in the company) to her daughter. The values of shareholdings in the company on 31 December 2019 have been agreed for IHT purposes as follows:
• Up to 25%: £9/share
• 26% to 50%: £15/share
• 51% to 74%: £26/share
• 75% or more: £45/share`,q:"What is the value of the gift transferred to the woman's daughter for inheritance tax purposes?",opts:["£166,000","£90,000","£18,000","£52,000","£194,500"],ans:"A",expl:"(A) To value a gift of unquoted shares, we use the loss to the donor principle. In other words, we look at the amount by which the donor's holding was diminished rather than the value of the gift in the hands of the recipient. Also, when a spouse or civil partner holds similar property, under the related property principle, we must assess the value lost based on the holdings of both spouses/partners. Thus, here, the woman's pre-gift shares will be valued at £45 per share (because the woman's 60% holding, plus her husband's 15% holding puts the shares in that value band). After giving away 2,000 shares (a 20% interest), the woman and her husband now have a combined 55% interest. Shares within the 51% to 74% band are worth only £26 per share. Thus, before the transfer, the woman's holding was worth £270,000 (6,000 x £45), and after the gift of the 2,000 shares the woman's holding was worth £104,000 (4,000 x £26). The difference is the value of the gift: £270,000 - £104,000 = £166,000.",note:`The question screen starts part-way through the facts; the bracketed summary is inferred from the explanation, not from the question. ${fr}`},{n:23,id:"TRU085",scenario:"A father and his adult son buy a house, contributing equally to the purchase price. The father is worried that he will become liable for a large legal claim, so the house is conveyed into the name of the son alone. The legal claim materialises, and the father deceives his creditors as to the size of his assets. The father and his son are now estranged, and the father wishes to claim a share in the house. There is no written evidence to support his claim.",q:"Which of the following statements best describes the likely result of the father's claim?",opts:["Whether it will succeed depends on whether the court finds it to be in the public interest.","It will succeed because the presumption of resulting trust applies.","It will fail because a trust of land requires signed written evidence to enforce it.","It will succeed because the father does not need to plead his improper purpose.","It will fail because only the registered owner is entitled to land."],ans:"A",expl:"(A) If a property transfer was made as part of an illegal or fraudulent transaction, the court must decide whether it is in the public interest to allow a claim. The court would take into account all relevant factors, including the underlying purpose of the relevant law and the respective conduct of the parties. In these circumstances, the court would likely consider whether creditors have in fact been deceived, whether the son was aware of the scheme, and the effect on either party of allowing the man's claim. None of the other choices is as good an answer as (A) because they each include a definitive result. In addition: (B) is incorrect because the presumption of resulting trust does not apply where the contributor was the father of the legal owner. (C) is incorrect because the requirement that a declaration of trust of land must be evidenced in a signed writing applies only to express trusts, not to implied trusts. (D) is incorrect because the court would at least consider the father's improper intention. (E) is incorrect because, although the registered owner is entitled at common law, a claimant can establish an equitable interest under a trust."},{n:24,id:"TRU113",scenario:"A man wished to gift a set of golf clubs to his friend. The man explained to his friend that he would give him the golf clubs when they met the following week. Unfortunately, before that meeting, the man died. The man's will, which was validly executed, appointed the friend as executor of the estate and left the man's entire estate to a registered charity.",q:"Which of the following statements is correct in relation to the golf clubs?",opts:["The gift of the golf clubs failed as a lifetime gift, and they pass under the terms of the will to the registered charity.","The gift of the golf clubs failed as a lifetime gift, but the appointment of the friend as executor of the estate makes the gift valid.","The gift of the golf clubs was a successful lifetime gift.","The gift of the golf clubs failed as a lifetime gift, but the friend can make a proprietary claim against the charity for the clubs.","The gift of the golf clubs failed as a lifetime gift, and the appointment of the friend as executor means that the gift cannot take effect as it would be a breach of fiduciary duty."],ans:"B",expl:"(B) The gift of the golf clubs failed as a lifetime gift, but the appointment of the friend as executor of the estate makes the gift valid. The gift failed because the man did not deliver the golf clubs to his friend. However, under the rule of fortuitous vesting (also known as the rule in Strong v Bird), if an intending donor dies before a transfer is made and the donee becomes the donor's personal representative, the transfer is complete in law and the gift is enforceable. The donor must have a continuous unbroken intention to give the gift between the donor's initial intention to give and the donee's appointment as personal representative. This seems to be the case here, as there is nothing to indicate that the man had changed his mind about the golf clubs in the few days before his death. Therefore, the friend receives the gift of the golf clubs. (A) and (C) are therefore incorrect. (D) is incorrect because the friend cannot make a proprietary claim against the charity for the clubs. Proprietary claims are used to reclaim property from trustees who have committed a breach of trust. (E) is incorrect because it would not be a breach of fiduciary duty for the friend, as executor, to accept the gift.",note:"Possible source slip kept: Strong v Bird requires a present intention to give that continues until death; a promise t
