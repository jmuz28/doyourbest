o give the clubs 'the following week' is arguably an intention to make a future gift."},{n:25,id:"ETH047",scenario:"A trainee solicitor is asked to go to the police station to interview a youth who is accused of wounding a young woman with a knife. The trainee finds that there are two accused youths, who are brothers, and who are in different cells. The trainee takes a statement from the first youth about the circumstances. The youth disputes that it was him who wounded the woman, and blames his brother. The trainee then interviews the second youth, who likewise blames his brother, the first youth.",q:"Which of the following best describes how the trainee should proceed in the circumstances?",opts:["As the trainee solicitor has full details of the circumstances, it is in the youths' best interests for the solicitor to act for both of them.","As they are brothers, there cannot be a conflict of interest between the two youths and the trainee can act for both of them.","As there is a conflict of interest between the youths, the trainee cannot act for both of them, but can act for the brother first interviewed.","As there is a conflict of interest between the youths, and the trainee interviewed both, he should not act for either of them.","As there is a conflict of interest between the youths, the trainee cannot act for them, but another member of the firm can."],ans:"D",expl:"(D) There is a conflict of interest between the youths. Each brother's defence would be to accuse the other, and so they cannot both be clients. Because the trainee has interviewed both, the safest course is not to act for either of them, and (C) is incorrect. The conflict of interest means that (A) is incorrect. (E) is incorrect because the conflict of interest problem does not apply solely to the trainee, but to the firm as a whole. (B) is incorrect. Conflicts of interest can apply between family members at least as frequently as between others."},{n:26,id:"ETH150",scenario:"A solicitor is acting for a client accused of committing actual bodily harm. The client tells the solicitor that he did not commit the crime, but that he was at home alone at the time of the incident and does not have a verifiable alibi. The solicitor comments that witness evidence to confirm his whereabouts would have been helpful. Shortly after the meeting, a witness contacts the solicitor saying that she can confirm that the client was with her at her home at the time of the incident and therefore could not have committed the crime.",q:"Which of the following statements best describes what the solicitor should do?",opts:["The solicitor should check the truth of the witness's assertions which will be relied upon before the court. If the solicitor believes the witness's assertions are false, the solicitor should refuse to call the witness.","The solicitor should use the witness evidence because the solicitor is under no duty to check the truth of the witness's statement.","The solicitor should cease to act for the client immediately because the witness statement contradicts the client's version of events.","The solicitor should use the witness evidence because this will be in his client's best interests.","The solicitor should seek court directions about his client's instructions and the witness evidence."],ans:"A",expl:"(A) A solicitor is under a duty to uphold the rule of law and proper administration of justice. The Code of Conduct prohibits a solicitor from misleading the court, and this standard can be violated by affirmative acts, omissions, or being complicit in the acts or omissions of others. In general, there is no duty to enquire in every case as to whether the client is telling the truth. However, where instructions or other information are such as should put the solicitor upon notice of inconsistencies, they should check the truth (here, the witness's alibi) before this is relied upon before the court. If the solicitor in this case believes that the alibi is false, he should ask the client to change instructions and not use this evidence. If the client refuses, the solicitor must cease acting. (B) and (D) are incorrect; although a solicitor is under a duty to act in the client's best interests, they must not mislead the court by being complicit in the actions of their clients and others. (C) is incorrect as the solicitor will be expected to discuss the inconsistency with his client before taking any decision to terminate his retainer. (E) is incorrect as this is not the court's role."},{n:27,id:"CRL146",scenario:"A mechanic is fired from his job at a car repair company. To wreak revenge on the company, the mechanic decides to damage some of the machinery they have for effecting repairs. The mechanic disconnects some wires on a machine, intending to break it completely. In fact, it simply causes the machine to malfunction. The next day, another employee uses the machine to repair a customer's car, not realising it is not working properly. Subsequently, the customer drives their car, and the faulty repair causes the car to crash. The customer dies.",q:"What will need to be proved for the mechanic to be liable for unlawful act manslaughter?",opts:["That the act was intentional, unlawful, dangerous, and caused the death.","That the act was reckless, unlawful, dangerous, and caused the death.","That the act was intentional, unlawful, carried a risk of death, and caused the death.","That the act was reckless, unlawful, carried a risk of death, and caused the death.","That the act was grossly negligent, unlawful, carried a risk of death, and caused the death."],ans:"A",expl:"(A) Unlawful act manslaughter ('UAM') requires a deliberate act which constitutes a criminal offence. The act must be intentional, unlawful, dangerous, and the cause of death. Here, the mechanic committed criminal damage, and this was a deliberate act. The mechanic's interfering with a machine that is designed to repair cars seems to satisfy the requirement of dangerous, so as long as the other employee does not break the chain of causation, it seems a charge of UAM is made out here. (B) and (D) are incorrect, as the act must be intentional rather than reckless. (C) is incorrect, as the act must be dangerous, but it need not carry a risk of death. (E) is incorrect, as the act must be intentional rather than grossly negligent."},{n:28,id:"CRL053",scenario:"A man decides to drive over the speed limit down a busy street. Whilst doing so, the man runs over an old woman, killing her instantly.",q:"For the man to be found guilty of murder on the basis of indirect intent, what must the jury find?",opts:["That the man foresaw that death or grievous bodily harm was likely to occur.","That serious harm or death was likely to occur by his actions.","That grievous bodily harm or death was a virtually certain consequence of the man's actions.","That grievous bodily harm or death was a virtually certain consequence of the man's actions and the man foresaw that it was.","That the man intended to cause death or serious injury through his actions."],ans:"D",expl:"(D) The jury would have to find that grievous bodily harm or death was a virtually certain consequence of the man's actions and that the man foresaw that it was. Under the concept of indirect intent, a defendant is held to intend a consequence (indirectly) when that consequence is a virtually certain consequence of his actions, and he foresaw that it was a virtually certain consequence. Both elements need to be present, so (C) is incorrect. It must be a virtually certain consequence of the defendant's actions, so (A), (B), and (E) are also wrong. (E) gives the definition of direct intention, which is not present on the facts.",note:fr},{n:29,id:"TAX003",scenario:`In addition to her wages, a solicitor has received income from the following sources during the tax year:
• £50 dividends from shares held in EFG plc
• £250 prize from an investment in Premium Bonds
• £100 tips from customers
• £200 dividends from shares held in an Individual Savings Account (ISA)`,q:"Which of the solicitor's additional sources of income are exempt from income tax?",opts:["The dividends from the ISA and the income from the Premium Bonds only.","The dividends from the ISA and the dividends from EFG plc only.","The tips and the income from the Premium Bonds only.","The tips and the dividends from the ISA only.","The tips and the dividends from EFG plc only."],ans:"A",expl:"(A) The dividends from the ISA and the income from the Premium Bonds only. Income derived from an ISA or prizes from Premium Bonds are exempt from tax. The other two sources of income (dividends from a company and tips) are taxable income. The dividends will be taxed at the lower rates applicable to dividends and, if these are the only dividends the solicitor receives, will be covered by the dividend nil rate band.",note:"The words 'two' and 'only' are displaced to the end of this explanation by the OCR; they have been put back in reading order."},{n:30,id:"ETH078",scenario:"A solicitor is acting for a client in a trust-related matter. In the original client care letter, the solicitor gave an estimate of the likely cost to be £10,000, including disbursements. However, the solicitor later decides that the services of an actuary will be necessary. The cost of the actuary's services would be another £4,000 plus VAT.",q:"Which of the following best explains the solicitor's obligations under these circumstances?",opts:["The solicitor can hire the actuary without informing the client because the client care letter explained that the amount was only an estimate.","The solicitor should decline the actuary's services.","The solicitor can hire the actuary without informing the client because he is only required to tell the client about solicitors' costs, and not third parties' costs.","The solicitor can hire the actuary without informing the client, but should provide a full explanation of why the actuary's services were necessary in the final bill to the client.","The solicitor should inform the client about the cost of the actuary and ask for their instructions because the original estimate is no longer accurate."],ans:"E",expl:"(E) The solicitor must give the best possible information as to costs, not only at the commencement of the retainer, but also, if appropriate, as the matter progresses. As there has been a change here, the solicitor should update the client. (A) and (D) are incorrect because of the requirement to give the best possible information as the matter progresses. (B) is incorrect because this would not be in the best interests of the client; the solicitor should instead explain the situation and ask for the client's instructions. (C) is incorrect because the duty extends to all costs and disbursements, and not just the solicitors' costs."},{n:31,id:"TAX111",scenario:"A woman prepared accounts for the 8-month period to 31 December 2020. The tax written down value of the main pool on 1 May 2020 was £18,000. On 15 October 2021, she installed a new electric vehicle charging point in front of her business at a cost of £12,260. A 100% first-year allowance was available for installation of such charging points.",q:"What are the maximum capital allowances the woman may claim for the period ended 31 December 2020?",opts:["£12,260","£30,260","£13,340","£15,500","£14,420"],ans:"E",expl:"(E) The 18% per annum writing down allowance should be applied to the balance on the main pool but pro-rated as the woman only has an 8-month accounting period. £18,000 x 18% x 8/12 = £2,160. The 100% first year allowance is available for installation of the charging point. Therefore, the maximum amount of capital allowances the woman can claim is £2,160 + £12,260 = £14,420.",note:`${fr} The OCR moves 'Therefore, the' to the start of this explanation; it has been put back. Source slip kept: the charging point is dated 15 October 2021, after the period ended 31 December 2020; the answer only works if it was installed in that period (presumably 15 October 2020).`},{n:32,id:"TRU010",scenario:'In his will a testator leaves £10,000 to trustees on trust "to share between my closest friends at their discretion".',q:"Which of the following best describes the position of the trustees?",opts:["They have discretion to decide who the testator's closest friends are.","They should ask those purporting to be the testator's closest friends to prove that they fall within the class.","They hold on resulting trust, and the fund passes with the residue of the testator's estate.","They must survey the field to decide who qualifies and then choose between them.","The trust fails, and they may keep the legacy."],ans:"C",expl:"(C) The trustees hold on resulting trust, and the fund passes with the residue of the testator's estate. The gift is a discretionary trust. The test of certainty of objects is the given postulant test; that is, can it be said with certainty whether any given individual is or is not a member of the class? This means that the wording used must be conceptually certain. The term 'closest friends' is not capable of objective definition, and the trust fails for lack of certainty of objects. The trustees hold on resulting trust for the residue of the estate. (A) is incorrect because the trust does not give the trustees discretion to decide who the members of the class are, but to choose between them. (B) is incorrect because the trust fails - the trustees could only ask potential beneficiaries to prove their eligibility if the class was conceptually certain. (D) is incorrect because it describes the duty of trustees of a discretionary trust where the class is conceptually certain and the trust is valid. (E) is incorrect because the trustees are clearly appointed as such and so may not take beneficially.",note:fr},{n:33,id:"CRL115",scenario:"Whilst in a cafe, a 15-year-old girl agreed with a man to provide him with sexual services in exchange for money. An off-duty police officer overheard the conversation and arrested both of them. The man was charged with conspiracy to have sex with a child under the age of 16.",q:"Which of the following would be the man's best defence at trial?",opts:["The girl was consenting.","The man did not ever have sexual intercourse with the girl.","The girl was not charged and therefore there could be no conspiracy.","The girl was a minor and therefore could not be part of a conspiracy.","The girl was the intended victim of the principal offence and therefore there was no conspiracy."],ans:"E",expl:"(E) The man's best defence is that the girl was the intended victim. One cannot be guilty of conspiracy with someone who is the intended victim of the offence. (A) is incorrect as the fact that the girl consented is irrelevant because she is under age. (B) is not a defence because conspiracy is complete upon the agreement to do something illegal; the underlying crime need not actually be committed. (C) is incorrect because although there must be at least two parties to a conspiracy, both of them do not need to be charged. (D) is incorrect because a 15-year-old is legally capable of committing a crime even if she is below the age of consent."},{n:34,id:"CRL124",scenario:"A man is sitting on a park bench, contemplating the silence. A jogger comes past and disturbs the stillness. Irritated, the man picks up a rock and throws it at the jogger, intending to hit the jogger with it. The rock misses the jogger and accidentally hits a church window. The man foresaw the risk that he might hit the window.",q:"Which offences, if any, could the man be charged with?",opts:["Criminal damage only.","Attempted battery only.","Criminal damage and attempted battery only.","Criminal damage and battery only.","Battery only."],ans:"C",expl:"(C) The man could be charged with criminal damage and attempted battery. The offence of criminal damage requires intentional or reckless damage or destruction of property belonging to another. Here, the man has damaged property belonging to a church. He foresaw the risk and, in the circumstances known to the man, it was an unreasonable risk to take, so he was reckless. Battery is the intentional or reckless application of unlawful force upon another person. The man is not guilty of battery as there was no application of force onto the jogger. Nevertheless, he took a step that was more than merely preparatory and he intended to commit the full offence, so he is guilty of attempted battery. For these reasons, (A), (B), (D), and (E) are incorrect.",note:"Possible source slip kept: battery is a summary-only offence, and the Criminal Attempts Act 1981 (s 1(4)) does not apply to summary-only offences, so 'attempted battery' is arguably not chargeable. The source's answer (C) is kept unchanged."},{n:35,id:"CRL141",scenario:"An opera singer lost his place with the national opera company. Disgruntled, the opera singer decides to take revenge on the company by destroying the huge glass dome that sits above the theatre. The opera singer decides to wait until midway through an evening show, so that the glass from the dome will rain down upon the audience below. The opera singer foresees that the lives of audience members will thereby be endangered but decides to go ahead anyway. By chance, on the night that the opera singer destroys the dome, the evening show has been cancelled and so no one is in the theatre as the shards of glass fall down.",q:"Is the opera singer guilty of aggravated criminal damage?",opts:["No, as the opera singer did not intend to endanger lives.","No, as no life was endangered.","Yes, as the opera singer foresaw that lives could be endangered by the criminal damage, and it was an unreasonable risk to take in the circumstances known to the opera singer.","Yes, as it was a virtual certainty that lives would be endangered by the criminal damage, and the opera singer foresaw that risk.","Yes, as it was a virtual certainty that lives would be endangered by the criminal damage, and it was an unreasonable risk to take in the circumstances known to the opera singer."],ans:"C",expl:"(C) The opera singer is guilty of aggravated criminal damage. The mens rea for aggravated criminal damage is that the defendant intends or is reckless as to the criminal damage and that the defendant intends or is reckless as to the endangerment of life by the damage caused to the property. (C) correctly sets out the test for recklessness in relation to the second limb of the mens rea. (A) is incorrect, as intention is not required; recklessness will also suffice. (B) is incorrect as lives need not actually be endangered; it is not an element of the actus reus. It is enough that the defendant was reckless as to the endangerment of life. (D) is incorrect as it describes the test for indirect intention. Indirect intention is not relevant to basic intent offences such as aggravated criminal damage because indirect intention only applies to specific intent offences. (E) is incorrect as it combines the test for indirect intention with the test for recklessness."},{n:36,id:"TRU071",scenario:"In his will, a man appointed two trustees to hold his estate on trust for his widow for life with remainder to his children. On the death of their mother, the children find that two years ago the trustees sold one of the trust's shareholdings for £8,000 and, acting in breach of trust, advanced the proceeds to their mother. The same shares are now worth £10,000. One of the trustees was recently made bankrupt.",q:"How much is the second trustee liable to pay?",opts:["£8,000 plus interest from the date of the breach.","£5,000 plus interest from the date of the breach.","£10,000 plus interest from the date of the breach.","£10,000.","£4,000 plus interest from the date of the breach."],ans:"A",expl:"(A) The second trustee is liable to pay £8,000 plus interest from the date of the breach. Where two trustees are in breach of trust they are jointly and severally liable to make good the loss to the fund, with interest from the date of the breach. (B) and (E) are incorrect because either trustee may be sued for the whole loss caused by the breach. As between trustees, the court will apportion liability, but this does not affect the position of the beneficiaries. (C) and (D) are incorrect because the liability is to make good the loss caused at the time of the breach, not to anticipate possible profits had the breach not occurred."}],pr="Wording checked against the page image, where the OCR was garbled.",Wp="The question screen for this item appears twice in the PDF (the second copy scrolled down); it is included once.",c1=[{n:1,id:"TRU136",scenario:"A wealthy woman paid £75,000 towards her friend's purchase of a house costing £300,000. The house was conveyed into the friend's name alone, and there was no declaration or evidence as to the woman's intentions. The woman and her friend had a falling out, and the friend cut off contact with the woman and moved away. She sold the house for £320,000. The woman wishes to claim as much as possible from the sale proceeds.",q:"Which of the following best describes the woman's claim?",opts:["She may claim £80,000 if she can prove that no gift was intended.","She may claim £75,000 under a presumed resulting trust.","She may claim £80,000 under a presumed resulting trust.","She may claim £75,000 if she can prove that no gift was intended.","She has no claim because it is presumed the £75,000 was a gift."],ans:"C",expl:"(C) The woman may claim £80,000 under a presumed resulting trust. Where an individual contributes to the purchase of property in the name of another and there is no evidence that a gift was intended, the usual presumption is that the legal owner holds on resulting trust for herself and the other party in proportion to their respective contributions. This presumption does not apply where the contributor was the father or husband of the legal owner or was acting in loco parentis to the legal owner. In those cases the presumption of advancement applies, and it is not presumed that the contributor intended to make a gift unless he can prove that he did not. (B) is incorrect because the contributor has a proportionate claim to the sale proceeds, so the woman may claim one-quarter of £320,000. (A), (D), and (E) are incorrect because the presumption of advancement does not apply here. Thus the woman does not have to prove that no gift was intended.",note:`${pr} Source slip kept: under the presumption of advancement it is presumed that the contributor did intend a gift unless he proves otherwise; the explanation says 'it is not presumed'.`},{n:2,id:"CRP136",scenario:"A suspect took part in an identification parade. The suspect was unrepresented during the procedure. The suspect has a scar above his lip that was not covered, and only one of the other videos in the identification parade featured someone with a similar scar. The solicitor now representing the defendant is applying to have the identification evidence excluded.",q:"What is the test the court should apply when deciding whether to exclude the identification evidence?",opts:["Whether it is more probative than prejudicial.","Whether it is in the interest of justice.","Whether it is admissible under one of the statutory gateways to the admission of evidence.","Whether its admission would undermine the rule of law.","Whether its admission would have such an adverse effect on the fairness of trial that it ought to be excluded."],ans:"E",expl:"(E) A court has discretion to exclude evidence offered by the prosecution if it appears to the court, considering all the circumstances, that admission of the evidence would have an adverse effect on the fairness of the proceeding. (A), (B), (C), and (D) are therefore all incorrect, as they do not correctly cite the test to be applied when deciding whether to exercise this discretion."},{n:3,id:"TAX039",scenario:"A man died in January 2020, leaving an estate of £750,000. He had made no transfers during his lifetime. The man's wife had died in June 2008 leaving an estate of £427,000. She left £99,840 to her sister and the rest to her husband. She also had made no lifetime transfers. The nil rate band in 08/09 was £312,000, and it was £325,000 at the time of the man's death.",q:"What is the inheritance tax payable as a result of the man's death?",opts:["£170,000","£85,136","£81,600","£21,600","£0"],ans:"C",expl:"(C) £81,600. When the man's wife died, there was a nil rate band of £312,000 of which only £99,840 was utilised, as gifts to a spouse are exempt from inheritance tax. This leaves £212,160/£312,000 = 68% unused. Thus, when the man died in 2019/20, he would be entitled to 168% of the £325,000 NRB applicable at his death. 168% x £325,000 = £546,000. We subtract this NRB amount from the £750,000 value of the man's estate, leaving £204,000 chargeable to tax. The death tax rate is 40%. 40% x £204,000 = £81,600.",note:`${pr} The OCR of the question screen drops the question line; it is taken from the page image.`},{n:4,id:"CRL038",scenario:"Whilst walking through a park, a man was confronted by a homeless person who began shouting at the man and following him. The man continued walking, but the homeless person followed and continued shouting at the man. As the man turned down a new pathway, the homeless person blocked the man's way. The man then shoved the homeless person. In retaliation, the homeless person punched the man in the face. A police officer saw the homeless person punch the man and arrested him. The homeless person was charged with simple assault and raised self-defence.",q:"Which of the following best describes the burden and standard of proof on this defence?",opts:["It is for the defence to raise self-defence, the legal burden lies with the prosecution, and the standard of proof is the balance of probabilities.","It is for the prosecution to raise self-defence, the legal burden lies with the prosecution, and the standard of proof is beyond a reasonable doubt.","It is for the defence to raise self-defence, the legal burden lies with the prosecution, and the standard of proof is beyond a reasonable doubt.","It is for the prosecution to raise self-defence, the legal burden lies with the prosecution, and the standard of proof is the balance of probabilities.","It is for the defence to raise self-defence, the legal burden lies with the defence, and the standard of proof is the balance of probabilities."],ans:"C",expl:"(C) The legal burden falls on the party who must prove the elements. The standard of proof is the level to which that party must discharge the burden. It is for the defence to raise self-defence. However, once the defendant has raised the defence, it is for the prosecution to disprove the defence, so the prosecution has the legal burden. Whenever the prosecution must prove (or disprove) an element of a case, the standard is always beyond a reasonable doubt."},{n:5,id:"CRP132",scenario:"A defendant was convicted of grievous bodily harm ('GBH') in the Crown Court and received a three year custodial sentence. The sentence falls within the sentencing guidelines and is commensurate with the seriousness of the offence. However, the defendant believes his sentence is too severe and wants to appeal it to the Court of Appeal.",q:"On what basis can the defendant appeal his sentence?",opts:["The sentence is fundamentally unfair.","The sentence is against the interests of justice.","The sentence is significantly and substantially wrong in principle.","The sentence is wrong in law, wrong in principle, or manifestly excessive.","The sentence is manifestly unjust."],ans:"D",expl:"(D) A defendant can appeal from the Crown Court against sentence to the Court of Appeal. The appeal can be made on the basis that the sentence is wrong in law, wrong in principle, or manifestly excessive. Accordingly, (A), (B), (C), and (E) are incorrect because they do not state the correct bases for appeal."},{n:6,id:"CRP061",scenario:"A defendant is awaiting trial in the Crown Court for criminal damage. The prosecution case is that the defendant, with unnamed others, tore down a statue in a town square of a controversial figure. The defendant has not yet provided any details of her defence to the prosecution or the court, and she did not answer questions in interview. She would prefer not to provide details of her defence, as she is worried it may lead to further investigation of her associates.",q:"Does the defendant have to provide any details of her defence in advance of trial?",opts:["No, the defendant does not have to provide any details of her defence in advance of trial.","No, the defendant cannot provide any details of her defence because there is no provision for the defence to make disclosure in advance of trial.","Yes, the defendant must serve a defence case statement on both the prosecution and the court.","Yes, the defendant must serve a defence case statement on the prosecution only.","Yes, the defendant must serve a defence case statement on the court only."],ans:"C",expl:"(C) The defendant must serve a defence case statement on both the prosecution and the court within 28 days of the prosecution making disclosure. This statement must set out the nature of the defence, including what facts of the prosecution case are disputed, what alternative facts the defence alleges, what points of law the defence wishes to raise, and details of any alibi witness. If the defence fail to serve an adequate defence case statement on time that reflects the defence put forward at trial, an adverse inference may be drawn. The defence case statement is deemed to be approved by the defendant. (A) and (B) are wrong, as the defendant is obliged to provide details of her defence. (D) and (E) are wrong, as the defence case statement must be served on both the prosecution and the court."},{n:7,id:"WEA001",scenario:"A man, aged 19, decides to make a will. He consults a solicitor and provides full instructions on the gifts to be included in the will. Shortly afterwards, the man develops severe mental health difficulties and becomes very confused. He executes the will whilst still suffering from these difficulties.",q:"Which of the following best describes the validity of the will?",opts:["The will is likely invalid as the man was aged less than 21.","The will is likely invalid as the man lacked capacity when he executed the will.","The will is likely valid as the man had capacity when he instructed the solicitor on preparing the will.","The will is likely invalid as the man lacked intention to make a will.","The will is likely valid as a solicitor acted for the man in preparing the will."],ans:"C",expl:"(C) The will is likely valid as the man had capacity when he instructed the solicitor on preparing the will. In order to make a valid will, a testator must have legal and mental capacity. Those aged over 18 have legal capacity. A testator has mental capacity if, at the material time, they understood the nature of their act of making a will, the extent of their property, and the claims to which they ought to give effect. The material time is usually when the will is signed. However, there may be a situation where a testator does not have adequate mental capacity at the date of executing the will but did have sufficient capacity when giving instructions to the will drafter. In cases such as this, where the will was prepared in accordance with those instructions and, at the time of execution, the testator understood that they were signing a will for which instructions had previously been given, the testator will be deemed to have acted with capacity. (A) is incorrect. Everyone aged at least 18 has legal capacity to make a will. (B) is incorrect. As previously explained, it is likely to be sufficient that the man had capacity when instructing the solicitor, even if he lacked capacity when he signed the will. (D) is incorrect. There is nothing on the facts to suggest that the man lacked intention to make the will. Instead, there appears to be an issue around his capacity to make a will. (E) is incorrect. A will prepared by a solicitor will still be invalid if the testator lacked capacity.",note:pr},{n:8,id:"LAN087",scenario:"The owners of eight parcels of land agree to build a private road over all eight parcels so the land can be developed into a residential neighborhood. All owners agree to a mutual covenant which requires all owners to pay an annual fee as a contribution to the cost of maintaining the road. The use of the road is conditional upon payment of the fee by the owners. Many years after the road is built and each parcel has been sold at least once, one of the landowners stops paying the road maintenance fee.",q:"Can the other owners enforce the covenant against the non-paying owner?",opts:["No, because positive covenants are never enforceable against successors in title.","No, but the owners can prevent the non-paying owner from using the road.","No, and the owners cannot prevent the non-paying owner from using the road.","Yes, because the current owners are successors in title to the original covenantors.","Yes, because the benefit and the burden imposed by the covenant are related to each other."],ans:"B",expl:"(B) The other owners cannot enforce the covenant against the non-paying owner, but the owners can prevent the non-paying owner from using the road. Generally positive covenants bind only the original contracting parties. However, under the benefit and burden rule, a person cannot enjoy a benefit without accepting a burden that goes with it. For this rule to apply, the benefit and the burden must be relevant to each other. Where an obligation is unenforceable against a successor in title, the successor in title may be denied use of the benefit if it does not also accept the burden. Here, the positive covenant to pay for maintenance of the road is unenforceable against the non-paying owner, a successor in title. However, since the non-paying landowner is not accepting the burden of paying the fee, he may be prevented from enjoying the benefit of using the road. (A) is incorrect because it is too broad. Although positive covenants usually are not enforceable against successors in title, there are exceptions and circumstances in which they may be enforced (such as a chain of indemnity covenants) which are not present here. (C) is incorrect because, as explained above, the owners can prevent the non-paying owner from using the road due to the benefit and burden rule. (D) and (E) are incorrect because, as explained above, the covenant is not enforceable by the current owners against the non-paying owner. The fact that the benefit and the burden imposed by the covenant are related to each other is relevant to the benefit and burden rule, which allows the owners to prevent the non-paying owner from using the road even though the covenant is unenforceable against him.",note:pr},{n:9,id:"TRU135",scenario:"An unmarried couple, a baker and a cook, lived together in a house registered in the name of the baker alone. At the time of the purchase, the cook paid 5% of the purchase price, and the baker paid 15%. The remaining amount was raised by a mortgage on the property. After 15 years the parties have separated, and the cook wants to claim an equitable interest in the property. There is no express declaration of trust.",q:"Is the cook's claim likely to succeed?",opts:["No, because there is no express declaration of trust in favour of the cook.","No, because the house is registered in the name of the baker only.","No, because the cook paid only 5% of the purchase price.","Yes, because the couple lived together for more than 10 years.","Yes, because the cook paid towards the purchase price."],ans:"E",expl:"(E) The cook's claim is likely to succeed because they paid towards the purchase price. When a non-legal owner attempts to assert an equitable interest in the family home, the court will impose a constructive trust in favour of the non-legal owner if the non-legal owner can establish that: (1) the parties had a common intention, either express or inferred, that the non-legal owner should have an equitable interest in the property; and (2) the non-legal party relied to their detriment on the common intention. The court may infer a common intention from the parties' conduct, such as the non-legal owner making a direct contribution to the purchase price or making mortgage payments. Here, the non-legal owner, the cook, contributed to the purchase price of the house, which is likely sufficient to show that there was an inferred common intention that the cook should have an interest in the house. In addition, the cook can show that they relied to their detriment on the common intention by paying some of the purchase price. (A) is incorrect because the court can impose a constructive trust in favour of the non-legal owner when there is no express declaration of trust. (B) is incorrect because a non-legal owner can claim an interest in property through an express declaration of trust or by asking the court to impose a common intention constructive trust. (C) is incorrect because there is no minimum amount that the non-legal owner must contribute in order to claim an interest. (D) is incorrect because there is no requirement that the parties must live together for a certain amount of time before one can claim an interest in the property."},{n:10,id:"CRP107",scenario:"A defendant appears in the Magistrates' Court facing two charges of battery arising from the same incident.",q:"What is the maximum sentence that the defendant could face?",opts:["One month's imprisonment.","Three months' imprisonment.","Six months' imprisonment.","12 months' imprisonment.","A fine."],ans:"C",expl:"(C) The defendant could receive a maximum sentence of six months' imprisonment. Assault is a summary only offence that can be tried only in the Magistrates' Court. The Magistrates' Court sentencing powers are limited to six months for summary only offences, even if there is more than one. In principle, the court could opt to impose consecutive, rather than concurrent, sentences. However, when the offences arise out of the same incident, sentences will be concurrent. The maximum sentence for assault is six months. For this reason, (A), (B), and (E) are incorrect. The court can impose a sentence of 12 months for two or more either way offences. However, battery is summary only, and so (D) is incorrect."},{n:11,id:"TAX032",scenario:"A man died on 15 June 2020. His estate includes the following assets: his main residence, worth £525,000, quoted shares valued at £150,000, and a cat worth £20,000. At the date of his death, the man owed £1,000 on his credit card. His funeral expenses were £9,000. The man was a bachelor, but he had an adopted son to whom the man left his entire estate. In the 2020/21 tax year, the nil-rate band is £325,000 and the main residence nil-rate band is £175,000.",q:"How much inheritance tax will be payable on the man's estate?",opts:["£0","£66,000","£70,000","£74,000","£78,000"],ans:"D",expl:"(D) £74,000. To calculate the inheritance tax, we add up the value of the man's assets that are subject to IHT and subtract out applicable nil rate bands. As the house was the man's main residence and he is leaving it to an adopted son (who is treated like a direct descendant), the £175,000 residence nil rate band may be deducted from the £525,000 value of the house, leaving £350,000 of the value subject to tax. To that, we add the £150,000 value of the shares and the £20,000 value of the car (cars are exempt from gift tax, but not from IHT), reaching a total of £520,000. From this total, we deduct the man's £1,000 credit card debt and £9,000 funeral expense, leaving £510,000. From the £510,000, we then apply the £325,000 NRB, leaving the remaining £185,000 to be taxed at 40% = £74,000.",note:"Source slip kept: the facts list 'a cat worth £20,000'; the explanation treats it as 'the car'. The figures work either way. '$9,000' in the OCR has been read as '£9,000'."},{n:12,id:"CRL085",scenario:"A girlfriend tells her boyfriend that she is leaving him for another man. Overwhelmed with anger, the boyfriend grabs his girlfriend by the hair and drags her to the floor and then releases her. The girlfriend is afraid but unharmed. The boyfriend then grabs his jacket and leaves, ashamed of what he has done.",q:"Can the boyfriend be charged with assault occasioning actual bodily harm?",opts:["No, as he can rely on the defence of loss of control.","No, as he can rely on the defence of provocation.","Yes, because the girlfriend was afraid.","No, because he can rely on diminished responsibility.","No, because there was no injury."],ans:"E",expl:"(E) The boyfriend cannot be charged with assault occasioning actual bodily harm ('ABH') because there was no injury. ABH requires there to be an assault or battery which results in harm which is more than minimal. Here, the boyfriend committed a battery - an application of unlawful force - by grabbing his girlfriend by the hair and dragging her to the floor. However, we are told that the girlfriend was unharmed. (A) and (D) are incorrect as they are defences which are available only to charges of murder. (B) is incorrect as it is a defence that no longer exists, as it has been replaced with loss of control. (C) is incorrect as fear is not enough to amount to ABH. If the girlfriend suffered psychiatric harm, that would be sufficient."},{n:13,id:"CRP053",scenario:"A defendant is charged with theft of clothing from a shop to the value of £150. She appears before the Magistrates' Court for her first appearance. She intends to plead not guilty.",q:"Which of the following correctly states how it will be determined where her trial will take place?",opts:["The defendant may elect trial in the Crown Court or the Magistrates' Court, but the Magistrates' Court may decline jurisdiction if the matter is deemed too serious.","The defendant may elect trial in the Crown Court or the Magistrates' Court, which cannot decline jurisdiction.","The defendant cannot elect trial in the Crown Court because theft is a summary only offence.","The defendant cannot elect trial in the Magistrates' Court because theft is an indictable only offence.","The court will decide whether the matter is heard in the Magistrates' Court or the Crown Court by reference to the seriousness of the offence and without reference to the defendant."],ans:"B",expl:"(B) The defendant may elect trial in the Crown Court or the Magistrates' Court, which cannot decline jurisdiction. Theft is generally an either way offence, meaning it can be heard in either the Crown Court or the Magistrates' Court. Low value theft (up to a value of £200) adopts a hybrid procedure. The offence is treated as summary only in that the Magistrates' Court cannot decline jurisdiction to deal with the offence. However, it is treated as an either way offence in that the defendant can elect Crown Court trial. (A) is incorrect as it sets out the procedure for ordinary either way offences. (C) is incorrect as theft is not summary only. (D) is incorrect as theft is not indictable only. (E) is incorrect as the defendant can choose where she wants her case heard.",note:"'$' in the OCR of the facts and explanation has been read as '£' (£150; £200)."},{n:14,id:"TAX115",scenario:"Two partners have been trading as partners of a limited liability partnership ('LLP') for many years. Partner S and Partner O have been partners in SON LLP for many years. A new partner joined the LLP at the start of the tax year which ended 31 December 2020. On 1 December 2020, the LLP sold an investment property which resulted in a gain of £175,000. The property was purchased five years before the new partner joined the LLP.",q:"Who is responsible for the tax on this gain?",opts:["The LLP alone is responsible for the corporation tax on this gain.","The LLP alone is responsible for capital gains tax on this gain.","Each of the original two partners are equally responsible for the corporation tax on this gain.","Each of the original two partners are responsible for the capital gains tax on their share of the gain.","Each of the three partners is responsible for the capital gains tax on their share of the gain."],ans:"E",expl:"(E) Each of the three partners is responsible for the capital gains tax on their share of the gain. An LLP is not taxed directly. Any profits or gains made by the LLP are passed on to the partners who pay income tax on their share of the profits and capital gains tax on their share of any gains via self-assessment. It does not matter when the investment property was purchased by the LLP; it only matters that the new partner was a partner at the time the investment property gain was realised.",note:"Source wording kept: 'the tax year which ended 31 December 2020' (presumably the LLP's accounting year)."},{n:15,id:"LAN107",scenario:"A woman owns a piece of land which is landlocked - that is, she needs to pass over land belonging to her neighbour to gain access to the public highway.",q:"What type of interest does she require?",opts:["A mortgage.","An easement.","A licence.","A rentcharge.","A profit à prendre."],ans:"B",expl:"(B) The woman requires an easement, which is a right attached to one piece of land (the dominant land) to go over a different piece of land belonging to another (the servient land). (A) is incorrect. A mortgage acts as security for a loan, giving the mortgage holder the right to sell the sold to satisfy the secured obligation if the debtor defaults. (C) is incorrect. A licence is merely a personal right. The woman could seek a personal right to cross her neighbour's land, but she would want to go beyond a personal right (which is not transferable) and obtain a right attached to her land (the easement). Otherwise, when the woman went to sell her land, its value would be diminished since it is without access. (D) is incorrect. A rentcharge is an interest in land requiring the landowner to make a periodic payment in respect of the land to the rentcharge owner. (E) is incorrect. A profit à prendre is the right to take something from the land of another. The woman does not seek to take something from her neighbour's land but, rather, seeks to cross her neighbour's land.",note:`${pr} Source slip kept: 'the right to sell the sold' (presumably 'the land').`},{n:16,id:"CRP036",scenario:"A member of an activist group has been arrested on suspicion of criminal damage after a statue in a town square of a controversial figure was covered in graffiti. The investigating inspector has reasonable grounds to believe that, if permitted to inform someone of her arrest, the suspect will notify other activists of the investigation and thereby trigger the removal of evidence from her property.",q:"Can the inspector prevent the suspect from informing someone of her arrest?",opts:["No, every person under arrest has the right to notify someone of their arrest.","No, only individuals suspected of terrorism can be prevented from informing someone of their arrest.","Yes, the right can be delayed for a maximum of 36 hours.","Yes, the right can be delayed for a maximum of 48 hours.","Yes, the right can be refused entirely."],ans:"C",expl:"(C) The inspector can prevent the suspect from informing someone of her arrest for a maximum of 36 hours. A suspect has a right to have a friend, relative, or other person informed of their arrest. Delay is only permitted when: (1) the suspect is arrested on an indictable only or either way offence; (2) a police officer of the rank of inspector or above has authorised the delay in writing; and (3) the officer has reasonable grounds to believe that exercise of the right will lead to interference with evidence, interference with others, alerting other suspects, or hindering the recovery of property related to the offence. The right can be delayed a maximum of 36 hours and should only be delayed as long as necessary. Here, the suspect was arrested for criminal damage, which is an either way offence. The officer believes the exercise of the right may lead to the interference with evidence. Therefore, the inspector can authorise the delay in writing for a maximum of 36 hours. (A) and (B) are incorrect as it is possible to delay the right to notify a person of arrest in certain circumstances. There is also no special rule for individuals suspected of terrorism. (D) and (E) are incorrect, as 36 hours is the maximum by which the right can be delayed."},{n:17,id:"CRL058",scenario:"A woman happened to have the same name as a famous local celebrity. Coincidentally, they also shared the same birthday. The woman went to an electronics shop to buy a new smartphone. She decided to buy it on credit because she had little money. The woman truthfully filled out the store's credit application. The woman was mistaken for the celebrity and knew that when she purchased the smartphone. As a result, she was approved for credit beyond her means. She knew that she might not be able to make payments for the phone when due, but she intended to pay them. After several months of nonpayments, the shop realised that they had made a mistake and reported the woman to the police.",q:"What charge is likely to be brought against the woman?",opts:["The woman should be charged with theft, because when she obtained the item she was being dishonest under an objective standard.","The woman should be charged with fraud by misrepresentation, as she pretended that she was the celebrity.","The woman should be charged with fraud by failure to disclose information, because the woman did not disclose that she was not the celebrity.","The woman should be charged with fraud by abuse of position, because she took advantage of being mistaken for the celebrity.","The woman should not be charged with anything because she did not make any misrepresentations and intended on paying back the store for the smartphone."],ans:"A",expl:"(A) The woman should be charged with theft. A person is guilty of theft if she dishonestly appropriates property belonging to another with the intention of permanently depriving the other of it. A person acts dishonestly if a reasonable and honest person would deem the behaviour dishonest. Here, the woman was dishonest because she knew of the mistake when she took the smartphone. A reasonable and honest person would not have accepted credit beyond their means knowing of the mistake. And although the woman intended to pay for the smartphone, she did intend on keeping it. Thus, (E) is incorrect. The woman is not guilty of fraud by misrepresentation (B), because this crime requires a misrepresentation. Here, the woman did not make any misrepresentations; she gave her correct name and date of birth. The woman is not guilty of fraud by failing to disclose information (C) because that crime requires the nondisclosure of information the defendant was under a duty to disclose, and here there is no evidence that the woman had a legal duty to disclose the fact she was not the celebrity. Normally, there must be a fiduciary relationship between the two parties, and there was no such relationship here. (D) is incorrect because the crime of fraud by abuse of position involves the defendant abusing their position in which they are expected to safeguard another's financial interests, which was not the situation here. (E) is incorrect as theft is made out here.",note:"The facts are jumbled in the scan; they are given here in reading order."},{n:18,id:"LAN026",scenario:"A buyer has entered into a contract for the purchase of an office block. The legal title to the land is registered at Her Majesty's Land Registry ('HMLR'). The transaction is not due to complete for another six months.",q:"Which of the following best describes how the buyer's position should be protected?",opts:["By registration of a restriction on the seller's proprietorship register.","By registration of a notice on the seller's proprietorship register.","By registration of a restriction on the seller's charges register.","By registration of a notice on the seller's charges register.","No action is required - the existence of the contract created upon exchange is sufficient."],ans:"D",expl:"(D) The buyer's position should be protected by registration of a notice on the seller's charges register. A notice is an entry in the register in respect of a burden affecting a registered estate. The notice must appear on the seller's charges register, which is where any burdens or encumbrances that affect the land - such as covenants, mortgages, or, as here, an estate contract - must be entered. (A) and (C) are incorrect because a restriction is used to prevent any dealing with the land otherwise than in accordance with the terms of that restriction, such as a restriction entered when the beneficial interest is held as tenants in common. It protects an interest under a trust and appears on the proprietorship register. (B) is incorrect because the notice of a burden must appear on the charges register. The proprietorship register denotes the class of title and who holds the legal estate. (E) is incorrect because registration of the estate contract must be carried out to protect the buyer's position and to put the world on notice of the existence of the agreement."},{n:19,id:"ACC063",scenario:`A solicitor acts for a client on a probate transaction. The solicitor sends the client a bill for professional charges and disbursements incurred, as follows:
Professional Charges £3,000
VAT £600
Company search charge (already paid by the firm) £100
Sum to be held on account for Inheritance tax £15,000
The client sends the solicitor a cheque for £18,700.`,q:"Which of the following statements is correct concerning the cheque the solicitor received from the client?",opts:["£15,100 of the money received is client money, the remaining amount of £3,600 is business money.","The entire amount of the cheque must be placed in the business account.","The entire amount of the cheque is business money.","£15,000 of the money received is client money, the remaining amount of £3,700 is business money.","The entire amount of the cheque is client money."],ans:"D",expl:"(D) £15,000 of the money received is client money and the remaining amount of £3,700 is business money. (Thus, (C) and (E) are incorrect as the entire amount is not client or business money.) Only the money to be held on account for the client is client money; the rest of the receipt (that is, the professional charges and VAT plus the company search fee that was already paid by the firm) belongs to the firm. (A) is incorrect because the search charge already paid is business money as well. (B) is incorrect. As this is a mixed receipt of funds containing both client and business money, it can be placed entirely in the business account and the client money transferred promptly, or it can be placed entirely in the client account and the business money transferred promptly, or the cheque can be split.",note:Wp},{n:20,id:"CRP096",scenario:"A defendant is standing trial for robbery. He is jointly charged with his friend. Both the prosecution and the defendant want his friend, the co-defendant, to give evidence. Afraid of saying something incriminating, the co-defendant does not want to give evidence.",q:"Which of the following best describes whether the co-defendant will have to give evidence?",opts:["The co-defendant is competent and compellable for both the prosecution and the defendant.","The co-defendant is competent for both the prosecution and the defendant but compellable only for the defendant.","The co-defendant is neither competent nor compellable for the prosecution but both competent and compellable for the defendant.","The co-defendant is neither competent nor compellable for the prosecution but competent but not compellable for the defendant.","The co-defendant is competent but not compellable for both the prosecution and the defendant."],ans:"D",expl:"(D) The co-defendant is neither competent nor compellable for the prosecution. He is competent for the defendant but not compellable. This means that the co-defendant cannot give evidence for the prosecution. He can give evidence for the defendant, but he cannot be forced to. (A), (B), and (E) are incorrect as the co-defendant is not competent for the prosecution. (C) is incorrect as the co-defendant is not compellable for the defendant."},{n:21,id:"WEA060",scenario:`A woman made a will several years ago, including the following provisions:
(1) I give my ABC plc shares to such of my children as survive me, and if more than one, in equal shares.
(2) I give the remainder of my estate to my husband.
There are no other relevant clauses. The woman died recently. The woman had a son and a daughter. The son died last year, survived by his wife and two children.`,q:"Which of the following best describes entitlement to the woman's estate?",opts:["The husband will inherit the entire estate.","The woman's daughter will inherit the ABC plc shares, and the husband will inherit the remainder of the estate.","The ABC plc shares will be divided equally between the woman's daughter and the son's two children. The woman's husband will inherit the rest of the estate.","The ABC plc shares will be divided equally between the woman's daughter and the son's wife. The woman's husband will inherit the rest of the estate.","The ABC plc shares will be divided equally between the woman's daughter, the son's wife, and the son's children. The woman's husband will inherit the rest of the estate."],ans:"B",expl:"(B) The woman's daughter will inherit the ABC plc shares, and her husband will inherit the remainder of the estate. If a beneficiary has predeceased the testator, the gift to them will lapse. However, if a gift is made to the testator's issue who die before the testator and who leave living issue, the living issue will receive the gift unless the will expresses a contrary intention. Here, the will expressly states that the gift of shares is only to the children who survive the woman. This expression of contrary intention prevents the rule applying, and the son's children will have no entitlement to the shares. Instead, the shares pass only to the daughter as the woman's surviving child. The husband will inherit the rest of the estate. (A) is incorrect because the daughter will receive the shares. (C), (D), and (E) are incorrect because the woman's daughter only is entitled to inherit the shares, and the husband will not receive the shares as part of the residuary estate. Note that even if the gift of shares passed to the predeceased son's issue, his wife would not receive any shares."},{n:22,id:"WEA127",scenario:"A woman died last year, leaving her estate to her husband in her valid will. Her husband also inherited the family home that he owned jointly with the woman. The woman's sons have succeeded in a claim against the woman's estate under the Inheritance (Provision for Family and Dependants) Act 1975 ('the Act').",q:"Which of the following is correct with regard to orders the court can make under the Act?",opts:["The court can order the payment or transfer of property passing under the will only.","The court cannot order the transfer of the woman's interest in the family home.","The court can order periodical payments to the sons.","The court can order the payment of a lump sum from the estate to the sons only.","The court cannot order the payment of income to the sons."],ans:"C",expl:"(C) The court can order periodical payments to the sons. Following a successful claim under the Inheritance (Provision for Family and Dependants) Act 1975, the court has very wide discretion in the orders it can make. It has the power to order the transfer of property, payment of a lump sum, periodical payments, payment of income, and settlement of property on trust. (A) and (B) are incorrect because the court can make an order in respect of both property passing under the will or intestacy and the deceased's share of a joint tenancy. Therefore, the court can make an order in respect of both the estate passing under the woman's will and also the woman's interest in the family home. (D) is incorrect because the court has the power to make several types of orders besides the payment of a lump sum. (E) is incorrect because the court has the power to order the payment of income."},{n:23,id:"PRP029",scenario:"A seller and buyer exchanged contracts for the sale and purchase of a property using the Contract incorporating the Standard Conditions of Sale (5th edition - 2018 revision), unamended. Both solicitors failed to insert a completion date into their respective parts of the contract on exchange of contracts.",q:"Which of the following statements best describes the position regarding completion when no date has been inserted?",opts:["The standard conditions of sale provide that completion will take place on a date that shall be mutually agreed by the parties.","The standard conditions of sale provide that completion will take place 20 working days after exchange of contracts.","The standard conditions of sale provide that completion will take place 10 working days after exchange of contracts.","The standard conditions of sale provide that completion will take place on a date that shall be chosen by the buyer.","The standard conditions of sale provide that completion will take place on a date that shall be chosen by the seller."],ans:"B",expl:"(B) The standard conditions of sale provide that if the completion date is not inserted into the contract on exchange, completion will take place 20 working days after exchange. (A), (C), (D), and (E) are incorrect because they do not state the correct default position under the standard conditions of sale, which is that completion will take place 20 working days after exchange."},{n:24,id:"CRP090",scenario:"A defendant is standing trial in the Crown Court on a charge of actual bodily harm ('ABH'). Whilst giving evidence, the defendant accuses the investigating officers of lying. As a result, the prosecution seek to adduce the defendant's previous convictions for theft and burglary, which the court accepts. The defence make a counter application that the evidence should be excluded.",q:"How will the court decide whether to grant the defence application to exclude the previous convictions?",opts:["The court may exclude the previous convictions if it would be in the interests of justice.","The court must exclude the previous convictions if it would be in the interests of justice.","The court may exclude the previous convictions if their admission would have an adverse effect on the fairness of the proceedings.","The court must exclude the previous convictions if their admission would have such an adverse effect on the fairness of the proceedings that the court must not admit them.","The court may exclude the previous convictions if it would be reasonable in all the circumstances."],ans:"D",expl:"(D) When evidence is sought to be adduced under the gateways of 'an important matter in issue between the prosecution and defence' or 'the defendant attacked another's character' - which the defendant did here - the court must not admit the evidence if: (1) the defence make an application to exclude it, and (2) it appears to the court that the admission of the evidence would have such an adverse effect on the fairness of the proceedings that the court must not admit it. (A), (C), and (E) are incorrect as they use may instead of must. (A), (B), and (E) are further incorrect, as they misstate the test to be applied by the court."},{n:25,id:"PRP069",scenario:`A solicitor is acting for the buyer of a residential property. The seller has disclosed on the Property Information Form that they built a porch on the front of the property six months ago. The seller has produced a building regulation completion certificate but no other documents in this regard. The buyer's solicitor has investigated the title and discovered that the seller bought the property as a new build from the original developer three years ago. The buyer's solicitor notes that there is a provision in the transfer from the developer to the seller in the following terms:
'Within five years of the date of this transfer, no alteration to the property shall be made without the previous written consent of the seller'.`,q:"What is the best way to address this defect in title?",opts:["The buyer's solicitor should require the seller to meet the cost of breach of restrictive covenant indemnity insurance and should insert a special condition in the contract to this effect.","The buyer's solicitor should require the seller to produce a planning permission regarding the construction of the porch.","The buyer's solicitor should ignore the situation, as the developer has not taken action in the six months since the porch was built.","The buyer's solicitor should require the seller to approach the original developer to seek their written consent to the construction of the porch.","The buyer's solicitor should advise their client that the seller has constructed the porch in breach of covenant and so the client should not proceed with the purchase."],ans:"D",expl:"(D) The buyer's solicitor should require the seller to approach the original developer to seek their written consent to the construction of the porch. The property is only three years old, so the consent of the original developer is still required because the covenant makes it clear that their consent is needed if any changes are made within five years of the date of the original purchase. Given the fact that the seller is the original contracting party, and the covenant is very recent, contacting the developer for their consent to the porch is the best solution. (A) is incorrect. Given the very recent date of the transfer containing the covenant and the fact that it is highly likely that the original developer is still in business and can be traced, a restrictive covenant indemnity policy is unlikely to be available for this breach. In any case, permission from the developer will prevent any further issues with respect to the porch; insurance will not prevent possible lawsuits but will merely cover the buyer's losses if there are any. (B) is incorrect as it is unlikely that a planning permission would be required for a small porch, and in any event, the query asks about the lack of consent. (C) is incorrect. Given the short time frame, there is no reason to believe the developer will not take action in the future. A prudent solicitor would therefore take curative steps. (E) would be effective, but it is not the best solution if the buyer wants the property. A better first step that would both serve the client's wishes in buying the property and protect the client against possible future litigation arising from the porch is simply to ask the developer for permission.",note:"The facts are jumbled in the scan; they are given here in reading order. Source slip kept: the quoted covenant requires 'the previous written consent of the seller', but the explanation (correctly, on the facts) treats the developer as the party whose consent is needed. The end of option (E) is completed from the question screen."},{n:26,id:"WEA108",scenario:"A man died intestate last month, survived by his wife and adult son. The man's parents are also still alive.",q:"Which of the following describes who will best be entitled to take a grant of representation, and which type of grant is appropriate?",opts:["The wife and son are equally entitled to take a grant of probate.","The wife and son are equally entitled to take a grant of letters of administration.","The wife has the best right to take a grant of letters of administration.","The man's wife, son, and parents are all equally entitled to take a grant of letters of administration with will annexed.","The man's parents have the best right to take a grant of probate."],ans:"C",expl:"(C) The wife has the best right to take a grant of letters of administration. As the man died intestate, rule 22 of the Non-Contentious Probate Rules ('NCPR') will apply, and a grant of letters of administration will need to be obtained. Under rule 22, the surviving spouse has the best entitlement to a grant of letters of administration. (A) is incorrect. A grant of probate is relevant when there is a valid will and not on an intestacy. (B) is incorrect. Under rule 22, the surviving spouse has the primary entitlement to the grant. Children of the deceased follow spouses in the order of entitlement. (D) is incorrect. A grant of letters of administration with will annexed does not apply to a full intestacy situation because there is no will. (E) is incorrect. A grant of probate is not applicable in an intestacy situation."},{n:27,id:"TAX161",scenario:`On 1 October 2020, a homeowner sold his holiday cottage for £200,000. He had bought the cottage in July 2000. The homeowner's expenditure on the cottage prior to its sale was as follows:
• Legal fees on purchase £800
• Purchase price £110,000
• Re-decoration costs £2,100
• Cost of building a garage £7,500
• Replacement of a few roof tiles after a storm £150`,q:"In addition to the purchase price, which of these costs will be deducted in calculating the homeowner's chargeable gain?",opts:["All of them.","The £800 legal fees and £2,100 redecoration costs only.","The £800 legal fees and £7,500 cost of garage only.","The £800 legal fees, the £7,500 cost of garage, and £150 replacement tiles only.","The £2,100 redecoration costs and the £150 replacement tiles only."],ans:"C",expl:"(C) The £800 legal fees and £7,500 cost of garage only. Revenue expenses which merely maintain and repair the asset are not deductible (so the re-decoration costs and replacement of tiles are not deductible). However, any purchase costs and costs of improvement can be deducted, such as the legal fees on purchase, and the cost of building a garage, in addition to the acquisition costs.",note:`${Wp} '$200,000' in the OCR has been read as '£200,000'.`},{n:28,id:"CRL044",scenario:"A man decided to apply for a job at a children's home. There was a section on the application form asking for details of criminal convictions. The man left the section blank. The man did in fact have one conviction for criminal damage five years previously. However, he was not offered the job.",q:"What offence, if any, has the man committed?",opts:["None, because the criminal damage matter is irrelevant to whether he is a fit and proper person to work in a children's home.","None, because the criminal damage conviction would be spent and therefore not disclosable.","Attempted fraud by failure to disclose, because although the man attempted to secure the job by not revealing his conviction, he did not.","Fraud by failure to disclose, because he did not disclose his conviction, which he had a legal duty to do, in order to make a gain for himself.","Fraud by false representation, because leaving the section blank was a representation that the man had no previous convictions, which was false."],ans:"D",expl:'(D) The man is guilty of fraud by failure to disclose. A defendant is guilty of fraud by failing to disclose information if he dishonestly fails to disclose to another person information which he is under a legal duty to disclose, and intends, by failing to disclose the information, (1) to make a gain for himself or another or (2) to cause loss to another or to expose another to a risk of loss. Here, there was a legal duty to disclose past convictions, and the man did not do so with the intention to make a gain for himself. (A) and (B) are incorrect because the question of relevance or whether the conviction is spent is not relevant to whether the man failed to disclose. The man could argue that he should not be obliged to answer this question. However, where he fails to fill the section in and he is required to do so, he commits an offence if he does so for gain (or loss to another). (C) is incorrect because there is no requirement that the person succeed in the goal of the false representation. (E) is incorrect because by not writing anything in the section, it would be difficult for the prosecution to prove that the man made an actual misrepresentation, because he did not write "I have no convictions".'},{n:29,id:"CRP112",scenario:"Four friends, aged 10, 11, 12, and 14, commit a burglary together.",q:"Which of the four friends can be criminally charged?",opts:["The 14-year-old only.","The 14-year-old and the 12-year-old only.","The 14-year-old, the 12-year-old, and the 11-year-old only.","All of them.","None of them."],ans:"D",expl:"(D) All of the friends can be criminally charged. The age of criminal responsibility is 10. Children under the age of 10 are not criminally liable and cannot be charged. Children aged 10-17 will generally appear in the Youth Court and will be treated in accordance with their age. For this reason, (A), (B), (C), and (E) are wrong."},{n:30,id:"TRU098",scenario:"In 2017, a trust of concurrent interests was set up for a brother and sister, equally. The interests are contingent on the brother and sister reaching the age of 30. They each have a presumptive share of capital of £200,000. The brother is 27, and the sister is 24. The brother would like an advancement of £150,000 to start a business.",q:"Can the trustees make this advancement of capital?",opts:["No, unless the trustees obtain the consent of the sister.","No, because the brother has not yet reached age 30.","Yes, because the trustees have the discretion to make this advancement of capital.","No, because the trustees cannot advance more than half of a beneficiary's presumptive share of capital.","Yes, because starting a business is a proper purpose for trust capital."],ans:"C",expl:"(C) Trustees have the discretionary power to advance trust capital for a beneficiary's advancement or benefit when the beneficiary has an interest in the capital. Therefore, the trustees have the discretion to advance £150,000 to the brother to start a business. (A) is incorrect because the sister's consent is not needed. Beneficiaries with prior interests must consent to advancements of capital, but the sister and brother have concurrent interests. (B) is incorrect because the brother can receive an advance of capital before he reaches age 30. The power to advance capital applies to beneficiaries with contingent and vested interests. (D) is incorrect because the trustees can advance up to the amount of the beneficiary's presumptive entitlement, which is £200,000 here. (E) is incorrect because the power of advancement is not limited to certain 'proper' purposes. The trustees can advance capital for a beneficiary's advancement or benefit."},{n:31,id:"LAN094",scenario:"Two friends own Blackacre jointly. They purchased it 20 years ago as joint tenants. One friend now wants to sell Blackacre and the other does not. They cannot come to an agreement as to what should be done.",q:"What step can the owner who wants to sell take to break the deadlock?",opts:["There is nothing that the owner who wants to sell can do as the parties own the property jointly and they have to agree to the sale of the land.","The owner who wants to sell can apply to the court for an order for specific performance requiring his co-owner to transfer his interest in the land.","The owner who wants to sell can appoint a second trustee to overreach his co-owner's beneficial interest in the property.","The owner who wants to sell can sue his co-owner for damages for any lost profit he may have incurred due to the refusal to sell.","The owner who wants to sell can apply to the court for an order for sale."],ans:"E",expl:"(E) To break the deadlock, the owner who wants to sell can apply to the court for an order for sale. If co-owners cannot agree how or when to dispose of a property, a trustee or any other person with an interest in property subject to a trust (which includes co-owners) can apply to the courts for an order relating to the trustee's duties, including an order to sell. (A) is incorrect. As explained above, the owner who wants to sell does have a course of action open to him to break the deadlock, which is to apply to the court for an order for sale. (B) is incorrect because it is not an appropriate remedy here. Specific performance is an equitable remedy which can be applied for to try to force one party to perform their obligations under a contract. Here, there is no contract between the co-owners to be enforced that would require the co-owner to transfer his interest in the land. (C) is incorrect because overreaching is not applicable here. Overreaching is a process by which a buyer may take free of a beneficiary's interest under a trust. Here, there is no sale yet that would entail overreaching. (D) is incorrect because it is not an available remedy here. The co-owner is not required to agree with the other co-owner as to the sale. The co-owner who wishes to sell can then apply to the court for an order for sale to break the deadlock."},{n:32,id:"CRP048",scenario:"A defendant appears before Magistrates' Court charged with battery. In conference prior to first appearance at court, the defendant admits to her solicitor that she committed the offence but nevertheless wants to plead not guilty.",q:"Which of the following statements best describes the solicitor's position on whether he can continue to represent her?",opts:["The solicitor can continue to act for the defendant and help her put forward her defence.","The solicitor has a duty to disclose the confession to the court.","The solicitor can continue to act if the defendant does not actively assert a defence.","The solicitor must withdraw from the case immediately.","The solicitor must seek to persuade the defendant to enter a guilty plea and must withdraw if the defendant refuses."],ans:"C",expl:"(C) The solicitor can continue to act if the defendant does not actively assert a defence. A solicitor has a duty not to mislead the court and must give the defendant careful advice on the strength of the evidence and credit for an early guilty plea (a reduction in sentence for pleading guilty and avoiding an unnecessary trial). If the defendant still intends to plead not guilty, the solicitor must warn her that the solicitor will not be able to mislead the court. This means that the solicitor can still act for the defendant and test the prosecution's case, but the solicitor cannot advance an alternative account, as to do so would amount to professional misconduct. If the defendant does not accept this position, the solicitor will be obliged to withdraw from the case. (A) is incorrect as it would involve misleading the court. (B) is incorrect as it breaches client confidentiality. (D) and (E) are incorrect as the defendant should not seek to persuade a client to plead guilty (this is a matter for the client), and the solicitor need not withdraw as long as the defendant does not actively seek to assert an account the solicitor knows to be false.",note:"Source slip kept: in the exp
