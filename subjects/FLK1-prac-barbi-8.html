) and (E) are incorrect as creation of a first legal mortgage triggers first registration and so the building society will apply to have their mortgage appear on the charges register for the property. (B) and (C) are incorrect as they each state an incorrect timescale."},{n:2,id:"PRP197",scenario:"A landowner has instructed their solicitor regarding the sale of some land. The title to the land is unregistered. The landowner tells their solicitor that the land is in mortgage to a bank and that there is approximately £35,000 outstanding on the mortgage.",q:"How will the landowner's solicitor obtain evidence of the title to the land?",opts:["The solicitor will ask the bank to supply a photocopy of the title deeds and will undertake to pay the bank's photocopying charges.","The solicitor will request the title deeds from the bank and will give an undertaking not to release them pending redemption of the mortgage.","The solicitor will download a copy of the register entries of the title from Her Majesty's Land Registry.","The solicitor will request the release of the title deeds from the bank and will register a C(i) land charge to protect the bank's interest.","The solicitor will arrange for a voluntary first registration of the unregistered title and will ensure that the bank's charge appears on the charges register."],ans:"B",expl:"(B) To obtain evidence of title, the solicitor will request the title deeds from the bank and will give an undertaking not to release them pending redemption of the mortgage. As title to the land is unregistered, the bank will hold the unregistered title deeds as security for the loan. There is money outstanding on the mortgage, so the bank will require an undertaking for safekeeping of the title deeds until the mortgage is paid off out of the sale proceeds. (A) is incorrect. Asking the lender to provide a photocopy of the deeds is not usual conveyancing procedure. (C) is incorrect. The title is unregistered, accordingly there is currently no register of title available. (D) is incorrect. It is the undertaking which protects the bank's interest. A C(i) land charge protects a second or subsequent charge, which is not relevant in this case. (E) is incorrect. The solicitor will not be in a position to apply for voluntary first registration without first obtaining the title deeds from the bank."},{n:3,id:"ACC054",scenario:"A solicitor acts for the executors of an estate and the administration has come to an end. The executors instruct the solicitor to close their client account and transfer the residuary estate to the deceased's granddaughter, who the firm is also acting for in a separate property transaction.",q:"Which one of the following statements is correct with respect to the transfer?",opts:["The only action the firm must take is to make a note in the granddaughter's client file.","Money must be withdrawn from the cash account - client side and placed in the account of the granddaughter.","A debit entry must be shown on the client ledger and a credit entry on the granddaughter's client ledger.","The granddaughter does not have to be an actual client of the firm for an inter-client transfer to take place.","The HMRC - VAT ledger must be updated to reflect this transfer."],ans:"C",expl:"(C) To close the executors' client account, the remaining funds within it must be taken out of the account and transferred directly into the granddaughter's client account. (A) is incorrect as a note of this can be made in the granddaughter's client file, but this would not be sufficient to end the matter. (B) is incorrect. As the funds from the estate remain in the general client account, there is no movement; the funds are simply attributed to another client. (D) is incorrect. If the granddaughter was not a client of the firm you would not have a client ledger for her, you would have simply sent the granddaughter a cheque from the executors' client account. (E) is incorrect as the VAT ledger has no relevance here; this is not a business transaction."},{n:4,id:"ETH017",scenario:"At 9.30am a solicitor told a partner on the other side of a transaction that he would send the partner a deed signed by the solicitor's client as soon as he held a signed copy. The client had an appointment to see her solicitor to sign the deed at 11.00am that day. The client did not make it into the office as she had a heart attack at 10.30am and unfortunately died. The partner on the other side of the transaction had reasonably relied on the solicitor's statement and has accused the solicitor of being in breach of undertaking.",q:"Was there a breach of undertaking under these facts?",opts:["[No,] because the undertaking could not be fulfilled due to death of the client.","Yes, because the deed was not sent.","No, because the statement was oral, not written.","No, because the solicitor indicated that he would send the deed as soon as he received it and he did not receive it.","Yes, because compassion is not required under the Rules."],ans:"D",expl:"(D) The solicitor giving the undertaking qualified his statement by saying that he would hand over the deed when he held a signed copy. He knew at the time he made the statement that he could not fulfil the promise at that point. Thus, there was no breach of undertaking and (B) is incorrect. (A) has the correct result but for the wrong reason. There is no breach because the solicitor qualified his statement and not because it became impossible to fulfil the undertaking. Similarly, (C) is incorrect because an oral statement is capable of being an undertaking. (E) is probably true technically, but the solicitor qualified his statement in any event, so there was no breach.",note:"The first word of option (A) is cut off on both screens. '[No,]' is inferred from the explanation, which says (A) 'has the correct result but for the wrong reason'."},{n:5,id:"PRP142",scenario:"The solicitors for a buyer and seller of a house have agreed to use the Law Society formulae for exchanging contracts by telephone. They also agree to use the Standard Conditions of Sale, unamended. The parties are ready to exchange, but the buyer's solicitor has limited time available over the course of the next week and so has suggested that they exchange using Formula A. The solicitor for the seller agrees.",q:"How will the solicitors effect exchange of contracts?",opts:["Each solicitor will hold their own client's signed part of the contract and will confirm the versions are the same over the telephone. Once exchange has happened, they will then send their client's signed part to each other, and the buyer's solicitor will send the agreed deposit to the seller's solicitor to hold as stakeholder.","Prior to exchange, the buyer's solicitor will send the contract signed by the buyer to the seller's solicitor, along with the deposit. The seller's solicitor will confirm both contracts are the same over the telephone, insert the exchange and completion dates in both, and send the part signed by the seller to the buyer's solicitor.","Each solicitor will hold their own client's signed part of the contract and will confirm the versions are the same over the telephone. Once exchange has happened, they will then send their client's signed part to each other, and the buyer's solicitor will hold the agreed deposit funds as stakeholder.","Prior to exchange, the buyer's solicitor will send the contract signed by the buyer to the seller's solicitor. The seller's solicitor will confirm both contracts are the same over the telephone, insert the exchange and completion dates in both, and send the part signed by the seller to the buyer's solicitor. The buyer's solicitor will then hold the agreed deposit as stakeholder.","Each solicitor will send the other their client's signed contract. The solicitors will confirm the versions are the same over the telephone, and once exchange has happened, the buyer's solicitor will then send the deposit funds."],ans:"B",expl:"(B) Formula A is used when the solicitors think it is prudent for one solicitor to hold both contracts on exchange. Here, the buyer's solicitor has limited availability, so under Formula A, the buyer's solicitor will send the contract signed by the buyer to the seller's solicitor, along with the deposit. The seller's solicitor will confirm both contracts are the same over the telephone, insert the exchange date in both, and send the part signed by the seller to the buyer's solicitor. (A) is incorrect because it describes a Formula B exchange - where each solicitor holds their own client's part of the contract, confirms they are the same, and then sends it. Since the buyer's solicitor will have limited time here, the facts provide that the solicitors did not agree this type of exchange. (C) is incorrect both because it describes a Formula B exchange, as just explained (where each solicitor holds their own client's contract), and because under the unamended Standard Conditions of Sale, the seller's solicitor will hold the deposit funds. (D) is incorrect because whilst it generally describes a Formula A exchange, as with the previous choice, under the unamended Standard Conditions of Sale, the seller's solicitor will hold the deposit. (E) is incorrect because none of the formulae for exchange require both solicitors to send their client's contract to the other solicitor before effecting exchange of contracts.",note:"The question screen for this item runs over two scanned pages (the second repeats options A–C and adds D and E); it is included once."},{n:6,id:"PRP135",scenario:"A limited company has instructed a solicitor to act on the acquisition of a lease of shop premises. The limited company is funding the purchase with a mortgage. The company's solicitor has received the mortgage offer. The company is taking an assignment of an existing lease which has a residue of 21 years and an unregistered title.",q:"How long after completion does the solicitor acting for the limited company have to register the mortgage at Companies House?",opts:["30 days.","14 days.","2 months.","21 days.","7 days."],ans:"D",expl:"(D) If a limited company is borrowing money, it is necessary to register the charge at Companies House within 21 days. Thus, the remaining answers are incorrect."},{n:7,id:"PRP055",scenario:"On the day of completion of her purchase, a buyer discovered that the carpets, curtains, and bedroom furniture which the seller had indicated were included in the sale had been removed from the property. The buyer telephones her solicitor who checked the contract of sale. The solicitor confirmed that special condition eight of the contract included reference to the items that had been removed.",q:"Which of the following statements best describes the legal position?",opts:["The seller was not required to leave the items because special conditions are not a binding part of the contract.","The buyer is entitled to demand the specified items from the seller because they were referred to in the contract.","The seller was not required to leave the items because they were only fittings.","The buyer is entitled to demand the specified items from the seller because they are fixtures and thus, included in the sale.","The seller was not required to leave the items because they should have been referred to in the particulars of sale rather than in a special condition."],ans:"B",expl:"(B) The items were referred to in the contract and thus the buyer is entitled to them. (A) is incorrect because the special conditions are a binding part of the contract of sale. (C) is incorrect because whilst the items indeed appear to be fittings, because they were referred to in a special condition, the seller is not entitled to remove them. (D) is incorrect. The buyer is entitled to demand the items from the seller because they are referred to in the contract not because they are fixtures (carpets, curtains, and bedroom furniture would not constitute fixtures). (E) is incorrect as the place to specify items that should be left with the house is in the special conditions part of the contract; the particulars of sale refer to information such as the parties' names, whether the property is freehold or leasehold, and the completion date.",note:bn},{n:8,id:"PRP184",scenario:"A shop owner rents their shop under the terms of a lease which is protected by the Landlord and Tenant Act 1954 (Part II). The lease is due to end in two years' time. The shop owner wants to remain in the premises at the end of the term but also wants to save money. Therefore, the shop owner serves a section 26 notice on the landlord requesting a new lease at a lower monthly rent.",q:"Did the shop owner validly serve the notice requesting a new lease?",opts:["Yes, because the notice may be served any time before the end of the lease term.","No, because the notice must be served between six and 12 months before they wish the new tenancy to start.","No, because the shop owner should have served a section 25 notice.","Yes, because the notice must be served two years before they wish the new tenancy to start.","No, because the notice must be prepared by a solicitor acting for the tenant who wishes to request the new lease."],ans:"B",expl:"(B) The shop owner did not validly serve the notice requesting a new lease because a section 26 notice must be served between six and 12 months before the new tenancy is to start. The facts provide that the lease has two years to run; accordingly, the shop owner served the notice too early. (A) and (D) are incorrect because they state the wrong timescale. (C) is incorrect because a section 25 notice is the notice a landlord would serve to end the tenancy. (E) is incorrect, as it is not a legal requirement for a solicitor to draft the notice (although in this case, the tenant might wish that they had taken the advice of a solicitor to avoid the mistake that he made).",note:"The options on the answer screen are scrambled by the OCR; the order here follows the question screen, which matches the explanation."},{n:9,id:"PRP170",scenario:"Exchange of contracts for the sale and purchase of a residential dwelling took place using the Standard Conditions of Sale (fifth edition - 2018 revision) unamended. Today was the contractual completion date. The seller moved out of the property last week. The buyer's purchase money was received by the seller's solicitor at 3:28 PM today. The buyers collected the keys to the property from the estate agent and had moved their belongings into the property by 4:30 PM.",q:"Does the seller have any right to claim interest?",opts:["Yes, because completion happened after 2 PM.","No, because completion took place on the contractually agreed date.","No, because completion had taken place by 4:30 PM, which is still during working hours on the contractually agreed completion date.","No, the seller cannot claim interest for late completion unless a notice to complete was first served.","Yes, because completion happened after 3 PM."],ans:"A",expl:"(A) The time for completion under the Standard Conditions of Sale is 2 PM. If completion money is received later, completion is treated as taking place on the next working day, entitling the innocent party to interest on the balance owed at the contract rate. Here, the completion funds were received at 3:28 PM on the date set for completion. The fact that the buyers actually moved in on the agreed date does not affect this contractual provision. Therefore, (B) is incorrect. (C) and (E) are incorrect because of the 2 PM requirement provided in the Standard Conditions of Sale. (D) is incorrect, as interest at the contract rate for late completion is due as of right under the contract if completion is late; it does not require the service of the notice to complete."},{n:10,id:"PRP010",scenario:"A solicitor is acting for the buyer of a new build property on a large estate from a developer. The solicitor has carried out their pre-completion official search with priority against part of a registered title (OS2).",q:"For how long will the buyer be protected against registration of new adverse interests against the title to the property as a result of the search?",opts:["30 calendar days.","30 working days.","15 working days.","15 calendar days.","Two months."],ans:"B",expl:"(B) The official search with priority against part of a registered title protects the buyer against registration of new adverse interests against the title to the property which is the subject of the search for 30 working days. The buyer's registration application will have priority over any application for an entry to be made in the register during the 30-day period (known as the priority period) if the buyer completes and registers their title within the priority period. (Note that the OS2 priority period is the same as the priority period conferred for an official search with priority against the whole of a registered title (OS1).) (A), (C), (D), and (E) are incorrect as they do not state the correct time period. Note that 15 working days is the priority period conferred by a full land charges search in an unregistered title transaction (completion must take place during the 15 working day priority period). Two months is the time period within which an application for first registration must be made to Her Majesty's Land Registry following the purchase of an unregistered title."},{n:11,id:"ACC048",scenario:"In a particular financial year, a firm of solicitors sends bills to clients that total £550,000 in profit costs, on which the firm adds a charge for VAT. The rate of VAT at this time is 20%. In the same financial year, the firm undertakes an office refurbishment at a cost of £50,000 on which the firm is charged VAT by the various suppliers.",q:"How should the firm account to HMRC in relation to the VAT?",opts:["The amount due to HMRC would be £110,000.","The amount due to HMRC would be £100,000.","The amount due to HMRC would be £27,500.","The amount due to HMRC would be £10,000.","The amount due to HMRC would be £25,000."],ans:"B",expl:"(B) The firm will be accountable to HMRC for £100,000 (£110,000 output tax, less £10,000 input tax at a rate of 20%). (A) is incorrect because £110,000 is the full rate of output tax on the firm's profit costs with no deduction for input tax on the office refurbishment. (C) is incorrect because £27,500 is 5% of the profit costs, which is the incorrect rate of VAT, and also no deduction has been made for input tax. (D) is incorrect because £10,000 is only the amount of input tax that would be charged on the office refurbishment. This figure would be offset against any output tax the firm charged on the supply of its professional services, in this case £110,000. (E) is incorrect because £25,000 is input tax less output tax on this scenario but based on a VAT rate of 5%. The correct rate is 20%.",note:`${bn} Source slip kept: the explanation of (E) says '£25,000 is input tax less output tax'; at 5% it is output tax (£27,500) less input tax (£2,500).`},{n:12,id:"ACC015",scenario:"A firm charges a client £2,500 plus VAT of £500 in profit costs for work carried out in relation to a probate transaction. The client complains that this cost is too high and not what the client was expecting. The client refuses to pay. The firm realises there has been an error in its billing and decides to reduce the bill to £2,200 with VAT reduced to £440.",q:"Which of the following statements describes the firm's best course of action?",opts:["The firm must request that the client pay the existing bill and will refund the difference at a later time.","The firm should not disclose the error to the client and advise them to take this matter up with the SRA.","The firm should waive the entire fee as a goodwill gesture.","The firm should adjust its accounting records to take this abatement into account and send out a new bill.","The firm should reduce its fees and send a new bill out to the client, but there is no need to adjust any internal accounting records."],ans:"D",expl:"(D) This is an abatement of fees, and as such the firm should record the reduction of costs on the appropriate ledgers and send the client out a new bill. (A) is incorrect. As the firm has realised its error, it should not request payment in full from its client; it should simply send a new bill out. (B) is incorrect. A firm is obliged to abide by the SRA Accounts Rules as well as the overall principles set out in the Code of Conduct. Once an error has been identified, it must be rectified without delay. It would be inappropriate to not disclose this matter to a client and send them to the SRA, as the SRA would penalise the firm in this circumstance, in any event. (C) is incorrect because the firm need not waive its entire fee; it must rectify its error. (E) is incorrect because the firm must note the reduction of costs on the appropriate ledgers in its internal accounting records."},{n:13,id:"PRP179",scenario:"The landlord of a number of factory units on a business park wants to regain possession of the last unit on the site. The unit is occupied by a tenant under the terms of a lease which is protected under the Landlord and Tenant Act 1954 (Part II). The landlord has submitted a planning application to the local authority to redevelop the factory units into a hotel and gym complex which he thinks will be more lucrative than the factory units. The tenant has always complied with their covenants under their lease.",q:"Can the landlord bring the tenancy to an end?",opts:["Yes, if the landlord serves a valid section 25 notice and relies on the ground that the landlord wants to demolish or reconstruct the premises.","Yes, if the landlord serves a valid section 26 notice and relies on the ground that the landlord wants to demolish or reconstruct the premises.","No, because the lease is protected by the Landlord and Tenant Act 1954 (Part II), so the landlord cannot bring the tenancy to an end.","No, because the tenant must bring the tenancy to an end by serving a valid section 26 notice.","No, because the landlord cannot demonstrate that the tenant has failed to comply with the tenant covenants under the terms of the lease."],ans:"A",expl:"(A) The landlord can bring the tenancy to an end by serving a valid section 25 notice on the ground that they want to demolish or reconstruct the premises. This is indicated in the question because the landlord has applied for planning permission and wishes to build a hotel and gym complex. (B) is incorrect because the tenant (not the landlord) serves a section 26 notice to declare their desire to request a new lease. (C) is incorrect because a landlord can bring a protected tenancy to an end by serving a valid section 25 notice and relying on one of the grounds contained in the 1954 Act. (D) is incorrect because, as indicated already, the landlord can bring a tenancy to an end provided they can make out one of the grounds for possession specified in the 1954 Act. (E) is incorrect because whilst the breach of certain tenant covenants are statutory grounds for terminating a tenancy at the end of the lease term, there are other grounds under which the landlord may seek to terminate, including the desire to demolish or reconstruct here, as well as the availability of suitable, alternative premises for the tenant and the landlord's desire to move into the premises."},{n:14,id:"ACC020",scenario:"A firm is holding £5,000 on account of costs for a client and has recently made some payments on behalf of the client. This firm will always use client money where appropriate and when there are sufficient funds available.",q:"Which of the following payments will be shown on the client side of the client's ledger?",opts:["A court fee of £100.","A taxi fare of £26 paid from petty cash.","An expert's fee of £300 plus £60 VAT addressed to the firm.","A bill for £2,000 plus £400 VAT from legal counsel, paid with a cheque sent to the firm by the client, and the payee on the cheque was legal counsel.","Professional charges totalling £500 for a surveyor, paid by way of cheque made out to the surveyor and sent by the client."],ans:"A",expl:"(A) This is the only payment that would be shown on the client account. (B) is incorrect because petty cash must always come from the business account. (C) is incorrect because the bill was addressed to the firm, so the firm is the principal. Therefore, payment must come from the business account. (D) and (E) are incorrect. Unless a cheque is addressed to the firm, it cannot do anything with it but pass it on to the addressee.",note:"The OCR displaces '(A)' and the word 'cheque' to the end of this explanation; it has been reassembled in reading order."},{n:15,id:"PRP037",scenario:"A husband and wife have instructed a conveyancing solicitor regarding the sale of their matrimonial home. The property is owned in their joint names. The wife's mother has lived at the property with them for the last 15 years and is concerned about where she will live after the sale completes. The wife asks the conveyancing solicitor to represent the mother as well in the transaction for convenience.",q:"How should the solicitor respond to this request?",opts:["The solicitor should decline to act for the mother due to the risk of a conflict of interest.","The solicitor should agree to act for the mother in addition to the husband and wife since the parties' interests are the same.","The solicitor should agree to act for the mother because the mother is a co-owner of the property.","The solicitor should cease acting for the husband and wife and decline to act for the mother due to the risk of a conflict of interest.","The solicitor should agree to act for the mother because the solicitor must act in accordance with the wife's instructions."],ans:"A",expl:"(A) The solicitor should decline to act for the mother due to the risk of a conflict of interest. A solicitor must avoid a conflict of interest or 'significant risk' of a conflict of interest between two or more clients on a transaction. Here, the mother has expressed concerns about where she will live after the property is sold, and it is possible she has rights in the property despite the fact that she is not a co-owner of the legal estate. Thus, the solicitor should decline to act for the mother due to the significant risk of a conflict arising. (B) is incorrect because, as explained above, the mother's and the husband's and wife's interests could come into conflict in this transaction and the solicitor should therefore decline to act for the mother. (C) is incorrect. The mother is not a co-owner of the legal estate, and regardless of the status of her rights in the property, the solicitor may not act for her due to the significant risk of a conflict arising. (D) is incorrect because the solicitor does not need to cease representation of the husband and wife. The solicitor needs only to avoid the significant risk of a conflict arising by declining to represent the mother in addition to the husband and wife. (E) is incorrect because, as explained above, the solicitor must avoid a conflict of interest and must decline to represent the mother despite the wife's request."},{n:16,id:"PRP203",scenario:"A company is owed £10,000 by a debtor. The company has obtained a court order and applies to Her Majesty's Land Registry ('HMLR') to register a notice against the charges register of the title to the debtor's property. The company receives a notification from HMLR that there is an official search with priority against the title which was registered five days before their application was submitted.",q:"What will happen to the debtor's application?",opts:["It will be registered against the charges register by HMLR.","It will be held by HMLR until the expiry of the priority period.","HMLR will reject the debtor's application.","It will be registered against the property register by HMLR.","It will be registered against the proprietorship register by HMLR."],ans:"B",expl:"(B) The application will be held by HMLR until the expiry of the priority period. Any application which is received during the 30-working day priority period is treated as pending during the priority period. If the person or organisation with the benefit of the priority search makes the application for registration within the priority period, the debtor's application will fall away. If the person or organisation with the benefit of the priority search do not register within the priority period, the debtor's application will be registered on the register of title (assuming that it is a valid application). Thus, the remaining answers are incorrect.",note:`${bn} Source slip kept: the question and explanation refer to 'the debtor's application', but on the facts the application is the company's (the creditor's).`},{n:17,id:"ACC006",scenario:"A solicitor is acting for a client in a conveyance. The client provides the solicitor with £1,000 and has asked the solicitor to pay a surveyor on the client's behalf.",q:"Which of the following statements best describes what the solicitor should do?",opts:["The solicitor should record the receipt of the client money on the client ledger and promptly place the money in the client account.","The solicitor does not need to record the receipt but should promptly place the money in a safe until it is time to pay the surveyor.","The solicitor should place the money in the client account.","The solicitor does not need to record the receipt of client money and should promptly pay the £1,000 to the surveyor.","The solicitor should open a new client ledger for the surveyor and record the receipt there."],ans:"A",expl:"(A) Client money (subject to certain exceptions which do not apply here) must be promptly paid into a client account. The firm should record the receipt on the client's ledger. (B) and (C) are incorrect as they do not require the solicitor to record the receipt, and in the case of (B), it is not sufficient to hold the money in a safe. (D) is incorrect both because the solicitor should record the receipt and because the payment must go into the client account before it is paid to the third party. (E) is incorrect as the surveyor is not the solicitor's client - client ledgers are for clients.",note:bn},{n:18,id:"PRP106",scenario:"A homeowner is irritated that his neighbour has started to run a car repair business from his garage at his home. The homeowner has noticed a significant increase in traffic to the area and is annoyed at the noise caused by the neighbour's work to the cars. The neighbour has put up a sign advertising his car repair business. The homeowner tells the local authority about the business which is now taking place in a residential area.",q:"How long does the local authority have to take enforcement action against the homeowner's neighbour?",opts:["Four years.","One year.","There is no time limit.","Five years.","Ten years."],ans:"E",expl:"(E) Running the car repair business from a residential area would be sufficient to constitute a material change of use from a planning point of view, in which case the local authority has a 10-year enforcement period. Thus, the remaining answers are incorrect."},{n:19,id:"PRP026",scenario:"A bank has repossessed a property and has obtained an order for possession. The bank has instructed a solicitor to act for it in relation to the sale of the property.",q:"Which title guarantee is most appropriate in this circumstance?",opts:["No title guarantee.","Limited title guarantee.","Full title guarantee.","Indemnity title guarantee.","Unregistered title guarantee."],ans:"A",expl:"(A) No title guarantee is most appropriate in this circumstance. No title guarantee is typically given when a seller has no knowledge of the property at all, for example, a mortgagee in possession, as the bank is here. (B) is incorrect. A limited title guarantee is narrower in scope than a full title guarantee; in it, the seller merely warrants that the seller has not created any charges or granted any rights during their period of ownership that have not been disclosed in the contract. This type of guarantee is typically given by a seller with less knowledge or involvement with the property and is appropriate when, for example, the seller is a personal representative. (C) is incorrect. A full title guarantee includes a guarantee that the seller is entitled to sell the property, that they will do all in their power to transfer the purported title to the buyer, and that they are selling the property free from all charges or encumbrances other than those disclosed in the contract. This type of guarantee is generally given by a seller who owns the full legal and equitable interest in the property and has lived at the property. (D) and (E) are incorrect. There are no such title guarantees.",note:bn},{n:20,id:"PRP155",scenario:"A man has decided to sell his home in Sheffield so that he can retire to Christchurch in Dorset. The solicitors for the parties have agreed to use the Law Society's Conveyancing Protocol and the Code for Completion by Post. Contracts have already been exchanged, which incorporate the Standard Conditions of Sale unamended.",q:"Which of the following is a requirement under the Code after the sale proceeds are received?",opts:["The buyer's solicitor will date the executed transfer and send it to the seller's solicitor by first class post or document exchange no later than five days after the date of completion.","The buyer's solicitor will date the executed transfer and send it to the seller's solicitor by first class post or document exchange by no later than the day after completion.","The seller's solicitor will date the executed transfer and send it to the buyer's solicitor by first class post or document exchange no later than five days after the date of completion.","The seller's solicitor will date the executed transfer and send it to the buyer's solicitor by first class post or document exchange no later than the day after completion.","The seller's solicitor will date the executed transfer and send it to the buyer's solicitor by first class post or document exchange no later than the close of business on the day of completion."],ans:"D",expl:"(D) The Code for Completion by Post provides that after completion, the seller's solicitor must act as agent for the buyer's solicitor, meaning that once the sale proceeds are received, the seller's solicitor will date and send the executed transfer (and any other relevant documents) to the buyer's solicitor not later than the end of the working day following completion. Note that the seller's solicitor is also required to confirm to the buyer's solicitor and to whomever holds the keys (such as an estate agent) - by telephone, fax, or email - the date and time at which completion has taken place. This notice must be given as soon as possible after completion. (A) and (B) are incorrect because it is the seller's solicitor who completes the completion documents. (A) is also incorrect in that it states the wrong timescale. (C) and (E) are incorrect for that same reason."},{n:21,id:"PRP148",scenario:"A solicitor is acting for a buyer on the sale of a residential property. Exchange of contracts has taken place using the Contract incorporating the Standard Conditions of Sale (fifth edition - 2018 revision) unamended. The solicitor has heard that the buyer may not receive their mortgage advance by the completion date. The seller's solicitor is concerned that completion may be late.",q:"By what time on the completion date must the purchase money be received?",opts:["1:30 PM","1 PM","2 PM","2:30 PM","12 PM"],ans:"C",expl:"(C) The standard conditions of sale require completion to take place by 2 PM. If the buyer does not supply the funds due by this time, then completion is treated as taking place on the next working day. Thus, the remaining answers are incorrect.",note:"Source wording kept: the facts say the solicitor acts 'for a buyer on the sale' of the property."},{n:22,id:"PRP079",scenario:"A solicitor in a commercial property department has been asked to attend to the registration of a transaction. The solicitor checks the file and sees that their client has taken an assignment of an existing lease, the residue of which is 10 years. The solicitor does not think that they need to make an application to Her Majesty's Land Registry and return the file to the cabinet.",q:"Is the solicitor correct?",opts:["Yes, the assignment of an existing unregistered lease does not require registration.","Yes, as a lease is not registrable in its own right regardless of length.","Yes, as the residue is for less than 21 years, the lease is not registrable.","No, because an assignment of lease with a residue of more than five years is registrable.","No, because an assignment of lease with a residue of more than seven years is registrable."],ans:"E",expl:"(E) If a lease is unregistered and is assigned and, at the date of the assignment, has seven years or more to run, it is registrable on completion of the assignment. Thus, the remaining answers are incorrect."},{n:23,id:"PRP112",scenario:"A company director is interested in purchasing an office block which has recently had building work carried out to it. The company director wants to know whether planning permission has been granted for the work.",q:"How will the company director's solicitor find out this information?",opts:["By carrying out a drainage and water search.","By carrying out a bankruptcy search.","By carrying out a survey.","By carrying out a local search.","By carrying out an environmental search."],ans:"D",expl:"(D) The local search reveals the planning and building regulation history relating to a property. (A) is incorrect because a drainage and water search reveals whether the property is connected to public foul drainage and water systems. (B) is incorrect because a bankruptcy search is carried out against the buyer's name if the buyer is taking out a mortgage. (C) is incorrect. The survey reports on the physical condition of the property. It does not reveal planning and building regulation documents. (E) is incorrect as the environmental search reveals whether the land has been put to contaminative use in the past or might be subject to flood risk."},{n:24,id:"PRP120",scenario:"A solicitor is acting for a buyer who is purchasing a residential dwelling. The solicitor has performed their initial investigation of title and received the search results and the seller's Property Information Form. Based on this, the solicitor sees a number of issues which need to be resolved.",q:"What will the solicitor do next in relation to these issues?",opts:["Raise pre-contract searches of the seller's solicitor.","Raise pre-completion searches of the seller's solicitor.","Raise post-contract enquiries of the seller's solicitor.","Raise pre-contract enquiries of the seller's solicitor.","Raise pre-completion enquiries of the seller's solicitor."],ans:"D",expl:"(D) To resolve issues raised by the initial investigation of title and the Property Information Form ('PIF'), the buyer's solicitor would raise pre-contract enquiries of the seller's solicitor. We know we are in the pre-contract stage because that is when the initial investigation of title occurs and when the PIF is received. (B) and (E) are incorrect because 'pre-completion' indicates that contracts have exchanged, and we have clearly not reached that stage under the facts. (A) is incorrect because the solicitor would raise pre-contract enquiries (not searches). (C) is incorrect both because we call the period after contracts are exchanged 'pre-completion' (rather than 'post-contract') and because, as already indicated, we are clearly not yet at the pre-completion stage.",note:bn},{n:25,id:"PRP052",scenario:"A farmer is selling a field beneath which runs a water pipe. The farmer allowed the owner of a neighbouring property to connect into the water pipe some years ago. The farmer does not want to deter a buyer from purchasing the field and asks his solicitor not to refer to the water pipe in the contract of sale.",q:"How should the farmer's solicitor respond to his client?",opts:["The solicitor should inform his client that the seller's duty of disclosure is narrow in scope and it is not necessary to refer to the water pipe in the contract.","The solicitor should inform his client that the water pipe is a latent defect which must be disclosed in the contract.","The solicitor should inform his client that the water pipe is a patent defect which must be disclosed in the contract.","The solicitor should inform his client that it is not necessary to refer to the water pipe unless the issue comes up in the buyer's pre-contract enquiries.","The solicitor should inform his client that the right of the neighbouring landowner to use the water pipe should be formalised in a deed of easement."],ans:"B",expl:"(B) The solicitor should inform his client that the water pipe is a latent defect, and latent defects must be disclosed in the contract. A latent defect is one which is not discoverable from inspection of the property. Since a buyer would not be able to discover an underground water pipe through a normal inspection, it, and the neighbour's right to use it, should be disclosed in the contract. (A) is incorrect. It is true that the seller's duty of disclosure is narrow in scope, but a latent defect is one of the exceptions, meaning that it is necessary to refer to it in the contract. (C) is incorrect as the water pipe is a latent defect (one not discoverable by inspection) as opposed to a patent defect (one discoverable by inspection). (D) is incorrect for the reasons discussed above; because this is a latent defect, it must be disclosed regardless of whether it is raised in an enquiry by the buyer. (E) is incorrect. Whilst a deed of easement may be a practical solution to deal with the informal arrangement, this does not actually answer the question which related to the contents of the contract of sale."},{n:26,id:"PRP111",scenario:"A buyer is interested in purchasing a house which has recently had building work carried out to it. The buyer wants to know whether a building regulations completion certificate has been issued for the work.",q:"How will the buyer's solicitor find out this information?",opts:["By carrying out a local search.","By carrying out a drainage and water search.","By carrying out a bankruptcy search.","By carrying out a survey.","By carrying out an environmental search."],ans:"A",expl:"(A) The local search reveals the planning and building regulation history relating to a property. (B) is incorrect because a drainage and water search determines whether the property is connected to public foul drainage and water systems. (C) is incorrect because a bankruptcy search is carried out against the buyer's name if the buyer is taking out a mortgage. (D) is incorrect. The survey reports on the physical condition of the property. It does not reveal planning and building regulation documents. (E) is incorrect as the environmental search reveals whether the land has been put to contaminative use in the past or might be subject to flood risk.",note:bn},{n:27,id:"ACC052",scenario:"A solicitor has completed a commercial transaction and must close the client's account. There is a credit on the client account for £500. The solicitor immediately makes a payment to her client of £500.",q:"Which one of the following entries would be the most appropriate entry to record this payment?",opts:["Credit cash account - client side; Debit client ledger - client side","Credit cash account - business side; Debit client ledger - client side","Debit cash account - business side; Debit client ledger - business side","Debit cash account - client side; Debit client ledger - client side","Debit cash account - client side; Credit client ledger - client side"],ans:"A",expl:"(A) The payment should be recorded as a debit in the client ledger - client side, as the firm would need to debit the client account to send her the money. The corresponding entry would be a credit entry in the cash account, as the firm no longer owes this money to the client. (B) is incorrect as this is not business money and so should not be reflected on the business side. (C) and (D) are incorrect because there should be a corresponding credit to match the debit entry. (E) is incorrect because the payment should not be reflected as a credit to the client account."},{n:28,id:"ACC062",scenario:"A firm of solicitors issues a bill to its client. The bill is comprised of the firm's professional charges plus VAT, a search fee from the land registry, which the firm has already paid, and legal counsel's fee, which the firm has not paid. The client has sent the firm a cheque for the entire sum.",q:"Which of the following statements best describes how the cheque from the client should be handled?",opts:["The cheque is client money and must be placed promptly in the client account.","The cheque must be placed in the client account and any business money should be transferred promptly.","The cheque should be returned to the client with a request for separate payment for each item.","The cheque is client money and should be placed in the client account indefinitely.","The cheque is business money and the entire sum must be placed promptly in the business account."],ans:"E",expl:"(E) As a bill has been issued including the disbursements, the cheque does not include any client money and so should be placed into the business account. (A) is incorrect as this receipt does not contain client money. (C) is not the best method of dealing with this cheque, as it would cause the client a great deal of inconvenience. (B) and (D) are incorrect as we know the receipt is not client money.",note:"Possible source slip: counsel's fee is unpaid, so under SRA Accounts Rules rule 2.1(d) the part of the payment relating to it would ordinarily be client money. The source's answer (E) is kept unchanged."},{n:29,id:"PRP070",scenario:"A solicitor is acting for two business partners who are interested in buying the freehold of a building in their local High Street. They would like to renovate the building and open a restaurant on the premises. They have obtained a copy of a transfer dated 3 November 2008, which contains the following clause: 'Within 10 years of the date of the transfer, the property shall not be used as anything other than a single private dwelling house.' The business partners have obtained planning permission for the building work and change of use which they require.",q:"What advice should the solicitor give the partners with respect to the covenant?",opts:["That they are not bound by the covenant because they were not original parties to the 2008 transfer.","That the covenant would apply to them as successors of title so they should seek the consent of the party with the benefit of the covenant to the change of use.","That they can ignore the covenant as it was made more than 10 years ago.","That the covenant would apply to them as successors of title so they should require the seller to meet the cost of breach of restrictive covenant indemnity insurance.","That they should not proceed with the purchase because the restrictive covenant is relatively recent, and they are unlikely to be able to obtain indemnity insurance for the breach of covenant."],ans:"C",expl:"(C) The potential buyers can ignore the covenant as it was made more than 10 years ago. This question shows that it is crucial to pay close attention to the facts of each question. Although there is a restrictive covenant in the facts and the potential buyers' use is prohibited by the covenant, the covenant was for only 10 years, and more than 10 years have elapsed since the covenant was made. (A) reaches the correct result for an incorrect reason: successors in title can be bound in equity by a negative restrictive covenant even though the successors were not parties to the covenant. The remaining choices are incorrect as they are based on the premise that the covenant is enforceable."},{n:30,id:"PRP006",scenario:"A woman attends a solicitor's office and explains that she wants to purchase a residential property for £200,000. She has £4,000 to use for the deposit and intends to borrow the balance required for the purchase from a bank.",q:"Can the woman's transaction proceed on this basis?",opts:["No, because the standard conditions of sale require a deposit of 10% of the purchase price to be paid on exchange of contracts, and this term cannot be modified by the parties.","No, because the standard conditions of sale require a deposit of 20% of the purchase price to be paid on exchange of contracts, and this term cannot be modified by the parties.","Yes, because the standard conditions of sale do not contain any required deposit amount.","Yes, because although the standard conditions of sale require a deposit of 10% of the purchase price to be paid on exchange of contracts, the parties may negotiate a smaller deposit.","Yes, because the standard conditions of sale require a deposit of 2% of the purchase price to be paid on exchange of contracts and that is what the woman proposed."],ans:"D",expl:"(D) The woman's transaction may proceed because although the standard conditions of sale require a deposit of 10% of the purchase price to be paid on exchange of contracts, it is possible to negotiate a reduced deposit. Thus, the woman and her solicitor can try to negotiate with the seller's solicitor for a reduced deposit on exchange (though there is no guarantee the negotiation will be successful). (A) is incorrect because, as explained above, though a 10% deposit is required by the standard conditions of sale, it is possible for the parties to modify this term by negotiating a lesser amount. (B) is incorrect both because the standard amount is 10% (not 20%) and because, as explained, the amount is negotiable. (C) and (E) are incorrect because, as explained, the standard conditions include a standard amount of 10%."},{n:31,id:"ETH040",scenario:"A probate solicitor is good friends with an estate agent who often takes the solicitor to golf club days out and for expensive meals. The solicitor regularly recommends the estate agent to his clients, informing each client of his personal relationship with the estate agent and urging the client to contact them. Out of loyalty to the estate agent, the solicitor does not recommend any other estate agents to clients, but he sincerely believes that the estate agent is competent.",q:"Are the solicitor's actions in accordance with the SRA Standards and Regulations?",opts:["No, because the recommendations might not be in the best interests of each client.","Yes, because the solicitor has not taken any money from the estate agent.","No, because accepting the meals and hospitality from the estate agent amounts to a prohibited referral fee.","Yes, because the solicitor does not have a financial interest in the estate agent's business.","Yes, because the solicitor informs clients of his personal relationship with the estate agent."],ans:"A",expl:"(A) The Principles provide that a solicitor must act with independence, and in each client's best interests. Therefore, when a solicitor recommends a particular person or business to a client, the recommendation must be in the best interests of that particular client and must not compromise the solicitor's independence. Here it appears that the solicitor is not acting with independence because he will not recommend any other estate agents out of loyalty to this estate agent, even though there might be other estate agents who are more suited to a client's specific needs. The fact that the solicitor has not received payments of money from the estate agent is irrelevant; the meals and golf days might be seen as inducements, which indicate that the solicitor has been persuaded to recommend the estate agent when it is not in the best interests of the clients to do so. (B) is therefore incorrect. (C) is incorrect because a 'prohibited referral fee' is the payment or receipt of referral fees in claims for damages following personal injury or death and is not relevant here. (D) is incorrect because even though the solicitor does not have a financial interest in the estate agent's business, he is not acting with independence or in the clients' best interests. (E) is incorrect. It is true that a solicitor must inform the client of any interest they have in referring the client to another person, but even if the solicitor does this, they still must act with independence and in the best interests of the client when making the referral.",note:"Option (C) is garbled on both screens; '[No,]' at its start is inferred from the pattern of the options and the explanation. The rest of the wording is pieced together from both screens."},{n:32,id:"PRP071",scenario:"A woman is interested in buying a paddock for her horses. Access to the public highway is important to her. She sees the following statement on the estate agent's particulars of sale: 'The property benefits from a right-of-way over the eastern side of the neighbouring field to access the nearest public highway, known as The Common Lane.' The woman's solicitor has sent her a seller's register of title.",q:"Where should reference to the right-of-way appear on the title?",opts:["The Proprietorship Register.","The Charges Register.","The conveyance which created the right-of-way.","The Property Register.","The deed of easement which created the right-of-way."],ans:"D",expl:"(D) The Property Register. The woman is interested in buying a property with the benefit of the right-of-way. The question makes it clear that the title is registered. If a registered title benefits from any rights, these would appear on the Property Register. (A) is incorrect as the Proprietorship Register specifies the class of title held and the name of the current holder or holders of the legal estate. (B) is incorrect as the Charges Register contains details of encumbrances on the land, that is, entries which adversely affect the land. (C) and (E) are incorrect because the facts ask specifically where the reference should appear on the title - and the question makes it clear this is a registered title. It might be necessary to look at a conveyance or deed if the right-of-way is not yet registered."},{n:33,id:"ACC059",scenario:"A solicitor acts for a corporate client on a commercial transaction. The client is registered for VAT. The solicitor pays an expert's fee of £7,000 plus VAT of £1,400 on behalf of the client and receives an invoice addressed to the client.",q:"Which of the following statements is correct with respect to these events?",opts:["The principal method applies and the solicitor should use business money to pay the invoice.","The solicitor must use petty cash to pay the invoice.","The agency method applies, and the solicitor can use client money to pay the invoice.","The solicitor should issue the client a VAT invoice for £1,400.","The solicitor must record £1,400 on its own HMRC VAT ledger."],ans:"C",expl:"(C) The agency method must be used here as the invoice is addressed to the client. If there are sufficient funds in the client account, the entire amount should be debited from the client account, without distinguishing between the fee and VAT. (A) is incorrect because the agency method, not the principal method, applies here and will be used. (B) is incorrect. Petty cash would not be used here as this is not an expense of the firm; it is the client's. Also, typically petty cash is used only to deal with small payments, and the payment here is not small. (D) is incorrect. A firm should issue VAT invoices only in relation to its own professional charges/supply of goods; here, it should simply pass the original invoice, including the VAT element, on to the client. (E) is incorrect as only VAT related to the solicitor's professional charges is recorded on its HMRC VAT ledger.",note:bn},{n:34,id:"ACC024",scenario:"On completion of a property transaction worth £1,500,000, the solicitor is informed by the bank that £175 interest on client funds held in a client account has accrued. There is an outstanding bill of £1,500 plus VAT for professional services and disbursements of £75.",q:"Which of the following statements is not true with respect to the interest?",opts:["The solicitor can offset the interest to clear the disbursements.","The solicitor can offset the interest to clear part of the professional fees and/or disbursements.","There is no obligation on the solicitor to account to the client if the client has agreed to this at the outset of the transaction.","The solicitor must always account to the client for all of the interest accrued on the client's funds.","The solicitor should account to the client for a fair sum of interest accrued on the client's funds."],ans:"D",expl:"(D) It is not true that a solicitor must account to its client for all interest. The SRA Accounts Rules provide that a solicitor should account for a fair sum of interest unless the client has agreed an alternative arrangement. (A) and (B) are true because the solicitor can choose to offset any interest payments against other amounts owed by the client to the firm for payment of bills. (C) is true because a solicitor and client can reach an agreement to contract out of the provisions of the rules on payment of interest. (E) is true because the solicitor should account to the client for a fair sum of interest."},{n:35,id:"ACC008",scenario:"A principal in a law firm, together with their spouse, is buying a house and selling their existing one. The principal asks an associate in the firm to act for them in the conveyance.",q:"Which of the following statements is true with regard to this representation?",opts:["Any deposit received and held for the principal and their spouse as agent is business money.","Any deposit received and held for the principal and their spouse as agent must be shown on a separate 'stakeholder' ledger.","Any money advanced from the principal and their spouse's mortgage company must be recorded on their client ledger.","Any deposit received and held for the principal and their spouse as agent must be recorded on their client ledger.","Any deposit received and held for the principal and their spouse as stakeholder can be recorded on their client ledger."],ans:"D",expl:"(D) When a firm acts as an agent for sellers who are its client, money the firm holds as agent belongs to the sellers. Thus, these funds must be recorded on the client ledger for the principal and their spouse. It is irrelevant that the associate is acting for a principal of the law firm and their spouse; the deposit is still client money. (A) is incorrect as any deposit received and held for the principal and their spouse as agent is client money. (B) is incorrect as the deposit held jointly for the principal and their spouse must be shown on their existing client ledger because money held as agent belongs to the sellers. (C) is incorrect because in any property transaction, if the firm is provided with a mortgage advance for its client to assist with the purchase of the property, the mortgage advance belongs to the mortgage company until completion and so must be recorded as such. (E) is incorrect because stakeholder money is held jointly for the sellers and the buyers and must be recorded on a separate stakeholder ledger."},{n:36,id:"PRP113",scenario:"A first-time buyer has put in an offer to buy a property which has recently been extended by the seller. The first-time buyer has instructed her solicitor and has paid money on account of searches. The first-time buyer is very cautious and wants to be sure that all is in order regarding the extension. She telephones her solicitor to discuss this point.",q:"How would the solicitor find out more detail about the extension and the documentation relating to it?",opts:["From looking at the results of a local planning search and Property Information Form.","From looking at the replies to enquiries and the results of a local search.","From looking at the Property Information Form and the results of a local search.","From looking at the drainage and water search and Property Information Form.","From looking at the results of a local search and drainage and water search."],ans:"C",expl:"(C) To find out more about the extension, the solicitor would look at the Property Information Form ('PIF') and the results of a local search. The seller should disclose the fact that they have carried out building works on the PIF. Details of the planning and building regulation documentation will be revealed by the local search. (A) is incorrect as there is no such thing as a local planning search. (B) is not as good an answer as (C) as the PIF would be the starting point; it would be the basis of enquiries, but it might be that enquiries are not needed, depending on what is provided in the PIF. (D) and (E) are incorrect as the drainage and water search reveals whether the property is connected to the public foul drainage system and public water supply and is not related to the extension."}],kc="The options on the question screen are partly scrambled by the OCR; the option order and wording here follow the answer-discussion screen, which matches the explanation.",Cc="The question screen for this item appears twice in the PDF (the second copy scrolled down); it is included once.",i1=[{n:1,id:"ETH108",scenario:"A solicitor is contacted by the daughter of an elderly client who wants to know what is in her mother's will. She is her mother's next of kin, but is not a beneficiary or executor under the will.",q:"Should the solicitor tell the daughter what the client's will contains?",opts:["Yes, because the daughter is the client's next of kin.","Yes, because the contents of the will are not confidential and therefore may be disclosed to a third party.","No, because the contents of the will are confidential and must not be disclosed to anyone without the client's consent.","No, because the daughter is not a beneficiary or executor under the will and is therefore not entitled to know what the will contains.","Yes, because the daughter is not a beneficiary or executor under the will, and therefore should be given the opportunity to discuss the will with her mother while she is still alive."],ans:"C",expl:"(C) A solicitor must keep the affairs of clients confidential unless the client consents or disclosure is required or permitted by law. (A) and (E) are incorrect because the solicitor is not permitted to disclose confidential information merely because the daughter is the client's next of kin, or because the daughter is not a beneficiary or executor under the will. (B) is incorrect because the contents of the client's will are confidential. Assuming the client still has mental capacity, only the client can consent to the disclosure of the contents of her will. (D) is incorrect because it gives the wrong rationale; the solicitor is not permitted to disclose the details of the will because the information is confidential."},{n:2,id:"WEA022",scenario:"A woman executed a will 10 years ago. The woman died two months ago. The personal representative for the woman's estate determines that the woman died intestate.",q:"Which of the following events would lead the personal representative to the conclusion that the woman died intestate?",opts:["The woman divorced her husband after making the will.","The woman tore up the will last year, and no witness was present at the time.","One of the beneficiaries was a witness to the will.","The person named as executor in the will died before the woman died.","The woman made a manuscript amendment to one of the gifts in the will after the will had been validly executed."],ans:"B",expl:"(B) The woman will be deemed to have died intestate if she tore up her will. A will may be revoked through its intentional destruction by the testator. If a will is found mutilated when the testator died, it will be presumed the testator mutilated the will with the intention to revoke it. Similarly, if a will was last known to be in possession of the testator and it cannot be found when the testator dies, a presumption arises that the testator intentionally revoked it. As there was no witness to testify that the tearing was other than intentional, the presumption will apply, and the will will be treated as having been intentionally revoked through destruction. (A) is incorrect. If a testator divorces after executing a will, gifts to the testator's former spouse will fail, but the will is not automatically revoked by the divorce. (C) is incorrect. A beneficiary witnessing the will does not invalidate the will, although the gift to that beneficiary will fail. (D) is incorrect. If the executor named in a will dies before the testator, the will itself is still valid, but an administrator will be appointed to administer the estate under the will instead. (E) is incorrect. As a general rule, a will may not be amended after it is executed unless the amendment is executed with the formalities for executing a will. Otherwise, the amendment generally has no effect."},{n:3,id:"TRU068",scenario:"In her will a woman left all her estate to trustees to hold on trust for her daughter for life and on her death to her grandchildren in equal shares. The daughter has requested the trustees to use some of the fund to purchase a house in France to be used as a holiday home for the family and to be rented commercially when not in use.",q:"If the trustees refuse the request, what is the most likely reason?",opts:["The daughter has no interest in the capital of the fund.","The purchase of the house would not benefit the grandchildren.","The use of a house as a residence is not an investment.","The purchase would be an unauthorised investment.","The trustees must act impartially between the beneficiaries."],ans:"D",expl:"(D) The trustees would refuse the request because the purchase would be an unauthorised investment. Trustees must invest in authorised investments. They have power to purchase land in the UK as an investment, as a residence for a beneficiary, or for any other reason, but they have no power to buy land outside the UK. (A) is incorrect because the request relates to a trustee investment, not to the exercise of the trustees' power to advance capital. (B) and (E) are incorrect because, although the trustees' duty is to act impartially between the beneficiaries, there is no reason why the purchase of land as a residence should not benefit the grandchildren by bringing capital growth. (C) is incorrect because trustees have express power to purchase land as an investment, as a residence for the beneficiaries, or for any other reason."},{n:4,id:"TRU028",scenario:"Last year a man transferred shares into the name of his adult grandson. No reason was given for the transfer. The man now claims that he made the transfer because he feared that he would be liable for a large legal claim and he wanted to keep the shares out of reach of his potential creditors. The claim has not materialised, and he wishes to claim the shares back. His grandson refuses to hand the shares over.",q:"Which of the following statements best describes the man's position?",opts:["The court will not allow the man to reclaim the shares because it will not hear evidence of his illegal purpose.","The court will not allow the man to reclaim the shares because there was no declaration of trust.","The court will allow the man to reclaim the shares because the illegal purpose was not carried out.","The court will not allow the man to reclaim the shares because it is presumed that he intended to make a gift.","It will be for the court to decide whether the man may reclaim the shares depending on whether it is in the public interest."],ans:"E",expl:"(E) If a property transfer was made as part of an illegal or fraudulent transaction, the court must decide whether it is in the public interest to allow the claim. The court would take into account all relevant factors, including the underlying purpose of the relevant law and the respective conduct of the parties. In these circumstances, the court would likely consider whether creditors have in fact been deceived, whether the grandson was aware of the scheme, and the effect on either party of allowing the man's claim. (A) is incorrect because, as noted above, the court will decide based on the relevant factors. The claimant does not need to plead the illegal purpose. (B) is incorrect because if the court decides to allow the claim because it is in the public interest, no declaration is required. (C) is not the best answer because while the court will consider whether the illegal purpose was carried out, that factor by itself is not definitive, as discussed above. (D) is incorrect because, as discussed above, the court will decide based on all of the relevant factors."},{n:5,id:"WEA069",scenario:"A man died intestate, survived by his civil partner and so[n. At the date of his death,] the assets in his sole name totalled £500,000, comprising the family home (£350,000), personal belongings (£50,000), and £100,000 in bank accounts.",q:"Which of the following best describes how the man's estate will be distributed?",opts:["The man's civil partner will be entitled to a statutory legacy of £250,000 only.","The man's civil partner will have no entitlement to the man's estate, and the whole estate will pass to the man's son.","The man's estate will be split so that the civil partner and son receive half each.","The man's civil partner will be entitled to the man's personal belongings, a statutory legacy of £270,000, and half of the remaining assets.","The man's son will be entitled to receive the man's personal belongings only."],ans:"D",expl:"(D) The man's civil partner will be entitled to the man's personal belongings, a statutory legacy of £270,000, and half of the remaining assets. The rules of intestate succession apply when a person dies without a will. Under these rules, when the deceased is survived by a spouse or civil partner and issue, the spouse or civil partner will receive personal chattels, £270,000, and one-half of the residue. The deceased's issue will take the other half of the residue. Here, therefore, the man's civil partner and son will be entitled to share the estate. The civil partner will receive the personal belongings, a statutory legacy of £270,000, and half of the remaining assets only. The other half of the remaining assets will pass to the man's son. (A), (B), (C), and (E) are, therefore, incorrect.",note:"The top of the facts is cut off and jumbled in the scan; the bracketed words are inferred from the explanation, which refers to 'the man's civil partner and son'. Source point kept: the statutory legacy of £270,000 applied to deaths from 6 February 2020; for deaths on or after 26 July 2023 it is £322,000."},{n:6,id:"TRU017",scenario:'A man purchases 12 crates of wine, all of the same vintage. He tells his brother: "Six of these crates of wine are for you. I will keep them for you in my cellar". One week later the man dies. In his will he appoints his solicitor to be his executor and leaves all his estate to charity. All the wine remains in his cellar.',q:"Can the brother claim six crates of the wine?",opts:["No, because there was no clear intention to declare a trust.","Yes, because the man was holding the wine on trust for his brother.","No, because there was no written evidence of the man's intention to create a trust.","Yes, because the man's intention to give the wine to his brother continued until his death.","No, because it is not clear which of the crates are held for the brother."],ans:"E",expl:"(E) The brother cannot claim six crates of the wine because it is not clear which of the crates are held for him. Where an individual wishes to create a trust of personalty with himself as trustee, there must be certainty of intention to be legally bound, of subject matter (the trust property), and objects (the beneficiary). There are no formal requirements for a declaration of trust of personalty. Here, the man's words suggest that he intends to be legally bound, and the beneficiary is clearly his brother. However, where the trust property is tangible property it must be clearly differentiated from other property of the same kind. Here, the man has not set aside the six crates of wine intended for the brother, so the trust fails for lack of certainty of subject matter. (A) is incorrect because the man's words suggest an intention to bind himself, even though the word 'trust' has not been used. (B) is incorrect because the trust fails for lack of certainty of subject matter. (C) is incorrect because the requirement for a declaration of trust to be evidenced in signed writing only applies to trusts of land. (D) is incorrect because the requirement for intention to continue until death applies only where an attempted gift has failed but the intended donee becomes the donor's personal representative, which is not relevant on these facts."},{n:7,id:"WEA049",scenario:`A man recently died. He had validly executed a will five years ago. When he executed the will, he owned a flat, £50,000 cash, and shares in XYZ plc. A year before the man died, ABC plc acquired XYZ plc, and the man received shares in ABC plc as payment for his shares in XYZ plc. The man died last month, owning the same house, a valuable painting, and the shares in ABC plc. The man's will included the following provisions:
(1) I give my shares in XYZ plc to my daughter.
(2) I give the remainder of my estate to my son.
There are no other relevant clauses.`,q:"Which of the following best describes entitlement to the man's estate?",opts:["The son will inherit the entire estate.","The daughter will inherit the shares in ABC plc, and the son will inherit the remainder of the estate.","The son will inherit the whole estate apart from the painting, as the man did not have this painting when he executed the will.","The daughter will inherit the shares in ABC plc, the son will inherit the entire estate other than the painting, and the painting will pass via the intestacy rules.","The will is invalid, as the man died owning different assets to those that he owned when he executed the will."],ans:"A",expl:"(A) The son will inherit the entire estate. The basic rule of succession is that a will speaks from the date of death unless a contrary intention is apparent in the will. Therefore, the will disposes of the assets owned by the man at the time he died, even though these are different from the assets that he owned when he executed the will. Under the doctrine of ademption, a specific gift (such as the gift of shares) will fail if the asset is no longer part of the testator's estate when they die. A change in the subject matter of a specific gift causes the gift to adeem, but a mere change in the name or form does not. Here, the man received the shares in ABC plc as payment for his shares in XYZ plc. This is a change in subject matter because the man now owns shares in a different company. Therefore the gift of the XYZ shares adeems, and the ABC shares will pass to the son, along with all other assets, as part of the residuary estate. (B) is incorrect. The daughter will not inherit the shares because they are adeemed. (C) is incorrect. The will speaks from the date of death, so the painting is covered by the gift of the residuary estate to the son, even though the man did not own this painting when he executed the will. (D) is incorrect. The gift of shares to the daughter adeems, and the son will inherit the entire estate, including the painting. (E) is incorrect. The will's validity is not impacted by the changes to the man's assets after she made the will.",note:`${Cc} Source slips kept: the facts say he owned a flat but died 'owning the same house', and the explanation of (E) says 'after she made the will' although the testator is a man.`},{n:8,id:"TRU022",scenario:'A settlor calls his friend and says: "I want you to hold all my shares in my family company on trust for my nephews equally". The settlor signs a stock transfer form transferring the shares and posts it to his friend. The next day the settlor dies leaving a will in which he appoints his solicitor to be his executor and leaves all his estate to charity.',q:"Is the trust of the shares valid?",opts:["No, because the declaration is not evidenced in a signed writing.","Yes, because the settlor posted the stock transfer form to his friend.","No, because the legal title to the shares was not transferred to the friend before the settlor's death.","Yes, because the settlor's intention to transfer the shares continued until his death.","No, because it is inconsistent with the terms of the will."],ans:"B",expl:"(B) The trust is valid because the settlor posted the stock transfer form to his friend. Where an individual wishes to create a trust with a third party as trustee, he must transfer the trust assets to the trustee in the appropriate legal manner and declare the trusts on which the trustee holds. Here, the settlor made a valid declaration of trust which complies with the three certainties - it is clear that he intended his friend to be legally bound as trustee, the trust property is clear, and the beneficiaries are the nephews. The legal title to shares is transferred by stock transfer form which must be registered with the company. Legal title does not pass until the new owner is registered in the company's books. Here the transfer was not complete when the settlor died, so the usual rule would be that the trust would fail. However, where the settlor has done everything required by him to complete the transfer and has put the property outside his control, equity will, exceptionally, enforce the trust. Here, the settlor has signed the stock transfer form and, by posting the form, has put the property outside his control, so the exception applies. (A) is incorrect because there is no requirement for a trust of personalty to be evidenced in writing, and the issue here concerns the transfer. (C) is incorrect because the exception applies, as explained above. (D) is incorrect because this requirement relates to the exception which applies where the intended trustee becomes personal representative of the settlor, which is not the case here. (E) is incorrect because the trust arises independently of the will."},{n:9,id:"WEA118",scenario:"A woman died 11 months ago domiciled in England and Wales. She left her whole estate to charity in her will. A grant of representation to her estate was issued seven months ago. The woman's husband is considering whether to bring a claim against her estate under the Inheritance (Provision for Family and Dependants) Act 1975 ('the Act'). There are no circumstances in which a court would give leave for a late application to be made under the Act.",q:"Is the husband able to bring a claim under the Act?",opts:["No, because the woman died more than six months ago.","No, because the grant of representation was issued more than six months ago.","Yes, because the grant of representation was issued less than one year ago.","Yes, because the woman died less than one year ago.","Yes, because the grant of representation was issued within six months of the woman's death."],ans:"B",expl:"(B) The husband cannot bring a claim under the Act because the grant of representation was issued more than six months ago. There is a time limit for bringing a claim under the Inheritance (Provision for Family and Dependants) Act 1975. An application must
