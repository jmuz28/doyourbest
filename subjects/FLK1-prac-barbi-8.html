 be made within six months of the issue of the grant of representation to the personal representatives. Here, the grant of representation was issued seven months ago, so the time limit for a claim has expired. (A), (C), (D), and (E) are incorrect because they do not accurately state the relevant time limit."},{n:10,id:"TRU002",scenario:`A father writes a signed letter to his son in which he declares: "Grange Cottage is yours. From now on I am holding it for your benefit". Shortly afterwards the father dies. Grange Cottage remains registered in the father's name, and in his will he leaves all his estate to his wife.`,q:"Is the trust enforceable by the son?",opts:["Yes, because his father transferred the legal title to the land.","No, because the trustee has died.","No, because the letter did not show certainty of intention to create a trust.","No, because the will shows that the father intended to leave his estate to his wife.","Yes, because his father satisfied all the requirements for a valid declaration of trust."],ans:"E",expl:"(E) The trust is enforceable by the son because his father satisfied all the requirements for a valid declaration of trust. The father was attempting to declare a trust of land with himself as trustee. The requirements of certainty, the beneficiary principle, and the perpetuity rules must be met, and, as the trust property is land, the son must be able to produce written evidence of the declaration of trust, signed by his father. All these requirements are satisfied. (A) is incorrect because there was no need for a transfer of the legal title because the father declared himself trustee. (B) is incorrect because once a trust has been created it will not fail for want of a trustee. (C) is incorrect because the words used show an intention to create a binding obligation even though the word 'trust' was not used. (D) is incorrect because a binding declaration of trust was created during the father's lifetime. On his death, the legal title passes to the father's executors who hold the property as trustees for the son, so it does not pass with his estate to his wife."},{n:11,id:"TRU075",scenario:"A trustee transfers trust funds into the name of his sister in breach of trust. The sister has spent the money on general living expenses. The beneficiaries wish to bring a personal claim in equity against the trustee's sister.",q:"What must the beneficiaries establish in order to hold the sister personally liable in equity?",opts:["That the sister was aware of the breach of trust.","That the trustee acted fraudulently.","That the sister did not act as an honest person would in the circumstances.","That the sister's conscience was affected.","That the sister had notice of the breach of trust."],ans:"D",expl:"(D) The beneficiaries must establish that the sister's conscience was affected in order to hold her personally liable in equity. A person who receives trust property is personally liable in equity if their state of knowledge was such as to make them liable as if they were a constructive trustee. This applies where the recipient had sufficient knowledge as to make it unconscionable for them to retain the property - that is, where they knew of the breach or where they were suspicious but chose not to ask questions. (A) is incorrect because a recipient may be liable even though they were not aware of the nature of the breach. (B) is incorrect because a recipient may be liable even where the trustee committed no fraud; it is the conscience of the recipient which is at issue. (C) is incorrect because this is the test for accessory liability. (E) is incorrect because the conscience of a recipient is not necessarily affected by constructive notice of a breach of trust."},{n:12,id:"TRU056",scenario:"A testator died leaving a will in which he appointed trustees to hold the residue of his estate on trust for his niece provided she attains the age of 25. The niece is 20 years old. The will does not contain any express powers.",q:"Which of the following best describes the position of the trustees in relation to the income of the fund?",opts:["They must pay the income to the niece.","They must accumulate the income until the niece is 25.","They may pay the income to the niece for her maintenance, education, or benefit and must accumulate the surplus.","They may pay or apply the income for the niece's maintenance, education, or benefit and must accumulate the surplus.","They must pay it to the niece's parents for her maintenance, education, or benefit and accumulate the surplus."],ans:"A",expl:"(A) The trustees must pay the income to the niece. Where a beneficiary over the age of 18 has an interest in the income of a trust fund, the trustees must pay the income to the beneficiary until the beneficiary's interest vests or fails. (B) is incorrect because once the beneficiary is 18 the trustees no longer have any power or duty to accumulate the income. (C), (D), and (E) are all incorrect because once a beneficiary is 18 the trustees' discretion to use income for the beneficiary's maintenance, education, or benefit ceases, and the trustees' duty is simply to pay the income to the beneficiary."},{n:13,id:"WEA154",scenario:"A woman died recently. Her will leaves her art collection to her friend and the remainder of her estate to her son. The woman's friend is not knowledgeable about art and would prefer for her adult niece to receive the art collection.",q:"Which of the following is the best method for the woman's friend to achieve this outcome?",opts:["The friend should make a lifetime gift of the art collection to her niece once she inherits the collection.","The friend should disclaim her right to the art collection.","The friend should execute a new will, leaving the art collection to her niece.","The friend should make a written variation passing the art collection to her niece.","The friend should tell the executors to transfer the art collection to her niece instead."],ans:"D",expl:"(D) The friend should make a written variation passing the art collection to her niece. A variation allows a beneficiary to change who receives their inheritance. To be effective for tax purposes, a variation must be made in writing, made within two years of death, and not made for monetary consideration. (A) is incorrect. A lifetime gift would not be the best method because it would be a potentially exempt transfer, which would become taxable if the friend were to die within seven years. (B) is incorrect. When a beneficiary disclaims a gift, the gift falls into the residue. So here, a disclaimer would not pass the art collection to the friend's niece, and instead the art collection would pass to the woman's son as part of the residuary estate. (C) is incorrect because the will would not become effective until the friend's death, and she wants her niece to receive the art collection now. (E) is incorrect. For the variation to be read back to the date of death as if the deceased had left the asset to the new beneficiary, the variation must be in writing. A verbal variation is not effective."},{n:14,id:"TRU108",scenario:"A man and a woman who are neither married nor in a civil partnership purchased a house together which was conveyed into their joint names. The woman provided all the purchase money, while the man provided none of the purchase money. There is no express declaration regarding the equitable interest in the house.",q:"Which of the following statements is correct?",opts:["Because only the woman contributed to the purchase price, there is a trust of the equitable interest solely in favour of the woman.","There is a presumption that the equitable interest is held jointly and equally by the man and the woman.","Although the house was conveyed into the parties' joint names, the woman owns the full legal and equitable interests.","Because the parties did not declare how the equitable interest is held, the purchase of the house is unenforceable.","Because the property was conveyed into joint names, the parties conclusively hold both the legal and equitable interests jointly and equally."],ans:"B",expl:"(B) There is a presumption that the equitable interest is held jointly and equally by the man and the woman. When legal title is registered in the name of both parties, they hold legal title as joint tenants. If there is no express declaration regarding the equitable interest, it is presumed that the equitable interests in the property, like the joint interests, are joint and equal. However, a party can rebut this presumption by proving that both parties intended otherwise. (A) is incorrect because it does not matter that only the woman contributed to the purchase price; the fact that the property was conveyed into joint names is key to determining the interests. (C) is incorrect. Because the house was conveyed into the parties' joint names, they own the legal interest jointly and equally, and it is presumed that they own the equitable interest jointly and equally as well. (D) is incorrect. The parties' failure to declare how the equitable interest is held does not make the purchase of the house unenforceable. (E) is incorrect because it is not conclusive that the equitable interest is held jointly and equally; it is a rebuttable presumption."},{n:15,id:"ACC023",scenario:"A solicitor completes a property transaction and wants to close her client's account. She discovers that the client account is holding a credit of £17 because the client overpaid completion funds before the property was purchased. The solicitor immediately makes a payment to her client of £17.",q:"Which of the following entries would be the most appropriate entry to record this payment?",opts:["Debit Cash Account - Client Side and Debit Client ledger - Client Side","Credit Cash Account - Business Side and Debit Client ledger - Client Side","Debit Cash Account - Business Side and Debit Client ledger - Business Side","Credit Cash Account - Client Side and Debit Client ledger - Client Side","Debit Cash Account - Client Side and Credit Client ledger - Client Side"],ans:"D",expl:"(D) The payment should be recorded as a debit in the client ledger, client side, as the firm would need to debit the client account to send her the money. The corresponding entry would be a credit entry in the cash account, as the firm no longer owes this money to the client. (B) is incorrect as this is not business money, and (E) is incorrect because the payment should not be reflected as a credit to the client account. (A) and (C) are incorrect because there must be a corresponding credit to match the debit entry."},{n:16,id:"WEA082",scenario:"A woman died intestate. She was divorced and had three daughters. The daughters are age 25, 17, and 14. The 17-year-old recently got married. The woman adopted the 14-year-old when she was a baby.",q:"Which of the following best describes the beneficiaries' interests in the woman's estate?",opts:["The 25- and 17-year-old daughters have vested interests in half of the estate each.","The 25- and 17-year-old daughters have vested interests in one-third of the estate each. The 14-year-old daughter has a contingent interest in one-third of the estate.","The 25-year-old daughter has a vested interest in one-third of the estate. The 17- and 14-year-old daughters have contingent interests in one-third of the estate each.","The 25-year-old daughter has a contingent interest in one-third of the estate. The 17- and 14-year-old daughters have vested interests in one-third of the estate each.","The 25-year-old daughter has a contingent interest in half of the estate, and the 17-year-old daughter has a vested interest in the other half of the estate."],ans:"B",expl:"(B) The 25- and 17-year-old daughters each have vested interests in one-third of the estate, and the 14-year-old daughter has a contingent interest in one-third of the estate. When a person dies intestate without a spouse or civil partner, the intestacy rules' strict order of entitlement applies to determine who will inherit the estate. As the woman was unmarried at the time of her death, her estate will pass to her issue on statutory trusts. The woman's issue are her three daughters. This includes the adopted daughter, as adopted children are treated as the issue of their adoptive parents under the intestacy rules. Therefore, the woman's estate will be shared so that each daughter is entitled to one-third of the estate. The 25-year-old daughter has a vested interest because she is over 18. The 17-year-old daughter also has a vested interest, since whilst she is under 18, she is married. The 14-year-old daughter has a contingent interest as she is under 18 and unmarried. She will receive her share of the estate when she reaches age 18 or marries at an earlier age. (A), (C), (D), and (E) are incorrect because they do not, therefore, accurately reflect the application of the intestacy rules to this estate.",note:`${kc} Source point kept: since 27 February 2023 (Marriage and Civil Partnership (Minimum Age) Act 2022) a 17-year-old cannot lawfully marry in England and Wales, and a 14-year-old cannot 'marry at an earlier age'.`},{n:17,id:"TRU045",scenario:"A settlor transfers property to two trustees to hold on trust for her two children in equal shares provided they attain the age of 21. The trust deed contains no express powers dealing with the appointment of trustees. The children are aged 18 and 20, and they do not agree with the trustees' investment policies. They would like to replace the trustees.",q:"Which of the following best describes the power of the beneficiaries?",opts:["They may together direct the trustees to retire and appoint new trustees of the beneficiaries' choice.","They have no power to control the trustees because the trustees were selected by the settlor.","They have no power to control the trustees because their interests are contingent.","They may direct the trustees to retire and appoint new trustees of their choice provided the settlor agrees.","They have no power to control the trustees unless the trustees have committed a breach of trust."],ans:"C",expl:"(C) The beneficiaries have no power to control the trustees because their interests are contingent. In the absence of special provisions in the trust instrument, the usual rule is that the existing trustees have the power to appoint new trustees and the beneficiaries do not have control over the composition of the trusteeship. However, if all the beneficiaries are of full age and capacity and between them absolutely entitled, the beneficiaries may by agreement direct the trustees to retire and appoint new trustees of their choice. (A) is incorrect because, although the children are both of full age, they are not together absolutely entitled as their interests are contingent. If they both died before the age of 18, their interests would both fail and the property would pass to any substitutional beneficiary or revert to the settlor on resulting trust. (B) is incorrect because the beneficiaries would have this power if their interests were vested. (D) is incorrect because the settlor retains no powers over the composition of the trusteeship unless they are expressly reserved in the trust instrument. (E) is incorrect because there is a statutory power for beneficiaries to control the trustees in the circumstances outlined above.",note:"Source slip kept: the explanation says 'If they both died before the age of 18'; on the facts the contingency is attaining 21."},{n:18,id:"ETH120",scenario:"A solicitor meets a new client who wants to make a will. During the meeting, the client also discusses the interests of her husband and provides the solicitor with details of his estate. The size of each estate appears to be identical and the client intends to leave her assets to her husband and says that he will want to do the same and leave everything in his will to her. She asks the solicitor to draft not only her will but a will in identical terms for her husband.",q:"Should the solicitor accept the client's instructions?",opts:["Yes, because the wife is entitled to speak on behalf of her husband.","Yes, because the will is not valid until executed.","No, because the wife is not authorised to give instructions on behalf of her husband.","Yes, because there is no conflict in these instructions.","No, because the husband is owed a duty of confidentiality by the solicitor."],ans:"C",expl:"(C) The SRA Codes provide that a solicitor can only act for a client on instructions from the client or from someone properly authorised to provide instructions on their behalf. Whilst the wife has shared information about her husband's estate with the solicitor, the solicitor has not confirmed with the husband that he gives his wife authority to provide the instructions. (A) is incorrect because the wife is not automatically entitled to provide instructions just because of her married status. (B) is incorrect because the regulatory breach occurs at the point the solicitor acts on the instructions and not when the will becomes a legally binding document. (D) is incorrect; even if there is no conflict of interest, there is still a breach because the solicitor does not have proper authority to act. (E) is incorrect because the solicitor does not owe a duty of confidentiality to an individual until the instructions are agreed. The husband is not the solicitor's client at this point."},{n:19,id:"WEA013",scenario:"A man makes a will in the presence of two witnesses; the man's nephew and the man's friend. Both witnesses are present when the man signs the will. The nephew then signs the will and leaves the room, and then the friend signs the will. The nephew's spouse is a beneficiary of the will. The friend is illiterate.",q:"Which of the following best describes the legal position regarding the validity of the will?",opts:["The will has been validly executed.","The will is invalid as one of the witnesses lacks capacity.","The will is invalid as the nephew was not present when the friend signed the will.","The will is invalid as the spouse of the nephew is a beneficiary of the will.","The will is invalid as the friend is illiterate."],ans:"A",expl:"(A) The will has been validly executed. To be valid, a will must be in writing and signed by or on behalf of the testator in the presence of two or more witnesses present at the same time who each sign the will in the presence of the testator. On the facts, it appears that these requirements have been met. (B) is incorrect. There is no suggestion that a witness lacks capacity - being illiterate does not mean that an individual lacks capacity. (C) is incorrect. The witnesses must sign in the presence of the testator, but they do not have to sign in the presence of each other. The nephew not being present when the friend signed does not impact on the validity of the will. (D) is incorrect. A beneficiary or their spouse also acting as a witness does not invalidate the will. Instead, any gifts to the beneficiary or their spouse will fail. (E) is incorrect. An illiterate person is capable of acting as a witness, provided that the person is aware that the testator is signing the will."},{n:20,id:"TRU012",scenario:'A mother wrote to her daughter: "All my jewellery is for your children. When you next visit you must take it and hold it on trust for them until they are 18". The following day, the mother executed a will leaving all her estate to her son and appointing him to be her executor. The mother has now died and the jewellery remains in her possession.',q:"Which of the following best describes the validity of the trust of the jewellery?",opts:["The trust is valid because the letter transferred title to the jewellery to the daughter and complies with the requirements of certainty.","The trust fails because the jewellery was not delivered to the daughter.","The trust is valid and the son, as executor, holds the jewellery on the trusts declared in the letter.","The trust fails because the will shows that the mother had changed her mind.","The trust is valid because the mother made every effort to constitute the trust."],ans:"B",expl:"(B) The trust fails because the jewellery was not delivered to the daughter. The mother was attempting to set up a trust of chattels with the daughter as trustee. She needed to transfer the property to the trustee and to make a valid declaration of trust. The letter complies with the requirements for a valid declaration as it shows that: (1) the mother intended her daughter to be legally bound (certainty of intention); (2) the subject matter is certain (all the mother's jewellery); and (3) the objects (the daughter's children) satisfy the complete list test of certainty. There are no formal requirements for a declaration of trust of personalty. However, legal title has not been transferred to the daughter. In the case of chattels, title may be transferred by delivery or by deed. Neither of these has happened and so the trust is incompletely constituted. (A) is incorrect because title to chattels cannot be passed by writing alone. (C) is incorrect because the trust is incompletely constituted, and the rule in Strong v Bird only applies where the intended trustee (in this case the daughter) becomes executor of the settlor's estate. (D) is incorrect because the will does not refer to the jewellery and is not the reason for the failure of the trust. (E) is incorrect because the 'every effort' exception only applies to save an incompletely constituted trust where the settlor has done everything required of her to complete the transfer and has put the asset outside her control. This applies to shares and land where the necessary transfer has been signed and delivered but not yet registered. It is not relevant in the case of chattels where simple delivery is required."},{n:21,id:"WEA093",scenario:"A man died two months ago, leaving a valid will which appointed his wife, brother, and 15-year-old daughter as executors. No substitute executors are named in the will. The man and his wife were divorced last year.",q:"Which of the following correctly describes who should administer the man's estate?",opts:["The man's wife, brother, and daughter.","The man's wife and brother only.","The man's brother only.","The man's wife and daughter only.","An administrator whom the court appoints because the will is invalid following the divorce."],ans:"C",expl:"(C) The man's brother should administer his estate. An executor is a person appointed by a valid will to administer the estate of the deceased. A minor, such as the man's daughter, is not able to act as executor. When a testator is divorced, the appointment of their former spouse as executor is ineffective, and the former spouse is treated as having died on the date of the divorce for these purposes. Consequently, the man's former wife cannot be an executor, and only the man's brother is able to act as an executor of his estate. Therefore, (A), (B), and (D) are incorrect, as the man's wife and daughter are not able to act as executors. (E) is incorrect. The will remains valid, as divorce does not revoke a will. Instead, divorce revokes gifts to the former spouse and makes any appointments to the spouse ineffective. There is no need to appoint administrators because the brother can act as executor."},{n:22,id:"WEA105",scenario:"A man dies, leaving a valid will under which his wife is appointed as his executor. The will leaves most of the man's estate to his son and daughter as residuary beneficiaries. His wife obtains a grant of probate and begins administering the man's estate. However, she dies shortly after beginning the process, leaving a will appointing her daughter as executor. The daughter has now obtained a grant of probate for the wife's estate.",q:"Which of the following best describes how the administration of the man's estate can be progressed?",opts:["The daughter is required to administer the man's estate.","The daughter and son equally are entitled to administer the man's estate.","Any will beneficiary can apply for a new grant of probate for the man's estate.","A grant de bonis non is needed to complete the administration of the man's estate.","The son can apply for a new grant of probate for the man's estate."],ans:"A",expl:"(A) The daughter is required to administer the man's estate. When the sole executor of an estate dies and that executor's executor takes a grant of probate for the deceased executor's estate, the executor automatically becomes the executor of the original estate. This is known as a chain of representation. Because the daughter has taken a grant of probate for the wife's estate, she is also required to administer the man's estate as well. She cannot refuse to be executor by representation of the man's estate. (B) is incorrect. The son does not have an equal entitlement to administer the man's estate, as he is not administering the wife's estate. (C) is incorrect. The daughter automatically becomes executor of the man's estate when she takes a grant of probate for the wife's estate. (D) is incorrect. A grant de bonis non is needed when there is no chain of representation between executors. This would occur if the wife's estate was being handled by an administrator, not an executor. (E) is incorrect. The son is not entitled to apply for a new grant of probate for the man's estate, as a chain of representation exists."},{n:23,id:"ETH039",scenario:"A probate solicitor and her assistant go to see an elderly client to have his will signed and witnessed. On the way back to the office, the solicitor leaves her bag on the train. The bag is not found, and the client's last will and testament is lost.",q:"Which of the following statements best describes the client's position?",opts:["The client should complain to the firm on the basis that the firm has failed to protect client assets.","The client will not succeed in making a complaint because the solicitor did not intend to lose the will.","The client should bring a negligence action against the firm.","The client should complain to the firm on the basis that the firm has failed to act with integrity.","The client should complain directly to the Legal Ombudsman."],ans:"A",expl:"(A) The relevant obligation in the Code of Conduct requires solicitors to protect clients' assets, and 'assets' includes documents. (B) is incorrect because a solicitor may breach the Code even if she did not intend a bad result. (C) is incorrect. This might be the outcome if the client suffers loss because of the lost will, but there is no suggestion in the fact pattern that the client has suffered loss as yet. (D) is incorrect because the complaint based on (A) is the stronger argument. (E) is incorrect because the client must go through the firm's complaint procedure first, but the client can refer the complaint to the Legal Ombudsman if the firm fails to deal with the complaint."},{n:24,id:"ACC057",scenario:"A firm of solicitors is working on a commercial property transaction for its client. It is holding £3,000 on account and has made five payments on its client's behalf. The firm's policy is to always use client funds if available.",q:"Which one of the following payments will be recorded on the client side of the client ledger?",opts:["A company search fee of £100.","A photocopying bill paid using petty cash.","An agent's fee of £500 plus VAT, addressed to the firm.","A taxi fare of £10 (to visit the client), paid using petty cash.","A surveyor's fee of £1,000, plus VAT, paid with a cheque from the client and made out to the surveyor herself."],ans:"A",expl:"(A) The company search fee can be paid directly from the client account itself, which is in funds and would therefore require a debit entry on the client side of the client ledger. (B) and (D) cannot be recorded on the client side of the client ledger, as petty cash must always be paid using business money. (C) is incorrect because the invoice is addressed to the firm and so under the principal method business money must be used. (E) is incorrect because the cheque is addressed to the surveyor herself; therefore, the firm must simply pass it on and cannot process it in any way."},{n:25,id:"ACC029",scenario:"In a property transaction, a law firm has received an interim invoice from a surveyor for £750. The invoice has already been paid by the firm, and a bill has been issued to the client. The client makes a bank transfer of £750.",q:"Which of the following entries would be the most appropriate entry to record this receipt?",opts:["Debit Client ledger - Client Side; Credit Cash Account - Client Side","Debit Client ledger - Client Side; Credit Cash Account - Business Side","Credit Client ledger - Client Side; Debit Cash Account - Client Side","Debit Client ledger - Business Side; Credit Cash Account - Business Side","Credit Client ledger - Business Side; Debit Cash Account - Business Side"],ans:"E",expl:"(E) This receipt is business money because the disbursement has been invoiced and is already paid by the law firm. It should therefore be shown as a credit entry on the business side of the client ledger, and the corresponding entry would be debit on the cash account, business side, as it is money that the client owes to the law firm. All the other options are incorrect as this is not client money because the law firm has incurred the liability and properly billed the client for them, and therefore it should not be shown on the client side of the cash account or client ledger.",note:`${kc} The end of option (C) is cut off on the answer screen; it is completed from the question screen.`},{n:26,id:"ACC035",scenario:"A firm receives a £20,000 cheque from a client to reimburse the firm for Barrister's fees incurred in an ongoing litigation matter. The firm has already received the Barrister's bill.",q:"Which of the following correctly describes how the cheque should be dealt with by the firm?",opts:["The firm should pay the cheque into its client bank account.","The firm should send the cheque to the Barrister.","The firm should return the cheque and ask for a cheque made payable to the Barrister.","The firm should pay the cheque into a separate stakeholder account.","The firm should pay the cheque into its business bank account."],ans:"A",expl:"(A) The firm should pay the cheque into its client bank account as this payment comes within the definition of client money under the SRA Accounts Rules. The firm has not yet billed the client for this sum, so it cannot transfer any amount to the business account yet. (B) is incorrect as the solicitor will need to deal with the cheque via its accounts. (C) is incorrect as the solicitor can place the cheque in its bank account and then pay the Barrister. (D) is incorrect as a stakeholder account is not appropriate here, as it is not stakeholder money (a person for whom the firm is holding funds in trust). (E) is incorrect as this is client account not business account money.",note:kc},{n:27,id:"TRU129",scenario:"In breach of trust, a trustee removed £25,000 from the trust bank account and deposited in his own personal bank current account. The bank account had a nil balance before the deposit. The trustee then transferred £25,000 of his own money from his savings account to his current account, producing a balance of £50,000. The trustee then withdrew £40,000 from the account and gambled it at the local casino where he lost all the money. A few days later, he won £40,000 on the lottery which he deposited in his personal bank current account. A beneficiary instructs a solicitor to advise the beneficiary as to their rights.",q:"What advice should the solicitor give the beneficiary?",opts:["The beneficiary has a claim to the full £25,000 misappropriated from the account since there are sufficient funds to cover the amount.","The beneficiary has a claim of £10,000 on the funds deposited in the account and a personal action to recover the balance of £15,000.","The beneficiary has no proprietary claim against the trustee but has a personal claim for breach of trust.","The beneficiary has no proprietary or personal claim against the trustee.","The beneficiary has a claim to £10,000 in the account and a personal claim against the casino as a knowing recipient of trust funds."],ans:"B",expl:"(B) The beneficiary has a claim of £10,000 on the funds deposited in the account and a personal action to recover the balance of £15,000. When a trustee places trust funds into a bank account with the trustee's own money, the beneficiaries may claim a charge over the account for the amount of the trust funds in it. If the trustee has drawn money out of the account, the basic rule is that the trustee is treated as withdrawing their own money first. If the trustee dissipates the trust money and then subsequently receives their own money, the limit of the beneficiary's claim is the lowest intermediate balance, which is the balance after the last payment out but before the next payment in. Here, when the trustee gambled and lost the £40,000, he is treated as spending £25,000 of his own money and £15,000 of the trust's money, leaving £10,000. This was the lowest intermediate balance before the trustee received the lottery winnings. Therefore, the beneficiary is limited to a claim of £10,000 on the funds in the bank account and must bring a personal action to recover the remaining £15,000. Accordingly, (A), (C), and (D) are incorrect. (E) is incorrect because a knowing recipient is a third party that received trust money with knowledge of the breach of trust, and it is highly unlikely the casino would have had any knowledge about the breach.",note:Cc},{n:28,id:"TRU066",scenario:"A settlor transfers £300,000 to trustees to hold on trust for her son for life and on his death to a named charity. The trustees are considering how to invest the money.",q:"Which of the following best describes the considerations the trustees should take into account when choosing investments?",opts:["They should invest so as to maximise the amount of income for the son.","They should invest so as to protect and grow the trust capital.","They should invest so as to take into account the differing interests of the beneficiaries.","They should invest without regard to the interests of individual beneficiaries.","They should invest so as to take into account the objects of the charity."],ans:"C",expl:"(C) The trustees should invest so as to take into account the differing interests of the beneficiaries. The trustees owe a duty to act impartially between the beneficiaries and must balance their interests. This means they must take into account the son's interest in the income as well as the interest of the charity in capital growth. (A) and (B) are incorrect because the trustees must try to balance the competing interests. (D) is incorrect because the trustees must take account of the beneficiaries' interests. (E) is incorrect because the duty of the trustees is to look at the financial interests of the beneficiaries and not the objects of a charity."},{n:29,id:"WEA059",scenario:`A woman made a will several years ago, including the following provisions:
(1) I give my XYZ plc shares to my son.
(2) I give my jewellery to my sister.
(3) I give the remainder of my estate to my husband.
There are no other relevant clauses. The woman, her sister, and her son all died recently in a car accident. The son and sister died immediately, and the woman died in hospital a few weeks later. The son is survived by his wife, who is pregnant with their fourth child, and three other children of his own. The sister had a daughter.`,q:"Who is entitled to share in the woman's estate?",opts:["The husband will inherit the entire estate.","The son's wife will inherit the XYZ plc shares, and the husband will inherit the remainder of the estate.","The XYZ plc shares will be divided equally between the son's four children, including the new baby when born. The woman's husband will inherit the rest of the estate.","The shares will be divided equally between the son's three children. The woman's husband will inherit the rest of the estate.","The shares will be divided equally between the son's three children, including the new baby when born. The jewellery will pass to the sister's daughter. The husband will inherit the rest of the estate."],ans:"C",expl:"(C) The XYZ plc shares will be divided equally between the son's four children, including the new baby when born. The woman's husband will inherit the rest of the estate. If a beneficiary has predeceased the testator, the gift to them will lapse. However, if a gift is made to the testator's issue who die before the testator and who leave living issue of their own, the living issue will receive the gift. This includes children who are conceived but unborn. Here, the woman's son predeceased her. Therefore, the gift of the shares will pass to the son's four children in equal shares, assuming that the baby is born. This principle applies only to issue of the testator and not to other beneficiaries. Therefore, the gift of jewellery to the sister does not pass to her daughter and instead lapses. The jewellery will pass to the husband as part of the residuary estate. (A) is incorrect because, as explained, the son's children are entitled to inherit the shares, and the husband will not receive them as part of the residuary estate. (B) is incorrect because the shares are inherited by the son's issue, not the son's wife. (D) is incorrect. Conceived but unborn children are considered 'living children' who can receive a gift that was intended for their predeceased parent, and so the shares will be divided between the son's four (rather than three) children. (E) is incorrect. The gift of jewellery does not pass to the sister's daughter because the rule that saves lapsed gifts applies only to the testator's issue. A sister is not within the definition of issue; issue are the testator's children or remoter lineal descendants only.",note:`${Cc} Source wording kept: option (E) says 'the son's three children, including the new baby when born'.`},{n:30,id:"ACC043",scenario:"A solicitor holds £50,000 of money belonging to a client in its client account.",q:"In what circumstances would the SRA Accounts Rules require the solicitor to pay interest to the client?",opts:["The amount calculated exceeds £10.","The money is held in the client account in excess of 10 days.","The money is held in the client account in excess of one month.","The money is held in the client account in excess of one week.","After the client has been provided with sufficient information to give informed consent, the client and the solicitor agree in writing how much interest will be paid."],ans:"E",expl:"(E) No specific circumstance requires interest to be paid. When a solicitor holds money in a client account for a client, they must account to the client for a fair sum of interest unless a separate written agreement has been made and the firm has provided the client with sufficient information to enable them to give informed consent. (A)-(D) are incorrect because there are no stipulations in the SRA Accounts Rules regarding payment of interest based on the time period over which the money is held or the amount of money held. However, each firm must have a written policy on the payment of interest that should be presented to the client at the outset of the transaction.",note:"The OCR displaces several words of this explanation ('interest', '(D)', 'amount'); it has been reassembled in reading order from the answer screen."},{n:31,id:"TRU035",scenario:"In his will, a man left the residue of his estate to trustees on trust to invest and use the income to encourage young people in the Newtown area to play football.",q:"Is the trust likely to be found valid?",opts:["Yes, as a charitable trust.","No, because it breaches the inalienability rule.","No, because it does not have ascertainable beneficiaries.","No, because it lacks public benefit.","Yes, as a trust for a private purpose."],ans:"A",expl:"(A) The trust is valid as a charitable trust. To be charitable, the purposes of the trust must be of a charitable nature (as defined in the Charities Act 2011), it must be for the public benefit, and its objects must be exclusively charitable. The advancement of amateur sport is one of the listed charitable purposes. The inhabitants of a particular area limited by reason of age form an adequate cross-section of the public, and the purpose is exclusively charitable because there is no extra non-charitable purpose. Therefore this is a valid charitable trust. (B) is incorrect because the inalienability rule does not apply to charitable trusts. (C) is incorrect because the requirement for beneficiaries to be certain does not apply to charitable trusts. (D) is incorrect because there is adequate public benefit even where a charity's objects are limited by age and geographical area. (E) is incorrect because the purpose is for the benefit of the public."},{n:32,id:"ACC039",scenario:"A firm is acting for a client who is selling a house. On exchange of contracts in the transaction, the firm receives the sum of £200,000 as the buyer's deposit. The contract provides that the deposit should be held by the firm as stakeholder.",q:"Which of the following best describes the actions the firm could take to deal with the receipt of the £200,000?",opts:["The money must be put into the business account until completion.","The money must be put into the seller's client account.","The money must earn interest while being held by the firm.","The money must be dealt with as the client seller alone instructs.","The money must be put into a separate stakeholder account in the name of both the buyer and the seller and the funds must be transferred to the selling client's ledger when the sale is completed."],ans:"E",expl:"(E) The money must be put into a separate stakeholder account held jointly in the name of both the buyer and the seller until the transaction completes. (A) is incorrect as the deposit is held on trust for both parties. Therefore, it is client money, so it is not appropriate to place it in the business account. (B) is incorrect as funds held as stakeholder must be held in a separate account to show that the money is held for both the seller and the buyer. (C) is incorrect as the firm must account for a fair sum of interest; this does not mean that the money must always earn interest. (D) is incorrect as the contract provides that the deposit must be held as stakeholder and so it is held on trust for both parties and is not available to the seller until completion. If the contract had provided for the deposit to be held as agent, the deposit would belong to the seller alone, and it could be used by the seller before completion."},{n:33,id:"TRU088",scenario:"In his will, a man appointed two trustees to hold all his estate on trust for his sister for life with remainder to her children in equal shares. The sister wishes to raise a capital sum, and one of the trustees has offered to purchase the sister's life interest.",q:"Which of the following statements best describes the position of the trustee?",opts:["She may purchase the sister's interest under any circumstances.","She may purchase the sister's interest provided she pays more than the full market value.","She may purchase the sister's interest if her co-trustee consents.","She may purchase the sister's interest provided she pays the full market value and makes full disclosure of all material facts.","She may purchase the sister's interest provided she pays the full market value and the sister's children consent."],ans:"D",expl:"(D) The trustee may purchase the sister's interest provided she pays the full market value and makes full disclosure of all material facts. The 'fair dealing rule' applies to the purchase by a trustee of a beneficiary's interest. A trustee may purchase the interest of a beneficiary provided that the price is fair and full disclosure of all material facts is made. (A) is incorrect because it ignores the rule stated above. (B) is incorrect because the trustee need only pay the full market value, not more. (C) and (E) are incorrect because the consent of a co-trustee or other beneficiaries is not relevant to the purchase of a beneficiary's interest."},{n:34,id:"TRU102",scenario:"One of four trustees of a trust set up in 2014 has reached the age of 70 and wishes to retire from the office of trustee. The three co-trustees are fine with the trustee's retirement but do not want to have to find a replacement. The trust instrument is silent as to who has the power to appoint new trustees.",q:"Can the trustee retire without being replaced?",opts:["Yes, if the trustee obtains the consent by deed of all the co-trustees.","Yes, if the trustee obtains court approval.","No, because the statutory retirement age for trustees is 75.","No, because the co-trustees are required to replace any retiring trustee.","No, because the trustee's retirement would leave too few trustees in office."],ans:"A",expl:"(A) The trustee can retire without being replaced if: (1) the trustee obtains the consent by deed of all the co-trustees and the person (if any) given power to appoint new trustees by the trust instrument, and (2) the trustee leaves in office at least two trustees or a trust corporation. (B) is incorrect because court approval is not required. (C) is incorrect because there is no statutory retirement age for trustees. (D) is incorrect because co-trustees are not required to replace a retiring trustee. (E) is incorrect because three trustees would be left in office, and only two are required."},{n:35,id:"TRU114",scenario:"A client left an instruction with their solicitor to set up a testamentary trust leaving £20,000 for the care of their only pet, their dog, for the rest of its days. The solicitor drafted the trust in those terms. The client has died, and the executor of the will now wishes to know whether the trust, as drafted, is valid.",q:"Is the trust valid?",opts:["Yes, because caring for animals is a valid charitable purpose.","Yes, because trusts for the maintenance of animals are valid.","No, because £20,000 is too large a sum to leave for the care of a pet.","No, because it does not provide a valid perpetuity period.","No, because a trust must have human beneficiaries."],ans:"D",expl:"(D) The trust is not valid. While it is possible to create a valid noncharitable purpose trust for the maintenance of an animal, the trust needs a valid perpetuity period. If the trust may continue for longer than 21 years, it fails. The court will not take judicial notice of the likely lifespan of the animal, so a gift for an animal's maintenance will fail unless specific provisions are made limiting its duration. (A) is incorrect because a trust for the maintenance of a specific animal is a noncharitable purpose trust, not a charitable trust. (B) is incorrect because, although trusts for the maintenance of animals are valid, they must have limited duration. (C) is incorrect because there is no monetary limit on noncharitable purpose trusts. (E) is incorrect because noncharitable purpose trusts can have beneficiaries that are not human."},{n:36,id:"WEA037",scenario:'A man died last month, leaving in his will the whole of his large estate to "such of my children as are living at my death in equal shares". The man had two daughters with his ex-wife, an adopted son, a stepson (the son of his current partner), and an illegitimate daughter who was previously unknown to the rest of the family.',q:"Who will share in the man's estate under his will?",opts:["The two legitimate daughters only.","The two legitimate daughters and the stepson only.","The two legitimate daughters and the illegitimate daughter only.","The two legitimate daughters, the adopted son, and the stepson only.","The two legitimate daughters, the adopted son, and the illegitimate daughter only."],ans:"E",expl:"(E) The two legitimate daughters, the adopted son, and the illegitimate daughter will be entitled to share the man's estate. The term 'children' covers legitimate children (the two daughters), illegitimate children (the illegitimate daughter), and adopted children (the adopted son). However, it does not extend to stepchildren, so the stepson will not be entitled to share in the estate. Therefore, (A), (B), (C), and (D) are incorrect."}],Wi="The options on the question screen are partly scrambled by the OCR; the option wording here follows the answer-discussion screen, which matches the explanation.",a1="Source point kept: the £270,000 statutory legacy applied to deaths from 6 February 2020; for deaths on or after 26 July 2023 it is £322,000.",s1=[{n:1,id:"WEA101",scenario:"A woman died last month. Her valid will appointed her brother as executor, but the brother also died recently. The will leaves £20,000 to the woman's daughter and the rest of the estate to her husband. Her husband took some initial steps in relation to the estate administration, but he is now seriously unwell and wishes the daughter to administer the estate instead.",q:"Which of the following is the most accurate statement regarding this situation?",opts:["The husband is unable to renounce acting as administrator as he has intermeddled in the estate.","The daughter can obtain a grant of representation if she clears off the husband only.","The daughter can obtain a grant of representation if she clears off the brother only.","The daughter can obtain a grant of representation if she clears off both the brother and the husband.","The daughter does not have the right to apply for a grant of representation."],ans:"D",expl:"(D) The daughter can obtain a grant of representation if she clears off both the deceased brother and the husband. The woman left a valid will, but, due to the death of her brother, it fails to appoint an executor who can administer her estate. Consequently, the woman's estate will be administered by an administrator under a grant of letters of administration with will annexed. The order of entitlement to a grant of letters of administration with will annexed is set out in rule 20 of the Non-Contentious Probate Rules ('NCPR'). Under this rule, her husband, as the residuary beneficiary, will have the best entitlement to a grant of representation. However, as he does not wish to act, the daughter can apply for the grant, but she will need to clear off both the brother and the father and explain why they are not applying for the grant. This is because the brother, as the named executor, and the father, as the residuary beneficiary, have a better right to the grant than she does. (E) is therefore incorrect. (A) is incorrect. Anyone entitled to apply for a grant of letters of administration with will annexed can renounce, and this right is not lost by intermeddling in the estate. (B) and (C) are incorrect because the daughter must clear off every person who has a better right to the grant. Even though the brother is deceased, she must confirm that the named executor is not applying for a grant because he has died. She must also confirm that the father has renounced.",note:`${Wi} Source slip kept: the explanation switches from 'husband' to 'the father' for the same person (the woman's husband, the daughter's father).`},{n:2,id:"TRU092",scenario:"A settlor owned 1,000 ordinary shares in ABC plc. The settlor declared a trust of 200 of those 1,000 ordinary shares in ABC plc in favour of a nominated beneficiary.",q:"Is this a valid trust?",opts:["Yes, because the shares are ordinary shares.","No, because fractional shares of property are not sufficiently certain.","No, because the 200 shares are not readily identifiable.","Yes, because shares are an intangible asset.","No, because company shares cannot be held on trust."],ans:"D",expl:"(D) A trust must have certainty of subject matter; it must be clear what property is to be bound by the trust. However, a trust of a fractional share of an intangible asset will not fail for lack of certainty. This trust is valid because shares are an intangible asset. (A) is incorrect because the type of company shares is irrelevant. (B) is incorrect because fractional shares of intangible property are considered to be sufficiently certain. (C) is incorrect because a fraction of shares is identifiable. (E) is incorrect because company shares can be held on trust."},{n:3,id:"CRL096",scenario:"A woman is having an argument with a man in their kitchen. In anger, the woman pulls out a kitchen knife and stabs him in the chest. The woman phones for an ambulance, and after a 30 minute wait, the man is rushed to hospital. In hospital, the man is offered a life-saving blood transfusion. The man has a religious objection to receiving a blood transfusion and so refuses. The man later dies.",q:"Is the woman guilty of murder?",opts:["No, it was the man's choice to refuse life-saving treatment.","No, hospital staff have broken the chain of causation by not overriding the man's wishes.","Yes, as the man's choice does not break the chain of causation, and the woman must take her victim as she finds him.","Yes, because stabbing is reckless and the woman must have foreseen the risk of causing serious harm.","No, because the delay in the arrival of the ambulance breaks the chain of causation."],ans:"C",expl:"(C) The woman is guilty of murder. In order for the woman to be guilty of murder, there must be factual and legal causation from the woman's act to the man's death, and the woman must have intention to kill or cause grievous bodily harm. All of those elements are present here. (A) is incorrect as a defendant must take their victim as they find them (including religious convictions), so this will not break causation. (B) is incorrect as adults may refuse medical treatment, and the hospital's staff's behaviour in respecting their patient's wishes will not break the chain of causation. (D) is incorrect as the mens rea for murder is intention to kill or cause grievous bodily harm, not recklessness. (E) is incorrect as the delay will not break the chain of causation. A third party's intervention breaks the chain of causation if it is free, deliberate, and informed. The ambulance is not free of the initial cause of the man's injury; the ambulance is responding to the stabbing."},{n:4,id:"CRL040",scenario:"A drunken woman punched a doorman outside a public house, causing him a black eye. Enraged, the doorman punched the woman back. The doorman had not noticed that the woman passed out immediately after punching him, and she was already slumping to the ground as the doorman landed his punch, which lightly touched the woman and caused her no injury.",q:"Could the doorman be found guilty of assault or battery?",opts:["No, because the doorman was acting in self-defence.","No, because the doorman was simply retaliating to what the woman had done.","No, because the woman could not be fearful of the doorman as she was unconscious at the time.","No, because the doorman caused the woman no injury.","Yes, because the doorman caused the woman a battery."],ans:"E",expl:"(E) is correct, as the doorman caused the woman an unlawful battery. A battery is committed when a defendant intentionally and recklessly applies unlawful force to another. The fact that the woman was unconscious at the time is irrelevant, and the fact that the doorman only touched her lightly is irrelevant. Therefore, (C) is incorrect. In battery, no injury need be caused, so (D) is incorrect. We know that the doorman was no longer in any danger when he hit the woman, because she was unconscious. Therefore, he was not acting in self-defence, and (A) is incorrect. Retaliation is also not a defence to assault or battery.",note:"Source slip kept: 'intentionally and recklessly' — the mens rea for battery is intention or recklessness."},{n:5,id:"WEA025",scenario:"A woman made a valid will five years ago, leaving most of her estate to her civil partner and appointing her civil partner as executor. The will does not address the possibility of the dissolution of the civil partnership. Since then, the woman has separated from her civil partner, and the civil partnership was subsequently dissolved.",q:"Which of the following statements best describes the effect of these events on the woman's will?",opts:["The woman's will remains fully valid.","The gift to the woman's former civil partner will fail, but the civil partner will be entitled to act as the woman's executor.","The woman's will was revoked when she separated from her civil partner.","The gift to the woman's former civil partner remains valid, but the civil partner will not be entitled to act as the woman's executor.","The gift to the woman's former civil partner will fail, and the civil partner will not be entitled to act as the woman's executor."],ans:"E",expl:"(E) The gift to the woman's former civil partner will fail, and the civil partner will not be entitled to act as the woman's executor. If a testator's civil partnership is dissolved after executing a will, gifts to the testator's former civil partner will fail, but the will is not automatically revoked by the dissolution. If the former civil partner was appointed as an executor in the will, the appointment will be ineffective. However, it is possible to prevent this by stating a contrary intention in the will. Here, there was no contrary intention in the will, so the gift to the former civil partner will fail, and the civil partner will not be entitled to act as the woman's executor. (A) is therefore incorrect. (B) and (D) are incorrect. On the dissolution of a civil partnership, any gift to the former civil partner will fail, and the former civil partner is no longer entitled to act as executor. (C) is incorrect. Separation is insufficient to revoke a will. There must be a dissolution of a civil partnership or a decree absolute of divorce or nullity."},{n:6,id:"CRL026",scenario:"A man's neighbour owned a football signed by David Beckham and all of the 1999 UEFA Champions League Manchester United team. The man asked if he could show the football to some friends who were visiting. The man's neighbour agreed as long as the man kept the football in its display case, which the man promised to do. In fact, the man intended to use the ball with his son in his back garden. While playing with the ball, the man's son kicked it over the fence and into the garden of a dog owner. The dog owner's greyhound punctured the ball, as it had with the previous five footballs the man's son had kicked into the yard. When the neighbour learned what happened to the football, he contacted the police.",q:"What offence would the prosecution likely charge to secure a conviction?",opts:["Attempted criminal damage.","Theft.","Fraud by false representation.","Fraud by failure to disclose information.","Attempted theft."],ans:"C",expl:"(C) The prosecution would probably charge the man with fraud by false representation. A person commits fraud by false representation if he dishonestly makes a false representation and intends, in doing so, to make a gain for himself or cause a risk of loss to another. Here, the man acted dishonestly when he told his neighbour he was going to show the football to friends when in fact he was going to play a game with it, knowing that five previous footballs had been destroyed by the greyhound. (D) is incorrect because fraud by failure to disclose would be difficult to charge, as the prosecution would have to show the man had a legal duty to disclose that he was going to use the football in a game, and it is not clear any such duty existed. (A) is incorrect because the facts do not show the man had the intention to commit criminal damage (which is necessary for attempt). (B) and (E) are incorrect because theft and attempted theft may be difficult to prove because there may not be an intention to permanently deprive, and attempt requires an intention to commit the full underlying offence."},{n:7,id:"WEA124",scenario:"A man died four months ago, leaving his entire large estate to charity. He is survived by his wife, who is bringing a claim against his estate under the Inheritance (Provision for Family and Dependants) Act 1975 ('the Act'). His wife is 42 and able-bodied, and she has a full-time job and substantial savings, which will allow her to easily meet her outgoings. The couple had been married for 10 years and have two young children who the wife continues to care for.",q:"Is the man's wife likely to be awarded a substantial sum in her claim?",opts:["No, as she has substantial savings.","Yes, even though she is able to maintain herself.","No, as she is working full-time.","No, as she is not disabled.","Yes, primarily on the basis that she will need to pay for childcare in order to continue full-time work."],ans:"B",expl:"(B) The man's wife is likely to be awarded a substantial sum from the estate even though she is able to maintain herself. When hearing a claim under the Inheritance (Provision for Family and Dependants) Act 1975, the court will consider whether the will or intestacy has failed to make reasonable financial provision for the applicant. In the case of spouses, the standard of financial provision is that which would be reasonable in all the circumstances, whether or not required for maintenance. Consequently, the fact that the wife is working, has savings, and can meet her outgoings will not be key. Under the guidelines, the court will consider the age of the spouse, the duration of the marriage, the spouse's contribution to the welfare of the children, and the provision that might reasonably have been expected on divorce. All of these factors point towards the wife receiving a large share of the estate. The fact that the estate is large is also likely to lead to the wife being awarded a substantial sum from the estate. (A) and (C) are incorrect. The savings and work of the wife will not prevent the award of a substantial sum, as discussed above. (D) is incorrect. The fact that the wife is not disabled will not prevent the award of a large sum, again as the focus is not on the wife's need for maintenance. (E) is incorrect. Whilst the fact that the woman will need to pay for childcare is a relevant factor, it is not the primary factor that will lead to the award of a large sum. The court will determine what financial provision for the spouse would be reasonable in all the circumstances, not just what the spouse might need for maintenance."},{n:8,id:"CRL036",scenario:"An athlete was at an archery competition and became very upset with his competitors, who were mocking him. He decided he should scare them by shooting an arrow into their group. However, the athlete did not think he would be brave enough to do so. Therefore, he drank five pints of extra strong lager and became intoxicated. Feeling more courageous, he shot an arrow into the middle of the group. The group tried to flee, but unfortunately, a competitor who was in the middle of the group caught the arrow full in the chest and died.",q:"Has the athlete committed the crime of murder?",opts:["No, because he lost control when the group started mocking him.","Yes, because he had the specific intent to cause harm to the group.","No, because he was intoxicated at the time.","No, because he did not intend to cause any member of the group to die or to be seriously harmed.","Yes, because death was a virtually certain consequence of the athlete's actions."],ans:"E",expl:"(E) The student has committed murder because the death or serious injury was a virtually certain outcome, and the defendant realised it was a virtually certain outcome. Normally, murder requires an intent to kill or cause grievous bodily injury. Here, the athlete had the intent only to scare the group. However, where the result (death or serious injury) is a virtually certain consequence of his conduct and the defendant foresees it is a virtually certain outcome, intent may be implied from the conduct under the concept of indirect intent. (A) is incorrect as the mere mocking would not be sufficient for the court to find that the circumstances were of such a grave character and that the athlete would have a justifiable sense of being seriously wronged - a requirement of the loss of control (manslaughter) defence. (C) is incorrect because the athlete wanted to shoot the arrow into the group. He used the alcohol to firm his resolve. In such a case, intoxication is not a defence. (B) is incorrect because the athlete did not have the specific intent to kill, but indirect intent is present. (D) is incorrect because it fails to take into account the concept of indirect intent.",note:"Source slip kept: the explanation calls the defendant 'the student' instead of 'the athlete'."},{n:9,id:"WEA053",scenario:`A man made a valid will five years ago. In relevant part, the will provided:
(1) I give £20,000 to my cousin's eldest daughter.
(2) I give the remainder of my estate to my sister.
The man died last month. His cousin's eldest daughter died last year, but the cousin has three other surviving daughters. The man had not changed his will since it was written. In addition to his cousin and his cousin's surviving daughters, the man is survived by a sister.`,q:"Which of the following best describes entitlement to the man's estate?",opts:["The man's sister will inherit his entire estate.","The eldest of the cousin's remaining three daughters will inherit the £20,000, and the man's sister will inherit the remainder of the estate.","The £20,000 will be split equally amongst the cousin's remaining three daughters, and the man's sister will inherit the rest of the estate.","Because a key beneficiary has died, the will is invalid due to lapse, and the whole estate will be distributed under the intestacy rules.","The £20,000 will pass via the intestacy rules, and the sister will inherit the remainder of the estate."],ans:"A",expl:`(A) The man's sister will inherit his entire estate. If a beneficiary has predeceased the testator, the gift to them will lapse - that is, fail. There is a presumption that, as regards people, a will is construed at the date of execution. Therefore, the "cousin's eldest daughter" is construed as a gift to the daughter fulfilling that description on the date when the will was made. As that daughter has died, the gift will lapse, and the £20,000 will form part of the residuary estate, which was left to the man's sister. (B) and (C) are incorrect. The £20,000 will not pass on to the other daughters of the cousin. (D) is incorrect. The lapsed gift will not affect the validity of the will itself. (E) is incorrect. When a gift lapses, it falls into the residue. The £20,000 will pass to the sister as part of the residuary estate rather than via the intestacy rules.`},{n:10,id:"CRL001",scenario:"A woman's husband has emotionally and physically abused her for the entirety of their 10-year marriage. She does not have any recognisable medical condition. One evening, the woman's husband comes into the house and hits the woman in the face when he demands his dinner. He then turns on the television to watch the news. The woman goes to the kitchen, picks up a knife, returns to the room in which her husband is watching television, and stabs and kills him.",q:"Which of the following is the woman's best defence to a charge of murder?",opts:["Loss of control.","Diminished responsibility.","Self-defence.","Unfitness to plead.","The woman has no defence."],ans:"A",expl:"(A) Loss of control is the woman's best defence. Loss of control is a partial defence to murder, reducing the crime to manslaughter. The defence applies when the defendant (1) suffers from a loss of control (2) caused by a triggering event, such as a fear of violence, and (3) a hypothetical person of the defendant's age and sex might have reacted in the same way. Here, the woman can argue that she lost control having been physically abused for 10 years and her husband struck her. It is reasonable to fear serious violence under these circumstances, and a hypothetical woman who had been treated that way might have reacted in the same way. (B) is incorrect because diminished responsibility requires that the defendant be suffering from a recognised medical condition, and we have no facts supporting that here. (C) is not the best choice because for self-defence, the woman needed to act reasonably at the time that the offence was committed. Here, the woman was not in immediate danger when she stabbed her husband. He was watching television. Therefore, she cannot use self-defence. (D) is incorrect because a person is unfit to plead when they are unable to comprehend the course of the court proceedings as to make a proper defence. There is no indication that the woman has insufficient intellect to comprehend the proceedings, but even if she were unfit, this would not be her best defence because she could potentially be sent to hospital for an indefinite period. (E) is not the best answer because, although 'loss of control' is only a partial defence, it is still a defence to murder, although it only reduces a conviction for murder to one of manslaughter."},{n:11,id:"CRL097",scenario:"A 14-year-old boy and a 15-year-old boy are playing with a shotgun, which they both believe to be unloaded. The 14-year-old aims the gun at the 15-year-old. The 15-year-old laughs, as he thinks this funny. The 14-year-old then pulls the trigger, believing nothing will happen. In fact, the gun contains a bullet, which fires at the 15-year-old. The 15-year-old dies immediately.",q:"Is the 14-year-old guilty of manslaughter?",opts:["Yes, because he acted negligently.","Yes, because he acted recklessly.","Yes, because a reasonable person would have checked to see if there were any bullets in the gun before pulling the trigger.","Yes, because he has committed a dangerous and unlawful act.","No, because he has not committed an unlawful act."],ans:"E",expl:"(E) The 14-year-old is not guilty of manslaughter. There is no intention to kill or cause grievous bodily harm here, so voluntary manslaughter is not available. Likewise, there is no duty of care, so gross negligence manslaughter in not available. The only form of manslaughter that could apply here is unlawful act manslaughter ('UAM'). UAM requires an act that is intentional, unlawful, and dangerous that causes the death of the victim. To be 'unlawful', there must be an underlying criminal offence. Here, we have an act that is intentional and dangerous that causes the death of the victim, but it is not unlawful. There is no assault, as the victim also does not believe the gun to be loaded, so there is no apprehension of the application of force. (A), (B), and (C) are incorrect as negligence, recklessness, and the behaviour of the reasonable person are not relevant. (D) is incorrect as there has not been an unlawful act."},{n:12,id:"CRL080",scenario:"A man and his friend get into an argument in a pub over who was the best football player of all time. The friend loses his temper and punches the man, knocking him out. The friend immediately runs to the toilet to get a wet towel to put on the man's head. Another bar patron bends over the man, pretending to examine him, but instead the patron skilfully removes the man's wallet. The man's friend returns with the towel in time to see the patron put the man's wallet in his own pocket. The friend confronts the patron, who gives the wallet back to the friend.",q:"Is the patron guilty of robbery?",opts:["Yes, because force was used to render the man unconscious.","No, because the patron did not leave with the wallet.","Yes, because the patron took the unconscious man's wallet.","No, because the patron did not use force to obtain the wallet.","Yes, because force had to be used when the patron removed the wallet from the unconscious man's person."],ans:"D",expl:"(D) The patron is not guilty of robbery because robbery requires a theft of property accompanied by the defendant's use of force or threat of the use of force immediately before or at the same time as the theft. Here, the patron did not use any force to accomplish the theft of the wallet. So, whilst there was a theft, there was no robbery. (A) is incorrect because the patron did not have any hand in the force that was used to render the victim unconscious. (B) is incorrect because there is no requirement for robbery that the robber actually gets away; the crime occurs as soon as there is a forcible taking. (C) is incorrect because it does not address the requirement of force. (E) is incorrect because the force needed to lift a wallet from a person's clothing is not the type of force required under the theft act for robbery. The crime requires an act or threat of violent force."},{n:13,id:"TRU030",scenario:"An unmarried couple have been living together in a house registered in the name of one party alone. At the time of the purchase, the non-legal owner paid £5,000 of the £200,000 purchase price. The legal owner paid £95,000, and the remaining £100,000 was raised by a mortgage on the property. The parties have separated, and the non-legal owner wishes to claim an interest in the property. The court has decided that there is a constructive trust based on inferred common intention.",q:"What factors will the court take into account when quantifying the size of the claimant's share?",opts:["Direct contributions to the purchase price and mortgage and other financial contributions made to the household by the claimant only.","The whole course of dealing between the parties in order to infer the parties' intentions as to the share the claimant should receive.","Direct contributions to the purchase price only.","Direct contributions to the purchase price and mortgage only.","The whole course of dealing between the parties so as to award a fair share to the claimant."],ans:"B",expl:"(B) Once the court has decided that there is a common intention constructive trust based on express or implied intention and detrimental reliance, it will look at the whole course of dealing between the parties. The court's aim is not to impose a fair solution but to infer the parties' intentions from their conduct over the whole period. (A), (C), and (D) are incorrect because the court is not limited to looking at financial aspects of the relationship alone. (E) is incorrect because the court is not looking for a fair solution but to infer the parties' intentions."},{n:14,id:"CRL087",scenario:"A man buys a gun to shoot his wife's lover. He goes to a crowded restaurant where he knows the lover is having lunch. He sees the lover at the far side of the restaurant, takes aim, and fires. The man intends to kill the lover and foresees that he may hit someone else in the restaurant. The man misses the lover, but accidentally kills a waiter instead.",q:"Is the man guilty of murder?",opts:["Yes, because he was reckless.","Yes, because his intention to kill the lover is transferred to the waiter.","No, because it was a mistake.","No, because it was an accident.","No, because he can argue diminished responsibility."],ans:"B",expl:"(B) The man is guilty of murder because his intention to kill the lover is transferred to the waiter. Under the doctrine of transferred malice, when a defendant intends to commit an offence but inadvertently commits it against a different victim, the mens rea can be transferred from the intended victim to the actual victim (as long as the offence committed is of the same type as the one intended). (A) is incorrect, as the mens rea for murder is either intention to kill or cause grievous bodily harm; recklessness is not sufficient. (C) and (E) are both incorrect as, whilst they are defences at law, neither applies here. (D) is not correct as the only accident is the intended victim, and that can be addressed under transferred malice."},{n:15,id:"WEA133",scenario:"A man died recently, and his executors are now dealing with his estate. The man's estate includes a business, which the man previously ran as a sole trader, and which the executors now plan to run until they can sell it. The man also owned a rental property. The tenant of the rental property has just moved out, and the executors plan to find a new tenant.",q:"Which of the following statements about the administration of the man's estate is correct?",opts:["The executors have no power to re-let the rental property following the departure of the tenant.","The executors have the power to carry on running the man's business.","The executors have the power to sell the rental property but not to re-let it.","The executors have no power to re-let the rental property or sell the business.","The executors have no power to sell the business."],ans:"B",expl:"(B) The executors have the power to carry on running the man's business. Personal representatives have a variety of powers to support the administration of an estate. The personal representatives generally have no authority to carry on the deceased's sole trade, but they can do so in order to sell the business as a going concern, as in this case. (A) is incorrect. Personal representatives have the power to lease estate property. (D) is therefore incorrect. (C) is incorrect. Personal representatives have the power to sell and lease estate property. (E) is incorrect. Personal representatives have the power to sell assets, including a business.",note:"Option (D) is garbled on both screens; its wording is reconstructed from the fragments ('no power to … let the rental property or sel[l]') and the explanation."},{n:16,id:"WEA092",scenario:"A woman died last week, leaving her entire estate to her nephew in her will. On her death, the woman held £10,000 in a bank account, a variety of valuable antiques, and a life interest in a trust fund which had been created under her father's will. Several years ago, the woman transferred her house to her daughter in an attempt to reduce her inheritance tax liability. However, the woman continued to live in the house until her death.",q:"Which of the woman's assets will her nephew receive under her will?",opts:["£10,000 in the bank account, the antiques, the interest in the trust fund, and the house.","£10,000 in the bank account and the antiques only.","£10,000 in the bank account, the antiques, and the house only.","The antiques and the interest in the trust fund only.","£10,000 in the bank account, the interest in the trust fund, and the house only."],ans:"B",expl:"(B) The woman's nephew will receive the £10,000 in the bank account and the antiques only. The nephew will not receive the interest in the trust fund because the woman had only a life interest. A life estate ceases on the beneficiary's death, so there was no interest in the trust to pass on to the woman's nephew. The nephew will not receive the house because the woman did not own it for succession purposes. The woman had transferred the legal title to the ho
