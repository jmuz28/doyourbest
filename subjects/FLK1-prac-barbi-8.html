lanation of (D) and (E), 'the defendant should not seek to persuade a client' should read 'the solicitor'."},{n:33,id:"PRP211",scenario:"A buyer client has just received their mortgage offer to assist with their purchase of a residential freehold property. The mortgage offer includes the following: 'This mortgage offer is made on an interest only basis'. The client telephones their solicitor to ask what this means.",q:"How should the solicitor respond?",opts:["This means that the borrower's monthly repayments are linked to a life insurance policy.","This means that the borrower's monthly repayments are interest only and the capital is due at the end of the term.","This means that the borrower's monthly repayments include an element of capital and interest.","This means that the borrower's monthly repayments are linked to a personal pension policy.","This means that the borrower's monthly repayments are capital only and the interest is due at the end of the term."],ans:"B",expl:"(B) An interest only mortgage is one in which the borrower repays only interest for the term of the loan and then repays the capital sum at the end of the term. For these types of mortgages, the borrower must arrange some other form of investment plan to ensure the capital sum can be repaid at the end of the term. (A) is incorrect because it describes an 'endowment' mortgage. (C) is incorrect because it describes a 'repayment' mortgage. (D) is incorrect because it describes a 'pension mortgage'. (E) is incorrect because no mortgage is set up that way."},{n:34,id:"TRU139",scenario:"In her will, a woman gave £50,000 to trustees on trust to invest and use the income for the maintenance of the Newtown Food Bank. A few years after her death, the food bank closed.",q:"Which of the following statements best describes the effect of the gift?",opts:["The trust fails, and the trustees hold on resulting trust for the woman's estate.","The gift will be applied cy-pres if the court finds evidence of general charitable intention.","The trust fails because it is unenforceable.","The trustees have discretion to use the fund for a similar purpose.","The gift will be applied cy-pres for a similar purpose."],ans:"E",expl:"(E) The gift will be applied cy-pres for a similar purpose. When a trust for a charitable purpose has taken effect but subsequently fails because it is impossible or impractical to carry out, the funds will be applied cy-pres to a similar charitable purpose. The trust for the maintenance of the Newtown Food Bank is a charitable trust because it is for a charitable purpose, it is for the public benefit, and it is exclusively charitable. The gift vested at the date of the woman's death, at which time the food bank was still in existence. This means that the gift for a charitable purpose was effective at the date of death, and the funds will be applied cy-pres. (A) is incorrect because the trust does not fail. (B) is incorrect because it is only necessary to find evidence of general charitable intention in a case of initial failure. (C) is incorrect because charitable trusts are enforced on behalf of the public by the Attorney General. (D) is incorrect because the application of the fund is not for the trustees to decide."},{n:35,id:"TAX140",scenario:"A business owner runs a large children's nursery. The owner ordered some pizzas for an end-of-year party. The cost of the pizzas was £400.",q:"Which of the following best describes the amount of VAT that should be charged?",opts:["£0, because this is a business-to-business transaction, and VAT is charged against consumers.","£20, because this is a business-to-business transaction, so the 5% reduced rate VAT is charged.","£60, because the 5% reduced rate discount is deducted from the standard rate, as this is a business-to-business transaction.","£80, because the 20% standard VAT rate would apply.","It depends on whether the nursery's turnover is above £85,000."],ans:"D",expl:"(D) £80, because the 20% standard VAT rate would apply. Any good or service that is not zero-rated, reduced-rated, or exempt is charged VAT at the standard rate of 20%. It does not matter whether the transaction is business to business or business to consumer. Thus, (A), (B), and (C) are incorrect. (E) is incorrect because the £85,000 goes to whether the nursery must register for VAT and that does not affect the amount of VAT the pizza business must charge.",note:"Source point kept: the VAT registration threshold was £85,000 at the time; it has been £90,000 since 1 April 2024."},{n:36,id:"CRL082",scenario:"A woman and a man got into an argument in a pub over who was the best football player of all time. The woman lost control of her temper and threw her pint glass at the man. The glass hit the man on the forearm, causing a deep gash. The woman called for an ambulance, and the man was taken to hospital. It was determined that the man needed surgery. Unfortunately, the anaesthetist on the case had been drinking heavily. As a result, the anaesthetist was extremely negligent and gave the man five times the appropriate amount of anaesthetic. The man died as a result.",q:"If the woman is prosecuted on a charge of involuntary manslaughter, will she likely be convicted?",opts:["The woman will not likely be convicted of involuntary manslaughter because she did not intend to kill her friend.","The woman will likely be convicted of involuntary manslaughter because the woman lost control of her temper.","The woman will not likely be convicted of involuntary manslaughter because the anaesthetist's actions broke the chain of causation.","The woman will likely be convicted of involuntary manslaughter under the doctrine of indirect intent.","The woman will not likely be convicted of involuntary manslaughter because of the lack of mens rea."],ans:"C",expl:"(C) The woman will not likely be convicted of involuntary manslaughter because the anaesthetist's actions broke the chain of causation. Involuntary manslaughter is committed when a person kills another without the intent to kill but rather during the commission of a criminal act that carries an objective risk to the victim and the victim dies, or where the defendant owes the victim a duty of care and they breach that duty. Arguably, throwing a pint glass at a person carries an objective risk. However, causation is still required. Here, the anaesthetist was extremely negligent. Whilst ordinary medical negligence will not likely be held to break the chain of causation, extreme negligence (gross negligence) can. Poor medical treatment will break the chain of causation where it is so independent of the original harm and so potent that it renders the original harm insignificant. That is arguably the case here, as the cut contributed nothing to the victim's death, save for bringing the victim to hospital in the first place. (A) is incorrect because intent to kill is not required for involuntary manslaughter, that is an element of murder. So, it does not matter that the woman did not intend to kill her friend. (B) is incorrect because it, too, is related to the wrong crime. Loss of control is related to voluntary manslaughter, which is a partial defence to murder and not relevant here. (D) is incorrect. The doctrine of indirect intent allows intent to be found from a person's actions. Again, we do not need intent to kill for involuntary manslaughter, and so the doctrine is not relevant here. (E) is incorrect. The woman had sufficient mens rea here. She intentionally threw the pint glass at her friend, which is a sufficient unlawful act on which to base an involuntary manslaughter conviction.",note:`${pr} Source slip kept: option (A) and the explanation call the victim 'her friend'; the facts describe 'a man' she argued with in a pub.`},{n:37,id:"CRL057",scenario:"A man's neighbour constantly complains that the man does not keep his garden in good condition. To aggravate the neighbour, the man takes an axe to the fence that separates the man's garden from that of his neighbour. The fence belonged to the man, but the neighbour had helped the man build it the previous year to keep the gardens better separated. The neighbour calls the police and complains that the man chopped down the fence with an axe.",q:"Can the man be held guilty of criminal damage to property?",opts:["Yes, because the neighbour helped to build the fence.","No, because the actus reus requirement cannot be satisfied under the circumstances.","Yes, because the man intended to aggravate the neighbour when he chopped down the fence.","No, because the neighbour's complaining caused the man to take the action.","Yes, because the man used an axe to destroy the fence."],ans:"B",expl:"(B) The man cannot be prosecuted because the actus reus - or physical act - needed to be guilty of criminal damage is not present. The crime arises when a person destroys or damages property belonging to another, either intentionally or recklessly. Here, the fence belonged to the man. (A) is incorrect because the fact the neighbour helped build the fence does nothing to change the fact that it was the man's fence. (C), (D), and (E) are incorrect because the man's intent, the cause of the man's actions, and the method the man used to destroy the fence are irrelevant."},{n:38,id:"WEA023",scenario:"A man executed a will five years ago. He always kept the will in a locked safe in his home. The man died two months ago. Although the personal representative found the will in the man's safe, the personal representative nonetheless determines that the man died intestate.",q:"Which of the following events would lead the personal representative to the conclusion that the man died intestate?",opts:["The man married his new partner after making the will.","The man divorced his wife after making the will.",'The man wrote the word "revoked" across the front page of the will.',"The residuary beneficiary died before the man died.","The man went bankrupt after making the will."],ans:"A",expl:`(A) The man will be deemed to have died intestate if he married after making the will. A marriage revokes a pre-existing will unless it is clear from the will that (1) the testator was expecting to marry a particular person and (2) the testator intended that the will should not be revoked by the marriage. Here, if the man got married after making the will and the will did not mention the marriage, the will is revoked. The man would therefore die intestate. (B) is incorrect. If a testator divorces after executing a will, gifts to the testator's former spouse will fail, but the will is not automatically revoked by the divorce. (C) is incorrect. Although a testator can revoke a will by destroying it, writing "revoked" across the will is not sufficient to constitute destruction of the will. (D) is incorrect. The death of a key beneficiary does not invalidate the will, although the death of the residuary beneficiary may lead to a partial intestacy situation. (E) is incorrect. Bankruptcy has no effect on the validity of a will.`},{n:39,id:"TAX135",scenario:`A company builds a factory in 2019 and sells it to another company in 2021 for £475,000 (VAT exclusive). Assume the applicable stamp duty land tax ('SDLT') rates were:
0% to £150,000
2% £150,001 to £250,000
5% £250,001 and above`,q:"What is the correct VAT and SDLT treatment of this supply?",opts:["It is an exempt supply for VAT and the buyer must pay £13,250 in SDLT.","It is an exempt supply for VAT and the buyer must pay £13,750 in SDLT.","It is a zero-rated supply for VAT and the buyer must pay £13,250 in SDLT.","It is a standard-rated supply for VAT and the buyer must pay £13,250 in SDLT.","It is a standard-rated supply for VAT and the buyer must pay £18,000 in SDLT."],ans:"E",expl:"(E) It is a standard-rated supply for VAT and the buyer must pay £18,000 in SDLT. When the commercial building was sold to the buyer, it was less than three years old and, therefore, is a standard-rated supply. SDLT must be calculated on the VAT inclusive price at the non-residential rates. To determine the VAT inclusive price, we add 20% to the purchase price of £475,000 (£570,000). Next, to calculate SDLT, the first £150,000 of the VAT inclusive purchase price is zero-rated, so we only charge SDLT on the remaining £420,000. The first £100,000 of the remaining £420,000 is taxed at 2% (£2,000) and the remaining £320,000 is taxed at 5% (£16,000). Therefore, the total SDLT owned by the buyer is £18,000.",note:"Source wording kept: 'the total SDLT owned by the buyer' (owed)."},{n:40,id:"CRP038",scenario:"A woman is arrested on suspicion of battery after she is involved in an altercation with her ex-partner at a nightclub. She arrives at the police station at 11pm on Saturday night. She is taken into custody and is kept there until 11pm on Sunday night. The investigating officer wants to keep the woman in custody for a further period before deciding whether to charge her, as his investigation is not yet concluded.",q:"Is the investigating officer able to extend the woman's detention until 11am on Monday morning?",opts:["No, it is not possible to keep the woman in custody for longer than 24 hours.","No, it is not possible to keep the woman in custody for longer than 12 hours.","Yes, if it is authorised by a police officer of the rank of superintendent or above.","Yes, if it is authorised by a police officer of the rank of inspector or above.","Yes, if it is authorised by the Magistrates' Court."],ans:"A",expl:"(A) The investigating officer cannot extend the woman's detention because she cannot be kept in custody for longer than 24 hours. As the woman is charged with a summary only offence, she can be detained for 24 hours only. A further extension of 12 hours can be granted by an officer of the rank of superintendent or above for indictable offences and either way offences, and a further 36 and 24 hours can thereafter be authorised by the Magistrates' Court for indictable and either way offences. However, as battery is summary only, the woman can be kept for only 24 hours. (B) is incorrect because the custody time limit is 24 hours. (C), (D), and (E) are all incorrect because extensions cannot be authorised for summary only offences.",note:"Source wording kept: the explanation says she 'is charged with' a summary only offence; on the facts she has been arrested but not yet charged."},{n:41,id:"CRP023",scenario:"A defendant is being tried for actual bodily harm ('ABH') in the Magistrates' Court. The case is being heard by a panel of three lay magistrates. During his evidence, the defendant attacks the character of the victim of the alleged offence, saying the victim has a history of violence. As a result, the prosecution wants to apply to adduce the defendant's previous convictions for ABH and assault.",q:"Who will hear this application?",opts:["A different panel of lay magistrates.","A District Judge because the application deals with a point of law.","The lay panel's legal advisor because the application concerns a point of law.","The lay panel.","No one will hear the application because the admission of bad character evidence cannot be considered on the day of trial."],ans:"D",expl:"(D) The lay panel will hear the application. In the Magistrates' Court, the lay panel or District Judge ('DJ') is the sole arbiter of matters of both fact and law. When matters of law have to be decided during the course of a trial, they will be heard by the lay panel or DJ. If the panel or DJ rules evidence inadmissible, they will simply put the evidence from their minds for the remainder of the trial. For this reason, (A), (B), (C), and (E) are incorrect. When a matter of law arises, it will simply be dealt with by the panel or DJ hearing the case."},{n:42,id:"ETH151",scenario:"A solicitor has acted for a client convicted of offences relating to pornography. The former client is serving a custodial sentence in a high security prison. The former client contacts the solicitor from prison requesting copies of digital photographs and recordings of a witness's evidence. The solicitor is subject to a court order that requires him to ensure that this evidence will be kept securely in the firm's safe.",q:"Do the rules of professional conduct allow the solicitor to comply with the former client's request?",opts:["Yes, because the solicitor owes a duty to act in the former client's best interests.","Yes, because the evidence belongs to the former client.","No, because the solicitor is subject to a court order to keep the evidence in the safe.","Yes, because whilst the solicitor is subject to a court order to keep the evidence in the safe, the former client's request takes priority.","No, because the solicitor owes no duties to the former client."],ans:"C",expl:"(C) The SRA Code of Conduct states that a solicitor must comply with all court orders which place obligations on them, and they must not place themselves in contempt of court, as would be the case if the solicitor acted on the former client's request. (A), (B), and (D) are all incorrect because the duty to the court takes precedence over any duties owed to the client. (E) is incorrect because a solicitor does owe a duty of confidentiality to their former clients, albeit that this is not relevant to the decisions which must be made in this scenario."},{n:43,id:"CRL129",scenario:"An actor attends a plastic surgeon in order to have their lips injected with fillers, to give them a fuller appearance. The plastic surgeon carries out the procedure in accordance with their agreement. Once the procedure is completed, the actor is distraught at their appearance. The actor says their career is over as they will never be able to get any work with their lips looking how they do.",q:"What offence, if any, is the plastic surgeon guilty of?",opts:["Assault.","Battery.","Actual bodily harm ('ABH').","Section 20 grievous bodily harm ('s20 GBH').","None."],ans:"E",expl:"(E) The surgeon is guilty of no crime. Whilst the surgeon has caused an 'injury' in that they have altered the actor's appearance, this was done in accordance with their instruction and so with their consent. Whilst it is not ordinarily possible to consent to injury, surgery (including cosmetic surgery) is an exception to this rule. Consequently, whilst the actor may be unhappy, there is no criminal liability."},{n:44,id:"TAX086",scenario:"A gentleman of considerable wealth has disposed [of] a number of investments in the current tax year.",q:"Which of the following would be subject to capital gains tax?",opts:["Proceeds from the sale of a collectible Leica camera from the 1950s, originally purchased for £15 and sold for £5,000.","Proceeds from the sale of a prize-winning bull, born and raised at the gentleman's farm and sold for £100,000.","A premium bond prize of £1,000,000.","Proceeds from the sale of a 1950 Studebaker 'Bullet Nose' car, bought three years ago at £300,000 and sold for £500,000.","Proceeds from the sale of a fintech company where the gentleman was a director and owned 10% and the company was sold to a US technology firm for £100 million."],ans:"E",expl:"(E) The proceeds of the sale of the fintech company are subject to capital gains tax. Proceeds from the sale of cars, farm animals, tangible moveable property (including cameras) sold for less than £6,000, and premium bond prizes are exempt from capital gains tax because these assets are exempt. For the fintech company, the gentleman is eligible for business asset disposal relief (formerly called entrepreneurs' relief), as he owned more than 5% and was a director. However, this relief only reduces the tax rate to 10%, rather than provide a complete exemption."},{n:45,id:"ETH153",scenario:"A solicitor is representing a criminal client in court at a mitigation hearing. The client is a well-known local criminal and has a long record of other criminal convictions. He has been convicted of the latest offence, but when his previous history is shared with the court it is obvious that they have the wrong records and are not aware of his other convictions. Consequently, the solicitor knows that the client will be treated as a first-time offender and his punishment will be less severe as a consequence.",q:"Which of the following statements best describes what the solicitor should do?",opts:["The solicitor should cease to act immediately.","The solicitor should not make statements about the client's character or previous convictions during the hearing.","The solicitor should immediately correct the information without discussing this with the client.","The solicitor can imply that the client is of good character during the hearing but must not make statements about the client's previous convictions.","The solicitor should ask the client to correct the information. If the client refuses, the solicitor should cease to act."],ans:"E",expl:"(E) A solicitor has a duty not to mislead the court or others. This standard can be violated by affirmative acts, by omissions, or by being complicit in the acts or omissions of others. Silence on the part of the solicitor would suggest that they are misleading the court. However, the solicitor owes a duty of confidentiality to their client and must seek their consent to correct the information. If they refuse, the solicitor has a conflict between their duties to the court and duties to their client and must cease acting immediately. (A) is incorrect because the solicitor must take instructions from their client in the first instance. (C) is incorrect because this would place the solicitor in breach of their duties to his client. (B) and (D) are both incorrect because the solicitor's silence could be regarded as misleading the court by omission.",note:"The facts are jumbled in the scan; they are given here in reading order."},{n:46,id:"PRP116",scenario:`A charity is purchasing a property which it proposes to use as a village hall for public events. The charity had a survey carried out which has revealed the following:
'The property has a single-story extension built on the rear. The seller has indicated that the building works were completed three years ago. From my inspection, the extension is not structurally sound and could be unsafe.'
The charity is keen to proceed with the purchase of the property because it is being offered for sale at a low price.`,q:"What advice should the solicitor for the charity give in relation to building regulations?",opts:["That the local authority can obtain an injunction to require unsafe work to be dealt with at any time, so the seller should be required to remedy the situation at their own cost.","That the charity should not proceed with the purchase of the property.","That the timeframe for enforcement is one year and as this has passed, so the local authority cannot take enforcement action.","That the timeframe for enforcement is four years and as this has not passed, the local authority can take enforcement action.","That the seller should be required to provide lack of building regulation indemnity insurance at their own expense and the clause be inserted in the contract to this effect."],ans:"A",expl:"(A) The solicitor should advise the charity that the local authority can obtain an injunction to require unsafe work to be dealt with at any time, so the seller should be required to remedy the situation at their own cost. The survey makes it clear that the work is unsafe. A local authority can obtain an injunction to force a property owner to bring property up to building standards at any time. Given that the facts make it clear that the property will be put to public use, such action seems likely. (B) is incorrect. If the seller refuses to comply with the request in (A), advising the charity to not proceed might be prudent (if it is unwilling to do the needed work), but it is too early to give this advice; at this point we would want to ask the seller to comply. (C) is incorrect. The timeframe for enforcement for lack of building regulations in an ordinary circumstance is one year, however, if the works are unsafe, an injunction can be sought at any time. (D) is incorrect. The timeframe for enforcement in relation to lack of planning permission is four years, but planning permission is not relevant to this question. (E) is incorrect because when a building is unsafe, indemnity insurance for lack of building regulation consent is not available; it is available only if the enforcement period has passed, and as discussed above, enforcement through injunction to make a building safe is not subject to a time limit.",note:"The surveyor's report is jumbled in the scan; it is given here in reading order."},{n:47,id:"CRP047",scenario:"A defendant is facing trial for theft. He has been remanded on bail, subject to a condition of daily reporting at his local police station. For the last week, the defendant has failed to report at the police station as required. Today, the defendant was due to attend court for a case management hearing, but he failed to attend.",q:"Which of the following best describes the consequences of the defendant's failure to comply with his bail conditions and his failure to attend court as required?",opts:["Breach of bail conditions constitutes a criminal offence. Failure to surrender means the defendant can be arrested and bail will be reconsidered.","Breach of bail means the defendant can be arrested and bail will be reconsidered. Failure to surrender constitutes a criminal offence.","Breach of bail conditions and failure to surrender both constitute criminal offences.","Breach of bail conditions and failure to surrender mean the defendant can be arrested and bail will be reconsidered.","Breach of bail conditions and failure to surrender both mean the defendant can be arrested and will be remanded in custody thereafter."],ans:"B",expl:"(B) If a defendant breaches their bail conditions, they can be arrested without warrant. Their bail can be withdrawn or more stringent conditions imposed by the court. It does not constitute a criminal offence, but it does result in bail being reconsidered. If a defendant fails to surrender to bail, they commit a separate offence and also risk their bail being revoked. (A) is incorrect as it reverses the position for failing to surrender and breach of bail. (C) is incorrect as it states breach of bail is an offence. (D) is incorrect as it fails to identify that failure to surrender is a criminal offence. (E) is incorrect as there will not be an automatic remand in custody; bail will be reconsidered."},{n:48,id:"PRP212",scenario:"A solicitor is acting for a first-time home buyer who will be financing her purchase with a mortgage. The conveyance is taking place under the Law Society Conveyancing Protocol (the 'Protocol'). The buyer is anxious to see a copy of the contract and asks her solicitor when this will be ready.",q:"In a Protocol transaction, who prepares the contract package?",opts:["The buyer's lender.","The estate agent.","The seller's solicitor.","The buyer's solicitor.","Her Majesty's Land Registry."],ans:"C",expl:"(C) In a Protocol transaction, the seller's solicitor will draft the contract and send the contract package to the buyer's solicitor. The contract package will comprise: the draft contract in duplicate; the Property Information Form and Fittings and Contents Form, both completed by the seller; a copy of the seller's title (or epitome of title if the title is unregistered), any other relevant title documents, and title plan; and any guarantees or planning permissions. Therefore, all of the other answers are incorrect."},{n:49,id:"LAN043",scenario:"A man is the sole owner of the home which he lives in with his wife. The title to the property is unregistered. The spouses' marriage has broken down and his wife is seeking legal advice because she is concerned that her husband might sell the house.",q:"How should the wife protect her position?",opts:["The wife must register a Class F land charge against her husband's name.","The wife must register a home rights notice on the charges register of title.","The wife does not need to take any steps as her occupation confers an overriding interest which will bind a buyer.","The wife must put a Form A restriction on the register to protect her beneficial interest in the property.","The wife must apply to court for an order for sale."],ans:"A",expl:"(A) The wife should protect her position by registering a Class F land charge against her husband's name. A Class F land charge protects a non-owning spouse's (or civil partner's) statutory right of occupation of the marital home. Such a right must be protected by registration as a land charge to be enforceable against a subsequent buyer of the land. (B) is incorrect because this is how the wife would protect her interest if title to the property were registered. (C) is incorrect because the right of occupation enjoyed by a non-owning spouse or civil partner is not capable of being an overriding interest. (D) is incorrect because a Form A restriction is relevant to registered title. A Form A restriction may be entered on the proprietorship register to denote a person's beneficial interest in the property. (E) is incorrect because it is not an appropriate remedy to protect the wife's interest here. As explained above, the wife must protect her interest by registering a Class F land charge."},{n:50,id:"CRL139",scenario:"A husband is having an affair. The wife discovers the affair and leaves the husband, taking their three children. The husband is furious. He agrees with his lover that they will attack the wife with a hammer and break her legs, to punish her for abandoning the marriage. The husband and lover go to the wife's house and await her return home. When she arrives, the lover hits the wife repeatedly with the hammer, whilst the husband shouts encouragement. The wife dies from the injuries she sustains.",q:"Which of the following best describes the husband and lover's liability?",opts:["The husband and lover will both be liable for murder as co-principals.","The husband will be liable for section 18 grievous bodily harm, and the lover will be liable for murder.","The husband will be liable as an accessory to section 18 grievous bodily harm, and the lover will be liable for murder.","The husband and lover will both be liable for voluntary manslaughter as co-principals.","The husband and lover will both be liable for involuntary manslaughter as co-principals."],ans:"A",expl:"(A) The husband and lover will both be liable for murder as co-principals. Under the joint enterprise doctrine, a secondary participant in a crime can be criminally liable as a co-principal if they assisted or encouraged the commission of the crime and intended to assist or encourage the commission of the crime committed by the principal. Here, the husband assisted or encouraged the commission of serious bodily harm, intending the lover to commit serious bodily harm. As the mens rea for murder is satisfied by an intention to commit grievous bodily harm, both the husband and the lover have satisfied the mens rea, and both will be held liable as co-principals under the concept of joint enterprise. (B) and (C) are incorrect, as here the husband can be held liable for murder as a co-principal. (D) is incorrect, as there is no suggestion of loss of control or diminished responsibility here. (E) is incorrect, as both have the mens rea for murder."},{n:51,id:"TRU044",scenario:"A settlor transfers property to three trustees to hold on trust for her grandchildren provided they attain age 25. There are three grandchildren aged 21, 19, and 16. The trust deed contains no express powers dealing with the appointment of trustees. The trustees wish to appoint an additional trustee.",q:"Which of the following most accurately describes the power to appoint an additional trustee?",opts:["The trustees may by writing appoint an additional trustee.","There is no power to appoint an additional trustee.","The settlor may by deed appoint an additional trustee.","The trustees may by writing appoint an additional trustee provided the adult beneficiaries consent.","The trustees may appoint an additional trustee but the appointment must be made by deed."],ans:"A",expl:"(A) The trustees may by writing appoint an additional trustee. In the absence of special powers in the trust instrument, statutory powers apply. Provided there are not more than three trustees, the existing trustees may by writing appoint an additional trustee. (B) is incorrect because there are at present no more than three trustees. (C) is incorrect because the settlor retains no power to appoint trustees unless express provision is made in the trust instrument. (D) is incorrect because there is no requirement for consent from the beneficiaries. (E) is incorrect because the statute does not require the appointment to be made by deed."},{n:52,id:"ACC022",scenario:"A law firm sends its client a bill on completion of a transaction comprising £5,000 in profit costs, £1,000 VAT, and £250 for a disbursement the law firm has already paid from its business account. The client sends the law firm a payment of £6,250.",q:"Which of the following entries would best describe the most expedient entries to record the receipt?",opts:["Credit Client ledger Business Side - Debit Cash Account Business Side","Credit Client ledger Client Side - Credit Cash Account Client Side","Credit Client ledger Client Side - Debit Cash Account Client Side","Debit Client ledger Client Side - Credit Cash Account Business Side","Debit Client ledger Business Side - Debit Cash Account Business Side"],ans:"A",expl:"(A) The receipt is a credit transaction and because the law firm has sent the client a bill for this amount, the money belongs to the law firm and is credited to the business side of the client ledger. The corresponding entry is therefore a debit entry on the business cash account. (B) is incorrect because for every credit entry there must be a corresponding debit entry and vice versa. (C) is incorrect because the money is not a mixed receipt (it is business money) and so it should not be paid into the client account. When money is received from the client by the law firm it is a credit in the client account and therefore (D) and (E) are incorrect."},{n:53,id:"TAX124",scenario:`A VAT-registered sole trader has suffered input tax as follows on purchases in the past month:
• Printer for £350
• Machine for business use for £989
• Office stationery for £256
• UK client entertaining for £180
The sole trader's wife uses the printer regularly for personal reasons (20%).`,q:"How much input tax may the sole trader recover on these items?",opts:["£1,525","£989","£1,705","£1,425","£1,595"],ans:"A",expl:"(A) £1,525. To recover input VAT on purchases, the item must be for business purposes and be supported by a valid VAT invoice. Input VAT suffered on UK client entertaining is never recoverable. Therefore, the sole trader can recover on the machine for business use, the office stationery, and 80% of the purchase price of the printer.",note:"The last line of the facts is garbled on the question screen ('for personal taste') and is taken from the answer screen. A pop-up advertisement covers part of the question screen; the options are confirmed by the answer screen."},{n:54,id:"TAX044",scenario:`A man made the following lifetime gifts and agreed to pay any inheritance tax that arose.
(1) A gift of shares in an unlisted trading company, valued at £300,000 into a discretionary trust on 17 January 2019. This represented only a 2% holding, and the man had owned the shares since May 2003.
(2) A gift of shares in a quoted trading company, valued at £350,000 into a discretionary trust on 20 May 2019. This represented only a 10% holding and the man had owned the shares for many years.
The man had made no other lifetime gifts.`,q:"How much of these gifts is chargeable to lifetime tax?",opts:["£0","£325,000","£300,000","£344,000","£350,000"],ans:"D",expl:"(D) £344,000. The gift of the shares in January 2019 is eligible for 100% Business Property Relief, which is available for shares in an unlisted trading company that have been owned for a minimum of two years. Therefore, this gift is fully relieved, and none of it is chargeable. However, the gift of the quoted shares is not eligible to the 50% Business Property Relief as there is insufficient holding (a minimum holding of more than 50% is required in addition to it being a trading company with two years ownership). Therefore, this gift becomes chargeable in life. However, the amount of the gift may still be reduced by the man's annual exclusion for the current tax year (£3,000) and the year before (£3,000) (£350,000 - (£3,000 + £3,000) = £344,000). Remember, when calculating the tax, the first £325,000 of this gift would fall into the nil rate band, leaving only £19,000 to be taxed at 25% (because the donor is paying the tax).",note:"'#350,000' in the OCR has been read as '£350,000'."},{n:55,id:"ETH152",scenario:"A solicitor attends two brothers at a police station, both of whom are charged with being involved in an armed burglary incident. Both brothers wish the solicitor to act for them, and they both have the same explanation as to why they are not guilty. The older brother has a long list of convictions for violent offences, whilst the younger brother has no criminal record. The solicitor believes that the brothers will likely be found guilty and that she would need to argue in mitigation that the younger brother acted under the influence of the older brother.",q:"Which of the following statements best describes whether the solicitor should act for both brothers?",opts:["There is a significant risk of a conflict and the solicitor must not accept instructions to act for both brothers.","There is a conflict of interest, but the solicitor can act for both brothers because the substantially common interest exception applies.","There is a conflict of interest, but the solicitor can act for both brothers with their consent.","The solicitor can act for both brothers because there is no conflict of interest at this point.","The solicitor can act for both brothers as long as they agree that they will not change their explanation about the events which have led to their charges."],ans:"A",expl:"(A) is correct as the solicitor is prohibited from acting if there is a conflict or significant risk of a conflict between clients. Here, even though the brothers have the same explanation as to why they are not guilty, there is a significant risk of a conflict because arguing for the younger brother in mitigation would be prejudicial to the older brother. (B) is incorrect because the substantially common interest exception is not relevant in these circumstances, as this is intended to be used where there is a clear common purpose and where any conflict which is identified is peripheral and can be removed from the instructions. Additionally, when using this exception, the solicitor must be satisfied that it is reasonable to act for both clients under the circumstances, and that does not appear to be the case here. (C) is incorrect because client consent does not override the solicitor's duties when a conflict of interest has been identified except in circumstances when one of the two exceptions can be used, and this is not the case in this scenario. (D) is incorrect because it assumes that a solicitor is prohibited from acting only when there is an actual conflict between clients. As previously discussed, a solicitor is also prohibited from acting if there is a significant risk of a conflict. (E) is incorrect as a solicitor would not be acting in the best interests of each client if their freedoms were curtailed in this way."},{n:56,id:"TAX087",scenario:"A London-based solicitor's only source of income for a tax year is her salary of £103,900. The basic personal allowance for the relevant tax year is £12,500.",q:"How much can the solicitor claim as a personal allowance?",opts:["£12,500","£0","£8,600","£10,550","£9,875"],ans:"D",expl:"(D) £10,550. The facts state the allowance is £12,500. However, for every £2 of gross income above £100,000, the allowance is reduced by £1. The solicitor is earning £3,900 above £100,000, so her allowance will be reduced by £1,950 (half of £3,900), which results in £10,550 (£12,500 - £1,950).",note:"Option (E) is cut off on the question screen ('£9,87') and is completed from the answer screen."},{n:57,id:"CRP080",scenario:"A defendant is standing trial for theft in the Crown Court presided over by a judge. At the start of the trial, the prosecution wish to make an application to adduce evidence of a confession. The prosecution allege that, on the day before the trial, the defendant admitted to his flatmate that he had committed the offence. The prosecution wish to adduce this evidence as proof of his guilt.",q:"How will the court determine whether evidence of the confession can be admitted?",opts:["The judge will hold a voir dire in absence of the jury to determine the admissibility of the evidence.","The judge will determine the admissibility in presence of the jury.","The judge will hear the application to adduce the evidence and then recuse himself if the evidence is inadmissible.","The judge will hear the application to adduce the evidence and continue to decide the defendant's guilt, even if the evidence is held to be inadmissible.","The judge will enlist the assistance of another judge to hear the application."],ans:"A",expl:"(A) The judge will hold a voir dire in absence of the jury to determine the admissibility of the evidence. In the Crown Court, judges decide matters of law in absence of the jury in a hearing called a voir dire. (B) is incorrect as matters of law are decided in absence of the jury. (C) is incorrect as the judge will not need to recuse himself if the evidence is inadmissible. (D) is incorrect as the judge does not decide the defendant's guilt; all matters of fact are decided by the jury in the Crown Court. (E) is incorrect as no other judge will be called in to assist."},{n:58,id:"TAX079",scenario:"A florist operates her business as a sole trader. Up until recently, the florist had been using a shop which she inherited from her parents. She recently sold the shop at a net gain of £50,000. She used all the proceeds from the sale and a loan to buy a bigger shop in the same town. The capital gains tax allowance is £12,300. The florist is a higher-rate taxpayer.",q:"What is the florist's capital gains tax liability based on the above facts?",opts:["£0","£6,894","£7,660","£10,724","£14,000"],ans:"A",expl:"(A) £0. Replacement business asset relief (also known as roll-over relief) applies here. When a person disposes of qualifying business assets (such as land, buildings, and plant and machinery) and reinvests the proceeds in other qualifying business assets within one year before or three years after the sale, relief from the gain is available to the extent the proceeds were reinvested. Here, the disposed property was being used for business, and all the proceeds are being used to buy another business property. Therefore, there is no CGT due."},{n:59,id:"CRP076",scenario:'A defendant was arrested on suspicion of burglary. He was taken to the police station where he was interviewed. The defendant was unrepresented in interview. During the course of the interview, police officers shouted and threatened the defendant with the use of violence if he did not admit the offence. The defendant has a long history of offending and was unaffected by the threats and shouts. Nevertheless, he said to officers, "Just charge me now. I did it, alright? Charge me and bail me so I can get out." At trial, the defence now seek to have the confession [excluded].',q:"Is the confession likely to be excluded?",opts:["Yes, because it was obtained by inducement.","Yes, because it was obtained by oppression.","Yes, because it is unreliable.","No, because there is no causal link between the officers' conduct and the confession.","No, because there was neither oppression nor inducement."],ans:"D",expl:"(D) The confession is not likely be excluded. Whilst oppression and inducement are both grounds for excluding confessions, and there is evidence of oppression here, there is nevertheless no causal link from the oppression to the confession, as the defendant was unaffected by the officers' threats. (A) is wrong as there was no inducement by the officers; they did not offer the defendant any preferential treatment or outcome in exchange for confession. (B) is wrong as, whilst there was oppression, there is no causal link from the oppression to the confession. (C) is incorrect as oppression will render a confession unreliable if there is a causal link from the oppression to the confession. (E) is incorrect as there was oppression on the facts given.",note:"The last word of the facts is cut off by the scan; '[excluded]' is inferred."},{n:60,id:"TAX118",scenario:"A company prepares accounts to 31 December. On 1 January 2020, the company sold a freehold property for £550,000, realising a gain of £100,000. In the previous year, on 1 June 2019, the company bought a freehold property for £510,000. Both properties were used for trading purposes.",q:"Assuming any beneficial claims are made, what is the company's taxable gain (after any reliefs) for the year ended 31 December 2020?",opts:["£40,000","£100,000","£0","£60,000","£27,700"],ans:"A",expl:"(A) £40,000. Replacement business asset relief is available to companies. When a person or company disposes of qualifying business assets (such as land, buildings, and plant and machinery) and reinvests the proceeds in other qualifying business assets within one year before or three years after the sale,
